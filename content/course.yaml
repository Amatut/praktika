# Карта курса «Практика»: маршрут, модули Python-базы, навыки, лаборатории и проекты.
# Формат проверяется схемой src/content/schema.ts (courseSourceSchema).
# Проверка: node scripts/build-content.ts

title: "Практика"
subtitle: "Личный тренер по программированию"

# ------------------------------------------------------------------ маршрут

stages:
  - id: basics
    title: "Основы"
    description: >-
      Python-база: от первой программы до функций, файлов и тестов. Базу не
      нужно проходить целиком до первой пробы: веб-интерфейсы открываются
      после модуля 2, большинство остальных направлений — после модуля 5
      «Функции», оставшиеся — после модулей 7–8. Дальше ты чередуешь базу с
      пробами.
  - id: labs
    title: "Пробы направлений"
    description: >-
      Короткие лаборатории: веб, данные, игры, боты и другие области. Смотришь,
      что нравится и что утомляет. «Понравилось» — ещё не «освоено» и не выбор
      навсегда.
  - id: choice
    title: "Твой выбор"
    description: >-
      Сравниваешь впечатления и результаты проб и выбираешь 1–2 направления
      для углубления. Если интересы изменятся, маршрут можно пересобрать.
  - id: projects
    title: "Свой проект"
    description: >-
      Самостоятельные проекты и итоговая работа: план, код, тесты, README и
      изменение требований. Это доказательство того, что ты умеешь, а не
      того, что ты прочитал.

# ------------------------------------------------------------------ навыки

skills:
  # m0 — Что такое программа
  - id: program-run
    title: "Запуск программы"
    module: m0
    description: "Запускаешь программу и читаешь, что она вывела."
  - id: print-output
    title: "Вывод через print"
    module: m0
    description: "Выводишь текст и числа функцией print, в том числе несколько значений подряд и пустую строку."
  - id: execution-order
    title: "Порядок выполнения"
    module: m0
    description: "Понимаешь, что строки выполняются сверху вниз, и предсказываешь вывод, проходя программу по шагам."
  - id: comments
    title: "Комментарии"
    module: m0
    description: "Пишешь комментарии через # и понимаешь, что Python их не выполняет."
  - id: read-errors
    title: "Чтение сообщений об ошибках"
    module: m0
    description: "Находишь в сообщении об ошибке её тип, номер строки и причину."
  - id: fix-syntax
    title: "Исправление синтаксиса"
    module: m0
    description: "Исправляешь SyntaxError и NameError: непарные кавычки и скобки, опечатки в именах."
  - id: local-setup
    title: "Мастерская на компьютере"
    module: m0
    description: "Создаёшь файл .py в редакторе на своём компьютере и запускаешь его из терминала."

  # m1 — Значения, переменные, ввод и вывод
  - id: numbers-arithmetic
    title: "Числа и вычисления"
    module: m1
    description: "Считаешь с помощью + - * / // % **, учитываешь порядок действий и различаешь int и float."
  - id: variables
    title: "Переменные"
    module: m1
    description: "Даёшь значениям понятные имена, переприсваиваешь их и отслеживаешь, какое значение лежит в переменной сейчас."
  - id: strings-basics
    title: "Строки"
    module: m1
    description: "Склеиваешь и повторяешь строки, узнаёшь длину через len."
  - id: f-strings
    title: "f-строки"
    module: m1
    description: "Собираешь сообщения из текста и значений с помощью f-строк."
  - id: input-read
    title: "Ввод через input"
    module: m1
    description: "Получаешь данные от пользователя через input и помнишь, что результат всегда строка."
  - id: type-conversion
    title: "Преобразование типов"
    module: m1
    description: "Преобразуешь значения через int, float и str, понимаешь, откуда берётся ValueError, и узнаёшь TypeError при склейке строки с числом."
  - id: task-decomposition
    title: "Разбиение задачи на шаги"
    module: m1
    description: "Перед кодом раскладываешь задачу на шаги: что получить, что посчитать, что вывести."

  # m2 — Условия и логика
  - id: comparisons
    title: "Сравнения"
    module: m2
    description: "Записываешь сравнения и предсказываешь, получится True или False."
  - id: conditions
    title: "Ветвления if / elif / else"
    module: m2
    description: "Строишь ветвления и выбираешь правильный порядок проверок."
  - id: boolean-logic
    title: "Логические операции"
    module: m2
    description: "Соединяешь условия через and, or, not и упрощаешь громоздкие проверки."
  - id: boundary-checks
    title: "Граничные значения"
    module: m2
    description: "Находишь пороговые значения задачи и вручную проверяешь на них программу."

  # m3 — Циклы
  - id: while-loops
    title: "Цикл while"
    module: m3
    description: "Повторяешь действия, пока выполняется условие, и гарантируешь выход из цикла."
  - id: for-range
    title: "Цикл for и range"
    module: m3
    description: "Перебираешь значения через for и задаёшь границы и шаг range без ошибки на единицу."
  - id: accumulators
    title: "Счётчики и накопители"
    module: m3
    description: "Считаешь количество, сумму, минимум и максимум за один проход цикла."
  - id: loop-control
    title: "Управление циклом"
    module: m3
    description: "Используешь break и continue там, где они делают цикл понятнее, и трассируешь цикл по таблице значений."
  - id: import-basics
    title: "Первый import"
    module: m3
    description: "Подключаешь стандартный модуль через import и вызываешь его функции, например random.randint."

  # m4 — Строки и коллекции
  - id: string-methods
    title: "Работа со строками"
    module: m4
    description: "Используешь индексы, срезы и методы split, strip, lower, replace, join."
  - id: lists
    title: "Списки"
    module: m4
    description: "Создаёшь, изменяешь и перебираешь списки, проверяешь наличие элемента через in."
  - id: dicts
    title: "Словари"
    module: m4
    description: "Хранишь значения по ключу, добавляешь и изменяешь записи, безопасно читаешь через get."
  - id: sets-tuples
    title: "Множества и кортежи"
    module: m4
    description: "Используешь множества для уникальных значений и кортежи для неизменяемых наборов."
  - id: choose-structure
    title: "Выбор структуры данных"
    module: m4
    description: "Выбираешь подходящую структуру под задачу и объясняешь выбор."

  # m5 — Функции
  - id: functions
    title: "Функции"
    module: m5
    description: "Объявляешь функции с параметрами, вызываешь их и возвращаешь результат через return."
  - id: scope
    title: "Область видимости"
    module: m5
    description: "Различаешь локальные и глобальные имена и не полагаешься на скрытые изменения снаружи функции."
  - id: function-design
    title: "Разбиение программы на функции"
    module: m5
    description: "Делишь программу на небольшие функции с понятными именами и проверяешь каждую отдельно."
  - id: git-first-steps
    title: "Первые шаги в Git"
    module: m5
    description: "Создаёшь репозиторий, делаешь коммиты с понятными сообщениями и смотришь историю."
  - id: readme-docs
    title: "README"
    module: m5
    description: "Пишешь README: что делает программа и как её запустить; в следующих проектах дополняешь его установкой, примерами и ограничениями."

  # m6 — Отладка и понятный код
  - id: traceback-reading
    title: "Чтение traceback"
    module: m6
    description: "Разбираешь traceback: тип ошибки, строка, цепочка вызовов."
  - id: debugging
    title: "Отладка"
    module: m6
    description: "Воспроизводишь ошибку, проверяешь гипотезы промежуточными значениями и подтверждаешь исправление."
  - id: debugger-tool
    title: "Отладчик в редакторе"
    module: m6
    description: "Ставишь точку остановки, идёшь по шагам и смотришь значения переменных."
  - id: clean-code
    title: "Понятный код"
    module: m6
    description: "Улучшаешь имена и структуру кода, не меняя его поведения."

  # m7 — Файлы, данные и исключения
  - id: files-paths
    title: "Файлы и пути"
    module: m7
    description: "Читаешь и записываешь файлы через with open и pathlib, работаешь в учебной папке на копиях."
  - id: exceptions
    title: "Исключения"
    module: m7
    description: "Обрабатываешь конкретные исключения через try / except и не прячешь настоящие ошибки."
  - id: input-validation
    title: "Проверка ввода"
    module: m7
    description: "Повторяешь запрос, пока пользователь не введёт корректное значение, и объясняешь, что не так."
  - id: files-json
    title: "CSV и JSON"
    module: m7
    description: "Сохраняешь и загружаешь данные в форматах CSV и JSON и выбираешь подходящий."

  # m8 — Модули, окружения и Git
  - id: modules-imports
    title: "Модули и импорт"
    module: m8
    description: "Разносишь код проекта по модулям и пакетам, импортируешь нужное и находишь готовые решения в стандартной библиотеке."
  - id: dates-datetime
    title: "Даты и время"
    module: m8
    description: "Получаешь дату из строки и выводишь её в нужном формате, считаешь разницу в днях и сдвигаешь дату на нужное число дней через datetime."
  - id: venv-deps
    title: "Окружения и зависимости"
    module: m8
    description: "Создаёшь виртуальное окружение, ставишь пакеты через pip и фиксируешь их в requirements.txt."
  - id: git-workflow
    title: "Git в работе"
    module: m8
    description: "Привычно пользуешься status, diff, commit и log, настраиваешь .gitignore и пробуешь идеи в отдельной ветке."

  # m9 — Автоматические тесты
  - id: assert-checks
    title: "Проверки через assert"
    module: m9
    description: "Превращаешь ручные проверки в автоматические assert."
  - id: edge-cases
    title: "Граничные случаи"
    module: m9
    description: "Подбираешь нормальные и граничные случаи: пустые данные, ноль, одно значение, неверный ввод."
  - id: pytest-basics
    title: "pytest"
    module: m9
    description: "Пишешь и запускаешь тесты pytest, читаешь отчёт о падении, проверяешь исключения."
  - id: regression-tests
    title: "Регрессионные тесты"
    module: m9
    description: "Пишешь тест на найденную ошибку до её исправления, чтобы она не вернулась."

  # m10 — Основы алгоритмов
  - id: complexity
    title: "Оценка сложности"
    module: m10
    description: "Оцениваешь, как растёт число шагов при росте данных, и сравниваешь решения."
  - id: search-algorithms
    title: "Поиск"
    module: m10
    description: "Пишешь линейный и бинарный поиск и выбираешь подходящий."
  - id: sorting
    title: "Сортировка"
    module: m10
    description: "Объясняешь простую сортировку по шагам и сортируешь записи через sorted с key."

  # m11 — Сеть, API и базы данных
  - id: http-api
    title: "HTTP и JSON API"
    module: m11
    description: "Объясняешь запрос и ответ, отправляешь запрос к API и достаёшь нужные поля из JSON."
  - id: network-errors
    title: "Ошибки сети"
    module: m11
    description: "Задаёшь тайм-аут, проверяешь код ответа и понятно сообщаешь о сбоях сети."
  - id: sql-basics
    title: "Основы SQL"
    module: m11
    description: "Создаёшь таблицу, добавляешь строки через INSERT, выбираешь, изменяешь и удаляешь их через SELECT, UPDATE и DELETE с условием WHERE."
  - id: sqlite-python
    title: "SQLite из Python"
    module: m11
    description: "Работаешь с базой SQLite из Python только через параметризованные запросы."

  # m12 — Объекты и классы
  - id: classes-objects
    title: "Классы и объекты"
    module: m12
    description: "Создаёшь класс с __init__ и методами и объясняешь разницу между классом и объектом."
  - id: dataclasses
    title: "dataclass"
    module: m12
    description: "Описываешь простые записи через dataclass."
  - id: oop-judgement
    title: "Когда нужен класс"
    module: m12
    description: "Сравниваешь решение на функциях и словарях с решением на классах и обосновываешь выбор."

  # m13 — Итоговый проект
  - id: project-planning
    title: "Планирование проекта"
    module: m13
    description: "Составляешь требования и план проекта и делишь работу на короткие сессии."
  - id: requirements-change
    title: "Изменение требований"
    module: m13
    description: "Самостоятельно адаптируешь код и схему базы к новому требованию, не ломая старые данные и тесты."
  - id: self-review
    title: "Разбор своей работы"
    module: m13
    description: "Сверяешь проект с критериями готовности, называешь конкретные доказательства освоения и оставшиеся пробелы."

# ------------------------------------------------------------------ модули Python-базы

modules:
  - id: m0
    number: 0
    part: basics
    title: "Что такое программа"
    why: >-
      Прежде чем писать код, полезно понять, как компьютер выполняет
      инструкции и о чём говорит сообщение об ошибке. К этим идеям ты будешь
      возвращаться в каждом следующем модуле.
    outcomes:
      - "Объясняешь своими словами, что такое программа, код и выполнение."
      - "Пишешь программу из нескольких print и заранее предсказываешь её вывод построчно."
      - "Пишешь комментарии и знаешь, что Python их не выполняет."
      - "Находишь в сообщении об ошибке тип и номер строки, сам исправляешь SyntaxError и NameError."
      - "Создаёшь файл .py в редакторе на компьютере и запускаешь его из терминала."
    prerequisites:
      - "Ничего: модуль рассчитан на старт с нуля."
      - "Для последнего урока — компьютер, на который можно установить программы."
    hours: [1.5, 3]
    lessons:
      - id: m0-l1
        title: "Программа — это точная инструкция"
      - id: m0-l2
        title: "Порядок выполнения и комментарии"
      - id: m0-l3
        title: "Ошибка — это подсказка"
      - id: m0-l4
        title: "Мастерская на компьютере: редактор, файл, терминал"
    practice: >-
      Бытовые задачи на порядок действий, короткие программы с print в
      тренажёре, предсказание вывода и исправление ошибок в готовых
      фрагментах. С первого урока — ручная проверка: заранее записать, что
      должна вывести программа, и сравнить с настоящим выводом. В конце урока
      «Ошибка — это подсказка» — небольшая самостоятельная работа: починить
      новую короткую программу, подсказки открываются только после первой
      попытки. Последний урок — установка Python и редактора и первый запуск
      файла из терминала по пошаговой инструкции.
    mistakes:
      - "Пропущенная или непарная кавычка внутри print."
      - "Опечатка в имени функции: prnt, Print или print с русской буквой «р»."
      - "Ожидание, что компьютер «поймёт» смысл, хотя он выполняет буквально то, что написано."
      - "Сообщение об ошибке пропускают, вместо того чтобы прочитать последнюю строку и номер строки."
      - "Файл сохранён не в той папке или без расширения .py, и терминал его не находит."
    completion: >-
      Модуль пройден, когда ты без подсказок пишешь и запускаешь программу из
      нескольких print, предсказываешь её вывод, сам исправляешь новые
      SyntaxError и NameError и можешь объяснить, что было не так. Запуск
      файла из терминала на своём компьютере получилось повторить хотя бы
      один раз самостоятельно.
    environment: mixed

  - id: m1
    number: 1
    part: basics
    title: "Значения, переменные, ввод и вывод"
    why: >-
      Любая полезная программа получает данные, хранит их и что-то с ними
      считает: цену заказа, время в пути, баллы в игре. Здесь ты учишься
      называть значения, вычислять и общаться с пользователем через ввод и
      вывод.
    outcomes:
      - "Вычисляешь выражения с + - * / // % ** и объясняешь порядок действий."
      - "Создаёшь переменные с понятными именами и отслеживаешь, как меняется их значение."
      - "Склеиваешь строки и собираешь сообщения с помощью f-строк."
      - "Читаешь ввод через input и преобразуешь строку в число int или float."
      - "Объясняешь, откуда берётся ValueError при преобразовании типов и TypeError при склейке строки с числом."
      - "Раскладываешь задачу «получить — посчитать — вывести» на шаги до того, как пишешь код."
    prerequisites:
      - "Модуль 0: запуск программы, print и чтение сообщений об ошибках."
    hours: [3, 5]
    lessons:
      - id: m1-l1
        title: "Числа и вычисления"
      - id: m1-l2
        title: "Переменные: имена для значений"
      - id: m1-l3
        title: "Строки: текст в программе"
      - id: m1-l4
        title: "Ввод: программа слушает"
      - id: m1-l5
        title: "Превращение типов"
      - id: m1-l6
        title: "Самостоятельная работа: калькулятор заказа"
    practice: >-
      Мини-расчёты из жизни: стоимость покупки, перевод единиц, деление счёта
      на компанию. Предсказание значений переменных, исправление ошибок с
      типами, ручные проверки на заранее записанных входных данных. В конце —
      самостоятельная работа «Калькулятор заказа», подсказки к которой
      открываются только после первой попытки.
    mistakes:
      - "Два результата input складывают без преобразования в числа и получают склейку: 2 и 3 дают 23."
      - "Путают / и //, забывают, что / всегда даёт float."
      - "Используют переменную до того, как присвоили ей значение."
      - "Забывают букву f перед строкой, и фигурные скобки выводятся как обычный текст."
      - "Читают = как «равно» из математики, а не как «положить значение в переменную»."
    completion: >-
      Модуль пройден, когда ты сам пишешь программу, которая читает несколько
      значений, переводит их в числа, считает результат и выводит понятное
      сообщение, и можешь объяснить каждую строку. Самостоятельная работа
      решена без существенной помощи, а ValueError и TypeError ты узнаёшь и
      исправляешь сам.
    environment: browser

  - id: m2
    number: 2
    part: basics
    title: "Условия и логика"
    why: >-
      Программа должна по-разному вести себя в разных ситуациях: дать скидку,
      отказать в доступе, предупредить о неверном вводе. Условия учат её
      принимать такие решения.
    outcomes:
      - "Записываешь сравнения ==, !=, <, >, <=, >= и предсказываешь результат True или False."
      - "Строишь ветвления if / elif / else и объясняешь выбранный порядок проверок."
      - "Соединяешь условия через and, or, not и упрощаешь громоздкие проверки."
      - "Находишь граничные значения задачи и вручную проверяешь программу на них."
    prerequisites:
      - "Модуль 1: переменные, числа, строки, input и преобразование типов."
    hours: [3, 5]
    lessons:
      - id: m2-l1
        title: "Сравнения: True и False"
      - id: m2-l2
        title: "if и else: программа выбирает"
      - id: m2-l3
        title: "elif: несколько вариантов"
      - id: m2-l4
        title: "and, or, not: сложные условия"
      - id: m2-l5
        title: "Границы: проверяем пороговые значения"
      - id: m2-l6
        title: "Самостоятельная работа: тарифы и скидки"
    practice: >-
      Задачи на выбор: тарифы и скидки, проверка возраста и времени работы,
      оценка по баллам. К каждой задаче — небольшая таблица ручных проверок с
      обычными и граничными значениями. Поиск ошибки в чужом ветвлении, где
      условия стоят в неверном порядке. Самостоятельная работа без подсказок
      на первом шаге.
    mistakes:
      - "Путают = и == внутри условия."
      - "Более общее условие стоит раньше частного и перехватывает его в цепочке elif."
      - "Граница включена не туда: < вместо <= на пороговом значении."
      - "Сравнивают строку из input с числом без преобразования типа."
      - "Забывают двоеточие или отступ после if."
    completion: >-
      Модуль пройден, когда ты решаешь новые задачи с несколькими ветками без
      существенной помощи, сам составляешь граничные случаи и можешь
      объяснить, почему условия стоят именно в таком порядке.
    environment: browser

  - id: m3
    number: 3
    part: basics
    title: "Циклы"
    why: >-
      Компьютер особенно полезен там, где действие нужно повторить много раз:
      обработать все записи, спрашивать, пока ответ не станет верным,
      посчитать сумму за месяц. Циклы — главный инструмент такого повторения.
    outcomes:
      - "Пишешь цикл while с понятным условием выхода и не допускаешь бесконечного цикла."
      - "Используешь for и range с нужными границами и шагом."
      - "Применяешь счётчики и накопители: сумма, количество, минимум, максимум."
      - "Используешь break и continue и объясняешь, когда они уместны."
      - "Подключаешь стандартный модуль через import и получаешь случайные числа через random.randint."
      - "Трассируешь цикл по таблице значений и находишь ошибку на единицу."
    prerequisites:
      - "Модуль 2: сравнения и условия."
      - "Модуль 1: переменные и input."
    hours: [4, 7]
    lessons:
      - id: m3-l1
        title: "while: повторять, пока условие верно"
      - id: m3-l2
        title: "for и range: известное число шагов"
      - id: m3-l3
        title: "Счётчики и накопители"
      - id: m3-l4
        title: "break и continue: меню и повтор до верного ответа"
      - id: m3-l5
        title: "Случайные числа: первый import"
      - id: m3-l6
        title: "Трассировка цикла и ошибка на единицу"
      - id: m3-l7
        title: "Самостоятельная работа: тренажёр таблицы умножения"
    practice: >-
      Повторяющиеся расчёты: копилка по неделям, таблица умножения, подсчёт
      оценок, меню, которое работает до команды выхода, игра «Угадай число»
      со случайным числом из модуля random. Трассировочные таблицы, поиск
      ошибки на единицу, изменение готового цикла под новое условие.
      Самостоятельная работа без подсказок на первом шаге.
    mistakes:
      - "Бесконечный цикл: переменная из условия while не меняется внутри цикла."
      - "Ошибка на единицу: range(1, 10) не включает 10."
      - "Накопитель обнуляется внутри цикла, а не перед ним."
      - "print стоит внутри цикла, хотя нужен один итоговый вывод после него."
      - "Неверный отступ переносит строку внутрь цикла или выносит из него."
    completion: >-
      Модуль пройден, когда ты сам пишешь циклы для новых задач, заранее
      говоришь, сколько раз выполнится тело цикла, и находишь ошибку на
      единицу по трассировке без подсказки.
    environment: browser

  - id: m4
    number: 4
    part: basics
    title: "Строки и коллекции"
    why: >-
      Реальные данные редко приходят поодиночке: список покупок, телефонная
      книга, набор уникальных тегов. Коллекции позволяют хранить много
      значений и выбирать структуру, в которой нужное действие делается проще
      всего.
    outcomes:
      - "Берёшь символы и части строки через индексы и срезы, пользуешься методами split, strip, lower, replace, join."
      - "Создаёшь и изменяешь списки, перебираешь их в цикле."
      - "Хранишь данные в словаре по ключу, добавляешь и изменяешь записи, безопасно читаешь через get."
      - "Используешь множества для уникальных значений и кортежи для неизменяемых пар."
      - "Выбираешь структуру данных под задачу и объясняешь выбор."
    prerequisites:
      - "Модуль 3: циклы for и while, накопители."
      - "Модуль 2: условия."
    hours: [5, 8]
    lessons:
      - id: m4-l1
        title: "Индексы и срезы строк"
      - id: m4-l2
        title: "Списки: создать, изменить, перебрать"
      - id: m4-l3
        title: "Методы строк: от текста к списку и обратно"
      - id: m4-l4
        title: "Словари: значение по ключу"
      - id: m4-l5
        title: "Множества и кортежи"
      - id: m4-l6
        title: "Какую структуру выбрать"
      - id: m4-l7
        title: "Самостоятельная работа: частотный словарь"
    practice: >-
      Список покупок, частотный словарь слов, телефонная книга, поиск общих
      интересов через множества. Одну задачу решаешь и списком, и словарём и
      сравниваешь, где проще. Самостоятельная работа без подсказок на первом
      шаге. После модуля — первый небольшой проект.
    mistakes:
      - "IndexError: индекс за пределами списка, особенно при счёте с единицы."
      - "Изменение списка во время перебора этого же списка."
      - "KeyError при чтении отсутствующего ключа вместо get или проверки через in."
      - "Ожидание, что метод строки изменит саму строку, хотя строки неизменяемы."
      - "Копия списка через простое присваивание: обе переменные указывают на один и тот же список."
    completion: >-
      Модуль пройден, когда ты решаешь новые задачи со списками и словарями
      без существенной помощи, обосновываешь выбор структуры и предсказываешь
      результат срезов и методов.
    environment: browser

  - id: m5
    number: 5
    part: basics
    title: "Функции"
    why: >-
      Когда программа растёт, её трудно читать и менять целиком. Функции
      делят задачу на именованные части, которые можно проверить по
      отдельности и использовать повторно.
    outcomes:
      - "Объявляешь функции с параметрами и вызываешь их с разными аргументами."
      - "Различаешь print и return и возвращаешь результат для дальнейших вычислений."
      - "Объясняешь, чем локальная переменная отличается от глобальной."
      - "Разбиваешь задачу на небольшие функции с понятными именами и проверяешь каждую отдельно."
      - "Создаёшь репозиторий Git для своего проекта, делаешь коммиты и смотришь историю."
      - "Пишешь короткий README: что делает программа и как её запустить."
      - "Переделываешь свой первый проект на функции, не меняя его поведения."
    prerequisites:
      - "Модуль 4: строки, списки и словари."
      - "Первый небольшой проект (калькулятор или викторина): его ты сохранишь в Git и переделаешь."
      - "Редактор и терминал на компьютере (модуль 0) — для урока про Git."
    hours: [5, 8]
    lessons:
      - id: m5-l1
        title: "Функция: имя для набора действий"
      - id: m5-l2
        title: "Параметры и аргументы"
      - id: m5-l3
        title: "return: функция отдаёт результат"
      - id: m5-l4
        title: "Область видимости: где живут переменные"
      - id: m5-l5
        title: "Разбиваем задачу на функции"
      - id: m5-l6
        title: "Первое знакомство с Git и README: сохраняем проект"
      - id: m5-l7
        title: "Самостоятельная работа: первый проект на функциях"
    practice: >-
      Функции-помощники: перевод единиц, проверка пароля по правилам,
      статистика по списку. Задачи-функции с автоматической проверкой
      вызовов. Установка Git, первые коммиты на компьютере и короткий README
      к первому проекту. Самостоятельная работа модуля — переделка первого
      проекта на функции без подсказок на первом шаге: на одних и тех же
      ручных проверках поведение до и после должно совпадать.
    mistakes:
      - "Функция печатает результат вместо return, и его нельзя использовать дальше."
      - "Функцию объявили, но не вызвали, или написали имя без скобок."
      - "Ожидание, что изменение переменной внутри функции изменит одноимённую переменную снаружи."
      - "Одна огромная функция, которая делает всё сразу."
      - "Список как значение параметра по умолчанию, который незаметно копит данные между вызовами."
    completion: >-
      Модуль пройден, когда ты сам раскладываешь новую задачу на функции,
      пишешь их с return, проверяешь каждую на нескольких входах и
      объясняешь, зачем нужна каждая функция. Первый проект сохранён в Git
      как минимум двумя осмысленными коммитами, и у него есть короткий
      README.
    environment: mixed

  - id: m6
    number: 6
    part: basics
    title: "Отладка и понятный код"
    why: >-
      Ошибки бывают у всех; опытного разработчика отличает то, как спокойно и
      последовательно он их находит. Понятный код делает ошибки заметнее и
      экономит время тебе самому через неделю.
    outcomes:
      - "Читаешь traceback: тип ошибки, строка, цепочка вызовов."
      - "Воспроизводишь ошибку на минимальном примере и называешь входные данные, при которых она возникает."
      - "Проверяешь гипотезы с помощью промежуточного вывода и трассировки."
      - "Пользуешься отладчиком редактора: точка остановки, шаг, просмотр переменных."
      - "Улучшаешь имена и структуру кода, не меняя его поведения."
    prerequisites:
      - "Модуль 5: функции."
      - "Редактор на компьютере (модуль 0) — для урока с отладчиком."
    hours: [4, 6]
    lessons:
      - id: m6-l1
        title: "Traceback снизу вверх"
      - id: m6-l2
        title: "Воспроизвести ошибку: минимальный пример"
      - id: m6-l3
        title: "Промежуточные значения и трассировка"
      - id: m6-l4
        title: "Отладчик: точки остановки и шаги"
      - id: m6-l5
        title: "Понятный код: имена, короткие функции, единый стиль"
      - id: m6-l6
        title: "Самостоятельная работа: почини чужую программу"
    practice: >-
      Программы со спрятанными ошибками разного вида: синтаксис, ошибка
      выполнения, неверная логика. Для каждой: воспроизвести, найти причину,
      исправить одну вещь и проверить. Приведение запутанного кода в порядок
      с сохранением поведения. Самостоятельная работа без подсказок на первом
      шаге.
    mistakes:
      - "Исправляют наугад несколько мест сразу вместо проверки одной гипотезы."
      - "Читают traceback сверху и не доходят до последней строки с причиной."
      - "Оставляют отладочные print в готовом коде."
      - "Не проверяют исправление на тех же входных данных, на которых ошибка воспроизводилась."
      - "Переименовывают переменную не во всех местах."
    completion: >-
      Модуль пройден, когда ты находишь и исправляешь ошибку в незнакомой
      короткой программе без существенной помощи и рассказываешь шаги: как
      воспроизвёл, какую гипотезу проверил и чем подтвердил исправление.
    environment: mixed

  - id: m7
    number: 7
    part: basics
    title: "Файлы, данные и исключения"
    why: >-
      Многим программам нужно помнить данные между запусками: список дел,
      настройки, журнал. Для этого есть файлы, а исключения помогают не
      падать от неверного ввода, отсутствующего файла или повреждённых
      данных.
    outcomes:
      - "Читаешь и записываешь текстовые файлы через with open с указанной кодировкой."
      - "Строишь пути через pathlib и работаешь только в своей учебной папке на копиях."
      - "Обрабатываешь ошибки через try / except с конкретным типом исключения."
      - "Повторяешь запрос, пока пользователь не введёт корректное значение."
      - "Читаешь и записываешь CSV и JSON и объясняешь, какой формат когда удобнее."
    prerequisites:
      - "Модуль 5: функции."
      - "Модуль 4: списки и словари."
      - "Модуль 6: чтение traceback."
    hours: [5, 8]
    lessons:
      - id: m7-l1
        title: "Файлы: открыть, прочитать, записать"
      - id: m7-l2
        title: "Пути и учебная папка"
      - id: m7-l3
        title: "Исключения: try и except"
      - id: m7-l4
        title: "Неверный ввод: спросить ещё раз"
      - id: m7-l5
        title: "CSV: таблица в текстовом файле"
      - id: m7-l6
        title: "JSON: сохраняем структуры данных"
      - id: m7-l7
        title: "Самостоятельная работа: журнал расходов"
    practice: >-
      Журнал расходов в файле, чтение учебной таблицы CSV, сохранение
      настроек в JSON. Разбор отсутствующего и пустого файла, битой строки и
      неверного ввода. Сначала упражнения в тренажёре с виртуальными
      файлами, затем повторение на компьютере в отдельной учебной папке с
      копиями. После модуля — проект «Список задач с JSON».
    mistakes:
      - "Файл открывают в режиме w, не заметив, что он стирает старое содержимое."
      - "Путь указан относительно не той папки, из которой запущена программа."
      - "Слишком широкий except, который прячет настоящую ошибку."
      - "Непонятные символы вместо русского текста из-за незаданной кодировки."
      - "Попытка записать в JSON значение, которое он не поддерживает, например множество."
    completion: >-
      Модуль пройден, когда ты сам пишешь программу, которая загружает данные
      из файла, изменяет и сохраняет их, не падает на отсутствующем файле и
      неверном вводе, и объясняешь, какие исключения ловишь и почему.
    environment: mixed

  - id: m8
    number: 8
    part: basics
    title: "Модули, окружения и Git"
    why: >-
      Настоящий проект состоит из нескольких файлов, использует чужие
      библиотеки и живёт долго. Модули помогают разложить код, виртуальное
      окружение не смешивает библиотеки разных проектов, а Git хранит историю
      и позволяет спокойно экспериментировать.
    outcomes:
      - "Находишь нужное в стандартной библиотеке по документации и работаешь с датами через datetime."
      - "Разносишь код проекта по нескольким модулям, объединяешь их в пакет — папку с модулями — и импортируешь нужное."
      - "Создаёшь виртуальное окружение, ставишь пакет через pip, фиксируешь зависимости в requirements.txt и дописываешь шаги установки в README."
      - "Привычно пользуешься git status, diff, add, commit, log и настраиваешь .gitignore."
      - "Пробуешь идею в отдельной ветке и возвращаешься к рабочей версии."
    prerequisites:
      - "Модуль 7: файлы и проект «Список задач с JSON»."
      - "Первые коммиты в Git (модуль 5)."
      - "Терминал на компьютере (модуль 0)."
    hours: [4, 7]
    lessons:
      - id: m8-l1
        title: "Стандартная библиотека: даты и datetime"
      - id: m8-l2
        title: "Свои модули и пакет: проект из нескольких файлов"
      - id: m8-l3
        title: "Виртуальное окружение, pip и requirements.txt"
      - id: m8-l4
        title: "Git в работе: статус, разница, коммит"
      - id: m8-l5
        title: "Ветка для эксперимента"
      - id: m8-l6
        title: "Самостоятельная работа: проект с нуля в чистой папке"
    practice: >-
      Сроки и напоминания через datetime, разбиение проекта «Список задач»
      на модули и пакет, подключение одной внешней библиотеки в виртуальном
      окружении, регулярные коммиты с понятными сообщениями, эксперимент в
      отдельной ветке. Самостоятельная работа без подсказок на первом шаге:
      развернуть свой проект в чистой папке только по README и
      requirements.txt. Всё выполняется в редакторе и терминале на
      компьютере; тренажёр хранит шаги и помогает разобрать ошибки.
    mistakes:
      - "Свой файл назван как модуль стандартной библиотеки, например random.py, и импорт ломается."
      - "Пакет установлен не в то окружение, потому что окружение не активировано."
      - "В репозиторий попадают папка окружения, кеши и личные файлы, потому что нет .gitignore."
      - "Один огромный коммит «всё сделал» вместо нескольких осмысленных."
      - "Два модуля импортируют друг друга, и программа может упасть с ImportError."
    completion: >-
      Модуль пройден, когда ты сам разворачиваешь проект в чистой папке:
      создаёшь окружение, ставишь зависимости по requirements.txt и
      запускаешь программу, а твою историю Git другой человек понимает по
      сообщениям коммитов.
    environment: local

  - id: m9
    number: 9
    part: basics
    title: "Автоматические тесты"
    why: >-
      Ручная проверка полезна, но её легко забыть или сделать не полностью.
      Автоматические тесты за секунды проверяют программу после каждого
      изменения и не дают старым ошибкам вернуться.
    outcomes:
      - "Превращаешь ручные проверки в assert."
      - "Подбираешь нормальные и граничные случаи: пустые данные, ноль, одно значение, неверный ввод."
      - "Пишешь и запускаешь тесты pytest и читаешь отчёт о падении."
      - "Проверяешь, что функция выбрасывает нужное исключение."
      - "Пишешь регрессионный тест на найденную ошибку до её исправления."
    prerequisites:
      - "Модуль 5: функции с return."
      - "Модуль 7: исключения."
      - "Модуль 8: виртуальное окружение — для установки pytest."
    hours: [4, 6]
    lessons:
      - id: m9-l1
        title: "От ручной проверки к assert"
      - id: m9-l2
        title: "Нормальные и граничные случаи"
      - id: m9-l3
        title: "pytest: первый набор тестов"
      - id: m9-l4
        title: "Тесты на ошибки и исключения"
      - id: m9-l5
        title: "Регрессия: тест, который помнит ошибку"
      - id: m9-l6
        title: "Самостоятельная работа: тесты для списка задач"
    practice: >-
      Тесты к своим функциям из прошлых модулей, поиск ошибки, которую ловит
      только граничный случай, регрессионные тесты для проекта «Список
      задач». Первые упражнения — с assert прямо в тренажёре, затем pytest на
      компьютере.
    mistakes:
      - "Тест повторяет логику кода и поэтому не может упасть."
      - "Проверяются только удобные примеры, без граничных случаев."
      - "Тесты зависят друг от друга или от настоящего файла с данными."
      - "Функция только печатает результат, и её трудно проверить без return."
      - "Тест подгоняют под неверный код вместо того, чтобы исправить код."
    completion: >-
      Модуль пройден, когда ты сам пишешь набор тестов для новой функции с
      нормальными и граничными случаями, находишь с их помощью ошибку и
      объясняешь, что проверяет каждый тест.
    environment: mixed

  - id: m10
    number: 10
    part: basics
    title: "Основы алгоритмов"
    why: >-
      Одну задачу можно решить так, что ответ появится мгновенно, а можно —
      так, что на больших данных программа будет думать минутами. Поиск и
      сортировка учат видеть цену решения и выбирать подходящий инструмент.
    outcomes:
      - "Оцениваешь примерное число шагов алгоритма и сравниваешь решения по тому, как оно растёт."
      - "Пишешь линейный и бинарный поиск и объясняешь, когда подходит каждый."
      - "Реализуешь простую сортировку и объясняешь её шаги."
      - "Сортируешь записи через sorted с параметром key."
      - "Заменяешь вложенный перебор словарём или множеством там, где это ускоряет решение."
    prerequisites:
      - "Модуль 4: списки, словари, множества."
      - "Модуль 5: функции."
      - "Модуль 9: тесты — чтобы проверять свои реализации."
    hours: [4, 7]
    lessons:
      - id: m10-l1
        title: "Сколько шагов делает программа"
      - id: m10-l2
        title: "Линейный поиск"
      - id: m10-l3
        title: "Бинарный поиск"
      - id: m10-l4
        title: "Сортировка своими руками"
      - id: m10-l5
        title: "sorted и ключ сортировки"
      - id: m10-l6
        title: "Быстрее без хитростей: словарь вместо перебора"
      - id: m10-l7
        title: "Самостоятельная работа: ускоряем поиск повторов"
    practice: >-
      Поиск в телефонной книге, сортировка результатов по нескольким полям,
      поиск повторов. Замер времени на списках разного размера и сравнение с
      оценкой. Задачи прикладные, без олимпиадного уклона. Самостоятельная
      работа без подсказок на первом шаге: найти медленное место в готовом
      решении, ускорить его и подтвердить тестами, что результат не
      изменился.
    mistakes:
      - "Бинарный поиск по неотсортированному списку."
      - "Бесконечный цикл в бинарном поиске из-за неверного сдвига границ."
      - "Вывод о скорости по одному запуску на маленьком списке."
      - "Своя сортировка там, где достаточно sorted."
      - "Проверка через in по списку внутри цикла, которая незаметно делает решение медленным на больших данных."
    completion: >-
      Модуль пройден, когда ты объясняешь, почему одно решение быстрее
      другого на больших данных, пишешь бинарный поиск с тестами на границах
      и выбираешь подходящую структуру данных для новой задачи.
    environment: browser

  - id: m11
    number: 11
    part: basics
    title: "Сеть, API и базы данных"
    why: >-
      Многие программы получают данные по сети и хранят их в базе. Ты узнаешь, что происходит при запросе к серверу, как не
      зависнуть при сбое сети и как надёжно хранить записи в SQLite.
    outcomes:
      - "Объясняешь HTTP-запрос и ответ: метод, адрес, код статуса, заголовки, тело."
      - "Получаешь JSON от API и достаёшь нужные поля."
      - "Задаёшь тайм-аут и обрабатываешь ошибки сети и неожиданные ответы."
      - "Создаёшь таблицу, добавляешь строки через INSERT, выбираешь, изменяешь и удаляешь их через SELECT, UPDATE и DELETE с условием WHERE."
      - "Работаешь с SQLite из Python только через параметризованные запросы."
    prerequisites:
      - "Модуль 7: JSON и исключения."
      - "Модуль 8: виртуальное окружение и установка пакетов."
      - "Модуль 9: тесты."
    hours: [6, 10]
    lessons:
      - id: m11-l1
        title: "HTTP: запрос и ответ"
      - id: m11-l2
        title: "JSON API: читаем ответ сервера"
      - id: m11-l3
        title: "Тайм-ауты и ошибки сети"
      - id: m11-l4
        title: "SQL: таблицы, SELECT и WHERE"
      - id: m11-l5
        title: "SQLite из Python: параметризованные запросы"
      - id: m11-l6
        title: "Изменяем данные: INSERT, UPDATE, DELETE"
      - id: m11-l7
        title: "Самостоятельная работа: ответы API в базе"
    practice: >-
      Разбор заранее подготовленных ответов API в офлайн-симуляции с явной
      меткой, затем настоящие запросы к открытому API на компьютере, когда
      есть интернет. Учебная база SQLite с заметками или книгами: выборка,
      изменение, перенос данных из JSON в таблицу. Самостоятельная работа —
      сохранить ответы API в базу.
    mistakes:
      - "Запрос без тайм-аута: при плохой сети программа зависает."
      - "Код ответа не проверяется, и страница с ошибкой разбирается как данные."
      - "SQL-запрос собирают склейкой строк с пользовательским вводом вместо параметров."
      - "Забывают commit, и изменения в базе не сохраняются."
      - "Ключ API записан прямо в код и попадает в Git."
    completion: >-
      Модуль пройден, когда ты сам пишешь программу, которая получает данные
      из API или учебного ответа, обрабатывает ошибки сети и сохраняет
      результат в SQLite параметризованными запросами, и можешь объяснить
      путь данных от запроса до таблицы.
    environment: mixed

  - id: m12
    number: 12
    part: deepening
    title: "Объекты и классы"
    why: >-
      Когда данные и действия над ними постоянно ходят вместе, класс помогает
      держать их рядом и сокращает число передаваемых параметров. Не менее
      важно видеть, когда класс не нужен и функции со словарями проще.
    outcomes:
      - "Объясняешь разницу между классом и объектом и создаёшь класс с __init__ и методами."
      - "Описываешь простые записи через dataclass."
      - "Сравниваешь решение на функциях и словарях с решением на классах и обосновываешь выбор."
      - "Переводишь часть своего проекта на классы там, где это упрощает код, и тесты при этом остаются зелёными."
    prerequisites:
      - "Модуль 5: функции."
      - "Модуль 9: тесты — чтобы безопасно переделывать код."
      - "Готовый проект «Список задач с JSON» или «Анализ файлов или API»."
    hours: [4, 6]
    lessons:
      - id: m12-l1
        title: "Когда класс помогает, а когда мешает"
      - id: m12-l2
        title: "Класс, объект и __init__"
      - id: m12-l3
        title: "Методы: действия рядом с данными"
      - id: m12-l4
        title: "dataclass для простых записей"
      - id: m12-l5
        title: "Самостоятельная работа: класс там, где он нужен"
    practice: >-
      Модель задачи или карточки для повторения, учебный счёт с пополнением
      и списанием, сравнение двух версий одного решения. Самостоятельная
      работа без подсказок на первом шаге: переделать часть своего проекта
      на класс там, где это упрощает код, с проверкой тестами до и после.
    mistakes:
      - "Забывают self в параметрах метода или при обращении к атрибуту."
      - "Класс ради класса: один метод и никаких данных."
      - "Общий изменяемый атрибут класса вместо атрибута каждого объекта."
      - "В одном классе смешаны ввод-вывод, хранение и расчёты."
    completion: >-
      Модуль пройден, когда ты сам проектируешь небольшой класс для новой
      задачи, пишешь к нему тесты и объясняешь, почему в этом месте класс
      лучше словаря и функций — или почему он здесь не нужен.
    environment: mixed

  - id: m13
    number: 13
    part: deepening
    title: "Итоговый проект и выбор направления"
    why: >-
      Итоговый проект собирает всё вместе: план, код, данные, обработку
      ошибок, тесты и документацию. Он показывает твои навыки лучше любого
      списка пройденных уроков и помогает решить, куда двигаться дальше.
    outcomes:
      - "Сравниваешь результаты и впечатления от проб и выбираешь 1–2 направления для углубления."
      - "Составляешь требования и план проекта и делишь его на короткие сессии."
      - "Реализуешь проект с SQLite, обработкой ошибок и тестами."
      - "Пишешь README, по которому другой человек устанавливает и запускает программу."
      - "Самостоятельно вносишь изменение требования — в том числе добавляешь столбец в таблицу через ALTER TABLE без потери записей — и объясняешь ключевые решения в своём коде."
      - "Составляешь список доказательств освоения и оставшихся пробелов и план углубления по выбранному направлению."
    prerequisites:
      - "Модули 0–12."
      - "Три небольших проекта из лестницы проектов."
      - "Несколько пройденных лабораторий — для осознанного выбора направления."
    hours: [12, 20]
    lessons:
      - id: m13-l1
        title: "Сравниваем пробы и выбираем 1–2 направления"
      - id: m13-l2
        title: "Требования и план проекта"
      - id: m13-l3
        title: "Каркас: структура, база данных, первые тесты"
      - id: m13-l4
        title: "Основные функции и обработка ошибок"
      - id: m13-l5
        title: "Граничные случаи и README"
      - id: m13-l6
        title: "Новое требование: меняем код и схему базы"
      - id: m13-l7
        title: "Разбор проекта и план углубления"
    practice: >-
      Сначала — сравнение проб по карте интересов и результатам и выбор 1–2
      направлений. Затем самостоятельная работа над итоговым проектом по
      этапам. Наставник помогает точечно и не пишет проект за тебя. В конце —
      изменение требования, разбор результата с конкретными доказательствами
      и план углубления по выбранному направлению.
    mistakes:
      - "Слишком большой замысел без минимальной рабочей версии."
      - "Тесты и README откладываются на самый конец."
      - "Нет плана сессий, и после перерыва трудно вспомнить, на чём остановился."
      - "Изменение требования ломает старые записи: новый столбец добавлен без значения по умолчанию, а тесты не дополнены."
    completion: >-
      Проект завершён, когда выполнены минимальные требования и критерии
      готовности, тесты проходят, по README программу можно запустить с нуля,
      изменение требования внесено самостоятельно и ты объясняешь ключевые
      решения в своём коде.
    environment: local

# ------------------------------------------------------------------ лаборатории направлений

labs:
  - id: web
    title: "Веб-интерфейсы"
    hook: "Своя страница с кнопкой, которая откликается на действия пользователя."
    story:
      title: "Расписание, которое перестали печатать"
      text: >-
        Преподавательница кружка рисования каждую неделю печатала расписание
        и вешала его на дверь, а родители всё равно звонили уточнить время.
        Её знакомый сделал простую страницу: таблица занятий и кнопка
        «Ближайшее занятие». Теперь расписание правится в одном файле, а
        ссылку можно отправить в общий чат. История составная и придумана для
        урока.
      fictional: true
    day: >-
      Верстают экраны по макету, пишут компоненты интерфейса на JavaScript
      или TypeScript, подключают данные с сервера, проверяют страницы на
      телефоне и в разных браузерах, исправляют ошибки и обсуждают спорные
      места с дизайнером.
    products:
      - "Сайты компаний и сервисов"
      - "Личные кабинеты и панели управления"
      - "Интернет-магазины"
      - "Веб-версии приложений"
    likes:
      - "Результат сразу виден в браузере."
      - "Работу легко показать другим по ссылке."
      - "Сочетание логики и чувства формы."
    hard:
      - "Разные браузеры и размеры экранов ведут себя по-разному."
      - "Много мелкой доводки отступов и состояний."
      - "Инструменты и фреймворки быстро меняются."
      - "Доступность и скорость загрузки требуют дисциплины."
    project:
      title: "Страница с интерактивной кнопкой"
      result: >-
        Страница о тебе или твоём хобби: заголовок, текст, картинка, вёрстка,
        которая нормально выглядит на телефоне, и кнопка, которая меняет
        страницу: показывает скрытый совет или переключает светлое и тёмное
        оформление.
      sessions: [4, 6]
      environment: web
      tools: "HTML, CSS и немного JavaScript; предпросмотр в браузере"
      prototype: working
    prerequisites:
      - "Уверенная работа с файлами и папками на компьютере."
      - "HTML и CSS не требуют Python и объясняются с нуля."
      - "Для JavaScript-части нужны переменные и условия (модули 1–2)."
      - "Обработчик нажатия — это маленькая функция; в лаборатории он даётся как готовая конструкция с разбором каждой строки, а подробно функции разбираются в модуле 5."
    unlockAfter: m2
    realWork:
      - "Семантическая разметка HTML и доступность."
      - "CSS-раскладка (flexbox, grid) и адаптивность."
      - "JavaScript: события, работа со страницей, запросы к серверу."
      - "Один фреймворк интерфейсов — тот, что используется в команде."
      - "Git, сборка проекта, тестирование интерфейса."
    paidTasks:
      - title: "Страница по готовому макету"
        example: "Учебный вымышленный пример: заказчику нужен одностраничный сайт студии йоги по макету — блок расписания, форма записи, аккуратный вид на телефоне."
        gap: "Точная вёрстка по макету, адаптивность, отправка формы, публикация сайта и согласование правок с заказчиком."
      - title: "Правки на существующем сайте"
        example: "Учебный вымышленный пример: на телефонах съезжает меню, нужно его починить и добавить кнопку «Наверх», ничего не сломав на остальных страницах."
        gap: "Чтение чужого кода, инструменты разработчика в браузере, проверка на разных устройствах."
      - title: "Интерактивный элемент на странице"
        example: "Учебный вымышленный пример: на сайт мастерской нужен калькулятор стоимости изделия по размерам и материалу."
        gap: "JavaScript на рабочем уровне, проверка ввода, тестирование в разных браузерах."
    ready: false

  - id: backend
    title: "Серверная разработка"
    hook: "Что происходит между нажатием кнопки «Сохранить» и записью в базе данных."
    story:
