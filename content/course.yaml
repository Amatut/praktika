# ------------------------------------------------------------------ лестница проектов

projects:
  - id: calc-quiz
    title: "Калькулятор или консольная викторина"
    after: m4
    story: >-
      Первый проект, который ты делаешь от плана до проверки. Выбери сюжет
      по душе: калькулятор для повседневных расчётов или викторину по
      любимой теме — кино, играм, географии. Программа маленькая, но
      настоящая: ею можно пользоваться и показать другим. Пишешь и
      проверяешь её в тренажёре на заранее заданном вводе, а по-настоящему
      поговорить с ней можно, запустив файл из терминала. Ориентир — 4–8
      сессий по 20–30 минут; оценка уточняется после первых сессий.
    environment: mixed
    minimum:
      - "Программа коротко объясняет, что делает, и работает в цикле до команды выхода."
      - "Калькулятор: принимает два числа и операцию +, -, *, / и выводит результат. Викторина: не меньше пяти вопросов и подсчёт правильных ответов."
      - "Деление на ноль, неизвестная операция или пустой ответ не ломают программу, а дают понятное сообщение."
      - "В конце показывается итог: сколько вычислений сделано или сколько ответов верны."
      - "Перед кодом написан план из нескольких шагов."
    extras:
      - "История вычислений или ответов, которую можно показать по команде."
      - "Викторина перемешивает вопросы и предлагает повторить те, где была ошибка."
      - "Упрощённая проверка, что введено целое число (через isdigit), с повторным запросом; полноценная проверка через try / except появится в модуле 7."
    criteria:
      - "Программа запускается и работает без ошибок на заранее записанных входных данных."
      - "Есть таблица ручных проверок с обычными и граничными случаями: ноль, отрицательные числа, деление на ноль, пустой ввод."
      - "Ты можешь объяснить каждую часть кода и почему она устроена именно так."
      - "Код написан самостоятельно, без копирования готового проекта."
    stages:
      - id: plan
        title: "План"
        description: "Выбери сюжет, запиши шаги программы и несколько примеров «ввод — ожидаемый вывод»."
      - id: minimum
        title: "Минимальная версия"
        description: "Сделай самую простую работающую версию: один расчёт или один вопрос, затем цикл."
      - id: checks
        title: "Проверки"
        description: "Пройди таблицу ручных проверок и исправь то, что не совпало с ожиданием."
      - id: extras
        title: "Доработка"
        description: "Выбери одно-два дополнительных задания и добавь их, не ломая то, что уже работает."
      - id: change
        title: "Новое требование"
        description: "Внеси изменение требования и заново пройди проверки."
    changeRequest: >-
      Калькулятор: добавь возведение в степень и спроси пользователя, до
      скольких знаков округлять результат. Викторина: у некоторых вопросов
      теперь несколько правильных вариантов ответа, и засчитать нужно любой
      из них.
    ready: false

  - id: todo-json
    title: "Список задач с сохранением в JSON"
    after: m7
    story: >-
      Список дел, который не забывает задачи после закрытия программы. Ты
      разложишь программу на функции, научишь её сохранять данные в файл и
      спокойно переживать неверный ввод и повреждённый файл. Этот проект
      станет основой для тестов и модулей в следующих темах. Ориентир — 6–10
      сессий по 20–30 минут; оценка уточняется по ходу работы.
    environment: mixed
    minimum:
      - "Можно добавить задачу, показать список, отметить задачу выполненной и удалить её."
      - "Каждое действие — отдельная функция с понятным именем."
      - "Задачи сохраняются в JSON-файл в учебной папке и загружаются при запуске."
      - "Несуществующий номер задачи, пустое название, отсутствующий или повреждённый файл не приводят к падению программы."
      - "Проект хранится в Git, в истории несколько осмысленных коммитов."
    extras:
      - "Срок выполнения в виде строки ГГГГ-ММ-ДД и сортировка задач по сроку."
      - "Поиск задач по слову."
      - "Приоритет и фильтр по нему."
    criteria:
      - "После перезапуска программы задачи на месте."
      - "Ручные проверки включают пустой список, несуществующий номер, пустое название, отсутствующий и повреждённый файл."
      - "Каждая функция делает одно дело, и ты можешь объяснить, зачем она нужна."
      - "Есть короткий README: что делает программа и как её запустить."
    stages:
      - id: plan
        title: "План и структура данных"
        description: "Реши, как будет выглядеть одна задача в данных и какие функции понадобятся."
      - id: functions
        title: "Функции"
        description: "Напиши функции добавления, показа, отметки и удаления и проверь каждую отдельно."
      - id: storage
        title: "Сохранение"
        description: "Добавь загрузку и сохранение в JSON; сначала работай с копией файла в учебной папке."
      - id: errors
        title: "Ошибки и неверный ввод"
        description: "Обработай неверный номер, пустой ввод, отсутствующий и повреждённый файл."
      - id: readme
        title: "README и Git"
        description: "Опиши запуск в README и сохрани этапы работы отдельными коммитами."
      - id: change
        title: "Новое требование"
        description: "Внеси изменение требования так, чтобы старые файлы продолжали открываться."
    changeRequest: >-
      У задач появляются категории: учёба, дом, работа. Нужен фильтр по
      категории, а старые JSON-файлы без категорий должны открываться без
      ошибок — задачам из них назначается категория по умолчанию.
    ready: false

  - id: data-report
    title: "Анализ учебных файлов или данных открытого API"
    after: m11
    story: >-
      Программа, которая превращает сырые данные в понятные выводы. Выбери
      вариант: папку учебных файлов (например, журналы занятий или таблицы
      покупок) или открытый API с интересными тебе данными — погода, книги,
      космос. Без интернета API-вариант работает на заранее сохранённом
      ответе с явной пометкой. Ориентир — 8–14 сессий по 20–30 минут; оценка
      уточняется по ходу работы.
    environment: local
    minimum:
      - "Вариант А: программа читает копии учебных файлов из отдельной папки. Вариант Б: программа получает данные из открытого API с тайм-аутом."
      - "Считаются как минимум три показателя, которые отвечают на заранее сформулированный вопрос."
      - "Результат сохраняется в SQLite через параметризованные запросы или в файл-отчёт."
      - "Отсутствующий файл, битая строка, нет сети, тайм-аут и неожиданный ответ дают понятные сообщения."
      - "Функции расчёта покрыты тестами pytest, включая пустые данные."
    extras:
      - "Один понятный график с подписанными осями."
      - "Параметры запуска из командной строки: папка, период или город."
      - "Сохранение ответов API с датой, чтобы не запрашивать одно и то же повторно."
    criteria:
      - "Программа работает на новых данных, а не только на тех, на которых её писали."
      - "Ошибки данных и сети понятны человеку без знания кода."
      - "Тесты проходят, включая граничные случаи: пустой файл, пустой ответ, одна запись."
      - "README объясняет установку, запуск и ограничения данных; проект в Git."
    stages:
      - id: plan
        title: "Вопрос и план"
        description: "Сформулируй вопрос к данным, выбери вариант А или Б и опиши, что будет на входе и на выходе."
      - id: load
        title: "Получение данных"
        description: "Прочитай файлы или получи ответ API; сохрани пример ответа для офлайн-проверок."
      - id: analysis
        title: "Расчёты"
        description: "Напиши функции расчёта показателей и тесты к ним."
      - id: storage
        title: "Сохранение и ошибки"
        description: "Сохрани результат в SQLite или отчёт и обработай ошибки файлов и сети."
      - id: readme
        title: "README и доработка"
        description: "Опиши запуск и ограничения, выбери дополнительное задание."
      - id: change
        title: "Новое требование"
        description: "Адаптируй чтение данных к новому формату и дополни тесты."
    changeRequest: >-
      Формат данных изменился: поле с датой переименовано, а сама дата
      записана в другом виде. Программа должна понимать и старый, и новый
      формат, а новый случай нужно покрыть тестом.
    ready: false

  - id: final-manager
    title: "Итоговый проект: личный менеджер задач или учёбы"
    after: m12
    story: >-
      Инструмент для себя: учёт задач, занятий или повторения тем, который
      ты действительно можешь использовать каждый день. Здесь сходится всё,
      что ты изучил: план, функции и классы там, где они уместны, SQLite,
      обработка ошибок, тесты, README и Git. Наставник помогает точечно, а
      решения принимаешь ты. Ориентир — 12–20 учебных часов, они уже учтены
      в оценке модуля 13.
    environment: local
    minimum:
      - "Данные хранятся в SQLite; все запросы параметризованные."
      - "Можно добавлять, просматривать, изменять и удалять записи."
      - "Есть отчёт, например что сделано за неделю или какие темы пора повторить."
      - "Код разнесён по модулям; зависимости перечислены в requirements.txt, проект запускается в виртуальном окружении."
      - "Тесты pytest покрывают основную логику, включая граничные случаи и неверный ввод."
      - "README: назначение, установка, запуск, примеры использования и известные ограничения."
    extras:
      - "Экспорт и импорт данных в CSV или JSON."
      - "Напоминание о повторении тем через 1, 3, 7 и 14 дней."
      - "Простой интерфейс по выбранному направлению: веб-страница, бот или графическое окно."
    criteria:
      - "Другой человек по README устанавливает и запускает проект с нуля."
      - "Все тесты проходят, а изменение требования внесено самостоятельно."
      - "Ты объясняешь ключевые решения: структуру базы, разбиение на модули, где и почему использованы классы."
      - "Составлен список доказательств освоения и оставшихся пробелов."
    stages:
      - id: plan
        title: "Требования и план"
        description: "Опиши, для чего инструмент, минимальную версию и план коротких сессий."
      - id: skeleton
        title: "Каркас"
        description: "Создай структуру проекта, окружение, схему базы и первые тесты."
      - id: core
        title: "Основные функции"
        description: "Реализуй работу с записями и отчёт, обработай ошибки ввода и данных."
      - id: tests
        title: "Проверки"
        description: "Дополни тесты граничными случаями и регрессионными проверками найденных ошибок."
      - id: readme
        title: "README и доработка"
        description: "Напиши README, проверь установку в чистой папке, выбери дополнительные задания."
      - id: change
        title: "Новое требование"
        description: "Внеси изменение требования, сохрани старые записи и дополни тесты."
      - id: review
        title: "Разбор"
        description: "Собери доказательства освоения, отметь пробелы и составь план углубления по выбранному направлению."
    changeRequest: >-
      У записей появляется приоритет: высокий, обычный или низкий. Список
      нужно сортировать по приоритету, а отчёт — показывать, сколько записей
      каждого приоритета выполнено. Добавь столбец в существующую таблицу
      так, чтобы старые записи получили обычный приоритет и ничего не
      потерялось, и дополни тесты.
    ready: false
