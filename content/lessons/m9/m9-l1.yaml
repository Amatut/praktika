      mistakes:
        - id: assign-in-assert
          when:
            errorType: SyntaxError
            codeRegex: '^[ \t]*assert\s(?:[^\n#"=(!<>]|\([^()\n]*\))+=[^=]'
          why: >-
            Внутри `assert` стоит один знак `=`. Один `=` — это присваивание, внутри assert оно
            запрещено, поэтому Python не может даже запустить программу.
          try: Сравнивай двумя знаками — `==`, как в готовой проверке на 50 очков.
          verify: Программа должна запуститься без SyntaxError.
        - id: tuple-assert
          when:
            codeRegex: '^[ \t]*assert\s*\((?:[^()\n]|\([^()\n]*\))*,\s*f?["'']'
          why: >-
            Условие и сообщение взяты в общие скобки: `assert(условие, "сообщение")`. Для Python
            это одно значение — кортеж из двух частей, а непустой кортеж всегда истинен. Такая
            проверка не упадёт никогда, даже на сломанной функции.
          try: >-
            Убери внешние скобки: `assert level(50) == "новичок", "50 очков"`. assert — не
            функция, как print, скобки ему не нужны.
        - id: test-helper-params
          when:
            failedTest: t-ref
            errorIncludes: required positional argument
            codeRegex: '^def\s+test_\w*\(\s*[A-Za-z_]'
          why: >-
            Тренажёр (и pytest, с которым ты познакомишься в уроке 9.3) сам вызывает каждую
            функцию, чьё имя начинается с `test_`, — без аргументов. У твоей функции `test_…` есть
            параметры, поэтому такой вызов падает с TypeError.
          try: >-
            У самого теста параметров нет: все данные — внутри него. Вспомогательную функцию с
            параметрами назови без `test_` в начале, например `check(points, expected)`.
        - id: still-prints
          when:
            failedTest: t-call-50
            codeRegex: '^[ \t]+(return\s+)?print\(\s*["''](новичок|игрок|мастер)'
          why: >-
            В функции остался `print` с названием уровня. Такая ветка печатает слово, а возвращает
            `None`. assert видит то, что функция вернула, а не то, что она напечатала, поэтому
            проверка этой ветки падает, хотя слово на экране верное. `return print(…)` не
            помогает: `print` сам возвращает `None`.
          try: В каждой ветке функции замени `print(…)` на `return` с названием уровня.
