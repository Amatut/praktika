      mistakes:
        - id: assign-in-assert
          when:
            errorType: SyntaxError
            codeRegex: '^[ \t]*assert\s(?:[^\n#"=(!<>]|\([^()\n]*\))+=[^=]'
          why: >-
            Внутри `assert` стоит один знак `=`. Один `=` — это присваивание: «положи значение в
            переменную». Внутри assert оно запрещено, поэтому Python не может даже запустить
            программу.
