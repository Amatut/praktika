        code: |
          def level(points):
              if points >= 500:
                  return "мастер"
              elif points >= 100:
                  return "игрок"
              else:
                  return "новичок"


          def test_level():
              assert level(50) == "новичок"
              assert level(250) == "игрок"
              assert level(700) == "мастер"


          test_level()
          print("Все тесты прошли")
        explanation: >-
          `print` показывает слово на экране, но функция при этом возвращает `None`, и
          `None == "новичок"` ложно. С `return` в каждой ветке функция отдаёт название уровня, и
          assert сравнивает именно его. Проверки для «игрока» и «мастера» нужны, чтобы тест
          заметил ошибку в любой ветке: одна проверка на 50 очков проверяет только ветку
