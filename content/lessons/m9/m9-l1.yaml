id: m9-l1
module: m9
number: "9.1"
title: От ручной проверки к assert
objective: >-
  Превращать ручные проверки функции в автоматические assert, собирать их в тестовую функцию
  test_… и понимать, что assert видит то, что функция вернула, а не то, что она напечатала.
minutes: [25, 30]
prerequisites: [m8-l6]
skills: [assert-checks, functions]
environment: python

story:
  title: Пять проверок в тетрадке
  fictional: true
  text: >-
    Матвей, администратор велопроката «Круг», написал программу, которая считает стоимость
    аренды. После каждой правки он запускал её и сверял пять примеров с тетрадкой: час — 200
    рублей, три часа — 400 и так далее. Однажды он добавил скидку для студентов, проверил только
    её и не заметил, что сломался расчёт долгих поездок. Ошибку нашёл клиент, которому насчитали
    лишнее. Теперь пять проверок из тетрадки записаны прямо в коде и выполняются за долю секунды
    после каждой правки.

why: >-
  Ручную проверку легко забыть или сделать наполовину, особенно после «маленькой» правки.
  Автоматическая проверка — это строка вроде `assert rent_price(3) == 400`: она молчит, пока всё
  верно, и сразу останавливает программу, если результат не совпал с ожиданием.

usedIn: >-
  В любом проекте, где код меняют больше одного раза. Разработчики обычно запускают тесты перед
  коммитом, а на серверах, которые собирают проект, тесты запускаются сами при каждом изменении
  кода. `assert` —
  основа тестов pytest, с которым ты познакомишься в уроке 9.3.

steps:
  - id: assert-idea
    type: theory
    title: "assert: проверка, которая молчит, пока всё верно"
    body: |-
      В уроке 2.5 ты составлял таблицу проверок: что подаём на вход, что ожидаем, что получилось.
      Это **ручная проверка**: запустил, посмотрел, сравнил в голове. Она работает, но медленно, и
      после каждой правки её нужно повторять. А повторяют её редко.

      **`assert`** (читается «ассерт», от английского «утверждать») превращает такую проверку
      в строку кода:

      ```python
      assert rent_price(3) == 400
      ```

      После `assert` стоит условие. Если оно верно, ничего не происходит: программа молча идёт
      дальше. Если неверно, Python останавливает программу с ошибкой **AssertionError** и в
      traceback показывает строку с этой проверкой.

      Обычная форма — `assert функция(вход) == ожидание`. Слева то, что функция **вернула**,
      справа то, что должно получиться. **Ожидание считают сами, по условию задачи**, а не
      переписывают из вывода программы: иначе проверка повторит ошибку кода.

      После условия можно поставить запятую и сообщение. Его покажет AssertionError, а без
      сообщения ты увидишь только слово `AssertionError`:

      ```python
      assert rent_price(5) == 600, "5 часов: 200 за первый час и 4 по 100"
      ```

      Не бери условие и сообщение в общие скобки: `assert(x == 1, "…")` проверяет кортеж из двух
      значений (урок 4.5), а он всегда истинен. Такая проверка не упадёт никогда.

      Если функция возвращает `True` или `False`, сравнение не нужно: `assert is_open(10)` и
      `assert not is_open(23)` — «в 10 часов прокат открыт, а в 23 — нет».

      **Тест** — код, который проверяет другой код. Проверки собирают в **тестовую функцию**. Её
      имя начинается с `test_`: по этому началу тесты находит тренажёр, а в уроке 9.3 — pytest.
      Параметров у теста нет, все данные — внутри него:

      ```python
      def test_rent_price():
          assert rent_price(1) == 200
          assert rent_price(3) == 400
      ```

      Как любую функцию, тест нужно вызвать: `test_rent_price()`. Без вызова проверки не
      выполнятся. **Тест прошёл** — все assert верны. **Тест упал** — сработал AssertionError
      (результат и ожидание разошлись) или внутри теста случилась другая ошибка, например
      NameError из-за опечатки. Ошибиться мог и код, и тот, кто писал ожидание. Кто прав, решает
      условие задачи.

      `assert` сравнивает значения, а не текст на экране. Если `rent_price` будет печатать цену, а
      не возвращать её, функция отдаст `None` (урок 5.3), и проверка `assert rent_price(3) == 400`
      упадёт, хотя на экране будет 400. Поэтому функцию для проверки пиши с `return`.

      `assert` — проверка для разработчика. Неверный ввод пользователя по-прежнему проверяют
      через `if` и `try`/`except` (модуль 7).

      В заданиях тренажёр запустит твой тест сначала на верной функции (тест должен пройти),
      потом на версиях функции с подставленной ошибкой (на каждой он должен упасть).
    simpler: >-
      `assert` — это «я уверен, что…». Если прав — тишина, программа идёт дальше. Если не прав —
      программа останавливается и показывает строку с проверкой. Тест — функция с именем
      `test_…` без параметров, внутри которой несколько таких проверок. Её нужно вызвать, как
      любую функцию.
    coach: >-
      Ожидание в тесте считай по условию задачи, на бумаге или в уме. Не подсматривай его в
      вывод программы.

  - id: rent-test
    type: example
    title: Тест для проката
    body: >-
      Правило проката из истории: первый час стоит 200 рублей, каждый следующий — 100. Функция
      `rent_price` считает цену, а тест под ней проверяет три случая из тетрадки Матвея. Нажми
      «Запустить».
    code: |-
      def rent_price(hours):
          if hours <= 1:
              return 200
          return 200 + (hours - 1) * 100


      def test_rent_price():
          assert rent_price(1) == 200
          assert rent_price(3) == 400
          assert rent_price(5) == 600, "5 часов: 200 за первый час и 4 по 100"


      test_rent_price()
      print("Все тесты прошли")
    notes:
      - line: 7
        text: Имя начинается с `test_`, внутри только проверки — это тестовая функция.
      - line: 9
        text: >-
          Ожидание 400 посчитано вручную по правилу: 200 за первый час и ещё 2 часа по 100.
          Из вывода программы его не брали.
      - line: 10
        text: Сообщение после запятой объясняет, откуда взялось 600. Его видно, только если проверка упадёт.
      - line: 13
        text: Тест нужно вызвать. Без этой строки ни один assert не выполнится.
      - line: 14
        text: Эта строка печатается, только если все проверки прошли. Упавший assert остановил бы программу раньше.
    tryIt: >-
      Поменяй в функции `100` на `150` и запусти. На какой строке остановилась программа и почему
      «Все тесты прошли» не появилось? Потом допиши к этой проверке сообщение
      `, f"3 часа: получили {rent_price(3)}"` и запусти снова: теперь в сообщении видно настоящее
      значение. В конце верни `100`.
    coach: >-
      Верный assert ничего не печатает. Если тест прошёл, ты увидишь только «Все тесты прошли».

  - id: silent-assert
    type: predict
    title: Что успеет появиться?
    prompt: Как думаешь, какие строки напечатает эта программа?
    code: |-
      def to_minutes(hours):
          return hours * 60

      assert to_minutes(1) == 60
      print("Проверка 1 пройдена")
      assert to_minutes(2) == 100
      print("Проверка 2 пройдена")
    options:
      - Проверка 1 пройдена
      - |-
        Проверка 1 пройдена
        Проверка 2 пройдена
      - |-
        True
        Проверка 1 пройдена
    answer: Проверка 1 пройдена
    explanation: >-
      Первый assert верен: `to_minutes(1)` возвращает 60, и проверка молча пропускает программу
      дальше. Сама она ничего не печатает, даже `True`. Второй assert ложен: функция вернула 120,
      а ожидание — 100. Python остановил программу с AssertionError, и вторая строка не
      напечаталась. И главное: ошибся здесь **тест**, а не функция. В двух часах 120 минут.
      Упавший тест говорит только, что код и ожидание разошлись, а кто прав — решает условие.
    coach: >-
      Когда тест падает, не спеши чинить функцию. Сначала пересчитай ожидание по условию.

  - id: practice-delivery
    type: exercise
    title: Практика 1
    exercise:
      id: m9-l1-e1
      kind: repeat
      title: Ручные проверки — в assert
      statement: |-
        Продуктовый магазин берёт за доставку 300 рублей, а заказ **от 1500 рублей
        включительно** везёт бесплатно. Функция `delivery_cost` написана верно. Под ней ручные
        проверки: `print` с вызовом функции и комментарий «ожидаю …». Первая проверка уже
        переписана в `assert` внутри `test_delivery_cost`.

        Что сделать:

        1. Перенеси две оставшиеся ручные проверки в `test_delivery_cost` — тоже через `assert`.
        2. Удали строки `print(delivery_cost(…))`.
        3. Внизу вызови тест, а после вызова выведи `Все тесты прошли`.

        Тренажёр запустит твой тест сначала на верной функции (тест должен пройти), потом на
        версиях функции с подставленной ошибкой (на каждой он должен упасть).
      input: "Ввода нет: тест вызывает функцию напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - Функцию `delivery_cost` не меняй — она верная.
        - 'Ожидания бери из комментариев «ожидаю …»: они посчитаны по правилу доставки.'
      starterCode: |
        def delivery_cost(order_total):
            if order_total >= 1500:
                return 0
            return 300


        def test_delivery_cost():
            assert delivery_cost(500) == 300
            # Перенеси сюда две ручные проверки снизу — тоже через assert


        # Ручные проверки: каждый раз приходится сверять глазами
        print(delivery_cost(1500))   # ожидаю 0
        print(delivery_cost(2400))   # ожидаю 0

        # Вызови тест и выведи «Все тесты прошли»
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
          compare:
            ignoreCase: true
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t-ref
          kind: assert
          title: Тест проходит на верной функции
          example: true
          code: |
            def _reference(order_total):
                if order_total >= 1500:
                    return 0
                return 300


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("delivery_cost")
            globals()["delivery_cost"] = _reference
            try:
                for _test in _tests:
                    _test()
            finally:
                globals()["delivery_cost"] = _saved
          message: Твои проверки проходят на верной функции `delivery_cost`.
        - id: t-order
          kind: assert
          title: Итог печатается после вызова теста
          code: |
            import ast as _ast

            _statements = []
            for _node in _ast.parse(open(__file__, encoding="utf-8").read()).body:
                if isinstance(_node, _ast.If):
                    _statements.extend(_node.body)
                elif not isinstance(_node, (_ast.FunctionDef, _ast.ClassDef)):
                    _statements.append(_node)
            _call_line = None
            _print_line = None
            for _node in _statements:
                for _sub in _ast.walk(_node):
                    if not (isinstance(_sub, _ast.Call) and isinstance(_sub.func, _ast.Name)):
                        continue
                    if _sub.func.id.startswith("test_") and _call_line is None:
                        _call_line = _node.lineno
                    if _sub.func.id == "print" and _print_line is None:
                        for _arg in _sub.args:
                            if isinstance(_arg, _ast.Constant) and "тесты прошли" in str(_arg.value).lower():
                                _print_line = _node.lineno
            assert _call_line is None or _print_line is None or _call_line <= _print_line
          message: Строка «Все тесты прошли» печатается после вызова теста, а не до него.
        - id: t-m-threshold
          kind: assert
          title: Тест замечает ошибку на пороге 1500
          edge: true
          code: |
            def _mutant(order_total):
                if order_total > 1500:
                    return 0
                return 300


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("delivery_cost")
            globals()["delivery_cost"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["delivery_cost"] = _saved
            assert _caught
          message: >-
            Тест не заметил версию функции, где заказ ровно на 1500 рублей ещё платный. Нужна
            проверка ровно на пороге.
        - id: t-m-above
          kind: assert
          title: Тест замечает ошибку для заказа дороже 1500
          code: |
            def _mutant(order_total):
                if order_total == 1500:
                    return 0
                return 300


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("delivery_cost")
            globals()["delivery_cost"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["delivery_cost"] = _saved
            assert _caught
          message: >-
            Тест не заметил версию функции, где бесплатна только доставка заказа ровно на 1500
            рублей. Нужна проверка для заказа дороже порога.
        - id: t-m-paid
          kind: assert
          title: Тест замечает бесплатную доставку для любого заказа
          code: |
            def _mutant(order_total):
                return 0


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("delivery_cost")
            globals()["delivery_cost"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["delivery_cost"] = _saved
            assert _caught
          message: >-
            Тест не заметил версию функции, где доставка бесплатна для любого заказа. Нужна
            проверка платной доставки.
      rules:
        - id: r-call
          use: ["call:test_delivery_cost"]
          message: >-
            Вызови `test_delivery_cost()` в программе, со скобками. Без вызова проверки не
            выполнятся при запуске.
      criteria:
        - Все три проверки — на 500, 1500 и 2400 — записаны как `assert` внутри `test_delivery_cost`.
        - Строк `print(delivery_cost(…))` не осталось, программа печатает только «Все тесты прошли».
        - Тест вызван в программе и на верной функции проходит; «Все тесты прошли» печатается после вызова.
        - >-
          Тест падает на версиях функции с ошибкой на пороге 1500, для заказа дороже порога и с
          бесплатной доставкой для любого заказа.
      hints:
        - >-
          Посмотри на готовый `assert` в тесте: что стоит слева от `==`, а что справа? Теперь
          найди то же самое в ручной проверке: где там вызов функции, а где ожидание?
        - >-
          На другом примере: ручная проверка `print(square(4))   # ожидаю 16` превращается в
          `assert square(4) == 16`. Вызов функции переходит влево от `==`, число из комментария —
          вправо, а сама строка переезжает внутрь тестовой функции.
        - |-
          Каркас:
          ```text
          def test_delivery_cost():
              assert delivery_cost(500) == 300
              assert delivery_cost(…) == …
              assert delivery_cost(…) == …


          test_delivery_cost()
          print(…)
          ```
      solution:
        code: |
          def delivery_cost(order_total):
              if order_total >= 1500:
                  return 0
              return 300


          def test_delivery_cost():
              assert delivery_cost(500) == 300
              assert delivery_cost(1500) == 0
              assert delivery_cost(2400) == 0


          test_delivery_cost()
          print("Все тесты прошли")
        explanation: >-
          Каждая ручная проверка стала строкой `assert вызов == ожидание`: вызов из `print`
          встал слева, число из комментария — справа. Проверки живут внутри `test_delivery_cost`,
          поэтому их можно запустить одной строкой — вызовом теста. Если какая-то проверка не
          пройдёт, AssertionError остановит программу, и «Все тесты прошли» не напечатается.
          Проверка на 1500 ловит ошибку «больше вместо больше или равно», проверка на 2400 —
          ошибку, при которой бесплатна только доставка заказа ровно на 1500, а проверка на 500 —
          функцию, у которой доставка бесплатна всегда.
      altSolutions:
        - code: |
            def delivery_cost(order_total):
                if order_total >= 1500:
                    return 0
                return 300


            def test_delivery_cost():
                assert delivery_cost(500) == 300, "до порога доставка платная"
                assert delivery_cost(1500) == 0, "ровно 1500 — уже бесплатно"
                assert delivery_cost(2400) == 0, f"2400: получили {delivery_cost(2400)}"


            test_delivery_cost()
            print("Все тесты прошли")
          note: Проверки с сообщениями.
        - code: |
            def delivery_cost(order_total):
                if order_total >= 1500:
                    return 0
                return 300


            def test_delivery_cost():
                assert delivery_cost(500) == 300
                assert delivery_cost(1500) == 0
                assert delivery_cost(2400) == 0


            if __name__ == "__main__":
                test_delivery_cost()
                print("Все тесты прошли")
          note: Вызов теста в блоке запуска из урока 8.2.
        - code: |
            def delivery_cost(order_total):
                if order_total >= 1500:
                    return 0
                return 300


            def test_delivery_cost():
                assert delivery_cost(500) == 300
                assert delivery_cost(1499) == 300
                assert delivery_cost(1500) == 0
                assert delivery_cost(2400) == 0


            # Ручные проверки больше не нужны:
            # print(delivery_cost(1500))   # ожидаю 0
            # print(delivery_cost(2400))   # ожидаю 0

            test_delivery_cost()
            print("все тесты прошли")
          note: Лишняя проверка на 1499, ручные проверки закомментированы, фраза с маленькой буквы.
        - code: |
            def delivery_cost(order_total):
                if order_total >= 1500:
                    return 0
                return 300


            def test_delivery_cost():
                assert delivery_cost(500) == 300


            def test_free_delivery():
                assert 0 == delivery_cost(1500)
                assert delivery_cost(2400) == 0


            test_delivery_cost()
            test_free_delivery()
            print("Все тесты прошли")
          note: Два теста вместо одного, ожидание слева от ==.
        - code: |
            def delivery_cost(order_total):
                if order_total >= 1500:
                    return 0
                return 300


            def test_delivery_cost():
                assert delivery_cost(500) == 300
                assert delivery_cost(1500) == 0   # ожидаю 0
                assert delivery_cost(2400) == 0   # ожидаю 0
                print("Все тесты прошли")


            test_delivery_cost()
          note: Итог печатает сам тест после проверок, внизу только вызов.
        - code: |
            def delivery_cost(order_total):
                if order_total >= 1500:
                    return 0
                return 300


            def check(order_total, expected):
                assert delivery_cost(order_total) == expected, f"заказ на {order_total}"


            def test_delivery_cost():
                for order_total, expected in [(500, 300), (1500, 0), (2400, 0)]:
                    check(order_total, expected)


            def main():
                test_delivery_cost()
                print()
