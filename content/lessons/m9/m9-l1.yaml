          try: >-
            Сверь с правилами из условия и функцию, и тест: пороги (ровно 100 — уже «игрок», ровно
            500 — уже «мастер») и названия уровней — буква в букву, маленькими буквами.
        - id: prints-and-returns
          when:
            failedTest: t-io
            codeRegex: '^[ \t]+print\(\s*["''](новичок|игрок|мастер)'
          why: >-
            Функция уже возвращает уровень, но в ней остался `print` с названием уровня. Он
            печатает лишние строки, и вывод программы — уже не одна строка «Все тесты прошли».
          try: Убери `print` из функции `level` — пусть она только возвращает название уровня.
        - id: bare-compare
          when:
            codeRegex: '^[ \t]*level\([^\n]*=='
            outputIncludes: тесты прошли
          why: >-
            В тесте есть сравнение без слова `assert`. Такая строка вычисляет `True` или `False`
            и тут же забывает результат: упасть она не может, поэтому ошибку в функции не заметит.
          try: Начни каждую такую строку со слова `assert`.
        - id: missed-master
          when:
            failedTest: t-m-master
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, в которой уровня «мастер» нет вовсе. Значит, ни один
            `assert` не заглядывает в эту ветку.
          try: Добавь `assert` для числа очков, при котором уровень — уже «мастер».
        - id: missed-player
          when:
            failedTest: t-m-player
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, в которой уровня «игрок» нет вовсе. Значит, ни один
            `assert` не заглядывает в эту ветку.
          try: Добавь `assert` для числа очков, при котором уровень — уже «игрок», но ещё не «мастер».
        - id: no-call
          when:
            failedRule: r-call
          why: >-
            Вызова `test_level()` в программе нет. Функция выполняется только при вызове, поэтому
            при запуске ни одна проверка не сработала.
          try: Верни вызов `test_level()` перед строкой с «Все тесты прошли».
          verify: 'Нажми «Проверить»: требование к коду должно выполниться.'
      afterPass: >-
        Функция отдаёт уровень, и с ним можно работать дальше: сохранить, сравнить, показать в
        интерфейсе игры. Одно улучшение: проверь и сами пороги — ровно 100 и ровно 500 очков. На
        таких границах ошибаются чаще всего, об этом следующий урок.
      skills: [assert-checks, functions]

  - id: practice-fine
    type: exercise
    title: Практика 3
    exercise:
      id: m9-l1-e3
      kind: write
      title: Тест по таблице
      statement: |-
        В библиотеке за каждый день просрочки берут 15 рублей, но не больше 300 за одну книгу.
        Если книгу вернули в срок или раньше, штрафа нет. Функция `fine` уже написана и работает
        верно. Библиотекарь проверял её вручную по такой таблице:

        ```text
        Просрочка, дней   Штраф, руб.   Что проверяем
        0                 0             вернули в срок
        4                 60            обычная просрочка
        25                ?             долгая просрочка
        -3                0             вернули раньше срока
        ```

        Отрицательная просрочка значит, что книгу вернули раньше срока: `-3` — на три дня раньше.
        Штраф в строке со знаком `?` библиотекарь не успел записать — посчитай его сам по правилу.

        Напиши тестовую функцию `test_fine()`, которая проверяет все строки таблицы. Вызови её, а
        после вызова выведи `Все тесты прошли`.

        Тренажёр запустит твой тест сначала на верной функции (тест должен пройти), потом на
        версиях функции с подставленной ошибкой (на каждой он должен упасть).
      input: "Ввода нет: тест вызывает функцию напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - Функцию `fine` не меняй — она верная.
        - Тестовая функция называется `test_fine`.
        - Штраф для строки со знаком `?` посчитай по правилу из условия, а не по выводу программы.
      starterCode: |
        def fine(days_late):
            if days_late <= 0:
                return 0
            amount = days_late * 15
            if amount > 300:
                return 300
            return amount


        # Напиши test_fine() по таблице из условия,
        # вызови её и выведи «Все тесты прошли»
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
          compare:
            ignoreCase: true
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t-has
          kind: assert
          title: Есть тестовая функция
          code: |
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            assert _tests
          message: В программе есть функция, имя которой начинается с `test_`.
        - id: t-ref
          kind: assert
          title: Тест проходит на верной функции
          example: true
          code: |
            def _reference(days_late):
                if days_late <= 0:
                    return 0
                return min(days_late * 15, 300)


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("fine")
            globals()["fine"] = _reference
            try:
                for _test in _tests:
                    _test()
            finally:
                globals()["fine"] = _saved
          message: Твои проверки проходят на верной функции `fine`.
        - id: t-order
          kind: assert
          title: Итог печатается после вызова теста
          code: |
            import ast as _ast

            _statements = []
            for _node in _ast.parse(open(__file__, encoding="utf-8").read()).body:
                if isinstance(_node, _ast.If):
                    _statements.extend(_node.body)
                elif not isinstance(_node, (_ast.FunctionDef, _ast.ClassDef)):
                    _statements.append(_node)
            _call_line = None
            _print_line = None
            for _node in _statements:
                for _sub in _ast.walk(_node):
                    if not (isinstance(_sub, _ast.Call) and isinstance(_sub.func, _ast.Name)):
                        continue
                    if _sub.func.id.startswith("test_") and _call_line is None:
                        _call_line = _node.lineno
                    if _sub.func.id == "print" and _print_line is None:
                        for _arg in _sub.args:
                            if isinstance(_arg, _ast.Constant) and "тесты прошли" in str(_arg.value).lower():
                                _print_line = _node.lineno
            assert _call_line is None or _print_line is None or _call_line <= _print_line
          message: Строка «Все тесты прошли» печатается после вызова теста, а не до него.
        - id: t-m-cap
          kind: assert
          title: Тест замечает штраф без потолка 300
          edge: true
          code: |
            def _mutant(days_late):
                if days_late <= 0:
                    return 0
                return days_late * 15


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("fine")
            globals()["fine"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["fine"] = _saved
            assert _caught
          message: Тест не заметил версию функции, где штраф растёт без ограничения в 300 рублей.
        - id: t-m-negative
          kind: assert
          title: Тест замечает отрицательный штраф
          edge: true
          code: |
            def _mutant(days_late):
                if days_late == 0:
                    return 0
                return min(days_late * 15, 300)


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("fine")
            globals()["fine"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["fine"] = _saved
            assert _caught
          message: >-
            Тест не заметил версию функции, где за книгу, возвращённую раньше срока, получается
            отрицательный штраф.
        - id: t-m-rate
          kind: assert
          title: Тест замечает неверную цену дня
          code: |
            def _mutant(days_late):
                if days_late <= 0:
                    return 0
                return min(days_late * 20, 300)


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("fine")
            globals()["fine"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["fine"] = _saved
            assert _caught
          message: Тест не заметил версию функции, где день просрочки стоит 20 рублей вместо 15.
      rules:
        - id: r-call
          use: ["call:test_fine"]
          message: >-
            Вызови `test_fine()` в программе, со скобками. Без вызова проверки не выполнятся при
            запуске.
      criteria:
        - >-
          Есть функция `test_fine`, и в ней проверены все четыре строки таблицы через `assert`;
          штраф для строки со знаком `?` посчитан по правилу.
        - Тест вызван в программе и на верной функции проходит; «Все тесты прошли» печатается после вызова.
        - Тест падает на версиях функции без потолка 300, с отрицательным штрафом и с другой ценой дня.
        - Программа печатает только «Все тесты прошли».
      hints:
        - >-
          Каждая строка таблицы — одна проверка. Что во второй колонке, когда там стоит `?`,
          подскажет правило из первой фразы условия, все его части. Где должны жить эти проверки
          и как назвать функцию, чтобы тренажёр её нашёл?
        - |-
          Пример на другой таблице. В музее дети до 7 лет проходят бесплатно, остальные платят
          250 рублей. Таблица «5 лет → 0, 30 лет → 250» превращается в тест:
          ```python
          def test_ticket_price():
              assert ticket_price(5) == 0
              assert ticket_price(30) == 250


          test_ticket_price()
          ```
          У теста нет параметров, его вызывают под ним. Отрицательное число пишется прямо в
          вызове, с обычным минусом с клавиатуры: `-2`.
        - |-
          Каркас:
          ```text
          def test_fine():
              assert fine(0) == 0
              assert fine(…) == …
              …   # по проверке на каждую строку таблицы


          test_fine()
          print(…)
          ```
      solution:
        code: |
          def fine(days_late):
              if days_late <= 0:
                  return 0
              amount = days_late * 15
              if amount > 300:
                  return 300
              return amount


          def test_fine():
              assert fine(0) == 0
              assert fine(4) == 60
              assert fine(25) == 300
              assert fine(-3) == 0


          test_fine()
          print("Все тесты прошли")
        explanation: >-
          Каждая строка таблицы стала одним `assert`: вызов с числом дней слева, штраф справа.
          Штраф за 25 дней посчитан по правилу: `25 * 15` — это 375, но больше 300 штраф не
          бывает, значит, 300. У каждой строки своя работа. 4 дня проверяют цену дня, 25 — потолок
          300, `-3` — что досрочный возврат не даёт отрицательного штрафа. Строка с нулём
          проверяет возврат точно в срок. Все ожидания взяты из правил, а не из вывода программы.
