                amount = days_late * 15
                if amount > 300:
                    return 300
                return amount


            def test_row(days, expected):
                assert fine(days) == expected


            def test_fine():
                test_row(0, 0)
                test_row(4, 60)
                test_row(25, 300)
                test_row(-3, 0)


            test_fine()
            print("Все тесты прошли")
          note: Помощник на строку таблицы назван test_row — тренажёр вызывает его без аргументов.
          expectMistake: test-helper-params
