      mistakes:
        - id: assign-in-assert
          when:
            errorType: SyntaxError
            codeRegex: '^[ \t]*assert\s(?:[^\n#"=(!<>]|\([^()\n]*\))+=[^=]'
          why: >-
            Внутри `assert` стоит один знак `=`. Один `=` — это присваивание, внутри assert оно
            запрещено, поэтому Python не может даже запустить программу.
          try: Сравнивай двумя знаками — `==`.
          verify: Программа должна запуститься без SyntaxError.
        - id: tuple-assert
          when:
            codeRegex: '^[ \t]*assert\s*\((?:[^()\n]|\([^()\n]*\))*,\s*f?["'']'
          why: >-
            Условие и сообщение взяты в общие скобки: `assert(условие, "сообщение")`. Для Python
            это одно значение — кортеж из двух частей, а непустой кортеж всегда истинен. Такая
            проверка не упадёт никогда, даже на сломанной функции.
          try: >-
            Убери внешние скобки: `assert fine(0) == 0, "вернули в срок"`. assert — не функция,
            как print, скобки ему не нужны.
        - id: test-helper-params
          when:
            failedTest: t-ref
            errorIncludes: required positional argument
            codeRegex: '^def\s+test_\w*\(\s*[A-Za-z_]'
          why: >-
            Тренажёр (и pytest, с которым ты познакомишься в уроке 9.3) сам вызывает каждую
            функцию, чьё имя начинается с `test_`, — без аргументов. У твоей функции `test_…` есть
            параметры, поэтому такой вызов падает с TypeError.
          try: >-
            У самого теста параметров нет: все данные — внутри него, пусть будет
            `def test_fine():`. Вспомогательную функцию с параметрами назови без `test_` в начале,
            например `check_row(days, expected)`.
        - id: wrong-expectation
          when:
            errorType: AssertionError
          why: >-
            Тест упал при запуске: функция вернула одно число, а в assert справа записано другое.
            Функция в стартовом коде верная, поэтому ошибка, скорее всего, в ожидании.
          try: >-
            Найди строку, на которой остановилась программа. Ожидание бери из второй колонки
            таблицы. Если считаешь сам, не забудь про потолок: больше 300 штраф не бывает. Если
            ожидание верное, а функцию ты менял, верни её из стартового кода.
          verify: После запуска должна появиться строка «Все тесты прошли».
        - id: wrong-expectation-silent
          when:
            failedTest: t-ref
            failedRule: r-call
          why: >-
            Вызова `test_fine()` в программе нет, поэтому при запуске проверки не выполнялись, а
            «Все тесты прошли» напечаталось просто так. Тренажёр вызвал тест сам, и на верной
            функции одна из проверок упала: ожидание не совпадает с правилом штрафа.
          try: >-
            Вызови тест перед `print` и запусти программу: Python сам покажет строку с неверным
            ожиданием. Сверь его с таблицей и правилом — с потолком 300.
        - id: changed-function
          when:
            failedTest: t-ref
            outputIncludes: тесты прошли
          why: >-
            Твой тест проходит в твоей программе, но падает на верной функции `fine`. Так бывает,
            когда функцию изменили под ожидание. Или в программе есть ещё одна функция `test_…`,
            которую никто не вызывает: тренажёр проверяет все тесты.
          try: >-
            Верни `fine` как в стартовом коде: она верная. Потом сверь каждое ожидание с таблицей и
            правилом из условия — про потолок 300 не забудь.
        - id: no-test-function
          when:
            failedTest: t-has
            codeRegex: '(?<![\s\S])(?![\s\S]*^def\s+test_)'
          why: >-
            Тренажёр ищет тесты по имени: это функции, чьё имя начинается с `test_`. Такой функции
            в программе нет, поэтому проверять тренажёру нечего.
          try: >-
            Собери проверки в функцию `test_fine()` — с отступом внутри неё — и вызови её внизу.
            Если проверки уже в функции, переименуй её в `test_fine`.
        - id: no-assert
          when:
            codeRegex: '(?<![\s\S])(?![\s\S]*\bassert\b)'
            failedTest: t-m-cap
          why: >-
            В программе нет ни одного `assert`. `print` только показывает результат сравнения, а
            упасть тест может только на assert. Поэтому такой тест не замечает ни одной ошибки в
            функции.
          try: Замени каждое `print(вызов == ожидание)` на `assert вызов == ожидание`.
        - id: print-test-call
          when:
            failedTest: t-io
            codeRegex: '^[ \t]*print\(\s*test_'
          why: >-
            Тест ничего не возвращает, поэтому `print(test_fine())` печатает `None` — как любая
            функция без `return` (урок 5.3). В выводе появилась лишняя строка.
          try: >-
            Вызови тест без `print`, просто `test_fine()`. Что все проверки прошли, скажет
            следующая строка — «Все тесты прошли».
        - id: bare-compare
          when:
            codeRegex: '^[ \t]*fine\([^\n]*=='
            outputIncludes: тесты прошли
          why: >-
            В тесте есть сравнение без слова `assert`. Такая строка вычисляет `True` или `False`
            и тут же забывает результат: упасть она не может, поэтому ошибку в функции не заметит.
          try: Начни каждую такую строку со слова `assert`.
        - id: missed-cap
          when:
            failedTest: t-m-cap
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, где штраф растёт без ограничения. Значит, ни одна
            проверка не берёт просрочку, при которой без потолка штраф был бы больше 300 рублей.
          try: Какая строка таблицы проверяет долгую просрочку? Есть ли для неё `assert`?
        - id: missed-negative
          when:
            failedTest: t-m-negative
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, где за книгу, возвращённую раньше срока, получается
            отрицательный штраф.
          try: Какая строка таблицы проверяет возврат раньше срока? Добавь для неё `assert`.
        - id: missed-rate
          when:
            failedTest: t-m-rate
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, где день просрочки стоит 20 рублей вместо 15. Значит,
            ни одна проверка не смотрит на обычную просрочку, где штраф ещё меньше потолка.
          try: Какая строка таблицы проверяет обычную просрочку? Добавь для неё `assert`.
        - id: print-before-call
          when:
            failedTest: t-order
            outputIncludes: тесты прошли
          why: >-
            Строка «Все тесты прошли» стоит раньше вызова теста. Она печатается до проверок,
            поэтому сообщит об успехе, даже если тест потом упадёт.
          try: Поставь `print` с «Все тесты прошли» ниже строки, где вызван тест.
        - id: no-call
          when:
            failedRule: r-call
          why: >-
            В программе нет вызова `test_fine()`. Функция выполняется только при вызове, поэтому
            при запуске ни одна проверка не сработала.
          try: >-
            Проверь, что тестовая функция называется именно `test_fine`, и вызови её внизу
            программы, перед `print`, — с круглыми скобками.
          verify: 'Нажми «Проверить»: требование к коду должно выполниться.'
      afterPass: >-
        Таблица библиотекаря стала тестом: теперь её сверяет Python. Одно улучшение: добавь к
        проверкам сообщения через запятую, без общих скобок, например
        `assert fine(25) == 300, "25 дней: не больше 300"`. Тогда упавшая проверка сама скажет,
        какая строка таблицы нарушена.
      skills: [assert-checks]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`assert условие` молчит, если условие верно, и останавливает программу с AssertionError, если нет. Сообщение после запятой объясняет, что пошло не так."
      - "Тест — функция `test_…` без параметров: в ней assert сравнивают результат функции с ожиданием, посчитанным по условию. Тест нужно вызвать, а итог печатать после вызова."
      - "assert видит то, что функция вернула, а не то, что она напечатала: функция, которая печатает результат вместо `return`, отдаёт `None`."
      - Упавший тест значит, что код и ожидание разошлись. Кто прав, решает условие задачи.
    question: >-
      По условию заказ от 1500 рублей включительно доставляют бесплатно. Тест
      `assert delivery_cost(1500) == 0` упал: функция вернула 300. Кого исправлять — функцию или
      тест?
    answer: >-
      Функцию. По условию заказ ровно на 1500 рублей уже бесплатный, значит, ожидание 0 верное, а
      функция ошиблась — скорее всего, в ней `>` вместо `>=`. В прогнозе было наоборот: там
      ошибся тест. Кто прав, каждый раз решает условие задачи, а не то, что вернула функция.
