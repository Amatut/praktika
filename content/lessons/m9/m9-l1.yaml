          try: >-
            У самого теста параметров нет: все данные — внутри него. Вспомогательную функцию с
            параметрами назови без `test_` в начале, например `check(order_total, expected)`.
        - id: wrong-expectation
          when:
            errorType: AssertionError
          why: >-
            Тест упал при запуске: функция вернула одно число, а в assert справа записано другое.
            Функция в стартовом коде верная, поэтому ошибка, скорее всего, в ожидании.
          try: >-
            Найди строку, на которой остановилась программа, и пересчитай ожидание по правилу
            «от 1500 рублей включительно — бесплатно». Если ожидание верное, а функцию ты менял,
            верни её из стартового кода.
          verify: После запуска должна появиться строка «Все тесты прошли».
        - id: wrong-expectation-silent
          when:
            failedTest: t-ref
            failedRule: r-call
          why: >-
            Вызова `test_delivery_cost()` в программе нет, поэтому при запуске проверки не
            выполнялись, а «Все тесты прошли» напечаталось просто так. Тренажёр вызвал тест сам, и
            на верной функции одна из проверок упала: ожидание не совпадает с правилом доставки.
          try: >-
            Вызови тест перед `print` и запусти программу: Python сам покажет строку с неверным
            ожиданием. Пересчитай его по правилу «от 1500 рублей включительно — бесплатно».
        - id: changed-function
          when:
            failedTest: t-ref
            outputIncludes: тесты прошли
          why: >-
            Твой тест проходит в твоей программе, но падает на верной функции `delivery_cost`. Так
            бывает, когда функцию изменили под ожидание. Или в программе есть ещё одна функция
            `test_…`, которую никто не вызывает: тренажёр проверяет все тесты.
          try: >-
            Верни `delivery_cost` как в стартовом коде: она верная. Потом сверь каждое ожидание с
            правилом «от 1500 рублей включительно — бесплатно».
        - id: top-level-asserts
          when:
            codeRegex: '^assert '
            failedTest: t-m-threshold
            outputIncludes: тесты прошли
          why: >-
            Часть проверок стоит вне тестовой функции, на верхнем уровне программы. Они
            выполнятся один раз при запуске, но в тест не войдут: вызов `test_delivery_cost()`
            их не запустит.
          try: Перенеси эти строки внутрь `test_delivery_cost` — с отступом, под готовой проверкой.
        - id: print-test-call
          when:
            failedTest: t-io
            codeRegex: '^[ \t]*print\(\s*test_'
          why: >-
            Тест ничего не возвращает, поэтому `print(test_delivery_cost())` печатает `None` — как
            любая функция без `return` (урок 5.3). В выводе появилась лишняя строка.
          try: >-
            Вызови тест без `print`, просто `test_delivery_cost()`. Что все проверки прошли, скажет
            следующая строка — «Все тесты прошли».
        - id: prints-left
          when:
            failedTest: t-io
            codeRegex: '^print\(delivery_cost'
          why: >-
            Ручные проверки через `print` остались. Программа печатает лишние числа, и их снова
            приходится сверять глазами. Эту работу должен делать тест.
          try: >-
            Перенеси каждую ручную проверку в `test_delivery_cost` как `assert`, а строки
            `print(delivery_cost(…))` удали.
        - id: bare-compare
          when:
            codeRegex: '^[ \t]*delivery_cost\([^\n]*=='
            outputIncludes: тесты прошли
          why: >-
            В тесте есть сравнение без слова `assert`. Такая строка вычисляет `True` или `False`
            и тут же забывает результат: упасть она не может, поэтому ошибку в функции не заметит.
          try: Начни каждую такую строку со слова `assert`.
        - id: missed-threshold
          when:
            failedTest: t-m-threshold
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, где заказ ровно на 1500 рублей ещё платный. Значит,
            среди assert нет проверки ровно на пороге. `print` такую ошибку не ловит: он только
            показывает число.
          try: Есть ли у тебя `assert` для заказа ровно на пороге? Посмотри на ручные проверки в стартовом коде.
        - id: missed-above
          when:
            failedTest: t-m-above
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, где бесплатна только доставка заказа ровно на 1500
            рублей, а заказ дороже снова платный.
          try: Проверь через `assert` и заказ больше порога — такой есть среди ручных проверок.
        - id: missed-paid
          when:
            failedTest: t-m-paid
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, где доставка бесплатна для любого заказа. Значит,
            среди assert нет проверки заказа дешевле 1500 рублей, за который доставка платная.
          try: Есть ли у тебя `assert` для платной доставки? Такая проверка была в стартовом коде.
        - id: print-before-call
          when:
            failedTest: t-order
            outputIncludes: тесты прошли
          why: >-
            Строка «Все тесты прошли» стоит раньше вызова теста. Она печатается до проверок,
            поэтому сообщит об успехе, даже если тест потом упадёт.
          try: Поставь `print` с «Все тесты прошли» ниже строки, где вызван тест.
        - id: no-call
          when:
            failedRule: r-call
          why: >-
            В программе нет вызова `test_delivery_cost()`. Функция выполняется только при вызове,
            поэтому при запуске ни одна проверка не сработала, а «Все тесты прошли» печатается в
            любом случае.
          try: >-
            Проверь, что тест называется именно `test_delivery_cost`, и вызови его перед `print` —
            с круглыми скобками.
          verify: 'Нажми «Проверить»: требование к коду должно выполниться.'
      afterPass: >-
        Три проверки теперь выполняются сами при каждом запуске, и сверять числа глазами больше не
        нужно. Одно улучшение: добавь к проверке на пороге сообщение через запятую, без общих
        скобок: `assert delivery_cost(1500) == 0, "ровно 1500 — уже бесплатно"`. Если проверка
        когда-нибудь упадёт, ты сразу поймёшь, какое правило нарушено.
      skills: [assert-checks]

  - id: practice-level
    type: exercise
    title: Практика 2
    exercise:
      id: m9-l1-e2
      kind: modify
      title: Вернуть, а не напечатать
      statement: |-
        В игре уровень зависит от очков: меньше 100 — «новичок», от 100 — «игрок», от 500 —
        «мастер». Функция `level` печатает название уровня, а тест под ней падает, хотя на экране
        верное слово. Запусти программу и убедись сам.

        Что сделать:

        1. Измени функцию так, чтобы она **возвращала** название уровня, а не печатала его.
        2. Добавь в `test_level` по проверке для «игрока» и «мастера».

        Названия уровней пишутся маленькими буквами, как в правилах. Вывод программы — одна
        строка `Все тесты прошли`.
      input: "Ввода нет: тест вызывает функцию напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - Правила уровней не меняй — меняется только то, как функция отдаёт результат.
        - Названия уровней — маленькими буквами, как в правилах.
      starterCode: |
        def level(points):
            if points >= 500:
                print("мастер")
            elif points >= 100:
                print("игрок")
            else:
                print("новичок")


        def test_level():
            assert level(50) == "новичок"
            # Добавь по проверке для «игрока» и «мастера»


        test_level()
        print("Все тесты прошли")
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
          compare:
            ignoreCase: true
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t-call-50
          kind: call
          title: 50 очков
          example: true
          call: level(50)
          expected: "'новичок'"
        - id: t-call-250
          kind: call
          title: 250 очков
          example: true
          call: level(250)
          expected: "'игрок'"
        - id: t-call-100
          kind: call
          title: "Граничный случай: ровно 100 очков"
          edge: true
          call: level(100)
          expected: "'игрок'"
        - id: t-call-500
          kind: call
          title: "Граничный случай: ровно 500 очков"
          edge: true
          call: level(500)
          expected: "'мастер'"
        - id: t-ref
          kind: assert
          title: Тест проходит на верной функции
          code: |
            def _reference(points):
                if points >= 500:
                    return "мастер"
                if points >= 100:
                    return "игрок"
                return "новичок"


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("level")
            globals()["level"] = _reference
            try:
                for _test in _tests:
                    _test()
