      mistakes:
        - id: assign-in-assert
          when:
            errorType: SyntaxError
            errorIncludes: invalid syntax
            codeRegex: '^[ \t]*assert\b(?:[^=\n()]*[^=\n()<>! \t]|[^=\n]*\))[ \t]*=[^=]'
          why: >-
            В assert сравнивают двумя знаками `==`. Один знак `=` — это присваивание, а внутри
            assert оно запрещено, поэтому Python не может даже запустить программу.
          try: Поставь в этой строке `==` вместо `=`.
          verify: Ошибка SyntaxError должна исчезнуть.
        - id: wrong-expectation
          when:
            errorType: AssertionError
          why: >-
            Тест упал на верной функции — значит, не совпадает одно из ожиданий. Чаще всего
            ошибаются в подсчёте символов, ставят один символ «…» вместо трёх точек или путают
            границу: в тексте ровно limit символов — это «не больше limit», поэтому он не
            обрезается.
          try: >-
            Найди строку, на которой остановилась программа, и проверь длины в «Запустить»,
            например `print(len("Встреча в..."))` — выйдет 12. У текста для границы длина должна
            быть ровно limit, у ожидания для длинного текста — тоже. Если ты менял саму `preview`,
            сначала верни её к исходному виду.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: test-with-params
          when:
            failedTest: t-ref
            errorType: TypeError
            codeRegex: '^def test_\w*\([ \t]*[A-Za-z_]'
          where: Строка `def test_…(…)` с параметрами в скобках
          why: >-
            Тренажёр сам вызывает каждую функцию, имя которой начинается с `test_`, — без
            аргументов (так же потом будет делать pytest). У твоей тестовой функции есть параметры,
            поэтому такой вызов падает с TypeError, хотя «Запустить» работает.
          try: >-
            Оставь у функций `test_…` пустые скобки и перенеси проверки внутрь. Помощницу с
            параметрами назови без `test_`, например `check(text, limit, expected)`, или собери
            случаи в таблицу и перебери их циклом внутри теста.
          verify: Тест «Тесты проходят на верной функции» должен стать зелёным.
        - id: wrong-expectation-silent
          when:
            failedTest: t-ref
            outputIncludes: тесты прошли
          why: >-
            Программа печатает «Все тесты прошли», но тренажёр вызвал все твои функции test_… на
            верной функции, и одна проверка упала. Значит, ожидание в ней неверное, а при запуске
            этого не видно: либо эта функция test_… не вызывается, либо сама `preview` изменена и
            подстроилась под неверное ожидание.
          try: >-
            Верни функцию к исходному виду и вызови каждую функцию test_… перед строкой с print —
            тогда «Запустить» покажет, какая проверка падает. Потом пересчитай её ожидание по
            правилу: текст ровно в limit символов не обрезается.
          verify: Тест «Тесты проходят на верной функции» должен стать зелёным.
        - id: no-test-function
          when:
            failedTest: t-has
            outputIncludes: тесты прошли
          why: >-
            Тренажёр ищет тесты по имени: это функции, имя которых начинается с `test_`. Проверки
            на верхнем уровне программы или в функции с другим именем он не найдёт и не сможет
            вызвать на версиях с ошибками.
          try: Собери проверки в функцию `def test_…():`, вызови её, а потом выведи «Все тесты прошли».
          verify: Тест «Есть тестовая функция» должен стать зелёным.
        - id: not-called
          when:
            failedTest: t-called
            outputIncludes: тесты прошли
          why: >-
            Функция test_… объявлена, но нигде не вызывается. Программа печатает «Все тесты
            прошли», хотя проверки при запуске не выполнялись, — объявить тест мало.
          try: Вызови каждую тестовую функцию перед строкой с print.
          verify: Тест «Каждая функция test_… вызывается в программе» должен стать зелёным.
        - id: extra-output
          when:
            failedTest: t-io
            outputIncludes: тесты прошли
          why: >-
            Вывод должен состоять ровно из строки «Все тесты прошли», а в нём есть что-то ещё:
            лишние строки или знаки. Assert сам сравнивает значения, поэтому печатать результаты
            функции не нужно — иначе их снова придётся сверять глазами.
          try: >-
            Если печатаешь сравнение `print(… == …)`, замени его на assert внутри теста. Остальные
            лишние print убери, а в последней строке оставь только текст «Все тесты прошли».
          verify: Тест «Вывод программы» должен стать зелёным.
        - id: self-compare
          when:
            codeRegex: '^[ \t]*assert[ \t]+(\w+\(.*\))[ \t]*==[ \t]*\1[ \t]*(?:,.*)?$'
            outputIncludes: тесты прошли
          why: >-
            В проверке функция сравнивается сама с собой: слева и справа один и тот же вызов. Такой
            assert не упадёт никогда — ни на верной функции, ни на версии с ошибкой.
          try: >-
            Справа запиши готовую строку, посчитанную по правилу, — как `"Встреча в..."` для
            `preview("Встреча в 18:00 у входа", 12)`.
          verify: Все тесты «Тесты замечают ошибку…» должны стать зелёными.
        - id: top-level-asserts
          when:
            codeRegex: '^(?:assert\b|(?:for|if|while)\b.*:[ \t]*\n(?:[ \t]+.*\n|[ \t]*\n)*?[ \t]+assert\b)'
            outputIncludes: тесты прошли
          why: >-
            Часть проверок стоит вне тестовой функции: на верхнем уровне программы, в цикле или в
            блоке `if __name__ == "__main__":`. При запуске они выполняются, но тренажёр вызывает
            на версиях с ошибками только функции test_…, а этих проверок там нет.
          try: >-
            Перенеси строки с assert внутрь своей функции test_… — с отступом. Снаружи оставь
            только вызовы тестов и print.
          verify: Все тесты «Тесты замечают ошибку…» должны стать зелёными.
        - id: missed-short
          when:
            failedTest: t-m-short
            outputIncludes: тесты прошли
          why: >-
            Тесты не заметили версию функции, которая обрезает и добавляет точки к любому тексту.
            Похоже, все твои проверки — про длинный текст, а что функция делает с коротким, пока
            не проверено.
          try: Добавь текст короче limit и пустой текст. Что функция должна вернуть для каждого?
          verify: Тест «Тесты замечают ошибку — точки добавляются к любому тексту» должен стать зелёным.
        - id: missed-exact
          when:
            failedTest: t-m-exact
            outputIncludes: тесты прошли
          why: >-
            Тесты не заметили версию функции с `<` вместо `<=`: она обрезает текст, в котором
            ровно limit символов. Это граница правила, и видно ошибку только на ней.
          try: Добавь проверку, где длина текста в точности равна limit.
          verify: Тест «Тесты замечают ошибку — текст ровно в limit символов обрезается» должен стать зелёным.
        - id: missed-long
          when:
            failedTest: t-m-long
            outputIncludes: тесты прошли
          why: >-
            Тесты не заметили версию функции, которая оставляет limit символов и добавляет точки
            сверх них: превью выходит длиннее экрана. Обрезку длинного текста твой набор пока не
            проверяет.
          try: Добавь текст длиннее limit и точное ожидание — ровно limit символов вместе с точками.
          verify: Тест «Тесты замечают ошибку — превью длиннее limit» должен стать зелёным.
      afterPass: >-
        Ты сам нашёл границу в правиле, записанном словами: «не больше limit» включает текст ровно
        в limit символов. Улучшение: для длинного текста добавь ещё и проверку длины,
        `assert len(preview("Встреча в 18:00 у входа", 12)) == 12`, — она не зависит от того,
        верно ли ты посчитал буквы в ожидании.
      skills: [edge-cases, assert-checks, string-methods]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Обычные (нормальные) случаи — по одному представителю из каждой группы входов, где функция ведёт себя одинаково.
      - "Границы — сам порог и соседнее значение с другой стороны: порог ловит `>` вместо `>=`, сосед — порог, сдвинутый на единицу."
      - "Особые входы: ноль, пусто, один элемент, край списка — на них код ломается чаще всего. Вместе с границами это граничные случаи."
      - Ожидание — готовое значение по условию, а не копия формулы из кода. Хороший набор замечает каждого мутанта.
    question: >-
      Функция `average(marks)` возвращает средний балл по списку оценок. Назови три особых входа,
      которые ты проверишь, и что ожидаешь для каждого.
    answer: >-
      Один элемент: `[5]` → 5, среднее равно самой оценке. Все одинаковые: `[4, 4, 4]` → 4. Пустой
      список `[]`: формула «сумма, делённая на количество» поделит на ноль и упадёт с
      ZeroDivisionError. Что функция должна вернуть в этом случае, решает условие задачи. Если в
      условии об этом ничего нет, это вопрос к автору правила, а не повод угадывать. Такие вопросы
      всплывают, когда подбираешь граничные случаи, — ещё до первого запуска.
