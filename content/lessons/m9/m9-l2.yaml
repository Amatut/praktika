  - id: practice-streak
    type: exercise
    title: Практика 2
    exercise:
      id: m9-l2-e2
      kind: modify
      title: Лучшая серия тренировок
      statement: |-
        В приложении для тренировок есть значок «Лучшая серия» — самое большое число дней подряд,
        когда человек тренировался. Функция `best_streak(minutes)` получает список минут по дням:
        `0` — день без тренировки, любое число больше нуля — тренировка была. Функция написана
        верно.

        В тесте два удобных случая: в обоих после самой длинной серии ещё идёт день без
        тренировки. Добавь особые входы, которые встречаются у настоящих пользователей:

        - серия в самом конце списка длиннее всех остальных — человек тренируется до сих пор;
        - пустой список — новый пользователь, записей ещё нет;
        - дни в списке есть, но ни одной тренировки — только нули.

        Ожидания посчитай сам, по правилу. Тренажёр проверит тест на верной функции и на трёх её
        версиях с ошибками, которые удобные примеры не замечают.
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - Функцию `best_streak` не меняй — она верная.
        - Ожидание пиши готовым числом, посчитанным вручную.
      starterCode: |
        def best_streak(minutes):
            best = 0
            current = 0
            for m in minutes:
                if m > 0:
                    current += 1
                    if current > best:
                        best = current
                else:
                    current = 0
            return best


        def test_best_streak():
            assert best_streak([30, 45, 0, 20]) == 2
            assert best_streak([0, 15, 0, 40, 25, 30, 0]) == 3
            # добавь особые входы


        test_best_streak()
        print("Все тесты прошли")
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
        - id: t-ref
          kind: assert
          title: Тест проходит на верной функции
          example: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _reference(minutes):
                best = 0
                current = 0
                for m in minutes:
                    if m > 0:
                        current += 1
                        if current > best:
                            best = current
                    else:
                        current = 0
                return best


            _saved = best_streak
            best_streak = _reference
            try:
                for _test in _tests:
                    _test()
            finally:
                best_streak = _saved
          message: >-
            Все проверки должны проходить на верной функции: ожидания считаются по правилу серии.
        - id: t-called
          kind: assert
          title: Каждая функция test_… вызывается в программе
          code: |-
            import ast

            _tree = ast.parse(open(__file__, encoding="utf-8").read())
            _defined = [node.name for node in ast.walk(_tree)
                        if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")]
            _used = [node.id for node in ast.walk(_tree)
                     if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load)]
            assert all(name in _used for name in _defined)
          message: >-
            Одна из функций test_… нигде не вызывается — при запуске её проверки не выполняются.
        - id: t-m-last
          kind: assert
          title: "Тест замечает ошибку — последняя серия не учитывается"
          edge: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _mutant(minutes):
                best = 0
                current = 0
                for m in minutes:
                    if m > 0:
                        current += 1
                    else:
                        if current > best:
                            best = current
                        current = 0
                return best


            def _caught():
                for test in _tests:
                    try:
                        test()
                    except Exception:
                        return True
                return False


            _saved = best_streak
            best_streak = _mutant
            try:
                _result = _caught()
            finally:
                best_streak = _saved
            assert _result
          message: >-
            Тест не заметил версию функции, которая забывает серию в самом конце списка.
        - id: t-m-empty
          kind: assert
          title: "Тест замечает ошибку — падение на пустом списке"
          edge: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _mutant(minutes):
                if minutes[0] > 0:
                    current = 1
                else:
                    current = 0
                best = current
                for m in minutes[1:]:
                    if m > 0:
                        current += 1
                    else:
                        current = 0
                    if current > best:
                        best = current
                return best


            def _caught():
                for test in _tests:
                    try:
                        test()
                    except Exception:
                        return True
                return False


            _saved = best_streak
            best_streak = _mutant
            try:
                _result = _caught()
            finally:
                best_streak = _saved
            assert _result
          message: >-
            Тест не заметил версию функции, которая падает с ошибкой, когда записей ещё нет.
        - id: t-m-zeros
          kind: assert
          title: "Тест замечает ошибку — серия 1 без единой тренировки"
          edge: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _mutant(minutes):
                if len(minutes) == 0:
                    return 0
                best = 1
                current = 0
                for m in minutes:
                    if m > 0:
                        current += 1
                        if current > best:
                            best = current
                    else:
                        current = 0
                return best


            def _caught():
                for test in _tests:
                    try:
                        test()
                    except Exception:
                        return True
                return False


            _saved = best_streak
            best_streak = _mutant
            try:
                _result = _caught()
            finally:
                best_streak = _saved
            assert _result
          message: >-
            Тест не заметил версию функции, которая показывает серию 1 человеку без единой тренировки.
      criteria:
        - Тест проходит на верной функции — ожидания посчитаны вручную по правилу серии.
        - >-
          В тесте есть серия в самом конце списка, которая длиннее остальных, пустой список и
          список из одних нулей.
