          нули). А край списка у `max_steps(steps)` (самый активный день) проверяют так, чтобы
          ответ давал именно последний день: `max_steps([3000, 5000, 9000]) == 9000`. Если
          функция «забудет» последний день, она вернёт 5000, и тест это заметит. Ожидания берут из
          смысла задачи, а не из запуска функции.
