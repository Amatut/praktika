      mistakes:
        - id: assign-in-assert
          when:
            errorType: SyntaxError
            errorIncludes: invalid syntax
            codeRegex: '^[ \t]*assert\b(?:[^=\n()]*[^=\n()<>! \t]|[^=\n]*\))[ \t]*=[^=]'
          why: >-
            В assert сравнивают двумя знаками `==`. Один знак `=` — это присваивание, а внутри
            assert оно запрещено, поэтому Python не может даже запустить программу.
          try: >-
            Поставь в этой строке `==` вместо `=` — как в готовых проверках, например
            `discount_percent(5) == 10`.
          verify: Ошибка SyntaxError должна исчезнуть.
        - id: wrong-expectation
          when:
            errorType: AssertionError
          why: >-
            Тест упал на верной функции: функция здесь написана правильно, значит, не совпадает
            одно из ожиданий. Чаще всего путают, входит ли сам порог: «от 3» и «от 10» включают
            сами 3 и 10. Бывает, что ожидание перенесено с другого порога: от 3 до 9 тетрадей
            скидка 10 %, а не 0.
          try: >-
            Найди строку, на которой остановилась программа, и заново посчитай ожидание по
            правилам скидки, не глядя в код. Если ты менял саму `discount_percent`, чтобы
            проверить тест, сначала верни её к исходному виду.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: test-with-params
          when:
            failedTest: t-ref
            errorType: TypeError
            codeRegex: '^def test_\w*\([ \t]*[A-Za-z_]'
          where: Строка `def test_…(…)` с параметрами в скобках
          why: >-
            Тренажёр сам вызывает каждую функцию, имя которой начинается с `test_`, — без
            аргументов (так же потом будет делать pytest). У твоей тестовой функции есть параметры,
            поэтому такой вызов падает с TypeError, хотя «Запустить» работает.
          try: >-
            Оставь у функций `test_…` пустые скобки. Помощницу с параметрами назови без `test_`,
            например `check(count, expected)`, и вызывай её из `test_discount_percent`.
          verify: Тест «Тест проходит на верной функции» должен стать зелёным.
        - id: wrong-expectation-silent
          when:
            failedTest: t-ref
            outputIncludes: тесты прошли
          why: >-
            Программа печатает «Все тесты прошли», но тренажёр вызвал все твои функции test_… на
            верной функции, и одна проверка упала. Значит, ожидание в ней не совпадает с правилами
            скидки, а при запуске этого не видно: либо эта функция test_… не вызывается, либо сама
            `discount_percent` изменена и подстроилась под неверное ожидание.
          try: >-
            Верни функцию к исходному виду и вызови каждую функцию test_… перед строкой с print —
            тогда «Запустить» покажет, какая проверка падает. Потом сверь её ожидание с правилами:
            «от 3» и «от 10» включают сами пороги.
          verify: Тест «Тест проходит на верной функции» должен стать зелёным.
        - id: not-called
          when:
