id: m9-l2
module: m9
number: "9.2"
title: Нормальные и граничные случаи
objective: >-
  Подбирать набор тестов из нормальных и граничных случаев (порог и соседнее значение, ноль,
  пустые данные, один элемент, край списка), который ловит ошибки, пропущенные удобными примерами.
minutes: [25, 30]
prerequisites: [m9-l1, m2-l5]
skills: [edge-cases, assert-checks, boundary-checks]
environment: python

story:
  title: Ровно 75 баллов
  fictional: true
  text: >-
    Учитель информатики Павел Сергеевич написал программу для школьной олимпиады: по баллам она
    решает, кому положен диплом, а по правилам диплом дают от 75 баллов. Он даже написал тест с
    тремя проверками — на работах в 90, 60 и 82 балла, — и тот проходил. После награждения к нему
    подошла Алиса: у неё ровно 75, а в списке она значилась «без диплома». В коде стояло
    `> 75` вместо `>= 75`, а ни одна проверка не касалась самого порога. С тех пор в каждом тесте
    Павла Сергеевича есть порог и соседнее с ним значение.

why: >-
  Ошибки чаще всего прячутся не в обычных значениях, а на краях: ровно на пороге, в пустом списке,
  в последнем элементе. Например, тесты на 90 и 60 баллов проходят, а ученица с ровно 75 баллами
  остаётся без диплома.

usedIn: >-
  Подбор групп случаев и граничных значений — базовая техника тестировщиков (QA) и разработчиков:
  так составляют проверки для форм, тарифов, скидок и расчётов. Иногда так проверяют и сами тесты:
  подставляют в код ошибки-«мутанты» и смотрят, заметят ли их тесты. Это называют мутационным
  тестированием, для него есть готовые инструменты.

steps:
  - id: cases
    type: theory
    title: Какие случаи проверять
    body: |-
      В уроке 9.1 ручные проверки стали assert. Но тест ловит только те ошибки, до которых
      дотягиваются его случаи. «Тест прошёл» значит одно: **на этих входах** функция ответила
      верно. Поэтому главный вопрос — какие входы взять.

      **Обычные случаи.** Все входы не перебрать. Их делят на группы (классы), внутри которых
      функция ведёт себя одинаково, и из каждой берут одного представителя — это обычные, или
      нормальные, случаи. Билет в зоопарк: младше 7 лет — бесплатно, с 7 до 17 включительно —
      детский, с 18 — взрослый. Групп три — значит, хватит трёх возрастов: 4, 12 и 35.

      **Границы.** Граница — значение, где одна группа сменяется другой. Как в уроке 2.5,
      проверяют сам порог и соседа с другой стороны: для правила «от 75 баллов» — 75 и 74. Сам
      порог ловит `>` вместо `>=` — на 90 и на 40 верная и ошибочная версии отвечают одинаково.
      Сосед ловит порог, сдвинутый на единицу.

      **Особые входы** — то, на чём код ломается чаще всего:

      - ноль;
      - пустая строка или пустой список;
      - один элемент;
      - все элементы одинаковые;
      - первый и последний элемент — край списка;
      - очень большое значение.

      Код со списком легко теряет последний элемент или падает на пустом списке: например,
      подводит итог только при каком-то условии внутри цикла или ещё до цикла берёт первый
      элемент.
      Границы и особые входы вместе называют **граничными случаями**. Неверный ввод, например
      текст вместо числа, — тема урока 9.4.

      **Ожидание — готовое число.** Тест
      `assert final_price(1000) == 1000 - 1000 * 10 // 100` повторяет формулу из кода. Если
      формула в коде неверна, тест ошибётся точно так же и пройдёт. Пиши число, посчитанное по
      условию: `== 900`.

      **Мутант** — версия функции с одной подставленной ошибкой: `>` вместо `>=`, забытый
      последний элемент списка, лишнее условие. Хороший набор тестов замечает каждого мутанта.
      Так тренажёр и проверяет твои тесты: вызывает каждую функцию `test_…` без аргументов
      сначала с верной функцией — все проверки должны пройти, — потом с каждым мутантом: на
      каждом должна упасть хотя бы одна проверка. Засчитывается любое падение — и на assert, и
      на другой ошибке.

      Удобный порядок набора: обычные случаи → границы → особые входы, с коротким комментарием
      над каждой группой.

      Частое заблуждение — «чем больше тестов, тем лучше». Десять проверок из середины диапазона
      ловят меньше ошибок, чем две на границе.
    simpler: >-
      Проверяй не там, где удобно, а там, где страшно: ровно на пороге и рядом с ним, на пустом
      списке, на нуле, на одном элементе, на конце списка. А ожидаемый ответ пиши готовым числом
      по условию задачи — не переписывай формулу из кода.
    coach: >-
      Для каждого «если» в условии задачи спроси себя: какое значение ровно на этой границе и
      какое рядом с ней?

  - id: ticket-test
    type: example
    title: Тест для цены билета
    body: |-
      Правила зоопарка: детям младше 7 лет вход бесплатный, с 7 до 17 лет включительно — детский
      билет за 150, с 18 лет — взрослый за 300. Тест собран по группам: обычные случаи, границы,
      особый вход. Комментарии над группами — для человека, Python их пропускает.
    code: |-
      def ticket_price(age):
          if age < 7:
              return 0
          if age < 18:
              return 150
          return 300


      def test_ticket_price():
          # обычные случаи — по одному из каждой группы
          assert ticket_price(4) == 0
          assert ticket_price(12) == 150
          assert ticket_price(35) == 300
          # границы: последний возраст группы и первый — следующей
          assert ticket_price(6) == 0
          assert ticket_price(7) == 150
          assert ticket_price(17) == 150
          assert ticket_price(18) == 300
          # особый вход: малыш, которому ещё нет года
          assert ticket_price(0) == 0


      test_ticket_price()
      print("Все тесты прошли")
    notes:
      - line: 10
        text: >-
          Обычные случаи: по одному возрасту из каждой группы — малыш, школьник, взрослый.
          Больше проверок из середины групп ничего нового бы не поймали.
      - line: 14
        text: >-
          Границы: у каждого порога два значения — последний возраст одной группы и первый
          возраст следующей. Ожидания взяты из правил зоопарка, а не из кода.
      - line: 19
        text: >-
          Особый вход — ноль: малышу нет и года. О таких входах легко забыть, а код на них иногда
          отвечает неожиданно.
      - line: 23
        text: Тест нужно вызвать, иначе проверки не выполнятся — это ты помнишь по уроку 9.1.
    tryIt: >-
      Замени в функции `age < 18` на `age <= 18` и запусти. Какой assert остановил программу?
      Теперь поставь `#` в начале четырёх строк с границами и запусти снова: заметил бы тест
      ошибку без них? Потом верни всё как было.
    coach: >-
      Смотри не на число assert, а на то, какие входы они покрывают: восемь проверок здесь — это
      три группы, две границы по два значения и один особый вход.

  - id: diploma-boundary
    type: predict
    title: 75 баллов — диплом?
    prompt: >-
      По правилам олимпиады диплом дают от 75 баллов. К функции уже есть тест, и в нём есть даже
      значение рядом с порогом — 76. Как думаешь, что напечатает программа?
    code: |-
      def diploma(points):
          if points > 75:
              return "диплом"
          return "без диплома"


      def test_diploma():
          assert diploma(90) == "диплом"
          assert diploma(76) == "диплом"
          assert diploma(40) == "без диплома"


      test_diploma()
      print("Все тесты прошли")
      print("75:", diploma(75))
    options:
      - |-
        Все тесты прошли
        75: диплом
      - |-
        Все тесты прошли
        75: без диплома
      - Ничего — тест упадёт с AssertionError
    answer: |-
      Все тесты прошли
      75: без диплома
    explanation: >-
      Все три assert верны: 90 и 76 больше 75, а 40 — нет, поэтому тест проходит и печатается «Все
      тесты прошли». Но для 75 условие `points > 75` ложно, и функция отвечает «без диплома», хотя
      по правилам диплом положен. 76 стоит рядом с порогом, но с той же стороны, что и 90: там `>`
      и `>=` отвечают одинаково. Ошибку видно только на самом пороге. Добавь в тест
      `assert diploma(75) == "диплом"` — и он упадёт, как и должен.
    coach: >-
      Зелёный тест значит «на этих входах всё верно», а не «ошибок нет».

  - id: copy-of-code
    type: quiz
    title: Какой тест заметит опечатку?
    question: >-
      По условию скидка — 10 %. В функции опечатка, лишний ноль:
      `return price - price * 10 // 1000`. Разработчик написал три теста. Какой из них заметит
      ошибку?
    options:
      - "`assert final_price(1000) == 1000 - 1000 * 10 // 1000`"
      - "`assert final_price(1000) == 900`"
      - "`assert final_price(1000) == final_price(1000)`"
    correct: 1
    explanation: >-
      Со скидкой 10 % заказ за 1000 должен стоить 900, а функция с опечаткой вернёт 990. Первый
      тест переписал формулу из кода вместе с опечаткой: слева 990 и справа 990 — тест проходит.
      Третий сравнивает функцию саму с собой и не упадёт никогда. Только второй сравнивает
      результат с числом, посчитанным по условию, и падает: 990 не равно 900.
    coach: >-
      Ожидание в тесте — второе, независимое мнение. Если взять его из кода, второго мнения не
      остаётся.

  - id: practice-discount
    type: exercise
    title: Практика 1
    exercise:
      id: m9-l2-e1
      kind: repeat
      title: Скидка на тетради
      statement: |-
        В магазине канцтоваров скидка зависит от числа тетрадей в заказе: **от 3 тетрадей — 10 %,
        от 10 тетрадей — 20 %** (оба порога включительно). Функция `discount_percent(count)`
        возвращает процент скидки и написана верно.

        В тесте уже есть три обычных случая. Добавь в `test_discount_percent` границы: у каждого
        порога — по два значения, последнее количество перед порогом и сам порог, как в примере с
        билетами. Ожидания посчитай по правилам скидки.

        Тренажёр проверит тест на верной функции и на четырёх её версиях с ошибками на порогах —
        каждую версию тест должен заметить.
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - Функцию `discount_percent` не меняй — она верная.
        - Ожидание пиши готовым числом по правилам скидки.
      starterCode: |
        def discount_percent(count):
            # от 3 тетрадей — скидка 10 %, от 10 тетрадей — 20 %
            if count >= 10:
                return 20
            if count >= 3:
                return 10
            return 0


        def test_discount_percent():
            # обычные случаи уже есть
            assert discount_percent(1) == 0
            assert discount_percent(5) == 10
            assert discount_percent(15) == 20
            # добавь границы: по два значения у каждого порога


        test_discount_percent()
        print("Все тесты прошли")
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
        - id: t-ref
          kind: assert
          title: Тест проходит на верной функции
          example: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _reference(count):
                if count >= 10:
                    return 20
                if count >= 3:
                    return 10
                return 0


            _saved = discount_percent
            discount_percent = _reference
            try:
                for _test in _tests:
                    _test()
            finally:
                discount_percent = _saved
          message: >-
            Все проверки должны проходить на верной функции: ожидания считаются по правилам скидки.
        - id: t-called
          kind: assert
          title: Каждая функция test_… вызывается в программе
          code: |-
            import ast

            _tree = ast.parse(open(__file__, encoding="utf-8").read())
            _defined = [node.name for node in ast.walk(_tree)
                        if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")]
            _used = [node.id for node in ast.walk(_tree)
                     if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load)]
            assert all(name in _used for name in _defined)
          message: >-
            Одна из функций test_… нигде не вызывается — при запуске её проверки не выполняются.
        - id: t-m-3
          kind: assert
          title: "Тест замечает ошибку — скидка 10 % только с 4 тетрадей"
          edge: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _mutant(count):
                if count >= 10:
                    return 20
                if count > 3:
                    return 10
                return 0


            def _caught():
                for test in _tests:
                    try:
                        test()
                    except Exception:
                        return True
                return False


            _saved = discount_percent
            discount_percent = _mutant
            try:
                _result = _caught()
            finally:
                discount_percent = _saved
            assert _result
          message: >-
            Тест не заметил версию функции, где за 3 тетради скидки нет.
        - id: t-m-2
          kind: assert
          title: "Тест замечает ошибку — скидка 10 % уже с 2 тетрадей"
          edge: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _mutant(count):
                if count >= 10:
                    return 20
                if count >= 2:
                    return 10
                return 0


            def _caught():
                for test in _tests:
                    try:
                        test()
                    except Exception:
                        return True
                return False


            _saved = discount_percent
            discount_percent = _mutant
            try:
                _result = _caught()
            finally:
                discount_percent = _saved
            assert _result
          message: >-
            Тест не заметил версию функции, где скидка 10 % даётся уже за 2 тетради.
        - id: t-m-10
          kind: assert
          title: "Тест замечает ошибку — скидка 20 % только с 11 тетрадей"
          edge: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _mutant(count):
                if count > 10:
                    return 20
                if count >= 3:
                    return 10
                return 0


            def _caught():
                for test in _tests:
                    try:
                        test()
                    except Exception:
                        return True
                return False


            _saved = discount_percent
            discount_percent = _mutant
            try:
                _result = _caught()
            finally:
                discount_percent = _saved
            assert _result
          message: >-
            Тест не заметил версию функции, где за 10 тетрадей скидка всё ещё 10 %.
        - id: t-m-9
          kind: assert
          title: "Тест замечает ошибку — скидка 20 % уже с 9 тетрадей"
          edge: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _mutant(count):
                if count >= 9:
                    return 20
                if count >= 3:
                    return 10
                return 0


            def _caught():
                for test in _tests:
                    try:
                        test()
                    except Exception:
                        return True
                return False


            _saved = discount_percent
            discount_percent = _mutant
            try:
                _result = _caught()
            finally:
                discount_percent = _saved
            assert _result
          message: >-
            Тест не заметил версию функции, где скидка 20 % даётся уже за 9 тетрадей.
      criteria:
        - Тест проходит на верной функции — ожидания посчитаны по правилам скидки.
        - >-
          У каждого порога есть две проверки: сам порог и количество перед ним. Поэтому тест
          замечает и `>` вместо `>=`, и порог, сдвинутый на единицу.
        - Тест вызывается, программа печатает «Все тесты прошли».
      hints:
        - >-
          При каких количествах тетрадей функция меняет ответ? Для каждого такого места подумай,
          какое количество стоит прямо на нём и какое — сразу перед ним.
        - >-
          Тот же приём на другой функции: доставка бесплатна от 2000 рублей. Граница — 2000,
          поэтому проверяют сам порог, `free_delivery(2000)`, и последнюю сумму перед ним,
          `free_delivery(1999)`. Ожидания берут из правила: на 2000 доставка уже бесплатная, на
          1999 — ещё нет.
        - |-
          Каркас — четыре строки внутри `test_discount_percent`:
          ```text
          # порог 3: последнее количество перед ним и сам порог
          assert discount_percent(…) == …
          assert discount_percent(…) == …
          # порог 10: последнее количество перед ним и сам порог
          assert discount_percent(…) == …
          assert discount_percent(…) == …
          ```
      solution:
        code: |
          def discount_percent(count):
              # от 3 тетрадей — скидка 10 %, от 10 тетрадей — 20 %
              if count >= 10:
                  return 20
              if count >= 3:
                  return 10
              return 0


          def test_discount_percent():
              # обычные случаи уже есть
              assert discount_percent(1) == 0
              assert discount_percent(5) == 10
              assert discount_percent(15) == 20
              # границы: последнее количество перед порогом и сам порог
              assert discount_percent(2) == 0
              assert discount_percent(3) == 10
              assert discount_percent(9) == 10
              assert discount_percent(10) == 20


          test_discount_percent()
          print("Все тесты прошли")
        explanation: >-
          У функции два порога, 3 и 10, и у каждого две проверки. Проверка на 3 замечает версию с
          `> 3`, а проверка на 2 — версию, где скидка начинается раньше. То же у порога 10: 10 и 9.
          Ожидания взяты из правил: «от 3» и «от 10» включают сами 3 и 10. Если проверять ещё и
          значения после порога (4 и 11), это тоже верно — такой тест просто чуть длиннее.
      altSolutions:
        - code: |
            def discount_percent(count):
                # от 3 тетрадей — скидка 10 %, от 10 тетрадей — 20 %
                if count >= 10:
                    return 20
                if count >= 3:
                    return 10
                return 0


            def test_discount_percent():
                assert discount_percent(1) == 0
                assert discount_percent(5) == 10
                assert discount_percent(15) == 20


            def test_thresholds():
                # порог 3: до него, на нём и после
                assert discount_percent(2) == 0
                assert discount_percent(3) == 10
                assert discount_percent(4) == 10
                # порог 10: до него, на нём и после
                assert discount_percent(9) == 10
                assert discount_percent(10) == 20
                assert discount_percent(11) == 20
                # особый вход: заказ без тетрадей
                assert discount_percent(0) == 0


            test_discount_percent()
            test_thresholds()
            print("Все тесты прошли")
          note: Границы в отдельной функции, по три значения у порога и ноль.
        - code: |
            def discount_percent(count):
