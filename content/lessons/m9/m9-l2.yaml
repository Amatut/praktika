        - id: wrong-expectation
          when:
            errorType: AssertionError
          why: >-
            Тест упал на верной функции: функция здесь написана правильно, значит, не совпадает
            одно из ожиданий.
          try: >-
            Найди строку, на которой остановилась программа, и посчитай серию вручную: это дни
            подряд, где минут больше нуля, а день с нулём серию обрывает. Если тренировок не было
            совсем, сколько дней в самой длинной серии? Если ты менял саму `best_streak`, сначала
            верни её к исходному виду.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: test-with-params
          when:
            failedTest: t-ref
            errorType: TypeError
            codeRegex: '^def test_\w*\([ \t]*[A-Za-z_]'
          where: Строка `def test_…(…)` с параметрами в скобках
          why: >-
            Тренажёр сам вызывает каждую функцию, имя которой начинается с `test_`, — без
            аргументов (так же потом будет делать pytest). У твоей тестовой функции есть параметры,
            поэтому такой вызов падает с TypeError, хотя «Запустить» работает.
          try: >-
            Оставь у функций `test_…` пустые скобки. Помощницу с параметрами назови без `test_`,
            например `check(minutes, expected)`, и вызывай её из `test_best_streak`.
          verify: Тест «Тест проходит на верной функции» должен стать зелёным.
        - id: wrong-expectation-silent
          when:
            failedTest: t-ref
            outputIncludes: тесты прошли
          why: >-
            Программа печатает «Все тесты прошли», но тренажёр вызвал все твои функции test_… на
            верной функции, и одна проверка упала. Значит, ожидание в ней неверное, а при запуске
            этого не видно: либо эта функция test_… не вызывается, либо сама `best_streak`
            изменена и подстроилась под неверное ожидание.
          try: >-
            Верни функцию к исходному виду и вызови каждую функцию test_… перед строкой с print —
            тогда «Запустить» покажет, какая проверка падает. Потом пересчитай её ожидание вручную.
          verify: Тест «Тест проходит на верной функции» должен стать зелёным.
        - id: not-called
          when:
            failedTest: t-called
            outputIncludes: тесты прошли
          why: >-
            Одна из функций test_… объявлена, но нигде не вызывается. Программа печатает «Все
            тесты прошли», хотя её проверки при запуске не выполнялись.
          try: Добавь вызов этой функции рядом с `test_best_streak()`, перед строкой с print.
          verify: Тест «Каждая функция test_… вызывается в программе» должен стать зелёным.
        - id: extra-output
          when:
            failedTest: t-io
            outputIncludes: тесты прошли
          why: >-
            Вывод должен быть ровно одной строкой «Все тесты прошли», а в нём есть что-то ещё.
            `print(...)` только показывает значение и ничего не проверяет: программа идёт дальше,
            даже если напечатано False. Проверяет assert.
          try: >-
            Замени `print(… == …)` на `assert … == …` внутри `test_best_streak`, остальные лишние
            print убери. Последняя строка программы — ровно `print("Все тесты прошли")`.
          verify: Тест «Вывод программы» должен стать зелёным.
        - id: self-compare
          when:
            codeRegex: '^[ \t]*assert[ \t]+(\w+\(.*\))[ \t]*==[ \t]*\1[ \t]*(?:,.*)?$'
            outputIncludes: тесты прошли
          why: >-
            В проверке функция сравнивается сама с собой: слева и справа один и тот же вызов. Такой
            assert не упадёт никогда — ни на верной функции, ни на версии с ошибкой.
          try: >-
            Справа запиши готовое число — длину серии, посчитанную вручную, как в
            `best_streak([30, 45, 0, 20]) == 2`.
          verify: Все тесты «Тест замечает ошибку…» должны стать зелёными.
        - id: top-level-asserts
          when:
            codeRegex: '^(?:assert\b|(?:for|if|while)\b.*:[ \t]*\n(?:[ \t]+.*\n|[ \t]*\n)*?[ \t]+assert\b)'
            outputIncludes: тесты прошли
          why: >-
            Часть проверок стоит вне тестовой функции: на верхнем уровне программы, в цикле или в
            блоке `if __name__ == "__main__":`. При запуске они выполняются, но тренажёр вызывает
            на версиях с ошибками только функции test_…, а этих проверок там нет.
          try: >-
            Перенеси строки с assert внутрь `test_best_streak` — с отступом, как готовые проверки.
            Снаружи оставь только вызовы тестов и print.
          verify: Все тесты «Тест замечает ошибку…» должны стать зелёными.
        - id: missed-last
          when:
            failedTest: t-m-last
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, которая подводит итог серии только на дне без
            тренировки. Если серия идёт до самого конца списка, нуля после неё нет, и такая
            функция её теряет. В твоих списках после лучшей серии всегда стоит ноль, или серия в
            конце не длиннее остальных: тогда ответ даёт другая серия, и ошибка не видна.
          try: Добавь список, где серия в самом конце длиннее всех остальных.
          verify: Тест «Тест замечает ошибку — последняя серия не учитывается» должен стать зелёным.
        - id: missed-empty
          when:
            failedTest: t-m-empty
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, которая сразу берёт первый день списка. У нового
            пользователя записей ещё нет, и такая функция падает с ошибкой.
          try: Добавь проверку для пустого списка. Что должна показать функция человеку без записей?
          verify: Тест «Тест замечает ошибку — падение на пустом списке» должен стать зелёным.
        - id: missed-zeros
          when:
            failedTest: t-m-zeros
            outputIncludes: тесты прошли
          why: >-
            Тест не заметил версию функции, которая начинает счёт лучшей серии с 1. У человека,
            который ещё ни разу не тренировался, она покажет серию в один день.
          try: Добавь список, в котором нет ни одной тренировки, — только дни с нулём.
          verify: Тест «Тест замечает ошибку — серия 1 без единой тренировки» должен стать зелёным.
      afterPass: >-
        Теперь набор ловит классическую ошибку «забыли последнюю серию», которая прячется от
        удобных примеров, и не пропустит падение на пустом списке. Улучшение: если его у тебя ещё
        нет, добавь список из одного дня, `[25]`, — это ещё один край, где начало списка совпадает
        с концом.
      skills: [edge-cases, assert-checks, lists]

  - id: practice-preview
    type: exercise
    title: Практика 3
    exercise:
      id: m9-l2-e3
      kind: write
      title: Превью уведомления на часах
      statement: |-
        На маленьком экране часов уведомление показывается коротко. Функция
        `preview(text, limit)` уже написана и работает верно. Её правило:

        - если в тексте **не больше** `limit` символов, он возвращается как есть;
        - иначе остаются первые `limit - 3` символа и три обычные точки `...` — так, чтобы всего
          вышло ровно `limit` символов.

        Например, `preview("Встреча в 18:00 у входа", 12)` возвращает `"Встреча в..."` — ровно
        12 символов вместе с точками и пробелом.

        Напиши набор тестов с нуля: одну или несколько функций `test_…` с обычными и граничными
        случаями. Вызови их, а последней строкой выведи `Все тесты прошли`. Тренажёр проверит
        набор на верной функции и на трёх её версиях с ошибками — каждую версию набор должен
        заметить.
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - Функцию `preview` не меняй — она верная.
        - Точки в ожидании — три обычные точки `...`, не один символ «…».
        - "`limit` в тестах бери не меньше 4: на экране должна поместиться хотя бы одна буква и точки."
        - Имена тестовых функций выбираешь сам, но они начинаются с `test_`.
        - >-
          Функции `test_…` — без параметров: тренажёр вызывает их сам, без аргументов. Одинаковые
          проверки можно собрать в таблицу и перебрать циклом внутри теста.
      starterCode: |
        def preview(text, limit):
            if len(text) <= limit:
                return text
            return text[:limit - 3] + "..."


        # Напиши одну или несколько функций test_… для preview:
        # обычные случаи, граница, особые входы.

        # Вызови свои тесты, а последней строкой выведи «Все тесты прошли».
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t-has
          kind: assert
          title: Есть тестовая функция
          example: true
          code: |-
            assert [name for name, value in list(globals().items())
                    if name.startswith("test_") and callable(value)]
          message: >-
            Тренажёр ищет тесты по имени: нужна хотя бы одна функция, имя которой начинается с test_.
        - id: t-ref
          kind: assert
          title: Тесты проходят на верной функции
          example: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _reference(text, limit):
                if len(text) <= limit:
                    return text
                return text[:limit - 3] + "..."


            _saved = preview
            preview = _reference
            try:
                for _test in _tests:
                    _test()
            finally:
                preview = _saved
          message: >-
            Все проверки должны проходить на верной функции: ожидания считаются по правилу из
            условия.
        - id: t-called
          kind: assert
          title: Каждая функция test_… вызывается в программе
          code: |-
            import ast

            _tree = ast.parse(open(__file__, encoding="utf-8").read())
            _defined = [node.name for node in ast.walk(_tree)
                        if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")]
            _used = [node.id for node in ast.walk(_tree)
                     if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load)]
            assert all(name in _used for name in _defined)
          message: >-
            Одна из функций test_… нигде не вызывается — при запуске её проверки не выполняются.
        - id: t-m-short
          kind: assert
          title: "Тесты замечают ошибку — точки добавляются к любому тексту"
          edge: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _mutant(text, limit):
                return text[:limit - 3] + "..."


            def _caught():
                for test in _tests:
                    try:
                        test()
                    except Exception:
                        return True
                return False


            _saved = preview
            preview = _mutant
            try:
                _result = _caught()
            finally:
                preview = _saved
            assert _result
          message: >-
            Тесты не заметили версию функции, которая обрезает и добавляет точки даже к короткому
            тексту.
        - id: t-m-exact
          kind: assert
          title: "Тесты замечают ошибку — текст ровно в limit символов обрезается"
          edge: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _mutant(text, limit):
                if len(text) < limit:
                    return text
                return text[:limit - 3] + "..."


            def _caught():
                for test in _tests:
                    try:
                        test()
                    except Exception:
                        return True
                return False


            _saved = preview
            preview = _mutant
            try:
                _result = _caught()
            finally:
                preview = _saved
            assert _result
          message: >-
            Тесты не заметили версию функции, которая обрезает текст длиной ровно limit символов.
        - id: t-m-long
          kind: assert
          title: "Тесты замечают ошибку — превью длиннее limit"
          edge: true
          code: |-
            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _mutant(text, limit):
                if len(text) <= limit:
                    return text
                return text[:limit] + "..."


            def _caught():
                for test in _tests:
                    try:
                        test()
                    except Exception:
                        return True
                return False


            _saved = preview
            preview = _mutant
            try:
                _result = _caught()
            finally:
                preview = _saved
            assert _result
          message: >-
            Тесты не заметили версию функции, которая оставляет limit символов и добавляет точки
            сверх них.
      criteria:
        - Тесты проходят на верной функции — ожидания посчитаны по правилу из условия.
        - >-
          Есть обычные случаи (текст короче limit и длиннее limit), граница (текст ровно в limit
          символов) и особый вход (например, пустой текст).
        - Набор замечает все три версии функции с ошибками.
        - Тесты вызываются, программа печатает «Все тесты прошли».
      hints:
        - >-
          Перечитай правило: при какой длине текста функция перестаёт возвращать его как есть?
          Раздели тексты на группы по сравнению с limit и найди значение, где одна группа
          сменяется другой.
        - >-
          Тот же приём на другой функции: `short_name(name, 5)` оставляет имя как есть, если в
          нём не больше 5 букв. Группы и граница: `"Аня"` — короче, `"Алина"` — ровно 5 (граница),
          `"Александра"` — длиннее. И особый вход — пустая строка `""`.
        - |-
          Каркас:
          ```text
          def test_preview():
              # короче limit — текст не меняется
              assert preview("текст", число) == "ожидание"
              # ровно limit символов — граница
              assert preview("текст", число) == "ожидание"
              # длиннее limit — всего ровно limit символов вместе с точками
              assert preview("текст", число) == "ожидание"
              # пустой текст
              assert preview("", число) == "ожидание"

          вызов теста
          print(…)
          ```
          Вместо слов подставь свои тексты, числа и ожидания. Длину своего текста можно проверить
          в «Запустить»: `print(len("Привет!"))`.
      solution:
        code: |
          def preview(text, limit):
              if len(text) <= limit:
                  return text
              return text[:limit - 3] + "..."


          def test_preview():
              # короче limit — текст не меняется
              assert preview("Привет", 10) == "Привет"
              # ровно limit символов — граница, тоже без изменений
              assert preview("Привет!", 7) == "Привет!"
              # длиннее limit — ровно limit символов вместе с точками
              assert preview("Встреча в 18:00 у входа", 12) == "Встреча в..."
              # особый вход: пустой текст
              assert preview("", 5) == ""


          test_preview()
          print("Все тесты прошли")
        explanation: >-
          Группы текстов — короче limit, ровно limit и длиннее. Граница — текст ровно в limit
