      mistakes:
        - id: test-weakened
          when:
            codeRegex: 'trips_needed\(10\)\s*==\s*2\b'
          where: "Строка `assert trips_needed(10) == …` в тесте `test_ten_bikes`"
          why: >-
            Ты поменял ожидание в тесте под ответ функции. Но тест прав: 10 велосипедов не
            поместятся в два рейса по 4 — два велосипеда останутся на базе.
          try: Верни в тесте `== 3` и исправь саму функцию.
          verify: Программа напечатает «Все тесты прошли», а тест «10 велосипедов — 3 рейса» станет зелёным.
        - id: capacity-changed
          when:
            codeRegex: '/\s*3\b'
          where: Строка с `return` в функции `trips_needed`
          why: >-
            В фургон помещается 4 велосипеда, а не 3. Деление на 3 случайно совпало с тестами в
            файле, но для 1 велосипеда даёт 0 рейсов, а для 101 — 33.
          try: >-
            Оставь деление на 4. Посчитай полные рейсы и подумай, что делать с велосипедами,
            которые остались после них.
        - id: no-return-for-even
          when:
            errorType: AssertionError
            # Последний return функции стоит с отступом 8+ (внутри if), после него до следующего
            # def ничего нет, а ветки else нет. Верный код сюда не попадает: тесты в блоке запуска
            # у него проходят, AssertionError нет.
            codeRegex: '^def trips_needed\b.*\n(?:(?![ \t]+else\b)(?:[ \t].*)?\n)*?[ \t]{8,}return\b.*\n(?:[ \t]*\n)*(?![ \t])'
          where: Конец функции `trips_needed`
          why: >-
            `return` стоит только внутри `if`. Когда велосипеды делятся поровну (8 или 0), условие
            ложно, до `return` дело не доходит, и функция возвращает `None`, а тест ждёт 2.
          try: >-
            Добавь в конце функции `return` для случая без остатка — с тем же отступом, что и
            `if`, а не под ним. Проверить себя можно в «Запустить»: временно поставь перед блоком
            запуска `print(trips_needed(8))`.
          verify: "Тест «8 велосипедов: два полных рейса» должен стать зелёным. Не забудь потом убрать `print`."
        - id: plus-one
          when:
            # `// 4 + 1` засчитывается, только если в функции до этой строки нет `%`:
            # в верной функции с ветками (`if bikes % 4 …: return bikes // 4 + 1`) разбор не
            # должен срабатывать, даже когда программа упала по другой причине.
            codeRegex: '^def trips_needed\b[^\n]*(?:\n(?:[ \t]+[^%\n]*)?)*?\n[ \t]+[^%#\n]*(?://\s*4\s*\+\s*1|\+\s*4\s*\)\s*//\s*4)'
            failedTest: t-call-8
          where: Строка с `return` в функции `trips_needed`
          why: >-
            Теперь лишний рейс, когда велосипеды делятся поровну: для 8 велосипедов выходит 3
            рейса вместо 2. Дополнительный рейс нужен, только если после полных рейсов кто-то
            остался.
          try: Добавляй рейс только тогда, когда остаток от деления на 4 не ноль — вспомни операцию `%`.
        - id: round
          when:
            codeIncludes: round(
          why: >-
            `round` округляет к ближайшему целому, а не вверх: 1.25 → 1. А ровно половину Python
            округляет к чётному числу: 2.5 → 2, 1.5 → 2. Рейс же нужен для любого остатка, даже
            для одного велосипеда, и ни при каком делении поровну лишний рейс не нужен.
          try: Посчитай полные рейсы через `//` и добавь ещё один, если есть остаток `%`.
        - id: float-division
          when:
            codeRegex: 'return\s+bikes\s*/\s*4\s*$'
          why: >-
            Обычное деление `/` даёт дробь: для 10 велосипедов — 2.5 рейса. Фургон не может
            съездить половину рейса, а функция должна вернуть целое число.
          try: Полные рейсы считает `//`, оставшиеся велосипеды — `%`. Собери ответ из них.
        - id: not-fixed
          when:
            # `return bikes // 4` — первая инструкция функции (перед ней только комментарии и
            # пустые строки). В верной функции с ветками эта строка стоит после if, и разбор
            # не сработает, даже если программа упала по другой причине.
            codeRegex: '^def trips_needed\b[^\n]*\n(?:[ \t]*(?:#[^\n]*)?\n)*[ \t]+return\s+bikes\s*//\s*4[ \t]*$'
            failedTest: t-call-10
          where: "Строка `return bikes // 4`"
          why: >-
            Функция по-прежнему возвращает `bikes // 4`, и отчёт pytest по-прежнему прав: для 10
            велосипедов она вернула 2, а нужно 3. Сколько велосипедов поедет в третьем рейсе и
            какая часть кода их теряет?
          try: >-
            Разложи 10 велосипедов по фургонам на бумаге и сравни с тем, что считает
            `bikes // 4`.
        - id: own-tests-fail
          when:
            errorType: AssertionError
          why: >-
            Тесты в блоке запуска всё ещё падают: функция возвращает не то, чего ждёт один из
            тестов.
          try: >-
            Посмотри в traceback, на каком тесте остановилась программа. Узнай, что вернула
            функция: временно поставь перед блоком запуска `print(trips_needed(10))` — с числом
            велосипедов из упавшего теста — и нажми «Запустить». Потом посчитай на бумаге,
            сколько рейсов нужно, и найди, где функция считает иначе. `print` после этого убери.
        - id: test-removed
          when:
            failedTest: t-tests-kept
            # Строка блока запуска, до которой нигде нет проверки trips_needed(10) == 3.
            # Без этого условия разбор срабатывал бы и на NameError: при падении программы
            # не проходят все тесты.
            codeRegex: '^if __name__(?<!trips_needed\(10\)\s*==\s*3[\s\S]*)'
          where: "Тест `test_ten_bikes` и его вызов в блоке запуска"
          why: >-
            Если вернуть в функцию `bikes // 4`, ни один из тестов не упадёт. Значит, проверку
            на 10 велосипедов удалили или изменили — а именно она нашла ошибку.
          try: Верни тест `test_ten_bikes` в прежнем виде и его вызов в блоке запуска.
        - id: output-changed
          when:
            failedTest: t-io
            outputIncludes: Все тесты прошли
          why: >-
            Функция считает верно, но программа печатает не одну строку «Все тесты прошли».
            Похоже, остался отладочный `print` или изменён блок запуска.
          try: Убери лишний вывод. Блок запуска вызывает три теста и печатает «Все тесты прошли».
      afterPass: >-
        Ты нашёл причину по отчёту, не запуская отладку: строка `E assert 2 == 3` сразу сказала,
        что вернула функция. Улучшение: добавь тест на 1 велосипед — это граница «остаток есть, а
        полных рейсов ноль».
      skills: [pytest-basics, debugging]

  - id: practice-guests
    type: exercise
    title: Практика 2
    exercise:
      id: m9-l3-e2
      kind: fix
      title: Тесты, которые зависят друг от друга
      statement: |-
        Функция `add_guest(guest_list, name)` добавляет гостя в список приглашённых на день
        рождения и возвращает, сколько гостей теперь в списке. Функция верная.

        Тесты проходят, когда их запускают вместе и по порядку. Но pytest умеет запускать любой
        тест отдельно — например, `python -m pytest test_guests.py::test_second_guest`. Тогда
        `test_second_guest` падает: он рассчитывает, что Олю в общий список `guests` уже добавил
        первый тест.

        Сделай тесты независимыми: пусть каждый тест сам готовит список, который ему нужен.
        Функцию не меняй. Проверка запустит каждый тест отдельно — так, как это сделал бы pytest,
        — а потом все вместе в обратном порядке.
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: Все тесты прошли"
      constraints:
        - "Функцию `add_guest` не меняй: исправлять нужно тесты."
        - Второй тест по-прежнему проверяет, что для второго гостя функция возвращает 2.
      starterCode: |
        guests = []


        def add_guest(guest_list, name):
            guest_list.append(name)
            return len(guest_list)


        def test_first_guest():
            assert add_guest(guests, "Оля") == 1


        def test_second_guest():
            # рассчитывает, что Оля уже добавлена первым тестом
            assert add_guest(guests, "Макс") == 2


        if __name__ == "__main__":
            test_first_guest()
            test_second_guest()
            print("Все тесты прошли")
      tests:
        - id: t-io
          kind: io
          title: Вместе тесты проходят
          example: true
          expected: Все тесты прошли
        - id: t-alone
          kind: assert
          title: Каждый тест проходит сам по себе
          example: true
          code: |
            _source = open(__file__, encoding="utf-8").read()
            _names = [name for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _passes_alone(name, impl):
                fresh = {"__name__": "test_guests"}
                exec(compile(_source, "main.py", "exec"), fresh)
                fresh["add_guest"] = impl
                try:
                    fresh[name]()
                except Exception:
                    return False
                return True


            def _reference(guest_list, name):
                guest_list.append(name)
                return len(guest_list)


            _lonely = [name for name in _names if not _passes_alone(name, _reference)]
            assert _names, "тестов нет"
            assert not _lonely, f"отдельно падают: {_lonely}"
          message: Каждый тест должен проходить, даже если запустить его отдельно от остальных.
        - id: t-kept
          kind: assert
          title: Тесты замечают ошибку в функции
          code: |
            _source = open(__file__, encoding="utf-8").read()
            _names = [name for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _passes_alone(name, impl):
                fresh = {"__name__": "test_guests"}
                exec(compile(_source, "main.py", "exec"), fresh)
                fresh["add_guest"] = impl
                try:
                    fresh[name]()
                except Exception:
                    return False
                return True


            def _reference(guest_list, name):
                guest_list.append(name)
                return len(guest_list)


            def _mutant(guest_list, name):
                size = len(guest_list)
                guest_list.append(name)
                return size


            assert any(_passes_alone(name, _reference) and not _passes_alone(name, _mutant)
                       for name in _names)
          message: >-
            Тесты должны по-прежнему проверять ответ функции: версия, которая возвращает размер
            списка до добавления, должна их уронить.
        - id: t-second
          kind: assert
          title: Второй тест проверяет второго гостя
          code: |
            _source = open(__file__, encoding="utf-8").read()
            _names = [name for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _passes_alone(name, impl):
                fresh = {"__name__": "test_guests"}
                exec(compile(_source, "main.py", "exec"), fresh)
                fresh["add_guest"] = impl
                try:
                    fresh[name]()
                except Exception:
                    return False
                return True


            def _reference(guest_list, name):
                guest_list.append(name)
                return len(guest_list)


            def _mutant(guest_list, name):
                guest_list.append(name)
                return 1


            assert any(_passes_alone(name, _reference) and not _passes_alone(name, _mutant)
                       for name in _names)
          message: >-
            Какой-то тест должен добавлять гостя в список, где уже кто-то есть, и ждать 2. Иначе
            версия функции, которая всегда возвращает 1, пройдёт все тесты.
        - id: t-order
          kind: assert
          title: Тесты проходят и в обратном порядке
          code: |
            _source = open(__file__, encoding="utf-8").read()
            _names = [name for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]


            def _reference(guest_list, name):
                guest_list.append(name)
                return len(guest_list)


            _fresh = {"__name__": "test_guests"}
            exec(compile(_source, "main.py", "exec"), _fresh)
            _fresh["add_guest"] = _reference
            for _name in reversed(_names):
                _fresh[_name]()
          message: >-
            Тесты должны проходить в любом порядке. Похоже, один тест оставляет гостей в общем
            списке, и другой тест, который ждёт пустой список, получает лишних. Пусть каждый тест
            работает со своим списком.
        - id: t-func
          kind: call
          title: Функция осталась прежней
          call: add_guest(["Оля"], "Макс")
          expected: "2"
      criteria:
        - Каждый тест проходит, даже если запустить его отдельно от остальных или в другом порядке.
        - Тесты по-прежнему замечают ошибку в функции, а второй тест проверяет добавление второго гостя.
        - Функция `add_guest` не изменилась, программа печатает «Все тесты прошли».
      hints:
        - >-
          Представь, что pytest запустил только `test_second_guest`. Что в этот момент лежит в
          общем списке `guests` и что вернёт функция?
        - >-
          Похожий случай: тест `assert count_items(cart) == 2` верен, только если перед ним
          кто-то положил в общую корзину `cart` две вещи. Независимый тест сам собирает корзину —
          `cart = ["хлеб", "молоко"]` — и только потом проверяет функцию:
          `assert count_items(cart) == 2`.
        - |-
          Каркас второго теста:
          ```text
          def test_second_guest():
              список = [... гость, который уже приглашён ...]
              assert add_guest(список, "Макс") == 2
          ```
          Первому тесту нужен свой пустой список.
      solution:
        code: |
          def add_guest(guest_list, name):
              guest_list.append(name)
              return len(guest_list)


          def test_first_guest():
              guest_list = []
              assert add_guest(guest_list, "Оля") == 1


          def test_second_guest():
              guest_list = ["Оля"]
              assert add_guest(guest_list, "Макс") == 2


          if __name__ == "__main__":
              test_first_guest()
              test_second_guest()
              print("Все тесты прошли")
        explanation: >-
