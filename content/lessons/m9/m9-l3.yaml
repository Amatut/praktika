id: m9-l3
module: m9
number: "9.3"
title: "pytest: первый набор тестов"
objective: >-
  Поставить pytest в виртуальное окружение, запустить им набор тестов и по отчёту о падении
  найти, какой тест упал, на какой проверке и что функция вернула вместо ожидаемого. Держать
  тесты независимыми, чтобы любой из них проходил и отдельно от других.
minutes: [30, 40]
prerequisites: [m9-l2, m8-l3]
skills: [pytest-basics, assert-checks, venv-deps]
environment: external

story:
  title: Сорок проверок и одна остановка
  fictional: true
  text: >-
    У Матвея, администратора велопроката «Круг», накопилось сорок проверок, и запускались они
    подряд, одной программой. Стоило упасть одной — Python останавливался на ней, и Матвей не
    знал, сломано ли что-то ещё: исправлял, запускал, находил следующую ошибку, и так по кругу.
    Знакомый разработчик показал ему pytest: одна команда в терминале запускает каждый тест
    отдельно и в конце показывает все упавшие сразу — вместе с тем, что функция вернула на самом
    деле. Первый же запуск нашёл три ошибки за раз.

why: >-
  Когда тестов много, нужен инструмент, который сам их находит, запускает по одному и показывает
  понятный отчёт. Например, команда `python -m pytest` за секунду сообщает «2 failed, 1 passed»,
  какие именно тесты упали и что при этом вернула функция.

usedIn: >-
  pytest — один из самых распространённых инструментов для тестов на Python. На нём пишут тесты
  разработчики и тестировщики-автоматизаторы, а его отчёт о падении — первое, что смотрят, когда
  правка что-то сломала. С ним же ты будешь проверять свой итоговый проект.

steps:
  - id: why-pytest
    type: theory
    title: "pytest: каждый тест отдельно"
    body: |-
      До сих пор тесты запускал ты сам: вызывал функции `test_…` внизу файла и печатал «Все
      тесты прошли». Пока тестов три, это удобно. Когда их сорок, начинаются неудобства. Одно
      ты знаешь по уроку 9.1: AssertionError без сообщения не говорит, что вернула функция.
      Второе увидишь в прогнозе ниже: что происходит с остальными тестами, когда один упал.

      **pytest** — сторонняя библиотека для запуска тестов. Её ставят в виртуальное окружение
      проекта через pip, как пакет из урока 8.3.

      **Как pytest находит тесты.** Он просматривает папку и берёт файлы, имя которых
      начинается с `test_` (например, `test_rent.py`), а в них — функции, имя которых тоже
      начинается с `test_`. Внутри — обычный `assert`. Вызывать тесты самому не нужно: pytest
      вызывает каждый сам.

      **Каждый тест — отдельно.** Упал один — pytest всё равно запускает остальные, а в конце
      показывает все падения сразу. Для каждого падения он пишет, что вернула функция и чего
      ждал тест.

      **Как устроен проект.** Функция — в одном файле, тесты — в другом:

      ```text
      python-practice\m9\
          rent.py        ← функция rent_price
          test_rent.py   ← from rent import rent_price и тесты
      ```

      Запуск — команда `python -m pytest` в папке проекта при включённом окружении. С ключом
      `-v` pytest пишет имя и результат каждого теста.

      **Независимые тесты.** pytest может запустить любой тест отдельно от других. Поэтому
      каждый тест сам готовит свои данные: не рассчитывает, что другой тест выполнился раньше, и
      не трогает настоящие файлы с данными — тест может их испортить или упасть, если данные в
      файле поменялись. Для работы с файлами у pytest есть временная папка — она встретится в
      самостоятельной работе.

      **В тренажёре pytest нет:** pip здесь нет, как ты видел в уроке 8.3, и поставить пакет
      нельзя. Поэтому в заданиях внизу файла с тестами стоит блок запуска:

      ```python
      if __name__ == "__main__":
          test_one_hour()
          print("Все тесты прошли")
      ```

      Он знаком тебе по уроку 8.2: когда файл запускают, `__name__` равно `"__main__"`, и тесты
      вызываются. pytest же импортирует файл как модуль, поэтому у него блок не выполняется —
      тесты pytest вызывает сам. Один и тот же файл работает и в тренажёре, и на компьютере.
    simpler: >-
      pytest — «запускалка» тестов. Она сама находит функции `test_…`, вызывает каждую отдельно
      и в конце пишет, какие прошли, какие упали и почему. Ставится в окружение через pip,
      запускается командой `python -m pytest`.
    coach: >-
      Установка — самая длинная часть урока. Если компьютера сейчас нет, сделай задания в
      браузере, а чек-лист пройди позже.

  - id: first-fail-stops
    type: predict
    title: Сколько тестов выполнится?
    prompt: >-
      Правило проката: первый час — 200, каждый следующий — 100, а меньше часа — как за час. В
      функции случайно написали `150` вместо `100`. Файл запускают кнопкой «Запустить», без
      pytest. Как думаешь, что успеет появиться на экране?
    code: |-
      def rent_price(hours):
          if hours <= 1:
              return 200
          return 200 + (hours - 1) * 150


      def test_one_hour():
          assert rent_price(1) == 200


      def test_three_hours():
          assert rent_price(3) == 400


      def test_long_ride():
          assert rent_price(8) == 900


      def test_half_hour():
          assert rent_price(0.5) == 200


      if __name__ == "__main__":
          test_one_hour()
          print("test_one_hour: ок")
          test_three_hours()
          print("test_three_hours: ок")
          test_long_ride()
          print("test_long_ride: ок")
          test_half_hour()
          print("test_half_hour: ок")
    options:
      - |-
        test_one_hour: ок
        test_half_hour: ок
      - "test_one_hour: ок"
      - |-
        test_one_hour: ок
        test_three_hours: ок
        test_long_ride: ок
        test_half_hour: ок
    answer: "test_one_hour: ок"
    explanation: >-
      `rent_price(1)` вернула 200 — первый тест прошёл, строка напечаталась. `rent_price(3)`
      вернула 500 вместо 400: AssertionError остановил весь файл, и до двух последних тестов
      дело не дошло. Упавший тест не пропускается — после него не выполняется ничего. Из этого
      запуска не узнать, что `test_long_ride` тоже падает (1250 вместо 900), а `test_half_hour`
      исправен. pytest запустил бы все четыре теста и сообщил: 2 failed, 2 passed — обе ошибки
      за один запуск.
    coach: >-
      После ответа посмотри на настоящий запуск: внизу AssertionError, и чисел в нём нет.
      Сравни его с отчётом pytest дальше в уроке.

  - id: install-run
    type: checklist
    title: pytest на компьютере
    body: >-
      Делай по пунктам и отмечай сделанное. Нужен компьютер и один раз интернет — чтобы
      поставить pytest. Блок займёт минут 15–20, его удобно сделать отдельным подходом. Если
      под рукой только телефон, пройди задания ниже, а к этому блоку вернись позже. Команды написаны для Windows и «Командной строки» (cmd), как в уроке 8.3.
      Отличия для macOS и Linux — в «Если не получается».
    items:
      - id: folder
        text: >-
          **Подготовь папку и окружение.** В учебной папке `python-practice` создай папку `m9` и
          открой в ней «Командную строку». Создай окружение командой `python -m venv .venv` и
          включи его: `.venv\Scripts\activate`. В начале строки появится `(.venv)`.
        help: |-
          Открыть cmd в папке: в адресной строке Проводника набери `cmd` и нажми Enter. Или
          открой папку `m9` в VS Code и выбери Terminal → New Terminal → ˅ → Command Prompt.

          Сообщение «выполнение сценариев отключено в этой системе» значит, что открыт
          PowerShell, — открой «Командную строку». Команда `python` не находится — пиши `py`, как
          в уроке 0.4.

          macOS и Linux: `python3 -m venv .venv`, включение — `source .venv/bin/activate`, и в
          остальных командах урока тоже `python3` вместо `python`.
      - id: install
        text: >-
          **Поставь pytest:** `python -m pip install pytest`. В конце появится строка
          `Successfully installed …`. Проверь установку: `python -m pytest --version` — ответ
          будет вида `pytest 9.1.1` (номер у тебя может быть другим).
        help: |-
          Нужен интернет: без него остановись здесь и вернись позже.

          `No module named pytest` — окружение не включено (нет `(.venv)` в начале строки) или
          pytest поставлен в другом окне. Включи окружение и повтори установку.

          Вместе с pytest ставятся его помощники — pluggy, iniconfig и другие, это нормально.
          Записать зависимости можно, как в уроке 8.3: `python -m pip freeze > requirements.txt`.
      - id: files
        text: |-
          **Создай два файла** в папке `m9`. Первый — `rent.py` с функцией из урока 9.1:

          ```python
          def rent_price(hours):
              if hours <= 1:
                  return 200
              return 200 + (hours - 1) * 100
          ```

          Второй — `test_rent.py`:

          ```python
          from rent import rent_price


          def test_one_hour():
              assert rent_price(1) == 200


          def test_three_hours():
              assert rent_price(3) == 400


          def test_long_ride():
              assert rent_price(8) == 900
          ```
        help: >-
          Имена файлов — точно такие: pytest ищет файлы, имя которых начинается с `test_`.
          Внизу `test_rent.py` вызовов тестов нет — pytest вызовет их сам. Команда `dir`
          покажет, что оба файла лежат в папке `m9`.
      - id: run
        text: >-
          **Запусти тесты:** `python -m pytest`. В последней строке должно быть `3 passed`.
          Потом запусти `python -m pytest -v` — у каждого теста будет своя строка со словом
          `PASSED`.
        help: |-
          `collected 0 items` и `no tests ran` — pytest не нашёл тестов: имя файла или функций
          не начинается с `test_`, либо терминал открыт не в папке `m9`.

          `ModuleNotFoundError: No module named 'rent'` — файл `rent.py` назван иначе или лежит
          в другой папке.

          `No module named pytest` — окружение не включено: вернись к первому пункту.
      - id: break
        text: >-
          **Сломай и прочитай отчёт.** В `rent.py` замени `100` на `150`, сохрани и снова
          запусти `python -m pytest`. Найди в отчёте: сколько тестов упало, как они называются,
          строку со знаком `>` и строки, которые начинаются с `E`.
        help: >-
          Всё ещё `3 passed` — файл не сохранён: pytest читает то, что записано на диске, а не
          то, что открыто в редакторе. Как читать отчёт — в следующем блоке урока.
      - id: fix
        text: >-
          **Верни как было и запусти один тест.** Верни `100`, сохрани и запусти
          `python -m pytest` — снова `3 passed`. Затем запусти только один тест:
          `python -m pytest test_rent.py::test_long_ride`. В отчёте будет `collected 1 item` и
          `1 passed`.
        help: >-
          Запись `файл::тест` просит pytest выполнить один тест — так проверяют, что тест не
          зависит от других. Папки `.pytest_cache` и `__pycache__` pytest создаёт сам: их можно
          удалить, а в Git они не нужны — впиши их в `.gitignore`, как в уроке 8.4.
      - id: own-test
        text: >-
          **Допиши свой тест.** В конец `test_rent.py` добавь функцию `test_two_hours`: ожидание
          посчитай сам по правилу проката. Сохрани и запусти `python -m pytest -v` — строк
          `PASSED` станет четыре, хотя вызова ты не писал. Потом переименуй функцию в
          `check_two_hours`, сохрани и запусти `python -m pytest`: в итоге снова `3 passed` —
          функцию без `test_` в начале имени pytest не видит. Верни имя `test_two_hours`.
        help: |-
          Твой тест упал — найди в отчёте строку, которая начинается с `E`: первое число в ней —
          что вернула функция, второе — твоё ожидание. Пересчитай по правилу проката: первый час
          — 200, каждый следующий — 100. Функция здесь верная, её уже проверили три теста,
          поэтому, если ошибся в расчёте, исправь ожидание в тесте.

          Строк `PASSED` по-прежнему три — проверь, что имя функции начинается с `test_`, `def`
          стоит без отступа, а файл сохранён.
    coach: >-
      Отмечай пункт, когда увидел результат в терминале, а не когда прочитал. Если установка
      затянулась, здесь удобно сделать паузу: задания ниже работают и без компьютера.

  - id: read-report
    type: theory
    title: Как читать отчёт о падении
    body: |-
      Вот что показал pytest в пункте «Сломай» (примерно так: путь, версии и время у тебя будут
      другими):

      ```text
      ============================= test session starts =============================
      platform win32 -- Python 3.14.7, pytest-9.1.1, pluggy-1.6.0
      rootdir: C:\Users\...\python-practice\m9
      collected 3 items

      test_rent.py .FF                                                         [100%]

      ================================== FAILURES ===================================
      ______________________________ test_three_hours _______________________________

          def test_three_hours():
      >       assert rent_price(3) == 400
      E       assert 500 == 400
      E        +  where 500 = rent_price(3)

      test_rent.py:9: AssertionError
      _______________________________ test_long_ride ________________________________

          def test_long_ride():
      >       assert rent_price(8) == 900
      E       assert 1250 == 900
      E        +  where 1250 = rent_price(8)

      test_rent.py:13: AssertionError
      =========================== short test summary info ===========================
      FAILED test_rent.py::test_three_hours - assert 500 == 400
      FAILED test_rent.py::test_long_ride - assert 1250 == 900
      ========================= 2 failed, 1 passed in 0.09s =========================
      ```

      Отчёт читают снизу вверх, как traceback в уроке 6.1:

      1. **Последняя строка** — итог: `2 failed, 1 passed` — два теста упали, один прошёл.
      2. **`short test summary info`** — список упавших: файл, `::`, имя теста и короткая
         причина.
      3. **Блок `FAILURES`** — подробности, по блоку на каждый упавший тест:
         - строка со знаком `>` — упавший assert;
         - `E assert 500 == 400` — **слева то, что вернула функция, справа ожидание** из теста;
         - `where 500 = rent_price(3)` — какой вызов дал это значение;
         - `test_rent.py:9` — файл и номер строки с этим assert.
      4. **Строка прогресса** `test_rent.py .FF` — по знаку на тест, в порядке файла: точка —
         прошёл, `F` — упал.

      В уроке 9.1 AssertionError приходил без чисел, и значения приходилось печатать самому.
      pytest показывает их сам. Поэтому и договариваемся писать `assert функция(...) ==
      ожидание`: слева «что получилось», справа «что должно быть» — тогда строку `E` понимаешь
      с первого взгляда.
    simpler: >-
      Отчёт читают снизу: сколько упало → какие → подробности. В строке `E assert 500 == 400`
      слева то, что вернула функция, справа — чего ждал тест.
    coach: >-
      Отчёт длинный, но обычно нужны три места: итог внизу, строка с `>` и строки с `E`.

  - id: report-quiz
    type: quiz
    title: Что вернула функция?
    question: По отчёту выше — что вернула `rent_price(8)`?
    options:
      - "900"
      - "1250"
      - "8"
    correct: 1
    explanation: >-
      В строке `E assert 1250 == 900` слева то, что вернула функция, справа — ожидание из теста.
      Строка `where 1250 = rent_price(8)` это подтверждает: 200 + 7 × 150 = 1250. 900 — это
      ожидание, а 8 — аргумент, то есть часы проката.

  - id: practice-van
    type: exercise
    title: Практика 1
    exercise:
      id: m9-l3-e1
      kind: fix
      title: Исправь функцию по отчёту
      statement: |-
        Прокат «Круг» отвозит велосипеды на старт велопробега. В фургон помещается 4 велосипеда,
        и функция `trips_needed(bikes)` считает, сколько рейсов понадобится. Нет велосипедов —
        нет и рейсов.

        На компьютере тесты из этого файла запустили через pytest, и он показал:

        ```text
            def test_ten_bikes():
        >       assert trips_needed(10) == 3
        E       assert 2 == 3
        E        +  where 2 = trips_needed(10)

        test_van.py:9: AssertionError
        =========================== short test summary info ===========================
        FAILED test_van.py::test_ten_bikes - assert 2 == 3
        ========================= 1 failed, 2 passed in 0.09s =========================
        ```

        На компьютере функция лежит в `van.py`, а тесты — в `test_van.py`, поэтому номер строки
        там другой.

        По отчёту найди причину и исправь **функцию**. Тесты верные — их не меняй. Блок
        `if __name__ == "__main__":` внизу запускает тесты в тренажёре: когда функция будет
        исправлена, программа напечатает «Все тесты прошли».
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: Все тесты прошли"
      constraints:
        - "Тесты не меняй: исправлять нужно функцию `trips_needed`."
        - "Функция возвращает целое число рейсов: 2, а не 2.0."
      starterCode: |
        def trips_needed(bikes):
            # в фургон помещается 4 велосипеда
            return bikes // 4


        def test_full_trips():
            assert trips_needed(8) == 2


        def test_ten_bikes():
            assert trips_needed(10) == 3


        def test_no_bikes():
            assert trips_needed(0) == 0


        if __name__ == "__main__":
            test_full_trips()
            test_ten_bikes()
            test_no_bikes()
            print("Все тесты прошли")
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
        - id: t-call-10
          kind: call
          title: 10 велосипедов — 3 рейса
          example: true
          call: trips_needed(10)
          expected: "3"
        - id: t-call-7
          kind: call
          title: 7 велосипедов — 2 рейса
          example: true
          call: trips_needed(7)
          expected: "2"
        - id: t-call-8
          kind: call
          title: "8 велосипедов: два полных рейса"
          call: trips_needed(8)
          expected: "2"
        - id: t-call-4
          kind: call
          title: "Граничный случай: ровно один полный фургон"
          edge: true
          call: trips_needed(4)
          expected: "1"
        - id: t-call-1
          kind: call
          title: "Граничный случай: один велосипед — тоже рейс"
          edge: true
          call: trips_needed(1)
          expected: "1"
        - id: t-call-0
          kind: call
          title: "Граничный случай: велосипедов нет"
          edge: true
