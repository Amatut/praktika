      criteria:
        - "Функция возвращает число рейсов для любого количества велосипедов: неполный фургон — тоже рейс."
        - Тесты остались прежними и проходят, программа печатает «Все тесты прошли».
        - Если вернуть в функцию `bikes // 4`, тесты снова это заметят.
      hints:
        - >-
          Прочитай строки `E` в отчёте: что вернула функция для 10 велосипедов и чего ждал тест?
          Представь, как эти 10 велосипедов едут в фургоне по 4: сколько поедет в каждом рейсе?
        - >-
          Похожий случай: 7 пирожков раскладывают в коробки по 2. `7 // 2` даёт 3 полные
          коробки, а `7 % 2` — 1 пирожок, которому коробки не хватило. Для него нужна ещё одна
          коробка — всего 4.
        - |-
          Каркас функции:
          ```text
          рейсы = полные рейсы (деление нацело на 4)
          если остаток от деления на 4 не ноль:
              рейсы = рейсы + 1
          вернуть рейсы
          ```
      solution:
        code: |
          def trips_needed(bikes):
              # в фургон помещается 4 велосипеда
              trips = bikes // 4
              if bikes % 4 != 0:
                  trips = trips + 1
              return trips


          def test_full_trips():
              assert trips_needed(8) == 2


          def test_ten_bikes():
              assert trips_needed(10) == 3


          def test_no_bikes():
              assert trips_needed(0) == 0


          if __name__ == "__main__":
              test_full_trips()
              test_ten_bikes()
              test_no_bikes()
              print("Все тесты прошли")
        explanation: >-
          Отчёт сказал главное: для 10 велосипедов функция вернула 2, а нужно 3. `bikes // 4` —
          это только полные рейсы: остаток `//` отбрасывает, и два велосипеда остались на базе.
          `bikes % 4` — сколько велосипедов осталось после полных рейсов; если остаток не ноль,
          нужен ещё рейс. Для 10: 10 // 4 = 2, остаток 2 — всего 3 рейса. Для 8: остаток 0 —
          2 рейса. Для 0 — 0 рейсов. Тот же ответ даёт `(bikes + 3) // 4`: прибавь вместимость
          без единицы, и любой остаток дотянет до следующего рейса. Ещё один способ —
          `math.ceil(bikes / 4)`, «округлить вверх».
