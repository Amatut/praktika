      mistakes:
        - id: together-fails
          when:
            errorType: AssertionError
          why: >-
            При обычном запуске один из тестов теперь падает: в списке, который он передаёт в
            функцию, лежит не то, что нужно. Функция возвращает длину списка после добавления:
            чтобы получить 1, список до вызова должен быть пустым, чтобы получить 2 — в нём
            должен быть ровно один гость. Частая причина — тест кладёт Олю в общий список
            `guests`, где она уже есть после первого теста.
          try: >-
            Посмотри в traceback, какой тест упал, и проверь, что лежит в его списке перед
            вызовом `add_guest`. Тест не должен вызывать другой тест или опираться на общий
            список — пусть создаёт свой.
        - id: function-changed
          when:
            failedTest: t-func
            # Тело функции уже не «append + return len». Условие нужно, чтобы разбор не
            # срабатывал на NameError в тестах: при падении программы не проходит и t-func.
            # Комментарии и пустые строки внутри функции допускаются — это не изменение.
            codeRegex: '^def add_guest\b(?!\(\s*guest_list\s*,\s*name\s*\)\s*:[ \t]*(?:#[^\n]*)?\n(?:[ \t]*(?:#[^\n]*)?\n)*[ \t]+guest_list\.append\(\s*name\s*\)[ \t]*(?:#[^\n]*)?\n(?:[ \t]*(?:#[^\n]*)?\n)*[ \t]+return\s+len\(\s*guest_list\s*\)[ \t]*(?:#[^\n]*)?$)'
          where: Функция `add_guest`
          why: >-
            Функция изменилась, а она была верной: для списка с Олей и нового гостя Макса она
            должна вернуть 2. Ошибка была в тестах, а не в функции.
          try: Верни функцию как было и исправляй тесты — пусть каждый сам готовит свой список.
        - id: still-dependent
          when:
            failedTest: t-alone
            # В теле test_second_guest (не в комментарии) есть общий список guests.
            codeRegex: '^def test_second_guest\b.*(?:\n(?:[ \t].*)?)*?\n[ \t][^#\n]*\bguests\b'
          where: Тест `test_second_guest`
          why: >-
            Вместе тесты проходят, а по отдельности — нет. Если pytest запустит только
            `test_second_guest`, общий список `guests` будет пуст: функция вернёт 1, а тест ждёт 2.
          try: Пусть тест сам создаёт список, в котором уже есть нужный гость, и передаёт его в `add_guest`.
          verify: Тест «Каждый тест проходит сам по себе» должен стать зелёным.
        - id: asserts-removed
          when:
            failedTest: t-kept
            # Строка def test_…, после которой в коде нет ни одного assert.
            codeRegex: '^def test_\w*(?![\s\S]*\bassert\b)'
          where: Тесты `test_…`
          why: >-
            Тесты больше ничего не проверяют: даже если функция вернёт размер списка до
            добавления, ни один тест не упадёт. Похоже, из тестов пропали assert.
          try: Верни в тесты проверки вида `assert add_guest(...) == …` с ожиданием из условия.
        - id: len-checked
          when:
            failedTest: t-second
            # В теле test_second_guest есть assert len(...): тест проверяет список, а не ответ
            # функции. Если вдобавок программа упала по другой причине, совет всё равно верен:
            # такой тест версию «всегда 1» не ловит.
            codeRegex: '^def test_second_guest\b.*(?:\n(?:[ \t].*)?)*?\n[ \t]+assert\s+len\s*\('
          where: Тест `test_second_guest`
          why: >-
            Тест проверяет длину списка, а не то, что вернула `add_guest`. Функция, которая
            добавляет гостя, но всегда возвращает 1, такой тест пройдёт — ошибку в ответе он не
            заметит.
          try: Сравнивай в assert результат вызова `add_guest(…)` с ожиданием 2, а не длину списка.
          verify: Тест «Второй тест проверяет второго гостя» должен стать зелёным.
        - id: second-weakened
          when:
            failedTest: t-second
            # После def test_second_guest нигде нет ожидания «== 2».
            codeRegex: '^def test_second_guest\b(?![\s\S]*==\s*2\b)'
          where: Тест `test_second_guest`
          why: >-
            Ни один тест больше не проверяет, что для второго гостя функция возвращает 2: все
            добавляют гостя в пустой список. Версия функции, которая всегда возвращает 1, пройдёт
            такие тесты.
          try: Пусть во втором тесте список до вызова уже содержит одного гостя, а тест ждёт 2.
        - id: output-changed
          when:
            failedTest: t-io
            outputIncludes: Все тесты прошли
          why: >-
            Тесты проходят, но программа печатает не одну строку «Все тесты прошли». Похоже,
            остался отладочный `print` или изменён блок запуска.
          try: Убери лишний вывод. Блок запуска вызывает тесты и печатает «Все тесты прошли».
      afterPass: >-
        Тесты больше не зависят от порядка и друг от друга: pytest может запустить любой из них
        отдельно. Улучшение: если общий список `guests` остался, убери его совсем — тогда
        случайно опереться на него уже не получится.
      skills: [pytest-basics]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - pytest находит файлы `test_*.py` и функции `test_*` и запускает каждый тест отдельно — одно падение не останавливает остальные.
      - "`python -m pytest` запускают в папке проекта при включённом окружении; `-v` — строка на каждый тест, `файл::тест` — один тест."
      - "Отчёт читают снизу: итог → short test summary → блок FAILURES. В `E assert 500 == 400` слева то, что вернула функция, справа — ожидание."
      - Тесты независимы — каждый сам готовит свои данные и не рассчитывает на другой тест.
    question: >-
      Кто-то написал свой тест для фургона, и pytest показал строки `E assert 3 == 2` и
      `where 3 = trips_needed(10)`. Что вернула функция, чего ждал тест и что ты будешь
      исправлять — тест или функцию?
    answer: >-
      Функция вернула 3, тест ждал 2: слева результат вызова `trips_needed(10)`, справа
      ожидание из теста. Кто прав, решает условие, а не то, что удобнее поправить: 10
      велосипедов по 4 в фургон — это 3 рейса, значит, функция права, а ошибся тест.
      Исправлять нужно ожидание в тесте, функцию не трогать.
