id: m9-l4
module: m9
number: "9.4"
title: Тесты на ошибки и исключения
objective: >-
  Проверять тестом, что на неверный ввод функция выбрасывает нужное исключение (ValueError), а не
  молча возвращает неверный результат: в тренажёре — приёмом с флагом и try / except, на
  компьютере — через pytest.raises.
minutes: [25, 30]
prerequisites: [m9-l3, m7-l3]
skills: [exception-tests, exceptions, edge-cases]
environment: python

story:
  title: Гость номер ноль
  fictional: true
  text: >-
    В спортклубе «Орбита» администратор на входе набирает номер клубной карты, и программа отмечает
    посещение. Функция, которая читала номер, на опечатку вроде «12о4» с буквой «о» вместо нуля не
    жаловалась, а молча возвращала 0 — и за месяц в журнале набралось сорок визитов «гостя № 0».
    Разработчик Самир переделал её: теперь на неверный номер она выбрасывает ValueError, а программа
    на входе просит набрать номер заново. Чтобы старое поведение не вернулось, он добавил тест: на
    такой ввод функция обязана выбросить исключение.

why: >-
  Функция должна не только верно считать на хорошем вводе, но и честно отказываться на плохом.
  Например, `parse_card("12о4")` должна выбросить ValueError, а не вернуть 0, — и тест может это
  проверить.

usedIn: >-
  Проверки ввода есть в каждой форме, боте и API: отрицательная сумма перевода, пустое имя, дата
  31 февраля. Тесты на исключения — обязательная часть набора тестов для таких функций; в pytest
  для них есть `pytest.raises`.

steps:
  - id: raise-and-test
    type: theory
    title: Ошибка — тоже результат
    body: |-
      В уроке 7.3 ты ловил исключения, которые выбрасывал сам Python: `int("пять")` — это
      ValueError. Функция может выбросить исключение и сама — командой **`raise`** (читается
      «рейз», по-английски «поднять»):

      ```python
      def parse_card(text):
          text = text.strip()
          if not text.isdigit():
              raise ValueError("номер карты — только цифры")
          return int(text)
      ```

      `raise` останавливает функцию сразу, как `return`, но ничего не возвращает: вызов
      прерывается исключением. Дальше всё как в уроке 7.3. **Вызывающий код** — тот, что вызвал
      функцию. Поймал он ValueError в `except` — сам решает, что делать, например попросить номер
      заново. Не поймал — программа падает, и текст из скобок виден в последней строке traceback.

      **ValueError** — «значение не подходит»: тип верный (строка), а содержимое нет. Этот тип
      выбирают для неверного ввода.

      **Контракт функции** — её обещание: на верном вводе вернуть результат, на неверном выбросить
      исключение. Вариант «`print("Ошибка")` и `return 0`» контракт нарушает: вызывающий код
      получит 0 и не отличит ошибку от настоящего номера 0.

      **Тест на исключение.** У такой функции два правила: «можно» и «нельзя». Для «можно» пишут
      обычный assert, для «нельзя» — приём с **флагом**:

      ```python
      def test_card_letters():
          raised = False
          try:
              parse_card("12о4")
          except ValueError:
              raised = True
          assert raised, "ожидали ValueError"
      ```

      1. `raised = False` — флаг: «исключения пока не было».
      2. Вызов стоит **внутри** `try`, иначе исключение остановит сам тест. Одна проверка — один
         вызов в `try`: после первого исключения остальные строки `try` не выполняются.
      3. `except ValueError` поднимает флаг.
      4. `assert raised` — главная строка: не было ValueError — тест падает.

      Тип ловим **конкретный**, как в уроке 7.3. `except Exception` засчитает и TypeError, и
      NameError из-за опечатки: тест пройдёт, хотя функция ведёт себя не так, как обещала.

      Заметь: тест на ошибку **проходит**, когда функция правильно выбросила исключение. Падает он,
      когда исключения не было.

      **На компьютере** pytest делает то же короче:

      ```python
      import pytest

      def test_card_letters():
          with pytest.raises(ValueError):
              parse_card("12о4")
      ```

      Если внутри `with` исключения не было, pytest отметит тест как упавший. В тренажёре pytest
      нет, поэтому здесь пишем флаг — он работает везде.
    simpler: >-
      На плохой ввод функция говорит «не могу» командой `raise ValueError("…")`. Тест проверяет две
      вещи: что она отказалась и что это именно ValueError, как она обещала. Флаг `raised` —
      отметка «исключение было»: в конце теста `assert raised` требует, чтобы отметка стояла.
    coach: >-
      У каждого правила функции есть «можно» и «нельзя». Тест на «нельзя» так же важен, как тест на
      «можно».

  - id: card-test
    type: example
    title: Тест на неверный номер карты
    body: >-
      Функция из истории и два теста к ней: на «можно» и на «нельзя». Тесты вызываются в блоке
      `if __name__ == "__main__":`, как в уроке 9.3. Нажми «Запустить».
    code: |-
      def parse_card(text):
          text = text.strip()
          if not text.isdigit():
              raise ValueError("номер карты — только цифры")
          return int(text)


      def test_card_ok():
          assert parse_card(" 1042 ") == 1042


      def test_card_letters():
          raised = False
          try:
              parse_card("12о4")
          except ValueError:
              raised = True
          assert raised, "ожидали ValueError для «12о4»"


      if __name__ == "__main__":
          test_card_ok()
          test_card_letters()
          print("Все тесты прошли")
    notes:
      - line: 4
        text: >-
          Неверный номер: функция ничего не возвращает, а выбрасывает ValueError с понятным
          сообщением. Строка 5 в этом случае уже не выполнится.
      - line: 9
        text: "Тест на «можно»: пробелы по краям убираются, номер превращается в число."
      - line: 13
        text: Флаг «исключения пока не было».
      - line: 15
        text: >-
          В «12о4» буква «о» русская — так и задумано: опечатка похожа на ноль. Вызов стоит внутри
          `try`, поэтому исключение не остановит тест.
      - line: 17
        text: Сюда Python попадает, только если была именно ValueError. Флаг поднимается.
      - line: 18
        text: >-
          Проверка флага. Если бы функция вернула число вместо исключения, флаг остался бы False, и
          тест упал бы с сообщением «ожидали ValueError для «12о4»».
    tryIt: >-
      Замени в строке 4 `raise ValueError("номер карты — только цифры")` на `return 0` — это
      старое поведение из истории. Запусти: тест упадёт с AssertionError и сообщением из строки 18.
      Потом нажми «Вернуть пример» и замени в строке 16 `ValueError` на `TypeError`: ValueError
      теперь никто не ловит, программа упадёт, а в последней строке traceback будет текст из
      `raise`.
    coach: >-
      Сломай функцию нарочно и убедись, что тест это заметил. Так ты проверяешь сам тест.

  - id: print-is-not-raise
    type: predict
    title: Сообщение или исключение?
    prompt: >-
      Самир нашёл в старом коде ещё одну версию функции — с сообщением об ошибке. Как думаешь, что
      выведет программа?
    code: |-
      def parse_card(text):
          if not text.isdigit():
              print("Ошибка: только цифры")
              return 0
          return int(text)


      raised = False
      try:
          number = parse_card("12о4")
      except ValueError:
          raised = True
      print(raised, number)
    options:
      - "True 0"
      - |-
        Ошибка: только цифры
        True 0
      - |-
        Ошибка: только цифры
        False 0
      - Программа остановится с ValueError
    answer: |-
      Ошибка: только цифры
      False 0
    explanation: >-
      Слово «Ошибка» на экране — просто текст из `print`, а не исключение. Функция вернула 0 как
      обычное значение, `except` не сработал, и флаг `raised` остался `False`. Поэтому тест с
      `assert raised` на такой функции упадёт — он и нужен, чтобы ловить такое поведение.
    coach: >-
      Напечатать «Ошибка» — не то же самое, что выбросить исключение. Тест различает их, а глаза
      легко путают.

  - id: practice-seats
    type: exercise
    title: Практика 1
    exercise:
      id: m9-l4-e1
      kind: repeat
      title: Тест на ошибку бронирования
      statement: |-
        Концертный зал продаёт билеты онлайн. Функция `book_seats(free, wanted)` бронирует места и
        возвращает, сколько свободных мест останется. Если `wanted` меньше 1 или больше свободных
        мест, она выбрасывает ValueError. Функция верная — менять её не нужно.

        Два теста уже есть: обычная бронь и бронь «больше, чем есть». Второй — образец теста с
        флагом. Допиши тесты на два других запрета:

        - бронь на 0 мест;
        - бронь на отрицательное число мест.

        Каждый новый тест вызови в блоке `if __name__ == "__main__":` перед `print`. Программа
        печатает одну строку `Все тесты прошли`.

        Тренажёр проверит твои тесты дважды: на верной функции они должны пройти, а на
        «мутантах» — версиях функции с подставленной ошибкой, как в уроке 9.2, — упасть.
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: Все тесты прошли"
      constraints:
        - Функцию `book_seats` не меняй — тесты пишутся для неё.
        - >-
          Имена новых тестов начинаются с `test_` и не повторяются: по этому началу тесты находят и
          тренажёр, и pytest.
        - pytest в тренажёре нет — тест на исключение пишется флагом.
      starterCode: |
        def book_seats(free, wanted):
            if wanted <= 0 or wanted > free:
                raise ValueError("нельзя забронировать столько мест")
            return free - wanted


        def test_normal_booking():
            assert book_seats(10, 3) == 7


        def test_too_many():
            raised = False
            try:
                book_seats(5, 6)
            except ValueError:
                raised = True
            assert raised, "6 мест из 5 — должна быть ValueError"


        # Допиши тесты: 0 мест и отрицательное число мест — тоже ValueError


        if __name__ == "__main__":
            test_normal_booking()
            test_too_many()
            print("Все тесты прошли")
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
        - id: t-ref
          kind: assert
          title: Тесты проходят на верной функции
          example: true
          code: |
            def _reference(free, wanted):
                if wanted <= 0 or wanted > free:
                    raise ValueError("нельзя забронировать столько мест")
                return free - wanted


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("book_seats")
            globals()["book_seats"] = _reference
            try:
                for _test in _tests:
                    _test()
            finally:
                globals()["book_seats"] = _saved
          message: Твои тесты проходят на верной функции `book_seats`.
        - id: t-called
          kind: assert
          title: Каждый тест вызван в блоке запуска
          code: |
            import ast

            with open(__file__, encoding="utf-8") as _file:
                _tree = ast.parse(_file.read())
            _defined = [node.name for node in _tree.body
                        if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")]
            # Имя теста отдельной строкой без скобок — не вызов.
            _bare = {id(node.value) for node in ast.walk(_tree)
                     if isinstance(node, ast.Expr) and isinstance(node.value, ast.Name)}
            _used = {node.id for node in ast.walk(_tree)
                     if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load)
                     and id(node) not in _bare}
            assert all(name in _used for name in _defined)
          message: >-
            Каждая функция `test_…` вызвана в блоке `if __name__ == "__main__":` — с круглыми
            скобками, иначе при запуске она не выполнится.
        - id: t-unique
          kind: assert
          title: Имена тестов не повторяются
          code: |
            import ast

            with open(__file__, encoding="utf-8") as _file:
                _tree = ast.parse(_file.read())
            _names = [node.name for node in _tree.body if isinstance(node, ast.FunctionDef)]
            assert len(_names) == len(set(_names))
          message: >-
            Имена функций не повторяются: второй `def` с тем же именем заменяет первую функцию, и
            первый тест пропадает.
        - id: t-m-zero
          kind: assert
          title: Тест замечает, что бронь на 0 мест прошла без ошибки
          edge: true
          code: |
            def _mutant(free, wanted):
                if wanted < 0 or wanted > free:
                    raise ValueError("нельзя забронировать столько мест")
                return free - wanted


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("book_seats")
            globals()["book_seats"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["book_seats"] = _saved
            assert _caught
          message: >-
            Твои тесты не заметили версию функции, которая разрешает бронь на 0 мест. Нужен тест,
            который ждёт ValueError для 0 мест.
        - id: t-m-negative
          kind: assert
          title: Тест замечает, что бронь на отрицательное число мест прошла без ошибки
          edge: true
          code: |
            def _mutant(free, wanted):
                if wanted == 0 or wanted > free:
                    raise ValueError("нельзя забронировать столько мест")
                return free - wanted


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("book_seats")
            globals()["book_seats"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["book_seats"] = _saved
            assert _caught
          message: >-
            Твои тесты не заметили версию функции, которая разрешает бронь на отрицательное число
            мест. Нужен тест, который ждёт ValueError для числа меньше нуля.
        - id: t-m-type
          kind: assert
          title: Тест на 0 мест отличает ValueError от другой ошибки
          code: |
            def _mutant(free, wanted):
                if wanted == 0:
                    raise TypeError("нельзя забронировать столько мест")
                if wanted < 0 or wanted > free:
                    raise ValueError("нельзя забронировать столько мест")
                return free - wanted


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("book_seats")
            globals()["book_seats"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["book_seats"] = _saved
            assert _caught
          message: >-
            Твои тесты не заметили версию функции, которая на 0 мест выбрасывает не ValueError, а
            другое исключение. Тест должен ловить именно ValueError.
        - id: t-m-type-negative
          kind: assert
          title: Тест на отрицательное число мест отличает ValueError от другой ошибки
          code: |
            def _mutant(free, wanted):
                if wanted < 0:
                    raise TypeError("нельзя забронировать столько мест")
                if wanted == 0 or wanted > free:
                    raise ValueError("нельзя забронировать столько мест")
                return free - wanted


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("book_seats")
            globals()["book_seats"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["book_seats"] = _saved
            assert _caught
          message: >-
            Твои тесты не заметили версию функции, которая на отрицательное число мест выбрасывает
            не ValueError, а другое исключение. Тест должен ловить именно ValueError.
      criteria:
        - Есть тест на бронь 0 мест и тест на бронь отрицательного числа мест; оба ждут ValueError.
        - В каждом тесте один вызов внутри `try`, ловится именно ValueError, в конце — `assert` флага.
        - Новые тесты вызываются в блоке `if __name__ == "__main__":`, программа печатает «Все тесты прошли».
        - На верной функции тесты проходят, на версиях с ошибкой — падают.
      hints:
        - >-
          Посмотри на готовый `test_too_many`: из каких частей он состоит? Что в нём останется
          таким же в тесте на 0 мест, а что поменяется? И где новый тест нужно вызвать, чтобы он
          выполнился при запуске?
        - |-
          Тот же приём на другом примере: у `int` два запрета — буквы и пустая строка. На каждый
          запрет — свой тест:

          ```python
          def test_int_letters():
              raised = False
              try:
                  int("abc")
              except ValueError:
                  raised = True
              assert raised, "int('abc') — ждали ValueError"


          def test_int_empty():
              raised = False
              try:
                  int("")
              except ValueError:
                  raised = True
              assert raised, "int('') — ждали ValueError"
          ```

          Почему не один `try` на оба вызова: после первой ValueError остаток `try` пропускается.
          Второй вызов не выполнится, и тест так и не узнает, как он себя ведёт.
        - |-
          Каркас одного теста:

          ```text
          def test_zero_seats():
              флаг = False
              try:
                  вызов book_seats: свободно 5, хотим 0
              except ValueError:
                  флаг = True
              assert флаг, "сообщение"
          ```

          Второй тест — так же, но с отрицательным числом мест. И не забудь вызвать оба теста в
          блоке `if __name__ == "__main__":` до строки с `print`.
      solution:
        code: |
          def book_seats(free, wanted):
              if wanted <= 0 or wanted > free:
                  raise ValueError("нельзя забронировать столько мест")
              return free - wanted


          def test_normal_booking():
              assert book_seats(10, 3) == 7


          def test_too_many():
              raised = False
              try:
                  book_seats(5, 6)
              except ValueError:
                  raised = True
              assert raised, "6 мест из 5 — должна быть ValueError"


          def test_zero_seats():
              raised = False
              try:
                  book_seats(5, 0)
              except ValueError:
                  raised = True
              assert raised, "0 мест — должна быть ValueError"


          def test_negative_seats():
              raised = False
              try:
                  book_seats(5, -2)
              except ValueError:
                  raised = True
              assert raised, "-2 места — должна быть ValueError"


          if __name__ == "__main__":
              test_normal_booking()
              test_too_many()
              test_zero_seats()
              test_negative_seats()
              print("Все тесты прошли")
        explanation: >-
          Каждый новый тест повторяет образец `test_too_many`: флаг, один вызов внутри `try`,
          `except ValueError`, в конце `assert` флага. Меняются только число мест и сообщение. Тест
          на 0 ловит версию функции с условием `wanted < 0`, тест на −2 — версию с `wanted == 0`. А
          `except ValueError` вместо `except Exception` замечает версию, которая выбрасывает не тот
          тип исключения.
      altSolutions:
        - code: |
            def book_seats(free, wanted):
                if wanted <= 0 or wanted > free:
