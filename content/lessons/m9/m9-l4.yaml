                raised = False
                try:
                    book_seats(5, 0)
                except ValueError:
                    raised = True
                assert raised, "0 мест — должна быть ValueError"


            def test_negative_seats():
                raised = False
                try:
                    book_seats(5, -2)
                except ValueError:
                    raised = True
                assert raised, "-2 места — должна быть ValueError"


            if __name__ == "__main__":
                test_normal_booking()
                test_too_many()
                test_zero_seats
                test_negative_seats
                print("Все тесты прошли")
          note: "Рецензия: в блоке запуска новые тесты упомянуты без скобок — они не вызываются."
          expectMistake: not-called
        - code: |
            def book_seats(free, wanted):
                if wanted <= 0 or wanted > free:
                    raise ValueError("нельзя забронировать столько мест")
                return free - wanted


            def test_normal_booking():
                assert book_seats(10, 3) == 7


            def test_too_many():
                raised = False
                try:
                    book_seats(5, 6)
                except ValueError:
                    raised = True
                assert raised, "6 мест из 5 — должна быть ValueError"


            def test_bad_numbers():
                raised = False
