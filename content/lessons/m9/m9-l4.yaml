                assert raised, "списать больше, чем есть, нельзя — нужна ValueError"


            def test_too_much():
                raised = False
                try:
                    write_off(5, 0)
                except ValueError:
                    raised = True
                assert raised, "списать 0 штук нельзя — нужна ValueError"


            if __name__ == "__main__":
                test_normal()
                test_all_stock()
                test_too_much()
                print("Все тесты прошли")
          note: "Тест скопирован, вызов поменян, а имя нет — новый test_too_much заменил готовый."
          expectMistake: same-name
        - code: |
            def write_off(stock, amount):
                if amount <= 0 or amount > stock:
                    raise "нельзя списать столько"
                return stock - amount


            def test_normal():
                assert write_off(10, 3) == 7


            def test_all_stock():
                assert write_off(5, 5) == 0


            def test_too_much():
                raised = False
                try:
                    write_off(5, 6)
                except ValueError:
                    raised = True
                assert raised, "списать больше, чем есть, нельзя — нужна ValueError"


            def test_zero_amount():
                raised = False
                try:
                    write_off(5, 0)
                except ValueError:
                    raised = True
                assert raised, "списать 0 штук нельзя — нужна ValueError"


            if __name__ == "__main__":
                test_normal()
                test_all_stock()
                test_too_much()
                test_zero_amount()
                print("Все тесты прошли")
          note: "Рецензия: raise со строкой вместо исключения — TypeError, общий разбор."
          expectMistake: null
      mistakes:
        - id: return-error
          when:
            codeRegex: 'return\s+ValueError'
          why: >-
            `return` отдаёт объект ошибки как обычное значение: функция вернула «что-то», программа
            пошла дальше, и `except` не сработал. Исключение выбрасывают командой `raise`.
          try: Замени `return` перед `ValueError(...)` на `raise`.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: raise-generic
          when:
            codeRegex: 'raise\s+(?:Exception|TypeError)\b'
          why: >-
            Функция выбрасывает не ValueError, а другое исключение. `except ValueError` в тесте и в
            вызывающем коде его не поймает — программа упадёт. Функция обещает ValueError: неверное
            значение.
          try: Выбрасывай именно `ValueError("…")`.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: call-outside-try
          when:
            errorType: ValueError
            codeRegex: '^def test_\w+\(\s*\):[ \t]*\n(?:[ \t]+(?![ \t]|try:)[^\n]*\n|[ \t]*\n)*?[ \t]+[^\n]*\bwrite_off\(\s*\w+\s*,\s*(?:0|-\s*\d+)\s*\)'
          why: >-
            Функция правильно выбросила ValueError, но твой тест её не поймал: вызов стоит вне
            `try`, и исключение остановило всю программу.
          try: >-
            Перенеси вызов `write_off` внутрь `try`, в `except ValueError` подними флаг, а в конце
            теста проверь флаг через `assert` — как в `test_too_much`.
          verify: Программа должна дойти до конца и напечатать «Все тесты прошли».
        - id: all-stock
          when:
            errorType: ValueError
          why: >-
            Функция выбросила ValueError там, где списание допустимо, и программа остановилась.
            Посмотри в traceback, на каком тесте: списать всё, что есть (5 из 5), можно — остаток
            будет 0.
          try: >-
            Проверь условие в `if`: ошибка — только когда количество не больше нуля или больше
            остатка. Ровно остаток — не ошибка.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: catches-own
          when:
            errorType: AssertionError
            codeRegex: 'def write_off\([^)]*\):(?:(?!\n\S)[\s\S])*?\bexcept\b'
          why: >-
            `raise ValueError` в функции есть, но она тут же сама ловит своё исключение: `raise`
            стоит внутри `try`, а `except` в этой же функции его перехватывает. Наружу ValueError не
            выходит, и тест получает обычное число.
          try: >-
            Убери `try` / `except` из `write_off`: функция только выбрасывает ValueError, а ловить её
            — дело вызывающего кода.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: still-returns
          when:
            errorType: AssertionError
            codeRegex: '^[ \t]+return\s+stock\s*$'
          why: >-
            В ветке ошибки функция по-прежнему возвращает остаток — `return stock`. Исключения нет,
            поэтому флаг в тесте остался `False`, и тест упал. Тест прав: он ловит именно то
            поведение, которое нужно исправить. `raise` после `return` не поможет — до него дело не
            дойдёт.
          try: >-
            В ветке ошибки замени `print` и `return stock` одной строкой: `raise ValueError(...)` с
            понятным сообщением.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: no-raise
          when:
            errorType: AssertionError
            errorIncludes: больше, чем есть
          why: >-
            Для `write_off(5, 6)` — списать 6 штук из 5 — функция не выбросила ValueError, и флаг в
            `test_too_much` остался `False`. Значит, условие в `if` для этого случая ложно, и до
            `raise` дело не доходит.
          try: >-
            Проверь условие: для 6 из 5 оно должно быть истинным. Нужна часть `amount > stock`, а
            части условия соединяет `or` — ошибка, если верна хотя бы одна.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: wrong-expectation
          when:
            errorType: AssertionError
            codeRegex: 'assert\s+not\b'
          why: >-
            Твой новый тест упал, хотя функция выбросила ValueError: `assert not …` требует, чтобы
            исключения не было. Тест на исключение проходит, когда исключение было.
          try: В конце теста проверь, что флаг поднят, — `assert` флага без `not`.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: zero-test-fails
          when:
            errorType: AssertionError
          why: >-
            Программа остановилась на AssertionError — посмотри в traceback, какой тест упал. Если
            твой тест на 0 штук, значит, `write_off(5, 0)` не выбросила ValueError: функция молча
            списывает 0. Тест прав — он нашёл ту самую ошибку, ради которой его пишут.
          try: >-
            Проверь условие в `if`: ошибка нужна и для «больше, чем есть», и для количества не
            больше нуля. Если функция уже верна, проверь сам тест: вызов внутри `try`, флаг
            поднимается в `except ValueError`, в конце — `assert` этого флага.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: tests-changed
          when:
            outputIncludes: Все тесты прошли
            failedTest: a-too-much
          why: >-
            Проверка вызывает `write_off(5, 6)` напрямую и ждёт ValueError, а функция её не
            выбрасывает. Похоже, поменялся тест, а не функция. Тест описывает требование, и
            подгонять его под старое поведение нельзя.
          try: >-
            Верни готовые тесты как было и измени функцию — в ветке ошибки нужна
            `raise ValueError(...)`.
        - id: same-name
          when:
            outputIncludes: Все тесты прошли
            failedTest: t-unique
          why: >-
            Два теста называются одинаково. Второй `def` с тем же именем заменяет первую функцию —
            как новое значение заменяет старое в переменной. Первый тест пропал: его не выполнит ни
            запуск, ни тренажёр.
          try: >-
            Дай новому тесту своё имя, например `test_zero_amount`, и вызови его в блоке запуска.
            Готовые тесты оставь как были.
        - id: print-left
          when:
            failedTest: t-io
            outputIncludes: Ошибка
          why: >-
            ValueError уже выбрасывается, но `print` в функции остался, и при запуске на экране
            лишняя строка. Сообщение теперь живёт внутри исключения, печатать его не нужно: решать,
            что показать человеку, будет вызывающий код.
          try: Убери `print` из функции — перед `raise` он не нужен.
          verify: Программа должна напечатать только «Все тесты прошли».
        - id: only-too-much
          when:
            outputIncludes: Все тесты прошли
            failedTest: a-zero
          why: >-
            Функция выбрасывает ValueError, когда списывают больше, чем есть. Но списать 0 штук тоже
            нельзя, а сейчас `write_off(5, 0)` молча возвращает 5. Тестов на этот случай в программе
            пока нет, поэтому она печатает «Все тесты прошли».
          try: >-
            Верни в условие проверку «количество не больше нуля» — она была в стартовом коде рядом с
            «больше, чем есть». Тест на 0 штук, который ты допишешь, будет следить, чтобы она не
            пропала.
        - id: negative-allowed
          when:
            outputIncludes: Все тесты прошли
            failedTest: a-negative
          why: >-
            Для отрицательного количества функция не выбрасывает ValueError: `write_off(5, -2)`
            вернёт 7 — на складе «прибавилось». Ноль и отрицательное число — разные случаи, и
            условие `amount == 0` запрещает ноль, но пропускает минус.
          try: Сделай условие для всех чисел меньше единицы, например `amount <= 0`.
        - id: not-called
          when:
            outputIncludes: Все тесты прошли
            failedTest: t-called
          why: >-
            Тест на 0 штук написан, но в блоке `if __name__ == "__main__":` его вызова нет. Тогда
            при запуске он не выполняется, и «Все тесты прошли» печатается, хотя новый тест ничего
            не проверил.
          try: Добавь вызов теста в блок запуска, перед `print`, — имя и круглые скобки.
        - id: zero-test-missing
          when:
            outputIncludes: Все тесты прошли
            failedTest: t-m-zero
          why: >-
            Функция исправлена, а теста на 0 штук пока нет: тренажёр подставил версию функции,
            которая разрешает списать 0 штук, и ни один тест не упал. Если тест есть, проверь, что
            в нём вызов с нулём и в конце стоит `assert` флага.
          try: >-
            Допиши тест по образцу `test_too_much`: внутри `try` — списание 0 штук, в
            `except ValueError` флаг поднимается, в конце — `assert` флага.
      afterPass: >-
        Функция больше не притворяется, что всё хорошо: на неверное количество вызывающий код
        получит ValueError и сможет поймать её — например, переспросить количество, как в уроке 7.4.
        А твой тест на ноль не даст этой проверке тихо пропасть. Улучшение: два отдельных `if` с
        разными сообщениями — «количество должно быть больше нуля» и «на складе только N шт.» —
        подскажут человеку, что именно не так.
      skills: [exceptions, exception-tests]

  - id: practice-timer
    type: exercise
    title: Практика 3
    exercise:
      id: m9-l4-e3
      kind: write
      title: Функция по готовым тестам
      statement: |-
        Кухонный таймер принимает время строкой вида `"мм:сс"`: `"4:05"` — это 4 минуты 5 секунд.
        Функция `to_seconds(text)` должна переводить такую строку в секунды.

        Тесты уже написаны — это требования к функции. Прочитай их и напиши функцию целиком так,
        чтобы прошли все. Главное правило для неверного ввода: функция выбрасывает ValueError, а
        не возвращает число и не падает с другой ошибкой. Неверный ввод здесь — это:

        - текст, в котором не ровно одно двоеточие: слово, число без двоеточия, пустая строка,
          `"1:02:03"`;
        - не целые числа по краям от двоеточия, например `"4.5:30"`;
        - секунд больше 59.

        Отрицательные числа в этой задаче не проверяем. Программа выводит одну строку
        `Все тесты прошли`.
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: Все тесты прошли"
      constraints:
        - Тесты не меняй — они описывают, что должна делать функция.
        - Время на входе — строка; результат — целое число секунд.
      starterCode: |
        def to_seconds(text):
            # Тесты ниже — это требования. Прочитай их и напиши функцию.
            return 0


        def test_minutes_and_seconds():
            assert to_seconds("4:05") == 245, "4:05 — это 245 секунд"


        def test_zero():
            assert to_seconds("0:00") == 0, "0:00 — это 0 секунд"


        def test_long_timer():
            assert to_seconds("90:30") == 5430, "90:30 — это 5430 секунд"


        def test_seconds_limit():
            raised = False
            try:
                to_seconds("4:75")
            except ValueError:
                raised = True
            assert raised, "секунд не может быть больше 59"


        def test_not_a_time():
            raised = False
            try:
                to_seconds("четыре")
            except ValueError:
                raised = True
            assert raised, "текст без двоеточия — ошибка"


        if __name__ == "__main__":
            test_minutes_and_seconds()
            test_zero()
            test_long_timer()
            test_seconds_limit()
            test_not_a_time()
            print("Все тесты прошли")
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          expected: Все тесты прошли
        - id: c-basic
          kind: call
          title: Минуты и секунды
          example: true
          call: to_seconds("4:05")
          expected: "245"
        - id: c-under-minute
          kind: call
          title: Меньше минуты
          example: true
          call: to_seconds("0:59")
          expected: "59"
        - id: c-minute
          kind: call
          title: "Граничный случай: ровно минута"
          edge: true
          call: to_seconds("1:00")
          expected: "60"
        - id: c-long
          kind: call
          title: Больше часа
          call: to_seconds("90:30")
          expected: "5430"
        - id: c-other
          kind: call
          title: Другое время
          call: to_seconds("12:30")
          expected: "750"
        - id: a-75
          kind: assert
          title: 75 секунд — ValueError
          example: true
          code: |
            _raised = False
            try:
                to_seconds("4:75")
            except ValueError:
                _raised = True
            assert _raised
          message: '`to_seconds("4:75")` выбрасывает ValueError: секунд больше 59.'
        - id: a-60
          kind: assert
          title: "Граничный случай: 60 секунд — уже ValueError"
          edge: true
          code: |
            _raised = False
            try:
                to_seconds("4:60")
            except ValueError:
                _raised = True
            assert _raised
          message: '`to_seconds("4:60")` выбрасывает ValueError: 60 секунд — это уже больше 59.'
        - id: a-word
          kind: assert
          title: Слово вместо времени — ValueError
          code: |
            _raised = False
            try:
                to_seconds("четыре")
            except ValueError:
                _raised = True
            assert _raised
          message: '`to_seconds("четыре")` выбрасывает ValueError: это не время.'
        - id: a-digits
          kind: assert
          title: "Граничный случай: число без двоеточия — ValueError"
          edge: true
          code: |
            _raised = False
            try:
                to_seconds("15")
            except ValueError:
                _raised = True
            assert _raised
          message: '`to_seconds("15")` выбрасывает ValueError: без двоеточия это не время мм:сс.'
        - id: a-empty
          kind: assert
          title: "Граничный случай: пустая строка — ValueError"
          edge: true
          code: |
            _raised = False
            try:
                to_seconds("")
            except ValueError:
                _raised = True
            assert _raised
          message: '`to_seconds("")` выбрасывает ValueError: пустая строка — не время.'
        - id: a-three-parts
          kind: assert
          title: "Граничный случай: два двоеточия — ValueError"
          edge: true
          code: |
            _raised = False
            try:
                to_seconds("1:02:03")
            except ValueError:
                _raised = True
            assert _raised
          message: '`to_seconds("1:02:03")` выбрасывает ValueError: в «мм:сс» двоеточие одно.'
        - id: a-fraction
          kind: assert
          title: "Граничный случай: дробные минуты — ValueError"
          edge: true
          code: |
            _raised = False
            try:
                to_seconds("4.5:30")
            except ValueError:
                _raised = True
            assert _raised
          message: '`to_seconds("4.5:30")` выбрасывает ValueError: минуты и секунды — целые числа.'
      criteria:
        - Время «мм:сс» переводится в секунды, минут может быть сколько угодно.
        - Секунд больше 59 — ValueError; 59 — ещё можно, 60 — уже нельзя.
        - Если двоеточие не одно (слово, число без двоеточия, пустая строка, «1:02:03») или по краям не целые числа, — ValueError, а не число и не другая ошибка.
        - Тесты не изменены, программа выводит «Все тесты прошли».
      hints:
        - >-
          Выпиши из тестов и условия правила: какие строки во что превращаются и на каких строках
          функция должна выбросить ValueError. Какие шаги нужны, чтобы из «4:05» получить 245?
        - |-
          Приёмы на других примерах:

          ```python
          print("3:15".split(":"))    # ['3', '15'] — две части
          print("15".split(":"))      # ['15'] — одна часть: двоеточия нет
          print("1:2:3".split(":"))   # ['1', '2', '3'] — три части
          int("abc")                  # ValueError: int сам не принимает буквы
          ```

          Если `int` уже выбрасывает ValueError, выбрасывать её вручную не нужно. А там, где Python
          промолчит (секунд 75, три части) или выбросит другую ошибку (для «15» `parts[1]` даст
          IndexError), нужна своя проверка и `raise ValueError(...)`.
        - |-
          Каркас:

          ```text
          def to_seconds(text):
              части = text, разделённый по ":"
              если частей не две: raise ValueError(...)
              минуты = int(первая часть)
              секунды = int(вторая часть)
              если секунд больше 59: raise ValueError(...)
              вернуть минуты * 60 + секунды
          ```
      solution:
        code: |
          def to_seconds(text):
              parts = text.split(":")
              if len(parts) != 2:
                  raise ValueError("нужно время в виде мм:сс")
              minutes = int(parts[0])
              seconds = int(parts[1])
              if seconds > 59:
                  raise ValueError("секунд не может быть больше 59")
              return minutes * 60 + seconds


          def test_minutes_and_seconds():
              assert to_seconds("4:05") == 245, "4:05 — это 245 секунд"


          def test_zero():
              assert to_seconds("0:00") == 0, "0:00 — это 0 секунд"


          def test_long_timer():
              assert to_seconds("90:30") == 5430, "90:30 — это 5430 секунд"


          def test_seconds_limit():
              raised = False
              try:
                  to_seconds("4:75")
              except ValueError:
                  raised = True
              assert raised, "секунд не может быть больше 59"


          def test_not_a_time():
              raised = False
              try:
                  to_seconds("четыре")
              except ValueError:
                  raised = True
              assert raised, "текст без двоеточия — ошибка"


          if __name__ == "__main__":
              test_minutes_and_seconds()
              test_zero()
              test_long_timer()
              test_seconds_limit()
              test_not_a_time()
              print("Все тесты прошли")
        explanation: >-
          `split(":")` делит строку на части. Если частей не две (двоеточия нет, как в «четыре» и
          «15», или их два, как в «1:02:03»), функция сама выбрасывает ValueError. Буквы, дроби и
          пустые части («4:», «ab:cd», «4.5:30») отсекает `int`: он выбрасывает ValueError без
