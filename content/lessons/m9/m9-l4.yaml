        - code: |
            def to_seconds(text):
                minutes, seconds = text.split(":")
                minutes = int(minutes)
                seconds = int(seconds)
                if seconds > 59:
                    print("Ошибка: секунд больше 59")
                    return 0
                return minutes * 60 + seconds


            def test_minutes_and_seconds():
                assert to_seconds("4:05") == 245, "4:05 — это 245 секунд"


            def test_zero():
                assert to_seconds("0:00") == 0, "0:00 — это 0 секунд"


            def test_long_timer():
                assert to_seconds("90:30") == 5430, "90:30 — это 5430 секунд"


            def test_seconds_limit():
                raised = False
                try:
                    to_seconds("4:75")
                except ValueError:
                    raised = True
                assert raised, "секунд не может быть больше 59"


            def test_not_a_time():
                raised = False
                try:
                    to_seconds("четыре")
                except ValueError:
                    raised = True
                assert raised, "текст без двоеточия — ошибка"


            if __name__ == "__main__":
                test_minutes_and_seconds()
                test_zero()
                test_long_timer()
                test_seconds_limit()
                test_not_a_time()
                print("Все тесты прошли")
          note: "Рецензия: на лишние секунды — print и return 0 вместо raise."
          expectMistake: no-seconds-check
      mistakes:
        - id: stub-left
          when:
            codeRegex: 'def to_seconds\([^)]*\):(?:\s*#[^\n]*)*\s*return 0\b'
          where: Тело функции `to_seconds`
          why: >-
            Функция пока заглушка: на любое время она возвращает 0. Первый же тест ждёт 245 для
            «4:05» и падает.
          try: >-
            Начни с первого теста: как из строки «4:05» получить 4 минуты и 5 секунд? Раздели строку
            по двоеточию и преврати части в числа.
        - id: wrong-multiplier
          when:
            codeRegex: '\*\s*100\b'
          why: 'В минуте 60 секунд, а не 100: «4:05» — это 4 * 60 + 5 = 245.'
          try: Умножай минуты на 60.
        - id: raise-generic
          when:
            codeRegex: 'raise\s+(?:Exception|TypeError|IndexError)\b'
          why: >-
            Функция выбрасывает не ValueError, а другое исключение. Тест `test_not_a_time` и
            вызывающий код ловят `except ValueError` — такое исключение они не поймают, и программа
            упадёт.
          try: 'Выбрасывай именно `ValueError("…")`: неверный текст — это неверное значение.'
          verify: Программа должна напечатать «Все тесты прошли».
        - id: no-seconds-check
          when:
            errorType: AssertionError
            errorIncludes: больше 59
          why: >-
            Тест `test_seconds_limit` — это требование: секунд не больше 59. Сейчас на «4:75»
            функция не выбрасывает ValueError, а возвращает число, хотя такого времени не бывает.
            `int("75")` работает без ошибок, поэтому Python сам ничего не заметит.
          try: >-
            После того как секунды стали числом, проверь их. Больше 59 — выброси
            `ValueError(...)`.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: catches-inside
          when:
            errorType: AssertionError
            errorIncludes: без двоеточия
          why: >-
            Для «четыре» функция вернула число вместо ValueError. Так бывает, если функция сама
            ловит ошибку (`try` / `except` внутри) или возвращает 0 на неверный текст. Тогда
            вызывающий код получит 0 секунд и не узнает, что ввод был неверным.
          try: >-
            Не перехватывай ValueError внутри `to_seconds` и не возвращай число для неверного
            текста — пусть исключение выходит из функции наружу.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: index-error
          when:
            errorType: IndexError
          why: >-
            Для строки без двоеточия, например «15», `split(":")` даёт список из одного элемента, и
            `parts[1]` выбрасывает IndexError. Требование другое: для любого текста, который не
            время мм:сс, нужна ValueError — её ловит вызывающий код.
          try: >-
            После `split` проверь, что частей ровно две. Если нет — выброси `ValueError(...)` сам.
        - id: limit-60
          when:
            outputIncludes: Все тесты прошли
            failedTest: a-60
          why: >-
            60 секунд — это уже целая минута, по правилам секунд не больше 59. Сейчас «4:60»
            проходит без ошибки: граница сдвинута на единицу.
          try: >-
            Проверь сравнение в условии: ошибка должна быть уже при 60 — `> 59` или `>= 60`.
        - id: limit-59
          when:
            outputIncludes: Все тесты прошли
            failedTest: c-under-minute
            errorType: ValueError
          why: >-
            Для «0:59» функция выбросила ValueError, а 59 секунд — ещё правильное время. Граница
            сдвинута на единицу в другую сторону.
          try: >-
            Проверь сравнение в условии: ошибка нужна только при 60 и больше — `> 59` или `>= 60`.
        - id: extra-colon
          when:
            outputIncludes: Все тесты прошли
            failedTest: a-three-parts
          why: >-
            Для «1:02:03» функция вернула число: она берёт первые две части и не замечает третью. В
            «мм:сс» двоеточие ровно одно, а проверка «есть ли двоеточие» или перехват IndexError
            лишнее двоеточие не замечают.
          try: >-
            После `split(":")` проверь, что частей ровно две. Если нет — выброси `ValueError(...)`.
        - id: float-used
          when:
            outputIncludes: Все тесты прошли
            codeRegex: '\bfloat\('
          why: >-
            `float` превращает «4.5» в 4.5, и функция принимает дробные минуты, а результат
            становится дробным: 245.0 вместо 245. В «мм:сс» минуты и секунды — целые числа.
          try: >-
            Преврати части в числа через `int`: на «4.5» он сам выбросит ValueError, и отдельная
            проверка не понадобится.
      afterPass: >-
        Ты написал функцию по чужим тестам — так часто работают в команде: тесты описывают, что
        должно получиться. Улучшение: если твоя функция пропускает минус, `"-1:30"` даст −30
        секунд. Какой тест это покажет — и что тогда должна сделать функция?
      skills: [exception-tests, exceptions, string-methods]

  - id: pytest-raises
    type: checklist
    title: pytest.raises на компьютере (по желанию)
    body: >-
      Если ты за компьютером и у тебя есть папка `python-practice\m9` с окружением и pytest из
      урока 9.3, этот блок займёт около 5 минут. Если нет — пропусти его: урок засчитывается и без
      него. Команды — для Windows и «Командной строки» (cmd), как в уроках 8.3 и 9.3. На macOS и
      Linux окружение включается командой `source .venv/bin/activate`, а вместо `python` пишут
      `python3`.
    items:
      - id: seats-files
        text: |-
          **Создай два файла** в папке `m9`. В `seats.py` — только функция
          `book_seats` из практики 1, без тестов. В `test_seats.py` — тесты через `pytest.raises`:

          ```python
          import pytest
          from seats import book_seats


          def test_normal_booking():
              assert book_seats(10, 3) == 7


          def test_too_many():
              with pytest.raises(ValueError):
                  book_seats(5, 6)


          def test_zero_seats():
              with pytest.raises(ValueError):
                  book_seats(5, 0)
          ```
        help: >-
          Открой «Командную строку» в папке `m9` и включи окружение: `.venv\Scripts\activate`. В
          начале строки должно появиться `(.venv)`. Имена файлов пиши точно так: pytest ищет файлы
          `test_*.py`, а `from seats import book_seats` ищет файл `seats.py` рядом.
      - id: seats-run
        text: >-
          **Запусти тесты** командой `python -m pytest -v test_seats.py`. У всех трёх тестов
          должно быть `PASSED`.
        help: >-
          `ModuleNotFoundError: No module named 'seats'` — файл назван иначе или лежит не рядом с
          `test_seats.py`. `file or directory not found: test_seats.py` — «Командная строка» открыта
          не в папке `m9`. `No module named pytest` — окружение не включено: pytest стоит внутри
          него.
      - id: seats-break
        text: >-
          **Сломай функцию и прочитай отчёт.** В `seats.py` поставь `#` в начале строк с `if` и с
          `raise` — проверка пропадёт. Сохрани файл и запусти тесты ещё раз. Тесты `test_too_many`
          и `test_zero_seats` упадут, а в отчёте будет строка примерно такая:
          `Failed: DID NOT RAISE <class 'ValueError'>`. Оформление вокруг неё у тебя может
          отличаться.
        help: >-
          DID NOT RAISE — «не выбросила»: код внутри `with pytest.raises(ValueError):` отработал
          без исключения. Если тесты всё ещё `PASSED` — файл не сохранён. Если появилась
          IndentationError — закомментируй обе строки, и `if`, и `raise`.
      - id: seats-restore
        text: >-
          **Верни строки:** убери `#`, сохрани и запусти ещё раз — все три теста снова `PASSED`.
        help: >-
          Если хочешь, добавь в `test_seats.py` тест на отрицательное число мест — так же, через
          `pytest.raises`.
    coach: >-
      Флаг и `pytest.raises` проверяют одно и то же. Флаг работает везде, `pytest.raises` короче,
      но только вместе с pytest.

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - 'На неверный ввод функция выбрасывает исключение — `raise ValueError("…")`, а не печатает сообщение и не возвращает 0.'
      - 'Тест на исключение в тренажёре — флаг: `raised = False` → один вызов внутри `try` → `except ValueError: raised = True` → `assert raised`.'
      - "На компьютере то же короче: `with pytest.raises(ValueError):`."
      - "Лови конкретный тип: `except Exception` засчитает любую ошибку и спрячет неверное поведение функции."
    question: Почему в тесте на исключение пишут `except ValueError`, а не `except Exception`?
    answer: >-
      `except Exception` засчитает любое исключение — TypeError, IndexError или NameError из-за
      опечатки. Тест пройдёт, хотя функция ведёт себя не так, как обещала. Конкретный тип проверяет
      именно контракт: на неверный ввод — ValueError, и только она.
