                    book_seats(5, 0)
                    book_seats(5, -3)
                except ValueError:
                    raised = True
                assert raised, "0 и -3 — должна быть ValueError"


            if __name__ == "__main__":
                test_normal_booking()
                test_too_many()
                test_bad_numbers()
                print("Все тесты прошли")
          note: "Рецензия: два вызова в одном try — второй не выполняется после первой ValueError."
          expectMistake: two-calls-one-try
        - code: |
            def book_seats(free, wanted):
                if wanted <= 0 or wanted > free:
                    raise ValueError("нельзя забронировать столько мест")
                return free - wanted


            def test_normal_booking():
                assert book_seats(10, 3) == 7


            def test_too_many():
                raised = False
                try:
                    book_seats(5, 6)
                except ValueError:
                    raised = True
                assert raised, "6 мест из 5 — должна быть ValueError"


            def test_zero_seats():
                raised = False
                try:
                    book_seats(5, 0)
                except ValueError:
                    raised = True
                assert raised, "0 мест — должна быть ValueError"


            def test_zero_seats():
                raised = False
                try:
                    book_seats(5, -3)
                except ValueError:
                    raised = True
                assert raised, "-3 места — должна быть ValueError"


            if __name__ == "__main__":
                test_normal_booking()
                test_too_many()
                test_zero_seats()
                test_zero_seats()
                print("Все тесты прошли")
          note: "Рецензия: тест скопирован, число поменяно, а имя нет — второй def заменяет первый."
          expectMistake: same-name
      mistakes:
        - id: pytest-import
          when:
            errorIncludes: pytest
          why: >-
            В тренажёре нет pytest: он ставится на компьютере в окружение проекта, как в уроке 9.3.
            Поэтому `import pytest` здесь не работает.
          try: >-
            Напиши тест на исключение на чистом Python — флагом, как в `test_too_many`.
            `pytest.raises` пригодится на компьютере.
          verify: Программа должна напечатать «Все тесты прошли».
        - id: wrong-type-caught
          when:
            errorType: ValueError
            codeRegex: 'except\s+(?!ValueError\b|Exception\b|BaseException\b)\w+'
          why: >-
            Функция правильно выбросила ValueError, а `except` в тесте ждёт другой тип. ValueError
            он не ловит, и исключение остановило всю программу.
          try: Лови тот тип, который обещает функция, — `except ValueError`, как в `test_too_many`.
          verify: Программа должна дойти до конца и напечатать «Все тесты прошли».
        - id: call-outside-try
          when:
            errorType: ValueError
          why: >-
            Функция правильно выбросила ValueError, но тест её не поймал: вызов стоит вне `try`, и
            исключение остановило всю программу. Само исключение на экране ещё не значит, что тест
            его проверил.
          try: >-
            Перенеси вызов `book_seats` внутрь `try`, в `except ValueError` подними флаг, а в конце
            теста проверь флаг через `assert` — как в `test_too_many`.
          verify: Программа должна дойти до конца и напечатать «Все тесты прошли».
        - id: wrong-expectation
          when:
            errorType: AssertionError
          why: >-
            Твой тест упал на верной функции — значит, неверно ожидание в самом тесте. Тест на
            исключение проходит, когда исключение было, и падает, когда его не было.
          try: >-
            Проверь три вещи. Ждёт ли тест ValueError там, где функция и правда её выбрасывает, —
            для 0 и отрицательного числа мест? Поднимается ли флаг в `except ValueError` (а не в
            `try` после вызова) — и тот же ли это флаг, что в `assert`? И требует ли последняя
            строка, чтобы флаг был поднят, — `assert` флага без `not`?
          verify: Программа должна напечатать «Все тесты прошли».
        - id: ref-fails
          when:
            failedTest: t-ref
            outputIncludes: Все тесты прошли
          why: >-
            Один из твоих тестов падает на верной функции, но в блоке запуска он не вызван, поэтому
            программа всё равно печатает «Все тесты прошли». Значит, неверно ожидание в самом тесте:
            тест на исключение проходит, когда исключение было.
          try: >-
            Вызови все тесты в блоке `if __name__ == "__main__":` и запусти программу: упавший тест
            покажет строку с AssertionError. Потом проверь, чего он ждёт.
        - id: same-name
          when:
            outputIncludes: Все тесты прошли
            failedTest: t-unique
          why: >-
            Два теста называются одинаково. Второй `def` с тем же именем заменяет первую функцию —
            как новое значение заменяет старое в переменной. Первый тест пропал: его не выполнит ни
            запуск, ни тренажёр.
          try: >-
            Дай каждому тесту своё имя, например `test_zero_seats` и `test_negative_seats`, и вызови
            оба в блоке запуска.
        - id: broad-except
          when:
            outputIncludes: Все тесты прошли
            codeRegex: 'except\s*:|except\s+(?:Base)?Exception\b'
          why: >-
            `except Exception` (и `except:` без типа) ловит любое исключение. Тренажёр подставил
            версию функции, которая вместо ValueError выбрасывает TypeError, и твой тест её
            пропустил: флаг поднялся, хотя функция нарушила обещание.
          try: Лови ровно тот тип, который обещает функция, — `except ValueError`.
        - id: two-calls-one-try
          when:
            outputIncludes: Все тесты прошли
            codeRegex: 'try:[ \t]*\n[ \t]+book_seats\([^\n]*\n(?:[ \t]*(?![ \t]|except\b|finally\b)[^\n]*\n)*?[ \t]+book_seats\('
          why: >-
            В одном `try` стоят два вызова `book_seats`. Как только первый выбросит ValueError,
            остаток `try` пропускается (урок 7.3): второй вызов не выполнится, а флаг уже поднят.
            Такой тест пройдёт, если ошибку выбросил хотя бы один вызов, и не заметит версию
            функции, которая пропускает другой случай.
          try: >-
            Одна проверка — один вызов внутри `try` и свой флаг. Раздели тест на два: для 0 мест и
            для отрицательного числа.
        - id: not-test-name
          when:
            outputIncludes: Все тесты прошли
            codeRegex: '^def (?!test_)\w+\(\s*\):[ \t]*\n(?:(?:[ \t]+[^\n]*)?\n)*?[ \t]+assert\b'
          why: >-
            Тренажёр, как и pytest, находит тесты по имени: функция-тест называется с `test_`.
            Функцию с другим именем он не видит и на «мутантах» не запускает — поэтому кажется, что
            теста нет.
          try: >-
            Переименуй свои тесты так, чтобы имя начиналось с `test_`, например `test_zero_seats`,
            — и в `def`, и в вызове.
        - id: missed-zero
          when:
            outputIncludes: Все тесты прошли
            failedTest: t-m-zero
          why: >-
            Тренажёр подставил версию функции, которая бронирует 0 мест без ошибки, и ни один твой
            тест не упал. Либо теста на 0 мест нет, либо в конце теста нет `assert` флага — тогда
            тест не может упасть совсем.
          try: >-
            Проверь, что есть тест с бронью на 0 мест: `wanted` равно 0, например `book_seats(5, 0)`.
            Вызов стоит внутри `try`, а тест заканчивается проверкой флага.
        - id: missed-negative
          when:
            outputIncludes: Все тесты прошли
            failedTest: t-m-negative
          why: >-
            Тренажёр подставил версию функции, которая разрешает отрицательное число мест, и ни один
            твой тест не упал. Ноль и отрицательное число — разные случаи: версия с условием
            `wanted == 0` запрещает ноль и пропускает минус.
          try: >-
            Добавь тест с бронью на отрицательное число мест: `wanted` меньше нуля, например −2.
            Тест ждёт ValueError.
        - id: not-called
          when:
            outputIncludes: Все тесты прошли
            failedTest: t-called
          why: >-
            Тесты написаны, но в блоке `if __name__ == "__main__":` их нет. Тогда при запуске они
            не выполняются, и «Все тесты прошли» печатается, хотя новые тесты ничего не проверили.
          try: >-
            Добавь вызов каждого нового теста в блок запуска, перед `print`: имя и скобки —
            `test_zero_seats()`.
      afterPass: >-
        У каждого запрета функции теперь есть свой тест: «больше, чем есть», ноль и отрицательное
        число. Если ты не писал сообщения в `assert`, добавь их: при падении сразу видно, какой
        запрет сломался.
      skills: [exception-tests, edge-cases]

  - id: practice-write-off
    type: exercise
    title: Практика 2
    exercise:
      id: m9-l4-e2
      kind: modify
      title: ValueError вместо print — и тест на ноль
      statement: |-
        Склад интернет-магазина. Функция `write_off(stock, amount)` списывает товар и возвращает,
        сколько останется. Списать 0 штук, отрицательное количество или больше, чем есть, нельзя.
        Сейчас в таком случае функция печатает сообщение и возвращает остаток как есть — и
        вызывающий код не узнаёт, что списания не было.

        Сделай две вещи:

        1. Измени **функцию**: в ветке ошибки вместо `print` и `return` выброси ValueError с
           понятным сообщением. Готовый тест `test_too_much` уже ждёт этого.
        2. Допиши свой тест: списать 0 штук нельзя — функция выбрасывает ValueError. Вызови его в
           блоке `if __name__ == "__main__":` перед `print`.

        После исправления функция ничего не печатает, а программа выводит одну строку
        `Все тесты прошли`. Твой тест тренажёр проверит, как в практике 1: на верной функции он
        проходит, а на версии, которая разрешает списать 0 штук, — падает.
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: Все тесты прошли"
      constraints:
        - Готовые тесты не меняй — они описывают, как функция должна себя вести.
        - Имя нового теста начинается с `test_` и не повторяет имена готовых тестов.
        - Текст сообщения в ValueError — любой понятный.
      starterCode: |
        def write_off(stock, amount):
            if amount <= 0 or amount > stock:
                print("Ошибка: нельзя списать", amount, "шт.")
                return stock
            return stock - amount


        def test_normal():
            assert write_off(10, 3) == 7


        def test_all_stock():
            assert write_off(5, 5) == 0


        def test_too_much():
            raised = False
            try:
                write_off(5, 6)
            except ValueError:
                raised = True
            assert raised, "списать больше, чем есть, нельзя — нужна ValueError"


        # Допиши тест: списать 0 штук — тоже ValueError


        if __name__ == "__main__":
            test_normal()
            test_all_stock()
            test_too_much()
            print("Все тесты прошли")
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
        - id: c-normal
          kind: call
          title: Обычное списание
          example: true
          call: write_off(10, 3)
          expected: "7"
        - id: c-all
          kind: call
          title: Списать всё, что есть
          example: true
          call: write_off(5, 5)
          expected: "0"
        - id: a-too-much
          kind: assert
          title: Больше, чем есть, — ValueError
          example: true
          code: |
            _raised = False
            try:
                write_off(5, 6)
            except ValueError:
                _raised = True
            assert _raised
          message: "`write_off(5, 6)` выбрасывает ValueError: списать 6 штук из 5 нельзя."
        - id: a-zero
          kind: assert
          title: "Граничный случай: 0 штук — ValueError"
          edge: true
          code: |
            _raised = False
            try:
                write_off(5, 0)
            except ValueError:
                _raised = True
            assert _raised
          message: "`write_off(5, 0)` выбрасывает ValueError: списать 0 штук нельзя."
        - id: a-negative
          kind: assert
          title: "Граничный случай: отрицательное количество — ValueError"
          edge: true
          code: |
            _raised = False
            try:
                write_off(5, -2)
            except ValueError:
                _raised = True
            assert _raised
          message: "`write_off(5, -2)` выбрасывает ValueError: отрицательное количество списать нельзя."
        - id: t-ref
          kind: assert
          title: Тесты проходят на верной функции
          code: |
            def _reference(stock, amount):
                if amount <= 0 or amount > stock:
                    raise ValueError("нельзя списать")
                return stock - amount


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("write_off")
            globals()["write_off"] = _reference
            _all_passed = True
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _all_passed = False
            finally:
                globals()["write_off"] = _saved
            assert _all_passed
          message: Твои тесты проходят на верной функции `write_off`.
        - id: t-called
          kind: assert
          title: Каждый тест вызван в блоке запуска
          code: |
            import ast

            with open(__file__, encoding="utf-8") as _file:
                _tree = ast.parse(_file.read())
            _defined = [node.name for node in _tree.body
                        if isinstance(node, ast.FunctionDef) and node.name.startswith("test_")]
            # Имя теста отдельной строкой без скобок — не вызов.
            _bare = {id(node.value) for node in ast.walk(_tree)
                     if isinstance(node, ast.Expr) and isinstance(node.value, ast.Name)}
            _used = {node.id for node in ast.walk(_tree)
                     if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load)
                     and id(node) not in _bare}
            assert all(name in _used for name in _defined)
          message: >-
            Каждая функция `test_…` вызвана в блоке `if __name__ == "__main__":` — с круглыми
            скобками, иначе при запуске она не выполнится.
        - id: t-unique
          kind: assert
          title: Имена тестов не повторяются
          code: |
            import ast

            with open(__file__, encoding="utf-8") as _file:
                _tree = ast.parse(_file.read())
            _names = [node.name for node in _tree.body if isinstance(node, ast.FunctionDef)]
            assert len(_names) == len(set(_names))
          message: >-
            Имена функций не повторяются: второй `def` с тем же именем заменяет первую функцию, и
            первый тест пропадает.
        - id: t-m-zero
          kind: assert
          title: Твой тест замечает, что списание 0 штук прошло без ошибки
          edge: true
          code: |
            def _mutant(stock, amount):
                if amount < 0 or amount > stock:
                    raise ValueError("нельзя списать")
                return stock - amount


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("write_off")
            globals()["write_off"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["write_off"] = _saved
            assert _caught
          message: >-
            Твои тесты не заметили версию функции, которая разрешает списать 0 штук. Нужен тест,
            который ждёт ValueError при списании 0 штук.
      criteria:
        - На верное количество функция возвращает остаток, в том числе 0, если списали всё.
        - На 0, отрицательное количество и «больше, чем есть» функция выбрасывает ValueError и ничего не печатает.
        - Есть новый тест на списание 0 штук — флагом, с одним вызовом внутри `try`; он вызван в блоке запуска.
        - Готовые тесты не изменены, программа выводит «Все тесты прошли».
      hints:
        - >-
          Начни с функции: что `test_too_much` ждёт от неё при списании 6 штук из 5 и что она
          делает сейчас? Запусти программу и посмотри, какая строка появилась перед ошибкой. Потом
          новый тест: какой вызов в нём должен выбросить ValueError?
        - |-
          Оба приёма на другом примере:

          ```python
          def check_age(age):
              if age < 0:
                  raise ValueError("возраст не бывает отрицательным")
              return age


          def test_negative_age():
              raised = False
              try:
                  check_age(-3)
              except ValueError:
                  raised = True
              assert raised, "-3 года — ждали ValueError"
          ```

          Вызов `check_age(-3)` ничего не вернёт: функция остановится на `raise`, вызывающий код
          получит ValueError, а тест поднимет флаг.
        - |-
          Каркас — в ветке ошибки две строки (`print` и `return stock`) заменяются одной:

          ```text
          def write_off(stock, amount):
              если количество неверное:
                  raise ValueError(<понятное сообщение: что не так>)
              вернуть stock - amount


          def test_zero_amount():
              флаг = False
              try:
                  вызов write_off: на складе 5, списать 0
              except ValueError:
                  флаг = True
              assert флаг, "сообщение"
          ```

          И вызови новый тест в блоке `if __name__ == "__main__":` до строки с `print`.
      solution:
        code: |
          def write_off(stock, amount):
              if amount <= 0 or amount > stock:
                  raise ValueError(f"нельзя списать {amount} шт.")
              return stock - amount


          def test_normal():
              assert write_off(10, 3) == 7


          def test_all_stock():
              assert write_off(5, 5) == 0


          def test_too_much():
              raised = False
              try:
                  write_off(5, 6)
              except ValueError:
                  raised = True
              assert raised, "списать больше, чем есть, нельзя — нужна ValueError"


          def test_zero_amount():
              raised = False
              try:
                  write_off(5, 0)
              except ValueError:
                  raised = True
              assert raised, "списать 0 штук нельзя — нужна ValueError"


          if __name__ == "__main__":
              test_normal()
              test_all_stock()
              test_too_much()
              test_zero_amount()
              print("Все тесты прошли")
        explanation: >-
          `raise` останавливает функцию, поэтому `return stock` в ветке ошибки больше не нужен, а
          `print` не нужен тем более: текст ошибки теперь живёт внутри исключения. Условие не
          менялось — ValueError выбрасывается и для 0, и для отрицательного количества, и для
          «больше, чем есть», а списать ровно всё (5 из 5) по-прежнему можно. Новый тест устроен
          как `test_too_much`, только вызов другой — `write_off(5, 0)`. Если кто-то уберёт из
          условия проверку нуля, этот тест упадёт.
      altSolutions:
        - code: |
            def write_off(stock, amount):
                if amount <= 0:
