              assert find_songs(playlist, запрос из отзыва) == [название из плейлиста]

          if __name__ == "__main__":
              вызов теста
              print("Все тесты прошли")
          ```
          Запусти — тест красный. Потом в `find_songs` приведи к одному регистру обе строки в
          сравнении и запусти снова.
