id: m9-l5
module: m9
number: "9.5"
title: "Регрессия: тест, который помнит ошибку"
objective: >-
  Получив сообщение об ошибке, сначала написать тест, который её воспроизводит и падает, затем
  исправить код и оставить тест в наборе, чтобы ошибка не вернулась.
minutes: [25, 30]
prerequisites: [m9-l4, m6-l2]
skills: [regression-tests, debugging, edge-cases]
environment: python

story:
  title: "3:5 вместо 3:05"
  fictional: true
  text: >-
    Лера делает музыкальный плеер. Слушатель написал в отзыве, что трек длиной три минуты пять
    секунд показывается как «3:5». Прежде чем чинить, Лера записала этот пример в тест и
    запустила его: тест упал, значит, ошибка поймана. Потом она исправила функцию, и тест прошёл.
    Через полгода коллега «упростил» вывод времени, и тот же тест упал раньше, чем новая версия
    дошла до слушателей.

why: >-
  Исправленные ошибки любят возвращаться: при переделке кода, при «упрощении», при слиянии
  веток. Тест, написанный на конкретную ошибку, не даст ей вернуться незаметно. Например,
  проверка `format_time(185) == "3:05"` упадёт, как только кто-то снова потеряет ноль.

usedIn: >-
  Во многих командах действует правило «исправил ошибку — добавь тест». К сообщению об ошибке
  прикладывают пример, на котором она повторяется, а исправление и тест сохраняют одним коммитом.
  Тестировщики превращают найденные ошибки в автотесты, чтобы проверять их при каждой новой
  версии программы.

steps:
  - id: regression
    type: theory
    title: Регрессия и тест, который её помнит
    body: |-
      **Регрессия** — когда исправленная ошибка появляется снова или новое изменение ломает то,
      что раньше работало. Код переделывают, «упрощают», сливают ветки — и старая ошибка тихо
      возвращается.

      **Регрессионный тест** — тест на конкретную найденную ошибку. Его оставляют в наборе
      навсегда, а имя или комментарий рядом объясняет, что это за ошибка:
      `test_seconds_below_ten` — «секунд меньше десяти».

      **Порядок «красный → зелёный».** Красный тест падает, зелёный проходит — такими цветами их
      показывают pytest и редакторы кода. Пришло сообщение об ошибке:

      1. Воспроизведи ошибку на маленьком примере (урок 6.2): трек в 185 секунд показывается как
         «3:5».
      2. Запиши пример в тест и запусти. Тест **должен упасть**, и именно на этой ошибке: в
         сообщении AssertionError видно `3:5`, как в отзыве. Тогда ясно, что тест ловит её, а не
         что-то другое.
      3. Исправь код.
      4. Запусти тест снова — он зелёный.
      5. Запусти все тесты: исправление могло сломать что-то другое.
      6. Сохрани исправление и тест одним коммитом (урок 8.4).

      **Почему тест пишут до исправления.** Если написать его после, неизвестно, упал бы он на
      старом коде. Может быть, он проверяет не то, и ошибка вернётся незаметно.

      **Ожидание — из требований, а не из вывода.** Когда тест падает, хочется переписать
      ожидание под то, что выдала программа. Тест позеленеет, но ошибку он узаконит: теперь он
      сторожит неверное поведение.

      **Как это проверяет тренажёр.** Старую версию функции тренажёр хранит у себя. Он
      проверит, что твой регрессионный тест на ней падает, а на исправленной — проходит. Пока
      тест красный, «Запустить» останавливает программу с AssertionError: на шаге 2 так и
      должно быть. Если на этом шаге нажать «Проверить», красными будут все проверки:
      программа останавливается на твоём тесте раньше, чем тренажёр до них доходит.
      «Проверить» засчитает задание, когда всё станет зелёным.
    simpler: >-
      Сначала поймай ошибку тестом — он красный. Потом почини код — тест зелёный. И оставь тест
      в наборе: он сторожит, чтобы ошибка не вернулась. Ожидание в тесте бери из требований, а не
      из того, что вывела программа.
    coach: >-
      Красный тест до исправления — не неудача, а доказательство, что ты поймал именно ту
      ошибку.

  - id: time-test
    type: example
    title: Тест на ошибку «3:5»
    body: |-
      Раньше функция заканчивалась строкой `return f"{minutes}:{rest}"`, и трек в 185 секунд
      показывался как `3:5`. Лера сначала написала `test_seconds_below_ten`, запустила и увидела
      AssertionError. Только после этого она исправила функцию. Ниже код после исправления.
      Нажми «Запустить».
    code: |-
      def format_time(seconds):
          minutes = seconds // 60
          rest = seconds % 60
          if rest < 10:
              return f"{minutes}:0{rest}"
          return f"{minutes}:{rest}"


      # Ошибка из отзыва: трек длиной 185 секунд показывался как «3:5»
      def test_seconds_below_ten():
          assert format_time(185) == "3:05", f"получили {format_time(185)}"


      def test_regular_time():
          assert format_time(250) == "4:10"


      def test_whole_minutes():
          assert format_time(120) == "2:00"


      if __name__ == "__main__":
          test_seconds_below_ten()
          test_regular_time()
          test_whole_minutes()
          print("Все тесты прошли")
    notes:
      - line: 4
        text: Исправление. Если секунд меньше десяти, перед ними дописывается ноль.
      - line: 9
        text: >-
          Комментарий говорит, какую ошибку сторожит тест. Через полгода никто не вспомнит, зачем
          он нужен, а комментарий напомнит.
      - line: 11
        text: >-
          Ожидание `"3:05"` взято из требования: так время должно выглядеть. Старая версия
          возвращала `"3:5"`, но подгонять ожидание под неё никто не стал. Сообщение после
          запятой показывает, что вернула функция: на красном шаге там было `получили 3:5`.
      - line: 19
        text: >-
          Этот тест Лера добавила вместе с исправлением: проверяя код, она заметила, что ноль
          терялся и у целых минут — выходило `2:0`.
      - line: 22
        text: >-
          Блок запуска из урока 9.3 вызывает тесты, когда файл запускают. pytest вызвал бы их
          сам.
    tryIt: >-
      Замени строки 4–6 одной старой строкой `return f"{minutes}:{rest}"` и запусти. Какой тест
      упал первым и что написано в сообщении? Там `получили 3:5` — та самая ошибка из отзыва.
      Это и есть регрессионный тест: он сторожит ошибку «3:5». Потом верни исправление.
    coach: >-
      Регрессионный тест ничем не отличается от обычного. Особенный у него только повод: он
      появился из настоящей ошибки.

  - id: fitted-test
    type: predict
    title: Сколько заплатят трое?
    prompt: >-
      Функция делит счёт за ужин между друзьями в целых рублях. Счёт — 100 рублей, друзей трое.
      Как думаешь, что напечатает программа?
    code: |-
      def split_bill(total, people):
          share = total // people
          result = []
          for i in range(people):
              result.append(share)
          return result


      def test_three_people():
          assert split_bill(100, 3) == [33, 33, 33]


      test_three_people()
      print("Тест прошёл, сумма долей:", sum(split_bill(100, 3)))
    options:
      - "Тест прошёл, сумма долей: 99"
      - "Тест прошёл, сумма долей: 100"
      - "AssertionError — тест упадёт"
    answer: "Тест прошёл, сумма долей: 99"
    explanation: >-
      Функция отдаёт каждому по `100 // 3`, то есть по 33 рубля, а остаток — 1 рубль — теряется.
      Тест ждёт ровно `[33, 33, 33]`, поэтому он зелёный. Но сумма долей — 99, а не 100: за ужин
      недоплатят рубль. Такое ожидание списали с вывода программы, и тест теперь сторожит ошибку,
      а не требование. Зелёный тест доказывает только одно: код совпадает с ожиданием. Верно ли
      само ожидание, решают требования.
    coach: >-
      Прежде чем вписать число в ожидание, спроси себя: откуда я его взял — из требований или
      из вывода программы?

  - id: practice-section
    type: exercise
    title: Практика 1
    exercise:
      id: m9-l5-e1
      kind: repeat
      title: Сначала красный тест
      statement: |-
        Спортивная секция берёт детей **от 7 до 12 лет включительно**. Функция `can_join`
        решает, можно ли записать ребёнка. Родитель пишет в поддержку: «Сыну 12 лет, а программа
        не записывает».

        Что сделать:

        1. Напиши регрессионный тест — отдельную функцию `test_…` со случаем из сообщения.
           Вызови его в блоке `if __name__ == "__main__":` **перед** `print` и нажми
           «Запустить». Тест должен упасть с AssertionError, и именно на случае из сообщения:
           это красный шаг, ошибка поймана.
        2. Исправь условие в функции и запусти снова. Должно появиться `Все тесты прошли`.

        Тренажёр проверит, что твой тест падает на старой версии функции и проходит на
        исправленной.
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - Старый тест `test_regular_ages` не удаляй и не меняй.
        - Ожидание в регрессионном тесте бери из правила секции, а не из вывода программы.
      starterCode: |
        def can_join(age):
            # В секцию берут детей от 7 до 12 лет включительно
            return age >= 7 and age < 12


        def test_regular_ages():
            assert can_join(9), "9 лет — можно"
            assert not can_join(5), "5 лет — ещё рано"


        # Сообщение от родителя: «Сыну 12 лет, а программа не записывает».
        # 1) Напиши здесь регрессионный тест с этим случаем и вызови его ниже.
        #    Запусти: тест должен упасть.
        # 2) Исправь функцию и запусти снова.


        if __name__ == "__main__":
            test_regular_ages()
            print("Все тесты прошли")
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
          compare:
            ignoreCase: true
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t-catches
          kind: assert
          title: Регрессионный тест падает на старой версии
          example: true
          code: |
            def _old(age):
                return age >= 7 and age < 12


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("can_join")
            globals()["can_join"] = _old
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["can_join"] = _saved
            assert _caught
          message: >-
            Хотя бы один твой тест падает на старой версии `can_join` — той, что не пускает
            двенадцатилетних.
        - id: t-c12
          kind: call
          title: 12 лет — можно (случай из сообщения)
          example: true
          call: can_join(12)
          expected: "True"
        - id: t-c7
          kind: call
          title: 7 лет — можно
          example: true
          call: can_join(7)
          expected: "True"
        - id: t-c13
          kind: call
          title: 13 лет — уже нельзя
          edge: true
          call: can_join(13)
          expected: "False"
        - id: t-c6
          kind: call
          title: 6 лет — ещё нельзя
          edge: true
          call: can_join(6)
          expected: "False"
        - id: t-ref
          kind: assert
          title: Тесты проходят на исправленной функции
          code: |
            def _reference(age):
                return age >= 7 and age <= 12


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("can_join")
            globals()["can_join"] = _reference
            try:
                for _test in _tests:
                    _test()
            finally:
                globals()["can_join"] = _saved
          message: >-
            Один из твоих тестов падает на верной функции. Значит, ожидание в нём не совпадает с
            правилом секции: от 7 до 12 лет включительно.
        - id: t-kept
          kind: assert
          title: Старый тест по-прежнему сторожит нижнюю границу
          code: |
            def _mutant(age):
                return age <= 12


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("can_join")
            globals()["can_join"] = _mutant
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["can_join"] = _saved
            assert _caught
          message: >-
            Тесты не заметили версию функции, которая пускает детей младше 7 лет. Раньше её ловил
            `test_regular_ages`.
        - id: t-called
          kind: assert
          title: Каждый тест вызывается при запуске
          code: |
            import ast as _ast

            with open(__file__, encoding="utf-8") as _file:
                _tree = _ast.parse(_file.read())
            _defined = [node.name for node in _tree.body
                        if isinstance(node, _ast.FunctionDef) and node.name.startswith("test_")]
            # Тест засчитан как вызванный, если его имя стоит в вызове test_…()
            # или в списке/кортеже (вариант «for test in [...]: test()»).
            _used = []
            for _node in _ast.walk(_tree):
                if isinstance(_node, _ast.Call) and isinstance(_node.func, _ast.Name):
                    _used.append(_node.func.id)
                if isinstance(_node, (_ast.List, _ast.Tuple)):
                    _used += [_item.id for _item in _node.elts if isinstance(_item, _ast.Name)]
            assert all(name in _used for name in _defined)
          message: >-
            Каждая функция `test_…` вызывается при запуске программы — например, в блоке
            `if __name__ == "__main__":`.
      criteria:
        - Есть отдельный тест со случаем из сообщения родителя (12 лет), его имя или комментарий говорит, что за ошибка.
        - Этот тест падает на старой версии функции и проходит на исправленной.
        - Функция пускает детей от 7 до 12 лет включительно, старый тест не тронут.
        - Все тесты вызываются в блоке запуска, программа печатает «Все тесты прошли».
      hints:
        - >-
          Какой возраст из сообщения родителя должен стать проверкой? Что по правилу секции
          функция обязана ответить для него — «можно» или «нельзя»?
        - |-
          На другом примере. Пользователь пишет: «Пароль из 8 символов не принимается», а по
          правилу пароль должен быть не короче 8 символов. Регрессионный тест:
          ```python
          def test_password_of_eight():
              assert is_valid("abcdefgh"), "8 символов — пароль подходит"
          ```
          Пока ошибка не исправлена, он падает, после исправления проходит.
        - |-
          Каркас:
          ```text
          def test_…():
              # Сообщение родителя: …
              assert …

          if __name__ == "__main__":
              test_regular_ages()
              вызов нового теста
              print("Все тесты прошли")
          ```
          Запусти — новый тест упадёт. Потом посмотри на сравнение с 12 в функции: включает ли
          оно само число 12?
      solution:
        code: |
          def can_join(age):
              # В секцию берут детей от 7 до 12 лет включительно
              return age >= 7 and age <= 12


          def test_regular_ages():
              assert can_join(9), "9 лет — можно"
              assert not can_join(5), "5 лет — ещё рано"


          # Ошибка из сообщения родителя: двенадцатилетнего не записывали
          def test_twelve_years_old():
              assert can_join(12), "12 лет — можно по правилу секции"


          if __name__ == "__main__":
              test_regular_ages()
              test_twelve_years_old()
              print("Все тесты прошли")
        explanation: >-
          Сначала появляется `test_twelve_years_old` с возрастом из сообщения. На старой функции
          он падает: `age < 12` не включает само 12. Это красный шаг — ошибка воспроизведена.
          Потом `<` меняется на `<=`, и тест зеленеет. Старый `test_regular_ages` тоже проходит:
          нижняя граница не пострадала. Условие можно записать и цепочкой `7 <= age <= 12`.
          Регрессионный тест остаётся в файле: если кто-то снова напишет `< 12`, этот тест упадёт
          первым.
      altSolutions:
        - code: |
            def can_join(age):
                # В секцию берут детей от 7 до 12 лет включительно
                return 7 <= age <= 12


            def test_regular_ages():
                assert can_join(9), "9 лет — можно"
                assert not can_join(5), "5 лет — ещё рано"


            def test_age_12_from_parent():
                # «Сыну 12 лет, а программа не записывает»
                assert can_join(12) == True
                assert not can_join(13)


            if __name__ == "__main__":
                test_regular_ages()
                test_age_12_from_parent()
                print("Все тесты прошли")
          note: Цепочка сравнений, ожидание через == True и заодно проверка на 13.
        - code: |
            def can_join(age):
                return age > 6 and age < 13


            def test_regular_ages():
                assert can_join(9), "9 лет — можно"
                assert not can_join(5), "5 лет — ещё рано"


            def test_edges_from_message():
                for age in [7, 12]:
                    assert can_join(age), f"{age} лет — можно"


            if __name__ == "__main__":
                for test in [test_regular_ages, test_edges_from_message]:
                    test()
                print("Все тесты прошли")
          note: Границы через соседние числа, проверка обеих границ в цикле, тесты вызываются из списка.
        - code: |
            def can_join(age):
                # В секцию берут детей от 7 до 12 лет включительно
                if age < 7:
                    return False
                if age > 12:
                    return False
                return True


            def test_regular_ages():
                assert can_join(9), "9 лет — можно"
                assert not can_join(5), "5 лет — ещё рано"


            def test_bug_twelve():
                assert can_join(12), f"12 лет: получили {can_join(12)}"


            test_regular_ages()
            test_bug_twelve()
            print("все тесты прошли")
          note: Условия через if, тесты вызваны без блока запуска, фраза с маленькой буквы.
        - code: |
            def can_join(age):
                # В секцию берут детей от 7 до 12 лет включительно
                return age in range(7, 13)


            def test_regular_ages():
                assert can_join(9), "9 лет — можно"
                assert not can_join(5), "5 лет — ещё рано"
                assert can_join(12), "12 лет — тоже можно (сообщение родителя)"


            if __name__ == "__main__":
                test_regular_ages()
                print("Все тесты прошли")
          note: >-
            Условие через range. Проверка на 12 дописана в старый тест, а не в отдельный — проверка
            это принимает (тест всё равно падает на старой версии), хотя отдельный тест с понятным
            именем лучше.
        - code: |
            def can_join(age):
                # В секцию берут детей от 7 до 12 лет включительно
                return not (age < 7 or age > 12)


