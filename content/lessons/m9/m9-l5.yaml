      solution:
        code: |
          def split_bill(total, people):
              # Делит счёт на людей в целых рублях.
              # Требования: сумма долей равна счёту, доли отличаются
              # не больше чем на 1 рубль, лишние рубли платят первые по списку.
              share = total // people
              extra = total % people
              result = []
              for i in range(people):
                  if i < extra:
                      result.append(share + 1)
                  else:
                      result.append(share)
              return result


          def test_even_split():
              assert split_bill(90, 3) == [30, 30, 30]


          def test_uneven_split():
              # Раньше функция теряла рубль: [33, 33, 33] в сумме давало 99
              assert split_bill(100, 3) == [34, 33, 33]


          if __name__ == "__main__":
              test_even_split()
              test_uneven_split()
              print("Все тесты прошли")
        explanation: >-
          Честное ожидание для 100 рублей на троих — `[34, 33, 33]`: по 33 каждому, и лишний рубль
          платит первый. С этим ожиданием тест на старой функции красный. `total % people` —
          сколько рублей осталось после деления поровну. Первые `extra` человек получают на рубль
          больше, поэтому сумма долей равна счёту, а доли отличаются не больше чем на 1. Для 8
          рублей на троих это `[3, 3, 2]`: остаток 2 рубля раздаётся по одному, а не целиком
          первому.
