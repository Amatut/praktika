  - id: practice-search
    type: exercise
    title: Практика 3
    exercise:
      id: m9-l5-e3
      kind: write
      title: Ошибка из отзыва слушателя
      statement: |-
        В плеере Леры есть поиск по плейлисту. Слушатель пишет: «Ищу „ночь“ — ничего не находит,
        хотя в плейлисте есть „Ночь над городом“».

        Требования к `find_songs(songs, query)`:

        - вернуть названия из списка `songs`, в которых встречается `query`;
        - большие и маленькие буквы не различаются;
        - названия возвращаются такими, как в плейлисте, и в том же порядке.

        Пройди весь путь сам:

        1. Напиши регрессионный тест по отзыву и вызови его в блоке
           `if __name__ == "__main__":` перед `print("Все тесты прошли")`. Запусти — тест должен
           упасть, и именно на запросе из отзыва.
        2. Исправь функцию. Запусти — должно появиться `Все тесты прошли`.

        Плейлист для тестов можно взять такой (названия придуманы):

        ```python
        ["Ночь над городом", "Летний дождь", "Дорога домой", "Ночной поезд"]
        ```
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - Названия в результате — такие, как в плейлисте, с теми же большими буквами.
        - Программа печатает только `Все тесты прошли`.
      starterCode: |
        def find_songs(songs, query):
            found = []
            for title in songs:
                if query in title:
                    found.append(title)
            return found


        # Отзыв слушателя: «Ищу "ночь" — ничего не находит,
        # хотя в плейлисте есть "Ночь над городом"».
        # Требование: поиск не различает большие и маленькие буквы,
        # а названия возвращаются такими, как в плейлисте, и в том же порядке.
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
          compare:
            ignoreCase: true
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t-catches
          kind: assert
          title: Регрессионный тест падает на старой версии
          example: true
          code: |
            def _old(songs, query):
                found = []
                for title in songs:
                    if query in title:
                        found.append(title)
                return found


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("find_songs")
            globals()["find_songs"] = _old
            _caught = False
            try:
                for _test in _tests:
                    try:
                        _test()
                    except Exception:
                        _caught = True
            finally:
                globals()["find_songs"] = _saved
            assert _caught
          message: >-
            Хотя бы один твой тест падает на старой версии `find_songs` — той, что различает
            большие и маленькие буквы.
        - id: t-c-night
          kind: call
          title: Запрос из отзыва — «ночь»
          example: true
          call: 'find_songs(["Ночь над городом", "Летний дождь", "Дорога домой", "Ночной поезд"], "ночь")'
          expected: "['Ночь над городом']"
        - id: t-c-rain
          kind: call
          title: Запрос большими буквами — «ДОЖДЬ»
          example: true
          call: 'find_songs(["Ночь над городом", "Летний дождь", "Дорога домой", "Ночной поезд"], "ДОЖДЬ")'
          expected: "['Летний дождь']"
        - id: t-c-part
          kind: call
          title: Два названия — в порядке плейлиста
          call: 'find_songs(["Ночь над городом", "Летний дождь", "Дорога домой", "Ночной поезд"], "ноч")'
          expected: "['Ночь над городом', 'Ночной поезд']"
        - id: t-c-none
          kind: call
          title: Ничего не нашлось
          edge: true
          call: 'find_songs(["Ночь над городом", "Летний дождь", "Дорога домой", "Ночной поезд"], "гроза")'
          expected: "[]"
        - id: t-c-caps
          kind: call
          title: Название целиком большими буквами
          edge: true
          call: 'find_songs(["ДОЖДЬ И ГРОМ", "Летний дождь"], "дождь")'
          expected: "['ДОЖДЬ И ГРОМ', 'Летний дождь']"
        - id: t-ref
          kind: assert
          title: Тесты проходят на верной функции
          code: |
            def _reference(songs, query):
                found = []
                for title in songs:
                    if query.lower() in title.lower():
                        found.append(title)
                return found


            _tests = [value for name, value in list(globals().items())
                      if name.startswith("test_") and callable(value)]
            _saved = globals().get("find_songs")
            globals()["find_songs"] = _reference
            try:
                for _test in _tests:
