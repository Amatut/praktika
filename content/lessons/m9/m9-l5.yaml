    type: exercise
    title: Практика 2
    exercise:
      id: m9-l5-e2
      kind: fix
      title: Тест подогнан под ошибку
      statement: |-
        Семья делит общий счёт на всех в целых рублях. Требования к функции `split_bill`
        записаны в её комментарии:

        - сумма долей равна счёту;
        - доли отличаются не больше чем на 1 рубль;
        - лишние рубли платят первые по списку.

        Например, 10 рублей на троих — это `[4, 3, 3]`, а 8 рублей на троих — `[3, 3, 2]`:
        лишних рублей два, и они достаются первым двоим по одному.

        Когда-то тест `test_uneven_split` упал, и его «починили»: вписали в ожидание то, что
        выдала функция. Теперь всё зелёное, но рубль теряется — ты видел это в прогнозе.

        Что сделать:

        1. Верни в `test_uneven_split` честное ожидание по требованиям и запусти. Тест должен
           упасть.
        2. Исправь функцию так, чтобы все тесты прошли.

        Тренажёр проверит функцию на разных счетах и убедится, что твои тесты падают на старой
        версии.
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - Тесты не удаляй — исправь ожидание в `test_uneven_split`.
        - Функция возвращает список долей по порядку людей.
        - Людей всегда хотя бы один, счёт — целое число не меньше нуля.
      starterCode: |
        def split_bill(total, people):
            # Делит счёт на людей в целых рублях.
            # Требования: сумма долей равна счёту, доли отличаются
            # не больше чем на 1 рубль, лишние рубли платят первые по списку.
            share = total // people
            result = []
            for i in range(people):
                result.append(share)
            return result


        def test_even_split():
            assert split_bill(90, 3) == [30, 30, 30]


        def test_uneven_split():
            # тест падал — ожидание поменяли, чтобы он «позеленел»
            assert split_bill(100, 3) == [33, 33, 33]


        if __name__ == "__main__":
            test_even_split()
            test_uneven_split()
            print("Все тесты прошли")
