        - id: t-called
          kind: assert
          title: Каждый тест вызывается при запуске
          code: |
            import ast as _ast

            with open(__file__, encoding="utf-8") as _file:
                _tree = _ast.parse(_file.read())
            _defined = [node.name for node in _tree.body
                        if isinstance(node, _ast.FunctionDef) and node.name.startswith("test_")]
            # Тест засчитан как вызванный, если его имя стоит в вызове test_…()
            # или в списке/кортеже (вариант «for test in [...]: test()»).
            _used = []
            for _node in _ast.walk(_tree):
                if isinstance(_node, _ast.Call) and isinstance(_node.func, _ast.Name):
                    _used.append(_node.func.id)
                if isinstance(_node, (_ast.List, _ast.Tuple)):
                    _used += [_item.id for _item in _node.elts if isinstance(_item, _ast.Name)]
            assert all(name in _used for name in _defined)
          message: >-
            Каждая функция `test_…` вызывается при запуске программы — например, в блоке
            `if __name__ == "__main__":`.
