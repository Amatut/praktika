          why: >-
            Функция пускает шестилетних, а по правилу — от 7 лет. Старый тест этого не заметил:
            он проверяет 5 лет, а граница проходит между 6 и 7.
          try: >-
            Поправь нижнюю границу: 7 лет — можно, 6 — нельзя. Для уверенности добавь в
            регрессионный тест `assert not can_join(6)`.
        - id: lost-seven
          when:
            failedTest: t-c7
            outputIncludes: прошли
          why: >-
            «От 7 лет» включает само 7, а функция семилетних не пускает: в нижней границе стоит
            строгое сравнение. Твои тесты этого не заметили — в них нет проверки на 7.
          try: >-
            Сделай нижнюю границу нестрогой — `>=` или `<=`, смотря как записано условие. И добавь
            в регрессионный тест `assert can_join(7)`.
        - id: over-fix
          when:
            failedTest: t-c13
            outputIncludes: прошли
          why: >-
            Теперь функция пускает и тринадцатилетних: верхнюю границу сдвинули дальше, чем
            нужно. В правиле — до 12 лет включительно.
          try: >-
            Подбери условие, при котором 12 — можно, а 13 — нельзя. Для уверенности добавь в
            регрессионный тест и проверку на 13.
        - id: misnamed-test
          when:
            codeRegex: '^def\s+(?!test_|can_join\b)\w+'
            failedTest: t-catches
            outputIncludes: прошли
          why: >-
            Новая функция похожа на тест, но её имя не начинается с `test_`. Тренажёр находит
            тесты по такому имени — так их принято называть и для pytest. Поэтому на старой версии
            функции он её не вызвал.
          try: Переименуй функцию так, чтобы имя начиналось с `test_`, и поправь её вызов.
        - id: no-regression
          when:
            failedTest: t-catches
            outputIncludes: прошли
          why: >-
            Нет теста, который упал бы на старой версии функции: тренажёр вызвал твои тесты со
            старым условием, и все они прошли. Если кто-то снова внесёт эту ошибку, тесты
            промолчат.
          try: >-
            Напиши отдельный тест с возрастом из сообщения родителя и вызови его в блоке запуска.
            Пока функция не исправлена, он должен падать.
        - id: old-test-removed
          when:
            failedTest: t-kept
            outputIncludes: прошли
          why: >-
            Из `test_regular_ages` убрали проверку на 5 лет. Теперь тесты не заметят, если
            функция начнёт пускать детей младше 7. Старые тесты сторожат старые правила — их не
            удаляют, когда добавляют новый.
          try: Верни `test_regular_ages` в исходный вид.
        - id: no-parens
          when:
            failedTest: t-called
            codeRegex: '^[ \t]*test_\w+[ \t]*$'
          why: >-
            Имя теста без скобок только упоминает функцию, но не вызывает её. Поэтому при запуске
            тест не выполняется, и красного шага не видно.
          try: Поставь после имени скобки, например `test_twelve_years_old()`.
          verify: Пока функция не исправлена, «Запустить» должен остановиться с AssertionError.
        - id: not-called
          when:
            failedTest: t-called
            outputIncludes: прошли
          why: >-
            Тест объявлен, но при запуске не вызывается. Поэтому «Запустить» не показал бы
            красный шаг, а после правок тест ничего не сторожит.
          try: Добавь вызов теста в блок `if __name__ == "__main__":` перед `print`.
      afterPass: >-
        Ошибка из сообщения поймана тестом и исправлена. Если кто-то снова напишет `< 12`, твой
