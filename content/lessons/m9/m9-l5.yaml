  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Регрессия — исправленная ошибка вернулась или изменение сломало то, что раньше работало.
      - "Порядок: воспроизвести → тест красный → исправить → тест зелёный → все тесты → коммит."
      - Ожидание берут из требований и сообщения об ошибке, а не из вывода программы. Тест, списанный с вывода, узаконивает ошибку.
      - Регрессионный тест остаётся в наборе навсегда, а его имя или комментарий говорит, какую ошибку он сторожит.
    question: >-
      Зачем запускать регрессионный тест до исправления, если после исправления он всё равно
      пройдёт?
    answer: >-
      Только тест, который упал на старом коде — и упал на том самом неверном значении из
      сообщения об ошибке, — доказывает, что он ловит именно эту ошибку. Тест, написанный после
      исправления, мог бы проходить и на старом коде — например, если в нём не тот пример или
      не то ожидание. Тогда он ничего не сторожит, и ошибка вернётся незаметно.
