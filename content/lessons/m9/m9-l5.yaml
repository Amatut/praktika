          def test_search_ignores_case():
              playlist = ["Ночь над городом", "Летний дождь", "Дорога домой", "Ночной поезд"]
              assert find_songs(playlist, "ночь") == ["Ночь над городом"]


          def test_search_upper_query():
              playlist = ["Ночь над городом", "Летний дождь", "Дорога домой", "Ночной поезд"]
              assert find_songs(playlist, "ДОЖДЬ") == ["Летний дождь"]


          if __name__ == "__main__":
              test_search_ignores_case()
              test_search_upper_query()
              print("Все тесты прошли")
        explanation: >-
          `test_search_ignores_case` повторяет отзыв: запрос «ночь» маленькими буквами, название с
          большой. На старой функции он красный — `"ночь" in "Ночь над городом"` даёт `False`.
          Исправление приводит к маленьким буквам **обе** строки, но только для сравнения: в
