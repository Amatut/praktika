        - >-
          Сравнение без учёта регистра на другом примере: `"Кот" == "кот"` даёт `False`, а
          `"Кот".lower() == "кот".lower()` — `True`. Оператор `in` тоже различает регистр:
          `"кот" in "Котлета"` — `False`.
