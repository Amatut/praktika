      mistakes:
        - id: pytest-import
          when:
            errorIncludes: pytest
          why: >-
            В тренажёре pytest нет: это сторонняя библиотека, она стоит только у тебя на компьютере,
            в окружении проекта.
          try: Убери `import pytest` — регрессионный тест здесь пишется на чистом Python через `assert`.
        - id: index-shift
          when:
            errorType: IndexError
            # Удаление по номеру места: del tasks[i], tasks.pop(i) или tasks.remove(tasks[i]).
            codeRegex: '\bdel[ \t]+\w+\[|\.pop\(|\.remove\([ \t]*\w+\['
          where: Цикл в `clear_done`, который удаляет задачи по номеру
          why: >-
            Список укорачивается прямо во время перебора: после каждого удаления задач становится
            меньше, а `range(len(tasks))` посчитан заранее, для полного списка. Номера мест
            уезжают, и цикл доходит до места, которого уже нет.
          try: >-
            Не удаляй задачи из списка, по которому идёт цикл. Собери новый список: пустой
            `result`, в цикле — `append` невыполненных задач, в конце — `return result`.
          verify: Нажми «Запустить» — IndexError должна исчезнуть.
        - id: inverted
          when:
            failedTest: c-none
            codeRegex: 'if\s+\w+\[["'']done["'']\]\s*(==\s*True\s*)?:\s*\n\s*\w+\.append\('
          where: Условие перед `append` в `clear_done`
          why: >-
            Условие стоит наоборот: в новый список попадают выполненные задачи, а невыполненные
            пропадают. Из списка, где ничего не выполнено, функция возвращает пустой список.
          try: Добавляй в новый список задачи, у которых `"done"` — `False`, то есть невыполненные.
        - id: returns-titles
          when:
            failedTest: c-none
            codeRegex: '\.append\([ \t]*\w+\[["'']title["'']\][ \t]*\)'
          where: Строка с `append` в `clear_done`
          why: >-
            Функция складывает в новый список только названия задач, а должна возвращать сами
            задачи — словари с `"title"` и `"done"`, как в исходном списке.
          try: Добавляй в новый список задачу целиком — `result.append(task)` — и поправь ожидание в тесте.
        - id: unused-result
          when:
            errorType: AssertionError
            # Вызов clear_done(...) отдельной строкой: то, что функция вернула, никуда не попадает.
            codeRegex: '^[ \t]+clear_done\([^\n]*\)[ \t]*$'
          where: Строка с вызовом `clear_done` в тесте
          why: >-
            Тест вызывает `clear_done`, но не смотрит на то, что она вернула, а проверяет исходный
            список. Верная версия может собрать новый список и исходный не трогать — тогда такой
            тест упадёт, даже если функция работает правильно.
          try: >-
            Проверяй то, что функция вернула: `assert clear_done(tasks) == […]` или
            `result = clear_done(tasks)`, а потом `assert result == […]`.
          verify: Нажми «Запустить» и посмотри, что теперь говорит тест о самой функции.
        - id: red-now-fix
          when:
            errorType: AssertionError
            # Функция всё ещё удаляет задачи из списка, по которому идёт цикл.
            codeRegex: 'for[ \t]+\w+[ \t]+in[ \t]+(\w+)[ \t]*:(?:\n[ \t][^\n]*)*?\n[ \t]+\1\.remove\('
          where: Функция `clear_done` (тест упал на ней)
          why: >-
            Тест упал — значит, он воспроизводит ошибку из сообщения. Это и есть красный тест:
            теперь исправь функцию, а тест оставь как есть.
          try: >-
            Не удаляй задачи из списка, по которому идёт цикл: собери новый список из
            невыполненных. Увидеть ошибку своими глазами поможет `print` того, что вернула функция
            на твоём примере.
          verify: Нажми «Запустить» — тот же тест должен пройти, а программа напечатать «Все тесты прошли».
        - id: red-after-fix
          when:
            errorType: AssertionError
          where: Упавший `assert` в тесте (строка в traceback)
          why: >-
            Тест падает на твоей нынешней версии `clear_done`. Значит, ожидание в тесте и то, что
            функция возвращает, расходятся: либо в функции ещё есть ошибка, либо ожидание
            посчитано неверно.
          try: >-
            Выведи через `print`, что функция вернула на примере из теста, и сравни с описанием:
            остаются словари невыполненных задач — не названия — в прежнем порядке. Вернулось не
            то — ищи ошибку в функции. Вернулось верное — поправь ожидание в тесте.
          verify: Нажми «Запустить» — тест должен пройти, а программа напечатать «Все тесты прошли».
        - id: fitted-expectation
          when:
            failedTest: t-ref
            outputIncludes: Все тесты прошли
            # Функция осталась прежней: цикл по списку и remove из него же.
            codeRegex: 'for[ \t]+(\w+)[ \t]+in[ \t]+(\w+)[ \t]*:[ \t]*\n[ \t]+if[ \t]+\1\[["'']done["'']\][ \t]*:[ \t]*\n[ \t]+\2\.remove\([ \t]*\1[ \t]*\)'
          where: Ожидание в тесте
          why: >-
            Функция ещё прежняя, а твой тест на ней проходит — и не проходит на исправленной
            версии. Похоже, ожидание в тесте списано с того, что вернула старая функция, а не
            посчитано по описанию: после «Удалить выполненные» в списке не должно остаться ни одной
            задачи с `"done": True`.
          try: >-
            Посчитай ожидание по описанию: только невыполненные задачи, в прежнем порядке. Тест
            должен упасть на нынешней функции — это и есть красный тест. Потом исправь функцию.
        - id: no-tests
          when:
            failedTest: t-has
            # В коде нет ни одного «def test_…»: иначе t-has не прошла из-за ошибки выполнения.
            codeRegex: '(?<![\s\S])(?![\s\S]*^[ \t]*def[ \t]+test_)'
          why: >-
            В файле нет ни одной функции `test_…`. Без регрессионного теста ошибка может тихо
            вернуться при следующей правке — и никто этого не заметит.
          try: >-
            Напиши тест `test_…` на случай из сообщения пользователя, вызови его в блоке
            `if __name__ == "__main__":` и проверь: на старой функции он должен падать.
        - id: no-regression
          when:
            failedTest: t-catches
            outputIncludes: Все тесты прошли
          why: >-
            Твои тесты проходят и на исходной функции — той, на которую жалуется пользователь.
            Значит, они не воспроизводят ошибку: выполненные задачи в них стоят так, что старая
            функция справляется.
          try: >-
            Поищи расположение, на котором старая функция ошибается: попробуй несколько выполненных
            задач в разных местах списка. Этот случай и запиши в тест.
          verify: Тест «Тест ловит ошибку из сообщения» должен стать зелёным.
        - id: still-skips
          when:
            failedTest: c-all
            outputIncludes: Все тесты прошли
          why: >-
            Функция всё ещё оставляет выполненные задачи, когда их несколько подряд: например, из
            четырёх выполненных подряд одна или две остаются в списке. Похоже, она по-прежнему
            удаляет задачи из списка, по которому идёт цикл.
          try: >-
            Не удаляй задачи из списка, по которому идёт цикл, — собери новый список из
            невыполненных. И проверь, что твой тест вызывается в блоке `if __name__`: тогда при
            «Запустить» он покажет, что функция ещё ошибается.
        - id: checks-original-list
          when:
            failedTest: t-ref
            outputIncludes: Все тесты прошли
          why: >-
            Твой тест не проходит на верной версии функции, которая возвращает новый список и не
            меняет исходный. Скорее всего, тест смотрит на исходный список после вызова, а не на
            то, что функция вернула. Такой тест зависит от способа исправления, а не от результата.
          try: >-
            Сравнивай в тесте то, что вернула функция: `assert clear_done(tasks) == […]`. И сверь
            ожидание: остаются только невыполненные задачи в прежнем порядке.
        - id: checks-input-untouched
          when:
            failedTest: t-ref-inplace
            outputIncludes: Все тесты прошли
          why: >-
            Твой тест не проходит на верной версии функции, которая удаляет выполненные задачи
            прямо из списка и возвращает его. Похоже, тест требует, чтобы исходный список не
            менялся, — а описание этого не обещает.
          try: >-
            Проверяй только то, что функция вернула: `assert clear_done(tasks) == […]` — без
            проверок исходного списка после вызова.
        - id: silent
          when:
            failedTest: t-io
            # Строки «Все тесты прошли» нет во всём коде: иначе t-io не прошла из-за ошибки.
            codeRegex: '(?<![\s\S])(?![\s\S]*Все тесты прошли)'
          why: Тесты в порядке, но программа не печатает строку «Все тесты прошли».
          try: >-
            Верни в блок `if __name__ == "__main__":` после вызовов тестов строку
            `print("Все тесты прошли")`.
      afterPass: >-
        Ошибка найдена тестом, исправлена, и теперь её сторожит регрессионный тест: если кто-то
        снова начнёт удалять задачи прямо во время перебора, тест покраснеет. Одно улучшение:
        добавь тест, где выполнены все задачи подряд, — он проверит исправление на длинной серии.
      skills: [regression-tests, edge-cases, lists]
      noHintsBeforeAttempt: true

  - id: own-project
    type: checklist
    title: Тесты в твоём проекте
    body: >-
      Этот блок — на компьютере, и лучше в отдельный день: на него нужно 20–30 минут. Работай в
      своём проекте «Список задач» (или в учебном мини-проекте из урока 8.2) с включённым
      окружением. Команды — для Windows и «Командной строки» (cmd), как в уроках 8.3 и 9.3, а
      отличия для macOS и Linux — в «Если не получается».
    items:
      - id: prepare
        text: >-
          **Подготовь проект.** Открой «Командную строку» в папке проекта, включи окружение — в
          начале строки появится `(.venv)` — и проверь pytest: `python -m pytest --version`. Если
          его нет, поставь: `python -m pip install pytest` — и допиши строку `pytest` в
          `requirements.txt`.
        help: >-
          Окружение включается командой `.venv\Scripts\activate`, как в уроках 8.3 и 9.3. На macOS
          и Linux — `source .venv/bin/activate` и `python3` вместо `python`. Для установки нужен
          интернет: без него остановись здесь и вернись позже. `No module named pytest` после
          установки — окружение не включено или pytest поставлен в другое.
      - id: importable
        text: >-
          **Проверь, что модуль с функциями подключается тихо.** Всё, что запускает меню и
          спрашивает ввод, должно стоять под `if __name__ == "__main__":` (урок 8.2). Иначе pytest
          при импорте запустит программу.
        help: >-
          Симптом: pytest падает ещё при сборе тестов — в отчёте `ERROR collecting` и сообщение
          про чтение ввода, примерно `reading from stdin while output is captured`. Значит, при
          импорте сработал `input()`.
          Перенеси вызов главного цикла под `if __name__ == "__main__":`. В проекте после урока
          8.2 функции лежат в `todo/tasks.py`, а меню — в `main.py` под этим условием, так что
          здесь всё уже в порядке.
      - id: write
        text: >-
          **Напиши тесты.** Рядом с `main.py` создай файл `test_tasks.py` и напиши в нём не меньше
          пяти тестов: обычный случай, пустой список, неверный номер задачи, пустое название и
          регрессионный — на ошибку, которую ты уже встречал в своём проекте.
        help: |-
          Если такой ошибки в проекте ещё не было, возьми случай, который раньше проверял вручную
          после каждой правки, и запиши его тестом.

          Импорт — по устройству проекта, например `from todo.tasks import add_task, mark_done`.
          Вызывать тесты внизу файла не нужно: pytest найдёт их сам. Тест на ошибку на компьютере
          короче, чем в тренажёре:

          ```python
          import pytest
          from todo.tasks import add_task


          def test_empty_title():
              with pytest.raises(ValueError):
                  add_task([], "   ")
          ```

          Если твоя функция на неверный номер не выбрасывает исключение, а возвращает `False`
          (как `mark_done` в учебном мини-проекте), проверка проще: `assert not mark_done(tasks, 0)`.
          Если пустое название проверяет меню, а не функция, перенеси проверку в функцию с
          `raise ValueError` (урок 9.4) — тогда её можно проверить тестом. А если функция печатает
          результат вместо `return`, сначала исправь это: assert видит то, что функция вернула, а
          не то, что она напечатала (урок 9.1).
      - id: tmp-path
        text: |-
          **Проверь сохранение во временной папке**, чтобы не испортить настоящий файл с задачами.
          Если твои функции пока не принимают путь к файлу, загляни в «Если не получается»:

          ```python
          from todo.storage import load_tasks, save_tasks


          def test_save_and_load(tmp_path):
              path = tmp_path / "tasks.json"
              save_tasks([{"title": "Купить хлеб", "done": False}], path)
              assert load_tasks(path) == [{"title": "Купить хлеб", "done": False}]
          ```
        help: >-
          `tmp_path` — параметр теста: pytest сам передаёт в него путь к новой пустой папке
          (объект `Path`, как в уроке 7.2), а после тестов папку можно не убирать. Если в
          `save_tasks` и `load_tasks` имя файла зашито внутри (`DATA_FILE`), добавь параметр со
          значением по умолчанию: `def save_tasks(tasks, path=DATA_FILE):` и
          `def load_tasks(path=DATA_FILE):`, а внутри открывай `path`. Меню в `main.py` менять не
          придётся. Имена функций в примере замени на свои.
      - id: run
        text: >-
          **Запусти:** `python -m pytest -v`. Все тесты должны быть `PASSED`. Потом сломай одну
          функцию нарочно, запусти снова, найди в отчёте упавший тест — и верни всё как было.
        help: >-
          В конце отчёта примерно такая строка: `6 passed in 0.05s` — число тестов и время у
          тебя будут другими. `collected 0 items` — файл или функции названы не `test_…` либо
          терминал открыт не в папке проекта. `No module named 'todo'` — pytest не видит папку
          проекта: запускай его из этой папки командой `python -m pytest`, она добавляет текущую
          папку к местам, где Python ищет модули.
      - id: commit
        text: >-
          **Сохрани в Git:** `git status`, затем `git add` для `test_tasks.py`, `requirements.txt`
          и изменённых модулей, и `git commit -m "Тесты для списка задач"`.
        help: >-
          pytest создаёт папку `.pytest_cache`, а Python — `__pycache__`. Им в истории не место:
          проверь, что в `.gitignore` есть строки `.pytest_cache/` и `__pycache__/` (уроки 8.4 и
          9.3), и допиши недостающую. Если `git status` показывает эти папки, значит, строки
          ещё нет.
    coach: Отмечай пункт по результату в терминале, а не по прочтении.

  - id: recap
    type: recap
    title: Итоги и что повторить
    points:
      - "Тест падал на верных функциях — ожидание разошлось с описанием. Считай ожидание по условию, а не по выводу программы: урок 9.1."
      - "Тесты не замечали ошибок на границах, в пустом названии, на номере 0 — повтори группы случаев и границы: урок 9.2. Не проходил тест «Тесты не зависят друг от друга» — урок 9.3. Тесты на ValueError не получались или ловили любое исключение — повтори приём с флагом: урок 9.4."
      - "Регрессионный тест не падал на старой функции — повтори порядок «красный → зелёный»: урок 9.5. Не нашёл, почему `clear_done` оставляет задачу, — повтори удаление из списка во время перебора: урок 4.3."
      - "Если оба задания решены без подсказок, модуль пройден — можно переходить к модулю 10. Блок «Тесты в твоём проекте» сделай в отдельный день."
    question: Выбери два своих теста из первого задания и объясни, какую ошибку ловит каждый.
    answer: >-
      Например, так. `test_complete_zero` ловит версию без проверки нижней границы: номер 0
      превращается в индекс −1 и молча отмечает последнюю задачу, а тест ждёт `ValueError`.
      `test_add_spaces_only` ловит проверку пустоты до `strip`: название из одних пробелов прошло
      бы как настоящее, а тест ждёт `ValueError`.
