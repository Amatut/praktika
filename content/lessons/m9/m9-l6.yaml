          подряд, в конце списка. На каком из них выполненная задача остаётся? Выведи результат
          через `print` — с помощником `make_task` это одна строка — и нажми «Запустить».
        - |-
          То же явление на числах:

          ```python
          nums = [1, 1, 2]
          for n in nums:
              if n == 1:
                  nums.remove(n)
          print(nums)   # [1, 2]
          ```

          После `remove` все следующие элементы сдвигаются на место влево, а цикл идёт к
          следующему месту — и перескакивает через соседа удалённого. Поэтому удалять из списка,
          по которому идёт цикл, опасно. Это та же ловушка, что в задаче про пустые пункты в
          списке покупок из урока 4.3.
