id: m9-l6
module: m9
number: "9.6"
title: "Самостоятельная работа: тесты для списка задач"
objective: >-
  Самостоятельно написать набор тестов к функциям списка задач — обычные и граничные случаи и
  ошибки — и с помощью теста найти и исправить спрятанную ошибку.
minutes: [30, 40]
prerequisites: [m9-l5]
skills: [assert-checks, edge-cases, exception-tests, pytest-basics, regression-tests]
environment: python

story:
  title: Ноль вместо десяти
  fictional: true
  text: >-
    Надежда, координатор волонтёрского центра, добавила в свою программу учёта задач сроки и
    заодно переписала проверку номера задачи — проверка на ноль при этом потерялась. Через неделю
    «Уборка парка» оказалась отмеченной, хотя её никто не делал: Надежда набрала «готово 0» вместо
    «готово 10», и программа молча отметила последнюю задачу. Вечер ушёл на то, чтобы сверить
    каждую отметку с записями волонтёров. Теперь перед каждой правкой Надежда запускает набор
    тестов, и номер 0 в нём проверяется. Сегодня ты соберёшь такой набор сам.

why: >-
  Набор тестов — страховка, с которой программу можно смело менять. Например, тест «номер 0 —
  ошибка» не даст незаметно отметить выполненной не ту задачу.

usedIn: >-
  Прежде чем дорабатывать старый или чужой код, разработчики пишут тесты на его нынешнее поведение
  и только потом меняют код. Так принято в проектах, которые живут долго.

steps:
  - id: reminder
    type: theory
    title: Перед стартом
    body: |-
      Сегодня самостоятельная работа: два задания, и подсказки в них откроются только после первой
      проверки. Это не запрет на помощь — просто сначала попробуй сам.

      Всё нужное ты уже знаешь:

      - Тест — функция с именем `test_…`, внутри — проверки `assert результат == ожидание`
        (урок 9.1). Ожидание считай по описанию функции, а не по её выводу.
      - Кроме обычных случаев проверяй границы и особые входы: первый и последний элемент, ноль,
        пустую строку, пустой список (урок 9.2).
      - Каждый тест сам готовит свои данные и не рассчитывает на другие тесты (урок 9.3). Внизу
        файла тестов — блок `if __name__ == "__main__":`: в тренажёре он вызывает тесты, а pytest
        на компьютере находит их сам.
      - Тест на ошибку — приём с флагом: `raised = False`, вызов внутри `try`,
        `except ValueError:` ставит флаг в `True`, в конце `assert raised` (урок 9.4). Лови
        именно `ValueError`, а не любое исключение.
      - Ошибку сначала воспроизводят тестом, видят, что он красный, и только потом исправляют код
        (урок 9.5).

      **Как тренажёр проверит твои тесты.** На верных функциях они должны пройти. Потом он по
      очереди подставит версии функций с ошибками — «мутантов» — и на каждой хотя бы один твой
      тест должен упасть. Ещё он запустит каждый тест отдельно от остальных и все тесты в обратном
      порядке: ни один тест не должен зависеть от других.

      **Порядок работы:** прочитай описание функций → выпиши случаи (обычные, граничные, ошибки) →
      напиши тесты → «Запустить» → «Проверить».

      Первое задание самое длинное. Если время вышло после него, остановись: второе задание сделай
      в следующий раз. В конце урока есть блок «Тесты в твоём проекте». Он для компьютера и для
      отдельного дня: на него нужно ещё 20–30 минут.
    simpler: >-
      Сегодня два задания без подсказок до первой проверки. В первом пишешь тесты: на каждое
      правило из описания — свой тест, тесты на ошибку — приёмом с флагом. Во втором сначала
      ловишь ошибку тестом и только потом исправляешь функцию.
    coach: >-
      Цель — не «много тестов», а тесты, которые ловят ошибки. На каждое правило в описании
      функции — хотя бы один тест.

  - id: bug-routine
    type: order
    title: Порядок работы с ошибкой
    prompt: >-
      Пользователь прислал сообщение об ошибке в программе. Расставь шаги работы с ней по
      порядку — во втором задании этот порядок пригодится.
    items:
      - id: reproduce
        text: Воспроизвести ошибку на маленьком примере
      - id: red
        text: Записать пример в тест и убедиться, что тест падает
      - id: fix
        text: Исправить код
      - id: green
        text: "Запустить этот тест: теперь он проходит"
      - id: all
        text: "Запустить все тесты: остальное не сломалось"
      - id: commit
        text: Сохранить исправление вместе с тестом одним коммитом
    explanation: >-
      Тест пишут до исправления: красный тест доказывает, что он действительно ловит эту ошибку.
      Тест, написанный после, может проходить и на старом коде — тогда он ничего не сторожит. Все
      тесты в конце нужны потому, что исправление в одном месте иногда ломает другое. А тест и
      исправление в одном коммите — понятная история: видно, какую ошибку нашли и чем её закрыли.
    coach: Это тот же порядок «красный → зелёный», что в уроке 9.5.

  - id: main-task
    type: exercise
    title: "Задание 1: набор тестов"
    exercise:
      id: m9-l6-e1
      kind: write
      title: Тесты для списка задач
      statement: |-
        В файле `tasks.py` три функции списка задач. Его код можно открыть в блоке «Файлы
        задания», но тесты пиши по описанию ниже — так тестируют и чужой код.

        - `add_task(tasks, title)` добавляет в конец списка `tasks` задачу — словарь
          `{"title": название, "done": False}` — и возвращает её. Пробелы по краям названия
          убирает. Если название пустое или состоит из одних пробелов, выбрасывает `ValueError`,
          а список не меняет.
        - `complete_task(tasks, number)` отмечает выполненной задачу номер `number`: её `"done"`
          становится `True`. Номера идут с 1: первая задача — номер 1, последняя — `len(tasks)`.
          На номер вне этого диапазона выбрасывает `ValueError` и ничего не отмечает.
        - `pending_titles(tasks)` возвращает список названий невыполненных задач в том же
          порядке, что в `tasks`.

        Напиши в `test_tasks.py` набор тестов для всех трёх функций: обычные случаи, граничные
        случаи и ошибки. Вызови тесты в блоке `if __name__ == "__main__":` и выведи
        `Все тесты прошли`. В стартовом коде уже есть помощник `two_tasks()`: каждый вызов
        возвращает новый список из двух задач. Пользоваться им не обязательно.

        Как проверяется набор:

        1. Все тесты проходят на верных функциях из `tasks.py`.
        2. Тесты не зависят друг от друга: каждый проходит сам по себе, а все вместе — и в
           обратном порядке.
        3. Тренажёр по очереди подставляет версии функций с типичными ошибками. На каждой такой
           версии хотя бы один твой тест должен упасть.
      input: "Ввода нет: тесты вызывают функции напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - "`tasks.py` только для чтения: функции подключает первая строка стартового кода."
        - Каждый тест сам создаёт свой список задач — пустой или через `two_tasks()`.
        - "Тесты на ошибку — приёмом с флагом и `except ValueError`: pytest в тренажёре нет."
        - Подсказки откроются после первой проверки — сначала попробуй сам.
      filename: test_tasks.py
      files:
        tasks.py: |
          def add_task(tasks, title):
              title = title.strip()
              if title == "":
                  raise ValueError("название задачи не может быть пустым")
              task = {"title": title, "done": False}
              tasks.append(task)
              return task


          def complete_task(tasks, number):
              if number < 1 or number > len(tasks):
                  raise ValueError(f"нет задачи с номером {number}")
              tasks[number - 1]["done"] = True


          def pending_titles(tasks):
              result = []
              for task in tasks:
                  if not task["done"]:
                      result.append(task["title"])
              return result
      starterCode: |
        from tasks import add_task, complete_task, pending_titles


        def two_tasks():
            # Помощник, а не тест: имя без test_.
            # Каждый вызов создаёт новый список из двух задач.
            tasks = []
            add_task(tasks, "Полить цветы")
            add_task(tasks, "Вынести мусор")
            return tasks


        # Напиши тесты для трёх функций из tasks.py:
        # обычные случаи, граничные случаи и ошибки (ValueError).
        # Каждый тест готовит свои данные сам.


        if __name__ == "__main__":
            # вызови здесь свои тесты
            print("Все тесты прошли")
      tests:
        - id: t-io
          kind: io
          title: Вывод программы
          example: true
          expected: Все тесты прошли
          compare:
            mode: contains
            ignoreCase: true
            ignoreSpaces: true
        - id: t-has
          kind: assert
          title: Есть тесты
          code: |
            assert [name for name, value in list(globals().items())
                    if name.startswith("test_") and callable(value)]
          message: В файле есть хотя бы одна функция, имя которой начинается с `test_`.
        - id: t-ref
          kind: assert
          title: Тесты проходят на верных функциях
          code: |
            _space = {"__name__": "test_tasks_check", "__builtins__": __builtins__}
            exec(compile(open(__file__, encoding="utf-8").read(), __file__, "exec"), _space)
            for _name, _value in list(_space.items()):
                if _name.startswith("test_") and callable(_value):
                    _value()
          message: Все твои тесты проходят на верных функциях из `tasks.py`.
        - id: t-alone
          kind: assert
          title: Тесты не зависят друг от друга
          code: |
            _code = compile(open(__file__, encoding="utf-8").read(), __file__, "exec")


            def _fresh():
                space = {"__name__": "test_tasks_check", "__builtins__": __builtins__}
                exec(_code, space)
                return space


            def _passes(space, name):
                try:
                    space[name]()
                except Exception:
                    return False
                return True


            _all = _fresh()
            _names = [name for name, value in list(_all.items())
                      if name.startswith("test_") and callable(value)]
            _bad = []
            # Если тесты падают уже в порядке файла, это зона проверки t-ref.
            if all(_passes(_all, name) for name in _names):
                for _name in reversed(_names):
                    if not _passes(_fresh(), _name):
                        _bad.append(_name + " (отдельно)")
                _back = _fresh()
                for _name in reversed(_names):
                    if not _passes(_back, _name):
                        _bad.append(_name + " (в обратном порядке)")
            assert not _bad, "зависят от других тестов: " + ", ".join(_bad)
          message: >-
            Каждый тест проходит и сам по себе, а все вместе — и в обратном порядке: тренажёр
            запускает их так, как это может сделать pytest.
        - id: t-m-empty
          kind: assert
          title: "Тесты замечают ошибку: задача с пустым названием"
          edge: true
          code: |
            import sys as _sys
            import time as _time
            import tasks as _module


            def _caught(name, impl):
                # True, если на версии с ошибкой хотя бы один тест упал или не завершился:
                # тест, который на мутанте зацикливается, тоже его заметил.
                deadline = _time.perf_counter() + 1.5

                def tracer(frame, event, arg):
                    if _time.perf_counter() > deadline:
                        raise TimeoutError("тест не завершился на версии с ошибкой")
                    return tracer

                def limited(fn, *args):
                    old_trace = _sys.gettrace()
                    _sys.settrace(tracer)
                    try:
                        fn(*args)
                    finally:
                        _sys.settrace(old_trace)

                old = getattr(_module, name)
                setattr(_module, name, impl)
                try:
                    space = {"__name__": "test_tasks_check", "__builtins__": __builtins__}
                    try:
                        limited(exec, compile(open(__file__, encoding="utf-8").read(), __file__, "exec"), space)
                    except Exception:
                        return True
                    for key, value in list(space.items()):
                        if key.startswith("test_") and callable(value):
                            try:
                                limited(value)
                            except Exception:
                                return True
                    return False
                finally:
                    setattr(_module, name, old)


            def _mutant(tasks, title):
                title = title.strip()
                task = {"title": title, "done": False}
                tasks.append(task)
                return task


            assert _caught("add_task", _mutant)
          message: Ни один тест не упал на версии `add_task`, которая молча добавляет задачу с пустым названием.
