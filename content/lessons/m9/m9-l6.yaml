      solution:
        code: |
          from tasks import add_task, complete_task, pending_titles


          def two_tasks():
              # Помощник, а не тест: имя без test_.
              # Каждый вызов создаёт новый список из двух задач.
              tasks = []
              add_task(tasks, "Полить цветы")
              add_task(tasks, "Вынести мусор")
              return tasks


          def test_add_task():
              tasks = []
              task = add_task(tasks, "Купить хлеб")
              assert task == {"title": "Купить хлеб", "done": False}
              assert tasks == [task]


          def test_add_strips_spaces():
              tasks = []
              add_task(tasks, "  Позвонить маме ")
              assert pending_titles(tasks) == ["Позвонить маме"]


          def test_add_empty_title():
              tasks = []
              raised = False
              try:
                  add_task(tasks, "")
              except ValueError:
                  raised = True
              assert raised, "пустое название должно давать ValueError"
              assert tasks == []


          def test_add_spaces_only():
              tasks = []
              raised = False
              try:
                  add_task(tasks, "   ")
              except ValueError:
                  raised = True
              assert raised, "название из пробелов должно давать ValueError"
              assert tasks == []


          def test_complete_first():
              tasks = two_tasks()
              complete_task(tasks, 1)
              assert pending_titles(tasks) == ["Вынести мусор"]


          def test_complete_last():
              tasks = two_tasks()
              complete_task(tasks, 2)
              assert pending_titles(tasks) == ["Полить цветы"]


          def test_complete_zero():
              tasks = two_tasks()
              raised = False
              try:
                  complete_task(tasks, 0)
              except ValueError:
                  raised = True
              assert raised, "номер 0 должен давать ValueError"
              assert pending_titles(tasks) == ["Полить цветы", "Вынести мусор"]


          def test_complete_too_big():
              tasks = two_tasks()
              raised = False
              try:
                  complete_task(tasks, 3)
              except ValueError:
                  raised = True
              assert raised, "номер больше числа задач должен давать ValueError"
              assert pending_titles(tasks) == ["Полить цветы", "Вынести мусор"]


          def test_pending_empty():
              assert pending_titles([]) == []


          if __name__ == "__main__":
              test_add_task()
              test_add_strips_spaces()
              test_add_empty_title()
              test_add_spaces_only()
              test_complete_first()
              test_complete_last()
              test_complete_zero()
              test_complete_too_big()
              test_pending_empty()
              print("Все тесты прошли")
        explanation: >-
          На каждое правило из описания — свой тест, и каждый тест берёт новый список: пустой или из
          `two_tasks()`. Задача у тестов разная. `test_add_strips_spaces` ловит версию, которая
          проверяет `title.strip()`, а сохраняет название без `strip`. `test_add_spaces_only` ловит
          проверку пустоты до `strip`: название из пробелов прошло бы как настоящее.
          `test_complete_first` и `test_complete_last` ловят сдвиг индекса на единицу, а
          `test_complete_last` — ещё и сравнение `>=` вместо `>`. `test_complete_zero` ловит
          версию без проверки нижней границы: номер 0 превращается в индекс −1 и молча отмечает
          последнюю задачу. `test_complete_too_big` ловит версию без проверки верхней границы: там
          номер 3 даёт IndexError, а не ValueError. Поэтому в тестах на ошибку стоит именно
          `except ValueError` — `except Exception` поймал бы и IndexError, и тест бы её не заметил.
          Тесты на ошибку ещё и проверяют, что после ошибки список не изменился. Ожидания взяты из
          описания функций, а не из их вывода.
