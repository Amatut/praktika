      mistakes:
        - id: assert-single-eq
          when:
            errorType: SyntaxError
            codeRegex: '^\s*assert\s[^=\n]*[^=!<>]=(?!=)'
          why: >-
            В `assert` стоит один знак `=`. Это присваивание, а в проверке нужно сравнение, поэтому
            Python не понимает строку и не запускает файл.
          try: Замени `=` на `==` в строке с `assert`.
          verify: Нажми «Запустить» — SyntaxError должна исчезнуть.
        - id: pytest-import
          when:
            errorIncludes: pytest
          why: >-
            В тренажёре pytest нет: это сторонняя библиотека, она стоит только у тебя на
            компьютере, в окружении проекта. Поэтому `import pytest` и `pytest.raises` здесь не
            работают.
          try: >-
            Пиши тесты на чистом Python. Для ошибок — приём с флагом: `raised = False`, вызов
            внутри `try`, `except ValueError:` ставит флаг, в конце `assert raised`. `pytest.raises`
            пригодится в блоке «Тесты в твоём проекте».
        - id: unhandled-error
          when:
            errorType: ValueError
          where: Тест, на котором остановилась программа (строка в traceback)
          why: >-
            Тест вызвал функцию с неверными данными, функция честно выбросила `ValueError`, а тест
            её не поймал — и программа остановилась. Функция здесь права.
          try: >-
            Если это тест на ошибку, оберни вызов в приём с флагом из урока 9.4: `raised = False`,
            вызов внутри `try`, `except ValueError:` ставит флаг в `True`, после — `assert raised`.
            Если это обычный случай, проверь сами данные: номера задач идут с 1, а название не
            пустое.
          verify: Нажми «Запустить» — программа должна дойти до «Все тесты прошли».
        - id: list-shadows-module
          when:
            errorType: AttributeError
            errorIncludes: "'list' object has no attribute"
          why: >-
            Список внутри теста назван `tasks` — так же, как модуль. Список закрыл собой модуль, и
            `tasks.add_task` ищет функцию у списка, а у списка её нет.
          try: >-
            Назови список иначе, например `items`. Или подключи функции строкой
            `from tasks import add_task, complete_task, pending_titles` из стартового кода — тогда
            имя `tasks` для списка свободно.
        - id: test-with-params
          when:
            errorType: TypeError
            errorIncludes: test_
          where: Функция `test_…` с параметром в скобках
          why: >-
            Тренажёр сам вызывает каждую функцию `test_…` без аргументов. У твоей тестовой функции
            есть параметр, поэтому такой вызов падает с TypeError. pytest тоже не знает, что
            передать в `number`: сам он подставляет только свои особые параметры, например
            `tmp_path`.
          try: >-
            Переименуй её во вспомогательную без `test_` в имени, например `check_bad_number(number)`.
            А тест без параметров, например `test_bad_numbers()`, пусть вызывает её с нужными
            номерами.
        - id: shared-list
          when:
            errorType: AssertionError
            # Список на уровне модуля (строка без отступа), который потом передают в функции
            # или копируют в тестах.
            codeRegex: '^(\w+)[ \t]*=[ \t]*(?:\[|two_tasks\(\))[\s\S]*?(?:\b(?:add_task|complete_task|pending_titles)\([ \t]*\1\b|(?<![=!<>])=[ \t]*\1(?:\.copy\(\))?[ \t]*$)'
          where: Список задач, созданный вне функций теста
          why: >-
            Тесты делят один список: он создан вне функций, и каждый тест видит задачи и отметки,
            которые оставили другие. Поэтому тест падает при общем запуске, хотя ожидание в нём
            может быть верным. `.copy()` не спасает, если внутри словари: в копии списка лежат те
            же самые словари задач.
          try: >-
            Пусть каждый тест в начале сам создаёт свой список — `tasks = []` или
            `tasks = two_tasks()` внутри функции теста — и сам добавляет в него всё нужное.
          verify: Нажми «Запустить» — программа должна дойти до «Все тесты прошли».
        - id: flag-compare
          when:
            errorType: AssertionError
            # Отдельная строка-сравнение вроде «raised == True»: флаг не меняется.
            codeRegex: '^[ \t]+\w+[ \t]*==[ \t]*True[ \t]*(?:#.*)?$'
          where: Строка с флагом внутри `except`
          why: >-
            В `except` стоит сравнение `raised == True`: оно ничего не меняет, и флаг остаётся
            `False`. Поэтому `assert raised` падает, хотя функция честно выбросила `ValueError`.
          try: Поставь флаг присваиванием с одним знаком `=`, то есть `raised = True`.
          verify: Нажми «Запустить» — программа должна дойти до «Все тесты прошли».
        - id: wrong-expectation
          when:
            errorType: AssertionError
          where: Упавший `assert` (строка в traceback)
          why: >-
            Тест упал на верных функциях из `tasks.py`. Значит, ожидание в нём не совпадает с
            описанием: ошибка в тесте, а не в функциях.
          try: >-
            Найди в traceback строку с упавшим `assert` и посчитай ожидание заново по описанию,
            шаг за шагом. Частые причины: `pending_titles` возвращает только невыполненные задачи,
            номера идут с 1, а пробелы по краям названия убираются.
          verify: Нажми «Запустить» — программа должна напечатать «Все тесты прошли».
        - id: no-tests
          when:
            failedTest: t-has
            # В коде нет ни одного «def test_…»: иначе t-has не прошла из-за ошибки выполнения.
            codeRegex: '(?<![\s\S])(?![\s\S]*^[ \t]*def[ \t]+test_)'
          why: >-
            В файле нет ни одной функции, имя которой начинается с `test_`. Тренажёр, как и pytest,
            находит тесты только по такому имени.
          try: >-
            Назови тесты `test_…`, например `test_add_empty_title`, и вызови их в блоке
            `if __name__ == "__main__":`.
        - id: wrong-expectation-silent
          when:
            failedTest: t-ref
            outputIncludes: Все тесты прошли
          why: >-
            Программа печатает «Все тесты прошли», но тренажёр сам вызвал твои тесты — и какой-то
            из них упал на верных функциях. Скорее всего, этот тест не вызывается в блоке
            `if __name__`, поэтому при «Запустить» его падения не видно.
          try: >-
            Вызови все тесты в блоке `if __name__ == "__main__":` и нажми «Запустить»: traceback
            покажет упавший `assert`. Потом сверь ожидание в нём с описанием функции.
        - id: not-independent
          when:
            failedTest: t-alone
            outputIncludes: Все тесты прошли
          why: >-
            В порядке файла тесты проходят, а по отдельности или в обратном порядке какой-то из них
            падает. Он рассчитывает на данные, которые приготовил или изменил другой тест, —
            например, на общий список задач вне функций. pytest может запустить один тест отдельно
            или в другом порядке, и тогда такой тест упадёт.
          try: >-
            Пусть каждый тест в начале сам создаёт свой список — `tasks = []` или
            `tasks = two_tasks()` внутри функции теста — и сам добавляет в него всё, что нужно для
            проверки.
          verify: Тест «Тесты не зависят друг от друга» должен стать зелёным.
        - id: copied-functions
          when:
            codeRegex: '^def (add_task|complete_task|pending_titles)\('
          where: Функции из `tasks.py`, скопированные в файл тестов
          why: >-
            В файле тестов свои копии функций из `tasks.py`, и тесты проверяют копии. Ошибку в
