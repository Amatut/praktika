  - id: bug-task
    type: exercise
    title: "Задание 2: ошибка из сообщения"
    exercise:
      id: m9-l6-e2
      kind: fix
      title: Выполненные задачи не удаляются
      statement: |-
        В список задач добавили кнопку «Удалить выполненные». За неё отвечает функция
        `clear_done(tasks)`: она возвращает список без выполненных задач, а невыполненные
        остаются в прежнем порядке. Пользователь пишет: «Иногда после „Удалить выполненные“
        выполненная задача остаётся в списке».

        Сделай по порядку, как в уроке 9.5:

        1. Найди расположение задач, на котором функция ошибается. Пробуй разные списки через
           «Запустить».
        2. Запиши этот случай в тест `test_…` и убедись, что тест падает на нынешней функции.
        3. Исправь функцию так, чтобы тест прошёл. Тест не удаляй: он будет сторожить эту
           ошибку.

        Чтобы не набирать словари целиком, в стартовом коде есть помощник `make_task`:
        `make_task("Хлеб", True)` — то же самое, что `{"title": "Хлеб", "done": True}`.

        Проверяй в тесте то, что функция **возвращает**, а не исходный список. Верная версия может
        вернуть новый список, а может удалить задачи из самого списка — тест должен проходить на
        обеих.
      input: "Ввода нет: тесты вызывают функцию напрямую."
      output: "Одна строка: `Все тесты прошли`."
      constraints:
        - "Регрессионный тест остаётся в файле: на старой функции он падает, на исправленной проходит."
        - Подсказки откроются после первой проверки — сначала попробуй сам.
      starterCode: |
        def clear_done(tasks):
            for task in tasks:
                if task["done"]:
                    tasks.remove(task)
            return tasks


        def make_task(title, done):
            # Помощник: make_task("Хлеб", True) — то же, что {"title": "Хлеб", "done": True}
            return {"title": title, "done": done}


        # Сообщение пользователя: «Иногда после „Удалить выполненные“
        # выполненная задача остаётся в списке».
        # 1. Найди случай, на котором это происходит, и запиши его в тест.
        # 2. Убедись, что тест падает, и исправь функцию.
        # Опыт для «Запустить» — убери # в начале строки и меняй список:
        # print(clear_done([make_task("Хлеб", True), make_task("Почта", False)]))


        if __name__ == "__main__":
            # вызови здесь свои тесты
            print("Все тесты прошли")
      tests:
