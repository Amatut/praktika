              вернуть result


          def test_…():
              tasks = [две выполненные задачи подряд, за ними невыполненная — через make_task]
              assert clear_done(tasks) == [только невыполненная задача]
          ```
      solution:
        code: |
          def clear_done(tasks):
              result = []
              for task in tasks:
                  if not task["done"]:
                      result.append(task)
              return result


          def make_task(title, done):
              # Помощник: make_task("Хлеб", True) — то же, что {"title": "Хлеб", "done": True}
              return {"title": title, "done": done}


          def test_clear_done_neighbors():
              tasks = [
                  make_task("Купить хлеб", True),
                  make_task("Полить цветы", True),
                  make_task("Вынести мусор", False),
              ]
              assert clear_done(tasks) == [make_task("Вынести мусор", False)]


          def test_clear_done_keeps_open():
              tasks = [make_task("Купить хлеб", False), make_task("Полить цветы", False)]
              assert clear_done(tasks) == [
                  make_task("Купить хлеб", False),
                  make_task("Полить цветы", False),
              ]


          if __name__ == "__main__":
              test_clear_done_neighbors()
              test_clear_done_keeps_open()
              print("Все тесты прошли")
        explanation: >-
          Исходная функция удаляет задачи из списка, по которому идёт цикл. После `remove`
          следующие задачи сдвигаются на место влево, а цикл переходит к следующему месту и
          перескакивает через задачу, которая встала на место удалённой. Поэтому ошибка видна
          только на соседних выполненных задачах, а через одну всё работает — как с пустыми
          пунктами списка покупок в уроке 4.3. Исправление — не менять список во время перебора, а
          собрать новый из невыполненных задач. `test_clear_done_neighbors` сначала упал на старой
          функции — значит, он действительно ловит эту ошибку и не даст ей вернуться. Второй тест
          проверяет, что невыполненные задачи функция не трогает.
