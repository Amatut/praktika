id: m0-l4
module: m0
number: "0.4"
title: "Мастерская на компьютере: редактор, файл, терминал"
objective: Установить Python на свой компьютер, создать файл .py в редакторе и запустить его из терминала.
minutes: [20, 30]
prerequisites: [m0-l3]
skills: [local-setup]
environment: external

story:
  title: Табло без интернета
  fictional: true
  text: >-
    Пока Лена училась, она запускала код в онлайн-тренажёре. Но табло в кофейне подключено к
    старому ноутбуку, а интернет там бывает не всегда, поэтому программа должна жить прямо на
    этом ноутбуке. Лена установила Python, сохранила код в файл board.py и набрала в терминале
    команду python board.py — табло загорелось. С тех пор каждое утро она запускает программу
    одной командой, и интернет для этого не нужен.

why: >-
  Настоящие программы хранятся в файлах на компьютере и запускаются без браузера — даже без
  интернета. Например, команда `python hello.py` за секунду выполняет программу из файла
  hello.py.

usedIn: >-
  Так обычно работают программисты: пишут код в редакторе, сохраняют его в файлы и запускают из
  терминала. Через терминал же устанавливают библиотеки, запускают тесты и серверы — к этому
  мы придём в следующих модулях.

steps:
  - id: workshop
    type: theory
    title: Три инструмента мастерской
    body: |-
      До сих пор код запускал тренажёр: Python работал прямо в браузере. Настоящие программы
      живут в файлах на компьютере — соберём для этого мастерскую из трёх инструментов.

      **Редактор** — программа, в которой пишут код: как обычный текстовый редактор, только с
      подсветкой команд. Подойдёт **IDLE** — он ставится вместе с Python — или **VS Code**.
      Оба бесплатные.

      **Файл с программой** — обычный текстовый файл с расширением `.py`, например `hello.py`.
      **Расширение** — часть имени после последней точки: по нему компьютер понимает, что
      внутри код на Python.

      **Терминал** — окно, где компьютером управляют текстовыми командами. Терминал всегда
      работает в какой-то **текущей папке**: её путь виден слева от курсора. Команда
      `python hello.py` значит «Python, выполни файл hello.py из текущей папки». Вывод `print`
      и сообщения об ошибках появятся прямо в терминале — в том же виде, что в уроке 0.3.

      Интернет нужен только для установки. Дальше Python на компьютере работает без него.

      **Про систему.** Инструкция ниже написана для Windows: мы предполагаем, что у тебя она.
      Если у тебя другая система, вот главные отличия:

      - **macOS:** установщик тоже бери на python.org, пункт про PATH искать не нужно.
        Терминал — приложение «Терминал». Команда — `python3`: `python3 --version`,
        `python3 hello.py`. Вместо `dir` — `ls`. IDLE лежит в Finder: «Программы» → папка
        «Python 3.x». Сохранять — Cmd + S. Открыть терминал в учебной папке: набери в
        Терминале `cd` и пробел, перетащи папку из Finder в окно и нажми Enter. `cd` —
        команда «перейди в папку».
      - **Linux:** Python 3 обычно уже установлен, а если нет — поставь его через менеджер
        пакетов своего дистрибутива. Редактор IDLE там часто ставится отдельным пакетом — в
        его названии обычно есть слово `idle`. Команда — тоже `python3`, вместо `dir` — `ls`.
        Открыть терминал в учебной папке: правый щелчок по папке → «Открыть в терминале», а
        если такого пункта нет — тот же `cd`, что на macOS.
      - Подробные инструкции для каждой системы — в официальной документации:
        [docs.python.org/3/using](https://docs.python.org/3/using/index.html).

      Этот урок не проверяется автоматически: тренажёр не видит твой компьютер. Отмечай пункты
      сам — по результату, а не по прочтении.
    simpler: >-
      Три инструмента: в **редакторе** пишешь, в **файле** `.py` хранишь, в **терминале**
      запускаешь. Команда `python hello.py` — это «Python, выполни вот этот файл». Всё, что
      программа выведет, появится в том же окне терминала.
    coach: >-
      Установка — самый «бытовой» урок курса. Если что-то не выходит с первого раза, это
      нормально: у каждого компьютера свои особенности. Раскрывай «Если не получается» у
      нужного пункта. Урок можно пройти в два захода: сначала установка, в другой день — файл
      и запуск.

  - id: install
    type: checklist
    title: Установи Python
    body: >-
      Делай по одному пункту и отмечай сделанное. Если установка затянулась, остановись после
      этого блока — это хорошее место для паузы.
    items:
      - id: os
        text: >-
          **Уточни свою систему.** Дальше инструкция для Windows. Если у тебя macOS или Linux,
          держи под рукой блок «Про систему» из теории: там отличия и ссылка на официальную
          инструкцию.
        help: >-
          Как понять, какая система: у Windows внизу экрана есть кнопка «Пуск» с логотипом из
          четырёх окошек, у macOS в левом верхнем углу — значок яблока. Если сейчас под рукой
          только телефон, отложи этот урок до компьютера: упражнения в тренажёре работают и без
          него.
      - id: download
        text: >-
          **Скачай Python 3** с официального сайта
          [python.org/downloads](https://www.python.org/downloads/). Сайт сам предложит файл
          для твоей системы. Для Windows первой кнопкой обычно идёт **Python install manager** —
          программа, которая сама ставит и обновляет Python, а ниже есть ссылка на отдельный
          установщик (standalone installer). Подойдёт любой из двух.
        help: >-
          Скачивай только с python.org, не со сторонних сайтов. Если сайт предлагает файл не для
          твоей системы, пролистай страницу: ниже есть ссылки на версии для Windows и macOS. Нет
          интернета — остановись здесь и продолжи, когда он появится.
      - id: path
        text: >-
          **Установи Python.** Запусти скачанный файл. Если в первом окне есть галочка про PATH
          — со словами вроде «Add python.exe to PATH», — **обязательно отметь её**, затем нажми
          кнопку установки и дождись конца. Если галочки нет и установщик выглядит иначе,
          скорее всего, это Python install manager — открой «Если не получается».
        help: |-
          **PATH** — список папок, в которых Windows ищет программы по имени. Отдельному
          установщику галочка PATH нужна, чтобы терминал узнал команду `python`.

          **Python install manager.** Нажми кнопку установки и дождись конца — галочки PATH у
          него нет, команды `python` и `py` он настраивает без неё. Сам Python менеджер скачает
          при первом запуске — в пункте «Проверь установку»: набери там команду и подожди. Если
          в окне терминала появятся вопросы — например, установить ли Python или добавить ли
          папку в PATH, — соглашайся: набери `y` и нажми Enter. Просто Enter в вопросе с
          `[y/N]` означает «нет». Если Windows попросит разрешить изменения на компьютере, это
          нормально — разреши.

          Окно установщика может выглядеть не так, как описано: названия кнопок меняются от
          версии к версии. Ищи по смыслу — пункт про PATH и кнопку установки.

          Пропустил галочку — не страшно: как это исправить, написано в пункте с проверкой
          установки.
      - id: terminal
        text: >-
          **Открой терминал.** Нажми «Пуск», набери `терминал` (или `cmd`) и открой найденное
          приложение. Появится окно с мигающим курсором — сюда вводят команды.
        help: >-
          В Windows 11 это приложение «Терминал», в Windows 10 — «Командная строка» или
          «Windows PowerShell»: для наших задач подойдёт любое. Если терминал был открыт ещё до
          установки Python, закрой его и открой заново — иначе он не узнает о новой программе.
      - id: version
        text: >-
          **Проверь установку.** Набери в терминале `python --version` и нажми Enter. Должна
          появиться строка вида `Python 3.x.y` — цифры у тебя могут быть другими. Если ты
          ставил Python install manager, при первом запуске он сначала скачает Python — подожди,
          а на его вопросы отвечай `y` и Enter. Не вышло — попробуй `py --version`.
        help: |-
          **Сработала только `py`.** Ничего страшного: `py` — программа запуска Python для
          Windows. В этом уроке просто пиши `py` вместо `python`, например `py hello.py`.

          **Сообщение про Microsoft Store или открылся сам магазин.** Так выглядит ситуация,
          когда Windows не нашла Python: команда `python` по умолчанию связана с магазином.
          По-английски сообщение начинается словами «Python was not found». Что делать:

          1. Закрой терминал и открой заново: изменения PATH видны только в новых окнах.
          2. Попробуй `py --version` — эта команда магазин не вызывает.
          3. Ставил отдельный установщик — запусти его ещё раз и проверь пункт про PATH. Не
             находишь его — удали Python через список приложений в параметрах Windows и
             установи заново, отметив PATH.
          4. Ставил Python install manager — найди в параметрах Windows поиском слово
             «псевдонимы» и включи псевдонимы «Python (default)».

          **«"python" не является внутренней или внешней командой…»** (в PowerShell — «Имя
          "python" не распознано…»). Тоже значит, что Windows не нашла Python, — помогут те же
          шаги 1–4.

  - id: editor-file
    type: checklist
    title: Редактор и первый файл
    body: >-
      Теперь заведём учебную папку и первый файл с кодом.
    items:
      - id: folder
        text: >-
          **Создай учебную папку**, например `python-practice` на рабочем столе. Имя лучше
          написать латиницей и без пробелов — его проще набирать в терминале.
        help: >-
          Щёлкни правой кнопкой по пустому месту рабочего стола → «Создать» → «Папку» (на
          macOS — «Новая папка») и введи имя. Все учебные файлы складывай сюда: так ты всегда
          будешь знать, где их искать.
      - id: editor
        text: >-
          **Открой редактор.** Самый быстрый путь — **IDLE**: он установился вместе с Python,
          найди его через «Пуск» по слову `IDLE`. Если хочешь редактор на будущее, установи
          бесплатный **VS Code** с [code.visualstudio.com](https://code.visualstudio.com/). Для
          этого урока хватит и IDLE.
        help: >-
          IDLE не находится — проверь, что Python установлен (`python --version` или
          `py --version`). Если Python есть, а ярлыка нет, открой IDLE из терминала командой
          `python -m idlelib` (или `py -m idlelib`). В крайнем случае подойдёт даже «Блокнот»,
          но при сохранении выбери тип файла «Все файлы», иначе к имени допишется `.txt`.
          Платные редакторы не нужны: всё в курсе работает в бесплатных.
      - id: create
        text: |-
          **Создай файл и набери код.** В IDLE — меню **File → New File**, в VS Code — пункт
          создания нового файла в меню **File**. Набери программу:

          ```python
          # Мой первый файл на компьютере
          print("Привет с моего компьютера!")
          print()
          print("Python работает")
          ```
        help: >-
          Набирай вручную, а не копируй: так заодно проверишь кавычки и скобки. Кавычки нужны
          прямые, как в тренажёре. Если в IDLE после `print(` всплывает подсказка — это нормально,
          просто продолжай печатать.
      - id: save
        text: >-
          **Сохрани файл как `hello.py`** в учебную папку: **File → Save As…**, выбери папку
          `python-practice`, введи имя `hello.py`.
        help: >-
          Главное — расширение `.py` и правильная папка. Проверишь в следующем блоке: команда
          `dir` в терминале покажет, какие файлы лежат в папке. Сохранил не туда — открой файл и
          сохрани ещё раз через **Save As…** в нужную папку.

  - id: terminal-predict
    type: predict
    title: Что появится в терминале?
    prompt: >-
      Перед запуском сделай прогноз. Что появится в окне терминала после команды
      `python hello.py`?
    code: |-
      # Мой первый файл на компьютере
      print("Привет с моего компьютера!")
      print()
      print("Python работает")
    options:
      - |-
        Привет с моего компьютера!

        Python работает
      - |-
        # Мой первый файл на компьютере
        Привет с моего компьютера!

        Python работает
      - |-
        Привет с моего компьютера!
        Python работает
    answer: |-
      Привет с моего компьютера!

      Python работает
    explanation: >-
      Терминал покажет то же, что показал бы тренажёр: комментарий Python пропускает, а
      `print()` выводит пустую строку. Python один и тот же — меняется только место, где ты
      запускаешь программу. Проверь прогноз в следующем блоке.

  - id: run
    type: checklist
    title: Запуск из терминала
    body: >-
      Главный шаг урока — запустить файл командой и увидеть результат.
    items:
      - id: open-in-folder
        text: >-
          **Открой терминал в учебной папке.** Открой папку `python-practice` в Проводнике,
          щёлкни правой кнопкой по пустому месту → «Открыть в терминале». Путь слева от курсора
          должен заканчиваться на `python-practice`. На macOS и Linux способ другой — он в блоке
          «Про систему» в начале урока.
        help: >-
          Нет такого пункта в меню (например, в Windows 10) — открой папку в Проводнике,
          щёлкни по адресной строке вверху, сотри текст, набери `cmd` и нажми Enter:
          командная строка откроется прямо в этой папке. Способ для любой системы — VS Code:
          открой папку через **File → Open Folder…**, а затем терминал внутри редактора:
          **Terminal → New Terminal**.
      - id: dir
        text: >-
          **Посмотри, что лежит в папке:** набери `dir` и нажми Enter. В списке должен быть
          `hello.py`.
        help: >-
          Файла нет в списке — значит, терминал открыт не в той папке или файл сохранён в другое
          место. Сравни путь слева от курсора с папкой, куда ты сохранял файл. Видишь
          `hello.py.txt` — переименуй файл командой `ren hello.py.txt hello.py`.
      - id: run-file
        text: >-
          **Запусти программу:** набери `python hello.py` (или `py hello.py`) и нажми Enter.
          Сравни вывод со своим прогнозом.
        help: >-
          Ответ `can't open file … No such file or directory` — Python установлен, но не нашёл
          файл: терминал открыт не в той папке или имя файла другое (проверь командой `dir`).
          Ответ «не является внутренней или внешней командой» или сообщение про Microsoft Store —
          вернись к пункту «Проверь установку». Сообщение с `SyntaxError` или `NameError` —
          Python нашёл и прочитал файл, а ошибка в самом коде: читай её так же, как в уроке 0.3.
      - id: edit-rerun
        text: >-
          **Измени и запусти снова.** Допиши в конец файла строку `print("Файл изменён")`,
          сохрани (Ctrl + S, на macOS — Cmd + S) и снова выполни ту же команду. Стрелка ↑ в
          терминале возвращает предыдущую команду — набирать заново не нужно.
        help: >-
          Вывод не изменился — скорее всего, файл не сохранён. Терминал запускает то, что
          записано на диске, а не то, что открыто в редакторе. В IDLE несохранённый файл
          отмечен звёздочкой в заголовке окна, в VS Code — точкой на вкладке. Сохрани и запусти
          ещё раз.
      - id: break-fix
        text: >-
          **Сломай и почини.** Сотри закрывающую кавычку в строке с текстом — например, во
          второй, — сохрани и запусти. Найди в терминале тип ошибки и номер строки. Потом
          верни кавычку, сохрани и убедись, что программа снова работает.
        help: >-
          В терминале сообщение устроено так же, как в уроке 0.3: номер строки, сама строка
          кода, а в конце — тип ошибки и причина. Отличия небольшие: вместо `main.py` там полный
          путь к твоему файлу, а под строкой кода могут стоять значки `^` — они показывают место
          ошибки. Ошибки не видно — проверь, сохранил ли ты файл перед запуском.

  - id: diagnose
    type: quiz
    title: Что ответил терминал?
    question: |-
      Ты набрал `python hello.py`, а терминал ответил:

      ```text
      C:\...\python.exe: can't open file 'C:\\Users\\...\\hello.py': [Errno 2] No such file or directory
      ```

      Что это значит?
    options:
      - Python не установлен
      - В коде hello.py есть ошибка SyntaxError
      - Python работает, но не нашёл файл hello.py там, где искал
    correct: 2
    explanation: >-
      Сообщение начинается с пути к python.exe — значит, Python запустился и установлен.
      `can't open file … No such file or directory` — «не могу открыть файл: нет такого файла
      или папки». Проверь командой `dir`, что терминал открыт в папке с файлом и что имя
      совпадает. Если бы Windows не нашла Python, она ответила бы, что `python` не является
      командой, или показала бы сообщение про Microsoft Store либо сам магазин. А ошибка в коде
      выглядела бы как `SyntaxError` с номером строки.

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Программа на Python — это файл с расширением `.py`. Его пишут в редакторе и сохраняют в учебную папку.
      - Терминал выполняет команды в текущей папке. `python hello.py` (или `py hello.py`) запускает файл.
      - "`python --version` или `py --version` проверяет установку. Сообщение про Microsoft Store или «не является командой» значит, что Windows не нашла Python."
      - Ошибки в коде терминал показывает так же, как тренажёр, — тип, номер строки, подсказка.
    question: >-
      Ты поменял код в hello.py, запустил `python hello.py`, а вывод остался прежним. Какие две
      причины проверишь первыми?
    answer: >-
      Первое — сохранён ли файл: терминал запускает то, что записано на диске, а не то, что
      открыто в редакторе. Второе — тот ли это файл: возможно, ты правишь копию в другой папке,
      а терминал запускает `hello.py` из текущей. Помогут отметка о несохранённых изменениях в
      редакторе и команда `dir`.
