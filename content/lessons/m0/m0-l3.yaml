id: m0-l3
module: m0
number: "0.3"
title: Ошибка — это подсказка
objective: Находить в сообщении об ошибке её тип, номер строки и причину и по ним исправлять ошибки в коде.
minutes: [20, 30]
prerequisites: [m0-l2]
skills: [read-errors, fix-syntax]
environment: python

story:
  title: Непонятный текст вместо меню
  fictional: true
  text: >-
    Артём поменял меню на табло, запустил программу — и сразу после первой строки меню увидел
    непонятный текст на английском. Первая мысль была «я всё сломал», и он уже хотел вернуть
    старую версию. Лена попросила прочитать сообщение с конца: там было три подсказки — слово
    NameError, номер строки 2 и вопрос «Did you mean: 'print'?». Оказалось, Артём набрал
    `prnt` вместо `print`, — исправление заняло десять секунд. Сообщение об ошибке — не
    приговор, а подсказка: где искать и что не так.

why: >-
  Ошибаются все, и опытные программисты отличаются не тем, что не ошибаются, а тем, что быстро
  читают сообщения об ошибках. Например, `NameError: name 'prnt' is not defined` в строке 2
  сразу говорит: во второй строке опечатка в имени команды.

usedIn: >-
  Сообщения об ошибках читают каждый день — в редакторе, в терминале, в журналах работы
  серверов. Когда просят помощи у коллег или на форуме, первым делом прикладывают именно это
  сообщение: оно экономит часы догадок.

steps:
  - id: two-kinds
    type: theory
    title: Два вида ошибок и как читать сообщение
    body: |-
      Python работает с программой в два этапа. Сначала он проверяет, правильно ли она
      **записана**, — как корректор, который смотрит на запятые, не вникая в смысл. Если всё
      в порядке, начинается **выполнение** — строка за строкой.

      **SyntaxError** — синтаксическая ошибка, то есть ошибка записи. **Синтаксис** — правила
      записи кода: кавычки парами, у каждой `(` есть своя `)`. Незакрытая кавычка, лишняя
      скобка, ёлочки вместо прямых кавычек — всё это SyntaxError. Python находит её ещё до
      запуска, поэтому **не выполняется ни одна строка** — даже те, что стоят выше ошибки.

      **Ошибка выполнения** случается, когда программа уже работает. Например, **NameError**:
      Python встретил незнакомое имя — `prnt` вместо `print`. Записано всё по правилам, но
      такой команды нет. Строки **до** ошибки успевают выполниться, а на строке с ошибкой
      программа останавливается.

      Сообщение об ошибке выполнения называют **traceback** (читается «трейсбэк»). Вот пример:

      ```text
      Traceback (most recent call last):
        File "main.py", line 2, in <module>
          prnt("Капучино")
      NameError: name 'prnt' is not defined. Did you mean: 'print'?
      ```

      Как его читать:

      1. **Начни с последней строки.** Слева — тип ошибки (`NameError`), справа — что
         случилось: «имя prnt не определено».
      2. **Найди номер строки:** `line 2` — ошибка во второй строке файла. Ниже показан сам
         код этой строки.
      3. **Прочитай подсказку**, если она есть: `Did you mean: 'print'?` — «Может, ты имел в
         виду print?». Если подсказка на вид не отличается от того, что ты написал, в слове
         затесалась русская буква — например, «р» вместо английской «p».

      У SyntaxError сообщение короче, а знаки `^` показывают место, где Python споткнулся.
      Причина бывает и левее: в строке `Меню на завтра` знаки `^^` стоят под словом «на», а
      исправлять нужно начало строки — это пояснение, у которого забыли `#`.

      В тренажёре последняя строка сообщения видна под выводом. В заданиях рядом появляется
      карточка наставника: номер строки, объяснение по-русски и полный текст — в разделе
      «Исходное сообщение Python». Учись читать оригинал: на компьютере перевода не будет.
    simpler: >-
      Представь повара с рецептом. SyntaxError — в рецепте строчка, которую невозможно
      прочитать: повар даже не начинает готовить. NameError — повар начал, дошёл до шага
      «добавить щепотку фрбзщ» и остановился: всё, что было до этого шага, уже сделано. В
      сообщении ищи три вещи: тип ошибки (последняя строка, слева), номер строки (`line …`) и
      подсказку (`Did you mean`).
    coach: >-
      Сообщение об ошибке — не оценка тебе, а записка от Python: где искать и что не так.

  - id: after-fix
    type: example
    title: Программа Артёма
    body: |-
      Вот программа Артёма после исправления. До него в строке 2 было `prnt`, и запуск
      выглядел так:

      ```text
      Меню дня
      Traceback (most recent call last):
        File "main.py", line 2, in <module>
          prnt("Капучино")
      NameError: name 'prnt' is not defined. Did you mean: 'print'?
      ```

      Обрати внимание: «Меню дня» успело появиться — первая строка выполнилась ещё до ошибки.
    code: |-
      print("Меню дня")
      print("Капучино")
      print("Какао")
    notes:
      - line: 1
        text: Эта строка выполнилась до ошибки — поэтому «Меню дня» стояло над сообщением.
      - line: 2
        text: Здесь было `prnt`. Сообщение указало именно сюда — `line 2` — и подсказало `print`.
      - line: 3
        text: До этой строки программа с ошибкой не дошла — остановилась на строке 2.
    tryIt: >-
      Сломай программу сам: напиши в строке 3 `Print` с большой буквы и запусти. Какой тип
      ошибки и какой номер строки назовёт Python? Какие строки успеют появиться? Потом верни
      маленькую `p`.

  - id: runtime-predict
    type: predict
    title: Что успеет появиться?
    prompt: >-
      В строке 3 опечатка. Как думаешь, какие строки успеют появиться на экране, прежде чем
      Python остановится?
    code: |-
      print("Доброе утро!")
      print("Меню дня")
      pirnt("Капучино")
      print("Хорошего дня")
    options:
      - Ни одной — Python сразу покажет ошибку
      - |-
        Доброе утро!
        Меню дня
        Хорошего дня
      - |-
        Доброе утро!
        Меню дня
    answer: |-
      Доброе утро!
      Меню дня
    explanation: >-
      `pirnt` — незнакомое имя, но записано оно по правилам, поэтому программа запускается.
      Строки 1 и 2 выполняются, на строке 3 возникает NameError, и программа останавливается:
      до «Хорошего дня» дело не доходит. Это ошибка выполнения.

  - id: syntax-predict
    type: predict
    title: А если не закрыта кавычка?
    prompt: >-
      Теперь ошибка другая: в строке 3 не закрыта кавычка. Что будет на этот раз?
    code: |-
      print("Доброе утро!")
      print("Меню дня")
      print("Капучино)
      print("Хорошего дня")
    options:
      - «Доброе утро!» и «Меню дня», затем сообщение об ошибке
      - Ни одной строки — только сообщение SyntaxError
      - Все строки, кроме третьей
    answer: Ни одной строки — только сообщение SyntaxError
    answerIsNotOutput: true
    explanation: >-
      Незакрытая кавычка — ошибка записи. Python находит её при проверке, ещё до запуска,
      поэтому не выполняется ни одна строка — даже те, что выше. Он напишет
      `SyntaxError: unterminated string literal` — «незакрытый текст в кавычках». Сравни с
      прошлым прогнозом: там ошибка случилась во время выполнения, и первые строки успели
      появиться.
    coach: >-
      Запомни эту разницу — она сразу подсказывает, где искать: нет вывода совсем — смотри на
      запись кода; вывод оборвался — смотри на строку, где он оборвался.

  - id: read-message
    type: quiz
    title: Прочитай сообщение
    question: |-
      Программа не запустилась, и Python показал:

      ```text
        File "main.py", line 4
          print("Итого"
               ^
      SyntaxError: '(' was never closed
      ```

      Что он сообщает?
    options:
      - В строке 4 открыта круглая скобка, но не закрыта
      - В строке 4 не хватает кавычки
      - Строки 1–3 выполнились, а в строке 4 опечатка в имени команды
    correct: 0
    explanation: >-
      Последняя строка: тип `SyntaxError` и причина `'(' was never closed` — «скобка „(“ так и
      не закрылась». `line 4` — номер строки, знак `^` указывает на эту скобку. Кавычки в
      строке 4 как раз парные. А раз это SyntaxError, программа не запускалась — строки 1–3
      тоже не выполнились.

  - id: practice-quote
    type: exercise
    title: Практика 1
    exercise:
      id: m0-l3-e1
      kind: fix
      title: Табло не запускается
      statement: |-
        Программа для табло не запускается. Прочитай сообщение Python, найди ошибку и исправь
        её, чтобы табло показало:

        ```text
        Доброе утро!
        Сегодня в меню: капучино
        Хорошего дня
        ```
      output: Три строки как в образце.
      constraints:
        - Исправь ошибку, не переписывая программу целиком.
      starterCode: |
        print("Доброе утро!")
        print("Сегодня в меню: капучино)
        print("Хорошего дня")
      tests:
        - id: t1
          kind: io
          title: Табло
          example: true
          expected: |-
            Доброе утро!
            Сегодня в меню: капучино
            Хорошего дня
      criteria:
        - Программа запускается без ошибки.
        - Выводятся три строки точно как в образце.
      hints:
        - >-
          Нажми «Запустить» и прочитай последнюю строку сообщения: какой тип ошибки и какой
          номер строки назвал Python?
        - >-
          Текст в коде окружён кавычками с двух сторон. В `print("Чай")` одна кавычка стоит
          сразу после `(`, а вторая — прямо перед `)`.
        - >-
          В строке 2 нет закрывающей кавычки. Поставь `"` после слова «капучино» — перед
          закрывающей скобкой.
      solution:
        code: |
          print("Доброе утро!")
          print("Сегодня в меню: капучино")
          print("Хорошего дня")
        explanation: >-
          `unterminated string literal` значит «незакрытый текст в кавычках»: текст начался с
          кавычки, но не закончился. Python дочитал вторую строку кода до конца и не нашёл
          закрывающую кавычку. Кавычка перед скобкой исправляет ошибку.
      wrongSolutions:
        - code: |
            print("Доброе утро!")
            print("Сегодня в меню: капучино)
            print("Хорошего дня")
          note: Ничего не исправлено.
          expectMistake: unterminated
        - code: |
            print("Доброе утро!")
            print("Сегодня в меню: капучино)")
            print("Хорошего дня")
          note: Кавычка поставлена после скобки.
          expectMistake: quote-after-paren
        - code: |
            print("Доброе утро!")
            print("Хорошего дня")
          note: Строка с ошибкой удалена.
          expectMistake: line-deleted
        - code: |
            print("Доброе утро!")
            print("Сегодня в меню: капучино»)
            print("Хорошего дня")
          note: Закрывающая кавычка — ёлочка.
          expectMistake: guillemet-closing
        - code: |
            print("Доброе утро!")
            print("Сегодня в меню: капучино')
            print("Хорошего дня")
          note: Закрывающая кавычка одинарная, а открывающая — двойная.
          expectMistake: unterminated
      mistakes:
        - id: guillemet-closing
          when:
            errorIncludes: unterminated string literal
            codeRegex: '[«»“”]'
          why: >-
            Закрывающая кавычка кода должна быть такой же прямой, как открывающая, — `"`. Ёлочка
            для Python — обычный символ текста, поэтому текст в кавычках так и не закрылся.
          try: Замени ёлочку в конце текста на прямую кавычку `"`.
          verify: Программа должна запуститься и вывести три строки.
        - id: unterminated
          when:
            errorIncludes: unterminated string literal
          why: >-
            `unterminated string literal` — «незакрытый текст в кавычках». Текст открылся
            кавычкой, но такой же закрывающей кавычки Python в этой строке кода не нашёл.
          try: >-
            Найди строку из сообщения (`line …`) и закрой текст той же кавычкой, какой он
            открывается, — `"`. Она ставится в конце текста, перед скобкой.
          verify: Программа должна запуститься и вывести три строки.
        - id: quote-after-paren
          when:
            outputIncludes: капучино)
          why: >-
            Программа запустилась, но скобка попала внутрь текста — поэтому на экране
            «капучино)». Кавычка встала после скобки, а не перед ней.
          try: >-
            Убери скобку `)` сразу после слова «капучино» — внутри текста она лишняя. В конце
            строки должно остаться `")`.
          verify: Вторая строка вывода должна заканчиваться словом «капучино».
        - id: line-deleted
          when:
            outputEquals: |-
              Доброе утро!
              Хорошего дня
          why: >-
            Ошибка исчезла вместе со строкой, но табло потеряло меню. Исправлять нужно так,
            чтобы строка осталась.
          try: Верни строку с меню и допиши в ней недостающую кавычку.
          verify: На табло должно быть три строки.
      afterPass: >-
        Ты нашёл ошибку по сообщению, а не наугад. `unterminated string literal` встретится ещё
        не раз, и теперь ты знаешь, что искать: кавычку без пары.
      skills: [fix-syntax, read-errors]

  - id: practice-two
    type: exercise
    title: Практика 2
    exercise:
      id: m0-l3-e2
      kind: fix
      title: Две ошибки в чеке
      statement: |-
        В чеке две ошибки. Python показывает их по одной: исправил первую — запусти снова и
        прочитай следующее сообщение. Чек должен получиться таким:

        ```text
        Заказ № 12
        Капучино
        Спасибо!
        ```
      output: Три строки как в образце.
      constraints:
        - Исправляй по одной ошибке и после каждой правки запускай программу снова.
      starterCode: |
        print("Заказ № 12"
        prnt("Капучино")
        print("Спасибо!")
      tests:
        - id: t1
          kind: io
          title: Чек
          example: true
          expected: |-
            Заказ № 12
            Капучино
            Спасибо!
      criteria:
        - Программа запускается без ошибок.
        - Выводятся три строки как в образце.
        - Исправлены обе ошибки, остальной код не переписан.
      hints:
        - >-
          Запусти программу и найди в сообщении номер строки. Исправь только эту ошибку — и
          запусти снова.
        - >-
          У каждой открывающей скобки есть закрывающая: в `print("Чай")` одна `(` и одна `)`.
          А имена команд Python сверяет посимвольно: `Print` или `prin` для него — незнакомые
          слова.
        - >-
          Первое сообщение — про строку 1, `'(' was never closed`: допиши `)` в её конце.
          Второе появится про строку 2: `NameError` и подсказка `Did you mean: 'print'?`.
      solution:
        code: |
          print("Заказ № 12")
          print("Капучино")
          print("Спасибо!")
        explanation: >-
          Первая ошибка синтаксическая: скобка в строке 1 не закрыта, поэтому программа вообще
          не запускалась. После исправления программа запускается, выводит «Заказ № 12» и
          останавливается на строке 2 с `NameError`: `prnt` — опечатка. Две ошибки — два запуска,
          это нормальный ритм работы.
      wrongSolutions:
        - code: |
            print("Заказ № 12")
            prnt("Капучино")
            print("Спасибо!")
          note: Исправлена только скобка.
          expectMistake: name-typo
        - code: |
            print("Заказ № 12"
            print("Капучино")
            print("Спасибо!")
          note: Исправлена только опечатка.
          expectMistake: paren-not-closed
        - code: |
            print("Заказ № 12"))
            print("Капучино")
            print("Спасибо!")
          note: Лишняя скобка.
          expectMistake: extra-paren
        - code: |
            print("Заказ № 12")
            Print("Капучино")
            print("Спасибо!")
          note: Print с большой буквы.
          expectMistake: name-typo
        - code: |
            print("Заказ № 12")
            рrint("Капучино")
            print("Спасибо!")
          note: В print русская буква «р».
          expectMistake: cyrillic-letter
      mistakes:
        - id: paren-not-closed
          when:
            errorIncludes: was never closed
          why: >-
            `'(' was never closed` — «скобка „(“ так и не закрылась». Это ошибка записи, поэтому
            программа не выполнила ни одной строки.
          try: В строке из сообщения допиши закрывающую скобку `)` после текста в кавычках.
          verify: Запусти снова — это сообщение исчезнет. Если появится следующее, прочитай и его.
        - id: extra-paren
          when:
            errorIncludes: unmatched ')'
          why: >-
            `unmatched ')'` — «у скобки „)“ нет пары». Закрывающих скобок стало больше, чем
            открывающих.
          try: Убери одну `)` в строке из сообщения — у каждого `print` одна `(` и одна `)`.
          verify: Программа должна запуститься.
        - id: cyrillic-letter
          when:
            errorType: NameError
            codeRegex: '^[ \t]*[\wА-Яа-яЁё]*[А-Яа-яЁё][\wА-Яа-яЁё]*\('
          why: >-
            В имени команды есть русская буква. Русская «р» и английская «p» выглядят одинаково,
            но для Python это разные символы — поэтому подсказка `Did you mean` и предлагает на
            вид то же самое слово.
          try: Сотри имя команды в строке из сообщения целиком и набери `print` заново в английской раскладке.
          verify: Программа должна вывести все три строки чека.
        - id: name-typo
          when:
            errorType: NameError
          why: >-
            `NameError: name '…' is not defined` — Python не знает такого имени. Скорее всего,
            опечатка в названии команды: имена он сверяет посимвольно, с учётом больших и
            маленьких букв.
          try: Посмотри на подсказку `Did you mean` в конце сообщения и исправь имя в строке из сообщения.
          verify: Программа должна вывести все три строки чека.
      afterPass: >-
        Две ошибки — два запуска: ты читал сообщения по очереди и каждый раз исправлял одну
        причину. Так же работают с ошибками и в больших программах.
      skills: [fix-syntax, read-errors]

