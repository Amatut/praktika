            print("Суббота")
            print()
            prnt("Капучино")
            print("Какао")
            print("Круассаны")
            print("Сырники")
            print("Хорошего дня!")
          note: Осталась опечатка prnt.
          expectMistake: name-typo
        - code: |
            # Табло на субботу
