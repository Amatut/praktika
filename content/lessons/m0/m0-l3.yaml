      mistakes:
        - id: guillemets
          when:
            errorIncludes: invalid character
          why: >-
            `invalid character` — «недопустимый символ». Ёлочки и другие «типографские» кавычки
            годятся внутри текста, но не вместо кавычек кода: Python понимает только прямые
            кавычки `"` или `'`.
          try: В строке из сообщения замени ёлочки вокруг текста на прямые кавычки `"`.
          verify: Запусти снова — это сообщение должно исчезнуть.
        - id: slash-comment
          when:
            errorIncludes: invalid syntax
            codeRegex: '^[ \t]*//'
          why: >-
            В Python комментарий начинается со знака `#`. Двойная косая черта `//` означает
            комментарий в некоторых других языках, а в Python это знак целочисленного деления —
            его мы разберём в модуле 1. Строку, которая начинается с `//`, Python прочитать не
            может — отсюда `invalid syntax` («неверная запись»).
          try: Замени `//` на `#`.
          verify: Запусти снова — сообщение про эту строку должно исчезнуть.
        - id: note-without-hash
          when:
            errorType: SyntaxError
            codeRegex: '^[ \t]*Табло'
          why: >-
            Пояснение без `#` Python принимает за код и не может его разобрать — отсюда
            `invalid syntax` («неверная запись») в строке 1.
          try: Поставь `#` в начало строки с пояснением — она станет комментарием.
          verify: Запусти снова — сообщение про строку 1 должно исчезнуть.
        - id: unterminated
          when:
            errorIncludes: unterminated string literal
          why: >-
            `unterminated string literal` — «незакрытый текст в кавычках»: текст открылся
            прямой кавычкой, а такой же закрывающей кавычки в этой строке кода нет.
          try: Проверь строку из сообщения — с обеих сторон текста должны стоять прямые кавычки `"`.
          verify: Запусти снова — это сообщение должно исчезнуть.
        - id: paren-not-closed
          when:
            errorIncludes: was never closed
          why: >-
            `'(' was never closed` — «скобка „(“ так и не закрылась». Это ошибка записи, поэтому
            не выполняется ни одна строка.
          try: В строке из сообщения допиши `)` после текста в кавычках.
          verify: Запусти снова — это сообщение должно исчезнуть.
        - id: extra-paren
          when:
            errorIncludes: unmatched ')'
          why: "`unmatched ')'` — «у скобки „)“ нет пары»: закрывающих скобок больше, чем открывающих."
          try: Убери лишнюю `)` в строке из сообщения.
          verify: Запусти снова — это сообщение должно исчезнуть.
        - id: name-typo
          when:
            errorType: NameError
          why: >-
            `NameError` — Python не знает такого имени. Строки выше успели выполниться, а на
            этой программа остановилась: скорее всего, опечатка в названии команды.
          try: Посмотри на подсказку `Did you mean` в конце сообщения и исправь имя в строке из сообщения.
          verify: Запусти снова — программа должна дойти до конца без сообщения об ошибке.
        - id: note-printed
          when:
            outputIncludes: Табло на субботу
          why: >-
            Пояснение попало на табло: ты взял его в `print`, и Python его выполнил. По условию
            пояснение остаётся в коде, но не выполняется.
          try: Сделай первую строку комментарием — `# Табло на субботу`, без `print` и кавычек.
          verify: Первой строкой на табло должна быть «Суббота».
        - id: no-blank-line
          when:
            outputIncludes: "Суббота\nКапучино"
          why: >-
            Python больше не сообщает об ошибках, но вывод не совпадает с образцом: в образце
            после «Суббота» идёт пустая строка, а у тебя её нет. Такое расхождение Python не
            заметит — его находишь ты, когда сверяешь вывод с образцом.
          try: Поставь `print()` сразу после команды с «Суббота».
          verify: Второй строкой вывода должна идти пустая строка.
        - id: no-croissants
          when:
            outputIncludes: "Какао\nСырники"
          why: >-
            Python больше не сообщает об ошибках, но на табло сразу после «Какао» идут
            «Сырники» — круассанов между ними нет. Новую строку Python за тебя не допишет:
            такое расхождение находишь ты, когда сверяешь вывод с образцом.
          try: >-
            Допиши команду `print` с текстом «Круассаны» между командами с «Какао» и
            «Сырники». Если такая команда уже есть в другом месте, перенеси её туда.
          verify: На табло «Круассаны» должны идти сразу после «Какао».
        - id: note-deleted
          when:
            failedTest: t2
            outputEquals: |-
              Суббота

              Капучино
              Какао
              Круассаны
              Сырники
              Хорошего дня!
          why: >-
            Табло показывает то, что нужно, но в коде нет комментария с пояснением «Табло на
            субботу». Пояснение нужно было не удалить, а превратить в комментарий.
          try: Сделай первой строкой программы `# Табло на субботу`.
          verify: Нажми «Проверить» — проверка «Пояснение осталось комментарием» должна пройти.
      afterPass: >-
        Самостоятельная работа модуля 0 выполнена: ты прочитал несколько разных сообщений,
        исправил каждую причину, дописал новую строку и сверил вывод с образцом. Если какая-то
        ошибка отняла много времени, повтори её урок: ёлочки и кавычки — 0.1, комментарии и
        пустая строка `print()` — 0.2, скобки и опечатки в именах — 0.3.
      skills: [fix-syntax, read-errors, comments, print-output]
      noHintsBeforeAttempt: true

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - SyntaxError — ошибка записи. Python находит её до запуска, и не выполняется ни одна строка.
      - Ошибка выполнения, например NameError, случается по ходу работы — строки до неё успевают выполниться.
      - "Сообщение читают с конца: тип и причина → номер строки (`line …`) → подсказка `Did you mean`, если она есть."
      - >-
        Python показывает ошибки по одной: исправь одну причину, запусти снова, а в конце сверь
        вывод с образцом. Что повторить, если самостоятельная работа далась трудно: кавычки —
        урок 0.1, комментарии и `print()` — 0.2, скобки и имена команд — 0.3.
    question: >-
      Программа вывела две строки, а потом показала NameError. Могла ли причиной быть
      незакрытая кавычка? Почему?
    answer: >-
      Нет. Незакрытая кавычка — синтаксическая ошибка: из-за неё программа не запустилась бы
      вовсе и не вывела бы ни одной строки. Раз две строки появились, программа работала и
      остановилась во время выполнения — например, на опечатке в имени команды.
