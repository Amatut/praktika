        - code: |
            // Табло на субботу
            print("Суббота")
            print()
            print("Капучино")
            print("Какао")
            print("Круассаны")
            print("Сырники")
            print("Хорошего дня!")
          note: Пояснение закомментировано через //.
          expectMistake: slash-comment
        - code: |
            # Табло на субботу
            print("Суббота")
            print()
            print("Капучино")
