          вокруг «Суббота»; `print` вместо `prnt` в строке с «Капучино»; `)` в конце строки с
          «Какао»; `print()` сразу после строки с «Суббота» — в образце там пустая строка. И
          одна новая команда `print` с круассанами — между строками с «Какао» и «Сырники».
      solution:
        code: |
          # Табло на субботу
          print("Суббота")
          print()
          print("Капучино")
          print("Какао")
          print("Круассаны")
          print("Сырники")
