id: m0-l1
module: m0
number: "0.1"
title: Программа — это точная инструкция
objective: Запустить первую программу и увидеть, что компьютер выполняет команды строго по порядку.
minutes: [20, 30]
prerequisites: []
skills: [program-run, print-output, execution-order]
environment: python

story:
  title: Табло в маленькой кофейне
  fictional: true
  text: >-
    Каждое утро бариста Лена переписывала мелом меню дня на доске у входа. Потом хозяйка
    кофейни повесила электронное табло — и строчки для него теперь печатает маленькая программа.
    Табло ничего не додумывает: если строки перепутаны, оно так и покажет — сначала «Спасибо»,
    потом «Меню дня». Программа — это список точных команд, которые выполняются по порядку.
    Сегодня ты напишешь такие команды сам и запустишь их.

why: >-
  Любая программа — от игры до банковского приложения — это последовательность точных команд.
  Когда понимаешь порядок выполнения, можешь заранее сказать, что сделает код: табло покажет
  строки ровно в том порядке, в каком они записаны.

usedIn: >-
  Вывод текста — первое, с чего начинается знакомство почти с любым языком. Точно так же
  программы пишут сообщения в журнал работы (логи), печатают отчёты, чеки и подсказки
  для пользователя.

steps:
  - id: warmup-order
    type: order
    title: Разложи задачу на шаги
    prompt: >-
      Прежде чем писать код, программист раскладывает задачу на шаги. Помоги роботу-бариста
      приготовить капучино: расставь действия по порядку. Перетащи пункты или двигай их стрелками.
    items:
      - id: cup
        text: Поставить чашку под кофемашину
      - id: espresso
        text: Налить эспрессо
      - id: milk
        text: Взбить молоко
      - id: pour
        text: Влить молоко в эспрессо
      - id: serve
        text: Отдать напиток гостю
    before:
      - [cup, espresso]
      - [espresso, pour]
      - [milk, pour]
      - [pour, serve]
    explanation: >-
      Верных вариантов несколько: молоко можно взбить и до эспрессо. А вот отдать напиток,
      пока он не готов, нельзя. Компьютер тоже выполняет шаги строго по порядку — и не
      догадается сам, если порядок неверный.
    coach: >-
      Здесь пока нет кода — только логика. Это настоящий первый навык программиста:
      разбить задачу на понятные шаги.

  - id: warmup-precise
    type: quiz
    title: Какая команда достаточно точная?
    question: >-
      Робот-бариста выполняет команды буквально. Какую из них он сможет выполнить без
      уточнений?
    options:
      - Сделай что-нибудь вкусное
      - Налей 200 мл молока в чашку
      - Приготовь как обычно
    correct: 1
    explanation: >-
      «Вкусное» и «как обычно» робот понять не может: у него нет вкуса и памяти о твоих
      привычках. Команда «налей 200 мл молока в чашку» точная — в ней понятно, что, сколько
      и куда. Код тоже состоит из таких точных команд.

  - id: idea
    type: theory
    title: Программа, код и запуск
    body: |-
      **Программа** — это список команд для компьютера. **Код** — текст этих команд на языке
      программирования. Мы начнём с Python: его команды похожи на короткие английские слова, и на
      нём пишут и учебные примеры, и серьёзные сервисы.

      **Запуск** (выполнение) — компьютер читает код сверху вниз и выполняет строки по одной.
      Следующая строка начинается только после того, как закончилась предыдущая.

      Первая команда — `print`. Она выводит на экран то, что написано в скобках:

      ```python
      print("Доброе утро!")
      ```

      Текст берётся в кавычки: они показывают, где текст начинается и где заканчивается.
      Подойдут двойные `"` или одинарные `'` — главное, одинаковые с двух сторон.

      Если Python не понял команду, он не угадывает, а сообщает об ошибке и показывает
      строку, где споткнулся. Это обычная часть работы любого программиста — читать такие
      сообщения мы научимся в уроке 0.3.
    simpler: >-
      Представь, что ты диктуешь роботу рецепт. Робот делает ровно то, что сказано, и строго
      по порядку. `print` — команда «покажи на экране». Что показать — пишем в скобках и в кавычках.
    coach: >-
      Запоминать всё сразу не нужно. Главное сейчас — команда `print` и то, что строки
      выполняются сверху вниз.

  - id: first-run
    type: example
    title: Первый запуск
    body: >-
      Вот программа для табло из истории. Нажми «Запустить» — код выполнит настоящий Python
      прямо в браузере.
    code: |-
      print("Доброе утро!")
      print("Сегодня в меню: капучино и какао")
      print("Хорошего дня")
    notes:
      - line: 1
        text: "`print` выводит текст из скобок. Кавычки отмечают начало и конец текста."
      - line: 2
        text: Вторая команда выполняется после первой — её строка появится ниже.
      - line: 3
        text: Каждый `print` начинает новую строку вывода.
    tryIt: Замени текст во второй строке на своё меню и запусти программу ещё раз.

  - id: order-predict
    type: predict
    title: Что появится на экране?
    prompt: >-
      Шаги в тексте пронумерованы, но записаны не по порядку. Как ты думаешь, в каком
      порядке их покажет Python?
    code: |-
      print("Шаг 3: отдать заказ")
      print("Шаг 1: принять заказ")
      print("Шаг 2: приготовить")
    options:
      - |-
        Шаг 3: отдать заказ
        Шаг 1: принять заказ
        Шаг 2: приготовить
      - |-
        Шаг 1: принять заказ
        Шаг 2: приготовить
        Шаг 3: отдать заказ
      - "Шаг 2: приготовить"
    answer: |-
      Шаг 3: отдать заказ
      Шаг 1: принять заказ
      Шаг 2: приготовить
    explanation: >-
      Python выполняет строки сверху вниз и не вникает в смысл текста. «Шаг 3» внутри
      кавычек — просто символы, а не номер, по которому можно отсортировать команды.

  - id: practice-hello
    type: exercise
    title: Практика 1
    exercise:
      id: m0-l1-e1
      kind: repeat
      title: Первое приветствие
      statement: >-
        Напиши программу, которая выводит на экран одну строку: `Привет, Практика!`
      output: Одна строка — текст точно как в условии, с запятой и восклицательным знаком.
      constraints:
        - Используй команду `print`.
      starterCode: |
        # Напиши здесь одну команду, которая выведет приветствие

      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: Привет, Практика!
      criteria:
        - Программа выводит ровно одну строку «Привет, Практика!».
        - Регистр букв, запятая и восклицательный знак совпадают с условием.
        - Пробелы в конце строки не учитываются.
      hints:
        - Нужна та же команда, что и в примере «Первый запуск», — она выводит текст на экран.
        - >-
          Текст для вывода пишется в скобках и в кавычках. Например, `print("Доброе утро!")`
          выводит «Доброе утро!».
        - >-
          Каркас решения: `print("...")`. Вместо многоточия поставь текст из условия —
          посимвольно, с запятой и восклицательным знаком.
      solution:
        code: |
          print("Привет, Практика!")
        explanation: >-
          Одна команда `print` выводит одну строку. Текст стоит в кавычках, поэтому Python
          показывает его как есть, со всеми знаками препинания.
      wrongSolutions:
        - code: |
            print("Привет, мир!")
          note: Другой текст.
          expectMistake: null
        - code: |
            Print("Привет, Практика!")
          note: Команда с большой буквы.
          expectMistake: capital-print
        - code: |
            print(«Привет, Практика!»)
          note: Ёлочки вместо кавычек кода.
          expectMistake: typographic-quotes
        - code: |
            print(Привет, Практика!)
          note: Текст без кавычек.
          expectMistake: no-quotes
      mistakes:
        - id: capital-print
          when:
            errorType: NameError
            codeIncludes: Print
          why: >-
            Python различает большие и маленькие буквы. Команда называется `print` —
            целиком строчными, а `Print` для него незнакомое имя.
          try: Замени `Print` на `print`.
          verify: Нажми «Проверить» — ошибка NameError должна исчезнуть.
        - id: typographic-quotes
          when:
            errorIncludes: invalid character
          why: >-
            Ёлочки «» и «умные» кавычки “” подходят для текста, но не для кода. Python понимает
            только прямые кавычки `"` или `'`.
          try: >-
            Сотри кавычки вокруг текста и набери прямые — клавиша с `"` на английской раскладке
            (Shift + Э на русской).
          verify: После исправления программа должна запуститься без ошибки.
        - id: no-quotes
          when:
            codeRegex: 'print\(\s*[^\s"''(]'
          why: >-
            Без кавычек Python считает слова командами или именами, а не текстом, — и не
            понимает, что с ними делать.
          try: Возьми весь текст в скобках в прямые кавычки.
          verify: Проверь, что строка кода выглядит как `print("...")`.
      afterPass: >-
        Первая программа работает. Попробуй в режиме «Запустить» добавить вторую строку с
        `print` — её текст появится на новой строке.
      skills: [print-output, program-run]

  - id: practice-menu
    type: exercise
    title: Практика 2
    exercise:
      id: m0-l1-e2
      kind: modify
      title: Табло с новым напитком
      statement: >-
        Хозяйка кофейни добавила в меню какао. Измени программу так, чтобы табло показывало
        три строки: сначала `Меню дня`, затем `Капучино`, затем `Какао`.
      output: |-
        Три строки в таком порядке: Меню дня, Капучино, Какао.
      starterCode: |
        print("Меню дня")
        print("Капучино")
      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: |-
            Меню дня
            Капучино
            Какао
      criteria:
        - На экране три строки в указанном порядке.
        - Текст каждой строки совпадает с условием, включая заглавные буквы.
      hints:
        - Сейчас программа выводит две строки. Какой команды не хватает и где она должна стоять?
        - Каждая команда `print` выводит одну строку, а строки идут в порядке команд — сверху вниз.
        - Добавь третью строку кода после строки с капучино — такую же команду, но со своим текстом.
      solution:
        code: |
          print("Меню дня")
          print("Капучино")
          print("Какао")
        explanation: >-
          Третья команда `print` стоит последней, поэтому «Какао» появляется в самом низу.
          Порядок строк на экране совпадает с порядком команд в коде.
      wrongSolutions:
        - code: |
            print("Меню дня")
            print("Капучино")
          note: Код не изменён.
          expectMistake: missing-line
        - code: |
            print("Меню дня")
            print("Какао")
            print("Капучино")
          note: Строка добавлена не в то место.
          expectMistake: wrong-order
        - code: |
            print("Меню дня")
            print("Капучино")
            print("какао")
          note: Строчная буква.
          expectMistake: null
      mistakes:
        - id: missing-line
          when:
            outputEquals: |-
              Меню дня
              Капучино
          why: Программа выводит только две строки — команды для какао пока нет.
          try: Добавь ещё одну строку кода с `print` в самом конце.
          verify: После проверки на экране должно быть три строки.
        - id: wrong-order
          when:
            outputEquals: |-
              Меню дня
              Какао
              Капучино
          why: Все три строки есть, но какао оказалось выше капучино — строки выводятся в порядке команд.
          try: Перенеси команду с какао ниже команды с капучино.
          verify: Посмотри на вывод — «Какао» должно быть последней строкой.
      afterPass: >-
        Порядок строк на экране совпадает с порядком команд. Табло готово к открытию кофейни.
      skills: [execution-order, print-output]

  - id: practice-receipt
    type: exercise
    title: Практика 3
    exercise:
      id: m0-l1-e3
      kind: write
      title: Чек заказа
      statement: |-
        Напиши с нуля программу, которая печатает чек из четырёх строк:

        ```text
        Кофейня «Утро»
        Заказ № 12
        Капучино
        Спасибо за покупку!
        ```

        Ёлочки «» внутри текста — обычные символы: их можно оставить внутри кавычек кода.
      output: Четыре строки точно как в образце.
      constraints:
        - Каждая строка чека — отдельная команда `print` (или любой другой способ, который даёт тот же вывод).
      starterCode: |
        # Напиши программу, которая печатает чек

      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: |-
            Кофейня «Утро»
            Заказ № 12
            Капучино
            Спасибо за покупку!
      criteria:
        - Выводятся четыре строки в указанном порядке.
        - Текст каждой строки совпадает с образцом, включая знаки «№» и «!».
        - Кавычки кода — прямые, ёлочки остаются только внутри текста.
      hints:
        - Посчитай строки в чеке — столько же команд вывода понадобится.
        - >-
          Вспомни практику с табло: каждая строка текста — это отдельная команда `print`,
          а порядок строк на экране совпадает с порядком команд.
        - >-
          Каркас из четырёх строк: `print("...")` — по одной на каждую строку чека. Ёлочки
          «Утро» пиши внутри прямых кавычек, например: `print("Кофейня «...»")`.
      solution:
        code: |
          print("Кофейня «Утро»")
          print("Заказ № 12")
          print("Капучино")
          print("Спасибо за покупку!")
        explanation: >-
          Четыре команды `print` выводят четыре строки сверху вниз. Ёлочки внутри текста —
          просто символы, потому что снаружи стоят прямые кавычки кода.
      wrongSolutions:
        - code: |
            print("Кофейня «Утро»")
            print("Заказ № 12")
            print("Капучино")
          note: Нет последней строки.
          expectMistake: short-receipt
        - code: |
            print(«Кофейня Утро»)
            print("Заказ № 12")
            print("Капучино")
            print("Спасибо за покупку!")
          note: Ёлочки вместо кавычек кода.
          expectMistake: guillemets-as-quotes
        - code: |
            print("Заказ № 12")
            print("Кофейня «Утро»")
            print("Капучино")
            print("Спасибо за покупку!")
          note: Перепутан порядок.
          expectMistake: null
        - code: |
            print("Кофейня «Утро»")
            print("Заказ № 12")
            print("Капучино")
            print("Спасибо за покупку")
          note: Нет «!» в последней строке — строка с благодарностью есть, разбор про три строки не срабатывает.
          expectMistake: null
      mistakes:
        - id: guillemets-as-quotes
          when:
            errorIncludes: invalid character
          where: Строка с названием кофейни
          why: >-
            Ёлочки можно писать внутри текста, но сам текст в коде должен быть окружён
            прямыми кавычками `"`.
          try: 'Сделай так: `print("Кофейня «Утро»")` — прямые кавычки снаружи, ёлочки внутри.'
          verify: Программа должна запуститься, а первая строка чека — совпасть с образцом.
        - id: short-receipt
          when:
            failedTest: t1
            outputIncludes: Капучино
            codeRegex: '(?<![\s\S])(?![\s\S]*Спасибо)'
          why: В чеке три строки вместо четырёх — последней строки с благодарностью нет.
          try: Добавь в конец команду, которая выведет «Спасибо за покупку!».
      afterPass: >-
        Чек готов. Обрати внимание: ты написал программу с нуля — от пустого файла до
        работающего результата.
      skills: [print-output, execution-order, program-run]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Программа — это список точных команд. Компьютер выполняет их сверху вниз, по одной.
      - "`print(...)` выводит на экран то, что в скобках. Текст берётся в прямые кавычки."
      - Каждый `print` начинает новую строку вывода.
      - Если Python не понял команду, он сообщает об ошибке и показывает строку — угадывать он не будет.
    question: Почему в задании-прогнозе «Шаг 3» появился на экране раньше «Шага 1»?
    answer: >-
      Потому что Python выполняет строки в том порядке, в каком они записаны, — сверху вниз.
      Цифры внутри кавычек для него просто символы текста, а не номера шагов.
