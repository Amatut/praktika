id: m0-l2
module: m0
number: "0.2"
title: Порядок выполнения и комментарии
objective: Проходить программу по строкам, заранее предсказывать её вывод и оставлять в коде комментарии для людей.
minutes: [20, 30]
prerequisites: [m0-l1]
skills: [execution-order, comments, print-output]
environment: python

story:
  title: Пометки на полях
  fictional: true
  text: >-
    Программу для табло в кофейне написала бариста Лена, а через месяц её сменщику Артёму
    понадобилось поменять в ней меню. Он открыл код и сначала не понял, какая строка за что
    отвечает, — пока не заметил пометки Лены: «утреннее меню», «акция до 12:00». Такие
    пометки называются комментариями: Python их пропускает, а людям они экономят время.
    Перед запуском Артём прошёл программу строка за строкой и заранее представил, что
    появится на табло, — и оказался прав.

why: >-
  Программисты читают код чаще, чем пишут. Если умеешь пройти программу по строкам, ошибку
  видно ещё до запуска, а комментарий подсказывает, зачем строка нужна, — например,
  `# акция действует до 12:00`.

usedIn: >-
  Комментарии есть почти в любом рабочем проекте: ими поясняют неочевидные места и на время
  «выключают» строки, когда ищут ошибку. Ручной проход по коду — трассировку — используют,
  когда читают чужой код и когда разбираются, почему программа ведёт себя не так, как ждали.

steps:
  - id: idea
    type: theory
    title: Пустая строка, запятые и комментарии
    body: |-
      Ты уже знаешь главное: Python выполняет строки сверху вниз, по одной. Сегодня — три
      новых приёма и один навык.

      **Пустая строка.** `print()` с пустыми скобками выводит пустую строку. Так текст делят
      на блоки, чтобы его было легче читать. Скобки обязательны: слово `print` без скобок
      ничего не выведет.

      **Несколько значений.** В одном `print` можно перечислить несколько значений через
      запятую. Python выведет их в одну строку и сам поставит между ними пробел:
      `print("Заказ", "готов")` выводит `Заказ готов`.

      **Комментарий** — пометка для людей. Он начинается со знака `#` и продолжается до конца
      строки. Python комментарии не выполняет — просто пропускает. Комментарий можно написать
      на отдельной строке или после команды:

      ```python
      # Утреннее меню
      print("Капучино")  # самый популярный напиток
      ```

      Комментарии нужны, чтобы объяснить, что делает часть программы, и чтобы на время
      «выключить» строку, не удаляя её: поставь `#` в начало — и Python её пропустит. Внутри
      кавычек `#` — обычный символ: `print("Заказ #5")` выведет `Заказ #5`.

      **Трассировка** — проход по программе вручную, строка за строкой. На каждой строке
      спрашиваешь себя: «Это команда или комментарий? Что появится на экране?» — и
      записываешь ответ. Так проверяют код до запуска и находят место, где программа ведёт
      себя не так, как задумано.
    simpler: >-
      Три приёма и один навык. `print()` — пустая строка. Запятая между значениями в `print`
      (вне кавычек) — Python поставит между ними пробел, а запятая внутри кавычек — обычный
      символ текста. `#` вне кавычек — «Python, это не тебе»: всё после этого знака до конца
      строки он пропускает. Трассировка — читаешь код как робот: строка за строкой, ничего не
      додумывая.
    coach: >-
      Трассировка кажется медленной, но это самый надёжный способ понять чужой код — и найти
      ошибку в своём.

  - id: board
    type: example
    title: Табло с пометками
    body: >-
      Табло Лены после правок Артёма. Сначала пройди программу глазами и представь, что
      появится на экране. Потом нажми «Запустить» и сравни.
    code: |-
      # Табло кофейни: утренняя версия
      print("Доброе утро!")
      print()
      # Меню
      print("Капучино", "и", "какао")
      # print("Акция: второй кофе в подарок")
      print("Хорошего дня")
    notes:
      - line: 1
        text: Комментарий. Python его пропускает, а людям он объясняет, что это за программа.
      - line: 3
        text: "`print()` без текста выводит пустую строку и отделяет приветствие от меню."
      - line: 5
        text: Три значения через запятую — одна строка на экране, между значениями по пробелу.
      - line: 6
        text: Строка «выключена» знаком `#`. Акции сегодня нет, но строку легко вернуть.
    tryIt: >-
      Включи акцию: сотри в строке 6 знак `#` и пробел после него, чтобы строка начиналась
      прямо с `print`, и запусти снова. Если в начале строки останется пробел, Python сообщит
      об ошибке `IndentationError` — тогда просто убери этот пробел.

  - id: trace
    type: predict
    title: Пройди по строкам
    prompt: >-
      Пройди программу строка за строкой: команда это или комментарий, что появится на экране?
      Выбери, как будет выглядеть вывод.
    code: |-
      print("Столик 4")
      # print("Столик 5")
      print()
      print("Чай", "и", "пирог")  # заказ
      print("Готово!")
    options:
      - |-
        Столик 4

        Чай и пирог
        Готово!
      - |-
        Столик 4
        Столик 5

        Чай и пирог
        Готово!
      - |-
        Столик 4

        Чай и пирог  # заказ
        Готово!
    answer: |-
      Столик 4

      Чай и пирог
      Готово!
    explanation: >-
      Строка 2 — комментарий, Python её пропускает, поэтому «Столик 5» не появится. Строка 3
      выводит пустую строку. В строке 4 три значения через запятую превращаются в «Чай и
      пирог», а всё после `#` — комментарий, на экран он не попадает.
    coach: >-
      Если прогноз не совпал, пройди код ещё раз и найди строку, где твоё представление
      разошлось с тем, что сделал Python.

  - id: hash-in-quotes
    type: predict
    title: Решётка в кавычках
    prompt: >-
      Здесь знак `#` встречается три раза. Где он начинает комментарий, а где — нет? Выбери,
      что появится на экране.
    code: |-
      print("Заказ #5")  # номер
      # print("Отменён")
      print("Чай", "и", "торт")
    options:
      - |-
        Заказ
        Чай и торт
      - |-
        Заказ #5  # номер
        Чай и торт
      - |-
        Заказ #5
        Чай и торт
    answer: |-
      Заказ #5
      Чай и торт
    explanation: >-
      В строке 1 первый `#` стоит внутри кавычек — это обычный символ текста, поэтому на экране
      «Заказ #5». Второй `#` стоит после команды, вне кавычек: с него начинается комментарий, и
      «номер» на экран не попадает. Строка 2 — комментарий целиком, Python её пропускает.

  - id: assemble
    type: order
    title: Собери программу
    prompt: |-
      Расставь строки кода так, чтобы программа вывела:

      ```text
      Кофейня «Утро»

      Заказ готов
      ```
    items:
      - id: note
        text: "`# Экран выдачи заказов`"
      - id: name
        text: '`print("Кофейня «Утро»")`'
      - id: blank
        text: "`print()`"
      - id: ready
        text: '`print("Заказ", "готов")`'
    before:
      - [name, blank]
      - [blank, ready]
    explanation: >-
      Порядок команд `print` совпадает с порядком строк на экране: название, пустая строка,
      «Заказ готов». А комментарий может стоять где угодно — на вывод он не влияет. По смыслу
      ему место в начале: он объясняет, что это за программа.

  - id: practice-blank
    type: exercise
    title: Практика 1
    exercise:
      id: m0-l2-e1
      kind: repeat
      title: Экран выдачи заказов
      statement: |-
        Напиши программу для экрана выдачи заказов. Между номером заказа и напитками должна
        быть пустая строка:

        ```text
        Заказ № 7

        Капучино
        Какао
        ```
      output: Четыре строки, вторая из них пустая.
      constraints:
        - Используй команду `print`.
      starterCode: |
        # Экран выдачи заказов: номер, пустая строка, напитки

      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: |-
            Заказ № 7

            Капучино
            Какао
      criteria:
        - Выводятся четыре строки — номер заказа, пустая строка, «Капучино», «Какао».
        - Пустая строка стоит между номером заказа и напитками.
        - Пробелы в конце строк не учитываются.
      hints:
        - >-
          Сравни образец с чеком из прошлого урока: какая строка здесь новая и чем она
          отличается от остальных?
        - >-
          Пустую строку выводит `print` с пустыми скобками. Например, команды `print("Раз")`,
          `print()` и `print("Два")` покажут «Раз», пустую строку и «Два».
        - >-
          Каркас из четырёх команд по порядку: `print` с номером заказа → `print()` →
          `print` с первым напитком → `print` со вторым.
      solution:
        code: |
          print("Заказ № 7")
          print()
          print("Капучино")
          print("Какао")
        explanation: >-
          `print()` выводит пустую строку, поэтому номер заказа отделён от напитков. Порядок
          строк на экране совпадает с порядком команд.
      wrongSolutions:
        - code: |
            print("Заказ № 7")
            print("Капучино")
            print("Какао")
          note: Нет пустой строки.
          expectMistake: no-blank-line
        - code: |
            print("Заказ № 7")
            print
            print("Капучино")
            print("Какао")
          note: print без скобок.
          expectMistake: bare-print
        - code: |
            print("Заказ № 7")
            print("Капучино")
            print("Какао")
            print()
          note: Пустая строка в самом конце.
          expectMistake: blank-at-end
        - code: |
            print("Заказ № 7")
            print("Капучино")
            print()
            print("Какао")
          note: Пустая строка не на своём месте.
          expectMistake: blank-between-drinks
      mistakes:
        - id: bare-print
          when:
            codeRegex: '^[ \t]*print[ \t]*$'
          why: >-
            Слово `print` без скобок — не команда: Python видит имя, но ничего не запускает и
            идёт дальше. Поэтому пустой строки на экране нет.
          try: Допиши к этому `print` пустые скобки — `print()`.
          verify: Запусти программу — между номером и напитками должна появиться пустая строка.
        - id: blank-at-end
          when:
            outputEquals: |-
              Заказ № 7
              Капучино
              Какао
            codeRegex: >-
              ^[ \t]*print\(\s*(""|'')?\s*\)
          why: >-
            Команда `print()` в программе есть, но стоит в самом конце — после «Какао». Там
            пустая строка не видна, и проверка её не учитывает. Команды выполняются по порядку,
            и `print()` срабатывает там, где стоит, а по образцу пустая строка отделяет номер
            заказа от напитков.
          try: Перенеси `print()` выше — сразу после команды с номером заказа.
          verify: Второй строкой вывода должна идти пустая строка.
        - id: no-blank-line
          when:
            outputEquals: |-
              Заказ № 7
              Капучино
              Какао
          why: >-
            Все строки с текстом на месте, но пустой строки между номером заказа и напитками
            нет.
          try: Поставь команду `print()` между командой с номером и командой с капучино.
          verify: Второй строкой вывода должна идти пустая строка.
        - id: blank-between-drinks
          when:
            outputEquals: |-
              Заказ № 7
              Капучино

              Какао
          why: >-
            Пустая строка есть, но стоит между напитками. По образцу она отделяет номер заказа
            от напитков: команды выполняются по порядку, и `print()` срабатывает там, где стоит.
          try: Перенеси `print()` выше — сразу после команды с номером заказа.
          verify: Второй строкой вывода должна идти пустая строка, а «Капучино» и «Какао» — подряд.
      afterPass: >-
        Пустая строка разделила экран на два блока — так его проще читать издалека. Тот же
        приём пригодится в любом отчёте или чеке: `print()` отделяет одну часть от другой.
      skills: [print-output, execution-order]

  - id: practice-toggle
    type: exercise
    title: Практика 2
    exercise:
      id: m0-l2-e2
      kind: modify
      title: Акция закончилась
      statement: |-
        Акция закончилась, а какао снова в продаже. Измени программу:

        - строку с акцией **не удаляй** — хозяйка вернёт акцию в пятницу, — а «выключи» её
          комментарием;
        - строку с какао, наоборот, «включи».

        Табло должно показать:

        ```text
        Меню дня
        Капучино
        Какао
        ```
      output: Три строки — «Меню дня», «Капучино», «Какао». Строка с акцией остаётся в коде как комментарий.
      constraints:
        - Не удаляй строку с акцией — только закомментируй её.
      starterCode: |
        # Табло кофейни
        print("Меню дня")
        print("Капучино")
        # print("Какао")
        print("Акция: второй кофе в подарок")
      tests:
        - id: t1
          kind: io
          title: Табло
          example: true
          expected: |-
            Меню дня
            Капучино
            Какао
        - id: t2
          kind: assert
          title: Строка с акцией осталась в коде
          code: |-
            import io, linecache, tokenize
            source = "".join(linecache.getlines("main.py"))
            tokens = tokenize.generate_tokens(io.StringIO(source).readline)
            comments = [token.string for token in tokens if token.type == tokenize.COMMENT]
            assert any("второй кофе в подарок" in text for text in comments)
          message: >-
            В коде не нашлось закомментированной строки с акцией «второй кофе в подарок». Не
            удаляй и не переписывай эту строку: поставь в её начале `#` — Python её пропустит,
            а вернуть акцию будет легко.
      criteria:
        - Табло показывает три строки — «Меню дня», «Капучино», «Какао».
        - Строка с акцией осталась в коде, но начинается с `#`.
        - Строка с какао начинается прямо с `print` — без `#` и без пробела впереди.
      hints:
        - Здесь две правки, и обе про знак `#`. Где его нужно поставить, а где — убрать?
        - >-
          Сравни: строку `# print("Чай")` Python пропускает, а `print("Чай")` выполняет.
          Разница — только знак `#` и пробел после него в начале строки.
        - >-
          В строке с какао сотри `#` и пробел, чтобы строка начиналась прямо с `print`. Строку
          с акцией начни с `# `, остальное в ней не меняй.
      solution:
        code: |
          # Табло кофейни
          print("Меню дня")
          print("Капучино")
          print("Какао")
          # print("Акция: второй кофе в подарок")
        explanation: >-
          Знак `#` в начале строки превращает её в комментарий, и Python её пропускает. Строку
          с какао мы «включили», убрав `#` и пробел, а строку с акцией «выключили». Когда акция
          вернётся, достаточно стереть `# `.
      wrongSolutions:
        - code: |
            # Табло кофейни
            print("Меню дня")
            print("Капучино")
            print("Какао")
            print("Акция: второй кофе в подарок")
          note: Акция всё ещё на табло.
          expectMistake: promo-still-on
        - code: |
            # Табло кофейни
            print("Меню дня")
            print("Капучино")
             print("Какао")
            # print("Акция: второй кофе в подарок")
          note: Пробел в начале строки с какао.
          expectMistake: leading-space
        - code: |
            # Табло кофейни
            print("Меню дня")
            print("Капучино")
            print("Какао")
          note: Строка с акцией удалена.
          expectMistake: promo-deleted
        - code: |
            # Табло кофейни
            print("Меню дня")
            print("Капучино")
            # print("Какао")
            # print("Акция: второй кофе в подарок")
          note: Какао не включено.
          expectMistake: cocoa-still-off
        - code: |
            # Табло кофейни
            print("Меню дня")
            print("Капучино")
            print("Какао")
            # Акция закончилась
          note: Строка с акцией заменена другим комментарием.
          expectMistake: promo-deleted
        - code: |
            # Табло кофейни
            print("Меню дня")
            print("Капучино")
            print("Какао")
            // print("Акция: второй кофе в подарок")
          note: Строка выключена через //.
          expectMistake: slash-comment
      mistakes:
        - id: slash-comment
          when:
            codeRegex: '//'
          why: >-
            В Python комментарий начинается со знака `#`. Двойная косая черта `//` означает
            комментарий в некоторых других языках, а в Python это знак целочисленного деления —
            его мы разберём в модуле 1. Поэтому текст после `//` Python читает как код. В начале
            строки это ошибка записи — `SyntaxError`. А после команды Python пытается поделить
            на слово, которого не знает, — отсюда `NameError`.
          try: Замени `//` на `#`.
          verify: Программа должна запуститься, а строка с акцией — не появиться на табло.
        - id: leading-space
          when:
            errorType: IndentationError
          why: >-
            Строка начинается с пробела. Python следит за отступами в начале строк, и лишний
            пробел для него — ошибка `IndentationError: unexpected indent` («неожиданный отступ»).
          try: Сотри пробел перед `print` в строке из сообщения, чтобы строка начиналась с самого края.
          verify: Программа должна запуститься без ошибки.
        - id: promo-still-on
          when:
            outputIncludes: Акция
          why: Строка с акцией всё ещё выполняется, поэтому акция видна на табло.
          try: Поставь в начало строки с акцией знак `#` и пробел.
          verify: На табло должны остаться три строки, без акции.
        - id: cocoa-still-off
          when:
            outputEquals: |-
              Меню дня
              Капучино
          why: Строка с какао всё ещё закомментирована, и Python её пропускает.
          try: Сотри в начале этой строки `#` и пробел после него.
          verify: Последней строкой на табло должно быть «Какао».
        - id: promo-deleted
          when:
            failedTest: t2
            outputEquals: |-
              Меню дня
              Капучино
              Какао
          why: >-
            Табло показывает то, что нужно, но строки с акцией больше нет в коде. Хозяйка
            просила её не удалять: в пятницу акция вернётся.
          try: >-
            Верни строку `print("Акция: второй кофе в подарок")` в конец программы и поставь
            перед ней `# `.
          verify: Нажми «Проверить» — проверка «Строка с акцией осталась в коде» должна пройти.
      afterPass: >-
        Теперь ты умеешь «выключать» и «включать» строки, не удаляя их. Тем же приёмом пользуются
        при поиске ошибок: закомментировал подозрительную строку, запустил — и смотришь,
        изменилось ли поведение.
      skills: [comments, execution-order]

  - id: practice-memo
    type: exercise
    title: Практика 3
    exercise:
      id: m0-l2-e3
      kind: write
      title: Памятка для смены
      statement: |-
        Артём просит памятку для новых бариста. Напиши с нуля программу, которая печатает:

        ```text
        Утро
        Включить кофемашину
        Проверить молоко

        Вечер
        Вымыть кофемашину
        Выключить табло
        ```

        Добавь в код хотя бы один комментарий для людей — например, о том, что печатает
        программа.
      output: Семь строк точно как в образце — утренний блок, пустая строка, вечерний блок.
      constraints:
        - В коде есть хотя бы один комментарий с текстом.
      starterCode: ""
      tests:
        - id: t1
          kind: io
          title: Памятка
          example: true
          expected: |-
            Утро
            Включить кофемашину
            Проверить молоко

            Вечер
            Вымыть кофемашину
            Выключить табло
        - id: t2
          kind: assert
          title: В коде есть комментарий
          code: |-
            import io, linecache, tokenize
            source = "".join(linecache.getlines("main.py"))
            tokens = tokenize.generate_tokens(io.StringIO(source).readline)
            comments = [token.string for token in tokens if token.type == tokenize.COMMENT]
            assert any(any(char.isalpha() for char in text) for text in comments)
          message: >-
            В коде нет комментария с текстом. Добавь строку, которая начинается с `#`, и напиши
            в ней, что делает программа.
      criteria:
        - Выводятся семь строк в указанном порядке, четвёртая — пустая.
        - Текст строк совпадает с образцом.
        - В коде есть хотя бы один комментарий с текстом.
      hints:
        - >-
          Сначала посчитай строки в образце, включая пустую: столько строк вывода должна дать
          программа. Потом реши, где в коде уместна пометка для людей.
        - >-
          Пример на другом тексте: `# Приветствие для гостей` — комментарий, Python его
          пропустит; `print("Добро пожаловать")` — команда; `print()` — пустая строка.
        - |-
          Каркас:

          ```python
          # ... что печатает программа
          print("Утро")
          # ... ещё две команды для утра
          print()
          print("Вечер")
          # ... ещё две команды для вечера
          ```
      solution:
        code: |
          # Памятка для бариста: дела на утро и на вечер
          print("Утро")
          print("Включить кофемашину")
          print("Проверить молоко")
          print()  # отделяем утро от вечера
          print("Вечер")
          print("Вымыть кофемашину")
          print("Выключить табло")
        explanation: >-
          Семь строк вывода — семь команд `print`, одна из них пустая. Комментарии Python
          пропускает: они объясняют людям, что делает программа, и не меняют вывод.
      wrongSolutions:
        - code: |
            print("Утро")
            print("Включить кофемашину")
            print("Проверить молоко")
            print()
            print("Вечер")
            print("Вымыть кофемашину")
            print("Выключить табло")
          note: Нет комментария.
          expectMistake: no-comment
        - code: |
            # ---
            print("Утро")
            print("Включить кофемашину")
            print("Проверить молоко")
            print()
            print("Вечер")
            print("Вымыть кофемашину")
            print("Выключить табло")
          note: Комментарий без текста.
          expectMistake: no-comment
        - code: |
            // Памятка для бариста
            print("Утро")
            print("Включить кофемашину")
            print("Проверить молоко")
            print()
            print("Вечер")
            print("Вымыть кофемашину")
            print("Выключить табло")
          note: Комментарий через //.
          expectMistake: slash-comment
        - code: |
            print("Утро")  // утро
            print("Включить кофемашину")
            print("Проверить молоко")
            print()
            print("Вечер")
            print("Вымыть кофемашину")
            print("Выключить табло")
          note: Комментарий через // после команды.
          expectMistake: slash-comment
        - code: |
            Памятка для бариста
            print("Утро")
            print("Включить кофемашину")
            print("Проверить молоко")
            print()
            print("Вечер")
            print("Вымыть кофемашину")
            print("Выключить табло")
          note: Пояснение без знака решётки.
          expectMistake: note-without-hash
        - code: |
            # Памятка для бариста
            Утро
            print("Включить кофемашину")
            print("Проверить молоко")
            print()
            print("Вечер")
            print("Вымыть кофемашину")
            print("Выключить табло")
          note: Строка памятки без print.
          expectMistake: note-without-hash
        - code: |
            # Памятка для бариста
            рrint("Утро")
            print("Включить кофемашину")
            print("Проверить молоко")
            print()
            print("Вечер")
            print("Вымыть кофемашину")
            print("Выключить табло")
          note: В print русская буква «р».
          expectMistake: cyrillic-letter
        - code: |
            # Памятка для бариста
            print("Утро")
            print("Включить кофемашину")
            print("Проверить молоко")
            print("Вечер")
            print("Вымыть кофемашину")
            print("Выключить табло")
          note: Нет пустой строки.
          expectMistake: missing-blank
        - code: |
            # Памятка для бариста
            print("Утро")
            print("Включить кофемашину")
            print("Проверить молоко")
            print
            print("Вечер")
            print("Вымыть кофемашину")
            print("Выключить табло")
          note: print без скобок.
          expectMistake: bare-print
      mistakes:
        - id: slash-comment
          when:
            codeRegex: '//'
          why: >-
            В Python комментарий начинается со знака `#`. Двойная косая черта `//` означает
            комментарий в некоторых других языках, а в Python это знак целочисленного деления —
            его мы разберём в модуле 1. Поэтому текст после `//` Python читает как код. В начале
            строки это ошибка записи — `SyntaxError`. А после команды Python пытается поделить
            на слово, которого не знает, — отсюда `NameError`.
          try: Замени `//` на `#`.
          verify: Программа должна запуститься, а комментарий — не появиться на экране.
        - id: cyrillic-letter
          when:
            errorType: NameError
            codeRegex: '^[ \t]*[\wА-Яа-яЁё]*[А-Яа-яЁё][\wА-Яа-яЁё]*\('
          why: >-
            В имени команды есть русская буква. Русская «р» и английская «p» выглядят
            одинаково, но для Python это разные символы, поэтому такое имя ему незнакомо —
            отсюда `NameError`.
          try: Сотри имя команды целиком и набери `print` заново в английской раскладке.
          verify: Программа должна запуститься, а вывод — совпасть с образцом.
        - id: note-without-hash
          when:
            codeRegex: '^[ \t]*[А-Яа-яЁё]+(?![\wА-Яа-яЁё(])'
          why: >-
            Строка начинается с русского слова — без `#` и без `print`. Python принимает её за
            команду и не может выполнить.
          try: >-
            Если это пояснение для людей — поставь `#` в начало строки. Если этот текст должен
            появиться на экране — возьми его в `print("...")`.
          verify: Программа должна запуститься, а вывод — совпасть с образцом.
        - id: bare-print
          when:
            codeRegex: '^[ \t]*print[ \t]*$'
          why: >-
            Слово `print` без скобок — не команда: Python видит имя, но ничего не запускает.
            Поэтому пустой строки между блоками нет.
          try: Допиши к этому `print` пустые скобки — `print()`.
          verify: Четвёртой строкой вывода должна идти пустая строка.
        - id: missing-blank
          when:
            outputEquals: |-
              Утро
              Включить кофемашину
              Проверить молоко
              Вечер
              Вымыть кофемашину
              Выключить табло
          why: Все строки на месте, но между утренним и вечерним блоками нет пустой строки.
          try: Добавь `print()` между «Проверить молоко» и «Вечер».
          verify: Четвёртой строкой вывода должна идти пустая строка.
        - id: no-comment
          when:
            failedTest: t2
            outputEquals: |-
              Утро
              Включить кофемашину
              Проверить молоко

              Вечер
              Вымыть кофемашину
              Выключить табло
          why: >-
            Вывод правильный, но в коде нет комментария с текстом. Комментарий — пометка для
            людей: через месяц и ты сам, и коллега быстрее поймёте, что делает программа.
          try: Добавь первой строкой комментарий со словами, например `# Памятка для бариста`.
          verify: Нажми «Проверить» — проверка комментария должна пройти, а вывод остаться прежним.
      afterPass: >-
        Программа печатает памятку, а комментарий объясняет, что это за код. Хороший комментарий
        говорит, зачем нужна часть программы, а не пересказывает команду: пометка
        `# отделяем утро от вечера` полезнее, чем `# печатаем пустую строку`.
      skills: [comments, print-output, execution-order]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Python выполняет строки сверху вниз. Трассировка — пройти их вручную и записать вывод до запуска.
      - "`print()` с пустыми скобками выводит пустую строку, а `print` без скобок не делает ничего."
      - Значения через запятую в одном `print` выводятся в одну строку через пробел.
      - "Знак `#` начинает комментарий: Python пропускает всё до конца строки. Внутри кавычек `#` — обычный символ."
    question: Зачем закомментировать строку, а не удалить её?
    answer: >-
      Закомментированную строку Python не выполняет, но она остаётся в коде, и её легко
      вернуть — достаточно убрать `#`. Это удобно для временных изменений вроде акции, которая
      ещё вернётся, и при поиске ошибки: можно по очереди «выключать» строки и смотреть, что
      меняется.
