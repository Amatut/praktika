      mistakes:
        - id: braces-dict
          when:
            errorIncludes: "'dict' object has no attribute 'add'"
          where: Строка, где создаётся множество
          why: >-
            Пустые фигурные скобки `{}` создают не множество, а пустой **словарь**. У словаря нет
            метода `add`.
          try: >-
            Создай множество сразу со стартовой клеткой: `visited = {(0, 0)}`. Или пустое — через
            `set()`, а клетку добавь потом.
          verify: "В «Примере 1» должно получиться `Клеток: 4`."
        - id: tuple-assign
          when:
            errorIncludes: "'tuple' object does not support item assignment"
          why: >-
            Кортеж изменить нельзя, а строка из сообщения об ошибке пытается заменить значение
            внутри него по индексу.
          try: >-
            Храни x и y в отдельных переменных и меняй их, а после шага собирай новую клетку:
            `(x, y)`.
          verify: "В «Примере 1» должно получиться `Клеток: 4`."
        - id: list-in-set
          when:
            errorIncludes: unhashable
          why: >-
            В множество попал список — значения в квадратных скобках. Список можно менять, а в
            множество кладут только неизменяемые значения.
          try: >-
            Замени квадратные скобки на круглые — `(x, y)`, `(0, 0)`: пара станет кортежем, а его
            в множество положить можно.
          verify: "В «Примере 1» должно получиться `Клеток: 4`."
        - id: add-two-args
          when:
            errorIncludes: takes exactly one argument
          where: Строка с add
          why: >-
            `add` кладёт в множество одно значение, а получил два — `x` и `y` по отдельности.
            Python не знает, что это пара.
          try: >-
            Собери пару в кортеж и передай его целиком — нужны вторые круглые скобки:
            `visited.add((x, y))`.
          verify: "В «Примере 1» должно получиться `Клеток: 4`."
        - id: latin-letters
          when:
            codeRegex: '["''][BH]["'']'
          where: Сравнения с буквами команд
          why: >-
            Буквы в кавычках латинские. Они похожи на русские В и Н, но для Python это другие
            символы, поэтому команды `В` и `Н` ни с чем не совпадают.
          try: Переключи раскладку на русскую и перепечатай буквы в кавычках.
          verify: "В «Примере 1» должно получиться `Клеток: 4`."
        - id: start-not-tuple
          when:
            codeRegex: '\{\s*0\s*,\s*0\s*\}|set\(\s*[(\[]\s*0\s*,\s*0\s*[)\]]\s*\)'
          where: Строка, где создаётся множество со стартовой клеткой
          why: >-
            В множестве оказалась не клетка (0, 0), а число 0. `{0, 0}` — множество из двух
            одинаковых чисел, они слились в одно. А `set((0, 0))` разбирает кортеж на отдельные
            значения — так же, как `set("Аня")` разбирает строку на буквы.
          try: >-
            Положи кортеж внутрь фигурных скобок — `visited = {(0, 0)}`. Или создай пустое
            множество и добавь клетку: `visited = set()`, затем `visited.add((0, 0))`.
          verify: "В «Примере 2» должно получиться `Клеток: 2`."
        - id: no-start
          when:
            failedTest: t3
            outputEquals: "Клеток: 3"
          where: Строка, где создаётся множество
          why: >-
            Не хватает одной клетки — стартовой. Робот начинает в (0, 0), и она уже подстрижена,
            но в множество попадают только клетки после шагов. Поэтому без команд выходит 0.
          try: 'Положи стартовую клетку в множество до цикла: `visited = {(0, 0)}`.'
          verify: "Тест «Граничный случай: команд нет» должен дать `Клеток: 1`."
        - id: add-before-move
          when:
            outputEquals: "Клеток: 3"
            codeRegex: '\bfor\b[^\n]*:[ \t]*\r?\n(?:[ \t]+(?![ \t]|if\b|elif\b|else\b)[^\n]*\r?\n)*?[ \t]+[A-Za-z_]\w*\.add\('
          where: Строка с add перед ветвлением
          why: >-
            Клетка добавляется в начале шага, до того как робот сдвинулся. Поэтому клетка, куда
            робот пришёл после последней команды, в множество не попадает.
          try: >-
            Перенеси `add` в конец тела цикла — после ветвления, которое меняет x и y.
          verify: "В «Примере 1» должно получиться `Клеток: 4`."
        - id: repeats-counted
          when:
            outputEquals: "Клеток: 5"
            codeRegex: '(?<![\s\S])(?![\s\S]*(?:\.add\(|\bset\())'
          why: >-
            Робот возвращался на клетки, где уже был, и их посчитали ещё раз. В «Примере 2» он
            ходит туда-сюда по двум клеткам, а насчитано пять.
          try: Складывай клетки в множество — оно само отбросит повторы.
          verify: "В «Примере 2» должно получиться `Клеток: 2`."
        - id: glued-coords
          when:
            failedTest: t7
            outputEquals: "Клеток: 21"
          why: >-
            Две разные клетки превратились в одну и ту же запись. Так бывает, если склеить
            координаты в строку без разделителя: клетки (-1, 10) и (-11, 0) обе дают `-110`.
          try: >-
            Храни клетку кортежем `(x, y)` — так числа не слипаются. Если нужна строка, поставь
            между числами разделитель: `f"{x},{y}"`.
          verify: "Тест «Граничный случай: двузначные координаты» должен дать `Клеток: 22`."
        - id: stale-position
          when:
            outputEquals: "Клеток: 1"
            codeRegex: '^[A-Za-z_]\w*\s*=\s*\([^()\n]*,[^()\n]*\)\s*$[\s\S]*\.add\(\s*[A-Za-z_]\w*\s*\)'
          where: Строка, где кортеж собирается до цикла
          why: >-
            Кортеж запоминает **значения** x и y в момент, когда его собрали, — здесь (0, 0). Потом
            x и y меняются, а кортеж остаётся прежним, и в множество раз за разом кладётся
            стартовая клетка.
          try: >-
            Собирай кортеж заново после каждого шага, внутри цикла: `visited.add((x, y))`.
          verify: "В «Примере 1» должно получиться `Клеток: 4`."
      afterPass: >-
        Кортеж `(x, y)` держит координату целиком, а множество само отбрасывает повторы. Так в
        играх отмечают уже исследованные клетки карты. Если захочешь, выведи ещё, в какой клетке
        робот закончил работу.
      skills: [sets-tuples, conditions]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - >-
        Множество хранит только уникальные значения: `set()`, `add`, `in`, `len`; `&` — общее,
        `|` — всё вместе, `-` — разность.
      - "У множества нет порядка: если порядок важен, иди по списку и спрашивай у множества `in`."
      - "Кортеж — неизменяемая запись: `point = (x, y)`, распаковка `x, y = point`."
      - "В множество кладут неизменяемое: кортеж можно, список нельзя."
    question: Почему пустое множество создают через `set()`, а не через `{}`?
    answer: >-
      Пустые фигурные скобки `{}` — это пустой словарь. Метода `add` у словаря нет, и программа
      остановится с ошибкой AttributeError. Пустое множество создаёт только `set()`.
