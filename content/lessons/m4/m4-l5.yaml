id: m4-l5
module: m4
number: "4.5"
title: "Множества и кортежи"
objective: >-
  Убирать повторы и находить общее через множества, а пары значений, которые не должны
  меняться, хранить в кортежах.
minutes: [25, 30]
prerequisites: [m4-l4]
skills: [sets-tuples]
environment: python

story:
  title: Кто пришёл и во что играем
  fictional: true
  text: >-
    Денис ведёт клуб настольных игр. Раньше по пятницам он считал, сколько разных людей пришло,
    но в тетради отметок некоторые расписывались дважды — выходили подышать и возвращались, — и
    цифра получалась больше настоящей. А перед игрой он расспрашивал двух новичков, какие игры они
    знают, и на слух искал общие. Теперь это делает небольшая программа: множество само убирает
    повторы и одной операцией находит общее. А кортеж надёжно держит вместе то, что нельзя
    разлучать, — например, две координаты клетки на игровом поле.

why: >-
  Иногда важно не «сколько раз», а «какие разные» и «что общего»: сколько разных людей пришло,
  какие игры знают оба новичка. Множество хранит только уникальные значения и находит общее у
  двух наборов, а кортеж — неизменяемая запись из нескольких значений, например координата
  `(x, y)`.

usedIn: >-
  Подсчёт уникальных посетителей сайта, теги к постам, проверка «видели ли мы это уже»,
  рекомендации по общим интересам, координаты в играх и на картах. В модуле 11 строки из базы
  данных придут в программу именно кортежами.

steps:
  - id: idea
    type: theory
    title: "Множество: без повторов. Кортеж: без изменений"
    body: |-
      **Множество** — набор значений без повторов. Его пишут в фигурных скобках, как словарь, но
      без пар через двоеточие — просто значения: `{"шахматы", "нарды"}`. Одинаковые значения в
      множестве сливаются в одно.

      ```python
      visits = ["Аня", "Гоша", "Аня"]
      people = set(visits)    # Аня и Гоша: повтор исчез
      people.add("Оля")       # добавить значение
      people.add("Аня")       # уже есть: ничего не изменится
      print(len(people))      # 3
      print("Оля" in people)  # True
      ```

      Пустое множество создают только через `set()`. Пустые фигурные скобки `{}` — это пустой
      словарь, и метода `add` у него нет. Осторожно со строкой: `set("Аня")` разберёт её на
      буквы `'А'`, `'н'`, `'я'`. Чтобы положить слово целиком, используй `add`.

      Из двух множеств можно получить общее, всё вместе и разность:

      ```python
      anya = {"шахматы", "мафия", "нарды"}
      gosha = {"мафия", "домино"}
      print(anya & gosha)  # пересечение — общее: мафия
      print(anya | gosha)  # объединение — всё вместе без повторов: 4 игры
      print(anya - gosha)  # разность — есть у Ани, но нет у Гоши: шахматы и нарды
      ```

      **У множества нет порядка и индексов.** `people[0]` — ошибка. Порядок при печати не
      гарантирован: значения могут выйти не в том порядке, в каком ты их записал, а на другом
      компьютере или после перезагрузки страницы — в другом. Если порядок важен, иди по
      исходному списку и спрашивай у множества `in`.

      **Кортеж** — несколько значений, скреплённых в одну запись. Его пишут в круглых скобках:
      `point = (2, 3)`. Индексы — как у списка: `point[0]` равно 2. А изменить кортеж нельзя:
      `point[0] = 5` остановит программу ошибкой
      `TypeError: 'tuple' object does not support item assignment`.

      **Распаковка** раскладывает кортеж по переменным: после `x, y = point` в `x` лежит 2, а в
      `y` — 3. Слева столько переменных, сколько значений справа. Так же задают две переменные
      сразу — `x, y = 0, 0` — или разбирают строку: `day, place = "пн парк".split()`. В цикле по
      списку пар распаковка идёт на каждом шаге:

      ```python
      for name, score in [("Аня", 5), ("Боря", 4)]:
          print(name, score)
      ```

      Такие же пары давал `items()` в прошлом уроке: это были кортежи.

      Кортеж можно положить в множество — `{(0, 0), (1, 0)}`, — а список нельзя. Python
      остановит программу ошибкой
      `TypeError: cannot use 'list' as a set element (unhashable type: 'list')`: в множество
      кладут только то, что не меняется.
    simpler: >-
      Множество — мешок с жетонами: одинаковые жетоны сливаются в один, а порядка в мешке нет.
      Кортеж — запаянный конверт с несколькими листами: читать можно, подменить лист нельзя.
      Распаковка `x, y = point` — переписать то, что на листах, в две тетради; сам конверт
      остаётся запаянным.
    coach: >-
      Спроси себя: важны ли мне повторы и порядок? Если нет — посмотри на множество.

  - id: club
    type: example
    title: Пятница в клубе
    body: >-
      Программа считает отметки и разных гостей, находит игру, которую знают двое, и хранит
      запись о столе кортежем. Нажми «Запустить».
    code: |-
      visits = ["Аня", "Гоша", "Аня", "Оля", "Гоша"]
      people = set(visits)
      print(len(visits), len(people))
      people.add("Марат")
      people.add("Аня")
      print(len(people), "Марат" in people, "Ира" in people)
      anya = {"шахматы", "мафия", "нарды"}
      gosha = {"мафия", "домино"}
      print(anya & gosha)
      table = ("шахматы", 2)
      game, players = table
      print(f"{game}: {players} игрока")
    notes:
      - line: 2
        text: >-
          `set(visits)` строит множество из списка: пять отметок, но разных людей трое. Сам список
          `visits` не изменился.
      - line: 5
        text: >-
          Аня в множестве уже есть, поэтому этот `add` ничего не меняет: после двух добавлений
          гостей 4, а не 5.
      - line: 6
        text: "`in` отвечает, есть ли значение в множестве: `True` или `False`."
      - line: 9
        text: >-
          `&` оставляет только общее. Множество печатается в фигурных скобках — здесь в нём одна
          игра.
      - line: 10
        text: Кортеж держит вместе название игры и число игроков за столом.
      - line: 11
        text: Распаковка раскладывает кортеж по двум переменным — `game` и `players`.
    tryIt: >-
      Допиши `print({3, 10, 1})`: числа выйдут не в том порядке, в каком ты их записал, и даже
      не по возрастанию. Порядок строк, например в `print(anya | gosha)`, может смениться после
      перезагрузки страницы или на другом компьютере — полагаться на него нельзя. Потом допиши
      `table[1] = 4` и прочитай ошибку.
    coach: >-
      Печатай множество, только чтобы заглянуть внутрь. Если важен порядок, выводи значения, идя
      по списку.

  - id: sets-predict
    type: predict
    title: Сколько игр?
    prompt: Как думаешь, что выведет программа?
    code: |-
      a = {"шахматы", "нарды", "го"}
      b = {"нарды", "домино"}
      print(len(a | b), len(a & b), len(a - b))
    options:
      - "5 1 2"
      - "4 1 2"
      - "4 1 1"
      - "4 1 3"
    answer: "4 1 2"
    explanation: >-
      `a | b` — объединение, все игры вместе: шахматы, нарды, го и домино. Нарды есть в обоих
      множествах, но в объединении они одни — поэтому 4, а не 5. `a & b` — пересечение, только
      общее: нарды, это 1. `a - b` — разность: то, что есть в `a`, но нет в `b`, — шахматы и го,
      это 2. Разность зависит от порядка: `b - a` дала бы 1 — только домино.
    coach: Операции над множествами не изменяют `a` и `b` — они возвращают новые множества.

  - id: practice-guests
    type: exercise
    title: Практика 1
    exercise:
      id: m4-l5-e1
      kind: repeat
      title: Разные гости
      statement: |-
        Денис хочет знать, сколько всего отметок в тетради и сколько среди расписавшихся разных
        людей. Программа получает число отметок, а затем имена — по одному в строке. Посчитай
        разных гостей (удобнее всего — множеством) и выведи две строки:

        ```text
        Отметок: 7
        Гостей: 4
        ```
      input: >-
        Первая строка — число отметок n. Затем n строк — имена в том порядке, в каком люди
        расписывались.
      output: "Две строки: `Отметок: <n>` и `Гостей: <число разных имён>`."
      constraints:
        - Один и тот же человек всегда пишет имя одинаково.
        - Отметок может не быть совсем — тогда n равно 0.
      starterCode: |
        n = int(input())
        # Прочитай n имён и посчитай, сколько среди них разных
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "7\nЛиза\nМарат\nИра\nЛиза\nСева\nМарат\nИра\n"
          expected: "Отметок: 7\nГостей: 4"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "3\nГоша\nМирон\nКатя\n"
          expected: "Отметок: 3\nГостей: 3"
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: один человек четыре раза"
          edge: true
          stdin: "4\nОля\nОля\nОля\nОля\n"
          expected: "Отметок: 4\nГостей: 1"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: никто не пришёл"
          edge: true
          stdin: "0\n"
          expected: "Отметок: 0\nГостей: 0"
          compare:
            ignoreSpaces: true
      criteria:
        - Каждое имя читается отдельным `input()` внутри цикла.
        - Повторы не считаются — каждый гость учитывается один раз.
        - "Выводятся две строки: `Отметок: …` и `Гостей: …`, в том числе при n = 0."
      hints:
        - >-
          Какая структура сама выбрасывает повторы? Подумай, как создать её пустой до цикла —
          пустые фигурные скобки для этого не подходят.
        - |-
          На другом примере:
          ```python
          colors = set()
          colors.add("красный")
          colors.add("красный")
          colors.add("синий")
          print(len(colors))   # 2
          ```
        - |-
          Каркас:
          ```text
          guests = пустое множество
          повторить n раз:
              добавить в guests имя из input()
          вывести "Отметок:" и n
          вывести "Гостей:" и len(guests)
          ```
      solution:
        code: |
          n = int(input())
          guests = set()
          for i in range(n):
              guests.add(input())
          print(f"Отметок: {n}")
          print(f"Гостей: {len(guests)}")
        explanation: >-
          Пустое множество создаётся через `set()` один раз, до цикла. На каждом шаге `input()`
          читает одно имя, а `add` кладёт его в множество. Если такое имя там уже есть, ничего не
          меняется, поэтому `len(guests)` — это число разных гостей. Число отметок — просто `n`.
          При `n = 0` цикл не выполняется ни разу, и множество остаётся пустым: гостей 0.
      altSolutions:
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            print("Отметок:", len(names))
            print("Гостей:", len(set(names)))
          note: Сначала список всех отметок, потом множество из него.
        - code: |
            n = int(input())
            unique = []
            for i in range(n):
                name = input()
                if name not in unique:
                    unique.append(name)
            print(f"Отметок: {n}")
            print(f"Гостей: {len(unique)}")
          note: Список без повторов через not in, как в уроке про списки.
        - code: |
            n = int(input())
            guests = set()
            i = 0
            while i < n:
                name = input()
                guests.add(name)
                i += 1
            print("Отметок: " + str(n))
            print("Гостей: " + str(len(guests)))
          note: Цикл while и склейка строк.
        - code: |
            n = int(input())
            guests = set()
            for i in range(n):
                guests.add(input())
            print("Отметок: ", n)
            print("Гостей: ", len(guests))
          note: Пробел в строке и запятая в print — два пробела подряд; формат пробелов не важен.
      wrongSolutions:
        - code: |
            n = int(input())
            guests = {}
            for i in range(n):
                guests.add(input())
            print(f"Отметок: {n}")
            print(f"Гостей: {len(guests)}")
          note: "{} — пустой словарь, а не множество."
          expectMistake: braces-dict
        - code: |
            n = int(input())
            guests = set()
            for i in range(n):
                guests = set(input())
            print(f"Отметок: {n}")
            print(f"Гостей: {len(guests)}")
          note: set(строка) разбирает имя на буквы и каждый раз заменяет множество.
          expectMistake: set-of-letters
        - code: |
            n = int(input())
            guests = set()
            for i in range(n):
                name = input()
                guests = set(name)
            print(f"Отметок: {n}")
            print(f"Гостей: {len(guests)}")
          note: То же через переменную name — set(name) даёт буквы имени.
          expectMistake: set-of-letters
        - code: |
            n = int(input())
            guests = set()
            for i in range(n):
                guests.append(input())
            print(f"Отметок: {n}")
            print(f"Гостей: {len(guests)}")
          note: append, как у списка, — у множества метод называется add.
          expectMistake: append-not-add
        - code: |
            n = int(input())
            for i in range(n):
                guests = set()
                guests.add(input())
            print(f"Отметок: {n}")
            print(f"Гостей: {len(guests)}")
          note: Множество создаётся заново на каждом шаге цикла.
          expectMistake: set-in-loop
        - code: |
            n = int(input())
            guests = set()
            for i in range(n):
                guests.add(input())
            print(f"Отметок: {n}")
            print(f"Гостей: {guests}")
          note: Вместо числа гостей напечатано само множество.
          expectMistake: print-set
        - code: |
            n = int(input())
            guests = set()
            for i in range(n):
                guests.add(input())
            print("Отметок: {n}")
            print("Гостей: {len(guests)}")
          note: Забыта буква f — фигурные скобки печатаются как текст.
          expectMistake: no-f
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            print(f"Отметок: {n}")
            print(f"Гостей: {len(names)}")
          note: Посчитана длина списка — повторы остались.
          expectMistake: list-not-set
      mistakes:
        - id: braces-dict
          when:
            errorIncludes: "'dict' object has no attribute 'add'"
          where: Строка, где создаётся пустое множество
          why: >-
            Пустые фигурные скобки `{}` создают не множество, а пустой **словарь**. У словаря нет
            метода `add`, поэтому программа остановилась на первом имени.
          try: Создай пустое множество через `set()` — с круглыми скобками.
          verify: "В «Примере 1» должно получиться `Отметок: 7` и `Гостей: 4`."
        - id: append-not-add
          when:
            errorIncludes: "'set' object has no attribute 'append'"
          why: >-
            Метод `append` есть у списка, а у множества его нет. Множество добавляет значение
            методом `add`.
          try: "Замени `append` на `add`: `guests.add(input())`."
          verify: "В «Примере 1» должно получиться `Гостей: 4`."
        - id: set-of-letters
          when:
            codeRegex: '\bset\(\s*input\(|^[ \t]*([A-Za-z_]\w*)\s*=\s*input\(\)[\s\S]*\bset\(\s*\1\s*\)'
          why: >-
            `set(строка)` превращает в множество саму строку, а строка — это набор букв. Из
            «Ира» получается `{'И', 'р', 'а'}`: в множество попадают буквы, а не имя.
          try: >-
            Создай пустое множество один раз до цикла, а в цикле клади в него имя целиком через
            `add`: `guests.add(input())`.
          verify: "В «Примере 1» должно получиться `Гостей: 4`."
        - id: set-in-loop
          when:
            codeRegex: '^[ \t]+[A-Za-z_]\w*\s*=\s*(?:set\(\s*\)|\{)'
            outputEquals: "Отметок: 7\nГостей: 1"
          where: Строка, где множество создаётся внутри цикла
          why: >-
            Множество создаётся заново на каждом шаге цикла, и прежние имена пропадают. К концу в
            нём остаётся только последнее имя.
          try: Перенеси создание множества выше цикла — оно должно появиться один раз.
          verify: "В «Примере 1» должно получиться `Гостей: 4`."
        - id: print-set
          when:
            outputIncludes: "{'"
          why: >-
            После «Гостей:» напечатано само множество — имена в фигурных скобках. А по условию
            нужно число: сколько в множестве разных имён.
          try: Выведи размер множества — `len(guests)`.
          verify: "В «Примере 1» должно получиться `Гостей: 4`."
        - id: no-f
          when:
            outputIncludes: "{"
          why: >-
            На экране видны фигурные скобки — значит, Python считает строку обычным текстом.
            Подставлять значения умеет только f-строка.
          try: 'Поставь букву `f` прямо перед открывающей кавычкой: `print(f"Гостей: {len(guests)}")`.'
          verify: "В «Примере 1» вместо скобок должны появиться числа: `Отметок: 7` и `Гостей: 4`."
        - id: list-not-set
          when:
            outputEquals: "Отметок: 7\nГостей: 7"
          why: >-
            Гостей получилось столько же, сколько отметок: каждая отметка посчитана как новый
            гость, повторы не отброшены.
          try: >-
            Складывай имена в множество — оно само отбросит повторы. Если имена уже лежат в
            списке, построй из него множество: `set(names)`.
          verify: "В «Примере 1» должно получиться `Гостей: 4`."
      afterPass: >-
        Множество само отбрасывает повторы: `add` уже знакомого имени ничего не меняет, и
        проверять каждое имя вручную не нужно. Если ты решал списком через `not in`, перепиши
        решение с `set()` и сравни: проверка повторов исчезнет из кода.
      skills: [sets-tuples]

  - id: practice-games
    type: exercise
    title: Практика 2
    exercise:
      id: m4-l5-e2
      kind: modify
      title: Во что сыграть вдвоём
      statement: |-
        Денис знакомит двух новичков. Каждый перечисляет игры, которые знает, через запятую с
        пробелом. Сейчас программа печатает только **число** общих игр. Измени её:

        - пусть она выводит сами общие игры, по одной в строке, **в том порядке, в каком их
          назвал первый новичок**;
        - если общих игр нет, выводит `Общих игр нет`.

        Например, первый знает `шахматы, го, мафия, нарды`, а второй — `мафия, домино, шахматы`.
        Нужный вывод:

        ```text
        шахматы
        мафия
        ```
      input: "Две строки — игры первого и второго новичка через `, ` (запятая и пробел)."
      output: Общие игры по одной в строке в порядке первого новичка или `Общих игр нет`.
      constraints:
        - Внутри одной строки игры не повторяются.
        - В каждой строке хотя бы одна игра.
      starterCode: |
        first = input().split(", ")
        second = input().split(", ")
        common = set(first) & set(second)
        print(f"Общих игр: {len(common)}")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "шахматы, го, мафия, нарды\nмафия, домино, шахматы\n"
          compare:
            ignoreSpaces: true
          expected: "шахматы\nмафия"
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "нарды, лото\nшашки, го\n"
          compare:
            ignoreSpaces: true
          expected: Общих игр нет
        - id: t3
          kind: io
          title: "Граничный случай: совпало всё, порядок разный"
          edge: true
          stdin: "шашки, домино, морской бой, крокодил\nкрокодил, морской бой, домино, шашки\n"
          compare:
            ignoreSpaces: true
          expected: "шашки\nдомино\nморской бой\nкрокодил"
        - id: t4
          kind: io
          title: "Граничный случай: по одной игре"
          edge: true
          stdin: "го\nго\n"
          compare:
            ignoreSpaces: true
          expected: го
        - id: t5
          kind: io
          title: "Граничный случай: похожие названия"
          edge: true
          stdin: "домино, го\nгомоку, лото\n"
          compare:
            ignoreSpaces: true
          expected: Общих игр нет
        - id: t6
          kind: io
          title: "Граничный случай: шесть общих игр"
          edge: true
          stdin: "лото, шашки, нарды, домино, мафия, го\nго, мафия, домино, нарды, шашки, лото\n"
          compare:
            ignoreSpaces: true
          expected: "лото\nшашки\nнарды\nдомино\nмафия\nго"
      criteria:
        - Выводятся только игры, которые знают оба новичка.
        - Порядок — как у первого новичка, независимо от порядка у второго.
        - "Названия сравниваются целиком: `го` и `гомоку` — разные игры."
        - Если общих игр нет, выводится `Общих игр нет`.
      hints:
        - >-
          Множество `common` уже знает, **какие** игры общие, но порядка не помнит. А какой список
          помнит как раз тот порядок, что нужен по условию?
        - |-
          На другом примере — вывести спелые фрукты в порядке списка:
          ```python
          fruits = ["яблоко", "груша", "слива"]
          ripe = {"слива", "яблоко"}
          for fruit in fruits:
              if fruit in ripe:
                  print(fruit)
          ```
          Выведется `яблоко`, потом `слива` — в порядке списка, а не множества.
        - |-
          Каркас:
          ```text
          first, second и common — как в стартовом коде
          если в common ничего нет:
              вывести "Общих игр нет"
          иначе:
              для каждой игры из first:
                  если игра есть в common — вывести её
          ```
      solution:
        code: |
          first = input().split(", ")
          second = input().split(", ")
          common = set(first) & set(second)
          if len(common) == 0:
              print("Общих игр нет")
          else:
              for game in first:
                  if game in common:
                      print(game)
        explanation: >-
          Множество `common` отвечает на вопрос «что общее», но порядка у него нет: если печатать
          его или идти по нему циклом, порядок игр не гарантирован. Поэтому цикл идёт по списку
          `first` — он хранит игры в том порядке, в каком их назвал первый новичок, — и для каждой
          игры спрашивает у множества `in`. Пустое `common` означает, что общих игр нет, — тогда
          печатается сообщение.
      altSolutions:
        - code: |
            first = input().split(", ")
            second = set(input().split(", "))
            found = False
            for game in first:
                if game in second:
                    print(game)
                    found = True
            if not found:
                print("Общих игр нет")
          note: Флаг found и множество игр второго новичка.
        - code: |
            first = []
            for part in input().split(","):
                first.append(part.strip())
            second = []
            for part in input().split(","):
                second.append(part.strip())
            common = set(first) & set(second)
            if len(common) == 0:
                print("Общих игр нет")
            for game in first:
                if game in common:
                    print(game)
          note: split(",") и strip() для каждого куска.
        - code: |
            first = input().split(", ")
            second = input().split(", ")
            count = 0
            for game in first:
                if game in second:
                    print(game)
                    count += 1
            if count == 0:
                print("Общих игр нет")
          note: Без множества — in по списку и счётчик.
      wrongSolutions:
        - code: |
            first = input().split(", ")
            second = input().split(", ")
            common = set(first) & set(second)
            print(f"Общих игр: {len(common)}")
          note: Стартовый код без изменений.
          expectMistake: not-changed
        - code: |
            first = input().split(", ")
            second = input().split(", ")
            common = set(first) & set(second)
            if len(common) == 0:
                print("Общих игр нет")
            else:
                print(common)
          note: Множество напечатано целиком.
          expectMistake: print-set
        - code: |
            first = input().split(", ")
            second = input().split(", ")
            common = set(first) & set(second)
            if common == {}:
                print("Общих игр нет")
            else:
                for game in first:
                    if game in common:
                        print(game)
          note: Пустое множество сравнивается с {} — это пустой словарь, условие не выполняется никогда.
          expectMistake: empty-braces
        - code: |
            first = input().split(", ")
            second = input().split(", ")
            common = set(first) & set(second)
            if len(common) == 0:
                print("Общих игр нет")
            else:
                for game in second:
                    if game in common:
                        print(game)
          note: Перебирается список второго новичка.
          expectMistake: order-second
        - code: |
            first = input().split(", ")
            second = input().split(", ")
            common = set(first) & set(second)
            if len(common) == 0:
                print("Общих игр нет")
            else:
                for game in common:
                    print(game)
          note: Цикл идёт по множеству common — порядок игр не гарантирован.
          expectMistake: loop-set
        - code: |
            first = input().split(", ")
            second = input()
            found = False
            for game in first:
                if game in second:
                    print(game)
                    found = True
            if not found:
                print("Общих игр нет")
          note: in по всей строке второго новичка ищет кусок текста — «го» находится внутри «гомоку».
          expectMistake: substring
        - code: |
            first = input().split(", ")
            second = input().split(", ")
            common = set(first) & set(second)
            for game in first:
                if game in common:
                    print(game)
            print("Общих игр нет")
          note: Сообщение печатается всегда, без условия.
          expectMistake: always-message
        - code: |
            first = input().split(", ")
            second = input().split(", ")
            common = set(first) & set(second)
            for game in first:
                if game in common:
                    print(game)
          note: Нет сообщения для случая без общих игр.
          expectMistake: no-message
      mistakes:
        - id: not-changed
          when:
            outputIncludes: "Общих игр: "
          why: Программа всё ещё печатает число общих игр, а нужны сами игры.
          try: >-
            Вместо строки с `len(common)` пройди циклом по играм и выведи те, что есть в `common`.
          verify: "В «Примере 1» должно получиться две строки: `шахматы` и `мафия`."
        - id: print-set
          when:
            outputIncludes: "{'"
          why: >-
            Напечатано само множество — в фигурных скобках и с кавычками. К тому же порядок
            элементов в множестве не гарантирован.
          try: >-
            Выводи игры по одной: иди по списку `first` и печатай только те, что есть в `common`.
          verify: "В «Примере 1» должно получиться две строки: `шахматы` и `мафия`."
        - id: empty-braces
          when:
            failedTest: t2
            codeRegex: '==\s*\{\s*\}'
          where: Условие с `{}`
          why: >-
            `{}` — это пустой **словарь**, а не пустое множество. Множество никогда не равно
            словарю, поэтому условие не выполняется даже тогда, когда общих игр нет, и программа
            молчит.
          try: >-
            Проверяй размер множества: `len(common) == 0`. Или сравнивай с пустым множеством —
            `set()`.
          verify: "В «Примере 2» должно получиться `Общих игр нет`."
        - id: loop-set
          when:
            codeRegex: '\bfor\s+[A-Za-z_]\w*\s+in\s+(?:common\b|set\()'
          where: Цикл по множеству
          why: >-
            Цикл идёт по множеству, а порядка у множества нет: игры выходят в том порядке, в
            каком их хранит множество. Иногда он случайно совпадает с примером, но на других
            данных — нет.
          try: Иди циклом по списку `first` и печатай игру, только если она есть в `common`.
          verify: >-
            Тест «Граничный случай: шесть общих игр» должен дать игры в порядке первого новичка,
            начиная с `лото`.
        - id: order-second
          when:
            outputEquals: "мафия\nшахматы"
          why: >-
            Игры верные, но в порядке второго новичка: цикл идёт по его списку. А по условию нужен
            порядок первого.
          try: Перебирай список `first` — он помнит нужный порядок.
          verify: "В «Примере 1» первой должна идти игра `шахматы`."
        - id: always-message
          when:
            outputIncludes: "\nОбщих игр нет"
          why: >-
            Общие игры нашлись, но в выводе всё равно есть `Общих игр нет`. Это сообщение нужно
            один раз и только тогда, когда общих игр нет совсем.
          try: >-
            Реши это до цикла: если `len(common) == 0`, выведи сообщение, а цикл с выводом игр
            поставь в ветку `else`.
          verify: "В «Примере 1» должно получиться ровно две строки: `шахматы` и `мафия`."
        - id: substring
          when:
            failedTest: t5
            outputEquals: го
          why: >-
            «го» нашлось внутри «гомоку»: `in` по строке ищет кусок текста, а не игру целиком.
          try: >-
            Сравнивай игры по списку или множеству из `split(", ")`, а не по всей строке второго
            новичка.
          verify: "Тест «Граничный случай: похожие названия» должен дать `Общих игр нет`."
        - id: no-message
          when:
            failedTest: t2
            outputEquals: ""
            codeRegex: '(?<![\s\S])(?![\s\S]*Общих игр нет)'
          why: >-
            Когда общих игр нет, цикл ничего не печатает, и программа молчит. А по условию нужно
            сообщение.
          try: Добавь проверку `len(common) == 0` и в этом случае выведи `Общих игр нет`.
          verify: "В «Примере 2» должно получиться `Общих игр нет`."
      afterPass: >-
        Множество ответило на вопрос «что общее», а список — на вопрос «в каком порядке». Такая
        пара встречается часто. Если захочешь, выведи ещё игры, которые знает только первый
        новичок: для этого есть разность `-`.
      skills: [sets-tuples, string-methods]

  - id: cells-predict
    type: predict
    title: Клетки на поле
    prompt: >-
      Перед последней практикой — разминка на кортежи. Как думаешь, что выведет программа?
    code: |-
      cells = [(0, 0), (1, 0), (0, 0)]
      x, y = cells[1]
      print(len(cells), len(set(cells)), x + y)
    options:
      - "3 2 1"
      - "3 3 1"
      - "2 2 1"
      - "3 2 0"
    answer: "3 2 1"
    explanation: >-
      Список хранит повторы, поэтому в нём 3 элемента. `set(cells)` сливает два одинаковых
      кортежа `(0, 0)` в один — остаётся 2 разные клетки. `cells[1]` — второй элемент, ведь счёт
      идёт с нуля: это `(1, 0)`. Распаковка кладёт 1 в `x` и 0 в `y`, их сумма — 1.
    coach: Кортежи с одинаковыми значениями для множества — одно и то же значение.

  - id: practice-robot
    type: exercise
    title: Практика 3
    exercise:
      id: m4-l5-e3
      kind: write
      title: Робот-газонокосилка
      statement: |-
        Газон разбит на клетки. Робот-газонокосилка стоит в клетке (0, 0) — она уже подстрижена.
        Робот получает строку команд, каждая буква — один шаг на соседнюю клетку:

        - `В` — вверх, y увеличивается на 1;
        - `Н` — вниз, y уменьшается на 1;
        - `П` — вправо, x увеличивается на 1;
        - `Л` — влево, x уменьшается на 1.

        Каждую клетку, где побывал робот, он подстригает. Сколько **разных** клеток подстрижено
        после всех команд, считая стартовую? Клетка, на которую робот вернулся, считается один
        раз. Например, для команд `ППВ` робот проходит клетки (0, 0), (1, 0), (2, 0), (2, 1):

        ```text
        Клеток: 4
        ```
      input: Одна строка — команды без пробелов. Строка может быть пустой.
      output: "Одна строка: `Клеток: <число разных клеток>`."
      constraints:
        - Команды — только заглавные русские буквы В, Н, П, Л.
        - Если команд нет, робот стоит на месте и подстрижена одна клетка.
        - Координаты могут стать отрицательными — газон большой.
      starterCode: |
        commands = input()
        # Проследи путь робота и посчитай разные клетки
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "ППВ\n"
          expected: "Клеток: 4"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: "Пример 2: туда-сюда"
          example: true
          stdin: "ПЛПЛ\n"
          expected: "Клеток: 2"
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: команд нет"
          edge: true
          stdin: "\n"
          expected: "Клеток: 1"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: квадрат с возвратом на старт"
          edge: true
          stdin: "ВПНЛ\n"
          expected: "Клеток: 4"
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: "Граничный случай: туда, обратно и вверх"
          edge: true
          stdin: "ППППЛЛЛЛВВ\n"
          expected: "Клеток: 7"
          compare:
            ignoreSpaces: true
        - id: t6
          kind: io
          title: "Граничный случай: влево и вниз от старта"
          edge: true
          stdin: "ЛЛНП\n"
          expected: "Клеток: 5"
          compare:
            ignoreSpaces: true
        - id: t7
          kind: io
          title: "Граничный случай: двузначные координаты"
          edge: true
          stdin: "ЛЛЛЛЛЛЛЛЛЛЛППППППППППВВВВВВВВВВ\n"
          expected: "Клеток: 22"
          compare:
            ignoreSpaces: true
      criteria:
        - Каждая клетка считается один раз, сколько бы раз робот на неё ни возвращался.
        - Стартовая клетка (0, 0) учтена.
        - Клетка запоминается после каждого шага, в том числе после последнего.
        - Отрицательные и двузначные координаты не путают клетки между собой.
        - "Выводится одна строка `Клеток: …`."
      hints:
        - >-
          Клетка — это пара чисел, а запомнить нужно все **разные** клетки, где побывал робот.
          Какая структура сама отбрасывает повторы и во что упаковать пару чисел, чтобы её можно
          было туда положить? Не забудь про клетку, с которой робот начинает.
        - |-
          На другом примере:
          ```python
          seen = set()
          seen.add((1, 2))
          seen.add((1, 2))
          seen.add((2, 1))
          print(len(seen))   # 2: (1, 2) и (2, 1) — разные клетки
          ```
        - |-
          Каркас:
          ```text
          x, y = 0, 0
          visited = множество, в котором уже есть клетка (0, 0)
          для каждой команды step из commands:
              если step == "В" — увеличить y на 1
              иначе если … — так же для Н, П и Л
              добавить в visited клетку (x, y)
          вывести "Клеток:" и len(visited)
          ```
      solution:
        code: |
          commands = input()
          x, y = 0, 0
          visited = {(0, 0)}
          for step in commands:
              if step == "В":
                  y = y + 1
              elif step == "Н":
                  y = y - 1
              elif step == "П":
                  x = x + 1
              elif step == "Л":
                  x = x - 1
              visited.add((x, y))
          print(f"Клеток: {len(visited)}")
        explanation: >-
          Координаты `x` и `y` меняются на каждом шаге, а после шага текущая клетка кладётся в
          множество кортежем `(x, y)`. Кортеж держит пару целиком, и его можно положить в
          множество, а список — нельзя. Множество само отбрасывает клетки, где робот уже был,
          поэтому `len(visited)` — число разных клеток. Стартовая клетка лежит в множестве с
          самого начала, поэтому при пустой строке команд ответ 1.
      altSolutions:
        - code: |
            commands = input()
            x = 0
            y = 0
            cells = [(0, 0)]
            for step in commands:
                if step == "В":
                    y += 1
                if step == "Н":
                    y -= 1
                if step == "П":
                    x += 1
                if step == "Л":
                    x -= 1
                if (x, y) not in cells:
                    cells.append((x, y))
            print("Клеток:", len(cells))
          note: Список кортежей без повторов через not in.
        - code: |
            commands = input()
            x, y = 0, 0
            visited = set()
            visited.add(f"{x},{y}")
            for step in commands:
                if step == "В":
                    y = y + 1
                elif step == "Н":
                    y = y - 1
                elif step == "П":
                    x = x + 1
                else:
                    x = x - 1
