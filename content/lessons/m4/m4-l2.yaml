id: m4-l2
module: m4
number: "4.2"
title: "Списки: создать, изменить, перебрать"
objective: >-
  Собирать значения в список, брать элементы по индексу, добавлять и удалять их и перебирать
  список в цикле; знать, как заменить элемент по индексу и как сделать копию списка.
minutes: [25, 30]
prerequisites: [m4-l1]
skills: [lists]
environment: python

story:
  title: Тетрадь тренера
  fictional: true
  text: >-
    Тренер по плаванию Лидия после каждой тренировки записывала в тетрадь, за сколько секунд
    каждый проплыл стометровку. Чтобы отметить тех, кто проплыл быстрее среднего, она сначала
    складывала все результаты на калькуляторе, а потом ещё раз шла по тетради с карандашом. Цикл с
    накопителем из прошлого модуля тут не помог бы: он помнит сумму, но забывает сами результаты.
    Список хранит все результаты сразу, и пройти по ним можно сколько угодно раз.

why: >-
  Когда значений много и их число заранее неизвестно, для каждого не заведёшь отдельную
  переменную. Список хранит их все под одним именем — например, все результаты заплыва, чтобы
  потом сравнить каждый со средним.

usedIn: >-
  Списки задач и покупок, корзина интернет-магазина, лента сообщений, показания датчиков,
  плейлисты, история действий для кнопки «Отменить» — везде, где значений много и они идут по
  порядку.

steps:
  - id: idea
    type: theory
    title: Список — много значений под одним именем
    body: |-
      **Список** — это значение, внутри которого по порядку лежат другие значения, **элементы**.
      Его записывают в квадратных скобках через запятую:

      ```python
      times = [104, 97, 101]     # три результата в секундах
      names = ["Аня", "Боря"]    # список строк
      empty = []                 # пустой список
      ```

      **Индексы — как у строк.** Счёт идёт с нуля: `times[0]` — это 104, `times[-1]` — последний
      элемент. `len(times)` — сколько элементов в списке, здесь 3. Последний индекс равен
      `len(times) - 1`, а `times[3]` остановит программу ошибкой
      `IndexError: list index out of range`. Срезы тоже работают: `times[:2]` — новый список
      `[104, 97]`.

      **Список можно менять** — этим он и отличается от строки:

      ```python
      times[1] = 99       # заменить элемент с индексом 1: [104, 99, 101]
      times.append(95)    # добавить в конец:              [104, 99, 101, 95]
      times.remove(104)   # удалить значение 104:          [99, 101, 95]
      ```

      Заменить по индексу можно только элемент, который уже есть: в пустом списке `empty[0] = 5`
      остановит программу ошибкой `IndexError`. Новые элементы добавляет `append`.

      `append` и `remove` — **методы** списка: действия, которые вызывают через точку после его
      имени, как `random.randint` вызывают через точку после имени модуля. `remove` удаляет только
      **первое** такое значение, а если значения в списке нет, останавливает программу ошибкой
      `ValueError`. Других методов у списка много, они описаны в документации; пока нам хватит этих
      двух, а ещё один, `copy`, встретится чуть ниже.

      **Есть ли значение в списке?** `97 in times` даёт `True` или `False`, а `97 not in times` —
      наоборот. Такие проверки удобно ставить в `if`.

      **Перебор.** В цикле `for t in times:` переменная `t` по очереди принимает каждое значение
      списка, от первого до последнего, — индексы не нужны. Так же `for ch in word` перебирал
      символы строки в прошлом уроке.

      **Функции для чисел**, как `len`, получают список в скобках: `sum(times)` — сумма,
      `min(times)` и `max(times)` — наименьший и наибольший элемент. Накопители из модуля про
      циклы тоже работают, но с этими функциями короче.

      **Список из ввода** собирают так: сначала пустой список, потом в цикле добавляют по одному
      значению.

      ```python
      count = int(input())
      times = []
      for i in range(count):
          times.append(int(input()))
      ```

      Две частые ошибки: считать элементы с единицы (первый — `times[0]`, а не `times[1]`) и думать,
      что `remove` удаляет все совпадения сразу.
    simpler: >-
      Список — пронумерованная тетрадь. Листы идут по порядку, и первый лист — нулевой. Лист можно
      переписать (`times[1] = 99`), подшить новый в конец (`append`) или вырвать первый лист с
      нужной записью (`remove`). Цикл `for` листает тетрадь от первого листа до последнего, а `in`
      отвечает на вопрос «есть ли такое в тетради?».
    coach: >-
      Список ты будешь использовать почти в каждой программе. Главное сегодня — собрать его из ввода
      и пройти по нему столько раз, сколько нужно.

  - id: results
    type: example
    title: Результаты заплыва
    body: >-
      Программа читает число пловцов и их результаты в секундах, складывает всё в список и
      показывает, что в нём лежит. Ввод уже задан: трое пловцов, 104, 97 и 101 секунда. Нажми
      «Запустить».
    code: |-
      count = int(input())
      times = []
      for i in range(count):
          times.append(int(input()))
      print(times)
      print("Первый:", times[0], "последний:", times[-1])
      print("Лучший:", min(times), "всего:", len(times))
    stdin: "3\n104\n97\n101\n"
    notes:
      - line: 2
        text: Пустой список создаётся один раз — до цикла.
      - line: 4
        text: >-
          На каждом шаге `int(input())` читает одно число, а `append` кладёт его в конец списка.
      - line: 5
        text: Так Python показывает список целиком — в квадратных скобках, через запятую.
      - line: 6
        text: "`times[0]` — первый элемент, `times[-1]` — последний, сколько бы их ни было."
      - line: 7
        text: >-
          `min` сам находит наименьшее время — самое быстрое. `len` считает элементы списка.
    tryIt: >-
      Допиши перед `print(times)` строку `times[1] = 99` и запусти: второй элемент заменится. Для
      проекта-викторины после этого модуля пригодится случайность: добавь в начало `import random`,
      а в конец — `print(random.choice(times))`, и при каждом запуске напечатается случайный
      элемент списка. А `random.shuffle(times)` перемешивает сам список — после него напечатай
      `times` ещё раз.
    coach: >-
      Цикл отработал три раза, но все три числа остались — список их помнит. Накопитель запомнил бы
      только сумму.

  - id: remove-predict
    type: predict
    title: Кого вычеркнули?
    prompt: >-
      В списке заплыва Аня по ошибке оказалась дважды. Лидия убирает лишнюю запись одной строкой.
      Как думаешь, что выведет программа?
    code: |-
      lanes = ["Аня", "Боря", "Аня", "Вика"]
      lanes.remove("Аня")
      print(lanes)
    options:
      - "['Боря', 'Вика']"
      - "['Боря', 'Аня', 'Вика']"
      - "['Аня', 'Боря', 'Вика']"
    answer: "['Боря', 'Аня', 'Вика']"
    explanation: >-
      `remove` удаляет только **первое** совпадение — Аню с индексом 0. Лишняя запись ушла, но
      вычеркнулась первая: все элементы после неё сдвинулись влево, и теперь Аня стартует второй,
      после Бори. Чтобы убрать обеих Ань, `remove` пришлось бы вызвать два раза. Кстати, строки
      внутри списка Python показывает в одинарных кавычках, даже если в коде стоят двойные.
    coach: >-
      Когда в списке есть одинаковые значения, спроси себя, какое из них нужно убрать. `remove`
      всегда убирает первое — подходит ли это тебе?

  - id: alias-predict
    type: predict
    title: Два имени — один список
    prompt: >-
      Лидия хотела сделать копию плана тренировки, чтобы дописать заминку только на сегодня. Как
      думаешь, что выведет программа?
    code: |-
      plan = ["разминка", "заплыв", "растяжка"]
      today = plan
      today.append("заминка")
      print(len(plan))
    options:
      - "3"
      - "4"
      - Ошибка
    answer: "4"
    explanation: >-
      `today = plan` не копирует список, а даёт тому же самому списку второе имя. Заминку добавили
      через `today` — и она появилась в `plan`, ведь это один и тот же список. Если нужна
      отдельная копия, пиши `today = plan.copy()`: тогда `append` изменит только копию, а в `plan`
      останутся три пункта.
    coach: >-
      Это одна из самых коварных ошибок: программа не падает, а данные незаметно меняются. Хочешь
      сохранить старую версию списка — делай `.copy()`.

  - id: practice-protocol
    type: exercise
    title: Практика 1
    exercise:
      id: m4-l2-e1
      kind: repeat
      title: Стартовый список
      statement: |-
        На тренировке пловцы стартуют по одному, в том порядке, в каком Лидия их записала. Перед
        стартом выяснилось, что один пловец не пришёл.

        Программа читает число пловцов, их имена — по одному в строке, а последней строкой — имя
        того, кто не пришёл. Сложи имена в список, как результаты в примере, вычеркни из него
        не пришедшего и выведи, кто стартует первым, кто последним и сколько всего стартует.
        Например, записаны Аня, Боря, Вика и Гена, а не пришла Вика:

        ```text
        Первый: Аня
        Последний: Гена
        Всего: 3
        ```
      input: >-
        Первая строка — число пловцов n (не меньше 2). Дальше n строк, в каждой одно имя; имена не
        повторяются. Последняя строка — имя того, кто не пришёл: оно точно есть среди этих n имён.
      output: "Три строки: `Первый: <имя>`, `Последний: <имя>`, `Всего: <сколько стартует>`."
      constraints:
        - Имён может быть сколько угодно — программа не должна зависеть от их числа.
        - Имя может состоять из нескольких слов.
      starterCode: |
        n = int(input())
        names = []
        # Прочитай n имён и сложи их в список names
        # Прочитай имя того, кто не пришёл, и вычеркни его из списка
        # Выведи первого, последнего и сколько всего стартует
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "4\nАня\nБоря\nВика\nГена\nВика\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Первый: Аня
            Последний: Гена
            Всего: 3
        - id: t2
          kind: io
          title: "Пример 2: не пришёл последний"
          example: true
          stdin: "5\nОлег\nКатя\nИра\nДима\nЛев\nЛев\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Первый: Олег
            Последний: Дима
            Всего: 4
        - id: t3
          kind: io
          title: "Граничный случай: не пришёл первый"
          edge: true
          stdin: "3\nЛев\nЯн\nЗоя\nЛев\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Первый: Ян
            Последний: Зоя
            Всего: 2
        - id: t4
          kind: io
          title: "Граничный случай: остался один пловец, имя из двух слов"
          edge: true
          stdin: "2\nАнна Мария\nЯн\nЯн\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Первый: Анна Мария
            Последний: Анна Мария
            Всего: 1
      criteria:
        - Все имена из ввода попадают в список по порядку.
        - Не пришедший вычеркнут из списка.
        - Первый и последний берутся из списка по индексу, количество — через `len` после вычёркивания.
        - Программа работает, когда не пришёл первый или последний и когда остался один пловец.
      hints:
        - >-
          Сначала собери все имена в список — точно так же, как результаты в примере «Результаты
          заплыва». Имя того, кто не пришёл, идёт после всех имён: прочитай его, когда список
          готов, и вычеркни методом, который удаляет значение. Потом подумай: какие индексы у
          первого и последнего элемента и сколько элементов осталось?
        - >-
          На другом списке: если `letters = ["а", "б", "в", "г"]`, то после `letters.remove("б")`
          в нём `["а", "в", "г"]`. Теперь `letters[0]` — это «а», `letters[-1]` — «г», а
          `len(letters)` равно 3, хотя букв было четыре.
        - |-
          Каркас:
          ```text
          for … in range(n):
              names.append(…)
          absent = …               # имя того, кто не пришёл, — после цикла
          names.…(absent)
          print(f"Первый: {names[…]}")
          print(f"Последний: {names[…]}")
          print(f"Всего: {len(…)}")
          ```
      solution:
        code: |
          n = int(input())
          names = []
          for i in range(n):
              names.append(input())
          absent = input()
          names.remove(absent)
          print(f"Первый: {names[0]}")
          print(f"Последний: {names[-1]}")
          print(f"Всего: {len(names)}")
        explanation: >-
          Цикл выполняется n раз, и каждый `input()` добавляет в конец списка следующее имя. Имя
          не пришедшего — следующая строка ввода, её читаем уже после цикла, а `remove` вычёркивает
          это имя из списка. Теперь в списке на одно имя меньше, чем n, поэтому последний —
          `names[-1]` (или `names[len(names) - 1]`), а не `names[n - 1]`, и количество — `len(names)`.
          Если остался один пловец, первый и последний совпадают.
      altSolutions:
        - code: |
            n = int(input())
            names = []
            while len(names) < n:
                names.append(input())
            names.remove(input())
            print(f"Первый: {names[0]}")
            print(f"Последний: {names[len(names) - 1]}")
            print(f"Всего: {n - 1}")
          note: Цикл while до нужной длины, remove сразу от input(), последний — через len(names) - 1, количество — n - 1.
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                name = input()
                names = names + [name]
            absent = input()
            names.remove(absent)
            print("Первый:", names[0])
            print("Последний:", names[-1])
            print("Всего:", len(names))
          note: Склейка списков вместо append, вывод через запятые.
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            names.remove(input())
            print("Первый: " + names[0])
            print("Последний: " + names[-1])
            print("Всего: " + str(len(names)))
          note: Склейка строк и str() вместо f-строки (попытка рецензента-ученика).
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            absent = input()
            starting = []
            for name in names:
                if name != absent:
                    starting.append(name)
            print(f"Первый: {starting[0]}")
            print(f"Последний: {starting[-1]}")
            print(f"Всего: {len(starting)}")
          note: Без remove — новый список из всех, кроме не пришедшего.
      wrongSolutions:
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            names.remove(input())
            print(f"Первый: {names[1]}")
            print(f"Последний: {names[-1]}")
            print(f"Всего: {len(names)}")
          note: Первый элемент взят по индексу 1 — счёт с единицы.
          expectMistake: count-from-one
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            names.remove(input())
            print(f"Первый: {names[0]}")
            print(f"Последний: {names[2]}")
            print(f"Всего: {len(names)}")
          note: Последний по индексу 2 — «в примере после вычёркивания три имени».
          expectMistake: fixed-index
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
                print(f"Первый: {names[0]}")
                print(f"Последний: {names[-1]}")
                print(f"Всего: {len(names)}")
            names.remove(input())
          note: Вывод внутри цикла чтения.
          expectMistake: print-in-loop
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            names.remove(input())
            print(f"Первый: {names[0]}")
            print(f"Последний: {names[-1]}")
            print(f"Всего: {n}")
          note: Количество взято из n — число записанных, а не стартующих.
          expectMistake: count-before-remove
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            print(f"Первый: {names[0]}")
            print(f"Последний: {names[-1]}")
            print(f"Всего: {len(names)}")
            names.remove(input())
          note: Вывод стоит до вычёркивания.
          expectMistake: count-before-remove
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            absent = input()
            print(f"Первый: {names[0]}")
            print(f"Последний: {names[-1]}")
            print(f"Всего: {len(names)}")
          note: Имя не пришедшего прочитано, но remove забыт.
          expectMistake: no-remove
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            names.remove(input())
            print(f"Первый: {names[0]}")
            print(f"Последний: {names[-1]}")
            print(f"Всего: {len(names) - 1}")
          note: Вместо количества — последний индекс.
          expectMistake: count-off
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names[i] = input()
            names.remove(input())
            print(f"Первый: {names[0]}")
            print(f"Последний: {names[-1]}")
            print(f"Всего: {len(names)}")
          note: Запись по индексу в пустой список.
          expectMistake: assign-to-empty
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names = input()
            names.remove(input())
            print(f"Первый: {names[0]}")
            print(f"Последний: {names[-1]}")
            print(f"Всего: {len(names)}")
          note: names = input() — список заменяется строкой.
          expectMistake: str-not-list
        - code: |
            n = int(input())
            names = []
            for i in range(n):
                names.append(input())
            names.remove(input())
            print(f"Первый: {names[0]}")
            print(f"Последний: {names[-1]}")
            print(f"Всего: {len(n)}")
          note: len() от числа.
          expectMistake: len-of-number
        - code: |
            n = int(input())
            names = []
