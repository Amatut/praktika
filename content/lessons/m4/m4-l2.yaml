      mistakes:
        - id: text-times
          when:
            errorIncludes: "'int' and 'str'"
          where: Строка, где результат читается и добавляется в список
          why: >-
            Результаты попали в список строками: `input()` всегда возвращает строку, а `sum`
            складывает только числа — внутри неё и спрятан тот `+`, о котором говорит сообщение. В
            «Практике 1» имена так и оставались строками, а здесь нужны числа.
          try: Переводи каждый результат в число сразу при чтении — `times.append(int(input()))`.
          verify: "Ошибка должна исчезнуть, а «Пример 1» — вывести 97 и 99."
        - id: range-of-list
          when:
            errorIncludes: "'list' object cannot be interpreted as an integer"
          why: >-
            В `range` передаётся число шагов, а здесь — сам список. По списку идут напрямую, без
            `range`.
          try: "Пиши `for t in times:` — на каждом шаге в `t` будет очередной результат."
          verify: "Ошибка должна исчезнуть, а «Пример 1» — вывести 97 и 99."
        - id: float-input
          when:
            codeRegex: 'float\s*\('
            outputIncludes: ".0"
          where: Строка, где результат читается через `float()`
          why: >-
            Результаты прочитаны через `float()`, поэтому печатаются с дробной частью: `97.0`
            вместо `97`. По условию результаты — целые секунды. Дробным бывает только среднее, и
            деление `/` сделает его дробным само.
          try: Читай результаты через `int(input())`, а среднее не округляй.
          verify: "«Пример 1» должен вывести 97 и 99."
        - id: skip-first
          when:
            failedTest: t3
            outputEquals: Нет
            codeRegex: 'range\(\s*1\s*,\s*(?:\w+|len\(\s*\w+\s*\))\s*\)|\[\s*1\s*:\s*\]'
          where: Строка со вторым циклом
          why: >-
            Первый результат (100) ни с чем не сравнивается: перебор начинается со второго
            элемента. Индексы списка считаются с нуля, а `range(1, n)` или срез `[1:]` пропускают
            элемент с индексом 0.
          try: "Перебирай список с начала — `for t in times:` или индексы из `range(n)`."
          verify: В граничном случае «ранний результат быстрее среднего» должно появиться 100.
        - id: running-average
          when:
            failedTest: t3
            outputEquals: Нет
          why: >-
            Результаты сравниваются со средним, которое ещё не досчитано. Пока прочитан только
            первый результат (100), он сам и есть «среднее», а быстрее себя он быть не может.
            Настоящее среднее (110) известно только после всех результатов.
          try: >-
            Сначала сохрани все результаты в список и посчитай среднее. Потом вторым циклом пройди
            по списку и сравни с ним каждый результат.
          verify: В граничном случае «ранний результат быстрее среднего» должно появиться 100.
        - id: rounded-average
          when:
            failedTest: t6
            outputEquals: Нет
          where: Строка, где считается среднее
          why: >-
            Среднее получилось целым, хотя должно быть дробным: для 101, 101 и 102 это примерно
            101.33. А `//` делит нацело, `int()` и `round()` отбрасывают или округляют дробную
            часть, и среднее становится 101. С таким средним результат 101 перестаёт быть «меньше
            среднего», и программа его не выводит.
          try: Считай среднее обычным делением `/` и ничего не округляй.
          verify: Граничный случай «среднее дробное» должен вывести 101 два раза.
        - id: equal-average
          when:
            outputEquals: |-
              101
              96
            codeRegex: '<=|>='
          why: >-
            Результат 101 равен среднему (303 / 3 = 101), а нужны только те, кто быстрее, — строго
            меньше среднего. Знак `<=` пропускает и равных.
          try: Сравнивай строгим знаком `<`.
          verify: «Пример 2» должен вывести только 96.
        - id: flag-reset
          when:
            codeRegex: '^[ \t]+\w+\s*=\s*False\s*$'
            outputIncludes: "\nНет"
          where: Строка, где флаг получает False
          why: >-
            Флаг сбрасывается на каждом шаге цикла: `… = False` стоит внутри цикла, с отступом. К
            концу он помнит только последний результат — и если последний не быстрее среднего,
            после найденных печатается ещё и «Нет».
          try: Поставь `found = False` один раз — до цикла, без отступа.
          verify: "«Пример 2» должен вывести только 96."
        - id: checks-last
          when:
            outputEquals: |-
              96
              Нет
          why: >-
            «Нет» напечаталось, хотя 96 уже выведено: после цикла проверяется только последний
            результат (106) — переменная цикла помнит лишь его. А «Нет» зависит от всех
            результатов: нашёлся ли хоть один быстрее среднего.
          try: >-
            Заведи до цикла флаг `found = False`, ставь `found = True`, когда печатаешь результат, и
            выводи «Нет», только если флаг так и остался `False`.
          verify: "«Пример 2» должен вывести только 96."
        - id: always-no
          when:
            outputEquals: |-
              97
              99
              Нет
          why: >-
            «Нет» печатается, даже когда быстрые нашлись. Так бывает, если `print("Нет")` стоит
            после цикла без проверки, если флаг в цикле так и не становится `True` или если условие
            после цикла перевёрнуто. А «Нет» нужен, только если не напечатано ни одного результата.
          try: >-
            Заведи до цикла флаг `found = False`, ставь `found = True` рядом с `print(t)` и выводи
            «Нет» после цикла, только если флаг так и остался `False`.
          verify: «Пример 1» должен вывести только 97 и 99.
        - id: else-in-loop
          when:
            failedTest: t1
            outputIncludes: Нет
          why: >-
            «Нет» печатается внутри цикла — для каждого результата, который не быстрее среднего. А
            по условию «Нет» нужен один раз и только если подходящих результатов не нашлось вовсе.
            Это становится известно только после цикла.
          try: >-
            Заведи до цикла флаг `found = False`, ставь `found = True`, когда печатаешь результат, а
            после цикла, без отступа, выведи «Нет», если флаг так и остался `False`.
          verify: «Пример 1» должен вывести только 97 и 99.
        - id: no-message
          when:
            failedTest: t4
            outputEquals: ""
          why: Когда быстрее среднего никого нет, программа ничего не выводит, а по условию нужно «Нет».
          try: >-
            Запомни во флаге, напечатал ли цикл хоть один результат, и после цикла выведи «Нет»,
            если не напечатал. Если флаг уже есть, проверь, что `found = True` стоит под `if`, рядом
            с `print(t)`: иначе он становится `True` на каждом шаге.
          verify: Граничный случай «все проплыли одинаково» должен вывести «Нет».
        - id: not-mean
          when:
            failedTest: t7
            outputIncludes: "112"
          where: Строка, где считается среднее
          why: >-
            Порог получился больше настоящего среднего: 100 + 101 + 112 + 113 + 130 = 556, делим на
            5 — среднее 111.2, значит, 112 и 113 медленнее среднего. Похоже, среднее посчитано не по
            всем результатам — например, как середина между лучшим и худшим.
          try: Среднее — сумма всех результатов, делённая на их количество, `sum(times) / len(times)`.
          verify: В граничном случае «один отстающий тянет среднее вверх» должны остаться 100 и 101.
      afterPass: >-
        Два прохода по одному списку — то, ради чего списки и нужны: сначала узнали среднее, потом
        сравнили с ним каждый результат. Без дробей тоже можно: `t < sum(times) / n` — то же
        самое, что `t * n < sum(times)`, а там только целые числа.
      skills: [lists, accumulators, conditions]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Список хранит много значений по порядку: `[]` — пустой список, `append` добавляет в конец, индексы считаются с нуля, `len` — число элементов."
      - "Список можно менять: `times[1] = 99` заменяет элемент, который уже есть, `remove` удаляет первое совпадение. Строку по индексу изменить нельзя."
      - "`x in список` проверяет, есть ли значение; `for x in список` перебирает все значения — и так сколько угодно раз."
      - "`b = a` не копирует список, а даёт ему второе имя; отдельная копия — `a.copy()`."
    question: >-
      В программе написано `backup = scores`, а потом `scores.append(10)`. Что стало с `backup`?
      Как сохранить старую версию списка?
    answer: >-
      В `backup` тоже появилось 10: `backup` и `scores` — два имени одного и того же списка. Чтобы
      старая версия сохранилась, нужна копия, сделанная до изменения: `backup = scores.copy()`.
