            n = int(input())
            times = []
            total = 0
            for i in range(n):
                t = int(input())
                times.append(t)
                total += t
            count = 0
            for t in times:
                if t * n < total:
                    print(t)
                    count += 1
            if count == 0:
                print("Нет")
          note: Сумма накопителем, сравнение без деления (t * n < total), счётчик вместо флага.
