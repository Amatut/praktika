          verify: "В «Примере 1» должно получиться «Всего: 3»."
        - id: no-remove
          when:
            outputIncludes: "Последний: Гена\nВсего: 4"
          why: >-
            В списке по-прежнему четыре имени: Вика не пришла, но из списка не вычеркнута. Её имя —
            последняя строка ввода, после всех имён.
          try: >-
            После цикла прочитай имя того, кто не пришёл, и вычеркни его из списка методом
            `remove`.
          verify: "В «Примере 1» должно получиться «Всего: 3»."
        - id: count-off
          when:
            outputIncludes: "Последний: Гена\nВсего: 2"
          where: Строка, которая печатает «Всего»
          why: >-
            Все стартующие на месте — последним стоит Гена, — а количество на одно меньше. Похоже,
            выводится последний индекс `len(names) - 1`. Индексы идут с нуля, поэтому последний из
            них на единицу меньше длины.
          try: Количество элементов — это сама длина списка, `len(names)`.
          verify: "В «Примере 1» последней строкой должно быть «Всего: 3»."
        - id: assign-to-empty
          when:
            errorIncludes: assignment index
          where: Строка, где имя записывается в список
          why: >-
            По индексу можно только заменить элемент, который в списке уже есть. Список `names`
            пока пустой, места с номером 0 в нём ещё нет — поэтому `names[i] = …` останавливает
            программу ошибкой `IndexError: list assignment index out of range`.
          try: Новое имя добавляй в конец списка — `names.append(input())`, как результаты в примере.
          verify: "Ошибка должна исчезнуть, а в «Примере 1» — «Первый: Аня» и «Всего: 3»."
        - id: str-not-list
          when:
            errorIncludes: "'str' object has no attribute"
          where: Строка внутри цикла, где читается имя
          why: >-
            `names = input()` не добавляет имя в список, а заменяет весь список строкой — последним
            прочитанным именем. У строки нет метода `remove`, поэтому программа и остановилась.
          try: Добавляй каждое имя в конец списка — `names.append(input())`.
          verify: "Ошибка должна исчезнуть, а в «Примере 1» — «Всего: 3»."
        - id: len-of-number
          when:
            errorIncludes: has no len
          why: >-
            `len()` считает элементы списка или символы строки, а `n` — число, у него длины нет. К
            тому же n — сколько пловцов записано, а нужно, сколько стартует.
          try: Выведи `len(names)` — длину списка после вычёркивания.
          verify: "В «Примере 1» должно получиться «Всего: 3»."
        - id: one-short
          when:
            errorType: ValueError
            codeRegex: 'range\(\s*1\s*,\s*n\s*\)|range\(\s*n\s*-\s*1\s*\)'
          where: Строка с циклом
          why: >-
            Цикл прочитал на одно имя меньше: `range(1, n)` выполняется n − 1 раз, ведь правая
            граница в `range` не входит. Последнее имя, Гена, в список не попало, а прочиталось как
            имя не пришедшего — и `remove` не нашёл его в списке, отсюда `ValueError`.
          try: Чтобы цикл выполнился ровно n раз, пиши `range(n)` — или `range(1, n + 1)`.
          verify: "Ошибка должна исчезнуть, а в «Примере 1» — «Последний: Гена» и «Всего: 3»."
        - id: list-reset
          when:
            errorType: ValueError
            codeRegex: '^[ \t]+names\s*=\s*\[\s*\]'
          where: Строка, где создаётся пустой список
          why: >-
            Список создаётся заново на каждом шаге цикла: `names = []` стоит внутри цикла, с
            отступом. К концу в нём остаётся только последнее имя, и `remove` не находит там Вику —
            отсюда `ValueError`.
          try: Создай пустой список один раз — до цикла, без отступа.
          verify: "Ошибка должна исчезнуть, а в «Примере 1» — «Всего: 3»."
        - id: fill-empty
          when:
            errorType: ValueError
            codeRegex: 'for\s+\w+\s+in\s+names\s*:'
          where: Строка с циклом
          why: >-
            Список `names` остался пустым: цикл идёт по самому списку, а в пустом списке перебирать
            нечего — цикл не выполнился ни разу. Поэтому `remove` ничего в нём не находит и
            останавливает программу ошибкой `ValueError`.
          try: Повторяй чтение n раз — `for i in range(n):`, как в примере «Результаты заплыва».
          verify: "Ошибка должна исчезнуть, а в «Примере 1» — «Всего: 3»."
        - id: no-append
          when:
            errorType: ValueError
            codeRegex: '(?<![\s\S])(?![\s\S]*(?:\.append\(|\+\s*\[|\+=\s*\[))'
          why: >-
            Имена читаются, но в список не попадают: в коде нет `append`, и `names` остаётся
            пустым. Поэтому `remove` не находит в нём имя и останавливает программу ошибкой
            `ValueError`.
          try: Внутри цикла, с отступом, добавляй каждое прочитанное имя в список — `names.append(…)`.
          verify: "Ошибка должна исчезнуть, а в «Примере 1» — «Всего: 3»."
        - id: remove-missing
          when:
            errorType: ValueError
          why: >-
            `remove` не нашёл в списке имя, которое ты вычёркиваешь, и остановил программу ошибкой
            `ValueError`. Значит, к этой строке в списке лежат не те имена или в переменную попала
            не та строка ввода. Порядок ввода такой: число, n имён и только последней строкой — имя
            того, кто не пришёл.
          try: >-
            Перед `remove` временно добавь `print(names)` и напечатай имя, которое вычёркиваешь, —
            сразу будет видно, чего не хватает. Имена добавляй в список внутри цикла, а имя не
            пришедшего читай после цикла.
          verify: "Ошибка должна исчезнуть, а в «Примере 1» — «Всего: 3»."
        - id: index-out
          when:
            errorType: IndexError
          why: >-
            `IndexError: list index out of range` — такого индекса в списке нет. После `remove` в
            списке на одно имя меньше, чем n: в «Примере 1» остались три имени с индексами 0, 1 и
            2, поэтому и `names[n - 1]` (это `names[3]`), и `names[len(names)]` — уже за пределами.
            А если программа остановилась уже на `names[0]`, список пуст: проверь, что `append`
            стоит внутри цикла.
          try: >-
            Первый элемент — `names[0]`, последний — `names[-1]` или `names[len(names) - 1]`: так
            индекс считается по списку, каким он стал после `remove`.
          verify: "Ошибка должна исчезнуть, а в «Примере 1» второй строкой — «Последний: Гена»."
      afterPass: >-
        Список собран, лишний вычеркнут, а первый и последний достаются по индексу при любой длине.
        Заметь: после `remove` в списке уже не n имён, поэтому `len(names)` и `names[-1]` надёжнее
        формул с n — они всегда считают по тому, что в списке есть сейчас.
      skills: [lists, for-range]

  - id: practice-seeds
    type: exercise
    title: Практика 2
    exercise:
      id: m4-l2-e2
      kind: modify
      title: Обмен семенами
      statement: |-
        Садовый клуб устраивает обмен семенами: каждый участник пишет, какие семена принёс, и
        названия повторяются. Сейчас программа записывает в список для стенда всё подряд, и
        «огурец» на стенде встречается дважды.

        Измени программу: добавляй название в список, только если его там ещё нет, а в конце
        выведи, сколько было повторов. Повтор — каждая запись, название которой уже есть в
        списке: если укроп принесли трое, повторов два. Для примера 1 вывод такой:

        ```text
        томат
        огурец
        укроп
        редис
        Повторов: 1
        ```

        Названия сравниваются точно: «Томат» и «томат» для программы — разные записи. Как с этим
        справиться, узнаешь в следующем уроке, а в тестах все названия написаны маленькими буквами.
      input: Первая строка — число записей n (может быть 0). Дальше n строк, в каждой название.
      output: >-
        Названия без повторов в порядке первого появления, по одному в строке, и последней строкой —
        `Повторов: <число>`.
      constraints:
        - Порядок названий — как во вводе.
        - Строка «Повторов» выводится всегда, даже если повторов нет.
      starterCode: |
        n = int(input())
        seeds = []
        for i in range(n):
            item = input()
            seeds.append(item)
        for item in seeds:
            print(item)
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "5\nтомат\nогурец\nукроп\nогурец\nредис\n"
          compare:
            ignoreSpaces: true
          expected: |-
            томат
            огурец
            укроп
            редис
            Повторов: 1
        - id: t2
          kind: io
          title: "Пример 2: повторов нет"
          example: true
          stdin: "3\nморковь\nсвёкла\nлук\n"
          compare:
            ignoreSpaces: true
          expected: |-
            морковь
            свёкла
            лук
            Повторов: 0
        - id: t3
          kind: io
          title: "Граничный случай: все принесли одно и то же"
          edge: true
          stdin: "3\nукроп\nукроп\nукроп\n"
          compare:
            ignoreSpaces: true
          expected: |-
            укроп
            Повторов: 2
        - id: t4
          kind: io
          title: "Граничный случай: записей нет"
          edge: true
          stdin: "0\n"
          compare:
            ignoreSpaces: true
          expected: "Повторов: 0"
        - id: t5
          kind: io
          title: "Граничный случай: повторы вперемешку"
          edge: true
          stdin: "6\nогурец\nтомат\nогурец\nтомат\nогурец\nредис\n"
          compare:
            ignoreSpaces: true
          expected: |-
            огурец
            томат
            редис
            Повторов: 3
      criteria:
        - Каждое название попадает в список один раз — при первом появлении.
        - Порядок названий такой же, как во вводе.
        - Повтором считается каждая запись, название которой уже есть в списке.
        - Строка «Повторов» выводится один раз, последней, — и тогда, когда записей нет совсем.
      hints:
        - >-
          Прежде чем добавить название в список, программе нужно кое-что проверить. Что именно и в
          каком списке? И в какой момент понятно, что случился повтор?
        - >-
          На другом примере: `if "соль" not in shopping:` и под ним с отступом
          `shopping.append("соль")` — соль попадёт в список покупок, только если её там ещё нет.
          Если выполнить эти строки ещё раз, условие окажется ложным и `append` не сработает. А
          если у `if` есть ветка `else`, выполнится она.
        - |-
          Каркас:
          ```text
          repeats = 0              # до цикла
          for …:
              item = input()
              if item not in seeds:
                  …                # новое название — добавить
              else:
                  …                # повтор — посчитать
          # цикл печати остаётся как был
          print(f"Повторов: {…}")  # после цикла печати, без отступа
          ```
      solution:
        code: |
          n = int(input())
          seeds = []
          repeats = 0
          for i in range(n):
              item = input()
              if item not in seeds:
                  seeds.append(item)
              else:
                  repeats += 1
          for item in seeds:
              print(item)
          print(f"Повторов: {repeats}")
        explanation: >-
          Проверка `item not in seeds` стоит до `append`: если такого названия ещё нет, оно
          добавляется, а если есть — вместо добавления растёт счётчик повторов. Итог печатается
          один раз, после цикла печати. Когда записей нет, оба цикла не выполняются ни разу, и
          программа выводит «Повторов: 0».
      altSolutions:
        - code: |
            n = int(input())
            seeds = []
            for i in range(n):
                item = input()
                if item in seeds:
                    continue
                seeds.append(item)
            for item in seeds:
                print(item)
            print(f"Повторов: {n - len(seeds)}")
          note: Повтор пропускается через continue, а повторов — все записи минус оставшиеся.
        - code: |
            n = int(input())
            seeds = []
            repeats = 0
            for i in range(n):
                item = input()
                if item in seeds:
                    repeats = repeats + 1
                else:
                    seeds.append(item)
            for item in seeds:
                print(item)
            print("Повторов:", repeats)
          note: Проверка через in, счётчик без +=, вывод через запятую.
        - code: |
            n = int(input())
            seeds = []
            repeats = 0
            for i in range(n):
                item = input()
                if item not in seeds:
                    seeds.append(item)
                    print(item)
                else:
                    repeats += 1
            print(f"Повторов: {repeats}")
          note: Новое название печатается сразу при добавлении — второй цикл не нужен.
        - code: |
            n = int(input())
            seeds = []
            for i in range(n):
                item = input()
                seeds.append(item)
            shown = []
            repeats = 0
            for item in seeds:
                if item not in shown:
                    print(item)
                    shown.append(item)
                else:
                    repeats += 1
            print(f"Повторов: {repeats}")
          note: Стартовый список не тронут, повторы отсеиваются при печати через второй список (попытка рецензента-ученика).
        - code: |
            n = int(input())
            seeds = []
            repeats = 0
            for i in range(n):
                item = input()
                if item in seeds:
                    repeats += 1
                if item not in seeds:
                    seeds.append(item)
            for item in seeds:
                print(item)
            print(f"Повторов: {repeats}")
