          verify: "В «Примере 1» должно быть ровно три строки, последняя — «Всего: 3»."
        - id: count-before-remove
          when:
            outputIncludes: "Последний: Гена\nВсего: 4"
            codeIncludes: remove(
          where: Строка, которая печатает «Всего»
          why: >-
            На экране «Всего: 4», а стартуют трое: Вика не пришла. Похоже, количество взято из n —
            это число записанных, а не стартующих, — или посчитано раньше, чем `remove` вычеркнул
            Вику.
          try: >-
