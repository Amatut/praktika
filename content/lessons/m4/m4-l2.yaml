            fast = []
            for t in times:
                if t < average:
                    fast.append(t)
            if len(fast) == 0:
                print("Нет")
            for t in fast:
                print(t)
          note: Быстрые собираются во второй список, «Нет» — по его длине.
        - code: |
            n = int(input())
            times = []
            i = 0
            while i < n:
                times.append(int(input()))
                i += 1
            found = False
            for t in times:
                if t < sum(times) / len(times):
                    print(t)
                    found = True
            if found == False:
                print("Нет")
          note: Чтение через while, среднее считается прямо в условии, флаг сравнивается с False.
        - code: |
