      mistakes:
        - id: no-check
          when:
            outputEquals: |-
              томат
              огурец
              укроп
              огурец
              редис
          why: >-
            Программа пока записывает всё подряд: «огурец» попал в список дважды. Перед `append`
            нет проверки, есть ли уже такое название в списке.
          try: >-
            Добавляй название, только если его ещё нет в списке, — проверь это через `not in`
            перед `append`.
          verify: "В «Примере 1» «огурец» должен встретиться один раз, а в конце — «Повторов: 1»."
        - id: diff-too-early
          when:
            outputIncludes: "Повторов: 5"
            codeRegex: 'n\s*-\s*len\('
          where: Строка, где считается `n - len(seeds)`
          why: >-
            Повторов получилось столько же, сколько всего записей. `n - len(seeds)` посчитано
            раньше, чем список собран: в этот момент он пуст, `len(seeds)` равно 0, и в переменную
            попадает просто n. Потом список растёт, но переменная сама не пересчитывается.
          try: Считай `n - len(seeds)` после цикла чтения, когда в списке уже все названия без повторов.
          verify: "В «Примере 1» должно получиться «Повторов: 1»."
        - id: swapped-in
          when:
            outputEquals: "Повторов: 5"
          where: Строка с проверкой `in`
          why: >-
            Список остался пустым, и каждая запись посчитана как повтор. Похоже, `in` и `not in`
            перепутаны: `append` стоит под `if item in seeds`, а в пустом списке ничего нет —
            условие ложно с первой записи, и `append` не выполняется ни разу.
          try: >-
            Добавляй, когда названия ещё нет: `if item not in seeds:` — `append`, а в ветке `else` —
            повтор.
          verify: "«Пример 1» должен вывести четыре названия и «Повторов: 1»."
        - id: check-after-append
          when:
            outputIncludes: "огурец\nредис\nПовторов: 5"
          why: >-
            Повторов насчиталось столько же, сколько всего записей, а «огурец» в списке дважды.
            Проверка `in` стоит после `append`: к этому моменту название уже лежит в списке, и
            условие верно всегда.
          try: >-
            Проверяй до добавления: сначала `if item not in seeds:`, и только в этой ветке —
            `append`. В ветке `else` считай повтор.
          verify: "В «Примере 1» должно получиться «Повторов: 1», а «огурец» — встретиться один раз."
        - id: count-every
          when:
            outputIncludes: "укроп\nредис\nПовторов: 5"
          why: >-
            Список уже без повторов, а повторов насчиталось столько же, сколько всего записей:
            счётчик растёт на каждом шаге цикла. Похоже, `repeats += 1` стоит прямо в цикле, а не в
            ветке `else`.
          try: >-
            Сдвинь `repeats += 1` под `else:`, с отступом, — счётчик должен расти, только когда
            название уже есть в списке.
          verify: "В «Примере 1» должно получиться «Повторов: 1»."
        - id: last-only
          when:
            outputIncludes: "укроп\nогурец"
            codeRegex: '\[\s*-1\s*\]'
          why: >-
            Второй «огурец» снова попал в список: проверка сравнивает название только с последним
            добавленным (`seeds[-1]`). Перед вторым «огурцом» последним был «укроп», а первый
            «огурец» лежит раньше — такая проверка его не видит.
          try: Проверяй весь список сразу — `if item not in seeds:`.
          verify: В «Примере 1» «огурец» должен встретиться один раз.
        - id: still-appends
          when:
            outputIncludes: "огурец\nукроп\nогурец"
          why: >-
            «Огурец» по-прежнему выводится дважды. Так бывает, если `append` выполняется для
            каждого названия — проверки перед ним нет или она на него не влияет. Или если
            печатается не список без повторов, а каждое прочитанное название: `print` стоит в
            цикле чтения до проверки.
          try: >-
            `append` — только в ветке «такого названия ещё нет», с отступом под `if`; в ветке `else`
            только считай повтор. Печатай список `seeds` после цикла — или название в той же ветке,
            где `append`.
          verify: В «Примере 1» «огурец» должен встретиться один раз.
        - id: no-count
          when:
            outputEquals: |-
              томат
              огурец
              укроп
              редис
          why: "Список уже без повторов, но строки «Повторов: …» в выводе нет."
          try: >-
            Заведи счётчик до цикла, увеличивай его, когда название уже есть в списке, и выведи
            после цикла печати.
          verify: "В «Примере 1» последней строкой должно быть «Повторов: 1»."
        - id: counter-reset
          when:
            outputIncludes: "Повторов: 0"
            codeRegex: '^[ \t]+\w+\s*=\s*0\s*$'
          why: >-
            Счётчик повторов обнуляется на каждом шаге: строка `… = 0` стоит внутри цикла, с
            отступом. Поэтому в конце в нём остаётся только то, что насчиталось на последнем шаге, —
            а последним в примере шёл новый «редис».
          try: Перенеси обнуление счётчика выше цикла, без отступа, — счётчик заводят один раз.
          verify: "В «Примере 1» должно получиться «Повторов: 1»."
        - id: count-in-loop
          when:
            outputIncludes: "томат\nПовторов"
          why: >-
            Строка «Повторов» печатается после каждого названия: её `print` стоит внутри цикла
            печати, с отступом.
          try: Убери отступ у этого `print`, чтобы он выполнился один раз — после цикла.
          verify: "В «Примере 1» строка «Повторов: 1» должна быть одна и последняя."
        - id: repeat-names
          when:
            outputEquals: |-
              укроп
              Повторов: 1
          why: >-
            Укроп принесли трое: первая запись попала в список, а две другие — повторы, значит,
            «Повторов: 2». Похоже, ты считаешь, сколько названий повторилось, а нужно — сколько было
            лишних записей.
          try: >-
            Увеличивай счётчик каждый раз, когда название уже есть в списке, — без дополнительных
            проверок.
          verify: "В граничном случае «все принесли одно и то же» должно получиться «Повторов: 2»."
      afterPass: >-
        Список остался без повторов, а повторы посчитаны. Кстати, отдельный счётчик можно и не
        заводить: повторов ровно `n - len(seeds)` — все записи минус те, что остались в списке.
      skills: [lists, conditions, accumulators]

  - id: practice-average
    type: exercise
    title: Практика 3
    exercise:
      id: m4-l2-e3
      kind: write
      title: Быстрее среднего
      statement: |-
        Лидия хочет отметить тех, кто проплыл стометровку быстрее среднего по группе. Среднее —
        это сумма всех результатов, делённая на их количество. Меньше секунд — значит быстрее.

        Программа читает число пловцов и их результаты в секундах. Выведи результаты, которые
        **строго меньше** среднего, — в том же порядке, что во вводе, по одному в строке. Если
        таких нет, выведи `Нет`.

        Например, для результатов 104, 97, 110 и 99 среднее — 102.5, и вывод такой:

        ```text
        97
        99
        ```
      input: >-
        Первая строка — число пловцов n (не меньше 1). Дальше n строк, в каждой результат — целое
        число секунд.
      output: >-
        Результаты меньше среднего, по одному в строке в порядке ввода, или одна строка `Нет`.
      constraints:
        - Результат, равный среднему, не выводится.
        - Порядок — как во вводе.
      starterCode: |
        n = int(input())
        # Прочитай результаты, посчитай среднее
        # и выведи тех, кто быстрее среднего
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "4\n104\n97\n110\n99\n"
          compare:
            ignoreSpaces: true
          expected: |-
            97
            99
        - id: t2
          kind: io
          title: "Пример 2: результат, равный среднему, не выводится"
          example: true
          stdin: "3\n101\n96\n106\n"
          compare:
            ignoreSpaces: true
          expected: "96"
        - id: t3
          kind: io
          title: "Граничный случай: ранний результат быстрее среднего"
          edge: true
          stdin: "3\n100\n120\n110\n"
          compare:
            ignoreSpaces: true
          expected: "100"
        - id: t4
          kind: io
          title: "Граничный случай: все проплыли одинаково"
          edge: true
          stdin: "3\n100\n100\n100\n"
          compare:
            ignoreSpaces: true
          expected: Нет
        - id: t5
          kind: io
          title: "Граничный случай: один пловец"
          edge: true
          stdin: "1\n95\n"
          compare:
            ignoreSpaces: true
          expected: Нет
        - id: t6
          kind: io
          title: "Граничный случай: среднее дробное"
          edge: true
          stdin: "3\n101\n101\n102\n"
          compare:
            ignoreSpaces: true
          expected: |-
            101
            101
        - id: t7
          kind: io
          title: "Граничный случай: один отстающий тянет среднее вверх"
          edge: true
          stdin: "5\n100\n101\n112\n113\n130\n"
          compare:
            ignoreSpaces: true
          expected: |-
            100
            101
      criteria:
        - Все результаты сохраняются, и каждый сравнивается со средним по всей группе.
        - Среднее — сумма всех результатов, делённая на их количество.
        - Выводятся только результаты строго меньше среднего, в порядке ввода.
        - Если таких нет, выводится одна строка «Нет».
        - Дробное среднее не округляется.
      hints:
        - >-
          За один проход задачу не решить: среднее известно, только когда прочитаны все
          результаты. Что нужно сохранить, пока читаешь ввод, чтобы потом сравнить со средним
          каждый результат?
        - >-
          На другом примере: для `marks = [4, 5, 3]` среднее `sum(marks) / len(marks)` равно 4.0,
          а цикл `for m in marks:` с проверкой `if m > 4.0:` напечатает только 5. А узнать после
          цикла, напечатал ли он хоть что-нибудь, помогает флаг — как в модуле про циклы.
        - |-
          Каркас:
          ```text
          times = []
          цикл n раз: прочитать число и добавить в times
          average = сумма / количество
          found = False
          for t in times:
              if t меньше average:
                  напечатать t
                  found = True
          если found так и осталось False — напечатать «Нет»
          ```
      solution:
        code: |
          n = int(input())
          times = []
          for i in range(n):
              times.append(int(input()))
          average = sum(times) / len(times)
          found = False
          for t in times:
              if t < average:
                  print(t)
                  found = True
          if not found:
              print("Нет")
        explanation: >-
          Первый цикл только собирает результаты: пока прочитаны не все, среднее неизвестно. Когда
          список готов, `sum(times) / len(times)` даёт среднее — обычным делением, с дробной
          частью. Второй цикл идёт по тому же списку и печатает результаты строго меньше среднего,
          а флаг `found` запоминает, что хотя бы один нашёлся. «Нет» печатается после цикла и
          только если флаг так и остался `False`.
      altSolutions:
