      mistakes:
        - id: get-plus-assign
          when:
            errorType: SyntaxError
            codeRegex: '\.get\(.*\)\s*\+='
          why: >-
            `get(…)` только отдаёт значение, положить в него ничего нельзя. Слева от `+=` должно
            стоять место в словаре — `votes[color]`.
          try: 'Запиши так: `votes[color] = votes.get(color, 0) + 1`.'
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: items-no-parens
          when:
            errorIncludes: is not iterable
            codeRegex: '\.items\s*:'
          why: >-
            После `items` нет круглых скобок. Без них `for` получает сам метод, а не пары из
            словаря, и перебрать его нельзя.
          try: 'Допиши скобки: `votes.items()`.'
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: no-items
          when:
            errorIncludes: values to unpack
            codeRegex: 'for\s+\w+\s*,\s*\w+\s+in\s+votes\s*:'
          why: >-
            `for color, count in votes:` перебирает только ключи — названия цветов, по одному
            слову. Две переменные ждут пару «ключ — значение», а получают слово «бежевый». Python
            пытается разложить его по буквам, букв больше двух — отсюда ValueError.
          try: 'Пары даёт метод `items()`: `for color, count in votes.items():`.'
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: key-in-quotes
          when:
            errorType: KeyError
            codeRegex: '\[\s*[''"][A-Za-z_]\w*[''"]\s*\]'
          why: >-
            В квадратных скобках стоит имя переменной в кавычках. Для Python это просто текст:
            `votes['color']` ищет ключ — слово «color» латиницей, а не цвет, который лежит в
            переменной `color`. Такого ключа нет, отсюда KeyError.
          try: 'Убери кавычки: `votes[color]`.'
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: no-start
          when:
            errorType: KeyError
            codeRegex: '\+=\s*1|\]\s*\+\s*1'
          why: >-
            При первом голосе за цвет такого ключа в словаре ещё нет. `votes[color] += 1` (как и
            `votes[color] + 1`) сначала читает старое значение — а читать нечего, отсюда KeyError.
          try: >-
            Возьми старое значение через `get` с запасным нулём: `votes.get(color, 0) + 1`, и
            запиши результат в `votes[color]`. Или раздели случаи через `if color in votes:`.
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: get-no-default
          when:
            errorIncludes: NoneType
          why: >-
            При первом голосе за цвет ключа ещё нет, и `votes.get(color)` возвращает `None` —
            «ничего». Прибавить 1 к «ничего» нельзя, отсюда TypeError. В сообщении об ошибке тип
            `None` называется `NoneType`.
          try: 'Укажи в `get` запасное значение — ноль: `votes.get(color, 0) + 1`.'
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: get-not-saved
          when:
            failedTest: t1
            codeRegex: '^\s*[A-Za-z_]\w*\.get\(.*\)\s*\+\s*1\s*$'
          where: Строка с `get(…) + 1`
          why: >-
            `get(…) + 1` посчитал новое число, но его никуда не записали, и оно пропало — как
            результат метода строки без присваивания. Словарь остался пустым.
          try: 'Запиши результат обратно в словарь по тому же ключу: `votes[color] = …`.'
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: print-dict
          when:
            outputIncludes: "{'"
          why: >-
            На экране фигурные скобки и кавычки: словарь напечатан целиком. А нужна отдельная
            строка `цвет: число` для каждого цвета.
          try: >-
            Пройди по парам: `for color, count in votes.items():` — и печатай каждую пару своей
            строкой.
          verify: "В «Примере 1» первой строкой должно быть `бежевый: 3`."
        - id: print-in-loop
          when:
            outputIncludes: |-
              бежевый: 1
              зелёный: 1
              бежевый: 2
          why: >-
            Строка с выводом стоит внутри цикла ввода, поэтому после каждого голоса печатается
            промежуточный счёт. Итог известен только после того, как прочитаны все голоса.
          try: >-
            Сначала посчитай все голоса, а выводи отдельным циклом после цикла ввода — без
            отступа под ним.
          verify: "В «Примере 1» должно быть ровно три строки."
        - id: repeated-lines
          when:
            failedTest: t1
            outputIncludes: |-
              бежевый: 3
              зелёный: 1
              бежевый: 3
          why: >-
            Числа верные, но бежевый напечатан три раза — по разу на каждый голос за него. Цикл
            вывода идёт по всем голосам подряд, а в них цвета повторяются. В словаре каждый цвет —
            один ключ.
          try: 'Выводи по словарю, а не по голосам: `for color, count in votes.items():`.'
          verify: "В «Примере 1» должно быть ровно три строки."
        - id: get-one
          when:
            outputIncludes: "бежевый: 4"
            codeRegex: '\.get\([^,)]+,\s*1\s*\)'
          why: >-
            У каждого цвета на голос больше. Запасное значение в `get` — сколько голосов было до
            этого голоса. До первого голоса их 0, как у счётчика из урока 3.3, а с запасной
            единицей первый голос сразу даёт 2.
          try: 'Поставь запасным ноль: `votes.get(color, 0) + 1`.'
          verify: "В «Примере 1» у зелёного должно быть 1."
        - id: first-zero
          when:
            outputEquals: |-
              бежевый: 2
              зелёный: 0
              голубой: 0
          why: >-
            У каждого цвета на голос меньше: первый голос за цвет записан нулём. Ноль — это
            «голосов ещё не было», а после первого голоса их уже один.
          try: >-
            При первом голосе записывай 1: `else: votes[color] = 1`. Или одной строкой:
            `votes[color] = votes.get(color, 0) + 1`.
          verify: "В «Примере 1» у зелёного должно быть 1."
        - id: overwrite
          when:
            outputEquals: |-
              бежевый: 1
              зелёный: 1
              голубой: 1
          why: >-
            У каждого цвета по одному голосу: на каждом голосе в словарь заново записывается
            единица, а уже накопленное число не растёт.
          try: >-
            Прибавляй к тому, что уже накоплено: `votes[color] = votes.get(color, 0) + 1`.
          verify: "В «Примере 1» у бежевого должно быть 3."
        - id: reset-in-loop
          when:
            outputEquals: "бежевый: 1"
            codeRegex: '^\s+[A-Za-z_]\w*\s*=\s*\{\s*\}'
          why: >-
            Посчитан только последний голос: `votes = {}` стоит внутри цикла, и на каждом голосе
            словарь создаётся заново, пустым. Старые голоса пропадают.
          try: Перенеси `votes = {}` выше цикла — словарь должен создаваться один раз.
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: count-after-loop
          when:
            outputEquals: "бежевый: 1"
            codeRegex: '^[A-Za-z_]\w*\['
          why: >-
            Посчитан только последний голос. Строка подсчёта стоит без отступа — после цикла, и
            выполняется один раз, когда в `color` уже лежит последний цвет.
          try: Сдвинь строку подсчёта вправо, под `color = input()`, чтобы она стала частью цикла.
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: never-added
          when:
            failedTest: t1
            outputEquals: Голосов нет
            codeRegex: 'if\s+\w+\s+in\s+votes\s*:'
          why: >-
            Голоса есть, а словарь пустой. Голос прибавляется, только если цвет уже есть в словаре.
            А первый голос за цвет никуда не записывается, поэтому ни один цвет в словарь так и не
            попадает.
          try: >-
            Добавь ветку `else: votes[color] = 1` для первого голоса. Или замени проверку одной
            строкой `votes[color] = votes.get(color, 0) + 1`.
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: never-added-silent
          when:
            failedTest: t1
            outputEquals: ""
            codeRegex: 'if\s+\w+\s+in\s+votes\s*:[\s\S]*for\s+[\w\s,]+in\s+votes'
          why: >-
            Голоса есть, а на экране пусто: цикл вывода не нашёл в словаре ни одного цвета. Голос
            прибавляется, только если цвет уже есть в словаре, а первый голос за цвет никуда не
            записывается — словарь так и остаётся пустым.
          try: >-
            Добавь ветку `else: votes[color] = 1` для первого голоса. Или замени проверку одной
            строкой `votes[color] = votes.get(color, 0) + 1`.
          verify: "В «Примере 1» должно получиться `бежевый: 3`, `зелёный: 1`, `голубой: 1`."
        - id: no-message
          when:
            failedTest: t5
            outputEquals: ""
            codeIncludes: "print("
          why: >-
            Когда голосов нет, цикл по словарю не выполняется ни разу, и программа ничего не
            печатает. А по условию нужно сообщение.
          try: 'Перед выводом проверь, пуст ли словарь (`len(votes) == 0`), и выведи `Голосов нет`.'
          verify: "Тест «Граничный случай: никто не проголосовал» должен дать `Голосов нет`."
      afterPass: >-
        Подсчёт — один из самых частых приёмов со словарями, он пригодится в самостоятельной работе
        модуля. Если хочешь, найди цвет-победитель: пройди по `votes.items()` и запомни цвет с
        наибольшим числом голосов — так же, как искал максимум в модуле про циклы.
      skills: [dicts, accumulators]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Словарь хранит пары `ключ: значение`. `d[k]` читает значение, а `d[k] = v` добавляет пару или заменяет значение."
      - "Чтение отсутствующего ключа даёт KeyError. Безопасно — спросить `k in d` (он смотрит ключи) или взять `d.get(k, запасное)`."
      - "`for k, v in d.items()` перебирает пары в порядке добавления."
      - "Подсчёт: `d[x] = d.get(x, 0) + 1` — свой счётчик для каждого ключа, начинается с 0."
    question: Чем `prices["санки"]` отличается от `prices.get("санки")`, если санок в словаре нет?
    answer: >-
      `prices["санки"]` остановит программу с ошибкой KeyError. `prices.get("санки")` вернёт `None`
      (или запасное значение, если его указать вторым аргументом: `prices.get("санки", 0)`), и
      программа продолжит работу.
