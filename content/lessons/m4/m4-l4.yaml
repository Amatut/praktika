      solution:
        code: |
          n = int(input())
          votes = {}
          for i in range(n):
              color = input()
              votes[color] = votes.get(color, 0) + 1
          if len(votes) == 0:
              print("Голосов нет")
          for color, count in votes.items():
              print(f"{color}: {count}")
        explanation: >-
          Цвет — ключ, число голосов — значение. При первом голосе за цвет ключа ещё нет, и
          `votes.get(color, 0)` возвращает 0, поэтому в словаре появляется 1. При следующих голосах
          `get` возвращает накопленное число, и к нему прибавляется 1. Словарь помнит порядок
          добавления, поэтому цвета выводятся в порядке первого упоминания. Вывод стоит после цикла
          ввода: сначала считаем все голоса, потом печатаем итог.
