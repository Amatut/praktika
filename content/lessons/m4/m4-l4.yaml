id: m4-l4
module: m4
number: "4.4"
title: "Словари: значение по ключу"
objective: >-
  Хранить данные парами «ключ — значение»: читать, добавлять и изменять записи, безопасно
  обращаться к отсутствующему ключу через in или get и считать повторы словарём.
minutes: [25, 30]
prerequisites: [m4-l3]
skills: [dicts]
environment: python

story:
  title: Цена по названию
  fictional: true
  text: >-
    На лыжной базе администратор Галина по сто раз на дню отвечала на вопрос «Сколько стоит
    прокат?» и каждый раз искала строчку в ламинированном листке с ценами. Однажды она прочитала
    цену с соседней строки и взяла с туриста за ботинки как за лыжи. Сын Галины написал для кассы
    маленькую программу: вводишь название — получаешь цену. Внутри неё словарь, где название вещи —
    ключ, а цена — значение. Сегодня ты научишься находить значение по названию так же, как эта
    программа.

why: >-
  Часто значение ищут не по номеру места, а по названию: цену — по товару, телефон — по имени,
  перевод — по слову. Словарь хранит такие пары и сразу находит значение по ключу:
  `prices["лыжи"]` даёт 500, без перебора всего списка.

usedIn: >-
  Настройки программ, телефонные книги, корзина интернет-магазина «товар → количество», подсчёт
  голосов и слов в тексте, ответы веб-сервисов в формате JSON — к ним вернёмся в модулях 7 и 11.

steps:
  - id: idea
    type: theory
    title: "Словарь: найти по ключу"
    body: |-
      Список ищет по номеру места: `times[0]`. **Словарь** ищет по **ключу**, например по названию
      вещи. Это набор пар «**ключ**: **значение**» в фигурных скобках:

      ```python
      prices = {"лыжи": 500, "ботинки": 300}
      empty = {}    # пустой словарь
      ```

      Здесь `"лыжи"` — ключ, `500` — его значение. **Ключи не повторяются**: у каждой вещи одна
      цена.

      **Чтение.** Ключ пишут в квадратных скобках, как индекс: `prices["лыжи"]` → `500`. Ключ
      можно взять из переменной: если `item = "лыжи"`, то `prices[item]` тоже даёт 500 — без
      кавычек вокруг `item`. Номеров мест у словаря нет: `prices[0]` ищет ключ `0`. Если ключа
      нет, программа остановится с ошибкой **KeyError**: `prices["санки"]` → `KeyError: 'санки'`.

      **Запись** выглядит так же, только слева от `=`:

      ```python
      prices["санки"] = 200   # ключа не было — пара добавилась
      prices["лыжи"] = 550    # ключ был — значение заменилось
      ```

      **Спросить, не рискуя KeyError**, можно двумя способами:

      - `"санки" in prices` даёт `True` или `False`. `in` смотрит только **ключи**, не значения.
      - Метод `get`: `prices.get("сноуборд")` возвращает значение, а если ключа нет — `None`,
        особое значение «ничего». Второй аргумент — запасное значение:
        `prices.get("сноуборд", 0)` → `0`.

      **Перебор.** `len(prices)` — число пар. `for name in prices:` перебирает ключи, а метод
      `items()` даёт пары: в `for name, price in prices.items():` на каждом шаге две переменные
      получают ключ и значение сразу. Что это за пары, узнаешь в следующем уроке. Порядок — тот, в
      котором пары добавляли.

      **Подсчёт** — один из самых частых приёмов со словарями: сколько раз встречается каждое
      слово или каждая вещь. Это счётчик из урока 3.3, только свой для каждого ключа:

      ```python
      counts = {}
      for item in ["лыжи", "шлем", "лыжи"]:
          counts[item] = counts.get(item, 0) + 1
      print(counts)   # {'лыжи': 2, 'шлем': 1}
      ```

      Если ключа `item` ещё нет, `get` вернёт 0 — счётчик начинается с нуля, — и в словаре
      появится 1. Если ключ есть, к старому числу прибавится 1.

      Две частые ошибки: думать, что `in` ищет среди значений (он смотрит только ключи), и ждать,
      что отсутствующий ключ даст пустое значение. Чтение такого ключа в квадратных скобках
      остановит программу с KeyError.
    simpler: >-
      Словарь — шкаф с подписанными ящиками. Ты ищешь не третий ящик слева, а ящик с надписью
      «лыжи» (ключ) и сразу берёшь то, что в нём лежит (значение). Нет ящика с такой надписью —
      работа встаёт: это KeyError. Чтобы так не вышло, спроси заранее, есть ли такая надпись
      (`in`), или попроси «если нет, дай запасное» — `get(ключ, запасное)`.
    coach: >-
      Если ищешь что-то по названию, а не по номеру, скорее всего, тебе нужен словарь.

  - id: rental
    type: example
    title: Цены проката
    body: >-
      Программа с кассы лыжной базы: читает цену, добавляет новую вещь, меняет цену и печатает
      прайс-лист. Нажми «Запустить» и сверь каждую строку вывода с кодом.
    code: |-
      prices = {"лыжи": 500, "ботинки": 300, "палки": 150}
      print(prices["ботинки"])
      prices["санки"] = 200
      prices["лыжи"] = 550
      print(prices)
      print(prices.get("сноуборд", "нет в прокате"))
      for item, price in prices.items():
          print(f"{item}: {price} руб.")
    notes:
      - line: 2
        text: Ключ в квадратных скобках — и словарь сразу отдаёт значение, 300.
      - line: 3
        text: Ключа «санки» не было — в словаре появилась новая пара.
      - line: 4
        text: >-
          Ключ «лыжи» уже был — заменилось только значение. Новой пары нет, и в выводе лыжи
          по-прежнему идут первыми.
      - line: 5
        text: Так словарь выглядит на экране — в фигурных скобках, пары через запятую.
      - line: 6
        text: >-
          Сноуборда нет, но и ошибки нет: `get` вернул запасное значение — второй аргумент в
          скобках.
      - line: 7
        text: "Метод `items()` отдаёт ключ и значение сразу — в `item` и `price`."
    tryIt: >-
      Допиши в конец `print(prices["сноуборд"])` и запусти: программа остановится с KeyError, и в
      сообщении будет ключ, которого не нашлось. Потом замени эту строку на
      `print(prices.get("сноуборд"))` — вместо ошибки появится `None`.
    coach: >-
      Обрати внимание: запись `prices["санки"] = 200` не упала, хотя санок в словаре не было.
      Ошибку даёт только **чтение** отсутствующего ключа.

  - id: stock-predict
    type: predict
    title: Сколько пар в словаре?
    prompt: >-
      Галина записывает, сколько вещей осталось на складе. Как думаешь, что выведет программа?
    code: |-
      stock = {"лыжи": 4, "ботинки": 6}
      stock["лыжи"] = 3
      stock["санки"] = 2
      print(len(stock), stock["лыжи"])
    options:
      - "2 3"
      - "3 3"
      - "4 3"
      - "3 4"
      - Ошибка KeyError
    answer: "3 3"
    explanation: >-
      Вторая строка записывает 3 по ключу «лыжи», который уже есть, поэтому значение заменилось:
      было 4, стало 3. Новой пары не появилось — ключи в словаре не повторяются. Третья строка
      записывает 2 по новому ключу «санки» и добавляет пару. Пар стало три, у лыж — 3. Ответ «4 3»
      получился бы, если бы запись по старому ключу добавляла ещё одну пару. А KeyError бывает
      только при чтении отсутствующего ключа.
    coach: >-
      Запись по ключу работает как «положи сюда»: было — заменится, не было — появится.

  - id: in-predict
    type: predict
    title: Что знает словарь?
    prompt: Как думаешь, что выведет программа?
    code: |-
      prices = {"лыжи": 500, "ботинки": 300}
      print(500 in prices, prices.get("шлем"))
    options:
      - True None
      - False None
      - False 0
      - Ошибка KeyError
    answer: False None
    explanation: >-
      `in` проверяет только ключи. Число 500 в словаре есть, но это значение, а не ключ, поэтому
      `500 in prices` даёт False. А `"лыжи" in prices` дал бы True. Шлема в словаре нет, но `get`
      не останавливает программу: без второго аргумента он возвращает `None` — «ничего». Ноль
      получился бы, только если написать `prices.get("шлем", 0)`.
    coach: >-
      `in` у словаря спрашивает: «Есть ли такой **ключ**?» Про значения он не знает.

  - id: practice-rent
    type: exercise
    title: Практика 1
    exercise:
      id: m4-l4-e1
      kind: repeat
      title: Стоимость проката
      statement: |-
        В кассовой программе лыжной базы есть словарь `prices`: вещь → цена проката за один день в
        рублях. Турист называет вещь и число дней. Выведи, сколько стоит прокат:

        ```text
        Итого: 1000
        ```

        Так будет для лыж на 2 дня: лыжи стоят 500 руб. в день.
      input: Две строки — название вещи и число дней.
      output: "Одна строка: `Итого: <стоимость>`."
      constraints:
        - Вещь всегда есть в словаре, и её название написано так же, как ключ.
        - Число дней — целое, от 1.
        - Цену бери из словаря, а не записывай в программу.
      starterCode: |
        prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
        item = input()
        # Прочитай число дней, найди цену вещи в словаре и выведи стоимость
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "лыжи\n2\n"
          expected: "Итого: 1000"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "шлем\n3\n"
          expected: "Итого: 600"
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: один день"
          edge: true
          stdin: "палки\n1\n"
          expected: "Итого: 150"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: две недели"
          edge: true
          stdin: "ботинки\n14\n"
          expected: "Итого: 4200"
          compare:
            ignoreSpaces: true
      rules:
        - id: price-from-dict
          dependsOn:
            print: [prices]
          message: Цену бери из словаря `prices` по названию вещи, а не вписывай числом в программу.
      criteria:
        - Цена берётся из словаря по названию, которое ввели.
        - Число дней превращается из строки в число.
        - "Выводится одна строка `Итого: <стоимость>`, где стоимость — цена за день, умноженная на число дней."
      hints:
        - >-
          Цена каждой вещи уже лежит в словаре. Какой ключ нужен, чтобы её достать, и в какой
          переменной он сейчас лежит? И не забудь, что `input()` всегда возвращает строку.
        - >-
          На другом примере: `ages = {"Оля": 30}` и `name = "Оля"`. Тогда `ages[name]` даёт 30 —
          имя переменной пишется в скобках без кавычек.
        - |-
          Каркас:
          ```text
          days = число из второй строки ввода
          price = prices[…]
          print(f"Итого: {… * …}")
          ```
      solution:
        code: |
          prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
          item = input()
          days = int(input())
          print(f"Итого: {prices[item] * days}")
        explanation: >-
          `prices[item]` использует как ключ то, что лежит в `item`, например `'лыжи'`, и словарь
          сразу отдаёт цену — искать строчку глазами не нужно. Число дней приходит строкой,
          поэтому его превращают через `int()`. Цену можно достать и через `prices.get(item)`: вещь
          по условию всегда есть в словаре, так что результат тот же.
      altSolutions:
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            price = prices.get(item)
            total = price * days
            print("Итого:", total)
          note: get и print через запятую.
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = input()
            total = prices[item] * int(days)
            print("Итого: " + str(total))
          note: int() в формуле, склейка строк.
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            for name, price in prices.items():
                if name == item:
                    print(f"Итого: {price * days}")
          note: Перебор пар вместо чтения по ключу — длиннее, но верно.
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            total = 0
            for day in range(days):
                total = total + prices[item]
            print('Итого: ' + str(total))
          note: Накопитель по дням — правило price-from-dict видит цену из словаря и через цикл.
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            for name in prices:
                if name == item:
                    total = prices[name] * days
            print(f'Итого: {total}')
          note: Перебор ключей и чтение prices[name].
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            price = prices.get(item)
            print(f"Итого: {price * int(input())}")
          note: Число дней читается прямо внутри f-строки.
      wrongSolutions:
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = input()
            print(f"Итого: {prices[item] * days}")
          note: Число дней осталось строкой — строка повторяется 500 раз.
          expectMistake: days-not-int
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            print(f"Итого: {prices['item'] * days}")
          note: Имя переменной в кавычках — ключом стала строка 'item'.
          expectMistake: key-in-quotes
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            price = prices[0]
            print(f"Итого: {price * days}")
          note: Обращение по номеру места, как к списку.
          expectMistake: by-index
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            print(f"Итого: {500 * days}")
          note: Цена записана числом.
          expectMistake: fixed-price
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            print(f"Итого: {prices["лыжи"] * days}")
          note: Ключ записан в код, а не взят из ввода.
          expectMistake: fixed-price
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            print(prices[item] * days)
          note: Нет подписи «Итого:».
          expectMistake: no-label
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            price = prices(item)
            print(f"Итого: {price * days}")
          note: Круглые скобки вместо квадратных, как у get(...).
          expectMistake: dict-call
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            for name, price in prices:
                if name == item:
                    print(f"Итого: {price * days}")
          note: Перебор пар без items() — словарь отдаёт только ключи.
          expectMistake: no-items
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            print("Итого:")
            print(prices[item] * days)
          note: Подпись и число двумя print — на разных строках.
          expectMistake: label-own-line
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            days = int(input())
            if item == "лыжи":
                price = 500
            elif item == "ботинки":
                price = 300
            elif item == "палки":
                price = 150
            else:
                price = 200
            print(f"Итого: {price * days}")
          note: Цены вписаны через if/elif, словарь не используется — ловит правило price-from-dict.
          expectMistake: null
      mistakes:
        - id: key-in-quotes
          when:
            errorType: KeyError
            codeRegex: '\[\s*[''"][A-Za-z_]\w*[''"]\s*\]'
          why: >-
            В квадратных скобках стоит имя переменной в кавычках. Для Python это просто текст:
            `prices['item']` ищет ключ из четырёх латинских букв «item», а не то, что лежит в
            переменной `item`. Такого ключа в словаре нет, отсюда KeyError.
          try: >-
            Убери кавычки: `prices[item]`. Тогда ключом станет то, что лежит в переменной, например
            `'лыжи'`.
          verify: "В «Примере 1» должно получиться `Итого: 1000`."
        - id: by-index
          when:
            errorType: KeyError
            codeRegex: 'prices\[\s*\d+\s*\]'
          why: >-
            У словаря нет номеров мест, как у списка. `prices[0]` ищет ключ `0`, а ключи здесь —
            названия вещей.
          try: 'Достань цену по названию вещи из ввода: `prices[item]`.'
          verify: "В «Примере 1» должно получиться `Итого: 1000`."
        - id: dict-call
          when:
            errorIncludes: is not callable
            codeRegex: 'prices\s*\('
          why: >-
            После `prices` стоят круглые скобки, как у функции. Словарь не вызывают: значение
            достают по ключу в квадратных скобках. Круглые скобки нужны только методу:
            `prices.get(item)`.
          try: 'Замени `prices(item)` на `prices[item]`.'
          verify: "В «Примере 1» должно получиться `Итого: 1000`."
        - id: no-items
          when:
            errorIncludes: values to unpack
            codeRegex: 'for\s+\w+\s*,\s*\w+\s+in\s+prices\s*:'
          why: >-
            `for name, price in prices:` перебирает только ключи — названия вещей, по одному слову.
            Две переменные ждут пару «ключ — значение», а получают слово «лыжи». Python пытается
            разложить его по буквам, букв больше двух — отсюда ValueError.
          try: >-
            Пары даёт метод `items()`: `for name, price in prices.items():`. А ещё проще взять цену
            сразу по ключу: `prices[item]`.
          verify: "В «Примере 1» должно получиться `Итого: 1000`."
        - id: days-not-int
          when:
            outputIncludes: "Итого: 2222"
          why: >-
            `input()` вернул число дней строкой — `'2'`. Строку можно умножить на число: она
            повторится 500 раз. Поэтому на экране длинный ряд двоек вместо 1000.
          try: 'Преврати число дней в число сразу при чтении: `days = int(input())`.'
          verify: "В «Примере 1» должно получиться `Итого: 1000`."
        - id: fixed-price
          when:
            failedTest: t2
            outputEquals: "Итого: 1500"
          why: >-
            Для лыж ответ верный, а для шлема — нет: программа посчитала шлем по цене лыж. Цена
            записана в код заранее — числом 500 или ключом «лыжи», — а не найдена по названию из
            ввода.
          try: 'Бери цену из словаря по введённому названию: `prices[item]`.'
          verify: "В «Примере 2» должно получиться `Итого: 600`."
        - id: no-label
          when:
            outputEquals: "1000"
          why: Число верное, но в задании нужна подпись перед ним.
          try: 'Выведи подпись и число вместе: `print(f"Итого: {…}")`.'
          verify: "В «Примере 1» должно получиться `Итого: 1000`."
        - id: label-own-line
          when:
            outputEquals: |-
              Итого:
              1000
          why: >-
            Подпись и число напечатаны двумя разными `print`, а каждый `print` начинает новую
            строку. Нужна одна строка: подпись, пробел и число.
          try: 'Выведи всё одним `print`: `print("Итого:", …)` или `print(f"Итого: {…}")`.'
          verify: "В «Примере 1» должна получиться одна строка `Итого: 1000`."
      afterPass: >-
        Цену нашёл сам словарь: ни перебора строчек, ни риска прочитать соседнюю. А что, если вещи
        нет в прокате? Это следующее задание.
      skills: [dicts, type-conversion]

  - id: practice-unknown
    type: exercise
    title: Практика 2
    exercise:
      id: m4-l4-e2
      kind: fix
      title: Неизвестный инвентарь
      statement: |-
        Программа подсказывает цену проката. Для вещей из словаря она работает: на `лыжи` выводит
        `лыжи: 500 руб. в день`. Но турист спросил про сноуборд, и программа остановилась с
        ошибкой KeyError. Исправь её.

        Для вещи из словаря вывод остаётся прежним:

        ```text
        лыжи: 500 руб. в день
        ```

        А для вещи, которой в словаре нет:

        ```text
        сноуборд: нет в прокате
        ```
      input: Одна строка — название вещи.
      output: "Одна строка: `<вещь>: <цена> руб. в день` или `<вещь>: нет в прокате`."
      constraints:
        - Словарь `prices` не меняй.
        - Программа не должна останавливаться с ошибкой ни на каком названии.
      starterCode: |
        prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
        item = input()
        print(f"{item}: {prices[item]} руб. в день")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "лыжи\n"
          expected: "лыжи: 500 руб. в день"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "сноуборд\n"
          expected: "сноуборд: нет в прокате"
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: Ещё одна вещь из словаря
          stdin: "палки\n"
          expected: "палки: 150 руб. в день"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: почти как в словаре"
          edge: true
          stdin: "палка\n"
          expected: "палка: нет в прокате"
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: Ещё одна вещь не из словаря
          stdin: "коньки\n"
          expected: "коньки: нет в прокате"
          compare:
            ignoreSpaces: true
      criteria:
        - Программа не падает на названии, которого нет в словаре.
        - Для вещи из словаря выводится её цена, как раньше.
        - "Для неизвестной вещи выводится `<вещь>: нет в прокате`."
      hints:
        - >-
          Программа падает в строке, где цена читается по ключу. Что нужно узнать о ключе **до**
          этого чтения — и что печатать, если ответ «нет»?
        - |-
          На другом примере — клички питомцев:
          ```python
          pets = {"кот": "Мурзик"}
          animal = "пёс"
          if animal in pets:
              print(pets[animal])
          else:
              print("такого нет")
          ```
          Ключа «пёс» нет, поэтому выполнится `else`, и чтения `pets[animal]` не будет вовсе.
        - |-
          Каркас:
          ```text
          если item есть среди ключей prices:
              вывести item, цену и «руб. в день»
          иначе:
              вывести item и «нет в прокате»
          ```
      solution:
        code: |
          prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
          item = input()
          if item in prices:
              print(f"{item}: {prices[item]} руб. в день")
          else:
              print(f"{item}: нет в прокате")
        explanation: >-
          KeyError возникает в момент чтения `prices[item]`, если такого ключа нет. Поэтому сначала
          спрашиваем `item in prices` — `in` смотрит ключи — и читаем цену только в той ветке, где
          ключ точно есть. Можно и через `get`: `price = prices.get(item, 0)`, а потом
          `if price == 0` — «нет в прокате». Это работает, потому что бесплатных вещей в прокате
          нет. Надёжнее спросить `in`: он отвечает именно на вопрос «есть ли такой ключ».
      altSolutions:
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            price = prices.get(item, 0)
            if price == 0:
                print(f"{item}: нет в прокате")
            else:
                print(f"{item}: {price} руб. в день")
          note: get с запасным нулём.
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            if item not in prices:
                print(item + ": нет в прокате")
            else:
                print(item + ":", prices[item], "руб. в день")
          note: Сначала ветка «нет», склейка и print через запятую.
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            price = prices.get(item)
            if price is None:
                print(f"{item}: нет в прокате")
            else:
                print(f"{item}: {price} руб. в день")
          note: get без запасного значения и проверка на None.
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            price = prices.get(item, "нет в прокате")
            if price == "нет в прокате":
                print(f"{item}: {price}")
            else:
                print(f"{item}: {price} руб. в день")
          note: get с запасным текстом из примера и сравнение с ним.
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            item = item.strip().lower()
            if item in prices:
                print(f"{item}: {prices[item]} руб. в день")
            else:
                print(f"{item}: нет в прокате")
          note: Улучшение из afterPass — strip().lower() перед проверкой.
      wrongSolutions:
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            print(f"{item}: {prices[item]} руб. в день")
          note: Стартовый код без изменений.
          expectMistake: key-error
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            if item == "сноуборд":
                print(f"{item}: нет в прокате")
            else:
                print(f"{item}: {prices[item]} руб. в день")
          note: Заплатка только для одного примера.
          expectMistake: special-case
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            if item == "сноуборд" or item == "палка":
                print(f"{item}: нет в прокате")
            else:
                print(f"{item}: {prices[item]} руб. в день")
          note: Заплатка на оба слова, которые видны в тестах, — ловит скрытый тест t5.
          expectMistake: special-case
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            if item != "сноуборд":
                print(f"{item}: {prices[item]} руб. в день")
            else:
                print(f"{item}: нет в прокате")
          note: Заплатка через !=.
          expectMistake: special-case
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            if "сноуборд" == item:
                print(f"{item}: нет в прокате")
            else:
                print(f"{item}: {prices[item]} руб. в день")
          note: Заплатка с обратным порядком сравнения.
          expectMistake: special-case
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            print(f"{item}: {prices.get(item)} руб. в день")
          note: get без проверки — на экране None.
          expectMistake: get-none
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            print(f"{item}: {prices.get(item, 0)} руб. в день")
          note: get с нулём без проверки — сноуборд «стоит» 0.
          expectMistake: get-zero
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            print(f"{item}: {prices.get(item, 'нет в прокате')} руб. в день")
          note: Запасной текст подставлен, но хвост «руб. в день» остался.
          expectMistake: get-text-default
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            if item in prices:
                print(f"{item}: {prices[item]} руб. в день")
            print(f"{item}: нет в прокате")
          note: Нет else — «нет в прокате» печатается всегда.
          expectMistake: no-else
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            if item in prices:
                print(f"{item}: нет в прокате")
            else:
                print(f"{item}: {prices[item]} руб. в день")
          note: Ветки перепутаны.
          expectMistake: swapped-branches
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            if "item" in prices:
                print(f"{item}: {prices[item]} руб. в день")
            else:
                print(f"{item}: нет в прокате")
          note: Имя переменной в кавычках в проверке — ответ всегда «нет».
          expectMistake: quoted-item
        - code: |
            prices = {"лыжи": 500, "ботинки": 300, "палки": 150, "шлем": 200}
            item = input()
            if item in prices == True:
                print(f"{item}: {prices[item]} руб. в день")
            else:
                print(f"{item}: нет в прокате")
          note: Цепочка сравнений in … == True — условие всегда ложно.
          expectMistake: in-eq-true
      mistakes:
        - id: special-case
          when:
            errorType: KeyError
            codeRegex: '(?:==|!=)\s*[''"]сноуборд[''"]|[''"]сноуборд[''"]\s*(?:==|!=)'
          why: >-
            Программа знает только те неизвестные вещи, которые ты вписал в код. Но турист может
            спросить что угодно: на любом другом слове программа снова читает `prices[item]` и
            падает.
          try: >-
            Вместо сравнения с конкретными словами спроси у словаря, есть ли такой ключ:
            `item in prices`.
          verify: >-
            Впиши в поле «Ввод для „Запустить“» своё слово, которого нет в словаре, и запусти:
            должно получиться `<слово>: нет в прокате`.
        - id: quoted-item
          when:
            failedTest: t1
            outputEquals: "лыжи: нет в прокате"
            codeRegex: '[''"][A-Za-z_]\w*[''"]\s+(?:not\s+)?in\s+prices'
          why: >-
            Лыжи в словаре есть, а программа пишет «нет в прокате». В проверке имя переменной стоит
            в кавычках: `"item" in prices` ищет ключ — слово «item» латиницей, а такого ключа нет.
            Поэтому проверка отвечает одно и то же, что бы ни ввели.
          try: 'Убери кавычки: `if item in prices:`.'
          verify: "В «Примере 1» должно получиться `лыжи: 500 руб. в день`."
        - id: in-eq-true
          when:
            failedTest: t1
            codeRegex: 'in\s+prices\s*==\s*True'
          why: >-
            `item in prices == True` Python читает как два сравнения сразу: `item in prices` и
            `prices == True`. Словарь не равен `True`, поэтому условие всегда ложно — даже для лыж.
          try: 'Сравнивать с `True` не нужно: `in` уже даёт `True` или `False`. Напиши `if item in prices:`.'
          verify: "В «Примере 1» должно получиться `лыжи: 500 руб. в день`."
        - id: swapped-branches
          when:
            failedTest: t1
            outputEquals: "лыжи: нет в прокате"
            codeRegex: 'if\s+item\s+(?:not\s+)?in\s+prices\s*:'
          why: >-
            Лыжи в словаре есть, а программа пишет «нет в прокате». Ветки перепутаны: `in` даёт
            `True`, когда ключ **есть**, — в этой ветке и нужно печатать цену.
          try: >-
            Поменяй строки вывода местами или условие на противоположное. Проверь себя вслух: «если
            вещь есть в словаре — печатаю цену».
          verify: "В «Примере 1» должно получиться `лыжи: 500 руб. в день`."
        - id: key-error
          when:
            errorType: KeyError
          why: >-
            KeyError возникает в момент чтения `prices[item]`, если такого ключа нет. Пока цена
            читается при любом вводе, программа будет падать на незнакомой вещи.
          try: >-
            Сначала узнай, есть ли ключ: `if item in prices:`. Читай цену только в этой ветке, а в
            `else` печатай «нет в прокате».
          verify: "В «Примере 2» должно получиться `сноуборд: нет в прокате`."
        - id: get-text-default
          when:
            outputIncludes: "нет в прокате руб"
          why: >-
            Запасное значение `get` подставилось, но строка вывода осталась общей, и после него
            напечатался хвост «руб. в день». Для неизвестной вещи нужна другая строка целиком.
          try: >-
            Раздели вывод на две ветки: `if item in prices:` — строка с ценой, `else:` — строка
            «нет в прокате».
          verify: "В «Примере 2» должно получиться `сноуборд: нет в прокате`."
        - id: get-none
          when:
            outputIncludes: None
          why: >-
            `get` не нашёл ключ и вернул `None` — «ничего». Ошибки нет, но `None` попал прямо в
            текст.
          try: >-
            Проверь ключ до вывода: `if item in prices:` — строка с ценой, иначе — «нет в
            прокате».
          verify: "В «Примере 2» должно получиться `сноуборд: нет в прокате`."
        - id: get-zero
          when:
            outputIncludes: ": 0 руб"
          why: >-
            `get` вернул запасной ноль, и программа сообщает, что сноуборд стоит 0 рублей. Туристу
            нужно другое сообщение: этой вещи нет.
          try: >-
            Сохрани результат `get` в переменную и проверь его в `if`: если там 0 — печатай «нет в
            прокате», иначе — цену. Или спроси сам словарь: `if item in prices:`.
          verify: "В «Примере 2» должно получиться `сноуборд: нет в прокате`."
        - id: no-else
          when:
            outputEquals: |-
              лыжи: 500 руб. в день
              лыжи: нет в прокате
          why: >-
            Строка «нет в прокате» стоит после `if` без отступа, поэтому печатается всегда — и для
            лыж тоже.
          try: 'Поставь перед ней `else:` и сдвинь её вправо, чтобы она стала второй веткой.'
          verify: "В «Примере 1» должна остаться одна строка `лыжи: 500 руб. в день`."
      afterPass: >-
        Программа больше не падает на незнакомом слове. `in` и `get` — два способа спросить
        словарь, не рискуя KeyError. Если хочешь, добавь `item = item.strip().lower()` после
        ввода — тогда и «  Лыжи » найдутся.
      skills: [dicts, conditions]

  - id: practice-votes
    type: exercise
    title: Практика 3
    exercise:
      id: m4-l4-e3
      kind: write
      title: Цвет стен в подъезде
      statement: |-
        Жильцы дома решают, в какой цвет покрасить стены в подъезде. Каждый называет один цвет.
        Посчитай, сколько голосов у каждого цвета.

        Первая строка ввода — число голосов, дальше сами голоса, по одному цвету на строке.
        Для каждого цвета выведи строку `цвет: число`. Цвета выводи в том порядке, в каком их
        назвали впервые. Например, для голосов «бежевый, зелёный, бежевый, голубой, бежевый»:

        ```text
        бежевый: 3
        зелёный: 1
        голубой: 1
        ```

        Если голосов нет (число голосов — 0), выведи `Голосов нет`.
      input: "Первая строка — число голосов (0 или больше). Затем столько же строк — по одному цвету."
      output: "Для каждого цвета строка `цвет: число`, в порядке первого упоминания. Если голосов нет — `Голосов нет`."
      constraints:
        - Одинаковые цвета записаны одинаково, маленькими буквами.
        - Сортировать не нужно — порядок как во вводе, по первому голосу за цвет.
      starterCode: |
        n = int(input())
        votes = {}
        # Прочитай n голосов и посчитай, сколько раз назван каждый цвет
        # Потом выведи результат
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "5\nбежевый\nзелёный\nбежевый\nголубой\nбежевый\n"
          expected: |-
            бежевый: 3
            зелёный: 1
            голубой: 1
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: "Пример 2: голосов поровну"
          example: true
          stdin: "4\nзелёный\nголубой\nголубой\nзелёный\n"
          expected: |-
            зелёный: 2
            голубой: 2
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: один голос"
          edge: true
          stdin: "1\nсерый\n"
          expected: "серый: 1"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: все за один цвет"
          edge: true
