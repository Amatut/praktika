id: m4-l3
module: m4
number: "4.3"
title: "Методы строк: от текста к списку и обратно"
objective: >-
  Чистить и преобразовывать текст методами строк, разбивать строку на список через split и
  собирать обратно через join, помня, что метод возвращает новую строку.
minutes: [25, 30]
prerequisites: [m4-l2]
skills: [string-methods, lists]
environment: python

story:
  title: Список из чата
  fictional: true
  text: >-
    В семейном чате у Игоря каждый дописывает покупки как умеет: «Молоко, хлеб», «  СЫР,яблоки »,
    а иногда и две запятые подряд. Перед походом в магазин Игорь вручную переписывал всё в
    аккуратную колонку: пропускал пустые пункты и приводил слова к одному виду. Небольшая
    программа делает то же за секунду: режет строку по запятым, чистит каждый кусок и собирает
    ровный список. Сегодня ты научишься так же превращать текст в список и обратно.

why: >-
  Текст от людей почти всегда «грязный»: лишние пробелы, разный регистр, всё в одной строке через
  запятую. Методы строк приводят его в порядок: из `"  Молоко, хлеб ,СЫР "` получается список
  `['молоко', 'хлеб', 'сыр']`.

usedIn: >-
  Обработка форм на сайтах: адрес почты приводят к маленьким буквам и обрезают пробелы по краям.
  Разбор строк таблиц и журналов, поиск по тексту, адреса страниц в блогах, чат-боты, которые
  разбирают команды из сообщения.

steps:
  - id: idea
    type: theory
    title: "Методы: действия, которые умеет строка"
    body: |-
      Методы ты уже встречал в уроке 4.2: `times.append(95)` и `times.remove(104)` — это методы
      списка. **Метод** — действие, которое умеет само значение. Его вызывают через точку: значение
      или переменная, точка, имя метода и скобки — `name.lower()`. У строк свои методы, вот главные:

      ```text
      # убрать пробелы по краям
      "  чай ".strip()            →  "чай"
      # все буквы маленькие / большие
      "Чай".lower()               →  "чай"
      "чай".upper()               →  "ЧАЙ"
      # заменить везде, где встречается
      "ёж".replace("ё", "е")      →  "еж"
      # разрезать по пробелам / по разделителю
      "чай  с мятой".split()      →  ['чай', 'с', 'мятой']
      "чай,сок".split(",")        →  ['чай', 'сок']
      # склеить список через разделитель
      ", ".join(["чай", "сок"])   →  "чай, сок"
      # в строке одни цифры?
      "42".isdigit()              →  True
      ```

      **Главное: метод строки не меняет строку.** Строку изменить нельзя — ты видел это в уроке 4.1.
      Поэтому `strip`, `lower`, `upper` и `replace` возвращают **новую строку**, а старая остаётся
      прежней. Если вызвать `name.strip()` отдельной командой, новая строка пропадёт. Чтобы её
      сохранить, присвой результат: `name = name.strip()`. Методы можно вызывать цепочкой: в
      `name.strip().lower()` сначала работает `strip()`, а `lower()` получает его результат.

      **У методов списка наоборот.** Список можно менять, поэтому `append` и `remove` меняют сам
      список и ничего не возвращают. Их пишут без присваивания: `items.append(x)`, а не
      `items = items.append(x)`. И вспомни урок 4.2: после `remove` все элементы правее удалённого
      сдвигаются на одно место влево. А `for` идёт по списку по номерам мест: 0, 1, 2… Это
      пригодится во второй практике.

      **split и join — мост между текстом и списком.** `split()` с пустыми скобками режет по
      любым пробелам и пустых кусков не оставляет. `split(" ")` режет по каждому пробелу, поэтому
      два пробела подряд дают пустую строку: `"a  b".split(" ")` → `['a', '', 'b']`. Так же
      `split(",")` оставляет пустой кусок между двумя запятыми подряд. `join` вызывают у
      разделителя, а список передают в скобках. Склеивает он только строки: числа сначала
      превращают через `str()`.

      `lower()` выручает при сравнении: «Томат» и «томат» из урока 4.2 — разные строки, а
      `"Томат".lower() == "томат"` даёт `True`. `isdigit()` пригодится для проверки ввода: для
      `"-5"` и `"4 2"` он даёт `False` — минус и пробел не цифры. А `in` работает и со строками:
      ищет кусок текста, `"лес" in "лесник"` → `True`.
    simpler: >-
      Метод — кнопка на значении. Нажал `strip()` — получил **новую**, почищенную строку, а старая
      осталась как была. Чтобы новую не потерять, положи её в переменную: `name = name.strip()`.
      А список `append` меняет сам, поэтому там пишут просто `items.append(x)`. `split` режет
      строку на список, `join` склеивает список обратно в строку.
    coach: >-
      Если после метода строки ничего не поменялось, первым делом проверь, сохранил ли ты результат.

  - id: shopping-line
    type: example
    title: Строка из чата — ровный список
    body: >-
      Сообщение из семейного чата: покупки через запятую, лишние пробелы, разный регистр. Программа
      режет строку, чистит каждый кусок и собирает результат обратно. Нажми «Запустить».
    code: |-
      line = "  Молоко, хлеб ,СЫР "
      parts = line.split(",")
      print(parts)
      items = []
      for part in parts:
          items.append(part.strip().lower())
      print(items)
      print(" / ".join(items))
    notes:
      - line: 2
        text: >-
          `split(",")` режет строку только там, где стоит запятая. Пробелы остались внутри кусков —
          их видно в первой строке вывода.
      - line: 3
        text: Так выглядит список на экране — в квадратных скобках, каждая строка в кавычках.
      - line: 6
        text: >-
          Два метода подряд: `strip()` убирает пробелы по краям, `lower()` делает буквы маленькими.
          Готовая строка сразу уходит в `append`, поэтому не теряется. Сам `append` пишется без
          присваивания: он меняет список `items`.
      - line: 8
        text: "`join` склеивает список обратно в одну строку, между пунктами ставит « / »."
    tryIt: >-
      Поменяй разделитель в `join` на `", "` и запусти снова. Потом поставь в строке две запятые
      подряд — `"  Молоко,, хлеб ,СЫР "` — и посмотри, что появится в списке: это пригодится во
      второй практике. И допиши отдельной строкой `print("42".isdigit(), "4 2".isdigit())`.
    coach: >-
      Обрати внимание: `line` после всех методов осталась прежней. `split` отдал новый список,
      `strip` и `lower` — новые строки, и мы их сохранили — в `parts` и в `items`.

  - id: method-predict
    type: predict
    title: Что сохранилось?
    prompt: >-
      Как думаешь, что выведет программа? Квадратные скобки в выводе нужны, чтобы были видны
      пробелы по краям.
    code: |-
      city = "  Казань  "
      city = city.strip()
      city.upper()
      print("[" + city + "]")
    options:
      - "[КАЗАНЬ]"
      - "[Казань]"
      - "[  Казань  ]"
      - "[  КАЗАНЬ  ]"
    answer: "[Казань]"
    explanation: >-
      `strip()` вернул новую строку без пробелов, и её присвоили обратно в `city` — пробелы ушли.
      `upper()` тоже вернул новую строку, `"КАЗАНЬ"`, но её никуда не сохранили, и она пропала.
      Поэтому буквы остались прежними. Чтобы получить `[КАЗАНЬ]`, нужно
      `city = city.upper()` — или сразу `city = city.strip().upper()`.
    coach: >-
      Это самая частая ошибка с методами строк. Программа не падает — просто ничего не меняется.

  - id: practice-expenses
    type: exercise
    title: Практика 1
    exercise:
      id: m4-l3-e1
      kind: repeat
      title: Траты за неделю
      statement: |-
        Игорь записывает траты семьи за неделю в одну строку через пробел. Иногда между числами
        случайно попадает несколько пробелов, а по краям строки — лишние пробелы. Напиши
        программу, которая складывает все траты и выводит итог:

        ```text
        Всего: 950
        ```

        Для ввода `120 450 80 300` сумма равна 950.
      input: Одна строка — траты целыми числами через пробел (пробелов может быть несколько).
      output: "Одна строка: `Всего: <сумма>`."
      constraints:
        - Во вводе хотя бы одна трата, все траты — целые неотрицательные числа.
        - Число трат заранее неизвестно.
      starterCode: |
        line = input()
        # Разрежь строку на отдельные траты и сложи их
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "120 450 80 300\n"
          compare:
            ignoreSpaces: true
          expected: "Всего: 950"
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "1500 250\n"
          compare:
            ignoreSpaces: true
          expected: "Всего: 1750"
        - id: t3
          kind: io
          title: "Граничный случай: одна трата"
          edge: true
          stdin: "700\n"
          compare:
            ignoreSpaces: true
          expected: "Всего: 700"
        - id: t4
          kind: io
          title: "Граничный случай: лишние пробелы"
          edge: true
          stdin: "  100   200  50 \n"
          compare:
            ignoreSpaces: true
          expected: "Всего: 350"
      criteria:
        - Строка разрезается на отдельные числа, и каждое превращается из текста в число.
        - "Выводится одна строка `Всего: <сумма>` после того, как сложены все траты."
        - Лишние пробелы между числами и по краям не ломают программу.
      hints:
        - >-
          Сначала строку нужно разрезать на кусочки, как строку покупок в примере. Но кусочки —
          всё ещё текст: `'120'`, а не 120. Что нужно сделать с каждым кусочком, прежде чем
          складывать? И какой способ резать не боится лишних пробелов?
        - >-
          На другом примере: `"3 4".split()` даёт список `['3', '4']`, а `int("3") + int("4")`
          даёт 7. Накопитель из модуля про циклы работает и с таким списком.
        - |-
          Каркас:
          ```text
          total = 0
          for part in line.split():
              total = …
          print(f"Всего: {…}")
          ```
      solution:
        code: |
          line = input()
          total = 0
          for part in line.split():
              total = total + int(part)
          print(f"Всего: {total}")
        explanation: >-
          `split()` с пустыми скобками режет строку по любым пробелам и выбрасывает пустые куски,
          поэтому лишние пробелы не мешают. Каждый кусок — строка вроде `'120'`, и `int(part)`
          превращает её в число. Накопитель `total` складывает все числа, а `print` стоит после
          цикла — итог выводится один раз. Можно собрать числа в список и сложить через `sum`.
      altSolutions:
        - code: |
            line = input()
            numbers = []
            for part in line.split():
                numbers.append(int(part))
            print(f"Всего: {sum(numbers)}")
          note: Список чисел и sum.
        - code: |
            line = input()
            total = 0
            for part in line.split(" "):
                if part != "":
                    total += int(part)
            print("Всего:", total)
          note: split(" ") с пропуском пустых кусков.
        - code: |
            parts = input().split()
            total = 0
            i = 0
            while i < len(parts):
                total = total + int(parts[i])
                i = i + 1
            print("Всего: " + str(total))
          note: while по индексам списка.
        - code: |
            total = 0
            for chunk in input().split(" "):
                if chunk.isdigit():
                    total = total + int(chunk)
            print("Всего:", total)
          note: split(" ") и отбор кусков через isdigit() из теории.
        - code: |
            spent = 0
            for word in input().strip().split():
                spent += int(word)
            text = "Всего: " + str(spent)
            print(text)
          note: strip перед split, +=, строка ответа собрана заранее.
        - code: |
            line = input() + " "
            total = 0
            number = ""
            for ch in line:
                if ch == " ":
                    if number != "":
                        total = total + int(number)
                        number = ""
                else:
                    number = number + ch
            print(f"Всего: {total}")
          note: Разбор по символам без split — число собирается из цифр.
        - code: |
            line = input()
            total = 0
            for part in line.split():
                total = total + int(part)
            print("Всего: ", total)
          note: Пробел в строке и запятая в print — два пробела подряд; формат пробелов не важен (ignoreSpaces).
      wrongSolutions:
        - code: |
            line = input()
            total = 0
            for part in line.split(" "):
                total = total + int(part)
            print(f"Всего: {total}")
          note: split(" ") оставляет пустые куски при двойных пробелах.
          expectMistake: split-space
        - code: |
            line = input()
            total = 0
            for part in line.strip().split(" "):
                total = total + int(part)
            print(f"Всего: {total}")
          note: strip по краям есть, но split(" ") всё равно оставляет пустые куски внутри.
          expectMistake: split-space
        - code: |
            line = input()
            total = 0
            for part in line.split():
                total = total + part
            print(f"Всего: {total}")
          note: Кусок не превращён в число.
          expectMistake: forgot-int
        - code: |
            line = input()
            print(f"Всего: {sum(line.split())}")
          note: sum по кускам-строкам без int.
          expectMistake: forgot-int
        - code: |
            line = input()
            print(f"Всего: {sum(int(line.split()))}")
          note: int() от всего списка кусков.
          expectMistake: int-of-list
        - code: |
            parts = input().split()
            total = int(parts)
            print(f"Всего: {total}")
          note: int() от списка без цикла.
          expectMistake: int-of-list
        - code: |
            line = input()
            numbers = []
            for part in line.split():
                numbers = numbers.append(int(part))
            print(f"Всего: {sum(numbers)}")
          note: Результат append присвоен — в numbers оказывается None.
          expectMistake: list-method-assigned
        - code: |
            line = input()
            total = 0
            for part in line:
                total = total + int(part)
            print(f"Всего: {total}")
          note: Цикл по символам строки, а не по кускам между пробелами.
          expectMistake: chars-loop
        - code: |
            line = input()
            total = 0
            for ch in line:
                if ch != " ":
                    total = total + int(ch)
            print(f"Всего: {total}")
          note: Цикл по символам, пробелы отсеяны — складываются цифры.
          expectMistake: digits-summed
        - code: |
            line = input()
            total = int(line)
            print(f"Всего: {total}")
          note: int() от всей строки целиком.
          expectMistake: whole-line
        - code: |
            line = input()
            total = 0
            for part in line.split(","):
                total = total + int(part)
            print(f"Всего: {total}")
          note: split(",") по привычке из примера — кусок один, вся строка.
          expectMistake: whole-line
        - code: |
            line = input()
            for part in line.split():
                total = 0
                total = total + int(part)
            print(f"Всего: {total}")
          note: Накопитель обнуляется на каждом шаге.
          expectMistake: reset-in-loop
        - code: |
            line = input()
            total = 0
            for part in line.split():
                total = int(part)
            print(f"Всего: {total}")
          note: Присваивание вместо прибавления, total = 0 стоит верно — выше цикла.
          expectMistake: replaced-not-added
        - code: |
            line = input()
            total = 0
            for part in line.split():
                total =+ int(part)
            print(f"Всего: {total}")
          note: Опечатка =+ вместо += (это total = +int(part)).
          expectMistake: replaced-not-added
        - code: |
            line = input()
            total = ""
            for part in line.split():
                total = total + part
            print(f"Всего: {total}")
          note: Накопитель-строка — куски склеиваются.
          expectMistake: glued-strings
        - code: |
            line = input()
            total = 0
            for part in line.split():
                total = total + int(part)
                print(f"Всего: {total}")
          note: print внутри цикла.
          expectMistake: print-in-loop
        - code: |
            line = input()
            total = 0
            for part in line.split():
                total = total + int(part)
            print("Всего: " + total)
          note: Склейка строки с числом — общий разбор TypeError точен.
          expectMistake: null
        - code: |
            parts = input().split()
            total = 0
            for i in range(len(parts) - 1):
                total = total + int(parts[i])
            print(f"Всего: {total}")
          note: range(len(parts) - 1) — последняя трата не сложена; общий разбор «другое число».
          expectMistake: null
      mistakes:
        - id: list-method-assigned
          when:
            errorIncludes: NoneType
          why: >-
            У методов списка всё наоборот: `append` меняет сам список и ничего не возвращает.
            После `numbers = numbers.append(...)` в переменной лежит `None` — «ничего», и списка в
            ней больше нет.
          try: 'Вызывай `append` отдельной командой, без присваивания: `numbers.append(int(part))`.'
          verify: "В «Примере 1» должно получиться `Всего: 950`."
        - id: int-of-list
          when:
            errorIncludes: "not 'list'"
          why: >-
            `int()` превращает в число одну строку, а получил целый список кусков из `split()`.
          try: Пройди по списку циклом и превращай в число каждый кусок отдельно — `int(part)`.
          verify: "В «Примере 1» должно получиться `Всего: 950`."
        - id: split-space
          when:
            errorIncludes: "base 10: ''"
          why: >-
            `int('')` — попытка превратить в число пустую строку. Она появилась из `split(" ")`:
            он режет по каждому пробелу, и между двумя пробелами подряд остаётся пустой кусок.
          try: >-
            Вызови `split()` с пустыми скобками — он режет по любому числу пробелов и пустых кусков
            не оставляет.
          verify: "Тест «Граничный случай: лишние пробелы» должен дать `Всего: 350`."
        - id: chars-loop
          when:
            errorIncludes: "base 10: ' '"
          why: >-
            Цикл `for` по строке перебирает её символы по одному: `'1'`, `'2'`, `'0'`, пробел…
            Пробел в число не превращается. А складывать нужно не цифры, а числа между пробелами.
          try: >-
            Сначала разрежь строку через `split()` и перебирай в цикле уже получившийся список
            кусков.
          verify: "В «Примере 1» должно получиться `Всего: 950`."
        - id: whole-line
          when:
            errorType: ValueError
          why: >-
            В `int()` попала строка, в которой несколько чисел через пробел. `int()` умеет
            превращать только одно число, поэтому строку сначала нужно разрезать на куски.
          try: >-
            Разрежь строку через `split()` с пустыми скобками — по пробелам — и превращай в число
            каждый кусок отдельно.
          verify: "В «Примере 1» должно получиться `Всего: 950`."
        - id: forgot-int
          when:
            errorIncludes: unsupported operand
          why: >-
            Куски после `split()` — строки: `'120'`, а не 120. Сложить число со строкой Python не
            может, отсюда `TypeError`. С `sum()` то же самое: он тоже прибавляет куски к нулю по
            одному.
          try: Преврати каждый кусок в число через `int()`, прежде чем прибавлять его к сумме.
          verify: "В «Примере 1» должно получиться `Всего: 950`."
        - id: reset-in-loop
          when:
            outputEquals: "Всего: 300"
            codeRegex: '^[ \t]+\w+\s*=\s*0[ \t]*$'
          why: >-
            В итоге только последняя трата: `total = 0` стоит внутри цикла, и на каждом шаге сумма
            начинается заново.
          try: Перенеси `total = 0` выше цикла — сумма должна начинаться с нуля один раз.
          verify: "В «Примере 1» должно получиться `Всего: 950`."
        - id: replaced-not-added
          when:
            outputEquals: "Всего: 300"
          why: >-
            В итоге только последняя трата: на каждом шаге в `total` кладётся текущее число, а
            накопленное пропадает. Так выходит с `total = int(part)` и с опечаткой `total =+ …`
            вместо `+=`.
          try: 'Прибавляй к накопленному: `total = total + int(part)` или `total += int(part)`.'
          verify: "В «Примере 1» должно получиться `Всего: 950`."
        - id: digits-summed
          when:
            outputEquals: "Всего: 23"
          why: >-
            Сложились цифры, а не числа: `for` по строке перебирает символы, и из `120` получается
            1 + 2 + 0. Пробелы ты пропустил, но числа при этом распались на цифры.
          try: >-
            Сначала разрежь строку через `split()` и перебирай в цикле уже получившийся список
            кусков.
          verify: "В «Примере 1» должно получиться `Всего: 950`."
        - id: glued-strings
          when:
            outputEquals: "Всего: 12045080300"
          why: >-
            Куски склеились, а не сложились: `total` — строка, а `+` между строками их склеивает.
          try: Начни с `total = 0` и прибавляй `int(part)` — тогда `+` будет складывать числа.
          verify: "В «Примере 1» должно получиться `Всего: 950`."
        - id: print-in-loop
          when:
            outputIncludes: "Всего: 120\n"
          why: >-
            Итог печатается на каждом шаге цикла: `print` стоит внутри `for`, поэтому видны все
            промежуточные суммы.
          try: Убери отступ у `print`, чтобы он выполнился один раз — после цикла.
          verify: "В «Примере 1» должна остаться одна строка `Всего: 950`."
      afterPass: >-
        Числа в одной строке через пробел — частый формат ввода, этот приём пригодится ещё не раз.
        Если захочешь, собери числа в список и выведи ещё и самую большую трату через `max`.
      skills: [string-methods, lists, accumulators, type-conversion]

  - id: practice-empty
    type: exercise
    title: Практика 2
    exercise:
      id: m4-l3-e2
      kind: fix
      title: Пустые пункты в списке
      statement: |-
        Игорь написал программу: она получает покупки из чата одной строкой через запятую и должна
        выбрасывать пустые пункты. Пустые пункты получаются, когда запятые стоят подряд, в начале
        или в конце строки: `"молоко,,хлеб".split(",")` даёт `['молоко', '', 'хлеб']`.

        На вводе `молоко,,хлеб` программа работает верно. А на `молоко,,,хлеб,сыр` выводит
        `молоко, , хлеб, сыр` — один пустой пункт остался. Найди причину и исправь программу.

        Пункты выводятся через запятую с пробелом, в том же порядке, что во вводе:

        ```text
        молоко, хлеб, сыр
        ```

        Если пунктов не осталось совсем, программа выводит `Список пуст`.
      input: >-
        Одна строка — покупки через запятую, без пробелов. Запятые могут идти подряд, стоять в
        начале и в конце строки.
      output: >-
        Непустые пункты через `, ` или `Список пуст`. Повторы остаются: убираются только пустые
        пункты.
      constraints:
        - Пробелов вокруг запятых во вводе нет.
        - Порядок покупок — как во вводе.
      starterCode: |
        parts = input().split(",")
        for part in parts:
            if part == "":
                parts.remove(part)
        if len(parts) == 0:
            print("Список пуст")
        else:
            print(", ".join(parts))
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "молоко,,хлеб\n"
          expected: молоко, хлеб
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "молоко,,,хлеб,сыр\n"
          expected: молоко, хлеб, сыр
        - id: t3
          kind: io
          title: "Граничный случай: один пункт"
          edge: true
          stdin: "хлеб\n"
          expected: хлеб
        - id: t4
          kind: io
          title: "Граничный случай: одни запятые"
          edge: true
          stdin: ",,,\n"
          expected: Список пуст
        - id: t5
          kind: io
          title: "Граничный случай: много пустых подряд и запятая в конце"
          edge: true
          stdin: "яйца,,,,соль,\n"
          expected: яйца, соль
        - id: t6
          kind: io
          title: "Граничный случай: пустая строка"
          edge: true
          stdin: "\n"
          expected: Список пуст
        - id: t7
          kind: io
          title: "Граничный случай: запятая в начале и повтор"
          edge: true
          stdin: ",хлеб,,сыр,хлеб\n"
          expected: хлеб, сыр, хлеб
        - id: t8
          kind: io
          title: "Граничный случай: длинная цепочка запятых"
          edge: true
          stdin: "хлеб,,,,,,,,,соль\n"
          expected: хлеб, соль
      criteria:
        - Пустые пункты убираются при любом их числе подряд, в начале и в конце строки.
        - Непустые пункты выводятся в порядке ввода через запятую с пробелом, повторы остаются.
        - Если пунктов нет, выводится `Список пуст`.
        - Во время перебора `for` из того же списка ничего не удаляется.
      hints:
        - >-
          Пройди цикл по шагам на вводе из «Примера 2». Выпиши список `parts` и подпиши номера мест
          под элементами. Что стоит на каждом месте до `remove` и после? На какой номер цикл
          переходит дальше?
        - |-
          Похожая задача: из списка чисел оставить только положительные. Их не удаляют на ходу, а
          собирают заново:
          ```python
          good = []
          for x in numbers:
              if x > 0:
                  good.append(x)
          ```
        - |-
          Каркас:
          ```text
          items = []
          для каждого part из parts:
              если part не пустая строка — добавить её в items
          если в items ничего нет — вывести «Список пуст»
          иначе — вывести items через ", "
          ```
      solution:
        code: |
          parts = input().split(",")
          items = []
          for part in parts:
              if part != "":
                  items.append(part)
          if len(items) == 0:
              print("Список пуст")
          else:
              print(", ".join(items))
        explanation: >-
          Цикл `for` шагает по номерам мест: 0, 1, 2… Когда `remove` убирает пустую строку, всё,
          что правее, сдвигается на одно место влево, и цикл перескакивает через элемент, вставший
          на место удалённого. Если это тоже пустая строка, она остаётся в списке. Новый список
          `items` решает проблему: по `parts` цикл только читает, а в `items` попадают только
          непустые пункты. Проверять на пустоту нужно тоже новый список.
