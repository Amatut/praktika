            codeRegex: '^(?<!\bwhile\b[\s\S]*)[^\n]*replace\(\s*["''],,'
          why: >-
            Замена двух запятых на одну лечит признак, а не причину: из `",,,"` получается `",,"`, и
            пустые пункты снова появляются. Причина — в том, как убираются пустые куски: `remove`
            внутри `for` по тому же списку пропускает элементы.
          try: >-
            Убери `replace` и не удаляй ничего из `parts` внутри `for`: собери непустые пункты в
            новый список.
          verify: "Тест «Граничный случай: одни запятые» должен дать `Список пуст`."
        - id: edge-commas
          when:
            codeRegex: 'replace\(\s*["''],,'
          why: >-
            Замена `,,` на `,` убирает пустые пункты только между покупками. Запятая в начале или в
            конце строки всё равно даёт пустой кусок: `",хлеб".split(",")` — это `['', 'хлеб']`,
            а `",".split(",")` — `['', '']`.
          try: >-
            Не чини строку, а отбирай пункты: собери в новый список только непустые, а `replace`
            убери.
          verify: "Все граничные случаи должны пройти, в том числе «запятая в начале и повтор»."
        - id: remove-once
          when:
            outputIncludes: ", , "
            codeRegex: '(?<![\s\S])(?![\s\S]*\b(?:for|while)\b)'
          why: >-
            `remove("")` убирает только первую пустую строку. Когда запятых подряд три, пустых
            кусков два, и второй остаётся.
          try: >-
            Нужно убрать все пустые строки: пройди циклом по `parts` и собери непустые пункты в
            новый список.
          verify: "В «Примере 2» должно получиться `молоко, хлеб, сыр`."
        - id: skipped-empty
          when:
            codeRegex: '\b(?:for\s+\w+\s+in\s+(?:parts|range\(\s*len\(\s*parts\s*\)\s*\))|while\s+\w+\s*<\s*len\(\s*parts\s*\))\s*:[\s\S]*\bparts\.remove\('
          why: >-
            Цикл шагает по номерам мест. После `remove` элементы правее сдвигаются влево, и тот,
            что встал на место удалённого, цикл пропускает: это место он уже прошёл. Если два
            пустых куска стоят рядом (три запятые подряд или две в начале строки), второй остаётся
            в списке. А если в том же цикле собирать покупки в новый список, пропущенная покупка
            в него не попадёт.
          try: >-
            Не удаляй из `parts` на ходу. Заведи новый пустой список и добавляй в него только
            непустые пункты.
          verify: Все тесты должны пройти, в том числе «одни запятые» и «длинная цепочка запятых».
        - id: old-list-check
          when:
            failedTest: t4
            outputEquals: ""
            codeRegex: 'len\(\s*parts\s*\)'
            codeIncludes: .append(
          why: >-
            Новый список собран верно, но на пустоту проверяется старый: в `parts` остались пустые
            строки, поэтому его длина не ноль, и вместо `Список пуст` печатается пустая строка.
          try: Проверяй длину нового списка — того, в который собраны непустые пункты.
          verify: "Тест «Граничный случай: одни запятые» должен дать `Список пуст`."
        - id: kept-empty
          when:
            failedTest: t1
            outputEquals: ""
            codeIncludes: '== ""'
          why: >-
            Программа печатает пустую строку: в новый список попали как раз пустые пункты. Условие
            `== ""` осталось от старого кода, где оно выбирало, что удалить.
          try: Добавляй пункт в новый список, только если он **не** пустой — `!= ""`.
          verify: "В «Примере 1» должно получиться `молоко, хлеб`."
        - id: no-empty-branch
          when:
            outputEquals: ""
            codeRegex: '^(?<!Список пуст[\s\S]*)(?![\s\S]*Список пуст)[ \t]*print\([^\n]*join'
          why: >-
            Когда непустых пунктов нет, программа печатает пустую строку: `join` пустого списка
            даёт `""`. Отдельной ветки для этого случая в программе нет.
          try: >-
            Перед выводом проверь длину списка с пунктами: если она 0 — выведи `Список пуст`,
            иначе — пункты через `join`.
          verify: "Тест «Граничный случай: одни запятые» должен дать `Список пуст`."
        - id: join-old-list
          when:
            outputIncludes: ", , "
            codeRegex: 'join\(\s*parts\s*\)'
            codeIncludes: .append(
          why: >-
            Непустые пункты отобраны верно, но на экран уходит старый список: в `join` передан
            `parts`, а в нём пустые строки остались.
          try: Передай в `join` новый список — тот, в который собраны непустые пункты.
          verify: "В «Примере 1» должно получиться `молоко, хлеб`."
        - id: join-no-space
          when:
            outputEquals: молоко,хлеб
          why: >-
            Пункты склеены через запятую без пробела: разделитель в `join` — это строка перед
            точкой, и в ней не хватает пробела.
          try: 'Сделай разделитель из двух символов — запятой и пробела: `", ".join(...)`.'
          verify: "В «Примере 1» должно получиться `молоко, хлеб`."
        - id: printed-list
          when:
            outputIncludes: "['"
          why: >-
            На экран попал сам список — в квадратных скобках и с кавычками. А нужна одна строка из
            пунктов.
          try: 'Склей список в строку через `", ".join(...)` и выведи её.'
          verify: "В «Примере 1» должно получиться `молоко, хлеб`."
        - id: empty-left
          when:
            outputIncludes: ", , "
          why: >-
            В выводе остался пустой пункт: между двумя запятыми ничего нет. Значит, пустая строка
            прошла проверку и попала в результат.
          try: >-
            Проверь условие отбора. Пустая строка — это `""`: две кавычки подряд, без пробела
            между ними. В результат должны попадать только пункты, которые не равны `""`.
          verify: "В «Примере 1» должно получиться `молоко, хлеб`."
      afterPass: >-
        Ошибка пряталась: пока пустые куски стояли поодиночке, всё работало, и на первом примере
        её не видно. Поэтому в проверках нужны граничные случаи вроде «много пустых подряд». Если
        захочешь, добавь `strip()` для каждого пункта — тогда программа справится и с пробелами
        вокруг запятых.
      skills: [lists, string-methods]

  - id: practice-slug
    type: exercise
    title: Практика 3
    exercise:
      id: m4-l3-e3
      kind: write
      title: Адрес статьи
      statement: |-
        В блоге адрес каждой статьи строится из её заголовка. Правила такие:

        - все буквы маленькие;
        - буква «ё» заменяется на «е» — и маленькая, и заглавная;
        - слова соединяются дефисом `-`;
        - лишние пробелы по краям и между словами не учитываются.

        Например, заголовок `Ещё один поход` превращается в адрес:

        ```text
        еще-один-поход
        ```

        Напиши программу, которая получает заголовок и выводит адрес.
      input: Одна строка — заголовок из русских слов через пробелы (пробелов может быть несколько).
      output: Одна строка — адрес статьи.
      constraints:
        - В заголовке хотя бы одно слово.
        - Знаков препинания в заголовке нет — только буквы и пробелы.
      starterCode: |
        title = input()
        # Преврати заголовок в адрес и выведи его
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "Как я пробежал марафон\n"
          expected: как-я-пробежал-марафон
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "  Ещё   один поход \n"
          expected: еще-один-поход
        - id: t3
          kind: io
          title: "Граничный случай: заглавная Ё"
          edge: true
          stdin: "Ёжик в тумане\n"
          expected: ежик-в-тумане
        - id: t4
          kind: io
          title: "Граничный случай: одно слово"
          edge: true
          stdin: "Привет\n"
          expected: привет
        - id: t5
          kind: io
          title: "Граничный случай: всё заглавными"
          edge: true
          stdin: "ЁЛКИ ЗЕЛЁНЫЕ\n"
          expected: елки-зеленые
      criteria:
        - Все буквы в адресе маленькие, «ё» и «Ё» заменены на «е».
        - Слова соединены одним дефисом, без дефисов по краям.
        - Лишние пробелы в заголовке не дают лишних дефисов.
      hints:
        - >-
          Разбей работу на четыре действия: регистр, замена буквы, слова, склейка. Подумай, в каком
          порядке их делать, — особенно чтобы не пропустить заглавную «Ё».
        - >-
          На другом примере: `"  Утро  доброе ".split()` даёт `['Утро', 'доброе']`, а
          `"_".join(["утро", "доброе"])` — строку `утро_доброе`.
        - |-
          Каркас:
          ```text
          title = input()
          title = title.lower()
          title = title.replace(…, …)
          words = …split()
          print("-".join(…))
          ```
      solution:
        code: |
          title = input()
          title = title.lower().replace("ё", "е")
          words = title.split()
          print("-".join(words))
        explanation: >-
          Порядок важен: сначала `lower()` превращает заглавную «Ё» в маленькую, и тогда один
          `replace("ё", "е")` меняет все буквы «ё» сразу. Результат каждого метода сохраняется в
          `title`. `split()` с пустыми скобками разрезает заголовок на слова и не оставляет пустых
          кусков от лишних пробелов, а `"-".join(words)` склеивает слова через дефис.
      altSolutions:
        - code: |
            title = input()
            title = title.replace("Ё", "Е").replace("ё", "е").lower()
            print("-".join(title.split()))
          note: Обе буквы заменены до lower.
        - code: |
            words = input().split()
            result = []
            for word in words:
                result.append(word.lower().replace("ё", "е"))
            print("-".join(result))
          note: Каждое слово чистится отдельно в цикле.
        - code: |
            words = input().lower().replace("ё", "е").split()
            slug = words[0]
            for word in words[1:]:
                slug = slug + "-" + word
            print(slug)
          note: Склейка накопителем без join.
        - code: |
            print("-".join(input().lower().replace("ё", "е").split()))
          note: Всё одной строкой.
        - code: |
            title = input()
            print("-".join(title.split()).lower().replace("ё", "е"))
          note: Сначала склейка, потом регистр и замена.
        - code: |
            name = input().upper().replace("Ё", "Е").lower()
            parts = name.split()
            print(f"{'-'.join(parts)}")
          note: upper → замена заглавной Ё → lower, join внутри f-строки.
        - code: |
            slug = input().strip().lower().replace("ё", "е").replace(" ", "-")
            while "--" in slug:
                slug = slug.replace("--", "-")
            print(slug)
          note: Пробелы → дефисы, двойные дефисы сжимаются в while.
        - code: |
            title = input()
            title.strip()
            title = title.lower().replace("ё", "е")
            print("-".join(title.split()))
          note: Лишний безвредный title.strip() без присваивания — split() и так отбросит пробелы.
      wrongSolutions:
        - code: |
            title = input()
            title.lower()
            title = title.replace("ё", "е")
            words = title.split()
            print("-".join(words))
          note: Результат lower() не сохранён.
          expectMistake: not-saved
        - code: |
            title = input()

            title.lower()
            title = title.replace("ё", "е")
            print("-".join(title.split()))
          note: Как предыдущее, но перед строкой с lower() пустая строка (проверка подсветки).
          expectMistake: not-saved
        - code: |
            title = input()
            title = title.lower()
            title.replace("ё", "е")
            print("-".join(title.split()))
          note: Не сохранён результат replace (а lower сохранён).
          expectMistake: not-saved
        - code: |
            title = input()
            title = title.lower().replace("ё", "е")
            title.split()
            print("-".join(title))
          note: Результат split() не сохранён.
          expectMistake: not-saved
        - code: |
            title = input()
            title = title.lower
            words = title.split()
            print("-".join(words))
          note: lower без скобок.
          expectMistake: no-parens
        - code: |
            title = input()
            title = title.lower().replace("ё", "e")
            print("-".join(title.split()))
          note: В replace латинская e вместо русской е.
          expectMistake: latin-e
        - code: |
            words = input().split()
            result = []
            for word in words:
                result = result.append(word.lower().replace("ё", "е"))
            print("-".join(result))
          note: Результат append присвоен — в result оказывается None.
          expectMistake: list-method-assigned
        - code: |
            title = input()
            words = title.split()
            for word in words:
                word = word.lower().replace("ё", "е")
            print("-".join(words))
          note: Меняется переменная цикла, а список words остаётся прежним.
          expectMistake: loop-var
        - code: |
            title = input()
            title = title.replace("ё", "е").lower()
            words = title.split()
            print("-".join(words))
          note: Замена до lower — заглавная Ё остаётся буквой ё.
          expectMistake: yo-order
        - code: |
            title = input()
            title = title.lower()
            words = title.split()
            print("-".join(words))
          note: Буква ё не заменена.
          expectMistake: no-yo
        - code: |
            title = input().replace("Ё", "Е").lower()
            print("-".join(title.split()))
          note: Заменена только заглавная Ё.
          expectMistake: no-yo
        - code: |
            title = input()
            title = title.strip().lower().replace("ё", "е")
            print(title.replace(" ", "-"))
          note: Пробелы заменены на дефисы один к одному.
          expectMistake: double-dash
        - code: |
            title = input().strip().lower().replace("ё", "е")
            print("-".join(title.split(" ")))
          note: strip + split(" ") — лишние пробелы между словами дают дефисы подряд.
          expectMistake: double-dash
        - code: |
            title = input()
            title = title.lower().replace("ё", "е")
            print("-".join(title))
          note: join по строке склеивает буквы, а не слова.
          expectMistake: join-string
        - code: |
            title = input()
            title = title.lower().replace("ё", "е")
            words = title.split()
            print(" ".join(words))
          note: Слова склеены пробелом.
          expectMistake: space-join
        - code: |
            title = input()
            title.strip()
            title = title.lower().replace("ё", "е")
            print(" ".join(title.split()))
          note: Лишний безвредный title.strip() и склейка пробелом — разбор про пробел, а не про strip.
          expectMistake: space-join
        - code: |
            words = input().lower().replace("ё", "е").split()
            slug = ""
            for word in words:
                slug = slug + word + "-"
            print(slug)
          note: Накопитель дописывает дефис после каждого слова — лишний в конце; общий разбор.
          expectMistake: null
        - code: |
            title = input()
            title = title.replace("ё", "е").replace("Ё", "Е")
            print("-".join(title.split()))
          note: Забыт lower — общий разбор «отличие только в регистре» точен.
          expectMistake: null
      mistakes:
        - id: latin-e
          when:
            codeRegex: 'replace\(\s*["''][ёЁ]["'']\s*,\s*["''][eE]["'']'
          why: >-
            В `replace` вторая буква — латинская `e`. На экране она выглядит как русская «е», но
            это другая буква, поэтому адрес не совпадает с ожидаемым, хотя кажется таким же.
          try: Сотри эту букву и набери её заново в русской раскладке.
          verify: "В «Примере 2» должно получиться `еще-один-поход`."
        - id: list-method-assigned
          when:
            errorIncludes: NoneType
          why: >-
            У методов списка всё наоборот: `append` меняет сам список и ничего не возвращает.
            После `result = result.append(...)` в переменной лежит `None` — «ничего», и списка в
            ней больше нет.
          try: 'Вызывай `append` отдельной командой, без присваивания: `result.append(...)`.'
          verify: "В «Примере 1» должно получиться `как-я-пробежал-марафон`."
        - id: no-parens
          when:
            errorIncludes: builtin_function_or_method
          why: >-
            После имени метода нет скобок. `title.lower` — это сам метод, а не его результат:
            метод срабатывает, только когда его вызывают со скобками.
          try: 'Допиши скобки: `title = title.lower()`.'
          verify: "В «Примере 1» должно получиться `как-я-пробежал-марафон`."
        - id: not-saved
          when:
            codeRegex: '^[ \t]*[A-Za-z_]\w*(?=[^\n]*\.(?:lower|replace|split)\()(?:\.(?:lower|upper|strip|replace|split)\([^)]*\))+[ \t]*$'
          where: Строка, где метод вызван, но результат никуда не присвоен
          why: >-
            Метод вернул новое значение, но его не сохранили, и оно пропало. Строки не меняются,
            поэтому `title` остался прежним.
          try: >-
            Присвой результат в той же строке: `title = title.lower()`,
            `title = title.replace("ё", "е")`, `words = title.split()`.
          verify: "Все примеры должны пройти: в «Примере 2» — `еще-один-поход`."
        - id: loop-var
          when:
            outputEquals: Как-я-пробежал-марафон
            codeRegex: '^[ \t]*for\s+(\w+)\s+in\b[\s\S]*^[ \t]+\1\s*=\s*\1\.'
          why: >-
            `word = word.lower()` меняет только переменную цикла. В списке `words` остались
            прежние строки, и `join` склеил их.
          try: >-
            Собери почищенные слова в новый список через `append` — или почисти весь заголовок
            до `split()`.
          verify: "В «Примере 1» должно получиться `как-я-пробежал-марафон`."
        - id: yo-order
          when:
            outputIncludes: ёжик
          why: >-
            Заглавная «Ё» не заменилась. `replace("ё", "е")` сработал раньше `lower()` и искал
            только маленькую «ё». Заглавная превратилась в маленькую уже после замены.
          try: Поменяй порядок — сначала `lower()`, потом `replace`. Или замени обе буквы, «Ё» и «ё».
          verify: "Тест «Граничный случай: заглавная Ё» должен дать `ежик-в-тумане`."
        - id: no-yo
          when:
            outputIncludes: ё
          why: В адресе осталась буква «ё», а по правилам её заменяют на «е».
          try: Добавь `replace("ё", "е")` после `lower()` и сохрани результат.
          verify: "В «Примере 2» должно получиться `еще-один-поход`."
        - id: double-dash
          when:
            outputIncludes: "--"
          why: >-
            В адресе дефисы идут подряд: каждый пробел превратился в дефис, в том числе лишние.
            Так бывает с `replace(" ", "-")` и с `split(" ")`.
          try: >-
            Разрежь заголовок на слова через `split()` с пустыми скобками — он не боится лишних
            пробелов — и склей слова через `"-".join(...)`.
          verify: "В «Примере 2» должно получиться `еще-один-поход`."
        - id: join-string
          when:
            outputIncludes: "- -"
          why: >-
            `join` получил не список слов, а целую строку — и склеил её по буквам: между каждыми
            двумя символами встал дефис.
          try: Сначала разрежь заголовок на слова через `split()`, а в `join` передай этот список.
          verify: "В «Примере 1» должно получиться `как-я-пробежал-марафон`."
        - id: space-join
          when:
            outputEquals: как я пробежал марафон
          why: Слова разделены пробелом, а в адресе между ними нужен дефис.
          try: 'Склей слова через `"-".join(...)`: разделитель — строка, у которой вызывают join.'
          verify: "В «Примере 1» должно получиться `как-я-пробежал-марафон`."
      afterPass: >-
        Заголовок любой длины превращается в аккуратный адрес. Следующим шагом можно убрать из
        заголовка знаки `!` и `?` — тем же `replace`, заменив их на пустую строку.
      skills: [string-methods, lists]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Методы строк не меняют строку: `strip`, `lower`, `upper` и `replace` возвращают **новую** строку, а `split` — список. Чтобы результат не пропал, присвой его: `s = s.strip()`."
      - "Методы списка `append` и `remove` меняют сам список и ничего не возвращают — их пишут без присваивания: `items.append(x)`."
      - "`split()` превращает строку в список, `\"-\".join(список)` — список в строку. `split()` с пустыми скобками не боится лишних пробелов, а `split(\" \")` и `split(\",\")` оставляют пустые куски."
      - Из списка, по которому идёт цикл, не удаляют — собирают новый список.
    question: Почему пишут `city = city.strip()`, но просто `items.append(x)`, без `items =`?
    answer: >-
      Строку изменить нельзя, поэтому `strip()` возвращает новую строку, и её нужно сохранить,
      иначе она пропадёт. А список меняется на месте: `append` добавляет элемент в сам список и
      ничего не возвращает. После `items = items.append(x)` в `items` оказалось бы `None` —
      «ничего», и список бы потерялся.
