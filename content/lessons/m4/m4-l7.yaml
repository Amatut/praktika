                        seen.add(tag)
                        tags.append(tag)
            if len(tags) > 0:
                print("Теги: " + ", ".join(tags))
            else:
                print("Тегов нет")
          note: Множество «уже видели» и список для порядка; срез word[:1] вместо word[0].
