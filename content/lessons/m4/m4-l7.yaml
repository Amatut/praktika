      mistakes:
        - id: key-error
          when:
            errorType: KeyError
          why: >-
            При первой встрече слова его ещё нет в словаре. Прочитать `counts[word]`, чтобы
            прибавить к нему 1, нельзя — отсюда KeyError.
          try: >-
            Начинай счёт с запасного значения: `counts[word] = counts.get(word, 0) + 1`. Или сначала
            проверь `if word in counts:` и для нового слова запиши 1.
          verify: В «Примере 1» программа не должна падать.
        - id: get-no-default
          when:
            errorIncludes: NoneType
          why: >-
            При первой встрече слова его ещё нет в словаре, и `counts.get(word)` без второго значения
            в скобках возвращает `None` — «ничего». Прибавить 1 к «ничего» нельзя, отсюда TypeError.
          try: 'Укажи в `get` запасное значение — ноль: `counts.get(word, 0) + 1`.'
          verify: В «Примере 1» программа не должна падать.
        - id: not-saved
          when:
            codeRegex: '^[ \t]*[A-Za-z_]\w*(?=[^\n]*\.(?:lower|replace)\()(?:\.(?:lower|upper|strip|replace)\([^)]*\))+[ \t]*$'
          where: Строка, где метод вызван, но результат никуда не сохранён
          why: >-
            Метод не меняет строку, а возвращает новую. Её никуда не сохранили, и она пропала, а
            переменная осталась прежней — с большими буквами или со знаками.
          try: 'Присвой результат той же переменной: `text = text.lower()`, `text = text.replace(mark, "")`.'
          verify: "В «Примере 1» должны получиться строки `очень: 2` и `вечер: 2`."
        - id: split-space
          when:
            failedTest: t5
            codeRegex: 'split\(\s*["''] ["'']\s*\)'
          why: >-
            `split(" ")` режет по каждому пробелу, и там, где пробелов несколько подряд, появляются
            пустые «слова» — строки `''`. Словарь считает их как обычное слово.
          try: Вызови `split()` с пустыми скобками — он режет по любому числу пробелов.
          verify: "Тест «Граничный случай: лишние пробелы» должен дать `много: 2`."
        - id: no-lower
          when:
            failedTest: t1
            codeRegex: '(?<![\s\S])(?![\s\S]*\.lower\()'
            codeIncludes: print(
          where: Подготовка текста — до подсчёта
          why: >-
            Регистр не приведён к одному виду. Для словаря «Вечер» и «вечер» — разные слова, поэтому
            повторы теряются. К тому же в выводе слова нужны маленькими буквами.
          try: 'Приведи текст к маленьким буквам до подсчёта и сохрани результат: `text = text.lower()`.'
          verify: "В «Примере 1» должны получиться строки `очень: 2` и `вечер: 2`."
        - id: no-repeats-found
          when:
            failedTest: t1
            outputEquals: Повторов нет
          why: >-
            В «Примере 1» повторы есть — «очень» и «вечер» встречаются по два раза, — а программа их
            не нашла. Причин может быть несколько: счётчики не растут, словарь создаётся заново
            внутри цикла, одно слово попадает в словарь в разном виде или условие вывода не
            пропускает повторы.
          try: >-
            Временно допиши `print(counts)` после цикла подсчёта и нажми «Запустить». Если у всех
            слов 1 или в словаре одно слово — проверь строку подсчёта
            (`counts[word] = counts.get(word, 0) + 1`) и что `counts = {}` стоит до цикла. Если
            числа верные — проверь условие вывода: нужны слова, которые встретились больше одного
            раза.
          verify: >-
            Убери отладочный `print`. В «Примере 1» должны получиться строки `очень: 2` и
            `вечер: 2`.
        - id: message-when-found
          when:
            failedTest: t1
            outputIncludes: Повторов нет
          why: >-
            `Повторов нет` напечатано, хотя повторы нашлись. Это сообщение нужно один раз — после
            цикла и только если ни одного повтора не было.
          try: >-
            Заведи до цикла флаг `found = False`. Когда выводишь повтор, ставь `found = True`. После
            цикла проверь флаг и только тогда печатай `Повторов нет`.
          verify: "В «Примере 1» должно быть ровно две строки: `очень: 2` и `вечер: 2`."
        - id: count-condition
          when:
            failedTest: t2
            outputEquals: Повторов нет
          why: >-
            В «Примере 2» «дождь» встречается три раза, а программа его не вывела. Похоже, условие
            вывода пропускает только слова, которые встретились ровно два раза.
          try: >-
            Нужны все слова, которые встретились больше одного раза: два, три и больше. Проверь знак
            сравнения в условии вывода.
          verify: "«Пример 2» должен дать `дождь: 3`."
        - id: all-words
          when:
            outputIncludes: "тихий: 1"
          why: >-
            В выводе есть слова с числом 1. Они встретились один раз, а нужны только повторы.
          try: Перед выводом проверь число и печатай слово, только если оно встретилось больше одного раза.
          verify: "В «Примере 1» не должно быть строк `тихий: 1` и `тёплый: 1`."
        - id: set-order
          when:
            codeRegex: 'for\s+\w+\s+in\s+(?:list\(\s*)?set\(|(\b[A-Za-z_]\w*)\s*=\s*(?:list\(\s*)?set\([^\n]*\n[\s\S]*for\s+\w+\s+in\s+\1\s*:'
          where: Цикл вывода — перебор множества
          why: >-
            Цикл перебирает множество, а множество не помнит порядок: слова выходят в своём
            порядке, и от запуска к запуску он может меняться. Поэтому вывод то совпадает с
            примером, то нет. А нужен порядок первого появления в тексте.
          try: >-
            Выводи повторы циклом по словарю — `counts.items()`: словарь помнит порядок добавления.
            Если нужен список разных слов, собирай его через `not in`.
          verify: "Все тесты должны пройти, в том числе «Граничный случай: много повторов»."
        - id: print-while-counting
          when:
            outputEquals: |-
              вечер: 2
              очень: 2
          why: >-
            Повторы попадают в вывод — печатаются или складываются в список — в тот момент, когда
            слово встретилось второй раз. Поэтому порядок получается по второй встрече: «вечер»
            оказался раньше «очень». А если печатать прямо во время подсчёта, число ещё не
            окончательное, и слово, которое встретится трижды, напечатается два раза.
          try: >-
            Сначала досчитай всё в одном цикле. Выводи вторым циклом, после первого — по
            `counts.items()`: словарь помнит порядок первого появления.
          verify: "В «Примере 1» сначала `очень: 2`, потом `вечер: 2`; в «Примере 2» — одна строка `дождь: 3`."
        - id: marks-dot
          when:
            outputEquals: "очень: 2"
          why: >-
            К словам прилипли знаки препинания. В «Примере 1» для словаря «вечер.» с точкой и
            «вечер» без неё — разные слова, поэтому «вечер» не попал в повторы. Если в коде есть
            `replace(".,!?", "")`, он ищет эти четыре знака подряд, одним куском, а такого куска в
            тексте нет.
          try: >-
            Убери все четыре знака — точку, запятую, `!` и `?` — до разбиения на слова и сохрани
            результат каждой замены: `text = text.replace(...)`. Можно пройти по знакам циклом или
            написать четыре `replace`.
          verify: "В «Примере 1» должны получиться строки `очень: 2` и `вечер: 2`."
        - id: marks-comma
          when:
            outputIncludes: ",:"
          why: >-
            В выводе слово с запятой: для словаря «дождь,» и «дождь» — разные слова. Запятая
            прилипла к слову и не убрана.
          try: >-
            Убери все четыре знака — точку, запятую, `!` и `?` — до разбиения на слова и сохрани
            результат каждой замены: `text = text.replace(...)`. Можно пройти по знакам циклом или
            написать четыре `replace`.
          verify: "«Пример 2» должен дать `дождь: 3`."
        - id: marks-other
          when:
            failedTest: t4
            outputIncludes: "да: "
          why: >-
            К словам прилипли знаки: для словаря «да?», «да!» и «да» — разные слова, поэтому «да»
            насчитано меньше четырёх раз. Скорее всего, убраны не все знаки — проверь `!` и `?`.
          try: >-
            Убери все четыре знака — точку, запятую, `!` и `?` — до разбиения на слова и сохрани
            результат каждой замены. Можно пройти по знакам циклом или написать четыре `replace`.
          verify: "Тест «Граничный случай: одно слово с разными знаками» должен дать `да: 4`."
        - id: ellipsis
          when:
            failedTest: t8
            outputEquals: "шли: 3"
          why: >-
            «они...» не совпало с «они»: многоточие — это три точки подряд, а со слова снята только
            одна. Для словаря «они..» и «они» — разные слова.
          try: >-
            Убирай знаки заменой во всём тексте: `text = text.replace(".", "")` удаляет все точки
            сразу, сколько бы их ни было.
          verify: "Тест «Граничный случай: многоточие и запятые» должен дать `шли: 3` и `они: 2`."
        - id: message-condition
          when:
            failedTest: t3
            outputEquals: ""
            codeIncludes: Повторов нет
          where: Условие перед `print("Повторов нет")`
          why: >-
            Сообщение в коде есть, но в «Примере 3» оно не напечаталось: условие перед ним не
            сработало. В «Примере 3» слова есть — четыре, просто каждое встретилось один раз. «Нет
            повторов» и «нет слов» — разные вещи, поэтому пустой словарь или пустой текст тут не
            подходят.
          try: >-
            Нужен признак «напечатан хотя бы один повтор»: `found = False` до цикла вывода,
            `found = True` — внутри `if`, рядом с печатью повтора, а после цикла — `if not found:`.
          verify: "«Пример 3» должен дать `Повторов нет`, а «Пример 1» — по-прежнему две строки."
        - id: no-message
          when:
            failedTest: t3
            outputEquals: ""
            codeIncludes: print(
          why: Когда повторов нет, программа ничего не выводит, а нужно сообщение `Повторов нет`.
          try: >-
            Заведи флаг `found = False` до цикла вывода и ставь `found = True`, когда печатаешь
            повтор. После цикла, если флаг остался `False`, выведи `Повторов нет`.
          verify: "«Пример 3» должен дать `Повторов нет`."
        - id: print-dict
          when:
            outputIncludes: "{'"
          why: >-
            На экране словарь целиком, в фигурных скобках: так его печатает `print(counts)`. Если
            это отладочный вывод, его пора убрать.
          try: >-
            Удали `print(counts)` и выводи пары по одной: `for word, count in counts.items():` и
            f-строка.
          verify: "В «Примере 1» должны остаться только строки `очень: 2` и `вечер: 2`."
        - id: print-words
          when:
            outputIncludes: "['"
          why: >-
            На экране список в квадратных скобках — так печатает `print(words)`. Похоже, остался
            отладочный вывод.
          try: "Удали отладочный `print` — в ответе нужны только строки `слово: число`."
          verify: "В «Примере 1» должны остаться только строки `очень: 2` и `вечер: 2`."
      afterPass: >-
        Это настоящий частотный словарь: текст приведён к одному виду, словарь считает, а программа
        помнит, нашёлся ли хоть один повтор. Улучшение на будущее — выводить слова от частых к
        редким: для этого нужна сортировка по числу, она будет в модуле 10.
      skills: [dicts, string-methods, choose-structure]
      noHintsBeforeAttempt: true

  - id: tags-task
    type: exercise
    title: Самостоятельная работа 2
    exercise:
      id: m4-l7-e2
      kind: write
      title: Теги поста
      statement: |-
        Заметки Ники выходят и в группе газеты в соцсети, а к постам она добавляет теги. Редактору
        нужен список тегов каждого поста — без повторов.

        **Тег** — это слово, которое **начинается** с `#`, и после `#` в нём есть хотя бы один
        символ. Слова разделены пробелами.

        Напиши программу: она читает текст поста и выводит его теги в одну строку через запятую с
        пробелом:

        ```text
        Теги: лето, огород
        ```

        - тег пишется без `#` и маленькими буквами;
        - `#Лето` и `#лето` — один и тот же тег, он выводится один раз;
        - теги идут в том порядке, в каком впервые встретились в тексте;
        - `#` в середине или в конце слова (`100#`) и одиночный `#` — не теги;
        - если тегов нет, программа выводит `Тегов нет`.
      input: >-
        Одна строка — текст поста. Слова разделены пробелами, иногда несколькими. Строка может быть
        пустой.
      output: "`Теги: <теги через «, »>` или `Тегов нет`."
      constraints:
        - Подсказки и решение откроются после первой проверки — сначала попробуй сам.
        - Знаки препинания к тегам не прилипают; после `#` в теге идут буквы или цифры.
      starterCode: |
        # Теги поста
        # Ввод: одна строка текста

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "Выходные на даче #Лето #огород #лето\n"
          compare:
            ignoreSpaces: true
          expected: "Теги: лето, огород"
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "Просто текст без тегов\n"
          compare:
            ignoreSpaces: true
          expected: Тегов нет
        - id: t3
          kind: io
          title: "Граничный случай: решётка не в начале и одиночная"
          edge: true
          stdin: "Цена 100# и # отдельно\n"
          compare:
            ignoreSpaces: true
          expected: Тегов нет
        - id: t4
          kind: io
          title: "Граничный случай: регистр"
          edge: true
          stdin: "#А #а #Б #б #А\n"
          compare:
            ignoreSpaces: true
          expected: "Теги: а, б"
        - id: t5
          kind: io
          title: "Граничный случай: цифры и повторы"
          edge: true
          stdin: "Ура #2026 и снова #море #МОРЕ #Закат\n"
          compare:
            ignoreSpaces: true
          expected: "Теги: 2026, море, закат"
        - id: t6
          kind: io
          title: "Граничный случай: пустая строка"
          edge: true
          stdin: "\n"
          compare:
            ignoreSpaces: true
          expected: Тегов нет
        - id: t7
          kind: io
          title: "Граничный случай: лишние пробелы"
          edge: true
          stdin: "  #утро   #Утро  \n"
          compare:
            ignoreSpaces: true
          expected: "Теги: утро"
        - id: t8
          kind: io
          title: "Граничный случай: много тегов"
          edge: true
          stdin: "Поход #Горы #река #Костёр #палатка #горы #звёзды #утро\n"
          compare:
            ignoreSpaces: true
          expected: "Теги: горы, река, костёр, палатка, звёзды, утро"
      criteria:
        - Тегом считается только слово, которое начинается с `#` и длиннее одного символа.
        - Теги выводятся без `#`, маленькими буквами, без повторов, в порядке первого появления.
        - "Формат: `Теги: ` и теги через запятую с пробелом; если тегов нет — `Тегов нет`."
        - Пустой текст и лишние пробелы не ломают программу.
      hints:
        - >-
          Для каждого слова задай два вопроса: тег ли это (посмотри на первый символ и на длину
          слова) и не встречался ли этот тег раньше. В каком виде сравнивать теги, чтобы `#Лето` и
          `#лето` совпали?
        - |-
          На другом примере: `w = "@кот"` — `w[0]` даёт `@`, `w[1:]` даёт `кот`, а `len("@")`
          равно 1. Без повторов, но по порядку:
          ```python
          seen = []
          for x in ["а", "б", "а"]:
              if x not in seen:
                  seen.append(x)
          print(seen)   # ['а', 'б']
          ```
        - |-
          Каркас:
          ```text
          words = input().split()
          tags = []
          для каждого word из words:
              если в word больше одного символа и первый символ — "#":
                  tag = word без первого символа, маленькими буквами
                  если tag ещё нет в tags — добавить его
          если tags пустой — вывести «Тегов нет»
          иначе — вывести "Теги: " и теги через ", "
          ```
      solution:
        code: |
          words = input().split()
          tags = []
          for word in words:
              if len(word) > 1 and word[0] == "#":
                  tag = word[1:].lower()
                  if tag not in tags:
                      tags.append(tag)
          if len(tags) == 0:
              print("Тегов нет")
          else:
              print("Теги: " + ", ".join(tags))
        explanation: >-
          `split()` с пустыми скобками даёт слова без пустых кусков. Условие
          `len(word) > 1 and word[0] == "#"` отбирает слова, которые начинаются с решётки и не
          состоят из неё одной. Длина проверяется первой: Python проверяет части `and` слева
          направо и, если первая ложна, вторую уже не смотрит — так у пустого или короткого слова
          до `word[0]` дело не дойдёт. Срез `word[1:]` убирает `#`, `lower()` приводит тег к одному виду — и
          только потом список проверяется через `not in`, иначе `#А` и `#а` разошлись бы. Список, а
          не множество, нужен потому, что важен порядок. `join` склеивает теги через `", "`.
      altSolutions:
