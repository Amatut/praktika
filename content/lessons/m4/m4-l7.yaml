            символа: у неё есть `word[0]`, но нет `word[1]`, отсюда IndexError.
          try: >-
            Вместо символа проверяй длину: в теге больше одного символа, `len(word) > 1`. Ставь эту
            проверку в условии первой: части `and` Python проверяет слева направо и, если первая
            ложна, вторую уже не смотрит.
          verify: "Тест «Граничный случай: решётка не в начале и одиночная» должен дать `Тегов нет`."
        - id: hash-anywhere
          when:
            failedTest: t3
            codeRegex: '["'']#["'']\s+in\s'
          where: Условие, по которому слово считается тегом
          why: >-
            `"#" in word` находит решётку в любом месте слова — и в `100#` тоже. А тег — это слово,
            которое **начинается** с `#`.
          try: >-
            Смотри на первый символ слова: `word[0]`. И не забудь, что одиночный `#` — тоже не тег.
          verify: "Тест «Граничный случай: решётка не в начале и одиночная» должен дать `Тегов нет`."
        - id: no-message
          when:
            failedTest: t2
            outputEquals: "Теги:"
          why: >-
            Когда тегов нет, программа печатает `Теги:` с пустым списком, а нужно сообщение
            `Тегов нет`.
          try: >-
            Перед выводом проверь, пуст ли список тегов: `len(tags) == 0`. Если пуст — выведи
            `Тегов нет`, иначе — строку с тегами.
          verify: "«Пример 2» должен дать `Тегов нет`."
        - id: lone-hash
          when:
            failedTest: t3
            outputEquals: "Теги:"
          why: >-
            Одиночный `#` попал в теги: после среза от него осталась пустая строка, и в выводе
            `Теги:` без тега. Но в теге после `#` должен быть хотя бы один символ.
          try: Добавь в условие проверку длины — слово должно быть длиннее одного символа.
          verify: "Тест «Граничный случай: решётка не в начале и одиночная» должен дать `Тегов нет`."
        - id: output-in-loop
          when:
            failedTest: t1
            outputIncludes: Тегов нет
          why: >-
            `Тегов нет` напечатано, хотя теги нашлись: вывод стоит внутри цикла и срабатывает на
            каждом слове. Есть ли теги, известно только после цикла.
          try: >-
            Сдвинь вывод — и `Тегов нет`, и строку с тегами — влево, на уровень `for`, чтобы он
            выполнился один раз, после цикла.
          verify: "«Пример 1» должен дать одну строку `Теги: лето, огород`."
        - id: set-order
          when:
            codeRegex: '(?:join|list)\(\s*set\(|for\s+\w+\s+in\s+set\(|(\b[A-Za-z_]\w*)\s*=\s*set\([^\n]*\n[\s\S]*(?:join\(\s*\1\s*\)|for\s+\w+\s+in\s+\1\s*:)'
          where: Теги во множестве и склейка через `join`
          why: >-
            Теги склеиваются из множества, а множество не помнит порядок: теги выходят в своём
            порядке, и от запуска к запуску он может меняться. Поэтому вывод то совпадает с
            примером, то нет.
          try: >-
            Храни теги в списке и добавляй тег, только если его там ещё нет (`not in`). Множество
            можно оставить для проверки «уже было», но склеивать нужно список.
          verify: "Все тесты должны пройти, в том числе «Граничный случай: много тегов»."
        - id: print-set
          when:
            outputIncludes: "{"
          why: >-
            На экране фигурные скобки: так `print` показывает множество. К тому же порядок
            элементов множества не гарантирован, а теги нужны в порядке появления.
          try: >-
            Храни теги в списке и добавляй тег, только если его там ещё нет (`not in`). Выводи через
            `", ".join(...)`.
          verify: "«Пример 1» должен дать `Теги: лето, огород`."
        - id: print-list
          when:
            outputIncludes: "['"
          why: На экране квадратные скобки и кавычки — так `print` показывает список целиком.
          try: 'Склей список в одну строку: `", ".join(tags)`.'
          verify: "«Пример 1» должен дать `Теги: лето, огород`."
        - id: hash-kept
          when:
            outputIncludes: "#"
          why: Теги выводятся вместе с `#`, а нужно без неё.
          try: Возьми слово без первого символа — срезом с индекса 1.
          verify: "«Пример 1» должен дать `Теги: лето, огород`."
        - id: case
          when:
            outputIncludes: Лето
          why: >-
            Регистр не приведён к одному виду: `Лето` и `лето` — один тег, а в выводе теги нужны
            маленькими буквами. Если `lower()` в коде есть, проверь, сохранён ли его результат.
          try: >-
            Приведи тег к маленьким буквам через `lower()` **до** проверки на повтор и сохрани
            результат в переменную.
          verify: "«Пример 1» должен дать `Теги: лето, огород`."
        - id: not-in-misses
          when:
            failedTest: t1
            outputIncludes: лето, огород, лето
            codeRegex: '\bnot\b.*\bin\b'
          where: Проверка `not in` и строка с `append`
          why: >-
            Проверка `not in` в коде есть, но повтор она пропускает: для Python `Лето` и `лето`,
            `#лето` и `лето` — разные строки. Проверять и добавлять нужно один и тот же готовый
            тег — без `#` и маленькими буквами.
          try: >-
            Сначала приготовь тег целиком — срез без `#` и `lower()` — и сохрани его в переменную.
            Потом спрашивай список через `not in` и добавляй именно эту переменную.
          verify: "«Пример 1» должен дать `Теги: лето, огород`."
        - id: duplicates
          when:
            outputIncludes: лето, огород, лето
          why: Один и тот же тег выведен дважды, а теги нужны без повторов.
          try: >-
            Перед добавлением спроси список, есть ли в нём уже этот тег (`not in`), и добавляй только
            новые.
          verify: "«Пример 1» должен дать `Теги: лето, огород`."
        - id: lower-after-check
          when:
            failedTest: t4
            outputEquals: "Теги: а, б, а"
          why: >-
            Повтор проверяется до приведения к маленьким буквам. Тега `А` ещё нет в списке, где уже
            лежит `а`, — и в список второй раз попадает `а`.
          try: >-
            Сначала приведи тег к одному виду и сохрани в переменную, а потом проверяй `not in` и
            добавляй именно её.
          verify: "Тест «Граничный случай: регистр» должен дать `Теги: а, б`."
      afterPass: >-
        Срез, метод строки, проверка «уже было» и `join` — почти весь модуль в одной небольшой
        программе. Если захочешь, выведи ещё и сколько раз встретился каждый тег: для этого список
        заменяется словарём, как в «Повторах в заметке».
      skills: [string-methods, lists, sets-tuples]
      noHintsBeforeAttempt: true

  - id: recap
    type: recap
    title: Итоги и что повторить
    points:
      - "Схема обработки текста: привести к одному виду (`lower`, `replace` — с сохранением результата) → разрезать через `split()` → посчитать в словаре `d[x] = d.get(x, 0) + 1` → вывести через `items()`. Если обе задачи получились без подсказок — модуль 4 у тебя в руках, впереди первый проект: калькулятор или викторина. Если подсказки понадобились, повтори уроки из пунктов ниже и иди дальше — это нормально."
      - "Метод «не сработал», прилип знак или `split(\" \")` дал пустые слова — повтори урок 4.3 «Методы строк». Ошибки с `word[0]` и `word[1:]` — урок 4.1 «Индексы и срезы строк»."
      - "Был KeyError, `None` в сложении или счётчики не росли — повтори подсчёт в уроке 4.4 «Словари». «Повторов нет» печаталось лишний раз или не печаталось вовсе — флаг из урока 3.4 и задача «Быстрее среднего» из 4.2."
      - "Слова или теги шли не по порядку либо повторялись — уроки 4.2, 4.5 и 4.6: множество порядок не помнит, для порядка нужен список и `not in` (или словарь — он помнит порядок добавления)."
    question: Почему для подсчёта слов взят словарь, а не множество?
    answer: >-
      Множество помнит только, какие слова были, но не сколько раз каждое встретилось. Словарь
      хранит у каждого слова его число: ключ — слово, значение — счётчик. К тому же словарь помнит
      порядок добавления, поэтому повторы легко вывести в порядке первого появления.
