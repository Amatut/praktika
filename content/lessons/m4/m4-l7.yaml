id: m4-l7
module: m4
number: "4.7"
title: "Самостоятельная работа: частотный словарь"
objective: >-
  Самостоятельно обработать текст: привести слова к одному виду, посчитать в словаре, сколько раз
  встретилось каждое, убрать повторы с сохранением порядка и вывести результат в заданном формате.
minutes: [25, 30]
prerequisites: [m4-l6]
skills: [dicts, string-methods, lists, sets-tuples, choose-structure]
environment: python

story:
  title: Шесть раз «очень»
  fictional: true
  text: >-
    Ника пишет заметки для районной газеты. Однажды редактор вернул ей текст с пометкой на полях:
    «„очень“ — шесть раз на один абзац». С тех пор перед отправкой Ника ищет повторы: подчёркивает
    одинаковые слова карандашом и считает их вручную, а на длинной заметке сбивается со счёта.
    Частотный словарь делает это сам: разбивает текст на слова и считает, сколько раз встретилось
    каждое. Сегодня ты напишешь такую программу — без разобранного примера.

why: >-
  Самостоятельная работа показывает, что уже получается без подсказок: разобрать текст, выбрать
  подходящую структуру и аккуратно вывести результат. Например, в заметке «Очень тихий вечер.
  Вечер очень тёплый!» программа сама найдёт, что «очень» и «вечер» встречаются по два раза.

usedIn: >-
  Проверка текстов на повторы в редакторах, облака тегов на сайтах, поисковые системы (какие слова
  важны в документе), разбор отзывов покупателей, списки самых частых слов для изучения языка.

steps:
  - id: reminder
    type: theory
    title: Перед стартом
    body: |-
      Сегодня самостоятельная работа: две задачи на весь модуль. Подсказки и решение в них
      откроются только после первой проверки. Это не запрет на помощь — просто сначала попробуй
      сам.

      Всё нужное ты уже знаешь. Короткая памятка:

      ```text
      # привести текст к одному виду — и сохранить результат
      text = text.lower()
      text = text.replace("!", "")      # убрать знак
      words = text.split()              # слова, без пустых кусков

      # первый символ и всё остальное
      word[0]      word[1:]

      # подсчёт в словаре и вывод пар по порядку добавления
      counts[w] = counts.get(w, 0) + 1
      for w, n in counts.items():

      # без повторов, но в порядке появления
      if w not in seen:
          seen.append(w)

      # список — в одну строку
      ", ".join(список)
      ```

      Три вещи, о которых легко забыть:

      - Метод строки не меняет её, а возвращает новую строку. Результат нужно присвоить.
      - Множество убирает повторы, но не помнит порядок. Если порядок важен, храни значения в
        списке и проверяй `not in` (или держи рядом множество «уже видели»).
      - `print(список)` и `print(словарь)` показывают скобки и кавычки. Для красивого вывода
        нужен `join` или цикл.

      Как работать над заданием:

      1. Прочитай условие и все примеры: что приходит на вход, что должно получиться, какие
         есть особые случаи.
      2. Разложи решение на шаги, как в плане ниже.
      3. Нажми «Запустить»: поле «Ввод для „Запустить“» под редактором кода уже заполнено
         вводом из первого примера. Сравни вывод с ожидаемым посимвольно.
      4. Если вывод не тот, временно напечатай промежуточное значение — `print(words)` или
         `print(counts)` — и найди шаг, где всё пошло не так. Перед проверкой убери этот `print`.

      Вторую задачу можно оставить на следующую сессию — между задачами хорошее место для
      остановки.
    simpler: >-
      Сегодня две задачи без подсказок до первой проверки. Главное: приведи текст к одному виду и
      сохрани результат, считай в словаре через `get`, а для «без повторов, но по порядку» возьми
      список и `not in`.
    coach: >-
      Ошибиться на первой попытке нормально: самостоятельная работа показывает, что уже получается
      само, а что стоит повторить.

  - id: warmup
    type: predict
    title: Разминка
    prompt: >-
      Разминка на весь модуль: методы строк, список и множество в трёх строках. Как думаешь, что
      выведет программа?
    code: |-
      text = "Кот и кот, и КОТ"
      words = text.lower().replace(",", "").split()
      print(len(words), len(set(words)))
    options:
      - "5 2"
      - "5 3"
      - "5 4"
      - "3 2"
    answer: "5 2"
    explanation: >-
      Сначала `lower()` делает все буквы маленькими — `кот и кот, и кот`, потом `replace` убирает
      запятую, и `split()` даёт пять слов: `['кот', 'и', 'кот', 'и', 'кот']`. `len(words)` считает
      все слова вместе с повторами — их 5. Множество оставляет только разные — `кот` и `и`, их 2.
      Без `lower()` вышло бы `5 4`: для Python `Кот`, `кот` и `КОТ` — разные слова. Без `replace` —
      `5 3`: `кот,` с запятой — ещё одно отдельное слово.
    coach: >-
      Запомни эти две ловушки — регистр и прилипший знак. В главной задаче они встретятся снова.

  - id: plan
    type: order
    title: "План: сколько каких оценок"
    prompt: >-
      Прежде чем писать код, разложи задачу на шаги. Потренируйся на другой задаче: в строке через
      пробел записаны оценки за четверть, например `5 4 5 3 5 4`. Программа должна вывести, сколько
      раз встретилась каждая оценка. Расставь действия по порядку.
    items:
      - id: read
        text: Прочитать строку с оценками
      - id: split
        text: Разрезать строку на отдельные оценки через `split()`
      - id: dict
        text: Создать пустой словарь для счётчиков
      - id: count
        text: "Для каждой оценки увеличить её счётчик: `counts[mark] = counts.get(mark, 0) + 1`"
      - id: show
        text: Перебрать пары через `items()` и вывести каждую оценку с её числом
    before:
      - [read, split]
      - [split, count]
      - [dict, count]
      - [count, show]
    explanation: >-
      Разрезать можно только прочитанную строку. Словарь создаётся до цикла подсчёта — можно и в
      самом начале программы. Если создать его внутри цикла, он будет обнуляться на каждом шаге.
      Выводить результат можно, только когда подсчёт закончен, — иначе числа ещё не окончательные.
    coach: >-
      Главную задачу разложи так же: привести текст к одному виду, разрезать на слова, посчитать,
      вывести только повторы.

  - id: main-task
    type: exercise
    title: Самостоятельная работа 1
    exercise:
      id: m4-l7-e1
      kind: write
      title: Повторы в заметке
      statement: |-
        Ника хочет перед отправкой видеть, какие слова повторяются в заметке. Напиши программу: она
        читает одну строку текста и выводит слова, которые встретились **больше одного раза**, —
        каждое в своей строке, в формате `слово: число`.

        Правила:

        - регистр не важен: «Вечер» и «вечер» — одно слово; в выводе слово пишется маленькими
          буквами;
        - к словам могут прилипать знаки `.` `,` `!` `?` — их нужно убрать: «вечер.» и «вечер» —
          тоже одно слово;
        - между словами бывает несколько пробелов;
        - слова выводятся в том порядке, в каком впервые встретились в тексте;
        - если повторов нет, программа выводит `Повторов нет`.

        Например, для текста `Очень тихий вечер. Вечер очень тёплый!` вывод такой:

        ```text
        очень: 2
        вечер: 2
        ```
      input: >-
        Одна строка — текст заметки. Слова разделены пробелами, иногда несколькими; к словам могут
        прилипать знаки `. , ! ?`. Строка может быть пустой.
      output: >-
        Повторяющиеся слова в порядке первого появления, по одному в строке: `слово: число`. Если
        повторов нет — `Повторов нет`.
      constraints:
        - Подсказки и решение откроются после первой проверки — сначала попробуй сам.
        - Других знаков, кроме `. , ! ?`, в тексте нет, и стоят они вплотную к словам.
        - Буквы «ё» и «е» считаются разными, заменять «ё» не нужно.
      starterCode: |
        # Повторы в заметке
        # Ввод: одна строка текста

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "Очень тихий вечер. Вечер очень тёплый!\n"
          compare:
            ignoreSpaces: true
          expected: |-
            очень: 2
            вечер: 2
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "Дождь, дождь, снова дождь. А мы гуляем!\n"
          compare:
            ignoreSpaces: true
          expected: "дождь: 3"
        - id: t3
          kind: io
          title: Пример 3
          example: true
          stdin: "Каждое слово здесь одно\n"
          compare:
            ignoreSpaces: true
          expected: Повторов нет
        - id: t4
          kind: io
          title: "Граничный случай: одно слово с разными знаками"
          edge: true
          stdin: "Да? Да! Да, ДА.\n"
          compare:
            ignoreSpaces: true
          expected: "да: 4"
        - id: t5
          kind: io
          title: "Граничный случай: лишние пробелы"
          edge: true
          stdin: "  много   пробелов  между   словами   много \n"
          compare:
            ignoreSpaces: true
          expected: "много: 2"
        - id: t6
          kind: io
          title: "Граничный случай: одно слово"
          edge: true
          stdin: "Привет\n"
          compare:
            ignoreSpaces: true
          expected: Повторов нет
        - id: t7
          kind: io
          title: "Граничный случай: пустая строка"
          edge: true
          stdin: "\n"
          compare:
            ignoreSpaces: true
          expected: Повторов нет
        - id: t8
          kind: io
          title: "Граничный случай: многоточие и запятые"
          edge: true
          stdin: "мы шли, шли и шли, а они... они стояли\n"
          compare:
            ignoreSpaces: true
          expected: |-
            шли: 3
            они: 2
        - id: t9
          kind: io
          title: "Граничный случай: много повторов"
          edge: true
          stdin: "Снег, лёд, ветер, иней, холод и мороз. Мороз и холод, иней, ветер, лёд и снег!\n"
          compare:
            ignoreSpaces: true
          expected: |-
            снег: 2
            лёд: 2
            ветер: 2
            иней: 2
            холод: 2
            и: 3
            мороз: 2
      criteria:
        - Текст приведён к маленьким буквам, знаки `. , ! ?` убраны, результат каждого метода сохранён.
        - Слова посчитаны в словаре, лишние пробелы не дают пустых «слов».
        - "Выводятся только слова, которые встретились больше одного раза, в порядке первого появления, в формате `слово: число`."
        - Если повторов нет — одна строка `Повторов нет`, в том числе для пустого текста.
      hints:
        - >-
          Шаги такие: привести текст к одному виду → разрезать на слова → посчитать каждое слово →
          вывести только повторы. Чаще всего ошибаются в первом шаге (все ли знаки убраны и
          сохранён ли результат) и в последнем: «Повторов нет» зависит не от того, есть ли в тексте
          слова, а от того, нашёлся ли хоть один повтор. Нажми «Запустить» и временно напечатай
          список слов или словарь — так видно, на каком шаге всё расходится с примером.
        - |-
          По сравнению с подсчётом из урока 4.4 здесь новое — вывести только часть значений и один
          раз сообщить, что подходящих нет. Этот приём на другом примере — морозные дни:
          ```python
          found = False
          for t in [3, -2, 5, -1]:
              if t < 0:
                  print("Мороз:", t)
                  found = True
          if not found:
              print("Морозов нет")
          ```
          Здесь напечатается `Мороз: -2` и `Мороз: -1`, а для `[3, 5]` — одна строка
          `Морозов нет`. Подсчёт и очистка текста — как в памятке «Перед стартом».
        - |-
          Каркас:
          ```text
          text = input().lower()
          для каждого знака из ".,!?": text = text.replace(знак, "")
          counts = {}
          для каждого word из text.split(): увеличить счётчик counts[word] через get
          found = False
          для каждой пары word, count из counts.items():
              если count > 1: вывести f"{word}: {count}" и поставить found = True
          если found так и остался False — вывести «Повторов нет»
          ```
      solution:
        code: |
          text = input().lower()
          for mark in ".,!?":
              text = text.replace(mark, "")
          counts = {}
          for word in text.split():
              counts[word] = counts.get(word, 0) + 1
          found = False
          for word, count in counts.items():
              if count > 1:
                  print(f"{word}: {count}")
                  found = True
          if not found:
              print("Повторов нет")
        explanation: >-
          Сначала текст приводится к одному виду: `lower()` делает буквы маленькими, а цикл по
          строке `".,!?"` убирает каждый знак — это перебор символов из урока 4.1. Вместо цикла
          подойдут и четыре `replace` подряд. `split()` с пустыми скобками режет по любым пробелам,
          поэтому лишние пробелы не мешают. Словарь считает слова через `get` и помнит порядок
          добавления, поэтому повторы выводятся в порядке первого появления. Флаг `found`
          запоминает, был ли хоть один повтор, а `Повторов нет` печатается один раз, после цикла.
      altSolutions:
        - code: |
            text = input().lower()
            text = text.replace(".", " ").replace(",", " ").replace("!", " ").replace("?", " ")
            counts = {}
            order = []
            for word in text.split():
                if word in counts:
                    counts[word] += 1
                else:
                    counts[word] = 1
                    order.append(word)
            repeats = 0
            for word in order:
                if counts[word] >= 2:
                    print(word + ": " + str(counts[word]))
                    repeats += 1
            if repeats == 0:
                print("Повторов нет")
          note: Знаки заменены на пробелы, счёт через in, порядок — отдельным списком.
        - code: |
            counts = {}
            for word in input().split():
                word = word.lower().replace(".", "").replace(",", "").replace("!", "").replace("?", "")
                counts[word] = counts.get(word, 0) + 1
            result = []
            for word in counts:
                if counts[word] > 1:
                    result.append(f"{word}: {counts[word]}")
            if len(result) == 0:
                print("Повторов нет")
            for line in result:
                print(line)
          note: Каждое слово чистится отдельно, строки вывода копятся в списке.
        - code: |
            text = input().lower()
            for mark in [".", ",", "!", "?"]:
                text = text.replace(mark, "")
            words = text.split()
            seen = []
            for word in words:
                if word not in seen:
                    seen.append(word)
            found = False
            for word in seen:
                if words.count(word) > 1:
                    print(f"{word}: {words.count(word)}")
                    found = True
            if found == False:
                print("Повторов нет")
          note: Без словаря — список разных слов и words.count (метод из документации).
        - code: |
            words = []
            for raw in input().split():
                words.append(raw.strip(".,!?").lower())
            if len(set(words)) == len(words):
                print("Повторов нет")
            else:
                counts = {}
                for word in words:
                    counts[word] = counts.get(word, 0) + 1
                for word, count in counts.items():
                    if count > 1:
                        print(f"{word}: {count}")
          note: >-
            Рецензия: strip(".,!?") у каждого слова, а «есть ли повторы» — заранее, сравнением длины
            списка и множества.
        - code: |
            text = input().lower()
            text = text.replace(".", "").replace(",", "").replace("!", "").replace("?", "")
            counts = {}
            for word in text.split(" "):
                if word == "":
                    continue
                if word in counts:
                    counts[word] += 1
                else:
                    counts[word] = 1
            lines = []
            for word in counts:
                if counts[word] > 1:
                    lines.append(f"{word}: {counts[word]}")
            if lines == []:
                print("Повторов нет")
            else:
                print("\n".join(lines))
          note: Рецензия — split(" ") с пропуском пустых кусков, счёт через in/else, вывод одним join.
        - code: |
            counts = {}
            order = []
            seen = set()
            for word in input().lower().split():
                while len(word) > 0 and word[-1] in ".,!?":
                    word = word[:-1]
                if word not in seen:
                    seen.add(word)
                    order.append(word)
                counts[word] = counts.get(word, 0) + 1
            any_repeat = False
            for word in order:
                if counts[word] > 1:
                    any_repeat = True
                    print(f"{word}: {counts[word]}")
            if not any_repeat:
                print("Повторов нет")
          note: >-
            Рецензия: знаки снимаются с конца слова в while (многоточие тоже), множество «уже
            видели» и отдельный список для порядка.
