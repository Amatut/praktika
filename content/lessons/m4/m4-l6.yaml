id: m4-l6
module: m4
number: "4.6"
title: Какую структуру выбрать
objective: >-
  По вопросам «важен ли порядок, бывают ли повторы, ищу ли по названию, будут ли данные меняться»
  выбирать список, словарь, множество или кортеж, сочетать их и объяснять свой выбор.
minutes: [25, 30]
prerequisites: [m4-l5]
skills: [choose-structure, dicts, sets-tuples, lists]
environment: python

story:
  title: Всё в одной заметке
  fictional: true
  text: >-
    Роман ведёт кружок робототехники и долго записывал всё подряд в одну длинную заметку на
    телефоне: имена ребят, номера родителей, расписание, отметки о сданных проектах. Чтобы найти
    номер, он листал записи сверху вниз, а чтобы узнать, кто не сдал проект, сверял список ребят
    со сданными работами. Потом Роман перенёс учёт в небольшую программу и для каждой задачи
    выбрал свою структуру: теперь номер находится по имени сразу, а список должников программа
    выдаёт сама. Сегодня ты научишься выбирать структуру под задачу.

why: >-
  Одну задачу можно решить разными структурами, но в подходящей решение короче и понятнее.
  Например, телефон по имени проще найти в словаре, чем перебирать два списка. А чтобы узнать,
  кто ещё не сдал, достаточно пройти по списку кружка и про каждого спросить у множества сдавших.

usedIn: >-
  С вопроса «в чём хранить данные» начинается любая программа: корзина магазина, расписание,
  игра, чат-бот, учёт на складе. От ответа зависит, насколько простым получится код и как быстро
  он будет работать на больших данных. К скорости вернёмся в модуле про алгоритмы.

steps:
  - id: idea
    type: theory
    title: Четыре вопроса к данным
    body: |-
      Ты знаешь четыре структуры. Данные можно положить в любую из них, но удобно работать
      будет только с той, что подходит к задаче. Чем сильна каждая:

      - **Список** `[…]` — порядок и повторы. Элементы стоят по местам, их достают по номеру.
        Очередь, история действий, результаты забегов.
      - **Словарь** `{ключ: значение}` — поиск по ключу. Телефон по имени, цена по товару,
        подсчёт голосов.
      - **Множество** `{…}` (пустое — `set()`) — только разные значения и быстрый ответ «есть
        или нет». Посетители, те, кто уже проголосовал, общее у двух наборов.
      - **Кортеж** `(…)` — запись из нескольких значений, которая не меняется. Координата `(x, y)`,
        дата `(день, месяц)`.

      Прежде чем писать код, задай данным четыре вопроса:

      1. Важен ли порядок?
      2. Бывают ли повторы и нужны ли они?
      3. Буду ли я искать по названию, а не по номеру?
      4. Будут ли данные меняться? Различай запись и набор: точки в маршрут добавляют, а
         координаты записанной точки не меняются.

      **Структуры вкладываются друг в друга.** Значением словаря может быть список, а элементом
      списка — кортеж:

      ```python
      schedule = {"пн": ["йога", "танцы"], "ср": ["хор"]}
      print(schedule["пн"][1])      # танцы
      route = [(0, 0), (3, 4), (5, 4)]
      for x, y in route:
          print(x, y)
      ```

      `schedule["пн"]` — это список, и с ним работает всё, что умеет список: индексы, `append`,
      `len`, перебор в `for`. А склеить его в строку можно, как в уроке 4.3:
      `", ".join(schedule["пн"])`. Словарь списков набирают в цикле: если ключа ещё нет, кладут
      под него пустой список `[]`, а потом добавляют в этот список значение через `append`.

      **Две структуры вместе.** Бывает, что у данных две роли: список помнит порядок, а
      множество быстро отвечает «было или нет». Тогда идёшь по списку и про каждый элемент
      спрашиваешь у множества через `in`.

      **Антипример — параллельные списки**: имена в одном списке, телефоны в другом, на тех же
      местах. Чтобы найти телефон, приходится перебирать номера мест, а при изменении легко
      обновить один список и забыть про второй. Пары «ключ — значение» — работа для словаря.

      **Про скорость.** `x in список` проверяет элементы по очереди, пока не найдёт, а если
      значения нет — до самого конца. `x in множество` и `x in словарь` находят ответ почти
      сразу, без перебора. На десятке имён разницы не видно, на миллионе она огромная.
      Подробнее — в модуле про алгоритмы.
    simpler: >-
      Структура — как ящик в кладовке. Для вилок и ложек удобен лоток с отделениями, для
      документов — папка с алфавитом. Выбирают не по красоте, а по тому, как потом будут
      доставать: по порядку — список, по названию — словарь, «есть или нет» — множество,
      неизменная запись из нескольких значений — кортеж.
    coach: >-
      Перед кодом задай данным четыре вопроса — и половина решения будет готова.

  - id: two-ways
    type: example
    title: Одна книга — два способа
    body: >-
      Одна задача — найти телефон по имени — решена двумя способами: двумя параллельными
      списками и словарём. Нажми «Запустить»: оба способа находят один и тот же номер.
    code: |-
      names = ["Аня", "Боря", "Вика"]
      phones = ["111-22", "333-44", "555-66"]
      who = "Боря"
      for i in range(len(names)):
          if names[i] == who:
              print(phones[i])

      book = {"Аня": "111-22", "Боря": "333-44", "Вика": "555-66"}
      print(book.get(who, "нет номера"))
    notes:
      - line: 2
        text: >-
          Номера лежат в отдельном списке на тех же местах, что и имена: Боря — на месте 1 в
          `names`, его номер — на месте 1 в `phones`.
      - line: 4
        text: Чтобы найти номер, цикл перебирает места одно за другим и сравнивает имена.
      - line: 6
        text: Номер берётся из второго списка по тому же номеру места `i`.
      - line: 8
        text: Словарь хранит имя и номер одной парой — разъехаться они не могут.
      - line: 9
        text: >-
          Весь поиск — одна строка: `get` находит номер по ключу, а если имени нет, возвращает
          запасной текст.
    tryIt: >-
      Замени в строке 3 `"Боря"` на `"Гоша"` и запусти. Способ со списками промолчит: цикл просто
      не найдёт имя. Словарь ответит «нет номера». Чтобы и первый способ так отвечал, понадобились
      бы ещё флаг и `if` после цикла.
    coach: >-
      Оба способа работают, но словарь и короче, и надёжнее: имя и номер в нём всегда вместе.

  - id: nested-predict
    type: predict
    title: Список внутри словаря
    prompt: >-
      Роман записывает план кружка на неделю: для каждого дня — список дел. Как думаешь, что
      выведет программа?
    code: |-
      plan = {"вт": ["сборка"], "чт": ["программирование"]}
      plan["вт"].append("пайка")
      plan["сб"] = ["соревнования"]
      print(len(plan), len(plan["вт"]))
    options:
      - "2 2"
      - "3 2"
      - "3 1"
      - "4 2"
    answer: "3 2"
    explanation: >-
      `plan["вт"]` — это список, и `append` добавил в него второе дело. Дней в словаре от этого
      не прибавилось: изменился список внутри словаря. А `plan["сб"] = [...]` записал новый ключ,
      поэтому дней стало три. Итог — 3 дня и 2 дела во вторник. Ответ «4 2» получается, если
      думать, что `append` добавил в словарь ещё один ключ, «3 1» — если думать, что список
      внутри словаря не меняется, а «2 2» — если думать, что `plan["сб"] = [...]` не создаёт
      новый ключ.
    coach: >-
      Читай вложенную запись слева направо: `plan["вт"]` — достали список, `.append(...)` —
      изменили этот самый список.

  - id: choose-tickets
    type: quiz
    title: "Выбери структуру: билеты"
    question: >-
      На фестиваль роботов пускают по билетам с номерами. На входе сканер считывает номер, и
      программа должна быстро отвечать: «этот билет уже проходил?» Второй раз по одному билету не
      пускают. В чём хранить номера прошедших билетов?
    options:
      - Список
      - Словарь
      - Множество
      - Кортеж
    correct: 2
    explanation: >-
      Нужно одно: был номер или нет. Порядок не важен, повторов быть не должно, а `in` по
      множеству отвечает сразу, даже когда билетов тысячи. Список тоже справился бы, но `in` по
      нему перебирает номера подряд, а для нового билета — все до последнего. Словарь
      пригодился бы, если бы к номеру нужно было хранить что-то ещё, например время прохода.
      Кортеж не подходит: в него нельзя добавлять.

  - id: choose-runs
    type: quiz
    title: "Выбери структуру: заезды"
    question: >-
      На тренировке робот проходит трассу несколько раз, и Роман записывает каждый заезд: кто
      управлял и за сколько секунд. Один и тот же пилот может ехать несколько раз, порядок заездов
      важен, записи потом не меняются. Что подойдёт лучше всего?
    options:
      - "Словарь {пилот: время}"
      - Список кортежей (пилот, время)
      - Множество кортежей (пилот, время)
      - "Два списка: пилоты и времена"
    correct: 1
    explanation: >-
      Порядок важен и повторы возможны — значит, список. Каждая запись — неизменная пара из двух
      значений — значит, кортеж. В словаре второй заезд того же пилота затёр бы первый: ключи не
      повторяются. Множество потеряло бы порядок, а два одинаковых заезда слило бы в один. В двух
      параллельных списках легко обновить один и забыть про второй.
    coach: >-
      Здесь сработали сразу три вопроса: порядок, повторы и «будет ли меняться».

  - id: practice-book
    type: exercise
    title: Практика 1
    exercise:
      id: m4-l6-e1
      kind: modify
      title: Телефонная книга на словаре
      statement: |-
        Роман хранит телефоны родителей в двух списках: имена ребят в одном, номера в другом, на
        тех же местах. Программа пока только печатает книгу.

        Новое требование: программа получает имя и номер. Если такое имя в книге уже есть, его
        номер заменяется новым, и запись остаётся на своём месте. Если имени нет, запись
        добавляется в конец. После этого программа выводит всю книгу.

        **Переделай хранение на словарь в фигурных скобках** `{имя: номер}` — со словарём такое
        изменение делается одной строкой. Например, для ввода `Боря` и `777-88` вывод такой:

        ```text
        Аня: 111-22
        Боря: 777-88
        Вика: 555-66
        ```
      input: Две строки — имя и новый номер телефона.
      output: "Вся книга, по строке на запись: `Имя: номер`."
      constraints:
        - "Книгу храни в словаре, записанном в фигурных скобках: `{\"Аня\": \"111-22\", …}`. Списки имён и номеров для работы с книгой больше не нужны."
        - Номер — это текст, в нём бывают дефисы, пробелы и плюс. Выводи его точно так, как ввели.
      starterCode: |
        names = ["Аня", "Боря", "Вика"]
        phones = ["111-22", "333-44", "555-66"]
        for i in range(len(names)):
            print(f"{names[i]}: {phones[i]}")
      tests:
        - id: t1
          kind: io
          title: "Пример 1: новый номер у Бори"
          example: true
          stdin: "Боря\n777-88\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Аня: 111-22
            Боря: 777-88
            Вика: 555-66
        - id: t2
          kind: io
          title: "Пример 2: новое имя"
          example: true
          stdin: "Гоша\n999-00\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Аня: 111-22
            Боря: 333-44
            Вика: 555-66
            Гоша: 999-00
        - id: t3
          kind: io
          title: "Граничный случай: тот же номер"
          edge: true
          stdin: "Вика\n555-66\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Аня: 111-22
            Боря: 333-44
            Вика: 555-66
        - id: t4
          kind: io
          title: "Граничный случай: номер с плюсом и пробелами"
          edge: true
          stdin: "Аня\n+7 000 123-45-67\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Аня: +7 000 123-45-67
            Боря: 333-44
            Вика: 555-66
      rules:
        - id: r-dict
          use: [Dict]
          avoid: [call:.append]
          message: >-
            Храни книгу в словаре в фигурных скобках `{имя: номер}` и работай с ним, а не со
            списками: новое имя добавляет присваивание по ключу, `append` здесь не нужен.
      criteria:
        - Книга хранится в словаре «имя → номер».
        - Номер у имени, которое уже есть, заменяется, и запись остаётся на своём месте.
        - Новое имя добавляется в конец книги.
        - "Номер выводится точно так, как его ввели; формат строки — `Имя: номер`."
      hints:
        - >-
          Вспомни урок про словари: что делает присваивание по ключу, если такой ключ уже есть, и
          что — если его нет? Сколько строк тогда понадобится на замену номера и на новую запись?
        - |-
          На другом примере:
          ```python
          ages = {"Оля": 30}
          ages["Оля"] = 31      # ключ есть — значение заменится
          ages["Ян"] = 25       # ключа нет — пара добавится в конец
          for who, age in ages.items():
              print(f"{who}: {age}")
          ```
        - |-
          Каркас:
          ```text
          book = {"Аня": "111-22", …}
          прочитать имя и номер — два input()
          одна строка: записать номер в book по ключу-имени
          для каждой пары (имя, номер) из book.items():
              вывести "имя: номер"
          ```
      solution:
        code: |
          book = {"Аня": "111-22", "Боря": "333-44", "Вика": "555-66"}
          name = input()
          phone = input()
          book[name] = phone
          for person, number in book.items():
              print(f"{person}: {number}")
        explanation: >-
          `book[name] = phone` делает сразу оба дела: если имя уже есть, заменяет номер, и запись
          остаётся на своём месте; если нет — добавляет новую пару в конец. Проверять `in` не
          нужно. `items()` отдаёт пары в порядке добавления. Номер не превращаем в число: в нём
          дефисы и пробелы, это текст. Можно и не переписывать книгу вручную, а собрать словарь
          из двух старых списков циклом: `book[names[i]] = phones[i]`.
      altSolutions:
        - code: |
            names = ["Аня", "Боря", "Вика"]
            phones = ["111-22", "333-44", "555-66"]
            book = {}
            for i in range(len(names)):
                book[names[i]] = phones[i]
            name = input()
            phone = input()
            book[name] = phone
            for person in book:
                print(f"{person}: {book[person]}")
          note: Словарь собран из двух старых списков, перебор по ключам.
        - code: |
            book = {"Аня": "111-22", "Боря": "333-44", "Вика": "555-66"}
            name = input()
            phone = input()
            if name in book:
                book[name] = phone
            else:
                book[name] = phone
            for name, phone in book.items():
                print(name + ": " + phone)
          note: Лишняя, но безвредная проверка in; склейка строк вместо f-строки.
        - code: |
            book = {
                "Аня": "111-22",
                "Боря": "333-44",
                "Вика": "555-66",
            }
            name, phone = input(), input()
            book[name] = phone
            for person, number in book.items():
                print(f"{person}: {number}")
          note: Словарь записан в несколько строк, имя и номер читаются распаковкой.
        - code: |
            book = {}
            book["Аня"] = "111-22"
            book["Боря"] = "333-44"
            book["Вика"] = "555-66"
            who = input()
            new_phone = input()
            book[who] = new_phone
            for person in book:
                print(person + ":", book[person])
          note: Словарь из пустых скобок заполнен по ключу; print через запятую.
        - code: |
            phones = {"Аня": "111-22", "Боря": "333-44", "Вика": "555-66"}
            name = input().strip()
            phones[name] = input().strip()
            for name in phones:
                print(f"{name}: {phones.get(name)}")
          note: Другое имя словаря, strip() у ввода, номер сразу из input(), get при выводе.
      wrongSolutions:
        - code: |
            names = ["Аня", "Боря", "Вика"]
            phones = ["111-22", "333-44", "555-66"]
            name = input()
            phone = input()
            found = False
            for i in range(len(names)):
                if names[i] == name:
                    phones[i] = phone
                    found = True
            if not found:
                names.append(name)
                phones.append(phone)
            for i in range(len(names)):
                print(f"{names[i]}: {phones[i]}")
          note: Всё работает на двух списках — тесты проходят, но требование про словарь не выполнено.
          expectMistake: kept-lists
        - code: |
            names = ["Аня", "Боря", "Вика"]
            phones = ["111-22", "333-44", "555-66"]
            for i in range(len(names)):
                print(f"{names[i]}: {phones[i]}")
          note: Стартовый код без изменений — ввод не читается.
          expectMistake: no-update
        - code: |
            book = {"Аня": "111-22", "Боря": "333-44", "Вика": "555-66"}
            name = input()
            phone = input()
            if name not in book:
                book[name] = phone
            for person, number in book.items():
                print(f"{person}: {number}")
          note: Запись только для новых имён — существующий номер не меняется.
          expectMistake: only-new
        - code: |
            book = {"Аня": "111-22", "Боря": "333-44", "Вика": "555-66"}
            name = input()
            phone = input()
            book[name] = phone
            print(book)
          note: Словарь напечатан целиком.
          expectMistake: print-dict
        - code: |
            book = {"Аня": "111-22", "Боря": "333-44", "Вика": "555-66"}
            name = input()
            phone = int(input())
            book[name] = phone
            for person, number in book.items():
                print(f"{person}: {number}")
          note: Номер превращается в число.
          expectMistake: phone-int
        - code: |
            book = {"Аня": "111-22", "Боря": "333-44", "Вика": "555-66"}
            name = input()
            phone = input()
