      mistakes:
        - id: braces-dict
          when:
            errorIncludes: "'dict' object has no attribute 'add'"
          where: Строка, где создаётся пустое множество
          why: >-
            Пустые фигурные скобки `{}` создают не множество, а пустой **словарь**. У словаря нет
            метода `add`, поэтому программа остановилась на первом же имени.
          try: Создай пустое множество через `set()` — с круглыми скобками.
          verify: "«Пример 1»: две строки — `Боря`, потом `Гоша`."
        - id: print-set
          when:
            outputIncludes: "{"
          why: >-
            На экране множество целиком: в фигурных скобках, в одну строку и в случайном порядке.
            Множество знает, кто не сдал, но не помнит, в каком порядке записан кружок.
          try: >-
            Пройди циклом по списку кружка и печатай тех, кого нет среди сдавших:
            `if student not in done`.
          verify: "«Пример 1»: две строки — `Боря`, потом `Гоша`."
        - id: set-order
          when:
            codeRegex: '\bfor\s+\w+\s+in\s+(?![^:\n]*\brange\()[^:\n]*-|\b(\w+)\s*=[^=\n][^\n]*-[\s\S]*\bfor\s+\w+\s+in\s+\1\s*:'
          where: Цикл, который идёт по разнице множеств
          why: >-
            Цикл идёт по множеству, а у множества нет порядка: порядок перебора не связан с
            порядком кружка. На одном вводе он может случайно совпасть, а на другом — нет. А нужен
            именно порядок списка кружка.
          try: >-
            Иди циклом по списку кружка и про каждого спрашивай у множества сдавших:
            `if student not in done`.
          verify: >-
            Все тесты зелёные; в «Граничном случае: не сдали почти все» — пять имён ровно в
            порядке кружка: `Аня`, `Боря`, `Вика`, `Дима`, `Женя`.
        - id: split-space
          when:
            codeRegex: '\.split\(\s*\)'
            outputIncludes: ","
          where: Строка, где режется список кружка
          why: >-
            `split()` без аргумента режет по пробелам, и запятая остаётся приклеенной к имени:
            `'Аня,'`. Такое имя не совпадает с `'Аня'` из списка сдавших.
          try: "Режь список кружка по запятой с пробелом: `split(\", \")`."
          verify: "«Пример 1»: две строки — `Боря` и `Гоша`, без запятых."
        - id: split-comma
          when:
            codeRegex: '\.split\(\s*["''],["'']\s*\)'
            outputIncludes: " Боря"
          where: Строка, где режется список кружка
          why: >-
            `split(",")` режет только по запятой, и пробел после неё остаётся в начале имени:
            `' Вика'`. Такое имя не совпадает с `'Вика'` из списка сдавших, поэтому Вика попала в
            должники, хотя сдала.
          try: >-
            Режь по запятой с пробелом — `split(", ")` — или убирай пробел у каждого имени из
            списка кружка через `strip()`.
          verify: "«Пример 1»: две строки — `Боря` и `Гоша`, без пробела в начале и без Вики."
        - id: else-in-loop
          when:
            failedTest: t1
            outputIncludes: Все сдали
            codeRegex: '\bfor\b[^\n]*:[ \t]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+else\s*:'
          why: >-
            `Все сдали` печатается внутри цикла — для каждого, кто сдал. А решить, что сдали все,
            можно только после того, как проверен весь кружок.
          try: >-
            Убери `else` из цикла. Считай должников счётчиком (или отмечай флагом) и после цикла,
            если их ноль, выведи `Все сдали`.
          verify: "«Пример 1»: две строки — `Боря` и `Гоша`, без `Все сдали`."
        - id: message-always
          when:
            failedTest: t1
            outputIncludes: Все сдали
          why: >-
            `Все сдали` печатается и тогда, когда должники есть: эта строка не стоит под условием.
            А сообщение нужно, только если ни одного должника не нашлось.
          try: >-
            Считай должников счётчиком (или отмечай флагом) и после цикла выводи `Все сдали`
            только при нуле: `if missing == 0:`.
          verify: "«Пример 1»: две строки — `Боря` и `Гоша`, без `Все сдали`."
        - id: inverted
          when:
            failedTest: t1
            outputEquals: |-
              Аня
              Вика
          why: >-
            Программа напечатала тех, кто сдал, — Аню и Вику, — а нужны те, кто ещё не сдал.
            Условие в цикле перевёрнуто.
          try: "Печатай ученика, если его **нет** среди сдавших: `if student not in done:`."
          verify: "«Пример 1»: две строки — `Боря` и `Гоша`."
        - id: remove-in-loop
          when:
            codeIncludes: .remove(
            failedTest: t2
            outputIncludes: Марк
          where: Цикл, который вычёркивает сдавших
          why: >-
            Сдавшие вычёркиваются из списка `students` прямо в цикле, который идёт по этому же
            списку. После `remove` следующие имена сдвигаются на место влево, и цикл перескакивает
            через одно из них. В «Примере 2» так пропущен Марк: он сдал, но остался в списке.
          try: >-
            Не меняй список, по которому идёт цикл. Проще ничего не вычёркивать: иди по списку
            кружка и печатай тех, кого нет в `done`. Если хочешь вычёркивать — делай это в копии
            `left = students.copy()`, а цикл веди по `students`.
          verify: "«Пример 2» должен дать `Все сдали`."
        - id: substring-in
          when:
            failedTest: t8
            outputEquals: Все сдали
          why: >-
            Ян не сдавал, а программа решила, что сдал: «Ян» нашёлся внутри «Яна». Так бывает,
            когда сдавших хранят одной строкой — `in` по строке ищет кусок текста, а не целое имя.
          try: >-
            Храни сдавших во множестве: `done.add(input())`. Тогда `in` сравнивает имена целиком.
          verify: "Тест «Граничный случай: одно имя — начало другого» должен дать `Ян`."
        - id: count-not-names
          when:
            failedTest: t6
            outputIncludes: Все сдали
          why: >-
            Сдач столько же, сколько ребят в кружке, но Ира сдала дважды, а Кира — ни разу. Число
            сдач не говорит, сдал ли каждый.
          try: >-
            Проверяй людей, а не число сдач: пройди по списку кружка и посчитай тех, кого нет среди
            сдавших. `Все сдали` — только если таких ноль.
          verify: "Тест «Граничный случай: сдач столько же, сколько ребят» должен дать `Кира`."
        - id: no-message
          when:
            failedTest: t2
            outputEquals: ""
            codeIncludes: print(
          why: >-
            Когда сдали все, программа ничего не выводит: цикл никого не печатает, а отдельной
            строки на этот случай нет.
          try: >-
            Считай, сколько имён напечатано (или заведи флаг), и после цикла выведи `Все сдали`,
            если ни одного.
          verify: "«Пример 2» должен дать `Все сдали`."
      afterPass: >-
        Список отвечает за порядок, множество — за быстрый ответ «сдал или нет». На четырёх именах
        разницы в скорости не видно, но на тысячах она заметна. Если захочешь, выведи в конце ещё
        и итог вроде `Не сдали: 2 из 4` — если считал должников счётчиком, он у тебя уже есть.
      skills: [choose-structure, sets-tuples, lists]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Список — порядок и повторы; словарь — поиск по ключу и подсчёт; множество — уникальность и быстрый ответ «есть ли»; кортеж — неизменная запись из нескольких значений."
      - Перед кодом задай данным четыре вопроса — важен ли порядок, нужны ли повторы, ищу ли по названию, будут ли данные меняться.
      - "Структуры вкладываются друг в друга: словарь списков, список кортежей. `d[k].append(x)` меняет список прямо внутри словаря."
      - Параллельные списки почти всегда проще заменить словарём, а если нужны и порядок, и быстрый ответ «есть или нет», — список и множество вместе.
    question: >-
      Нужно хранить для каждого ученика все его оценки по порядку. Какую структуру выберешь и
      почему?
    answer: >-
      Словарь, где ключ — имя ученика, а значение — список его оценок: `{"Аня": [5, 4, 5]}`. По
      имени словарь сразу находит ученика, а список хранит оценки по порядку и с повторами —
      пятёрок может быть несколько.
