  - id: practice-schedule
    type: exercise
    title: Практика 2
    exercise:
      id: m4-l6-e2
      kind: write
      title: Расписание кружков
      statement: |-
        В Доме творчества, где Роман ведёт робототехнику, расписание всех кружков собирают из
        заявок. Каждая заявка — строка `день занятие`, например `пн робототехника`. Заявки
        приходят вперемешку.

        Сгруппируй занятия по дням: для каждого дня выведи одну строку, где после дня и
        двоеточия перечислены все его занятия через запятую с пробелом:

        ```text
        пн: робототехника, английский
        ```

        Дни выводятся в том порядке, в каком впервые встретились во вводе, занятия внутри дня —
        в порядке ввода. Если заявок нет, выведи `Расписание пустое`.
      input: >-
        Первая строка — число заявок n (0 или больше). Затем n строк вида `день занятие`: день и
        занятие — по одному слову через пробел.
      output: "Для каждого дня строка `день: занятие1, занятие2, …` или одна строка `Расписание пустое`."
      constraints:
        - Во вводе одно и то же занятие в один день не повторяется — убирать повторы не нужно.
        - Дни сортировать не нужно — порядок как во вводе.
      starterCode: |
        n = int(input())
        # Сгруппируй занятия по дням и выведи расписание
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "4\nпн робототехника\nср шахматы\nпн английский\nпт бассейн\n"
          compare:
            ignoreSpaces: true
          expected: |-
            пн: робототехника, английский
            ср: шахматы
            пт: бассейн
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "3\nвт рисование\nчт хор\nвт робототехника\n"
          compare:
            ignoreSpaces: true
          expected: |-
            вт: рисование, робототехника
            чт: хор
        - id: t3
          kind: io
          title: "Граничный случай: одна заявка"
          edge: true
          stdin: "1\nсб футбол\n"
          compare:
            ignoreSpaces: true
          expected: "сб: футбол"
        - id: t4
          kind: io
          title: "Граничный случай: дни вперемешку"
          edge: true
          stdin: "5\nчт танцы\nпн йога\nчт шахматы\nпн плавание\nчт хор\n"
          compare:
            ignoreSpaces: true
          expected: |-
            чт: танцы, шахматы, хор
            пн: йога, плавание
        - id: t5
          kind: io
          title: "Граничный случай: заявок нет"
          edge: true
          stdin: "0\n"
          compare:
            ignoreSpaces: true
          expected: Расписание пустое
        - id: t6
          kind: io
          title: "Граничный случай: много занятий в один день"
          edge: true
          stdin: "8\nпт бассейн\nпн йога\nпт шахматы\nср хор\nпт рисование\nвт футбол\nпт танцы\nпт лепка\n"
          compare:
            ignoreSpaces: true
          expected: |-
            пт: бассейн, шахматы, рисование, танцы, лепка
            пн: йога
            ср: хор
            вт: футбол
      criteria:
        - Занятия одного дня собраны в одну строку, в порядке ввода.
        - Каждый день выводится один раз, в порядке первого появления.
        - Занятия разделены запятой с пробелом, без скобок и кавычек.
        - "Если заявок нет, выводится `Расписание пустое`."
      hints:
        - >-
          Задай данным вопросы из теории. День нужно находить по названию, а для каждого дня —
          помнить несколько занятий по порядку. Какая структура ищет по названию и какая хранит
          несколько значений по порядку? Как их вложить друг в друга — и что делать, когда день
          встретился впервые?
        - |-
          Похожий приём — слова по первой букве:
          ```python
          groups = {}
          for word in ["арбуз", "банан", "астра"]:
              letter = word[0]
              if letter not in groups:
                  groups[letter] = []
              groups[letter].append(word)
          print(groups)                    # {'а': ['арбуз', 'астра'], 'б': ['банан']}
          print(", ".join(groups["а"]))    # арбуз, астра
          ```
        - |-
          Каркас:
          ```text
          n = int(input())
          schedule = {}
          повторить n раз:
              day, activity = input().split()
              если day ещё нет в schedule — положить туда пустой список
              добавить activity в список schedule[day]
          если в schedule ничего нет — вывести «Расписание пустое»
          для каждой пары day, activities из schedule.items():
              вывести день, двоеточие и ", ".join(activities)
          ```
      solution:
        code: |
          n = int(input())
          schedule = {}
          for i in range(n):
              day, activity = input().split()
              if day not in schedule:
                  schedule[day] = []
              schedule[day].append(activity)
          if len(schedule) == 0:
              print("Расписание пустое")
          for day, activities in schedule.items():
              print(f"{day}: {', '.join(activities)}")
        explanation: >-
          Здесь работает словарь списков: ключ — день, значение — список занятий этого дня. Когда
          день встречается впервые, для него создаётся пустой список, а дальше каждое занятие
          добавляется в конец списка своего дня: `schedule[day].append(activity)` меняет список
          прямо внутри словаря. Словарь помнит порядок добавления ключей, поэтому дни выходят в
          порядке первого появления, а `", ".join(...)` собирает занятия в строку. Внутри f-строки
          разделитель взят в одинарные кавычки `', '`, чтобы не путаться с двойными кавычками самой
          f-строки; можно и сначала сохранить `", ".join(activities)` в переменную. Если заявок
          нет, словарь пуст и цикл печати не выполнится ни разу — остаётся только сообщение.
      altSolutions:
