        - id: join-on-list
          when:
            errorIncludes: has no attribute 'join'
          where: Строка, где занятия склеиваются в строку
          why: >-
            `join` — метод строки-разделителя, а не списка. У списка такого метода нет, отсюда
            AttributeError.
          try: >-
            Вызови `join` у разделителя, а список передай в скобках: `", ".join(activities)`.
          verify: "Первая строка «Примера 1» — `пн: робототехника, английский`."
        - id: list-plus-str
          when:
            errorIncludes: not "list"
          why: >-
            К строке через `+` приклеивается список занятий. `+` склеивает строку только со
            строкой, а список — не строка, отсюда TypeError. Превращать список через `str()` тоже
            не стоит: на экране появятся скобки и кавычки.
          try: >-
            Сначала склей список в строку — `", ".join(activities)` — и уже её приклеивай к дню.
          verify: "Первая строка «Примера 1» — `пн: робототехника, английский`."
        - id: print-list
          when:
            outputIncludes: "['"
          why: >-
            Занятия напечатаны как список Python — в квадратных скобках и кавычках. Так список
            выглядит на экране, а в расписании нужна обычная строка.
          try: "Склей список занятий в строку: `\", \".join(activities)`."
          verify: "Первая строка «Примера 1» — `пн: робототехника, английский`."
        - id: get-not-stored
          when:
            failedTest: t1
            outputEquals: Расписание пустое
            codeIncludes: .get(
          why: >-
            Словарь остался пустым. Если дня нет, `get(day, [])` возвращает новый пустой список,
            и `append` добавляет занятие в него. Но в словарь этот список никто не положил, и он
            тут же пропадает.
          try: >-
            Сначала положи список в словарь — `schedule[day] = []`, если дня ещё нет, — а потом
            добавляй занятие в `schedule[day]`.
          verify: "Первая строка «Примера 1» — `пн: робототехника, английский`."
        - id: empty-for-nonempty
          when:
            failedTest: t1
            outputIncludes: Расписание пустое
          why: >-
            Заявки есть, а программа всё равно напечатала «Расписание пустое». Эта строка нужна,
            только когда словарь пуст после чтения всех заявок. Здесь она либо стоит без условия,
            либо проверка стоит раньше цикла чтения, либо занятия так и не попали в словарь.
          try: >-
            Поставь `print("Расписание пустое")` под условие `if len(schedule) == 0:` после цикла
            чтения. Если так и есть, выведи после цикла `print(schedule)` и посмотри, появились ли
            в словаре дни.
          verify: "Первая строка «Примера 1» — `пн: робототехника, английский`."
        - id: dict-reset
          when:
            codeRegex: '\bfor\b[^\n]*:[ \t]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+\w+\s*=\s*\{\s*\}'
            failedTest: t1
          where: Строка, где создаётся словарь
          why: >-
            Пустой словарь создаётся внутри цикла чтения, то есть заново на каждой заявке. Всё,
            что набралось раньше, пропадает, и остаётся только последняя заявка.
          try: >-
            Создай словарь один раз — до цикла, без отступа. В цикле только добавляй в него
            занятия.
          verify: "«Пример 1»: три строки — `пн`, `ср` и `пт`."
        - id: overwrite-list
          when:
            outputEquals: |-
              пн: английский
              ср: шахматы
              пт: бассейн
          why: >-
            У понедельника осталось только последнее занятие. Каждый раз, когда встречается день,
            для него записывается новый список, например `schedule[day] = [activity]`, и старый
            список вместе с первым занятием пропадает.
          try: >-
            Создавай список только для нового дня, а для дня, который уже есть в словаре,
            добавляй занятие в его список через `append`.
          verify: "Первая строка «Примера 1» — `пн: робототехника, английский`."
        - id: not-grouped
          when:
            codeRegex: 'input\(\)[^\n]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+print\('
            failedTest: t1
          where: Цикл, который читает заявки
          why: >-
            Печать стоит внутри цикла чтения, поэтому строка выводится после каждой заявки, и
            понедельник встречается дважды. Чтобы собрать занятия одного дня вместе, сначала нужно
            прочитать все заявки.
          try: >-
            Складывай заявки в словарь «день → список занятий», а печатай отдельным циклом после
            цикла чтения — без отступа перед `for`.
          verify: "В «Примере 1» должно быть три строки — по одной на день."
        - id: no-message
          when:
            failedTest: t5
            outputEquals: ""
            codeIncludes: print(
          why: >-
            Когда заявок нет, программа ничего не выводит: цикл печати не выполняется ни разу, а
            отдельной строки на этот случай нет.
          try: >-
            После цикла чтения проверь, пуст ли словарь, — `if len(schedule) == 0:` — и тогда
            выведи `Расписание пустое`.
          verify: "Тест «Граничный случай: заявок нет» должен дать `Расписание пустое`."
        - id: set-no-order
          when:
            codeRegex: '\]\s*=\s*set\(|\b(\w+)\s*=\s*set\(\s*\)[\s\S]*\bfor\s+\w+\s+in\s+\1\s*:'
          why: >-
            Порядок хранит список, а у множества порядка нет: занятия выходят не в том порядке, в
            каком пришли заявки. Повторов во вводе и так не бывает, так что множество здесь ничего
            не даёт.
          try: >-
            Храни занятия дня в списке — `[]` и `append`, а дни — ключами словаря: словарь помнит
            порядок, в котором ключи появились.
          verify: "«Пример 1»: строки `пн`, `ср`, `пт` в этом порядке, у понедельника — `робототехника, английский`."
      afterPass: >-
        Словарь списков — одна из самых частых вложенных структур: заказы по клиентам, задачи по
        дням, файлы по папкам. Если захочешь, выведи дни в порядке недели, а не ввода: заведи
        список `["пн", "вт", "ср", "чт", "пт", "сб", "вс"]`, пройди по нему и печатай только те
        дни, что есть в словаре.
      skills: [choose-structure, dicts, lists, string-methods]

  - id: practice-missing
    type: exercise
    title: Практика 3
    exercise:
      id: m4-l6-e3
      kind: write
      title: Кто не сдал проект
      statement: |-
        К концу четверти каждый кружковец сдаёт Роману проект. Первая строка ввода — список
        кружка через запятую с пробелом. Дальше — число сданных работ n и n имён тех, кто сдал.
        Одно имя может встретиться несколько раз: кто-то присылал исправленную версию. Чужих имён
        среди сдавших нет.

        Выведи тех, кто ещё не сдал, по одному в строке, **в том порядке, в каком они записаны в
        списке кружка**. Если сдали все, выведи `Все сдали`.
      input: >-
        Первая строка — имена кружковцев через `, `. Вторая — число n (0 или больше). Затем n
        строк, в каждой — имя того, кто сдал.
      output: "Имена тех, кто не сдал, по одному в строке, или `Все сдали`."
      constraints:
        - В кружке хотя бы один человек, имена в списке кружка не повторяются.
        - Имена сравниваются точно, с учётом заглавной буквы.
      starterCode: |
        # Прочитай список кружка, число сданных работ и имена сдавших
        # Выведи тех, кто ещё не сдал, в порядке списка кружка
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "Аня, Боря, Вика, Гоша\n3\nВика\nАня\nВика\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Боря
            Гоша
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "Лиза, Марк, Нина\n3\nНина\nЛиза\nМарк\n"
          compare:
            ignoreSpaces: true
          expected: Все сдали
        - id: t3
          kind: io
          title: "Граничный случай: никто не сдал"
          edge: true
          stdin: "Олег, Петя, Рита\n0\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Олег
            Петя
            Рита
        - id: t4
          kind: io
          title: "Граничный случай: кружок из одного человека"
          edge: true
          stdin: "Сева\n1\nСева\n"
          compare:
            ignoreSpaces: true
          expected: Все сдали
        - id: t5
          kind: io
          title: "Граничный случай: сдали двое из пятерых"
          edge: true
          stdin: "Аня, Боря, Вика, Гоша, Дима\n2\nДима\nБоря\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Аня
            Вика
            Гоша
        - id: t6
          kind: io
          title: "Граничный случай: сдач столько же, сколько ребят"
          edge: true
          stdin: "Ира, Кира\n2\nИра\nИра\n"
          compare:
            ignoreSpaces: true
          expected: Кира
        - id: t7
          kind: io
          title: "Граничный случай: не сдали почти все"
          edge: true
          stdin: "Аня, Боря, Вика, Гоша, Дима, Женя\n1\nГоша\n"
          compare:
            ignoreSpaces: true
          expected: |-
            Аня
            Боря
            Вика
            Дима
            Женя
        - id: t8
          kind: io
          title: "Граничный случай: одно имя — начало другого"
          edge: true
          stdin: "Ян, Яна\n1\nЯна\n"
          compare:
            ignoreSpaces: true
          expected: Ян
      criteria:
        - Выводятся все, кто не сдал, и только они.
        - Порядок — как в списке кружка, а не как в списке сдавших.
        - Повторные сдачи одного человека не мешают.
        - "Если не сдавших нет, выводится `Все сдали`."
      hints:
        - >-
          Здесь у данных две роли: одни должны помнить порядок кружка, другие — быстро отвечать
          на вопрос «сдал или нет». Какая структура подходит для каждой роли?
        - |-
          На другом примере — кого нет среди важных гостей, в порядке списка гостей:
          ```python
          vip = {"Оля", "Ян"}
          for guest in ["Ян", "Ира", "Оля", "Том"]:
              if guest not in vip:
                  print(guest)          # Ира, потом Том
          ```
        - |-
          Каркас:
          ```text
          students = первая строка, разрезанная по ", "
          n = int(input())
          done = пустое множество
          повторить n раз: добавить input() в done
          missing = 0
          для каждого student из students:
              если student не в done — вывести его и увеличить missing
          если missing == 0 — вывести «Все сдали»
          ```
      solution:
        code: |
          students = input().split(", ")
          n = int(input())
          done = set()
          for i in range(n):
              done.add(input())
          missing = 0
          for student in students:
              if student not in done:
                  print(student)
                  missing = missing + 1
          if missing == 0:
              print("Все сдали")
        explanation: >-
          Список `students` помнит порядок кружка, а множество `done` отвечает на вопрос «сдал
          или нет», и повторные сдачи в нём сливаются сами. Цикл идёт по списку кружка, поэтому
          должники выводятся в нужном порядке, а счётчик `missing` после цикла показывает, был ли
          хоть один. `set(students) - done` тоже даёт должников, но у множества нет порядка —
          поэтому идём по списку. Сдавших можно хранить и в списке: `in` сработает так же, только
          на больших данных медленнее.
