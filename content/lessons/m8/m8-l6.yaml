      mistakes:
        - id: string-dates
          when:
            errorIncludes: "unsupported operand type(s) for -"
          where: Функция days_left
          why: >-
            Даты пришли строками, а вычитать можно только дату из даты: Python не знает, что
            `"2026-10-12"` — это дата. Отсюда TypeError.
          try: >-
            Преврати в даты обе строки — и срок, и сегодня — через `date.fromisoformat(...)`
            (урок 8.1), а потом вычитай.
          verify: 'В «Примере 3» `days_left("2026-10-12", "2026-10-05")` должна вернуть 7.'
        - id: timedelta-compare
          when:
            errorType: TypeError
            errorIncludes: datetime.timedelta
          why: >-
            Дата минус дата — это не число, а промежуток `timedelta`: ни сравнить его с числом, ни
            превратить в число через `int()` нельзя. Число дней лежит в промежутке отдельно — в
            `.days`.
          try: >-
            Пусть `days_left` сама возвращает число: возьми у промежутка `.days` перед `return`.
          verify: 'В «Примере 3» `days_left("2026-10-12", "2026-10-05")` должна вернуть число 7, а не промежуток.'
        - id: today-as-date
          when:
            errorIncludes: "argument must be str"
          why: >-
            В `date.fromisoformat` попала не строка. Чаще всего это уже готовая дата: код запуска
            сам превратил ввод через `fromisoformat`, а `days_left` по условию получает строки
            ГГГГ-ММ-ДД и превращает их сама.
          try: >-
            Передавай в `describe` и `days_left` строки как есть: срок `task["due"]` из файла и
            сегодняшнюю дату из `input()`. Превращать их в даты — работа `days_left`.
          verify: В «Примере 1» программа не должна падать.
        - id: module-attr
          when:
            errorIncludes: "module 'datetime' has no attribute"
          why: >-
            После `import datetime` имя `datetime` — это весь модуль, а дата внутри него
            называется `datetime.date`. У самого модуля нет `fromisoformat`, отсюда AttributeError.
          try: >-
            Напиши `from datetime import date` и дальше `date.fromisoformat(...)` — или оставь
            `import datetime` и пиши полностью: `datetime.date.fromisoformat(...)`.
          verify: В «Примере 1» программа не должна падать.
        - id: date-not-imported
          when:
            errorIncludes: "name 'date' is not defined"
          why: >-
            Имя `date` не подключено. `import datetime` даёт только имя модуля, а `date` без
            приставки появляется после `from datetime import date` (урок 8.1).
          try: Добавь в начало модуля `from datetime import date`.
          verify: В «Примере 1» программа не должна падать.
        - id: global-today
          when:
            failedTest: t9
            errorIncludes: "name 'today' is not defined"
          why: >-
            Функция берёт `today` не из своего параметра, а из кода запуска. При запуске файла это
            сходит с рук: там переменная `today` есть. А при `import deadlines` код запуска не
            выполняется — и имени `today` нет.
          try: >-
            Внутри функции пользуйся только её параметрами: имя в теле должно совпадать с именем
            параметра в `def` (урок 5.4).
          verify: Тест «Импорт без лишних действий» должен стать зелёным.
        - id: load-by-name
          when:
            errorIncludes: "has no attribute 'read'"
          why: >-
            `json.load` ждёт открытый файл, а получил строку с его именем — и не смог из неё
            читать.
          try: >-
            Открой файл через `with open("tasks.json", encoding="utf-8") as file:` и передай в
            `json.load` сам `file` (модуль 7).
          verify: В «Примере 1» программа не должна падать.
        - id: loads-file
          when:
            errorIncludes: "not TextIOWrapper"
          why: >-
            `json.loads` — с буквой s на конце — разбирает строку, а получил открытый файл.
          try: >-
            Для открытого файла есть `json.load(file)` — без s (модуль 7).
          verify: В «Примере 1» программа не должна падать.
        - id: input-in-loop
          when:
            errorType: EOFError
            failedTest: t1
          why: >-
            Программа попросила ввод больше одного раза, а во вводе одна строка — сегодняшняя
            дата. Похоже, `input()` стоит в цикле или внутри функции и срабатывает на каждой задаче.
          try: >-
            Прочитай дату один раз — в коде запуска, до цикла, — и передавай её в функции
            параметром `today`.
          verify: В «Примере 1» программа не должна падать.
        - id: file-at-import
          when:
            errorType: FileNotFoundError
            errorIncludes: "'tasks.json'"
            failedTest: t9
          why: >-
            Модуль читает `tasks.json` сразу при `import deadlines`: `open` стоит снаружи
            `if __name__ == "__main__":`. Программе, которая подключает модуль из другой папки,
            нужны только функции, а файла рядом с ней может не быть — тогда импорт падает с
            FileNotFoundError, как в этой проверке.
          try: >-
            Перенеси чтение файла под `if __name__ == "__main__":` — это часть кода запуска, как
            ввод даты и печать.
          verify: Тест «Импорт без лишних действий» должен стать зелёным.
        - id: wrong-file
          when:
            errorType: FileNotFoundError
          why: >-
            В рабочей папке нет файла с таким именем. Файл задания называется `tasks.json` — он
            лежит рядом с `deadlines.py`, его видно в блоке «Файлы задания».
          try: Сверь имя в `open(...)` с именем файла посимвольно — `tasks.json`, вместе с расширением.
          verify: В «Примере 1» программа не должна падать.
        - id: wrong-key
          when:
            errorType: KeyError
          why: >-
            У задачи нет ключа, по которому ты обращаешься. В `tasks.json` у каждой задачи ровно
            три ключа: `title`, `due` и `done`.
          try: Открой блок «Файлы задания» и сверь ключи в `task[...]` с ключами в файле.
          verify: В «Примере 1» программа не должна падать.
        - id: today-from-device
          when:
            codeRegex: '^[^#\n]*\.today\(\)'
          why: >-
            `date.today()` берёт дату с устройства, а проверка подставляет свою через ввод: в
            «Примере 1» это 5 октября 2026 года, в «Примере 2» — 30 октября. С датой устройства
            строки не совпадут.
          try: >-
            Прочитай сегодняшнюю дату через `input()`, как сказано в условии. На компьютере в своём
            проекте можно будет подставить `date.today()`.
          verify: 'В «Примере 1» должна появиться строка «Сегодня: Оплатить интернет».'
        - id: delta-in-text
          when:
            outputIncludes: "0:00:00 дн."
          why: >-
            В строку попал сам промежуток: print и f-строка показывают его как `7 days, 0:00:00`.
            Число дней хранится в промежутке отдельно — в `.days`.
          try: Пусть `days_left` возвращает `.days`, и в строки подставляй уже это число.
          verify: 'В «Примере 1» должно быть «Через 7 дн.: Купить подарок маме».'
        - id: reversed
          when:
            outputIncludes: "Через 2 дн.: Вернуть дрель"
          why: >-
            Дрель нужно было вернуть 3 октября, а сегодня 5-е — срок прошёл, но программа пишет
            «Через 2 дн.». Где-то перепутан порядок: либо в `days_left` вычитается «сегодня минус
            срок», либо даты переданы в функцию наоборот — сначала сегодня, потом срок.
          try: >-
            Проверь оба места: внутри `days_left` — «срок минус сегодня», а в вызовах — сначала
            срок, потом сегодня: `days_left(due, today)`, `describe(title, due, today)`.
          verify: 'В «Примере 3» `days_left("2026-10-12", "2026-10-05")` должна вернуть 7.'
        - id: minus-in-text
          when:
            outputIncludes: "(-"
          why: >-
            `days_left` для просроченной задачи верно даёт отрицательное число, но в тексте нужно
            «сколько дней назад» — без минуса: `(2 дн.)`, а не `(-2 дн.)`.
          try: В ветке просрочки подставь в строку число с обратным знаком — `-left`.
          verify: 'В «Примере 1» первой строкой должно быть «Просрочено: Вернуть дрель соседу (2 дн.)».'
        - id: zero-overdue
          when:
            outputIncludes: Оплатить интернет (0 дн.)
          why: >-
            Срок «Оплатить интернет» — сегодня, а программа пишет «Просрочено … (0 дн.)». Ноль
            попал в ветку просрочки: условие вроде `left <= 0` захватывает и сегодняшний день
