                for task in tasks:
                    if task["done"]:
                        continue
                    shown += 1
                    if "due" not in task or task["due"] == "":
                        print("Без срока: " + task["title"])
                    else:
                        print(describe(task["title"], task["due"], today))
                if shown == 0:
                    print("Незакрытых задач нет")
          note: Проверка ключа через in и continue для выполненных задач.
