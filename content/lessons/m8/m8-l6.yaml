id: m8-l6
module: m8
number: "8.6"
title: "Самостоятельная работа: проект с нуля в чистой папке"
objective: >-
  Самостоятельно написать модуль сроков, который можно импортировать без лишних действий, и
  развернуть свой проект в чистой папке только по README и requirements.txt.
minutes: [25, 30]
prerequisites: [m8-l5]
skills: [venv-deps, git-workflow, modules-imports, dates-datetime, readme-docs]
environment: external

story:
  title: README из одной строки
  fictional: true
  text: >-
    Надежда, координатор волонтёрского центра, два года вела учёт задач в своей программе на
    старом ноутбуке. Когда ноутбук сломался, код нашёлся в копии репозитория, но README говорил
    только «запусти main.py». Какие библиотеки ставить и каких версий, помнил один старый ноутбук,
    и вечер ушёл на угадывание. Теперь у Надежды правило: проект готов, только когда его удаётся
    развернуть в пустой папке строго по README — без памяти и без старых файлов. Сегодня ты
    проверишь по этому правилу свой проект.

why: >-
  Проверка в чистой папке находит пробелы в инструкции раньше, чем их найдёт другой человек.
  Например, если без `python -m pip install -r requirements.txt` программа падает, а в README
  этой строки нет, README нужно дописать.

usedIn: >-
  Так проверяют проект перед тем, как передать его коллеге или заказчику. Автоматические сборки
  (CI) каждый раз разворачивают проект с нуля в чистой папке и запускают тесты — к тестам мы
  придём в модуле 9.

steps:
  - id: before-start
    type: theory
    title: Перед стартом
    body: |-
      Сегодня самостоятельная работа из двух частей:

      1. **Модуль сроков** — задание в тренажёре, около 20 минут, его можно решать и с телефона.
         За ним идёт усложнение — **по желанию**, ещё 5–10 минут. Подсказки в обоих заданиях
         откроются после первой проверки. Это не запрет на помощь — просто сначала попробуй сам.
      2. **Проект в чистой папке** — задача на порядок шагов и чек-лист на компьютере, 10–15
         минут. Для `pip install` нужен интернет, поэтому эту часть удобно сделать другим
         заходом.

      Шпаргалка модуля — по строке на урок:

      - **8.1:** `date.fromisoformat("2026-10-05")` превращает строку в дату; дата минус дата —
        промежуток, число дней в нём — `.days`.
      - **8.2:** модуль — файл `.py`; `import deadlines` выполняет его сверху вниз, поэтому код
        запуска прячут под `if __name__ == "__main__":`.
      - **8.3:** `python -m venv .venv`, затем `.venv\Scripts\activate` и
        `python -m pip install -r requirements.txt`.
      - **8.4:** перед коммитом — `git status` и `git diff`; `.gitignore` не пускает в
        репозиторий `.venv`, `__pycache__` и личный `tasks.json`.
      - **8.5:** эксперимент — в ветке: `git switch -c имя`, удачный сливают через `git merge`.
      - **Модуль 7:** `with open("tasks.json", encoding="utf-8") as file:` и
        `json.load(file)`.
      - **Новое сегодня:** `git clone папка новая-папка` копирует репозиторий в новую папку —
        только то, что есть в коммитах. Из папки на компьютере клон делается без интернета.

      Как работать над модулем сроков:

      1. Прочитай условие и примеры: что приходит на вход, что лежит в файле, что нужно
         вывести. Файл виден в блоке «Файлы задания».
      2. Начни с функции `days_left` и проверь её через «Запустить», временно напечатав
         результат для пары дат, — а перед «Проверить» убери эту строку: при `import` она тоже
         напечатается. Потом — `describe`, потом код запуска.
      3. Перед «Проверить» нажми «Запустить»: поле «Ввод для „Запустить“» уже заполнено датой
         из первого примера.

      Для части на компьютере нужен твой проект «Список задач» в Git — таким, каким он стал
      после уроков 8.2–8.5. Своего проекта нет — сначала пройди на учебном мини-проекте из
      урока 8.2 чек-листы уроков 8.2–8.4: пакет `todo`, окружение с requirements.txt, раздел
      «Установка» в README, `.gitignore` и коммиты. Клонировать нужно уже такой проект.
    simpler: >-
      Сегодня две проверки. Первая — сможешь ли ты сам написать модуль, который считает сроки
      задач и молча подключается через import. Вторая — поднимется ли твой проект в пустой папке
      строго по README. Нового почти нет: всё нужное было в уроках 8.1–8.5.
    coach: >-
      Ошибиться на первой попытке — нормально. Самостоятельная работа показывает, что уже
      получается само, а что стоит повторить.

  - id: main-task
    type: exercise
    title: Самостоятельная работа
    exercise:
      id: m8-l6-e1
      kind: write
      title: Модуль сроков
      filename: deadlines.py
      statement: |-
        Список задач научился хранить сроки. Напиши модуль `deadlines.py`, который подскажет,
        что пора делать. Задачи лежат в файле `tasks.json` (он в блоке «Файлы задания»): у каждой
        есть название `title`, срок `due` в виде строки ГГГГ-ММ-ДД и отметка `done` — выполнена
        ли задача.

        В модуле две функции:

        - `days_left(due, today)` — обе даты приходят строками ГГГГ-ММ-ДД. Функция возвращает,
          сколько дней осталось до срока, целым числом. Если срок прошёл, число
          отрицательное: `days_left("2026-10-03", "2026-10-05")` возвращает `-2`.
        - `describe(title, due, today)` возвращает строку об одной задаче — одну из трёх:

        ```text
        Просрочено: <название> (<сколько дней назад> дн.)
        Сегодня: <название>
        Через <сколько дней> дн.: <название>
        ```

        **При запуске файла** программа читает из ввода сегодняшнюю дату, загружает `tasks.json`
        и для каждой **невыполненной** задачи печатает строку `describe` — в порядке файла.
        Если невыполненных задач нет, печатает `Незакрытых задач нет`. Например, если сегодня
        `2026-10-05`, для файла задания вывод такой:

        ```text
        Просрочено: Вернуть дрель соседу (2 дн.)
        Сегодня: Оплатить интернет
        Через 7 дн.: Купить подарок маме
        ```

        **При `import deadlines`** модуль ничего не печатает, не ждёт ввода и не читает
        `tasks.json`: всё это — код запуска, а другая программа подключает модуль ради функций.
      input: Одна строка — сегодняшняя дата в виде ГГГГ-ММ-ДД. Задачи — в файле `tasks.json`.
      output: >-
        По строке на каждую невыполненную задачу в порядке файла или одна строка
        `Незакрытых задач нет`.
      constraints:
        - Подсказки откроются после первой проверки — сначала попробуй сам.
        - Файл читай с `encoding="utf-8"`.
        - У каждой задачи в файле есть `title`, `due` и `done`. Сортировать задачи не нужно.
        - Текст подсказки в `input()` может быть любым — он не проверяется.
      files:
        tasks.json: |
          [
            {"title": "Вернуть дрель соседу", "due": "2026-10-03", "done": false},
            {"title": "Оплатить интернет", "due": "2026-10-05", "done": false},
            {"title": "Купить подарок маме", "due": "2026-10-12", "done": false},
            {"title": "Записаться к врачу", "due": "2026-10-01", "done": true}
          ]
      starterCode: |
        # Модуль сроков deadlines.py
        # 1. days_left(due, today) — сколько дней до срока (целое число)
        # 2. describe(title, due, today) — строка о задаче
        # 3. Код запуска: дата из ввода, задачи из tasks.json, строки для невыполненных

      tests:
        - id: t1
          kind: io
          title: "Пример 1: файл задания"
          example: true
          stdin: "2026-10-05\n"
          expected: |-
            Просрочено: Вернуть дрель соседу (2 дн.)
            Сегодня: Оплатить интернет
            Через 7 дн.: Купить подарок маме
          compare: { ignoreBlankLines: true }
        - id: t2
          kind: io
          title: "Пример 2: срок в следующем месяце"
          example: true
          stdin: "2026-10-30\n"
          files:
            tasks.json: |
              [
                {"title": "Продлить абонемент в бассейн", "due": "2026-11-02", "done": false}
              ]
          expected: "Через 3 дн.: Продлить абонемент в бассейн"
          compare: { ignoreBlankLines: true }
        - id: t3
          kind: io
          title: "Граничный случай: всё выполнено"
          edge: true
          stdin: "2026-10-05\n"
          files:
            tasks.json: |
              [
                {"title": "Вернуть дрель соседу", "due": "2026-10-03", "done": true},
                {"title": "Записаться к врачу", "due": "2026-10-01", "done": true}
              ]
          expected: Незакрытых задач нет
          compare: { ignoreBlankLines: true }
        - id: t4
          kind: io
          title: "Граничный случай: пустой список"
          edge: true
          stdin: "2026-10-05\n"
          files:
            tasks.json: "[]\n"
          expected: Незакрытых задач нет
          compare: { ignoreBlankLines: true }
        - id: t-order
          kind: io
          title: "Граничный случай: сроки в файле не по порядку"
          edge: true
          stdin: "2026-10-05\n"
          files:
            tasks.json: |
              [
                {"title": "Купить подарок маме", "due": "2026-10-12", "done": false},
                {"title": "Вернуть дрель соседу", "due": "2026-10-03", "done": false}
              ]
          expected: |-
            Через 7 дн.: Купить подарок маме
            Просрочено: Вернуть дрель соседу (2 дн.)
          compare: { ignoreBlankLines: true }
        - id: t5
          kind: call
          title: "Пример 3: дней до срока"
          example: true
          stdin: "2026-10-05\n"
          call: days_left("2026-10-12", "2026-10-05")
          expected: "7"
        - id: t6
          kind: call
          title: "Граничный случай: срок прошёл"
          edge: true
          stdin: "2026-10-05\n"
          call: days_left("2026-10-03", "2026-10-05")
          expected: "-2"
        - id: t7
          kind: call
          title: Строка «Сегодня»
          stdin: "2026-10-05\n"
          call: describe("Оплатить интернет", "2026-10-05", "2026-10-05")
          expected: "'Сегодня: Оплатить интернет'"
        - id: t8
          kind: call
          title: Строка «Просрочено»
          edge: true
          stdin: "2026-10-05\n"
          call: describe("Вернуть дрель соседу", "2026-10-03", "2026-10-05")
          expected: "'Просрочено: Вернуть дрель соседу (2 дн.)'"
        - id: t9
          kind: assert
          title: Импорт без лишних действий
          example: true
          stdin: "2026-10-05\n"
          code: |
            import contextlib
            import io
            import os

            # Другая программа подключает модуль из своей папки — там нет tasks.json.
            os.rename("tasks.json", "tasks-hidden.json")
            buffer = io.StringIO()
            with contextlib.redirect_stdout(buffer):
                import deadlines
            assert buffer.getvalue() == ""
            assert hasattr(deadlines, "days_left") and hasattr(deadlines, "describe")
            assert deadlines.days_left("2026-10-12", "2026-10-05") == 7
            assert deadlines.describe("Купить подарок маме", "2026-10-12", "2026-10-05") == "Через 7 дн.: Купить подарок маме"
          message: >-
            При `import deadlines` модуль ничего не печатает, не ждёт ввода и не читает
            `tasks.json`, а `deadlines.days_left` и `deadlines.describe` работают.
        - id: t-enc
          kind: assert
          title: Кодировка указана
          stdin: "2026-10-05\n"
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            calls = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Call)
                     and (getattr(n.func, "id", None) in names or getattr(n.func, "attr", None) in names)]
            assert all(any(k.arg == "encoding" for k in c.keywords) for c in calls)
          message: >-
            Файл открывается с `encoding="utf-8"` — иначе на Windows со старым Python (до 3.15)
            русские названия задач превратятся в кракозябры.
      criteria:
        - "`days_left` превращает строки в даты и возвращает целое число дней: положительное, ноль или отрицательное."
        - "`describe` возвращает одну из трёх строк точно в формате условия; у просроченной задачи число дней без минуса."
        - Код запуска печатает строки только для невыполненных задач, в порядке файла, а если таких нет — «Незакрытых задач нет».
        - При `import deadlines` ничего не печатается, ввод и файл не читаются, функции доступны.
        - Файл читается с `encoding="utf-8"`.
      hints:
        - >-
          Посмотри на три места, где чаще всего ошибаются. Что возвращает `days_left` — число или
          промежуток? Что стоит под проверкой `__name__`, а что снаружи — и не остался ли снаружи
          временный `print`? Где решается, печатать ли «Незакрытых задач нет», — внутри
          цикла или после него?
        - |-
          Тот же приём на другом модуле — `prices.py` с функцией и кодом запуска:

          ```python
          import json


          def total(prices):
              result = 0
              for price in prices:
                  result += price
              return result


          if __name__ == "__main__":
              with open("prices.json", encoding="utf-8") as file:
                  prices = json.load(file)
              print(total(prices))
          ```

          И напоминание про даты: `(date(2026, 5, 9) - date(2026, 5, 1)).days` даёт `8`, а в
          обратном порядке — `-8`.
        - |-
          Каркас модуля:

          ```text
          import json
          from datetime import date

          def days_left(due, today):
              обе строки → даты, вычесть «срок минус сегодня», вернуть .days

          def describe(title, due, today):
              left = days_left(due, today)
              три ветки: left < 0 / left == 0 / иначе — return f"…"
              (у просрочки число без минуса: -left)

          if __name__ == "__main__":
              today = input()
              загрузить tasks.json через json.load
              счётчик = 0
              для каждой задачи: если не выполнена — print(describe(…)), счётчик += 1
              если счётчик == 0 — print("Незакрытых задач нет")
          ```
      solution:
        code: |
          import json
          from datetime import date


          def days_left(due, today):
              left = date.fromisoformat(due) - date.fromisoformat(today)
              return left.days


          def describe(title, due, today):
              left = days_left(due, today)
              if left < 0:
                  return f"Просрочено: {title} ({-left} дн.)"
              elif left == 0:
                  return f"Сегодня: {title}"
              else:
                  return f"Через {left} дн.: {title}"


          if __name__ == "__main__":
              today = input("Сегодня (ГГГГ-ММ-ДД): ")
              with open("tasks.json", encoding="utf-8") as file:
                  tasks = json.load(file)
              shown = 0
              for task in tasks:
                  if not task["done"]:
                      print(describe(task["title"], task["due"], today))
                      shown += 1
              if shown == 0:
                  print("Незакрытых задач нет")
        explanation: >-
          `days_left` превращает обе строки в даты и вычитает «срок минус сегодня»: получается
          промежуток, а `.days` даёт из него целое число. `describe` выбирает одну из трёх строк
          по знаку этого числа; у просрочки число отрицательное, поэтому в текст идёт `-left`.
          Код запуска — ввод даты, чтение файла и печать — стоит под
          `if __name__ == "__main__":`: при `import deadlines` он не выполняется, и другая
          программа получает только функции. Счётчик `shown` помнит,
          напечатана ли хоть одна строка: если нет — нужна фраза «Незакрытых задач нет».
      altSolutions:
        - code: |
            import json
            from datetime import datetime


            def days_left(due, today):
                return (datetime.fromisoformat(due) - datetime.fromisoformat(today)).days


            def describe(title, due, today):
                left = days_left(due, today)
                if left == 0:
                    return f"Сегодня: {title}"
                if left > 0:
                    return f"Через {left} дн.: {title}"
                return f"Просрочено: {title} ({abs(left)} дн.)"


            def main():
                today = input("Сегодня: ").strip()
                with open("tasks.json", encoding="utf-8") as file:
                    tasks = json.load(file)
                lines = []
                for task in tasks:
                    if task["done"] == False:
                        lines.append(describe(task["title"], task["due"], today))
                if len(lines) == 0:
                    print("Незакрытых задач нет")
                for line in lines:
                    print(line)


            if __name__ == "__main__":
                main()
          note: from datetime import datetime, код запуска в функции main(), строки сначала собираются в список, abs() вместо минуса.
        - code: |
            import datetime
            import json
            from pathlib import Path


            def days_left(due, today):
                delta = datetime.date.fromisoformat(due) - datetime.date.fromisoformat(today)
                return delta.days


            def describe(title, due, today):
                left = days_left(due, today)
                if left < 0:
                    text = "Просрочено: " + title + " (" + str(-left) + " дн.)"
                elif left == 0:
                    text = "Сегодня: " + title
                else:
                    text = "Через " + str(left) + " дн.: " + title
                return text


            if __name__ == "__main__":
                today = input()
                tasks = json.loads(Path("tasks.json").read_text(encoding="utf-8"))
                found = False
                for task in tasks:
                    if task["done"]:
                        continue
                    found = True
                    print(describe(task["title"], task["due"], today))
                if not found:
                    print("Незакрытых задач нет")
          note: import datetime целиком, pathlib и json.loads, флаг вместо счётчика, continue для выполненных.
        - code: |
            import json
            from datetime import date


            def days_left(due, today):
                return (date.fromisoformat(due) - date.fromisoformat(today)).days


            def describe(title, due, today):
                due_date = date.fromisoformat(due)
                today_date = date.fromisoformat(today)
                if due_date < today_date:
                    return f"Просрочено: {title} ({(today_date - due_date).days} дн.)"
                if due_date == today_date:
                    return f"Сегодня: {title}"
                return f"Через {(due_date - today_date).days} дн.: {title}"


            if __name__ == "__main__":
                text = input()
                with open("tasks.json", encoding="utf-8") as file:
                    data = json.load(file)
                open_tasks = []
                for task in data:
                    if not task.get("done"):
                        open_tasks.append(task)
                if len(open_tasks) == 0:
                    print("Незакрытых задач нет")
                else:
                    for task in open_tasks:
                        print(describe(task["title"], task["due"], text))
          note: describe сравнивает сами даты, невыполненные задачи сначала отбираются в список.
      wrongSolutions:
