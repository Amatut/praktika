          expected: "'Через 7 дн.: Купить подарок маме'"
        - id: t7
          kind: assert
          title: Импорт без лишних действий
          stdin: "2026-10-05\n"
          code: |
            import contextlib
            import io
            import os

            # Другая программа подключает модуль из своей папки — там нет tasks.json.
            os.rename("tasks.json", "tasks-hidden.json")
            buffer = io.StringIO()
            with contextlib.redirect_stdout(buffer):
                import deadlines
            assert buffer.getvalue() == ""
            assert deadlines.days_left("2026-10-12", "2026-10-05") == 7
            assert deadlines.describe("Купить подарок маме", "2026-10-12", "2026-10-05") == "Через 7 дн.: Купить подарок маме"
          message: >-
            При `import deadlines` модуль ничего не печатает, не ждёт ввода и не читает
            `tasks.json`, а функции доступны.
      criteria:
        - "Невыполненная задача без ключа `due` или с пустым сроком печатается как «Без срока: …» на своём месте."
        - Выполненные задачи не выводятся, в том числе без срока.
        - Задачи со сроком и фраза «Незакрытых задач нет» работают, как раньше.
        - Функции модуля работают как раньше, импорт по-прежнему ничего не печатает и не читает файл.
      hints:
        - >-
          Найди в своём коде место, где читается срок задачи. Что случится в этой строке, если у
          задачи нет ключа `"due"`? А если срок — пустая строка?
        - |-
          Приём из урока 4.4 на другом словаре:

          ```python
          person = {"name": "Аня"}
          print(person.get("city", ""))   # пустая строка — ключа нет
          print("city" in person)         # False
          ```

          А `person["city"]` остановил бы программу с KeyError.
        - |-
          Каркас цикла:

          ```text
          для каждой задачи:
              если выполнена — пропустить
              due = срок через get, пустая строка по умолчанию
              если due == "" — print(f"Без срока: …")
              иначе — print(describe(…))
              счётчик += 1
          ```
      solution:
        code: |
          import json
          from datetime import date


          def days_left(due, today):
              left = date.fromisoformat(due) - date.fromisoformat(today)
              return left.days


          def describe(title, due, today):
              left = days_left(due, today)
              if left < 0:
                  return f"Просрочено: {title} ({-left} дн.)"
              elif left == 0:
                  return f"Сегодня: {title}"
              else:
                  return f"Через {left} дн.: {title}"


          if __name__ == "__main__":
              today = input("Сегодня (ГГГГ-ММ-ДД): ")
              with open("tasks.json", encoding="utf-8") as file:
                  tasks = json.load(file)
              shown = 0
              for task in tasks:
                  if not task["done"]:
                      due = task.get("due", "")
                      if due == "":
                          print(f"Без срока: {task['title']}")
                      else:
                          print(describe(task["title"], due, today))
                      shown += 1
              if shown == 0:
                  print("Незакрытых задач нет")
        explanation: >-
          `task.get("due", "")` не падает, когда ключа нет, и возвращает пустую строку — поэтому
          один `if due == ""` ловит оба случая: ключа нет и срок пустой. Проверка `done` стоит
          первой: выполненная задача пропускается, есть у неё срок или нет. Функции модуля не
          тронуты — поменялся только код запуска.
