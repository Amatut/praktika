      mistakes:
        - id: key-error
          when:
            errorType: KeyError
            errorIncludes: "'due'"
          why: >-
            У задачи «Разобрать антресоль» нет ключа `"due"`, и `task["due"]` останавливает
            программу с KeyError: квадратные скобки требуют, чтобы ключ был.
          try: >-
            Читай срок через `task.get("due", "")` — без ключа получишь пустую строку — или проверь
            ключ через `"due" in task` (урок 4.4).
          verify: В «Примере 1» программа не должна падать.
        - id: none-to-date
          when:
            errorIncludes: argument must be str
          why: >-
            `task.get("due")` без второго аргумента вернул `None`, и `None` попал в
            `date.fromisoformat`, а она принимает только строку.
          try: >-
            Сначала проверь срок, а в `describe` отправляй только настоящую дату. Удобно так:
            `task.get("due", "")` и сравнение с `""`.
          verify: 'В «Примере 1» третьей строкой должно быть «Без срока: Разобрать антресоль».'
        - id: empty-due
          when:
            errorIncludes: "Invalid isoformat string: ''"
          why: >-
            Ключ `"due"` есть, но срок пустой — `""`. Из пустой строки дата не получается, и
            `fromisoformat` останавливает программу с ValueError.
          try: Считай задачей без срока и ту, у которой срок равен `""`, — проверь оба случая.
          verify: 'В граничном случае «пустой срок» должно быть «Без срока: Передать показания счётчиков».'
        - id: global-today
          when:
            failedTest: t7
            errorIncludes: "name 'today' is not defined"
          why: >-
            Функция берёт `today` не из своего параметра, а из кода запуска. При запуске файла это
            сходит с рук: там переменная `today` есть. А при `import deadlines` код запуска не
            выполняется — и имени `today` нет.
          try: >-
            Внутри функции пользуйся только её параметрами: имя в теле должно совпадать с именем
            параметра в `def` (урок 5.4).
          verify: Тест «Импорт без лишних действий» должен стать зелёным.
        - id: file-at-import
          when:
            errorType: FileNotFoundError
            errorIncludes: "'tasks.json'"
            failedTest: t7
          why: >-
            Модуль читает `tasks.json` сразу при `import deadlines`: `open` стоит снаружи
            `if __name__ == "__main__":`. Программе, которая подключает модуль из другой папки,
            нужны только функции, а файла рядом с ней может не быть — тогда импорт падает с
            FileNotFoundError, как в этой проверке.
          try: >-
            Перенеси чтение файла под `if __name__ == "__main__":` — это часть кода запуска, как
            ввод даты и печать.
          verify: Тест «Импорт без лишних действий» должен стать зелёным.
        - id: done-no-due-shown
          when:
            outputIncludes: "Без срока: Помыть окна"
          why: >-
            «Помыть окна» уже выполнена, но программа её показывает: проверка срока стоит раньше
            проверки `done`, и выполненная задача без срока проходит мимо фильтра.
          try: Сначала отсей выполненные задачи, а уже потом выбирай между «Без срока» и `describe`.
          verify: В граничном случае «выполненная задача без срока» должна остаться одна строка — про дрель.
        - id: skipped
          when:
            outputEquals: |-
              Просрочено: Вернуть дрель соседу (2 дн.)
              Сегодня: Оплатить интернет
              Через 7 дн.: Купить подарок маме
          why: >-
            Программа больше не падает, но задача «Разобрать антресоль» пропала из вывода. Её
            тоже нужно показать — строкой «Без срока: …».
          try: 'Для невыполненной задачи без срока напечатай `Без срока: <название>` вместо того, чтобы пропускать её.'
          verify: В «Примере 1» должно быть четыре строки.
        - id: counter-missed
          when:
            failedTest: t2
            outputIncludes: Незакрытых задач нет
          why: >-
            Строки «Без срока» напечатаны, а за ними — «Незакрытых задач нет». Счётчик не
            увеличился на задачах без срока, и программа решила, что показать было нечего.
          try: Увеличивай счётчик для каждой напечатанной строки — и со сроком, и без срока.
          verify: В «Примере 2» должно быть ровно две строки.
        - id: at-end
          when:
            outputEquals: |-
              Просрочено: Вернуть дрель соседу (2 дн.)
              Сегодня: Оплатить интернет
              Через 7 дн.: Купить подарок маме
              Без срока: Разобрать антресоль
          why: >-
            Все строки на месте, но «Без срока» оказалась в конце. В файле антресоль стоит третьей
            — и в выводе должна быть третьей.
          try: Обрабатывай задачу со сроком и без срока в одном цикле — каждую на её месте.
          verify: 'В «Примере 1» третьей строкой должно быть «Без срока: Разобрать антресоль».'
      afterPass: >-
        Задачи без срока больше не ломают модуль. Старые записи без нового поля — частая
        ситуация, и `get` со значением по умолчанию — первый инструмент для неё. Улучшение:
        вынеси выбор строки для одной задачи в функцию `task_line(task, today)` — код запуска
        станет короче, а новую функцию можно проверить отдельно.
      skills: [dicts, dates-datetime, modules-imports]
      noHintsBeforeAttempt: true

  - id: deploy-order
    type: order
    title: Порядок развёртывания
    prompt: >-
      Ты хочешь проверить, что проект разворачивается на «чужом» компьютере. Расставь шаги по
      порядку — от готового репозитория до работающей программы.
    items:
      - id: clone
        text: "Склонировать проект в новую папку: `git clone todo-json todo-check`"
      - id: enter
        text: "Перейти в новую папку: `cd todo-check`"
      - id: venv
        text: "Создать окружение: `python -m venv .venv`"
      - id: activate
        text: "Включить окружение: `.venv\\Scripts\\activate` — в начале строки видно `(.venv)`"
      - id: install
        text: "Поставить зависимости: `python -m pip install -r requirements.txt`"
      - id: run
        text: Запустить программу командой из README
    explanation: >-
      Клон — первым: только в новой папке нет старого окружения, кешей и личных файлов. Окружение
      создают внутри проекта, поэтому сначала переходят в папку клона. Пакеты ставят во
      включённое окружение — иначе они уйдут в другой Python (урок 8.3). Запуск — последним, когда
      всё на месте.
    coach: >-
      Эти же шаги должны быть в README — в том же порядке. Если какого-то там нет, это находка.

  - id: clean-folder
    type: checklist
    title: Проект в чистой папке
    body: |-
      Самостоятельная часть модуля на компьютере: отмечаешь сам, тренажёр её не проверяет.
      Главное правило — следуй **только** README. Если какого-то шага в нём нет, это не твоя
      ошибка, а находка: такой README подвёл бы и другого человека.

      - Нужен интернет для `pip install`. Без него дойди до установки и продолжи позже.
      - Команды — в «Командной строке» (cmd), как в уроке 8.3. Git работает в любом терминале.
      - Если под рукой только телефон — вернись к этому блоку позже.
      - Своего проекта нет — возьми учебный мини-проект из урока 8.2, но сначала пройди с ним
        чек-листы уроков 8.2–8.4: пакет `todo`, requirements.txt, раздел «Установка» в README и
        `.gitignore` появляются именно там. Без них в чистой папке проверять нечего.
      - Вместо `todo-json` в командах подставляй имя папки своего проекта.
    items:
      - id: ready
        text: >-
          **Проверь исходный проект.** В папке проекта набери `git status` — должно быть
          `nothing to commit, working tree clean`. Затем `git log --oneline` и прочитай последние
          пять сообщений глазами постороннего: понятно ли, что и зачем менялось?
        help: >-
          Есть незакоммиченные изменения — посмотри `git diff` и закоммить их (урок 8.4). Неудачные
          старые сообщения не переписывай, просто новые пиши понятнее. Длинная история листается
          пробелом, выход — клавиша `q`. Если Git пишет по-русски — ищи те же разделы по смыслу.
      - id: new-window
        text: >-
          **Открой новое окно cmd** в папке, где лежит папка проекта, — на уровень выше. В начале
          строки не должно быть `(.venv)`.
        help: >-
          В старом окне могло остаться включённым окружение проекта. Тогда проверка обманет:
          программа найдёт пакеты старого окружения, даже если README о них молчит. Как открыть:
          в Проводнике зайди в папку, где лежит проект (например, `python-practice`), набери в
          адресной строке `cmd` и нажми Enter. Можно и в старом окне: `deactivate`, затем
          `cd ..`. macOS и Linux — обычный терминал и `cd` в нужную папку.
      - id: clone
        text: >-
          **Склонируй проект:** `git clone todo-json todo-check`. Git ответит
          `Cloning into 'todo-check'...` и `done.`
        help: >-
          `git clone` из папки работает без интернета и копирует только то, что есть в коммитах:
          `.venv`, `__pycache__` и `tasks.json` в клон не попадут — как у другого человека.
          Ответ `fatal: repository 'todo-json' does not exist` — терминал не в той папке: команда
          `dir` должна показать папку проекта. Имя с пробелами бери в кавычки:
          `git clone "мой проект" todo-check`. Предупреждение `You appear to have cloned an empty
          repository` значит, что в проекте нет ни одного коммита (урок 8.4).
      - id: look
        text: >-
          **Посмотри, что приехало:** `cd todo-check`, затем `dir`. Должны быть README.md,
          requirements.txt, main.py, папка todo и .gitignore (у твоего проекта набор может
          немного отличаться). Не должно быть .venv и tasks.json.
        help: |-
          - Не хватает файла — он не закоммичен: вернись в исходный проект, добавь его через
            `git add` и закоммить, затем удали todo-check и склонируй заново.
          - requirements.txt или раздела «Установка» в README нет совсем — значит, чек-лист урока
            8.3 ещё не пройден: вернись к нему.
          - Есть лишнее — проверь `.gitignore`. Уже закоммиченное Git перестанет отслеживать после
            `git rm --cached tasks.json` для файла или `git rm -r --cached .venv` для папки (урок
            8.4). Затем закоммить, удали todo-check и склонируй заново.
          - macOS и Linux: `ls -a` вместо `dir`.
      - id: readme-only
        text: >-
          **Выполни шаги README** по порядку: создать окружение, включить его,
          `python -m pip install -r requirements.txt`, запустить. Если какого-то шага в README нет
          (например, создать и включить окружение), сделай его сам — по задаче «Порядок
          развёртывания» — и запиши как находку для пункта «Допиши README». Каждое место, где
          пришлось догадываться, тоже запиши.
        help: |-
          Что может случиться:

          - `ERROR: Could not open requirements file: [Errno 2] No such file or directory` —
            requirements.txt не закоммичен (урок 8.4).
          - `ModuleNotFoundError: No module named 'tabulate'` — окружение не включено или
            зависимости не поставлены (урок 8.3).
          - `No module named 'todo'` — программа запущена не из папки проекта (урок 8.2).
          - PowerShell не даёт включить окружение — перейди в cmd (урок 8.3).
          - macOS и Linux: `python3` вместо `python`, `source .venv/bin/activate`.
      - id: works
        text: >-
          **Проверь, что программа работает.** Список задач пуст — личный tasks.json в клон не
          попал. Добавь задачу, покажи список, выйди и запусти программу снова — задача на месте.
        help: >-
          Программа падает с FileNotFoundError, потому что нет tasks.json, — значит, она не умеет
          стартовать с пустого места. Почини загрузку в **основном** проекте: поймай
          FileNotFoundError и начни с пустого списка (модуль 7), закоммить и проверь клон заново.
      - id: fix-readme
        text: >-
          **Допиши README основного проекта.** Всё, чего не хватило, внеси в README в исходной
          папке (не в клоне) и закоммить: `git add README.md`,
          `git commit -m "Дополнить README: установка"`. Если угадывать ничего не пришлось — отметь
          пункт и иди дальше.
        help: |-
          Образец раздела — подстрой под свой проект:

          ```markdown
          ## Установка

          1. Создай окружение: `python -m venv .venv`
          2. Включи его (Windows, cmd): `.venv\Scripts\activate`
             macOS и Linux: `source .venv/bin/activate`
          3. Поставь зависимости: `python -m pip install -r requirements.txt`

          ## Запуск

          Из папки проекта: `python main.py`
          ```

          Правки в todo-check не сохраняй: это черновая копия, её удалят.
      - id: retry
        text: >-
          **Проверь ещё раз с нуля.** Удали папку todo-check в Проводнике, склонируй заново и
          пройди шаги README — теперь без единой догадки.
        help: >-
          Если окно терминала открыто в todo-check, сначала `deactivate` и `cd ..`, иначе Windows
          не даст удалить папку. На macOS папку удаляют в Finder — перетащи её в Корзину. Удаляй
          только клон todo-check, а не папку проекта.
    coach: >-
      Каждая догадка, которую ты дописал в README, — шаг, на котором споткнулся бы другой человек.

  - id: recap
    type: recap
    title: Итоги и что повторить
    points:
      - "Модуль сроков получился без подсказок, а проект развернулся по README с первой или второй попытки — модуль 8 пройден. Если получилось и усложнение, старые записи без нового поля тебя уже не остановят. Дальше модуль 9: pytest ставится в окружение тем же pip."
      - "Путался с `timedelta`, `.days` или порядком вычитания — повтори урок 8.1."
      - "Импорт печатал лишнее, ждал ввода или читал файл, функций не было при import, `No module named` — повтори урок 8.2."
      - "В чистой папке ModuleNotFoundError, не нашёлся requirements.txt, в клон попали .venv или tasks.json либо не попал нужный файл — повтори уроки 8.3 и 8.4: окружение, `.gitignore` и `git add`."
    question: Почему развёртывание проверяют в новой папке через git clone, а не в своей рабочей?
    answer: >-
      В рабочей папке уже есть окружение с пакетами, личный tasks.json и файлы, которые ты мог
      забыть закоммитить, — там всё работает «по памяти» компьютера. Клон содержит только то, что
      лежит в репозитории, — ровно то, что получит другой человек. Если по README проект
      поднимается в клоне, он поднимется и у него.
