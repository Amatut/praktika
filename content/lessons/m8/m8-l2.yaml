            print(f"На каждого: {gear.per_person(total, peple)} кг")
          note: Опечатка в своей переменной при import gear — разбор про приставку не должен сработать.
          expectMistake: null
        - code: |
            from gear import total_weight, per_person

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = total_weight(weights)
