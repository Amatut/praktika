                assert total([1, 2]) is not None
                assert average([1, 2]) is not None
          message: >-
            total и average возвращают результат через return — report.py подставляет его в текст.
      criteria:
        - В модуле есть функции `total` и `average` — с теми именами, которые ждёт report.py.
        - Функции возвращают результат через `return`, а не печатают его.
        - Среднее округлено до одного знака, для пустого списка обе функции возвращают 0.
        - При импорте модуль ничего не печатает.
      hints:
        - >-
          Начни с первой строки report.py: какие имена программа забирает из модуля и что
          делает с результатом каждого? От этого зависят имена функций и то, что они возвращают.
        - |-
          Модуль с одной функцией и проверкой — на другом примере:
          ```python
          def to_hours(minutes):
              return round(minutes / 60, 1)


          if __name__ == "__main__":
              print(to_hours(90))
          ```
          При «Запустить» проверка напечатает `1.5`, а при `import` — промолчит.
        - |-
          Каркас:
          ```text
          def total(liters):
              сложить числа списка и вернуть сумму

          def average(liters):
              если в списке нет чисел — вернуть 0
              вернуть round(сумма / количество, 1)

          if __name__ == "__main__":
              проверочные print
          ```
      solution:
        code: |
          def total(liters):
              result = 0
              for amount in liters:
                  result += amount
              return result


          def average(liters):
              if len(liters) == 0:
                  return 0
              return round(total(liters) / len(liters), 1)


          if __name__ == "__main__":
              print(total([100, 250, 50]))
              print(average([100, 250, 50]))
              print(average([]))
        explanation: >-
          Имена функций совпадают с теми, что report.py перечислил в `from water import …`, — это
          договор между модулями. `average` пользуется `total` из того же модуля и до деления
          проверяет пустой список, иначе было бы деление на ноль. Проверка под
          `if __name__ == "__main__":` работает при «Запустить» и молчит, когда модуль подключает
          report.py.
