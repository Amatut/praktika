      mistakes:
        - id: main-no-quotes
          when:
            errorIncludes: name '__main__' is not defined
          why: >-
            `__main__` без кавычек Python принимает за имя переменной, а такой переменной нет.
            Подсказка Python «Did you mean: '__name__'?» здесь сбивает: слева `__name__` уже стоит,
            а справа нужна строка.
          try: 'Возьми `__main__` в кавычки: `if __name__ == "__main__":`.'
          verify: Ошибка NameError должна исчезнуть, а тест «report.py работает» — пройти.
        - id: name-reused
          when:
            errorIncludes: object is not callable
            codeRegex: '^[ \t]+(total|average)[ \t]*=(?!=)'
          why: >-
            В проверке результат назван так же, как функция: после `average = average(week)` имя
            `average` в файле — уже число, а не функция, и вызвать его снова нельзя.
          try: 'Назови результат иначе, например `avg = average(week)`.'
          verify: Тесты «Сумма» и «Среднее» должны стать зелёными.
        - id: self-import
          when:
            errorIncludes: cannot import name
            codeRegex: '^[ \t]*(from[ \t]+water[ \t]+import|import[ \t]+water\b)'
          why: >-
            water.py подключает сам себя. Строка `from water import …` нужна в report.py, а в
            модуле она заставляет Python загружать water.py, пока тот ещё не создал свои функции.
          try: 'Удали из water.py строку `from water import …` — модулю не нужно подключать себя.'
          verify: Ошибка ImportError должна исчезнуть, а тест «report.py работает» — пройти.
        - id: defs-in-main-block
          when:
            errorIncludes: cannot import name
            codeRegex: '^[ \t]+def (total|average)\b'
          why: >-
            Функции определены внутри `if __name__ == "__main__":`. При импорте условие ложно,
            функции не создаются, и report.py нечего подключить.
          try: >-
            Верни `def` на верхний уровень, без отступа. Под условием оставь только проверочные
            `print`.
          verify: Ошибка ImportError должна исчезнуть, а тест «report.py работает» — пройти.
        - id: wrong-name
          when:
            failedTest: t1
            codeRegex: '(?<![\s\S])(?![\s\S]*^def total\s*\()|(?<![\s\S])(?![\s\S]*^def average\s*\()'
          why: >-
            report.py просит у модуля имена `total` и `average`, а в water.py нет функции с одним
            из этих имён или с обоими.
            Имена функций — договор между модулями: программа, которая подключает модуль, ищет их
            буква в букву.
          try: Назови функции ровно `total` и `average`, как в первой строке report.py.
          verify: Ошибка ImportError должна исчезнуть, а тест «report.py работает» — пройти.
        - id: demo-on-import
          when:
            failedTest: t7
            codeRegex: '^[A-Za-z_][\w.]*\('
          why: >-
            Проверочные `print` стоят вне условия и выполняются при каждом импорте: report.py
            печатает чужие строки перед своим отчётом.
          try: 'Спрячь проверку под `if __name__ == "__main__":` — с отступом.'
          verify: Тесты «Импорт молчит» и «report.py работает» должны стать зелёными.
        - id: print-not-return
          when:
            failedTest: t8
            codeRegex: '^def[^\n]*\n(?:[ \t]+[^\n]*\n|[ \t]*\n)*?[ \t]+print\('
          why: >-
            Функция печатает результат, но не возвращает его. Без `return` она отдаёт `None`, и
            report.py подставляет в отчёт `None` (урок 5.3).
          try: Замени `print(...)` внутри функций на `return ...`.
          verify: Тест «Функции возвращают результат» должен стать зелёным.
        - id: empty-list
          when:
            errorType: ZeroDivisionError
          why: >-
            Для пустого списка `len(liters)` равно 0, а делить на ноль нельзя.
          try: >-
            В начале `average` проверь длину списка: если она равна 0, сразу верни 0. Делить
            только после этой проверки.
          verify: "Тест «Граничный случай: среднее пустого списка» должен стать зелёным."
        - id: no-round
          when:
            failedTest: t3
            codeRegex: '(?<![\s\S])(?![\s\S]*round\()'
          why: >-
            Среднее не округлено: вместо 133.3 функция возвращает 133.33333333333334.
          try: Оберни результат деления в `round(…, 1)`.
          verify: Тест «Среднее» должен стать зелёным.
        - id: round-no-digits
          when:
            failedTest: t3
            codeRegex: 'round\((?:[^(),]|\([^()]*\))*\)'
          why: >-
            `round` без второго числа округляет до целого: вместо 133.3 получается 133. Число знаков
            после точки передают вторым аргументом.
          try: 'Добавь второй аргумент: `round(…, 1)`.'
          verify: Тест «Среднее» должен стать зелёным.
        - id: fixed-seven
          when:
            failedTest: t3
            codeRegex: '/\s*7\b'
          why: >-
            Деление на 7 подходит только для недели из report.py. Функция должна работать с любым
            списком: для `[100, 250, 50]` делить нужно на 3.
          try: Дели на количество чисел в списке — `len(liters)`.
          verify: Тест «Среднее» должен стать зелёным.
        - id: empty-not-zero
          when:
            failedTest: t5
            codeRegex: '(?<![\s\S])(?![\s\S]*^[ \t]+return[ \t]+0(\.0)?[ \t]*$)'
          why: >-
            Для пустого списка `average` должна вернуть 0, а возвращает другое. Частые причины:
            голый `return` без значения или нет ветки для пустого списка — тогда функция доходит
            до конца и отдаёт `None`.
          try: 'Проверь в начале `average`, пуст ли список, и в этой ветке напиши `return 0`.'
          verify: "Тест «Граничный случай: среднее пустого списка» должен стать зелёным."
      afterPass: >-
        Твой модуль подключила чужая программа, и ей не пришлось знать, как он устроен внутри —
        только имена функций. Улучшение: добавь функцию `peak(liters)` — наибольший расход за
        день. report.py её пока не знает, и это нормально: новые функции модулю не мешают.
      skills: [modules-imports, functions, function-design]

  - id: shadowed-random
    type: quiz
    title: Чужое имя
    question: |-
      В папке `games` лежат игра `game.py` и черновик, который сохранили под именем `random.py`.
      Игра начинается строками `import random` и `print(random.randint(1, 6))`. Команда
      `python game.py` выводит (настоящий вывод Python 3.14, путь сокращён):

      ```text
      Traceback (most recent call last):
        File "C:\games\game.py", line 2, in <module>
          print(random.randint(1, 6))
                ^^^^^^^^^^^^^^
      AttributeError: module 'random' has no attribute 'randint' (consider renaming 'C:\games\random.py' since it has the same name as the standard library module named 'random' and prevents importing that standard library module)
      ```

      Что случилось?
    options:
      - Сломался стандартный модуль random — нужно переустановить Python.
      - "`import random` подключил черновик random.py вместо стандартного модуля — черновик нужно переименовать."
      - Функцию randint убрали из новых версий Python.
    correct: 1
    explanation: >-
      Python ищет модуль сначала в папке программы — и находит там черновик `random.py`. В нём нет
      `randint`, отсюда `has no attribute`. Python 3.13 и новее прямо подсказывают в скобках:
      consider renaming — «подумай о переименовании». В старых версиях подсказки нет, и ситуацию
      узнают по `has no attribute` у стандартного модуля. Лекарство — переименовать черновик,
      например в `dice_draft.py`.
    coach: >-
      Имена `random.py`, `json.py`, `datetime.py`, `csv.py` для своих файлов — табу.

  - id: split-project
    type: checklist
    title: Разложи свой список задач по модулям
    body: >-
      Дальше — работа на компьютере с проектом «Список задач». Её можно сделать отдельным заходом,
      в другой день; если под рукой только телефон — вернись к этому блоку позже. Своего проекта
      нет или он устроен иначе — возьми учебный мини-проект из первого пункта. Раскладка займёт
      15–25 минут. **Пока не коммить новые файлы** — в уроке 8.4 наведём порядок.
    items:
      - id: project
        text: >-
          **Открой проект «Список задач».** Это папка с программой из проекта после модуля 7,
          например `python-practice\todo-json`. Дальше в уроке главный файл называется `main.py`. Своего
          проекта нет — создай папку `python-practice\todo-json`, а в ней файл `main.py` с
          учебным мини-проектом из «Если не получается».
        help: |-
          Учебный мини-проект «Список задач» одним файлом. Его можно скопировать: кавычки-ёлочки
          и тире набирать неудобно.

          ```python
          import json
          from pathlib import Path

          DATA_FILE = Path("tasks.json")


          def load_tasks():
              try:
                  with open(DATA_FILE, encoding="utf-8") as file:
                      return json.load(file)
              except FileNotFoundError:
                  return []
              except json.JSONDecodeError:
                  print("Файл с задачами повреждён — начинаю с пустого списка.")
                  return []


          def save_tasks(tasks):
              with open(DATA_FILE, "w", encoding="utf-8") as file:
                  json.dump(tasks, file, ensure_ascii=False, indent=2)


          def add_task(tasks, title):
              tasks.append({"title": title, "done": False})


          def mark_done(tasks, number):
              if 1 <= number <= len(tasks):
                  tasks[number - 1]["done"] = True
                  return True
              return False


          def show_tasks(tasks):
              if len(tasks) == 0:
                  print("Задач пока нет.")
              number = 1
              for task in tasks:
                  if task["done"]:
                      mark = "x"
                  else:
                      mark = " "
                  print(f"{number}. [{mark}] {task['title']}")
                  number += 1


          def main():
              tasks = load_tasks()
              while True:
                  command = input("Команда (добавить, список, готово, выход): ").strip()
                  if command == "добавить":
                      title = input("Название: ").strip()
                      if title != "":
                          add_task(tasks, title)
                          save_tasks(tasks)
                      else:
                          print("Пустое название — задача не добавлена.")
                  elif command == "список":
                      show_tasks(tasks)
                  elif command == "готово":
                      try:
                          number = int(input("Номер: "))
                      except ValueError:
                          print("Нужен номер задачи — целое число.")
                          continue
                      if mark_done(tasks, number):
                          save_tasks(tasks)
                      else:
                          print("Нет задачи с таким номером.")
                  elif command == "выход":
                      break
                  else:
                      print("Не знаю такой команды.")


          main()
          ```

          Запусти его из папки проекта: `python main.py` (или `py main.py`), добавь задачу и
          введи `выход` — рядом появится файл `tasks.json`. Вызов `main()` в последней строке
          стоит без условия нарочно: его ты поправишь в пункте «Спрячь запуск под условие».
      - id: safe-point
        text: >-
          **Страховка.** Открой терминал в папке проекта и набери `git status`. В ответе не
          должно быть разделов `Changes not staged for commit` и `Changes to be committed`: все
          правки кода уже в коммите. Есть изменения — закоммить их, как в уроке 5.6.
        help: |-
          Зачем: если при раскладке что-то сломается, `git restore main.py` вернёт главный файл к
          этому коммиту (урок 5.6), а новые файлы можно просто удалить.

          Раздел `Untracked files` с `tasks.json` не мешает: это данные, а не код, в коммит их не
          добавляем.

          `fatal: not a git repository` — в папке ещё нет репозитория. Создай его и сделай первый
          коммит:

          ```text
          git init
          git add main.py
          git commit -m "Список задач одним файлом"
          ```

          Если Git пишет по-русски — ищи те же разделы по смыслу.
      - id: package
        text: >-
          **Создай пакет.** В папке проекта создай папку `todo`, а в ней — пустой файл
          `__init__.py` (по два подчёркивания с каждой стороны).
        help: >-
          В VS Code: New File и имя `todo/__init__.py` — редактор сам создаст папку. В Проводнике:
          правый щелчок → «Создать» → «Папку», а файл сохрани в неё из редактора. В Блокноте при
          сохранении выбери тип файла «Все файлы», иначе получится `__init__.py.txt`. Проверь
          командой `dir todo` (на macOS и Linux — `ls todo`).

          Главный файл твоего проекта называется `todo.py`? Переименуй его в `main.py`: имя
          `todo` теперь у папки пакета.
      - id: storage
        text: |-
          **Перенеси работу с файлом в `todo/storage.py`:** константу `DATA_FILE`, функции
          `load_tasks` и `save_tasks` — вместе с `import json` и `from pathlib import Path`. Из
          main.py эти строки убери, а первой строкой main.py допиши:

          ```python
          from todo.storage import load_tasks, save_tasks
          ```

          Запусти `python main.py` — программа должна работать как раньше.
        help: |-
          Импорты переезжают вместе с функциями, которым они нужны: без `import json` в
          storage.py загрузка упадёт с NameError. В твоём проекте функции могут называться
          иначе — переноси по смыслу всё, что читает и пишет JSON, и перечисли в строке import
          свои имена.

          `NameError: name 'load_tasks' is not defined` — в main.py нет строки import или имя в
          ней написано иначе. `No module named 'storage'` — написано `import storage`: модуль
          лежит в пакете, поэтому нужно `from todo.storage import …`. Другие ошибки разобраны в
          пункте «Запусти и повтори ручные проверки».
      - id: tasks
        text: |-
          **Перенеси работу со списком в `todo/tasks.py`:** функции `add_task`, `mark_done`,
          `show_tasks` (и удаление, если оно у тебя есть). Под первой строкой import в main.py
          допиши вторую:

          ```python
          from todo.tasks import add_task, mark_done, show_tasks
          ```

          И снова запусти `python main.py`.
        help: >-
          Если функция списка сама вызывает `save_tasks`, проще перенести вызов сохранения в
          main.py. Или подключи в tasks.py `from todo.storage import save_tasks`: внутри пакета
          модули подключают друг друга тоже через имя пакета, а `import storage` даст
          `No module named 'storage'`. Только не подключай tasks в storage.py: два модуля,
          которые импортируют друг друга, — это кольцевой импорт.
      - id: main
        text: |-
          **Спрячь запуск под условие.** Последнюю строку main.py `main()` замени на вызов под
          условием:

          ```python
          if __name__ == "__main__":
              main()
          ```
        help: |-
          Остальной код `main()` менять не нужно: имена функций те же, их дали две строки import.

          Можно подключать и модули целиком: `from todo import storage, tasks` и вызовы
          `storage.load_tasks()`, `tasks.add_task(...)`. Но тогда проверь имена переменных: если
          список задач в `main()` тоже называется `tasks`, он закроет собой модуль, и программа
          упадёт с `AttributeError: 'list' object has no attribute 'add_task'`. Переименуй список,
          например в `task_list`.

          Функции `main()` в твоём проекте нет, и меню написано прямо внизу файла? Сначала заверни
          этот код в `def main():`, как в уроке 5.5, — тогда под условием останется одна строка.
      - id: run
        text: >-
          **Запусти и повтори ручные проверки.** Из папки проекта: `python main.py`. Покажи
          список, добавь задачу, отметь её, выйди и запусти снова — задачи на месте.
        help: |-
          Что значат частые ошибки:

          - `No module named 'todo'` — Python не нашёл папку todo рядом с main.py. Проверь
            командой `dir`, что они лежат рядом и что имя папки написано маленькими буквами, как в
            import.
          - `No module named 'storage'` — в каком-то модуле написано `import storage`. Внутри
            проекта пиши `from todo import storage`.
          - `ImportError: cannot import name …` — такого имени в модуле нет: функция называется
            иначе или осталась в main.py. Если в конце сообщения сказано
            `most likely due to a circular import` — два модуля подключают друг друга (кольцевой
            импорт): убери импорт из одного из них.
          - `NameError` — функцию вызывают, но не подключили: добавь её имя в строку import.
          - `AttributeError: module 'json' has no attribute …` с припиской
            `since it has the same name as the standard library module` — твой файл назван как
            стандартный модуль (`json.py`, `random.py`): переименуй его.
          - Задачи пропали — скорее всего, программу запустили из другой папки, и она ищет
            `tasks.json` там. Открой терминал в папке проекта.
      - id: pycache
        text: >-
          **Загляни в папку `todo`.** Там появилась папка `__pycache__` — кеш Python. Пока ничего
          не коммить: в уроке 8.4 научим Git не замечать кеш и сохраним раскладку аккуратными
          коммитами.
        help: >-
          Папку `__pycache__` можно удалить — Python создаст её заново при следующем запуске.
          `git status` сейчас покажет папку `todo/` в разделе `Untracked files` и изменённый
          main.py — так и должно быть до урока 8.4.
    coach: >-
      Переноси по одному модулю и запускай программу после каждого переноса — так сразу видно,
      какой шаг её сломал.

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Модуль — файл `.py`. `import gear` → `gear.total_weight(...)`; `from gear import total_weight` → `total_weight(...)`. Имя модуля — без `.py`."
      - "Python ищет модули сначала в папке программы, потом в стандартной библиотеке — не называй свои файлы `random.py` или `json.py`."
      - "Код модуля выполняется при первом импорте, поэтому код запуска и проверки прячут под `if __name__ == \"__main__\":`."
      - "Пакет — папка с модулями и файлом `__init__.py`: `from todo import storage`, `from todo.storage import load_tasks`."
    question: >-
      Зачем в модуле, который подключают другие программы, прятать код запуска под
      if __name__ == "__main__"?
    answer: >-
      Иначе он выполнится при каждом import: напечатает лишнее, спросит ввод или перезапишет файл
      в чужой программе. Под условием он работает только при прямом запуске файла. В модуле 9
      pytest тоже будет импортировать твои модули — и им нужно импортироваться молча.
