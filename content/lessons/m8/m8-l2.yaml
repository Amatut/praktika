            sys.modules.pop("water", None)
            buffer = io.StringIO()
            with contextlib.redirect_stdout(buffer):
                import water
            assert buffer.getvalue() == ""
          message: При `import water` модуль ничего не печатает.
        - id: t8
          kind: assert
          title: Функции возвращают результат
