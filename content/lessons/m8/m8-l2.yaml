          note: total_weight из модуля, а per_person заменена формулой.
          expectMistake: manual-calc
        - code: |
            # Подключи модуль gear


            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            # Посчитай функциями из gear общий вес и вес на каждого и выведи две строки:
            # Общий вес: … кг
            # На каждого: … кг
            total = round(sum(weights), 1)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {round(total / people, 1)} кг")
          note: Комментарии стартового кода оставлены, модуль не подключён, всё вручную.
          expectMistake: not-imported
      mistakes:
        - id: import-with-py
          when:
            errorIncludes: gear.py
          why: >-
            В `import` пишут имя модуля, а не имя файла. Точку Python читает как «модуль `py`
            внутри папки `gear`», а `gear` — обычный файл, не папка. Отсюда и `'gear' is not a
            package` в сообщении.
          try: "Убери `.py`: `import gear`."
          verify: Ошибка ModuleNotFoundError должна исчезнуть, а «Пример 1» — пройти.
        - id: module-not-found
          when:
            errorType: ModuleNotFoundError
          why: >-
            Python не нашёл модуль с таким именем в папке программы. Имя в `import` должно
            совпадать с именем файла без `.py` буква в букву — и большие буквы тоже различаются.
          try: 'Файл называется `gear.py`, значит, подключай `import gear` — маленькими буквами.'
          verify: Ошибка ModuleNotFoundError должна исчезнуть, а «Пример 1» — пройти.
        - id: forgot-import
          when:
            errorIncludes: name 'gear' is not defined
            codeRegex: '(?<![\s\S])(?![\s\S]*^[ \t]*(import|from)[ \t]+gear\b)'
          why: >-
            Вызовы `gear.…` есть, а строки, которая подключает модуль, нет. Пока модуль не
            подключён, имя `gear` программе неизвестно.
          try: 'Первой строкой main.py напиши `import gear`.'
          verify: Ошибка NameError должна исчезнуть, а «Пример 1» — пройти.
        - id: alias-prefix
          when:
            errorIncludes: name 'gear' is not defined
            codeRegex: '^import gear as \w+'
          why: >-
            После `import gear as g` модуль доступен только под коротким именем, которое стоит после
            `as`. Имени `gear` в программе нет.
          try: >-
            Пиши все вызовы через имя после `as` — или подключи модуль просто `import gear`.
          verify: Ошибка NameError должна исчезнуть, а «Пример 1» — пройти.
        - id: prefix-after-from
          when:
            errorIncludes: name 'gear' is not defined
            codeRegex: '^from gear import'
          why: >-
            `from gear import total_weight` забирает из модуля только перечисленное имя. Самого
            имени `gear` в программе после этого нет, поэтому `gear.per_person` не находится.
          try: >-
            Выбери один способ. Или `import gear` и все вызовы через `gear.`, или
            `from gear import total_weight, per_person` и вызовы без приставки.
          verify: Ошибка NameError должна исчезнуть, а «Пример 1» — пройти.
        - id: param-as-variable
          when:
            errorIncludes: name 'total' is not defined
          why: >-
            В строке `def per_person(total, people)` слово `total` — имя параметра, оно живёт только
            внутри gear.py. В main.py переменной `total` нет, пока ты её не создашь.
          try: >-
            Сначала сохрани общий вес в переменную — `total = gear.total_weight(weights)` (или без
            `gear.`, если подключал через from), — а потом передай её в `per_person`.
          verify: Ошибка NameError должна исчезнуть, а «Пример 1» — пройти.
        - id: no-prefix
          when:
            errorType: NameError
            codeRegex: '^import gear\b[\s\S]*(?<![.\w])(total_weight|per_person)\s*\('
          why: >-
            После `import gear` функции живут внутри модуля. Имя `total_weight` без приставки
            программа не знает — только `gear.total_weight`.
          try: Допиши приставку `gear.` перед каждой функцией модуля.
          verify: Ошибка NameError должна исчезнуть, а «Пример 1» — пройти.
        - id: missing-name
          when:
            errorType: NameError
            codeRegex: '^from gear import(?![^\n]*\bper_person\b)[\s\S]*(?<![.\w])per_person\s*\(|^from gear import(?![^\n]*\btotal_weight\b)[\s\S]*(?<![.\w])total_weight\s*\('
          why: >-
            `from … import` кладёт в программу только те имена, которые перечислены после
            `import`. Функции, которую ты вызываешь, в этом списке нет.
          try: 'Перечисли обе функции через запятую: `from gear import total_weight, per_person`.'
          verify: Ошибка NameError должна исчезнуть, а «Пример 1» — пройти.
        - id: strings-to-module
          when:
            errorIncludes: "'int' and 'str'"
          why: >-
            В `total_weight` попали строки: `split()` даёт список строк, и сложить число со строкой
            нельзя. Ошибка возникла внутри gear.py, но виноват список, который передала программа.
          try: >-
            Верни чтение из стартового кода: каждую часть после `split()` превращай в число через
            `float` и добавляй в список `weights`.
          verify: Ошибка TypeError должна исчезнуть, а «Пример 1» — пройти.
        - id: list-to-per-person
          when:
            errorIncludes: "'list' and 'int'"
          why: >-
            `per_person` делит общий вес на число людей, а получила список весов. Разделить список
            на число нельзя, поэтому ошибка возникла внутри gear.py, хотя виноват вызов в main.py.
          try: >-
            Сначала посчитай общий вес через `total_weight`, сохрани в переменную и передай её в
            `per_person` вместе с числом людей.
          verify: Ошибка TypeError должна исчезнуть, а «Пример 1» — пройти.
        - id: copied
          when:
            failedTest: t6
            codeRegex: '^\s*def\s+(total_weight|per_person)\b'
          why: >-
            Функции переписаны в main.py. На учебном gear.py вывод верный, но копия разошлась с
            оригиналом, как только клуб поправил gear.py: исправление попало только в модуль.
          try: Удали свои определения функций, подключи модуль `gear` и вызывай его функции.
          verify: Тест «Клуб поправил gear.py» должен стать зелёным.
        - id: swapped-args
          when:
            codeRegex: 'per_person\(\s*people\b'
          why: >-
            Аргументы перепутаны местами. Функция принимает их по порядку: первым — общий вес,
            вторым — число людей (`def per_person(total, people)`). Сейчас число людей делится на
            вес.
          try: 'Поменяй аргументы местами: `per_person(total, people)`.'
          verify: 'В «Примере 1» второй строкой должно стать «На каждого: 1.5 кг».'
        - id: not-imported
          when:
            failedTest: t5
            codeRegex: '(?<![\s\S])(?=[\s\S]*^[ \t]*print\()(?![\s\S]*^[ \t]*(import|from)[ \t]+gear\b)'
          why: >-
            Программа считает всё сама и не подключает gear. Задача урока — пользоваться готовым
            модулем, а не повторять его работу.
          try: Подключи модуль `gear` и посчитай общий вес и долю каждого его функциями.
          verify: Тесты «Модуль gear подключён» и «Клуб поправил gear.py» должны стать зелёными.
        - id: manual-calc
          when:
            failedTest: t6
            codeRegex: '\bround\(|\bsum\(|/\s*people\b'
          why: >-
            Клуб поправил gear.py, а вывод программы остался прежним: часть расчёта сделана в
            main.py своей формулой, а не функцией модуля.
          try: >-
            Посчитай и общий вес, и долю каждого вызовами функций из gear: `total_weight` и
            `per_person`.
          verify: Тест «Клуб поправил gear.py» должен стать зелёным.
      afterPass: >-
        Программа стала короче: считают функции модуля, а main.py только читает ввод и печатает
        итог. Тест «Клуб поправил gear.py» это и показал: модуль стал округлять до сотых, и
        программа посчитала по-новому без единой правки в main.py.
      skills: [modules-imports, function-design]

  - id: main-and-packages
    type: theory
    title: Код запуска и пакеты
    body: |-
      Прогноз показал: всё, что стоит в модуле вне функций, выполняется при импорте. Для модуля с
      проверочными `print` это беда — любая программа, которая его подключит, напечатает чужие
      строки. А удалять проверку жалко: она нужна автору модуля.

      **`__name__`.** Python даёт каждому файлу особую переменную `__name__` — по два подчёркивания
      с каждой стороны. Если файл запустили напрямую (`python gear.py` или кнопка «Запустить»), в
      ней строка `"__main__"`. Если файл импортировали — имя модуля, например `"gear"`. Поэтому код
      запуска и проверок прячут под условие:

      ```python
      def total_weight(weights):
          ...


      if __name__ == "__main__":
          print(total_weight([1.2, 0.8]))
      ```

      При прямом запуске проверка работает, а при `import gear` условие ложно, и модуль только
      создаёт функции.

      **Пакет** — папка с модулями и файлом `__init__.py`. Этот файл может быть пустым: он
      отмечает «здесь пакет» — и для людей, и для инструментов. Например, так выглядит «Список
      задач», разложенный по пакету:

      ```text
      todo-json/
          main.py
          todo/
              __init__.py
              storage.py
              tasks.py
      ```

      Модули пакета подключают с именем папки: `from todo import storage` — и дальше
      `storage.load_tasks()`. Или через точку сразу функцию: `from todo.storage import load_tasks`.
      Запускают программу из папки проекта: `python main.py`.

      Ещё две вещи пригодятся на компьютере. После импорта рядом с модулями появится папка
      `__pycache__` — это кеш, запас модулей в переведённом виде для быстрой загрузки; её можно
      удалять. А если два модуля подключают друг друга — это **кольцевой импорт**, и программа
      может упасть с `ImportError`. Поэтому импорты идут в одну сторону: main.py подключает модули
      пакета, а не наоборот.
    simpler: >-
      `if __name__ == "__main__":` читается как «если этот файл запустили, а не подключили». Под
      ним — то, что нужно только при запуске. Пакет — папка с модулями и файлом `__init__.py`;
      модули из неё подключают с именем папки: `from todo import storage`.
    coach: >-
      Привычка на будущее: в модуле — функции, внизу — проверка под `if __name__`. Так модуль и
      проверить легко, и подключить можно куда угодно.

  - id: club-package
    type: example
    title: Пакет клуба
    body: |-
      Тимур сложил модули клуба в пакет `club`. Все файлы видны в блоке «Файлы задания»:

      ```text
      main.py            ← программа ниже
      club/
          __init__.py    ← пустой файл: «здесь пакет»
          gear.py        ← функция total_weight
          food.py        ← функция portions и проверка под if __name__
      ```

      В `food.py` внизу стоит проверка:

      ```python
      if __name__ == "__main__":
          print("Проверка:", portions(1, 1))
      ```

      Нажми «Запустить» и посмотри, напечатается ли она.
    code: |-
      from club import gear
      from club.food import portions

      print("Общий вес:", gear.total_weight([2.5, 1.2, 0.8]), "кг")
      print("Порций на поход:", portions(4, 3))
    files:
      club/__init__.py: ""
      club/gear.py: |
        def total_weight(weights):
            total = 0
            for weight in weights:
                total += weight
            return round(total, 1)
      club/food.py: |
        PORTIONS_PER_DAY = 3


        def portions(people, days):
            return people * days * PORTIONS_PER_DAY


        if __name__ == "__main__":
            print("Проверка:", portions(1, 1))
    notes:
      - line: 1
        text: >-
          Из пакета `club` взять модуль `gear`. Дальше его функции — через `gear.`, как у
          обычного модуля.
      - line: 2
        text: Из модуля `food` пакета `club` взять сразу функцию `portions` — без приставки.
      - line: 5
        text: >-
          Строки «Проверка:» в выводе нет: при импорте `__name__` у модуля равно `"club.food"`, а
          не `"__main__"`, и условие ложно.
    tryIt: >-
      Замени вторую строку на `from club import food` и поправь последний вызов так, чтобы
      программа снова вывела 36. Потом добавь в конец `print(food.__name__)` — увидишь полное имя
      модуля.
    coach: >-
      В пакете всё то же самое, что с модулями, только в пути к модулю появляется имя папки.

  - id: practice-airtime
    type: exercise
    title: Практика 2
    exercise:
      id: m8-l2-e2
      kind: fix
      title: Модуль эфира печатает лишнее
      statement: |-
        Радио колледжа составляет эфирную сетку. Модуль `airtime.py` считает, сколько длится блок
        передач, и переводит минуты в часы. Внизу автор оставил проверку — две строки `print`.

        Теперь программа эфира подключает модуль строкой `import airtime`, и в её выводе каждый раз
        появляются строки проверки `2 ч 13 мин` и `0 ч 59 мин`.

        Исправь модуль:

        - при прямом запуске (кнопка «Запустить») проверка печатает то же, что и сейчас;
        - при `import airtime` модуль ничего не печатает;
        - после импорта функции `total_minutes` и `as_hours` доступны и считают как раньше.
      input: Ввода нет.
      output: "При прямом запуске — две строки проверки; при импорте — ничего."
      constraints:
        - Функции менять не нужно.
        - Проверку не удаляй — она нужна при прямом запуске.
      filename: airtime.py
      starterCode: |
        def total_minutes(durations):
            total = 0
            for minutes in durations:
                total += minutes
            return total


        def as_hours(minutes):
            return f"{minutes // 60} ч {minutes % 60} мин"


        # Проверка модуля
        print(as_hours(total_minutes([45, 50, 38])))
        print(as_hours(59))
      tests:
        - id: t1
          kind: io
          title: Прямой запуск
          example: true
          expected: |-
            2 ч 13 мин
            0 ч 59 мин
        - id: t2
          kind: assert
          title: Импорт молчит
          example: true
          code: |-
            import contextlib
            import io
            import sys

            sys.modules.pop("airtime", None)
            buffer = io.StringIO()
            with contextlib.redirect_stdout(buffer):
                import airtime
            assert buffer.getvalue() == ""
          message: При `import airtime` модуль ничего не печатает.
        - id: t3
          kind: assert
          title: Функции после импорта
          edge: true
          code: |-
            import contextlib
            import io
            import sys

            sys.modules.pop("airtime", None)
            with contextlib.redirect_stdout(io.StringIO()):
                import airtime
            assert hasattr(airtime, "total_minutes") and hasattr(airtime, "as_hours")
            assert airtime.as_hours(airtime.total_minutes([30, 30])) == "1 ч 0 мин"
            assert airtime.as_hours(0) == "0 ч 0 мин"
          message: >-
            После `import airtime` функции total_minutes и as_hours доступны и считают как раньше.
      criteria:
        - При прямом запуске выводятся те же две строки проверки.
        - При `import airtime` модуль ничего не печатает.
        - После импорта обе функции доступны и работают как раньше.
      hints:
        - >-
          Python сам сообщает файлу, как его запустили, — через особое имя из теории «Код запуска
          и пакеты». Что из этого файла должно выполняться всегда, а что — только при прямом
          запуске?
        - >-
          На другом файле: если в `tools.py` написать `print(__name__)`, то при запуске tools.py
          напечатается `__main__`, а при `import tools` из другой программы — `tools`. В
          `__name__` лежит строка: `print` показывает её без кавычек, а в коде строку пишут в
          кавычках. Например, `__name__ == "tools"` истинно, когда tools.py подключили.
        - |-
          Каркас:
          ```text
          def total_minutes(...): ...   # без изменений
