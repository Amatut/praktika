id: m8-l2
module: m8
number: "8.2"
title: "Свои модули и пакет: проект из нескольких файлов"
objective: >-
  Выносить функции в свой модуль, подключать их через import и from … import, а код запуска
  прятать под if __name__ == "__main__", чтобы модуль импортировался без лишних действий.
minutes: [25, 30]
prerequisites: [m8-l1, m5-l5]
skills: [modules-imports, function-design]
environment: python

story:
  title: Девятьсот строк в одном рюкзаке
  fictional: true
  text: >-
    Тимур из походного клуба «Азимут» два года дописывал программу для сборов: вес рюкзаков,
    продукты, список снаряжения — всё в одном файле, который разросся до девятисот строк. Когда
    Тимуру взялась помогать сестра Соня, она полдня искала, где считается вес палатки, а потом
    поправила не тот кусок и сломала расчёт продуктов. Тимур разложил код по файлам: `gear.py` —
    снаряжение, `food.py` — продукты, `main.py` — меню. Теперь каждую часть можно открыть и
    проверить отдельно, а функцию подсчёта веса — подключить и в другой программе клуба.

why: >-
  Когда код растёт, его раскладывают по смыслу в разные файлы — как вещи по ящикам. Например, загрузка и
  сохранение задач живут в `storage.py`, а `main.py` только спрашивает команды и вызывает нужные
  функции.

usedIn: >-
  Так устроен любой проект больше пары сотен строк. Библиотеки, которые ты будешь ставить через pip
  в уроке 8.3, — это те же модули и пакеты, только написанные другими людьми. А pytest в модуле 9
  импортирует твои модули, чтобы проверить их функции.

steps:
  - id: modules
    type: theory
    title: Модуль — это файл
    body: |-
      Пока программа короткая, всё помещается в один файл. Когда в нём сотни строк, нужное
      приходится искать, а правка в одном месте ломает другое. Поэтому код раскладывают по смыслу
      в разные файлы.

      **Модуль** — это любой файл `.py`. Модули стандартной библиотеки ты уже подключал:
      `import random` (урок 3.5), `from pathlib import Path` (урок 7.2), `from datetime import date`
      (урок 8.1). Свой модуль подключается точно так же. Пусть рядом с программой лежит файл
      `gear.py` с функцией `total_weight`. Есть два способа.

      ```python
      import gear

      print(gear.total_weight([1.2, 0.8]))
      ```

      `import gear` выполняет файл gear.py и даёт программе одно имя — `gear`. Функции модуля
      достают через точку: `gear.total_weight(...)`. Часть `gear.` перед именем функции —
      **приставка**, как `random.` в уроке 3.5.

      ```python
      from gear import total_weight

      print(total_weight([1.2, 0.8]))
      ```

      `from gear import total_weight` кладёт в программу само имя функции, и приставка `gear.`
      не нужна. Зато имени `gear` в программе нет. Несколько имён перечисляют через запятую:
      `from gear import total_weight, per_person`. Бывает и короткое имя для модуля:
      `import gear as g`, дальше — `g.total_weight(...)`.

      Имя модуля пишут **без `.py`**: `import gear`, а не `import gear.py`.

      **Где Python ищет модуль.** Сначала — в папке запускаемой программы, потом — в стандартной
      библиотеке и в библиотеках, которые ты установишь сам (урок 8.3). Отсюда правило: не называй
      свои файлы как стандартные
      модули — `random.py`, `json.py`, `datetime.py`. Такой файл закроет собой настоящий модуль, и
      `import random` подключит твой черновик.

      **Модуль выполняется при импорте.** Встретив `import`, Python выполняет файл модуля сверху
      вниз: создаёт функции и переменные, а заодно запускает всё остальное, что стоит вне
      функций, — например, `print`.

      Частое заблуждение: «import копирует код модуля в мою программу». Нет: модуль живёт
      отдельно, со своими именами, а программа получает к нему доступ — через имя модуля или через
      имена, которые она забрала из него.
    simpler: >-
      Модуль — файл с функциями. `import gear` — «возьми ящик gear», `gear.функция()` — «достань
      из ящика». `from gear import функция` — «достань сразу, ящик не нужен».
    coach: >-
      Правило одного ящика: в модуле — функции на одну тему, в main.py — только запуск.

  - id: units-module
    type: example
    title: Модуль клуба
    body: |-
      Клуб ходит и по зарубежным картам, где расстояния в милях. Функции перевода Тимур вынес в
      модуль `units.py`. Он лежит рядом с программой — его видно в блоке «Файлы задания»:

      ```python
      KM_IN_MILE = 1.609


      def km_to_miles(km):
          return round(km / KM_IN_MILE, 1)


      def miles_to_km(miles):
          return round(miles * KM_IN_MILE, 1)
      ```

      Программа ниже — это `main.py`. Нажми «Запустить».
    code: |-
      import units

      print(units.km_to_miles(42.2))
      print(units.miles_to_km(3))
    files:
      units.py: |
        KM_IN_MILE = 1.609


        def km_to_miles(km):
            return round(km / KM_IN_MILE, 1)


        def miles_to_km(miles):
            return round(miles * KM_IN_MILE, 1)
    notes:
      - line: 1
        text: >-
          `import units` находит файл units.py в папке программы и выполняет его. Имя модуля — без
          `.py`.
      - line: 3
        text: >-
          Функция модуля — через точку: сначала имя модуля, потом имя функции. Марафонские
          42,2 км — это 26,2 мили (программа печатает `26.2`).
      - line: 4
        text: >-
          Вторая функция переводит обратно: 3 мили — это 4,8 км. Константу `KM_IN_MILE`
          программа не трогает — ею пользуются функции внутри модуля, но при желании её можно
          достать: `units.KM_IN_MILE`.
    tryIt: >-
      Замени первую строку на `from units import km_to_miles` и запусти: программа остановится с
      NameError — имени `units` больше нет. Почини: добавь `miles_to_km` в ту же строку import
      через запятую и убери приставку `units.` у обоих вызовов.
    coach: >-
      Модуль один, а подключать его можно в любой программе клуба — достаточно положить файл рядом.

  - id: import-twice
    type: predict
    title: Сколько раз загрузится модуль?
    prompt: |-
      В модуле `greet.py` есть `print` вне функции:

      ```python
      print("Загружаю greet")


      def hello(name):
          return f"Привет, {name}!"
      ```

      Программа ниже подключает его дважды, двумя разными способами. Как думаешь, что она
      выведет?
    code: |-
      import greet
      from greet import hello
      print(hello("Тимур"))
    files:
      greet.py: |
        print("Загружаю greet")


        def hello(name):
            return f"Привет, {name}!"
    options:
      - |-
        Загружаю greet
        Загружаю greet
        Привет, Тимур!
      - |-
        Загружаю greet
        Привет, Тимур!
      - Привет, Тимур!
    answer: |-
      Загружаю greet
      Привет, Тимур!
    explanation: >-
      При первом импорте Python выполняет файл модуля целиком — и `print` в нём тоже — и
      запоминает готовый модуль. Второй импорт, в какой бы форме он ни был, файл заново не
      выполняет: `from greet import hello` берёт функцию из уже загруженного модуля. Модуль
      выполняется один раз за запуск программы. Но всё, что стоит в нём вне функций, выполнится
      в каждой программе, которая его подключит. Поэтому в модуле держат определения, а не
      действия, — как быть с проверками, разберём в следующей теории.
    coach: >-
      Если бы в greet.py стоял `input()`, любая программа с `import greet` начала бы с чужого
      вопроса.

  - id: practice-gear
    type: exercise
    title: Практика 1
    exercise:
      id: m8-l2-e1
      kind: repeat
      title: Рюкзак на всех
      statement: |-
        Перед походом Тимур взвешивает общие вещи — палатку, котелок, аптечку — и делит груз
        поровну. Функции для этого уже написаны в модуле `gear.py` (он лежит рядом с программой,
        его видно в блоке «Файлы задания»):

        ```python
        def total_weight(weights):
            total = 0
            for weight in weights:
                total += weight
            return round(total, 1)


        def per_person(total, people):
            return round(total / people, 1)
        ```

        `total_weight` получает список весов и возвращает общий вес, `per_person` — общий вес и
        число людей и возвращает долю каждого.

        Допиши `main.py`: чтение ввода уже есть, осталось подключить модуль `gear` и посчитать
        его функциями общий вес и вес на каждого. Для ввода `1.2 0.8 2.5` и `3` вывод такой:

        ```text
        Общий вес: 4.5 кг
        На каждого: 1.5 кг
        ```
      input: Первая строка — веса вещей в килограммах через пробел, вторая — число людей.
      output: "Две строки: `Общий вес: <число> кг` и `На каждого: <число> кг`."
      constraints:
        - Считай функциями из `gear.py`, не переписывай их в `main.py`.
        - >-
          Модуль `gear.py` менять не нужно. Проверка подложит и поправленный клубом `gear.py` —
          программа должна сразу считать по нему.
      files:
        gear.py: |
          def total_weight(weights):
              total = 0
              for weight in weights:
                  total += weight
              return round(total, 1)


          def per_person(total, people):
              return round(total / people, 1)
      starterCode: |
        # Подключи модуль gear


        weights = []
        for part in input().split():
            weights.append(float(part))
        people = int(input())

        # Посчитай функциями из gear общий вес и вес на каждого и выведи две строки:
        # Общий вес: … кг
        # На каждого: … кг
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "1.2 0.8 2.5\n3\n"
          expected: |-
            Общий вес: 4.5 кг
            На каждого: 1.5 кг
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "3.4 1.1 0.7 2.2\n2\n"
          expected: |-
            Общий вес: 7.4 кг
            На каждого: 3.7 кг
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: одна вещь, один человек"
          edge: true
          stdin: "5\n1\n"
          expected: |-
            Общий вес: 5.0 кг
            На каждого: 5.0 кг
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: мелочь на четверых"
          edge: true
          stdin: "0.3 0.3 0.3\n4\n"
          expected: |-
            Общий вес: 0.9 кг
            На каждого: 0.2 кг
          compare:
            ignoreSpaces: true
        - id: t5
          kind: assert
          title: Модуль gear подключён
          stdin: "1.2 0.8 2.5\n3\n"
          code: |-
            import sys

            assert "gear" in sys.modules, "модуль gear не подключён"
          message: Программа подключает модуль gear через `import gear` или `from gear import …`.
        - id: t6
          kind: io
          title: "Клуб поправил gear.py: округление до сотых"
          stdin: "1.25 1.5\n3\n"
          files:
            gear.py: |
              def total_weight(weights):
                  total = 0
                  for weight in weights:
                      total += weight
                  return round(total, 2)


              def per_person(total, people):
                  return round(total / people, 2)
          expected: |-
            Общий вес: 2.75 кг
            На каждого: 0.92 кг
          compare:
            ignoreSpaces: true
      criteria:
        - Модуль `gear` подключён через `import gear` или `from gear import …`.
        - >-
          Общий вес и вес на каждого посчитаны функциями модуля, а не копиями или формулами в
          `main.py`: если клуб поправит gear.py, программа сразу считает по-новому.
        - Вывод — две строки в формате из условия, для любых весов и числа людей.
      hints:
        - >-
          Функции уже написаны, программе осталось их подключить и передать им числа из ввода.
          Посмотри на пример «Модуль клуба»: какая строка подключает units и как потом
          вызываются его функции?
        - >-
          На другом модуле: `import units`, затем `units.km_to_miles(10)`. Или
          `from units import km_to_miles`, затем просто `km_to_miles(10)`. Обрати внимание:
          `per_person` ждёт уже посчитанный общий вес, а не список весов.
        - |-
          Каркас (чтение ввода уже есть в стартовом коде):
          ```text
          import …

          total = gear.…(weights)
          print(f"Общий вес: {…} кг")
          print(f"На каждого: {gear.…(total, people)} кг")
          ```
      solution:
        code: |
          import gear

          weights = []
          for part in input().split():
              weights.append(float(part))
          people = int(input())

          total = gear.total_weight(weights)
          print(f"Общий вес: {total} кг")
          print(f"На каждого: {gear.per_person(total, people)} кг")
        explanation: >-
          `import gear` находит файл gear.py в папке программы и даёт имя `gear`, а функции модуля
          вызываются через точку. Сначала `total_weight` складывает веса, потом её результат вместе
          с числом людей уходит в `per_person`. Подойдёт и `from gear import total_weight,
          per_person` — тогда вызовы пишутся без приставки.
      altSolutions:
        - code: |
            from gear import total_weight, per_person

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = total_weight(weights)
            share = per_person(total, people)
            print("Общий вес:", total, "кг")
            print("На каждого:", share, "кг")
          note: from … import обоих имён, вывод через запятые в print.
        - code: |
            import gear as g

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = g.total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {g.per_person(total, people)} кг")
          note: Короткое имя модуля через as.
        - code: |
            import gear


            def main():
                weights = []
                for part in input().split():
                    weights.append(float(part))
                people = int(input())
                total = gear.total_weight(weights)
                print(f"Общий вес: {total} кг")
                print(f"На каждого: {gear.per_person(total, people)} кг")


            main()
          note: Своя функция main() из урока 5.5 — проверка не должна её отклонять.
        - code: |
            import gear

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total_weight = gear.total_weight(weights)
            per_person = gear.per_person(total_weight, people)
            print(f"Общий вес: {total_weight} кг")
            print(f"На каждого: {per_person} кг")
          note: >-
            Результаты названы так же, как функции модуля: после import gear эти имена в main.py
            свободны.
        - code: |
            import gear

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            print("Общий вес:", gear.total_weight(weights), "кг")
            print("На каждого:", gear.per_person(gear.total_weight(weights), people), "кг")
          note: Вложенный вызов вместо переменной, print через запятые.
      wrongSolutions:
        - code: |
            import gear.py

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = gear.total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {gear.per_person(total, people)} кг")
          note: Имя модуля с .py.
          expectMistake: import-with-py
        - code: |
            from gear import total_weight

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {gear.per_person(total, people)} кг")
          note: После from … import используют приставку gear.
          expectMistake: prefix-after-from
        - code: |
            import gear

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {per_person(total, people)} кг")
          note: После import gear функции вызваны без приставки.
          expectMistake: no-prefix
        - code: |
            from gear import total_weight

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {per_person(total, people)} кг")
          note: Второе имя не перечислено в from … import.
          expectMistake: missing-name
        - code: |
            import gear

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            print(f"Общий вес: {gear.total_weight(weights)} кг")
            print(f"На каждого: {gear.per_person(weights, people)} кг")
          note: В per_person передан список весов вместо общего веса.
          expectMistake: list-to-per-person
        - code: |
            def total_weight(weights):
                total = 0
                for weight in weights:
                    total += weight
                return round(total, 1)


            def per_person(total, people):
                return round(total / people, 1)


            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {per_person(total, people)} кг")
          note: Функции скопированы в main.py, модуль не подключён.
          expectMistake: copied
        - code: |
            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = round(sum(weights), 1)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {round(total / people, 1)} кг")
          note: Всё посчитано вручную, без модуля.
          expectMistake: not-imported
        - code: |
            import gear

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = gear.total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {gear.per_person(people, total)} кг")
          note: Аргументы per_person перепутаны местами.
          expectMistake: swapped-args
        - code: |
            import Gear

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = Gear.total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {Gear.per_person(total, people)} кг")
          note: Имя модуля с большой буквы.
          expectMistake: module-not-found
        - code: |
            import gear

            weights = input().split()
            people = int(input())

            total = gear.total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {gear.per_person(total, people)} кг")
          note: В модуль переданы строки из split, а не числа.
          expectMistake: strings-to-module
        - code: |
            # Подключи модуль gear


            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = gear.total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {gear.per_person(total, people)} кг")
          note: Вызовы через gear. написаны, а строку import забыли.
          expectMistake: forgot-import
        - code: |
            import gear as g

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            total = g.total_weight(weights)
            print(f"Общий вес: {total} кг")
            print(f"На каждого: {gear.per_person(total, people)} кг")
          note: Модуль подключён как g, а в одном вызове приставка gear.
          expectMistake: alias-prefix
        - code: |
            import gear

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            print(f"Общий вес: {gear.total_weight(weights)} кг")
            print(f"На каждого: {gear.per_person(total, people)} кг")
          note: Имя параметра total из def per_person принято за готовую переменную.
          expectMistake: param-as-variable
        - code: |
            from gear import total_weight, per_person

            weights = []
            for part in input().split():
                weights.append(float(part))
            people = int(input())

            print(f"Общий вес: {total_weight(weights)} кг")
            print(f"На каждого: {per_person(total, people)} кг")
          note: Та же путаница с параметром total, но через from … import.
          expectMistake: param-as-variable
        - code: |
            import gear

            weights = []
