          why: >-
            При импорте в `__name__` лежит `"airtime"` — значит, проверка печатает как раз при
            импорте, а при прямом запуске молчит. Условие перевёрнуто.
          try: 'Сравнивай с `"__main__"`: `if __name__ == "__main__":`.'
          verify: Тесты «Прямой запуск» и «Импорт молчит» должны стать зелёными.
        - id: check-before-defs
          when:
            errorIncludes: name 'as_hours' is not defined
          why: >-
            Python выполняет файл сверху вниз. Проверка стоит выше функций, и к моменту вызова
            `as_hours` ещё не создана.
          try: Перенеси блок `if __name__ == "__main__":` в конец файла, под определения функций.
          verify: Ошибка NameError должна исчезнуть, а «Прямой запуск» — пройти.
