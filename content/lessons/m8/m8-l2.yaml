  - id: practice-water
    type: exercise
    title: Практика 3
    exercise:
      id: m8-l2-e3
      kind: write
      title: Модуль для счётчика воды
      statement: |-
        У бабушки Нины на даче огород и теплица. Каждый вечер она записывает по счётчику, сколько
        литров воды ушло на полив за день. Внук Тимур написал для неё программу `report.py` — она
        лежит рядом, в блоке «Файлы задания»:

        ```python
        from water import total, average

        week = [310, 285, 402, 0, 260, 515, 330]
        print(f"За неделю: {total(week)} л")
        print(f"В среднем за день: {average(week)} л")
        ```

        Модуля `water.py` пока нет — его пишешь ты. Нужны две функции:

        - `total(liters)` — возвращает сумму чисел списка;
        - `average(liters)` — возвращает среднее, округлённое до одного знака после точки:
          `round(…, 1)`. Для пустого списка — `0`.

        При импорте модуль ничего не печатает. Кнопка «Запустить» выполняет твой `water.py`:
        чтобы увидеть результат, добавь внизу проверку под `if __name__ == "__main__":`. Как с
        модулем работает `report.py`, покажет «Проверить» — тест «report.py работает».
      input: Ввода нет — числа приходят в функции через параметр.
      output: >-
        `total` возвращает сумму, `average` — среднее с одним знаком после точки (0 для пустого
        списка); при импорте модуль ничего не печатает.
      constraints:
        - Имена функций — ровно `total` и `average`, их ждёт report.py.
        - Проверку для «Запустить» пиши только под `if __name__ == "__main__":`.
      filename: water.py
      files:
        report.py: |
          from water import total, average

          week = [310, 285, 402, 0, 260, 515, 330]
          print(f"За неделю: {total(week)} л")
          print(f"В среднем за день: {average(week)} л")
      starterCode: |
        # Модуль water: функции для отчёта о расходе воды.
        # Его подключает report.py — посмотри её в блоке «Файлы задания».

      tests:
        - id: t2
          kind: call
          title: Сумма
          example: true
          call: total([100, 250, 50])
          expected: "400"
        - id: t3
          kind: call
          title: Среднее
          example: true
          call: average([100, 250, 50])
          expected: "133.3"
        - id: t4
          kind: call
          title: "Граничный случай: сумма пустого списка"
          edge: true
          call: total([])
          expected: "0"
        - id: t5
          kind: call
          title: "Граничный случай: среднее пустого списка"
          edge: true
          call: average([])
          expected: "0"
        - id: t6
          kind: call
          title: "Граничный случай: один день"
          edge: true
          call: average([5])
          expected: "5.0"
        - id: t1
          kind: assert
          title: report.py работает
          example: true
          code: |-
            import contextlib
            import io
            import sys

            sys.modules.pop("report", None)
            sys.modules.pop("water", None)
            buffer = io.StringIO()
            with contextlib.redirect_stdout(buffer):
                import report
            lines = buffer.getvalue().splitlines()
            assert len(lines) == 2
            assert lines[0] in ("За неделю: 2102 л", "За неделю: 2102.0 л")
            assert lines[1] == "В среднем за день: 300.3 л"
          message: >-
            Программа report.py подключает модуль строкой `from water import total, average` и
            печатает ровно две строки: «За неделю: 2102 л» и «В среднем за день: 300.3 л».
        - id: t7
          kind: assert
