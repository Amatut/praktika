            codeRegex: '^if\s+(?!__name__\b)_*name_*\s*=='
          why: >-
            Такой переменной в файле нет. Особое имя, которое Python даёт каждому файлу, пишется
            с двумя подчёркиваниями с каждой стороны: `__name__`.
          try: 'Исправь имя слева: `if __name__ == "__main__":`.'
          verify: Ошибка NameError должна исчезнуть, а «Прямой запуск» — пройти.
        - id: self-compare
          when:
            failedTest: t2
            codeRegex: '__name__\s*==\s*__name__\b'
          why: >-
            `__name__ == __name__` сравнивает переменную с самой собой — это истинно всегда, и при
            запуске, и при импорте. Справа нужна строка, которая лежит в `__name__` только при
            прямом запуске.
          try: 'Сравнивай со строкой в кавычках: `if __name__ == "__main__":`.'
          verify: Тест «Импорт молчит» должен стать зелёным.
        - id: inverted
