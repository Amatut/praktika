      mistakes:
        - id: wrong-file
          when:
            errorType: FileNotFoundError
          why: >-
            В рабочей папке нет файла с таким именем: программа открывает не тот файл. Имя должно
            совпадать до буквы — `game.py`, как в блоке «Файлы задания».
          try: Сверь имя в `open(...)` с именем в блоке «Файлы задания».
          verify: Программа должна запуститься без FileNotFoundError.
        - id: startswith-args
          when:
            errorType: TypeError
            errorIncludes: slice indices
          why: >-
            `startswith` проверяет один образец. Второе и третье значения в скобках Python понимает
            как номера символов — откуда и докуда смотреть, — а не как ещё два маркера. Отсюда
            TypeError про `slice indices`.
          try: >-
            Проверь каждый маркер своим вызовом и соедини проверки через `or`:
            `line.startswith("<<<<<<<") or line.startswith("=======") or …`.
          verify: Программа должна запуститься без TypeError.
        - id: no-file
          when:
            codeRegex: '(?<![\s\S])(?![\s\S]*(?:\bopen\s*\(|read_text\s*\())'
          why: >-
            Программа не читает `game.py`, поэтому печатает одно и то же для любого файла. Проверка
            подставляет разные файлы — в «Конфликт разрешён» маркеров нет вовсе.
          try: Открой `game.py` через `with open("game.py", encoding="utf-8") as file:` и пройди по его строкам циклом `for`.
        - id: or-inside
          when:
            codeRegex: '(?:\(|==)\s*["''][<=>]{7}["'']\)?\s+or\s+["'']'
          why: >-
            `or` соединяет целые условия, а не варианты значения — как `day == "сб" or "вс"` в уроке
            2.4. Голая строка `"======="` после `or` непустая, а значит, истинная. Поэтому
            `line.startswith("<<<<<<<") or "======="` и `line[:7] == "<<<<<<<" or "======="` верны
            для любой строки. А в `line.startswith("<<<<<<<" or "=======")` Python сначала
            вычисляет `"<<<<<<<" or "======="`, получает первую строку и проверяет только один
            маркер.
          try: >-
            Запиши каждую проверку полностью:
            `line.startswith("<<<<<<<") or line.startswith("=======") or line.startswith(">>>>>>>")`.
        - id: not-at-start
          when:
            outputIncludes: 'print("=======")'
          why: >-
            Программа приняла за маркер строку `print("=======")`: знаки `=======` в ней есть, но
            не в начале. Оператор `in` ищет текст в любом месте строки, а Git ставит маркеры только
            в самое начало.
          try: Проверяй начало строки — `line.startswith("=======")` или `line[:7] == "======="`.
        - id: off-by-one
          when:
            failedTest: t1
            outputIncludes: "Строка 2: <<<<<<< HEAD"
          why: >-
            Номера на единицу меньше, чем в редакторе: счёт начался с нуля. Так бывает, когда
            счётчик растёт уже после печати или номер взят из индекса: индексы из
            `range(len(...))` начинаются с 0.
          try: >-
            Увеличивай счётчик в самом начале шага цикла, до проверки строки. А если номер — индекс
            `i`, печатай `i + 1`.
          verify: "В примере «Конфликт не разрешён» первая строка должна быть «Строка 3: <<<<<<< HEAD»."
        - id: off-by-one-up
          when:
            failedTest: t1
            outputIncludes: "Строка 4: <<<<<<< HEAD"
          why: >-
            Номера на единицу больше, чем в редакторе: счётчик начался с 1 и вырос до 2 ещё до
            проверки первой строки.
          try: >-
            Выбери что-то одно: начни с 0 и увеличивай счётчик в начале шага цикла — или начни с 1 и
            увеличивай в конце шага. Но не то и другое сразу.
          verify: "В примере «Конфликт не разрешён» первая строка должна быть «Строка 3: <<<<<<< HEAD»."
        - id: count-markers
          when:
            failedTest: t1
            outputIncludes: "Строка 1: <<<<<<< HEAD"
          why: >-
            Счётчик растёт только на строках с маркерами, поэтому считает маркеры, а не строки
            файла: вышло 1, 2, 3 вместо 3, 5, 7.
          try: >-
            Увеличивай номер на каждом шаге цикла — для любой строки, а не только внутри `if`. Чтобы
            понять, нашлись ли маркеры, заведи отдельный счётчик.
          verify: "В примере «Конфликт не разрешён» номера должны быть 3, 5 и 7."
        - id: missing-kind
          when:
            failedTest: t1
            codeRegex: '(?<![\s\S])(?:(?![\s\S]*<{7})|(?![\s\S]*={7})|(?![\s\S]*>{7}))'
          why: >-
            У конфликта три вида маркеров: `<<<<<<<` открывает его, `=======` делит версии,
            `>>>>>>>` закрывает. Программа ищет не все три, поэтому часть строк пропускает.
          try: Проверяй начало строки на каждый из трёх маркеров.
          verify: "В примере «Конфликт не разрешён» должно быть три строки: 3, 5 и 7."
        - id: nothing-found
          when:
            failedTest: t1
            outputEquals: Маркеров нет
          why: >-
            Программа не узнала ни одного маркера, хотя в файле их три: условие в `if` не
            срабатывает ни на одной строке. Частые причины: строка сравнивается целиком через `==`
            (а в ней после маркера ещё имя ветки и перевод строки), срез не той длины — в маркере
            семь знаков — или цикл идёт не по строкам: `for line in file.read()` перебирает
            отдельные символы.
          try: >-
            Проверь условие на промежуточных значениях, как в модуле 6: временно напечатай в цикле
            `print(f"ОТЛАДКА: {line[:7]=}")` и результат проверки — и сравни со строкой 3 файла.
          verify: В примере «Конфликт не разрешён» должны найтись строки 3, 5 и 7.
        - id: message-too-early
          when:
            outputIncludes: Маркеров нет
          why: >-
            «Маркеров нет» напечатано, хотя маркеры в файле есть. Так бывает, когда сообщение
            стоит внутри цикла (в `else`), после цикла без условия или когда счётчик найденных
            обнуляется внутри цикла. Сказать «маркеров нет» можно только после того, как
            просмотрены все строки.
          try: >-
            Заведи счётчик найденных до цикла, а сообщение напечатай после цикла — только если
            счётчик равен нулю.
          verify: В примере «Конфликт не разрешён» не должно быть строки «Маркеров нет».
        - id: no-message
          when:
            failedTest: t2
            outputEquals: ""
          why: >-
            Для файла без маркеров программа ничего не печатает. По условию в этом случае нужна
            строка «Маркеров нет».
          try: Считай найденные маркеры, а после цикла выведи «Маркеров нет», если счётчик равен нулю.
        - id: first-line-skipped
          when:
            failedTest: t7
            outputEquals: "Строка 3: =======\nСтрока 5: >>>>>>> greeting"
          why: >-
            Первая строка файла не проверяется, поэтому маркер в строке 1 пропущен. Так бывает с
            `range(1, len(lines))`, со срезом `lines[1:]` или если первую строку пропустили, как
            заголовок CSV. Но у `game.py` заголовка нет: конфликт может начаться прямо с первой
            строки.
          try: >-
            Проверяй все строки: `range(len(lines))` и номер `i + 1` — или `for line in file` со
            счётчиком.
          verify: "В граничном случае «маркер в первой строке» вывод должен начинаться со строки «Строка 1: <<<<<<< HEAD»."
        - id: short-marker
          when:
            failedTest: t4
            outputEquals: "Строка 3: ======"
          why: >-
            Программа приняла за маркер строку `======` из описания в начале файла: в ней шесть
            знаков `=`, а в маркере их семь. Проверка начала строки короче семи знаков ловит и такие
            строки.
          try: >-
            Сравнивай начало строки ровно с семью знаками: `"======="` в `startswith` или срез
            `line[:7]`.
          verify: "В граничном случае «похоже на маркер, но не он» должно получиться «Маркеров нет»."
        - id: no-encoding
          when:
            failedTest: t-enc
            codeRegex: '(?:\bopen|read_text)\s*\((?![^)]*encoding)'
            outputIncludes: Строка
          where: Вызов `open()`
          why: >-
            В `open()` не указана кодировка. В тренажёре этого не видно: здесь по умолчанию UTF-8.
            А на русской Windows с Python 3.14 и раньше файл прочитается в cp1251, и русские буквы
            из `game.py` дадут ошибку UnicodeDecodeError.
          try: Добавь в `open()` аргумент `encoding="utf-8"`.
          verify: Тест «Кодировка указана» должен стать зелёным.
      afterPass: >-
        Теперь забытый маркер легко поймать до коммита: запусти проверку перед `git add`. Такая
        проверка есть и в самом Git: команда `git diff --check` печатает для каждого маркера строку
        вида `main.py:2: leftover conflict marker` — «оставшийся маркер конфликта». Улучшение:
        вынеси имя файла в переменную в начале программы — тогда проверку легко направить на
        другой файл, например на свой `main.py`.
      skills: [git-workflow, files-paths, string-methods, accumulators]

  - id: experiment
    type: checklist
    title: Эксперимент в ветке
    body: |-
      Вторая часть урока — на компьютере, с проектом «Список задач» после урока 8.4: в проекте
      есть `.gitignore`, а `git status` чистый. Займёт 10–15 минут, интернет не нужен. Можно
      сразу после заданий, а можно отдельным заходом в другой день. Если под рукой только
      телефон — переходи к итогу урока, а сюда вернись позже. Нет своего проекта — сначала пройди
      чек-листы уроков 8.2–8.4 с учебным мини-проектом из 8.2: там он получает пакет `todo`,
      окружение, Git и `.gitignore`.

      Эксперимент — сроки задач: при добавлении программа спросит дату, а в списке покажет,
      сколько дней осталось (урок 8.1). Команды Git работают в любом терминале, а программу
      запускай в «Командной строке» с включённым окружением — в начале строки видно `(.venv)`
      (урок 8.3). Git отвечает на английском; если у тебя он пишет по-русски, ищи те же строки по
      смыслу.
    items:
      - id: clean
        text: >-
          **Проверь, что всё закоммичено.** В папке проекта набери `git status` — должно быть
          `nothing to commit, working tree clean`. Затем `git branch`: одна строка `* master` (или
          `* main`).
        help: >-
          Есть изменённые файлы — закоммить их, как в уроке 8.4, или верни через
          `git restore <файл>`, если правку не жалко. В `Untracked files` видны `.venv/` или
          `__pycache__/` — нет `.gitignore`, вернись к уроку 8.4. `fatal: not a git repository` —
          терминал открыт не в папке проекта. Основная ветка называется `main` — тогда везде ниже
          пиши `main` вместо `master`.
      - id: create
        text: >-
          **Создай ветку:** `git switch -c deadlines`. Git ответит
          `Switched to a new branch 'deadlines'`. Набери `git branch` — звёздочка теперь у
          `deadlines`.
        help: >-
          Git пишет, что `switch` — не команда (`is not a git command`), значит, у тебя Git версии
          ниже 2.23. Пиши `git checkout -b deadlines`, а дальше вместо `git switch <имя>` —
          `git checkout <имя>`; а лучше обнови Git с [git-scm.com](https://git-scm.com/downloads).
          `fatal: a branch named 'deadlines' already exists` — ветка уже есть, перейди в неё:
          `git switch deadlines`.
      - id: code
        text: >-
          **Добавь задачам срок.** Код готовый, он в «Если не получается»: замени им содержимое
          `todo/tasks.py` и поправь одно место в `main.py`. Главное в этом пункте — не сам код, а
          то, что правка живёт в ветке. Запусти программу и добавь задачу со сроком: дата в виде
          ГГГГ-ММ-ДД, пустой ответ — без срока.
        help: |-
          Замени содержимое `todo/tasks.py` целиком — это файл из уроков 8.2 и 8.3 плюс сроки:

          ```python
          from datetime import date

          from tabulate import tabulate


          def add_task(tasks, title, due):
              if due != "":
                  try:
                      date.fromisoformat(due)
                  except ValueError:
                      print("Дата не распознана — задача добавлена без срока.")
                      due = ""
              tasks.append({"title": title, "done": False, "due": due})


          def mark_done(tasks, number):
              if 1 <= number <= len(tasks):
                  tasks[number - 1]["done"] = True
                  return True
              return False


          def due_text(task):
              due = task.get("due", "")
              if due == "":
                  return "без срока"
              left = (date.fromisoformat(due) - date.today()).days
              return f"{left} дн."


          def show_tasks(tasks):
              if len(tasks) == 0:
                  print("Задач пока нет.")
                  return
              rows = []
              number = 1
              for task in tasks:
                  if task["done"]:
                      done = "да"
                  else:
                      done = "нет"
                  rows.append([number, task["title"], done, due_text(task)])
                  number += 1
              print(tabulate(rows, headers=["№", "Задача", "Готово", "Осталось"]))
          ```

          Если в твоём `tasks.py` были ещё функции, например удаление, — перенеси их в новый файл.

          В `main.py`, в ветке команды «добавить», прямо перед вызовом `add_task` спроси срок — с тем
          же отступом, что у `add_task`, — и передай его третьим аргументом:

          ```python
          due = input("Срок ГГГГ-ММ-ДД (Enter — без срока): ").strip()
          add_task(tasks, title, due)
          ```

          `No module named 'tabulate'` — в этом окне не включено окружение:
          `.venv\Scripts\activate` (macOS и Linux: `source .venv/bin/activate`). `try`/`except` в
          `add_task` не пускает в список дату вроде `2026-13-01`, иначе список падал бы при каждом
          показе. У старых задач ключа `"due"` нет, поэтому в `due_text` стоит
          `task.get("due", "")`, а не `task["due"]`.
      - id: commit
        text: >-
          **Закоммить эксперимент.** `git status` и `git diff` — изменены `main.py` и
          `todo/tasks.py`. Затем `git add main.py todo/tasks.py` и
          `git commit -m "Добавить сроки задач"`. Ответ Git начинается с `[deadlines …]` — коммит
          ушёл в новую ветку.
        help: >-
          В `git status` виден `tasks.json` — его нет в `.gitignore` (урок 8.4); личные задачи в
          коммит не добавляй. Ответ начинается с `[master …]` — ветка не создалась, и коммит ушёл в
          основную ветку. Отменять его не нужно: создай ветку сейчас (пункт «Создай ветку») и сделай
          в ней следующую правку — например, поменяй текст вопроса о сроке, — чтобы потренировать
          переключение.
      - id: switch-back
        text: >-
          **Вернись в рабочую версию:** `git switch master`. Открой `todo/tasks.py` — функции
          `due_text` нет. Запусти программу — сроков в списке тоже нет. Теперь
          `git switch deadlines`: код со сроками вернулся.
        help: >-
          IDLE не перечитывает файл, который изменился на диске: закрывай файлы перед
          `git switch` и открывай заново после, иначе сохранение запишет старую версию поверх
          новой. VS Code обновляет открытые файлы сам. `error: Your local changes to the following
          files would be overwritten` — есть незакоммиченная правка: закоммить её или верни через
          `git restore`. Задачи, которые ты добавлял, никуда не деваются: `tasks.json` в
          `.gitignore`, и при переключении Git его не трогает.
      - id: merge
        text: >-
          **Эксперимент удался — слей ветку.** `git switch master`, затем `git merge deadlines`.
          Git напишет `Updating …`, `Fast-forward` и список изменённых файлов. Посмотри
          `git log --oneline --graph --all`: `--graph` рисует линии веток, `--all` показывает все
          ветки, а не только текущую. У верхнего коммита пометка `(HEAD -> master, deadlines)` —
          обе метки стоят на одном коммите.
        help: >-
          `Already up to date.` — ты сливаешь не в ту сторону или в ветке нет новых коммитов:
          набери `git branch`, звёздочка должна стоять у `master`. Открылся редактор с сообщением
          `Merge branch 'deadlines'` — значит, в `master` после создания ветки появились другие
          коммиты, и Git делает коммит слияния. Сообщение уже готово: в Блокноте сохрани файл и
          закрой окно, в VS Code закрой вкладку с сообщением, в Vim набери `:wq` и нажми Enter.
          Длинный журнал листается пробелом, выход — клавиша `q`.
      - id: delete
        text: >-
          **Убери слитую ветку:** `git branch -d deadlines`. Git ответит
          `Deleted branch deadlines (was …)`. Коммит со сроками остался в `master` — проверь через
          `git log --oneline`.
        help: >-
          `error: the branch 'deadlines' is not fully merged` — слияние не состоялось: вернись к
          предыдущему пункту. Удалять слитую ветку необязательно, но старые ветки загромождают
          список `git branch`.
      - id: failed-idea
        text: >-
          **Неудачная идея.** `git switch -c wild-idea`, измени любую строку (например, текст
          меню), закоммить и вернись: `git switch master`. Попробуй `git branch -d wild-idea` —
          Git откажет: `error: the branch 'wild-idea' is not fully merged`. Идея не нужна — удали
          ветку большой буквой: `git branch -D wild-idea`. Рабочая версия не изменилась.
        help: >-
          Строки `hint:` под ошибкой — подсказки Git; одна из них как раз предлагает
          `git branch -D wild-idea`. Команда с `-D` не спрашивает подтверждения и удаляет коммиты
          ветки, поэтому перед ней проверь по `git branch`, что удаляешь именно эксперимент.
          `error: cannot delete branch 'wild-idea' used by worktree at …` — ты сейчас в этой ветке:
          сначала `git switch master`.
    coach: >-
      После каждого `git switch` набирай `git branch` или `git status`: так всегда видно, в какой
      ветке ты сейчас работаешь.

  - id: conflict-live
    type: checklist
    title: Конфликт вживую (по желанию)
    body: >-
      Необязательный блок на компьютере, 5–10 минут, — можно сразу после эксперимента: устроим
      конфликт нарочно, чтобы в первый раз встретить его не в важный момент. Нужен проект с чистым
      `git status`, интернет не нужен.
    items:
      - id: branch-change
        text: >-
          **Правка в ветке.** `git switch -c greeting`, поменяй в `main.py` одну строку — например,
          текст приглашения в `input(...)` меню. Сохрани, затем `git add main.py` и
          `git commit -m "Изменить приглашение"`.
        help: >-
          Ответ Git начинается с `[greeting …]` — коммит ушёл в новую ветку. Начинается с
          `[master …]` — ветка не создалась: проверь `git branch` и повтори опыт с новой веткой.
          `fatal: a branch named 'greeting' already exists` — ветка осталась с прошлого раза:
          возьми другое имя, например `greeting2`, и пиши его дальше вместо `greeting`.
      - id: master-change
        text: >-
          **Другая правка той же строки.** `git switch master` и поменяй **ту же строку**
          по-другому. Сохрани, `git add main.py` и `git commit -m "Уточнить приглашение"`.
        help: >-
          IDLE: закрой файл перед `git switch` и открой после — иначе он покажет версию из другой
          ветки.
      - id: merge
        text: >-
          **Слей ветку.** `git merge greeting` — Git сообщит
          `CONFLICT (content): Merge conflict in main.py`. Набери `git status`: файл в разделе
          `Unmerged paths` с пометкой `both modified`.
        help: >-
          Конфликта нет и слияние прошло само — значит, правки попали в разные строки, и Git
          объединил их без тебя. Если при этом открылся редактор с сообщением
          `Merge branch 'greeting'`: в Блокноте сохрани файл и закрой окно, в VS Code закрой вкладку
          с сообщением, в Vim набери `:wq` и Enter. Потом повтори опыт с новой веткой — и меняй в
          обеих ветках одну и ту же строку.
      - id: resolve
        text: >-
          **Разреши конфликт.** Открой `main.py`, найди маркеры, реши, какую версию оставить (или
          собери свою), удали три строки маркеров и сохрани. Запусти `python main.py` — программа
          работает.
        help: >-
          В VS Code над конфликтом появляются кнопки **Accept Current Change** (версия текущей
          ветки), **Accept Incoming Change** (версия сливаемой ветки) и **Accept Both Changes**
          (обе). Кнопка убирает маркеры сама, но решение и проверка запуском — за тобой.
          SyntaxError при запуске — в файле остались маркеры; команда `git diff --check` покажет
          строки с ними (`leftover conflict marker`). `No module named 'tabulate'` — в этом окне не
          включено окружение: `.venv\Scripts\activate` (урок 8.3).
      - id: finish
        text: |-
          **Заверши слияние.** `git add main.py`, затем `git commit --no-edit` — Git создаст
          коммит слияния с сообщением `Merge branch 'greeting'`. Посмотри
          `git log --oneline --graph --all` — две линии сходятся в одну, примерно так:

          ```text
          *   cc0c237 (HEAD -> master) Merge branch 'greeting'
          |\
          | * 9f9d4d1 (greeting) Изменить приглашение
          * | aa2a1ab Уточнить приглашение
          |/
          ```

          Теперь ветку можно удалить: `git branch -d greeting`.
        help: >-
          `git commit --no-edit` берёт готовое сообщение и не открывает редактор. Передумал на
          середине — `git merge --abort` вернёт всё к состоянию до `git merge`. Ветка не удаляется
          (`not fully merged`) — коммит слияния не создан: проверь `git status`.
    coach: >-
      Первый конфликт лучше встретить нарочно, когда никуда не спешишь, — тогда настоящий уже не
      испугает.

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Ветка — отдельная линия коммитов: `git switch -c <имя>` создаёт её и переходит в неё, `git switch <имя>` переключает, `git branch` показывает, где ты."
      - "Папка одна: при переключении Git раскладывает в ней файлы нужной ветки. Перед `git switch` — чистый `git status`."
      - "Удачный эксперимент — `git switch master`, `git merge <имя>` и `git branch -d <имя>`; неудачный — `git branch -D <имя>`."
      - "Конфликт: выбрать или собрать версию, удалить маркеры `<<<<<<<`, `=======`, `>>>>>>>`, проверить запуском, затем `git add` и `git commit`."
    question: Почему перед `git switch` стоит набрать `git status`?
    answer: >-
      Незакоммиченные правки не принадлежат ни одной ветке. Git либо унесёт их с собой в другую
      ветку — и правка из эксперимента окажется в рабочей версии, — либо откажется переключаться.
      Чистый статус значит, что каждая правка уже лежит в коммите своей ветки и переключение ничего
      не перепутает.
