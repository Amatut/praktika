id: m8-l5
module: m8
number: "8.5"
title: Ветка для эксперимента
objective: >-
  Пробовать идею в отдельной ветке Git, переключаться между ней и рабочей версией, сливать удачный
  эксперимент в основную ветку или удалять неудачный и разрешать простой конфликт слияния.
minutes: [30, 40]
prerequisites: [m8-l4]
skills: [git-workflow]
environment: external

story:
  title: Черновик рядом с рабочей игрой
  fictional: true
  text: >-
    Девятиклассница Лиза написала консольную игру «Камень, ножницы, бумага», и на переменах в неё
    играет полкласса. Ей захотелось добавить очки за серию побед подряд, но переделка могла сломать
    игру, в которую все уже играют. Раньше для таких проб Лиза копировала папку с игрой и потом
    путалась, какая из копий рабочая. Теперь она завела в Git отдельную ветку: дома
    экспериментировала в ней, а перед школой одной командой возвращала в папку рабочую версию. Очки
    за серии прижились — Лиза слила ветку в основную, а неудачную идею с таймером на ход удалила
    тоже одной командой.

why: >-
  Ветка позволяет пробовать смелые идеи, не рискуя рабочей версией: не понравилось — вернулся одной
  командой. Например, `git switch -c combo` открывает черновик, а `git switch master` возвращает в
  папку рабочую версию.

usedIn: >-
  В командах каждую задачу делают в своей ветке и сливают в основную после проверки; на GitHub и
  похожих сервисах слияние оформляют как запрос на слияние (pull request). Одиночке ветки тоже
  помогают: можно срочно исправить ошибку в рабочей версии, пока новая функция ещё не готова.

steps:
  - id: branches
    type: theory
    title: Ветка — черновик с именем
    body: |-
      До сих пор история проекта была одной линией: коммит за коммитом. **Ветка** — отдельная
      линия коммитов со своим именем. Имя ветки работает как закладка: оно указывает на последний
      коммит линии и само сдвигается вперёд с каждым новым коммитом. Основная ветка называется
      `master` или `main` — это зависит от настроек Git. Как она называется у тебя, видно в первой
      строке `git status`: `On branch master`. Дальше в уроке пишем `master`.

      Когда Лиза завела ветку `combo`, история стала такой:

      ```text
      master:  A ─ B
                    \
      combo:         C ─ D
      ```

      Коммиты `C` и `D` есть только в ветке `combo`, а в `master` по-прежнему рабочая игра `B`.

      Команды:

      - `git branch` — список веток, звёздочка `*` стоит у текущей;
      - `git switch -c combo` — создать ветку и перейти в неё: новые коммиты пойдут туда;
      - `git switch master` — вернуться в основную ветку;
      - `git merge combo` — находясь в `master`, забрать себе коммиты ветки `combo`, то есть
        **слить** ветку;
      - `git branch -d combo` — удалить слитую ветку: её коммиты уже есть в `master`;
      - `git branch -D combo` — удалить неслитую ветку: её коммиты пропадут из истории.

      **Переключение меняет файлы.** Ветка — не копия папки. Папка одна, и при `git switch` Git
      раскладывает в ней файлы из последнего коммита нужной ветки. Перешёл в `master` — функции из
      `combo` в файле нет; вернулся в `combo` — она на месте.

      **Перед переключением — чистый `git status`.** Незакоммиченные правки не принадлежат ни одной
      ветке. Git либо унесёт их с собой в другую ветку, либо откажется переключаться и напишет
      `Your local changes to the following files would be overwritten`. Поэтому сначала закоммить
      правку или верни файл через `git restore`.

      У эксперимента два исхода. Удался — `git switch master` и `git merge combo`. Если в `master`
      за это время не было новых коммитов, Git просто передвинет закладку `master` вперёд и напишет
      `Fast-forward` — «перемотка вперёд». Если были, Git соединит две линии отдельным **коммитом
      слияния**. Не удался — из `master` удали ветку: `git branch -D combo`. Рабочая версия об
      эксперименте не узнает.

      В Git до версии 2.23 команды `switch` нет. Там пишут `git checkout -b combo` и
      `git checkout master`.
    simpler: >-
      Ветка — черновик рядом с чистовиком. Пишешь в черновике сколько хочешь; понравилось —
      переносишь в чистовик (`git merge`), не понравилось — выбрасываешь (`git branch -D`). Папка
      при этом одна: `git switch` раскладывает в ней файлы той ветки, куда ты перешёл.
    coach: >-
      Перед каждым `git switch` — `git status`. Чистая папка — спокойное переключение.

  - id: switch-files
    type: quiz
    title: Куда делась функция?
    question: >-
      Лиза в ветке `combo` добавила в `game.py` функцию `combo_points` и закоммитила. Потом
      набрала `git switch master`, открыла `game.py` — функции нет. Что случилось?
    options:
      - Git удалил её работу, функцию придётся писать заново
      - >-
        В `master` файл такой, каким он был в последнем коммите `master`; функция лежит в ветке
        `combo` и вернётся после `git switch combo`
      - Лиза забыла сохранить файл, и функция пропала
    correct: 1
    explanation: >-
      Папка одна, а версий файла две — по одной в каждой ветке. `git switch` раскладывает в папке
      файлы той ветки, куда ты перешёл, поэтому в `master` функции нет. Коммит с функцией никуда не
      делся: он в `combo`. Третий вариант не подходит: `git add` берёт файл с диска, и раз функция
      попала в коммит, файл был сохранён.

  - id: conflicts
    type: theory
    title: Когда две ветки поменяли одно и то же
    body: |-
      Пока Лиза меняла приветствие в ветке `greeting`, в `master` она поменяла ту же строку
      по-другому. Git не угадывает, какая версия правильная, и на `git merge greeting` отвечает:

      ```text
      Auto-merging main.py
      CONFLICT (content): Merge conflict in main.py
      Automatic merge failed; fix conflicts and then commit the result.
      ```

      Это **конфликт слияния** — не поломка, а вопрос к тебе: какую версию оставить? `git status`
      покажет файл в разделе `Unmerged paths` с пометкой `both modified` — «изменён в обеих
      ветках». А в самом файле Git записал обе версии между **маркерами**:

      ```text
      print("Камень, ножницы, бумага")
      <<<<<<< HEAD
      print("Привет, игрок! Сыграем?")
      =======
      print("Добро пожаловать в игру!")
      >>>>>>> greeting
      ```

      Между `<<<<<<< HEAD` и `=======` — версия текущей ветки, где ты стоишь (`master`). Между
      `=======` и `>>>>>>> greeting` — версия из сливаемой ветки. Маркеры всегда стоят в самом
      начале строки.

      Как разрешить конфликт:

      1. Отредактируй спорное место: оставь одну версию, другую или собери из двух новую.
      2. Удали все три строки маркеров.
      3. Запусти программу и убедись, что она работает.
      4. `git add main.py` — отметить, что конфликт разрешён.
      5. `git commit --no-edit` — коммит слияния с готовым сообщением `Merge branch 'greeting'`.

      Передумал сливать — `git merge --abort` вернёт всё как было до `git merge`.
    simpler: >-
      Конфликт — Git показывает обе версии спорного места и ждёт твоего решения. Верхняя половина —
      твоя текущая ветка, нижняя — ветка, которую сливаешь. Реши, что оставить, сотри маркеры,
      проверь запуском — и `git add`, `git commit`.
    coach: >-
      Конфликт — обычное дело даже в маленьком проекте. Главное правило: не коммитить файл, пока в
      нём есть маркеры.

  - id: markers
    type: predict
    title: Маркеры в коде
    prompt: >-
      Лиза сливает ветку `combo-bonus`, и в подсчёте очков случился конфликт. Не разрешив его, она
      запускает программу. Во вводе `10` и `3`. Как думаешь, что произойдёт?
    code: |-
      points = int(input())
      combo = int(input())
      <<<<<<< HEAD
      score = points * 2
      =======
      score = points + combo * 5
      >>>>>>> combo-bonus
      print(f"Счёт: {score}")
    stdin: "10\n3\n"
    options:
      - "Счёт: 20"
      - "Счёт: 25"
      - Ошибка SyntaxError в строке 3
    answer: Ошибка SyntaxError в строке 3
    answerIsNotOutput: true
    explanation: >-
      Маркеры — не код на Python. Python сначала проверяет запись всей программы, спотыкается о
      строку 3 `<<<<<<< HEAD` и сообщает `SyntaxError: invalid syntax`. Поэтому не выполняется ни
      одна строка — даже `input()` в самом начале, как с незакрытой кавычкой в уроке 0.3. Программа
      с неразрешённым конфликтом не запустится вообще.
    coach: >-
      SyntaxError на строке с `<<<<<<<`, `=======` или `>>>>>>>` — верный признак забытого
      конфликта.

  - id: practice-scoreboard
    type: exercise
    title: Практика 1
    exercise:
      id: m8-l5-e1
      kind: fix
      title: "Табло: слить две правки"
      statement: |-
        Школьное табло показывает счёт футбольного матча. Две правки сделали в разных ветках: в
        `master` счёт стал выводиться через двоеточие, а в ветке `team-names` к нему добавили
        слова «Хозяева» и «Гости». При слиянии случился конфликт — он в стартовом коде.

        Нужны обе правки сразу. Для счёта 2 : 1 табло должно показать:

        ```text
        Хозяева 2 : 1 Гости
        ```

        Разреши конфликт: собери из двух версий одну строку вывода и удали маркеры.
      input: Две строки — голы хозяев и голы гостей.
      output: "Одна строка: `Хозяева <голы хозяев> : <голы гостей> Гости`."
      constraints:
        - Первые две строки программы не меняй.
        - Разделитель между голами — двоеточие с пробелами по бокам, как в `master`.
      starterCode: |
        home = int(input())
        away = int(input())
        <<<<<<< HEAD
        print(f"{home} : {away}")
        =======
        print(f"Хозяева {home} — {away} Гости")
        >>>>>>> team-names
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "2\n1\n"
          expected: "Хозяева 2 : 1 Гости"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "0\n0\n"
          expected: "Хозяева 0 : 0 Гости"
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: двузначный счёт"
          edge: true
          stdin: "10\n3\n"
          expected: "Хозяева 10 : 3 Гости"
          compare:
            ignoreSpaces: true
      criteria:
        - В коде не осталось строк с маркерами `<<<<<<<`, `=======` и `>>>>>>>`.
        - Программа выводит одну строку, в которой есть и слова из ветки `team-names`, и двоеточие из `master`.
        - Счёт берётся из ввода.
      hints:
        - >-
          Прочитай конфликт по половинам. Что изменилось в `master` (между `<<<<<<<` и `=======`)
          и что — в ветке `team-names` (между `=======` и `>>>>>>>`)? В итоговой строке должны
          уцелеть обе правки.
        - >-
          Тот же приём на ценах. В одной ветке — `print(f"{price} руб.")`, в другой —
          `print(f"Цена: {price}")`. Объединённая версия берёт подпись из одной ветки, а рубли — из
          другой: `print(f"Цена: {price} руб.")`.
        - >-
          Удали три строки маркеров и одну из двух строк с `print`. В оставшейся строке с
          «Хозяева» и «Гости» замени тире между голами на разделитель из `master`.
      solution:
        code: |
          home = int(input())
          away = int(input())
          print(f"Хозяева {home} : {away} Гости")
        explanation: >-
          Из `master` взят разделитель « : », из ветки `team-names` — слова «Хозяева» и «Гости».
          Маркеры удалены, и осталась одна строка вывода — новая версия, собранная из двух. Git сам
          так не умеет: он видит две разные строки и спрашивает тебя, что с ними делать.
      altSolutions:
        - code: |
            home = int(input())
            away = int(input())
            print("Хозяева", home, ":", away, "Гости")
          note: print через запятую ставит пробелы сам.
        - code: |
            home = int(input())
            away = int(input())
            score = f"{home} : {away}"
            print(f"Хозяева {score} Гости")
          note: Строка счёта из master целиком, вокруг неё — слова из ветки.
      wrongSolutions:
        - code: |
            home = int(input())
            away = int(input())
            <<<<<<< HEAD
            print(f"{home} : {away}")
            =======
            print(f"Хозяева {home} — {away} Гости")
            >>>>>>> team-names
          note: Ничего не изменено — маркеры на месте.
          expectMistake: markers-left
        - code: |
            home = int(input())
            away = int(input())
            print(f"Хозяева {home} : {away} Гости")
            =======
          note: Удалены почти все лишние строки, но забыт разделитель =======.
          expectMistake: markers-left
        - code: |
            home = int(input())
            away = int(input())
            print(f"{home} : {away}")
            print(f"Хозяева {home} — {away} Гости")
          note: Маркеры удалены, но оставлены обе версии.
          expectMistake: both-lines
        - code: |
            home = int(input())
            away = int(input())
            print(f"{home} : {away}")
          note: Оставлена только версия master.
          expectMistake: only-head
        - code: |
            home = int(input())
            away = int(input())
            print(f"Хозяева {home} — {away} Гости")
          note: Оставлена только версия из ветки team-names.
          expectMistake: only-branch
        - code: |
            home = int(input())
            away = int(input())
            print(f"Хозяева {home}:{away} Гости")
          note: Двоеточие без пробелов.
          expectMistake: no-spaces
      mistakes:
        - id: markers-left
          when:
            errorType: SyntaxError
            codeRegex: '^(<{7}|={7}|>{7})'
          why: >-
            В коде осталась строка маркера конфликта. Маркеры — пометки Git, а не Python, поэтому
            программа не запускается вовсе: SyntaxError.
          try: >-
            Удали все три строки маркеров: `<<<<<<< HEAD`, `=======` и `>>>>>>> team-names`.
            Строки, которые начинаются с семи знаков `<`, `=` или `>`, в коде остаться не должны.
          verify: Программа должна запуститься без SyntaxError.
        - id: both-lines
          when:
            codeRegex: '^\s*print\([\s\S]*^\s*print\('
          why: >-
            Маркеры удалены, но остались обе версии, и табло печатает две строки. Разрешить
            конфликт — значит оставить одну строку, в которой есть обе правки.
          try: Собери из двух строк `print` одну — с «Хозяева», «Гости» и двоеточием из `master`.
          verify: "В «Примере 1» должна быть одна строка: «Хозяева 2 : 1 Гости»."
        - id: only-head
          when:
            outputEquals: "2 : 1"
          why: >-
            Оставлена только версия из `master`: двоеточие есть, а слова «Хозяева» и «Гости» из
            ветки `team-names` потерялись.
          try: Добавь в строку вывода слова из второй половины конфликта.
          verify: "В «Примере 1» должно получиться «Хозяева 2 : 1 Гости»."
        - id: only-branch
          when:
            outputEquals: "Хозяева 2 — 1 Гости"
          why: >-
            Оставлена только версия из ветки `team-names`: слова есть, а правка из `master` —
            двоеточие вместо тире — потерялась.
          try: 'Замени тире между голами на разделитель из верхней половины конфликта — « : ».'
          verify: "В «Примере 1» должно получиться «Хозяева 2 : 1 Гости»."
        - id: no-spaces
          when:
            codeRegex: '\{home\}:|:\{away\}'
          why: >-
            Правки объединены, но двоеточие потеряло пробелы. В `master` счёт выводился как
            `{home} : {away}` — с пробелом по обе стороны двоеточия.
          try: Поставь пробел до и после двоеточия, как в версии из `master`.
          verify: "В «Примере 1» должно получиться «Хозяева 2 : 1 Гости»."
      afterPass: >-
        Ты не выбрал одну из версий, а собрал новую из двух — так разрешают многие конфликты.
        Совет на будущее: после слияния запускай программу на тех же данных, на которых проверял
        обе ветки по отдельности.
      skills: [git-workflow, f-strings]

  - id: practice-combo
    type: exercise
    title: Практика 2
    exercise:
      id: m8-l5-e2
      kind: fix
      title: Очки за комбо
      statement: |-
        В игре Лизы «Камень, ножницы, бумага» за раунд начисляются очки. Две ветки поменяли одну и
        ту же строку подсчёта:

        - в `master` — двойные очки выходного дня: весь счёт удваивается;
        - в ветке `combo-bonus` — бонус за серии: `+5` очков за каждое **комбо** (серию побед
          подряд).

        Нужны оба правила: сначала к очкам прибавляется бонус за комбо, потом всё вместе
        удваивается. Например, 10 очков и 3 комбо: бонус 15, вместе с очками 25, после удвоения —
        50.

        Разреши конфликт в стартовом коде — это та самая программа из прогноза.
      input: Две строки — очки за раунд и число комбо.
      output: "Одна строка: `Счёт: <число>`."
      constraints:
        - "Строку вывода `Счёт: …` не меняй."
      starterCode: |
        points = int(input())
        combo = int(input())
        <<<<<<< HEAD
        score = points * 2
        =======
        score = points + combo * 5
        >>>>>>> combo-bonus
        print(f"Счёт: {score}")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "10\n3\n"
          expected: "Счёт: 50"
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "7\n1\n"
          expected: "Счёт: 24"
        - id: t3
          kind: io
          title: "Граничный случай: без комбо"
          edge: true
          stdin: "10\n0\n"
          expected: "Счёт: 20"
        - id: t4
          kind: io
          title: "Граничный случай: ноль очков за раунд"
          edge: true
          stdin: "0\n2\n"
          expected: "Счёт: 20"
      criteria:
        - В коде не осталось строк с маркерами конфликта.
        - Счёт учитывает оба правила — бонус за комбо и удвоение.
