      criteria:
        - Программа читает `game.py` и проверяет каждую его строку.
        - Маркером считается только строка, которая начинается с `<<<<<<<`, `=======` или `>>>>>>>`.
        - Номера строк считаются с 1, как в редакторе; первая строка файла тоже проверяется.
        - Если маркеров нет, выводится ровно одна строка `Маркеров нет`.
        - "Файл открыт с кодировкой `encoding=\"utf-8\"`."
      hints:
        - >-
          Разбей работу на части: пройти по строкам файла, про каждую решить «маркер или нет», а в
          конце понять, нашлось ли хоть что-нибудь. Что нужно запоминать по ходу цикла, чтобы
          напечатать номер строки и чтобы после цикла знать ответ на последний вопрос?
        - |-
          Номер строки — обычный счётчик из модуля 3, а «нашлось ли» — второй счётчик. Пример на
          другом файле — сколько строк заметок начинается с `#`:

          ```python
          count = 0
          with open("notes.txt", encoding="utf-8") as file:
              for line in file:
                  if line.startswith("#"):
                      count += 1
          print("Комментариев:", count)
          ```
        - |-
          Каркас:

          ```text
          номер = 0, найдено = 0
          открыть game.py с encoding="utf-8"
          для каждой строки файла:
              номер += 1
              если строка начинается с <<<<<<<, ======= или >>>>>>>:
