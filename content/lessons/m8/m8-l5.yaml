  - id: practice-markers
    type: exercise
    title: Практика 3
    exercise:
      id: m8-l5-e3
      kind: write
      title: Проверка перед коммитом
      statement: |-
        В длинном файле легко пропустить одну строку маркеров — и закоммитить программу, которая
        не запускается. Напиши проверку: программа читает файл `game.py` (он лежит рядом, его
        видно в блоке «Файлы задания») и ищет строки, которые **начинаются** с `<<<<<<<`,
        `=======` или `>>>>>>>` — семи одинаковых знаков подряд.

        Для каждой такой строки программа печатает её номер (строки считаются с 1) и саму строку.
        Для файла из блока «Файлы задания» вывод такой:

        ```text
        Строка 3: <<<<<<< HEAD
        Строка 5: =======
        Строка 7: >>>>>>> combo-bonus
        ```

        Если маркеров нет, программа печатает одну строку `Маркеров нет`.

        Проверить начало строки поможет метод `startswith` из урока 8.3:
        `"<<<<<<< HEAD".startswith("<<<<<<<")` даёт `True`, а `"x = 1".startswith("<<<<<<<")` —
        `False`. Подойдёт и срез из модуля 4: `line[:7] == "<<<<<<<"`.
      input: Ввода нет — программа читает файл `game.py`.
      output: >-
        По строке на каждый маркер: `Строка <номер>: <строка файла>`. Если маркеров нет — одна
        строка `Маркеров нет`.
      constraints:
        - Открывай файл с `encoding="utf-8"`.
        - Маркер — только в самом начале строки. Например, `print("=======")` маркером не считается.
        - Проверка подставляет разные файлы `game.py`, поэтому номера и строки не записывай в код готовыми.
      files:
        game.py: |
          points = int(input())
          combo = int(input())
          <<<<<<< HEAD
          score = points * 2
          =======
          score = points + combo * 5
          >>>>>>> combo-bonus
          print(f"Счёт: {score}")
      starterCode: |
        # Прочитай game.py строка за строкой
        # Для каждой строки, которая начинается с маркера, выведи её номер и саму строку
        # Если маркеров не нашлось, выведи «Маркеров нет»
      tests:
