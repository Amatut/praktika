                print("Выполни: python -m pip install -r requirements.txt")
          note: Имя очищено только в print, а в словаре ищется «colorama » с пробелом.
          expectMistake: name-spaces
        - code: |
            installed = {}
            with open("installed.txt", encoding="utf-8") as file:
                for line in file:
                    line = line.strip()
                    if "==" in line:
                        name, version = line.split("==")
                        installed[name] = version

            problems = 0
            with open("requirements.txt", encoding="utf-8") as file:
                for line in file:
                    line = line.strip()
                    if line == "" or line.startswith("#"):
                        continue
                    if "==" in line:
                        name, version = line.split("==")
                        version = version.strip()
                    else:
                        name = line
                        version = ""
                    if name not in installed:
                        print(f"{name}: не установлен")
                        problems += 1
                    elif version != "" and installed[name] != version:
                        print(f"{name}: нужна {version}, стоит {installed[name]}")
                        problems += 1
                    else:
                        print(f"{name}: в порядке")
            if problems == 0:
                print("Всё на месте")
            else:
                print("Выполни: python -m pip install -r requirements.txt")
          note: 'Имя из описи не очищено вовсе — «colorama : не установлен».'
          expectMistake: name-spaces
        - code: |
            installed = {}
            with open("installed.txt") as file:
                for line in file:
                    line = line.strip()
                    if "==" in line:
                        name, version = line.split("==")
                        installed[name] = version

            problems = 0
            with open("requirements.txt", encoding="utf-8") as file:
                for line in file:
                    line = line.strip()
                    if line == "" or line.startswith("#"):
                        continue
                    if "==" in line:
                        name, version = line.split("==")
                        name = name.strip()
                        version = version.strip()
                    else:
                        name = line
                        version = ""
                    if name not in installed:
                        print(f"{name}: не установлен")
                        problems += 1
                    elif version != "" and installed[name] != version:
                        print(f"{name}: нужна {version}, стоит {installed[name]}")
                        problems += 1
                    else:
                        print(f"{name}: в порядке")
            if problems == 0:
                print("Всё на месте")
            else:
                print("Выполни: python -m pip install -r requirements.txt")
          note: installed.txt открыт без encoding.
          expectMistake: no-encoding
      mistakes:
        - id: wrong-file
          when:
            errorType: FileNotFoundError
          where: Строка с `open(...)`
          why: >-
            Файла с таким именем в папке программы нет. Файлы задания называются
            `requirements.txt` и `installed.txt` — их видно в блоке «Файлы задания».
          try: Сравни имя в каждом `open()` с именем файла буква в букву.
          verify: Ошибка FileNotFoundError должна исчезнуть.
        - id: key-error
          when:
            errorType: KeyError
          where: Строка, где версия берётся из словаря по имени пакета
          why: >-
            Пакета нет в installed.txt, а значит, и в словаре. Взять значение по ключу, которого
            нет, нельзя — Python останавливает программу ошибкой KeyError.
          try: >-
            Сначала проверь, что пакет установлен: `if name not in installed:` → «не установлен».
            Сравнивай версии только в следующей ветке, `elif`. Другой путь — `installed.get(name)`:
            он вернёт `None` вместо ошибки.
          verify: 'В «Примере 1» первой строкой должно стать «tabulate: не установлен».'
        - id: no-strip-installed
          when:
            outputIncludes: "нужна 0.4.6, стоит 0.4.6"
          where: Цикл, который читает installed.txt
          why: >-
            Версии выглядят одинаково, но не совпадают: строки из installed.txt приходят с `\n` на
            конце, и в словаре лежит `"0.4.6\n"`, а не `"0.4.6"`.
          try: Очисти строку `strip()`, прежде чем резать её по `==`.
          verify: 'В «Примере 1» должно стать «colorama: в порядке».'
        - id: unpinned-mismatch
          when:
            failedTest: t1
            outputIncludes: "requests: нужна"
          why: >-
            В «Примере 1» версия `requests` в описи не закреплена, а программа всё равно сравнивает
            её с установленной — и «версии нет» никогда не совпадёт с `2.31.0`.
          try: >-
            Сравнивай версии, только если версия в описи есть: например,
            `elif version != "" and installed[name] != version:`. Незакреплённый пакет в порядке,
            если он просто установлен.
          verify: 'В «Примере 1» должно стать «requests: в порядке».'
        - id: mismatch-not-counted
          when:
            outputIncludes: "стоит 2.31.0\nВсё на месте"
          where: Ветка, которая печатает «нужна …, стоит …»
          why: >-
            Программа заметила, что стоит не та версия, но итог всё равно «Всё на месте»: в этой
            ветке проблема не засчитывается.
          try: >-
            Добавь в ветку «нужна …, стоит …» то же, что в ветке «не установлен»: `problems += 1`
            (или то, чем у тебя отмечается проблема).
          verify: 'В «Примере 3» последней строкой должно стать «Выполни: python -m pip install -r requirements.txt».'
        - id: list-not-dict
          when:
            outputIncludes: "colorama: в порядке\nrequests: не установлен"
          why: >-
            `requests` стоит в окружении — в installed.txt есть строка `requests==2.31.0`, — а
            программа написала «не установлен». Так бывает, если пакет без версии вообще не ищут
            среди установленных или сравнивают строку описи со строками installed.txt целиком:
            `requests` не равно `requests==2.31.0`.
          try: >-
            Ищи пакет по имени: разложи installed.txt в словарь `{имя: версия}` (выбор структуры,
            как в уроке 4.6) и проверяй `if name in installed:` — и для пакета с версией, и для
            пакета без неё.
          verify: 'В «Примере 1» должно стать «requests: в порядке».'
        - id: leftover-empty
          when:
            outputIncludes: Зависимостей нет
          where: Строки с «Зависимостей нет» из прошлой программы
          why: >-
            «Зависимостей нет» — строка из прошлого задания. Здесь для описи без пакетов нужен
            только итог «Всё на месте».
          try: >-
            Убери печать «Зависимостей нет» — и счётчик `count`, если он больше ни для чего не
            нужен.
          verify: 'В граничном случае «в описи нет пакетов» должна остаться одна строка — «Всё на месте».'
        - id: summary-in-loop
          when:
            outputIncludes: "requirements.txt\ncolorama"
          where: Строки с итогом «Всё на месте» / «Выполни…»
          why: >-
            Итог печатается после каждого пакета: строки с ним стоят внутри цикла. А итог можно
            подвести, только когда проверены все пакеты.
          try: Убери отступ у `if problems == 0:` и его веток, чтобы они выполнялись один раз — после цикла.
          verify: 'В «Примере 1» строка «Выполни: …» должна остаться одна, последней.'
        - id: name-spaces
          when:
            failedTest: t6
            outputIncludes: "не установлен\nВыполни"
          where: Строки, где из строки описи получаются имя и версия
          why: >-
            colorama стоит в окружении, но программа её не нашла. В описи вокруг `==` стоят
            пробелы, и после `split("==")` имя — `"colorama "` с пробелом на конце. Пакета с таким
            именем среди установленных нет. Если очистить имя только внутри `print`, на экране
            пробела не видно, но ищется по-прежнему неочищенное имя.
          try: 'Очисти имя сразу после `split`, до поиска: `name = name.strip()`.'
          verify: 'В граничном случае с пробелами должно стать «colorama: в порядке».'
        - id: no-encoding
          when:
            failedTest: t-enc
            codeRegex: '(?:open|read_text)\((?![^)\n]*encoding)'
          where: Строка с `open(...)`
          why: >-
            В одном из `open()` не указана кодировка. Здесь, в тренажёре, файл всё равно
            прочитается, а на Windows со старым Python (до 3.15) русский текст превратится в
            кракозябры или в ошибку UnicodeDecodeError. Поэтому кодировку проверяет отдельный тест.
          try: 'Допиши `encoding="utf-8"` в каждый `open()` — и для installed.txt тоже.'
          verify: Тест «Кодировка указана» должен стать зелёным.
      afterPass: >-
        Программа сверяет опись с окружением — похожую проверку делает и pip при
        `install -r`: для пакетов, которые уже стоят нужной версии, он пишет `Requirement
        already satisfied`. Улучшение: перед итогом выведи, сколько пакетов нужно поставить или
        обновить, например `Проблем: 2`.
      skills: [venv-deps, dicts, files-paths]

  - id: wrong-env
    type: quiz
    title: Установил, а не видит
    question: |-
      Ты набрал `pip install tabulate`, и pip ответил `Successfully installed tabulate-0.9.0`. Но
      `python main.py` падает:

      ```text
      ModuleNotFoundError: No module named 'tabulate'
      ```

      Что вероятнее всего?
    options:
      - Пакет скачался повреждённым — нужно переустановить Python
      - "Пакет попал в другой Python: окружение не было включено или эта команда pip относится к другому Python"
      - В main.py опечатка в print
      - tabulate не работает на Windows
    correct: 1
    explanation: >-
      pip честно поставил пакет — но в тот Python, к которому относится сам. А `python main.py`
      запустил другой Python, где tabulate нет. Проверь `(.venv)` в начале строки и путь в ответе
      `python -m pip --version`, а ставь всегда через `python -m pip`: тогда пакет попадёт ровно в
      тот Python, который запускает программу. Опечатка в print дала бы другую ошибку, да и до
      print дело не дошло — упал import.

  - id: make-venv
    type: checklist
    title: Окружение для списка задач
    body: >-
      Дальше — работа на компьютере с проектом «Список задач», который ты разложил по модулям в
      уроке 8.2 (или с учебным мини-проектом оттуда). Её можно сделать отдельным заходом, в другой
      день: два блока займут 20–25 минут. Для установки пакета нужен интернет: без него дойди до
      пункта «Проверь, чей pip» и продолжи, когда сеть появится. Если под рукой только телефон,
      вернись к этому блоку позже.
    items:
      - id: cmd
        text: >-
          **Открой «Командную строку» в папке проекта.** Путь слева от курсора должен
          заканчиваться именем папки проекта, а команда `dir` — показать `main.py` и папку
          `todo`.
        help: |-
          Самый короткий путь — открой папку проекта в Проводнике, щёлкни по адресной строке
          вверху, сотри текст, набери `cmd` и нажми Enter.

          Другой способ: открой терминал в папке проекта, как в уроке 0.4 (правый щелчок →
          «Открыть в терминале»), набери `cmd` и нажми Enter. «Командная строка» запустится прямо
          в этом окне и в этой же папке.

          Путь не тот — закрой окно и открой «Командную строку» одним из этих способов заново,
          начиная с папки проекта.

          macOS и Linux: подойдёт обычный терминал, вместо `dir` — `ls`.
      - id: create
        text: >-
          **Создай окружение:** `python -m venv .venv` (или `py -m venv .venv`). Команда
          работает несколько секунд и ничего не пишет — это нормально. `dir` покажет новую папку
          `.venv`.
        help: >-
          macOS и Linux: `python3 -m venv .venv`, а проверить — командой `ls -a`: папки, имя
          которых начинается с точки, обычный `ls` не показывает. На некоторых Linux модуль venv
          ставится отдельным системным пакетом — об этом скажет сообщение об ошибке. Ответ
          «не является внутренней или внешней командой» или сообщение про Microsoft Store —
          Windows не нашла `python`: попробуй `py -m venv .venv`, а если и это не помогло, вернись
          к пункту «Проверь установку» урока 0.4.
      - id: activate
        text: >-
          **Включи окружение:** `.venv\Scripts\activate`. В начале строки появится `(.venv)`.
        help: |-
          macOS и Linux: `source .venv/bin/activate`.

          Если раньше у тебя работала только команда `py`: во включённом окружении работает и
          `python` — это Python окружения.

          Если ты всё-таки в PowerShell, та же команда запускает файл `Activate.ps1`, и сообщение
          «…выполнение сценариев отключено в этой системе» значит, что PowerShell запрещает
          сценарии. Проще всего набрать в этом же окне `cmd` и Enter — дальше работай в «Командной
          строке» (первый пункт).

          Можно обойтись и без включения: вместо `python` писать полный путь к Python окружения —
          `.venv\Scripts\python main.py`, `.venv\Scripts\python -m pip install tabulate`.

          Окружение включается только в том окне, где ты набрал команду. Открыл новое окно
          терминала — включи окружение снова.
      - id: which-pip
        text: >-
          **Проверь, чей pip:** `python -m pip --version`. В ответе должен быть путь, в котором
          есть папка твоего проекта и `.venv`.
        help: >-
          Ответ выглядит примерно так:
          `pip … from C:\…\python-practice\todo-json\.venv\Lib\site-packages\pip (python 3.…)` —
          версии и путь у тебя свои, главное — в пути есть `.venv`. Нет `.venv` в пути — окружение не
          включено: вернись к предыдущему пункту и проверь, что видно `(.venv)`.
      - id: install
        text: >-
          **Поставь пакет:** `python -m pip install tabulate`. В конце ответа —
          строка `Successfully installed tabulate-…`.
        help: >-
          Нужен интернет. Без сети pip несколько раз напишет `WARNING: Retrying …` со словами про
          соединение (connection), а в конце — `Could not find a version that satisfies the
          requirement` и `No matching distribution found`: продолжи, когда сеть появится. Те же
          две строки без предупреждений о соединении — чаще всего опечатка в имени пакета: сверь
          его на pypi.org. Строку `[notice] A new release of pip is available` можно пропустить —
          это предложение обновить pip, а не ошибка.
    coach: >-
      Перед каждой установкой смотри на начало строки: есть `(.venv)` — ставишь в окружение
      проекта.

  - id: use-package
    type: checklist
    title: Библиотека в деле и requirements.txt
    body: >-
      Продолжаем в той же «Командной строке» с включённым окружением — в начале строки видно
      `(.venv)`. Если открыл новое окно, включи окружение снова: `.venv\Scripts\activate`.
    items:
      - id: use
        text: >-
          **Покажи список задач таблицей.** В `todo/tasks.py` добавь в начало строку
          `from tabulate import tabulate` и перепиши `show_tasks` по образцу из «Если не
          получается». Запусти `python main.py` и выбери команду «список».
        help: |-
          Образец:

          ```python
          from tabulate import tabulate


          def show_tasks(tasks):
              if len(tasks) == 0:
                  print("Задач пока нет.")
                  return
              rows = []
              number = 1
              for task in tasks:
                  if task["done"]:
                      done = "да"
                  else:
                      done = "нет"
                  rows.append([number, task["title"], done])
                  number += 1
              print(tabulate(rows, headers=["№", "Задача", "Готово"]))
          ```

          Модуль и функция в нём называются одинаково — отсюда странная на вид строка
          `from tabulate import tabulate`. Функция принимает список списков — по списку на строку
          таблицы — и возвращает текст таблицы: сверху заголовки, под ними линия из дефисов,
          столбцы выровнены. Если твой список задач устроен иначе, собери строки таблицы из
          своих данных — идея та же.

          Ошибка `No module named 'tabulate'` — в этом окне окружение не включено или пакет
          ставили в другое окружение: проверь `(.venv)` и повтори установку.
      - id: freeze
        text: >-
          **Запиши опись:** `python -m pip freeze > requirements.txt`. Открой файл в редакторе:
          в нём строка вида `tabulate==0.9.0`.
        help: >-
          Номер версии у тебя может быть другим. Файл пустой или в нём много незнакомых пакетов —
          команду выполнили при выключенном окружении: включи его и повтори, файл перезапишется.
          Если ты работал в Windows PowerShell, знак `>` мог сохранить файл в кодировке UTF-16, и
          Git потом покажет его как двоичный. Сделай файл заново в «Командной строке» или впиши
          строку из вывода `python -m pip freeze` вручную.
      - id: isolation
        text: >-
          **Проверь, что пакет живёт только в окружении.** Выполни `deactivate` — `(.venv)`
          пропадёт — и снова запусти программу: `python main.py` (если раньше работала только
          `py` — `py main.py`). Программа упадёт сразу, ещё до меню:
          `ModuleNotFoundError: No module named 'tabulate'`. Затем включи окружение обратно.
        help: >-
          Программа падает до меню, потому что строка `from tabulate import tabulate` выполняется
          при импорте модуля tasks — ещё до того, как main.py спросит команду (урок 8.2). Ошибки
          нет и таблица показалась — значит, tabulate стоит ещё и в общем Python компьютера,
          например с прошлых экспериментов. Это не страшно: главное, что в окружении он тоже есть
          и записан в requirements.txt. Включить окружение снова: `.venv\Scripts\activate`
          (macOS и Linux: `source .venv/bin/activate`).
      - id: readme
        text: >-
          **Допиши в README.md раздел «Установка»** — по нему человек без твоих объяснений
          должен запустить проект на своём компьютере.
        help: |-
          Образец раздела:

          ```text
          ## Установка

          1. Открой «Командную строку» в папке проекта.
          2. Создай окружение: python -m venv .venv
             (macOS и Linux: python3 -m venv .venv)
          3. Включи его: .venv\Scripts\activate
             (macOS и Linux: source .venv/bin/activate)
          4. Поставь зависимости: python -m pip install -r requirements.txt
          5. Запусти программу: python main.py
          ```

          README ещё нет — создай `README.md` рядом с `main.py`, как в уроке 5.6. Перечитай
          раздел глазами новичка: хватит ли этих шагов тому, кто видит проект впервые? В уроке
          8.6 ты сам пройдёшь по ним в чистой папке.
      - id: wait-commit
        text: >-
          **Пока не коммить.** Команда `git add .` сейчас утащила бы в репозиторий лишнее: кеш
          `__pycache__` из урока 8.2, личный `tasks.json`, а на Python 3.12 и раньше — ещё и всю
          папку `.venv` с сотнями файлов. В уроке 8.4 мы сначала настроим `.gitignore`, а потом
          аккуратно закоммитим код, requirements.txt и README.
        help: >-
          Python 3.13 и новее кладёт внутрь `.venv` свой маленький `.gitignore`, и Git эту папку не
          замечает; Python 3.12 и раньше так не делает. Уже закоммитил лишнее? Не страшно: в уроке 8.4
          разберём, как попросить Git перестать следить за такими файлами. Сами файлы на диске при
          этом останутся.
    coach: >-
      requirements.txt и раздел «Установка» — это письмо будущему себе: через полгода проект
      поднимется по ним за пару минут.

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - 'Одно окружение `.venv` на проект: создать — `python -m venv .venv`, включить — `.venv\Scripts\activate`; признак — `(.venv)` в начале строки.'
      - Пакеты ставь через `python -m pip install …` — так они попадут в тот Python, которым ты запускаешь программу.
      - 'requirements.txt — опись окружения: `python -m pip freeze > requirements.txt` записывает её, `python -m pip install -r requirements.txt` ставит всё по ней.'
      - Папку `.venv` не копируют и не кладут в Git — её пересоздают по requirements.txt и шагам из README.
    question: >-
      Почему папку .venv не отправляют другу и не кладут в Git, а отправляют requirements.txt?
    answer: >-
      Папка .venv привязана к твоему компьютеру и твоей версии Python: внутри лежат пути и
      программы именно для твоей системы, и весит она много. У друга такая папка может просто не
      заработать. requirements.txt — короткая опись, по которой окружение пересоздаётся на любом
      компьютере одной командой: `python -m pip install -r requirements.txt`.
