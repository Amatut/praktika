          where: Строка со `split`
          why: >-
            Разделитель — один знак `=`, а в `tabulate==0.9.0` их два подряд. Поэтому строка
            распадается на три части: `['tabulate', '', '0.9.0']`, и в две переменные они не
            помещаются.
          try: Режь по двум знакам сразу — `split("==")`.
          verify: 'В «Примере 1» первой строкой должно стать «tabulate: 0.9.0».'
        - id: empty-index
          when:
            errorType: IndexError
            errorIncludes: string index out of range
          where: Проверка комментария по первому символу — `line[0]`
          why: >-
            После `strip()` пустая строка файла становится `""`, а у пустой строки нет символа с
            индексом 0 — Python останавливает программу ошибкой IndexError.
          try: >-
            Проверяй комментарий через `line.startswith("#")` — с пустой строкой он просто вернёт
            `False`. Или сначала проверь пустоту, а потом первый символ:
            `if line == "" or line[0] == "#":` — если строка пустая, до `line[0]` дело не дойдёт.
          verify: 'В «Примере 1» должны появиться три строки, первая — «tabulate: 0.9.0».'
        - id: comment-printed
          when:
            outputIncludes: "#"
          why: >-
            В выводе видна строка-комментарий: программа приняла её за пакет без версии. pip такие
            строки пропускает — и программа должна. Комментарий может стоять и с отступом:
            `  # для таблиц`.
          try: >-
            Проверяй уже очищенную строку: сначала `line = line.strip()`, потом вместе с проверкой
            пустой строки — `line.startswith("#")` (или `line[:1] == "#"`).
          verify: В выводе не должно остаться строк с «#».
        - id: no-strip-line
          when:
            outputIncludes: "requests\n: версия не закреплена"
          where: Начало цикла `for line in file`
          why: >-
            Имя пакета и «: версия не закреплена» оказались на разных строках. Строка из файла
            приходит с `\n` на конце (урок 7.1), и f-строка вставила этот перевод строки прямо
            после имени.
          try: Первым делом в цикле очисти строку — `line = line.strip()`, и дальше работай с ней.
          verify: 'В «Примере 1» последней строкой должно стать «requests: версия не закреплена».'
        - id: blank-as-package
          when:
            outputIncludes: "\n: версия не закреплена"
          why: >-
            В выводе строка `: версия не закреплена` без имени — её дала пустая строка файла.
            После `strip()` она становится `""`, в ней нет `==`, и программа считает её пакетом.
          try: 'Пропускай пустую строку так же, как комментарий: `if line == "":` → `continue`.'
          verify: 'В выводе не должно остаться строк «: версия не закреплена» без имени пакета.'
        - id: comma-print
          when:
            failedTest: t1
            outputIncludes: " :"
          where: Строка с `print` для пакета
          why: >-
            Перед двоеточием лишний пробел: «tabulate : 0.9.0». В «Примере 1» пробелов вокруг `==`
            нет — пробел добавляет сама программа. Так бывает, когда части перечислены в `print`
            через запятую: `print(name, ":", version)` печатает их через пробел.
          try: >-
            Собери строку целиком: f-строкой `print(f"{name}: {version}")` или склейкой
            `print(name + ": " + version)`. То же — для строки «версия не закреплена».
          verify: 'В «Примере 1» первой строкой должно стать «tabulate: 0.9.0».'
        - id: no-strip
          when:
            outputIncludes: "tabulate :"
          where: Строка с `print` для пакета с версией
          why: >-
            Пробелы, которые стояли вокруг `==`, попали в вывод. `split("==")` режет строку ровно
            по знакам, и пробелы остаются в частях: из `tabulate == 0.9.0` получаются
            `"tabulate "` и `" 0.9.0"`.
          try: Очисти каждую часть отдельно — `name.strip()` и `version.strip()`.
          verify: 'В граничном случае с пробелами должно получиться «tabulate: 0.9.0».'
        - id: no-encoding
          when:
            failedTest: t-enc
            codeRegex: '(?:open|read_text)\((?![^)\n]*encoding)'
          where: Строка с `open(...)`
          why: >-
            В `open()` не указана кодировка. Здесь, в тренажёре, файл всё равно прочитается, а на
            Windows со старым Python (до 3.15) русские комментарии превратятся в кракозябры или в
            ошибку UnicodeDecodeError. Поэтому кодировку проверяет отдельный тест.
          try: 'Допиши в `open()` именованный аргумент: `open("requirements.txt", encoding="utf-8")`.'
          verify: Тест «Кодировка указана» должен стать зелёным.
      afterPass: >-
        Программа читает опись так же, как pip: пропускает комментарии и пустые строки и отличает
        закреплённую версию от незакреплённой. Улучшение: в конце выведи, сколько пакетов без
        версии, — такие строки могут сломать проект после очередного обновления.
      skills: [venv-deps, files-paths, string-methods]

  - id: practice-check-env
    type: exercise
    title: Практика 2
    exercise:
      id: m8-l3-e2
      kind: modify
      title: Сверка окружения
      statement: |-
        Олег сохранил список пакетов своего окружения в файл командой
        `python -m pip freeze > installed.txt`. Прежде чем запускать скрипт программок, он хочет
        сверить этот список с описью `requirements.txt`.

        Измени программу из прошлого задания — она уже в редакторе. Для каждого пакета из
        `requirements.txt` печатай одну строку:

        - `имя: не установлен` — пакета нет в `installed.txt`;
        - `имя: нужна X, стоит Y` — версия в описи закреплена, а в окружении стоит другая;
        - `имя: в порядке` — пакет стоит нужной версии. Если версия в описи не закреплена,
          подходит любая.

        Последняя строка — итог: `Всё на месте`, если все пакеты в порядке, иначе
        `Выполни: python -m pip install -r requirements.txt`. Если в описи нет ни одного пакета,
        проверять нечего — выведи только `Всё на месте`.

        В `installed.txt` каждая строка — `имя==версия`, как их пишет `pip freeze`. Там бывают и
        пакеты, которых нет в описи, — например, зависимости других пакетов. Их не печатай.

        Для файлов из блока «Файлы задания» вывод такой:

        ```text
        tabulate: не установлен
        colorama: в порядке
        requests: в порядке
        Выполни: python -m pip install -r requirements.txt
        ```
      input: >-
        Два файла в папке программы: `requirements.txt` (опись проекта) и `installed.txt` (что
        стоит в окружении). В карточке примера видны только файлы, которые в нём свои; если
        какого-то файла там нет, он берётся из блока «Файлы задания».
      output: По строке на каждый пакет из описи — в том же порядке — и строка-итог.
      constraints:
        - Имена пакетов в обоих файлах записаны одинаково, маленькими буквами.
        - В `installed.txt` нет пустых строк и комментариев, а в `requirements.txt` они бывают — их по-прежнему пропускай.
        - Вокруг имени и `==` в описи могут стоять пробелы.
      files:
        requirements.txt: |
          # Скрипт концертных программок
          tabulate==0.9.0
          colorama==0.4.6
          requests
        installed.txt: |
          certifi==2024.8.30
          charset-normalizer==3.4.0
          colorama==0.4.6
          idna==3.10
          requests==2.31.0
          urllib3==2.2.3
      starterCode: |
        count = 0
        with open("requirements.txt", encoding="utf-8") as file:
            for line in file:
                line = line.strip()
                if line == "" or line.startswith("#"):
                    continue
                if "==" in line:
                    name, version = line.split("==")
                    print(f"{name.strip()}: {version.strip()}")
                else:
                    print(f"{line}: версия не закреплена")
                count += 1
        if count == 0:
            print("Зависимостей нет")
      tests:
        - id: t1
          kind: io
          title: "Пример 1: пакета не хватает"
          example: true
          expected: |-
            tabulate: не установлен
            colorama: в порядке
            requests: в порядке
            Выполни: python -m pip install -r requirements.txt
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t2
          kind: io
          title: "Пример 2: всё совпало"
          example: true
          files:
            requirements.txt: |
              tabulate==0.9.0
              colorama==0.4.6
            installed.txt: |
              colorama==0.4.6
              tabulate==0.9.0
          expected: |-
            tabulate: в порядке
            colorama: в порядке
            Всё на месте
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t3
          kind: io
          title: "Пример 3: стоит другая версия"
          example: true
          files:
            requirements.txt: |
              requests==2.32.3
          expected: |-
            requests: нужна 2.32.3, стоит 2.31.0
            Выполни: python -m pip install -r requirements.txt
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t4
          kind: io
          title: "Граничный случай: пустое окружение"
