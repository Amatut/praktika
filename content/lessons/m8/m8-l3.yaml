id: m8-l3
module: m8
number: "8.3"
title: "Виртуальное окружение, pip и requirements.txt"
objective: >-
  Создать для проекта виртуальное окружение, установить в него пакет через pip и записать
  зависимости в requirements.txt, чтобы проект можно было повторить на другом компьютере.
minutes: [45, 60]
prerequisites: [m8-l2, m0-l4]
skills: [venv-deps, readme-docs]
environment: external

story:
  title: Программки разъехались
  fictional: true
  text: >-
    Ира и Олег, преподаватели музыкальной школы, собирают программки концертов маленьким
    скриптом на Python: он берёт список номеров и печатает аккуратную таблицу. У Иры скрипт
    работал, а у Олега падал с ModuleNotFoundError — библиотеку для таблиц Ира когда-то поставила
    «на весь компьютер» и забыла об этом. Олег поставил библиотеку себе, а через месяц обновил её
    ради другого своего проекта — и столбцы в программках разъехались. Теперь у скрипта своё
    виртуальное окружение и файл requirements.txt со списком библиотек и версий: на новом
    компьютере всё нужное ставится одной командой.

why: >-
  Чужие библиотеки экономят недели работы, но ставить их нужно так, чтобы проекты не мешали друг
  другу. Например, команда `python -m pip install -r requirements.txt` за минуту ставит в новое
  окружение ровно те версии, с которыми проект проверен.

usedIn: >-
  Так устроен любой проект с внешними библиотеками: сайты и веб-сервисы, анализ данных, боты,
  игры. В модуле 9 так же поставишь pytest для автоматических тестов, в модуле 11 — библиотеку
  requests для работы с сетью. Файл requirements.txt лежит в папках многих проектов с открытым
  кодом: по нему сразу видно, что нужно проекту.

steps:
  - id: venv-why
    type: theory
    title: "Коробка для библиотек: окружение и pip"
    body: |-
      В стандартной библиотеке Python много готового: `random`, `json`, `datetime`. Но ещё больше
      написано другими людьми. Такие наборы модулей называют **пакетами**, или библиотеками:
      пакет устроен похоже на твой `todo` из урока 8.2, только написали его другие люди. Пакеты
      лежат в общем каталоге **PyPI** — [pypi.org](https://pypi.org), а ставит их программа
      **pip**, которая обычно приходит вместе с Python. Пакеты, без которых проект не работает,
      называют его **зависимостями**.

      Запускай pip так: `python -m pip install tabulate`. Ключ `-m` значит «запусти модуль как
      программу»: pip — тоже модуль Python, как и venv, которым создают окружения. Запись
      `python -m pip` значит «pip того самого Python, которым я запускаю программы». На одном
      компьютере бывает несколько Python, и пакеты у каждого свои.

      **Почему не ставить пакеты «на весь компьютер».** Разным проектам нужны разные версии одной
      библиотеки: обновишь её ради одного — сломается другой, как программки Олега. А через
      полгода уже не вспомнить, какие пакеты нужны именно этому проекту.

      **Виртуальное окружение** — папка внутри проекта, обычно `.venv`, со своим Python и своими
      пакетами. Одно окружение — один проект. Пока окружение **включено** (активировано),
      команды `python` и `pip` в этом окне терминала работают с ним. Признак — `(.venv)` в начале
      строки.

      Команды для «Командной строки» Windows:

      ```text
      python -m venv .venv             создать окружение
      .venv\Scripts\activate           включить: в начале строки появится (.venv)
      python -m pip install tabulate   поставить пакет в окружение
      python -m pip list               посмотреть, что стоит
      deactivate                       выключить
      ```

      На macOS и Linux окружение создают командой `python3 -m venv .venv`, а включают —
      `source .venv/bin/activate`.

      **Почему «Командная строка», а не PowerShell.** PowerShell в Windows по умолчанию запрещает
      запускать сценарии, и команда включения окружения там заканчивается ошибкой. В «Командной
      строке» (cmd) такого запрета нет.

      **Осторожно с именами.** Ставь только пакеты, про которые знаешь, зачем они нужны, и сверяй
      имя на pypi.org: пакет с похожим именем может оказаться чужим и вредным.

      Частое заблуждение: «pip написал Successfully installed — значит, программа увидит пакет».
      Не увидит, если пакет ушёл в другой Python — например, окружение не было включено.

      В тренажёре pip нет: пакеты ставят на компьютере, по чек-листам в конце урока. А задания
      про файл requirements.txt работают и здесь, в том числе с телефона.
    simpler: >-
      Окружение — отдельная коробка с библиотеками для одного проекта. Включил её — и всё, что
      ставишь через `python -m pip install`, попадает в эту коробку, а не в общий Python
      компьютера. Признак, что коробка открыта, — `(.venv)` в начале строки терминала.
    coach: >-
      Урок удобно пройти двумя заходами: теория и задания — в тренажёре, около получаса;
      чек-листы в конце — на компьютере с интернетом, ещё 20–25 минут, хоть в другой день.

  - id: missing-package
    type: predict
    title: Пакета нет
    prompt: >-
      В тренажёре никто не ставил пакет tabulate. Как думаешь, что произойдёт, если запустить
      программу?
    code: |-
      import tabulate
      print("Таблица готова")
    options:
      - Таблица готова
      - Ошибка ModuleNotFoundError
      - Python сам скачает пакет, а потом напечатает «Таблица готова»
    answer: Ошибка ModuleNotFoundError
    answerIsNotOutput: true
    explanation: >-
      Python ищет модуль в папке программы, в стандартной библиотеке и среди установленных
      пакетов — и нигде не находит tabulate. Сам он ничего не скачивает: пакеты ставит pip, и
      только туда, куда его попросили. В тренажёре есть стандартная библиотека и учебная
      симуляция requests для модуля 11, а других пакетов нет — как в свежем окружении, куда ещё
      ничего не ставили. До `print` дело не дошло: ошибка в первой строке остановила программу.
    coach: >-
      Увидишь `ModuleNotFoundError` у себя на компьютере — первым делом проверь, включено ли
      окружение и стоит ли в нём пакет.

  - id: requirements
    type: theory
    title: "requirements.txt: опись окружения"
    body: |-
      Окружение живёт только на твоём компьютере. Чтобы другой человек — или ты сам на новом
      ноутбуке — собрал такое же, нужна опись: файл **requirements.txt** в папке проекта. В нём
      по строке на пакет:

      ```text
      # Зависимости проекта «Список задач»
      tabulate==0.9.0
      ```

      - `имя==версия` — нужна ровно эта версия. Номер в примере условный: у тебя он может быть
        другим.
      - Строка, которая начинается с `#`, — комментарий, pip её пропускает. Пустые строки тоже.
      - Можно написать одно имя без версии — тогда pip поставит самую новую. Проект с такой
        строкой однажды может сломаться после обновления пакета, поэтому версии обычно
        закрепляют. Бывают и другие знаки, например `>=`, но в этом уроке они не нужны.

      Такой файл можно прочитать и своей программой — в практике этим и займёмся. Узнать,
      комментарий ли строка, поможет метод строк **`startswith`** («начинается с»):
      `"# заметка".startswith("#")` даёт `True`, а `"tabulate==0.9.0".startswith("#")` — `False`.

      Набирать опись с нуля не нужно — её составляет pip, а комментарий или строку потом можно
      дописать руками:

      ```text
      python -m pip freeze > requirements.txt     записать, что стоит в окружении
      python -m pip install -r requirements.txt   поставить всё по списку
      ```

      `freeze` печатает список пакетов окружения, а знак `>` отправляет этот вывод в файл. В
      список попадают и **зависимости зависимостей** — пакеты, которые твой пакет потянул за
      собой. Поэтому в окружении держат только то, что нужно проекту: иначе в опись попадёт
      лишнее.

      **Папку `.venv` не копируют, не отправляют другу и не кладут в Git.** Внутри неё пути и
      программы для твоего компьютера и твоей версии Python, а весит она много. Окружение не
      переносят, а пересоздают: новое окружение плюс `python -m pip install -r requirements.txt`.
      Как это сделать, пишут в README, в разделе «Установка».
    simpler: >-
      requirements.txt — список покупок для окружения: какие пакеты и каких версий нужны.
      `pip freeze` составляет список по тому, что уже стоит, а `pip install -r` покупает всё по
      списку. Саму коробку `.venv` никуда не носят — по списку её легко собрать заново.
    coach: >-
      Сделал freeze — открой requirements.txt и посмотри глазами: там должно быть только то, что
      нужно проекту.

  - id: venv-steps
    type: order
    title: Порядок команд
    prompt: >-
      Ты начинаешь работу с проектом, которому нужна библиотека tabulate. Расставь действия в том
      порядке, в каком их выполнишь.
    items:
      - id: create
        text: 'python -m venv .venv — создать окружение'
      - id: activate
        text: '.venv\Scripts\activate — включить окружение'
      - id: check
        text: 'Убедиться, что в начале строки видно (.venv)'
      - id: install
        text: 'python -m pip install tabulate — поставить пакет'
      - id: freeze
        text: 'python -m pip freeze > requirements.txt — записать опись'
      - id: run
        text: 'python main.py — запустить программу'
    before:
      - [create, activate]
      - [activate, check]
      - [check, install]
      - [install, freeze]
      - [install, run]
    explanation: >-
      Сначала окружение должно появиться и включиться — только потом в него что-то ставят: пакет,
      поставленный до включения, уйдёт в другой Python. Проверка `(.venv)` стоит перед установкой:
      это самый дешёвый способ не ошибиться. `freeze` записывает то, что уже стоит, поэтому идёт
      после установки. А запустить программу можно и до `freeze`, и после — главное, после
      установки пакета.

  - id: practice-read-req
    type: exercise
    title: Практика 1
    exercise:
      id: m8-l3-e1
      kind: write
      title: Что в requirements.txt
      statement: |-
        Олег получил от Иры скрипт для программок вместе с файлом `requirements.txt`. Прежде чем
        что-то ставить, он хочет увидеть список: какие пакеты нужны и закреплены ли их версии.

        Напиши программу, которая читает `requirements.txt` из папки программы и для каждого
        пакета печатает строку:

        - `имя: версия` — если в строке есть `==`;
        - `имя: версия не закреплена` — если версии нет.

        Пустые строки и комментарии пропускай. Комментарий — строка, которая начинается с `#`
        (пробелы перед ним не в счёт); проверить это поможет метод `startswith` из теории.
        Если пакетов в файле нет совсем, выведи `Зависимостей нет`.

        Для файла из блока «Файлы задания»

        ```text
        # Скрипт концертных программок
        tabulate==0.9.0
        colorama==0.4.6

        requests
        ```

        вывод такой:

        ```text
        tabulate: 0.9.0
        colorama: 0.4.6
        requests: версия не закреплена
        ```
      input: >-
        Файл `requirements.txt` в папке программы. У каждого теста своя версия файла — её видно в
        карточке примера.
      output: >-
        По строке на каждый пакет — `имя: версия` или `имя: версия не закреплена`; если пакетов
        нет — `Зависимостей нет`.
      constraints:
        - Вокруг имени, версии и `==` могут стоять пробелы — в выводе их быть не должно.
        - Из знаков версий в файлах встречается только `==`.
        - 'Открывай файл с `encoding="utf-8"`: в нём бывают русские комментарии.'
      files:
        requirements.txt: |
          # Скрипт концертных программок
          tabulate==0.9.0
          colorama==0.4.6

          requests
      starterCode: |
        # Прочитай requirements.txt построчно.
        # Пустые строки и комментарии (#) пропусти.
        # Для пакета выведи «имя: версия» или «имя: версия не закреплена».
        # Если пакетов нет — «Зависимостей нет».
      tests:
        - id: t1
          kind: io
          title: "Пример 1: опись из «Файлов задания»"
          example: true
          expected: |-
            tabulate: 0.9.0
            colorama: 0.4.6
            requests: версия не закреплена
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t2
          kind: io
          title: "Пример 2: другая опись"
          example: true
          files:
            requirements.txt: |-
              requests==2.32.3
              tabulate
          expected: |-
            requests: 2.32.3
            tabulate: версия не закреплена
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t3
          kind: io
          title: "Граничный случай: пробелы вокруг == и в начале строк"
          edge: true
          files:
            requirements.txt: "  tabulate == 0.9.0  \n   \n  # для таблиц\ncolorama ==0.4.6\n"
          expected: |-
            tabulate: 0.9.0
            colorama: 0.4.6
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t4
          kind: io
          title: "Граничный случай: только комментарии и пустые строки"
          edge: true
          files:
            requirements.txt: |
              # Пакеты пока не нужны

              # tabulate==0.9.0
          expected: Зависимостей нет
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t5
          kind: io
          title: "Граничный случай: пустой файл"
          edge: true
          files:
            requirements.txt: ""
          expected: Зависимостей нет
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t-enc
          kind: assert
          title: Кодировка указана
          code: |
            import ast
            tree = ast.parse(open(__file__, encoding="utf-8").read())
            # Свои функции ученика с такими именами (def read_text...) не в счёт: проверяем open внутри них.
            own = {n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
            names = {"open", "read_text", "write_text"}
            calls = [n for n in ast.walk(tree) if isinstance(n, ast.Call)
                     and ((getattr(n.func, "id", None) in names and n.func.id not in own)
                          or getattr(n.func, "attr", None) in names)]


            def has_encoding(call):
                if any(k.arg == "encoding" for k in call.keywords):
                    return True
                name = getattr(call.func, "id", None) or call.func.attr
                # Кодировка по позиции: open(file, mode, buffering, encoding),
                # Path.open(mode, buffering, encoding), read_text(encoding), write_text(data, encoding).
                position = {"open": 3 if isinstance(call.func, ast.Attribute) else 4, "read_text": 1, "write_text": 2}[name]
                return len(call.args) >= position


            assert all(has_encoding(c) for c in calls)
          message: >-
            В `open()` не указана кодировка. Добавь `encoding="utf-8"`: в requirements.txt бывают
            русские комментарии, и на Windows со старым Python (до 3.15) без кодировки они
            превратятся в кракозябры или в ошибку.
      criteria:
        - Каждая строка файла очищается от пробелов по краям и `\n`.
        - Пустые строки и комментарии (строки, которые после очистки начинаются с `#`) пропускаются.
        - Для строки с `==` печатаются имя и версия без лишних пробелов, для строки без `==` — «версия не закреплена».
        - Если пакетов нет (пустой файл или одни комментарии), выводится `Зависимостей нет`.
      hints:
        - >-
          Каждая строка файла — один из трёх случаев: её надо пропустить, в ней пакет с версией
          или пакет без версии. По какому признаку в самой строке их различить? И как после
          цикла узнать, встретился ли хоть один пакет?
        - |-
          Те же приёмы на расписании репетиций:

          ```python
          line = "  хор == 18:00  \n"
          clean = line.strip()
          print(clean)                  # хор == 18:00
          print("==" in clean)          # True
          group, start = clean.split("==")
          print(group.strip(), start.strip())   # хор 18:00
          print("#хор".startswith("#")) # True
          ```

          `split("==")` режет строку по двум знакам сразу, а `strip()` убирает пробелы по краям —
          и `\n`, с которым строка приходит из файла. Счётчик, который растёт только на нужных
          строках, после цикла скажет, были ли они вообще.
        - |-
          Каркас:

          ```text
          count = 0
          with open("requirements.txt", encoding="utf-8") as file:
              for line in file:
                  line = строка без пробелов по краям
                  если строка пустая или начинается с "#": continue
                  если "==" в строке:
                      имя, версия = строка, разрезанная по "=="
                      вывести имя и версию, каждую без пробелов по краям
                  иначе:
                      вывести «<строка>: версия не закреплена»
                  count += 1
          если count == 0: вывести «Зависимостей нет»
          ```
      solution:
        code: |
          count = 0
          with open("requirements.txt", encoding="utf-8") as file:
              for line in file:
                  line = line.strip()
                  if line == "" or line.startswith("#"):
                      continue
                  if "==" in line:
                      name, version = line.split("==")
                      print(f"{name.strip()}: {version.strip()}")
                  else:
                      print(f"{line}: версия не закреплена")
                  count += 1
          if count == 0:
              print("Зависимостей нет")
        explanation: >-
          Каждая строка сначала очищается `strip()` — уходят пробелы по краям и `\n`. Пустые
          строки и комментарии пропускает `continue`. Если в строке есть `==`, `split("==")` делит
          её ровно на две части — имя и версию, и каждую ещё раз очищаем от пробелов, которые
          стояли вокруг `==`. Иначе это пакет без версии. Счётчик `count` растёт только на
          пакетах, поэтому после цикла по нему видно, печатать ли «Зависимостей нет». Если
          проверяешь комментарий через первый символ, `line[0] == "#"`, сначала убедись, что строка
          не пустая: у пустой строки нет символа с индексом 0, и будет IndexError. `startswith` и
          срез `line[:1]` с пустой строкой работают спокойно.
      altSolutions:
        - code: |
            with open("requirements.txt", encoding="utf-8") as file:
                lines = file.read().splitlines()
            packages = 0
            for line in lines:
                line = line.strip()
                if line == "" or line[0] == "#":
                    continue
                parts = line.split("==")
                if len(parts) == 2:
                    print(parts[0].strip() + ": " + parts[1].strip())
                else:
                    print(line + ": версия не закреплена")
                packages += 1
            if packages == 0:
