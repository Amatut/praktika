          files:
            installed.txt: ""
          expected: |-
            tabulate: не установлен
            colorama: не установлен
            requests: не установлен
            Выполни: python -m pip install -r requirements.txt
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t5
          kind: io
          title: "Граничный случай: в описи нет пакетов"
          edge: true
          files:
            requirements.txt: |
