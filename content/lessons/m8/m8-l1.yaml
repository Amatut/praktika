            codeRegex: '(?<![\s\S])(?![\s\S]*Старт сегодня)'
          why: >-
            В день старта программа пишет «Старт уже прошёл»: для нуля дней отдельной ветки нет, и
            ноль попадает в `else`.
          try: Добавь между ветками `elif` для случая, когда дней ровно 0, с фразой «Старт сегодня!».
          verify: В случае «Старт сегодня» должно получиться «Старт сегодня!».
        - id: wrong-direction
          when:
            failedTest: t1
            outputEquals: Старт уже прошёл
          why: >-
            В «Примере 1» до старта ещё 17 дней, а программа решила, что он прошёл. Значит, число
            дней вышло отрицательным — даты вычитаются в обратном порядке — или перепутан знак в
            условии.
          try: Считай `(race - today).days` — это положительное число, пока старт впереди.
          verify: В «Примере 1» должно получиться «До старта 17 дн.».
      afterPass: >-
        Программа не путается ни в Новом годе, ни в старте «сегодня»: дни считает datetime, а
        фразу выбирает обычный if / elif / else. Улучшение: вместо «дн.» можно подбирать слово —
        «день», «дня» или «дней» — по остатку от деления числа на 10 и на 100.
