            return_date = taken + timedelta(days=14)
            print("Вернуть до:", retrun_date.strftime("%d.%m.%Y"))
          note: Опечатка в своей переменной — NameError не про импорт, хватает общего разбора.
          expectMistake: null
        - code: |
