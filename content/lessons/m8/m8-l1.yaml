      - >-
        Стандартная библиотека — модули, которые приходят вместе с Python. Прежде чем писать своё,
        поищи готовое; как им пользоваться, написано в документации на docs.python.org.
      - >-
        `from datetime import date, timedelta` берёт из модуля нужные имена.
        `date.fromisoformat("2026-10-20")` — дата из строки, `d.strftime("%d.%m.%Y")` — строка из
        даты (`%m` — месяц, `%M` — минуты).
      - >-
        Дата + `timedelta(days=n)` — новая дата; дата − дата — промежуток, число дней в нём —
        `.days` (а `.day` — номер дня внутри даты). Даты можно сравнивать: более ранняя — меньше.
      - >-
        `date.today()` — сегодняшняя дата устройства; в заданиях тренажёра «сегодня» приходит во
        вводе.
    question: Почему для срока возврата книги нельзя просто прибавить 14 к номеру дня?
    answer: >-
      У месяцев разная длина, а в високосный год в феврале 29 дней. 25 октября + 14 дало бы
      «39 октября»: `date()` остановится с ValueError, а при ручном счёте на бумаге появится
      что-нибудь вроде «31 ноября». `timedelta` сдвигает саму дату и сам переходит через конец
      месяца и года.
