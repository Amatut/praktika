            codeRegex: '\.day\b\s*-|-\s*\w+\.day\b'
          why: >-
            Дни посчитаны вычитанием номеров дней, а `.day` — это номер дня в месяце. Внутри одного
            месяца так выходит верно, а через границу месяца — нет: для 20 декабря и 10 января
