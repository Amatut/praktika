            taken = date.fromisoformat(input())
            due = taken + timedelta(day=14)
            print("Вернуть до:", due.strftime("%d.%m.%Y"))
          note: day= вместо days= — Python сам подсказывает 'days', хватает общего разбора.
          expectMistake: null
      mistakes:
        - id: module-attr
          when:
            errorType: AttributeError
            errorIncludes: module 'datetime'
          why: >-
            После `import datetime` имя `datetime` означает весь модуль. Метод `fromisoformat` есть
            у типа `datetime.date`, а у самого модуля его нет — отсюда AttributeError.
          try: >-
            Вернись к строке `from datetime import date, timedelta` и пиши `date.fromisoformat(...)`.
            Если хочешь оставить `import datetime`, пиши полностью: `datetime.date.fromisoformat(...)`.
          verify: 'AttributeError должна исчезнуть, а «Пример 1» — дать «Вернуть до: 03.11.2026».'
        - id: name-not-imported
          when:
            errorType: NameError
            errorIncludes: "name 'date' is not defined"
          why: >-
            Python не знает имя `date`: само по себе его в программе нет, его берут из модуля
            строкой `from datetime import …`. После одного `import datetime` в программе есть только
            имя модуля, а дата лежит внутри него — `datetime.date`.
          try: >-
            Поставь первой строкой `from datetime import date, timedelta` — тогда `date` и
            `timedelta` можно писать без приставки.
          verify: NameError должна исчезнуть.
        - id: timedelta-not-imported
          when:
            errorType: NameError
            errorIncludes: "name 'timedelta' is not defined"
          why: >-
            Python не знает имя `timedelta`: его не взяли из модуля. Его берут так же, как `date`, —
            в строке `from datetime import …` должны стоять оба имени.
          try: 'Допиши его в строку импорта: `from datetime import date, timedelta`.'
          verify: NameError должна исчезнуть.
        - id: str-plus-delta
          when:
            errorType: TypeError
            errorIncludes: 'not "datetime.timedelta"'
          why: >-
            `input()` возвращает строку, а к строке нельзя прибавить промежуток: сдвигать на
            `timedelta` Python умеет только дату.
          try: 'Сначала преврати строку в дату — `date.fromisoformat(input())`, — а потом прибавляй `timedelta`.'
          verify: 'В «Примере 1» должно получиться «Вернуть до: 03.11.2026».'
        - id: str-plus-date
          when:
            errorType: TypeError
            errorIncludes: 'not "datetime.date"'
          why: >-
            Через `+` строку можно склеить только со строкой, а к подписи прибавлена дата. Сама в
            текст она не превращается.
          try: >-
            Сначала сделай из даты строку нужного вида — `.strftime("%d.%m.%Y")`, — а потом
            склеивай её с подписью.
          verify: 'В «Примере 1» должно получиться «Вернуть до: 03.11.2026».'
        - id: plus-number
          when:
            errorType: TypeError
            errorIncludes: "'datetime.date' and 'int'"
          why: >-
            К дате прибавили обычное число. Python не знает, что это — дни, недели или годы, —
            и останавливается с TypeError. Промежуток задают явно через `timedelta`.
          try: Замени `+ 14` на `+ timedelta(days=14)`.
          verify: 'В «Примере 1» должно получиться «Вернуть до: 03.11.2026».'
        - id: manual-day
          when:
            errorType: ValueError
            codeRegex: '\+\s*14\b'
          where: Строка, где к номеру дня прибавляется 14
          why: >-
            Число 14 прибавлено к номеру дня вручную: 20 + 14 = 34, а 34-го октября не бывает,
            поэтому `date()` остановилась с ValueError. Даже когда число помещается в месяц,
            ручной счёт ломается на стыке месяцев и в феврале.
          try: >-
            Сдвигай саму дату: `taken + timedelta(days=14)`. В следующий месяц и год datetime
            перейдёт сам.
          verify: "«Пример 1» должен дать 03.11.2026, а «Через Новый год» — 08.01.2027."
        - id: manual-calendar
          when:
            failedTest: t6
            codeRegex: '\+\s*14\b'
          where: Строка, где к номеру дня прибавляется 14
          why: >-
            Похоже, длина месяцев посчитана вручную, и ноябрю досталось не 30 дней. Так и
            появляется «31 ноября» из истории. В ноябре 30 дней, поэтому 20 ноября + 14 дней — это
            4 декабря.
          try: 'Не считай дни в месяцах сам: сдвигай дату — `taken + timedelta(days=14)`.'
          verify: '«Граничный случай: конец ноября» должен дать 04.12.2026.'
        - id: extra-line
          when:
            outputIncludes: Выдана
          why: >-
            Программа печатает лишнюю строку «Выдана: …», как в примере «Формуляр библиотеки». По
            условию вывод — одна строка «Вернуть до: ДД.ММ.ГГГГ».
          try: 'Убери `print` с датой выдачи — оставь только строку «Вернуть до: …».'
          verify: 'В «Примере 1» должна остаться одна строка — «Вернуть до: 03.11.2026».'
        - id: no-leading-zero
          when:
            outputIncludes: Вернуть до
            codeRegex: '(?<![\s\S])(?![\s\S]*(?:zfill|:02|["'']0["'']\s*\+))[\s\S]*(?:str\(\s*\w+\.(?:day|month)\s*\)|\{\s*\w+\.(?:day|month)\s*\})'
          why: >-
            День или месяц напечатан без нуля спереди: например, `3.11.2026` вместо `03.11.2026`.
            `str(due.day)` и `{due.day}` дают число как есть, а по условию день и месяц — всегда
            две цифры.
          try: 'Собери строку по шаблону: `due.strftime("%d.%m.%Y")` — `%d` и `%m` всегда дают две цифры.'
          verify: 'В «Примере 1» должно получиться «Вернуть до: 03.11.2026», а в «Примере 2» — «Вернуть до: 19.03.2026».'
        - id: iso-output
          when:
            outputIncludes: "2026-11-03"
          why: >-
            `print` показывает дату в стандартном виде ГГГГ-ММ-ДД — `2026-11-03`. Дата посчитана
            верно, не хватает только нужного вида.
          try: Преврати дату в строку по шаблону — `due.strftime("%d.%m.%Y")`.
          verify: 'В «Примере 1» должно получиться «Вернуть до: 03.11.2026».'
        - id: minutes-code
          when:
            outputIncludes: ".00."
          why: >-
            Вместо месяца напечаталось `00`. В шаблоне стоит большая `%M` — это минуты, а у даты
            без времени их ноль. Месяц — маленькая `%m`.
          try: Замени в шаблоне `%M` на `%m`.
          verify: 'В «Примере 1» должно получиться «Вернуть до: 03.11.2026».'
        - id: short-year
          when:
            codeIncludes: "%y"
          why: Маленькая `%y` — год двумя цифрами, `26` вместо `2026`. Год из четырёх цифр — большая `%Y`.
          try: Замени в шаблоне `%y` на `%Y`.
          verify: В «Примере 1» год должен быть 2026.
        - id: taken-printed
          when:
            outputEquals: "Вернуть до: 20.10.2026"
          why: >-
            Напечатана дата выдачи, а не дата возврата: в `strftime` попала переменная с датой из
            ввода, к которой ещё не прибавили 14 дней.
          try: Выводи ту переменную, в которой лежит дата после сдвига.
          verify: В «Примере 1» должно получиться 03.11.2026, а не 20.10.2026.
      afterPass: >-
        Февраль и Новый год программе не страшны: календарь знает datetime. Улучшение: срок
        выдачи тоже можно читать из ввода — второй строкой, через `int(input())` — и передавать
        в `timedelta(days=…)`.
      skills: [dates-datetime, modules-imports]

  - id: practice-countdown
    type: exercise
    title: Практика 2
    exercise:
      id: m8-l1-e2
      kind: modify
      title: Обратный отсчёт до старта
      statement: |-
        Организаторы городского забега рассылают участникам напоминания. Программа читает две
        даты — сегодняшнюю и дату старта — и пока просто печатает дату старта. Измени её: вместо
        даты программа должна печатать одну строку:

        - `До старта 17 дн.` — если старт позже сегодняшнего дня (вместо 17 — сколько дней
          осталось);
        - `Старт сегодня!` — если даты совпадают;
        - `Старт уже прошёл` — если старт раньше сегодняшнего дня.

        Например, если сегодня `2026-10-01`, а старт `2026-10-18`, вывод такой:

        ```text
        До старта 17 дн.
        ```
      input: Две строки в виде ГГГГ-ММ-ДД — сегодняшняя дата и дата старта.
      output: Одна строка — один из трёх вариантов из условия.
      constraints:
        - Даты во вводе всегда записаны верно.
        - Число дней считает программа — не записывай его в код.
      starterCode: |
        from datetime import date

        today = date.fromisoformat(input())
        race = date.fromisoformat(input())
        print("Старт забега:", race.strftime("%d.%m.%Y"))
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "2026-10-01\n2026-10-18\n"
          expected: До старта 17 дн.
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: "Пример 2: через Новый год"
          example: true
          stdin: "2026-12-20\n2027-01-10\n"
          expected: До старта 21 дн.
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: старт сегодня"
          edge: true
          stdin: "2026-10-18\n2026-10-18\n"
          expected: Старт сегодня!
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: старт был вчера"
          edge: true
          stdin: "2026-10-19\n2026-10-18\n"
          expected: Старт уже прошёл
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: "Граничный случай: старт завтра"
          edge: true
          stdin: "2026-10-17\n2026-10-18\n"
          expected: До старта 1 дн.
          compare:
            ignoreSpaces: true
        - id: t6
          kind: io
          title: Старт давно прошёл
          stdin: "2027-03-01\n2026-10-18\n"
          expected: Старт уже прошёл
          compare:
            ignoreSpaces: true
      criteria:
        - Число дней — это `.days` разности «дата старта минус сегодня».
        - Программа выбирает одну из трёх фраз и печатает ровно одну строку.
        - Граница «старт сегодня» (0 дней) обрабатывается отдельно от «до старта» и «прошёл».
      hints:
        - >-
          Сначала посчитай, сколько дней осталось до старта, и сохрани это число в переменную, а
          уже потом выбирай одну из трёх фраз, как в уроках про if / elif / else. Подумай, какая
          дата позже и из какой даты какую вычитать.
        - >-
          На другом примере: `(date(2026, 5, 9) - date(2026, 5, 1)).days` даёт `8`, а в обратном
          порядке — `-8`. Скобки нужны, чтобы `.days` относилось к разности, а не ко второй дате.
        - |-
          Каркас вместо последней строки:
          ```text
          left = (… - …).days
          if left > 0:
              print(… До старта … дн. …)
          elif left == 0:
              print(…)
          else:
              print(…)
          ```
      solution:
        code: |
          from datetime import date

          today = date.fromisoformat(input())
          race = date.fromisoformat(input())
          left = (race - today).days
          if left > 0:
              print(f"До старта {left} дн.")
          elif left == 0:
              print("Старт сегодня!")
          else:
              print("Старт уже прошёл")
        explanation: >-
          `race - today` — промежуток от сегодня до старта, `.days` превращает его в целое число:
          положительное, если старт впереди, ноль в день старта и отрицательное, если старт позади.
          Дальше обычный выбор из трёх веток. Можно сравнивать и сами даты: `race > today`,
          `race == today`.
      altSolutions:
