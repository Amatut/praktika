          verify: "`pickup_deadline(\"2026-10-01\", 7)` должен вернуть '08.10.2026'."
        - id: print-not-return
          when:
            failedTest: t1
            codeRegex: '(?<![\s\S])(?![\s\S]*\breturn\b)[\s\S]*^[ \t]+print\('
          where: Тело функции pickup_deadline
          why: >-
