id: m8-l1
module: m8
number: "8.1"
title: "Стандартная библиотека: даты и datetime"
objective: >-
  Превращать строку с датой в значение date, сдвигать дату на нужное число дней, считать разницу
  в днях и выводить дату в виде ДД.ММ.ГГГГ с помощью модуля datetime из стандартной библиотеки.
minutes: [25, 30]
prerequisites: [m7-l7]
skills: [dates-datetime, modules-imports]
environment: python

story:
  title: 31 ноября
  fictional: true
  text: >-
    В школьной библиотеке Вера Павловна выдаёт книги на две недели и считает дату возврата по
    настенному календарю. На стыке месяцев счёт сбивается: однажды в формуляре появилось
    «31 ноября», которого не бывает. Девятиклассник Дима, который помогает в библиотеке, написал
    программу из пяти строк: вводишь дату выдачи — получаешь дату возврата. Сколько дней в каждом
    месяце и какой год високосный, знает модуль datetime из стандартной библиотеки, поэтому
    считать самому ничего не пришлось.

why: >-
  Даты есть почти в каждой полезной программе: сроки задач, напоминания, дни до события. Считать
  их вручную опасно — месяцы разной длины, бывают високосные годы. Например,
  `date(2026, 10, 25) + timedelta(days=14)` сразу даёт 8 ноября.

usedIn: >-
  Трекеры задач и привычек, календари и сервисы бронирования, напоминания об оплате, отчёты за
  неделю или месяц. В анализе данных записи группируют по дням и неделям — тоже через даты.

steps:
  - id: stdlib-dates
    type: theory
    title: "Готовые инструменты: модуль datetime"
    body: |-
      Прежде чем писать своё, стоит поискать готовое. Вместе с Python приходит **стандартная
      библиотека** — сотни модулей на разные случаи. Ты уже подключал `random` (урок 3.5),
      `pathlib`, `csv` и `json` (модуль 7). Для дат есть модуль `datetime`.

      Как пользоваться модулем, написано в **документации**: сайт docs.python.org, раздел Library
      reference, например [модуль datetime](https://docs.python.org/3/library/datetime.html).
      Документация на английском, но примеры кода в ней понятны и без перевода. Без интернета
      поможет команда `python -m pydoc datetime` в терминале на компьютере (если работает только
      `py` — `py -m pydoc datetime`; на macOS и Linux — `python3`). Текст длинный: листай
      пробелом, выход — клавиша q.

      ```python
      from datetime import date, timedelta
      ```

      Эта строка берёт из модуля два имени — как `from pathlib import Path` в уроке 7.2. Дальше
      пишем просто `date`, без приставки. Можно и `import datetime`, но тогда нужна приставка:
      `datetime.date(...)`. Легко запутаться: в модуле `datetime` есть ещё и тип `datetime` —
      дата вместе со временем.

      **Дата — отдельное значение**, не строка и не число:

      ```python
      d = date(2026, 10, 20)                # год, месяц, день
      d = date.fromisoformat("2026-10-20")  # из строки ГГГГ-ММ-ДД
      print(d)        # 2026-10-20
      print(d.month)  # 10
      ```

      Запись ГГГГ-ММ-ДД — международный стандарт ISO, отсюда имя `fromisoformat`: «из формата
      ISO». `.year`, `.month`, `.day` — части даты. Их пишут через точку и **без скобок**: это не
      действие, а значение внутри даты.

      Привычный вид дате даёт метод `strftime` (от string format time — «время в строку по
      формату»). Он собирает строку по шаблону: `d.strftime("%d.%m.%Y")` даёт `20.10.2026`. Коды
      шаблона:

      ```text
      %d   день, две цифры      20
      %m   месяц, две цифры     10
      %Y   год, четыре цифры    2026
      %y   год, две цифры       26
      %M   минуты (не месяц!)   00
      ```

      **Промежуток времени** — `timedelta`: `timedelta(days=14)` — две недели. `days=` —
      именованный аргумент, как в уроке 5.2.

      - Дата + промежуток = новая дата. Python сам переходит через конец месяца и года и помнит
        про 29 февраля.
      - Дата − дата = промежуток. Число дней в нём — `.days`. Не путай: `.day` — номер дня в
        дате (`20`), `.days` — сколько дней в промежутке.
      - Даты можно сравнивать: более ранняя — меньше. `date(2026, 1, 1) < date(2026, 2, 1)`
        даёт `True`.

      `date.today()` — сегодняшняя дата по часам устройства. В заданиях тренажёра «сегодня»
      приходит во вводе: так проверка даёт один и тот же результат в любой день. Дату и время
      сейчас даёт `datetime.now()`, но в этом уроке хватит `date`.
    simpler: >-
      Представь настенный календарь Веры Павловны. Дата — одна клеточка в нём, а
      `date.fromisoformat("2026-10-20")` находит клеточку по записи. `timedelta(days=14)` —
      «отсчитай 14 клеточек вперёд»; сколько клеточек в каждом месяце, календарь знает сам.
      Разность двух дат — сколько клеточек между ними, само число даёт `.days`. А `strftime`
      переписывает дату в формуляр в привычном виде: 03.11.2026.
    coach: >-
      Не считай даты вручную — ошибаются даже опытные. Календарь пусть помнит datetime.

  - id: library-card
    type: example
    title: Формуляр библиотеки
    body: >-
      Черновик программы Димы: дата выдачи пока записана прямо в коде. Нажми «Запустить» и
      посмотри, как срок возврата перешёл в ноябрь.
    code: |-
      from datetime import date, timedelta

      taken = date.fromisoformat("2026-10-20")
      due = taken + timedelta(days=14)
      print("Выдана:", taken.strftime("%d.%m.%Y"))
      print("Вернуть до:", due.strftime("%d.%m.%Y"))
      left = due - date.fromisoformat("2026-10-25")
      print("Осталось дней:", left.days)
    notes:
      - line: 1
        text: >-
          Из модуля `datetime` берём два имени: `date` — дата, `timedelta` — промежуток времени.
      - line: 3
        text: >-
          Строка `"2026-10-20"` превращается в дату. Формат — ГГГГ-ММ-ДД, стандарт ISO, отсюда
          имя метода. Привычную запись `20.10.2026` `fromisoformat` не поймёт — будет ValueError.
      - line: 4
        text: >-
          К дате прибавляем промежуток в 14 дней. Получается новая дата — 3 ноября: сколько дней
          в октябре, Python знает сам.
      - line: 5
        text: >-
          `strftime` собирает из даты строку по шаблону: `%d` — день, `%m` — месяц, `%Y` — год.
      - line: 7
        text: >-
          Из даты вычитаем дату — получается промежуток. Здесь считаем, сколько дней останется
          читателю, если сегодня 25 октября.
      - line: 8
        text: "`.days` — число дней в промежутке, обычное целое число: 9."
    tryIt: >-
      Поставь в строке 3 дату `"2026-02-20"` и запусти: срок перейдёт в март, ведь в феврале
      2026 года 28 дней. «Осталось дней» станет отрицательным — к 25 октября этот срок давно
      прошёл. Потом допиши в конец `print(date.today())` — это сегодняшняя дата на твоём
      устройстве.
    coach: >-
      Обрати внимание: нигде в коде не написано, сколько дней в октябре. Это знание лежит в модуле.

  - id: date-minus-date
    type: predict
    title: Разность дат
    prompt: >-
      От 20 октября до 3 ноября — ровно две недели. Как думаешь, что напечатает программа?
    code: |-
      from datetime import date

      start = date(2026, 10, 20)
      finish = date(2026, 11, 3)
      print(finish - start)
    options:
      - "14"
      - "14 days, 0:00:00"
      - Ошибка TypeError
    answer: "14 days, 0:00:00"
    explanation: >-
      Разность дат — не число, а промежуток `timedelta`. `print` показывает его целиком: дни, а
      за ними часы, минуты и секунды — у дат их нет, поэтому там нули. Чтобы получить просто 14,
      возьми `.days`: `(finish - start).days`. Ошибки нет: вычитать даты можно, нельзя
      прибавлять к дате обычное число.
    coach: >-
      Запомни вид `14 days, 0:00:00`: если увидишь его в выводе, значит, забыл `.days`.

  - id: practice-due
    type: exercise
    title: Практика 1
    exercise:
      id: m8-l1-e1
      kind: repeat
      title: Срок возврата книги
      statement: |-
        Сделай для Веры Павловны программу, которая работает с любой датой: читает дату выдачи
        книги и печатает, до какого числа книгу нужно вернуть. Книгу выдают на 14 дней.

        Дата выдачи приходит строкой в виде ГГГГ-ММ-ДД. Например, для `2026-10-20` вывод такой:

        ```text
        Вернуть до: 03.11.2026
        ```
      input: Одна строка — дата выдачи в виде ГГГГ-ММ-ДД, например `2026-10-20`.
      output: "Одна строка: `Вернуть до: ДД.ММ.ГГГГ` — день и месяц двумя цифрами, год четырьмя."
      constraints:
        - Срок — ровно 14 дней после даты выдачи.
        - Дата во вводе всегда записана верно, проверять её не нужно.
      starterCode: |
        from datetime import date, timedelta

        # 1. Прочитай дату выдачи и преврати строку в дату
        # 2. Прибавь к ней 14 дней
        # 3. Выведи «Вернуть до: ДД.ММ.ГГГГ»
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "2026-10-20\n"
          expected: "Вернуть до: 03.11.2026"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "2026-03-05\n"
          expected: "Вернуть до: 19.03.2026"
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: через Новый год"
          edge: true
          stdin: "2026-12-25\n"
          expected: "Вернуть до: 08.01.2027"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: февраль високосного года"
          edge: true
          stdin: "2028-02-20\n"
          expected: "Вернуть до: 05.03.2028"
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: "Граничный случай: февраль обычного года"
          edge: true
          stdin: "2026-02-20\n"
          expected: "Вернуть до: 06.03.2026"
          compare:
            ignoreSpaces: true
        - id: t6
          kind: io
          title: "Граничный случай: конец ноября"
          edge: true
          stdin: "2026-11-20\n"
          expected: "Вернуть до: 04.12.2026"
          compare:
            ignoreSpaces: true
      criteria:
        - Дата выдачи берётся из ввода и превращается в значение `date`.
        - Срок считается через `timedelta`, поэтому переходы через конец месяца, года и февраль верные.
        - "Дата выводится в виде ДД.ММ.ГГГГ после подписи «Вернуть до:»."
      hints:
        - >-
          Задача в три действия: превратить строку из ввода в дату, сдвинуть дату на 14 дней и
          вывести её в нужном виде. Найди в примере «Формуляр библиотеки» строку для каждого
          действия. Что в первой из них поменять, чтобы дата бралась из ввода?
        - >-
          На другом примере: `date.fromisoformat("2026-01-30") + timedelta(days=3)` даёт 2 февраля
          2026 года, а `.strftime("%d.%m.%Y")` превращает эту дату в строку `02.02.2026`.
        - |-
          Каркас:
          ```text
          taken = date.fromisoformat(…)          # строка из ввода → дата
          due = taken + timedelta(…)             # плюс 14 дней
          print("Вернуть до:", due.strftime(…))  # дата → строка ДД.ММ.ГГГГ
          ```
      solution:
        code: |
          from datetime import date, timedelta

          taken = date.fromisoformat(input())
          due = taken + timedelta(days=14)
          print("Вернуть до:", due.strftime("%d.%m.%Y"))
        explanation: >-
          `date.fromisoformat(input())` превращает строку из ввода в дату. `timedelta(days=14)`
          сдвигает её на две недели — через конец месяца, года и февраль Python переходит сам.
          `strftime("%d.%m.%Y")` собирает строку с днём и месяцем из двух цифр и годом из
          четырёх. Подойдёт и `timedelta(weeks=2)` — это тот же промежуток.
      altSolutions:
        - code: |
            import datetime

            taken = datetime.date.fromisoformat(input())
            due = taken + datetime.timedelta(days=14)
            print("Вернуть до:", due.strftime("%d.%m.%Y"))
          note: import datetime и полные имена datetime.date, datetime.timedelta.
        - code: |
            from datetime import date, timedelta

            due = date.fromisoformat(input()) + timedelta(weeks=2)
            print(f"Вернуть до: {due.strftime('%d.%m.%Y')}")
          note: Две недели через weeks=2, вывод f-строкой.
        - code: |
            from datetime import date, timedelta

            due = date.fromisoformat(input()) + timedelta(days=14)
            print(f"Вернуть до: {due:%d.%m.%Y}")
          note: Шаблон даты прямо в f-строке (в курсе не вводится, но это верно).
        - code: |
            from datetime import datetime, timedelta

            taken = datetime.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до:", due.strftime("%d.%m.%Y"))
          note: Тип datetime (дата со временем 00:00) — strftime тот же.
        - code: |
            from datetime import date, timedelta

            due = date.fromisoformat(input()) + timedelta(days=14)
            year, month, day = str(due).split("-")
            print("Вернуть до:", day + "." + month + "." + year)
          note: Строка ГГГГ-ММ-ДД разобрана через split и собрана в обратном порядке.
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до: ", due.strftime("%d.%m.%Y"))
          note: Лишний пробел после двоеточия — проверка его прощает.
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input("Дата выдачи (ГГГГ-ММ-ДД): "))
            due = taken + timedelta(days=14)
            day = str(due.day)
            month = str(due.month)
            if due.day < 10:
                day = "0" + day
            if due.month < 10:
                month = "0" + month
            print("Вернуть до: " + day + "." + month + "." + str(due.year))
          note: Подсказка в input() и ручная сборка строки из .day, .month, .year с нулями.
        - code: |
            from datetime import date, timedelta

            LOAN_DAYS = 14
            year, month, day = input().split("-")
            taken = date(int(year), int(month), int(day))
            due = taken + timedelta(days=LOAN_DAYS)
            print("Вернуть до:", due.strftime("%d") + "." + due.strftime("%m") + "." + due.strftime("%Y"))
          note: Дата собрана через split и date(год, месяц, день), срок в переменной, три strftime.
        - code: |
            from datetime import date, timedelta

            d = date.fromisoformat(input())
            for i in range(14):
                d = d + timedelta(days=1)
            print("Вернуть до:", d.strftime("%d.%m.%Y"))
            print()
          note: 14 шагов по одному дню в цикле, пустая строка в конце вывода.
      wrongSolutions:
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до:", due)
          note: Дата напечатана как есть, в виде ГГГГ-ММ-ДД.
          expectMistake: iso-output
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до:", due.strftime("%d.%M.%Y"))
          note: "%M — минуты, а не месяц."
          expectMistake: minutes-code
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до:", due.strftime("%d.%m.%y"))
          note: "%y — год двумя цифрами."
          expectMistake: short-year
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = date(taken.year, taken.month, taken.day + 14)
            print("Вернуть до:", due.strftime("%d.%m.%Y"))
          note: 14 прибавлено к номеру дня вручную — 34 октября.
          expectMistake: manual-day
        - code: |
            from datetime import date

            parts = input().split("-")
            due = date(int(parts[0]), int(parts[1]), int(parts[2]) + 14)
            print("Вернуть до:", due.strftime("%d.%m.%Y"))
          note: Ручной счёт через split — та же ошибка.
          expectMistake: manual-day
        - code: |
            import datetime

            taken = datetime.fromisoformat(input())
            due = taken + datetime.timedelta(days=14)
            print("Вернуть до:", due.strftime("%d.%m.%Y"))
          note: У самого модуля datetime нет fromisoformat — нужен datetime.date.
          expectMistake: module-attr
        - code: |
            import datetime

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до:", due.strftime("%d.%m.%Y"))
          note: После import datetime имён date и timedelta в программе нет.
          expectMistake: name-not-imported
        - code: |
            from datetime import date, timedelta

            taken = input()
            due = taken + timedelta(days=14)
            print("Вернуть до:", due.strftime("%d.%m.%Y"))
          note: Строка из ввода не превращена в дату.
          expectMistake: str-plus-delta
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + 14
            print("Вернуть до:", due.strftime("%d.%m.%Y"))
          note: К дате прибавлено обычное число.
          expectMistake: plus-number
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до:", taken.strftime("%d.%m.%Y"))
          note: Напечатана дата выдачи вместо даты возврата.
          expectMistake: taken-printed
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до", due.strftime("%d.%m.%Y"))
          note: Нет двоеточия в подписи — хватает общего разбора с разницей строк.
          expectMistake: null
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Выдана:", taken.strftime("%d.%m.%Y"))
            print("Вернуть до:", due.strftime("%d.%m.%Y"))
          note: Скопированы обе строки вывода из примера — лишняя строка «Выдана».
          expectMistake: extra-line
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до: " + due)
          note: Подпись склеена с датой через + — TypeError про datetime.date.
          expectMistake: str-plus-date
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до:", str(due.day) + "." + str(due.month) + "." + str(due.year))
          note: День и месяц без ведущего нуля — 3.11.2026.
          expectMistake: no-leading-zero
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до:", due.strftime("%d") + "." + str(due.month) + "." + str(due.year))
          note: Ноль потерян только у месяца — «Пример 1» проходит, «Пример 2» даёт 19.3.2026.
          expectMistake: no-leading-zero
        - code: |
            from datetime import date, timedelta

            taken = date.fromisoformat(input())
            due = taken + timedelta(days=14)
            print("Вернуть до:", str(due.day) + "." + due.month + "." + str(due.year))
          note: Забыт str() у месяца — TypeError про int, хватает общего разбора.
          expectMistake: null
        - code: |
            from datetime import date

            taken = date.fromisoformat(input())
            day = taken.day + 14
            month = taken.month
            year = taken.year
            if month == 2:
                if year % 4 == 0:
                    days_in_month = 29
                else:
                    days_in_month = 28
            else:
                days_in_month = 31
            if day > days_in_month:
                day = day - days_in_month
                month = month + 1
            if month > 12:
                month = 1
                year = year + 1
            print("Вернуть до:", date(year, month, day).strftime("%d.%m.%Y"))
          note: Ручной календарь — февраль учтён, остальным месяцам по 31 дню («31 ноября»).
          expectMistake: manual-calendar
        - code: |
