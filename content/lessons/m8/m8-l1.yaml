  - id: practice-pickup
    type: exercise
    title: Практика 3
    exercise:
      id: m8-l1-e3
      kind: write
      title: Последний день в пункте выдачи
      statement: |-
        Пункт выдачи хранит посылку несколько дней после прибытия. Последний день хранения — это
        дата прибытия плюс срок хранения. Но по воскресеньям пункт закрыт: если последний день
        выпал на воскресенье, он переносится на понедельник.

        Напиши функцию `pickup_deadline(arrival, days)`:

        - `arrival` — дата прибытия, строка ГГГГ-ММ-ДД;
        - `days` — срок хранения, целое число дней;
        - функция **возвращает** последний день хранения строкой ДД.ММ.ГГГГ.

        Как узнать день недели, в теории не рассказано: это тренировка работы с документацией.
        Вот выдержка из документации модуля datetime (в переводе):

        > `date.weekday()` — возвращает день недели целым числом, где понедельник — 0, а
        > воскресенье — 6. Например, `date(2002, 12, 4).weekday()` равно 2 — это среда.

        > `date.isoweekday()` — возвращает день недели целым числом, где понедельник — 1, а
        > воскресенье — 7. Например, `date(2002, 12, 4).isoweekday()` равно 3 — это среда.

        Запись `date.weekday()` в документации значит «метод любой даты»: вызывают его у своей
        даты, как `strftime`.

        Примеры:

        ```text
        pickup_deadline("2026-10-01", 7)  →  '08.10.2026'
        pickup_deadline("2026-10-20", 5)  →  '26.10.2026'   (25.10 — воскресенье)
        ```

        Строка `print` внизу заготовки — для тебя: нажми «Запустить» и посмотри, что возвращает
        функция. Проверка вызывает функцию сама.
      input: Параметры функции — строка `arrival` в виде ГГГГ-ММ-ДД и целое число `days` (от 1 и больше).
      output: Функция возвращает строку ДД.ММ.ГГГГ — последний день хранения с учётом переноса с воскресенья.
      constraints:
        - Функция возвращает результат через `return`, а не печатает его.
        - Переносится только воскресенье; суббота — обычный рабочий день.
      starterCode: |
        from datetime import date, timedelta


        def pickup_deadline(arrival, days):
            pass  # верни последний день хранения строкой ДД.ММ.ГГГГ


        print(pickup_deadline("2026-10-20", 5))  # ожидаю 26.10.2026
      tests:
        - id: t1
          kind: call
          title: Пример 1
          example: true
          call: pickup_deadline("2026-10-01", 7)
          expected: "'08.10.2026'"
        - id: t2
          kind: call
          title: "Пример 2: срок выпал на воскресенье"
          example: true
          call: pickup_deadline("2026-10-20", 5)
          expected: "'26.10.2026'"
        - id: t3
          kind: call
          title: "Граничный случай: суббота не переносится"
          edge: true
          call: pickup_deadline("2026-10-24", 7)
          expected: "'31.10.2026'"
        - id: t4
          kind: call
          title: "Граничный случай: воскресенье в конце месяца"
          edge: true
          call: pickup_deadline("2026-05-24", 7)
          expected: "'01.06.2026'"
        - id: t5
          kind: call
          title: "Граничный случай: через Новый год"
          edge: true
          call: pickup_deadline("2026-12-27", 5)
          expected: "'01.01.2027'"
        - id: t6
          kind: call
          title: "Граничный случай: срок один день"
          edge: true
          call: pickup_deadline("2026-10-03", 1)
          expected: "'05.10.2026'"
      criteria:
        - Функция превращает строку в дату и прибавляет срок через `timedelta`.
        - День недели проверяется у последнего дня хранения, а не у даты прибытия.
        - С воскресенья срок переносится ровно на один день вперёд; другие дни не меняются.
        - Функция возвращает строку ДД.ММ.ГГГГ через `return`.
      hints:
        - >-
          Раздели работу на два шага. Сначала посчитай последний день так же, как срок возврата
          книги в первой практике. Потом отдельно проверь, не воскресенье ли он, — подходящий
          метод есть в выдержке из документации.
        - >-
          На другом примере: `date(2026, 10, 9).isoweekday()` даёт `5` — значит, 9 октября 2026
          года — пятница. Для того же дня `date(2026, 10, 9).weekday()` даёт `4`: там счёт идёт
          с нуля. Метод пишется со скобками, как `strftime(...)`.
        - |-
          Каркас функции:
          ```text
          def pickup_deadline(arrival, days):
              d = … дата прибытия + срок …
              if … d — воскресенье …:
                  d = d + timedelta(…)
              return d.strftime(…)
          ```
      solution:
        code: |
          from datetime import date, timedelta


          def pickup_deadline(arrival, days):
              last_day = date.fromisoformat(arrival) + timedelta(days=days)
              if last_day.weekday() == 6:
                  last_day = last_day + timedelta(days=1)
              return last_day.strftime("%d.%m.%Y")


          print(pickup_deadline("2026-10-20", 5))  # ожидаю 26.10.2026
        explanation: >-
          Сначала дата прибытия превращается в дату и сдвигается на срок хранения. Потом
          `weekday()` сообщает день недели последнего дня: 6 — воскресенье, и тогда срок
          сдвигается ещё на день. Переход через конец месяца или года снова делает `timedelta`.
          В конце дата превращается в строку ДД.ММ.ГГГГ. То же условие можно записать как
          `last_day.isoweekday() == 7`. В `timedelta(days=days)` слева от `=` — имя аргумента
          `timedelta` (именованный аргумент, урок 5.2), справа — параметр функции со сроком.
      altSolutions:
