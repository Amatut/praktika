          when:
            outputIncludes: прошел
          why: >-
            В слове «прошёл» нужна буква ё, а напечатано «прошел». Проверка сравнивает текст точно,
            и для неё это разные слова.
          try: Замени в этой строке `е` на `ё` — «Старт уже прошёл».
          verify: '«Граничный случай: старт был вчера» должен дать «Старт уже прошёл».'
        - id: negative-days
          when:
            outputIncludes: До старта -
          why: >-
            Дней получилось отрицательное число: из более ранней даты вычтена более поздняя.
            Разность «поздняя дата минус ранняя» положительна.
          try: Вычитай из даты старта сегодняшнюю — `race - today`.
          verify: В «Примере 1» должно получиться «До старта 17 дн.».
        - id: plus-one
          when:
            outputEquals: До старта 18 дн.
          why: >-
            Дней на один больше: вместо 17 получилось 18. `(race - today).days` — это уже ровно
            столько дней, сколько осталось, прибавлять 1 «за сегодня» не нужно.
          try: 'Убери `+ 1` и выводи `(race - today).days` как есть.'
          verify: В «Примере 1» должно получиться «До старта 17 дн.».
        - id: zero-boundary
          when:
            outputEquals: До старта 0 дн.
          why: >-
            В день старта напечаталось «До старта 0 дн.»: ноль перехватила первая ветка с `>=`, и
            до проверки `== 0` дело не дошло. Выполняется первая подходящая ветка.
          try: В первой ветке оставь строгое `> 0` — тогда ноль дойдёт до ветки «Старт сегодня!».
          verify: В случае «Старт сегодня» должно получиться «Старт сегодня!».
        - id: no-today-branch
