    exercise:
      id: m8-l4-e2
      kind: fix
      title: Правка с тремя изменениями
      filename: training_log.py
      statement: |-
        Тренер беговой секции Тамара (из урока 3.2) ведёт журнал тренировок: программа получает
        минуты каждой тренировки за неделю и печатает, сколько всего набегано. Один из бегунов
        поправил программу — дал переменным понятные имена и добавил среднее. Перед коммитом
        Тамара смотрит `git diff`:

        ```text
        diff --git a/training_log.py b/training_log.py
        index f553318..a5badd7 100644
        --- a/training_log.py
        +++ b/training_log.py
        @@ -1,5 +1,6 @@
        -minutes = input().split()
        +workouts = input().split()
         total = 0
        -for m in minutes:
        -    total += int(m)
        -print(f"Всего минут: {total}")
        +for minutes in workouts:
        +    total += int(minutes)
        +    print(f"Всего минут: {total}")
        +print(f"В среднем: {total // len(workouts)}")
        ```

        Переименование и среднее — нужные изменения. Но после правки программа выводит не то, что
        нужно. Найди в diff изменение, которое к этому привело, и исправь только его.

        Для ввода `30 45 20` программа должна вывести:

        ```text
        Всего минут: 95
        В среднем: 31
        ```
      input: Минуты тренировок в одной строке через пробел — целые числа, хотя бы одно.
      output: "Две строки: `Всего минут: …` и `В среднем: …`."
      constraints:
        - Сохрани новые имена переменных и строку со средним — не откатывай правку целиком.
        - "Среднее считается через `//`, как в правке: дробная часть отбрасывается."
      starterCode: |
        workouts = input().split()
        total = 0
        for minutes in workouts:
            total += int(minutes)
            print(f"Всего минут: {total}")
        print(f"В среднем: {total // len(workouts)}")
      tests:
