      mistakes:
        - id: diff-sign
          when:
            codeRegex: '^[ \t]*[-+][ \t]*(total|for|print|amounts)\b'
          why: >-
            В код попал знак из diff. Минус и плюс в первой колонке только показывают, была строка
            или стала, — в файле их нет. Python читает знак как часть кода, отсюда ошибка.
          try: Убери знак в начале строки и оставь саму строку с отступом в 4 пробела, как у тела цикла.
          verify: "«Пример 1: три покупки» должен дать `Потрачено за неделю: 2350`."
        - id: plus-after
          when:
            codeRegex: 'total\s*=\s*\+'
          where: Строка в теле цикла
          why: >-
            `=+` — не то же самое, что `+=`. Python читает `total =+ int(amount)` как
            `total = +int(amount)`: «записать число со знаком плюс». Поэтому итог снова равен
            последней покупке.
          try: "Напиши `+=` слитно: сначала `+`, потом `=`, без пробела между ними."
          verify: "«Пример 1: три покупки» должен дать `Потрачено за неделю: 2350`."
        - id: lost-int
          when:
            errorType: TypeError
            codeRegex: '^[ \t]*total\s*\+?=.*\bamount\b(?!\s*\))|\bsum\(\s*amounts\s*\)'
          why: >-
            `input().split()` даёт список строк: каждая покупка в нём — строка вроде `"1200"`, а
            строку с числом не сложить — отсюда TypeError. В строке с минусом в diff было
            `int(amount)`: покупка сначала превращается в число.
          try: Преврати покупку в число, прежде чем прибавлять, — `int(amount)` в теле цикла, как в строке с минусом.
          verify: Ошибка должна исчезнуть, а «Пример 1» — дать сумму 2350.
        - id: both-lines
          when:
            codeRegex: '^[ \t]+total[ \t]*=[ \t]*int\([ \t]*amount[ \t]*\)[ \t]*$(?:(?=[\s\S]*^[ \t]+total[ \t]*(?:\+=|=.*\+))|(?<=^[ \t]+total[ \t]*(?:\+=|=.*\+)[\s\S]*))'
          where: Тело цикла
          why: >-
            В цикле осталась и `total = int(amount)`, и строка, которая прибавляет. Первая на
            каждом проходе записывает покупку поверх накопленного, и сумма не собирается. Пара
            «минус — плюс» в diff означает замену: строка с плюсом встала на место строки с
            минусом.
          try: Оставь в цикле одну строку — ту, что была с минусом, а `total = int(amount)` удали.
          verify: "«Пример 1: три покупки» должен дать `Потрачено за неделю: 2350`."
        - id: unchanged
          when:
            codeRegex: '^[ \t]+total\s*=\s*int\(\s*amount\s*\)\s*$'
            outputIncludes: "Потрачено за неделю: 800"
          where: Строка в теле цикла
          why: >-
            В цикле по-прежнему `total = int(amount)`. Знак `=` на каждом проходе записывает в
            `total` новую покупку поверх накопленного, и после цикла там только последняя: 800
            вместо 2350. В строке с минусом в diff эта строка выглядела иначе.
          try: Сравни строку в цикле со строкой с минусом в diff и верни пропавший знак — сумма должна накапливаться.
          verify: "«Пример 1: три покупки» должен дать `Потрачено за неделю: 2350`."
        - id: reset-in-loop
          when:
            codeRegex: '^[ \t]+total\s*=\s*0\s*$'
          where: total = 0 в теле цикла
          why: >-
            `total = 0` стоит в теле цикла и обнуляет сумму на каждом проходе, поэтому после
            цикла в ней остаётся только последняя покупка.
          try: Обнуляй сумму один раз, до цикла, как в исходной программе, а в цикле оставь только прибавление.
          verify: "«Пример 1: три покупки» должен дать `Потрачено за неделю: 2350`."
        - id: lost-count
          when:
            outputEquals: "Потрачено за неделю: 2350"
          where: Конец программы
          why: >-
            Строку с числом покупок программа не печатает, а она нужна: это папина новая
            возможность, в diff она отмечена плюсом. Откатывать всю правку, как `git restore`,
            здесь нельзя — исправлять нужно только сломанную строку.
          try: "Верни последней строкой печать числа покупок: `Покупок:` и количество элементов в `amounts`."
          verify: Вывод «Примера 1» должен состоять из двух строк.
      afterPass: >-
        Ты нашёл поломку по diff, не перечитывая программу целиком, и сохранил нужную правку. Если
        теперь набрать `git diff`, останется одна строка с плюсом — папина новая: сломанной пары
        больше нет. С таким diff можно спокойно делать коммит «Добавить подсчёт покупок».
      skills: [git-workflow, debugging, accumulators]

