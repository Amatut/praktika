      rules:
        - id: keep-names
          dependsOn:
            print: [workouts]
          message: "Сохрани новые имена из правки: список тренировок теперь называется `workouts`."
      criteria:
        - «Всего минут» печатается один раз — после цикла, с полной суммой.
        - Строка со средним осталась, среднее целое — через `//`.
        - Новые имена из правки сохранены — список тренировок называется `workouts`.
      hints:
        - >-
          В diff три разных изменения: новые имена, новая строка со средним и ещё одно — его легко
          пропустить, потому что слова в строке не поменялись. Сравни строки с минусом и строки с
          плюсом по порядку: первую старую с первой новой, вторую со второй. В какой паре слова
          одинаковые, а строки всё равно разные?
        - |-
          Отступ решает, где выполняется строка:

          ```python
          for n in [1, 2]:
              print("внутри:", n)
          print("после цикла")
          ```

          Первый print — в теле цикла, он выполнится дважды: `внутри: 1`, `внутри: 2`. Второй
          стоит на уровне `for` и выполнится один раз — после цикла. Если строку сдвинуть из тела
          цикла на уровень `for` или обратно, в diff появится пара строк, которые отличаются только
          пробелами в начале, — как в прогнозе про вес посылок.
