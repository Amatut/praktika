id: m8-l4
module: m8
number: "8.4"
title: "Git в работе: статус, разница, коммит"
objective: >-
  Перед каждым коммитом смотреть git status и git diff, добавлять в коммит только нужные файлы,
  не пускать лишнее в репозиторий через .gitignore и делать небольшие коммиты с понятными
  сообщениями.
minutes: [30, 40]
prerequisites: [m8-l3, m5-l6]
skills: [git-workflow]
environment: external

story:
  title: «Пара строк» от папы
  fictional: true
  text: >-
    Семья Кузнецовых считает расходы за неделю маленьким скриптом, который дочь Аня хранит в Git.
    Папа захотел, чтобы скрипт ещё и считал покупки, и поправил «пару строк» — после этого траты
    за неделю вдруг стали равны последней покупке. Что именно он менял, папа уже не помнил. Аня
    набрала `git diff` и за минуту увидела все изменённые строки, в том числе ту, где закралась
    ошибка. Она исправила одну строку, папину новую оставила, и в историю ушёл аккуратный коммит
    «Добавить подсчёт покупок» — без ошибки.

why: >-
  Git помнит каждый коммит, но пользу приносит, когда перед коммитом смотришь, что в него
  попадёт. Например, `git diff` за секунду показывает все изменённые строки — даже те, что
  поменялись случайно.

usedIn: >-
  В командах каждое изменение, прежде чем принять, читает коллега — это называется код-ревью, и
  читают на нём именно diff. По сообщениям коммитов через год понимают, что и зачем менялось в
  коде. Файл .gitignore есть почти в каждом репозитории.

steps:
  - id: three-places
    type: theory
    title: Что попадёт в коммит
    body: |-
      В уроке 5.6 коммит делался в два шага: `git add` выбирал файл, `git commit` делал снимок.
      Между этими шагами есть важное место — **индекс** (по-английски staging area). Это корзина
      следующего коммита: `git add файл` кладёт туда текущую версию файла, а `git commit`
      сохраняет в истории **только то, что лежит в корзине**. Правки, которые ты не добавил, в
      коммит не попадут, даже если файл сохранён.

      Получается три места:

      1. **Рабочая папка** — файлы, которые ты правишь в редакторе.
      2. **Индекс** — то, что уйдёт в следующий коммит.
      3. **История** — сделанные коммиты.

      `git status` раскладывает изменения по разделам (подсказки Git в скобках здесь пропущены):

      ```text
      Changes to be committed:          ← в индексе: войдёт в коммит
              modified:   todo/tasks.py
      Changes not staged for commit:    ← изменён, но не добавлен
              modified:   main.py
      Untracked files:                  ← новый: Git за ним ещё не следит
              requirements.txt
      ```

      Если разделов нет, а внизу `nothing to commit, working tree clean`, — всё как в последнем
      коммите.

      **`git diff`** показывает, что изменилось в файлах и ещё не добавлено в индекс, а
      **`git diff --staged`** — что уже в индексе, то есть уйдёт в коммит. Новый файл, за которым
      Git ещё не следит, в `git diff` не виден — он появится в `git diff --staged` после
      `git add`. Вывод выглядит так:

      ```text
      diff --git a/hello.py b/hello.py
      index 388023f..a59592f 100644
      --- a/hello.py
      +++ b/hello.py
      @@ -1,3 +1,3 @@
       name = input()
      -print("Привет,", name)
      +print(f"Привет, {name}!")
       print("До встречи!")
      ```

      - первые четыре строки — служебные: какой файл сравнивается;
      - `@@ -1,3 +1,3 @@` — где кусок: в старой версии с 1-й строки, 3 строки, в новой — тоже;
      - `-` — строка как была, `+` — какой стала;
      - строки без знака не менялись, они показаны для ориентира.

      Знак стоит в первой колонке и в файл не входит: сама строка начинается сразу после него, со
      своим отступом. Изменённая строка выглядит как пара: старая с минусом и новая с плюсом. Если
      изменилось несколько строк подряд, Git показывает сначала все старые, потом все новые —
      сравнивай их по порядку. В терминале минусы обычно красные, плюсы — зелёные.

      Положил в индекс лишнее — **`git restore --staged файл`** вынет файл из индекса, а правки в
      самом файле останутся. Не путай с `git restore файл` из урока 5.6: та команда выбрасывает
      правки из файла.

      Привычка перед каждым коммитом: `git status` → `git diff` → `git add файл` →
      `git diff --staged` → `git commit -m "…"` → `git log --oneline`.
    simpler: >-
      Индекс — корзина для следующего коммита. `git add` кладёт туда файл, `git status`
      показывает, что лежит в корзине и что рядом с ней, `git diff` — что именно изменилось:
      минус — было, плюс — стало. В коммит попадает только содержимое корзины.
    coach: >-
      Привычка на всю жизнь: перед каждым коммитом — status и diff. Это пара секунд, зато в
      историю не уедет отладочный print или случайная правка.

  - id: read-status
    type: quiz
    title: Прочитай git status
    question: |-
      В проекте «Список задач» ты дописал в `todo/tasks.py` новую функцию и набрал
      `git add todo/tasks.py`. Потом заметил в функции опечатку, исправил её и сохранил файл. Ещё
      ты завёл файл `ideas.txt` с идеями на будущее. Теперь `git status` показывает:

      ```text
      On branch master
      Changes to be committed:
        (use "git restore --staged <file>..." to unstage)
              modified:   todo/tasks.py

      Changes not staged for commit:
        (use "git add <file>..." to update what will be committed)
        (use "git restore <file>..." to discard changes in working directory)
              modified:   todo/tasks.py

      Untracked files:
        (use "git add <file>..." to include in what will be committed)
              ideas.txt
      ```

      Что попадёт в коммит, если сейчас набрать `git commit -m "…"`?
    options:
      - "`todo/tasks.py` с исправленной опечаткой и `ideas.txt`"
      - "`todo/tasks.py` с исправленной опечаткой"
      - "`todo/tasks.py` в той версии, что была при `git add`, — с опечаткой"
      - "Ничего: файл стоит в двух разделах, и Git сначала попросит выбрать"
    correct: 2
    explanation: >-
      В коммит уходит только содержимое индекса — раздел `Changes to be committed`. `git add`
      положил туда `todo/tasks.py` в тот момент, когда опечатка ещё была. Исправление сделано позже
      и лежит в разделе `Changes not staged for commit` — поэтому файл виден в двух разделах сразу.
      Чтобы исправление попало в коммит, снова набери `git add todo/tasks.py`. Сейчас `git diff`
      покажет только исправление опечатки, а `git diff --staged` — то, что уйдёт в коммит.
      `ideas.txt` — новый файл, Git за ним ещё не следит, и в коммит он не попадёт.
    coach: >-
      Индекс хранит снимок файла на момент `git add`, а не ссылку на файл. Поправил файл после
      `git add` — добавь его ещё раз.

  - id: moved-line
    type: predict
    title: Сдвинули одну строку
    prompt: |-
      Курьер считает общий вес посылок. Коллега поправил его программу, и `git diff` показал:

      ```text
      @@ -1,4 +1,4 @@
       total = 0
       for weight in [3, 5, 2]:
           total += weight
      -print(f"Общий вес: {total} кг")
      +    print(f"Общий вес: {total} кг")
      ```

      Ниже — файл после правки. Как думаешь, что теперь выведет программа?
    code: |-
      total = 0
      for weight in [3, 5, 2]:
          total += weight
          print(f"Общий вес: {total} кг")
    options:
      - "Общий вес: 10 кг"
      - |-
        Общий вес: 10 кг
        Общий вес: 10 кг
        Общий вес: 10 кг
      - |-
        Общий вес: 3 кг
        Общий вес: 8 кг
        Общий вес: 10 кг
    answer: |-
      Общий вес: 3 кг
      Общий вес: 8 кг
      Общий вес: 10 кг
    explanation: >-
      Слова в строке с print не изменились, поменялись только четыре пробела в начале — но Git
      считает строку другой и показывает пару «минус — плюс». С отступом print попал в тело цикла
      и выполняется на каждом проходе, сразу после того как к `total` прибавился очередной вес:
      3, потом 8, потом 10. Пока строка стояла без отступа, после цикла, она печатала одну
      строку — `Общий вес: 10 кг`.
    coach: >-
      Пара строк в diff, которые на вид одинаковые, — повод присмотреться к пробелам. В Python
      отступ меняет смысл программы.

  - id: practice-budget
    type: exercise
    title: Практика 1
    exercise:
      id: m8-l4-e1
      kind: fix
      title: Где сломался итог
      filename: budget.py
      statement: |-
        Скрипт семьи Кузнецовых из истории. Программа получает суммы покупок за неделю в одной
        строке через пробел и печатает, сколько потрачено. Папа добавил подсчёт покупок, но
        коммит ещё не сделал — и теперь траты равны последней покупке. Аня набрала `git diff`:

        ```text
        diff --git a/budget.py b/budget.py
        index a709b22..ae6a42c 100644
        --- a/budget.py
        +++ b/budget.py
        @@ -1,5 +1,6 @@
         amounts = input().split()
         total = 0
         for amount in amounts:
        -    total += int(amount)
        +    total = int(amount)
         print(f"Потрачено за неделю: {total}")
        +print(f"Покупок: {len(amounts)}")
        ```

        В редакторе — файл после папиной правки. По diff найди изменение, которое сломало итог,
        и исправь его. Новая строка с числом покупок нужна — её оставь.

        Для ввода `1200 350 800` программа должна вывести:

        ```text
        Потрачено за неделю: 2350
        Покупок: 3
        ```
      input: Суммы покупок в одной строке через пробел — целые числа, хотя бы одно.
      output: "Две строки: `Потрачено за неделю: …` и `Покупок: …`."
      constraints:
        - "Исправь сломанную строку, а папину новую оставь. `git restore budget.py` здесь не подходит: он выбросил бы и её."
        - Надписи и порядок строк вывода не меняй.
      starterCode: |
        amounts = input().split()
        total = 0
        for amount in amounts:
            total = int(amount)
        print(f"Потрачено за неделю: {total}")
        print(f"Покупок: {len(amounts)}")
      tests:
        - id: t1
          kind: io
          title: "Пример 1: три покупки"
          example: true
          stdin: "1200 350 800\n"
          expected: |-
            Потрачено за неделю: 2350
            Покупок: 3
        - id: t2
          kind: io
          title: "Пример 2: две покупки"
          example: true
          stdin: "500 500\n"
          expected: |-
            Потрачено за неделю: 1000
            Покупок: 2
        - id: t3
          kind: io
          title: "Граничный случай: одна покупка"
          edge: true
          stdin: "90\n"
          expected: |-
            Потрачено за неделю: 90
            Покупок: 1
        - id: t4
          kind: io
          title: "Граничный случай: в конце нули"
          edge: true
          stdin: "15 0 0\n"
          expected: |-
            Потрачено за неделю: 15
            Покупок: 3
      criteria:
        - Итог — сумма всех покупок, а не последняя покупка.
        - Строка с числом покупок осталась.
        - Правка не откатана целиком — исправлена только поломка, для этого хватит одной строки.
      hints:
        - >-
          Строки с минусом в diff — как было до папиной правки, с плюсом — как стало. Изменений
          два: одно добавляет строку в конце, другое меняет строку, которая уже была. Какое из них
          отвечает за сумму — и чем старая версия этой строки отличается от новой?
        - |-
          Тот же приём на счётчике:

          ```python
          count = 0
          for word in ["а", "б", "в"]:
              count += 1
          print(count)  # 3
          ```

          `+=` прибавляет к тому, что уже накоплено. Замени его на `count = 1` — и на каждом
          проходе счётчик не растёт, а заново становится 1: после цикла там 1. Знак `=` просто
          записывает новое значение поверх старого.
        - |-
          Всё остаётся как у папы, кроме одной строки в теле цикла:

          ```text
          amounts = input().split()
          total = 0
          for amount in amounts:
              ← здесь: прибавить число из amount к total, как в строке с минусом (сам минус из первой колонки не переноси)
          print(... Потрачено за неделю ...)
          print(... Покупок ...)
          ```
      solution:
        code: |
          amounts = input().split()
          total = 0
          for amount in amounts:
              total += int(amount)
          print(f"Потрачено за неделю: {total}")
          print(f"Покупок: {len(amounts)}")
        explanation: >-
          В diff строка с минусом `total += int(amount)` превратилась в строку с плюсом
          `total = int(amount)` — пропал плюс. С `=` переменная на каждом проходе цикла
          перезаписывается, и после цикла в ней только последняя покупка. `+=` снова прибавляет
          каждую покупку к накопленной сумме. Вторая правка — новая строка «Покупок» — нужная,
          поэтому файл не откатывают через `git restore`, а исправляют одну строку.
      altSolutions:
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total = total + int(amount)
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Сумма накапливается через total = total + …
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total = int(amount) + total
            print("Потрачено за неделю:", total)
            print("Покупок:", len(amounts))
          note: Слагаемые в другом порядке и print через запятую — вывод тот же.
        - code: |
            amounts = input().split()
            total = 0
            count = 0
            for amount in amounts:
                total += int(amount)
                count += 1
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {count}")
          note: Покупки считаются счётчиком в том же цикле, а не через len.
      wrongSolutions:
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total = int(amount)
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Код не изменён — итог равен последней покупке.
          expectMistake: unchanged
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total =+ int(amount)
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Знаки перепутаны — =+ вместо +=.
          expectMistake: plus-after
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total += amount
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Плюс вернули, а int() потеряли — TypeError.
          expectMistake: lost-int
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total = total + amount
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Сумма через total + amount без int() — TypeError.
          expectMistake: lost-int
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total += int(amount)
            print(f"Потрачено за неделю: {total}")
          note: Правка откатана целиком, как через git restore, — пропала нужная строка с покупками.
          expectMistake: lost-count
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total = int(amount)
            print(f"Потрачено за неделю: {total}")
          note: Удалена нужная строка, а сломанная осталась — сначала разбор главной поломки.
          expectMistake: unchanged
        - code: |
            amounts = input().split()
            for amount in amounts:
                total = 0
                total += int(amount)
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Обнуление перенесено в цикл — итог снова равен последней покупке.
          expectMistake: reset-in-loop
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total += int(amount)
            print(f"Итого: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Изменена надпись — общий разбор проверки, разборы из материалов не должны сработать.
          expectMistake: null
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total = amount + total
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Плюс вернули в форме «покупка + итог», а int() потеряли — TypeError с другим текстом (can only concatenate).
          expectMistake: lost-int
        - code: |
            amounts = input().split()
            total = sum(amounts)
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Цикл заменён на sum() по списку строк — TypeError.
          expectMistake: lost-int
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total = int(amount)
            print(f"Потрачено за неделю: {sum(amounts)}")
            print(f"Покупок: {len(amounts)}")
          note: Обходной путь — sum() по списку строк прямо в печати, сломанная строка осталась; TypeError.
          expectMistake: lost-int
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total += amounts
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Опечатка — прибавлен весь список amounts; разбор про строку amount не подходит, общий разбор TypeError.
          expectMistake: null
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total = + int(amount)
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Знаки перепутаны и разделены пробелом — = + вместо +=.
          expectMistake: plus-after
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total = int(amount)
                total += int(amount)
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Строку с минусом поставили рядом со строкой с плюсом, а не вместо неё — итог 1600.
          expectMistake: both-lines
        - code: |
            amounts = input().split()
            total = 0
            for amount in amounts:
                total += int(amount)
                total = int(amount)
            print(f"Потрачено за неделю: {total}")
            print(f"Покупок: {len(amounts)}")
          note: Обе строки, но в другом порядке — итог снова равен последней покупке.
          expectMistake: both-lines
        - code: |
            amounts = input().split()
