            Строку «Всего минут» программа больше не печатает. Она нужна: её надо не удалить и не
            закомментировать, а переставить — чтобы она выполнялась один раз, после цикла.
          try: Добавь после цикла, перед средним, печать `Всего минут:` и `total`.
          verify: "Вывод «Примера 1» должен начинаться со строки `Всего минут: 95`."
        - id: print-inside
          when:
            outputIncludes: "Всего минут: 30"
          where: print с «Всего минут»
          why: >-
            «Всего минут» печатается на каждом проходе цикла — с промежуточными суммами 30, 75,
            95. В diff у строки с print поменялся только отступ: без отступа она стояла после
            цикла, с четырьмя пробелами попала в его тело.
          try: >-
            Сдвинь строку с «Всего минут» влево, на уровень `for`. Если ты добавил второй print
            после цикла, убери тот, что внутри.
          verify: "«Пример 1: три тренировки» должен дать ровно две строки."
        - id: lost-average
          when:
            outputEquals: "Всего минут: 95"
          why: >-
            Среднего нет — похоже, правка откатана целиком или строка удалена. Среднее — нужное
            новое требование, в diff оно отмечено плюсом.
          try: "Верни последней строкой печать среднего: `В среднем:` и `total // len(workouts)`."
          verify: "«Пример 1» должен вывести две строки: `Всего минут: 95` и `В среднем: 31`."
        - id: wrong-order
          when:
            outputEquals: |-
              В среднем: 31
              Всего минут: 95
          why: Обе строки на месте, но в обратном порядке. По условию сначала идёт «Всего минут», потом «В среднем».
          try: Поставь печать итога перед печатью среднего — сразу после цикла.
          verify: "«Пример 1» должен начинаться со строки `Всего минут: 95`."
      afterPass: >-
        Ты нашёл изменение, которое в diff легко пропустить: слова в строке те же, поменялся только
        отступ. Одно улучшение на будущее: делай такие правки отдельными коммитами — переименование
        отдельно, среднее отдельно. Тогда сдвиг строки не спрятался бы среди других изменений.
      skills: [git-workflow, debugging, loop-tracing]

  - id: clean-history
    type: theory
    title: "Чистая история: .gitignore и понятные коммиты"
    body: |-
      Не всё, что лежит в папке проекта, нужно хранить в истории:

      - `.venv/` — окружение из урока 8.3: сотни файлов, привязанных к твоему компьютеру. Его не
        переносят, а пересоздают по requirements.txt.
      - `__pycache__/` и файлы `*.pyc` — кеш, который Python сам создаёт при импорте модулей
        (урок 8.2).
      - `tasks.json` — твои личные задачи, другому человеку они не нужны. В модуле 11 так же
        будешь прятать от Git ключи доступа к сервисам.

      **`.gitignore`** — текстовый файл в корне проекта: на каждой строке шаблон — какие файлы Git
      не должен замечать. Косая черта в конце (`.venv/`) означает папку, звёздочка (`*.pyc`) —
      «любые символы»: подходят все файлы, имя которых оканчивается на `.pyc`. Такие файлы
      пропадают из `git status`, и даже `git add .` их не возьмёт. Сам `.gitignore` коммитят: он
      нужен всем, кто работает с проектом.

      На файлы, которые уже попали в коммит, `.gitignore` не действует — за ними Git продолжает
      следить. Команда `git rm --cached tasks.json` кладёт в индекс *удаление* файла: в следующем
      коммите и дальше его не будет, а на диске файл останется. Но в старых коммитах он
      сохранится — поэтому личные файлы и ключи вносят в `.gitignore` до первого коммита.

      **Один коммит — одна мысль.** Три коммита «Добавить .gitignore», «Добавить зависимости»,
      «Разнести код по модулям» лучше одного «всё сделал»: по истории видно, что и зачем менялось, а
      неудачную правку легко найти. Сообщение отвечает на вопрос «что изменилось?», как в уроке
      5.6, а сообщения вроде «правки», «всё сделал» или «asdf» не отвечают ни на что.

      `git add .` добавляет всю папку сразу. Это удобно, только когда `.gitignore` настроен, а
      `git status` показывает лишь нужное. И помни про `git restore файл`: правки, которых нет в
      коммите, пропадут безвозвратно. Не уверен — сначала посмотри `git diff`.
    simpler: >-
      `.gitignore` — список «не замечать»: окружение, кеш, личные файлы. Файл, который уже попал в
      коммит, он не спрячет — нужна `git rm --cached`: Git перестанет сохранять файл в новых
      коммитах, но в старых он останется. А коммиты делай маленькими: одна мысль — один коммит с
      понятной подписью.
    coach: >-
      Посмотри на свою историю глазами человека, который видит проект впервые: поймёт ли он по
      сообщениям, что происходило?

  - id: before-commit
    type: order
    title: Привычка перед коммитом
    prompt: >-
      Ты исправил ошибку в `main.py` и хочешь сохранить исправление в истории. Расставь команды в
      том порядке, в каком их стоит выполнить.
    items:
      - id: status
        text: git status — что изменено и что уже в индексе
      - id: diff
        text: git diff — что именно изменилось в файлах
      - id: add
        text: git add main.py — положить файл в индекс
      - id: staged
        text: git diff --staged — проверить, что уйдёт в коммит
      - id: commit
        text: git commit -m "Исправить подсчёт итога" — сделать снимок
      - id: log
        text: git log --oneline — убедиться, что коммит в истории
    before:
      - [status, add]
      - [diff, add]
      - [add, staged]
      - [staged, commit]
      - [commit, log]
    explanation: >-
      Сначала смотрят: `git status` и `git diff` — в любом порядке — показывают, какие файлы
      изменены и что в них поменялось. Потом `git add` кладёт нужный файл в индекс, и
      `git diff --staged` показывает ровно то, что уйдёт в коммит: по нему удобно проверить, нет
      ли лишнего, и написать сообщение. `git log --oneline` имеет смысл только после коммита.
    coach: >-
      Через неделю-другую эта цепочка станет привычкой, и ты будешь набирать её не задумываясь.

  - id: tidy-repo
    type: checklist
    title: "Наводим порядок: .gitignore"
    body: >-
      Дальше — работа на компьютере, в проекте «Список задач» после уроков 8.2 и 8.3: пакет
      `todo`, окружение `.venv`, requirements.txt и раздел «Установка» в README пока не
      закоммичены. Два блока займут 15–20 минут, третий — по желанию, ещё минут пять; интернет не
      нужен. Работу на компьютере можно сделать отдельным заходом, хоть в другой день, —
      останавливайся между блоками, а не посреди них. Для Git подойдёт любой терминал. Тренажёр не
      видит твой компьютер, поэтому отмечай пункты по результату, а не по прочтении.
    items:
      - id: status-before
        text: >-
          **Посмотри, что видит Git.** Открой терминал в папке проекта и набери `git status`.
          Скорее всего, в разделе `Changes not staged for commit` будет `modified: main.py`, а в
          `Untracked files` — `todo/`, `requirements.txt` и, возможно, `README.md` и `tasks.json`.
        help: >-
          `fatal: not a git repository` — терминал открыт не в папке проекта (сравни путь слева от
          курсора с папкой, где лежит `main.py`) или репозиторий не создан — тогда вернись к пункту
          «Страховка» урока 8.2. Папки `.venv/` в списке может не быть: Python 3.13 и новее кладёт
          внутрь неё свой маленький .gitignore. Видна — значит, у тебя Python 3.12 или раньше,
          наш .gitignore решит и это. `README.md` в разделе `modified` — README уже был в коммитах, это
          нормально. Git пишет по-русски — ищи те же разделы по смыслу. Если твой проект устроен
          иначе, действуй по смыслу: код — в одном коммите, зависимости — в другом, личные данные и
          служебные папки — в .gitignore.
      - id: dry-run
        text: >-
          **Проба: что утащила бы `git add .`?** Набери `git add --dry-run .` — с точкой в конце:
          точка означает «вся папка». Git только перечислит файлы, которые добавил бы, и ничего не
          добавит. Найди в списке файлы из `todo/__pycache__/` и `tasks.json` — им в истории не
          место.
        help: >-
          `--dry-run` — «проба»: команда показывает результат, но ничего не меняет. В
          `git status` папки `__pycache__` не видно: новую папку `todo/` Git показывает одной
          строкой и заглядывает внутрь, только когда добавляет её. Нет `tasks.json` в списке —
          значит, задачи ещё не сохранялись или файл уже в коммитах и не менялся (об этом — в
          следующем пункте). Если в списке сотни строк из `.venv/` — это та самая папка окружения,
          сейчас мы её спрячем.
      - id: gitignore
        text: |-
          **Создай файл `.gitignore`** в корне проекта — рядом с `main.py` — с четырьмя строками:

          ```text
          .venv/
          __pycache__/
          *.pyc
          tasks.json
          ```
        help: >-
          Имя начинается с точки, расширения нет. В VS Code: File → New File, имя `.gitignore`. В
          Блокноте при сохранении выбери тип файла «Все файлы», иначе получится
          `.gitignore.txt` — проверь командой `dir` (macOS и Linux: `ls -a`, файлы с точкой в
          начале там скрыты). Если `tasks.json` уже был в коммитах, `.gitignore` его не спрячет:
          выполни `git rm --cached tasks.json`. В `git status` он появится как
          `deleted: tasks.json` в разделе `Changes to be committed`: в индексе лежит удаление, и с
          ближайшего коммита Git перестанет хранить файл, а на диске он останется (проверь `dir`).
          Для папки, которая уже попала в коммит, — `git rm -r --cached .venv`.
      - id: status-after
        text: >-
          **Проверь, что изменилось:** снова `git add --dry-run .` и `git status`. В списке пробы
          больше нет `__pycache__` и `tasks.json`, а в `git status` появился новый файл
          `.gitignore`.
        help: >-
          Лишние файлы всё ещё в списке — проверь имя (`dir` не должен показывать
          `.gitignore.txt`), место (рядом с `main.py`, а не в папке `todo`) и строки: без пробелов
          в начале, косая черта `/`, а не `\`. `tasks.json` остался в `git status` как `modified`
          — он уже в коммитах: смотри «Если не получается» в прошлом пункте.
      - id: commit-ignore
        text: >-
          **Коммит 1 — только .gitignore:** `git add .gitignore`, затем
          `git commit -m "Добавить .gitignore"`. Если ты убирал `tasks.json` через
          `git rm --cached`, подпиши коммит точнее: «Добавить .gitignore и убрать tasks.json из
          Git».
        help: >-
          Предупреждение `LF will be replaced by CRLF` — о концах строк в Windows, работе не
          мешает. `pathspec '…' did not match any files` после `git add` или
          `no changes added to commit` (бывает и `nothing added to commit`) после `git commit` —
          `.gitignore` не добавлен: проверь имя в `git add`. Остальные изменения пока не трогай —
          они пойдут в следующие коммиты.

  - id: small-commits
    type: checklist
    title: Два коммита по смыслу
    body: >-
      В изменениях из уроков 8.2 и 8.3 — две разные мысли: у проекта появились зависимости и шаги
      установки, а код разнесён по модулям. Сделаем из них два коммита и каждый раз проверим, что
      уходит в историю. Начнём с зависимостей: код из урока 8.3 уже импортирует tabulate, поэтому
      requirements.txt должен попасть в историю не позже кода, которому он нужен.
    items:
      - id: commit-deps
        text: >-
          **Коммит 2 — зависимости:** `git add requirements.txt README.md`, затем
          `git diff --staged` — там строка с tabulate и раздел «Установка». Всё на месте —
          `git commit -m "Добавить зависимости и шаги установки"`.
        help: >-
          `pathspec '…' did not match any files` — файла с таким именем нет: сверь имя с выводом
          `dir` (например, файл называется `README.md.txt`). Ошибки нет, а README в
          `git diff --staged` не видно — проверь регистр букв: Windows не различает `README.md` и
          `readme.md`, а Git различает и молча ничего не добавляет. Набери имя так, как его
          показывает `dir`. Нет README в проекте — добавь только `requirements.txt` и подпиши
          коммит «Добавить requirements.txt».
      - id: diff
        text: >-
          **Посмотри правку `main.py`:** `git diff`. Строки с `-` — старый код, который переехал в
          модули, строки с `+` — импорт из пакета `todo` и `if __name__ == "__main__":`.
        help: >-
          Длинный diff открывается постранично: пробел — следующая страница, `q` — выход. Новых
          файлов из `todo/` в `git diff` нет: Git за ними ещё не следит, они появятся в
          `git diff --staged` после `git add`. После второго `@@` Git иногда пишет строку из файла
          выше этого куска, например `def main():`, — это ориентир, а не изменение. Видишь вместо
          русских букв значки вроде `<D0><9F>` — это особенность терминала, а не файла; попробуй
          `git --no-pager diff`.
      - id: stage-modules
        text: >-
          **Положи в индекс код:** `git add main.py todo`, затем `git status`. В разделе
          `Changes to be committed` — `main.py` и файлы из `todo/` с пометкой `new file`. Других
          разделов, скорее всего, нет: остальное уже в истории или в .gitignore.
        help: >-
          `todo` без косой черты — вся папка; `__pycache__` в индекс не попадёт, его прячет
          .gitignore. Случайно добавил лишний файл — вынь его из индекса:
          `git restore --staged имя_файла`, правки в файле останутся.
      - id: staged-diff
        text: >-
          **Коммит 3 — код, подпись твоя.** Проверь, что уйдёт в коммит: `git diff --staged` —
          теперь видны и новые файлы пакета. Подпиши коммит сам, по этому diff: одно действие,
          ответ на вопрос «что изменилось?», до 50 символов, как в уроке 5.6. Набери
          `git commit -m "…"` со своим сообщением.
        help: >-
          Не знаешь, как подписать, — сверься с нашим вариантом: «Разнести код по модулям в пакет
          todo». Заметил в diff отладочный print или лишнюю правку — исправь файл, сохрани и снова
          сделай `git add` этого файла: в индексе лежит версия на момент `git add`, и без
          повторного добавления в коммит уйдёт она. Таблица tabulate в `todo/tasks.py` войдёт в
          этот коммит — так и нужно: requirements.txt для неё уже в истории.
      - id: log
        text: |-
          **Посмотри историю:** `git log --oneline`. Сверху три новые строки, например:

          ```text
          7126604 (HEAD -> master) Разнести код по модулям в пакет todo
          6998e87 Добавить зависимости и шаги установки
          90f8418 Добавить .gitignore
          ```

          Номера у тебя будут свои, а верхнее сообщение — твоё. Поймёт ли по этим строкам, что
          происходило, человек, который видит проект впервые?
        help: >-
          Внизу `:` или `(END)` — режим листания: нажми `q`. Вместо `master` может быть `main` —
          это имя основной ветки, о ветках — в уроке 8.5. `git status` теперь пишет
          `nothing to commit, working tree clean`: всё, что есть в папке, либо в истории, либо
          в .gitignore.

  - id: undo
    type: checklist
    title: "Две отмены: из индекса и из файла (по желанию)"
    body: >-
      Необязательный блок на компьютере, около 5 минут: две отмены, которые пригодятся, когда в
      индекс или в файл попало лишнее. Обе команды уже объяснены в теории, здесь они — вживую, на
      безопасной правке. Нужен проект с чистым `git status`, как после прошлого блока.
    items:
      - id: debug-line
        text: >-
          **Добавь лишнее.** Допиши в конец `main.py` строку `print("ОТЛАДКА")`, сохрани файл и
          набери `git add main.py`, затем `git status`: `main.py` в разделе
          `Changes to be committed`.
      - id: unstage
        text: >-
          **Вынь файл из индекса:** `git restore --staged main.py`, затем `git status` и
          `git diff`. `main.py` переехал в `Changes not staged for commit`, а `git diff`
          по-прежнему показывает строку `+print("ОТЛАДКА")`: из индекса правка ушла, а в файле
          осталась.
        help: >-
          Git сам подсказывает эту команду в скобках под `Changes to be committed`:
          `use "git restore --staged <file>..." to unstage` — «чтобы убрать из индекса».
      - id: discard
        text: >-
          **Выброси правку из файла:** закрой `main.py` в редакторе и набери
          `git restore main.py`. Теперь `git status` пишет `nothing to commit, working tree clean`,
          а строки с отладкой в файле нет.
        help: >-
          Закрыть файл нужно, чтобы редактор не записал версию с отладкой обратно при следующем
          сохранении, — как в уроке 5.6. Если файл был открыт, после restore открой его заново.
          `git restore` без `--staged` стирает правки, которых нет в коммите, безвозвратно:
          пользуйся им, только когда их точно не жалко.
    coach: >-
      Две отмены легко запомнить парой: с `--staged` — «вынь из корзины», без него — «выброси
      правку из файла».

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Три места: рабочая папка → индекс → история. В коммит попадает только то, что лежит в индексе, — в той версии, что была при `git add`."
      - "Перед коммитом — `git status` и `git diff`, после `git add` — `git diff --staged`. В diff `-` — было, `+` — стало, а сам знак в файл не входит; даже сдвиг отступа меняет строку."
      - "`.gitignore` не пускает в репозиторий окружение, кеши и личные файлы. Уже закоммиченный файл перестают сохранять через `git rm --cached`, но в старых коммитах он остаётся."
      - "Одна мысль — один коммит с сообщением о том, что изменилось. `git restore --staged` вынимает файл из индекса, `git restore` выбрасывает правки из файла безвозвратно."
    question: Зачем смотреть `git diff --staged` перед коммитом, если ты помнишь, что менял?
    answer: >-
      Память подводит: в индекс мог попасть отладочный print, лишний файл или случайная правка —
      как у папы Ани. `git diff --staged` показывает ровно то, что уйдёт в историю, и по нему же
      точнее пишется сообщение коммита.
