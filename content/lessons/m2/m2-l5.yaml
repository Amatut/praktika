id: m2-l5
module: m2
number: "2.5"
title: "Границы: проверяем пороговые значения"
objective: >-
  Находить граничные значения правила, заранее записывать ожидаемый результат в таблицу проверок
  и по ней искать и исправлять ошибки на границах.
minutes: [25, 30]
prerequisites: [m2-l4]
skills: [boundary-checks]
environment: python

story:
  title: Ровно 120 сантиметров
  fictional: true
  text: >-
    На аттракцион «Ракета» пускают детей ростом от 120 до 150 сантиметров включительно. Раньше
    контролёр мерил каждого планкой, потом у входа поставили электронный ростомер с программой.
    В первый же день он не пустил мальчика ростом ровно 120 см: в программе стояло `>` вместо
    `>=`. Разработчица Катя исправила один знак и завела правило: перед каждым обновлением
    программы проверять обе границы и соседние с ними значения — 119, 120, 121 и 149, 150, 151.
    Именно на границах программы ошибаются чаще всего.

why: >-
  В правилах с порогами ошибки чаще всего прячутся на границах: «от 1000 рублей», «до 15 минут»,
  «с 18 лет». Если заранее проверить программу на пороговых значениях, многие такие ошибки
  найдёшь ты, а не пользователь.

usedIn: >-
  Тестировщики называют этот приём анализом граничных значений — это один из базовых способов
  придумывать тесты. Так проверяют лимиты и тарифы, возрастные ограничения, часы работы, размеры
  скидок. Этот же приём пригодится в модуле про автоматические тесты.

steps:
  - id: idea
    type: theory
    title: Где программы ошибаются чаще всего
    body: |-
      В каждом задании прошлых уроков были тесты с пометкой «Граничный случай»: рюкзак ровно
      12 кг, вероятность дождя ровно 50 %, доставка ровно на 20 км. Сегодня разберёмся, почему
      проверяют именно такие значения и как находить их самому.

      **Граница**, или порог, — значение, на котором по правилу меняется ответ: при росте 119 см
      на «Ракету» нельзя, а при 120 — уже можно. Ошибка в одном символе, `<` вместо `<=`, видна
      только здесь. При росте 100 или 135 программа с такой ошибкой отвечает верно, а при росте
      ровно 120 — нет. Поэтому «запустил на паре обычных значений — работает» ещё ничего не значит.

      **Слова правила → знак.** Сначала реши, входит ли сама граница:

      ```text
      «от N», «не меньше N», «N и больше»   →  >= N
      «больше N», «свыше N»                 →  >  N
      «до N включительно», «не больше N»    →  <= N
      «меньше N», «до N, а N уже нет»       →  <  N
      ```

      Если из правила непонятно, входит ли граница, — это вопрос к тому, кто дал правило, а не
      повод угадывать.

      **Точки у каждой границы.** Обязательно проверяют саму границу и ближайшее значение по
      другую сторону: для «от 120» это 120 и 119. Эта пара ловит путаницу `<` и `<=`. Надёжнее
      добавить третью точку — шаг внутрь, 121: она страхует от других ошибок, например `==`
      вместо `>=`. Вдобавок полезны обычное значение из середины и крайние: 0 и самое большое из
      возможных. Если значения дробные, шаг берут поменьше: для правила «от 30 градусов — жара»
      проверяют 29.9 и 30. Но в самом условии пишут границу из правила — `t >= 30`, а не
      `t > 29.9`: между 29.9 и 30 тоже есть числа, например 29.95.

      **Таблица проверок.** До запуска выпиши значения и для каждого — что должно получиться
      **по правилу**. Веди её на листке или прямо в коде, в комментариях: `#` в начале каждой
      строки.

      ```text
      ввод   ожидаю    получилось
      119    нельзя
      120    можно
      121    можно
      ```

      Потом запускай программу на каждом значении и заполняй последний столбец. Не совпало —
      ошибка найдена, и ты сразу знаешь, на каком значении. В заданиях с вводом значение
      подставляешь в поле «Ввод для „Запустить“», а тесты с пометкой «Граничный случай» делают
      такую же проверку автоматически.
    simpler: >-
      Граница — место, где по правилу «нет» меняется на «да». Проверь её саму и значение сразу
      за ней — так ловится почти любая путаница `<` и `<=`. А что должно получиться, бери из
      правила, а не из того, что напечатала программа.
    coach: >-
      Не совпало на границе — сначала проверь знак, а не число.

  - id: rocket
    type: example
    title: Ростомер у аттракциона
    body: |-
      Программа ростомера — уже исправленная. Рост задан прямо в первой строке, чтобы его было
      легко менять. Вот таблица проверок для неё: столбец «ожидаю» заполнен по правилу «от 120 до
      150 см включительно», а «получилось» заполняешь ты, запуская программу.

      ```text
      рост   ожидаю    получилось
      119    нельзя
      120    можно
      135    можно     (обычное значение внутри)
      150    можно
      151    нельзя
      ```
    code: |-
      height = 120   # рост в сантиметрах: меняй и запускай

      if 120 <= height <= 150:
          print("Проходи на «Ракету»!")
      else:
          print("Пока нельзя — выбери другой аттракцион")
    notes:
      - line: 1
        text: >-
          Рост записан прямо в коде: поставь вместо 120 следующее значение из таблицы и
          запусти снова.
      - line: 3
        text: >-
          Двойное сравнение из урока 2.4. Знак `<=` с обеих сторон включает обе границы: и 120,
          и 150 проходят.
      - line: 5
        text: "`else` ловит всё остальное — и слишком низких, и слишком высоких."
    tryIt: >-
      Проверь границы: ставь в первой строке 119, 120, 150 и 151, запускай и сравнивай вывод со
      столбцом «ожидаю». Потом сломай программу, как в истории: замени первый `<=` на `<`
      (`120 < height` — то же самое, что `height > 120`). Снова поставь 120 — таблица сразу
      покажет ошибку. А теперь поставь 135: с ошибкой программа отвечает верно, поэтому обычные
      значения её не замечают.
    coach: >-
      Четыре запуска у границ занимают пару минут, зато после них ты уверен в обеих границах.

  - id: parking
    type: predict
    title: Ровно 15 минут
    prompt: >-
      Табло на парковке торгового центра. Водитель простоял ровно 15 минут. Как думаешь, что
      покажет табло?
    code: |-
      minutes = 15
      # Правило: первые 15 минут парковка бесплатная
      if minutes < 15:
          print("Бесплатно")
      else:
          print("Оплатите парковку")
    options:
      - Бесплатно
      - Оплатите парковку
    answer: Оплатите парковку
    explanation: >-
      Комментарий обещает 15 бесплатных минут, но Python выполняет код, а не комментарий:
      `15 < 15` — False, и срабатывает `else`. Правило «первые 15 минут бесплатно» включает
      пятнадцатую минуту, значит, нужно `minutes <= 15`. При 10 или 40 минутах программа
      отвечает верно — ошибку видно только ровно на границе.
    coach: >-
      Комментарий — это намерение автора. Сверяй правило с тем, что написано в коде.

  - id: which-values
    type: quiz
    title: Какие значения проверить?
    question: >-
      Детский билет в музей продают детям от 7 до 12 лет включительно. Какой набор возрастов
      лучше всего проверяет границы этого правила?
    options:
      - 5, 10, 15
      - 7 и 12
      - 6, 7, 12, 13
      - 0 и 100
    correct: 2
    explanation: >-
      У правила две границы, 7 и 12, и у каждой нужна как минимум пара: сама граница и значение
      сразу за ней — 6 и 7, 12 и 13. Набор «5, 10, 15» не задевает ни одну границу. «7 и 12»
      поймает `>` вместо `>=`, но пропустит ошибку в другую сторону: если в программе
      `age <= 13`, 13-летнему продадут детский билет, а 13 этот набор не проверяет. 0 и 100
      полезны только вдобавок: границ они не проверяют. По полной схеме к правильному набору
      добавились бы шаги внутрь — 8 и 11.

  - id: practice-gym
    type: exercise
    title: Практика 1
    exercise:
      id: m2-l5-e1
      kind: read
      title: Час-ловушка
      statement: |-
        В спортзале два тарифа на разовое посещение (цены учебные):

        - **дневной — 250**: с 10:00 до 16:00; в 16:00 уже начинается вечер, и дневной тариф
          не действует;
        - **обычный — 400**: в остальные часы работы, с 7:00 до 10:00 и с 16:00 до закрытия в
          22:00.

        Коллега написал программу, которая выбирает тариф по часу прихода `hour`. Это целое
        число от 7 до 21: `15` значит «пришёл между 15:00 и 15:59». На одном часе программа
        выбирает не тот тариф. Составь таблицу проверок — на листке или в комментариях, с `#` в
        начале каждой строки. Меняй `hour`, запускай и сравнивай вывод с правилом. Найденный
        час запиши в переменную `bad_hour` — только номер часа, числом, без кавычек и минут:
        `15`, а не `"15:00"`.

        Исправлять программу не нужно: проверка смотрит только на `bad_hour`.
      input: Ввода нет — значение `hour` меняешь прямо в коде.
      output: >-
        В переменной `bad_hour` — час, на котором программа ошибается. Вывод программы не
        проверяется.
      constraints:
        - "`hour` — целое число от 7 до 21."
        - Для каждого часа сначала реши по правилу, какой тариф должен быть, и только потом запускай.
      starterCode: |
        # Правило: с 10:00 до 16:00 — дневной тариф, 250.
        # В 16:00 дневной уже не действует. В остальные часы — 400.
        hour = 12   # час прихода, от 7 до 21: меняй и запускай

        if hour > 9 and hour < 17:
            print("Дневной тариф: 250")
        else:
            print("Обычный тариф: 400")

        bad_hour = 0   # впиши сюда час, на котором программа ошибается
      tests:
        - id: t1
          kind: assert
          title: Найденный час
          example: true
          code: assert bad_hour == 16
          message: >-
            В `bad_hour` должен быть час прихода, на котором программа выбирает не тот тариф.
      criteria:
        - В `bad_hour` записан час — целым числом, без кавычек, — на котором вывод программы расходится с правилом.
        - Час найден проверкой по таблице — ожидаемый тариф взят из правила, а не из вывода программы.
      hints:
        - >-
          Ошибки чаще всего прячутся на границах правила. На каких часах тариф по правилу
          меняется? Проверь эти часы и соседние с ними.
        - >-
          Так проверяют правило «пункт выдачи работает с 9:00 до 21:00, в 21:00 уже закрыт»:
          берут часы 8, 9, 20 и 21 и для каждого заранее пишут ответ по правилу — 8 закрыто,
          9 и 20 открыто, 21 закрыто. Потом запускают программу на этих часах и сравнивают.
        - |-
          Каркас таблицы — заполни последний столбец, запуская программу:
          ```text
          час   по правилу   программа
          9     400          ?
          10    250          ?
          15    250          ?
          16    400          ?
          17    400          ?
          ```
          Там, где «программа» не совпала с «по правилу», и есть нужный час.
      solution:
        code: |
          # Правило: с 10:00 до 16:00 — дневной тариф, 250.
          # В 16:00 дневной уже не действует. В остальные часы — 400.
          hour = 16   # час прихода, от 7 до 21: меняй и запускай

          if hour > 9 and hour < 17:
              print("Дневной тариф: 250")
          else:
              print("Обычный тариф: 400")

          bad_hour = 16   # впиши сюда час, на котором программа ошибается
        explanation: >-
          По правилу в 16:00 уже действует обычный тариф, а программа при `hour = 16` печатает
          «Дневной тариф: 250»: условие `hour < 17` для 16 верно. Правило сменяет тариф на 16, а
          программа — только на 17: граница сдвинута на час. На 9 и 10 программа права, внутри
          промежутка и с 17 часов — тоже, поэтому ошибку видно только на самой границе.
          Исправление — `hour < 16`.
      altSolutions:
        - code: |
            hour = 16

            if hour > 9 and hour < 16:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 16
          note: Программа заодно исправлена — проверка смотрит только на bad_hour.
        - code: |
            # час  по правилу  программа
            # 9    400         400
            # 10   250         250
            # 15   250         250
            # 16   400         250  <- ошибка
            # 17   400         400
            hour = 16

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = hour
          note: Таблица в комментариях, в bad_hour записано значение hour, на котором нашлась ошибка.
        - code: |
            hour = 16

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 0   # впиши сюда час, на котором программа ошибается
            bad_hour = 16
          note: Стартовая строка оставлена, ответ дописан ниже — в переменной остаётся последнее значение.
      wrongSolutions:
        - code: |
            hour = 12

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 0
          note: Ответ ещё не записан.
          expectMistake: not-yet
        - code: |
            hour = 16

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = "16"
          note: Час найден верно, но записан строкой в кавычках.
          expectMistake: quotes
        - code: |
            hour = 10

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = "10"
          note: Неверный час, да ещё в кавычках — разбор не должен называть верный ответ.
          expectMistake: quotes
        - code: |
            hour = 16

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = "16:00"
          note: Час записан строкой в формате времени.
          expectMistake: quotes
        - code: |
            hour = 16

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 16:00
          note: Время без кавычек — SyntaxError.
          expectMistake: time-format
        - code: |
            час   по правилу   программа
            9     400          400
            16    400          250
            hour = 16

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 16
          note: Таблица набрана прямо в коде без решётки — SyntaxError.
          expectMistake: table-no-hash
        - code: |
            hour = 10

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 10
          note: Выбрана левая граница — там программа права.
          expectMistake: lower-edge
        - code: |
            hour = 10

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 0   # впиши сюда час, на котором программа ошибается
            bad_hour = 10
          note: Стартовая строка оставлена, ниже дописан неверный час — разбор смотрит на последнюю запись.
          expectMistake: lower-edge
        - code: |
            hour = 13

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 13
          note: Час внутри дневного промежутка.
          expectMistake: inside
        - code: |
            hour = 17

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 17
          note: Час, на котором программа сменяет тариф, — там она уже выбирает обычный, как и правило.
          expectMistake: outside
        - code: |
            hour = 23

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 23
          note: Час вне часов работы.
          expectMistake: out-of-range
        - code: |
            hour = 10

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = hour
          note: bad_hour = hour, но в hour стоит час, на котором программа права.
          expectMistake: copied-hour
        - code: |
            hour = 16

            if hour > 9 and hour < 17:
                print("Дневной тариф: 250")
            else:
                print("Обычный тариф: 400")

            bad_hour = 0   # впиши сюда час, на котором программа ошибается
            bad_hour == 16
          note: Сравнение == вместо присваивания — в bad_hour остался 0.
          expectMistake: not-yet
      mistakes:
        - id: table-no-hash
          when:
            errorType: SyntaxError
            codeRegex: '^[ \t]*[А-Яа-яЁё]'
          why: >-
            В коде есть строка обычного текста — похоже, строка таблицы. Python пытается
            выполнить её как команду, не понимает и не запускает программу вовсе.
          try: >-
            Поставь `#` в начале каждой строки таблицы — тогда это комментарий, и Python его
            пропустит. Или веди таблицу на листке.
          verify: Ошибка SyntaxError должна исчезнуть, а программа — запуститься.
        - id: time-format
          when:
            errorType: SyntaxError
            codeRegex: '^\s*(?:bad_)?hour\s*=\s*\d+\s*:'
          why: >-
            Запись времени вида `12:00` Python не понимает: двоеточие в коде значит совсем другое,
            поэтому программа не запускается.
          try: >-
            Пиши только номер часа — целым числом, без двоеточия и минут: `12`, а не `12:00`.
            Так же устроен и `hour`.
          verify: Ошибка SyntaxError должна исчезнуть. Если час верный, пройдёт и проверка «Найденный час».
        - id: quotes
          when:
            failedTest: t1
            codeRegex: '^\s*bad_hour\s*=\s*["''](?![\s\S]*^\s*bad_hour\s*=(?!=))'
          why: >-
            В `bad_hour` записан текст в кавычках, а не число. Для Python `"12"` и `12` — разные
            значения: строка с цифрами не равна числу, как и в уроке 2.1.
          try: >-
            Убери кавычки и запиши только номер часа — целым числом, без двоеточия и минут: `12`,
            а не `"12:00"`.
          verify: Нажми «Проверить» — если час верный, проверка «Найденный час» пройдёт.
        - id: copied-hour
          when:
            failedTest: t1
            codeRegex: '^\s*bad_hour\s*=\s*hour\b(?![\s\S]*^\s*bad_hour\s*=(?!=))'
          why: >-
            В `bad_hour` попало значение `hour` — час, который сейчас стоит в начале программы. Но
            на этом часе вывод программы совпадает с правилом, значит, ошибка прячется в другом
            часе.
          try: >-
            Продолжай таблицу: ставь в `hour` часы у границ тарифа и сравнивай вывод с правилом.
            Когда найдёшь расхождение, оставь этот час в `hour` — или запиши его в `bad_hour`
            числом.
        - id: not-yet
          when:
            failedTest: t1
            codeRegex: '^\s*bad_hour\s*=\s*0\b(?![\s\S]*^\s*bad_hour\s*=(?!=))'
          why: >-
            В `bad_hour` пока стоит 0 из стартового кода — такого часа прихода нет, ответ ещё не
            записан.
          try: >-
            Составь таблицу: выпиши часы, на которых по правилу меняется тариф, и соседние с ними,
            для каждого запиши тариф по правилу. Потом ставь эти часы в `hour` и запускай.
        - id: lower-edge
          when:
            failedTest: t1
            codeRegex: '^\s*bad_hour\s*=\s*10\b(?![\s\S]*^\s*bad_hour\s*=(?!=))'
          why: >-
            В 10:00 программа права: `10 > 9` — True, и она выбирает дневной тариф, как и велит
            правило. Для целых часов `hour > 9` — то же, что `hour >= 10`: эта граница записана
            правильно, хоть и другим числом.
          try: >-
            У дневного промежутка две границы. Проверь вторую: час, на котором тариф по правилу
            снова меняется, и час перед ним.
        - id: inside
          when:
            failedTest: t1
            codeRegex: '^\s*bad_hour\s*=\s*1[1-5]\b(?![\s\S]*^\s*bad_hour\s*=(?!=))'
          why: >-
            Внутри дневного промежутка программа отвечает верно: и по правилу, и по программе здесь
            дневной тариф. Ошибка в знаке или числе на границе внутри промежутка не видна.
          try: Проверь часы на границах — те, где тариф по правилу меняется.
        - id: outside
          when:
            failedTest: t1
            codeRegex: '^\s*bad_hour\s*=\s*(?:[789]|1[7-9]|2[01])\b(?![\s\S]*^\s*bad_hour\s*=(?!=))'
          why: >-
            В этот час программа выбирает обычный тариф, 400, — и по правилу он тоже обычный.
            Здесь ошибки нет.
          try: >-
            Посмотри на часы ровно на границах, где по правилу один тариф сменяется другим.
            Сравни с правилом вывод программы на каждом из них.
        - id: out-of-range
          when:
            failedTest: t1
            codeRegex: '^\s*bad_hour\s*=\s*-?\d(?![\s\S]*^\s*bad_hour\s*=(?!=))'
          why: >-
            Такого часа прихода в задаче нет: спортзал открыт с 7:00, последний час прихода — 21,
            и `hour` — целое число от 7 до 21.
          try: Ищи среди часов работы — начни с тех, где по правилу меняется тариф.
      afterPass: >-
        Ты нашёл ошибку не угадыванием, а сверкой с правилом на часах у границ. Если хочешь,
        исправь программу — `hour < 16` — и проверь 15 и 16 ещё раз.
      skills: [boundary-checks]

  - id: practice-baggage
    type: exercise
    title: Практика 2
    exercise:
      id: m2-l5-e2
      kind: fix
      title: Лишний килограмм
      statement: |-
        В учебной авиакомпании такие правила для ручной клади:

        - до 10 кг включительно — бесплатно;
        - больше 10 и до 20 кг включительно — доплата 1500;
        - больше 20 кг — сумку нужно сдать в багаж.

        Пассажиры с сумкой ровно 10 кг жалуются, что с них просят доплату. Составь таблицу
        проверок для всех границ правила (на листке или в комментариях), найди ошибки и исправь
        программу. Вес — целое число килограммов.
      input: Одна строка — вес ручной клади, целое число килограммов.
      output: "Одна строка: `Бесплатно`, `Доплата: 1500` или `Сдайте в багаж`."
      constraints:
        - Исправь условия, не переписывая программу целиком.
        - Тексты вывода не меняй.
      starterCode: |
        # до 10 кг включительно — бесплатно,
        # больше 10 и до 20 кг включительно — доплата 1500,
        # больше 20 кг — сдать в багаж
        weight = int(input("Вес ручной клади, кг: "))
        if weight < 10:
            print("Бесплатно")
        elif weight < 20:
            print("Доплата: 1500")
        else:
            print("Сдайте в багаж")
      tests:
        - id: t1
          kind: io
          title: "Пример 1: 5 кг"
          example: true
          stdin: "5\n"
          expected: Бесплатно
          compare: {ignoreSpaces: true}
        - id: t2
          kind: io
          title: "Пример 2: 15 кг"
          example: true
          stdin: "15\n"
          expected: "Доплата: 1500"
          compare: {ignoreSpaces: true}
        - id: t3
          kind: io
          title: "Пример 3: 25 кг"
          example: true
          stdin: "25\n"
          expected: Сдайте в багаж
          compare: {ignoreSpaces: true}
        - id: t4
          kind: io
          title: "Граничный случай: ровно 10 кг"
          edge: true
          stdin: "10\n"
          expected: Бесплатно
          compare: {ignoreSpaces: true}
        - id: t5
          kind: io
          title: "Граничный случай: 11 кг"
          edge: true
          stdin: "11\n"
          expected: "Доплата: 1500"
          compare: {ignoreSpaces: true}
        - id: t6
          kind: io
          title: "Граничный случай: ровно 20 кг"
          edge: true
          stdin: "20\n"
          expected: "Доплата: 1500"
          compare: {ignoreSpaces: true}
        - id: t7
          kind: io
          title: "Граничный случай: 21 кг"
          edge: true
          stdin: "21\n"
          expected: Сдайте в багаж
          compare: {ignoreSpaces: true}
        - id: t8
          kind: io
          title: "Граничный случай: 0 кг"
          edge: true
          stdin: "0\n"
          expected: Бесплатно
          compare: {ignoreSpaces: true}
      criteria:
        - Сумка ровно 10 кг — бесплатно, 11 кг — уже доплата.
        - Сумка ровно 20 кг — ещё доплата, 21 кг — уже багаж.
        - Обычные веса по-прежнему получают верный ответ, тексты вывода не изменились.
      hints:
        - >-
          У правила две границы, а жалоба — только про одну. На каких весах ответ по правилу
          меняется? Что должно получиться на каждой границе и сразу за ней?
        - >-
          Таблица для правила «до 5 кг включительно — обычная доставка, тяжелее — грузовая»:
          5 → обычная, 6 → грузовая. Если программа на 5 отвечает «грузовая», скорее всего, в ней
          `kg < 5`, а нужно `kg <= 5`: граница должна попасть в ветку «обычная».
        - |-
          Каркас таблицы — заполни последний столбец, запуская программу:
          ```text
          вес   по правилу       программа
          10    Бесплатно        ?
          11    Доплата: 1500    ?
          20    Доплата: 1500    ?
          21    Сдайте в багаж   ?
          ```
          Где ответ программы не совпал с правилом, поменяй знак в проверке этой границы так,
          чтобы граница вошла в нужную ветку.
      solution:
        code: |
          # до 10 кг включительно — бесплатно,
          # больше 10 и до 20 кг включительно — доплата 1500,
          # больше 20 кг — сдать в багаж
          weight = int(input("Вес ручной клади, кг: "))
          if weight <= 10:
              print("Бесплатно")
          elif weight <= 20:
              print("Доплата: 1500")
          else:
              print("Сдайте в багаж")
        explanation: >-
          Обе границы правила включены — «до 10 включительно» и «до 20 включительно», — поэтому в
          обеих проверках нужен `<=`. Со знаком `<` вес ровно 10 кг уходил в доплату, а ровно
          20 кг — в багаж. Жалоба была только про 10 кг, но таблица с 10, 11, 20 и 21 показала и
          вторую ошибку. Для целых весов подойдёт и `weight < 11`, но `<= 10` повторяет само
          правило, и его легче проверить глазами.
