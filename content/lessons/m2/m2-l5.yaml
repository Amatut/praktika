        - id: separate-ifs
          when:
            outputIncludes: "\n"
            codeRegex: '^if\b[\s\S]*^if\b'
          why: >-
            На один вес программа напечатала две строки. Проверки стоят отдельными `if`, а не
            одной цепочкой: каждый `if` Python проверяет сам по себе, даже когда предыдущая
            ветка уже сработала, — как в уроке 2.3.
          try: "Верни цепочку: первая проверка — `if`, следующая — `elif`, последней — `else:`."
          verify: Для каждого веса должна печататься ровно одна строка.
        - id: direction
          when:
            failedTest: t2
            codeIncludes: "Доплата: 1500"
          why: >-
            Ошибается не только граница: сумка 15 кг по правилу — с доплатой, а программа выбирает
            другую ветку. Значит, какая-то проверка отбирает не те веса. Частая причина — знак
            смотрит не в ту сторону: `>` и `>=` отбирают вес побольше, `<` и `<=` — поменьше.
          try: >-
            Прочитай каждую проверку вслух и сравни с правилом по табличке из теории: «до N
            включительно» — это `<= N`. Когда обычные веса снова получат верный ответ, проверь
            границы 10, 11, 20 и 21.
          verify: "Примеры 5, 15 и 25 кг должны пройти, а затем — граничные случаи."
        - id: wrong-order
          when:
            failedTest: t1
            outputEquals: "Доплата: 1500"
          why: >-
            Сумка 5 кг попала в доплату: проверка «до 20 кг» стоит раньше «до 10 кг» и
            перехватывает все лёгкие сумки. Цепочка выполняет первую подходящую ветку — как в
            уроке 2.3.
          try: Верни проверки в прежний порядок — от меньшего веса к большему — и меняй только знаки.
          verify: "В тесте «Пример 1: 5 кг» должно получиться «Бесплатно»."
        - id: heavy-in-fee
          when:
            failedTest: t3
            outputEquals: "Доплата: 1500"
          why: >-
            Сумка 25 кг попала в доплату, хотя она тяжелее 20 кг. Ветка «Доплата» перехватывает её
            раньше, чем программа доходит до багажа: у проверки доплаты нет верхней границы 20 или
            проверка «больше 20» стоит после неё. Цепочка выполняет первую подходящую ветку.
          try: >-
            Сделай так, чтобы доплата бралась только до 20 кг включительно, а всё тяжелее уходило в
            багаж. Проще всего вернуть проверки в прежний порядок — от меньшего веса к большему.
          verify: "В тесте «Пример 3: 25 кг» должно получиться «Сдайте в багаж»."
        - id: first-boundary
          when:
            failedTest: t4
            outputEquals: "Доплата: 1500"
          why: >-
            По правилу 10 кг — ещё бесплатно: «до 10 кг включительно». А программа просит доплату:
            граница 10 попала не в ту ветку. Например, в стартовом коде `10 < 10` — False.
          try: >-
            Найди проверку, которая отделяет «Бесплатно» от доплаты, — с границей 10 — и поправь в
            ней знак так, чтобы 10 кг были бесплатными, а 11 — уже с доплатой.
          verify: "В тесте «Граничный случай: ровно 10 кг» должно получиться «Бесплатно», а 11 кг — всё ещё доплата."
        - id: overshoot-low
          when:
            failedTest: t5
            outputEquals: Бесплатно
          why: >-
            Граница сдвинулась слишком далеко: 11 кг — это уже больше 10, по правилу за такую сумку
            доплачивают.
          try: >-
            В проверке, которая отделяет «Бесплатно» от доплаты, должно стоять число из правила —
            10, а знак — такой, чтобы 10 кг были бесплатными, а 11 — уже нет.
          verify: "10 кг — «Бесплатно», 11 кг — «Доплата: 1500»."
        - id: second-boundary
          when:
            failedTest: t6
            outputEquals: Сдайте в багаж
          why: >-
            Жалоба была про 10 кг, но у правила две границы. Ровно 20 кг — это ещё «до 20
            включительно», то есть доплата, а программа отправляет сумку в багаж.
          try: >-
            Проверь границу 20 так же, как 10, и поправь знак в проверке, которая отделяет доплату
            от багажа.
          verify: "20 кг — «Доплата: 1500», 21 кг — «Сдайте в багаж»."
        - id: overshoot-high
          when:
            failedTest: t7
            outputEquals: "Доплата: 1500"
          why: >-
            Вторая граница сдвинулась слишком далеко: 21 кг — уже больше 20, такую сумку по правилу
            сдают в багаж.
          try: >-
            В проверке, которая отделяет доплату от багажа, должно стоять число из правила — 20, а
            знак — такой, чтобы 20 кг шли с доплатой, а 21 — уже в багаж.
          verify: "20 кг — «Доплата: 1500», 21 кг — «Сдайте в багаж»."
      afterPass: >-
        Жалоба была про одну границу, а ошибок нашлось две — так бывает часто, и таблица проверок
        нашла обе. На будущее: если весы начнут показывать дробный вес, например 10.4 кг, и
        программа будет читать его через `float`, `<= 10` сработает верно, а `< 11` отпустит такую
        сумку бесплатно. Поэтому знак, который повторяет правило, надёжнее.
      skills: [boundary-checks, conditions]

  - id: practice-aquarium
    type: exercise
    title: Практика 3
    exercise:
      id: m2-l5-e3
      kind: write
      title: Вода в аквариуме
      statement: |-
        Для тропических рыбок (правило учебное) вода в аквариуме должна быть от 24 до 28 градусов
        включительно. Напиши программу, которая читает температуру воды — число, возможно
        дробное, через точку, например `25.5`, — и печатает одно слово:

        - `Холодно`, если вода холоднее нормы;
        - `Норма`, если температура в норме;
        - `Жарко`, если вода теплее нормы.

        Перед кодом составь в комментариях свою таблицу проверок: обычные значения и значения у
        обеих границ, для каждого — ожидаемый ответ. Её не проверяют, но с ней проще не
        ошибиться. Потом прогони таблицу через «Запустить».
      input: Одна строка — температура воды, число через точку.
      output: "Одна строка: `Холодно`, `Норма` или `Жарко`."
      constraints:
        - Температура бывает дробной.
        - Текст подсказки в `input()` можно написать любой — он не проверяется.
      starterCode: |
        # Таблица проверок (заполни до кода):
        # температура   ожидаю
        # 20            Холодно
        #

      tests:
        - id: t1
          kind: io
          title: "Пример 1: 26 градусов"
          example: true
          stdin: "26\n"
          expected: Норма
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t2
          kind: io
          title: "Пример 2: 20 градусов"
          example: true
          stdin: "20\n"
          expected: Холодно
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Пример 3: 30 градусов"
          example: true
          stdin: "30\n"
          expected: Жарко
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Дробная температура: 25.5"
          stdin: "25.5\n"
          expected: Норма
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t5
          kind: io
          title: "Граничный случай: ровно 24"
          edge: true
          stdin: "24\n"
          expected: Норма
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t6
          kind: io
          title: "Граничный случай: ровно 28"
          edge: true
          stdin: "28\n"
          expected: Норма
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t7
          kind: io
          title: "Граничный случай: 23.9"
          edge: true
          stdin: "23.9\n"
          expected: Холодно
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t8
          kind: io
          title: "Граничный случай: 28.1"
          edge: true
          stdin: "28.1\n"
          expected: Жарко
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t9
          kind: io
          title: "Граничный случай: 23.999"
          edge: true
          stdin: "23.999\n"
          expected: Холодно
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t10
          kind: io
          title: "Граничный случай: 28.001"
          edge: true
          stdin: "28.001\n"
          expected: Жарко
          compare:
            ignoreCase: true
            ignoreSpaces: true
        - id: t11
          kind: io
          title: "Очень холодная вода: 9 градусов"
          stdin: "9\n"
          expected: Холодно
          compare:
            ignoreCase: true
            ignoreSpaces: true
      criteria:
        - Температура читается как дробное число, поэтому 25.5 и 23.9 не ломают программу, а 9 сравнивается с 24 как число, а не как текст.
        - "24 и 28 — «Норма»: обе границы входят в норму."
        - "23.9 и 23.999 — «Холодно», 28.001 и 28.1 — «Жарко»: сразу за границами ответ меняется, даже на тысячную долю градуса."
        - Выводится ровно одно слово.
      hints:
        - >-
          Три ответа — значит, две границы. Какие значения стоят прямо на границах и к какому
          ответу их отнести по правилу? И какой тип числа нужен, если температура бывает дробной?
        - >-
          Похожее правило «от 18 до 65 лет включительно» одним условием записывается так:
          `if 18 <= age <= 65:`. Дробное число из ввода получают через `float(input())`, как в
          уроке 1.5.
        - |-
          Каркас — знаки подбери сам:
          ```text
          t = float(input(...))
          if t … 24:
              печатаем Холодно
          elif t … 28:
              печатаем Норма
          else:
              печатаем Жарко
          ```
          Какой знак нужен в первой проверке, чтобы 23.9 было «Холодно», а 24 — уже нет? А во
          второй — чтобы 28 осталось «Нормой», а 28.1 — уже нет? Сверь ответы со своей таблицей.
      solution:
        code: |
          # Таблица проверок:
          # температура   ожидаю
          # 20            Холодно
          # 23.9          Холодно
          # 24            Норма
          # 26            Норма
          # 28            Норма
          # 28.1          Жарко
          # 30            Жарко

          t = float(input("Температура воды: "))
          if t < 24:
              print("Холодно")
          elif t <= 28:
              print("Норма")
          else:
              print("Жарко")
        explanation: >-
          `float` нужен, потому что температура бывает дробной. Первая ветка забирает всё, что
          ниже 24, — 24 туда уже не попадает. До `elif` доходят только значения от 24 и выше, и
          `t <= 28` оставляет в норме всё до 28 включительно. Остальное — жарко. Граница 24 входит в
          норму благодаря `<` в первой проверке, а 28 — благодаря `<=` во второй. Таблица проверяет
          обе границы и значения сразу за ними, 23.9 и 28.1, а ещё обычные значения.
