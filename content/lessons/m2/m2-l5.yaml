      mistakes:
        - id: int-input
          when:
            errorType: ValueError
            errorIncludes: for int()
          why: >-
            Температура бывает дробной, а `int()` понимает только запись целого числа:
            `int("25.5")` останавливает программу с ValueError.
          try: Читай температуру через `float(input())` — он понимает и `25.5`, и `26`.
          verify: "Тест «Дробная температура: 25.5» должен пройти без ошибки."
        - id: no-number
          when:
            errorType: TypeError
            errorIncludes: not supported between instances of
          why: >-
            С одной стороны сравнения строка, с другой — число, а такие значения Python не
            сравнивает, отсюда TypeError. Обычно строкой остаётся то, что вернул `input()`: он
            всегда возвращает текст, даже если ввели `26`.
          try: >-
            Температура бывает дробной — читай её через `float(input())`, а 24 и 28 пиши числами,
            без кавычек.
          verify: "Тест «Пример 1: 26 градусов» должен пройти без ошибки."
        - id: half-condition
          when:
            errorType: SyntaxError
            codeRegex: '\b(?:and|or)\s*[<>=!]'
          why: >-
            Сразу после `and` стоит знак сравнения, а слева от него ничего нет. По-русски «не
            меньше 24 и не больше 28» понятно, но для Python каждая часть условия — отдельное
            целое сравнение, как в уроке 2.4.
          try: >-
            Допиши вторую часть полностью — переменная, знак и число: например, `x > 5 and x < 9`,
            а не `x > 5 and < 9`.
          verify: Ошибка SyntaxError должна исчезнуть.
        - id: strings
          when:
            failedTest: t11
            codeRegex: '[<>]=?\s*["''][\d.]+["'']|["''][\d.]+["'']\s*[<>]|(?<![\s\S])(?=[\s\S]*\binput\s*\()(?![\s\S]*\b(?:int|float)\s*\()'
          why: >-
            Температура осталась строкой, и Python сравнивает текст — по первому отличающемуся
            символу, как в прогнозе «Десять больше девяти?» из урока 2.1. Для двузначных
            температур ответ случайно выходит верным, а `"9" < "24"` — False: символ «9» идёт
            после «2».
          try: >-
            Сравнивай числа: преврати ввод через `float(input(...))`, а 24 и 28 оставь числами —
            без кавычек.
          verify: "В тесте «Очень холодная вода: 9 градусов» должно получиться «Холодно»."
        - id: separate-ifs
          when:
            outputIncludes: "\n"
            codeRegex: '^if\b[\s\S]*^if\b'
          why: >-
            На одну температуру программа напечатала две строки. Проверки стоят отдельными `if`, а
            не одной цепочкой: каждый `if` Python проверяет сам по себе, даже когда предыдущая
            ветка уже сработала, а `else` относится только к ближайшему `if` над ним — как в
            уроке 2.3.
          try: "Собери проверки в одну цепочку: первая — `if`, следующие — `elif`, последней — `else:`."
          verify: Для каждой температуры должна печататься ровно одна строка.
        - id: or-range
          when:
            failedTest: t2
            outputEquals: Норма
            codeRegex: '\bor\b'
          why: >-
            20 градусов попали в норму. Условие с `or` верно, если верна хотя бы одна часть, а
            `t <= 28` верно для 20, как и для любой воды холоднее 28. Поэтому в норму попадает и
            холодная вода.
          try: >-
            Норма — это «не меньше 24 **и** не больше 28»: нужны обе части сразу. Запиши условие
            через `and` или двойным сравнением `24 <= t <= 28`.
          verify: "В тесте «Пример 2: 20 градусов» должно получиться «Холодно»."
        - id: wrong-order
          when:
            failedTest: t2
            outputEquals: Норма
          why: >-
            20 градусов попали в норму: проверка «до 28» стоит первой и верна для любой холодной
            воды, поэтому до ветки «Холодно» дело не доходит. Цепочка выполняет первую подходящую
            ветку.
          try: >-
            Сначала отсеки холодную воду (`t < 24`), потом проверяй норму — или проверяй норму
            сразу с двух сторон: `24 <= t <= 28`.
          verify: "В тесте «Пример 2: 20 градусов» должно получиться «Холодно»."
        - id: wrong-order-high
          when:
            failedTest: t3
            outputEquals: Норма
          why: >-
            30 градусов попали в норму: проверка «от 24» стоит первой и верна для любой тёплой
            воды, поэтому до ветки «Жарко» дело не доходит. Цепочка выполняет первую подходящую
            ветку.
          try: >-
            Сначала отсеки жаркую воду (`t > 28`), потом проверяй норму — или проверяй норму сразу
            с двух сторон: `24 <= t <= 28`.
          verify: "В тесте «Пример 3: 30 градусов» должно получиться «Жарко»."
        - id: strict-low
          when:
            failedTest: t5
            outputEquals: Холодно
          why: >-
            Ровно 24 градуса — это уже норма: правило «от 24 до 28 включительно». А программа
            относит 24 к холодной воде — граница оказалась не в той ветке.
          try: Поменяй знак на границе 24 так, чтобы 24 попадало в «Норма», а 23.9 — всё ещё в «Холодно».
          verify: 24 — «Норма», 23.9 — «Холодно».
        - id: lost-24
          when:
            failedTest: t5
            outputEquals: Жарко
          why: >-
            Ровно 24 не попало ни в «Холодно», ни в «Норму»: `t < 24` для него ложно, и строгое
            `t > 24` (или `24 < t`) — тоже. Значение проваливается в `else` и получает «Жарко»,
            хотя по правилу 24 — это норма.
          try: >-
            В проверке нормы включи саму границу: `t >= 24` (или `24 <= t`) вместо `t > 24`. Если
            норма у тебя проверяется в `elif` после `if t < 24:`, нижнюю часть условия можно и
            вовсе не писать: `elif t <= 28:`.
          verify: 24 — «Норма», 28 — тоже «Норма».
        - id: strict-high
          when:
            failedTest: t6
            outputEquals: Жарко
          why: >-
            Ровно 28 градусов — ещё норма: «включительно» значит, что сама граница входит. А
            программа относит 28 к жаркой воде.
          try: Поменяй знак на границе 28 так, чтобы 28 попадало в «Норма», а 28.1 — уже в «Жарко».
          verify: 28 — «Норма», 28.1 — «Жарко».
        - id: gap
          when:
            outputEquals: Норма
            codeRegex: '[<>]=?\s*(?:23(?:\.\d+)?|29(?:\.\d+)?|28\.0*[1-9]\d*)(?![\d.])|(?<![\d.])(?:23(?:\.\d+)?|29(?:\.\d+)?|28\.0*[1-9]\d*)\s*[<>]'
          why: >-
            В условии стоит не та граница, что в правиле. Между 23 и 24 — и даже между 23.99 и
            24 — есть ещё дробные значения, например 23.999. Все они холоднее 24, а твоё условие
            отправляет часть из них в норму. Так же на верхней границе: 28.001 — уже жарко.
          try: >-
            Пиши в условии саму границу из правила — 24 и 28 — и выбирай знак: `t < 24` для
            холодной воды, `t <= 28` для нормы. Значения вроде 23.9 нужны для таблицы проверок, а
            не для условия.
          verify: 23.9 и 23.999 — «Холодно», 28.001 и 28.1 — «Жарко».
      afterPass: >-
        Граница проверена и снизу, и сверху, и дробными значениями. Улучшение, если в твоём коде
        его ещё нет: вынеси 24 и 28 в переменные, например `low = 24` и `high = 28`, — тогда
        правило для других рыбок меняется в одном месте.
      skills: [boundary-checks, conditions, boolean-logic]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - >-
        Граница — значение, на котором по правилу меняется ответ. Минимум — сама граница и значение
        сразу за ней (120 и 119), надёжнее — ещё и шаг внутрь (121). Для дробных значений шаг
        поменьше: 29.9 и 30.
      - >-
        «От», «не меньше», «включительно», «не больше» → `>=` или `<=`; «больше», «меньше», «до
        16:00, а в 16:00 уже нет» → `>` или `<`.
      - >-
        Таблицу «ввод — ожидаю — получилось» составляют до запуска и по правилу, а не по выводу
        программы.
      - >-
        Жалоба может быть про одну границу, а ошибки — на обеих: проверяй все границы правила.
    question: >-
      Правило магазина: скидка при покупке от 1000 рублей. Какие суммы ты проверишь и что
      ожидаешь для каждой?
    answer: >-
      999 — без скидки, 1000 — со скидкой: это граница и значение сразу за ней. Для надёжности —
      шаг внутрь, 1001, тоже со скидкой. Если суммы бывают с копейками, пригодится и 999.99. Ещё
      стоит проверить обычную сумму, например 500 или 3000, и крайнее значение 0.
