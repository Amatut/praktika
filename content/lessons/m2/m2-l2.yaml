      mistakes:
        - id: concat
          when:
            errorIncludes: can only concatenate
          why: >-
            Строку и число нельзя склеить через `+`: разность — число, а «Сдача: » — текст.
          try: >-
            Собери строку f-строкой: `f"Сдача: {paid - price}"` — число в фигурных скобках
            превращать не нужно.
          verify: Ошибка TypeError должна исчезнуть, а «Пример 1» — стать зелёным.
        - id: no-int
          when:
            errorType: TypeError
            errorIncludes: "'str'"
          why: >-
            `input()` возвращает строки. Вычитать строки нельзя, а строку с числом нельзя даже
            сравнить — отсюда TypeError.
          try: Преврати оба ввода в числа сразу при чтении — `int(input(...))`.
          verify: Ошибка TypeError должна исчезнуть, а «Пример 1» — стать зелёным.
        - id: swapped-input
          when:
            failedTest: t1
            outputEquals: "Не хватает: 150"
          why: >-
            Покупатель дал 500 за покупку в 350, а программа говорит, что не хватает 150. Чаще всего
            так бывает, когда числа перепутались при чтении: первая строка ввода — цена, вторая —
            сколько дал покупатель.
          try: >-
            Проверь порядок: сначала читается цена, потом сумма покупателя. Если порядок верный,
            прочитай вслух условие вместе со строкой под ним: когда дали не меньше цены, должна
            печататься сдача.
          verify: "В «Примере 1» должно получиться «Сдача: 150»."
        - id: both-printed
          when:
            outputIncludes: |-
              Сдача: 150
              Не хватает
          why: >-
            Напечатались обе строки. Второй `print` не входит в ветку `else`, поэтому выполняется
            всегда — и «Не хватает» появляется, даже когда денег хватило.
          try: Поставь `else:` перед вторым `print` и сдвинь его на 4 пробела вправо.
          verify: "В «Примере 1» должна остаться одна строка — «Сдача: 150»."
        - id: strict
          when:
            failedTest: t3
            outputEquals: "Не хватает: 0"
          why: >-
            Покупатель дал ровно 400 за покупку в 400 — денег хватает, сдача 0. А программа
            отправила равенство в ветку «Не хватает». Строгие знаки `>` и `<` равенство не включают
            (`400 > 400` и `400 < 400` — False), а `>=` и `<=` включают.
          try: >-
            Подставь 400 и 400 в своё условие и посмотри, какая строка напечатается. Если под `if`
            стоит «Сдача», вопрос должен быть «хватает ли денег?» — `paid >= price`. Если под `if`
            стоит «Не хватает», вопрос наоборот, «не хватает ли?», — строгий `paid < price`.
          verify: "Нажми «Проверить» — «Граничный случай: без сдачи» должен стать зелёным."
        - id: reversed
          when:
            failedTest: t1
            outputEquals: "Не хватает: -150"
          why: >-
            Покупатель дал 500 за покупку в 350, а программа ушла в ветку «Не хватает». Условие и
            строки под ним не сходятся: либо вопрос в `if` задан наоборот (например,
            `paid <= price`), либо строки под `if` и под `else` перепутаны местами.
          try: >-
            Прочитай вслух своё условие вместе со строкой под ним: «если дали … цены — печатаю …».
            Денег хватает, когда дали не меньше цены, — и тогда печатается сдача. Поправь что-то
            одно: знак или порядок строк в ветках.
          verify: "В «Примере 1» должно получиться «Сдача: 150»."
        - id: strings
          when:
            failedTest: t4
            outputEquals: "Сдача: -1"
          why: >-
            Покупатель дал 99 за покупку в 100, а программа выбрала ветку «Сдача». Так бывает, когда
            в `if` сравниваются строки из `input()`, а не числа: текст сравнивается по первому
            отличающемуся символу, «9» идёт после «1», и `"99" >= "100"` — True. `int()` в
            вычитании тут не помогает: ветка уже выбрана по тексту. Это ловушка из прогноза
            «Десять больше девяти?» в уроке 2.1.
          try: >-
            Преврати оба ввода в числа сразу при чтении — `int(input(...))`. Тогда и сравнение, и
            вычитание будут работать с числами.
          verify: "Нажми «Проверить» — «Граничный случай: на рубль меньше» должен стать зелёным."
        - id: negative-change
          when:
            outputIncludes: "Сдача: -"
          why: >-
            Сдача получилась отрицательной: из цены вычли сумму покупателя. Сдача — это сколько
            дали минус сколько стоит.
          try: >-
            Найди, где считается сдача, — прямо в строке «Сдача» или в переменной до `if`, — и
            поставь числа так: сначала сколько дали, потом цена.
          verify: "В «Примере 1» должно получиться «Сдача: 150»."
        - id: negative-lack
          when:
            outputIncludes: "Не хватает: -"
          why: >-
            Число после «Не хватает» получилось отрицательным. Сколько добавить — это цена минус
            то, что уже дали.
          try: >-
            В строке «Не хватает» напечатай цену минус то, что дали, — `price - paid`. Если разность
            «дали минус цена» посчитана заранее, до `if`, её не меняй: для сдачи она верна. В
            строке «Не хватает» просто поставь перед ней минус, например `{-change}`.
          verify: "В «Примере 2» должно получиться «Не хватает: 200»."
      afterPass: >-
        Касса не только выбирает сообщение, но и считает внутри ветки, а покупка без сдачи
        попадает в «хватает». Если хочешь, попробуй другой способ: посчитай разность один раз до
        `if`, сохрани её в переменную `change` и проверяй, не меньше ли она нуля.
      skills: [conditions, comparisons, type-conversion]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`if условие:` и блок с отступом 4 пробела; `else:` — «во всех остальных случаях». Из двух веток выполняется ровно одна."
      - "`else` можно не писать. Строки после блока — снова от левого края — выполняются всегда."
      - "Если программа с `if` не запускается, проверь три вещи: двоеточие в конце строки, отступ 4 пробела и `==` вместо `=` в условии."
    question: >-
      В программе из теории и `else:`, и `print("Хорошего дня!")` стоят от левого края. Почему
      «Можно читать дальше» печатается не всегда, а «Хорошего дня!» — всегда?
    answer: >-
      `else:` открывает ветку: строка под ним, с отступом, выполняется, только когда условие
      False. А `print("Хорошего дня!")` стоит после блока и не входит ни в одну ветку, поэтому
      выполняется при любом условии.
