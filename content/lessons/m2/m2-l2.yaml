id: m2-l2
module: m2
number: "2.2"
title: "if и else: программа выбирает"
objective: >-
  Писать ветвление if / else с двоеточием и отступами, понимать, какие строки входят в блок, и
  исправлять ошибки SyntaxError и IndentationError в условиях.
minutes: [25, 30]
prerequisites: [m2-l1]
skills: [conditions, comparisons]
environment: python

story:
  title: Записки из библиотеки
  fictional: true
  text: >-
    Каждую пятницу школьный библиотекарь Вера Павловна перебирала формуляры: если книга у
    читателя дольше 14 дней, она писала записку «Пора вернуть книгу». Формуляров больше трёхсот,
    и к концу пачки она начинала путаться: то писала записку на 12-й день, то пропускала книгу,
    которая лежала у читателя уже 20 дней. Девятиклассник Дима, который помогает в библиотеке,
    написал программу: вводишь, сколько дней книга у читателя, и программа сама выбирает, что
    напечатать. Внутри у неё одно правило из двух частей, «если» и «иначе», — как в
    обычной речи. Сегодня ты научишь выбирать и свою программу.

why: >-
  Программа должна по-разному вести себя в разных ситуациях: напомнить о книге или промолчать,
  пустить или отказать. Например, турникет в метро: денег на карте хватает — открыть проход,
  иначе — показать «Недостаточно средств». `if` и `else` выбирают одну из двух дорог.

usedIn: >-
  Вход в приложения и на сайты (верный пароль — пустить, иначе — сообщение об ошибке), бесплатная
  доставка в интернет-магазине от определённой суммы заказа, предупреждение «Заряд меньше 20 %» в
  телефоне, напоминания о сроках в учётных программах.

steps:
  - id: idea
    type: theory
    title: Если… иначе…
    body: |-
      До сих пор программа выполняла все строки подряд, сверху вниз. Теперь она научится выбирать,
      какие строки выполнить, а какие пропустить.

      ```python
      days = int(input())
      if days > 14:
          print("Пора вернуть книгу")
      else:
          print("Можно читать дальше")
      print("Хорошего дня!")
      ```

      - **`if условие:`** — «если». Условие — сравнение из прошлого урока, оно даёт True или
        False. В конце строки обязательно **двоеточие**.
      - Строки под `if`, сдвинутые вправо на 4 пробела, — это **блок**, а сдвиг называется
        **отступом**. Блок выполняется, только если условие True. Он заканчивается там, где
        строка снова начинается от левого края.
      - **`else:`** — «иначе». Условия у него нет: только двоеточие и свой блок. Он выполняется,
        когда условие False. `else` пишут ровно под его `if`, без отступа. Блоки `if` и
        `else` называют **ветками**: из двух веток всегда выполняется **ровно одна**.
      - `else` можно не писать. Тогда при False блок `if` просто пропускается.
      - Строки после блока, снова от левого края, выполняются **всегда**: «Хорошего дня!»
        появится и при 20 днях, и при 3.

      Отступ в Python — не украшение: только по нему Python понимает, какие строки подчиняются
      условию. Если в редакторе тренажёра нажать Enter после строки с двоеточием, отступ обычно
      появится сам. Tab сдвигает строку вправо, Shift+Tab — обратно. Если отступ не появился
      (например, на телефоне), поставь 4 пробела вручную.

      **Три частые ошибки.** Python находит их ещё до запуска и не выполняет ни одной строки:

      - нет двоеточия — `SyntaxError: expected ':'` («ожидалось двоеточие»). То же сообщение
        будет, если дописать условие после `else`: двоеточие Python ждёт сразу после этого слова;
      - нет отступа — `IndentationError: expected an indented block after 'if' statement on line 2`
        («после if в строке 2 ожидался блок с отступом»);
      - одно `=` вместо `==` — `SyntaxError: invalid syntax. Maybe you meant '==' or ':=' instead
        of '='?` («может, ты имел в виду `==`?»). Одно `=` кладёт значение в переменную, а в
        условии нужен вопрос `==`. Второй вариант из подсказки, `:=`, нам не нужен.
    simpler: >-
      `if` — развилка на дороге. Условие верно — программа идёт по первой дорожке: строки с
      отступом под `if`. Неверно — по дорожке `else`. Потом дорожки снова сходятся в одну: строки
      после блока, опять от левого края, выполняются всегда.
    coach: >-
      Не уверен, что выполнится? Проведи взглядом по левому краю: строки с отступом подчиняются
      условию, а строки после блока, снова от края, выполняются всегда.

  - id: library
    type: example
    title: Записка от библиотеки
    body: >-
      Программа Димы. Число дней здесь записано прямо в коде, а не вводится, — так удобнее
      пробовать разные значения. Нажми «Запустить».
    code: |-
      days = 20
      if days > 14:
          print("Пора вернуть книгу")
          print("Библиотека ждёт тебя!")
      else:
          print("Можно читать дальше")
      print("Хорошего дня!")
    notes:
      - line: 1
        text: >-
          Сколько дней книга у читателя. В программе Димы это число вводит библиотекарь:
          `days = int(input())`.
      - line: 2
        text: >-
          Условие и двоеточие в конце. `days > 14` — вопрос из прошлого урока: при 20 ответ True.
      - line: 3
        text: >-
          Строки 3 и 4 сдвинуты на 4 пробела — это блок `if`. При True выполняются обе.
      - line: 5
        text: >-
          `else:` стоит ровно под `if`, без отступа. Его блок — строка 6: она выполняется, только
          когда условие False.
      - line: 7
        text: >-
          Строка снова начинается от левого края. Она не входит ни в один блок и выполняется
          всегда.
    tryIt: >-
      Замени 20 на 14, потом на 15 и запускай после каждой правки: где проходит граница между
      записками? Потом поставь 4 пробела перед последней строкой и снова запусти с 20 — куда
      пропало «Хорошего дня!»?
    coach: >-
      Запускай после каждой правки — так быстрее всего видно, какие строки подчиняются условию.

  - id: after-block
    type: predict
    title: Книга у читателя 14 дней
    prompt: Книга у читателя ровно 14 дней. Как думаешь, что выведет программа?
    code: |-
      days = 14
      if days > 14:
          print("Пора вернуть книгу")
      print("Спасибо, что читаешь!")
    options:
      - Пора вернуть книгу
      - Спасибо, что читаешь!
      - |-
        Пора вернуть книгу
        Спасибо, что читаешь!
      - Ничего не напечатается
    answer: Спасибо, что читаешь!
    explanation: >-
      `14 > 14` — False: 14 не больше самого себя. Поэтому блок `if` пропускается, и «Пора
      вернуть книгу» не печатается. Второй `print` стоит после блока, снова от левого края, — он
      не входит в блок и выполняется при любом условии. `else` здесь нет, и при False программа
      просто идёт дальше.
    coach: >-
      Сначала ответь на вопрос условия: 14 больше 14? Потом смотри на отступ: строка после
      блока, снова от левого края, выполняется всегда.

  - id: practice-raincoat
    type: exercise
    title: Практика 1
    exercise:
      id: m2-l2-e1
      kind: repeat
      title: Дождевик в поход
      statement: |-
        Перед походом Варя смотрит прогноз: если вероятность дождя 50 % или больше, она берёт
        дождевик. Напиши программу, которая читает вероятность дождя и печатает одну строку:

        ```text
        Бери дождевик
        ```

        или

        ```text
        Можно без дождевика
        ```
      input: Одна строка — вероятность дождя, целое число от 0 до 100 (без знака %).
      output: "Одна строка: `Бери дождевик` или `Можно без дождевика`."
      constraints:
        - Вероятность получай через `input()` и превращай в число.
        - Строку выбирай через `if` и `else`.
      starterCode: |
        # Прочитай вероятность дождя и преврати её в число

        # Если 50 или больше — напечатай «Бери дождевик»,
        # иначе — «Можно без дождевика»
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "80\n"
          expected: Бери дождевик
          compare: {ignoreSpaces: true}
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "20\n"
          expected: Можно без дождевика
          compare: {ignoreSpaces: true}
        - id: t3
          kind: io
          title: "Граничный случай: ровно 50 %"
          edge: true
          stdin: "50\n"
          expected: Бери дождевик
          compare: {ignoreSpaces: true}
        - id: t4
          kind: io
          title: "Граничный случай: 49 %"
          edge: true
          stdin: "49\n"
          expected: Можно без дождевика
          compare: {ignoreSpaces: true}
        - id: t5
          kind: io
          title: "Граничный случай: 0 %"
          edge: true
          stdin: "0\n"
          expected: Можно без дождевика
          compare: {ignoreSpaces: true}
        - id: t6
          kind: io
          title: "Граничный случай: 100 %"
          edge: true
          stdin: "100\n"
          expected: Бери дождевик
          compare: {ignoreSpaces: true}
      criteria:
        - При вероятности 50 % и больше программа печатает «Бери дождевик», при меньшей — «Можно без дождевика».
        - Ровно 50 % — это уже «Бери дождевик».
        - Печатается ровно одна строка.
      hints:
        - >-
          Какой вопрос решает, что печатать? Запиши его сравнением и подумай, в какую ветку должны
          попасть ровно 50 %. И в каком виде вероятность приходит из `input()`?
        - |-
          Тот же приём на другом примере — напоминание о зарядке телефона:

          ```python
          charge = int(input())
          if charge < 20:
              print("Пора зарядить телефон")
          else:
              print("Заряда хватает")
          ```
        - |-
          Каркас:

          ```text
          rain = int(input(...))
          if rain ... 50:
              print(...)
          else:
              print(...)
          ```

          Какой знак означает «50 или больше»?
      solution:
        code: |
          rain = int(input("Вероятность дождя, %: "))
          if rain >= 50:
              print("Бери дождевик")
          else:
              print("Можно без дождевика")
        explanation: >-
          `rain >= 50` — вопрос «50 или больше?». При True выполняется блок `if`, при False — блок
          `else`, поэтому печатается ровно одна строка. Знак `>=` включает границу: при ровно 50 %
          условие True. Можно было спросить и наоборот — `if rain < 50:` — и поменять строки в
          ветках местами.
      altSolutions:
        - code: |
            rain = int(input())
            if rain < 50:
                print("Можно без дождевика")
            else:
                print("Бери дождевик")
          note: Вопрос наоборот, ветки поменяны местами.
        - code: |
            rain = int(input())
            if rain > 49:
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Для целых чисел «больше 49» — то же, что «50 или больше».
        - code: |
            rain = int(input())
            if 50 <= rain:
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Число слева от знака.
        - code: |
            rain = int(input())
            if rain >= 50:
                print("Бери дождевик")
            if rain < 50:
                print("Можно без дождевика")
          note: Два отдельных if без else — условия не пересекаются, поэтому печатается одна строка.
        - code: |
            rain = float(input())
            if rain >= 50:
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: float вместо int — сравнение работает так же.
        - code: |
            rain = input()

            if int(rain)  >=  50 :
                print('Бери дождевик')
            else :
                print('Можно без дождевика')
          note: int() прямо в условии, лишние пробелы и пустая строка, одинарные кавычки.
        - code: |
            answer = "Можно без дождевика"
            if int(input("Шанс дождя, %: ")) >= 50:
                answer = "Бери дождевик"
            print(answer)
          note: Без else — значение по умолчанию, которое if заменяет.
        - code: |
            rain = int(input())
            if rain >= 50: print("Бери дождевик")
            else: print("Можно без дождевика")
          note: Блок в одной строке с if и с else.
        - code: |
            rain = int(input())
            if rain >= 50:
            	print("Бери дождевик")
            else:
            	print("Можно без дождевика")
          note: Отступ табуляцией.
      wrongSolutions:
        - code: |
            rain = int(input())
            if rain >= 50:
                print("Бери дождевик")
            else rain < 50:
                print("Можно без дождевика")
          note: Условие после else.
          expectMistake: else-condition
        - code: |
            rain = int(input())
            if rain => 50:
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Знак => вместо >=.
          expectMistake: wrong-sign
        - code: |
            rain = int(input())
            if rain >= 50
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Нет двоеточия после условия.
          expectMistake: colon
        - code: |
            rain = int(input())
            if rain >= 50:
            print("Бери дождевик")
            else:
            print("Можно без дождевика")
          note: Нет отступов в блоках.
          expectMistake: indent
        - code: |
            rain = input()
            if rain >= 50:
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Ввод не превращён в число.
          expectMistake: no-int
        - code: |
            rain = int(input())
            if rain >= "50":
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Число в условии записано в кавычках — это строка.
          expectMistake: no-int
        - code: |
            rain = int(input())
            if rain >= 50:
                print("Бери дождевик")
            print("Можно без дождевика")
          note: Нет else — вторая строка печатается всегда.
          expectMistake: both-printed
        - code: |
            rain = int(input())
            if rain <= 50:
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Знак смотрит не в ту сторону.
          expectMistake: reversed
        - code: |
            rain = int(input())
            if rain > 50:
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Строгий знак — ровно 50 % попадают не в ту ветку.
          expectMistake: strict
        - code: |
            rain = int(input())
            if rain <= 50:
                print("Можно без дождевика")
            else:
                print("Бери дождевик")
          note: Вопрос наоборот, но с нестрогим знаком — ровно 50 % попадают в «Можно без».
          expectMistake: strict
        - code: |
            rain = int(input())
            if 50 < rain:
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Число слева от знака, знак строгий.
          expectMistake: strict
        - code: |
            rain = int(input())
            if rain >= 50:
                print("Можно без дождевика")
            else:
                print("Бери дождевик")
          note: Знак верный, строки в ветках перепутаны местами.
          expectMistake: reversed
        - code: |
            rain = input()
            if rain >= "50":
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: После TypeError 50 взято в кавычки — сравниваются строки, ошибка только на 100 %.
          expectMistake: strings
        - code: |
            rain = input()
            if rain > "49":
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Строки сравниваются с другой границей — тоже ошибка только на 100 %.
          expectMistake: strings
        - code: |
            rain = int(input())
            if rain >= 50:
                print("Бери дождевик")
            if rain <= 50:
                print("Можно без дождевика")
          note: Два if вместо else, границы пересекаются — при 50 печатаются обе строки.
          expectMistake: both-printed
        - code: |
            rain = int(input())
            if rain >= 50:
                print("Бери дождевик")
            else if rain < 50:
                print("Можно без дождевика")
          note: else if вместо else.
          expectMistake: else-condition
        - code: |
            rain = int(input())
            if rain >= 0.5:
                print("Бери дождевик")
            else:
                print("Можно без дождевика")
          note: Граница записана долей, а ввод в процентах — отдельного разбора нет.
          expectMistake: null
      mistakes:
        - id: else-condition
          when:
            errorType: SyntaxError
            codeRegex: '^[ \t]*else[ \t]+[^:\s]'
          where: Строка с `else`
          why: >-
            После `else` условие не пишут. `else` и так значит «во всех остальных случаях» — когда
            условие в `if` оказалось False. Поэтому Python ждёт двоеточие сразу после слова `else`.
          try: Оставь в этой строке только `else:` — без сравнения.
          verify: Нажми «Проверить» — «Пример 2» (20 %) должен стать зелёным.
        - id: wrong-sign
          when:
            errorType: SyntaxError
            codeRegex: '=>|=<'
          why: >-
            Знаки «больше или равно» и «меньше или равно» пишут в одном порядке: сначала `>` или
            `<`, потом `=`. Запись `=>` Python не понимает — отсюда `invalid syntax`.
          try: Замени `=>` на `>=` (а `=<` — на `<=`).
          verify: Программа должна запуститься, а «Пример 1» (80 %) — стать зелёным.
        - id: colon
          when:
            errorIncludes: "expected ':'"
          why: >-
            `expected ':'` — «ожидалось двоеточие». Строка с `if` или `else` заканчивается
            двоеточием: так Python узнаёт, что дальше начинается блок.
          try: Найди строку из сообщения и поставь `:` в её конце.
          verify: Запусти снова — сообщение про двоеточие должно исчезнуть.
        - id: indent
          when:
            errorIncludes: expected an indented block
          why: >-
            `expected an indented block` — «ожидался блок с отступом». Строки, которые выполняются
            при условии, сдвигают на 4 пробела вправо. Без отступа Python не видит, что `print`
            относится к `if` или к `else`.
          try: Сдвинь `print` под `if` и `print` под `else` на 4 пробела вправо.
          verify: Программа должна запуститься, а «Пример 1» — стать зелёным.
        - id: no-int
          when:
            errorIncludes: not supported between instances
          why: >-
            Сравниваются значения разных типов — строка и число, а так нельзя. Чаще всего строка —
            это ответ `input()`: он всегда текст, даже если ввели цифры.
          try: >-
            Преврати ввод в число сразу при чтении — `int(input(...))` — и сравнивай с числом без
            кавычек.
          verify: Ошибка TypeError должна исчезнуть, а «Пример 1» — стать зелёным.
        - id: both-printed
          when:
            outputEquals: |-
              Бери дождевик
              Можно без дождевика
          why: >-
            Напечатались обе строки — значит, выполнились оба `print`. Так бывает, если второй
            `print` стоит от левого края и не входит ни в один блок. Или если вместо `else` написан
            второй `if` и его условие пересекается с первым: при 50 верны и `rain >= 50`, и
            `rain <= 50`.
          try: >-
            Если второй `print` стоит от левого края, поставь перед ним `else:` и сдвинь его на
            4 пробела. Если это второй `if`, замени его строку на `else:` — тогда выполнится ровно
            одна ветка.
          verify: Нажми «Проверить» — в каждом тесте должна печататься одна строка.
        - id: reversed
          when:
            failedTest: t1
            outputEquals: Можно без дождевика
          why: >-
            При 80 % программа советует идти без дождевика — значит, 80 попадает не в ту ветку.
            Условие и строки под ним не сходятся: либо знак сравнения смотрит не в ту сторону
            (например, `<=` вместо `>=`), либо строки под `if` и под `else` перепутаны местами.
          try: >-
            Прочитай вслух своё условие вместе со строкой под ним: «если вероятность … 50 — печатаю
            …». Совпадает с правилом «50 или больше — бери дождевик»? Если нет, поправь что-то
            одно: знак или порядок строк в ветках.
          verify: Нажми «Проверить» — «Пример 1» (80 %) и «Пример 2» (20 %) должны стать зелёными.
        - id: strict
          when:
            failedTest: t3
            outputEquals: Можно без дождевика
          why: >-
            При ровно 50 % дождевик нужно брать: «50 или больше» включает 50. А программа отправила
            50 в ветку «Можно без дождевика» — граница попала не туда. Строгие знаки `>` и `<` саму
            границу не включают (`50 > 50` и `50 < 50` — False), а `>=` и `<=` включают.
          try: >-
            Подставь 50 в своё условие и посмотри, какая строка напечатается. Если под `if` стоит
            «Бери дождевик», вопрос должен быть «50 или больше?» — `rain >= 50`. Если под `if`
            стоит «Можно без дождевика», вопрос наоборот, «меньше 50?», — строгий `rain < 50`.
          verify: "Нажми «Проверить» — «Граничный случай: ровно 50 %» должен стать зелёным."
        - id: strings
          when:
            failedTest: t6
            outputEquals: Можно без дождевика
          why: >-
            При 100 % программа советует идти без дождевика, хотя 80 % и ровно 50 % работают
            верно. Так бывает, когда сравниваются две строки, а не два числа: ответ `input()` без
            `int()` и граница в кавычках. Текст Python сравнивает по первому отличающемуся символу:
            «1» идёт раньше «5», поэтому `"100" >= "50"` — False. Это ловушка из прогноза «Десять
            больше девяти?» в уроке 2.1.
          try: Преврати ввод в число — `int(input(...))` — и пиши границу в условии без кавычек.
          verify: "Нажми «Проверить» — «Граничный случай: 100 %» должен стать зелёным."
      afterPass: >-
        Программа выбирает одну из двух строк, и ровно 50 % попадают туда, куда нужно. Попробуй:
        убери `else:` вместе со вторым `print`, впиши 20 в поле «Ввод для „Запустить“» и нажми
        «Запустить». Что напечатается, когда условие False, а `else` нет?
      skills: [conditions, comparisons, type-conversion]

  - id: practice-quiz
    type: exercise
    title: Практика 2
    exercise:
      id: m2-l2-e2
      kind: fix
      title: Викторина не запускается
      statement: |-
        Программа-викторина спрашивает столицу Франции, но не запускается. Прочитай сообщение
        Python, исправь ошибку и запусти снова. Ошибок может быть больше одной, а Python
        показывает их по одной за запуск.

        На ответ «Париж» программа должна печатать `Верно!`, на любой другой — `Неверно, это
        Париж`.

        Ответ сравнивается точно, символ в символ: засчитывается только «Париж» с большой буквы, а
        «париж» — нет. Так и задумано: сравнивать ответы без учёта больших и маленьких букв
        научимся в модуле 4.
      input: Одна строка — ответ на вопрос.
      output: "Одна строка: `Верно!` или `Неверно, это Париж`."
      constraints:
        - Исправь ошибки в этой программе, не переписывая её целиком.
      starterCode: |
        answer = input("Столица Франции? ")
        if answer = "Париж":
            print("Верно!")
        else:
        print("Неверно, это Париж")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "Париж\n"
          expected: Верно!
          compare: {ignoreSpaces: true}
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "Лондон\n"
          expected: Неверно, это Париж
          compare: {ignoreSpaces: true}
        - id: t3
          kind: io
          title: "Граничный случай: пустой ответ"
          edge: true
          stdin: "\n"
          expected: Неверно, это Париж
          compare: {ignoreSpaces: true}
        - id: t4
          kind: io
          title: "Граничный случай: с маленькой буквы"
          edge: true
          stdin: "париж\n"
          expected: Неверно, это Париж
          compare: {ignoreSpaces: true}
      criteria:
        - Программа запускается без ошибок.
        - На «Париж» печатает «Верно!», на любой другой ответ — «Неверно, это Париж».
        - Печатается ровно одна строка.
      hints:
        - >-
          Нажми «Запустить» и прочитай последнюю строку сообщения: тип ошибки и номер строки.
          Исправь только эту причину и запусти снова — следующее сообщение покажет следующую
          ошибку.
        - |-
          Две вещи на другом примере. `x = 5` кладёт 5 в переменную, а `x == 5` спрашивает «равно
          ли?». И блок под `else:` сдвигают так же, как под `if`:

          ```python
          if x == 5:
              print("пять")
          else:
              print("не пять")
          ```
        - >-
          В строке 2 замени `=` на `==`. Строку 5 сдвинь на 4 пробела вправо — ровно под
          `print("Верно!")`.
      solution:
        code: |
          answer = input("Столица Франции? ")
          if answer == "Париж":
              print("Верно!")
          else:
              print("Неверно, это Париж")
        explanation: >-
          Первая ошибка — одно `=` в строке 2: оно кладёт значение в переменную, а в условии нужен
          вопрос `==`. Python сам подсказал это: `Maybe you meant '=='`. Когда её исправили, Python
          нашёл следующую — `IndentationError` в строке 5: у `else` не было блока. Строка с
          отступом 4 пробела стала блоком `else`. Две ошибки — два запуска, и каждый раз одна
          причина.
      altSolutions:
        - code: |
            answer = input("Столица Франции? ")
            if "Париж" == answer:
                print("Верно!")
            else:
                print("Неверно, это Париж")
          note: Строка слева от ==.
        - code: |
            answer = input("Столица Франции? ")
            if answer != "Париж":
                print("Неверно, это Париж")
            else:
                print("Верно!")
          note: Вопрос «не равно?», ветки поменяны местами.
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж":
                print("Верно!")
            else:
              print("Неверно, это Париж")
          note: Отступ в блоке else — 2 пробела; у каждого блока свой отступ, Python это принимает.
        - code: |
            answer = input()

            if answer == 'Париж':
                    print('Верно!')
            else:
                    print('Неверно, это Париж')
          note: Без подсказки в input, одинарные кавычки, отступ 8 пробелов, пустая строка.
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж":
            	print("Верно!")
            else:
            	print("Неверно, это Париж")
          note: Отступ табуляцией.
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж": print("Верно!")
            else: print("Неверно, это Париж")
          note: Блок в одной строке с if и с else.
      wrongSolutions:
        - code: |
            answer = input("Столица Франции? ")
            if answer = "Париж":
                print("Верно!")
            else:
            print("Неверно, это Париж")
          note: Ничего не исправлено.
          expectMistake: assign
        - code: |
            answer = input("Столица Франции? ")
            if answer = "Париж":
                print("Верно!")
            else:
                print("Неверно, это Париж")
          note: Исправлен только отступ.
          expectMistake: assign
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж":
                print("Верно!")
            else:
            print("Неверно, это Париж")
          note: Исправлено только ==.
          expectMistake: indent
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж":
                print("Верно!")
                else:
                print("Неверно, это Париж")
          note: Отступ поставлен не той строке — else оказался внутри блока if.
          expectMistake: else-indented
        - code: |
            answer = input("Столица Франции? ")
            if answer := "Париж":
                print("Верно!")
            else:
                print("Неверно, это Париж")
          note: ":= из подсказки Python вместо ==."
          expectMistake: walrus
        - code: |
            answer = input("Столица Франции? ")
            if answer == Париж:
                print("Верно!")
            else:
                print("Неверно, это Париж")
          note: Париж без кавычек.
          expectMistake: no-quotes
        - code: |
            answer = input("Столица Франции? ")
            if answer == "париж":
                print("Верно!")
            else:
                print("Неверно, это Париж")
          note: В условии ответ с маленькой буквы.
          expectMistake: changed-answer
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж":
                print("Неверно, это Париж")
            else:
                print("Верно!")
          note: Ветки перепутаны местами — разбор про изменённый ответ срабатывать не должен.
          expectMistake: null
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж":
                print("Верно!")
          note: else и последняя строка удалены.
          expectMistake: else-removed
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж":
                print("Верно!")
            print("Неверно, это Париж")
          note: Удалён только else — строка «Неверно» печатается всегда.
          expectMistake: both-printed
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж":
                print("Верно!")
                print("Неверно, это Париж")
          note: else удалён, а строка «Неверно» сдвинута в блок if.
          expectMistake: both-printed
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж":
            print("Верно!")
            else:
                print("Неверно, это Париж")
          note: >-
            Отступ поставлен строке 5, но снят со строки 3 — Python пишет про if в строке 2,
            разбор про else срабатывать не должен.
          expectMistake: null
        - code: |
            answer = input("Столица Франции? ")
            if answer == "Париж ":
                print("Верно!")
            else:
                print("Неверно, это Париж")
          note: Лишний пробел внутри кавычек.
          expectMistake: changed-answer
        - code: |
            answer = input("Столица Франции? ")
            if answer != "Париж":
                print("Верно!")
            else:
                print("Неверно, это Париж")
          note: Знак != вместо ==, а ветки не поменяны местами — общий разбор.
          expectMistake: null
      mistakes:
        - id: assign
          when:
            errorIncludes: Maybe you meant '=='
          where: Строка 2, условие после `if`
          why: >-
            `Maybe you meant '=='` — «может, ты имел в виду `==`?». Одно `=` кладёт значение в
            переменную, а в условии нужен вопрос «равно ли?» — два знака `==`.
          try: >-
            Замени в строке 2 `=` на `==` и запусти снова. Если появится новое сообщение — это
            следующая ошибка, прочитай и её.
          verify: Сообщение про строку 2 должно исчезнуть.
        - id: else-indented
          when:
            errorType: SyntaxError
            codeRegex: '^[ \t]+else\b'
          where: Строка с `else`
          why: >-
            `else` сдвинут вправо и оказался внутри блока `if`. Так Python не может найти, к какому
            `if` он относится, — отсюда `invalid syntax`. Отступ нужен строке под `else`, а не
            самому `else`.
          try: >-
            Поставь `else:` ровно под `if`, от левого края, а строку `print("Неверно, это Париж")`
            под ним сдвинь на 4 пробела.
          verify: Программа должна запуститься, а на «Лондон» — напечатать «Неверно, это Париж».
        - id: indent
          when:
            errorIncludes: "expected an indented block after 'else'"
          why: >-
            `expected an indented block after 'else' statement on line 4` — «после else в строке 4
            ожидался блок с отступом». Строка 5 стоит от левого края, и у `else` нет ни одной своей
            строки.
          try: Сдвинь строку 5 на 4 пробела вправо — ровно под `print("Верно!")`.
          verify: Программа должна запуститься, а на «Лондон» — напечатать «Неверно, это Париж».
        - id: walrus
          when:
            codeIncludes: ":="
          why: >-
            `:=` — не сравнение: он кладёт значение в переменную прямо внутри условия. Теперь в
            `answer` всегда лежит «Париж», и программа хвалит любой ответ. В курсе `:=` не нужен.
          try: 'Для вопроса «равно ли?» нужны два знака равенства: `answer == "Париж"`.'
          verify: Нажми «Проверить» — на «Лондон» программа должна ответить «Неверно, это Париж».
        - id: no-quotes
          when:
            errorType: NameError
            codeRegex: '==[ \t]*[А-ЯЁа-яё]'
          why: >-
            Без кавычек Python считает «Париж» именем переменной, а такой переменной нет. Текст, с
            которым сравнивают ответ, пишут в кавычках.
          try: 'Верни кавычки: `answer == "Париж"`.'
          verify: Ошибка NameError должна исчезнуть.
        - id: changed-answer
          when:
            failedTest: t1
            outputEquals: Неверно, это Париж
            codeRegex: '^[ \t]*if\b(?![^\n]*["'']Париж["''])'
          why: >-
            На ответ «Париж» программа говорит «Неверно». Похоже, в условии теперь другой текст.
            Строки сравниваются точно: «париж» с маленькой буквы или с пробелом — не то же самое,
            что «Париж».
          try: Сравнивай ответ ровно с «Париж» — с большой буквы и без пробелов.
          verify: Нажми «Проверить» — «Пример 1» должен стать зелёным.
        - id: else-removed
          when:
            failedTest: t2
            outputEquals: ""
          why: >-
            При неверном ответе программа молчит: ветка «иначе» пропала вместе с `else`. Исправить
            нужно было отступ, а не удалять строки.
          try: >-
            Верни `else:` под `if` и строку `print("Неверно, это Париж")` под ним — с отступом
            4 пробела.
          verify: Нажми «Проверить» — «Пример 2» (Лондон) должен стать зелёным.
        - id: both-printed
          when:
            outputEquals: |-
              Верно!
              Неверно, это Париж
          why: >-
            Напечатались обе строки. У строки «Неверно, это Париж» больше нет своего `else`,
            поэтому она выполняется и при верном ответе.
          try: Верни `else:` перед этой строкой и сдвинь её на 4 пробела вправо.
          verify: В «Примере 1» должна остаться одна строка — «Верно!».
      afterPass: >-
        Ты исправил две ошибки по сообщениям Python — по одной за запуск. В строке 2 Python сам
        подсказал `==`, а в строке 5 назвал, какому блоку не хватает отступа. Принимать ответ и с
        маленькой буквы научимся в модуле 4.
      skills: [conditions, comparisons, read-errors]

  - id: practice-change
    type: exercise
    title: Практика 3
    exercise:
      id: m2-l2-e3
      kind: write
      title: Сдача на ярмарке
      statement: |-
        На школьной ярмарке продают выпечку и поделки, а сдачу считает программа. Она читает цену
        покупки и сумму, которую дал покупатель. Если денег хватает, программа печатает, сколько
        сдачи вернуть, иначе — сколько не хватает. Например, покупка стоит 350, а покупатель дал
        500:

        ```text
        Сдача: 150
        ```

        А если покупка стоит 500, а дали 300:

        ```text
        Не хватает: 200
        ```

        Сумму выводи числом, без «руб.».
      input: Две строки — цена покупки, затем сумма, которую дал покупатель (целые числа).
      output: "Одна строка: `Сдача: <число>` или `Не хватает: <число>`."
      constraints:
        - Цену и сумму получай через `input()`.
        - Печатается одна строка — выбор через `if` и `else`.
      starterCode: |
        # Прочитай цену покупки и сумму, которую дал покупатель

        # Если денег хватает — выведи сдачу, иначе — сколько не хватает
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "350\n500\n"
          expected: "Сдача: 150"
          compare: {ignoreSpaces: true}
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "500\n300\n"
          expected: "Не хватает: 200"
          compare: {ignoreSpaces: true}
        - id: t3
          kind: io
          title: "Граничный случай: без сдачи"
          edge: true
          stdin: "400\n400\n"
          expected: "Сдача: 0"
          compare: {ignoreSpaces: true}
        - id: t4
          kind: io
          title: "Граничный случай: на рубль меньше"
          edge: true
          stdin: "100\n99\n"
          expected: "Не хватает: 1"
          compare: {ignoreSpaces: true}
        - id: t5
          kind: io
          title: "Граничный случай: на рубль больше"
          edge: true
          stdin: "100\n101\n"
          expected: "Сдача: 1"
          compare: {ignoreSpaces: true}
        - id: t6
          kind: io
          title: Крупная купюра
          stdin: "120\n1000\n"
          expected: "Сдача: 880"
          compare: {ignoreSpaces: true}
      criteria:
        - Программа читает сначала цену, потом сумму покупателя.
        - "Если денег хватает, печатает «Сдача: …», иначе — «Не хватает: …»; числа не бывают отрицательными."
        - "Если дали ровно столько, сколько стоит покупка, денег хватает: «Сдача: 0»."
        - Печатается ровно одна строка.
      hints:
        - >-
          Ветку выбирает вопрос «хватает ли денег?». Запиши его сравнением двух чисел. Что должно
          получиться, если дали ровно столько, сколько стоит покупка? И в каком виде числа приходят
          из `input()`?
        - |-
          Внутри ветки можно считать. Например, сколько останется на карте после оплаты:

          ```python
          if balance >= cost:
              print(f"Останется: {balance - cost}")
          ```

          В этой ветке баланс не меньше стоимости, поэтому из большего числа вычитается меньшее и
          ответ не уходит в минус. Подумай, какое число больше в каждой из твоих веток.
        - |-
          Каркас:

          ```text
          цена = int(input(...))
          дали = int(input(...))
          if дали ... цена:
              print(f"Сдача: {...}")
          else:
              print(f"Не хватает: {...}")
          ```

          В ветке «Сдача» больше то, что дали, а в ветке «Не хватает» — цена. Из большего числа
          вычитай меньшее.
      solution:
        code: |
          price = int(input("Цена: "))
          paid = int(input("Дали: "))
          if paid >= price:
              print(f"Сдача: {paid - price}")
          else:
              print(f"Не хватает: {price - paid}")
        explanation: >-
          Вопрос `paid >= price` — «хватает ли денег?». Знак `>=` включает равенство, поэтому при
          400 и 400 получается «Сдача: 0». В каждой ветке своя разность: сдача — сколько дали
          минус цена, нехватка — цена минус сколько дали. Так число всегда получается
          неотрицательным. Разность можно посчитать и заранее, до `if`, и проверять её знак.
