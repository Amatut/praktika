      mistakes:
        - id: no-int
          when:
            errorIncludes: "not supported between instances of"
            codeRegex: '(?<![\s\S])(?![\s\S]*\b(?:int|float)\s*\()'
          where: Первое сравнение возраста
          why: >-
            Возраст остался строкой: `input()` всегда возвращает текст. Сравнить текст `"30"` с
            числом `7` через `<` Python не может — отсюда TypeError.
          try: Преврати возраст в число сразу при вводе — `int(input(...))`.
          verify: 'Ошибка TypeError должна исчезнуть, а в «Примере 1» — появиться «К оплате: 350».'
        - id: age-as-text
          when:
            codeRegex: '(?<![\s\S])(?![\s\S]*\b(?:int|float)\s*\()[\s\S]*?(?:(?:<|>)=?\s*["'']\d|["'']\d+["'']\s*(?:<|>))'
          where: Сравнения возраста
          why: >-
            Возраст остался строкой, а числа в сравнениях взяты в кавычки, поэтому Python
            сравнивает текст — по первому отличающемуся символу. `"30" < "7"` — True: символ «3»
            идёт раньше «7». Ошибки Python не сообщает, но возраст попадает не в ту группу.
          try: 'Сравнивай числа: `age = int(input(...))`, а 7, 17 и 65 пиши без кавычек.'
          verify: 'В «Примере 1» должно получиться «К оплате: 350».'
        - id: day-first
          when:
            errorType: ValueError
          why: >-
            В `int()` попал день недели, например `ср`, — а это не число, поэтому ValueError.
            Первой строкой ввода приходит возраст, второй — день.
          try: >-
            Читай сначала возраст через `int(input(...))`, потом день через `input()` — без
            `int()`: день остаётся строкой.
          verify: В «Примере 1» программа не должна падать.
        - id: day-no-quotes
          when:
            errorType: NameError
            codeRegex: '==\s*(?:сб|вс)'
          where: Условие надбавки за выходной
          why: >-
            Python не знает имени `сб`: без кавычек это имя переменной, а не текст. День из ввода —
            строка, и сравнивать его нужно со строкой.
          try: 'Возьми дни в кавычки: `day == "сб"`.'
          verify: Ошибка NameError должна исчезнуть.
        - id: free-then-price
          when:
            errorType: NameError
            outputIncludes: Бесплатно
          why: >-
            Для малыша программа напечатала «Бесплатно», но не остановилась: дальше она дошла до
            строки с ценой, а переменная с ценой в бесплатной ветке так и не появилась — отсюда
            NameError.
          try: >-
            Сделай так, чтобы после «Бесплатно» программа не доходила до надбавки и второго
            `print`: печатай цену внутри платных веток — или задай в бесплатной ветке цену 0 и в
            конце выбирай, что печатать.
          verify: В «Примере 3» должна быть одна строка — «Бесплатно».
        - id: or-string
          when:
            failedTest: t1
            codeRegex: '\bor\s+["''][^"''\n]*["''](?!\s*[=!<>])'
          where: Условие надбавки за выходной
          why: >-
            В среду программа насчитала надбавку за выходной. Справа от `or` стоит не сравнение, а
            просто строка `"вс"`, а непустая строка в условии считается истинной. Поэтому условие
            верно в любой день.
          try: 'Запиши обе части полностью: `day == "сб" or day == "вс"`.'
          verify: 'В «Примере 1» (среда) должно получиться «К оплате: 350».'
        - id: or-number
          when:
            failedTest: t1
            codeRegex: '\bor\s+\d+\s*(?:\)|:|or\b|and\b)'
          where: Условие льготного билета
          why: >-
            Справа от `or` стоит просто число, а не сравнение. Число, кроме 0, в условии считается
            истинным, поэтому такое условие верно для всех, кто до него дошёл, — например, для
            тридцатилетнего из «Примера 1».
          try: 'Запиши обе части полностью: `age <= 17 or age >= 65`.'
          verify: 'В «Примере 1» должно получиться «К оплате: 350».'
        - id: and-days
          when:
            failedTest: t2
            codeRegex: '["''](?:сб|вс)["'']\s*(?:==\s*\w+\s*)?and\s+(?:\w+\s*==\s*)?["''](?:сб|вс)["'']'
          where: Условие надбавки за выходной
          why: >-
            Дни соединены через `and`: «день — суббота и одновременно воскресенье». Так не бывает,
            поэтому надбавка не срабатывает никогда. В правиле «в субботу и воскресенье» по-русски
            стоит «и», но значит оно «в субботу или в воскресенье».
          try: Соедини проверки дней через `or`, а если рядом стоит ещё и `and` — возьми их в скобки.
          verify: 'В «Примере 2» (суббота) должно получиться «К оплате: 250».'
        - id: weekend-in-chain
          when:
            failedTest: t2
            codeRegex: '^if\b(?![^\n]*["''](?:сб|вс)["''])[^\n]*\d[^\n]*\n(?:(?:[ \t][^\n]*|elif\b[^\n]*|else\b[^\n]*)?\n)*?elif\b[^\n]*["''](?:сб|вс)["'']'
          where: Цепочка проверок возраста
          why: >-
            Выходной стоит веткой `elif` в той же цепочке, что и возраст. В цепочке выполняется
            только одна ветка, поэтому школьник в субботу получает либо льготу, либо надбавку, но не
            обе сразу.
          try: >-
            Убери выходной из цепочки: сначала цепочкой выбери цену по возрасту, потом отдельным
            `if` прибавь 50, если билет платный и день — выходной.
          verify: 'В «Примере 2» должно получиться «К оплате: 250».'
        - id: discount-missed
          when:
            failedTest: t2
            outputEquals: "К оплате: 400"
          where: Условие льготного билета
          why: >-
            Десятилетний гость в субботу заплатил 400, как взрослый: льгота не сработала. Если в
            её условии между «до 17» и «от 65» стоит `and`, оно не выполнится ни для кого: возраст
            не может быть сразу не больше 17 и не меньше 65. «Школьники и пенсионеры» в правиле
            значит «или школьник, или пенсионер».
          try: Соедини две возрастные группы льготы через `or` и проверь, что обе в условии есть.
          verify: 'В «Примере 2» должно получиться «К оплате: 250».'
        - id: two-lines
          when:
            outputIncludes: "Бесплатно\nК оплате"
          why: >-
            Для малыша программа напечатала две строки: «Бесплатно» и цену. После ветки
            «Бесплатно» программа дошла до второго `print`: он стоит в отдельном `if` или после
            цепочки и выполняется для всех — и для малыша тоже.
          try: >-
            Печатай один раз в конце: если цена 0 — «Бесплатно», иначе — «К оплате:» и цену. Или
            печатай цену внутри платных веток одной цепочки `if / elif / else`, а не после неё.
          verify: В «Примере 3» должна быть одна строка — «Бесплатно».
        - id: free-surcharge
          when:
            failedTest: t3
            outputEquals: "К оплате: 50"
          where: Условие надбавки за выходной
          why: >-
            Малыш в воскресенье получил «К оплате: 50» — надбавка прибавилась к бесплатному
            билету. Причин две. Либо в условии надбавки нет проверки, что билет платный. Либо нет
            скобок: когда `and` и `or` стоят рядом, `and` выполняется раньше. Например,
            `price > 0 and day == "сб" or day == "вс"` Python читает как
            `(price > 0 and day == "сб") or day == "вс"`.
          try: >-
            Прибавляй 50, только если билет платный и день — выходной: `price > 0 and (… or …)`.
          verify: В «Примере 3» должно получиться «Бесплатно».
        - id: free-surcharge-sat
          when:
            failedTest: t13
            outputEquals: "К оплате: 50"
          where: Условие надбавки за выходной
          why: >-
            Малыш в субботу получил «К оплате: 50» — надбавка прибавилась к бесплатному билету.
            Похоже, не хватает скобок: когда `and` и `or` стоят рядом, `and` выполняется раньше.
            Например, `day == "сб" or day == "вс" and price > 0` Python читает как
            `day == "сб" or (day == "вс" and price > 0)`, и в субботу проверка цены не работает.
          try: >-
            Возьми дни в скобки: `price > 0 and (… or …)` — тогда проверка цены относится к обоим
            дням.
          verify: 'В тесте «Граничный случай: малыш до года в субботу» должно получиться «Бесплатно».'
        - id: free-after-discount
          when:
            failedTest: t3
            outputEquals: "К оплате: 250"
          where: Порядок проверок возраста
          why: >-
            Пятилетний малыш получил льготный билет вместо бесплатного. Условие `age <= 17` верно и
            для 5 лет: льготная проверка — общая, бесплатная — частная. Либо льготная стоит в
            цепочке раньше бесплатной, либо проверки — отдельные `if`, и льготная перезаписывает
            уже выбранную цену 0, либо бесплатной проверки в коде нет совсем.
          try: >-
            Поставь бесплатную проверку первой в цепочке `if / elif / else` — тогда до льготы
            дойдут только те, кому уже есть 7.
          verify: В «Примере 3» должно получиться «Бесплатно».
        - id: free-as-zero
          when:
            outputEquals: "К оплате: 0"
          why: >-
            Для малыша программа печатает цену 0, а по условию нужно слово «Бесплатно». Цена
            посчитана верно — не хватает выбора, что печатать.
          try: >-
            В конце проверь цену: если она равна 0 — печатай «Бесплатно», иначе — «К оплате:» и
            цену.
          verify: В «Примере 3» должно получиться «Бесплатно».
        - id: sum-not-saved
          when:
            failedTest: t2
            codeRegex: '^\s*(?:\w+\s*==\s*)?\w+\s*\+\s*50\s*$'
          where: Строка с надбавкой
          why: >-
            Python посчитал сумму, но никуда её не записал: строка `price + 50` сама по себе цену не
            меняет, а `==` — это сравнение, а не запись. После такой строки в `price` лежит прежнее
            значение.
          try: 'Запиши результат обратно в переменную: `price = price + 50`.'
          verify: 'В «Примере 2» должно получиться «К оплате: 250».'
        - id: weekend-missed
          when:
            failedTest: t2
            outputEquals: "К оплате: 200"
          why: >-
            В субботу десятилетний гость должен заплатить 250: льготные 200 и 50 за выходной.
            Программа насчитала 200 — надбавка до льготного билета не дошла. Проверь по порядку:
            есть ли в коде правило выходных и написаны ли дни маленькими буквами (`"сб"`, а не
            `"Сб"`); стоит ли надбавка после выбора цены, а не до цепочки, которая потом
            перезапишет цену; не спрятана ли она только во взрослую ветку — льготный билет тоже
            платный.
          try: >-
            Прибавляй надбавку отдельным `if` после всей цепочки возраста: если билет платный и
            день — `"сб"` или `"вс"`, прибавь к цене 50.
          verify: 'В «Примере 2» должно получиться «К оплате: 250».'
        - id: adult-first
          when:
            failedTest: t4
            outputEquals: "К оплате: 350"
          where: Порядок проверок возраста
          why: >-
            70-летний гость получил взрослый билет — как в разминке. Либо проверка «от 18» стоит
            раньше пенсионной и перехватывает всех старше 18, либо правила «от 65 лет — 200» в
            коде нет.
          try: >-
            Поставь проверку «от 65» раньше общей взрослой ветки — или объедини её с детской
            льготой через `or`: цена у них одна.
          verify: 'В тесте «Обычный случай: 70 лет, понедельник» должно получиться «К оплате: 200».'
        - id: sunday-forgotten
          when:
            failedTest: t5
            codeRegex: '^(?<![\s\S])(?![\s\S]*(?:==\s*["'']вс["'']|["'']вс["'']\s*==))'
            outputEquals: "К оплате: 350"
          where: Условие надбавки за выходной
          why: >-
            В воскресенье взрослый заплатил 350, как в будний день. Похоже, надбавка проверяет
            только субботу, а воскресенье — тоже выходной.
          try: 'Проверяй оба дня: `day == "сб" or day == "вс"`.'
          verify: 'В тесте «Обычный случай: 30 лет, воскресенье» должно получиться «К оплате: 400».'
        - id: boundary-7
          when:
            failedTest: t7
            outputEquals: Бесплатно
          why: >-
            «Младше 7 лет» — значит, 7 в эту группу не входит: семилетний уже платит. Сейчас
            программа пускает его бесплатно — граница сдвинулась: например, стоит `<= 7` вместо
            `< 7`.
          try: Поправь условие так, чтобы 6 лет было бесплатно, а 7 — уже нет.
          verify: >-
            В тесте «Граничный случай: ровно 7 лет» должно получиться «К оплате: 200», а в тесте
            «Граничный случай: 6 лет» — «Бесплатно».
        - id: boundary-7-paid
          when:
            failedTest: t7
            outputEquals: "К оплате: 350"
          why: >-
            Семилетний заплатил как взрослый. «От 7 лет» включает саму семёрку, а условие вроде
            `7 < age` её не пропускает: `7 < 7` — False. Семилетний не попал ни в бесплатную, ни в
            льготную группу.
          try: Поправь условие так, чтобы 7 входило в льготную группу — `7 <= age` или `age >= 7`.
          verify: 'В тесте «Граничный случай: ровно 7 лет» должно получиться «К оплате: 200».'
        - id: boundary-17
          when:
            failedTest: t8
            outputEquals: "К оплате: 350"
          why: >-
            «До 17 лет включительно» — значит, 17 входит в льготу. Сейчас семнадцатилетний платит
            350 — граница сдвинулась: например, стоит `< 17`, а `17 < 17` — False.
          try: Включи 17 в льготную группу — `<= 17` (или `< 18`).
          verify: 'Для 17 лет должно получиться «К оплате: 200», для 18 — «К оплате: 350».'
        - id: boundary-18
          when:
            failedTest: t9
            codeRegex: '<=\s*18\b|<\s*19\b|\b18\s*>=|\b19\s*>(?!=)'
            outputEquals: "К оплате: 200"
          why: >-
            Льгота — до 17 лет включительно, а восемнадцатилетний получил льготный билет. Похоже,
            граница сдвинулась на год дальше: стоит `<= 18`, а 18 в льготу уже не входит.
          try: Оставь в льготной группе возрасты до 17 включительно — `<= 17` (или `< 18`).
          verify: 'Для 18 лет должно получиться «К оплате: 350», для 17 — «К оплате: 200».'
        - id: boundary-65
          when:
            failedTest: t11
            outputEquals: "К оплате: 350"
          why: >-
            «От 65 лет» включает саму границу: 65-летний уже получает льготный билет. Сейчас он
            платит 350 — граница сдвинулась: например, стоит `> 65`, а `65 > 65` — False.
          try: 'Сделай так, чтобы 65 входило в льготную группу: `age >= 65`.'
          verify: 'Для 65 лет должно получиться «К оплате: 200», для 64 — «К оплате: 350».'
        - id: format
          when:
            failedTest: t1
            outputIncludes: "350"
          why: >-
            Число верное, но текст строки отличается от образца, а проверка сравнивает строку
            целиком.
          try: >-
            Сравни свою строку с образцом посимвольно: `К оплате: 350` — «К оплате», двоеточие,
            пробел, цена. Лишних строк быть не должно.
          verify: Вывод «Примера 1» должен совпасть с образцом.
      afterPass: >-
        Касса учитывает все правила и все границы: 6 и 7, 17 и 18, 64 и 65 лет — и в будни, и в
        выходные. Одно улучшение на будущее: первой веткой проверь неправдоподобный возраст — меньше
        0 или больше 120, — выведи «Проверь возраст» и сделай так, чтобы после этого программа больше
        ничего не печатала.
      skills: [conditions, boolean-logic, boundary-checks, comparisons]
      noHintsBeforeAttempt: true

  - id: find-bug
    type: exercise
    title: Ошибка в чужой кассе
    exercise:
      id: m2-l6-e2
      kind: read
      title: Касса велопроката
      statement: |-
        В прокате велосипедов правила такие:

        - до 30 минут включительно — бесплатно;
        - от 31 до 120 минут включительно — 100;
        - больше 120 минут — 250;
        - в субботу и воскресенье платная поездка дороже на 50.

        Коллега написал программу для кассы проката, но на одном значении минут она считает цену
        неверно — в любой день. Ввода здесь нет: меняй `minutes` и `day` прямо в коде, нажимай
        «Запустить» и сравнивай вывод с правилами. Найденное число минут запиши в `bad_minutes`.
        Исправлять программу не нужно. Бесплатную поездку программа печатает как «К оплате: 0» —
        так договорились, это не ошибка.

        Не угадывай: сначала составь таблицу проверок — какие значения минут стоят у границ правил
        и сколько по правилу стоит поездка для каждого.
      input: "Ввода нет: значения `minutes` и `day` меняются прямо в коде."
      output: Число в переменной `bad_minutes` — минуты, на которых программа ошибается.
      constraints:
        - Подсказки откроются после первой проверки — сначала попробуй сам.
        - Минуты — целое число, 0 или больше.
        - Программу исправлять не нужно — проверяется только `bad_minutes`.
      starterCode: |
        # Касса проката велосипедов (написал коллега)
        minutes = 45   # меняй и запускай
        day = "ср"     # "пн", "вт", "ср", "чт", "пт", "сб" или "вс" — в кавычках

        if minutes <= 30:
            price = 0
        elif minutes < 120:
            price = 100
        else:
            price = 250
        if price > 0 and (day == "сб" or day == "вс"):
            price = price + 50
        print("К оплате:", price)

        # Таблица проверок: минуты — ожидаю по правилу — получилось
        #

        bad_minutes = 0   # впиши сюда число минут, на котором программа ошибается
      tests:
        - id: t1
          kind: assert
          title: Найденное значение
          example: true
          code: assert bad_minutes == 120
          message: >-
            В `bad_minutes` должно быть число минут, на котором программа считает цену неверно.
      criteria:
        - В `bad_minutes` записано число без кавычек — минуты, на которых вывод программы расходится с правилами.
        - Программу исправлять не обязательно — проверяется только `bad_minutes`.
      hints:
        - >-
          Где программы с `<` и `<=` ошибаются чаще всего? Выпиши из правил числа, на которых
          меняется цена, и для каждого запиши, сколько должна стоить поездка по правилу, — ещё до
          запуска.
        - >-
          Пример из другой задачи: «посылка до 5 кг включительно — 200, тяжелее — 400». У границы
          проверяют три точки: 4 кг — 200, 5 кг — 200, 6 кг — 400. Если программа на 5 кг печатает
          400, ошибка найдена, даже когда на 4 и 6 кг всё верно. Так же проверь каждую границу
          правил проката.
        - >-
          Проверь в будний день по три значения у каждой границы: 29, 30, 31 и 119, 120, 121. Для
          каждого значения сравни вывод с ценой по правилу: где не совпало — там и ошибка.
      solution:
        code: |
          # Касса проката велосипедов (написал коллега)
          minutes = 120   # меняй и запускай
          day = "ср"      # "пн", "вт", "ср", "чт", "пт", "сб" или "вс" — в кавычках

          if minutes <= 30:
              price = 0
          elif minutes < 120:
              price = 100
          else:
              price = 250
          if price > 0 and (day == "сб" or day == "вс"):
              price = price + 50
          print("К оплате:", price)

          # Таблица проверок: минуты — ожидаю по правилу — получилось
          # 29  — 0   — 0
          # 30  — 0   — 0
          # 31  — 100 — 100
          # 119 — 100 — 100
          # 120 — 100 — 250  <- ошибка
          # 121 — 250 — 250

          bad_minutes = 120   # впиши сюда число минут, на котором программа ошибается
        explanation: >-
          При 120 минутах программа печатает «К оплате: 250», а по правилу поездка до 120 минут
          включительно стоит 100. Виноват знак `<` во второй проверке: `120 < 120` — False, и
          программа уходит в ветку «больше 120». При 29, 30, 31, 119 и 121 минуте программа права,
          внутри промежутков — тоже. Исправление — `minutes <= 120`.
