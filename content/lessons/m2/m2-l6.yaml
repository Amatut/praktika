  - id: recap
    type: recap
    title: Итоги и что повторить
    points:
      - >-
        Если обе задачи получились без подсказок и ты можешь ответить на вопрос ниже — модуль
        освоен: ты раскладываешь правила на проверки, ставишь их в нужном порядке и проверяешь
        границы. Дальше — циклы, модуль 3.
      - >-
        ValueError — в `int()` попал день недели: повтори урок 1.5 «Превращение типов». TypeError
        при сравнении или странный результат со строками — урок 2.1 «Сравнения: True и False».
        Ошибки `expected ':'`, IndentationError или «Maybe you meant '=='» — урок 2.2 «if и else:
        программа выбирает».
      - >-
        Сработала не та ветка или напечатались две строки — урок 2.3 «elif: несколько вариантов».
        `or "вс"`, `or 65`, `and` вместо `or`, надбавка к бесплатному билету — урок 2.4 «and, or,
        not: сложные условия».
      - >-
        Ошибки на границах возраста (6 и 7, 17 и 18, 64 и 65 лет) или не получилось найти ошибку в
        прокате — урок 2.5 «Границы: проверяем пороговые значения». У каждой границы проверяют три
        точки: шаг до неё, её саму и шаг после. В прокате ошибка видна только на самой границе —
        при 120 минутах, а ожидаемую цену берут из правил, а не из вывода программы.
    question: >-
      Что случится с пятилетним гостем, если в цепочке поставить льготную проверку
      `age <= 17 or age >= 65` раньше бесплатной `age < 7`?
    answer: >-
      Он получит льготный билет вместо бесплатного. `5 <= 17` — True, а в цепочке выполняется
      первая подходящая ветка, поэтому до бесплатной проверки дело не дойдёт. Льготное условие
      здесь общее, «младше 7» — частное, и частное ставят раньше. Если записать льготу полным
      промежутком `7 <= age <= 17 or age >= 65`, группы не пересекаются, и порядок уже не важен.
