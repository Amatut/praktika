id: m2-l6
module: m2
number: "2.6"
title: "Самостоятельная работа: тарифы и скидки"
objective: >-
  Самостоятельно написать программу расчёта цены с несколькими правилами (возраст, день недели),
  проверить её на граничных значениях и найти ошибку на границе в чужой программе.
minutes: [20, 30]
prerequisites: [m2-l5]
skills: [conditions, boolean-logic, boundary-checks, comparisons]
environment: python

story:
  title: Табличка у кассы
  fictional: true
  text: >-
    У кассы бассейна «Волна» висит табличка с ценами: малыши плавают бесплатно, школьники и
    пенсионеры — по льготному билету, а в выходные платный билет дороже. Администратор Света
    считает цену в уме и в субботнюю очередь иногда ошибается: то забудет надбавку, то продаст
    взрослый билет семнадцатилетнему. Света решила записать правила программой: программа не
    устаёт и не путает границы. Сегодня эту программу пишешь ты, от пустого файла до зелёной
    проверки, а потом ищешь ошибку в чужой кассе.

why: >-
  Самостоятельная работа показывает, что получается без подсказок: разложить правила на проверки,
  поставить их в правильном порядке и не ошибиться на границах. Например, касса должна знать, что
  семнадцатилетний ещё платит по льготному билету, а восемнадцатилетний — уже по взрослому.

usedIn: >-
  Так устроены кассы и калькуляторы цен в кинотеатрах, музеях и на транспорте, тарифы проката и
  парковок, скидки в интернет-магазинах: несколько правил, порядок проверок и границы «от» и «до».

steps:
  - id: reminder
    type: theory
    title: Перед стартом
    body: |-
      Сегодня самостоятельная работа: два задания, и подсказки в каждом откроются только после
      первой проверки. Это не запрет на помощь — просто сначала попробуй сам.

      Всё нужное ты уже знаешь:

      - Число из ввода сначала превращают: `age = int(input())`. Сравнить строку `"30"` с числом
        через `<` Python не даст — будет TypeError.
      - Строки сравниваются точно: `day == "сб"` верно, только если введено ровно `сб`.
      - В цепочке `if / elif / else` выполняется первая подходящая ветка, остальные пропускаются.
        Частное условие ставь раньше общего.
      - `and` — нужны оба условия, `or` — хватит одного, `not` переворачивает ответ. Каждая часть —
        полное сравнение: `day == "сб" or day == "вс"`. Когда смешиваешь `and` и `or`, ставь скобки.
      - Переменную можно пересчитать от её текущего значения: `score = score + 5` (урок 1.2).
      - Граница — значение, на котором меняется ответ. «От 18» — это `>= 18`, «младше 12» —
        `< 12`, «до 10 включительно» — `<= 10`.

      Как работать:

      1. Прочитай правила и примеры.
      2. До кода составь таблицу проверок — в комментариях или на листке: обычные значения, а у
         каждой границы три точки: шаг до неё, она сама и шаг после. Ожидаемый ответ бери из
         правила, а не из программы.
      3. Напиши код.
      4. Прогони таблицу через «Запустить». Поле «Ввод для „Запустить“» под редактором кода уже
         заполнено вводом из первого примера (оно свёрнуто — нажми на заголовок). Каждая строка
         поля — ответ на один `input()`: меняй их и сравнивай вывод с таблицей.
      5. Нажми «Проверить».

      Таблица проверок для правила «скидка от 1000» может выглядеть так:

      ```text
      # сумма   ожидаю
      # 999     без скидки
      # 1000    скидка
      # 1001    скидка
      # 300     без скидки
      ```
    simpler: >-
      Порядок работы такой: прочитать правила → выписать границы и что на них должно получиться →
      написать код → запустить по каждой строке таблицы → нажать «Проверить». Подсказки откроются
      после первой проверки.
    coach: >-
      Ошибиться на первой попытке нормально: результаты покажут, что уже получается само, а что
      стоит повторить.

  - id: warmup
    type: predict
    title: Разминка
    prompt: >-
      Кассир проверяет программу для билетов: подставил в неё возраст пенсионера — 70 лет. Как
      думаешь, что она напечатает?
    code: |-
      age = 70
      if age >= 18:
          print("Взрослый билет")
      elif age >= 65:
          print("Пенсионный билет")
      else:
          print("Детский билет")
    options:
      - Взрослый билет
      - Пенсионный билет
      - Детский билет
    answer: Взрослый билет
    explanation: >-
      `70 >= 18` — True, поэтому цепочка остановилась на первой ветке, и до проверки `age >= 65`
      дело не дошло. Общее условие («от 18») перехватило частное («от 65»). Пенсионную проверку
      нужно ставить раньше взрослой.
    coach: >-
      Если ответил «Пенсионный билет» — это частая ловушка цепочки `elif`. Хорошо, что она
      попалась до главного задания, а не в нём.

  - id: main-task
    type: exercise
    title: Самостоятельная работа
    exercise:
      id: m2-l6-e1
      kind: write
      title: Касса бассейна
      statement: |-
        Напиши программу для кассы бассейна «Волна». Она читает две строки: возраст (целое число) и
        день недели — ровно так, маленькими буквами: `пн`, `вт`, `ср`, `чт`, `пт`, `сб` или `вс`.

        Цена разового посещения:

        - младше 7 лет — бесплатно, в любой день;
        - от 7 до 17 лет включительно и от 65 лет — льготный билет, 200;
        - все остальные — 350;
        - в субботу и воскресенье платный билет дороже на 50.

        Программа печатает одну строку: `Бесплатно` или `К оплате: <цена>`. Например, для
        десятилетнего гостя в субботу:

        ```text
        К оплате: 250
        ```

        Перед кодом составь таблицу проверок — в комментариях или на листке: какие возрасты стоят
        на границах правил и что для них должно получиться. Её не проверяют, но она помогает найти
        ошибку ещё до «Проверить».
      input: >-
        Две строки: возраст (целое число, 0 или больше) и день недели — `пн`, `вт`, `ср`, `чт`,
        `пт`, `сб` или `вс`.
      output: "Одна строка: `Бесплатно` или `К оплате: <цена>`."
      constraints:
        - Подсказки откроются после первой проверки — сначала попробуй сам.
        - Текст в скобках `input("…")` может быть любым — он не проверяется.
        - День вводится ровно так, как в условии, — переделывать его не нужно.
      starterCode: |
        # Касса бассейна «Волна»
        # Ввод: возраст, день недели (каждое — на своей строке)
        #
        # Таблица проверок (заполни до кода):
        # возраст  день  ожидаю         получилось
        # 30       ср    К оплате: 350
        #

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "30\nср\n"
          expected: "К оплате: 350"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "10\nсб\n"
          expected: "К оплате: 250"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t3
          kind: io
          title: Пример 3
          example: true
          stdin: "5\nвс\n"
          expected: Бесплатно
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t4
          kind: io
          title: "Обычный случай: 70 лет, понедельник"
          stdin: "70\nпн\n"
          expected: "К оплате: 200"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t5
          kind: io
          title: "Обычный случай: 30 лет, воскресенье"
          stdin: "30\nвс\n"
          expected: "К оплате: 400"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t6
          kind: io
          title: "Граничный случай: 6 лет"
          edge: true
          stdin: "6\nпт\n"
          expected: Бесплатно
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t7
          kind: io
          title: "Граничный случай: ровно 7 лет"
          edge: true
          stdin: "7\nпт\n"
          expected: "К оплате: 200"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t8
          kind: io
          title: "Граничный случай: ровно 17 лет"
          edge: true
          stdin: "17\nчт\n"
          expected: "К оплате: 200"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t9
          kind: io
          title: "Граничный случай: 18 лет"
          edge: true
          stdin: "18\nчт\n"
          expected: "К оплате: 350"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t10
          kind: io
          title: "Граничный случай: 64 года"
          edge: true
          stdin: "64\nвт\n"
          expected: "К оплате: 350"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t11
          kind: io
          title: "Граничный случай: ровно 65 лет"
          edge: true
          stdin: "65\nвт\n"
          expected: "К оплате: 200"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t12
          kind: io
          title: "Граничный случай: 65 лет в воскресенье"
          edge: true
          stdin: "65\nвс\n"
          expected: "К оплате: 250"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t13
          kind: io
          title: "Граничный случай: малыш до года в субботу"
          edge: true
          stdin: "0\nсб\n"
          expected: Бесплатно
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t14
          kind: io
          title: "Граничный случай: 18 лет в субботу"
          edge: true
          stdin: "18\nсб\n"
          expected: "К оплате: 400"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t15
          kind: io
          title: "Граничный случай: 6 лет в субботу"
          edge: true
          stdin: "6\nсб\n"
          expected: Бесплатно
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t16
          kind: io
          title: "Граничный случай: ровно 7 лет в воскресенье"
          edge: true
          stdin: "7\nвс\n"
          expected: "К оплате: 250"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t17
          kind: io
          title: "Граничный случай: 17 лет в субботу"
          edge: true
          stdin: "17\nсб\n"
          expected: "К оплате: 250"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t18
          kind: io
          title: "Граничный случай: 64 года в воскресенье"
          edge: true
          stdin: "64\nвс\n"
          expected: "К оплате: 400"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
        - id: t19
          kind: io
          title: "Обычный случай: 70 лет, суббота"
          stdin: "70\nсб\n"
          expected: "К оплате: 250"
          compare: {ignoreSpaces: true, ignoreBlankLines: true}
      criteria:
        - Возраст превращается в число до сравнения, день сравнивается со строками.
        - Цена по возрасту верна не только для обычных возрастов, но и на границах групп.
        - Надбавка 50 — только к платному билету и только в субботу и воскресенье.
        - "Вывод — одна строка: `Бесплатно` или `К оплате: <цена>`."
      hints:
        - >-
          Раздели работу на две части: сначала выбери цену по возрасту — групп три, — а потом
          отдельно реши, нужна ли надбавка за выходной. Для каждой группы спроси себя, какие
          возрасты стоят прямо на её границах и куда они относятся по правилу. И в каком порядке
          проверять группы, чтобы общая проверка не перехватила частную, как в разминке? И
          перечитай правило надбавки: к какому билету она относится?
        - |-
          Второе правило может поменять уже выбранную цену — и относиться не ко всем. Пример из
          пиццерии: сначала цена по размеру, потом доплата 100 за доставку, но только для заказа
          дешевле 600.
          ```python
          if size == "L":
              price = 700
          else:
              price = 500
          if delivery == "да" and price < 600:
              price = price + 100
          ```
          Второй `if` — отдельный, не `elif`: он выполняется после того, как цена уже выбрана, и
          меняет её. Условие после `and` ограничивает, к каким заказам относится доплата.
        - |-
          Каркас:
          ```text
          age = int(input(...))
          day = input(...)
          if age < 7:
              price = 0
          elif … or …:
              price = 200
          else:
              price = …
          if price > 0 and (… or …):
              price = price + 50
          если price == 0 — напечатать «Бесплатно», иначе — «К оплате:» и цену
          ```
      solution:
        code: |
          age = int(input("Возраст: "))
          day = input("День недели: ")
          if age < 7:
              price = 0
          elif age <= 17 or age >= 65:
              price = 200
          else:
              price = 350
          if price > 0 and (day == "сб" or day == "вс"):
              price = price + 50
          if price == 0:
              print("Бесплатно")
          else:
              print(f"К оплате: {price}")
        explanation: >-
          Решение в три шага. Сначала цена по возрасту: бесплатная ветка стоит первой, иначе
          условие `age <= 17` захватило бы и малышей. До `elif` доходит только возраст от 7 и
          старше, поэтому `age >= 7` там писать не нужно. Потом отдельный `if` прибавляет 50 —
          только к платному билету и только в субботу или воскресенье. Скобки нужны, чтобы `or`
          выполнился раньше `and`. В конце — вывод: для нулевой цены слово «Бесплатно», для
          остальных — цена.
      altSolutions:
        - code: |
            age = int(input())
            day = input()
            weekend = day == "сб" or day == "вс"
            if age < 7:
                print("Бесплатно")
            elif 7 <= age <= 17 or age >= 65:
                if weekend:
                    print("К оплате: 250")
                else:
                    print("К оплате: 200")
            elif weekend:
                print("К оплате: 400")
            else:
                print("К оплате: 350")
          note: Флаг выходного и вложенный if, готовые цены в каждой ветке.
        - code: |
            age = int(input())
            day = input()
            if age < 7:
                print("Бесплатно")
            else:
                if age <= 17:
                    price = 200
                elif age <= 64:
                    price = 350
                else:
                    price = 200
                if day == "сб" or day == "вс":
                    price = price + 50
                print(f"К оплате: {price}")
          note: Бесплатный билет отдельно, платные — внутри else; надбавка без проверки price > 0.
        - code: |
            age = int(input("Возраст: "))
            day = input("День: ")
            if age >= 65:
                price = 200
            elif age >= 18:
                price = 350
            elif age >= 7:
                price = 200
            else:
                price = 0
            if day == "сб" or day == "вс":
                if price > 0:
                    price = price + 50
            if price == 0:
                print("Бесплатно")
            else:
                print("К оплате:", price)
          note: Проверки от старших к младшим, вывод через запятую.
        - code: |
