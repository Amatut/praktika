          try: >-
            Перечисли подпись и сравнение в `print` через запятую — так же, как в строке «Жарко». А
            если склеиваешь через `+`, оберни в `str(...)` всё сравнение целиком — от `temp` до `0`.
          verify: 'В «Примере 1» второй строкой должно быть «Заморозок: True».'
        - id: wrong-sign
          when:
            errorType: SyntaxError
            codeRegex: '=<|=>|[≤≥]|[<>][ \t]+='
          why: >-
            Python не знает записей `=<`, `=>`, `< =` с пробелом и значков `≤`, `≥`. Знак `=`
            всегда стоит вторым и вплотную: «меньше или равно» — `<=`, «больше или равно» — `>=`.
          try: >-
            Поставь `=` вторым и без пробела, не меняя направления стрелки: `=<` и `< =` → `<=`,
            `=>` и `> =` → `>=`.
          verify: SyntaxError должна исчезнуть.
        - id: no-compare
          when:
            codeRegex: '["'']Заморозок:\s*(?:True|False)\s*["'']'
          why: >-
            Ответ про заморозок записан в коде готовым словом, поэтому он одинаковый при любой
            температуре: и при −3, и при 35 градусах программа печатает одно и то же.
          try: >-
            Вместо готового слова напечатай результат сравнения температуры с 0 — так же, как в
            строке «Жарко» печатается сравнение с 30.
          verify: 'В «Примере 1» должно получиться «Заморозок: True», а в «Примере 2» — «Заморозок: False».'
        - id: zero-in-quotes
          when:
            errorIncludes: not supported between instances
            codeRegex: '["'']\s*-?\d+\s*["'']'
          why: >-
            Python не может сравнить число со строкой знаком `<=`, `<`, `>` или `>=` — отсюда
            TypeError. `temp` уже число, а число в кавычках, например `"0"`, — строка.
          try: Убери кавычки вокруг числа — сравнивай температуру с числом.
          verify: Ошибка TypeError должна исчезнуть.
        - id: missing-line
          when:
            outputEquals: "Жарко: False"
          why: Программа печатает только строку «Жарко» — строки про заморозок пока нет.
          try: Допиши третью строку программы — ещё один `print` с подписью «Заморозок:» и сравнением.
          verify: В «Примере 1» должны появиться две строки.
        - id: replaced-line
          when:
            outputEquals: "Заморозок: True"
          why: >-
            Строка «Заморозок» появилась, но пропала строка «Жарко». Задание — добавить вторую
            строку, а не заменить первую.
          try: Верни `print("Жарко:", temp > 30)` и поставь новую строку после него.
          verify: В «Примере 1» должны быть две строки — сначала «Жарко», потом «Заморозок».
        - id: swapped-lines
          when:
            outputEquals: |-
              Заморозок: True
              Жарко: False
          why: >-
            Обе строки на месте, но в другом порядке. Python выполняет команды сверху вниз, поэтому
            что написано раньше, то и печатается раньше.
          try: Поставь `print` про заморозок после строки «Жарко».
          verify: 'В «Примере 1» первой строкой должно быть «Жарко: False».'
        - id: one-line
          when:
            codeRegex: 'print\((?:(?!\\n).)*Жарко(?:(?!\\n).)*Заморозок'
            failedTest: t1
          why: >-
            Подписи «Жарко» и «Заморозок» стоят в одном `print`, поэтому всё напечаталось одной
            строкой. Каждый `print` печатает свою строку.
          try: >-
            Оставь в первом `print` только «Жарко» и его сравнение, а «Заморозок» со своим
            сравнением перенеси в отдельный `print` ниже.
          verify: В «Примере 1» должны получиться две строки.
        - id: wrong-direction
          when:
            failedTest: t1
            outputIncludes: "Заморозок: False"
          why: >-
            При −3 градусах программа ответила, что заморозка нет. Сравнение задаёт не тот вопрос:
            «0 или ниже» — это «температура меньше или равна 0».
          try: >-
            Прочитай сравнение вслух слева направо, подставив −3 вместо температуры: должен
            получиться вопрос «−3 меньше или равно 0?». Проверь знак и то, что стоит слева и справа
            от него.
          verify: 'В «Примере 1» должно получиться «Заморозок: True».'
        - id: strict-zero
          when:
            failedTest: t4
            outputEquals: |-
              Жарко: False
              Заморозок: False
          why: >-
            «0 или ниже» включает сам ноль, а сравнение сейчас спрашивает «ниже нуля?» и для 0
            отвечает False. Так работает строгое `temp < 0` или `0 > temp`, и так же — сравнение
            с −1: `temp <= -1`.
          try: Сравни температуру именно с 0 знаком «меньше или равно» — он включает и сам 0.
          verify: 'В граничном случае «ровно 0» должно получиться «Заморозок: True».'
        - id: too-high
          when:
            failedTest: t5
            outputEquals: |-
              Жарко: False
              Заморозок: True
          why: >-
            При 1 градусе программа ответила, что заморозок есть, а 1 — уже выше нуля. Граница
            сдвинута: сравнение пропускает температуры выше 0.
          try: Проверь число и знак во второй строке — при 0 заморозок есть, а при 1 уже нет.
          verify: 'В граничном случае «1 градус» должно получиться «Заморозок: False».'
      afterPass: >-
        Одну переменную можно проверить двумя разными вопросами: ввод прочитан один раз, а
        сравнивать его можно сколько угодно. Если хочешь, впиши в поле «Ввод для „Запустить“» сначала 0, потом 1
        и посмотри, как меняется вторая строка, — ровно между ними проходит граница условия.
      skills: [comparisons]

  - id: practice-game
    type: exercise
    title: Практика 3
    exercise:
      id: m2-l1-e3
      kind: write
      title: Кто выиграл партию
      statement: |-
        Двое сыграли партию в настольную игру. Программа читает очки первого и второго игрока и
        печатает три строки: победил ли первый, победил ли второй и ничья ли это. Побеждает тот,
        у кого очков больше; при равных очках — ничья.

        Например, если у первого 12 очков, а у второго 9:

        ```text
        Победил первый: True
        Победил второй: False
        Ничья: False
        ```
      input: Две строки — очки первого и второго игрока, целые числа.
      output: "Три строки: `Победил первый: …`, `Победил второй: …`, `Ничья: …` — после двоеточия True или False."
      constraints:
        - Каждый ответ — результат сравнения, а не готовое слово.
      starterCode: |
        # Прочитай очки первого и второго игрока
        # Выведи три строки: победил первый, победил второй, ничья

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "12\n9\n"
          expected: |-
            Победил первый: True
            Победил второй: False
            Ничья: False
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "7\n15\n"
          expected: |-
            Победил первый: False
            Победил второй: True
            Ничья: False
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: ничья"
          edge: true
          stdin: "10\n10\n"
          expected: |-
            Победил первый: False
            Победил второй: False
            Ничья: True
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: 9 и 10 — однозначное и двузначное"
          edge: true
          stdin: "9\n10\n"
          expected: |-
            Победил первый: False
            Победил второй: True
            Ничья: False
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: "Граничный случай: оба по нулю"
          edge: true
          stdin: "0\n0\n"
          expected: |-
            Победил первый: False
            Победил второй: False
            Ничья: True
          compare:
            ignoreSpaces: true
        - id: t6
          kind: io
          title: "Обычный случай: разница в одно очко"
          stdin: "100\n99\n"
          expected: |-
            Победил первый: True
            Победил второй: False
            Ничья: False
          compare:
            ignoreSpaces: true
        - id: t7
          kind: io
          title: "Обычный случай: 15 и 12 — числа одной длины"
          stdin: "15\n12\n"
          expected: |-
            Победил первый: True
            Победил второй: False
            Ничья: False
          compare:
            ignoreSpaces: true
        - id: t8
          kind: io
          title: "Граничный случай: ничья с крупным счётом"
          edge: true
          stdin: "1000\n1000\n"
          expected: |-
            Победил первый: False
            Победил второй: False
            Ничья: True
          compare:
            ignoreSpaces: true
      criteria:
        - Оба ввода превращаются в числа до сравнения.
        - Три строки в формате из условия, в каждой — результат своего сравнения.
        - При равных очках ни первый, ни второй не победил, а «Ничья» — True.
      hints:
        - >-
          Три строки — три вопроса об одних и тех же двух числах: «у первого больше?», «у второго
          больше?», «поровну?». И подумай, в каком виде очки приходят из `input()`.
        - >-
          На другом примере: `print("Старший выше:", older > younger)` и `print("Одного роста:",
          older == younger)`. Если оба брата ростом 150 см, первая строка напечатает False, а
          вторая — True: при равном росте «выше» — неправда.
        - |-
          Каркас:
          ```text
          first = int(input(...))
          second = int(input(...))
          print("Победил первый:", …)
          print("Победил второй:", …)
          print("Ничья:", …)
          ```
      solution:
        code: |
          first = int(input("Очки первого: "))
          second = int(input("Очки второго: "))
          print("Победил первый:", first > second)
          print("Победил второй:", first < second)
          print("Ничья:", first == second)
        explanation: >-
          Оба ввода превращаются в числа, иначе 12 и 9 сравнились бы как текст и «победил» бы
          второй. Дальше три вопроса к одной паре чисел: `>` — у первого больше, `<` — у второго
          больше, `==` — поровну. Для любых двух чисел ровно один из трёх ответов — True.
