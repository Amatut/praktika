            second = int(input("Очки второго: "))
            first = int(input("Очки первого: "))
            print("Победил первый:", first > second)
            print("Победил второй:", first < second)
            print("Ничья:", first == second)
          note: Ввод прочитан в обратном порядке, знаки верные.
          expectMistake: swapped
        - code: |
            first = int(input("Очки первого: "))
            second = int(input("Очки второго: "))
            print("Победил первый:", first > second)
            print("Победил второй:", first < second)
            print("Ничья:", first is second)
          note: is вместо == — для маленьких чисел случайно работает.
          expectMistake: is-equal
        - code: |
            first = input("Очки первого: ")
            second = input("Очки второго: ")
            print("Победил первый:", first > second)
            print("Победил второй:", first < second)
            print("Ничья:", int(first) == int(second))
          note: int() только в строке «Ничья» — в первых двух сравниваются строки.
          expectMistake: strings
        - code: |
            first = input("Очки первого: ")
            second = input("Очки второго: ")
            print("Победил первый:", first > second)
            print("Победил второй:", int(first) < int(second))
            print("Ничья:", first == second)
          note: int() только в строке «Победил второй».
          expectMistake: strings
        - code: |
            first = int(input("Очки первого: "))
            second = int(input("Очки второго: "))
            print("Победил первый: " + str(first) > second)
            print("Победил второй: " + str(first) < second)
            print("Ничья: " + str(first) == second)
          note: 'Склейка через + до сравнения — сравнивается текст «Победил первый: 12».'
          expectMistake: plus-before-compare
        - code: |
            first = int(input("Очки первого: "))
            second = int(input("Очки второго: "))
            print("Победил первый: " + str(first > second))
            print("Победил второй: " + str(first < second))
            print("Ничья: " + str(first = second))
          note: Одно = внутри str(...) при склейке.
          expectMistake: assign-in-print
      mistakes:
        - id: plus-before-compare
          when:
            codeRegex: '["'']\s*\+\s*(?:str\s*\(\s*\w+\s*\)|\w+)\s*(?:[<>]=?|==|!=)'
          why: >-
            Python сначала выполняет `+`, а уже потом сравнение: к подписи приклеиваются очки, а не
            ответ на вопрос. Если склейка удалась, сравнивается весь текст вроде «Победил первый:
            12». Отсюда ошибка TypeError или ответ без подписи.
          try: >-
            Перечисли подпись и сравнение в `print` через запятую: сначала текст в кавычках, потом
            сравнение. А если склеиваешь через `+`, оберни в `str(...)` всё сравнение целиком.
          verify: 'В «Примере 1» первой строкой должно быть «Победил первый: True».'
        - id: int-not-saved
          when:
            codeRegex: '^\s*(?:int|float)\s*\(\s*(\w+)\s*\)\s*$(?![\s\S]*^\s*\1\s*=(?!=))'
          why: >-
            Строка вида `int(first)` превращает текст в число, но никуда его не кладёт — результат
            пропадает, как несохранённый ответ `input()`. В `first` по-прежнему строка, и программа
            сравнивает текст, а не числа.
          try: >-
            Сохрани число в переменную: `first = int(input(...))`, и так же для второго игрока.
            Отдельные строки с `int()` тогда не нужны.
          verify: >-
            В «Примере 1» (12 и 9) и в тесте с 15 и 12 первой строкой должно быть «Победил
            первый: True».
        - id: one-int
          when:
            errorIncludes: not supported between instances
          why: >-
            Python не может сравнить число со строкой — отсюда TypeError. Одно значение прошло
            через `int()`, а другое осталось строкой, как его вернул `input()`.
          try: Найди ввод без `int(...)` и преврати его в число тоже.
          verify: Ошибка TypeError должна исчезнуть.
        - id: assign-in-print
          when:
            errorIncludes: unexpected keyword argument
          why: >-
            Внутри скобок стоит одно `=`. Запись вида `first = second` в скобках `print(...)` или
            `str(...)` Python понял не как вопрос «равны ли?», а как настройку с именем `first` —
            такой настройки там нет.
          try: Для вопроса «равны ли?» нужны два знака — `==`.
          verify: 'Ошибка TypeError должна исчезнуть, а в «Примере 1» появится «Ничья: False».'
        - id: assign-in-fstring
          when:
            errorIncludes: "f-string: expecting"
            codeRegex: '\{\s*\w+\s*=\s*\w+\s*\}'
          why: >-
            В фигурных скобках f-строки стоит одно `=`. Одно `=` кладёт значение в переменную, а
            здесь нужен вопрос «равны ли?» — Python не понимает, что ты хотел, и сообщает об
            ошибке.
          try: Замени одно `=` в фигурных скобках на `==`.
          verify: SyntaxError должна исчезнуть.
        - id: assign-chain
          when:
            codeRegex: '^[ \t]*\w+[ \t]*=[ \t]*\w+[ \t]*=(?!=)'
            failedTest: t1
          why: >-
            В строке вида `draw = first = second` оба знака одиночные. Такая строка не спрашивает
            «равны ли?», а кладёт очки второго игрока сразу в две переменные, поэтому после
            «Ничья:» печатается число.
          try: Там, где нужен вопрос «равны ли?», поставь два знака — `==`.
          verify: 'В «Примере 1» последней строкой должно быть «Ничья: False».'
        - id: strings
          when:
            codeRegex: '^[ \t]*(\w+)[ \t]*=[ \t]*input[ \t]*\((?![\s\S]*^[ \t]*\1[ \t]*=(?!=))[\s\S]*?(?:(?<![\w(.])\1[ \t]*(?:[<>]=?|[=!]=)|(?:[<>]=?|[=!]=)[ \t]*\1\b)'
          why: >-
            Очки остались строками, а строки Python сравнивает как текст — по первому
            отличающемуся символу, как в прогнозе «Десять больше девяти?». Для одних пар ответ
            случайно выходит верным, для других — нет: `"12" > "9"` — False, хотя 12 больше 9.
          try: Преврати оба ввода в числа — оберни каждый `input(...)` в `int(...)`.
          verify: >-
            В «Примере 1» (12 и 9) и в тесте с 15 и 12 первой строкой должно быть «Победил
            первый: True».
        - id: one-line
          when:
            codeRegex: 'print\((?:(?!\\n).)*Победил(?:(?!\\n).)*(?:Победил|Ничья)'
            failedTest: t1
          why: >-
            Несколько подписей стоят в одном `print`, поэтому ответы напечатались одной строкой.
            Каждый `print` печатает свою строку.
          try: >-
            Сделай три `print` — по одному на каждую строку: «Победил первый», «Победил второй»,
            «Ничья».
          verify: В «Примере 1» должны получиться три строки.
        - id: swapped
          when:
            failedTest: t1
            outputEquals: |-
              Победил первый: False
              Победил второй: True
              Ничья: False
          why: >-
            При 12 очках против 9 программа отдала победу второму: ответы про первого и второго
            поменялись местами. Обычно перепутаны знаки: «победил первый» значит «очков у первого
            больше».
          try: >-
            Прочитай каждое сравнение вслух, подставив 12 и 9, и проверь, какой вопрос оно
            задаёт. Заодно проверь, что первым читается ввод первого игрока.
          verify: 'В «Примере 1» первой строкой должно быть «Победил первый: True».'
        - id: same-question
          when:
            failedTest: t1
            outputEquals: |-
              Победил первый: True
              Победил второй: True
              Ничья: False
          why: >-
            При 12 очках против 9 программа объявила победителями обоих: строка «Победил второй»
            отвечает так же, как первая. Чаще всего она задаёт тот же вопрос — «у первого
            больше?». Например, `second < first` — это именно он, только записанный справа налево.
          try: >-
            Прочитай сравнение во второй строке вслух, подставив 12 и 9: о каком игроке оно
            спрашивает? Для второго нужен вопрос «у второго очков больше?». Если вопрос верный,
            проверь, что сравниваются числа: значение из `input()` без `int()` остаётся строкой.
          verify: 'В «Примере 1» второй строкой должно быть «Победил второй: False».'
        - id: tie-not-equal
          when:
            failedTest: t1
            outputIncludes: "Ничья: True"
          why: >-
            При 12 против 9 программа объявила ничью. Ничья — это когда очки равны, а сравнение в
            строке «Ничья» спрашивает другое: например, `!=` значит «не равно», а `>` — «у первого
            больше?».
          try: В строке «Ничья» спроси «равны ли?» — двумя знаками `==`.
          verify: 'В «Примере 1» последней строкой должно быть «Ничья: False».'
        - id: tie-wins
          when:
            failedTest: t3
            codeRegex: '>=|<='
          why: >-
            При равных очках программа объявила победителя. `>=` и `<=` включают равенство, а при
            ничьей не побеждает никто.
          try: Для победы нужно строго больше — замени `>=` и `<=` на `>` и `<`.
          verify: В граничном случае «ничья» обе строки про победу должны стать False.
        - id: is-equal
          when:
            codeRegex: '\bis\b'
            failedTest: t8
          why: >-
            `is` спрашивает не «равны ли числа?», а «это один и тот же объект в памяти?». Для
            небольших чисел Python случайно отвечает True, а для 1000 и 1000 — уже False.
          try: Равенство чисел проверяют знаком `==`.
          verify: 'В граничном случае «ничья с крупным счётом» должно получиться «Ничья: True».'
      afterPass: >-
        Три сравнения описывают любой исход партии, и для любых двух чисел ровно одно из них —
        True. Пока программа печатает все три ответа; в уроке 2.2 она научится выбирать и печатать
        только один — например, «Победил первый».
      skills: [comparisons, type-conversion, input-read]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Сравнение — вопрос, на который Python отвечает True или False; это значения типа `bool`.
      - "Шесть знаков: `==`, `!=`, `<`, `>`, `<=`, `>=`. Одно `=` кладёт значение в переменную, `==` спрашивает «равны ли?»."
      - "Строки сравниваются точно: `\"Да\" != \"да\"`. Строки из цифр сравниваются как текст: `\"10\" < \"9\"`."
      - Числа из `input()` превращай через `int()` или `float()` до сравнения.
    question: Почему `input() == 5` даёт False, даже если ввести 5?
    answer: >-
      `input()` вернул строку `"5"`, а строка и число не равны: Python не превращает типы сам и не
      сообщает об ошибке — просто отвечает False. Нужно сначала превратить ввод в число:
      `int(input()) == 5`.
