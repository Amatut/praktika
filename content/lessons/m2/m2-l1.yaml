id: m2-l1
module: m2
number: "2.1"
title: "Сравнения: True и False"
objective: >-
  Записывать сравнения ==, !=, <, >, <=, >=, предсказывать результат True или False и сравнивать
  числа из ввода только после int() или float().
minutes: [25, 30]
prerequisites: [m1-l6]
skills: [comparisons]
environment: python

story:
  title: Датчик в теплице
  fictional: true
  text: >-
    У бабушки Нины на даче теплица с огурцами. Каждое утро она смотрела на прибор влажности почвы
    и решала, поливать или нет, а в жару, бывало, ошибалась, и огурцы вяли. Внук Тимур поставил в
    землю датчик с маленьким компьютером, и теперь на этот вопрос отвечает программа: если
    влажность меньше 30 %, она пишет True — «да, пора поливать». Вся её работа — один
    вопрос-сравнение с ответом «да» или «нет». Сегодня ты научишься задавать такие вопросы.

why: >-
  Любое решение программы начинается с вопроса «да или нет?»: хватает ли денег, верный ли пароль,
  пора ли поливать. Сравнение и есть такой вопрос: `balance >= price` отвечает True или False —
  хватает денег на покупку или нет.

usedIn: >-
  Онлайн-тест сверяет твой ответ с правильным, склад предупреждает «осталось меньше 10 штук»,
  интернет-магазин показывает товары «дешевле 1000 рублей», умный дом подаёт сигнал «температура
  выше нормы». За каждым таким решением стоит сравнение.

steps:
  - id: idea
    type: theory
    title: Вопрос с ответом «да» или «нет»
    body: |-
      Программа Тимура каждое утро задаёт один и тот же вопрос: влажность меньше 30? Такой
      вопрос в Python записывают **сравнением**:

      ```python
      humidity < 30
      ```

      Python вычисляет сравнение, как пример по арифметике, но ответ получается не числом, а одним
      из двух значений: **True** (да, истина) или **False** (нет, ложь). У этих значений свой тип —
      **`bool`**, логический (он назван в честь математика Джорджа Буля). `print(humidity < 30)`
      напечатает `True` или `False`, а ответ можно сохранить в переменную:
      `need_water = humidity < 30`. Если рядом со сравнением стоит арифметика или склейка через
      `+`, Python сначала выполнит их и только потом сравнит: в `2 + 3 < 4` он посчитает 5, а
      `5 < 4` — False.

      Шесть знаков сравнения:

      ```text
      ==   равно              5 == 5    → True
      !=   не равно           5 != 3    → True
      <    меньше             2 < 7     → True
      >    больше             2 > 7     → False
      <=   меньше или равно   7 <= 7    → True
      >=   больше или равно   6 >= 7    → False
      ```

      Три места, где чаще всего ошибаются:

      - **Одно `=` кладёт значение в переменную, два знака `==` спрашивают «равны ли?».**
        `x = 5` — положить, `x == 5` — спросить.
      - В `<=` и `>=` знак `=` стоит **вторым** и без пробела. Записи `=<`, `=>` и `< =` Python
        не понимает — будет SyntaxError.
      - `True` и `False` пишутся с большой буквы и **без кавычек**. `"True"` в кавычках — просто
        текст из четырёх букв.

      **Строки** тоже можно сравнивать. Сравнение точное, символ за символом: `"Да" == "да"` —
      False, потому что большая и маленькая буквы — разные символы. Пробел — тоже символ:
      `"да " == "да"` — False.

      **Числа из `input()` сначала превращай.** `input()` возвращает строку, а если сравнить строку
      с числом:

      - знаками `<`, `>`, `<=`, `>=` — будет ошибка TypeError: `"25" < 30` Python сравнить не может;
      - знаком `==` — будет просто False, и Python ни о чём не предупредит: `"25" == 25` — False.
        Такую ошибку легко не заметить.

      А если сравнить две строки из цифр, Python сравнит их как текст, а не как числа. Что из
      этого выходит, увидишь в прогнозе через шаг.
    simpler: >-
      Сравнение — это вопрос, на который Python отвечает «да» (True) или «нет» (False). Одно `=` —
      положить значение в переменную, два знака `==` — спросить «равны ли?». Числа из `input()`
      превращай через `int()` до сравнения — иначе будет ошибка TypeError или тихий неверный ответ.
    coach: >-
      Читай `==` вслух как вопрос «равно ли?» — и путаница с `=` исчезнет.

  - id: watering
    type: example
    title: Датчик в теплице
    body: >-
      Программа из истории. Ввод для примера задан: датчик показал влажность 25 %. Нажми
      «Запустить» и сравни вывод с пояснениями.
    code: |-
      humidity = int(input("Влажность почвы, %: "))
      need_water = humidity < 30
      print("Полив нужен:", need_water)
      print("Ровно на пороге:", humidity == 30)
      print(type(need_water))
    stdin: "25\n"
    notes:
      - line: 1
        text: >-
          `int()` превращает ответ в число. Без него в `humidity` осталась бы строка `"25"`, и
          программа остановилась бы на сравнении с ошибкой TypeError.
      - line: 2
        text: >-
          Сначала Python вычисляет вопрос `humidity < 30`, потом одно `=` кладёт ответ True в
          переменную `need_water`.
      - line: 3
        text: >-
          На экране `True` выглядит так же, как текст `"True"`: `print` кавычки не печатает. Что
          это логическое значение, а не текст, показывает строка 5.
      - line: 4
        text: >-
          Два знака `==` спрашивают «влажность равна 30?». Сравнение не обязательно сохранять — его можно
          сразу напечатать.
      - line: 5
        text: "`<class 'bool'>` — у ответа на сравнение свой тип, логический."
    tryIt: >-
      Замени первую строку на `humidity = 30` и запусти, потом попробуй 29 и 45. Сравни ответы:
      почему при 29 полив нужен, а при ровно 30 — уже нет?
    coach: >-
      Порог — самое интересное место в любом сравнении: чуть ниже 30 ответ один, ровно 30 — уже
      другой. К таким границам мы ещё вернёмся.

  - id: strings-compare
    type: predict
    title: Десять больше девяти?
    prompt: >-
      Во вводе две строки: `10` и `9`. Программа сравнивает их. Как думаешь, что она выведет?
    code: |-
      a = input()
      b = input()
      print(a > b)
    stdin: "10\n9\n"
    options:
      - "True"
      - "False"
      - Ошибка TypeError
    answer: "False"
    explanation: >-
      Оба `input()` вернули строки `"10"` и `"9"`, и Python сравнил их как текст — «по словарю»,
      то есть по алфавиту: по первому символу, который отличается. Что в словаре стоит раньше, то
      и меньше. Первые
      символы — `"1"` и `"9"`, а `"1"` в этом порядке идёт раньше `"9"`, как «абрикос» раньше
      «яблока». Поэтому `"10" > "9"` — False, хотя 10 больше 9. Ошибки нет, и это самое
      коварное: программа молча отвечает неверно. Исправление — превратить ввод в числа:
      `a = int(input())` и `b = int(input())`.
    coach: >-
      Если Python отвечает «странно», первым делом спроси себя: какого типа значения я сравниваю?

  - id: mixed-types
    type: predict
    title: Число, строка и регистр
    prompt: >-
      Три сравнения подряд. Как думаешь, что напечатает программа?
    code: |-
      print(5 == 5.0)
      print("5" == 5)
      print("Да" != "да")
    options:
      - |-
        True
        False
        True
      - |-
        True
        True
        False
      - |-
        False
        False
        True
      - |-
        True
        False
        False
    answer: |-
      True
      False
      True
    explanation: >-
      `5 == 5.0` — True: целое и дробное с одинаковым значением равны. `"5" == 5` — False: строка
      и число не равны никогда, Python не превращает типы сам и не сообщает об ошибке. `"Да" !=
      "да"` — True: большая и маленькая «Д» — разные символы, строки не равны, а `!=` спрашивает
      как раз «не равны ли?». Ответ «да, не равны» — это True.

  - id: practice-backpack
    type: exercise
    title: Практика 1
    exercise:
      id: m2-l1-e1
      kind: repeat
      title: Рюкзак для похода
      statement: |-
        Перед походом каждый взвешивает рюкзак: нести можно рюкзак не тяжелее 12 кг. Напиши
        программу, которая читает вес рюкзака и отвечает, можно ли его нести:

        ```text
        Можно нести: True
        ```

        Если вес больше 12, вместо True должно быть False. Этот ответ вычисляет Python —
        сравнением.
      input: Одна строка — вес рюкзака в килограммах, целое число.
      output: "Одна строка: `Можно нести: True` или `Можно нести: False`."
      constraints:
        - Вес получай через `input()`.
        - Не пиши True или False в коде готовыми словами — их даёт сравнение.
      starterCode: |
        # Прочитай вес рюкзака и преврати его в число
        # Выведи «Можно нести:» и результат сравнения веса с 12

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "8\n"
          expected: "Можно нести: True"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "15\n"
          expected: "Можно нести: False"
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: ровно 12 кг"
          edge: true
          stdin: "12\n"
          expected: "Можно нести: True"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: 13 кг"
          edge: true
          stdin: "13\n"
          expected: "Можно нести: False"
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: "Граничный случай: пустой рюкзак"
          edge: true
          stdin: "0\n"
          expected: "Можно нести: True"
          compare:
            ignoreSpaces: true
      criteria:
        - Вес читается через `input()` и превращается в число до сравнения.
        - "Выводится одна строка: «Можно нести:» и True или False — результат сравнения."
        - Ровно 12 кг нести можно, 13 кг — уже нельзя.
      hints:
        - >-
          Какой вопрос задаёт программа? «Вес не больше 12?» Найди в таблице из теории знак,
          который значит «не больше». И вспомни, в каком виде вес приходит из `input()`.
        - >-
          Похожий приём на другом примере: `speed = int(input())` и `print("Штраф:", speed > 60)`.
          Для скорости 75 программа напечатает `Штраф: True`, для 60 — `Штраф: False`.
        - |-
          Каркас:
          ```text
          weight = int(input(...))
          print("Можно нести:", weight … 12)
          ```
          Какой знак включает само 12?
      solution:
        code: |
          weight = int(input("Вес рюкзака, кг: "))
          print("Можно нести:", weight <= 12)
        explanation: >-
          `int()` превращает ввод в число, а `weight <= 12` задаёт вопрос «вес меньше или равен
          12?». Python отвечает True или False, и `print` печатает ответ после подписи. «Не
          тяжелее 12» включает сами 12 кг, поэтому нужен `<=`, а не `<`. Можно и f-строкой:
          `print(f"Можно нести: {weight <= 12}")`.
      altSolutions:
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print(f"Можно нести: {weight <= 12}")
          note: f-строка вместо запятой.
        - code: |
            weight = int(input())
            can_carry = weight <= 12
            print("Можно нести:", can_carry)
          note: Ответ сохранён в переменную с понятным именем.
        - code: |
            weight = int(input())
            print("Можно нести:", weight < 13)
          note: Для целых чисел «меньше 13» — то же, что «не больше 12».
        - code: |
            weight = int(input())
            print("Можно нести:", 12 >= weight)
          note: Сравнение записано справа налево.
        - code: |
            weight = float(input())
            print("Можно нести: " + str(weight <= 12))
          note: float() и склейка со str().
        - code: |
            weight = input("Вес рюкзака, кг: ")
            print("Можно нести:", int(weight) <= 12)
          note: Ввод превращается в число прямо в сравнении.
        - code: |
            weight = int(input())
            print("Можно нести: ", weight <= 12)
          note: Лишний пробел в подписи — два пробела подряд проверка считает одним.
        - code: |
            print("Можно нести:", int(input()) <= 12)
          note: Всё в одной строке — ввод, превращение в число и сравнение.
        - code: |
            ves = int(input())

            mozhno = ves <= 12

            print(f"Можно нести: { mozhno }")
            print()
          note: Другие имена, пустые строки, пробелы внутри {}, пустой print() в конце.
        - code: |
            weight = float(input("Вес: "))
            answer = 12 - weight >= 0
            print("Можно нести: " + str(answer))
          note: Запас веса 12 - weight >= 0.
        - code: |
            LIMIT = 12
            weight = int(input("Вес рюкзака (норма — до 12 кг): ").strip())
            print("Можно  нести:", (weight <= LIMIT))
          note: Порог в переменной, скобки, двойной пробел в подписи, 12 в подсказке input.
        - code: |
            weight = int(input())
            print(" Можно нести:", str(13 > weight))
          note: 13 > weight, пробел в начале подписи, str() от bool.
        - code: |
            weight = int(input("Сколько весит рюкзак? "))
            print("Можно", "нести:", weight <= 12)
          note: Подпись разбита на два аргумента print.
        - code: |
            # порог из условия — "12" кг
            weight = int(input("Вес рюкзака -> "))
            print(f"Можно нести: {weight<=12}")
          note: Комментарий с "12" в кавычках, стрелка в подсказке input, f-строка без пробелов.
        - code: |
            weight = int(input())
            print("Можно нести:", 12 + 1 > weight)
          note: Граница вычисляется — 12 + 1 > weight.
      wrongSolutions:
        - code: |
            weight = input("Вес рюкзака, кг: ")
            print("Можно нести:", weight <= 12)
          note: Нет int() — строка сравнивается с числом.
          expectMistake: no-int
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", weight =< 12)
          note: Знак записан как =<.
          expectMistake: wrong-sign
        - code: |
            weight = input("Вес рюкзака, кг: ")
            print("Можно нести:", weight <= "12")
          note: Ошибку TypeError «исправили» кавычками — теперь сравниваются строки.
          expectMistake: strings
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print(weight <= 12)
          note: Нет подписи «Можно нести:».
          expectMistake: no-label
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:" + str(weight <= 12))
          note: Склейка без пробела после двоеточия.
          expectMistake: no-space
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", "weight <= 12")
          note: Сравнение в кавычках — печатается как текст.
          expectMistake: in-quotes
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести: True")
          note: Ответ записан готовым.
          expectMistake: no-compare
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", weight > 12)
          note: Знак в другую сторону.
          expectMistake: reversed
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", weight < 12)
          note: Строгое < не включает 12 кг.
          expectMistake: strict
        - code: |
            weight = input("Вес рюкзака, кг: ")
            int(weight)
            print("Можно нести:", weight <= 12)
          note: int() вызван отдельной строкой, результат не сохранён.
          expectMistake: int-not-saved
        - code: |
            weight = input("Вес рюкзака, кг: ")
            print("Можно нести:", weight <= str(12))
          note: TypeError «исправлена» через str(12) — сравниваются строки.
          expectMistake: strings
        - code: |
            weight = input("Вес рюкзака, кг: ")
            print("Можно нести:", weight >= str(12))
          note: Строки вместо чисел, знак перевёрнут — «Пример 1» проходит, «Пример 2» нет.
          expectMistake: strings
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print(f"Можно нести: {weight} <= 12")
          note: В фигурных скобках f-строки только вес, сравнение осталось текстом.
          expectMistake: in-quotes
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print(f"Можно нести: weight <= 12")
          note: f-строка без фигурных скобок.
          expectMistake: in-quotes
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести (до 12 кг):", weight <= 12)
          note: Сравнение верное, в подписи лишний текст с числом 12 — разбор in-quotes срабатывать не должен.
          expectMistake: null
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести: False")
          note: Готовое слово False.
          expectMistake: no-compare
        - code: |
            # Прочитай вес рюкзака и преврати его в число
            # Выведи «Можно нести:» и результат сравнения веса с 12
          note: Стартовый код — общий разбор с расхождением строк.
          expectMistake: null
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", weight)
          note: Сравнение ещё не дописано — это не «готовый ответ».
          expectMistake: null
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", 12 <= weight)
          note: Операнды переставлены, знак <= остался.
          expectMistake: reversed
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print(f"Можно нести: {weight > 12}")
          note: Знак в другую сторону внутри f-строки — это не «сравнение в кавычках».
          expectMistake: reversed
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести: ", weight > 12)
          note: Знак в другую сторону и лишний пробел в подписи (пробел сам по себе допустим).
          expectMistake: reversed
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", weight <= 13)
          note: Граница сдвинута на единицу.
          expectMistake: too-high
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", weight < = 12)
          note: Знак записан с пробелом — < =.
          expectMistake: wrong-sign
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", 12 => weight)
          note: Справа налево, знак записан как =>.
          expectMistake: wrong-sign
        - code: |
            weight = int(input("Вес рюкзака -> "))
            print("Можно нести:", weight > 12)
          note: Стрелка «->» в подсказке input — это не сравнение в кавычках; знак в другую сторону.
          expectMistake: reversed
        - code: |
            weight = input("Вес рюкзака, кг: ")
            int(weight)
            weight = int(weight)
            print("Можно нести:", weight < 12)
          note: Число пересохранено, старая строка int(weight) осталась; ошибка — строгое <.
          expectMistake: strict
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", weight <= "12")
          note: Вес — число, а 12 в кавычках.
          expectMistake: no-int
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            # print("Можно нести:", weight =< 12)
            print("Можно нести: True")
          note: Сравнение закомментировано, ответ записан готовым словом.
          expectMistake: no-compare
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести:", weight <= 11)
          note: "«Не тяжелее 12» прочитано как <= 11."
          expectMistake: strict
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести: " + weight <= 12)
          note: Склейка через + до сравнения — TypeError при склейке.
          expectMistake: plus-before-compare
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести: " + str(weight) <= 12)
          note: Склеены подпись и вес, с 12 сравнивается текст — TypeError.
          expectMistake: plus-before-compare
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести: " + str(weight) <= str(12))
          note: 'Текст «Можно нести: 8» сравнивается с "12" — печатается только False.'
          expectMistake: plus-before-compare
        - code: |
            weight = int(input("Вес рюкзака, кг: "))
            print("Можно нести: " + str(weight < 12))
          note: Склейка верная, знак строгий — plus-before-compare срабатывать не должен.
          expectMistake: strict
      mistakes:
        - id: plus-before-compare
          when:
            codeRegex: '["'']\s*\+\s*(?:str\s*\(\s*\w+\s*\)|\w+)\s*(?:[<>]=?|==|!=)'
          why: >-
            Python сначала выполняет `+`, а уже потом сравнение: к подписи приклеивается вес, а не
            ответ на вопрос. Если склейка удалась, с 12 сравнивается весь текст вроде «Можно
            нести: 8». Отсюда ошибка TypeError или ответ без подписи.
          try: >-
            Перечисли подпись и сравнение в `print` через запятую: сначала текст в кавычках, потом
            сравнение. А если склеиваешь через `+`, оберни в `str(...)` всё сравнение целиком — от
            `weight` до `12`.
          verify: 'В «Примере 1» должно получиться «Можно нести: True».'
        - id: int-not-saved
          when:
            codeRegex: '^\s*(?:int|float)\s*\(\s*(\w+)\s*\)\s*$(?![\s\S]*^\s*\1\s*=(?!=))'
          why: >-
            Строка вида `int(weight)` превращает текст в число, но никуда его не кладёт — результат
            пропадает, как несохранённый ответ `input()`. В `weight` по-прежнему строка, и
            сравнивается она.
          try: >-
            Сохрани число в переменную: `weight = int(input(...))` — тогда отдельная строка с
            `int()` не нужна.
          verify: 'В «Примере 1» должно получиться «Можно нести: True».'
        - id: no-int
          when:
            errorIncludes: not supported between instances
          why: >-
            Python не может сравнить строку с числом знаком `<=`, `<`, `>` или `>=` — отсюда
            TypeError. Строкой обычно оказывается ответ `input()`: даже `8` приходит как текст
            `"8"`.
          try: >-
            Оберни ввод в `int(...)`: `int(input(...))`. А число 12 в сравнении пиши без кавычек.
          verify: 'Ошибка TypeError должна исчезнуть, а в «Примере 1» появится «Можно нести: True».'
        - id: wrong-sign
          when:
            errorType: SyntaxError
            codeRegex: '=<|=>|[≤≥]|[<>][ \t]+='
          why: >-
            Python не знает записей `=<`, `=>`, `< =` с пробелом и значков `≤`, `≥`. Знак `=`
            всегда стоит вторым и вплотную: «меньше или равно» — `<=`, «больше или равно» — `>=`.
          try: >-
            Поставь `=` вторым и без пробела, не меняя направления стрелки: `=<` и `< =` → `<=`,
            `=>` и `> =` → `>=`.
          verify: SyntaxError должна исчезнуть.
        - id: strings
          when:
            codeRegex: '["'']\s*12\s*["'']|\bstr\s*\(\s*12\s*\)'
          why: >-
            Число 12 превратилось в строку — кавычками или через `str()`, и Python сравнивает
            текст: по первому отличающемуся символу. `"8" <= "12"` — False, потому что символ «8»
            идёт после «1». Python не сообщает об ошибке, но вес так сравнивать нельзя.
          try: >-
            Сравнивай числа: преврати ввод через `int(input(...))`, а 12 оставь числом — без
            кавычек и без `str()`.
          verify: В «Примере 1» для 8 кг должно получиться True, а в «Примере 2» для 15 кг — False.
        - id: no-label
          when:
            outputEquals: "True"
          why: >-
            Сравнение верное, но на экране только ответ. В условии перед ним нужна подпись «Можно
            нести:».
          try: >-
            Напечатай подпись и ответ в одном `print` через запятую: сначала текст в кавычках,
            потом сравнение.
          verify: 'В «Примере 1» должно получиться «Можно нести: True».'
        - id: no-space
          when:
            outputEquals: "Можно нести:True"
          why: >-
            Ответ верный, но прилип к двоеточию. Знак `+` склеивает строки ровно как есть и пробел
            сам не добавляет.
          try: >-
            Добавь пробел в конце подписи: `"Можно нести: "` — или перечисли подпись и ответ в
            `print` через запятую, тогда пробел поставит Python.
          verify: 'В «Примере 1» должно получиться «Можно нести: True» — с пробелом после двоеточия.'
        - id: in-quotes
          when:
            codeRegex: '(?<!\binput\s*)[(,+]\s*[fF]?(["''])(?:(?!\1)[^{\n]|\{[^}\n]*\})*?(?:[<>]|==|!=)'
            failedTest: t1
          why: >-
            На экране сам текст сравнения, а не ответ: сравнение стоит внутри кавычек, и Python
            печатает его как обычный текст.
          try: >-
            Вынеси сравнение из кавычек — в кавычках остаётся только подпись «Можно нести:». В
            f-строке Python вычисляет только то, что стоит в фигурных скобках `{…}`, — туда должно
            попасть всё сравнение целиком, от `weight` до `12`.
          verify: В «Примере 1» должно появиться True.
        - id: no-compare
          when:
            codeRegex: '["'']Можно нести:\s*(?:True|False)\s*["'']|(?<![\s\S])(?![\s\S]*(?:[<>≤≥]|==|!=))(?=[\s\S]*\b(?:True|False)\b)'
          why: >-
            Ответ записан в коде готовым словом, поэтому он одинаковый для любого веса: и для 8 кг,
            и для 15 кг программа печатает одно и то же. А она должна сама спросить, не тяжелее ли
            рюкзак 12 кг.
          try: Вместо готового слова напечатай результат сравнения веса с 12.
          verify: В «Примере 1» должно получиться True, а в «Примере 2» — False.
        - id: reversed
          when:
            failedTest: t1
            outputIncludes: "False"
          why: >-
            Для рюкзака в 8 кг программа ответила False, а такой вес нести можно. Сравнение задаёт
            не тот вопрос: «не тяжелее 12» — это «вес меньше или равен 12».
          try: >-
            Прочитай сравнение вслух слева направо, подставив 8 вместо веса: должен получиться
            вопрос «8 меньше или равно 12?». Проверь знак и то, что стоит слева и справа от него.
          verify: В «Примере 1» должно получиться True, а в «Примере 2» — False.
        - id: strict
          when:
            failedTest: t3
            outputIncludes: "False"
          why: >-
            «Не тяжелее 12 кг» включает сами 12 кг, а сравнение сейчас для 12 отвечает False. Так
            работает строгое `weight < 12` или `12 > weight` — оно спрашивает «строго меньше?», и
            так же — сравнение с 11: `weight <= 11`.
          try: Сравни вес именно с 12 знаком «меньше или равно» — он включает и само число 12.
          verify: В граничном случае «ровно 12 кг» должно получиться True.
        - id: too-high
          when:
            failedTest: t4
            outputEquals: "Можно нести: True"
          why: >-
            Для рюкзака в 13 кг программа ответила True, а нести его нельзя. Граница сдвинута:
            сравнение пропускает рюкзаки тяжелее 12 кг.
          try: Проверь число и знак в сравнении — ровно 12 кг нести можно, а 13 кг уже нельзя.
          verify: 'В граничном случае «13 кг» должно получиться «Можно нести: False».'
      afterPass: >-
        Программа отвечает «да» или «нет» для любого веса — и на самом пороге 12 кг тоже. Одно
        улучшение: сохрани ответ в переменную с понятным именем, например
        `can_carry = weight <= 12`, — тогда код читается как фраза.
      skills: [comparisons, type-conversion]

  - id: practice-greenhouse
    type: exercise
    title: Практика 2
    exercise:
      id: m2-l1-e2
      kind: modify
      title: Жара и заморозок
      statement: |-
        Датчик в теплице бабушки Нины уже сообщает, жарко ли там: жарко — выше 30 градусов.
        Добавь вторую строку вывода: `Заморозок: True`, если температура 0 градусов или ниже, иначе
        `Заморозок: False`. Первую строку оставь как есть.

        Например, при −3 градусах вывод такой:

        ```text
        Жарко: False
        Заморозок: True
        ```
      input: Одна строка — температура, целое число (может быть отрицательным).
      output: "Две строки: `Жарко: <True или False>` и `Заморозок: <True или False>`."
      constraints:
        - Строку «Жарко» не меняй.
      starterCode: |
        temp = int(input("Температура в теплице: "))
        print("Жарко:", temp > 30)
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "-3\n"
          expected: |-
            Жарко: False
            Заморозок: True
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "35\n"
          expected: |-
            Жарко: True
            Заморозок: False
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Обычный случай: 15 градусов"
          stdin: "15\n"
          expected: |-
            Жарко: False
            Заморозок: False
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: ровно 0"
          edge: true
          stdin: "0\n"
          expected: |-
            Жарко: False
            Заморозок: True
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: "Граничный случай: 1 градус"
          edge: true
          stdin: "1\n"
          expected: |-
            Жарко: False
            Заморозок: False
          compare:
            ignoreSpaces: true
        - id: t6
          kind: io
          title: "Граничный случай: ровно 30"
          edge: true
          stdin: "30\n"
          expected: |-
            Жарко: False
            Заморозок: False
          compare:
            ignoreSpaces: true
        - id: t7
          kind: io
          title: "Граничный случай: 31 градус"
          edge: true
          stdin: "31\n"
          expected: |-
            Жарко: True
            Заморозок: False
          compare:
            ignoreSpaces: true
      criteria:
        - Первая строка «Жарко» осталась прежней.
        - Вторая строка отвечает True при температуре 0 и ниже, иначе False.
        - При 0 заморозок есть, при 1 градусе — уже нет.
      hints:
        - >-
          Вторая строка устроена так же, как первая, только вопрос другой: «температура не выше
          нуля?». Каким знаком записать «не выше»?
        - >-
          На другом примере: `print("Скидка:", total >= 1000)` печатает `Скидка: True` и для 1200,
          и для самой 1000 — знак `>=` включает границу.
        - |-
          Каркас: оставь обе строки программы и допиши третью:
          ```text
          print("Заморозок:", temp … 0)
          ```
      solution:
        code: |
          temp = int(input("Температура в теплице: "))
          print("Жарко:", temp > 30)
          print("Заморозок:", temp <= 0)
        explanation: >-
          Новая строка задаёт о той же температуре свой вопрос: «температура меньше или равна 0?».
          «0 или ниже» включает сам ноль, поэтому нужен `<=`. Для целых чисел подойдёт и
          `temp < 1`.
      altSolutions:
