    exercise:
      id: m2-l3-e3
      kind: write
      title: УФ-индекс в прогнозе
      statement: |-
        Летом в прогнозе погоды часто пишут **УФ-индекс** — насколько сильное сегодня солнце и
        нужна ли от него защита. Метеослужбы делят индекс на пять категорий по международной
        шкале:

        ```text
        0–2         — низкий
        3–5         — умеренный
        6–7         — высокий
        8–10        — очень высокий
        11 и выше   — экстремальный
        ```

        Напиши программу, которая читает УФ-индекс (целое число, 0 или больше) и печатает его
        категорию: `Низкий`, `Умеренный`, `Высокий`, `Очень высокий` или `Экстремальный`.
        Регистр букв не проверяется.
      input: Одна строка — УФ-индекс, целое число, 0 или больше.
      output: "Одна строка — категория: Низкий, Умеренный, Высокий, Очень высокий или Экстремальный."
