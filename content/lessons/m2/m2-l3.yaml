id: m2-l3
module: m2
number: "2.3"
title: "elif: несколько вариантов"
objective: >-
  Выбирать один вариант из нескольких цепочкой if / elif / else и расставлять проверки в таком
  порядке, чтобы общее условие не перехватывало частное.
minutes: [25, 30]
prerequisites: [m2-l2]
skills: [conditions]
environment: python

story:
  title: Три зоны доставки
  fictional: true
  text: >-
    Цветочная мастерская «Ромашка» возит букеты по городу, и цена доставки зависит от
    расстояния: до 3 км — 99 ₽, до 10 км — 199 ₽, дальше — 399 ₽. Диспетчер Зарина смотрела
    расстояние на карте и искала нужную строку в табличке, а в предпраздничной суете ошибалась:
    однажды клиент заплатил за 3 км как за 10. Теперь цену называет программа: она проверяет
    зоны по очереди, от ближней к дальней, и останавливается на первой подходящей. Но и программа
    ошибётся, если поставить проверки в неправильном порядке.

why: >-
  Часто вариантов больше двух: оценки, тарифы, зоны доставки. Цепочка `if` / `elif` / `else`
  выбирает из них ровно один — первый подходящий. Например, по расстоянию программа сама
  называет одну из трёх цен доставки.

usedIn: >-
  Тарифы и скидки в интернет-магазинах, категории в прогнозах погоды, уровни и награды в играх,
  статусы заказов: «собирается», «в пути», «доставлен».

steps:
  - id: idea
    type: theory
    title: Цепочка проверок
    body: |-
      В прошлом уроке `if` и `else` выбирали из двух вариантов. Но зон доставки у мастерской три,
      а оценок за тест — четыре. Для такого выбора есть **`elif`** — сокращение от else if,
      «иначе, если».

      ```python
      if km <= 3:
          price = 99
      elif km <= 10:
          price = 199
      else:
          price = 399
      ```

      Такая запись называется **цепочкой проверок**. Условие вместе со своим блоком — это
      **ветка**, как ветки `if` и `else` в прошлом уроке, только теперь их больше двух. Python
      выполняет цепочку так:

      - проверяет условия **сверху вниз**;
      - выполняет блок **первого** условия, которое оказалось True, и выходит из цепочки.
        Условия ниже он даже не проверяет;
      - если не подошло ни одно условие, выполняется блок `else`. Его можно не писать — тогда
        не выполнится ни одна ветка.

      Цепочку всегда начинает `if`. У `elif`, как у `if`, есть условие и двоеточие, а под ним —
      блок с отступом. Веток `elif` может быть сколько угодно, но все они стоят между `if` и `else`:
      `else` всегда последний. Если поставить `elif` после `else`, Python не запустит программу и
      сообщит `SyntaxError: 'elif' block follows an 'else' block`.

      **Почему во второй проверке не нужно писать «больше 3».** До строки `elif km <= 10`
      Python доходит, только если `km <= 3` оказалось False. Значит, расстояние здесь уже
      больше 3.

      **Порядок решает.** Python не ищет самое подходящее условие — он берёт первое верное.
      Допустим, магазин даёт скидку 5 % на покупку от 1000 рублей и 10 % — от 3000:

      ```python
      total = 5000
      if total >= 1000:
          print("Скидка 5 %")
      elif total >= 3000:
          print("Скидка 10 %")
      ```

      Покупатель потратил 5000, а получил только 5 %: условие `total >= 1000` верно и для 5000,
      и цепочка остановилась на нём. `total >= 1000` — **общее** условие: оно верно для многих
      сумм. `total >= 3000` — **частное**, то есть частный случай: оно верно только для части этих
      сумм. Общее условие стоит раньше и перехватывает частное. Правило: со знаками `>=` и `>` иди
      от большего порога к меньшему, с `<=` и `<` — от меньшего к большему.

      **Отдельные `if` — не цепочка.** Каждый `if` начинает новую проверку. Два `if` подряд
      проверяются оба и могут сработать оба. Если нужен ровно один ответ из нескольких, пиши
      цепочку с `elif`.
    simpler: >-
      Цепочка — как инструктор в бассейне со списком правил: «проплываешь 100 метров — на
      глубокую дорожку», «умеешь плавать — на среднюю», «все остальные — в лягушатник». Он
      читает правила сверху вниз и выполняет первое подходящее. Если правило «умеешь плавать»
      поставить выше, сильный пловец попадёт на среднюю дорожку: плавать он ведь тоже умеет.
      Поэтому строгие правила ставят выше общих, а «всех остальных» — в самый конец, как `else`.
    coach: >-
      Написал цепочку — прогони в уме самое маленькое и самое большое значение, а потом числа
      на каждой границе. Каждое должно попасть в свою ветку.

  - id: delivery
    type: example
    title: Цена доставки по зонам
    body: >-
      Программа из истории. Расстояние здесь записано прямо в коде, чтобы его было легко
      менять. В заданиях оно будет приходить из ввода.
    code: |-
      km = 7
      if km <= 3:
          price = 99
      elif km <= 10:
          price = 199
      else:
          price = 399
      print(f"Доставка: {price} ₽")
    notes:
      - line: 2
        text: >-
          Первая проверка. Если она True, Python выполнит строку 3 и сразу перейдёт к строке 8 —
          остальные ветки пропустит.
      - line: 4
        text: >-
          Сюда Python доходит, только если `km <= 3` оказалось False. Значит, расстояние уже
          больше 3 — повторять это в условии не нужно.
      - line: 6
        text: "`else` без условия: всё, что дальше 10 км. Он всегда стоит последним."
      - line: 8
        text: >-
          `print` без отступа стоит после цепочки. Какая бы ветка ни сработала, цену печатает
          одна и та же строка.
    tryIt: >-
      Замени 7 на 3, потом на 10 и на 10.5 и запускай после каждой замены. Затем поменяй местами
      условия вместе с ценами: пусть первой идёт проверка `km <= 10` с ценой 199, а второй —
      `km <= 3` с ценой 99. Слова `if` и `elif` оставь на своих местах. Поставь `km = 2` и запусти.
      Почему доставка стала стоить 199?
    coach: >-
      Перед каждым запуском назови цену вслух, а потом сверь с результатом. Так цепочка быстрее
      станет понятной.

  - id: two-ifs
    type: predict
    title: Тепло или прохладно?
    prompt: >-
      Как думаешь, что выведет эта программа? Напиши вывод построчно.
    code: |-
      t = 25
      if t > 20:
          print("Тепло")
      if t > 10:
          print("Прохладно")
      else:
          print("Холодно")
    answer: |-
      Тепло
      Прохладно
    explanation: >-
      Это не цепочка, а два отдельных `if`. Первый напечатал «Тепло». Второй `if` начинает новую
      проверку: 25 > 10 — тоже True, поэтому напечаталось и «Прохладно». `else` относится только
      ко второму `if`. Если заменить второй `if` на `elif`, программа выведет только «Тепло»:
      цепочка остановится на первом `if`.
    coach: >-
      Каждое слово `if` в начале строки начинает новую проверку. `elif` и `else` продолжают ту,
      что уже началась.

  - id: ladder
    type: order
    title: Собери лестницу проверок
    prompt: >-
      Шагомер в конце дня выдаёт медаль: от 5000 шагов — «Бронза», от 10 000 — «Золото», от
      7000 — «Серебро», меньше 5000 — «Без медали». Программа проверяет условия сверху вниз и
      берёт первое подходящее. Расставь проверки так, чтобы каждый получил свою медаль.
    items:
      - id: gold
        text: Шагов 10 000 или больше → Золото
      - id: silver
        text: Шагов 7000 или больше → Серебро
      - id: bronze
        text: Шагов 5000 или больше → Бронза
      - id: none
        text: Все остальные → Без медали
    explanation: |-
      Со знаком `>=` идём от большего порога к меньшему:

      ```python
      if steps >= 10000:
          print("Золото")
      elif steps >= 7000:
          print("Серебро")
      elif steps >= 5000:
          print("Бронза")
      else:
          print("Без медали")
      ```

      Если первой поставить проверку «5000 или больше», за 12 000 шагов шагомер выдаст бронзу:
      12 000 >= 5000 — True, и цепочка остановится на первой же ветке. «Все остальные» — это
      `else`, он всегда последний.
    coach: Самая строгая проверка — наверху, «все остальные» — внизу.

  - id: practice-zones
    type: exercise
    title: Практика 1
    exercise:
      id: m2-l3-e1
      kind: modify
      title: Новая зона доставки
      statement: |-
        Мастерская «Ромашка» расширила доставку, и зон стало четыре:

        ```text
        до 3 км включительно    — 99 ₽
        до 10 км включительно   — 199 ₽
        до 20 км включительно   — 299 ₽
        дальше 20 км            — 399 ₽
        ```

        Добавь в программу новую зону. Расстояние читается из ввода и может быть дробным,
        например `12.5`. Вывод — одна строка в том же виде, что и сейчас: `Доставка: 299 ₽`.
      input: Одна строка — расстояние в километрах, целое или дробное (через точку).
      output: "Одна строка: `Доставка: <цена> ₽`."
      constraints:
        - Добавь новую зону, не переписывая программу целиком.
        - Знак ₽ уже стоит в `print` — набирать его не нужно.
      starterCode: |
        km = float(input("Расстояние, км: "))
        if km <= 3:
            price = 99
        elif km <= 10:
            price = 199
        else:
            price = 399
        print(f"Доставка: {price} ₽")
      tests:
        - id: t1
          kind: io
          title: "Пример 1: 5 км"
          example: true
          stdin: "5\n"
          expected: "Доставка: 199 ₽"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: "Пример 2: 15 км"
          example: true
          stdin: "15\n"
          expected: "Доставка: 299 ₽"
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Пример 3: 25 км"
          example: true
          stdin: "25\n"
          expected: "Доставка: 399 ₽"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: Дробное расстояние
          stdin: "2.5\n"
          expected: "Доставка: 99 ₽"
          compare:
            ignoreSpaces: true
        - id: t-3
          kind: io
          title: "Граничный случай: ровно 3 км"
          edge: true
          stdin: "3\n"
          expected: "Доставка: 99 ₽"
          compare:
            ignoreSpaces: true
        - id: t-3-5
          kind: io
          title: "Граничный случай: 3.5 км"
          edge: true
          stdin: "3.5\n"
          expected: "Доставка: 199 ₽"
          compare:
            ignoreSpaces: true
        - id: t-10
          kind: io
          title: "Граничный случай: ровно 10 км"
          edge: true
          stdin: "10\n"
          expected: "Доставка: 199 ₽"
          compare:
            ignoreSpaces: true
        - id: t-10-5
          kind: io
          title: "Граничный случай: 10.5 км"
          edge: true
          stdin: "10.5\n"
          expected: "Доставка: 299 ₽"
          compare:
            ignoreSpaces: true
        - id: t-20
          kind: io
          title: "Граничный случай: ровно 20 км"
          edge: true
          stdin: "20\n"
          expected: "Доставка: 299 ₽"
          compare:
            ignoreSpaces: true
        - id: t-20-5
          kind: io
          title: "Граничный случай: 20.5 км"
          edge: true
          stdin: "20.5\n"
          expected: "Доставка: 399 ₽"
          compare:
            ignoreSpaces: true
      criteria:
        - "Каждое расстояние попадает в свою зону: 5 км — 199 ₽, 15 км — 299 ₽, 25 км — 399 ₽."
        - "Границы входят в зону: ровно 3, 10 и 20 км относятся к ближней зоне, а 3.5 и 10.5 км — уже к следующей."
        - "`else` остаётся последней веткой цепочки."
      hints:
        - >-
          Новая зона лежит между 10 и 20 км. Подумай, в какое место цепочки поставить её
          проверку, чтобы 5 км не попали в неё раньше времени, а `else` остался последним.
        - |-
          Цепочка по возрастанию на другом примере — цена пересылки письма по весу:

          ```python
          if grams <= 20:
              price = 30
          elif grams <= 100:
              price = 60
          elif grams <= 250:
              price = 90
          else:
              price = 150
          ```

          Каждая следующая граница больше предыдущей, а `else` — последний.
        - |-
          Каркас цепочки:

          ```text
          if km <= 3:
              price = 99
          elif km <= 10:
              price = 199
          elif km <= …:      ← новая зона
              price = …
          else:
              price = 399
          ```
      solution:
        code: |
          km = float(input("Расстояние, км: "))
          if km <= 3:
              price = 99
          elif km <= 10:
              price = 199
          elif km <= 20:
              price = 299
          else:
              price = 399
          print(f"Доставка: {price} ₽")
        explanation: >-
          Новая проверка `elif km <= 20` стоит после ветки `km <= 10` и перед `else`. До неё
          Python доходит, только если расстояние больше 10, поэтому 5 км остаются в своей зоне,
          а 15 км попадают в новую. Если будешь писать такую цепочку с нуля, можно идти и с другого
          конца — от дальних зон к ближним через `>`: тогда первой стоит проверка `km > 20`.
      altSolutions:
        - code: |
            km = float(input("Расстояние, км: "))
            if km > 20:
                price = 399
            elif km > 10:
                price = 299
            elif km > 3:
                price = 199
            else:
                price = 99
            print(f"Доставка: {price} ₽")
          note: От дальних зон к ближним через >.
        - code: |
            km = float(input())
            if km <= 3:
                print("Доставка: 99 ₽")
            elif km <= 10:
                print("Доставка: 199 ₽")
            elif km <= 20:
                print("Доставка: 299 ₽")
            else:
                print("Доставка: 399 ₽")
          note: print в каждой ветке вместо переменной price.
        - code: |
            km = float(input("Расстояние, км: "))
            price = 399
            if km <= 20:
                price = 299
            if km <= 10:
                price = 199
            if km <= 3:
                price = 99
            print(f"Доставка: {price} ₽")
          note: Отдельные if, каждый следующий уточняет цену. Тоже верно, хотя цепочка понятнее.
        - code: |
            km = float(input("Расстояние, км: "))
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            elif km > 20:
                price = 399
            else:
                price = 299
            print(f"Доставка: {price} ₽")
          note: Новая проверка — для дальней зоны, а новая цена ушла в else.
        - code: |
            km = float(input("Расстояние, км: "))
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            else:
                if km <= 20:
                    price = 299
                else:
                    price = 399
            print(f"Доставка: {price} ₽")
          note: Новая зона вложена в else — минимальная правка.
      wrongSolutions:
        - code: |
            km = float(input("Расстояние, км: "))
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            else:
                price = 399
            print(f"Доставка: {price} ₽")
          note: Код не изменён — новой зоны нет.
          expectMistake: unchanged
        - code: |
            km = float(input("Расстояние, км: "))
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            else:
                price = 399
            elif km <= 20:
                price = 299
            print(f"Доставка: {price} ₽")
          note: elif вставлен после else.
          expectMistake: after-else
        - code: |
            km = float(input("Расстояние, км: "))
            if km <= 3:
                price = 99
            elif km <= 20:
                price = 299
            elif km <= 10:
                price = 199
            else:
                price = 399
            print(f"Доставка: {price} ₽")
          note: Зона «до 20» стоит раньше зоны «до 10» и перехватывает её.
          expectMistake: wrong-place
        - code: |
            km = float(input("Расстояние, км: "))
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            elif km > 10:
                price = 299
            else:
                price = 399
            print(f"Доставка: {price} ₽")
          note: У новой зоны нет верхней границы — else больше не срабатывает.
          expectMistake: catch-all
        - code: |
            km = float(input("Расстояние, км: "))
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            elif km < 20:
                price = 299
            else:
                price = 399
            print(f"Доставка: {price} ₽")
          note: Строгое < не включает 20 км в новую зону.
          expectMistake: strict-20
        - code: |
            km = int(input("Расстояние, км: "))
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            elif km <= 20:
                price = 299
            else:
                price = 399
            print(f"Доставка: {price} ₽")
          note: int вместо float — дробное расстояние ломает программу.
          expectMistake: int-input
        - code: |
            km = float(input("Расстояние, км: "))
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            if km <= 20:
                price = 299
            else:
                price = 399
            print(f"Доставка: {price} ₽")
          note: Новая зона начата словом if в середине цепочки — отдельная проверка переписывает цену.
          expectMistake: separate-if
        - code: |
            km = float(input("Расстояние, км: "))
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            else:
                price = 399
            if km <= 20:
                price = 299
            print(f"Доставка: {price} ₽")
          note: Ошибку «elif после else» «исправили», заменив elif на if, — отдельный if после цепочки.
          expectMistake: separate-if
        - code: |
            km = float(input("Расстояние, км: "))
            if km > 20:
                price = 399
            elif km >= 11:
                price = 299
            elif km >= 4:
                price = 199
            else:
                price = 99
            print(f"Доставка: {price} ₽")
          note: От дальних зон, но границы как для целых чисел — 3.5 и 10.5 км попадают не в ту зону.
          expectMistake: whole-km
        - code: |
            km = float(input())
            if km < 4:
                price = 99
            elif km < 11:
                price = 199
            elif km <= 20:
                price = 299
            else:
                price = 399
            print(f"Доставка: {price} ₽")
          note: Строгое < со следующим целым числом — для дробного расстояния неверно.
          expectMistake: whole-km
        - code: |
            km = float(input())
            if km >= 20:
                price = 399
            elif km > 10:
                price = 299
            elif km > 3:
                price = 199
            else:
                price = 99
            print(f"Доставка: {price} ₽")
          note: От дальних зон через >=, ровно 20 км уходит в 399 ₽.
          expectMistake: strict-20
        - code: |
            km = float(input())
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            elif km > 10:
                price = 299
            else:
                price = 399
            print("Доставка:", price, " ₽")
          note: Ошибка catch-all, а в выводе лишний пробел, который тесты прощают.
          expectMistake: catch-all
        - code: |
            km = float(input())
            if km <= 3:
                price = 99
            elif km <= 10:
                price = 199
            elif km > 20:
                price = 299
            else:
                price = 399
            print(f"Доставка: {price} ₽")
          note: Перепутаны цены дальних зон — ни один заготовленный разбор не подходит.
          expectMistake: null
      mistakes:
        - id: after-else
          when:
            errorIncludes: follows an 'else' block
          why: >-
            `else` — последняя ветка цепочки, «все остальные». После него цепочка закончилась, и
            `elif` ниже Python не к чему присоединить. Об этом и сообщение:
            `'elif' block follows an 'else' block` — «блок elif идёт после блока else».
          try: Перенеси новую проверку вместе с её ценой выше `else:` — сразу после ветки с ценой 199.
          verify: 'Программа запустится, а для 15 км выведет «Доставка: 299 ₽».'
        - id: int-input
          when:
            errorType: ValueError
          why: >-
            `int()` понимает только запись целого числа, а `2.5` — дробная запись: на этом вводе
            программа остановилась с ValueError.
          try: Читай расстояние через `float(...)`, как в исходной программе, — он понимает и `5`, и `2.5`.
          verify: Проверка «Дробное расстояние» должна пройти.
        - id: separate-if
          when:
            failedTest: t1
            outputIncludes: "299"
            codeRegex: '(?<=^if\b[\s\S]*)^if[ \t]+km[ \t]*<=?[ \t]*20\b'
          why: >-
            Для 5 км вышло 299 ₽. Проверка «до 20 км» начинается со слова `if`, а не `elif`, —
            значит, это новая, отдельная проверка. Цепочка выше уже выбрала 199 ₽, но потом Python
            проверил и `km <= 20`: для 5 км это тоже True, и цена переписалась на 299.
          try: >-
            Сделай новую проверку частью цепочки: `elif km <= 20:` сразу после ветки `km <= 10` и
            перед `else:`.
          verify: 'В «Примере 1» должно получиться «Доставка: 199 ₽».'
        - id: wrong-place
          when:
            failedTest: t1
            outputIncludes: "299"
            codeRegex: 'km\s*<=?\s*20\b[\s\S]*km\s*<=?\s*10\b'
          why: >-
            Для 5 км вышло 299 ₽. Проверка «до 20 км» стоит раньше проверки «до 10 км», а
            `5 <= 20` — тоже True. Цепочка остановилась на первой подходящей ветке, и до зоны
            199 ₽ дело не дошло.
          try: 'Поставь новую проверку после ветки `km <= 10`: границы должны идти по возрастанию — 3, 10, 20.'
          verify: 'В «Примере 1» должно получиться «Доставка: 199 ₽».'
        - id: unchanged
          when:
            failedTest: t2
            outputIncludes: "399"
            codeRegex: '(?<![\s\S])(?![\s\S]*\b20\b)'
          why: >-
            Для 15 км по-прежнему 399 ₽: зоны «до 20 км» в цепочке пока нет, и всё, что дальше
            10 км, попадает в `else`.
          try: Добавь ещё одну ветку `elif` с границей 20 и ценой 299 — между веткой 199 ₽ и `else`.
          verify: 'В «Примере 2» должно получиться «Доставка: 299 ₽».'
        - id: catch-all
          when:
            failedTest: t3
            outputIncludes: "299"
          why: >-
            Для 25 км вышло 299 ₽ вместо 399: ветка с ценой 299 забирает всё, что дальше 10 км, —
            и 25, и 100 км. Поэтому до цены 399 дело не доходит.
          try: >-
            Дай новой зоне верхнюю границу — «до 20 км включительно». Что расстояние больше 10,
            Python уже знает: до этой ветки доходят только такие.
          verify: 'В «Примере 3» должно получиться «Доставка: 399 ₽».'
        - id: strict-20
          when:
            failedTest: t-20
            outputIncludes: "399"
            codeRegex: 'km\s*(?:<|>=)\s*20\b'
          why: >-
            Ровно 20 км стоят у тебя 399 ₽, а по условию это ещё зона 299 ₽ — «до 20 км
            включительно». Посмотри на знак в проверке с числом 20: `20 < 20` — False, а
            `20 >= 20` — True, и в обоих случаях 20 км уходят в дальнюю зону.
          try: 'Граница 20 должна попасть в зону 299 ₽: пиши `km <= 20` для этой зоны или `km > 20` для дальней.'
          verify: Граничный случай «ровно 20 км» должен стать зелёным.
        - id: whole-km
          when:
            codeRegex: 'km\s*(?:>=|<)\s*(?:4|11)\b'
            outputIncludes: Доставка
          why: >-
            Расстояние бывает дробным, а границы зон у тебя сдвинуты до целого числа. Например,
            3.5 км — это уже зона 199 ₽, а у тебя граница стоит на 4 км, и 3.5 км попадают в зону
            99 ₽. Между 3 и 4 км тоже есть расстояния.
          try: >-
            Сравнивай с настоящими границами из таблицы — 3, 10 и 20 км: например, `km > 3`
            вместо `km >= 4` или `km <= 3` вместо `km < 4`.
          verify: Граничные случаи «3.5 км» и «10.5 км» должны стать зелёными.
      afterPass: >-
        Новая зона встала на своё место, и старые не сломались. Проверь себя в уме: куда попадут
        20 и 20.1 км? Если получилось 299 ₽ и 399 ₽, ты читаешь цепочку так же, как Python.
      skills: [conditions]

  - id: practice-grades
    type: exercise
    title: Практика 2
    exercise:
      id: m2-l3-e2
