            убыванию: 90, 75, 50, а `else` — последним.
          verify: 'В «Примере 1» должно получиться «Оценка: 5».'
        - id: half-fixed
          when:
            failedTest: t1
            outputIncludes: Оценка
            codeRegex: 'score\s*>=\s*75\b[\s\S]*score\s*>=\s*90\b'
          why: >-
            Уже лучше, но за 95 баллов всё ещё четвёрка: проверка `>= 75` стоит выше `>= 90` и
            перехватывает 95 — ведь `95 >= 75` тоже True.
          try: 'Выстрой пороги строго по убыванию: сначала 90, потом 75, потом 50.'
          verify: 'В «Примере 1» должно получиться «Оценка: 5».'
        - id: fifty-before-75
          when:
            failedTest: t2
            outputIncludes: Оценка
            codeRegex: 'score\s*>=\s*50\b[\s\S]*score\s*>=\s*75\b'
          why: >-
            За 80 баллов вышла не четвёрка: проверка `score >= 50` стоит в цепочке выше
            `score >= 75`, а `80 >= 50` — тоже True. Цепочка остановилась на ней, и до проверки на
            четвёрку дело не дошло.
          try: >-
            Выстрой все пороги по убыванию — 90, потом 75, потом 50 — и под каждым оставь его
            оценку из таблицы. Наверху должна стоять самая строгая проверка.
          verify: 'В «Примере 2» должно получиться «Оценка: 4».'
        - id: strict
          when:
            codeRegex: 'score\s*>\s*(90|75|50)\b'
            outputIncludes: Оценка
          why: >-
            Знак `>` не включает сам порог: например, `75 > 75` — False, и ровно 75 баллов
            получают оценку ниже. А по таблице порог — 90, 75 или 50 — уже входит в более высокую
            оценку.
          try: Замени `>` на `>=` там, где стоит порог из таблицы — 90, 75 или 50.
          verify: Граничные случаи «ровно 90», «ровно 75» и «ровно 50» должны стать зелёными.
        - id: strict-le
          when:
            codeRegex: 'score\s*<=\s*(?:90|75|50)\b[\s\S]*^else\s*:\s*(?:print\([^\n]*5|\w+\s*=\s*5)\b'
            outputIncludes: Оценка
          why: >-
            Со знаком `<=` число из условия входит в эту ветку, то есть в более низкую оценку:
            например, `75 <= 75` — True, и ровно 75 баллов получают тройку. А по таблице порог —
            90, 75 или 50 — уже относится к более высокой оценке.
          try: >-
            Замени `<=` на `<`, оставив числа 90, 75 и 50, — или сравнивай с последним баллом
            каждой оценки: `<= 49`, `<= 74`, `<= 89`.
          verify: Граничные случаи «ровно 90», «ровно 75» и «ровно 50» должны стать зелёными.
      afterPass: >-
        Теперь каждый балл получает свою оценку, а 95 — пятёрку. Цепочку можно было выстроить и
        с другого конца — от меньшего порога к большему через `<`: сначала `score < 50` — двойка,
        потом `score < 75` — тройка и так далее.
      skills: [conditions, boundary-checks]

