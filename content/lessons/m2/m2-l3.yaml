      mistakes:
        - id: else-condition
          when:
            errorIncludes: "expected ':'"
            codeRegex: '^[ \t]*else\s+[^:\s]'
          why: >-
            У `else` не бывает условия: он ловит всё, что не подошло выше. Python ждёт двоеточие
            сразу после слова `else` и, встретив условие, сообщает `expected ':'`.
          try: >-
            Убери условие: для последней ветки хватит `else:` — всё, что больше 10, до неё и так
            дойдёт. Если ветке нужна своя проверка, это `elif`.
          verify: Программа должна запуститься, а для индекса 12 вывести «Экстремальный».
        - id: no-int
          when:
            errorIncludes: not supported between instances
          why: >-
            `input()` возвращает строку, а строку нельзя сравнить с числом знаками `<`, `<=`, `>`
            или `>=` — отсюда `TypeError: … not supported between instances of 'str' and 'int'`.
          try: Преврати ввод в число сразу при чтении — оберни `input(...)` в `int(...)`.
          verify: Ошибка TypeError должна исчезнуть.
        - id: separate-ifs
          when:
            codeRegex: '^if\b[^\n]*:[ \t]*\n?[ \t]*print\b(?:[\s\S]*^if\b[^\n]*:[ \t]*\n?[ \t]*print\b){2}'
            outputIncludes: "\n"
          why: >-
            В программе несколько отдельных `if`. Каждый `if` начинает новую проверку, поэтому
            Python проверяет их все подряд, и для одного индекса может сработать сразу несколько
            веток. Посмотри, сколько строк напечатала программа в непройденном тесте.
          try: 'Собери проверки в одну цепочку: первая проверка — `if`, остальные — `elif`, последняя ветка — `else:`.'
          verify: Для каждого индекса должна печататься ровно одна строка.
        - id: general-first
          when:
            codeRegex: '^(?:el)?if\s+\w+\s*>=?\s*[0-3]\b[\s\S]*^(?:el)?if\s+\w+\s*>=?\s*(?:[5-9]|1[01])\b'
            outputIncludes: "\n"
          why: >-
            Проверка с маленьким порогом стоит раньше проверок с большими. Например, `uv >= 3`
            верно для любого индекса от 3 и выше — и для 4, и для 9, и для 12. Цепочка
            останавливается на первом верном условии, и до категорий выше очередь не доходит.
          try: >-
            Со знаком `>=` начинай с самого большого порога: `>= 11`, потом 8, 6 и 3, а «Низкий»
            оставь для `else`. Или иди снизу со знаком `<=`: 2, 5, 7, 10.
          verify: 'Примеры должны пройти: для 4 — «Умеренный», для 9 — «Очень высокий», для 1 — «Низкий».'
        - id: le-from-top
          when:
            codeRegex: '^(?:el)?if\s+\w+\s*<=?\s*(?:[5-9]|1[01])\b[\s\S]*^(?:el)?if\s+\w+\s*<=?\s*[0-3]\b'
            outputIncludes: "\n"
          why: >-
            Проверка с большим порогом стоит раньше проверок с маленькими. Например, `uv <= 10`
            верно и для маленьких индексов: `4 <= 10` — True. Цепочка останавливается на ней, и до
            категорий ниже очередь не доходит. Со знаком `<=` идут от меньшего порога к большему.
          try: >-
            Начни с `<= 2`, потом 5, 7 и 10, а «Экстремальный» оставь для `else`. Или иди сверху,
            но со знаком `>=`: сначала `>= 11`.
          verify: 'Примеры должны пройти: для 4 — «Умеренный», для 9 — «Очень высокий», для 1 — «Низкий».'
        - id: no-extreme
          when:
            failedTest: t5
            outputEquals: ""
            codeRegex: '(?<![\s\S])(?![\s\S]*^[ \t]*else\b)(?=(?:[\s\S]*?^[ \t]*elif\b){3})'
          why: >-
            Для индекса 12 программа ничего не напечатала: ни одно условие не подошло, а ветки
            `else` в цепочке нет. У категории «11 и выше» пока нет своей ветки.
          try: Добавь в конец цепочки `else:` с категорией «Экстремальный».
          verify: Проверка «Индекс 12» должна стать зелёной.
        - id: boundary
          when:
            codeRegex: '\b\w+\s*<\s*(?:2|5|7|10)\b'
            outputIncludes: "\n"
          why: >-
            Граница входит в свою категорию: в шкале написано 0–2, 3–5, 6–7, 8–10. А знак `<`
            саму границу не включает: например, `2 < 2` — False, поэтому ровно 2 уходит в
            следующую категорию — «умеренный».
          try: >-
            В проверках с числами 2, 5, 7 и 10 замени `<` на `<=`. Или оставь `<`, но сравнивай с
            началом следующей категории: 3, 6, 8, 11.
          verify: Граничные случаи «ровно 2», «ровно 5», «ровно 7» и «ровно 10» должны стать зелёными.
        - id: boundary-le
          when:
            codeRegex: '\b\w+\s*<=\s*(?:3|6|8|11)\b'
            outputIncludes: "\n"
          why: >-
            Со знаком `<=` число из условия входит в эту категорию. А 3, 6, 8 и 11 — первые числа
            следующих категорий: например, `3 <= 3` — True, поэтому ровно 3 осталось в «низком»,
            хотя по шкале это уже «умеренный».
          try: >-
            В проверках с числами 3, 6, 8 и 11 замени `<=` на `<`. Или сравнивай с последним
            числом категории: `<= 2`, `<= 5`, `<= 7`, `<= 10`.
          verify: Тест «Индекс 6» и граничные случаи «ровно 3», «ровно 8» и «ровно 11» должны стать зелёными.
        - id: boundary-ge
          when:
            codeRegex: '\b\w+\s*>=\s*(?:2|5|7|10)\b'
            outputIncludes: "\n"
          why: >-
            Со знаком `>=` число из условия входит в категорию выше. А 2, 5, 7 и 10 — последние
            числа своих категорий: например, `2 >= 2` — True, поэтому ровно 2 ушло в «умеренный»,
            хотя по шкале это ещё «низкий».
          try: >-
            В проверках с числами 2, 5, 7 и 10 замени `>=` на `>`. Или сравнивай с первым числом
            категории: `>= 11`, `>= 8`, `>= 6`, `>= 3`.
          verify: Граничные случаи «ровно 2», «ровно 5», «ровно 7» и «ровно 10» должны стать зелёными.
        - id: strict-from-top
          when:
            codeRegex: '\b\w+\s*>\s*(?:3|6|8|11)\b'
            outputIncludes: "\n"
          why: >-
            Знак `>` не включает сам порог. А 3, 6, 8 и 11 — первые числа своих категорий:
            например, `6 > 6` — False, поэтому индекс 6 ушёл в «умеренный», хотя по шкале это уже
            «высокий».
          try: >-
            В проверках с числами 3, 6, 8 и 11 замени `>` на `>=`. Или оставь `>`, но сравнивай с
            последним числом категории ниже: 2, 5, 7, 10.
          verify: Тест «Индекс 6» и граничные случаи «ровно 3», «ровно 8» и «ровно 11» должны стать зелёными.
      afterPass: >-
        Пять веток — и ни одна не перехватывает чужую. Если бы ты сам писал тесты к этой
        программе, какие значения проверил бы первыми? Те, что на стыке категорий: 2 и 3, 5 и 6,
        7 и 8, 10 и 11.
      skills: [conditions, boundary-checks]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`elif` — «иначе, если». Python проверяет условия сверху вниз и выполняет только первую подходящую ветку; `else` — если не подошло ничего."
      - "Общее условие, поставленное раньше частного, перехватывает и его значения. Со знаками `>=` и `>` иди от большего порога к меньшему, с `<=` и `<` — от меньшего к большему."
      - Отдельные `if` проверяются все, каждый сам по себе. Если нужен один ответ из нескольких — нужна цепочка.
      - "Проверяй цепочку на числах у каждой границы: 3 и 3.5, 10 и 10.5."
    question: >-
      Почему в ветке `elif score >= 75` не нужно отдельно проверять, что баллов меньше 90?
    answer: >-
      До `elif` Python доходит, только если все условия выше оказались ложными. Раз проверка
      `score >= 90` дала False, баллов уже меньше 90 — повторять это не нужно.
