        меньше 50     — 2
        ```

        Но программа ставит тройку даже за 95 баллов. Найди причину и исправь. Вывод — одна
        строка, например `Оценка: 5`.
      input: Одна строка — целое число баллов от 0 до 100.
      output: "Одна строка: `Оценка: <оценка>`."
      constraints:
        - Исправь программу, не переписывая её целиком.
      starterCode: |
        score = int(input("Баллы: "))
        if score >= 50:
            print("Оценка: 3")
        elif score >= 75:
            print("Оценка: 4")
        elif score >= 90:
            print("Оценка: 5")
        else:
            print("Оценка: 2")
      tests:
