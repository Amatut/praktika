          note: Проверена только длина.
          expectMistake: only-side
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight >= 15 or side >= 60:
                print("Только курьером")
            else:
                print("Поместится в постамат")
          note: Обратная проверка с >= — граница уходит курьеру.
          expectMistake: reverse-boundary
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight < 15 and side < 60:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: Строгие знаки — граница не включена.
          expectMistake: strict
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight <= 15 and side < 60:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: Строгий знак только у длины.
          expectMistake: strict
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight <= 15:
                if side <= 60:
