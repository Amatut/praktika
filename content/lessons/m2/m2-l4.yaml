      mistakes:
        - id: half-condition
          when:
            errorType: SyntaxError
            codeRegex: '\b(?:and|or)\s*[<>=!]'
          why: >-
            Сразу после `and` (или `or`) стоит знак сравнения, а переменной перед ним нет.
            По-русски «не больше 15 и 60» понятно, но Python не знает, что именно сравнивать с 60:
            каждая часть условия для него — отдельное полное сравнение.
          try: >-
            Вставь переменную между `and` (или `or`) и знаком, сам знак не меняй: `and <= 60` →
            `and side <= 60`, `or > 60` → `or side > 60`.
          verify: Ошибка SyntaxError должна исчезнуть, а «Лёгкая и короткая» — пройти.
        - id: bare-part
          when:
            codeRegex: '\b(?:if|and|or)\s+\(?\s*(?:\d+|weight|side)\s*\)?\s*(?:\band\b|\bor\b|:)'
          why: >-
            В условии есть часть без сравнения — просто число или просто переменная. По-русски «вес
            и сторона не больше 15 и 60» понятно, но Python проверяет каждую часть отдельно и сам
            её не дополнит. Число без сравнения для него просто «верно», поэтому одна из проверок
            пропадает, а ошибки Python не покажет.
          try: >-
            Запиши каждую часть полностью — переменная, знак и число: `weight <= 15` и
            `side <= 60`.
        - id: or-instead
          when:
            failedTest: t2
            outputEquals: Поместится в постамат
            codeRegex: '\bor\b'
          why: >-
            Посылка весит 20 кг, а программа отправила её в постамат. `or` пропускает, если верна
            хотя бы одна часть, — а сторона 40 см проверку проходит. Постамату нужны оба требования
            сразу.
          try: Соедини проверки через `and` — тогда условие верно, только если верны обе части.
        - id: reverse-and
          when:
            failedTest: t2
            outputEquals: Поместится в постамат
            codeRegex: '>[^\n]*\band\b'
          why: >-
            Посылка весит 20 кг, а программа отправила её в постамат. Ты проверяешь, когда посылка
            не подходит, — для этого хватит одного нарушения. А `and` срабатывает, только если
            посылка сразу и тяжёлая, и длинная.
          try: В проверке «не подходит» соедини части через `or`.
        - id: only-weight
          when:
            failedTest: t3
            outputEquals: Поместится в постамат
            codeRegex: '(?<![\s\S])(?![\s\S]*\bif\b[^\n]*\bside\b)'
          why: >-
            Посылка весит 5 кг, но её сторона 70 см — и программа всё равно отправила её в
            постамат. Длина стороны в условии не проверяется.
          try: >-
            Добавь в условие вторую часть — `side <= 60` — и соедини её с проверкой веса через
            `and`.
        - id: only-side
          when:
            failedTest: t2
            outputEquals: Поместится в постамат
            codeRegex: '(?<![\s\S])(?![\s\S]*\bif\b[^\n]*\bweight\b)'
          why: >-
            Посылка весит 20 кг, а программа отправила её в постамат. Вес в условии не
            проверяется.
          try: >-
            Добавь в условие вторую часть — `weight <= 15` — и соедини её с проверкой длины через
            `and`.
        - id: reverse-boundary
          when:
            failedTest: t4
            outputEquals: Только курьером
            codeRegex: '>=\s*(?:15|60)\b'
          why: >-
            Посылка ровно 15 кг и 60 см должна помещаться. В проверке «не подходит» знак `>=`
            захватывает саму границу: `15 >= 15` — True, и посылка уходит курьеру.
          try: «Тяжелее 15» — это `weight > 15`, без `=`. Проверь так же знак у длины.
        - id: strict
          when:
            failedTest: t4
            outputEquals: Только курьером
            codeRegex: '<(?!=)'
          why: >-
            Посылка ровно 15 кг и 60 см должна помещаться: «не больше 60» включает само 60. Знак
            `<` границу не включает: `60 < 60` даёт False, `15 < 15` тоже.
          try: Проверь знак в каждой части условия. «Не больше» — это `<=`.
        - id: two-checks
          when:
            failedRule: one-condition
            codeRegex: '(?<![\s\S])(?=[\s\S]*if\b[^\n]*\bweight\b)(?=[\s\S]*if\b[^\n]*\bside\b)'
          why: >-
            Программа проверяет и вес, и длину, но по отдельности — несколькими `if` или цепочкой
            `elif`. В этом уроке тренируем другое: собрать правило из двух частей в одно
            условие.
          try: Запиши проверку веса и длины в одном `if` и соедини их через `and`.
      afterPass: >-
        Два требования уместились в одно условие. Проверь себя в уме на границе: подставь 15 и 60
        в своё условие — посылка должна пройти.
      skills: [boolean-logic, comparisons]

  - id: simplify
    type: theory
    title: Короче и понятнее
    body: |-
      Условие может работать верно и всё равно быть громоздким. Четыре приёма делают его короче.

      **1. Двойное сравнение.** Вместо `age >= 7 and age <= 17` можно написать `7 <= age <= 17` —
      как в математике: «от 7 до 17 включительно». Python проверяет обе части, это то же `and`.
      Приём — для чисел: строки Python сравнивает по алфавиту (урок 2.1), а не по смыслу.

      **2. Одно условие вместо вложенного `if`.** `if` можно поставить внутрь блока другого
      `if` — это **вложенный** `if`, его блок сдвинут уже на 8 пробелов:

      ```python
      if wind <= 8:
          if not storm:
              print("Можно на воду")
      ```

      «Можно на воду» напечатается, только если верны оба условия, — ровно то, что делает `and`:
      `if wind <= 8 and not storm:`. Одна строка короче и читается как фраза. Вложенный `if`
      оставляют, когда во внутренней проверке свои ветки и каждая делает что-то своё.

      **3. Флаг не сравнивают с True.** В `storm` уже лежит True или False, поэтому
      `if storm == True:` — это просто `if storm:`, а `if storm == False:` — `if not storm:`.

      **4. `not` перед сравнением убирают, перевернув знак.**

      ```text
      not (t > 25)    →   t <= 25
      not (t < 25)    →   t >= 25
      not (t == 25)   →   t != 25
      ```

      Следи за границей. «Не больше 25» — это «меньше **или равно**»: 25 не больше 25, поэтому
      само 25 подходит. Для `t = 25` условие `not (t > 25)` даёт True — значит, и замена должна
      давать True: `25 <= 25`.
    simpler: >-
      Длинное условие обычно можно сократить: `7 <= age <= 17` вместо двух сравнений через `and`,
      одно условие с `and` вместо вложенного `if`, `if storm:` вместо `if storm == True:`,
      `t <= 25` вместо `not (t > 25)`. Смысл тот же, а читать легче.
    coach: >-
      Сократил условие — проверь его на границе: подставь пороговое число в старую и новую запись.
      Ответы должны совпасть.

  - id: practice-group
    type: exercise
    title: Практика 2
    exercise:
      id: m2-l4-e4
      kind: modify
      title: Детская группа
      statement: |-
        В детскую группу на турбазе берут ребят **от 7 до 17 лет включительно**. Помощник Вадима
        написал проверку: она работает верно, но читается тяжело — два `not` и вложенный `if`.

        Перепиши её **одним условием, без `not` и без вложенного `if`**. Вывод должен остаться
        прежним:

        ```text
        Подходит по возрасту
        ```

        ```text
        Не подходит по возрасту
        ```
      input: "Одна строка: возраст — целое число."
      output: "Одна строка: `Подходит по возрасту` или `Не подходит по возрасту`."
      constraints:
        - Один `if` с `else`, без вложенного `if` и без `not`.
      starterCode: |
        age = int(input("Возраст: "))
        if not (age < 7):
            if not (age > 17):
                print("Подходит по возрасту")
            else:
                print("Не подходит по возрасту")
        else:
            print("Не подходит по возрасту")
      tests:
        - id: t1
          kind: io
          title: Десять лет
          example: true
          stdin: "10\n"
          expected: Подходит по возрасту
          compare: {ignoreSpaces: true}
        - id: t2
          kind: io
          title: Пять лет
          example: true
          stdin: "5\n"
          expected: Не подходит по возрасту
          compare: {ignoreSpaces: true}
        - id: t3
          kind: io
          title: Двадцать пять лет
          example: true
          stdin: "25\n"
          expected: Не подходит по возрасту
          compare: {ignoreSpaces: true}
        - id: t4
          kind: io
          title: "Граничный случай: ровно 7"
          edge: true
          stdin: "7\n"
          expected: Подходит по возрасту
          compare: {ignoreSpaces: true}
        - id: t5
          kind: io
          title: "Граничный случай: 6"
          edge: true
          stdin: "6\n"
          expected: Не подходит по возрасту
          compare: {ignoreSpaces: true}
        - id: t6
          kind: io
          title: "Граничный случай: ровно 17"
          edge: true
          stdin: "17\n"
          expected: Подходит по возрасту
          compare: {ignoreSpaces: true}
        - id: t7
          kind: io
          title: "Граничный случай: 18"
          edge: true
          stdin: "18\n"
          expected: Не подходит по возрасту
          compare: {ignoreSpaces: true}
      rules:
        - id: one-if
          max: { If: 1 }
          message: >-
            Оставь один `if` с `else`: обе проверки возраста помещаются в одно условие — как
            `and` вместо вложенного `if` в теории.
        - id: no-not
          avoid: [Not]
          message: >-
            Убери `not`: переверни знак сравнения. «Не меньше 7» можно сказать и без «не».
      criteria:
        - "Вывод тот же, что у исходной программы: 7 и 17 лет подходят, 6 и 18 — нет."
        - Проверка возраста — один `if` с `else`, без вложенного `if` и без `not`.
      hints:
        - >-
          Разбери проверки по одной. Как сказать «не меньше 7» без слова «не»? И когда программа
          печатает «Подходит по возрасту» — если верна одна проверка или обе сразу?
        - >-
          Тот же приём на термометре: `if not (t < 18):` — это `if t >= 18:`, «не меньше»
          включает саму границу. А два вложенных `if` с условиями A и B печатают ответ, только
          если верны оба, — как `if A and B:`.
        - |-
          Каркас:
          ```text
          age = int(input(...))
          if <возраст не меньше 7> and <возраст не больше 17>:
              print("Подходит по возрасту")
          else:
              print("Не подходит по возрасту")
          ```
          Обе части можно записать и одним двойным сравнением.
      solution:
