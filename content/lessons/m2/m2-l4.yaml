id: m2-l4
module: m2
number: "2.4"
title: "and, or, not: сложные условия"
objective: >-
  Соединять условия через and, or и not, записывая каждую часть условия полностью, и упрощать
  громоздкие проверки двойным сравнением и not.
minutes: [25, 30]
prerequisites: [m2-l3]
skills: [boolean-logic]
environment: python

story:
  title: Байдарки на озере
  fictional: true
  text: >-
    На турбазе у озера инструктор Вадим выдаёт байдарки. Каждое его правило состоит из двух
    частей: на воду можно, если ветер не сильнее 8 м/с и не обещают грозу, а спасжилет
    обязателен, если турист младше 14 лет или не умеет плавать. Новый помощник однажды перепутал
    «и» с «или» и чуть не выпустил группу на воду перед грозой: ветер-то был слабый. Теперь ветер
    и прогноз Вадим вводит в маленькую программу, и ответ даёт она. Правила в ней записаны
    словами Python `and`, `or` и `not` — и перепутать их так же легко, если не знать, как они
    работают.

why: >-
  Настоящие правила редко состоят из одного условия: «пустить, если есть билет и нет
  температуры», «скидка, если сегодня среда или есть карта». `and`, `or` и `not` собирают такие
  правила в одну проверку.

usedIn: >-
  Фильтры в интернет-магазинах («в наличии и дешевле 5000»), проверка формы регистрации («поле
  заполнено и пароль не короче 8 символов»), правила доступа («администратор или автор записи»),
  условия в играх («есть ключ и герой стоит у двери»).

steps:
  - id: idea
    type: theory
    title: И, или, не
    body: |-
      Правило Вадима состоит из двух частей: ветер не сильнее 8 м/с **и** грозу не обещают.
      Каждую часть ты уже умеешь записать сравнением. Чтобы соединить их в одно условие, в Python
      есть три слова.

      - **`and`** («и») — условие верно, только если верны **обе** части.
      - **`or`** («или») — верно, если верна **хотя бы одна** часть.
      - **`not`** («не») — переворачивает ответ: `not True` даёт False, `not False` — True.

      Пусть A и B — две части условия. Все сочетания удобно собрать в **таблицу истинности**:

      ```text
      A       B       A and B   A or B
      True    True    True      True
      True    False   False     True
      False   True    False     True
      False   False   False     False
      ```

      **Каждая часть — полное сравнение (или флаг, о нём ниже).** По-русски мы говорим «если
      суббота или воскресенье», но Python так не понимает. Нужно: `day == "сб" or day == "вс"`.
      А запись `age > 7 and < 14` — это SyntaxError: после `and` должно стоять полное сравнение,
      `age < 14`.

      **Флаг.** Результат сравнения можно сохранить в переменную — как в уроке про сравнения:
      `storm = answer == "да"`. Переменную, в которой лежит True или False, называют **флагом**.
      С флагом в условии можно писать `not storm` — «грозы нет». А `answer` — не флаг: в нём
      слово «да» или «нет». Поэтому `not` ставят перед флагом или сравнением, а не перед словом
      из `input()`.

      **Порядок.** Как умножение выполняется раньше сложения, так и здесь: сначала `not`, потом
      `and`, потом `or`. Представь скидку «в среду или по карте, но только при покупке от 500
      рублей». Без скобок

      ```python
      day == "ср" or card == "да" and total >= 500
      ```

      Python прочитает как `day == "ср" or (card == "да" and total >= 500)` — и в среду даст
      скидку даже на покупку за 10 рублей. Со скобками смысл верный:

      ```python
      (day == "ср" or card == "да") and total >= 500
      ```

      Смешиваешь `and` и `or` — ставь скобки: их одинаково понимают и Python, и человек.
    simpler: >-
      `and` — строгий охранник: пропускает, только если у тебя оба пропуска. `or` — добрый: ему
      хватит одного. `not` переворачивает ответ: True становится False. И каждая часть условия —
      полное сравнение, где есть и переменная, и знак, и значение: `day == "сб" or day == "вс"`.
    coach: >-
      Сомневаешься, как Python поймёт смесь `and` и `or`? Поставь скобки — это бесплатно.

  - id: kayak
    type: example
    title: Выдача байдарок
    body: |-
      Программа из истории. Ввод уже задан: ветер 5 м/с, грозу не обещают. А вот что она ответит
      при других данных:

      ```text
      ветер   гроза   ответ
      5       нет     Можно на воду
      5       да      Сегодня без байдарок
      12      нет     Сегодня без байдарок
      8       нет     Можно на воду
      ```
    code: |-
      wind = int(input("Ветер, м/с: "))
      answer = input("Обещают грозу? (да/нет) ")
      storm = answer == "да"
      if wind <= 8 and not storm:
          print("Можно на воду")
      else:
          print("Сегодня без байдарок")
    stdin: "5\nнет\n"
    notes:
      - line: 2
        text: Ответ про грозу — слово, поэтому его не превращают в число.
      - line: 3
        text: >-
          Флаг: справа сравнение, и в `storm` кладётся его результат — True или False. Сегодня
          ответ «нет», поэтому `storm` равен False.
      - line: 4
        text: >-
          Обе части должны быть верны: ветер не сильнее 8 **и** не гроза. `not storm` читается
          как «грозы нет».
      - line: 6
        text: Сюда программа попадает, если хотя бы одна часть условия оказалась False.
    tryIt: >-
      Поменяй в строке 4 порог на `wind <= 4` и запусти: ветер 5 м/с стал слишком сильным, на воду
      нельзя. Теперь замени `and` на `or` и запусти снова. Почему в сильный ветер на воду опять
      пускают?
    coach: >-
      Таблица над кодом — это ручная проверка: несколько разных вводов и ответ для каждого. Такие
      таблицы пригодятся в следующем уроке.

  - id: or-trap
    type: predict
    title: Выходной или нет?
    prompt: >-
      В выходные прокат на турбазе работает дольше. Помощник Вадима написал программу, которая
      смотрит на день недели. Сегодня среда. Как думаешь, что она выведет?
    code: |-
      day = "ср"
      if day == "сб" or "вс":
          print("Выходной — прокат до 20:00")
      else:
          print("Будни — прокат до 18:00")
    options:
      - Выходной — прокат до 20:00
      - Будни — прокат до 18:00
      - Ошибка SyntaxError
    answer: Выходной — прокат до 20:00
    explanation: >-
      Python читает условие как `(day == "сб") or "вс"`. Левая часть — вопрос, и ответ на него
      False: сегодня среда. А справа от `or` стоит не сравнение, а просто строка `"вс"`.
      Непустая строка в условии считается истинной, поэтому `or` находит «верную» часть — и
      условие верно для любого дня. Ошибки Python не покажет: запись правильная, только означает
      не то. Нужно каждую часть записать полным сравнением: `day == "сб" or day == "вс"`.
    coach: >-
      По-русски «суббота или воскресенье» звучит естественно, поэтому эту ошибку делают очень
      многие. Теперь ты будешь узнавать её сразу.

  - id: practice-parcel
    type: exercise
    title: Практика 1
    exercise:
      id: m2-l4-e1
      kind: repeat
      title: Посылка в постамат
      statement: |-
        В учебной службе доставки посылку можно отправить через постамат, если она весит
        **не больше 15 кг** и её самая длинная сторона **не больше 60 см**. Иначе — только
        курьером. (Ограничения учебные: у настоящих служб свои правила.)

        Программа уже читает вес и длину стороны. Допиши проверку **одним условием с `and` или
        `or`** — как в примере с байдарками — и выведи одну из двух строк:

        ```text
        Поместится в постамат
        ```

        ```text
        Только курьером
        ```
      input: "Две строки: вес в килограммах и длина самой длинной стороны в сантиметрах — целые числа."
      output: "Одна строка: `Поместится в постамат` или `Только курьером`."
      constraints:
        - Обе проверки — в одном условии `if`, соединённые через `and` или `or`.
      starterCode: |
        weight = int(input("Вес, кг: "))
        side = int(input("Самая длинная сторона, см: "))
        # Проверь оба требования одним условием и выведи ответ

      tests:
        - id: t1
          kind: io
          title: Лёгкая и короткая
          example: true
          stdin: "5\n40\n"
          expected: Поместится в постамат
          compare: {ignoreSpaces: true}
        - id: t2
          kind: io
          title: Слишком тяжёлая
          example: true
          stdin: "20\n40\n"
          expected: Только курьером
          compare: {ignoreSpaces: true}
        - id: t3
          kind: io
          title: Лёгкая, но длинная
          example: true
          stdin: "5\n70\n"
          expected: Только курьером
          compare: {ignoreSpaces: true}
        - id: t4
          kind: io
          title: "Граничный случай: ровно 15 кг и 60 см"
          edge: true
          stdin: "15\n60\n"
          expected: Поместится в постамат
          compare: {ignoreSpaces: true}
        - id: t5
          kind: io
          title: "Граничный случай: 16 кг"
          edge: true
          stdin: "16\n60\n"
          expected: Только курьером
          compare: {ignoreSpaces: true}
        - id: t6
          kind: io
          title: "Граничный случай: 61 см"
          edge: true
          stdin: "15\n61\n"
          expected: Только курьером
          compare: {ignoreSpaces: true}
      rules:
        - id: one-condition
          use: [BoolOp]
          message: >-
            Объедини две проверки в одно условие через `and` (или `or`) — как в примере с
            байдарками.
      criteria:
        - Посылка проходит в постамат, только если выполнены оба требования — по весу и по длине.
        - Ровно 15 кг и ровно 60 см ещё помещаются, 16 кг или 61 см — уже нет.
        - Обе проверки записаны в одном условии через `and` или `or`.
      hints:
        - >-
          Посылке нужно пройти два требования — по весу и по длине. Что должно быть верно, чтобы
          она поместилась: одно из них или оба сразу? Посмотри, каким словом соединены части
          условия в примере с байдарками.
        - >-
          Похожее правило: `if age >= 18 and ticket == "да":` — пускают, только если верно и то, и
          другое. Взрослого без билета не пустят, ребёнка с билетом — тоже.
        - |-
          Каркас:
          ```text
          weight = int(input(...))
          side = int(input(...))
          if <вес не больше 15> and <сторона не больше 60>:
              print(...)
          else:
              print(...)
          ```
      solution:
        code: |
          weight = int(input("Вес, кг: "))
          side = int(input("Самая длинная сторона, см: "))
          if weight <= 15 and side <= 60:
              print("Поместится в постамат")
          else:
              print("Только курьером")
        explanation: >-
          Обе части — полные сравнения, и `and` требует, чтобы были верны обе: и вес, и длина.
          Если хотя бы одна часть False, срабатывает `else`. «Не больше» — это `<=`, поэтому ровно
          15 кг и ровно 60 см помещаются. Можно проверять и наоборот — когда посылка **не**
          подходит: `if weight > 15 or side > 60:` с ветками в обратном порядке. Для отказа
          хватит одного нарушения, поэтому там `or`.
      altSolutions:
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight > 15 or side > 60:
                print("Только курьером")
            else:
                print("Поместится в постамат")
          note: Проверка «не подходит» через or, ветки в обратном порядке.
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if not (weight > 15 or side > 60):
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: not перед скобками.
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            light = weight <= 15
            short = side <= 60
            if short and light:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: Два флага, части условия в другом порядке.
        - code: |
            w = int(input())
            s = int(input())

            if s <= 60  and  w <= 15 :
                print(f"Поместится в постамат")
            else:
                print(f"Только курьером")
          note: Короткие имена, input() без подсказки, лишние пробелы и пустая строка, f-строки.
        - code: |
            max_weight = 15
            max_side = 60
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            answer = "Поместится в постамат"
            if weight > max_weight or side > max_side:
                answer = "Только курьером"
            print(answer)
          note: Пороги в переменных, ответ в переменной, обратная проверка без else.
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            fits = weight <= 15 and side <= 60
            if fits == True:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: Флаг fits вне if, сравнение флага с True.
        - code: |
            weight = float(input("Вес, кг: "))
            side = float(input("Сторона, см: "))
            if 0 < weight <= 15 and 0 < side <= 60:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: float() и двойные сравнения с нижней границей.
        - code: |
            weight = int(input())
            side = int(input())
            if 15 >= weight and 60 >= side:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: Число слева от знака.
        - code: |
            weight = int(input())
            side = int(input())
            if weight <= 15 and side < 61:
                print("Поместится в постамат")
            if weight > 15 or side > 60:
                print("Только курьером")
          note: Два отдельных if, оба с составным условием; строгий знак со сдвинутым порогом.
      wrongSolutions:
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight <= 15 and <= 60:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: Вторая часть условия без переменной — SyntaxError.
          expectMistake: half-condition
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight > 15 or > 60:
                print("Только курьером")
            else:
                print("Поместится в постамат")
          note: Обратная проверка, вторая часть без переменной после or — SyntaxError.
          expectMistake: half-condition
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight <= 15 and 60:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: Вторая часть — просто число, без сравнения.
          expectMistake: bare-part
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight and side <= 15 and 60:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: Дословно по-русски «вес и сторона не больше 15 и 60».
          expectMistake: bare-part
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight <= 15 and side:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: Вторая часть — просто переменная, без сравнения.
          expectMistake: bare-part
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight <= 15 or side <= 60:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: or вместо and — хватает одного требования.
          expectMistake: or-instead
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if not weight > 15 or not side > 60:
                print("Поместится в постамат")
            else:
                print("Только курьером")
          note: not … or not … — хватает одного требования.
          expectMistake: or-instead
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight > 15 and side > 60:
                print("Только курьером")
            else:
                print("Поместится в постамат")
          note: Обратная проверка через and — курьером только тяжёлые и длинные сразу.
          expectMistake: reverse-and
        - code: |
            weight = int(input("Вес, кг: "))
            side = int(input("Самая длинная сторона, см: "))
            if weight <= 15:
                print("Поместится в постамат")
