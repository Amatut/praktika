            ли?» — это `==`, два знака подряд.
          try: Замени одно `=` в условии на `==`.
          verify: Ошибка SyntaxError должна исчезнуть.
        - id: or-string
          when:
            failedTest: t2
            codeRegex: '\bor\s+["''][^"''\n]*["'']\s*(?:\bor\b|\band\b|:|\))'
          why: >-
            Справа от `or` стоит просто строка, а не сравнение. Непустая строка в условии считается
            истинной, поэтому всё условие верно всегда — жилет получают даже взрослые пловцы. Это
            ловушка из прогноза «Выходной или нет?».
          try: >-
            Запиши вторую часть полным сравнением: переменная с ответом, `==` и `"нет"` в
            кавычках.
        - id: not-string
          when:
            failedTest: t1
            codeRegex: '^(\w+)\s*=\s*input\([^\n]*\)\s*$[\s\S]*\bnot\s+\1\b(?!\s*(?:[=!<>]=|[<>]))'
          why: >-
            В переменной с ответом лежит слово «да» или «нет», а не True или False. Непустая строка
            в условии считается истинной — как `"вс"` в прогнозе «Выходной или нет?», — поэтому
            `not` перед ней всегда даёт False, и ответ ни на что не влияет.
          try: >-
            Задай вопрос сравнением: `swims == "нет"` (подставь имя своей переменной). Или сделай
            настоящий флаг, как `storm` в примере: `can_swim = swims == "да"` — и тогда пиши
            `not can_swim`.
        - id: and-instead
          when:
            failedTest: t1
            outputEquals: Можно без жилета
            codeRegex: '<[^\n]*\band\b|\band\b[^\n]*<|^\s*if\b[^\n<>]*\band\b[^\n<>]*:'
          why: >-
            Взрослый, который не умеет плавать, остался без жилета. `and` верно, только если верны
            обе части, — то есть жилет получат лишь дети, которые не умеют плавать. А по правилу
            хватает одного повода.
          try: Соедини части условия через `or` — «младше 14 **или** не умеет плавать».
        - id: yes-instead
          when:
            failedTest: t1
            codeRegex: '<[^\n]*\bor\b[^\n]*==\s*["'']да["'']|==\s*["'']да["''][^\n]*\bor\b[^\n]*<'
          why: >-
            Жилет получает тот, кто ответил «да», — то есть тот, кто умеет плавать. А нужен он
            наоборот: тем, кто плавать **не** умеет.
          try: >-
            Сравнивай ответ со строкой `"нет"`. Если сохранил его флагом `can_swim = ... == "да"`,
            пиши в условии `not can_swim`.
        - id: age-boundary
          when:
            failedTest: t4
            outputEquals: Нужен спасжилет
            codeRegex: '<=\s*14\b'
          why: >-
            Туристу ровно 14 лет, он умеет плавать, а программа выдаёт жилет. «Младше 14» — значит,
            14 уже не входит, а `age <= 14` его включает.
          try: Проверяй возраст строгим знаком — `age < 14`.
        - id: age-boundary-reverse
          when:
            failedTest: t4
            outputEquals: Нужен спасжилет
            codeRegex: '>(?!=)\s*14\b'
          why: >-
            Туристу ровно 14 лет, он умеет плавать, а программа выдаёт жилет. Без жилета можно с
            14 лет — значит, 14 входит, а `age > 14` его не включает.
          try: В проверке «жилет не нужен» пиши `age >= 14`.
        - id: reverse-or
          when:
            failedTest: t1
            outputEquals: Можно без жилета
            codeRegex: '>=?\s*14\b[^\n]*\bor\b|\bor\b[^\n]*>=?\s*14\b|^\s*if\b(?![^\n]*\bnot\b)[^\n<]*\bor\b[^\n<]*:[ \t]*\n[ \t]*print\(\s*f?["'']Можно'
          why: >-
            Взрослый, который не умеет плавать, остался без жилета. Ты проверяешь, когда жилет не
            нужен, — а для этого должны быть верны обе части сразу: турист не младше 14 **и** умеет
            плавать. `or` хватает одной.
          try: В проверке «жилет не нужен» соедини части через `and`.
        - id: swim-ignored
          when:
            failedTest: t1
            outputEquals: Можно без жилета
            codeRegex: '(?<![\s\S])(?![\s\S]*(?:==\s*["'']нет|!=\s*["'']да)["''])'
          why: >-
            Турист 30 лет не умеет плавать, а программа отпускает его без жилета. Похоже, ответ
            «нет» на решение не влияет: его не прочитали, не добавили в условие или сравнивают не
            с той строкой.
          try: >-
            Прочитай ответ вторым `input()` и проверь условие: жилет нужен, если турист младше 14
            лет **или** ответил «нет». Сравнивай ответ ровно с `"нет"`, маленькими буквами. Если
            сохранил ответ флагом `can_swim`, в условии нужен `not can_swim`.
      afterPass: >-
        Жилет теперь выдаётся по обоим поводам. Если писал цепочкой `elif`, попробуй одним условием
        через `or`. Если уже так — сохрани ответ флагом `can_swim = input(...) == "да"` и пиши
        `if age < 14 or not can_swim:`: условие читается почти как фраза.
      skills: [boolean-logic, conditions]

  - id: practice-alarm
    type: exercise
    title: Практика 4
    exercise:
      id: m2-l4-e3
      kind: write
      title: Будильник по будням
      statement: |-
        Будильник на телефоне звонит в 7:00 по будням — с понедельника по пятницу, — но не в
        праздники. Напиши программу: она читает день недели и ответ, праздник ли сегодня, и
        печатает одну из двух строк:

        ```text
        Будильник на 7:00
        ```

        ```text
        Будильник выключен
        ```

        День недели вводится ровно так, маленькими буквами: `пн`, `вт`, `ср`, `чт`, `пт`, `сб`,
        `вс`. Ответ про праздник — `да` или `нет`.
      input: "Две строки: день недели (`пн` … `вс`) и ответ `да` или `нет` — праздник ли сегодня."
      output: "Одна строка: `Будильник на 7:00` или `Будильник выключен`."
      constraints:
        - Проверять другой ввод, например «суббота» или «Пн», не нужно.
      starterCode: |
        # Прочитай день недели и ответ про праздник
        # Будильник звонит в будни (пн–пт), если сегодня не праздник

      tests:
        - id: t1
          kind: io
          title: Обычный понедельник
          example: true
          stdin: "пн\nнет\n"
          expected: Будильник на 7:00
          compare: {ignoreSpaces: true}
        - id: t2
          kind: io
          title: Суббота
          example: true
          stdin: "сб\nнет\n"
          expected: Будильник выключен
          compare: {ignoreSpaces: true}
        - id: t3
          kind: io
          title: Праздник в среду
          example: true
          stdin: "ср\nда\n"
          expected: Будильник выключен
          compare: {ignoreSpaces: true}
        - id: t4
          kind: io
          title: Воскресенье
          stdin: "вс\nнет\n"
          expected: Будильник выключен
          compare: {ignoreSpaces: true}
        - id: t5
          kind: io
          title: "Граничный случай: пятница — последний будний день"
          edge: true
          stdin: "пт\nнет\n"
          expected: Будильник на 7:00
          compare: {ignoreSpaces: true}
        - id: t6
          kind: io
          title: "Граничный случай: праздник в воскресенье"
          edge: true
          stdin: "вс\nда\n"
          expected: Будильник выключен
          compare: {ignoreSpaces: true}
        - id: t7
          kind: io
          title: Обычный вторник
          stdin: "вт\nнет\n"
          expected: Будильник на 7:00
          compare: {ignoreSpaces: true}
        - id: t8
          kind: io
          title: Обычная среда
          stdin: "ср\nнет\n"
          expected: Будильник на 7:00
          compare: {ignoreSpaces: true}
        - id: t9
          kind: io
          title: Обычный четверг
          stdin: "чт\nнет\n"
          expected: Будильник на 7:00
          compare: {ignoreSpaces: true}
      criteria:
        - Программа читает две строки — день недели и ответ про праздник.
        - С понедельника по пятницу без праздника будильник звонит; в субботу, в воскресенье и в праздник — выключен.
        - 'В условии нет частей вида `or "вс"`: каждая часть что-то сравнивает или это флаг.'
      hints:
        - >-
          Разложи правило на части: какие дни считаются будними и что ещё должно быть верно,
          чтобы будильник зазвонил? Сколько получается частей — и каким словом их соединить, если
          нужны все сразу?
        - >-
          Похожая проверка: `if color != "красный" and color != "жёлтый":` — верно для любого
          цвета, кроме этих двух. Для зелёного обе части True, а для красного первая часть False —
          и всё условие False.
        - |-
          Каркас:
          ```text
          day = input(...)
          holiday = input(...)
          if day != ... and day != ... and holiday == ...:
              print("Будильник на 7:00")
          else:
              print("Будильник выключен")
          ```
      solution:
        code: |
          day = input("День недели: ")
          holiday = input("Праздник? (да/нет) ")
          if day != "сб" and day != "вс" and holiday == "нет":
              print("Будильник на 7:00")
          else:
              print("Будильник выключен")
        explanation: >-
          Будний день — это «не суббота **и** не воскресенье», поэтому два `!=` через `and`.
          Третья часть — «не праздник». Будильник звонит, только если верны все три, — значит, и
          они соединены через `and`. Другой вариант — проверить, когда будильник молчит:
          `if day == "сб" or day == "вс" or holiday == "да":`. Для тишины хватит одной причины,
          поэтому там `or`, а ветки идут в обратном порядке.
