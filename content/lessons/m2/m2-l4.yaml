      mistakes:
        - id: inputs-swapped
          when:
            errorType: ValueError
          why: >-
            Python пытается превратить в число слово «да» или «нет». Так бывает, если строки ввода
            читаются не в том порядке — первой приходит возраст, второй ответ, — или если ответ
            про плавание тоже обёрнут в `int()`.
