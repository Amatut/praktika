            holiday = input("Праздник? (да/нет) ")
            weekend = day == "сб" or day == "вс"
            if weekend and holiday == "нет":
                print("Будильник на 7:00")
            else:
                print("Будильник выключен")
          note: Флаг weekend без not.
          expectMistake: null
        - code: |
            day = input("День недели: ")
            holiday = input("Праздник? (да/нет) ")
            if day != "сб" and day != "вс":
                if holiday == "нет":
                    print("Будильник на 7:00")
            else:
                print("Будильник выключен")
          note: Вложенный if без внутреннего else — в праздник ничего не печатается.
          expectMistake: null
        - code: |
            holiday = input("Праздник? (да/нет) ")
            day = input("День недели: ")
            if day != "сб" and day != "вс" and holiday == "нет":
                print("Будильник на 7:00")
            else:
                print("Будильник выключен")
          note: Строки ввода прочитаны в обратном порядке.
          expectMistake: null
      mistakes:
        - id: string-range
          when:
            codeRegex: '[<>]=?\s*["'']|["''][^"''\n]*["'']\s*[<>]'
          why: >-
            Знаки `<` и `>` хорошо работают с числами. Строки Python сравнивает по алфавиту, как в
            уроке 2.1, а не по порядку дней недели. По алфавиту дни идут так: вс, вт, пн, пт, сб,
            ср, чт. Поэтому, например, между `"пн"` и `"пт"` попадают только сами понедельник и
            пятница.
          try: >-
            Дни недели не идут по алфавиту. Выходных всего два — проще проверить, что сегодня не
            суббота и не воскресенье. Или перечисли будние дни через `or`.
        - id: assign-in-if
          when:
            errorType: SyntaxError
            codeRegex: '\bif\b[^\n]*[^=!<>]=[^=<>]'
          why: >-
            В условии стоит одно `=`. Одно `=` кладёт значение в переменную, а спросить «равно
            ли?» — это `==`, два знака подряд.
          try: Замени одно `=` в условии на `==`.
          verify: Ошибка SyntaxError должна исчезнуть.
        - id: or-string
          when:
            codeRegex: '\b(?:or|and)\s+["''][^"''\n]*["'']\s*(?:\bor\b|\band\b|:|\))'
          why: >-
            Справа от `or` (или `and`) стоит просто строка, а не сравнение. Непустая строка в
            условии считается истинной, поэтому эта часть верна всегда — как в прогнозе «Выходной
            или нет?».
          try: 'Запиши каждую часть полным сравнением: `day == "сб" or day == "вс"`.'
        - id: not-string
          when:
            failedTest: t1
            codeRegex: '^(\w+)\s*=\s*input\([^\n]*\)\s*$[\s\S]*\bnot\s+\1\b(?!\s*(?:[=!<>]=|[<>]))'
          why: >-
            В переменной с ответом лежит слово «да» или «нет», а не True или False. Непустая строка
            в условии считается истинной — как `"вс"` в прогнозе «Выходной или нет?», — поэтому
            `not` перед ней всегда даёт False, и будильник молчит каждый день.
          try: >-
            Задай вопрос сравнением: `holiday == "нет"` (подставь имя своей переменной). Или сделай
            настоящий флаг: `is_holiday = holiday == "да"` — и тогда пиши `not is_holiday`.
        - id: weekday-missed
          when:
            outputEquals: Будильник выключен
            codeRegex: '(?<![\s\S])(?=[\s\S]*==\s*["''](?:пн|вт|ср|чт|пт)["''])(?:(?![\s\S]*["'']пн["''])|(?![\s\S]*["'']вт["''])|(?![\s\S]*["'']ср["''])|(?![\s\S]*["'']чт["''])|(?![\s\S]*["'']пт["'']))'
          why: >-
            В обычный будний день без праздника будильник молчит. Похоже, в перечислении будних
            дней одного дня не хватает или в нём опечатка.
          try: >-
            Проверь, что в условии есть все пять будних дней — `"пн"`, `"вт"`, `"ср"`, `"чт"`,
            `"пт"`, — ровно так, маленькими буквами. Или проверь проще: будний день — это не
            суббота и не воскресенье.
        - id: or-not-equal
          when:
            failedTest: t2
            codeRegex: '\b(\w+)\s*!=[^\n]*\bor\s+\(?\s*\1\s*!='
          why: >-
            В субботу будильник звонит. Любой день не равен хотя бы одному из двух: суббота — не
            воскресенье, воскресенье — не суббота. Поэтому `day != "сб" or day != "вс"` верно
            всегда: для субботы первая часть False, но вторая True, и `or` даёт True.
          try: >-
            «Не суббота и не воскресенье» — это `and`: `day != "сб" and day != "вс"`.
        - id: and-equal
          when:
            failedTest: t2
            codeRegex: '\b(\w+)\s*==\s*["''][^"''\n]*["'']\s+and\s+\1\s*=='
          why: >-
            В субботу без праздника будильник звонит. Условие `day == "сб" and day == "вс"` не
            бывает верным: день не может быть сразу и субботой, и воскресеньем. По-русски говорят
            «в субботу и воскресенье», но для Python это «суббота **или** воскресенье».
          try: 'Соедини сравнения дня через `or`: `day == "сб" or day == "вс"`.'
        - id: off-and
          when:
            failedTest: t3
            outputEquals: Будильник на 7:00
            codeRegex: '\band\b[^\n]*==\s*["'']да["'']|==\s*["'']да["''][^\n]*\band\b'
          why: >-
            В праздничную среду будильник звонит. Ты проверяешь, когда будильник выключен, — а для
            этого хватит одной причины: выходной **или** праздник. `and` срабатывает, только если
            праздник совпал с выходным.
          try: >-
            Соедини все причины тишины через `or`: суббота, воскресенье или праздник — хватит
            любой.
        - id: holiday-reversed
          when:
            failedTest: t1
            outputEquals: Будильник выключен
            codeRegex: '\band\b[^\n]*==\s*["'']да["'']|==\s*["'']да["''][^\n]*\band\b|\bor\b[^\n]*==\s*["'']нет["'']'
          why: >-
            В обычный понедельник без праздника будильник молчит. Похоже, ответ про праздник
            сравнивается не с той строкой: будильник звонит, когда праздника нет, и молчит, когда
            он есть.
          try: >-
            Проверь сравнение с праздником: в условии «звонит» нужно `holiday == "нет"`, в условии
            «выключен» — `holiday == "да"`.
        - id: mixed-or
          when:
            failedTest: t2
            outputEquals: Будильник на 7:00
            codeRegex: '\bor\b'
          why: >-
            В субботу без праздника будильник звонит. Часть про праздник присоединена через `or`, а
            `or` хватает одной верной части: «не праздник» — верно, и суббота уже ничего не решает.
          try: >-
            Будильник звонит, только если верно всё сразу: будний день **и** не праздник. Соедини
            эти части через `and`.
        - id: no-brackets
          when:
            failedTest: t3
            outputEquals: Будильник на 7:00
            codeRegex: '^[^(\n]*(?:\bor\b[^(\n]*\band\b|\band\b[^(\n]*\bor\b)[^(\n]*$'
          why: >-
            В праздничную среду будильник звонит. В условии смешаны `or` и `and` без скобок, а
            `and` выполняется раньше `or`. Поэтому проверка праздника прилипла только к соседнему
            сравнению, а остальные дни проходят без неё.
          try: >-
            Реши, какие части должны проверяться вместе, и возьми их в скобки: «будний день» — одна
            часть, «праздник» — другая. Праздник присоедини уже после скобок.
        - id: sunday-forgotten
          when:
            failedTest: t4
            outputEquals: Будильник на 7:00
          why: >-
            В воскресенье будильник звонит. Условие отсекает только субботу, а воскресенье — тоже
            выходной.
          try: Добавь в условие и воскресенье — так же, как ты проверяешь субботу.
        - id: holiday-ignored
          when:
            failedTest: t3
            outputEquals: Будильник на 7:00
            codeRegex: '(?<![\s\S])(?![\s\S]*(?:[=!]=\s*["''](?:да|нет)["'']|["''](?:да|нет)["'']\s*[=!]=))'
          why: >-
            В праздничную среду будильник звонит: ответ про праздник не участвует в условии.
          try: >-
            Добавь в условие часть про праздник: будильник звонит, только если праздника нет, то
            есть ответ равен `"нет"`.
      afterPass: >-
        Будильник учитывает и день недели, и праздник. Улучшение, если ещё не сделал: сначала
        посчитай флаг `weekend = day == "сб" or day == "вс"` — тогда условие станет короче и
        прочитается как правило: `if not weekend and holiday == "нет":`.
      skills: [boolean-logic, conditions]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`and` — верны обе части, `or` — хотя бы одна, `not` — наоборот. Сначала выполняется `not`, потом `and`, потом `or`; смешиваешь `and` и `or` — ставь скобки."
      - "Каждая часть условия — полное сравнение (или флаг): `day == \"сб\" or day == \"вс\"`. Непустая строка справа от `or` (например, `\"вс\"`) делает условие верным всегда."
      - "Результат сравнения можно сохранить во флаг: `storm = answer == \"да\"` — и писать `if storm:` или `if not storm:`. `not` ставят перед флагом или сравнением, а не перед словом из `input()`."
      - "Короче и понятнее: `7 <= age <= 17` вместо двух сравнений, `t <= 25` вместо `not (t > 25)`, одно условие с `and` вместо вложенного `if`. Двойное сравнение — для чисел: строки сравниваются по алфавиту."
    question: Почему условие `day != "сб" or day != "вс"` верно для любого дня недели?
    answer: >-
      Любой день не равен хотя бы одному из двух: суббота — не воскресенье, воскресенье — не
      суббота. Для субботы первая часть False, но вторая True, и `or` даёт True. «Не суббота и не
      воскресенье» записывается через `and`: `day != "сб" and day != "вс"`.
