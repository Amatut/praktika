            codeRegex: '<=\s*7\b|>=\s*17\b'
          why: >-
            Ребёнку ровно 7 или ровно 17 лет отказали. В проверке «не подходит» знак с `=`
            захватывает саму границу: `7 <= 7` — True. А 7 и 17 лет в группу как раз подходят.
          try: В проверке «не подходит» пиши строгие знаки — `age < 7` и `age > 17`.
        - id: lost-bounds
          when:
            outputEquals: Не подходит по возрасту
            codeRegex: '\b7\s*<(?!=)|<(?!=)\s*17\b|>(?!=)\s*7\b|\b17\s*>(?!=)'
          why: >-
