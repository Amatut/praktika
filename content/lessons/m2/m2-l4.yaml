        себя в уме на границах: 7 и 17 подходят, 6 и 18 — нет.
      skills: [boolean-logic, comparisons]

  - id: practice-vest
    type: exercise
    title: Практика 3
    exercise:
      id: m2-l4-e2
      kind: modify
      title: Спасжилет
      statement: |-
        Программа для спасжилетов пока спрашивает только возраст. А по правилу Вадима жилет нужен
        не только детям младше 14 лет, но и всем, кто **не умеет плавать**.

        Измени её: пусть второй строкой она читает ответ, умеет ли турист плавать, и учитывает оба
        случая. Ответ вводится ровно так: `да` или `нет`, маленькими буквами. Вывод — одна из двух
        строк, как и раньше:

        ```text
        Нужен спасжилет
        ```

        ```text
        Можно без жилета
        ```
      input: "Две строки: возраст (целое число) и ответ `да` или `нет` — умеет ли турист плавать."
      output: "Одна строка: `Нужен спасжилет` или `Можно без жилета`."
      constraints:
        - Первой строкой приходит возраст, второй — ответ про плавание.
        - Проверять другой ввод, например «Да» или «умею», не нужно.
      starterCode: |
        age = int(input("Возраст: "))
        if age < 14:
            print("Нужен спасжилет")
        else:
            print("Можно без жилета")
      tests:
        - id: t1
          kind: io
          title: Взрослый не умеет плавать
          example: true
          stdin: "30\nнет\n"
          expected: Нужен спасжилет
          compare: {ignoreSpaces: true}
        - id: t2
          kind: io
          title: Взрослый умеет плавать
          example: true
          stdin: "30\nда\n"
          expected: Можно без жилета
          compare: {ignoreSpaces: true}
        - id: t3
          kind: io
          title: Ребёнок умеет плавать
          stdin: "10\nда\n"
          expected: Нужен спасжилет
          compare: {ignoreSpaces: true}
        - id: t4
          kind: io
          title: "Граничный случай: ровно 14 лет"
          edge: true
          stdin: "14\nда\n"
          expected: Можно без жилета
          compare: {ignoreSpaces: true}
        - id: t5
          kind: io
          title: "Граничный случай: 13 лет"
          edge: true
          stdin: "13\nда\n"
          expected: Нужен спасжилет
          compare: {ignoreSpaces: true}
        - id: t6
          kind: io
          title: "Граничный случай: оба повода сразу"
          edge: true
          stdin: "10\nнет\n"
          expected: Нужен спасжилет
          compare: {ignoreSpaces: true}
      criteria:
        - Программа читает две строки — сначала возраст, потом ответ про плавание.
        - Жилет нужен, если турист младше 14 лет или не умеет плавать; хватает одного из поводов.
        - Турист ровно 14 лет, который умеет плавать, обходится без жилета.
      hints:
        - >-
          Жилет теперь нужен в двух случаях. Достаточно, чтобы выполнился один из них, или нужны
          оба? И ответ про плавание сначала нужно прочитать. Это слово «да» или «нет» — как задать
          о нём вопрос, который даст True или False?
        - >-
          Похожее правило: `if rain == "да" or km > 5:` — едем на автобусе, если идёт дождь или
          идти дальше 5 км; хватит одной причины. Ответ-слово сравнивают со строкой в кавычках, а
