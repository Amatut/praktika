                print("Файл журнала повреждён, начинаю новый")
                expenses = []

            while True:
                category = input("Категория: ").strip()
                if category != "":
                    break
                print("Категория не может быть пустой")

            while True:
                try:
                    text = input("Сумма: ")
                    amount = int(txt)
                except:
                    print("Нужна сумма целым числом, например 350")
                    continue
                if amount > 0:
                    break
                print("Сумма должна быть больше нуля")

            expenses.append({"категория": category, "сумма": amount})
            with open("expenses.json", "w", encoding="utf-8") as f:
                json.dump(expenses, f, ensure_ascii=False, indent=2)
            total = 0
            for record in expenses:
                total += record["сумма"]
            print(f"Записей: {len(expenses)}")
            print(f"Всего: {total} руб.")
          note: >-
            Голый except, а input() внутри try: он ловит и опечатку txt, и конец ввода — цикл
            печатает сообщение без конца, пока не сработает лимит вывода.
          expectMistake: bare-loop
      mistakes:
        - id: file-name
          when:
            errorType: FileNotFoundError
            failedTest: t1
          where: Строка с `open()`, где загружается журнал
          why: >-
            Даже в «Примере 1», где журнал лежит рядом с программой, `open()` его не находит.
            Значит, имя в коде не совпадает с именем файла: опечатка, другое расширение или лишний
            пробел.
          try: >-
            Сверь имя с блоком «Файлы задания» — ровно `expenses.json` — а лучше скопируй его
            оттуда.
          verify: «Пример 1» не должен падать с FileNotFoundError.
        - id: missing-crash
          when:
            errorType: FileNotFoundError
          why: >-
            В «Примере 3» файла `expenses.json` нет — так бывает при самом первом запуске. Прочитать
            несуществующий файл нельзя, поэтому Python выбрасывает FileNotFoundError, а программа
            его не ловит.
          try: >-
            Оберни загрузку в `try` и добавь `except FileNotFoundError:` — в нём просто начни с
            пустого списка, без сообщения. Шаблон «загрузить или начать заново» — в уроке 7.6.
          verify: "В «Примере 3» должно получиться «Записей: 1»."
        - id: damaged-crash
          when:
            errorType: JSONDecodeError
          why: >-
            Файл есть, но в нём не JSON: он пустой или оборван на середине. `json.load` не может
            его разобрать и выбрасывает json.JSONDecodeError — это другая ошибка, не
            FileNotFoundError, и её нужно ловить отдельно.
          try: >-
            Добавь к загрузке второй `except json.JSONDecodeError:` — напечатай в нём
            `Файл журнала повреждён, начинаю новый` и начни с пустого списка.
          verify: Граничные случаи «файл испорчен» и «пустой файл» должны пройти.
        - id: no-continue
          when:
            errorType: UnboundLocalError
          why: >-
            После сообщения о неверной сумме программа не вернулась к вопросу, а пошла дальше — к
            проверке «больше нуля». Но `int()` не сработал, значения у переменной нет, отсюда
            UnboundLocalError.
          try: >-
            Поставь `continue` сразу после сообщения в `except ValueError:` — он вернёт к новому
            вопросу (урок 7.4).
          verify: «Пример 2» не должен падать.
        - id: no-continue-flat
          when:
            errorType: NameError
            outputIncludes: Нужна сумма целым числом
          why: >-
            Сообщение о неверной сумме напечатано, но программа не вернулась к вопросу, а пошла
            дальше — к проверке «больше нуля». `int()` не сработал, у переменной с суммой нет
            значения, отсюда NameError — как в прогнозе «Буквы вместо числа» из урока 7.4.
          try: >-
            Допиши `continue` в `except ValueError:` сразу после сообщения — он вернёт к вопросу.
            Начальное значение суммы до цикла не поможет: программа проверит старое значение и
            напечатает лишнее сообщение.
          verify: «Пример 2» не должен падать, а после «триста» должно появиться одно сообщение.
        - id: double-message
          when:
            failedTest: t2
            outputIncludes: "например 350\nСумма должна быть больше нуля\nСумма должна быть больше нуля"
          why: >-
            На «триста» программа напечатала два сообщения подряд: после неверного ввода она не
            вернулась к вопросу, а проверила «больше нуля» старое значение суммы — то, что было
            до `int()`.
          try: >-
            Допиши `continue` в `except ValueError:` сразу после сообщения — тогда после неверного
            ввода программа сразу спросит снова (урок 7.4).
          verify: "В «Примере 2» после «Нужна сумма целым числом, например 350» должна идти одна строка «Сумма должна быть больше нуля»."
        - id: amount-crash
          when:
            errorType: ValueError
          why: >-
            На ответ «триста» программа упала: `int()` не превращает слова в число и выбрасывает
            ValueError, а программа его не ловит.
          try: >-
            Поставь `int()` внутрь `try` и добавь `except ValueError:` с сообщением
            `Нужна сумма целым числом, например 350` и `continue` — пусть программа спросит снова
            (урок 7.4).
          verify: "«Пример 2» должен дойти до итога «Всего: 1800 руб.»."
        - id: bare-hides-error
          when:
            errorType: EOFError
            codeRegex: '\bexcept\s*:|\bexcept\s+(Base)?Exception\b'
          why: >-
            Программа переспрашивает даже на верный ответ, пока не кончится ввод (EOFError). Похоже,
            `except` без типа прячет настоящую ошибку в коде — например, опечатку в имени
            переменной: любая ошибка внутри `try` выглядит для программы как неверный ввод.
          try: >-
            Укажи в `except` конкретный тип — `ValueError`. Тогда Python покажет настоящую ошибку,
            и её можно будет исправить (урок 7.3).
          verify: «Пример 1» должен дойти до итога.
        - id: loop-no-exit
          when:
            errorType: EOFError
          why: >-
            Программа спрашивает снова даже после верного ответа — цикл не заканчивается. В
            тренажёре ввод записан заранее: когда строки кончаются, `input()` выбрасывает EOFError.
            На компьютере программа просто ждала бы ответа вечно.
          try: >-
            Когда ответ прошёл все проверки, выйди из цикла: `break` или `return` (урок 7.4).
          verify: «Пример 1» должен дойти до итога.
        - id: no-return
          when:
            errorType: AttributeError
            errorIncludes: append
          why: >-
            Загрузка вернула `None` — «ничего». Так бывает, когда в одном из `except` нет
            `return []` и функция заканчивается без ответа. У `None` нет метода `append`, отсюда
            ошибка про NoneType.
          try: >-
            Проверь оба `except` при загрузке: в каждом должен быть `return []` (или присваивание
            пустого списка, если загрузка без функции).
          verify: «Пример 3» и граничные случаи «файл испорчен» и «пустой файл» не должны падать.
        - id: append-assigned
          when:
            errorIncludes: NoneType
            codeRegex: '^\s*(\w+)\s*=\s*\1\.append\('
          where: Строка, где запись добавляется в список
          why: >-
            `append()` меняет сам список и ничего не возвращает — то есть возвращает `None`.
            Строка `expenses = expenses.append(…)` добавляет запись, а потом кладёт в `expenses`
            этот `None`, и список пропадает.
          try: "Вызывай `append` отдельной строкой, без присваивания: `expenses.append({…})`."
          verify: «Пример 1» не должен падать.
        - id: none-value
          when:
            errorIncludes: NoneType
          why: >-
            Там, где нужно значение, оказалось `None` — «ничего». Чаще всего так бывает, когда
            функция заканчивается без `return`: например, `ask_amount()` выходит из цикла через
            `break`, а сумму не возвращает, и в запись попадает `None` вместо числа.
          try: >-
            Проверь, что каждая функция возвращает свой результат: `return amount` вместо `break`.
            Нажми «Запустить» и посмотри в «Файлах после запуска», нет ли в новой записи `null` —
            так JSON записывает `None`.
          verify: «Пример 1» не должен падать.
        - id: read-with-w
          when:
            errorIncludes: not readable
          why: >-
            Журнал для чтения открыт в режиме `"w"`. Из такого файла читать нельзя (not readable),
            а сам режим `"w"` в момент открытия уже стёр журнал.
          try: >-
            При загрузке открывай файл без режима или с `"r"` — это чтение. Режим `"w"` нужен
            только при сохранении.
          verify: «Пример 1» не должен падать.
        - id: write-without-w
          when:
            errorIncludes: not writable
          why: >-
            При сохранении файл открыт без режима `"w"` — значит, для чтения, и записать в него
            нельзя (not writable).
          try: Для сохранения открывай журнал с режимом `"w"` и `encoding="utf-8"`.
          verify: «Пример 1» не должен падать.
        - id: append-mode
          when:
            failedTest: t7
            outputIncludes: "Всего: 1950 руб."
            codeRegex: 'open\([^)\n]*["'']a["'']'
          where: '`open()`, которым сохраняется журнал'
          why: >-
            Режим `"a"` дописывает в конец: после старого списка в файле появляется второй,
            `[…][…]`, и файл перестаёт быть JSON. Следующий запуск решит, что журнал повреждён.
          try: >-
            Сохраняй весь список заново в режиме `"w"`: он стирает старое содержимое, но в списке
            уже есть и старые записи, и новая.
          verify: Проверка «Журнал сохранён целиком» должна пройти.
        - id: wiped-before-load
          when:
            failedTest: t1
            outputIncludes: Файл журнала повреждён
          why: >-
            Программа говорит, что журнал повреждён, хотя в «Примере 1» файл в порядке. Скорее
            всего, файл открывается в режиме `"w"` раньше загрузки — например, общим `with` вокруг
            всей программы. Режим `"w"` стирает файл в момент открытия, и загрузка читает уже
            пустой файл.
          try: >-
            Разнеси по времени: сначала загрузи журнал (файл закроется после `with`), а в самом
            конце открой его в режиме `"w"` и сохрани весь список.
          verify: "В «Примере 1» должно получиться «Записей: 3»."
        - id: not-loaded
          when:
            failedTest: t1
            outputIncludes: "Записей: 1"
          why: >-
            Программа начала с пустого журнала, хотя в `expenses.json` уже две записи. Загрузка
            ничего не принесла: либо имя файла написано с ошибкой и молча сработал
            `except FileNotFoundError`, либо загруженный список не попал в переменную, с которой
            программа работает дальше.
          try: >-
            Сверь имя файла с «Файлами задания» и проверь, что результат загрузки сохраняется в
            переменную, в которую потом добавляется запись.
          verify: "В «Примере 1» должно получиться «Записей: 3»."
        - id: message-on-missing
          when:
            failedTest: t3
            outputIncludes: Файл журнала повреждён
          why: >-
            Когда файла нет, программа пишет, что он повреждён. Но это первый запуск, а не
            поломка: журнала ещё не было, и пугать человека незачем.
          try: >-
            Раздели `except`: для FileNotFoundError — молча пустой список, для
            json.JSONDecodeError — сообщение и пустой список.
          verify: "В «Примере 3» должны остаться только строки «Записей: 1» и «Всего: 450 руб.»."
        - id: negative-no-retry
          when:
            outputIncludes: "Сумма должна быть больше нуля\nЗаписей: 3\nВсего: 1450 руб."
          why: >-
            Программа напечатала «Сумма должна быть больше нуля», но не спросила снова: -50 ушло
            в журнал, и итог получился 1450 вместо 1800. После сообщения не хватает `continue`,
            и цикл дошёл до `break`.
          try: >-
            Допиши `continue` сразу после сообщения «Сумма должна быть больше нуля» — или выходи
            из цикла через `break` только тогда, когда сумма больше нуля (урок 7.4).
          verify: "В «Примере 2» итог должен стать «Всего: 1800 руб.»."
        - id: negative-accepted
          when:
            outputIncludes: "Всего: 1450 руб."
          why: >-
            Программа приняла сумму -50. Это целое число, и `int()` не возражает, но расход не
            бывает отрицательным — итог получился 1450 вместо 1800.
          try: >-
            После `int()` проверь смысл: если сумма меньше или равна нулю, напечатай
            `Сумма должна быть больше нуля` и спроси снова.
          verify: "В «Примере 2» итог должен стать «Всего: 1800 руб.»."
        - id: isdigit-negative
          when:
            failedTest: t2
            outputIncludes: "Всего: 1800 руб."
            codeRegex: '\.is(digit|numeric|decimal)\('
          why: >-
            На «-50» программа отвечает, что нужно целое число, хотя -50 — целое, просто
            отрицательное. `isdigit()` (и похожие `isnumeric()`, `isdecimal()`) не считает минус
            цифрой, поэтому человек получает не то объяснение.
          try: >-
            Превращай ответ через `int()` внутри `try`: он понимает и минус, и пробелы по краям. А
            ноль и отрицательные числа отсей отдельной проверкой после превращения (урок 7.4).
          verify: "В «Примере 2» после «-50» должно появиться «Сумма должна быть больше нуля»."
        - id: category-no-retry
          when:
            failedTest: t-cat
            outputIncludes: "Категория не может быть пустой\nНужна сумма целым числом, например 350\nНужна сумма целым числом"
          why: >-
            Программа напечатала «Категория не может быть пустой», но не спросила снова: пустая
            категория ушла в журнал, а следующая строка ввода, «кафе», — в вопрос о сумме. Похоже,
            после сообщения нет `continue`, и цикл дошёл до `break`.
          try: >-
            Выходи из цикла через `break` (или `return`) только тогда, когда категория не пустая,
            а после сообщения возвращайся к вопросу — `continue` (урок 7.4).
          verify: Проверка «Категория без пробелов и не пустая» должна пройти.
        - id: empty-category
          when:
            failedTest: t-cat
            outputIncludes: "Всего: 1800 руб."
          why: >-
            Программа приняла пустую категорию. Следующая строка ввода, «кафе», ушла в вопрос о
            сумме, а в журнале появилась запись без категории.
          try: >-
            После `strip()` проверь категорию: если она равна `""`, напечатай
            `Категория не может быть пустой` и спроси снова.
          verify: Проверка «Категория без пробелов и не пустая» должна пройти.
        - id: strip-first
          when:
            failedTest: t6
            outputIncludes: "Всего: 1750 руб."
          why: >-
            Строка из одних пробелов прошла проверку на пустоту: пока пробелы не убраны, она не
            равна `""`. В журнал попала пустая категория, а «  кафе  » ушло в вопрос о сумме.
          try: Сначала убери пробелы через `strip()`, потом проверяй, не пустая ли строка.
          verify: Граничный случай «пробелы и ноль» должен начаться с «Категория не может быть пустой».
        - id: zero-accepted
          when:
            failedTest: t6
            outputIncludes: "Категория не может быть пустой\nЗаписей: 3"
          why: >-
            Сумма 0 прошла проверку. Скорее всего, в проверке суммы стоит `< 0`, и ноль оказался
            на «разрешённой» стороне границы. А расход в ноль рублей — не расход.
          try: Отсекай и ноль — сумма должна быть строго больше нуля.
          verify: "В граничном случае «пробелы и ноль» итог должен стать «Всего: 1750 руб.»."
        - id: category-once
          when:
            failedTest: t12
            outputIncludes: "Категория не может быть пустой\nНужна сумма целым числом"
          why: >-
            После второй пустой категории программа не переспросила: строка из пробелов ушла в
            журнал как пустая категория, а «кафе» — в вопрос о сумме. Похоже, категория
            проверяется один раз, через `if`, а не в цикле.
          try: >-
            Спрашивай категорию в цикле `while True` и выходи из него только после непустого
            ответа — сколько бы пустых ответов ни было подряд (урок 7.4).
          verify: Граничный случай «два неверных ответа подряд» должен пройти.
        - id: amount-recheck-once
          when:
            failedTest: t12
            outputIncludes: "Всего: 1495 руб."
          why: >-
            После суммы 0 программа спросила снова, но следующий ответ, -5, уже не проверила.
            Похоже, «больше нуля» проверяется один раз — после цикла для `int()`, а не внутри него.
          try: >-
            Держи обе проверки в одном цикле: превратить через `int()`, потом проверить «больше
            нуля» — и выходить из цикла, только когда ответ прошёл обе.
          verify: Граничный случай «два неверных ответа подряд» должен пройти.
        - id: float-truncated
          when:
            failedTest: t13
            outputIncludes: "Всего: 1512 руб."
          why: >-
            Ответ 12.5 принят как 12: `int(float(…))` молча отбрасывает дробную часть. А сумма по
            условию — целое число рублей, и на 12.5 программа должна переспросить.
          try: >-
            Превращай ответ сразу через `int()` — на «12.5» он сам выбросит ValueError, и сработает
            `except ValueError`.
          verify: Граничный случай «дробная сумма» должен пройти.
        - id: amount-as-str
          when:
            failedTest: t8
            outputIncludes: "Всего: 1950 руб."
          why: >-
            Вывод верный, но в файле сумма сохранена текстом — в кавычках, `"450"`. Для JSON это
            строка, и при следующем запуске её не сложить с числами без лишних превращений.
          try: Сохраняй в запись число — результат `int()`, а не строку, которую вернул `input()`.
          verify: Проверка «Сумма сохранена числом» должна пройти.
        - id: only-new-saved
          when:
            failedTest: t9
            outputIncludes: "Всего: 1950 руб."
          why: >-
            Вывод верный, но в файле осталась только новая запись — старые расходы пропали. Режим
            `"w"` стирает файл, поэтому сохранять нужно весь журнал, а не одну запись.
          try: Добавь запись в загруженный список и сохрани в файл весь список.
          verify: Проверка «Старые записи на месте» должна пройти.
        - id: ascii-escapes
          when:
            failedTest: t10
            outputIncludes: "Всего: 1950 руб."
          why: >-
            В файле вместо русских букв коды вроде `\u043a\u0430\u0444\u0435`. Python прочитает их
            правильно, а человек в Блокноте — нет. Так `json.dump` пишет по умолчанию.
          try: Добавь в `json.dump` аргумент `ensure_ascii=False`, а для отступов — `indent=2`.
          verify: Проверка «Русские буквы в файле — как есть» должна пройти.
        - id: not-saved
          when:
            failedTest: t7
            outputIncludes: "Всего: 1950 руб."
          why: >-
            Вывод верный, но в `expenses.json` после запуска не тот журнал. Либо новой записи в
            файле нет (например, журнал сохраняется раньше, чем в список добавлена запись), либо
            она записана иначе — с другими ключами или с `null` вместо категории или суммы. `null`
            появляется, когда функция вопроса заканчивается без `return`.
          try: >-
            Нажми «Запустить» и загляни в «Файлы после запуска». Сохраняй после добавления: открой
            файл в режиме `"w"` и запиши через `json.dump` весь список. Проверь ключи записи —
            ровно `"категория"` и `"сумма"` — и что функции вопросов возвращают ответ через
            `return`.
          verify: Проверка «Журнал сохранён целиком» должна пройти.
        - id: bare-except
          when:
            failedTest: t-except
            outputIncludes: "Всего: 1950 руб."
          why: >-
            `except:` без типа или `except Exception` ловит всё подряд — и неверный ввод, и
            опечатки в самом коде. Опечатка превратится в «неверную сумму», и причину будет не
            найти (урок 7.3).
          try: >-
            Укажи конкретный тип: `ValueError` для суммы, `FileNotFoundError` и
            `json.JSONDecodeError` для загрузки.
          verify: Проверка «Ловятся конкретные исключения» должна пройти.
        - id: no-encoding
          when:
            failedTest: t-enc
            outputIncludes: "Всего: 1950 руб."
          why: >-
            В одном из `open()` не указана кодировка. В тренажёре это незаметно, но тогда
            программа зависит от настроек компьютера: на русской Windows со старым Python (до
            3.15) журнал прочитается кракозябрами, и программа упадёт или посчитает не то.
          try: >-
            Добавь `encoding="utf-8"` в каждый `open()` — и для чтения, и для записи. Если пишешь
            через `read_text`/`write_text`, им кодировка нужна тоже.
          verify: Проверка «Кодировка указана» должна пройти.
        - id: float-amount
          when:
            failedTest: t1
            outputIncludes: "1950.0"
          why: >-
            Итог напечатан как `1950.0`: сумма прочитана через `float()` и стала дробной. А в
            журнале суммы — целые рубли, и ответ вроде `12.5` программа должна отвергать.
          try: Превращай ответ через `int()` — он не примет ни `12.5`, ни `триста`.
          verify: "В «Примере 1» должно получиться «Всего: 1950 руб.»."
        - id: count-before-append
          when:
            failedTest: t1
            outputIncludes: "Записей: 2"
          why: >-
            В журнале уже три записи, а программа насчитала две: новая запись не попала в список к
            моменту подсчёта. Похоже, число записей считается до `append` — или запись в список не
            добавляется вовсе.
          try: >-
            Считай итог — и число записей, и сумму — после того, как новая запись добавлена в
            список.
          verify: "В «Примере 1» должно получиться «Записей: 3»."
        - id: format
          when:
            failedTest: t1
            outputIncludes: "1950"
          why: >-
            Сумма верная, но вывод не совпадает с образцом, а проверка сравнивает строки
            посимвольно.
          try: >-
            Сравни с образцом: `Записей: 3` и `Всего: 1950 руб.` — число записей, двоеточие,
            пробелы, «руб.» с точкой. Лишних строк быть не должно: подсказки для ввода пиши внутри
            `input("…")`, а не отдельным `print` — иначе они попадают в вывод.
          verify: Вывод «Примера 1» должен совпасть с образцом строка в строку.
        - id: bare-loop
          when:
            failedTest: t1
            codeRegex: '\bexcept\s*:|\bexcept\s+(Base)?Exception\b'
          why: >-
            «Пример 1» не прошёл, а в коде есть `except` без типа. Он ловит всё подряд: неверный
            ответ, опечатку в имени переменной и даже конец ввода. Для программы всё это выглядит
            как неверный ответ, поэтому она может без конца печатать одно и то же сообщение, пока
            её не остановят, — а настоящая ошибка спрятана.
          try: >-
            Укажи в `except` конкретный тип — `ValueError` для суммы. Тогда Python покажет
            настоящую ошибку, и её можно будет исправить (урок 7.3).
          verify: «Пример 1» должен дойти до итога.
      afterPass: >-
        Журнал переживает первый запуск, пустой и испорченный файл, неверные ответы — и хранит
        записи между запусками. Одно улучшение: перед тем как начать новый журнал вместо
        испорченного, сохрани испорченный файл под другим именем, например
        `expenses_broken.json` (`read_text` и `write_text` из урока 7.2), — вдруг записи ещё
        можно спасти вручную.
      skills: [files-json, exceptions, input-validation, function-design, files-paths]
      noHintsBeforeAttempt: true

  - id: bonus-task
    type: exercise
    title: Усложнение
    exercise:
      id: m7-l7-e2
      kind: write
      title: Отчёт по категориям в CSV
      statement: |-
        Это задание по желанию: если на сегодня хватит главного, вернись к нему в другой день.

        Орловы хотят понять, на что уходят деньги. Напиши программу, которая читает журнал
        `expenses.json` (в этом задании он всегда в порядке) и складывает суммы по категориям.
        Затем программа:

        1. печатает по строке на категорию — например, `продукты: 2000` — в том порядке, в каком
           категории впервые встречаются в журнале;
        2. последней строкой печатает `Категорий в отчёте: N`;
        3. записывает отчёт в файл `report.csv`: первая строка — заголовок из двух ячеек,
           `категория` и `сумма`, дальше по строке на категорию в том же порядке. Если
           `report.csv` остался от прошлого запуска, отчёт пишется заново, а не дописывается в
           конец.

        Для журнала из «Файлов задания» вывод такой:

        ```text
        продукты: 2000
        транспорт: 300
        кафе: 450
        Категорий в отчёте: 3
        ```

        Словарь помнит порядок, в котором в него добавляли ключи (урок 4.4), поэтому нужный
        порядок получится сам. Сам журнал `expenses.json` не меняй — отчёт пишется в отдельный
        файл.
      input: Ввода нет — только файл `expenses.json` со списком записей.
      output: >-
        Строки `категория: сумма` и `Категорий в отчёте: N`; файл `report.csv` с заголовком и
        строками отчёта.
      constraints:
        - Подсказки откроются после первой проверки — сначала попробуй сам.
        - Категория может содержать запятую — например, «кино, театр».
        - Файл для CSV открывай с `newline=""`, у каждого `open()` — `encoding="utf-8"`.
      files:
        expenses.json: |
          [
            {"категория": "продукты", "сумма": 1200},
            {"категория": "транспорт", "сумма": 300},
            {"категория": "продукты", "сумма": 800},
            {"категория": "кафе", "сумма": 450}
          ]
      starterCode: |
        import csv
        import json

        # Прочитай expenses.json, сложи суммы по категориям,
        # выведи отчёт и запиши его в report.csv

      tests:
        - id: t1
          kind: io
          title: "Пример 1: отчёт на экране"
          example: true
          expected: |-
            продукты: 2000
            транспорт: 300
            кафе: 450
            Категорий в отчёте: 3
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t2
          kind: assert
          title: "Пример 2: файл report.csv"
          example: true
          code: |
            import csv
            import os

            assert os.path.exists("report.csv")
            with open("report.csv", encoding="utf-8", newline="") as f:
                rows = list(csv.reader(f))
            assert rows == [
                ["категория", "сумма"],
                ["продукты", "2000"],
                ["транспорт", "300"],
                ["кафе", "450"],
            ]
          message: >-
            В `report.csv` первая строка — заголовок `категория,сумма`, дальше по строке на
            категорию в порядке первого появления.
        - id: t3
          kind: io
          title: "Граничный случай: журнал пустой"
          edge: true
          files:
            expenses.json: "[]\n"
          expected: "Категорий в отчёте: 0"
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t4
          kind: assert
          title: "Граничный случай: в отчёте только заголовок"
          edge: true
          files:
            expenses.json: "[]\n"
          code: |
            import csv
            import os

            assert os.path.exists("report.csv")
            with open("report.csv", encoding="utf-8", newline="") as f:
                rows = list(csv.reader(f))
            assert rows == [["категория", "сумма"]]
          message: >-
            Даже для пустого журнала в `report.csv` есть строка заголовка `категория,сумма`.
        - id: t5
          kind: io
          title: "Граничный случай: запятая в категории"
          edge: true
          files:
            expenses.json: |
              [
                {"категория": "кино, театр", "сумма": 500},
                {"категория": "такси", "сумма": 300},
                {"категория": "кино, театр", "сумма": 200}
              ]
          expected: |-
            кино, театр: 700
            такси: 300
            Категорий в отчёте: 2
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t6
          kind: assert
          title: Запятая в категории — одно значение
          files:
            expenses.json: |
              [
                {"категория": "кино, театр", "сумма": 500},
                {"категория": "такси", "сумма": 300},
                {"категория": "кино, театр", "сумма": 200}
              ]
          code: |
            import csv
            import os

            assert os.path.exists("report.csv")
            with open("report.csv", encoding="utf-8", newline="") as f:
                rows = list(csv.reader(f))
            assert rows == [["категория", "сумма"], ["кино, театр", "700"], ["такси", "300"]]
          message: >-
            Категория «кино, театр» читается из `report.csv` одним значением: в каждой строке
            ровно два столбца.
        - id: t-old
          kind: assert
          title: Старый отчёт заменяется новым
          files:
            report.csv: "категория,сумма\nстарое,1\n"
          code: |
            import csv
            import os

            assert os.path.exists("report.csv")
            with open("report.csv", encoding="utf-8", newline="") as f:
                rows = list(csv.reader(f))
            assert rows == [
                ["категория", "сумма"],
                ["продукты", "2000"],
                ["транспорт", "300"],
                ["кафе", "450"],
            ]
          message: >-
            Перед запуском в папке уже лежал `report.csv` от прошлого раза. После запуска в нём
            должен быть только новый отчёт: заголовок и три строки, без старых строк.
        - id: t-src
          kind: assert
          title: Журнал не изменился
          code: |
            import os

            original = (
                "[\n"
                '  {"категория": "продукты", "сумма": 1200},\n'
                '  {"категория": "транспорт", "сумма": 300},\n'
                '  {"категория": "продукты", "сумма": 800},\n'
                '  {"категория": "кафе", "сумма": 450}\n'
                "]\n"
            )
            assert os.path.exists("expenses.json")
            with open("expenses.json", encoding="utf-8") as f:
                assert f.read() == original
          message: >-
            Файл `expenses.json` после запуска такой же, как был: отчёт пишется в новый файл.
        - id: t-newline
          kind: assert
          title: Файл для CSV открыт с newline=""
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            for node in ast.walk(ast.parse(source)):
                if isinstance(node, ast.Call) and getattr(node.func, "id", None) == "open":
                    mode = "r"
                    if len(node.args) > 1 and isinstance(node.args[1], ast.Constant):
                        mode = node.args[1].value
                    for k in node.keywords:
                        if k.arg == "mode" and isinstance(k.value, ast.Constant):
                            mode = k.value.value
                    if "w" in mode or "a" in mode:
                        assert any(k.arg == "newline" for k in node.keywords)
          message: >-
            Файл `report.csv` открыт для записи без `newline=""`. Добавь его — иначе на Windows
            между строками таблицы появятся пустые строки.
        - id: t-enc
          kind: assert
          title: Кодировка указана
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            calls = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Call)
                     and (getattr(n.func, "id", None) in names or getattr(n.func, "attr", None) in names)]


            def has_encoding(call):
                if any(k.arg == "encoding" for k in call.keywords):
                    return True
                name = getattr(call.func, "id", None) or call.func.attr
                # Кодировка по позиции: open(file, mode, buffering, encoding),
                # Path.open(mode, buffering, encoding), read_text(encoding), write_text(data, encoding)
                position = {"open": 3 if isinstance(call.func, ast.Attribute) else 4, "read_text": 1, "write_text": 2}[name]
                return len(call.args) >= position


            assert all(has_encoding(c) for c in calls)
          message: >-
            В одном из `open()` (или `read_text`/`write_text`) не указана кодировка. Добавь
            `encoding="utf-8"` — иначе программа зависит от настроек компьютера: на Windows со
            старым Python (до 3.15) русский текст превратится в кракозябры.
      criteria:
        - Суммы складываются по категориям, каждая категория — одна строка, в порядке первого появления.
        - "Последняя строка вывода — `Категорий в отчёте: N`."
        - "`report.csv` начинается с заголовка, значение с запятой остаётся одним столбцом."
        - "`expenses.json` не меняется; CSV открыт с `newline=\"\"`, у каждого `open()` указана кодировка."
      hints:
        - >-
          Раздели работу на три части: прочитать журнал, сложить суммы по категориям в словаре,
          потом вывести и записать отчёт. Что должно случиться со словарём, когда категория
          встречается впервые, а что — когда она встречается снова?
        - |-
          Похожий приём — подсчёт голосов из урока 4.4:

          ```python
          votes = {}
          for color in ["синий", "красный", "синий"]:
              votes[color] = votes.get(color, 0) + 1
          ```

          А таблица записывается, как в уроке 7.5:

          ```python
          with open("votes.csv", "w", encoding="utf-8", newline="") as f:
              writer = csv.writer(f)
              writer.writerow(["цвет", "голоса"])
          ```
        - |-
          Каркас:

          ```text
          открыть expenses.json для чтения → expenses = json.load(f)
          totals = {}
          для каждой записи: totals[категория] = totals.get(категория, 0) + сумма
          открыть report.csv в режиме "w" с encoding и newline=""
              writer = csv.writer(f), заголовок
              для каждой пары из totals.items(): writer.writerow([…, …])
          для каждой пары: print(f"{…}: {…}")
          print(f"Категорий в отчёте: {…}")
          ```
      solution:
        code: |
          import csv
          import json

          with open("expenses.json", encoding="utf-8") as f:
              expenses = json.load(f)

          totals = {}
          for record in expenses:
              category = record["категория"]
              totals[category] = totals.get(category, 0) + record["сумма"]

          with open("report.csv", "w", encoding="utf-8", newline="") as f:
              writer = csv.writer(f)
              writer.writerow(["категория", "сумма"])
              for category, amount in totals.items():
                  writer.writerow([category, amount])

          for category, amount in totals.items():
              print(f"{category}: {amount}")
          print(f"Категорий в отчёте: {len(totals)}")
        explanation: >-
          `totals.get(category, 0)` возвращает ноль, когда категория встречается впервые, поэтому
          сумма просто прибавляется к старой. Словарь хранит категории в порядке добавления, и
          `items()` отдаёт их в том же порядке. `csv.writer` сам превращает числа в текст и берёт
          «кино, театр» в кавычки, а `newline=""` не даёт Windows вставить пустые строки. Журнал
          только читается — отчёт уходит в новый файл.
      altSolutions:
        - code: |
            import csv
            import json

            with open("expenses.json", encoding="utf-8") as f:
                expenses = json.load(f)

            totals = {}
            for record in expenses:
                if record["категория"] in totals:
                    totals[record["категория"]] += record["сумма"]
                else:
                    totals[record["категория"]] = record["сумма"]

            with open("report.csv", "w", encoding="utf-8", newline="") as f:
                writer = csv.writer(f)
                writer.writerow(["категория", "сумма"])
                for category in totals:
                    writer.writerow([category, totals[category]])
                    print(category + ":", totals[category])
            print("Категорий в отчёте:", len(totals))
          note: Проверка in вместо get, печать внутри цикла записи.
        - code: |
            import csv
            import json

            with open("expenses.json", encoding="utf-8") as f:
                expenses = json.load(f)

            totals = {}
            for record in expenses:
                category = record["категория"]
                totals[category] = totals.get(category, 0) + record["сумма"]

            with open("report.csv", "w", encoding="utf-8", newline="") as f:
                writer = csv.DictWriter(f, fieldnames=["категория", "сумма"])
