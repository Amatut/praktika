id: m7-l7
module: m7
number: "7.7"
title: "Самостоятельная работа: журнал расходов"
objective: >-
  Самостоятельно написать программу, которая загружает журнал расходов из JSON-файла, принимает
  новую запись с проверкой ввода, сохраняет журнал и не падает, если файла нет или он повреждён.
minutes: [25, 30]
prerequisites: [m7-l6]
skills: [files-json, exceptions, input-validation, files-paths]
environment: python

story:
  title: Листочки на холодильнике
  fictional: true
  text: >-
    Орловы записывали расходы на листочках и прикрепляли их магнитами к холодильнику, но к концу
    месяца половина листочков терялась. Сумму считали на калькуляторе дважды — и получали разные
    числа. Старшая дочь Ксюша решила завести журнал: программа спрашивает категорию и сумму,
    сохраняет запись в файл и сразу показывает итог. Если кто-то напишет «триста» или «-50»,
    программа переспросит, а если файл потеряется или испортится, начнёт новый и не сломается.
    Сегодня ты напишешь такой журнал сам.

why: >-
  Самостоятельная работа проверяет весь модуль сразу: файлы, JSON, исключения и проверку ввода.
  По схеме «загрузить → изменить → сохранить» работают почти все программы, которые что-то помнят:
  например, список дел, который не теряет задачи после закрытия.

usedIn: >-
  Трекеры расходов и привычек, списки задач, заметки, сохранения в играх — и проект «Список задач
  с сохранением в JSON», который идёт сразу после этого модуля.

steps:
  - id: reminder
    type: theory
    title: Перед стартом
    body: |-
      Сегодня самостоятельная работа: журнал расходов ты пишешь сам, а подсказки в обоих
      заданиях откроются только после первой проверки. Это не запрет на помощь — просто сначала
      попробуй сам.

      Всё нужное уже было в этом модуле:

      - `with open("имя", encoding="utf-8") as f:` открывает файл и сам закрывает его после
        блока. Режим `"w"` **стирает** файл в момент открытия, `"a"` дописывает в конец (урок 7.1).
      - `json.load(f)` читает из файла список или словарь, а
        `json.dump(data, f, ensure_ascii=False, indent=2)` записывает его — русскими буквами и
        с отступами (урок 7.6).
      - Файла нет — `FileNotFoundError`. Файл пустой или испорчен — `json.JSONDecodeError`. Лови
        конкретные типы, а не всё подряд (уроки 7.3 и 7.6).
      - «Спросить → превратить → проверить → принять»: цикл `while True`, `try` и
        `except ValueError` вокруг `int()`, `continue` после сообщения об ошибке, `break` или
        `return` для верного ответа (урок 7.4).
      - Функции с понятными именами помогают разложить программу на части и проверить каждую
        отдельно (модуль 5).

      Как работать над заданием:

      1. Прочитай условие, примеры и блок «Файлы задания» — там лежит журнал `expenses.json`.
      2. Разложи решение на шаги и пиши по одному: загрузка, вопросы, сохранение, итог.
      3. Перед «Проверить» нажимай «Запустить». Поле «Ввод для „Запустить“» уже заполнено
         вводом из первого примера — меняй его, чтобы попробовать неверные ответы.
      4. Что программа записала, смотри в «Файлах после запуска». В тренажёре каждый запуск
         начинается с чистой папки: записанное пропадает, и два запуска подряд записи не копят.
         На компьютере файл остаётся — это можно проверить в чек-листе в конце урока.

      Главное задание — основа урока. Если время кончается, остановись после него:
      «Усложнение» и чек-лист можно сделать в другой день. Урок засчитается целиком, когда будут
      решены оба задания.
    simpler: >-
      Журнал — это пять действий подряд: загрузить список из файла, спросить категорию и сумму
      (переспрашивая, пока ответ неверный), добавить запись, сохранить список и показать итог.
      Каждое из них ты уже делал по отдельности — сегодня соберёшь их вместе.
    coach: >-
      Ошибиться на первой попытке — нормально. Самостоятельная работа показывает, что уже
      получается само, а что стоит повторить.

  - id: warmup
    type: predict
    title: Разминка
    prompt: >-
      Ксюша нашла в папке журнала файл `expenses.json` без единого символа — он совсем пустой
      (загляни в «Файлы задания»). Как думаешь, что выведет программа?
    code: |-
      import json


      def load(path):
          try:
              with open(path, encoding="utf-8") as f:
                  return json.load(f)
          except FileNotFoundError:
              return []
          except json.JSONDecodeError:
              print("Файл повреждён")
              return []


      print(len(load("expenses.json")))
    files:
      expenses.json: ""
    options:
      - "0"
      - |-
        Файл повреждён
        0
      - Ошибка FileNotFoundError
    answer: |-
      Файл повреждён
      0
    explanation: >-
      Файл есть, поэтому FileNotFoundError не случается. Но пустой файл — это не JSON: в нём нет
      ни списка, ни словаря, и `json.load` выбрасывает `json.JSONDecodeError`. Срабатывает второй
      `except`: сообщение и пустой список, а его длина — 0. Для программы пустой файл такой же
      повреждённый, как файл с оборванной скобкой, и журнал должен пережить оба случая.
    coach: Файла нет и файл пустой — разные беды, и ловят их разные `except`.

  - id: plan
    type: order
    title: "План: дневник чтения"
    prompt: >-
      Прежде чем писать журнал, разложи на шаги похожую задачу. Программа ведёт дневник чтения:
      в файле `books.json` хранится список прочитанных книг, а после каждой новой книги программа
      спрашивает название и число страниц, записывает книгу в дневник и показывает итог. Расставь
      действия программы по порядку.
    items:
      - id: load
        text: Загрузить список книг из `books.json`, а если файла нет — начать с пустого списка
      - id: ask-title
        text: Спрашивать название, пока не введут непустое
      - id: ask-pages
        text: Спрашивать число страниц, пока не введут целое число больше нуля
      - id: append
        text: Добавить новую книгу в конец списка
      - id: save
        text: Сохранить весь список в `books.json`
      - id: show
        text: Напечатать, сколько книг и страниц в дневнике
    before:
      - [load, append]
      - [ask-title, ask-pages]
      - [ask-pages, append]
      - [append, save]
      - [append, show]
    explanation: >-
      Добавлять книгу можно только в уже загруженный список: если начать с пустого, сохранение
      сотрёт старый дневник. Загрузить список можно и сразу, и после вопросов — главное, до
      добавления. Сохраняют весь список, а не одну новую книгу: режим `"w"` стирает файл, но в
      списке уже есть и старые книги, и новая. Итог печатают, когда новая книга уже в списке, —
      до сохранения или после, не важно.
    coach: >-
      В журнале расходов шаги те же — поменяются только названия: категория вместо названия,
      сумма вместо страниц.

  - id: main-task
    type: exercise
    title: Самостоятельная работа
    exercise:
      id: m7-l7-e1
      kind: write
      title: Журнал расходов
      statement: |-
        Напиши журнал расходов для семьи Орловых. Журнал хранится в файле `expenses.json` —
        это список записей, например:

        ```text
        [
          {"категория": "продукты", "сумма": 1200},
          {"категория": "транспорт", "сумма": 300}
        ]
        ```

        Программа делает пять вещей по порядку:

        1. **Загружает журнал.** Файла нет — начинает с пустого списка и ничего не печатает: это
           первый запуск. Файл пустой или испорчен — печатает `Файл журнала повреждён, начинаю новый`
           и тоже начинает с пустого списка.
        2. **Спрашивает категорию** и убирает пробелы по краям. Если осталась пустая строка —
           печатает `Категория не может быть пустой` и спрашивает снова.
        3. **Спрашивает сумму** — целое число рублей больше нуля. Не целое число — печатает
           `Нужна сумма целым числом, например 350`, ноль или меньше — `Сумма должна быть больше нуля`.
           В обоих случаях спрашивает снова.
        4. **Добавляет запись** `{"категория": …, "сумма": …}` в конец списка и **сохраняет весь
           журнал** в `expenses.json`: русские буквы — как есть, а не `\u0430`, сумма — числом.
        5. **Печатает итог** — число записей и сумму всех расходов в журнале.

        Для журнала из «Файлов задания» и ввода `кафе` и `450` итог такой:

        ```text
        Записей: 3
        Всего: 1950 руб.
        ```

        Сообщения и строки итога — точно как в условии: их удобнее скопировать отсюда.
      input: >-
        Категория, затем сумма — каждая на своей строке. Если ответ неверный, программа
        спрашивает снова, и следующая строка ввода — новый ответ.
      output: >-
        Сообщения об ошибках, если были, затем итог — строки `Записей: N` и `Всего: S руб.`;
        журнал сохранён в `expenses.json`.
      constraints:
        - Подсказки откроются после первой проверки — сначала попробуй сам.
        - Текст подсказок в `input()` может быть любым.
        - Лови конкретные исключения, без `except:` и `except Exception`.
        - У каждого `open()` укажи `encoding="utf-8"`.
      files:
        expenses.json: |
          [
            {"категория": "продукты", "сумма": 1200},
            {"категория": "транспорт", "сумма": 300}
          ]
      starterCode: |
        # Журнал расходов
        # Файл журнала: expenses.json
        # Ввод: категория, затем сумма (на неверный ответ — спросить снова)

      tests:
        - id: t1
          kind: io
          title: "Пример 1: новая запись"
          example: true
          stdin: "кафе\n450\n"
          expected: |-
            Записей: 3
            Всего: 1950 руб.
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t2
          kind: io
          title: "Пример 2: неверные ответы"
          example: true
          stdin: "\nкафе\nтриста\n-50\n300\n"
          expected: |-
            Категория не может быть пустой
            Нужна сумма целым числом, например 350
            Сумма должна быть больше нуля
            Записей: 3
            Всего: 1800 руб.
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t3
          kind: io
          title: "Пример 3: журнала ещё нет"
          example: true
          files:
            expenses.json: null
          stdin: "аптека\n450\n"
          expected: |-
            Записей: 1
            Всего: 450 руб.
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t4
          kind: io
          title: "Граничный случай: файл испорчен"
          edge: true
          files:
            expenses.json: '[{"категория": "продукты", "сумма": 1200},'
          stdin: "аптека\n450\n"
          expected: |-
            Файл журнала повреждён, начинаю новый
            Записей: 1
            Всего: 450 руб.
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t5
          kind: io
          title: "Граничный случай: пустой файл"
          edge: true
          files:
            expenses.json: ""
          stdin: "аптека\n450\n"
          expected: |-
            Файл журнала повреждён, начинаю новый
            Записей: 1
            Всего: 450 руб.
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t6
          kind: io
          title: "Граничный случай: пробелы и ноль"
          edge: true
          stdin: "   \n  кафе  \n0\n 250 \n"
          expected: |-
            Категория не может быть пустой
            Сумма должна быть больше нуля
            Записей: 3
            Всего: 1750 руб.
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t12
          kind: io
          title: "Граничный случай: два неверных ответа подряд"
          edge: true
          stdin: "\n   \nкафе\n0\n-5\n200\n"
          expected: |-
            Категория не может быть пустой
            Категория не может быть пустой
            Сумма должна быть больше нуля
            Сумма должна быть больше нуля
            Записей: 3
            Всего: 1700 руб.
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t13
          kind: io
          title: "Граничный случай: дробная сумма"
          edge: true
          stdin: "кафе\n12.5\n450\n"
          expected: |-
            Нужна сумма целым числом, например 350
            Записей: 3
            Всего: 1950 руб.
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: t7
          kind: assert
          title: Журнал сохранён целиком
          example: true
          stdin: "кафе\n450\n"
          code: |
            import json
            import os

            assert os.path.exists("expenses.json")
            with open("expenses.json", encoding="utf-8") as f:
                text = f.read()
            try:
                data = json.loads(text)
            except ValueError:
                data = None
            assert data == [
                {"категория": "продукты", "сумма": 1200},
                {"категория": "транспорт", "сумма": 300},
                {"категория": "кафе", "сумма": 450},
            ]
          message: >-
            После ввода «кафе» и «450» в `expenses.json` лежит весь журнал: две старые записи и
            новая в конце.
        - id: t8
          kind: assert
          title: Сумма сохранена числом
          stdin: "кафе\n450\n"
          code: |
            import json

            try:
                with open("expenses.json", encoding="utf-8") as f:
                    data = json.load(f)
            except (OSError, ValueError):
                data = None
            assert isinstance(data, list) and len(data) > 0 and isinstance(data[-1], dict)
            assert type(data[-1].get("сумма")) is int
          message: >-
            В записи сумма хранится числом — `450`, а не текстом `"450"`: превращай ответ через
            `int()` и сохраняй результат.
        - id: t9
          kind: assert
          title: Старые записи на месте
          stdin: "кафе\n450\n"
          code: |
            import json

            try:
                with open("expenses.json", encoding="utf-8") as f:
                    data = json.load(f)
            except (OSError, ValueError):
                data = None
            assert isinstance(data, list)
            assert data[:2] == [
                {"категория": "продукты", "сумма": 1200},
                {"категория": "транспорт", "сумма": 300},
            ]
          message: >-
            Две старые записи журнала должны остаться в файле: сохраняй весь список, а не только
            новую запись.
        - id: t10
          kind: assert
          title: Русские буквы в файле — как есть
          stdin: "кафе\n450\n"
          code: |
            import os

            assert os.path.exists("expenses.json")
            with open("expenses.json", encoding="utf-8") as f:
                text = f.read()
            assert "\\u" not in text
          message: >-
            В файле журнала русские буквы записаны как есть, без кодов вида `\u043a`: у
            `json.dump` должен быть аргумент `ensure_ascii=False`.
        - id: t11
          kind: assert
          title: Новый журнал создан
          files:
            expenses.json: null
          stdin: "аптека\n450\n"
          code: |
            import json

            try:
                with open("expenses.json", encoding="utf-8") as f:
                    data = json.load(f)
            except (OSError, ValueError):
                data = None
            assert data == [{"категория": "аптека", "сумма": 450}]
          message: >-
            Если журнала не было, программа создаёт `expenses.json` с одной новой записью.
        - id: t-cat
          kind: assert
          title: Категория без пробелов и не пустая
          stdin: "\n  кино  \n500\n"
          code: |
            import json

            try:
                with open("expenses.json", encoding="utf-8") as f:
                    data = json.load(f)
            except (OSError, ValueError):
                data = None
            assert isinstance(data, list) and len(data) > 0
            assert data[-1] == {"категория": "кино", "сумма": 500}
          message: >-
            После ввода пустой строки, «  кино  » и «500» последняя запись журнала —
            `{"категория": "кино", "сумма": 500}`: пустую категорию программа не принимает, а
            пробелы по краям убирает.
        - id: t-except
          kind: assert
          title: Ловятся конкретные исключения
          stdin: "кафе\n450\n"
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            for node in ast.walk(ast.parse(source)):
                if isinstance(node, ast.ExceptHandler):
                    assert node.type is not None
                    assert not (isinstance(node.type, ast.Name) and node.type.id in ("Exception", "BaseException"))
          message: >-
            Здесь ловится «всё подряд»: `except` без типа или `except Exception`. Укажи
            конкретный тип — например, `ValueError`, `FileNotFoundError` или `json.JSONDecodeError`.
        - id: t-enc
          kind: assert
          title: Кодировка указана
          stdin: "кафе\n450\n"
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            calls = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Call)
                     and (getattr(n.func, "id", None) in names or getattr(n.func, "attr", None) in names)]


            def has_encoding(call):
                if any(k.arg == "encoding" for k in call.keywords):
                    return True
                name = getattr(call.func, "id", None) or call.func.attr
                # Кодировка по позиции: open(file, mode, buffering, encoding),
                # Path.open(mode, buffering, encoding), read_text(encoding), write_text(data, encoding)
                position = {"open": 3 if isinstance(call.func, ast.Attribute) else 4, "read_text": 1, "write_text": 2}[name]
                return len(call.args) >= position


            assert all(has_encoding(c) for c in calls)
          message: >-
            В одном из `open()` (или `read_text`/`write_text`) не указана кодировка. Добавь
            `encoding="utf-8"` — иначе программа зависит от настроек компьютера: на Windows со
            старым Python (до 3.15) русский текст превратится в кракозябры.
      criteria:
        - Файла нет — журнал молча начинается с пустого списка; файл пустой или испорчен — сообщение и пустой список.
        - Категория без пробелов по краям и не пустая, сумма — целое число больше нуля; на неверный ответ программа объясняет, что не так, и спрашивает снова.
        - Новая запись добавляется в конец, и в `expenses.json` сохраняется весь журнал — русскими буквами, сумма числом.
        - Итог — две строки точно как в примере.
        - Ловятся только конкретные исключения, у каждого `open()` указана кодировка.
      hints:
        - >-
          Разложи программу на части, как в шаге «План: дневник чтения», и пиши их по одной:
          загрузка, два вопроса, добавление, сохранение, итог. После каждой части нажимай
          «Запустить» с разным вводом и заглядывай в «Файлы после запуска». Какие части удобно
          сделать отдельными функциями?
