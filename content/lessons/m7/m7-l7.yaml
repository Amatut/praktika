        - code: |
            import json


            def load(path):
                try:
                    with open(path, "r", encoding="utf-8") as f:
                        data = json.load(f)
                except FileNotFoundError:
                    data = []
                except json.decoder.JSONDecodeError:
                    print("Файл журнала повреждён, начинаю новый")
                    data = []
                return data


            def ask_amount():
                while True:
                    try:
                        amount = int(input("Сумма: "))
                        if amount <= 0:
                            print("Сумма должна быть больше нуля")
                        else:
                            return amount
                    except ValueError:
                        print("Нужна сумма целым числом, например 350")


            def ask_category():
                category = input("Категория: ").strip()
                while category == "":
                    print("Категория не может быть пустой")
                    category = input("Категория: ").strip()
                return category


            def save(path, data):
                with open(path, "w", encoding="utf-8") as f:
                    json.dump(data, f, ensure_ascii=False, indent=2)


            def main():
                expenses = load("expenses.json")
                expenses.append({"категория": ask_category(), "сумма": ask_amount()})
                save("expenses.json", expenses)
                total = 0
                for e in expenses:
                    total += e["сумма"]
                print("Записей:", len(expenses))
                print("Всего:", total, "руб.")
                print()


            main()
          note: >-
            main(), проверка «больше нуля» внутри try, except json.decoder.JSONDecodeError,
            while по условию для категории, return из цикла, пустой print() в конце.
