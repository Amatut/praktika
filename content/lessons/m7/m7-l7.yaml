        - |-
          Каркас:

          ```text
          def load_expenses(path):
              try: открыть файл, вернуть json.load(f)
              except FileNotFoundError: вернуть []
              except json.JSONDecodeError: сообщение, вернуть []

          def ask_category():
              while True: input → strip → пустая? сообщение, continue → return

          def ask_amount():
              while True: input → try int(…) → except ValueError: сообщение, continue
                          сумма <= 0? сообщение, continue → return

          def save_expenses(path, expenses):
              открыть в режиме "w" с encoding, json.dump(…, ensure_ascii=False, indent=2)

          expenses = load_expenses("expenses.json")
          спросить категорию и сумму, добавить словарь в expenses, сохранить
          сложить суммы в цикле, напечатать «Записей: …» и «Всего: … руб.»
          ```
      solution:
        code: |
          import json

          FILE_NAME = "expenses.json"


          def load_expenses(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except FileNotFoundError:
                  return []
              except json.JSONDecodeError:
                  print("Файл журнала повреждён, начинаю новый")
                  return []


          def ask_category():
              while True:
                  category = input("Категория: ").strip()
                  if category == "":
                      print("Категория не может быть пустой")
                      continue
                  return category


          def ask_amount():
              while True:
                  text = input("Сумма, руб.: ")
                  try:
                      amount = int(text)
                  except ValueError:
                      print("Нужна сумма целым числом, например 350")
                      continue
                  if amount <= 0:
                      print("Сумма должна быть больше нуля")
                      continue
                  return amount


          def save_expenses(path, expenses):
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(expenses, f, ensure_ascii=False, indent=2)


          expenses = load_expenses(FILE_NAME)
          category = ask_category()
          amount = ask_amount()
          expenses.append({"категория": category, "сумма": amount})
          save_expenses(FILE_NAME, expenses)

          total = 0
          for record in expenses:
              total += record["сумма"]
          print(f"Записей: {len(expenses)}")
          print(f"Всего: {total} руб.")
        explanation: >-
          Каждая часть — своя функция, и её можно проверить отдельно. Загрузка ловит два разных
          исключения: нет файла — это первый запуск, поэтому молча возвращается пустой список, а
          испорченный или пустой файл — поломка, о ней сообщается. Вопросы крутятся в
          `while True`, пока ответ не пройдёт все проверки: `continue` возвращает к вопросу, а
          `return` выходит и из цикла, и из функции. Запись добавляется в загруженный список,
          и в файл уходит весь журнал: режим `"w"` стирает старое, но старые записи уже в
          списке. `ensure_ascii=False` оставляет русские буквы читаемыми.
