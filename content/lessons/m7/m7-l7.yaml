            def load_expenses(path):
                try:
                    with open(path, encoding="utf-8") as f:
                        return json.load(f)
                except FileNotFoundError:
                    return []
                except json.JSONDecodeError:
                    print("Файл журнала повреждён, начинаю новый")
                    return []


            def ask_category():
                while True:
                    category = input("Категория: ").strip()
                    if category == "":
                        print("Категория не может быть пустой")
                        continue
                    return category


            def ask_amount():
                while True:
                    try:
                        amount = int(input("Сумма: "))
                    except ValueError:
                        print("Нужна сумма целым числом, например 350")
                        continue
                    if amount <= 0:
                        print("Сумма должна быть больше нуля")
                        continue
                    return amount


            expenses = load_expenses("expense.json")
            category = ask_category()
            amount = ask_amount()
            expenses.append({"категория": category, "сумма": amount})
            with open("expenses.json", "w", encoding="utf-8") as f:
                json.dump(expenses, f, ensure_ascii=False, indent=2)
            total = 0
            for record in expenses:
                total += record["сумма"]
            print(f"Записей: {len(expenses)}")
            print(f"Всего: {total} руб.")
          note: Опечатка в имени при загрузке, FileNotFoundError молча ловится — журнал не загружен.
          expectMistake: not-loaded
