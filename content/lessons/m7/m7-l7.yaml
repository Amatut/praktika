      mistakes:
        - id: get-default
          when:
            errorType: KeyError
            errorIncludes: продукты
          why: >-
            На первой же записи программа упала с KeyError: `totals[категория] += …` сначала
            читает старое значение, а когда категория встречается впервые, её в словаре ещё нет.
          try: >-
            Бери старое значение с запасным нулём — `totals.get(категория, 0)` — или сначала
            проверь, есть ли категория в словаре (урок 4.4).
          verify: «Пример 1» не должен падать с KeyError.
        - id: get-no-default
          when:
            errorType: TypeError
            errorIncludes: NoneType
            codeRegex: '\.get\(\s*[^,()]+\)'
          why: >-
            Когда категория встречается впервые, `totals.get(категория)` возвращает `None` —
            «ничего», а к `None` нельзя прибавить число.
          try: "Дай `get` запасное значение вторым аргументом: `totals.get(категория, 0)` (урок 4.4)."
          verify: «Пример 1» не должен падать.
        - id: writerow-list
          when:
            errorIncludes: writerow
          why: >-
            `writerow` принимает одно значение — список всех ячеек строки. Если передать категорию
            и сумму через запятую как два отдельных аргумента, получится TypeError.
          try: >-
            Оберни ячейки в квадратные скобки — один список на строку таблицы, и для заголовка
            тоже.
          verify: «Пример 1» не должен падать с TypeError.
        - id: overwrote-source
          when:
            failedTest: t-src
            outputIncludes: "Категорий в отчёте: 3"
          why: >-
            После запуска `expenses.json` изменился: программа записала в него, а не в новый файл.
            Исходные данные портить нельзя — отчёт всегда пишут в отдельный файл.
          try: >-
            Проверь имя в `open()` с режимом `"w"`: там должен быть `report.csv`. Журнал
            открывай только для чтения.
          verify: Проверка «Журнал не изменился» должна пройти.
        - id: report-append
          when:
            failedTest: t-old
            outputIncludes: "Категорий в отчёте: 3"
            codeRegex: 'open\([^)\n]*["'']a["'']'
          where: '`open()`, которым записывается `report.csv`'
          why: >-
            Отчёт открыт в режиме `"a"` — он дописывает в конец. В этой проверке в папке уже лежал
            старый `report.csv`, и новый отчёт дописался после его строк. На компьютере так будет
            при каждом запуске: заголовки и строки отчётов станут копиться в одном файле.
          try: >-
            Отчёт каждый раз пишется целиком, поэтому открывай `report.csv` в режиме `"w"`: он
            стирает старое содержимое (урок 7.1).
          verify: Проверка «Старый отчёт заменяется новым» должна пройти.
        - id: replaced-not-added
          when:
            outputIncludes: "продукты: 800"
          why: >-
            У продуктов 800 вместо 2000: вторая запись о продуктах заменила первую. Присваивание
            кладёт в словарь новое значение, а нужно прибавить сумму к старому.
          try: Новое значение — это старое (или 0, если категории ещё нет) плюс сумма записи.
          verify: "В «Примере 1» должно получиться «продукты: 2000»."
        - id: count-records
          when:
            outputIncludes: "Категорий в отчёте: 4"
          why: >-
            Посчитаны записи журнала, а не категории: в журнале четыре записи, но категорий только
            три — продукты встречаются дважды.
          try: Число категорий — это число ключей в словаре с суммами, а не длина списка записей.
          verify: "В «Примере 1» последняя строка должна стать «Категорий в отчёте: 3»."
        - id: header-as-string
          when:
            failedTest: t2
            codeRegex: 'writerow\(\s*f?["'']'
          why: >-
            `writerow` получил одну строку, а не список ячеек. Строку csv перебирает по буквам, и
            каждая буква попадает в свою ячейку: `к,а,т,е,г,о,р,и,я,…`. Запятую внутри строки csv
            разделителем не считает.
          try: >-
            Передавай в `writerow` список: `writer.writerow(["категория", "сумма"])` — две
            ячейки, два элемента.
          verify: "Проверка «Пример 2: файл report.csv» должна пройти."
        - id: no-header
          when:
            failedTest: t4
            outputIncludes: "Категорий в отчёте: 3"
            codeIncludes: report.csv
            codeRegex: '(?<![\s\S])(?![\s\S]*(writeheader\s*\(|writerow\(\s*\[\s*["'']категория))'
          why: >-
            В `report.csv` нет строки заголовка: первой идёт сразу строка с данными, а для пустого
            журнала файл совсем пустой. Без заголовка непонятно, что лежит в столбцах.
          try: >-
            Сразу после создания `csv.writer` запиши заголовок — строку со значениями
            `"категория"` и `"сумма"`, — а потом строки отчёта. У `csv.DictWriter` для этого есть
            `writeheader()`.
          verify: Проверки «файл report.csv» и «в отчёте только заголовок» должны пройти.
        - id: manual-join
          when:
            failedTest: t6
            outputIncludes: "Категорий в отчёте: 2"
            codeRegex: '(?<![\s\S])(?![\s\S]*csv\.writer)'
          why: >-
            Строки CSV собраны вручную, через запятую. Для «кино, театр» получилось три значения
            вместо двух: запятая внутри названия стала разделителем столбцов.
          try: >-
            Пиши строки через `csv.writer` и `writerow([…, …])` — он сам возьмёт значение с
            запятой в кавычки (урок 7.5).
          verify: Проверка «Запятая в категории — одно значение» должна пройти.
        - id: no-newline-arg
          when:
            failedTest: t-newline
            outputIncludes: "Категорий в отчёте: 3"
          why: >-
            Файл для CSV открыт без `newline=""`. В тренажёре разницы не видно, но на Windows
            между строками отчёта появятся пустые строки.
          try: Добавь в `open()` для `report.csv` аргумент `newline=""` (урок 7.5).
          verify: Проверка «Файл для CSV открыт с newline=""» должна пройти.
        - id: no-encoding
          when:
            failedTest: t-enc
            outputIncludes: "Категорий в отчёте: 3"
          why: >-
            В одном из `open()` не указана кодировка. В тренажёре это незаметно, но тогда
            программа зависит от настроек компьютера: на русской Windows со старым Python (до
            3.15) русские категории прочитаются или запишутся кракозябрами.
          try: >-
            Добавь `encoding="utf-8"` в каждый `open()` — и для журнала, и для отчёта. Если
            читаешь через `read_text`, ему кодировка нужна тоже.
          verify: Проверка «Кодировка указана» должна пройти.
      afterPass: >-
        Отчёт готов: JSON удобен программе, а CSV — таблицам. `report.csv` откроется в Google
        Таблицах, а в Excel — через «Данные → Из текстового/CSV-файла» с кодировкой UTF-8 и
        разделителем-запятой: двойным щелчком русский Excel может склеить столбцы и испортить
        буквы (урок 7.5). Одно улучшение: допиши в отчёт последнюю строку `итого` с общей суммой
        всех расходов.
      skills: [files-json, dicts]
      noHintsBeforeAttempt: true

  - id: on-computer
    type: checklist
    title: Журнал на компьютере
    body: >-
      По желанию, можно в другой день. На компьютере файлы настоящие: журнал остаётся между
      запусками, и видно то, что тренажёр прячет. Инструкция для Windows; где на macOS и Linux
      иначе, сказано в «Если не получается».
    items:
      - id: folder
        text: >-
          **Сохрани журнал на компьютер.** В учебной папке `python-practice` открой папку `m7` из
          урока 7.2 (если её нет — создай) и сохрани туда свою программу из главного задания под
          именем `journal.py`.
        help: >-
          Скопируй код из редактора тренажёра целиком и вставь в новый файл в IDLE или VS Code.
          Имя — латиницей, с расширением `.py`.
      - id: run-twice
        text: >-
          **Запусти дважды.** Открой терминал в папке `m7`, выполни `python journal.py`, введи
          категорию и сумму. Запусти ещё раз: теперь «Записей» на одну больше — на компьютере
          файл остаётся между запусками, а в тренажёре каждый запуск начинается с чистой папки.
        help: >-
          На macOS и Linux команда — `python3 journal.py`. Как открыть терминал в папке — в уроке
          0.4. Если записей столько же, проверь, в какой папке появился `expenses.json`: возможно,
          терминал открыт не в `m7` (об этом последний пункт). Если у тебя работает только `py`,
          пиши `py journal.py` — и так же в остальных пунктах.
      - id: open-file
        text: >-
          **Загляни в файл.** Открой `expenses.json` в Блокноте или VS Code: русские буквы
          читаются, каждая запись — с отступами.
        help: >-
          Видишь `\u0430` вместо букв — в `json.dump` не хватает `ensure_ascii=False`. Всё в одну
          строку — не хватает `indent=2`.
      - id: damage-copy
        text: >-
          **Испорти журнал, но сначала сделай копию.** Скопируй журнал в файл `expenses_backup.json`.
          В `expenses.json` сотри последнюю `]`, сохрани и запусти программу: она сообщит, что
          журнал повреждён, и начнёт новый. Затем удали `expenses.json` и переименуй
          `expenses_backup.json` обратно в `expenses.json`.
        help: >-
          Копия в проводнике — Ctrl+C и Ctrl+V, потом переименование. Заметь: после запуска
          старые записи пропали — программа записала поверх испорченного файла новый журнал.
          Поэтому эксперименты — только на копиях.
      - id: encoding
        text: >-
          **Проверь кодировку (Windows).** Снова сделай копию журнала — `expenses_backup.json`.
          Убери `encoding="utf-8"` из `open()`, которым журнал читается, и запусти командой
          `python -X utf8=0 journal.py`. Буквы из файла прочитаются кракозябрами: ключи в файле
          перестанут совпадать с ключами в программе, и она упадёт — например, с
          `KeyError: 'сумма'`. Верни `encoding` на место и восстанови журнал из копии, как в
          прошлом пункте.
        help: >-
          Ключ `-X utf8=0` выключает режим UTF-8, и Python читает файлы в кодировке Windows — до
          Python 3.15 так было по умолчанию. С Python 3.15 UTF-8 — кодировка по умолчанию и на
          Windows, поэтому без ключа ошибки не будет. `encoding` всё равно пишем: программу
          запустят и на старом Python, и там, где кодировка другая, — без него она «работает у
          автора и ломается у других». Копия нужна, потому что программа может успеть сохранить
          журнал с кракозябрами до ошибки — загляни в `expenses.json` и проверь. На macOS и Linux
          ошибки не будет и с ключом: там UTF-8 — кодировка системы.
      - id: other-folder
        text: >-
          **Запусти из другой папки.** В терминале поднимись на папку выше — `cd ..` — и запусти
          `python m7\journal.py`. Журнал начнётся заново: `expenses.json` создастся в текущей
          папке `python-practice`, а не рядом с программой. Исправь путь, как в уроке 7.2:
          добавь `from pathlib import Path` и везде вместо `"expenses.json"` пиши
          `Path(__file__).parent / "expenses.json"`. Запусти снова из обеих папок — журнал один и
          тот же.
        help: >-
          На macOS и Linux — `python3 m7/journal.py`. Лишний `expenses.json` в `python-practice`
          после проверки можно удалить.
    coach: >-
      Этот шаг не проверяется автоматически — отмечай пункты сам. Его можно пройти в другой
      день: задания в тренажёре от него не зависят.

  - id: recap
    type: recap
    title: Итоги и что повторить
    points:
      - "Главное задание получилось без подсказок — модуль 7 твой, можно браться за проект «Список задач с сохранением в JSON». Если получилось и усложнение, ты умеешь превращать данные программы в таблицу для людей."
      - "Программа падала на отсутствующем, пустом или испорченном файле — повтори урок 7.3 и шаблон «загрузить или начать заново» из урока 7.6."
      - "Программа не переспрашивала или переспрашивала только один раз, падала на «триста», принимала -50, 0 или 12.5 — повтори урок 7.4."
      - "Пропадали старые записи, в файле появлялись `\\u0430`, сумма сохранялась текстом — повтори режимы в уроке 7.1 и сохранение в 7.6; трудности с CSV-отчётом — урок 7.5, с путями на компьютере — урок 7.2."
    question: Какие исключения ловит твой журнал, почему именно их и почему не стоит писать просто `except:`?
    answer: >-
      FileNotFoundError — первый запуск, журнала ещё нет: молча начинаем с пустого списка.
      json.JSONDecodeError — файл пустой или испорчен: сообщаем человеку и начинаем новый журнал.
      ValueError — сумма не целое число: объясняем, что не так, и спрашиваем снова. Голый
      `except:` поймал бы и ошибки в самом коде — например, опечатку в имени переменной, — и
      программа молча делала бы не то, а причину было бы не найти.
