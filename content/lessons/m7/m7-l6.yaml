      mistakes:
        - id: wrong-mode
          when:
            errorType: UnsupportedOperation
          where: Режим в open() и то, что дальше делают с файлом
          why: >-
            Файл открыт в одном режиме, а с ним делают другое. Без режима `open` открывает файл на
            чтение, и писать в него нельзя (`not writable`), а из файла, открытого с `"w"`, нельзя
            читать (`not readable`). Это ошибка в коде, а не ограничение тренажёра: на компьютере
            будет то же самое.
          try: >-
            Загружай список через `open` без режима, а сохраняй через
            `open("visited.json", "w", encoding="utf-8")` — это два разных блока `with`.
          verify: 'Тест «Новый город» должен напечатать «Новый город!» и «Городов: 3».'
        - id: set-in-json
          when:
            errorIncludes: not JSON serializable
          where: Строка с json.dump
          why: >-
            В JSON нет множеств, поэтому `json.dump` падает с TypeError. К этому моменту режим
            `"w"` уже очистил файл — на компьютере весь список городов пропал бы. К тому же у
            множества нет порядка, а новый город должен встать последним.
          try: >-
            Храни города в списке, как они пришли из файла: проверка `city in cities` работает и
            для списка, а добавляет в конец `append`.
          verify: Тест «Новый город» должен напечатать «Новый город!» без TypeError.
        - id: append-returns-none
          when:
            errorIncludes: NoneType
            codeRegex: '=\s*\w+\.append\('
          where: Строка с append
          why: >-
            `append` меняет список на месте и возвращает None. Запись `cities = cities.append(city)`
            кладёт в `cities` None: в файл попадает `null`, а `len(None)` ломает программу.
          try: Пиши просто `cities.append(city)` — без `cities =`.
          verify: 'Тест «Новый город» должен напечатать «Новый город!» и «Городов: 3».'
        - id: open-outside-try
          when:
            errorType: FileNotFoundError
            codeRegex: 'except\s+\(?[\w.,\s]*FileNotFoundError'
          where: Строка с with open(…) на чтение
          why: >-
            `except FileNotFoundError` у тебя есть, но `open` стоит вне `try`. `try` защищает только
            строки внутри своего блока (урок 7.3), а FileNotFoundError выбрасывает именно `open`.
          try: Перенеси строку `with open("visited.json", …)` внутрь `try`.
          verify: 'Тест «Файла ещё нет» должен напечатать «Новый город!» и «Городов: 1».'
        - id: no-missing-file
          when:
            errorType: FileNotFoundError
          why: >-
            Когда файла `visited.json` в рабочей папке ещё нет, `open` на чтение выбрасывает
            FileNotFoundError. Для этой программы это нормальный первый запуск: список просто
            пустой.
          try: >-
            Оберни загрузку в `try` и добавь `except FileNotFoundError:` со значением
            `cities = []`.
          verify: 'Тест «Файла ещё нет» должен напечатать «Новый город!» и «Городов: 1».'
        - id: wiped-before-load
          when:
            errorType: JSONDecodeError
            codeRegex: 'open\([^)]*["'']w["''][^)]*\)[\s\S]*json\.load\('
          why: >-
            Во всех тестах `visited.json` либо в порядке, либо его нет — а программа всё равно
            нашла его пустым. Так бывает, если файл открыт в режиме `"w"` раньше, чем прочитан:
            `"w"` стирает содержимое в момент открытия (урок 7.1). На компьютере так пропал бы весь
            список городов.
          try: >-
            Сначала загрузи список (чтение, без режима `"w"`), потом добавь город, и только потом
            открой файл на запись — один раз, в ветке нового города.
          verify: 'Тест «Город уже в списке» должен напечатать «Уже был здесь» и «Городов: 2».'
        - id: loads-by-name
          when:
            errorType: JSONDecodeError
            codeRegex: 'json\.loads\(\s*["'']'
          where: Строка с json.loads
          why: >-
            `json.loads` (с буквой s) разбирает сам JSON-текст, а получил имя файла. Строка
            «visited.json» — не JSON, отсюда JSONDecodeError, хотя с файлом всё в порядке.
          try: >-
            Открой файл и передай его в `json.load(f)` — без s, внутри `try`, как в шаблоне
            «загрузить или начать заново».
          verify: 'Тест «Город уже в списке» должен напечатать «Уже был здесь» и «Городов: 2».'
        - id: read-then-load
          when:
            errorType: JSONDecodeError
            codeRegex: '\.read\(\)[\s\S]*json\.load\('
          where: Строки с f.read() и json.load(f)
          why: >-
            `f.read()` уже прочитал файл до конца, и `json.load(f)` достаётся пустота — как будто
            файл пустой. Отсюда JSONDecodeError, хотя с файлом всё в порядке.
          try: 'Оставь что-то одно: `json.load(f)` или `json.loads(f.read())`.'
          verify: 'Тест «Город уже в списке» должен напечатать «Уже был здесь» и «Городов: 2».'
        - id: case
          when:
            failedTest: t2
            outputIncludes: "Городов:"
            codeRegex: '\.(?:lower|upper|casefold)\('
          where: Строка с input()
          why: >-
            Ты меняешь регистр введённого названия, а в файле «Казань» записана с заглавной буквы.
            «казань» и «Казань» — разные строки, поэтому проверка `in` не находит город.
          try: Сравнивай название так, как его ввели, — только убери пробелы по краям через `strip()`.
          verify: 'Тест «Город уже в списке» должен напечатать «Уже был здесь» и «Городов: 2».'
        - id: duplicate
          when:
            failedTest: t2
            outputEquals: "Уже был здесь\nГородов: 3"
          why: >-
            «Казань» уже есть в списке, но программа всё равно добавила её — городов стало 3
            вместо 2. Добавление и сохранение выполняются при любом ответе.
          try: >-
            Перенеси `append` и сохранение внутрь ветки `else` — они нужны только для нового
            города.
          verify: 'Тест «Город уже в списке» должен напечатать «Уже был здесь» и «Городов: 2».'
        - id: no-strip
          when:
            failedTest: t4
            outputIncludes: "Новый город!"
            codeRegex: '(?<![\s\S])(?![\s\S]*\.strip\()'
          why: >-
            Во вводе «  Суздаль » пробелы по краям. Строка с пробелами не равна «Суздаль», поэтому
            проверка `in` её не находит, и город добавляется второй раз.
          try: Убери пробелы сразу после ввода — `input().strip()`.
          verify: 'Граничный случай с пробелами должен напечатать «Уже был здесь».'
        - id: append-mode
          when:
            failedTest: t6
            outputIncludes: "Городов:"
            codeRegex: 'open\([^)]*["'']a["'']'
          where: open(…, "a", …) при сохранении
          why: >-
            Режим `"a"` дописывает новый массив в конец файла, и в нём оказываются два массива
            подряд: `[…][…]`. Это уже не JSON — при следующей загрузке будет JSONDecodeError.
            JSON-файл — одна структура, её нельзя дописать по кусочку.
          try: >-
            Сохраняй весь список заново в режиме `"w"`: загрузил → добавил в список → записал
            целиком.
          verify: Открой visited.json в «Файлах после запуска» — там должен быть один список из трёх городов.
        - id: order
          when:
            failedTest: t9
            outputIncludes: "Городов:"
            codeRegex: 'sorted\(|\.sort\(|\.insert\(\s*0|\bset\('
          where: Список, который сохраняется в visited.json
          why: >-
            Все города в файле на месте, но порядок другой. У множества нет порядка, а `sorted()` и
            `sort()` расставляют города по алфавиту. По условию старые города остаются как были,
            новый — последним.
          try: >-
            Храни города в списке — так, как они пришли из файла, — и добавляй новый через
            `append`. Проверка `city in cities` работает и для списка.
          verify: 'Проверка «Порядок городов сохраняется» должна стать зелёной.'
        - id: file-content
          when:
            failedTest: t6
            outputIncludes: "Городов:"
          why: >-
            На экране всё верно, но в `visited.json` после запуска не тот список: не все города, не в
            том порядке или файл не сохранён вовсе. При следующем запуске старые города пропадут
            или новый не появится.
          try: >-
            Нужен весь список `cities` после `append`, в том же порядке, что пришёл из файла.
            Передай его в `json.dump` и проверь, что сохранение стоит в ветке нового города.
          verify: 'В «Файлах после запуска» visited.json должен содержать «Казань», «Суздаль» и «Псков».'
        - id: ascii-escapes
          when:
            failedTest: t7
            outputIncludes: "Городов:"
          why: >-
            По умолчанию `json.dump` заменяет каждую русскую букву кодом вида `\u041f`. Программа
            такой файл прочитает, а человек — нет.
          try: Добавь в `json.dump` параметр `ensure_ascii=False`.
          verify: В «Файлах после запуска» названия городов должны читаться.
        - id: no-encoding
          when:
            failedTest: t-enc
            outputIncludes: "Городов:"
          why: >-
            В одном из `open()` (или `read_text()`/`write_text()`) нет `encoding`. В тренажёре всё
            работает, но на русской Windows Python 3.14 и раньше без подсказки пишет и читает файлы в другой
            кодировке, и названия городов превратятся в кракозябры или в ошибку UnicodeDecodeError.
          try: >-
            Добавь `encoding="utf-8"` в каждый `open()` (и в `read_text()`/`write_text()`, если они
            есть) — и при чтении, и при записи.
          verify: 'Проверка «Кодировка указана» должна стать зелёной.'
        - id: bare-except
          when:
            failedTest: t-except
            outputIncludes: "Городов:"
          why: >-
            `except:` без типа (или `except Exception`) ловит всё подряд — и опечатку в коде тоже.
            Ошибёшься в имени функции — программа молча начнёт с пустого списка и перезапишет
            файл, а настоящую причину будет не найти.
          try: Назови тип явно — `except FileNotFoundError:`.
          verify: 'Проверка «Ловятся конкретные исключения» должна стать зелёной.'
      afterPass: >-
        Программа собрала весь урок: загружает список или начинает с пустого, меняет его и сохраняет
        целиком. Улучшение: сравнивай города без учёта регистра, чтобы «казань» и «Казань» считались
        одним городом.
      skills: [files-json, exceptions, lists]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "В JSON можно сохранить словари, списки, строки, числа, True/False и None (в файле — `true/false/null`). `json.dump(данные, f, ensure_ascii=False, indent=2)` записывает, `json.load(f)` читает."
      - "Ключи объекта в JSON — всегда строки: `{1: 120}` вернётся как `{\"1\": 120}`. Кортеж вернётся списком, а множество не запишется вовсе — превращай его в список до открытия файла. У множества нет порядка: если порядок важен, храни данные списком."
      - "Загрузка «или начать заново»: `except FileNotFoundError` — первый запуск, молча берём пустые данные; `except json.JSONDecodeError` — файл повреждён или пуст, сообщаем человеку."
      - "JSON-файл не дописывают: загрузи, измени и запиши целиком в режиме `\"w\"`. Для одинаковых строк-записей удобнее CSV, для вложенных данных — JSON."
    question: >-
      Чем для программы отличаются «файла нет» и «файл повреждён» и почему их ловят разными
      except?
    answer: >-
      Файла нет — это обычный первый запуск: данных ещё не было, можно молча начать с пустого
      списка. Файл повреждён — данные были, но испорчены или потеряны, и человеку нужно об этом
      сказать, чтобы он мог разобраться. Разные беды — разные ответы, поэтому и `except` разные:
      `FileNotFoundError` и `json.JSONDecodeError`. Общий `except` на всё подряд спрятал бы и
      ошибки в самом коде.
