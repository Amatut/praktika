                except json.JSONDecodeError:
                    print("Файл повреждён, начинаю с пустого списка")
                    return {}


            books = load_books("books.json")
            print(f"Книг в списке: {len(books)}")
            for title in books:
                print("-", title)
          note: "Запасное значение {} из теории вместо [] — общий разбор «значение другого типа»."
          expectMistake: null
      mistakes:
        - id: outside-function
          when:
            codeRegex: '^try:[ \t]*\n[ \t]+\w+\s*=\s*load_books\('
            failedTest: t6
          where: Блок try вокруг вызова load_books
          why: >-
            Ошибки ловятся снаружи, а сама функция по-прежнему падает, если файла нет. Там, где
            `load_books` вызовут ещё раз, придётся снова писать тот же try. Задача функции «загрузить
            или начать заново» — спрятать беды с файлом внутри себя.
          try: >-
            Перенеси `try` и оба `except` внутрь `load_books` — вокруг `with open(…)` — и возвращай
            `[]` из `except`. Вызов в основной части программы останется простым.
          verify: 'Проверка «Функция сама справляется с отсутствующим файлом» должна стать зелёной.'
        - id: json-prefix
          when:
            errorIncludes: "'JSONDecodeError' is not defined"
          where: Строка с except JSONDecodeError
          why: >-
            `JSONDecodeError` живёт в модуле `json`, а `import json` даёт доступ к нему только
            через точку — так же, как к `json.load`. Python дошёл до этого `except`, когда файл
            оказался повреждён, и не узнал имя.
          try: Напиши `except json.JSONDecodeError:`.
          verify: В тесте «Файл повреждён» должно появиться сообщение, а не NameError.
        - id: only-missing
          when:
            errorType: JSONDecodeError
          why: >-
            Отсутствующий файл ты уже ловишь, а повреждённый — ещё нет. Когда в файле стёрта
            скобка или он пустой, `json.load` выбрасывает `json.JSONDecodeError`, а не
            FileNotFoundError, и программа падает.
          try: >-
            Добавь второй `except json.JSONDecodeError:` — с сообщением из условия и
            `return []`.
          verify: Тесты «Файл повреждён» и «пустой файл» должны стать зелёными.
        - id: no-try
          when:
            errorType: FileNotFoundError
            codeRegex: '(?<![\s\S])(?![\s\S]*\btry\s*:)'
          where: Функция load_books
          why: >-
            Функция пока не ловит ни одной беды. Файла нет — `open` выбрасывает FileNotFoundError,
            файл повреждён — `json.load` выбрасывает json.JSONDecodeError, и программа падает.
          try: >-
            Оберни `with open(…)` вместе с `json.load` в `try` и добавь по `except` на каждую беду —
            как в теории «Если файла нет или он повреждён».
          verify: 'Тест «Файла нет» должен напечатать «Книг в списке: 0», а «Файл повреждён» — сообщение и «Книг в списке: 0».'
        - id: open-outside-try
          when:
            errorType: FileNotFoundError
            codeRegex: 'except\s+\(?[\w.,\s]*FileNotFoundError'
          where: Строка с with open(…)
          why: >-
            `except FileNotFoundError` у тебя есть, но `open` стоит вне `try`. `try` защищает только
            строки внутри своего блока (урок 7.3), а FileNotFoundError выбрасывает именно `open` —
            ещё до `json.load`.
          try: Перенеси строку `with open(…)` внутрь `try`, чтобы блок охватывал и открытие, и разбор.
          verify: 'Тест «Файла нет» должен напечатать только «Книг в списке: 0».'
        - id: only-damaged
          when:
            errorType: FileNotFoundError
          why: >-
            Когда файла `books.json` в рабочей папке нет, `open` выбрасывает FileNotFoundError ещё
            до `json.load`. Твой `except` ловит только повреждённый файл, поэтому первый запуск
            без файла роняет программу.
          try: Добавь `except FileNotFoundError:` с `return []` — без сообщения.
          verify: 'Тест «Файла нет» должен напечатать только «Книг в списке: 0».'
        - id: no-return-ok
          when:
            errorIncludes: NoneType
            failedTest: t1
          where: Конец блока try в load_books
          why: >-
            Когда файл в порядке, функция загружает список, но не возвращает его: до `return` дело
            не доходит, и функция возвращает None. Дальше `len(None)` ломает программу.
          try: >-
            Верни загруженный список — `return json.load(f)` внутри `with` или `return books` после
            блока `try`.
          verify: 'Тест «Файл в порядке» должен напечатать «Книг в списке: 3» и три книги.'
        - id: no-return
          when:
            errorIncludes: NoneType
          where: Блоки except в load_books
          why: >-
            Ошибка поймана, но функция ничего не вернула — а функция без `return` возвращает None.
            Дальше `len(None)` ломает программу уже в другом месте.
          try: В конце каждого `except` верни пустой список — `return []`.
          verify: 'В тестах «Файла нет» и «Файл повреждён» должно появиться «Книг в списке: 0».'
        - id: message-on-missing
          when:
            failedTest: t2
            outputIncludes: повреждён
          why: >-
            Когда файла нет, программа пишет, что он повреждён. Но это первый запуск: файл ещё не
            успели создать, пугать человека незачем. Для двух разных бед нужны два разных
            `except`.
          try: >-
            Раздели обработку: `except FileNotFoundError:` — просто `return []`,
            `except json.JSONDecodeError:` — сообщение и `return []`.
          verify: 'Тест «Файла нет» должен напечатать только «Книг в списке: 0».'
        - id: yo-letter
          when:
            failedTest: t3
            outputIncludes: "поврежден,"
          where: Сообщение о повреждённом файле
          why: >-
            В сообщении из условия буква ё: «повреждён». Вывод сравнивается посимвольно, и «е»
            вместо «ё» — уже другая строка.
          try: Скопируй строку «Файл повреждён, начинаю с пустого списка» из условия в свой `print`.
          verify: 'Тест «Файл повреждён» должен стать зелёным.'
        - id: bare-except
          when:
            failedTest: t-except
            outputIncludes: "Книг в списке"
          why: >-
            `except:` без типа (или `except Exception`) ловит всё подряд — и опечатку в коде
            тоже. Если ошибёшься в имени переменной, программа молча скажет «файл повреждён», и
            настоящую причину будет не найти.
          try: Назови тип явно — `except json.JSONDecodeError:`.
          verify: 'Проверка «Ловятся конкретные исключения» должна стать зелёной, а тест «Файл повреждён» — остаться зелёным.'
        - id: no-encoding
          when:
            failedTest: t-enc
            outputIncludes: "Книг в списке"
          why: >-
            В `open()` (или в `read_text()`) нет `encoding`. В тренажёре всё работает, но на русской
            Windows Python 3.14 и раньше без подсказки читает файлы в другой кодировке, и названия книг
            превратятся в кракозябры или в ошибку UnicodeDecodeError.
          try: Добавь `encoding="utf-8"` в `open()` (или в `read_text()`).
          verify: 'Проверка «Кодировка указана» должна стать зелёной.'
      afterPass: >-
        Функция переживает и первый запуск, и испорченный файл, а сообщение появляется только
        тогда, когда что-то действительно сломалось. Улучшение: перед тем как начинать с пустого
        списка, можно сохранить копию повреждённого файла — например, в `books_broken.json`, чтобы
        потом восстановить книги вручную.
      skills: [files-json, exceptions, functions]

  - id: csv-or-json
    type: quiz
    title: CSV или JSON?
    question: >-
      Нужно хранить покупателей магазина: имя, телефон и у каждого — список его заказов. Какой
      формат удобнее?
    options:
      - CSV — это же таблица покупателей
      - JSON — у каждого покупателя внутри есть список заказов
      - Всё равно — оба формата хранят что угодно
    correct: 1
    explanation: >-
      Имя и телефон легли бы в столбцы таблицы, а вот список заказов в одну ячейку строки не
      помещается: пришлось бы склеивать заказы в строку и потом разбирать её вручную. В JSON у
      покупателя просто есть ключ `"заказы"` со списком. CSV хорош для одинаковых плоских записей,
      которые хочется открыть в Excel, JSON — для вложенных данных.

  - id: practice-cities
    type: exercise
    title: Практика 3
    exercise:
      id: m7-l6-e3
      kind: write
      title: Посещённые города
      statement: |-
        Программа ведёт список городов, где ты побывал. Список лежит в файле `visited.json` —
        это JSON-массив названий. Файла может ещё не быть: тогда список пустой.

        Программа читает название города (пробелы по краям убери) и:

        - если город уже есть в списке — печатает `Уже был здесь`;
        - если нет — добавляет его **в конец** списка, сохраняет весь список в `visited.json`
          (русские буквы как есть) и печатает `Новый город!`.

        В конце в обоих случаях печатает `Городов: N` — сколько городов в списке теперь.

        Например, в файле `["Казань", "Суздаль"]`, ввод `Псков`:

        ```text
        Новый город!
        Городов: 3
        ```
      input: Одна строка — название города.
      output: "`Уже был здесь` или `Новый город!`, затем `Городов: N`."
      constraints:
        - Если файла нет, программа не падает, а начинает с пустого списка.
        - Порядок городов в файле сохраняется, новый город — последним.
        - Лови конкретное исключение, без голого `except:` и без `except Exception`.
        - Файлы открывай с кодировкой — `encoding="utf-8"` в каждом `open()`.
      files:
        visited.json: |
          [
            "Казань",
            "Суздаль"
          ]
      starterCode: |
        import json

        # 1. Загрузи список из visited.json (файла может не быть)
        # 2. Прочитай город и проверь, есть ли он в списке
        # 3. Новый город — добавь в конец и сохрани весь список
        # 4. Выведи «Городов: N»
      tests:
        - id: t1
          kind: io
          title: Новый город
          example: true
          stdin: "Псков\n"
          expected: |-
            Новый город!
            Городов: 3
        - id: t2
          kind: io
          title: Город уже в списке
          example: true
          stdin: "Казань\n"
          expected: |-
            Уже был здесь
            Городов: 2
        - id: t3
          kind: io
          title: Файла ещё нет
          example: true
          files:
            visited.json: null
          stdin: "Тверь\n"
          expected: |-
            Новый город!
            Городов: 1
        - id: t4
          kind: io
          title: "Граничный случай: пробелы вокруг названия"
          edge: true
          stdin: "  Суздаль \n"
          expected: |-
            Уже был здесь
            Городов: 2
        - id: t5
          kind: io
          title: "Граничный случай: в файле пустой список"
          edge: true
          files:
            visited.json: "[]\n"
          stdin: "Вологда\n"
          expected: |-
            Новый город!
            Городов: 1
        - id: t6
          kind: assert
          title: Файл после добавления
          example: true
          stdin: "Псков\n"
          code: |-
            import json
            import os

            assert os.path.exists("visited.json")
            text = open("visited.json", encoding="utf-8").read()
            try:
                data = json.loads(text)
            except ValueError:
                data = None
            assert data == ["Казань", "Суздаль", "Псков"]
          message: >-
            После ввода «Псков» в visited.json лежит весь список: сначала старые города, последним —
            новый.
        - id: t9
          kind: assert
          title: Порядок городов сохраняется
          stdin: "Псков\n"
          files:
            visited.json: '["Казань", "Суздаль", "Вологда", "Тверь", "Ярославль"]'
          code: |-
            import json
            import os

            assert os.path.exists("visited.json")
            text = open("visited.json", encoding="utf-8").read()
            try:
                data = json.loads(text)
            except ValueError:
                data = None
            assert data == ["Казань", "Суздаль", "Вологда", "Тверь", "Ярославль", "Псков"]
          message: >-
            Когда в файле пять городов, после ввода «Псков» они остаются в visited.json в прежнем
            порядке, а «Псков» встаёт шестым, последним.
        - id: t7
          kind: assert
          title: Русские буквы как есть
          stdin: "Псков\n"
          code: |-
            import os

            assert os.path.exists("visited.json")
            text = open("visited.json", encoding="utf-8").read()
            assert "Псков" in text
          message: >-
            В visited.json названия городов читаются как есть — «Псков», а не коды вида
            \u041f\u0441….
        - id: t8
          kind: assert
          title: "Граничный случай: файл создаётся"
          edge: true
          files:
            visited.json: null
          stdin: "Тверь\n"
          code: |-
            import json
            import os

            assert os.path.exists("visited.json")
            text = open("visited.json", encoding="utf-8").read()
            try:
                data = json.loads(text)
            except ValueError:
                data = None
            assert data == ["Тверь"]
          message: >-
            Если файла не было, программа создаёт visited.json со списком из одного нового города.
        - id: t-except
          kind: assert
          title: Ловятся конкретные исключения
          stdin: "Псков\n"
          code: |-
            import ast

            source = open(__file__, encoding="utf-8").read()
            for node in ast.walk(ast.parse(source)):
                if isinstance(node, ast.ExceptHandler):
                    assert node.type is not None
                    assert not (isinstance(node.type, ast.Name) and node.type.id in ("Exception", "BaseException"))
          message: >-
            Здесь ловится «всё подряд»: except без типа или except Exception. Укажи конкретный
            тип — например, FileNotFoundError.
        - id: t-enc
          kind: assert
          title: Кодировка указана
          stdin: "Псков\n"
          code: |-
            import ast

            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            calls = [
                node for node in ast.walk(ast.parse(source))
                if isinstance(node, ast.Call)
                and (getattr(node.func, "id", None) in names or getattr(node.func, "attr", None) in names)
            ]
            assert all(any(k.arg == "encoding" for k in call.keywords) for call in calls)
          message: >-
            В одном из open() (или read_text/write_text) не указана кодировка. Добавь
            encoding="utf-8" — иначе на Windows со старым Python (до 3.15) русский текст
            превратится в кракозябры.
      criteria:
        - Если файла нет, программа начинает с пустого списка и не падает.
        - Название города очищается от пробелов по краям.
        - Город, который уже есть, не добавляется второй раз.
        - "Новый город добавляется в конец, и весь список сохраняется в `visited.json` с `ensure_ascii=False`."
        - "В конце печатается `Городов: N` с числом городов в списке."
      hints:
        - >-
          Разложи программу на три части: загрузить список (помни, что файла может не быть),
          решить, новый ли город, и если новый — сохранить. Какой шаблон из теории «Если файла нет
          или он повреждён» подходит для первой части?
        - |-
          Проверка «уже есть или новое» на списке покупок:
          ```python
          items = ["хлеб", "молоко"]
          item = " сыр ".strip()
          if item in items:
              print("Уже в списке")
          else:
              items.append(item)
              print("Добавлено")
          ```
          Сохранить после этого нужно весь список `items`, а не только новый элемент.
        - |-
          Каркас:
          ```text
          try:
              открыть visited.json на чтение и cities = json.load(f)
          except FileNotFoundError:
              cities = []
          city = input(...).strip()
          если city in cities → «Уже был здесь»
          иначе → cities.append(city), открыть файл в режиме "w",
                  json.dump(cities, f, ensure_ascii=False, indent=2), «Новый город!»
          print(f"Городов: {…}")
          ```
      solution:
        code: |
          import json

          try:
              with open("visited.json", encoding="utf-8") as f:
                  cities = json.load(f)
          except FileNotFoundError:
              cities = []

          city = input("Город: ").strip()
          if city in cities:
              print("Уже был здесь")
          else:
              cities.append(city)
              with open("visited.json", "w", encoding="utf-8") as f:
                  json.dump(cities, f, ensure_ascii=False, indent=2)
              print("Новый город!")
          print(f"Городов: {len(cities)}")
        explanation: >-
          Сначала программа загружает список или, если файла нет, начинает с пустого — это шаблон
          «загрузить или начать заново». Проверка `in` решает, новый ли город. Новый добавляется в
          конец через `append`, и весь список записывается заново в режиме `"w"`: JSON-файл нельзя
          дописать, его пишут целиком. Если город уже есть, файл можно не трогать.
      altSolutions:
        - code: |
            import json


            def load_cities(path):
                try:
                    with open(path, encoding="utf-8") as f:
                        return json.load(f)
                except FileNotFoundError:
                    return []
                except json.JSONDecodeError:
                    print("Файл повреждён, начинаю с пустого списка")
                    return []


            def save_cities(path, cities):
                with open(path, "w", encoding="utf-8") as f:
                    json.dump(cities, f, ensure_ascii=False, indent=2)


            cities = load_cities("visited.json")
            city = input().strip()
            if city in cities:
                print("Уже был здесь")
            else:
                cities.append(city)
                save_cities("visited.json", cities)
                print("Новый город!")
            print("Городов:", len(cities))
          note: Загрузка и сохранение в функциях, заодно ловится повреждённый файл.
        - code: |
            import json
            from pathlib import Path

            path = Path("visited.json")
            if path.exists():
                cities = json.loads(path.read_text(encoding="utf-8"))
            else:
                cities = []

            city = input().strip()
            if city not in cities:
                cities.append(city)
                path.write_text(json.dumps(cities, ensure_ascii=False, indent=2), encoding="utf-8")
                print("Новый город!")
            else:
                print("Уже был здесь")
            print(f"Городов: {len(cities)}")
          note: pathlib, exists() вместо try, not in.
