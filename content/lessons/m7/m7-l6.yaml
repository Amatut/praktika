id: m7-l6
module: m7
number: "7.6"
title: "JSON: сохраняем структуры данных"
objective: >-
  Сохранять словари и списки в JSON-файл и загружать их обратно — в том числе безопасно, с
  запасным значением, если файла нет или он повреждён.
minutes: [25, 30]
prerequisites: [m7-l5]
skills: [files-json, exceptions]
environment: python

story:
  title: Сохранение для квеста
  fictional: true
  text: >-
    Кирилл — тот самый, что написал «Угадай число», — теперь делает текстовый квест. Друзья
    жаловались: закрыл игру — и всё сначала, рюкзак из пяти предметов приходится собирать заново.
    Сначала Кирилл сохранял прогресс в обычный текстовый файл, строчку на уровень и строчку на
    каждый предмет, но при загрузке запутался, где что. Потом он узнал про JSON: одна команда
    сохраняет весь словарь с именем игрока, уровнем и списком вещей, другая загружает его обратно
    в том же виде. А когда младшая сестра Ася «подправила» уровень в файле сохранения и случайно стёрла
    скобку, игра не упала, а сказала, что сохранение повреждено, и начала новую.

why: >-
  В JSON можно хранить не только таблицы, но и вложенные данные: словари со списками внутри,
  числа, строки, True и False. Например, настройки программы, сохранение игры или список задач,
  у которых есть подзадачи.

usedIn: >-
  Файлы настроек (например, редактор VS Code хранит настройки в JSON), сохранения игр, обмен
  данными между программами и с серверами — к серверам и API вернёмся в модуле 11.

steps:
  - id: json-idea
    type: theory
    title: "JSON: словари и списки в файле"
    body: |-
      В уроке 7.1 ты записывал в файл строки, в уроке 7.5 — таблицу. А как сохранить словарь, внутри
      которого лежит список? Например, сохранение игры: имя игрока, уровень и рюкзак с вещами.
      Можно придумать свой формат — строчка на уровень, строчка на предмет, — но потом придётся
      самому разбирать его обратно. Для этого есть готовый формат.

      **JSON** — текстовый формат для данных. Он выглядит почти как словари и списки Python:

      ```json
      {
        "игрок": "Кира",
        "уровень": 3,
        "инвентарь": ["фонарик", "ключ"],
        "звук": true,
        "питомец": null
      }
      ```

      `{}` — **объект**, в Python он станет словарём. `[]` — **массив**, он станет списком. Отличия
      от Python: строки пишутся только в двойных кавычках, ключи объекта — всегда строки, а вместо
      `True`, `False` и `None` пишут `true`, `false` и `null`. Кортежей в JSON нет: кортеж
      запишется как массив и вернётся списком.

      Разбирать такой текст вручную не нужно: модуль `json` из стандартной библиотеки переводит
      данные в JSON и обратно.

      ```python
      import json

      with open("save.json", "w", encoding="utf-8") as f:
          json.dump(save, f, ensure_ascii=False, indent=2)

      with open("save.json", encoding="utf-8") as f:
          save = json.load(f)
      ```

      - `json.dump(данные, файл)` записывает данные в открытый файл. Порядок важен: сначала *что*,
        потом *куда*.
      - `ensure_ascii=False` — русские буквы как есть. Без него «Кира» превратится в
        `\u041a\u0438\u0440\u0430`: Python это прочитает, а человек — нет.
      - `indent=2` — каждый элемент с новой строки и с отступом в два пробела. Без него всё
        вытянется в одну длинную строку.
      - `json.load(файл)` читает JSON из открытого файла и возвращает то, что в нём лежит, —
        обычно словарь или список.

      У этих функций есть пара с буквой **s** на конце (от *string* — строка): `json.dumps(данные)`
      возвращает JSON-строку, а `json.loads(строка)` превращает такую строку обратно в данные. Они
      пригодятся, когда JSON приходит не из файла, — например, с сервера в модуле 11.
    simpler: >-
      JSON — способ записать словарь или список в файл так, чтобы потом прочитать его обратно
      таким же. `json.dump(данные, f)` кладёт данные в файл, `json.load(f)` достаёт их. Добавляй
      `ensure_ascii=False, indent=2`, чтобы файл мог прочитать и человек.
    coach: >-
      Запомни порядок в `json.dump`: сначала данные, потом файл. Это самая частая путаница.

  - id: save-game
    type: example
    title: Сохранение квеста
    body: >-
      Упрощённое сохранение из истории: программа записывает словарь в файл и сразу читает его
      обратно. После запуска загляни в «Файлы после запуска» — там появится `save.json`.
    code: |-
      import json

      save = {"игрок": "Кира", "уровень": 3, "инвентарь": ["фонарик", "ключ"]}
      with open("save.json", "w", encoding="utf-8") as f:
          json.dump(save, f, ensure_ascii=False, indent=2)

      with open("save.json", encoding="utf-8") as f:
          loaded = json.load(f)
      print(loaded["игрок"], "— уровень", loaded["уровень"])
      print("В рюкзаке:", ", ".join(loaded["инвентарь"]))
    notes:
      - line: 1
        text: Модуль `json` входит в стандартную библиотеку, устанавливать его не нужно.
      - line: 3
        text: Обычный словарь Python, внутри — строка, число и список.
      - line: 4
        text: >-
          Файл открывается на запись, как в уроке 7.1: режим `"w"` и кодировка. Старое содержимое
          файла стирается — сохранение пишется целиком заново.
      - line: 5
        text: >-
          `json.dump` превращает словарь в JSON-текст и записывает его в файл `f`. Сначала данные,
          потом файл.
      - line: 8
        text: >-
          `json.load` читает весь файл и возвращает словарь — с тем же числом и тем же списком
          внутри.
      - line: 9
        text: >-
          `loaded` — обычный словарь: значения достаются по ключу, `loaded["уровень"]` — число 3,
          а не строка «3».
    tryIt: >-
      Убери `ensure_ascii=False` и запусти: программа напечатает то же самое, а в «Файлах после
      запуска» вместо «Кира» появится `\u041a\u0438\u0440\u0430`. Потом верни его и убери
      `indent=2` — файл вытянется в одну строку.
    coach: >-
      Сравни файл `save.json` со словарём в коде: почти одно и то же, только в JSON-тексте.

  - id: keys-become-strings
    type: predict
    title: Что вернулось?
    prompt: >-
      Кирилл хранит рекорды по уровням: ключ — номер уровня, значение — очки. Он переводит словарь
      в JSON-строку и обратно. Как думаешь, что выведет программа?
    code: |-
      import json

      records = {1: 120, 2: 95}
      text = json.dumps(records)
      back = json.loads(text)
      print(text)
      print(back == records)
    options:
      - |-
        {1: 120, 2: 95}
        True
      - |-
        {"1": 120, "2": 95}
        True
      - |-
        {"1": 120, "2": 95}
        False
    answer: |-
      {"1": 120, "2": 95}
      False
    explanation: >-
      В JSON ключи объекта — всегда строки, поэтому `json.dumps` записал `"1"` и `"2"`.
      `json.loads` честно вернул словарь со строковыми ключами `{"1": 120, "2": 95}`. Для Python
      `1` и `"1"` — разные ключи, поэтому словари не равны. Значит, после загрузки `back[1]` даст
      KeyError, а сработает `back["1"]`. Если ключи нужны числами, превращай их сам: `int(key)`.
    coach: >-
      JSON хранит данные почти без потерь. «Почти» — это ключи-числа и кортежи. А множество JSON
      не сохранит вовсе — об этом дальше.

  - id: practice-metronome
    type: exercise
    title: Практика 1
    exercise:
      id: m7-l6-e1
      kind: repeat
      title: Настройки метронома
      statement: |-
        Метроном для занятий музыкой хранит настройки в словаре: темп (ударов в минуту), размер,
        звук щелчка и список упражнений. Словарь уже есть в стартовом коде.

        Напиши программу, которая:

        1. читает новый темп — целое число — и записывает его в словарь;
        2. сохраняет словарь в файл `settings.json` так, чтобы его мог прочитать человек: русские
           буквы как есть и с отступами;
        3. загружает настройки обратно **из файла** и печатает по загруженным данным строку:

        ```text
        Темп: 100, упражнений: 2
        ```

        Если `settings.json` уже лежит в папке со старыми настройками, после запуска в нём должны
        оказаться новые.
      input: Одна строка — новый темп, целое число.
      output: "Одна строка: `Темп: <темп>, упражнений: <сколько упражнений в списке>`."
      constraints:
        - Словарь `settings` в стартовом коде не меняй — меняется только темп.
        - Печатай то, что загрузилось из файла, а не исходный словарь.
        - Файлы открывай с кодировкой — `encoding="utf-8"` в каждом `open()`.
      starterCode: |
        import json

        settings = {"темп": 90, "размер": "3/4", "звук": "дерево", "упражнения": ["гаммы", "арпеджио"]}

        # 1. Прочитай новый темп (целое число) и запиши его в settings
        # 2. Сохрани settings в settings.json: русские буквы как есть, с отступами
        # 3. Загрузи настройки из settings.json и выведи «Темп: …, упражнений: …»
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "100\n"
          expected: "Темп: 100, упражнений: 2"
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "60\n"
          expected: "Темп: 60, упражнений: 2"
        - id: t3
          kind: io
          title: "Граничный случай: пробелы вокруг числа"
          edge: true
          stdin: " 120 \n"
          expected: "Темп: 120, упражнений: 2"
        - id: t9
          kind: io
          title: "Граничный случай: файл настроек уже есть"
          edge: true
          stdin: "100\n"
          files:
            settings.json: |
              {
                "темп": 90,
                "размер": "3/4",
                "звук": "дерево",
                "упражнения": ["гаммы", "арпеджио"]
              }
          expected: "Темп: 100, упражнений: 2"
        - id: t4
          kind: assert
          title: Файл настроек
          example: true
          stdin: "100\n"
          code: |-
            import json
            import os

            assert os.path.exists("settings.json")
            text = open("settings.json", encoding="utf-8").read()
            try:
                data = json.loads(text)
            except ValueError:
                data = None
            assert data == {"темп": 100, "размер": "3/4", "звук": "дерево", "упражнения": ["гаммы", "арпеджио"]}
          message: >-
            После ввода 100 в settings.json лежат все настройки из словаря, а темп в них — новый.
        - id: t5
          kind: assert
          title: Темп — целое число
          stdin: "100\n"
          code: |-
            import json
            import os

            assert os.path.exists("settings.json")
            text = open("settings.json", encoding="utf-8").read()
            try:
                data = json.loads(text)
            except ValueError:
                data = None
            assert isinstance(data, dict) and type(data.get("темп")) is int
          message: >-
            В settings.json темп записан целым числом, а не строкой: в JSON-файле это `100` без
            кавычек.
        - id: t6
          kind: assert
          title: Русские буквы как есть
          stdin: "100\n"
          code: |-
            import os

            assert os.path.exists("settings.json")
            text = open("settings.json", encoding="utf-8").read()
            assert "арпеджио" in text
          message: >-
            В файле settings.json русские слова читаются как есть — например, «арпеджио», а не
            коды вида \u0430\u0440….
        - id: t7
          kind: assert
          title: Файл с отступами
          stdin: "100\n"
          code: |-
            import os

            assert os.path.exists("settings.json")
            text = open("settings.json", encoding="utf-8").read()
            assert len(text.strip().splitlines()) > 1
          message: >-
            Настройки в файле разложены по строкам с отступами, а не вытянуты в одну строку.
            Отступы включает параметр indent у json.dump.
        - id: t8
          kind: assert
          title: Печатаются данные из файла
          stdin: "100\n"
          code: |-
            import contextlib
            import io
            import json

            # Программа запускается ещё раз, а json.load и json.loads возвращают другие настройки.
            # Если строка печатается по загруженным данным, на экране окажутся именно они.
            source = open(__file__, encoding="utf-8").read()
            fake = {"темп": 77, "размер": "3/4", "звук": "дерево", "упражнения": ["a", "b", "c", "d", "e"]}
            real_load, real_loads = json.load, json.loads
            base = __builtins__ if isinstance(__builtins__, dict) else vars(__builtins__)
            patched = dict(base)
            patched["input"] = lambda prompt="": "100"
            out = io.StringIO()
            json.load = lambda *args, **kwargs: dict(fake)
            json.loads = lambda *args, **kwargs: dict(fake)
            try:
                with contextlib.redirect_stdout(out):
                    exec(compile(source, __file__, "exec"), {"__name__": "__main__", "__file__": __file__, "__builtins__": patched})
            except (Exception, SystemExit):
                pass
            finally:
                json.load, json.loads = real_load, real_loads
            assert "Темп: 77, упражнений: 5" in " ".join(out.getvalue().split())
          message: >-
            Строка «Темп: …, упражнений: …» печатается по данным, которые программа загрузила из
            settings.json (json.load), а не по исходному словарю settings.
        - id: t-enc
          kind: assert
          title: Кодировка указана
          stdin: "100\n"
          code: |-
            import ast

            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            calls = [
                node for node in ast.walk(ast.parse(source))
                if isinstance(node, ast.Call)
                and (getattr(node.func, "id", None) in names or getattr(node.func, "attr", None) in names)
            ]
            assert all(any(k.arg == "encoding" for k in call.keywords) for call in calls)
          message: >-
            В одном из open() (или read_text/write_text) не указана кодировка. Добавь
            encoding="utf-8" — иначе на Windows со старым Python (до 3.15) русский текст
            превратится в кракозябры.
      criteria:
        - Новый темп читается из ввода, превращается в целое число и записывается в словарь.
        - "Словарь сохраняется в `settings.json` через `json.dump` с `ensure_ascii=False` и отступами."
        - "Строка «Темп: …, упражнений: …» печатается по данным, загруженным из файла."
        - "Во всех `open()` указана кодировка `utf-8`."
      hints:
        - >-
          Задача из трёх частей, как в примере «Сохранение квеста»: изменить словарь, записать его в
          файл и прочитать обратно. Какие две функции модуля json записывают и читают — и что нужно
          передать каждой из них?
        - |-
          Тот же приём на корзине покупок:
          ```python
          cart = {"хлеб": 1, "яблоки": 6}
          cart["хлеб"] = 2
          with open("cart.json", "w", encoding="utf-8") as f:
              json.dump(cart, f, ensure_ascii=False, indent=2)
          with open("cart.json", encoding="utf-8") as f:
              saved = json.load(f)
          print(len(saved))
          ```
        - |-
          Каркас:
          ```text
          settings["темп"] = int(input(...))
          with open("settings.json", "w", encoding="utf-8") as f:
              json.dump(…, f, ensure_ascii=False, indent=2)
          with open("settings.json", encoding="utf-8") as f:
              loaded = json.load(f)
          print(f"Темп: {…}, упражнений: {len(…)}")
          ```
      solution:
        code: |
          import json

          settings = {"темп": 90, "размер": "3/4", "звук": "дерево", "упражнения": ["гаммы", "арпеджио"]}

          settings["темп"] = int(input("Новый темп: "))

          with open("settings.json", "w", encoding="utf-8") as f:
              json.dump(settings, f, ensure_ascii=False, indent=2)

          with open("settings.json", encoding="utf-8") as f:
              loaded = json.load(f)

          print(f"Темп: {loaded['темп']}, упражнений: {len(loaded['упражнения'])}")
        explanation: >-
          `int(input())` превращает ввод в число (и сам убирает пробелы по краям), и оно заменяет
          старый темп в словаре. `json.dump` записывает весь словарь: число останется числом, список —
          списком, а `ensure_ascii=False` и `indent=2` делают файл читаемым. `json.load` возвращает
          новый словарь из файла, и строка печатается уже по нему. Подойдёт и пара `json.dumps` +
          `f.write`, `json.loads` + `f.read()`.
      altSolutions:
        - code: |
            import json

            settings = {"темп": 90, "размер": "3/4", "звук": "дерево", "упражнения": ["гаммы", "арпеджио"]}

            settings["темп"] = int(input())
            text = json.dumps(settings, ensure_ascii=False, indent=2)
            with open("settings.json", "w", encoding="utf-8") as f:
                f.write(text)

            with open("settings.json", encoding="utf-8") as f:
                loaded = json.loads(f.read())
            print(f"Темп: {loaded['темп']}, упражнений: {len(loaded['упражнения'])}")
          note: JSON-строка через dumps и loads, запись и чтение обычными write и read.
        - code: |
            import json
            from pathlib import Path

            settings = {"темп": 90, "размер": "3/4", "звук": "дерево", "упражнения": ["гаммы", "арпеджио"]}

            settings["темп"] = int(input("Темп: "))
            path = Path("settings.json")
            path.write_text(json.dumps(settings, ensure_ascii=False, indent=2), encoding="utf-8")

            loaded = json.loads(path.read_text(encoding="utf-8"))
            print(f"Темп: {loaded['темп']}, упражнений: {len(loaded['упражнения'])}")
          note: pathlib из урока 7.2 — write_text и read_text с кодировкой.
        - code: |
            import json

            settings = {"темп": 90, "размер": "3/4", "звук": "дерево", "упражнения": ["гаммы", "арпеджио"]}

            tempo = int(input("Новый темп: "))
            settings["темп"] = tempo

            with open("settings.json", mode="w", encoding="utf-8") as file:
                json.dump(settings, file, ensure_ascii=False, indent=4)

            with open("settings.json", "r", encoding="utf-8") as file:
                data = json.load(file)

            count = len(data["упражнения"])
            print("Темп:", str(data["темп"]) + ",", "упражнений:", count)
          note: Отдельные переменные, indent=4, режим «r» явно, print через запятые.
        - code: |
            from json import dump, load

            settings = {"темп": 90, "размер": "3/4", "звук": "дерево", "упражнения": ["гаммы", "арпеджио"]}

            new_tempo = input("Темп: ")
            settings["темп"] = int(new_tempo.strip())

            with open("settings.json", "w", encoding="utf-8") as out:
                dump(obj=settings, fp=out, indent=2, ensure_ascii=False)

            with open("settings.json", encoding="utf-8") as src:
                restored = load(src)

            print(f"Темп: {restored["темп"]}, упражнений: {len(restored["упражнения"])}")
