      mistakes:
        - id: dump-args-swapped
          when:
            errorIncludes: TextIOWrapper is not JSON serializable
          where: Строка с json.dump
          why: >-
            `json.dump` пытается превратить в JSON свой первый аргумент — а там оказался открытый
            файл. Файл не словарь и не список, записать его в JSON нельзя.
          try: 'Поменяй аргументы местами: сначала данные, потом файл — `json.dump(settings, f, …)`.'
          verify: Ошибка TypeError должна исчезнуть, а «Пример 1» — стать зелёным.
        - id: loads-file
          when:
            errorIncludes: not TextIOWrapper
          where: Строка с json.loads
          why: >-
            `json.loads` (с буквой s) разбирает строку с JSON-текстом, а ему передан открытый файл.
          try: >-
            Для открытого файла нужен `json.load(f)` — без s. Если хочешь именно `loads`, сначала
            прочитай текст: `json.loads(f.read())`.
          verify: Ошибка TypeError должна исчезнуть, а «Пример 1» — стать зелёным.
        - id: dump-by-name
          when:
            errorIncludes: has no attribute 'write'
          where: Строка с json.dump
          why: >-
            `json.dump` пишет в открытый файл: он вызывает у него `.write()`. А у строки с именем
            файла такого метода нет.
          try: >-
            Открой файл на запись — `with open("settings.json", "w", encoding="utf-8") as f:` — и
            передай в `json.dump` вторым аргументом `f`.
          verify: Ошибка AttributeError должна исчезнуть, а в «Файлах после запуска» появится settings.json.
        - id: load-by-name
          when:
            errorIncludes: has no attribute 'read'
          where: Строка с json.load
          why: >-
            `json.load` ждёт открытый файл: он вызывает у него `.read()`. А у строки с именем
            файла такого метода нет.
          try: >-
            Открой файл через `with open("settings.json", encoding="utf-8") as f:` и передай в
            `json.load` сам `f`.
          verify: Ошибка AttributeError должна исчезнуть.
        - id: dumps-with-file
          when:
            errorIncludes: dumps() takes 1 positional argument
          where: Строка с json.dumps
          why: >-
            `json.dumps` (с буквой s) только возвращает JSON-строку и файл вторым аргументом не
            принимает. Об этом и говорит ошибка: «takes 1 positional argument» — «принимает один
            аргумент».
          try: Для записи в открытый файл нужен `json.dump(settings, f, …)` — без s.
          verify: Ошибка TypeError должна исчезнуть, а в «Файлах после запуска» появится settings.json.
        - id: wrong-mode
          when:
            errorType: UnsupportedOperation
          where: Режим в open() и то, что дальше делают с файлом
          why: >-
            Файл открыт в одном режиме, а с ним делают другое. Из файла, открытого с `"w"`, читать
            нельзя (`not readable`), а в файл, открытый без `"w"`, нельзя писать (`not writable`).
            Это ошибка в коде, а не ограничение тренажёра: на компьютере будет то же самое.
          try: >-
            Запиши настройки в одном блоке `with open(…, "w", …)`, а прочитай в другом — без `"w"`,
            как в примере «Сохранение квеста».
          verify: Ошибка UnsupportedOperation должна исчезнуть, а «Пример 1» — стать зелёным.
        - id: append-mode
          when:
            errorType: JSONDecodeError
            codeRegex: 'open\([^)]*["'']a["'']'
          where: open(…, "a", …) при сохранении
          why: >-
            Режим `"a"` дописал новый словарь в конец старого файла, и в settings.json оказались два
            словаря подряд. Это уже не JSON, поэтому `json.load` выбрасывает JSONDecodeError
            («Extra data» — лишние данные).
          try: >-
            Сохраняй настройки целиком в режиме `"w"`: он стирает старое содержимое и записывает
            словарь заново.
          verify: 'Граничный случай «файл настроек уже есть» должен напечатать «Темп: 100, упражнений: 2».'
        - id: dumps-not-written
          when:
            errorType: FileNotFoundError
            codeRegex: '(?<![\s\S])(?![\s\S]*\.write(?:_text)?\()[\s\S]*\.dumps\('
          where: Строка с json.dumps
          why: >-
            `json.dumps` только возвращает JSON-строку — в файл он ничего не пишет. Поэтому
            `settings.json` так и не появился, и открыть его на чтение нельзя.
          try: >-
            Либо запиши строку в файл сам: `f.write(text)` внутри `with open(…, "w", …)`, либо
            сразу используй `json.dump(settings, f, …)` — без буквы s.
          verify: В «Файлах после запуска» должен появиться settings.json.
        - id: file-name
          when:
            errorType: FileNotFoundError
          why: >-
            Когда программа открывает settings.json, файла с таким именем в рабочей папке нет.
            Скорее всего, имя при чтении отличается от имени при записи (опечатка, другая буква),
            чтение стоит раньше записи или при записи забыт режим `"w"` — без него `open`
            открывает файл на чтение, а файла ещё нет.
          try: >-
            Проверь, что у записи есть режим `"w"`, и сравни имена в обоих `open()` посимвольно —
            лучше скопируй одно в другое. Запись должна идти раньше чтения.
          verify: Нажми «Запустить» — в «Файлах после запуска» появится settings.json, а ошибка исчезнет.
        - id: tempo-str
          when:
            failedTest: t5
            outputIncludes: "Темп:"
          why: >-
            Темп попал в файл не целым числом. Если ввод не превращён, в settings.json он записан
            строкой в кавычках, `"100"`: `input()` всегда возвращает текст. Если превращён через
            `float()`, в файле окажется `100.0`. А темп по условию — целое число ударов в минуту.
          try: Преврати ввод в целое число до записи в словарь — `int(input())`.
          verify: 'Проверка «Темп — целое число» должна стать зелёной: в файле будет `"темп": 100` без кавычек.'
        - id: print-original
          when:
            failedTest: t8
            outputIncludes: "Темп:"
          why: >-
            Строка печатается по словарю `settings` из кода, а не по тому, что загрузилось из
            settings.json. Тогда печать ничего не говорит о файле: даже если он записан с ошибкой,
            на экране всё будет верно.
          try: >-
            Загрузи файл в новую переменную — `loaded = json.load(f)` — и печатай по ней:
            `loaded["темп"]` и `len(loaded["упражнения"])`.
          verify: 'Проверка «Печатаются данные из файла» должна стать зелёной.'
        - id: ascii-escapes
          when:
            failedTest: t6
            outputIncludes: "Темп:"
          why: >-
            По умолчанию `json.dump` заменяет каждую русскую букву кодом вида `\u0430`. Python такой
            файл прочитает, а человек — нет.
          try: Добавь в `json.dump` параметр `ensure_ascii=False`.
          verify: Открой settings.json в «Файлах после запуска» — слова «гаммы» и «арпеджио» должны читаться.
        - id: no-encoding
          when:
            failedTest: t-enc
            outputIncludes: "Темп:"
          why: >-
            В одном из `open()` (или `read_text()`/`write_text()`) нет `encoding`. В тренажёре всё
            работает, но на русской Windows Python 3.14 и раньше без подсказки читает и пишет файлы в другой
            кодировке, и русские буквы превратятся в кракозябры или в ошибку UnicodeDecodeError.
          try: >-
            Добавь `encoding="utf-8"` в каждый `open()` (и в `read_text()`/`write_text()`, если они
            есть) — и при записи, и при чтении.
          verify: 'Проверка «Кодировка указана» должна стать зелёной.'
      afterPass: >-
        Настройки пережили «выключение»: программа записала словарь и прочитала его обратно в том
        же виде — с числом, строками и списком. Улучшение на будущее: вынеси запись и чтение в
        функции `save_settings(settings)` и `load_settings()`, чтобы вызывать их из разных мест
        программы.
      skills: [files-json, dicts]

  - id: safe-load
    type: theory
    title: Если файла нет или он повреждён
    body: |-
      Программа, которая помнит данные, при каждом запуске сначала загружает файл. Тут возможны
      две беды:

      - **Файла нет.** Например, игру запустили впервые. `open` выбросит `FileNotFoundError`.
        Ничего страшного: начинаем с пустых данных, молча.
      - **Файл повреждён.** Кто-то стёр скобку, или файл оказался пустым. `json.load` выбросит
        `json.JSONDecodeError` — ошибку разбора JSON. Для пустого файла последняя строка
        traceback такая: `json.decoder.JSONDecodeError: Expecting value: line 1 column 1 (char 0)`.
        Для стёртой скобки текст после двоеточия другой, а тип тот же. Данные потеряны, и об этом
        нужно сказать человеку.

      Поэтому загрузку прячут в функцию с двумя `except`:

      ```python
      def load_save(path):
          try:
              with open(path, encoding="utf-8") as f:
                  return json.load(f)
          except FileNotFoundError:
              return {}
          except json.JSONDecodeError:
              print("Сохранение повреждено, игра начнётся заново")
              return {}
      ```

      В traceback видно полное имя `json.decoder.JSONDecodeError`: `decoder` — часть модуля
      `json`, которая разбирает текст. В `except` хватает короткого `json.JSONDecodeError` — через
      точку, как `json.load`. Это разновидность `ValueError`, поэтому `except ValueError` его тоже
      поймает. А голый `except:` здесь не нужен: как в уроке 7.3, он спрячет и опечатку в коде.
      `return` внутри `with` не мешает закрыть файл — `with` закроет его сам.

      **При сохранении тоже есть две ловушки.**

      - **Множество.** В JSON нет множеств, и `json.dump` с множеством падает:
        `TypeError: Object of type set is not JSON serializable`. Хуже того, режим `"w"` уже
        очистил файл: старые данные пропали, а следующий запуск получит JSONDecodeError. Поэтому
        множество превращают в список — `list(…)` или `sorted(…)` — до того, как открыть файл. Но
        у множества нет порядка, и `list()` выдаст элементы в непредсказуемом порядке. Если
        порядок важен, храни данные списком с самого начала.
      - **Режим `"a"`.** JSON-файл нельзя дописывать: второй массив в конце делает файл
        повреждённым. Загрузи данные, измени их и запиши целиком в режиме `"w"`.
    simpler: >-
      Перед загрузкой спроси себя: «А если файла нет? А если он испорчен?». Нет файла — это первый
      запуск, начинаем с пустого. Испорчен — говорим человеку и тоже начинаем с пустого. Каждую
      беду ловит свой `except`.
    coach: >-
      Шаблон «загрузить или начать заново» пригодится в самостоятельной работе и в проекте «Список
      задач с сохранением в JSON».

