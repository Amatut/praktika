      solution:
        code: |
          import json


          def load_books(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except FileNotFoundError:
                  return []
              except json.JSONDecodeError:
                  print("Файл повреждён, начинаю с пустого списка")
                  return []


          books = load_books("books.json")
          print(f"Книг в списке: {len(books)}")
          for title in books:
              print("-", title)
        explanation: >-
          `try` охватывает и открытие файла, и разбор JSON. Нет файла — `open` выбрасывает
          `FileNotFoundError`, и первый `except` молча возвращает пустой список. Файл повреждён или
          пуст — `json.load` выбрасывает `json.JSONDecodeError`, второй `except` сообщает об этом и
          тоже возвращает `[]`. Код после функции ничего не знает о бедах с файлом — он всегда
          получает список. Вместо `json.JSONDecodeError` подойдёт и `ValueError`.
