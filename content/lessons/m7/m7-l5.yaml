          why: >-
            Один `try` охраняет весь цикл. На строке «Борис» случилась ошибка — выполнение
            выпрыгнуло из цикла сразу в `except`, и Вика со своими 700 так и не была прочитана.
          try: >-
            Перенеси `try` внутрь цикла, вокруг одной строки с `int()`: тогда ошибка пропустит
