      mistakes:
        - id: file-name
          when:
            errorType: FileNotFoundError
          why: >-
            Python не нашёл файл с именем из `open()`. Файл задания лежит в рабочей папке рядом с
            программой, но имя должно совпасть буква в букву: опечатка, другое расширение
            (`.txt` вместо `.csv`) или заглавная буква — и это уже другой файл.
          try: Скопируй имя `weather.csv` из условия или из блока «Файлы задания» в `open()`.
          verify: Ошибка FileNotFoundError исчезнет, и программа дойдёт до вывода.
        - id: closed-file
          when:
            errorIncludes: closed file
          why: >-
            Цикл читает таблицу уже после блока `with`, а там файл закрыт. `csv.DictReader` не
            читает файл заранее: он берёт строки из открытого файла по одной, прямо во время
            цикла.
          try: Перенеси цикл `for row in ...` внутрь блока `with` — сдвинь его вправо на один отступ.
          verify: Ошибка «I/O operation on closed file» исчезнет.
        - id: delimiter-in-open
          when:
            errorType: TypeError
            errorIncludes: delimiter
          why: >-
            `delimiter` — параметр `csv.DictReader` и `csv.reader`, а не `open()`. `open()` только
            открывает файл, а на столбцы строки режет csv — ему и нужно сказать, чем они
            разделены.
          try: 'Убери `delimiter=";"` из `open()` и передай его в `csv.DictReader(f, delimiter=";")`.'
          verify: Ошибка TypeError исчезнет, и в выводе появятся морозные дни.
        - id: no-delimiter
          when:
            codeRegex: '(?<![\s\S])(?=[\s\S]*\b(DictReader|reader)\s*\()(?![\s\S]*delimiter\s*=\s*(["''];["'']|[A-Za-z_]))'
          where: Строка, где создаётся DictReader или reader
          why: >-
            csv не знает, что столбцы разделены `;`: разделитель нужно передать словом
            `delimiter=";"`, иначе csv делит строки по запятым, а в этом файле их нет. Каждая
            строка целиком стала одной ячейкой: у DictReader вся первая строка
            `дата;погода;температура` превратилась в один заголовок, и ключа `температура` нет
            (KeyError), а у reader в строке нет третьего элемента (IndexError).
          try: 'Назови разделитель: `csv.DictReader(f, delimiter=";")`.'
          verify: 'Добавь в цикл `print(row)` — в строке должно стать три значения: дата, погода, температура.'
        - id: wrong-key
          when:
            errorType: KeyError
          why: >-
            В словаре строки нет такого ключа. Ключи DictReader — это заголовки из первой строки
            файла, буква в букву: `дата`, `погода`, `температура`, все с маленькой буквы.
          try: >-
            Скопируй название столбца из файла. Если сомневаешься, напечатай `row` в цикле и
            посмотри, какие ключи там на самом деле.
          verify: Ошибка KeyError исчезнет, и в выводе появятся морозные дни.
        - id: header-as-data
          when:
            errorType: ValueError
            errorIncludes: "'температура'"
          why: >-
            `int()` получил слово «температура» — это заголовок из первой строки файла.
            `csv.reader` и ручная разбивка отдают первую строку наравне с данными, и превратить
            её в число нельзя.
          try: >-
            Используй `csv.DictReader(f, delimiter=";")`: он сам забирает первую строку под
            названия столбцов, и в цикл приходят только данные.
          verify: Ошибка про «температура» исчезнет — в цикл придут только строки с днями.
        - id: manual-split
          when:
            errorIncludes: гололёд
          why: >-
            В строке `03.12;"ветер; гололёд";0` точка с запятой стоит внутри кавычек. `split(";")`
            об этом не знает и режет значение пополам — на месте температуры оказывается
            кусок ` гололёд"`, и `int()` не может его превратить.
          try: 'Прочитай файл модулем csv: `csv.DictReader(f, delimiter=";")` понимает кавычки.'
          verify: 'Добавь в цикл `print(row)` — у строки 03.12 погода должна прийти целиком: `ветер; гололёд`.'
        - id: str-compare
          when:
            errorIncludes: "not supported between instances of 'str'"
          why: >-
            Значения из CSV — строки. `"-3" < 0` сравнивает текст с числом, и Python не знает,
            как это сделать.
          try: 'Сначала превращай температуру в число: `int(row["температура"])`, потом сравнивай.'
          verify: Ошибка TypeError исчезнет, и в выводе появятся морозные дни.
        - id: manual-parse
          when:
            failedTest: t-csv
            codeRegex: '(?<![\s\S])(?![\s\S]*csv\.(DictReader|reader)\b)'
          where: Чтение таблицы
          why: >-
            Вывод верный, но таблица разобрана вручную, без модуля csv. На этих данных повезло:
            температура стоит последней. Стоит столбцу со значением в кавычках оказаться в конце —
            и такой разбор разрежет его пополам.
          try: 'Читай таблицу через `csv.DictReader(f, delimiter=";")` — ради этого и нужен модуль csv.'
          verify: Вывод останется тем же, а проверка «Таблица читается модулем csv» станет зелёной.
        - id: skipped-first-row
          when:
            failedTest: t2
            outputEquals: |-
              11.01: -1
              Морозных дней: 1
          where: Пропуск первой строки в цикле
          why: >-
            В «Январе» пропал первый день — 10.01 с −12. DictReader сам забирает первую строку
            файла под заголовки, в цикл приходят только данные. Если пропустить ещё одну строку,
            выпадет первая строка данных. В «Начале декабря» это незаметно: там первый день
            тёплый.
          try: Убери пропуск первой строки — с DictReader он не нужен.
          verify: 'В примере «Январь» должна появиться строка «10.01: -12».'
        - id: zero-is-frost
          when:
            failedTest: t1
            outputIncludes: "03.12: 0"
          why: >-
            В вывод попал день с нулём градусов. По условию мороз — температура **ниже** нуля, а
            ноль — граница, которая морозом не считается.
          try: Проверь знак сравнения — нужно строгое `< 0`, а не `<= 0`.
          verify: 'В примере «Начало декабря» строки «03.12: 0» быть не должно.'
        - id: str-compare-text
          when:
            failedTest: t5
            codeRegex: '<\s*["'']-?0["'']|["'']-?0["'']\s*>'
          why: >-
            Температура сравнивается с `"0"` как строка. Строки сравниваются по символам, а не по
            величине: `"-3" < "0"` случайно даёт `True`, но и `"+3" < "0"` тоже `True` — знак `+`
            в таблице символов стоит раньше цифр. Поэтому тёплый день 08.12 попал в морозные.
          try: 'Сравнивай числа: `int(row["температура"]) < 0`.'
          verify: 'В граничном случае «тёплый день записан с плюсом» строки «08.12: +3» быть не должно.'
        - id: no-encoding
          when:
            failedTest: t-enc
            codeRegex: 'open\((?![^)]*encoding)'
          why: >-
            Файл открыт без `encoding`. В тренажёре это незаметно: здесь по умолчанию UTF-8. А на
            русской Windows Python 3.14 и раньше без подсказки читает файлы в другой кодировке — русские
            заголовки превратятся в кракозябры или программа упадёт с UnicodeDecodeError.
          try: 'Добавь `encoding="utf-8"` в `open()`.'
          verify: Проверка «Кодировка указана» станет зелёной.
      afterPass: >-
        Разделитель назван, температура превращена в число, и значение с `;` в кавычках не сломало
        разбор. На компьютере пригодится: сохраняй таблицу из Excel как «CSV UTF-8». Обычный «CSV»
        русский Excel пишет в кодировке cp1251, и `encoding="utf-8"` его не прочитает
        (UnicodeDecodeError). У «CSV UTF-8» своя особенность: в начале файла лежит невидимая
        метка, и первый заголовок прочитается как `'\ufeffдата'` —
        `row["дата"]` упадёт с KeyError. Помогает `encoding="utf-8-sig"` при чтении.
      skills: [files-json, conditions, accumulators]

  - id: practice-gift
    type: exercise
    title: Практика 2
    exercise:
      id: m7-l5-e2
      kind: modify
      title: Сбор на подарок
      statement: |-
        Класс собирает деньги на подарок учительнице. Казначей отмечает взносы в таблице и
        скачивает её как `gift.csv` со столбцами `имя,сумма`. Некоторые вместо суммы пишут
        «позже» или «нет», кто-то оставляет ячейку пустой — и программа казначея падает на первой
        же такой строке.

        Измени программу: если в строке сумма — не целое число (слово, пустая ячейка или дробь
        вроде `250.5`), выведи `Проверить: <имя>` и
        переходи к следующей строке. В конце выведи `Собрано: S` — сумму всех нормальных
        взносов. Плохую строку обработай через try / except с конкретным типом ошибки.

        Для файла из блока «Файлы задания» вывод такой:

        ```text
        Проверить: Борис
        Собрано: 1200
        ```
      input: Файл `gift.csv` (с клавиатуры ничего не вводится).
      output: "Строки `Проверить: <имя>` для строк без целого числа — в порядке файла, затем `Собрано: S`."
      constraints:
        - Плохую строку обрабатывай через try / except ValueError, без голого except.
        - Пробелы вокруг числа не делают строку плохой — ` 400 ` это 400.
      files:
        gift.csv: |
          имя,сумма
          Аня,500
          Борис,позже
          Вика,700
      starterCode: |
        import csv

        total = 0
        with open("gift.csv", encoding="utf-8", newline="") as f:
            for row in csv.DictReader(f):
                total += int(row["сумма"])
        print(f"Собрано: {total}")
      tests:
        - id: t1
          kind: io
          title: Один «позже»
          example: true
          expected: |-
            Проверить: Борис
            Собрано: 1200
        - id: t2
          kind: io
          title: Пустая ячейка и «нет»
          example: true
          files:
            gift.csv: "имя,сумма\nГоша,300\nДаша,\nЕгор,1000\nЖеня,нет\n"
          expected: |-
            Проверить: Даша
            Проверить: Женя
            Собрано: 1300
        - id: t3
          kind: io
          title: "Граничный случай: все сдали"
          edge: true
          files:
            gift.csv: "имя,сумма\nЗоя,250\nИгорь,500\n"
          expected: "Собрано: 750"
        - id: t4
          kind: io
          title: "Граничный случай: никто не сдал"
          edge: true
          files:
            gift.csv: "имя,сумма\nКира,позже\nЛёва,\n"
          expected: |-
            Проверить: Кира
            Проверить: Лёва
            Собрано: 0
        - id: t5
          kind: io
          title: "Граничный случай: пробелы вокруг суммы"
          edge: true
          files:
            gift.csv: "имя,сумма\nМила, 400 \nНиколай,100\n"
          expected: "Собрано: 500"
        - id: t6
          kind: io
          title: "Граничный случай: дробная сумма"
          edge: true
          files:
            gift.csv: |
              имя,сумма
              Оля,250.5
              Павел,300
          expected: |-
            Проверить: Оля
            Собрано: 300
        - id: t-except
          kind: assert
          title: Ловится конкретная ошибка
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            for node in ast.walk(ast.parse(source)):
                if isinstance(node, ast.ExceptHandler):
                    assert node.type is not None
                    assert not (isinstance(node.type, ast.Name) and node.type.id in ("Exception", "BaseException"))
          message: >-
            Здесь ловится «всё подряд»: `except` без типа или `except Exception`. Укажи конкретный
            тип — `ValueError`.
        - id: t-enc
          kind: assert
          title: Кодировка указана
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            calls = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Call)
                     and (getattr(n.func, "id", None) in names or getattr(n.func, "attr", None) in names)]
            assert all(any(k.arg == "encoding" for k in c.keywords) for c in calls)
          message: >-
            В одном из `open()` не указана кодировка. Добавь `encoding="utf-8"` — иначе на Windows
            со старым Python (до 3.15) русский текст превратится в кракозябры.
      rules:
        - id: r-try
          use: [Try]
          message: >-
            Обработай строку без числа через try / except ValueError: так программа переживёт любой
            текст вместо суммы, а не только заранее известный.
      criteria:
        - 'Строка, где сумма не целое число, не останавливает программу — выводится `Проверить: <имя>`.'
        - Такая строка не меняет сумму, остальные строки учитываются все.
        - Ловится конкретная ошибка — ValueError, а не всё подряд.
        - 'В конце выводится `Собрано: S`, даже если нормальных взносов нет.'
      hints:
        - >-
          Нажми «Запустить» и прочитай последнюю строку ошибки: какой у неё тип и на каком
          значении программа упала? Что должно происходить с такой строкой вместо падения — и что
          со всеми следующими?
        - |-
          Тот же приём на списке строк: плохое значение пропускается, цикл идёт дальше.

          ```python
          for text in ["3", "три", "5"]:
              try:
                  number = int(text)
              except ValueError:
                  print("Не число:", text)
                  continue
              print(number * 2)
          ```

          Выведет `6`, `Не число: три`, `10`.
        - |-
          Каркас тела цикла:

          ```text
          try:
              сумма = int(row["сумма"])
          except ValueError:
              напечатать «Проверить: …» с именем из row
              continue
          total += сумма
          ```
      solution:
        code: |
          import csv

          total = 0
          with open("gift.csv", encoding="utf-8", newline="") as f:
              for row in csv.DictReader(f):
                  try:
                      amount = int(row["сумма"])
                  except ValueError:
                      print(f"Проверить: {row['имя']}")
                      continue
                  total += amount
          print(f"Собрано: {total}")
        explanation: >-
          `try` стоит **внутри** цикла и охраняет одно рискованное действие — `int()`. Если в
          ячейке «позже», дробь или пусто, `int()` выбрасывает ValueError: выполняется `except`, печатается
          имя, а `continue` переходит к следующей строке, минуя прибавление. Так одна плохая
          строка не обрывает подсчёт. Можно обойтись и без `continue`, если прибавлять прямо
          внутри `try`: `total += int(row["сумма"])` — при ошибке прибавление не случится.
