id: m7-l5
module: m7
number: "7.5"
title: "CSV: таблица в текстовом файле"
objective: >-
  Читать CSV-файл модулем csv, превращать нужные значения в числа, пропускать битые строки и
  записывать результат в новый CSV-файл.
minutes: [25, 30]
prerequisites: [m7-l4]
skills: [files-json, exceptions]
environment: python

story:
  title: Пряжа, которую пора дозаказать
  fictional: true
  text: >-
    Алёна продаёт пряжу через маленький интернет-магазин и ведёт остатки в таблице. Каждый
    понедельник она просматривала сотни строк глазами, чтобы понять, какие мотки пора
    дозаказать, и однажды пропустила ходовой цвет — покупатели ждали две недели. Теперь она
    сохраняет таблицу в CSV, а программа за секунду печатает список к дозаказу и записывает его
    отдельным файлом для поставщика. Когда в таблицу случайно попала строка с прочерком вместо
    количества, программа не упала, а подсказала, какую строку проверить.

why: >-
  CSV — самый простой способ передать таблицу между программами: его открывают Excel и Google
  Таблицы, в него выгружают данные многие банки и интернет-магазины, и его читает Python.
  Например, список заказов из интернет-магазина обычно можно скачать в CSV и обработать
  программой, а не глазами.

usedIn: >-
  Выгрузки из банков, магазинов и учётных программ, отчёты для бухгалтерии и поставщиков,
  анализ данных, обмен таблицами между программами, которые ничего не знают друг о друге.

steps:
  - id: csv-read
    type: theory
    title: CSV и модуль csv
    body: |-
      Таблицу из Excel или Google Таблиц можно сохранить как **CSV** (от английского
      comma-separated values — «значения через запятую»). Это обычный текстовый файл: одна
      строка файла — одна строка таблицы, ячейки разделены запятой. Первая строка обычно —
      **заголовки**, названия столбцов:

      ```text
      товар,цвет,остаток,минимум
      Мериносовая пряжа,синий,3,5
      "Спицы, 4 мм",—,1,2
      ```

      Если внутри значения есть запятая, значение берут в **кавычки**: `"Спицы, 4 мм"` — одна
      ячейка, а не две. Поэтому `line.split(",")` для CSV не годится: он режет по каждой запятой
      и на кавычки не смотрит. Разбирать CSV умеет модуль **csv** из стандартной библиотеки:

      ```python
      import csv

      with open("stock.csv", encoding="utf-8", newline="") as f:
          for row in csv.DictReader(f):
              print(row["товар"], row["остаток"])
      ```

      - `newline=""` — открыть файл, не трогая концы строк: с ними разбирается сам csv. Так
        советует документация модуля, поэтому для CSV пиши его всегда.
      - `csv.DictReader(f)` забирает первую строку под заголовки, а каждую следующую отдаёт
        **словарём**: ключи — заголовки, значения — ячейки этой строки. `row["остаток"]` —
        остаток в текущей строке.
      - **Все значения — строки.** В `row["остаток"]` лежит `"3"`, а не 3. Чтобы сравнивать и
        считать, превращай сам: `int(row["остаток"])`.
      - Русский Excel часто разделяет столбцы **точкой с запятой**: запятая у него занята
        дробными числами (2,5). Тогда разделитель нужно назвать:
        `csv.DictReader(f, delimiter=";")`.

      Есть и `csv.reader(f)`: он отдаёт каждую строку списком, например
      `["Хлопок", "белый", "0", "4"]`, — и строку заголовков тоже, как обычные данные. К
      столбцам по названию удобнее обращаться через DictReader.

      Частое заблуждение: «в файле написано 3 — значит, это число». В текстовом файле всё —
      текст, числом значение становится только после `int()`.
    simpler: >-
      CSV — таблица, записанная обычным текстом: строка файла — строка таблицы, между ячейками
      запятые (или точки с запятой). Модуль csv режет строки на ячейки правильно, даже если в
      ячейке есть запятая в кавычках. DictReader отдаёт каждую строку словарём «название
      столбца → значение», и все значения в нём — строки.
    coach: >-
      Прежде чем писать код, открой файл и посмотри на первые строки: какой разделитель и как
      называются столбцы.

  - id: reorder
    type: example
    title: Что дозаказать
    body: >-
      Программа из истории. Таблица остатков лежит в файле `stock.csv` — открой блок «Файлы
      задания» и посмотри на неё. Программа печатает товары, которых осталось меньше минимума.
    code: |-
      import csv

      with open("stock.csv", encoding="utf-8", newline="") as f:
          for row in csv.DictReader(f):
              left = int(row["остаток"])
              minimum = int(row["минимум"])
              if left < minimum:
                  print(f"Дозаказать: {row['товар']} ({row['цвет']}), осталось {left}")
    files:
      stock.csv: |
        товар,цвет,остаток,минимум
        Мериносовая пряжа,синий,3,5
        Мериносовая пряжа,красный,12,5
        Хлопок,белый,0,4
        "Спицы, 4 мм",—,1,2
    notes:
      - line: 1
        text: Модуль csv входит в стандартную библиотеку — ставить ничего не нужно.
      - line: 3
        text: >-
          Кодировка — как в уроке 7.1, а `newline=""` отдаёт концы строк на разбор модулю csv.
      - line: 4
        text: >-
          DictReader забрал первую строку под заголовки. На каждом шаге цикла `row` — словарь
          одной строки таблицы, начиная со второй строки файла.
      - line: 5
        text: >-
          `row["остаток"]` — строка `"3"`, поэтому `int()`. Без него сравнение `<` со строками
          дало бы неверный ответ или ошибку.
      - line: 8
        text: >-
          Внутри f-строки в двойных кавычках ключ словаря пишем в одинарных: `row['товар']`.
          Значение «Спицы, 4 мм» пришло целиком — csv понял кавычки.
    tryIt: >-
      Добавь первой строкой в цикл `print(row)` и запусти. Увидишь словари, где все значения в
      кавычках, — даже остаток и минимум: это строки. Потом убери `print(row)`.
    coach: Сначала превратить в число, потом сравнивать или считать — этот порядок встретится в каждом задании урока.

  - id: why-not-split
    type: predict
    title: Одна строка, два способа
    prompt: |-
      В файле `runners.csv` одна строка — участница забега и её время в минутах:

      ```text
      "Иванова, Анна",42
      ```

      Программа разбирает эту строку сначала через `split`, потом модулем csv. Как думаешь,
      что она выведет?
    code: |-
      import csv

      with open("runners.csv", encoding="utf-8", newline="") as f:
          text = f.read().strip()
      print(len(text.split(",")))

      with open("runners.csv", encoding="utf-8", newline="") as f:
          for row in csv.reader(f):
              print(len(row))
              print(row[1] * 2)
    files:
      runners.csv: |
        "Иванова, Анна",42
    options:
      - |-
        2
        2
        84
      - |-
        3
        2
        84
      - |-
        3
        2
        4242
      - |-
        3
        3
        4242
    answer: |-
      3
      2
      4242
    explanation: >-
      `split(",")` режет по каждой запятой и о кавычках не знает: получается три куска —
      `'"Иванова'`, `' Анна"'` и `'42'`, с кавычками, прилипшими к кускам. `csv.reader` видит,
      что запятая стоит внутри кавычек, и отдаёт две ячейки: `'Иванова, Анна'` и `'42'`. В
      таблице два столбца — прав csv. А `row[1]` — это строка `'42'`, а не число: `* 2`
      повторяет её дважды, как `"-" * 10` из урока 1.3, и получается `4242`. Чтобы вышло 84,
      нужно сначала `int(row[1])`.
    coach: >-
      На своих данных split может «работать» неделями, пока в таблицу не попадёт первая запятая
      внутри значения. Модуль csv к этому готов с самого начала.

  - id: practice-frost
    type: exercise
    title: Практика 1
    exercise:
      id: m7-l5-e1
      kind: repeat
      title: Морозные дни
      statement: |-
        Школа заливает каток во дворе, когда морозы держатся несколько дней. Завхоз ведёт дневник
        погоды в Excel и сохраняет его в `weather.csv`. Файл сохранён из русского Excel: столбцы
        разделены **точкой с запятой**, первая строка — заголовки `дата;погода;температура`.
        Температура — целое число, иногда со знаком: `-7`, `+3`.

        Выведи дни с морозом (температура ниже нуля) в порядке файла, по одному в строке, в виде
        `дата: температура`, а в конце — `Морозных дней: N`. Ноль — ещё не мороз.

        Для файла из блока «Файлы задания» вывод такой:

        ```text
        02.12: -3
        04.12: -7
        Морозных дней: 2
        ```

        Читай таблицу модулем csv: в столбце «погода» бывают значения в кавычках с точкой с
        запятой внутри.
      input: Файл `weather.csv` (с клавиатуры ничего не вводится).
      output: "Строки `<дата>: <температура>` для морозных дней и последняя строка `Морозных дней: N`."
      constraints:
        - Таблицу читай модулем csv.
        - "Файл открывай с `encoding=\"utf-8\"`."
        - Ноль градусов — не мороз.
      files:
        weather.csv: |
          дата;погода;температура
          01.12;пасмурно;2
          02.12;снег;-3
          03.12;"ветер; гололёд";0
          04.12;ясно;-7
      starterCode: |
        import csv

        # Прочитай weather.csv, выведи морозные дни и их количество
      tests:
        - id: t1
          kind: io
          title: Начало декабря
          example: true
          expected: |-
            02.12: -3
            04.12: -7
            Морозных дней: 2
        - id: t2
          kind: io
          title: Январь
          example: true
          files:
            weather.csv: |
              дата;погода;температура
              10.01;метель;-12
              11.01;"снег; ветер";-1
              12.01;оттепель;1
          expected: |-
            10.01: -12
            11.01: -1
            Морозных дней: 2
        - id: t3
          kind: io
          title: "Граничный случай: мороза нет, есть ровно ноль"
          edge: true
          files:
            weather.csv: |
              дата;погода;температура
              05.04;дождь;6
              06.04;солнце;11
              07.04;"туман; морось";0
          expected: "Морозных дней: 0"
        - id: t4
          kind: io
          title: "Граничный случай: в файле только заголовки"
          edge: true
          files:
            weather.csv: |
              дата;погода;температура
          expected: "Морозных дней: 0"
        - id: t5
          kind: io
          title: "Граничный случай: тёплый день записан с плюсом"
          edge: true
          files:
            weather.csv: |
              дата;погода;температура
              08.12;ясно;+3
              09.12;снег;-2
          expected: |-
            09.12: -2
            Морозных дней: 1
        - id: t-csv
          kind: assert
          title: Таблица читается модулем csv
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            used = set()
            for node in ast.walk(ast.parse(source)):
                if isinstance(node, ast.Attribute) and isinstance(node.value, ast.Name) and node.value.id == "csv":
                    used.add(node.attr)
                if isinstance(node, ast.ImportFrom) and node.module == "csv":
                    for alias in node.names:
                        used.add(alias.name)
            assert "DictReader" in used or "reader" in used
          message: >-
            Таблица разбирается без модуля csv. Читай её через `csv.DictReader` (или `csv.reader`) —
            ручная разбивка строк ломается на значениях в кавычках.
        - id: t-enc
          kind: assert
          title: Кодировка указана
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            calls = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Call)
                     and (getattr(n.func, "id", None) in names or getattr(n.func, "attr", None) in names)]
            assert all(any(k.arg == "encoding" for k in c.keywords) for c in calls)
          message: >-
            В одном из `open()` не указана кодировка. Добавь `encoding="utf-8"` — иначе на Windows
            со старым Python (до 3.15) русский текст превратится в кракозябры.
      criteria:
        - Таблица читается модулем csv с разделителем `;`, значения в кавычках не ломают разбор.
        - Температура превращается в число (и `-7`, и `+3`); в вывод попадают только дни ниже нуля, ноль — нет.
        - 'Строки выводятся в формате `дата: температура` в порядке файла, в конце — число морозных дней.'
        - 'Файл без морозных дней и файл из одних заголовков дают `Морозных дней: 0`.'
      hints:
        - >-
          Открой блок «Файлы задания» и посмотри на первую строку `weather.csv`: чем разделены
          столбцы? В примере про пряжу разделителем была запятая — её csv ждёт, если ничего не
          сказать. И вспомни, в каком виде csv отдаёт числа из таблицы.
        - |-
          Тот же приём на другом файле — оценки класса, разделитель `;`:

          ```python
          import csv

          with open("marks.csv", encoding="utf-8", newline="") as f:
              for row in csv.DictReader(f, delimiter=";"):
                  mark = int(row["оценка"])
                  if mark == 5:
                      print(row["ученик"])
          ```
        - |-
          Каркас:

          ```text
          счётчик = 0
          with open("weather.csv", encoding=..., newline="") as f:
              for row in csv.DictReader(f, delimiter=";"):
                  температура = int(row[...])
                  если температура ниже нуля:
                      напечатать дату и температуру
                      счётчик += 1
          напечатать «Морозных дней: …»
          ```
      solution:
        code: |
          import csv

          count = 0
          with open("weather.csv", encoding="utf-8", newline="") as f:
              for row in csv.DictReader(f, delimiter=";"):
                  temperature = int(row["температура"])
                  if temperature < 0:
                      print(f"{row['дата']}: {temperature}")
                      count += 1
          print(f"Морозных дней: {count}")
        explanation: >-
          `delimiter=";"` говорит csv, чем разделены столбцы, — и значение `"ветер; гололёд"`
          в кавычках остаётся одной ячейкой. Температура приходит строкой, `int()` делает из неё
          число, и только тогда её можно сравнить с нулём. Условие `< 0` строгое, поэтому ноль в
          вывод не попадает. Счётчик растёт только внутри `if` и печатается после цикла — один
          раз.
      altSolutions:
        - code: |
            import csv

            count = 0
            first = True
            with open("weather.csv", encoding="utf-8", newline="") as f:
                for row in csv.reader(f, delimiter=";"):
                    if first:
                        first = False
                        continue
                    if int(row[2]) < 0:
                        print(row[0] + ":", row[2])
                        count = count + 1
            print("Морозных дней:", count)
          note: csv.reader и флаг, чтобы пропустить строку заголовков; печать через запятые в print.
        - code: |
            import csv

            frost = []
            with open("weather.csv", encoding="utf-8", newline="") as f:
                reader = csv.DictReader(f, delimiter=";")
                for row in reader:
                    if int(row["температура"]) < 0:
                        frost.append(row["дата"] + ": " + row["температура"])
            for line in frost:
                print(line)
            print(f"Морозных дней: {len(frost)}")
          note: Сначала собрать строки в список, потом напечатать; количество — len(). Температура печатается как в файле.
        - code: |
            import csv

            with open("weather.csv", encoding="utf-8", newline="") as f:
                rows = list(csv.DictReader(f, delimiter=';'))

            frost = 0
            for row in rows:
                if int(row["температура"]) < 0:
                    print(f"{row["дата"]}: {row["температура"]}")
                    frost += 1
            print(f"Морозных дней: {frost}")
          note: Все строки сначала читаются в список внутри with; в f-строке те же двойные кавычки (так можно с Python 3.12).
        - code: |
            from csv import DictReader

            SEPARATOR = ";"
            frosty = 0
            with open("weather.csv", encoding="utf-8") as file:
                for day in DictReader(file, delimiter=SEPARATOR):
                    degrees = int(day["температура"])
                    if 0 > degrees:
                        print(f"{day['дата']}: {degrees}")
                        frosty += 1
            print("Морозных дней:", frosty)
          note: from csv import DictReader, разделитель в переменной, файл без newline="" (в условии не требуется), сравнение 0 > degrees.
      wrongSolutions:
        - code: |
            import csv

            count = 0
            with open("weather.csv", encoding="utf-8", newline="") as f:
                for row in csv.DictReader(f):
                    temperature = int(row["температура"])
                    if temperature < 0:
                        print(f"{row['дата']}: {temperature}")
                        count += 1
            print(f"Морозных дней: {count}")
          note: Разделитель не назван — csv ищет запятые, и вся строка заголовков стала одним ключом.
          expectMistake: no-delimiter
        - code: |
            import csv

            count = 0
            first = True
            with open("weather.csv", encoding="utf-8", newline="") as f:
                for row in csv.reader(f):
                    if first:
                        first = False
                        continue
                    temperature = int(row[2])
                    if temperature < 0:
                        print(f"{row[0]}: {temperature}")
                        count += 1
            print(f"Морозных дней: {count}")
          note: csv.reader без delimiter — каждая строка стала одной ячейкой, row[2] нет (IndexError).
          expectMistake: no-delimiter
        - code: |
            import csv

            count = 0
            with open("weather.csv", encoding="utf-8", newline="") as f:
                for row in csv.DictReader(f, delimiter=";"):
                    temperature = int(row["Температура"])
                    if temperature < 0:
                        print(f"{row['дата']}: {temperature}")
                        count += 1
            print(f"Морозных дней: {count}")
          note: Ключ написан с заглавной буквы — такого заголовка в файле нет.
          expectMistake: wrong-key
        - code: |
            import csv

            count = 0
            with open("weather.csv", encoding="utf-8", newline="") as f:
                for row in csv.reader(f, delimiter=";"):
                    temperature = int(row[2])
                    if temperature < 0:
                        print(f"{row[0]}: {temperature}")
                        count += 1
            print(f"Морозных дней: {count}")
          note: csv.reader отдал и строку заголовков — int("температура").
          expectMistake: header-as-data
        - code: |
            import csv

            with open("weather.csv", encoding="utf-8", newline="") as f:
                reader = csv.DictReader(f, delimiter=";")

            count = 0
            for row in reader:
                temperature = int(row["температура"])
                if temperature < 0:
                    print(f"{row['дата']}: {temperature}")
                    count += 1
            print(f"Морозных дней: {count}")
          note: Цикл по reader стоит после with — файл уже закрыт.
          expectMistake: closed-file
        - code: |
            count = 0
            with open("weather.csv", encoding="utf-8") as f:
                for line in f:
                    parts = line.strip().split(";")
