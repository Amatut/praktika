        - id: bare-except
          when:
            failedTest: t-except
            codeRegex: 'except\s*:|except\s+(Exception|BaseException)\b'
          why: >-
            Голый `except` ловит любую ошибку — и неверную сумму, и опечатку в самом коде,
            например в названии столбца. Тогда программа молча напишет «Проверить» у всех подряд,
            и настоящую ошибку не найти.
          try: 'Напиши `except ValueError:` — это ошибка `int()` на тексте вместо числа.'
          verify: Вывод останется тем же, а проверка «Ловится конкретная ошибка» станет зелёной.
        - id: closed-file
          when:
            errorIncludes: closed file
          why: >-
            Цикл читает таблицу уже после блока `with`, а там файл закрыт. `csv.DictReader` не
            читает файл заранее: он берёт строки из открытого файла по одной, прямо во время
