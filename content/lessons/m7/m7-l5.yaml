  - id: csv-write
    type: theory
    title: Записываем CSV
    body: |-
      Записывать таблицу тоже удобнее модулем csv:

      ```python
      import csv

      with open("order.csv", "w", encoding="utf-8", newline="") as f:
          writer = csv.writer(f)
          writer.writerow(["товар", "цвет", "заказать"])
          writer.writerow(["Спицы, 4 мм", "—", 3])
      ```

      `csv.writer(f)` — «писатель» в открытый файл. `writerow(список)` записывает одну строку
      таблицы: ставит запятые между значениями, сам берёт в кавычки значение с запятой и
      превращает числа в текст. Обрати внимание: `writerow` принимает **один** список, а не
      несколько значений через запятую. В файле получится:

      ```text
      товар,цвет,заказать
      "Спицы, 4 мм",—,3
      ```

      Порядок обычный: сначала строка заголовков, потом строки данных. Строк много — вызывай
      `writerow` для каждой, например в цикле: `for line in rows:` и внутри
      `writer.writerow(line)`, где каждая `line` — список значений одной строки.

      `newline=""` при записи обязателен. csv сам ставит в конце каждой строки таблицы свой
      перевод строки, а на Windows Python без `newline=""` добавит ещё один — и в Excel между
      записями появятся пустые строки. В тренажёре этого не видно, поэтому проверка смотрит на
      код.

      И правило из уроков 7.1 и 7.2: результат пишем **в отдельный файл**, исходную таблицу не
      трогаем. Режим `"w"` стирает файл в момент открытия — одна ошибка в имени, и таблица
      остатков пропала.
    simpler: >-
      Чтобы записать таблицу, открой файл для результата на запись с `encoding="utf-8"` и `newline=""`,
      создай `writer = csv.writer(f)` и вызывай `writer.writerow([...])` для каждой строки —
      сначала для заголовков. Запятые и кавычки csv расставит сам.
    coach: Читаем из одного файла, пишем в другой — тогда ошибка в программе не испортит данные.

  - id: practice-order
    type: exercise
    title: Практика 3
    exercise:
      id: m7-l5-e3
      kind: write
      title: Заказ для поставщика
      statement: |-
        Алёне нужен файл для поставщика. Прочитай склад `stock.csv` (столбцы
        `товар,цвет,остаток,минимум`, числа целые) и запиши файл `order.csv` со столбцами
        `товар,цвет,заказать`. В заказ попадают только строки, где остаток **меньше** минимума,
        в порядке склада; заказать нужно `минимум * 2 - остаток` штук. В конце выведи
        `В заказе позиций: N`.

        В папке уже лежит `order.csv` с заказом прошлой недели: новый заказ должен его
        **заменить**, а не дописаться в конец. Файл `stock.csv` не меняй.

