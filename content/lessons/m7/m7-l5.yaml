      mistakes:
        - id: file-name
          when:
            errorType: FileNotFoundError
          why: >-
            Python не нашёл файл склада с именем из `open()`. Файл задания лежит в рабочей папке
            рядом с программой, но имя должно совпасть буква в букву — лишняя или пропущенная
            буква, и это уже другой файл.
          try: Скопируй имя `stock.csv` из условия или из блока «Файлы задания».
          verify: Ошибка FileNotFoundError исчезнет, и программа дойдёт до записи заказа.
        - id: read-mode
          when:
            failedTest: t1
            codeRegex: '(?<![\s\S])(?![\s\S]*open\(\s*["'']order\.csv["''][^)]*(["''][wa]["'']|mode\s*=))(?=[\s\S]*open\(\s*["'']order\.csv["''])'
          where: Строка, где открывается order.csv
          why: >-
            `order.csv` открыт без режима `"w"` — значит, для чтения, и писать в него нельзя
            (not writable). Это не ограничение тренажёра: на компьютере будет та же ошибка.
          try: 'Добавь режим вторым аргументом: `open("order.csv", "w", encoding="utf-8", newline="")`.'
          verify: Ошибка «not writable» исчезнет, а в «Файлах после запуска» появится новый order.csv.
        - id: writerow-list
          when:
            errorIncludes: takes exactly one argument
          why: >-
            `writerow` записывает одну строку таблицы и принимает **один** аргумент — список её
            значений. Три значения через запятую он принять не может.
          try: 'Собери значения в список: `writer.writerow(["товар", "цвет", "заказать"])` — с квадратными скобками.'
          verify: Ошибка «takes exactly one argument» исчезнет.
        - id: not-iterable
          when:
            errorIncludes: iterable expected
          why: >-
            csv ждёт список значений, а получил число. Так бывает, если вызвать `writerows(line)`
            для одной строки: `writerows` ждёт список **строк** и принимает каждое значение за
            отдельную строку. Или если передать в `writerow` число без квадратных скобок.
          try: Одну строку таблицы пиши через `writer.writerow(line)`, где `line` — список из трёх значений.
          verify: Ошибка «iterable expected» исчезнет, а в order.csv будет по строке на товар.
        - id: closed-file
          when:
            errorIncludes: closed file
          why: >-
            Цикл читает склад уже после блока `with`, а там файл закрыт. `csv.DictReader` не
            читает файл заранее: он берёт строки из открытого файла по одной, прямо во время
            цикла.
          try: >-
            Перенеси цикл `for row in ...` внутрь блока `with` — сдвинь его вправо на один
            отступ. Строки заказа можно собрать в список и записать уже после.
          verify: Ошибка «I/O operation on closed file» исчезнет.
        - id: manual-split
          when:
            errorType: ValueError
            codeRegex: 'split\(\s*["''],["'']\s*\)'
          where: Строка, где склад режется через split
          why: >-
            Склад разобран вручную через `split(",")`. В строке `"Спицы, 4 мм",—,1,2` запятая
            стоит внутри кавычек, `split` режет и по ней — на месте остатка оказывается прочерк
            `—`, и `int()` не может его превратить.
          try: 'Читай склад модулем csv: `csv.DictReader(f)` понимает кавычки.'
          verify: Ошибка ValueError исчезнет, а «Спицы, 4 мм» придут одной ячейкой.
        - id: no-int
          when:
            errorType: TypeError
            errorIncludes: "'str'"
          why: >-
            Значения из CSV — строки. Со строками `"5" * 2` даёт `"55"`, а вычитать строки Python
            не умеет — отсюда TypeError. Сравнение строк тоже обманчиво: `"12" < "5"` даёт
            `True`, потому что строки сравниваются посимвольно, а `"1"` идёт раньше `"5"`.
          try: 'Превращай остаток и минимум в числа сразу после чтения: `int(row["остаток"])`.'
          verify: Ошибка TypeError исчезнет, и программа дойдёт до записи заказа.
        - id: overwrote-source
          when:
            failedTest: t-src
            codeRegex: 'open\(\s*["'']stock\.csv["'']\s*,\s*(mode\s*=\s*)?["''][wa]'
          why: >-
            Программа записала заказ в `stock.csv` — поверх склада. Режим `"w"` стёр таблицу
            остатков в момент открытия: на компьютере она пропала бы насовсем, и в корзину такой
            файл не попадает.
          try: >-
            Открывай на запись `order.csv`, а `stock.csv` — только на чтение, как в уроке 7.2:
            исходная таблица остаётся целой, результат — в отдельном файле.
          verify: В «Файлах после запуска» изменённым должен оказаться только order.csv.
        - id: wrong-name
          when:
            failedTest: t-exists
            codeRegex: '(?<![\s\S])(?![\s\S]*["'']order\.csv["''])'
          where: Строка, где order.csv открывается на запись
          why: >-
            Файла `order.csv` после запуска нет. Скорее всего, заказ записан под другим именем —
            посмотри в «Файлах после запуска», какой файл создала программа. Поставщик ждёт именно
            `order.csv`.
          try: Назови файл для записи ровно `order.csv` — латиницей, с маленькой буквы.
          verify: Проверка «Файл order.csv создан» станет зелёной.
        - id: manual-join
          when:
            failedTest: t-comma
            codeRegex: '(?<![\s\S])(?![\s\S]*writerow)'
          where: Запись строк заказа
          why: >-
            Строки склеены вручную через запятую. Для «Спицы, 4 мм» это ломает таблицу: запятая
            внутри названия выглядит как граница ячейки, и строка разъезжается на четыре ячейки
            вместо трёх.
          try: >-
            Пиши через `csv.writer(f)` и `writer.writerow([товар, цвет, заказать])` — csv сам
            возьмёт значение с запятой в кавычки.
          verify: 'Строка спиц в order.csv должна стать такой: `"Спицы, 4 мм",—,3`.'
        - id: header-one-cell
          when:
            failedTest: t-header
            codeRegex: 'writerow\(\s*\[\s*f?["''][^"''\n\]]*,[^"''\n\]]*["'']\s*\]\s*\)'
          why: >-
            Заголовки переданы в `writerow` одной строкой внутри списка: `["товар,цвет,заказать"]`
            — это список из **одного** значения. csv записал его в одну ячейку и, увидев внутри
            запятые, взял в кавычки: `"товар,цвет,заказать"`.
          try: 'Сделай каждый заголовок отдельным элементом списка: `writer.writerow(["товар", "цвет", "заказать"])`.'
          verify: Первая строка order.csv станет `товар,цвет,заказать` — без кавычек.
        - id: writerow-string
          when:
            failedTest: t-header
            codeRegex: 'writerow\(\s*f?["'']'
          why: >-
            В `writerow` передана строка, а не список. Строку csv считает набором символов и
            кладёт каждую букву в отдельную ячейку: `т,о,в,а,р,…`.
          try: 'Передай список значений: `writer.writerow(["товар", "цвет", "заказать"])`.'
          verify: Первая строка order.csv станет `товар,цвет,заказать`.
        - id: no-header
          when:
            failedTest: t-header
            codeRegex: '(?<![\s\S])(?![\s\S]*заказать)'
          where: Начало записи order.csv, до цикла
          why: >-
            В первой строке `order.csv` нет заголовков. Без них поставщик не поймёт, что значат
            столбцы, а DictReader у него заберёт под заголовки первую строку заказа.
          try: 'До цикла записи добавь `writer.writerow(["товар", "цвет", "заказать"])`.'
          verify: Первая строка order.csv станет `товар,цвет,заказать`.
        - id: append-mode
          when:
            failedTest: t2
            codeRegex: 'open\(\s*["'']order\.csv["'']\s*,\s*(mode\s*=\s*)?["'']a'
          why: >-
            `order.csv` открыт в режиме `"a"`, и новый заказ дописался в конец прошлого: в файле
            осталась и строка «Мохер» с прошлой недели, и вторая строка заголовков. Поставщик
            привезёт лишнее.
          try: >-
            Открой `order.csv` в режиме `"w"`: он стирает старое содержимое при открытии — здесь
            это ровно то, что нужно.
          verify: В «Файлах после запуска» в order.csv должно остаться четыре строки — заголовки и три товара.
        - id: reopen-in-loop
          when:
            failedTest: t2
            codeRegex: '^([ \t]*)for\b[^\n]*\n(?:(?:\1[ \t]+[^\n]*|[ \t]*)\n)*?\1[ \t]+with open\(\s*["'']order\.csv["'']\s*,\s*(mode\s*=\s*)?["'']w'
          where: Строка, где order.csv открывается на запись
          why: >-
            `order.csv` открывается в режиме `"w"` внутри цикла — заново на каждом его шаге.
            Режим `"w"` стирает файл при каждом открытии, поэтому в заказе остаётся только
            последняя позиция.
          try: >-
            Открой `order.csv` один раз, вне цикла: до чтения склада или после него, когда строки
            заказа уже собраны в список. Цикл по строкам — внутри этого `with`.
          verify: В «Файлах после запуска» в order.csv должно быть три строки товаров, а не одна.
        - id: writerow-all
          when:
            failedTest: t2
            codeRegex: '(\w+)\.append\([\s\S]*\.writerow\(\s*\1\s*\)'
          where: Вызов writerow, которому передан весь список заказа
          why: >-
            `writerow` записывает одну строку таблицы. Весь список заказа стал одной строкой, и
            каждая позиция легла в ячейку целиком, вместе с квадратными скобками.
          try: 'Пиши позиции по одной: `for line in order:` и внутри `writer.writerow(line)`.'
          verify: В «Файлах после запуска» в order.csv должно быть четыре строки — заголовки и три товара.
        - id: formula
          when:
            failedTest: t-amount
            outputIncludes: "В заказе позиций: 3"
          why: >-
            Товары в заказе верные, а число «заказать» другое. По условию это
            `минимум * 2 - остаток`: для синей мериносовой пряжи 5 * 2 - 3 = 7, для хлопка
            4 * 2 - 0 = 8, для спиц 2 * 2 - 1 = 3.
          try: Сверь формулу с условием и посчитай первую строку склада на бумаге.
          verify: В order.csv числа «заказать» станут 7, 8 и 3.
        - id: boundary
          when:
            failedTest: t4
            outputIncludes: "В заказе позиций: 1"
          why: >-
            В заказ попал товар, у которого остаток равен минимуму. По условию заказываем только
            то, чего **меньше** минимума: 4 мотка при минимуме 4 — ещё норма.
          try: Проверь знак сравнения — нужно строгое `<`, как в примере «Что дозаказать».
          verify: 'В граничном случае «всё в наличии» должно стать «В заказе позиций: 0».'
        - id: no-newline-arg
          when:
            failedTest: t-newline
            codeRegex: 'open\((?=[^)]*["''][wa]["''])(?![^)]*newline)'
          why: >-
            Файл для записи открыт без `newline=""`. В тренажёре таблица выглядит верно, но на
            Windows csv и Python вместе поставят двойной перевод строки — и в Excel между
            записями появятся пустые строки.
          try: 'Добавь `newline=""` в `open("order.csv", "w", ...)`.'
          verify: Проверка «Файл для записи открыт с newline=""» станет зелёной.
        - id: no-encoding
          when:
            failedTest: t-enc
            codeRegex: 'open\((?![^)]*encoding)'
          why: >-
            Файл открыт без `encoding`. В тренажёре это незаметно: здесь по умолчанию UTF-8. А на
            русской Windows Python 3.14 и раньше без подсказки использует другую кодировку — русские заголовки
            превратятся в кракозябры или программа упадёт с UnicodeDecodeError.
          try: 'Добавь `encoding="utf-8"` в каждый `open()` — и при чтении, и при записи.'
          verify: Проверка «Кодировка указана» станет зелёной.
      afterPass: >-
        Заказ — отдельный файл, склад цел, а «Спицы, 4 мм» csv сам взял в кавычки. Улучшение — как
        в истории Алёны: если в остатке прочерк, не падай, а выведи `Проверить: <товар>` и
        переходи к следующей строке, как в задании «Сбор на подарок». На компьютере учти:
        русский Excel по двойному щелчку ждёт разделитель `;` и метку UTF-8 в начале файла.
        Файл через запятую он покажет одним столбцом, а без метки — с кракозябрами. Если
        поставщик откроет заказ в Excel, пиши `csv.writer(f, delimiter=";")` и открывай файл с
        `encoding="utf-8-sig"`.
      skills: [files-json, files-paths, conditions]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "CSV — таблица в текстовом файле: строка файла — строка таблицы, первая строка — заголовки, ячейки разделены запятой или `;`."
      - "`csv.DictReader(f)` (для файла с `;` — `delimiter=\";\"`) отдаёт строки словарями по заголовкам и понимает кавычки; все значения — строки, числа превращаем сами через `int()`."
      - "Битую строку пропускаем: `try` вокруг `int()` внутри цикла, в `except ValueError` — сообщение и `continue`."
      - "Записываем через `csv.writer` и `writerow([...])` в отдельный файл — `open(..., \"w\", encoding=\"utf-8\", newline=\"\")`; исходную таблицу не трогаем."
    question: >-
      Программа читает выгрузку из русского Excel через `csv.DictReader(f)` и падает с KeyError
      на `row["сумма"]`, хотя столбец «сумма» в файле точно есть. Почему так и как исправить?
    answer: >-
      Русский Excel разделяет столбцы точкой с запятой, а csv без подсказки ищет запятые. Он не
      нашёл ни одной, и вся первая строка, например `имя;сумма`, стала одним заголовком —
      ключа `сумма` в словаре нет. Исправление — назвать разделитель:
      `csv.DictReader(f, delimiter=";")`. Проверить легко: `print(row)` в цикле покажет, какие
      ключи на самом деле получились.
