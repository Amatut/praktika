          why: >-
            Сообщение напечаталось, но программа пошла дальше и выполнила прибавление. В
            переменной `amount` осталась сумма прошлой строки — 500 Ани, и она прибавилась второй
            раз.
          try: >-
            После сообщения в `except` поставь `continue` — «к следующей строке». Или прибавляй
            прямо внутри `try`: при ошибке прибавление не случится.
          verify: 'В примере «Один „позже“» должно стать «Собрано: 1200».'
        - id: silent-skip
          when:
            outputEquals: "Собрано: 1200"
          why: >-
            Сумма верная, но строка «Борис» пропущена молча. Казначею нужно знать, кому
            напомнить, — ради этого и печатается `Проверить: <имя>`.
          try: 'В `except` перед `continue` напечатай `Проверить:` и имя из `row["имя"]`.'
          verify: 'В примере «Один „позже“» перед итогом появится «Проверить: Борис».'
        - id: no-encoding
          when:
