            import csv

            order = []
            with open("stock.csv", encoding="utf-8", newline="") as f:
                for row in csv.DictReader(f):
                    if int(row["остаток"]) < int(row["минимум"]):
                        amount = int(row["минимум"]) * 2 - int(row["остаток"])
                        order.append({"товар": row["товар"], "цвет": row["цвет"], "заказать": str(amount)})

            with open("order.csv", mode="w", encoding="utf-8", newline="") as f:
                writer = csv.DictWriter(f, fieldnames=["товар", "цвет", "заказать"])
                writer.writeheader()
                for item in order:
                    writer.writerow(item)

            print(f"В заказе позиций: {len(order)}")
