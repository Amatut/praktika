      solution:
        code: |
          import csv

          order = []
          with open("stock.csv", encoding="utf-8", newline="") as f:
              for row in csv.DictReader(f):
                  left = int(row["остаток"])
                  minimum = int(row["минимум"])
                  if left < minimum:
                      order.append([row["товар"], row["цвет"], minimum * 2 - left])

          with open("order.csv", "w", encoding="utf-8", newline="") as f:
              writer = csv.writer(f)
              writer.writerow(["товар", "цвет", "заказать"])
              for line in order:
                  writer.writerow(line)

          print(f"В заказе позиций: {len(order)}")
        explanation: >-
          Программа работает в два шага. Сначала читает склад и складывает в список `order`
          готовые строки заказа — каждая тоже список из трёх значений. Потом один раз открывает
          `order.csv` в режиме `"w"` — прошлый заказ стирается — и пишет заголовки и все строки
          через `writerow`. csv сам ставит запятые, берёт «Спицы, 4 мм» в кавычки и превращает
          числа в текст. Количество позиций — длина списка. `stock.csv` открывается только на
          чтение, поэтому остаётся целым.
