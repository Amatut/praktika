          why: >-
            В ответе весь путь, например `library/books.txt`, а нужно только имя файла. К тому же на
            Windows путь напечатается через `\` — ответ будет зависеть от компьютера.
          try: Печатай имя из ввода или `path.name` — имя без папок.
          verify: "«Пример 1» должен вывести «Файл books.txt, строк: 4»."
        - id: space-before-comma
