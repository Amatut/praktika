id: m7-l2
module: m7
number: "7.2"
title: Пути и учебная папка
objective: >-
  Строить пути к файлам через pathlib, проверять, есть ли файл, понимать, от какой папки считается
  относительный путь, перебирать файлы папки и записывать результат в новый файл, не трогая
  исходный.
minutes: [25, 30]
prerequisites: [m7-l1]
skills: [files-paths]
environment: python

story:
  title: Файл, которого «нет»
  fictional: true
  text: >-
    Вера Павловна ведёт в школьной библиотеке список выданных книг в текстовом файле.
    Девятиклассник Дима, её помощник, написал программу, которая наводит в списке порядок: дома
    всё работало, а на библиотечном компьютере программа заявила, что файла нет, хотя он лежал
    рядом с ней. Оказалось, программу запускали из другой папки, и Python искал
    файл там. А во время проверки Дима чуть не записал пустой список поверх настоящего — с тех пор
    он пробует программы только на копиях, в отдельной учебной папке.

why: >-
  Программа ищет файл не «где-нибудь на компьютере», а по пути — адресу из папок и имени файла.
  Например, `library/books.txt` значит: «в текущей папке есть папка library, а в ней — файл
  books.txt».

usedIn: >-
  Скрипты автоматизации: разложить фотографии по папкам, собрать отчёт из десятка файлов,
  переименовать выгрузки. Программы, которые загружают настройки и шаблоны из папки рядом с собой.
  Обработка выгрузок из учётных программ и резервные копии.

steps:
  - id: paths
    type: theory
    title: Путь — адрес файла
    body: |-
      В уроке 7.1 файл лежал рядом с программой, и хватало имени: `open("runs.txt", …)`. Но обычно
      файлы разложены по папкам, и программе нужен **путь** — адрес файла: цепочка папок и имя
      файла в конце.

      - **Абсолютный путь** начинается от диска: `C:\Users\Anya\Documents\books.txt` (на macOS и
        Linux — от корня `/`: `/Users/anya/books.txt`). Он работает, откуда бы ни запустили
        программу, но на другом компьютере такой папки может не оказаться.
      - **Относительный путь**, например `library/books.txt`, считается от **текущей папки** —
        той, из которой запустили программу. В терминале её путь виден слева от курсора
        (урок 0.4). Две точки `..` означают «папка на уровень выше».

      Главная ловушка: относительный путь считается **от текущей папки, а не от папки с
      программой**. Запустили программу из другой папки — и она «не видит» файл, который лежит
      рядом с ней.

      **Модуль pathlib.** Для работы с путями в Python есть модуль `pathlib`. Подключаем его так:

      ```python
      from pathlib import Path
      ```

      Это форма `from … import …` из урока 3.5: берём из модуля одно имя — `Path` — и пишем его без
      приставки.

      `Path("library")` — путь к папке. Знак `/` приклеивает к пути следующую часть:
      `Path("library") / "books.txt"`. Разделитель Python подставит сам: на Windows это `\`, на
      macOS, Linux и в тренажёре — `/`.

      У пути есть части:

      ```text
      books = Path("library") / "books.txt"
      books.name    →  books.txt    имя целиком
      books.stem    →  books        имя без расширения
      books.suffix  →  .txt         расширение
      books.parent  →  library      папка, где лежит файл
      ```

      Две проверки: `books.exists()` отвечает `True`, если по пути что-то есть, а
      `books.is_file()` — только если там именно **файл**, а не папка.

      Чтение и запись одной командой: `books.read_text(encoding="utf-8")` открывает файл, читает
      весь текст и закрывает его, а `books.write_text(текст, encoding="utf-8")` записывает текст и,
      как режим `"w"`, стирает старый. Функция `open()` тоже принимает путь:
      `open(books, encoding="utf-8")`.

      `read_text()` возвращает весь текст одной строкой. Метод строки `splitlines()` делит её на
      список строк и убирает `\n`: `"Дюна\nХоббит\n".splitlines()` даёт `['Дюна', 'Хоббит']`.

      **Как устроен урок:** теория и три задания в тренажёре — около получаса. Последний шаг — на
      твоём компьютере, минут на 5–10, его можно сделать отдельным заходом.
    simpler: >-
      Путь — это адрес: «папка library, в ней файл books.txt». Относительный адрес считается от
      того места, где ты стоишь, — от текущей папки, а не от папки с программой. `Path` собирает
      адрес из частей знаком `/` и отвечает на вопросы: как зовут файл, какое у него расширение,
      есть ли он на самом деле.
    coach: >-
      Когда программа «не видит» файл, который точно есть, первый вопрос: из какой папки её
      запустили?

  - id: library
    type: example
    title: Есть ли список книг?
    body: >-
      Список книг лежит в папке `library` — открой блок «Файлы задания», чтобы его увидеть.
      Программа собирает путь, показывает его части и читает файл, только если он есть.
    code: |-
      from pathlib import Path

      folder = Path("library")
      books = folder / "books.txt"
      print(books.name, books.suffix)
      if books.is_file():
          text = books.read_text(encoding="utf-8")
          print("Строк в файле:", len(text.splitlines()))
      else:
          print("Нет файла", books.name)
    files:
      library/books.txt: "Дюна\nСолярис\nХоббит\nМастер и Маргарита\n"
    notes:
      - line: 1
        text: Из модуля pathlib берём одно имя — `Path`.
      - line: 3
        text: >-
          `Path("library")` — только адрес папки. Сама по себе эта строка ничего не создаёт и не
          проверяет.
      - line: 4
        text: Знак `/` приклеивает имя файла — получается путь `library/books.txt`.
      - line: 5
        text: Части пути — `.name`, имя целиком, и `.suffix`, расширение. Файл для этого не нужен.
      - line: 6
        text: >-
          Проверка до чтения: `is_file()` отвечает `True`, только если по пути лежит файл.
          `exists()` сказал бы `True` и для папки.
      - line: 7
        text: '`read_text` открывает файл, читает весь текст и закрывает его — `with` не нужен.'
      - line: 8
        text: '`splitlines()` делит текст на список строк без `\n`, а `len` считает, сколько их.'
    tryIt: >-
      Замени `"books.txt"` на `"readers.txt"` и запусти — сработает ветка `else`: такого файла в
      папке нет. Потом верни `books.txt` и добавь строку `print(books.stem, books.parent)` —
      посмотри на остальные части пути.

  - id: other-folder
    type: predict
    title: Запуск из другой папки
    prompt: >-
      В текущей папке лежат файл `books.txt` и папка `archive`. Команда `os.chdir("archive")`
      делает то же, что `cd archive` в терминале: меняет текущую папку. Здесь она только изображает
      запуск программы из другой папки — в своих программах мы её не используем. Как думаешь, что
      выведет программа?
    code: |-
      import os
      from pathlib import Path

      print(Path("books.txt").exists())
      os.chdir("archive")  # как команда cd archive в терминале
      print(Path("books.txt").exists())
      print(Path("../books.txt").exists())
    files:
      books.txt: "Дюна\nСолярис\n"
      archive/2025.txt: "Хоббит\n"
    options:
      - |-
        True
        True
        True
      - |-
        True
        False
        True
      - |-
        True
        False
        False
    answer: |-
      True
      False
      True
    explanation: |-
      Файл никуда не делся — изменилась текущая папка. В первый раз Python ищет `books.txt` в
      текущей папке и находит. После «cd archive» тот же относительный путь означает
      `archive/books.txt`, а такого файла нет. `../books.txt` — «подняться на папку выше и взять
      books.txt» — снова находит. Ровно это случилось с программой Димы: её запустили из другой
      папки.

      Выход — строить путь от папки самой программы. В переменной `__file__` Python хранит путь к
      файлу программы, поэтому `Path(__file__).parent / "books.txt"` найдёт файл рядом с ней,
      откуда бы её ни запустили. Попробуешь это на компьютере в последнем шаге урока.
    coach: >-
      Относительный путь — как «третья дверь налево»: куда он приведёт, зависит от того, где ты
      стоишь.

  - id: practice-exists
    type: exercise
    title: Практика 1
    exercise:
      id: m7-l2-e1
      kind: repeat
      title: Есть ли такой файл?
      statement: |-
        В папке `library` лежат файлы библиотеки — их видно в блоке «Файлы задания». Вера
        Павловна вводит имя файла, а программа отвечает, есть ли такой файл в папке `library` и
        сколько в нём строк.

        Если файл есть:

        ```text
        Файл books.txt, строк: 4
        ```

        Если файла нет:

        ```text
        Нет файла journal.txt в папке library
        ```

        Пробелы по краям имени убери. Папка — не файл: если так называется папка, ответ тоже
        «Нет файла…».
      input: Одна строка — имя файла, например `books.txt`.
      output: "Одна строка: `Файл <имя>, строк: N` или `Нет файла <имя> в папке library`."
      constraints:
        - Файл ищи только в папке `library`.
        - Пустой файл — тоже файл, строк в нём 0.
        - Читай файлы с `encoding="utf-8"`.
      files:
        library/books.txt: "Дюна\nСолярис\nХоббит\nМастер и Маргарита\n"
        library/readers.txt: "Аня\nБорис\nВика"
        library/empty.txt: ""
        library/archive/2025.txt: "Дюна\nХоббит\n"
      starterCode: |
        from pathlib import Path

        name = input("Имя файла: ")
        # Собери путь к файлу name в папке library
        # Если это файл — выведи «Файл …, строк: …», иначе — «Нет файла … в папке library»
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "books.txt\n"
          expected: "Файл books.txt, строк: 4"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: "Пример 2: такого файла нет"
          example: true
          stdin: "journal.txt\n"
          expected: Нет файла journal.txt в папке library
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: последняя строка без перевода строки"
          edge: true
          stdin: "readers.txt\n"
          expected: "Файл readers.txt, строк: 3"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: пустой файл"
          edge: true
          stdin: "empty.txt\n"
          expected: "Файл empty.txt, строк: 0"
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: "Граничный случай: пробелы вокруг имени"
          edge: true
          stdin: "  books.txt  \n"
          expected: "Файл books.txt, строк: 4"
          compare:
            ignoreSpaces: true
        - id: t6
          kind: io
          title: "Граничный случай: так называется папка"
          edge: true
          stdin: "archive\n"
          expected: Нет файла archive в папке library
          compare:
            ignoreSpaces: true
        - id: t7
          kind: io
          title: "Граничный случай: main.py есть в текущей папке, но не в library"
          edge: true
          stdin: "main.py\n"
          expected: Нет файла main.py в папке library
          compare:
            ignoreSpaces: true
        - id: t-enc
          kind: assert
          title: Кодировка указана
          stdin: "books.txt\n"
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            # read_text("utf-8") и write_text(текст, "utf-8") — кодировка без имени, тоже верно
            positional = {"read_text": 1, "write_text": 2}
            for node in ast.walk(ast.parse(source)):
                if isinstance(node, ast.Call):
                    name = getattr(node.func, "id", None) or getattr(node.func, "attr", None)
                    if name in names:
                        by_position = len(node.args) >= positional.get(name, 4)
                        assert by_position or any(keyword.arg == "encoding" for keyword in node.keywords)
          message: >-
            В одном из `open()`, `read_text()` или `write_text()` не указана кодировка. Добавь
            `encoding="utf-8"` — иначе на Windows со старым Python (до 3.15) русский текст
            превратится в кракозябры.
      criteria:
        - Путь строится из папки `library` и введённого имени, пробелы по краям имени убраны.
        - Файл читается только после проверки, что по пути лежит именно файл; для папки и несуществующего имени — «Нет файла…».
        - Строки считаются как строки текста — пустой файл даёт 0, последняя строка без `\n` тоже считается.
        - Кодировка при чтении указана.
      hints:
        - >-
          Посмотри на пример «Есть ли список книг?»: там путь собирается из папки и имени файла, а
          читается файл только после проверки. Здесь то же самое, только имя приходит из ввода.
          Какая из двух проверок пути не спутает файл с папкой?
        - |-
          Тот же приём на другой папке:
          ```python
          photo = Path("photos") / "sea.jpg"
          if photo.is_file():
              print("Есть фото", photo.name)
          else:
              print("Нет фото", photo.name)
          ```
          А число строк текста — это `len(текст.splitlines())`.
        - |-
          Каркас:
          ```text
          name = input(…).strip()
          path = Path("library") / name
          if по пути лежит файл:
              text = прочитать path с encoding="utf-8"
              print(f"Файл {name}, строк: {…}")
          else:
              print(f"Нет файла {name} в папке library")
          ```
      solution:
        code: |
          from pathlib import Path

          name = input("Имя файла: ").strip()
          path = Path("library") / name
          if path.is_file():
              text = path.read_text(encoding="utf-8")
              print(f"Файл {name}, строк: {len(text.splitlines())}")
          else:
              print(f"Нет файла {name} в папке library")
        explanation: >-
          `strip()` убирает пробелы по краям имени. `Path("library") / name` строит путь внутри
          папки library — от текущей папки, где запущена программа. `is_file()` отвечает `True`
          только для файла, поэтому папка archive и несуществующие имена попадают в `else`, а
          `read_text` вызывается только для настоящего файла. `splitlines()` делит текст на строки:
          у пустого файла их 0, а последняя строка без `\n` тоже считается.
      altSolutions:
        - code: |
            from pathlib import Path

            name = input().strip()
            path = Path("library") / name
            if path.is_file():
                count = 0
                with open(path, encoding="utf-8") as f:
                    for line in f:
                        count += 1
                print("Файл " + name + ", строк: " + str(count))
            else:
                print("Нет файла", name, "в папке library")
          note: Подсчёт строк циклом по файлу из урока 7.1, вывод склейкой и через запятые.
        - code: |
            from pathlib import Path

            name = input()
            name = name.strip()
            path = Path("library/" + name)
            if not path.is_file():
                print(f"Нет файла {path.name} в папке library")
            else:
                lines = path.read_text(encoding="utf-8").splitlines()
                print("Файл", name + ",", "строк:", len(lines))
          note: Путь склеен строкой с «/», проверка через not, имя из path.name.
        - code: |
            from pathlib import Path

            folder = Path("library")
            name = input("Имя файла: ").strip()
            path = folder / name
            if path.exists() and path.is_file():
                text = path.read_text(encoding="utf-8")
                lines = text.splitlines()
                print(f"Файл {path.name}, строк: {len(lines)}")
            else:
                print(f"Нет файла {name} в папке {folder.name}")
          note: Две проверки подряд и имя папки из folder.name.
        - code: |
            from pathlib import Path

            name = input().strip()
            path = Path("library", name)
            if path.is_file():
                text = path.read_text("utf-8")
                print(f"Файл {name}, строк: {len(text.splitlines())}")
            else:
                print(f"Нет файла {name} в папке library")
          note: Path из двух частей и кодировка без имени аргумента — read_text("utf-8").
      wrongSolutions:
        - code: |
            from pathlib import Path

            name = input().strip()
            path = "library" / name
            if path.is_file():
                text = path.read_text(encoding="utf-8")
                print(f"Файл {name}, строк: {len(text.splitlines())}")
            else:
                print(f"Нет файла {name} в папке library")
          note: Знак / между двумя строками — Path забыт, TypeError.
          expectMistake: str-slash
        - code: |
            from pathlib import Path

            name = input().strip()
            path = Path("library") / name
            text = path.read_text(encoding="utf-8")
            if path.is_file():
                print(f"Файл {name}, строк: {len(text.splitlines())}")
            else:
                print(f"Нет файла {name} в папке library")
          note: Файл читается до проверки — на несуществующем имени FileNotFoundError.
          expectMistake: read-before-check
        - code: |
            from pathlib import Path

            name = input().strip()
            path = Path("library") / name
            if path.exists():
                text = path.read_text(encoding="utf-8")
                print(f"Файл {name}, строк: {len(text.splitlines())}")
            else:
                print(f"Нет файла {name} в папке library")
          note: exists() вместо is_file() — папку archive пытается прочитать как файл.
          expectMistake: exists-folder
        - code: |
            from pathlib import Path

            name = input().strip()
            path = Path("library" + name)
            if path.is_file():
                text = path.read_text(encoding="utf-8")
                print(f"Файл {name}, строк: {len(text.splitlines())}")
            else:
                print(f"Нет файла {name} в папке library")
          note: Строки склеены через + без разделителя — librarybooks.txt.
          expectMistake: plus-not-slash
        - code: |
            from pathlib import Path

            name = input().strip()
            path = Path(name)
            if path.is_file():
                text = path.read_text(encoding="utf-8")
                print(f"Файл {name}, строк: {len(text.splitlines())}")
            else:
                print(f"Нет файла {name} в папке library")
          note: Путь без папки — файл ищется в текущей папке.
          expectMistake: no-folder
        - code: |
            from pathlib import Path

            name = input().strip()
            path = Path("library") / name
            if path.is_file():
                text = path.read_text(encoding="utf-8")
                print(f"Файл {name}, строк: {len(text)}")
            else:
                print(f"Нет файла {name} в папке library")
          note: len(text) считает символы, а не строки.
          expectMistake: chars-count
        - code: |
            from pathlib import Path

            name = input().strip()
            path = Path("library") / name
            if path.is_file():
                text = path.read_text(encoding="utf-8")
                print(f"Файл {name}, строк: {len(text.split())}")
            else:
                print(f"Нет файла {name} в папке library")
          note: split() режет по пробелам — «Мастер и Маргарита» считается за три.
