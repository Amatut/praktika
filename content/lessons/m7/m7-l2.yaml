            macOS и Linux, различает строчные и заглавные буквы. На Windows программа сработала бы —
            и сломалась бы у друга с другим компьютером.
          try: Перебирай все файлы через `iterdir()` и сравнивай `path.suffix.lower()` с `".mp3"`.
        - id: suffix-case
          when:
            outputEquals: |-
              - Ветер
              Песен: 1
          where: Проверка расширения
          why: >-
            Песни `Дождь.MP3` и `Ночь.Mp3` потерялись: у них в расширении заглавные буквы, а
            сравнение `==` различает строчные и заглавные.
          try: 'Приведи расширение к строчным перед сравнением: `path.suffix.lower() == ".mp3"`.'
        - id: two-cases
          when:
            outputEquals: |-
              - Ветер
              - Дождь
              Песен: 2
          where: Проверка расширения
          why: >-
            Песня `Ночь.Mp3` потерялась: два сравнения — с `".mp3"` и с `".MP3"` — покрывают не все
            варианты. Бывают ещё `.Mp3` и `.mP3`.
          try: 'Замени оба сравнения одним: `path.suffix.lower() == ".mp3"` — оно подходит для любого регистра.'
        - id: name-contains
          when:
            outputIncludes: Вальс
          where: Проверка, песня ли это
          why: >-
            В список попал файл, у которого mp3 есть в имени, но расширение другое: `mp3.txt` или
            недокачанный `Вальс.mp3.part`. Проверка «mp3 есть в имени» — даже с точкой —
            срабатывает на любое имя, где встречаются эти буквы. А песня — это файл, у которого
            `.mp3` именно расширение, конец имени.
          try: 'Проверяй расширение: `path.suffix.lower() == ".mp3"`.'
        - id: with-suffix
          when:
            outputIncludes: .mp3
          where: Строка с `print` названия
          why: В списке названия вместе с расширением. `.name` — имя целиком, а имя без расширения — `.stem`.
          try: Печатай `path.stem`.
        - id: sorted-lost
          when:
            codeRegex: '^\s*sorted\('
            outputEquals: |-
              - Лето
              - Весна
              - Зима
              Песен: 3
          where: Строка `sorted(...)`
          why: >-
            `sorted()` вернул новый упорядоченный список, но его никуда не сохранили — он тут же
            потерялся, а старый список остался в прежнем порядке.
          try: 'Перебирай сам результат: `for song in sorted(songs):` — или сохрани его: `songs = sorted(songs)`.'
        - id: unsorted
          when:
            outputEquals: |-
              - Лето
              - Весна
              - Зима
              Песен: 3
          where: Строка с `for`
          why: >-
            Названия идут в том порядке, в каком их выдала папка, а он не обязан быть алфавитным: в
            тренажёре — в порядке создания файлов, на другом компьютере — иначе.
          try: >-
            Оберни перебор в `sorted()`: `for path in sorted(Path("music").iterdir()):` — или
            собери названия в список и выведи `sorted(список)`.
        - id: always-true
          when:
            outputIncludes: "- обложка"
          where: Проверка, песня ли это
          why: >-
            В список попали обложка и текст песни — условие пропускает любой файл. Частая причина —
            `path.suffix == ".mp3" or ".MP3"`: вторая половина — просто непустая строка, а она
            всегда считается истинной (ловушка из урока 2.4).
          try: 'Оставь одно сравнение: `path.suffix.lower() == ".mp3"`.'
        - id: counted-all
          when:
            outputIncludes: "Песен: 5"
          where: Подсчёт песен
          why: >-
            Посчитаны все файлы папки — вместе с обложкой и текстом песни. Счётчик должен расти
            только для песен.
          try: >-
            Считай только песни: `count += 1` — внутри `if`, рядом с `print` названия. Если берёшь
            длину списка, в нём должны быть только песни, а не все файлы папки.
      afterPass: >-
        Программа не зависит ни от регистра расширения, ни от порядка файлов в папке — на настоящих
        компьютерах это частые сюрпризы. Улучшение: в конце выводить ещё и число прочих файлов,
        например `Других файлов: 2`.
      skills: [files-paths, accumulators, string-methods]

  - id: on-computer
    type: checklist
    title: Пути на твоём компьютере
    body: |-
      На компьютере текущая папка зависит от того, откуда запущена программа, — проверим это
      сами. Новая команда одна: `Path.cwd()` — текущая папка (cwd — current working directory,
      «текущая рабочая папка»). А `Path(__file__).parent` — папка самой программы, как в
      объяснении к прогнозу «Запуск из другой папки».

      Инструкция написана для Windows; отличия для macOS и Linux — в «Если не получается». На всё
      нужно минут 5–10, и это можно сделать отдельным заходом.
    items:
      - id: folder
        text: >-
          **Заведи папку для модуля.** В учебной папке `python-practice` из урока 0.4 создай папку
          `m7`, а в ней — папку `data`.
        help: >-
          Правый щелчок по пустому месту в папке → «Создать» → «Папку» (на macOS — «Новая папка»).
          Имена — латиницей и без пробелов: их проще набирать в терминале.
      - id: copies
        text: >-
          **Положи в `data` копию.** Скопируй туда какой-нибудь свой текстовый файл или создай в
          Блокноте файл `notes.txt` с парой строк по-русски.
        help: >-
          Копия — это Ctrl+C и Ctrl+V (на macOS — Cmd+C и Cmd+V): оригинал остаётся на месте.
          Перетаскивание мышью в другую папку на том же диске **перемещает** файл, а не копирует
          его. Сохраняя файл в Блокноте, проверь, что в окне сохранения выбрана кодировка UTF-8.
          Экспериментируй только на копиях — никогда на фотографиях, документах и таблицах, которые
          тебе нужны.
      - id: where
        text: |-
          **Где запущена программа?** Создай в папке `m7` файл `where.py`:

          ```python
          from pathlib import Path

          print("Текущая папка:", Path.cwd())
          print("Папка программы:", Path(__file__).parent)
          data = Path("data")
          print("data найдена:", data.exists())
          ```

          Открой терминал в папке `m7` и запусти `python where.py`. Обе папки совпадут, а последней
          строкой будет `data найдена: True`.
        help: >-
          Как открыть терминал в нужной папке и что делать, если команда `python` не работает, —
          в уроке 0.4, пункты «Открой терминал в учебной папке» и «Проверь установку». Сработала
          только `py` — пиши `py where.py`. На macOS и Linux — `python3 where.py`.
      - id: parent-folder
        text: >-
          **Запусти из другой папки.** В том же терминале перейди на папку выше командой `cd ..` и
          запусти программу оттуда: `python m7\where.py`. Текущая папка стала другой, и программа
          пишет `data найдена: False`, хотя папка `data` на месте. Это та самая ошибка из истории
          Димы.
        help: >-
          `cd ..` — «перейти на уровень выше»: путь слева от курсора станет короче на одну папку.
          На macOS и Linux путь пишется через `/`: `python3 m7/where.py`.
      - id: fix
        text: >-
          **Почини путь.** Замени строку `data = Path("data")` на
          `data = Path(__file__).parent / "data"`, сохрани файл и запусти программу из обеих папок:
          из `python-practice` — `python m7\where.py`, из `m7` — `cd m7`, затем `python where.py`.
          Оба раза в конце будет `data найдена: True`.
        help: >-
          Вывод не изменился — проверь, сохранён ли файл: терминал запускает то, что записано на
          диске (урок 0.4). Если захочешь записать в коде путь целиком, помни: в обычной строке
          обратная косая черта — особый знак, и `"C:\Users\…"` даёт ошибку SyntaxError из-за
          сочетания `\U`. Пиши `r"C:\Users\…"` — с буквой r перед кавычкой — или собирай путь через
          `Path` и `/`.
    coach: >-
      Этот шаг не проверяется автоматически — отмечай пункты по результату. Его можно пройти в
      другой день: задания в тренажёре от него не зависят.

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Относительный путь считается от текущей папки — той, откуда запустили программу, а не от папки, где она лежит.
      - "`Path(\"library\") / \"books.txt\"` собирает путь; у пути есть `.name`, `.stem`, `.suffix`, `.parent`, а `is_file()` проверяет, что это файл, до чтения."
      - "`read_text` и `write_text` с `encoding=\"utf-8\"` читают и пишут файл одной командой; `splitlines()` делит текст на строки, `sorted()` возвращает новый упорядоченный список."
      - Файлы папки перебирает `sorted(папка.iterdir())`, тип файла подскажет `suffix.lower()`. Программы, которые пишут файлы, пробуем на копиях в учебной папке, а результат кладём в новый файл.
    question: >-
      Программа Димы читает `Path("data") / "notes.txt"`. Запущенная из своей папки, она работает,
      а из папки выше пишет, что файла нет. Почему так и как сделать, чтобы она находила файл,
      откуда бы её ни запустили?
    answer: >-
      Путь `data/notes.txt` относительный: Python ищет его от текущей папки, а в папке уровнем
      выше никакой папки `data` нет. Если строить путь от папки самой программы —
      `Path(__file__).parent / "data" / "notes.txt"`, — он не зависит от того, откуда программу
      запустили.
