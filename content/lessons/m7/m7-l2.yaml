            outputIncludes: Нет файла books.txt
          where: Строка, где собирается путь
          why: >-
            `"library" + name` склеивает строки как есть, без разделителя: получается
            `librarybooks.txt`, а такого файла нет. Знак `/` у Path ставит между частями пути
            разделитель сам.
          try: 'Собери путь так: `Path("library") / name`.'
          verify: "«Пример 1» должен вывести «Файл books.txt, строк: 4»."
