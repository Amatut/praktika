      solution:
        code: |
          from pathlib import Path

          folder = Path("library")
          books = folder / "books.txt"
          titles = books.read_text(encoding="utf-8").splitlines()
          ordered = sorted(titles)
          result = folder / "sorted.txt"
          result.write_text("\n".join(ordered) + "\n", encoding="utf-8")
          print("Записано книг:", len(ordered))
        explanation: >-
          `sorted(titles)` возвращает новый список по алфавиту, а `titles` остаётся как был.
          `"\n".join(ordered)` собирает из списка текст: между названиями встают переводы строк, а
          `+ "\n"` завершает последнюю строку, как принято в текстовых файлах. Путь
          `folder / "sorted.txt"` ведёт в ту же папку library, но к новому файлу, поэтому books.txt
          не меняется.
