          where: Строка с `print` для найденного файла
          why: >-
            Перед запятой лишний пробел. Когда значения в `print` перечислены через запятую, Python
            ставит между ними пробел — и перед отдельной строкой `", строк:"` тоже.
          try: 'Собери строку целиком через f-строку: `f"Файл {name}, строк: {…}"` — или приклей запятую к имени: `name + ","`.'
        - id: count-newlines
          when:
            outputIncludes: "readers.txt, строк: 2"
          why: >-
            Похоже, строки посчитаны по переводам строки `\n`. Но в конце readers.txt перевода строки
            нет, и последняя строка «Вика» не посчитана.
          try: 'Считай сами строки: `len(text.splitlines())` — `splitlines()` учитывает и последнюю строку без `\n`.'
          verify: Граничный случай «последняя строка без перевода строки» должен вывести 3 строки.
        - id: split-lines
          when:
            codeRegex: '\.split\('
            outputIncludes: "строк: "
          why: >-
            `split` делит текст не на строки. `split()` без аргумента режет по пробелам, и «Мастер и
            Маргарита» превращается в три части. Деление по `"\n"` оставляет лишний пустой
            элемент: у пустого файла получается `['']` — одна «строка» вместо нуля.
          try: 'Используй `splitlines()`: он делит текст именно на строки и лишних элементов не даёт.'
        - id: no-strip
          when:
            failedTest: t5
            outputIncludes: Нет файла
          where: Строка с `input()`
          why: >-
            Пробелы вокруг имени попали в путь: программа ищет файл «  books.txt  » — с пробелами
            в имени, а такого файла нет. Если `strip()` стоит только в `print`, путь всё равно
            собран из имени с пробелами.
          try: >-
            Убери пробелы сразу при вводе: `name = input().strip()` — тогда и путь, и ответ получат
            чистое имя.
          verify: 'Граничный случай «пробелы вокруг имени» должен вывести «Файл books.txt, строк: 4».'
        - id: no-strip-print
          when:
            failedTest: t5
            outputIncludes: "  books.txt"
          where: Строки с `input()` и `print`
          why: >-
            Файл нашёлся, но в ответ попало имя с пробелами. `name.strip()` возвращает новую строку
            и не меняет саму переменную `name`.
          try: >-
            Убери пробелы один раз, сразу при вводе: `name = input().strip()` — тогда и путь, и
            ответ получат чистое имя.
          verify: 'Граничный случай «пробелы вокруг имени» должен вывести «Файл books.txt, строк: 4».'
        - id: no-encoding
          when:
            failedTest: t-enc
            outputIncludes: "строк:"
          where: Вызов `read_text` или `open`
          why: >-
            Кодировка не указана. В тренажёре текст всё равно прочитался, а на Windows Python 3.14 и
            раньше без подсказки читает файлы в другой кодировке — и русский текст превращается в кракозябры
            или в ошибку UnicodeDecodeError.
          try: Добавь `encoding="utf-8"` в `read_text(...)` или `open(...)`.
      afterPass: >-
        Программа ищет файл по точному адресу и не путает файл с папкой. Можно улучшить сообщение
        для пустого ввода: сейчас программа ответит «Нет файла  в папке library» — путь стал просто
        `library`, а это папка. Понятнее было бы «Введи имя файла».
      skills: [files-paths, conditions, string-methods]

  - id: copies
    type: theory
    title: Учебная папка, копии и sorted()
    body: |-
      **Правило учебной папки.** Программа, которая записывает файлы, может ошибиться, и эта ошибка
      дорогая: `write_text` и режим `"w"` стирают старое содержимое мгновенно, а в корзину оно не
      попадает. Поэтому новые программы, которые пишут файлы, сначала запускают в отдельной
      учебной папке на **копиях** данных, а не на оригиналах.

      Второе правило знакомо по уроку 7.1 — **результат в новый файл**. Программа читает
      `books.txt`, а пишет в `sorted.txt`. Если результат вышел не таким, исходник цел: поправил
      код и запустил снова.

      **sorted().** Навести порядок помогает встроенная функция `sorted()`. Она получает список
      (или другой набор значений) и возвращает **новый** список, упорядоченный по возрастанию:
      числа — от меньшего к большему, строки — по алфавиту. Старый список при этом не меняется —
      та же идея, что с копиями:

      ```python
      titles = ["Хоббит", "Дюна", "Солярис"]
      ordered = sorted(titles)
      print(ordered)   # ['Дюна', 'Солярис', 'Хоббит']
      print(titles)    # ['Хоббит', 'Дюна', 'Солярис']
      ```

      Поэтому строка `sorted(titles)` без присваивания ничего не даёт: новый список создан и тут
      же потерян. Сохрани его в переменную или сразу используй.

      Строки `sorted()` сравнивает по кодам букв: заглавные идут раньше строчных, строчная «ё» —
      после «я», а заглавная «Ё» — даже раньше «А». Для названий с заглавной буквы и без «ё»
      получается обычный алфавит.

      Чтобы записать список в файл, собери его в один текст знакомым `join`:
      `"\n".join(ordered)` ставит перевод строки между элементами.
    simpler: >-
      Пробуй на копии и пиши результат в новый файл — тогда ошибка программы стоит пару минут, а
      не потерянных данных. `sorted(список)` — «дай мне этот список по порядку»: он отдаёт новый
      список, а старый не трогает.
    coach: >-
      Перед запуском программы, которая пишет файлы, спроси себя: что пропадёт, если она
      ошибётся? Если что-то важное — работай на копии.

  - id: practice-sorted
    type: exercise
    title: Практика 2
    exercise:
      id: m7-l2-e2
      kind: modify
      title: Список по алфавиту
      statement: |-
        Это программа Димы из истории. Сейчас она читает список книг `library/books.txt` и
        печатает, сколько в нём названий. Измени её:

        1. Запиши те же названия **по алфавиту** в новый файл `sorted.txt` в той же папке
           `library` — по одному названию на строку.
        2. Вместо строки «Книг в списке: …» выведи `Записано книг: N`.

        Файл `books.txt` не меняй: результат — только в новый файл. Программу будут запускать не
        раз: если `sorted.txt` остался от прошлого запуска, запиши его заново.

        Для списка из блока «Файлы задания» программа выводит:

        ```text
        Записано книг: 4
        ```

        А в файле `library/sorted.txt` оказываются строки:

        ```text
        Дюна
        Мастер и Маргарита
        Солярис
        Хоббит
        ```

        Что программа записала, видно под выводом в блоке «Файлы после запуска».
      input: Ввода нет. Данные — файл `library/books.txt`, по одному названию на строку.
      output: "Строка `Записано книг: N` и новый файл `library/sorted.txt` с названиями по алфавиту."
      constraints:
        - "`books.txt` после запуска остаётся прежним."
        - Названия начинаются с заглавной буквы и без «ё» — `sorted()` расставит их по алфавиту.
        - Записывай файл с `encoding="utf-8"`.
      files:
        library/books.txt: "Дюна\nСолярис\nХоббит\nМастер и Маргарита\n"
      starterCode: |
        from pathlib import Path

        folder = Path("library")
        books = folder / "books.txt"
        titles = books.read_text(encoding="utf-8").splitlines()
        print("Книг в списке:", len(titles))
      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: "Записано книг: 4"
          compare:
            ignoreSpaces: true
        - id: t-file
          kind: assert
          title: Файл sorted.txt создан в папке library
          example: true
          code: |
            import os

            assert os.path.isfile("library/sorted.txt")
          message: В папке library появляется новый файл sorted.txt.
        - id: t-lines
          kind: assert
          title: Каждое название — на своей строке
          code: |
            import os

            assert os.path.isfile("library/sorted.txt")
            lines = open("library/sorted.txt", encoding="utf-8").read().splitlines()
            assert len(lines) == 4
            assert "" not in lines
          message: В sorted.txt столько строк, сколько книг в списке, — по одному названию на строку, без пустых строк.
        - id: t-order
          kind: assert
          title: Названия по алфавиту
          example: true
          code: |
            import os

            assert os.path.isfile("library/sorted.txt")
            lines = open("library/sorted.txt", encoding="utf-8").read().splitlines()
            assert lines == ["Дюна", "Мастер и Маргарита", "Солярис", "Хоббит"]
          message: В sorted.txt — те же названия, что в books.txt, но по алфавиту.
        - id: t-src
          kind: assert
          title: Исходный список не изменился
          code: |
            text = open("library/books.txt", encoding="utf-8").read()
            assert text == "Дюна\nСолярис\nХоббит\nМастер и Маргарита\n"
          message: Файл books.txt остаётся как был — результат записывается только в новый файл.
        - id: t2
          kind: io
          title: Другой список
          files:
            library/books.txt: "Обломов\nВий\nХоббит\nАнна Каренина\nГамлет\n"
          expected: "Записано книг: 5"
          compare:
            ignoreSpaces: true
        - id: t3
          kind: assert
          title: Другой список по алфавиту
          files:
            library/books.txt: "Обломов\nВий\nХоббит\nАнна Каренина\nГамлет\n"
          code: |
            import os

            assert os.path.isfile("library/sorted.txt")
            lines = open("library/sorted.txt", encoding="utf-8").read().splitlines()
            assert lines == ["Анна Каренина", "Вий", "Гамлет", "Обломов", "Хоббит"]
          message: Для другого списка в sorted.txt тоже названия по алфавиту.
        - id: t4
          kind: io
          title: "Граничный случай: одна книга без перевода строки"
