  - id: folder
    type: theory
    title: Все файлы папки
    body: |-
      Чтобы перебрать все файлы папки, у пути есть метод `iterdir()`:

      ```python
      for path in Path("music").iterdir():
          print(path.name)
      ```

      Он выдаёт по очереди всё, что лежит в папке, — файлы и вложенные папки, каждый как путь,
      у которого есть `.name`, `.stem` и `.suffix`. Порядок **не гарантирован**: на одном
      компьютере он окажется алфавитным, на другом — каким угодно. Если порядок важен, оберни
      перебор в `sorted()` — он умеет упорядочивать и пути:
      `for path in sorted(Path("music").iterdir()):`.

      Какой это файл, подскажет расширение `path.suffix`. Но расширение бывает записано
      заглавными буквами: фотоаппараты и старые программы любят `.JPG` и `.MP3`. Сравнивай без
      учёта регистра: `path.suffix.lower() == ".mp3"`.

      Есть и метод `glob`: `Path("music").glob("*.mp3")` выдаёт только пути по шаблону (`*` — любые
      символы), но регистр букв он на разных компьютерах учитывает по-разному, так что
      `suffix.lower()` надёжнее.
    simpler: >-
      `iterdir()` — «покажи всё, что лежит в папке». Порядок может быть любым, поэтому
      `sorted(...)`. Тип файла узнаём по `suffix`, приведённому к строчным буквам.
    coach: >-
      В настоящих папках всегда найдётся `.JPG` заглавными или лишний файл — программа должна
      быть к этому готова.

