            errorType: IsADirectoryError
          why: >-
            В тесте с именем archive путь ведёт к папке. `exists()` ответил `True` — по пути
            действительно что-то есть, — и программа попыталась прочитать папку как файл.
            `exists()` проверяет, есть ли что-нибудь по пути, а `is_file()` — есть ли там именно
            файл.
          try: Замени `exists()` на `is_file()`.
          verify: Граничный случай «так называется папка» должен вывести «Нет файла archive в папке library».
        - id: plus-not-slash
