  - id: practice-rain
    type: exercise
    title: Практика 3
    exercise:
      id: m7-l3-e3
      kind: write
      title: Осадки из файла
      statement: |-
        Метеокружок из урока 3.3 теперь хранит осадки в файлах, по одному файлу на месяц. В каждой
        строке — осадки за день в миллиметрах, целым числом. Но датчик иногда пишет вместо числа
        «нет данных», а файла за какой-то месяц может и не быть.

        Напиши программу, которая спрашивает имя файла и считает сумму осадков:

        - если файла нет, выведи `Файл <имя> не найден` — и больше ничего;
        - если строку нельзя превратить в целое число, выведи `Строка N пропущена: <текст строки>`
          и считай дальше (N — номер строки в файле, с 1; текст — без пробелов и перевода строки
          по краям);
        - в конце выведи `Осадков за период: S мм`.

        Например, в `may.txt` три строки: `5`, `нет данных`, `7`. Для него вывод такой:

        ```text
        Строка 2 пропущена: нет данных
        Осадков за период: 12 мм
        ```

        Файлы месяцев — в блоке «Файлы задания». Лови конкретные исключения, а при открытии файла
        укажи кодировку.
      input: Одна строка — имя файла, например `april.txt`.
      output: >-
        Строки о пропущенных строках файла и итог `Осадков за период: S мм` — или одна строка
        `Файл <имя> не найден`.
      constraints:
        - Пустых строк внутри файлов нет (но сам файл может быть пустым), числа не отрицательные.
        - Файлы не меняй — только читай.
      files:
        april.txt: |
          3
          0
          12
        may.txt: |
          5
          нет данных
          7
        july.txt: ""
        august.txt: |
          x
          —
        september.txt: " 4 \n6\n"
        october.txt: "4\n  нет данных  \n3"
      starterCode: |
        name = input("Имя файла: ")
        # Открой файл, сложи осадки и выведи итог.
        # Нет файла — «Файл … не найден», строка не число — «Строка N пропущена: …».
      tests:
        - id: t1
          kind: io
          title: Пример 1 — апрель
          example: true
          stdin: "april.txt\n"
          expected: "Осадков за период: 15 мм"
        - id: t2
          kind: io
          title: Пример 2 — строка «нет данных»
          example: true
          stdin: "may.txt\n"
          expected: |-
            Строка 2 пропущена: нет данных
            Осадков за период: 12 мм
        - id: t3
          kind: io
          title: Пример 3 — файла нет
          example: true
          stdin: "june.txt\n"
          expected: Файл june.txt не найден
        - id: t4
          kind: io
          title: "Граничный случай: пустой файл"
          edge: true
          stdin: "july.txt\n"
          expected: "Осадков за период: 0 мм"
        - id: t5
          kind: io
          title: "Граничный случай: ни одного числа"
          edge: true
          stdin: "august.txt\n"
          expected: |-
            Строка 1 пропущена: x
            Строка 2 пропущена: —
            Осадков за период: 0 мм
        - id: t6
          kind: io
          title: "Граничный случай: пробелы вокруг числа"
          edge: true
          stdin: "september.txt\n"
          expected: "Осадков за период: 10 мм"
        - id: t7
          kind: io
          title: "Граничный случай: пробелы вокруг плохой строки, в конце нет перевода строки"
          edge: true
          stdin: "october.txt\n"
          expected: |-
            Строка 2 пропущена: нет данных
            Осадков за период: 7 мм
        - id: t-except
          kind: assert
          title: Ловятся конкретные исключения
          stdin: "may.txt\n"
          code: |
            import ast
            source = open(__file__, encoding="utf-8").read()
            for node in ast.walk(ast.parse(source)):
                if isinstance(node, ast.ExceptHandler):
                    assert node.type is not None
                    caught = [node.type]
                    if isinstance(node.type, ast.Tuple):
                        caught = node.type.elts
                    for item in caught:
                        assert not (isinstance(item, ast.Name) and item.id in ("Exception", "BaseException", "NameError"))
          message: >-
            Здесь ловится «всё подряд» (`except` без типа, `except Exception`) или ошибка в самом
            коде (`except NameError`). Укажи конкретный тип, который ждёшь от данных.
        - id: t-enc
          kind: assert
          title: Кодировка указана
          stdin: "april.txt\n"
          code: |
            import ast
            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            calls = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Call)
                     and (getattr(n.func, "id", None) in names or getattr(n.func, "attr", None) in names)]

            def has_encoding(call):
                if any(k.arg == "encoding" for k in call.keywords):
                    return True
                name = getattr(call.func, "id", None) or call.func.attr
                # Кодировка по позиции: open(file, mode, buffering, encoding),
                # Path.open(mode, buffering, encoding), read_text(encoding), write_text(data, encoding).
                position = {"open": 3 if isinstance(call.func, ast.Attribute) else 4, "read_text": 1, "write_text": 2}[name]
                return len(call.args) >= position

            assert all(has_encoding(c) for c in calls)
          message: >-
            В одном из `open()` (или `read_text`/`write_text`) не указана кодировка. Добавь
            `encoding="utf-8"` — иначе на Windows со старым Python (до 3.15) русский текст
            превратится в кракозябры.
      criteria:
        - Если файла нет, программа печатает одну строку `Файл <имя> не найден` и не падает.
        - Каждая строка, которая не целое число, даёт сообщение с верным номером (с 1) и текстом строки.
        - Плохая строка не обрывает подсчёт — следующие числа тоже складываются.
        - 'В конце печатается сумма `Осадков за период: S мм`.'
        - "`except` ловит конкретные типы, при открытии файла указана кодировка."
      hints:
        - >-
          Здесь две разные беды: файла может не быть, а строка может оказаться не числом. Где
          случается каждая — и что программа должна делать дальше: остановиться или считать
          следующие строки?
        - |-
          Тот же приём, что в теории, — на плейлисте, где известна длительность не всех песен:
          ```python
          lengths = {"Утро": 4, "Дождь": 3}
          playlist = ["Утро", "Ветер", "Дождь"]
          minutes = 0
          for song in playlist:
              try:
                  minutes += lengths[song]
              except KeyError:
                  print("Нет длительности:", song)
          print("Всего минут:", minutes)
          ```
          Выведет `Нет длительности: Ветер` и `Всего минут: 7`. Беду одного элемента ловят внутри
          цикла. А беду, после которой считать нечего, — например, нет файла, — ловят снаружи,
          вокруг всего подсчёта.
        - |-
          Каркас из двух `try` — внешний для файла, внутренний для строки:
          ```text
          имя = input(...)
          сумма = 0, номер строки = 0
          try:
              with open(имя, encoding="utf-8") as f:
                  for line in f:
                      номер += 1
                      try:
                          сумма += int(line)
                      except ValueError:
                          печать «Строка … пропущена: …»
              печать итога
          except FileNotFoundError:
              печать «Файл … не найден»
          ```
      solution:
        code: |
          name = input("Имя файла: ")
          total = 0
          number = 0
          try:
              with open(name, encoding="utf-8") as f:
                  for line in f:
                      number += 1
                      try:
                          total += int(line)
                      except ValueError:
                          print(f"Строка {number} пропущена: {line.strip()}")
              print(f"Осадков за период: {total} мм")
          except FileNotFoundError:
              print(f"Файл {name} не найден")
        explanation: >-
          Внешний `try` ловит FileNotFoundError: его может выбросить только `open()`. Итог
          печатается внутри этого блока — если файла нет, считать нечего. Внутренний `try` стоит в
          цикле и защищает одну строку: ValueError пропускает её, а цикл идёт к следующей. `int()`
          сам не обращает внимания на пробелы и перевод строки по краям, поэтому ` 4 ` превращается
          в 4. Номер строки считаем сами, до `try`, — так он верный и для хороших, и для плохих
          строк.
      altSolutions:
        - code: |
            from pathlib import Path

            name = input("Имя файла: ")
            path = Path(name)
            if path.is_file():
                total = 0
                number = 0
                for line in path.read_text(encoding="utf-8").splitlines():
                    number += 1
                    try:
                        total += int(line)
                    except ValueError:
                        print(f"Строка {number} пропущена: {line.strip()}")
                print(f"Осадков за период: {total} мм")
            else:
                print(f"Файл {name} не найден")
          note: Файл проверен заранее через is_file() из урока 7.2, исключение ловится только для строк.
        - code: |
            name = input("Имя файла: ")
            found = True
            try:
                with open(name, encoding="utf-8") as f:
                    lines = f.read().splitlines()
            except FileNotFoundError:
                print(f"Файл {name} не найден")
                found = False
            if found:
                total = 0
                number = 1
                for line in lines:
                    try:
                        total += int(line)
                    except ValueError:
                        print(f"Строка {number} пропущена: {line.strip()}")
                    number += 1
                print(f"Осадков за период: {total} мм")
          note: Сначала строки читаются в список, флаг found отмечает, нашёлся ли файл; номер растёт в конце цикла.
        - code: |
