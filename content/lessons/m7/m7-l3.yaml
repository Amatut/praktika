        - id: t-except
          kind: assert
          title: Ловится только ошибка ввода
          stdin: "10000\n"
          code: |
            import ast
            source = open(__file__, encoding="utf-8").read()
            for node in ast.walk(ast.parse(source)):
                if isinstance(node, ast.ExceptHandler):
                    assert node.type is not None
                    caught = [node.type]
                    if isinstance(node.type, ast.Tuple):
                        caught = node.type.elts
                    for item in caught:
                        assert not (isinstance(item, ast.Name) and item.id in ("Exception", "BaseException", "NameError"))
          message: >-
            Здесь ловится «всё подряд» или ошибка в самом коде: `except` без типа, `except Exception`
            или `except NameError`. Укажи тот тип, который ждёшь от неверного ввода.
      criteria:
        - На число программа печатает километры, округлённые до одного знака.
        - На текст программа печатает «Введите число шагов цифрами» и не падает.
        - "`except` ловит конкретный тип ошибки неверного ввода, а опечатка в коде исправлена."
      hints:
        - >-
          На 10000 программа отвечает «цифрами», значит, внутри `try` случилась какая-то другая
          ошибка, а `except` без типа её спрятал. Как увидеть, что это за ошибка на самом деле?
        - |-
          Похожая ловушка:
          ```python
          prices = {"чай": 120}
          try:
              print(prises["чай"])
          except:
              print("Такого товара нет")
          ```
          Чай есть, а ответ «Такого товара нет». Если вместо `except:` написать `except KeyError:`,
          запуск покажет настоящую причину: `NameError: name 'prises' is not defined. Did you
          mean: 'prices'?`
        - >-
          Нужны две правки. Сначала в строке 6 укажи тип ошибки, которую выбрасывает `int()` на
          тексте, и запусти с 10000: traceback покажет опечатку в строке 4. Потом исправь имя
          переменной.
      solution:
        code: |
          steps_text = input("Шагов за день: ")
          try:
              steps = int(steps_text)
              km = steps * 0.7 / 1000
              print(f"Пройдено примерно {round(km, 1)} км")
          except ValueError:
              print("Введите число шагов цифрами")
        explanation: >-
          В строке 4 была опечатка `stpes`. Она выбрасывала NameError, а `except:` без типа ловил
          и её — поэтому на любой ввод программа просила цифры. Теперь `except ValueError` ловит
          только то, что выбрасывает `int()` на тексте, а любая ошибка в коде сразу видна в
          traceback.
      altSolutions:
