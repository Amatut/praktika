      mistakes:
        - id: no-file-check
          when:
            errorType: FileNotFoundError
          why: >-
            Файла с таким именем в рабочей папке нет, и `open()` остановил программу. Это
            ожидаемая ситуация: человек мог ошибиться в имени или месяц ещё не записан. Файлы,
            которые есть, видны в блоке «Файлы задания».
          try: >-
            Оберни открытие файла и подсчёт в `try` и поймай FileNotFoundError — или проверь
            заранее через `Path(name).is_file()`.
          verify: В «Примере 3» должно появиться «Файл june.txt не найден».
        - id: lines-missing
          when:
            errorType: NameError
            outputIncludes: не найден
          why: >-
            Сообщение про файл напечаталось, а потом программа упала. Когда файла нет, строки
            внутри `try` не выполнились, и переменная, которую они должны были создать, так и не
            появилась. А код после блока всё равно к ней обращается.
          try: >-
            Всё, что имеет смысл только для найденного файла, — цикл и итог — держи внутри `try`,
            после `with`. Или заведи флаг, как в модуле 3: `found = True` до `try`, `found =
            False` в `except`, а цикл и итог — под `if found:`.
          verify: В «Примере 3» должна остаться одна строка — «Файл june.txt не найден».
        - id: total-after-missing
          when:
            outputIncludes: "не найден\nОсадков"
          why: >-
            Файла нет, а программа всё равно печатает итог — 0 мм. Это вводит в заблуждение:
            осадков могло быть сколько угодно, просто считать их не из чего. Итог стоит после всего
            блока `try / except`, поэтому выполняется в любом случае.
          try: Перенеси печать итога внутрь `try`, после блока `with`.
          verify: В «Примере 3» должна остаться одна строка — «Файл june.txt не найден».
        - id: no-line-check
          when:
            errorType: ValueError
          why: >-
            `int()` не смог превратить в число строку вроде «нет данных», и эту ошибку никто не
            поймал. Защищены только строки внутри `try` с подходящим `except`.
          try: Поставь `try` вокруг `int(line)` внутри цикла и поймай ValueError.
          verify: 'В «Примере 2» должно появиться «Строка 2 пропущена: нет данных».'
        - id: try-around-loop
          when:
            outputIncludes: "Осадков за период: 5 мм"
          why: >-
            После строки «нет данных» подсчёт оборвался: 7 мм из третьей строки не прибавились.
            Так бывает, когда `try` стоит вокруг всего цикла: исключение выбрасывает программу из
            цикла целиком, и после `except` она продолжает уже после цикла. Или когда в `except`
            стоит `break`.
          try: >-
            Перенеси `try` внутрь цикла — вокруг одной строки с `int()`, а в `except` только
            печатай сообщение: следующий шаг цикла начнётся сам.
          verify: 'В «Примере 2» должно получиться «Осадков за период: 12 мм».'
        - id: loop-stopped
          when:
            outputEquals: "Строка 2 пропущена: нет данных"
          why: >-
            После строки «нет данных» программа замолчала: 7 мм не прибавились, итога нет.
            `except ValueError` стоит у внешнего `try`, вокруг всего цикла. Исключение выбросило
            программу из цикла и из `try` целиком — оставшиеся строки файла и печать итога
            пропустились.
          try: >-
            Поставь отдельный `try` с `except ValueError` внутрь цикла — вокруг `int(line)`, как в
            теории «Лови только то, что ждёшь». Плохая строка пропустится, а цикл пойдёт к
            следующей.
          verify: >-
            В «Примере 2» должно получиться две строки: «Строка 2 пропущена: нет данных» и
            «Осадков за период: 12 мм».
        - id: printed-error
          when:
            outputIncludes: Errno
          why: >-
            Человек видит служебный текст исключения на английском. К тому же номер `Errno`
            зависит от системы: в тренажёре один, на Windows другой.
          try: Под `except` печатай своё сообщение из условия — `Файл <имя> не найден`.
          verify: В «Примере 3» должно появиться «Файл june.txt не найден».
        - id: numbering
          when:
            outputIncludes: "Строка 1 пропущена: нет данных"
          why: >-
            «Нет данных» стоит во второй строке файла, а программа называет её первой. Номер
            должен расти на каждой строке файла — и на хорошей, и на плохой, — причём до того, как
            его напечатают.
          try: Увеличивай номер в начале тела цикла, до `try`, начиная с 0.
          verify: 'В «Примере 2» должно появиться «Строка 2 пропущена: нет данных».'
        - id: no-strip
          when:
            outputIncludes: "пропущена: нет данных\n\n"
          why: >-
            После сообщения о строке появилась пустая строка. В `line` остался перевод строки из
            файла, и `print` добавил к нему свой.
          try: Печатай `line.strip()`, как в уроке 7.1.
          verify: В «Примере 2» пустой строки между сообщением и итогом быть не должно.
        - id: spaces-kept
          when:
            outputIncludes: "пропущена:  "
          why: >-
            Вокруг «нет данных» в файле стоят пробелы, и они попали в сообщение. По условию текст
            строки печатается без пробелов и перевода строки по краям.
          try: Печатай `line.strip()` — он убирает с краёв и пробелы, и перевод строки.
          verify: >-
            В граничном случае с `october.txt` должно получиться «Строка 2 пропущена: нет данных» —
            с одним пробелом после двоеточия.
        - id: empty-tail
          when:
            outputIncludes: "пропущена:\n"
          why: >-
            Программа нашла в файле пустую строку, которой там нет. Так бывает с `split("\n")`:
            файл кончается переводом строки, и после него `split` даёт ещё один пустой кусок, а
            `int("")` его не принимает.
          try: Читай строки через `for line in f` или `splitlines()` — пустого хвоста они не дают.
          verify: 'В «Примере 1» должна остаться одна строка — «Осадков за период: 15 мм».'
        - id: isdigit-newline
          when:
            codeIncludes: isdigit
            outputIncludes: "Строка 1 пропущена: 3"
          why: >-
            Число 3 попало в пропущенные. Строка из файла приходит вместе с переводом строки, а он
            не цифра, поэтому `"3\n".isdigit()` даёт False.
          try: >-
            Сначала убери края — `text = line.strip()`, — а потом проверяй `text.isdigit()`. Или
            спроси сам `int()` внутри `try`: пробелы и перевод строки по краям он не замечает.
          verify: 'В «Примере 1» должно получиться «Осадков за период: 15 мм».'
        - id: split-words
          when:
            outputIncludes: "пропущена: нет\n"
          why: >-
            «Нет данных» разрезалось на два куска. `split()` без аргумента делит текст по любым
            пробелам, а не по строкам файла, поэтому и номера строк съехали.
          try: Читай файл построчно — `for line in f` или `f.read().splitlines()`.
          verify: 'В «Примере 2» должно появиться «Строка 2 пропущена: нет данных».'
        - id: nameerror-caught
          when:
            codeRegex: 'except[^:\n]*\bNameError\b'
            failedTest: t-except
          why: >-
            NameError значит, что код берёт переменную, которой нет, — это ошибка в самой
            программе, а не в данных. Обычно так бывает, когда файла нет: строки в `try` не
            выполнились, а цикл стоит отдельно. `except NameError` прячет этот сбой, а не
            исправляет его.
          try: >-
            Убери `except NameError`. Цикл и итог держи внутри `try`, после `with`: если файла
            нет, они просто не выполнятся.
          verify: Проверка «Ловятся конкретные исключения» должна стать зелёной.
        - id: broad-except
          when:
            codeRegex: 'except\s*:|except[^:\n]*\b(?:BaseException|Exception)\b'
            failedTest: t-except
          why: >-
            `except` без типа или `except Exception` поймает и ошибку в самом коде — например,
            опечатку в имени переменной — и выдаст её за «пропущенную строку».
          try: Для строк лови ValueError, для файла — FileNotFoundError.
          verify: Проверка «Ловятся конкретные исключения» должна стать зелёной.
        - id: no-encoding
          when:
            failedTest: t-enc
            codeRegex: '(?:open|read_text|write_text)\((?![^)]*encoding)'
          why: >-
            В тренажёре кодировка по умолчанию подходит, но на Windows без `encoding` Python
            3.14 и раньше прочитает файл в другой кодировке — и «нет данных» превратится в кракозябры или в
            UnicodeDecodeError.
          try: >-
            Добавь в `open()` (или `read_text()`) аргумент `encoding="utf-8"`, как в уроках 7.1
            и 7.2.
          verify: Проверка «Кодировка указана» должна стать зелёной.
      afterPass: >-
        Программа переживает и отсутствующий файл, и испорченные строки, а одна плохая строка не
        обрывает подсчёт. Улучшение: в конце печатай ещё и число пропущенных строк — сразу видно,
        насколько можно доверять итогу.
      skills: [exceptions, files-paths, loop-control]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`try` / `except Тип` превращает ожидаемую ошибку в понятное сообщение, и программа идёт дальше."
      - После исключения остаток `try` пропускается; выполняется первый подходящий `except`, затем код после блока.
      - Тип берут из последней строки traceback; для разных проблем — разные `except`.
      - >-
        `except:` без типа и `except Exception` прячут ошибки в самом коде. `try` держим коротким;
        внутри цикла он пропускает один плохой элемент, и цикл идёт дальше.
    question: Почему `except:` без типа опасен даже тогда, когда программа «работает»?
    answer: >-
      Он ловит не только неверный ввод, но и ошибки в самом коде — NameError из-за опечатки,
      TypeError в формуле — и выдаёт их за неверный ввод. Программа отвечает не то, а причину не
      видно: traceback не появляется. Поэтому после `except` пишут конкретный тип, который ждут.
