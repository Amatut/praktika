id: m7-l3
module: m7
number: "7.3"
title: "Исключения: try и except"
objective: >-
  Перехватывать конкретные исключения через try / except, чтобы программа объясняла проблему
  понятными словами и продолжала работу, и не прятать при этом настоящие ошибки в коде.
minutes: [25, 30]
prerequisites: [m7-l2]
skills: [exceptions]
environment: python

story:
  title: Счёт после боулинга
  fictional: true
  text: >-
    После боулинга друзья делят счёт маленькой программой Эмиля: вводят сумму и число человек, а
    она печатает, сколько с каждого. Однажды кто-то набрал «пять» вместо 5, и программа ответила
    длинным traceback на английском. В другой раз по ошибке ввели 0 человек, и
    программа упала с ZeroDivisionError. Эмиль научил её отвечать по-человечески: «Сумму и число
    людей введи цифрами» и «Людей должно быть больше нуля». При этом программа ловит только эти
    две ошибки, а опечатки в коде самого Эмиля по-прежнему видны сразу.

why: >-
  Часть ошибок выполнения можно предвидеть: человек ввёл текст вместо числа, файла нет, делитель
  равен нулю. Такую ошибку можно перехватить и ответить понятно, а не ронять программу. Например:
  `except ValueError: print("Введи число цифрами")`.

usedIn: >-
  Формы и чат-боты, которые не падают от неверного ввода; программы, которые читают файлы и
  получают данные из сети; серверы, которые записывают ошибку в журнал и продолжают обслуживать
  остальных.

steps:
  - id: catch
    type: theory
    title: Исключение можно поймать
    body: |-
      Из модуля 6 ты знаешь: если во время выполнения что-то пошло не так, Python останавливает
      программу и печатает traceback. Такая ошибка выполнения называется **исключением**
      (exception). Говорят, что Python «выбрасывает» исключение; если его никто не поймал,
      программа падает.
      Последняя строка traceback называет тип исключения: `ValueError`, `ZeroDivisionError`…

      Часть исключений — не ошибки в коде, а ожидаемые ситуации: человек набрал «пять» вместо 5,
      ввёл 0 гостей, файла с таким именем нет. Для них есть конструкция **try / except**:

      ```python
      try:
          people = int(text)
          print("Гостей:", people)
      except ValueError:
          print("Введи число цифрами")
      ```

      `try` — «попробуй», `except ValueError` — «если не вышло из-за ValueError, сделай вот это».
      Как это выполняется:

      1. Python выполняет строки блока `try` по порядку.
      2. Ошибки нет — блок `except` пропускается целиком.
      3. Случилось исключение — **остальные строки `try` пропускаются**, и Python ищет `except`
         с этим типом. Нашёл — выполняет его, а потом программа идёт дальше, после всего блока
         `try / except`. Это называется **перехватить** исключение.
      4. Подходящего `except` нет — программа падает с traceback, как будто `try` и не было.

      У одного `try` может быть несколько `except` — для разных проблем разные сообщения. Python
      проверяет их сверху вниз и выполняет первый подходящий.

      Типы, которые встречаются чаще всего:

      - `ValueError` — неподходящее значение, например `int("пять")`;
      - `ZeroDivisionError` — деление на ноль (он был в уроке 6.1);
      - `KeyError` — в словаре нет такого ключа;
      - `FileNotFoundError` — нет файла, который открывают для чтения.

      Откуда взять тип: запусти программу с плохими данными и прочитай последнюю строку traceback.
      Слово до двоеточия и есть тип — его пишут после `except`. Тип пишут всегда: почему это так
      важно, разберём через пару шагов.
    simpler: >-
      `try` — «попробуй», `except ValueError` — «если не получилось из-за неверного значения,
      сделай вот что». Это как страховка у канатоходца: сорвался — страховка ловит, и
      представление продолжается. Но страховку вешают под конкретный трюк, а не на всё подряд.
    coach: Сначала посмотри, какая ошибка случается, — потом лови именно её.

  - id: bill
    type: example
    title: Счёт на компанию
    body: >-
      Программа Эмиля из истории. Чтобы было удобно пробовать разные ответы, ввод здесь записан
      прямо в коде строками — такими, какие вернул бы `input()`. Сейчас «введено» 0 человек.
    code: |-
      total_text = "3600"  # что ввели: сумма счёта
      people_text = "0"    # что ввели: сколько человек
      try:
          total = int(total_text)
          people = int(people_text)
          share = total // people
          print(f"С каждого: {share} руб.")
      except ValueError:
          print("Сумму и число людей введи цифрами")
      except ZeroDivisionError:
          print("Людей должно быть больше нуля")
      print("Хорошего вечера!")
    notes:
      - line: 3
        text: Начало блока `try`. Всё, что может сломаться от неверного ввода, — внутри него, с отступом.
      - line: 6
        text: >-
          Здесь людей 0, и деление выбрасывает ZeroDivisionError. Строка 7 уже не выполнится:
          остаток `try` пропускается.
      - line: 8
        text: >-
          Этот `except` ждёт другую ошибку — ValueError, «не число». Для ZeroDivisionError он не
          подходит, Python идёт дальше.
      - line: 10
        text: Подходящий `except` — выполняется его строка 11.
      - line: 12
        text: >-
          Код после блока выполняется и когда ошибки не было, и когда её поймали. Программа не
          упала.
    tryIt: >-
      Замени `"0"` на `"4"` и запусти — получится `С каждого: 900 руб.`, а оба `except`
      пропустятся. Потом замени `"3600"` на `"много"`. А теперь нажми «Вернуть пример» и удали
      строки 10 и 11: ZeroDivisionError больше никто не ловит, программа упадёт, и `Хорошего
      вечера!` не появится.
    coach: Каждый `except` ловит только свой тип. Чужую ошибку он пропускает дальше.

  - id: skip-rest
    type: predict
    title: Что пропустится?
    prompt: Как думаешь, что выведет программа?
    code: |-
      try:
          print("Начало")
          n = int("семь")
          print("Число:", n)
      except ValueError:
          print("Это не число")
      print("Конец")
    options:
      - |-
        Это не число
        Конец
      - |-
        Начало
        Это не число
      - |-
        Начало
        Это не число
        Конец
    answer: |-
      Начало
      Это не число
      Конец
    explanation: >-
      Строки `try` выполняются по порядку, пока не случится исключение. `Начало` успевает
      напечататься. В строке 3 `int("семь")` выбрасывает ValueError — строка 4 пропускается, `n` так
      и не появляется. Выполняется подходящий `except`, а после него программа не останавливается, а
      идёт дальше — к `print("Конец")`.
    coach: >-
      Перехват — не «откат»: то, что `try` успел сделать до ошибки, уже сделано.

  - id: practice-seedlings
    type: exercise
    title: Практика 1
    exercise:
      id: m7-l3-e1
      kind: repeat
      title: Рассада по грядкам
      statement: |-
        На даче сажают рассаду помидоров. Программа читает две строки — сколько саженцев и
        сколько грядок — и печатает, сколько саженцев достанется каждой грядке. Остаток не
        считаем: нужно целочисленное деление `//`. Например, для 60 саженцев и 5 грядок:

        ```text
        На грядку: 12
        ```

        Ввод бывает неверным, и программа не должна падать:

        - если хотя бы одна строка — не целое число, выведи `Нужны целые числа`;
        - если грядок 0, выведи `Грядок должно быть больше нуля`.

        Реши через `try` / `except` и после каждого `except` указывай конкретный тип исключения.
      input: Две строки — число саженцев и число грядок.
      output: >-
        Одна строка: `На грядку: N`, или `Нужны целые числа`, или `Грядок должно быть больше
        нуля`.
      constraints:
        - Текст подсказок в `input()` можно написать любой — он не проверяется.
        - Отрицательных чисел в тестах нет.
      starterCode: |
        seedlings_text = input("Сколько саженцев? ")
        beds_text = input("Сколько грядок? ")
        # Преврати ответы в числа и выведи «На грядку: N».
        # Не число — «Нужны целые числа», ноль грядок — «Грядок должно быть больше нуля».
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "60\n5\n"
          expected: "На грядку: 12"
        - id: t2
          kind: io
          title: Пример 2 — не число
          example: true
          stdin: "шестьдесят\n5\n"
          expected: Нужны целые числа
        - id: t3
          kind: io
          title: Пример 3 — ноль грядок
          example: true
          stdin: "60\n0\n"
          expected: Грядок должно быть больше нуля
        - id: t4
          kind: io
          title: "Граничный случай: остаток отбрасывается"
          edge: true
          stdin: "50\n3\n"
          expected: "На грядку: 16"
        - id: t5
          kind: io
          title: "Граничный случай: не число во второй строке"
          edge: true
          stdin: "60\nпять\n"
          expected: Нужны целые числа
        - id: t6
          kind: io
          title: "Граничный случай: дробное число"
          edge: true
          stdin: "12.5\n3\n"
          expected: Нужны целые числа
        - id: t7
          kind: io
          title: "Граничный случай: ноль саженцев — это не ошибка"
          edge: true
          stdin: "0\n4\n"
          expected: "На грядку: 0"
        - id: t-except
          kind: assert
          title: Ловятся конкретные исключения
          stdin: "60\n5\n"
          code: |
            import ast
            source = open(__file__, encoding="utf-8").read()
            for node in ast.walk(ast.parse(source)):
                if isinstance(node, ast.ExceptHandler):
                    assert node.type is not None
                    caught = [node.type]
                    if isinstance(node.type, ast.Tuple):
                        caught = node.type.elts
                    for item in caught:
                        assert not (isinstance(item, ast.Name) and item.id in ("Exception", "BaseException", "NameError"))
          message: >-
            Здесь ловится «всё подряд» (`except` без типа, `except Exception`) или ошибка в самом
            коде (`except NameError`). Укажи конкретный тип, который ждёшь от неверного ввода, —
            тот, что стоит в последней строке traceback.
      rules:
        - id: r-try
          use: [Try]
          message: >-
            Обработай неверный ввод через `try` / `except` — это приём урока. Проверки через `if`
            тоже бывают полезны, но здесь мы тренируем перехват исключений.
      criteria:
        - 'При верном вводе печатается `На грядку: N`, где N получено целочисленным делением.'
        - Если хотя бы одна строка — не целое число, печатается `Нужны целые числа`, без traceback.
        - Если грядок 0, печатается `Грядок должно быть больше нуля`, без traceback.
        - Ноль саженцев — обычный случай, а не ошибка.
        - Неверный ввод обработан через `try` / `except`, после каждого `except` указан конкретный тип исключения.
      hints:
        - >-
          Какие две беды могут случиться — и в каких строках программы? У каждой свой тип
          исключения и своё сообщение. Посмотри, как это устроено в примере «Счёт на компанию».
        - |-
          Тот же приём на словаре цен:
          ```python
          prices = {"чай": 120, "пирог": 250}
          item = input("Что берёшь? ")
          try:
              print("Цена:", prices[item])
          except KeyError:
              print("Такого нет в меню")
          ```
          На «кофе» программа не падает, а отвечает «Такого нет в меню».
        - |-
          Каркас:
          ```text
          try:
              превратить обе строки в int
              посчитать саженцы // грядки
              напечатать «На грядку: …»
          except ValueError:
              напечатать про целые числа
          except ZeroDivisionError:
              напечатать про грядки
          ```
      solution:
        code: |
          seedlings_text = input("Сколько саженцев? ")
          beds_text = input("Сколько грядок? ")
          try:
              seedlings = int(seedlings_text)
              beds = int(beds_text)
              per_bed = seedlings // beds
              print(f"На грядку: {per_bed}")
          except ValueError:
              print("Нужны целые числа")
          except ZeroDivisionError:
              print("Грядок должно быть больше нуля")
        explanation: >-
          Обе строки `int()` и деление стоят внутри `try`: ValueError может выбросить любое из
          двух превращений, ZeroDivisionError — деление. `print` с результатом тоже внутри: если
          случилась ошибка, результата нет и печатать нечего. Для двух проблем — два `except` с
          разными сообщениями. Ноль грядок можно и проверить заранее, `if beds == 0`, — это тоже
          верное решение.
      altSolutions:
        - code: |
            try:
                seedlings = int(input("Сколько саженцев? "))
                beds = int(input("Сколько грядок? "))
                print(f"На грядку: {seedlings // beds}")
            except ValueError:
                print("Нужны целые числа")
            except ZeroDivisionError:
                print("Грядок должно быть больше нуля")
          note: input() тоже внутри try, деление прямо в f-строке.
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
                if beds == 0:
                    print("Грядок должно быть больше нуля")
                else:
                    print(f"На грядку: {seedlings // beds}")
            except ValueError:
                print("Нужны целые числа")
          note: Ноль грядок проверен через if заранее, ловится только ValueError.
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
                print("На грядку:", seedlings // beds)
            except ZeroDivisionError:
                print("Грядок должно быть больше нуля")
            except ValueError:
                print("Нужны целые числа")
          note: except в другом порядке и print через запятую — вывод тот же.
        - code: |
            ok = True
            try:
                a = int(input())
                b = int(input())
            except ValueError:
                ok = False
                print("Нужны целые числа")
            if ok:
                if b == 0:
                    print("Грядок должно быть больше нуля")
                else:
                    print(f"На грядку: {a // b}")
          note: Короткий try только вокруг int(), флаг ok, ноль проверен через if после блока (рецензия, проверки).
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            if beds_text == "0":
                print("Грядок должно быть больше нуля")
            else:
                try:
                    print(f"На грядку: {int(seedlings_text) // int(beds_text)}")
                except ValueError:
                    print("Нужны целые числа")
          note: Ноль проверен сравнением строки до try, try ловит только ValueError (рецензия, ученик).
        - code: |
            s = input()
            b = input()
            try:
                count = int(s) // int(b)
                print(f"На грядку: {count}")
            except ZeroDivisionError:
                print("Грядок должно быть больше нуля")
            except ValueError as error:
                print("Нужны целые числа")
          note: int() прямо в выражении деления; as error, но человеку — своё сообщение.
      wrongSolutions:
        - code: |
            seedlings = int(input("Сколько саженцев? "))
            beds = int(input("Сколько грядок? "))
            try:
                print(f"На грядку: {seedlings // beds}")
            except ZeroDivisionError:
                print("Грядок должно быть больше нуля")
          note: int() стоит вне try — ValueError не пойман.
          expectMistake: int-outside-try
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
                print(f"На грядку: {seedlings // beds}")
            except ValueError:
                print("Нужны целые числа")
          note: Нет except для деления на ноль.
          expectMistake: zero-not-caught
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
                per_bed = seedlings // beds
            except ValueError:
                print("Нужны целые числа")
            except ZeroDivisionError:
                print("Грядок должно быть больше нуля")
            print(f"На грядку: {per_bed}")
          note: Результат печатается после блока — при ошибке переменной per_bed нет.
          expectMistake: result-outside-try
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
                print(f"На грядку: {seedlings // beds}")
            except (ValueError, ZeroDivisionError):
                print("Нужны целые числа")
          note: Один except на обе ошибки — одно сообщение на разные проблемы.
          expectMistake: same-message
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
                print(f"На грядку: {seedlings // beds}")
            except ValueError:
                print("Грядок должно быть больше нуля")
            except ZeroDivisionError:
                print("Нужны целые числа")
          note: Сообщения перепутаны.
          expectMistake: swapped
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
                print(f"На грядку: {seedlings / beds}")
            except ValueError:
                print("Нужны целые числа")
            except ZeroDivisionError:
                print("Грядок должно быть больше нуля")
          note: Обычное деление / вместо целочисленного.
          expectMistake: wrong-division
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
                print(f"На грядку: {seedlings // beds}")
            except ValueError:
                print("Нужны целые числа")
            except:
                print("Грядок должно быть больше нуля")
          note: Второй except без типа — ловит всё, что не ValueError.
          expectMistake: broad-except
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
            except ValueError:
                print("Нужны целые числа")
            if beds == 0:
                print("Грядок должно быть больше нуля")
            else:
                print(f"На грядку: {seedlings // beds}")
          note: В try только int(), проверка нуля и печать после блока — при неверном вводе NameError на beds.
          expectMistake: result-outside-try
        - code: |
            seedlings_text = input()
            beds_text = input()
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
            except ValueError:
                print("Нужны целые числа")
            try:
                print(f"На грядку: {seedlings // beds}")
            except ZeroDivisionError:
                print("Грядок должно быть больше нуля")
          note: Два отдельных try — для int() и для деления; печать уже во втором try.
          expectMistake: result-outside-try
        - code: |
            seedlings_text = input()
            beds_text = input()
            per_bed = 0
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
                per_bed = seedlings // beds
            except ValueError:
                print("Нужны целые числа")
            except ZeroDivisionError:
                print("Грядок должно быть больше нуля")
            print(f"На грядку: {per_bed}")
          note: Заготовка per_bed = 0 убирает NameError, но результат печатается и после сообщения об ошибке.
          expectMistake: result-always-printed
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
                seedlings = float(seedlings_text)
                beds = float(beds_text)
                print(f"На грядку: {seedlings // beds}")
            except ValueError:
                print("Нужны целые числа")
            except ZeroDivisionError:
                print("Грядок должно быть больше нуля")
          note: float() вместо int(), деление // на месте — ответ 12.0.
          expectMistake: float-used
        - code: |
            seedlings_text = input()
            beds_text = input()
            try:
                seedlings = int(seedlings_text)
                beds = int(beds_text)
                print(f"На грядку: {seedlings // beds}")
            except ValueError or ZeroDivisionError:
                print("Нужны целые числа")
          note: except ValueError or ZeroDivisionError — на деле ловит только ValueError.
          expectMistake: or-in-except
        - code: |
            seedlings_text = input("Сколько саженцев? ")
            beds_text = input("Сколько грядок? ")
            try:
