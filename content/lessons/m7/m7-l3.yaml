        ```

        Найди, что прячет настоящую ошибку, и почини программу. На число она должна печатать
        километры, например для 10000 шагов:

        ```text
        Пройдено примерно 7.0 км
        ```

        А на текст — по-прежнему просить ввести цифры. `except` должен ловить только ту ошибку,
        которую мы ждём от неверного ввода, — чтобы ошибки в самом коде больше не прятались.
      input: Одна строка — число шагов.
      output: >-
        `Пройдено примерно N км` (N округлено до одного знака) или `Введите число шагов цифрами`.
      constraints:
        - Числа в расчёте (`0.7` и `1000`), округление до одного знака и тексты сообщений не меняй.
        - Проверка смотрит, что `except` ловит конкретный тип, а не всё подряд.
      starterCode: |
        steps_text = input("Шагов за день: ")
        try:
            steps = int(steps_text)
            km = stpes * 0.7 / 1000
