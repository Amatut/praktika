          try: >-
            Укажи после `except` тип, который `int()` выбрасывает на тексте, и запусти с 10000:
            traceback покажет настоящую ошибку и строку, где она случилась.
          verify: В «Примере 1» должно получиться «Пройдено примерно 7.0 км».
        - id: used-after-except
          when:
            errorType: NameError
            outputIncludes: Введите число шагов цифрами
          why: >-
            Программа попросила ввести цифры, а потом упала. Когда `int()` не справился, строки
            после него в `try` не выполнились, и переменная `steps` не появилась. Но код после
            блока `try / except` выполняется всегда — и берёт число, которого нет. Имя написано
            верно, дело в том, где стоят строки.
          try: >-
            Расчёт и печать имеют смысл, только если число получилось, — перенеси их внутрь
            `try`, сразу после `int()`.
          verify: В «Примере 2» должна остаться одна строка — «Введите число шагов цифрами».
        - id: only-except-fixed
          when:
            errorType: NameError
          why: >-
            Теперь ошибка видна — этого мы и добивались: `except` больше её не прячет. Последняя
            строка traceback говорит NameError, а подсказка `Did you mean` называет правильное имя.
          try: Исправь имя переменной в строке, на которую указывает traceback.
          verify: В «Примере 1» должно получиться «Пройдено примерно 7.0 км».
        - id: except-exception
          when:
            codeRegex: 'except[^:\n]*\b(?:Base)?Exception\b'
            failedTest: t-except
          why: >-
            `except Exception` ловит почти любое исключение — и неверный ввод, и опечатки в коде.
            Следующая опечатка снова спрячется за «Введите число шагов цифрами».
          try: Укажи тот тип, который `int()` выбрасывает на тексте.
          verify: Проверка «Ловится только ошибка ввода» должна стать зелёной.
        - id: bare-kept
          when:
            codeRegex: 'except\s*:'
            failedTest: t-except
          why: >-
            `except:` без типа остался, а он ловит любую ошибку — и неверный ввод, и опечатку в
            коде. Следующая ошибка в коде снова превратится в «Введите число шагов цифрами», и
            искать её придётся вслепую.
          try: Укажи после `except` тип ошибки, которую выбрасывает `int()` на тексте.
          verify: Проверка «Ловится только ошибка ввода» должна стать зелёной.
        - id: value-not-caught
          when:
            errorType: ValueError
          why: >-
            На слово «много» `int()` выбрасывает ValueError, и его никто не ловит: `try` нет,
            `int()` стоит выше `try` или в `except` указан другой тип.
          try: >-
            Строка с `int()` должна стоять внутри `try`, а после `except` — ValueError: это тип
            из последней строки traceback.
          verify: В «Примере 2» должно появиться «Введите число шагов цифрами».
        - id: printed-error
          when:
            outputIncludes: invalid literal
          why: >-
            Человек видит служебный текст исключения на английском. Тебе он полезен при отладке, а
            пользователю нужна понятная просьба.
          try: Под `except` печатай сообщение из условия, а не `error`.
          verify: В «Примере 2» должно появиться «Введите число шагов цифрами».
      afterPass: >-
        Ты увидел, как `except` без типа выдаёт опечатку за неверный ввод. Теперь опечатка сразу
        видна в traceback, а на неверный ввод программа по-прежнему отвечает понятно. Проверь
        себя: верни `stpes` в строку 4 и запусти с 10000 — Python покажет строку и подскажет
