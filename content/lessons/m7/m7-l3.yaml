          expectMistake: null
      mistakes:
        - id: int-outside-try
          when:
            errorType: ValueError
          why: >-
            `int()` не смог превратить текст в число, и эту ошибку никто не поймал. `try`
            защищает только строки внутри своего блока: если `int()` стоит выше `try` или для
            ValueError нет своего `except`, программа падает, как раньше.
          try: Перенеси строки с `int()` внутрь `try` и добавь `except ValueError` со своим сообщением.
          verify: В «Примере 2» вместо traceback должно появиться «Нужны целые числа».
        - id: or-in-except
          when:
            codeRegex: 'except\s+\(?\s*\w+\s+or\s'
          why: >-
            Запись `except ValueError or ZeroDivisionError` Python не понимает как «одна из двух
            ошибок». Из выражения `ValueError or ZeroDivisionError` получается просто первый тип —
            ValueError. Поэтому такой `except` ловит только его, а деление на ноль проходит мимо.
          try: >-
            Двум ошибкам здесь нужны разные сообщения, поэтому напиши два `except` — отдельно для
            ValueError и для ZeroDivisionError.
          verify: В «Примере 3» должно появиться «Грядок должно быть больше нуля».
        - id: zero-not-caught
          when:
            errorType: ZeroDivisionError
          why: >-
            Когда грядок 0, деление выбрасывает ZeroDivisionError. `except ValueError` его не
            ловит: каждый `except` ждёт только свой тип.
          try: >-
            Добавь второй `except` — для ZeroDivisionError, со своим сообщением. Или проверь до
            деления, что грядок не ноль.
          verify: В «Примере 3» должно появиться «Грядок должно быть больше нуля».
        - id: result-outside-try
          when:
            errorType: NameError
            outputIncludes: Нужны целые числа
          why: >-
            Программа напечатала сообщение об ошибке, а потом упала: строка после блока берёт
            переменную, которой нет. Когда в `try` случилось исключение, строки после ошибочной не
            выполнились, и переменные, которые они создают, так и не появились.
          try: >-
            Всё, что использует числа из `int()`, — расчёт, проверку, печать результата — держи в
            том же `try`, сразу после `int()`.
          verify: В «Примере 2» должна остаться одна строка — «Нужны целые числа».
        - id: result-always-printed
          when:
            outputIncludes: "целые числа\nНа грядку:"
          why: >-
            После сообщения об ошибке программа печатает ещё и «На грядку: …». Печать результата
            стоит после блока `try / except` и выполняется всегда — даже когда посчитать не
            удалось. Заготовка вроде `per_bed = 0` убирает падение, но не ошибку.
          try: >-
            Перенеси печать результата внутрь `try`, сразу после расчёта. Заготовка до `try` тогда
            не нужна.
          verify: В «Примере 2» должна остаться одна строка — «Нужны целые числа».
        - id: float-used
          when:
            codeIncludes: float(
            failedTest: t1
          why: >-
            `float()` превращает текст в дробное число, и даже `//` над дробными числами даёт
            дробный ответ: `60.0 // 5.0` — это `12.0`. К тому же `float()` принимает «12.5», а по
            условию нужны целые числа.
          try: Преврати обе строки через `int()`.
          verify: 'В «Примере 1» должно получиться «На грядку: 12».'
        - id: same-message
          when:
            failedTest: t3
            outputEquals: Нужны целые числа
          why: >-
            На ноль грядок программа отвечает «Нужны целые числа», хотя 0 — целое число. Так
            бывает, когда один `except` ловит обе ошибки (например, `except` без типа) или когда под
            двумя `except` стоит одинаковый текст. Проблемы разные — и человеку нужны разные
            подсказки.
          try: >-
            У каждой проблемы — свой `except` со своим сообщением: ValueError — про целые числа,
            ZeroDivisionError — про грядки.
          verify: В «Примере 3» должно появиться «Грядок должно быть больше нуля».
        - id: swapped
          when:
            outputEquals: Грядок должно быть больше нуля
          why: >-
            На слово «шестьдесят» программа отвечает про грядки. Значит, под `except ValueError`
            стоит сообщение, которое предназначено для деления на ноль.
          try: Проверь, какое сообщение стоит под каким `except`. ValueError — это «не число».
          verify: В «Примере 2» должно появиться «Нужны целые числа».
        - id: wrong-division
          when:
            outputIncludes: "На грядку: 12.0"
            codeRegex: '[^/]/[^/]'
          why: >-
            Обычное деление `/` всегда даёт дробное число: `60 / 5` — это `12.0`. Саженцы
            делятся целиком, остаток не нужен.
          try: Замени `/` на целочисленное деление `//`.
          verify: 'В «Примере 1» должно получиться «На грядку: 12».'
        - id: nameerror-caught
          when:
            codeRegex: 'except[^:\n]*\bNameError\b'
            failedTest: t-except
          why: >-
            NameError значит, что код берёт переменную, которой нет, — это ошибка в самой
            программе, а не во вводе. Обычно так бывает, когда при неверном вводе расчёт в `try`
            не выполнился, а печать стоит отдельно. `except NameError` прячет этот сбой, а не
            исправляет его.
          try: >-
            Убери `except NameError`. Всё, что использует числа из `int()`, — расчёт и печать —
            держи в первом `try`, сразу после `int()`.
          verify: Проверка «Ловятся конкретные исключения» должна стать зелёной.
        - id: broad-except
          when:
            codeRegex: 'except\s*:|except[^:\n]*\b(?:BaseException|Exception)\b'
            failedTest: t-except
          why: >-
            `except` без типа (или `except Exception`) ловит любую ошибку — и опечатку в имени
            переменной тоже. Тогда на верный ввод программа ответит одним из сообщений об ошибке,
            и причину придётся искать вслепую.
          try: >-
            Напиши после каждого `except` конкретный тип: ValueError для «не числа»,
            ZeroDivisionError для нуля грядок.
          verify: Проверка «Ловятся конкретные исключения» должна стать зелёной.
      afterPass: >-
        Программа переживает оба вида неверного ввода и на каждый отвечает по-своему. Одно
        улучшение на будущее: на отрицательное число грядок она выдаст странный ответ. В следующем
        уроке научимся в таких случаях переспрашивать.
      skills: [exceptions, type-conversion]

  - id: not-everything
    type: theory
    title: Лови только то, что ждёшь
    body: |-
      Можно написать `except:` без типа или `except Exception:`. `Exception` — общее имя почти для
      всех исключений, поэтому такой `except` ловит **почти всё подряд**: и неверный ввод, и
      NameError из-за опечатки в имени, и TypeError из-за ошибки в формуле. Программа отвечает
      «Введи число цифрами», хотя виноват код, — и ты ищешь проблему не там. Поэтому после
      `except` всегда пиши конкретный тип.

      Держи `try` коротким: внутри — строка, где ты ждёшь исключение, и то, что без неё не имеет
      смысла. Чем больше строк в блоке, тем выше шанс, что тот же тип ошибки прилетит не оттуда,
      откуда ты ждал.

      Короткий `try` можно поставить и внутрь цикла. Тогда ошибка на одном шаге не обрывает
      весь цикл: `except` срабатывает, и цикл идёт к следующему элементу.

      ```python
      answers = ["3", "x", "5"]
      total = 0
      for text in answers:
          try:
              total += int(text)
          except ValueError:
              print("Пропускаю", text)
      print(total)
      ```

      Выведется `Пропускаю x` и `8`. А если поставить `try` вокруг всего цикла, первое же
      исключение выбросит программу из цикла целиком — `5` уже не прибавится.

      Если на две разные проблемы нужен один и тот же ответ, типы перечисляют в скобках:

      ```python
      except (ValueError, ZeroDivisionError):
          print("Проверь, что ввёл")
      ```

      Само исключение можно положить в переменную — после типа пишут `as` и имя:

      ```python
      try:
          people = int("пять")
      except ValueError as error:
          print(error)
      ```

      Выведется текст исключения: `invalid literal for int() with base 10: 'пять'`. Тебе при отладке
      это полезно. А человеку показывай своё понятное сообщение: ему незачем знать, что такое
      literal.
    simpler: >-
      `except:` без типа — как сеть, которая ловит и рыбу, и твой собственный сапог. Кажется, что
      программа работает, а на самом деле она молча прячет ошибки в коде. Называй тип, который
      ждёшь, и держи в `try` только рискованные строки.
    coach: Если программа «вежливо» отвечает не то, первым делом проверь, что именно ловит её `except`.

  - id: pick-type
    type: quiz
    title: Какой except нужен?
    question: |-
      Программа выдала traceback, последняя строка такая:

      ```text
      KeyError: 'груша'
      ```

      Как перехватить эту ошибку, не пряча другие?
    options:
      - "`except:`"
      - "`except Exception:`"
      - "`except KeyError:`"
      - "`except ValueError:`"
    correct: 2
    explanation: >-
      Тип — слово до двоеточия в последней строке traceback, здесь KeyError: в словаре нет ключа
      «груша». `except:` и `except Exception:` тоже поймают его, но заодно спрячут опечатки и
      ошибки в формулах. `except ValueError` его не поймает вовсе — тип другой.

  - id: practice-steps
    type: exercise
    title: Практика 2
    exercise:
      id: m7-l3-e2
      kind: fix
      title: Вечное «Введите число»
      statement: |-
        Программа переводит шаги за день в километры: один шаг — примерно 0,7 м. Но что бы ни
        ввели, даже 10000, она отвечает одно и то же:

        ```text
