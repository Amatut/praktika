      mistakes:
        - id: closed-file
          when:
            errorIncludes: closed file
          where: Строки после блока `with`
          why: >-
            Файл закрывается, как только кончается блок `with`. Строка, на которой остановилась
            программа, работает с `f` уже после блока, а файл закрыт: `I/O operation on closed
            file`.
