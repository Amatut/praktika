      criteria:
        - Пустые строки и строки из одних пробелов пропускаются, остальные превращаются в числа.
        - Число серий и сумма считаются по числам из файла, а не записаны в код.
        - "`report.txt` содержит две строки: `Серий: N` и `Сумма: S`; старый отчёт заменяется новым."
        - "`scores.txt` не меняется, на экране — `Отчёт сохранён в report.txt`."
        - "В каждом `open()` указана кодировка `encoding=\"utf-8\"`."
      hints:
        - >-
          Раздели программу на две части: сначала прочитать `scores.txt` и посчитать два числа,
          потом записать их в новый файл. Какие накопители из модуля про циклы здесь нужны и что
          делать со строкой, в которой после `strip()` ничего не осталось?
        - |-
          Запись нескольких строк в файл на другом примере — список покупок:
          ```python
          apples = 5
          with open("shopping.txt", "w", encoding="utf-8") as f:
              f.write("Хлеб: 1\n")
              f.write(f"Яблоки: {apples}\n")
          ```
          Каждая запись заканчивается `\n`, число попадает в строку через f-строку.
        - |-
          Каркас:
          ```text
          count, total — начать с 0
          with open("scores.txt", …) as f:
              для каждой строки:
                  убрать пробелы и \n; пустую пропустить (continue)
                  превратить в число, обновить count и total
          with open("report.txt", "w", …) as f:
              записать две строки, каждую с \n
          print("Отчёт сохранён в report.txt")
          ```
      solution:
        code: |
          count = 0
          total = 0
          with open("scores.txt", encoding="utf-8") as f:
              for line in f:
                  text = line.strip()
                  if text == "":
                      continue
                  count += 1
                  total += int(text)

          with open("report.txt", "w", encoding="utf-8") as f:
              f.write(f"Серий: {count}\n")
              f.write(f"Сумма: {total}\n")

          print("Отчёт сохранён в report.txt")
        explanation: >-
          Первый блок `with` только читает: пустая строка — даже с пробелами — после `strip()`
          становится `""`, и `continue` переходит к следующей. Второй блок открывает новый файл
          `report.txt` в режиме `"w"`: отчёт каждый раз считается заново, старый не жалко
          стереть, а `scores.txt` остаётся нетронутым. `write` не переводит строку сам, поэтому у
          каждой записи в конце `\n`, а числа попадают в текст через f-строку.
