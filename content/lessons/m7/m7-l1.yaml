            with open("report.txt", "w", encoding="utf-8") as f:
                f.write(f"Серий: {count}\n")
                f.write("Сумма: ")
                f.write(total + "\n")
            print("Отчёт сохранён в report.txt")
          note: Число плюс "\n" — общий разбор «Число и строка через +» точен (не text-not-number).
          expectMistake: null
        - code: |
            count = 0
            total = 0
            with open("scores.txt", encoding="utf-8") as f:
                for line in f:
                    if line.strip() == "":
                        continue
                    count += 1
                    total += int(line)
            with open("report.txt", "w") as f:
                f.write(f"Серий: {count}\n")
                f.write(f"Сумма: {total}\n")
            print("Отчёт сохранён в report.txt")
          note: Отчёт записан без кодировки.
          expectMistake: no-encoding
      mistakes:
        - id: closed-file
          when:
            errorIncludes: closed file
          where: Строки после блока `with`
          why: >-
            Файл закрывается, как только кончается блок `with`. Строка, на которой остановилась
            программа, пишет в файл уже после блока, а файл закрыт: `I/O operation on closed
            file`.
          try: >-
            Сдвинь все `write` для отчёта внутрь блока `with open("report.txt", "w", …)` — с
            отступом под ним.
          verify: 'Ошибка должна исчезнуть, а проверка «Пример 2: отчёт для трёх серий» — стать зелёной.'
        - id: wrong-mode-op
          when:
            errorType: UnsupportedOperation
          where: Файл, в который пишется отчёт
          why: >-
            Это ошибка в коде, а не ограничение тренажёра: на компьютере будет то же самое. Без
            режима `open` открывает файл только для чтения, и писать в него нельзя
            (`not writable`). Чаще всего так бывает, когда отчёт пишут через тот же `f`, которым
            читают `scores.txt`.
          try: >-
            Пиши отчёт в отдельном блоке: `with open("report.txt", "w", encoding="utf-8") as
            report:` — и `report.write(…)` внутри него.
          verify: 'Ошибка должна исчезнуть, а проверка «Пример 2: отчёт для трёх серий» — стать зелёной.'
        - id: file-missing
          when:
            errorType: FileNotFoundError
          where: "`open()`, на котором остановилась программа"
          why: >-
            `open()` без режима открывает файл для чтения, а файла с таким именем рядом с
            программой нет. Если в ошибке `report.txt` — режим не указан: чтобы создать файл и
            писать в него, нужен `"w"`. Если там имя файла с очками — оно написано не так, как в
            блоке «Файлы задания».
          try: >-
            Посмотри на последнюю строку ошибки — там имя файла. Отчёт открывай так:
            `open("report.txt", "w", encoding="utf-8")`, а имя файла с очками скопируй из условия —
            `scores.txt`.
          verify: Ошибка FileNotFoundError должна исчезнуть.
        - id: write-not-str
          when:
            errorIncludes: write()
          where: Строки, которые пишут в `report.txt`
          why: >-
            `write` принимает ровно одну строку. Число туда не пройдёт (`f.write(total)` —
            TypeError), а второе значение через запятую, как в `print`, — тоже ошибка:
            `f.write("Сумма:", total)`. `print` сам превращает числа в текст и разделяет значения,
            а `write` — нет.
          try: 'Собери каждую запись в одну строку f-строкой: `f.write(f"Сумма: {total}\n")`.'
          verify: 'Ошибка TypeError должна исчезнуть, а проверка «Пример 2: отчёт для трёх серий» — стать зелёной.'
        - id: text-plus-number
          when:
            errorIncludes: can only concatenate str
          where: Склейка текста и числа через `+`
          why: >-
            Через `+` строку можно склеить только со строкой, а `count` и `total` — числа:
            `"Сумма: " + total` останавливает программу с TypeError.
          try: 'Собери строку f-строкой: `f.write(f"Сумма: {total}\n")` — или через `str(total)`.'
          verify: 'Ошибка TypeError должна исчезнуть, а проверка «Пример 2: отчёт для трёх серий» — стать зелёной.'
        - id: text-not-number
          when:
            errorIncludes: "+=: 'int' and 'str'"
          where: Строка, где очки прибавляются к сумме
          why: >-
            Строка из файла — это текст, даже если в ней одни цифры: `line.strip()` даёт `"120"`,
            а не число 120. Прибавить текст к числу нельзя — TypeError.
          try: Преврати строку в число перед сложением — `int(text)`.
          verify: 'Ошибка TypeError должна исчезнуть, а проверка «Пример 2: отчёт для трёх серий» — стать зелёной.'
        - id: blank-line
          when:
            errorIncludes: invalid literal for int()
          where: "`int(…)` внутри цикла"
          why: >-
            В файле есть пустая строка — в ней только `\n`, а иногда ещё пробелы. `int()` не может
            превратить пустоту в число — ValueError. Проверка `line == "\n"` строку с пробелами
            не узнает.
          try: >-
            Перед `int()` проверь строку: если после `strip()` она пустая, пропусти её —
            `if line.strip() == "": continue`.
          verify: 'Проверка «Граничный случай: пустые строки» должна стать зелёной.'
        - id: no-report
          when:
            failedTest: t-exists
            outputIncludes: Отчёт сохранён
          where: Запись отчёта
          why: >-
            После запуска рядом с программой нет файла `report.txt`. Нажми «Запустить» и загляни в
            «Файлы после запуска». Изменён `scores.txt` — значит, отчёт записан поверх очков и
            стёр исходные данные. Появился файл с другим именем — имя не совпало. Там пусто —
            отчёт печатается на экран, а не пишется в файл.
          try: >-
            Открой новый файл `open("report.txt", "w", encoding="utf-8")` и пиши отчёт в него через
            `f.write`, а `scores.txt` только читай.
          verify: Проверки «Файл report.txt создан» и «Исходный файл не изменился» должны стать зелёными.
        - id: one-line
          when:
            failedTest: t-lines
            outputIncludes: Отчёт сохранён
          where: Строки, которые пишет `f.write`
          why: >-
            В `report.txt` не две строки. Чаще всего записи слиплись: `write` не ставит `\n` сам,
            и получается «Серий: 3Сумма: 365». Бывает и так, что одной из записей нет. Загляни в
            «Файлы после запуска» — там видно, что случилось.
          try: Проверь, что пишутся обе строки отчёта и каждая заканчивается символом `\n`.
          verify: Проверка «В отчёте две строки» должна стать зелёной.
        - id: report-appended
          when:
            failedTest: t7
            outputIncludes: Отчёт сохранён
          where: Режим в `open` для `report.txt`
          why: >-
            Новый отчёт дописался к старому: строки с прошлого раза остались в `report.txt`. Так
            работает режим `"a"` — он сохраняет всё, что было в файле. А отчёт каждый раз
            считается заново по всем очкам, поэтому старый нужно заменять.
          try: >-
            Открой `report.txt` в режиме `"w"`: он очистит файл в момент открытия.
          verify: 'Проверка «Граничный случай: старый отчёт уже есть» должна стать зелёной.'
        - id: no-encoding
          when:
            failedTest: t-enc
            outputIncludes: Отчёт сохранён
          where: Вызовы `open()`
          why: >-
            В одном из `open()` не указана кодировка. В тренажёре это незаметно, а на русской
            Windows с Python 3.14 и раньше «Серий» и «Сумма» запишутся в cp1251 — и в редакторе с
            UTF-8 превратятся в кракозябры.
          try: Добавь `encoding="utf-8"` в каждый `open()` — и для чтения, и для записи.
          verify: Проверка «Кодировка указана» должна стать зелёной.
      afterPass: >-
        Отчёт лежит в отдельном файле, а исходные очки целы: если в программе найдётся ошибка, её
        можно исправить и запустить ещё раз. Улучшение: добавь третью строку отчёта
        `Средняя: …` — например, `round(total / count, 1)`, если серии в файле есть.
      skills: [files-paths, accumulators, loop-control]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Файл открывают так: `with open(имя, режим, encoding=\"utf-8\") as f:` — после блока `with` Python закрывает файл сам."
      - "Режим `\"r\"` — читать (по умолчанию), `\"w\"` — стереть и писать заново, `\"a\"` — дописать в конец."
      - "Строки из файла приходят с `\\n` на конце — его убирает `strip()`. А `write` не ставит `\\n` сам и принимает только одну строку."
      - "Кодировку указываем всегда: без `encoding=\"utf-8\"` на русской Windows с Python 3.14 и раньше текст превращается в кракозябры, а программу могут запустить где угодно."
    question: >-
      Почему в Практике 2 дневник открыт в режиме `"a"`, а в Практике 3 отчёт — в режиме `"w"`?
      Что будет, если перепутать режимы?
    answer: >-
      Дневник должен копиться: каждый запуск добавляет строку к старым, поэтому `"a"`. Отчёт
      каждый раз считается заново по всем очкам, поэтому `"w"` стирает старый. Если перепутать,
      с `"w"` дневник каждый вечер будет терять историю — как у Стаса в первой версии программы, а
      с `"a"` новый отчёт приклеится к старому, и в файле окажутся оба.
