            `runs.txt` — его видно в блоке «Файлы задания». Режим `"a"` при опечатке ошибку не
            выдаёт, он молча создаёт новый файл. А чтение без режима требует, чтобы файл уже был.
          try: >-
            Посмотри на последнюю строку ошибки — там имя, которое искал Python. Скопируй
            `runs.txt` из условия в каждый `open()`.
          verify: 'Ошибка FileNotFoundError должна исчезнуть, а в «Примере 1» — получиться `Пробежек: 4, всего км: 19.5`.'
        - id: wrong-mode-op
          when:
            errorType: UnsupportedOperation
          where: Режим в `open()` и то, что потом делают с файлом
          why: >-
            Это ошибка в коде, а не ограничение тренажёра: на компьютере будет то же самое. Файл
            открыт в одном режиме, а с ним делают другое. Без режима `open` открывает файл только
            для чтения, и писать в него нельзя (`not writable`). А из файла, открытого на
            дописывание, нельзя читать (`not readable`).
          try: >-
            Раздели работу на два блока `with`: сначала `open(…, "a", …)` и запись, потом
            отдельный `open` для чтения и подсчёт.
          verify: 'В «Примере 1» должно получиться `Пробежек: 4, всего км: 19.5`.'
        - id: write-not-str
          when:
            errorIncludes: write()
          where: Вызов `f.write`
          why: >-
            `write` принимает ровно одну строку. Число туда не пройдёт: `f.write(4.0)` — TypeError.
            Второе значение через запятую, как в `print`, — тоже ошибка: `f.write(distance, "\n")`.
            `print` сам превращает числа в текст и разделяет значения, а `write` — нет.
          try: >-
            Собери запись в одну строку: `f.write(distance + "\n")`, а если `distance` уже число —
            `f.write(f"{distance}\n")`.
          verify: 'Ошибка TypeError должна исчезнуть, а в «Примере 1» — получиться `Пробежек: 4, всего км: 19.5`.'
        - id: int-distance
          when:
            errorIncludes: invalid literal for int()
          where: "`int()` для дистанции"
          why: >-
            Дистанции бывают дробными — 2.5, 3.5, а `int()` превращает в число только целые:
            `int("2.5")` — ValueError.
          try: >-
            Для дробных чисел нужен `float()`. А для записи в файл число вообще не нужно — в файл
            пишется текст: `f.write(distance + "\n")`.
          verify: 'В «Примере 2» должно получиться `Пробежек: 2, всего км: 12.5`.'
        - id: blank-in-file
          when:
            errorIncludes: "float: '\\n'"
          where: Строка, которую пишет `f.write`
          why: >-
            В `runs.txt` появилась пустая строка, и `float()` не может превратить её в число. Файл
            и так кончается переводом строки, поэтому `"\n"` в **начале** новой записи даёт пустую
            строку между старыми записями и сегодняшней.
          try: >-
            Ставь перевод строки в конце записи: `distance + "\n"`. Загляни в «Файлы после
            запуска» — в `runs.txt` должно быть четыре строки без пустых.
          verify: 'В «Примере 1» должно получиться `Пробежек: 4, всего км: 19.5`.'
        - id: empty-piece
          when:
            errorIncludes: "float: ''"
          where: Значение, которое попало во `float()`
          why: >-
            Во `float()` попала пустая строка `""`. Так бывает, когда текст файла режут
            `split("\n")`: файл кончается `\n`, и после последнего разреза остаётся пустой кусок.
            Или в `runs.txt` появилась пустая строка, и `strip()` превратил её в `""`.
          try: >-
            Перебирай сам файл — `for line in f:`, как в стартовом коде. Если в «Файлах после
            запуска» в `runs.txt` видна пустая строка — ставь `"\n"` в конце записи, а не в
            начале.
          verify: 'В «Примере 1» должно получиться `Пробежек: 4, всего км: 19.5`.'
        - id: mode-w
          when:
            outputIncludes: "Пробежек: 1, всего км: 4.0"
          where: "`open` для записи сегодняшней пробежки"
          why: >-
            Отчёт увидел только сегодняшнюю запись. Чаще всего виноват режим `"w"`: он стирает файл
            в момент открытия, и записи 5, 3.5 и 7 пропадают. Это та самая ошибка из истории Стаса.
            Если режим уже `"a"`, проверь имя файла: при опечатке `"a"` создаёт новый пустой файл, и
            программа пишет и читает его, а не `runs.txt`.
          try: >-
            Открой `runs.txt` в режиме дописывания `"a"` — новая строка встанет в конец, старые
            останутся.
          verify: 'В «Примере 1» должно получиться `Пробежек: 4, всего км: 19.5`.'
        - id: not-counted
          when:
            outputIncludes: "Пробежек: 3, всего км: 15.5"
          where: Место и имя файла в записи
          why: >-
            Отчёт не увидел сегодняшнюю пробежку: когда шёл подсчёт, её в `runs.txt` не было. Так
            бывает, если запись ещё не добавлена, если она стоит после подсчёта или ушла в другой
            файл: при опечатке в имени режим `"a"` не выдаёт ошибку, а молча создаёт новый файл.
          try: >-
            Прочитай ввод и допиши его в файл до подсчёта, имя — `runs.txt`. Нажми «Запустить» и
            загляни в «Файлы после запуска»: изменённым должен быть `runs.txt`, а не новый файл.
          verify: 'В «Примере 1» должно получиться `Пробежек: 4, всего км: 19.5`.'
        - id: old-erased
          when:
            failedTest: t4
            outputIncludes: "Пробежек: 4, всего км: 19.5"
          where: "`open` для записи сегодняшней пробежки"
          why: >-
            Отчёт верный, но `runs.txt` после запуска не начинается со старых записей 5, 3.5 и 7:
            файл переписан заново, и старое пропало или сдвинулось. Чаще всего виноват режим
            `"w"`: он стирает файл в момент открытия. Это та самая ошибка из истории Стаса.
          try: >-
            Открой `runs.txt` для записи в режиме `"a"`: новая строка встанет в конец, старые
            останутся на месте. Проверь по «Файлам после запуска».
          verify: Проверка «Старые записи на месте» должна стать зелёной.
        - id: not-saved
          when:
            failedTest: t5
            outputIncludes: "Пробежек: 4, всего км: 19.5"
          where: Запись сегодняшней пробежки в файл
          why: >-
            Отчёт верный, но последней строкой в `runs.txt` после запуска не стоит сегодняшняя
            дистанция. Так бывает, если пробежку прибавили к итогу, а в файл не записали или
            записали в файл с другим именем. Завтра программа о ней не узнает.
          try: >-
            Допиши дистанцию в `runs.txt` в режиме `"a"` до подсчёта — тогда отчёт учтёт её сам.
            Проверь по «Файлам после запуска».
          verify: Проверка «Новая запись — последней строкой» должна стать зелёной.
        - id: no-newline
          when:
            failedTest: t5b
            outputIncludes: "Пробежек: 4, всего км: 19.5"
          where: Строка, которую пишет `f.write`
          why: >-
            Отчёт верный, но новая запись не закончилась переводом строки. `write` не добавляет
            `\n` сам, поэтому завтрашняя запись приклеится к сегодняшней: вместо 4 и 6 в файле
            окажется 46.
          try: Допиши `"\n"` в конец записываемой строки.
          verify: Проверка «Запись заканчивается переводом строки» должна стать зелёной.
        - id: no-encoding
          when:
            failedTest: t-enc
            outputIncludes: "Пробежек:"
          where: Вызовы `open()`
          why: >-
            В одном из `open()` не указана кодировка. Сейчас в дневнике только цифры, и разницы не
            видно. Но стоит появиться в файле русскому слову, например «парк», — и на русской
            Windows с Python 3.14 и раньше запись или чтение без кодировки пойдут в cp1251:
            получатся кракозябры или ошибка UnicodeDecodeError.
          try: Добавь `encoding="utf-8"` в каждый `open()` — и для записи, и для чтения.
          verify: Проверка «Кодировка указана» должна стать зелёной.
      afterPass: >-
        Записи копятся, а отчёт сразу учитывает сегодняшнюю. В тренажёре каждый запуск начинается с
        исходного файла, а на компьютере `runs.txt` рос бы от запуска к запуску, как настоящий
        дневник. Улучшение: убирай пробелы по краям ввода — `input().strip()`, — чтобы в файл не
        попадало лишнее.
      skills: [files-paths, type-conversion]

  - id: practice-report
    type: exercise
    title: Практика 3
    exercise:
      id: m7-l1-e3
      kind: write
      title: Итоги тренировки по дартсу
      statement: |-
        В клубе дартса после тренировки записывают очки каждой серии — трёх бросков подряд — в
        файл `scores.txt`, по одному целому числу в строке. Между сериями иногда остаются пустые
        строки (бывает, что в них есть пробелы), их считать не нужно.

        Напиши программу, которая создаёт файл отчёта `report.txt` из двух строк: сколько было
        серий и сколько очков набрано всего. Для файла из задания (120, 95 и 150) отчёт такой:

        ```text
        Серий: 3
        Сумма: 365
        ```

        На экран программа выводит одну строку: `Отчёт сохранён в report.txt`. Файл `scores.txt`
        не меняй — отчёт пишется в новый файл.
