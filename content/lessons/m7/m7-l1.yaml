id: m7-l1
module: m7
number: "7.1"
title: "Файлы: открыть, прочитать, записать"
objective: >-
  Читать текстовый файл целиком и построчно и записывать или дописывать строки через
  `with open(…, encoding="utf-8")`, осознанно выбирая режим `r`, `w` или `a`.
minutes: [25, 30]
prerequisites: [m6-l6]
skills: [files-paths]
environment: python

story:
  title: Дневник пробежек, который стирал сам себя
  fictional: true
  text: >-
    Стас готовится к первому забегу на 10 км. Сначала он записывал пробежки в заметки на
    телефоне, но заметки перемешались, и посчитать, сколько он пробежал за месяц, так и не вышло.
    Сестра Лада написала ему маленькую программу, которая спрашивает дистанцию, дописывает строку
    в файл `runs.txt` и сразу считает сумму. Первая версия каждый вечер стирала всё, что было
    записано раньше, — файл открывался не в том режиме. После исправления одной буквы записи
    копятся уже третий месяц.

why: >-
  Всё, что лежит в переменных, пропадает, когда программа заканчивает работу. Файл хранит данные
  между запусками: например, дневник пробежек, который каждый вечер пополняется одной строкой.

usedIn: >-
  Журналы работы программ (логи), заметки и дневники, файлы настроек, выгрузки из учётных
  программ — программа, которая «помнит», что было вчера, чаще всего хранит это в файлах.

steps:
  - id: files-read
    type: theory
    title: Файл, open и with
    body: |-
      Пока программа работает, данные живут в переменных. Программа закончилась — переменных
      больше нет. **Файл** лежит на диске и остаётся после программы: завтра его можно прочитать
      снова.

      **Текстовый файл** — это строки текста. В конце каждой строки стоит невидимый символ
      **перевода строки**. В Python он записывается как `\n` — это один символ, хоть и пишется
      двумя знаками.

      Чтобы прочитать файл, его открывают:

      ```python
      with open("runs.txt", encoding="utf-8") as f:
          text = f.read()
      print(text)
      ```

      - `open("runs.txt", …)` открывает файл по имени. Python ищет его в папке, из которой
        запущена программа. О папках и путях — в следующем уроке.
      - `f` — **файловый объект**, то есть «открытый файл». Через него читают и пишут. Имя можно
        выбрать любое: `f`, `file`, `diary`.
      - `with … as f:` — блок, внутри которого файл открыт. Когда блок кончается, Python сам
        закрывает файл, даже если внутри случилась ошибка. Без `with` файл пришлось бы закрывать
        вручную, а это легко забыть.

      Прочитать файл можно двумя способами:

      - `f.read()` — весь текст одним значением-строкой, со всеми `\n` внутри;
      - `for line in f:` — по одной строке за шаг цикла. **Каждая строка приходит вместе с `\n`
        на конце** (у последней строки файла его может и не быть), поэтому обычно пишут
        `line.strip()`.

      **Кодировка** — таблица, по которой буквы превращаются в байты (числа, которыми текст
      хранится на диске). Сейчас почти везде используют UTF-8. Но Python 3.14 и более ранние
      версии на русской Windows без подсказки читают и пишут файлы в другой кодировке, cp1251, и
      вместо «Привет» получается «РџСЂРёРІРµС‚» или ошибка UnicodeDecodeError. С Python 3.15 по
      умолчанию UTF-8 и на Windows, но программу могут запустить и на старом Python. Поэтому в
      каждом `open` пиши `encoding="utf-8"`.

      **Как это устроено в тренажёре.** Файлы задания уже лежат рядом с программой, их видно в
      блоке «Файлы задания». Каждый запуск начинается заново: в папке только файлы задания. Что
      программа создала или изменила, видно после запуска в блоке «Файлы после запуска», но к
      следующему запуску всё вернётся как было. На компьютере записанное остаётся на диске.
    simpler: >-
      Файл — тетрадь на полке. `open` — взять тетрадь, `with` — «когда закончишь, положи на
      место». Строки из тетради приходят вместе со знаком «новая строка» `\n`, его убирает
      `strip()`. А `encoding="utf-8"` говорит, каким алфавитом тетрадь написана, чтобы буквы не
      перепутались.
    coach: >-
      Запомни связку целиком: `with open(имя, encoding="utf-8") as f:` — так мы открываем файлы во
      всём модуле.

  - id: runs-total
    type: example
    title: Сколько я пробежал
    body: >-
      Часть программы Лады, которая считает итог: она читает дневник `runs.txt` (его видно в
      блоке «Файлы задания») и считает пробежки и километры. Нажми «Запустить».
    code: |-
      total = 0
      count = 0
      with open("runs.txt", encoding="utf-8") as f:
          for line in f:
              count += 1
              total += float(line)
      print(f"Пробежек: {count}, всего км: {total}")
    files:
      runs.txt: |
        5
        3.5
        7
    notes:
      - line: 3
        text: >-
          Открываем файл для чтения, с кодировкой. Внутри блока `with` файл открыт, после блока
          Python закроет его сам.
      - line: 4
        text: >-
          Цикл по файлу: за каждый шаг в `line` попадает одна строка — `"5\n"`, потом `"3.5\n"`,
          потом `"7\n"`.
      - line: 6
        text: >-
          `float()` сам отбрасывает `\n` и пробелы по краям, поэтому `float("3.5\n")` даёт 3.5.
      - line: 7
        text: >-
          Эта строка уже вне `with`: файл закрыт, но переменные `count` и `total` остались и
          хранят результат.
    tryIt: >-
      Добавь в цикл `print(line)` и запусти: между числами появятся пустые строки. Это `\n` из
      файла плюс перевод строки, который добавляет сам `print`. Потом замени на
      `print(line.strip())` — пустые строки пропадут. А чтобы прочитать файл целиком, замени весь
      цикл (строки 4–6) одной строкой `print(f.read())` с тем же отступом: числа выведутся
      сразу все, а в итоге будет 0 пробежек — цикла, который считал, больше нет.
    coach: >-
      Файл закрывается сам, как только кончается блок `with`. Поэтому всё, что нужно из файла,
      достань внутри блока.

  - id: mojibake
    type: quiz
    title: Что за «РџСЂРёРІРµС‚»?
    question: >-
      Инна записала в файл слово «Привет» на ноутбуке с macOS, а Савва открыл этот файл
      программой без `encoding` на Windows, где стоит Python 3.14, и увидел «РџСЂРёРІРµС‚». Что
      произошло?
    options:
      - Файл повредился, когда его копировали
      - Файл записан в UTF-8, а прочитан в другой кодировке
      - Python на Windows не умеет читать русский текст
    correct: 1
    explanation: >-
      Байты в файле те же самые, но Python переводил их в буквы по другой таблице — cp1251: так
      Python 3.14 и более ранние версии читают файлы на русской Windows. Если при чтении указать
      `encoding="utf-8"`, «Привет» вернётся. На macOS и Linux по умолчанию и так UTF-8 (а с
      Python 3.15 — и на Windows), поэтому программа без `encoding` «работает у автора» и
      ломается у коллеги со старым Python на Windows.
    coach: >-
      Кракозябры почти всегда значат не «файл сломался», а «прочитали не в той кодировке».

  - id: practice-boxes
    type: exercise
    title: Практика 1
    exercise:
      id: m7-l1-e1
      kind: repeat
      title: Коробки для переезда
      statement: |-
        Семья переезжает, и каждую коробку нужно подписать номером. В файле `boxes.txt` записано,
        что лежит в каждой коробке, — по строке на коробку. Напиши программу, которая выводит
        пронумерованный список, а последней строкой — сколько всего коробок. Пробелы по краям
        строк из файла в вывод попадать не должны.

        Для файла из задания вывод такой:

        ```text
        1. посуда
        2. книги
        3. зимние вещи
        Всего: 3
        ```
      input: Файл `boxes.txt` — по одной строке на коробку. Файл может быть и пустым.
      output: "Строки `номер. содержимое` с номерами от 1, последняя — `Всего: N`."
      constraints:
        - Читай данные из файла `boxes.txt`, а не записывай список в код.
        - "В `open()` укажи кодировку: `encoding=\"utf-8\"`."
      files:
        boxes.txt: |
          посуда
          книги
          зимние вещи
      starterCode: |
        # Прочитай boxes.txt и выведи пронумерованный список коробок
        # Последней строкой выведи «Всего: N»
      tests:
        - id: t1
          kind: io
          title: "Пример 1: файл из задания"
          example: true
          expected: |-
            1. посуда
            2. книги
            3. зимние вещи
            Всего: 3
        - id: t2
          kind: io
          title: "Пример 2: пять коробок"
          example: true
          files:
            boxes.txt: |
              инструменты
              игрушки
              постельное бельё
              лампы
              документы
          expected: |-
            1. инструменты
            2. игрушки
            3. постельное бельё
            4. лампы
            5. документы
            Всего: 5
        - id: t3
          kind: io
          title: "Граничный случай: пустой файл"
          edge: true
          files:
            boxes.txt: ""
          expected: "Всего: 0"
        - id: t4
          kind: io
          title: "Граничный случай: в конце файла нет перевода строки"
          edge: true
          files:
            boxes.txt: "посуда\nкниги"
          expected: |-
            1. посуда
            2. книги
            Всего: 2
        - id: t5
          kind: io
          title: "Граничный случай: пробелы по краям строки"
          edge: true
          files:
            boxes.txt: "  лампы  \nкниги\n"
          expected: |-
            1. лампы
            2. книги
            Всего: 2
        - id: t-enc
          kind: assert
          title: Кодировка указана
          code: |
            import ast
            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            calls = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Call)
                     and (getattr(n.func, "id", None) in names or getattr(n.func, "attr", None) in names)]
            assert all(any(k.arg == "encoding" for k in c.keywords) for c in calls)
          message: >-
            В одном из `open()` не указана кодировка. Добавь `encoding="utf-8"` — иначе на
            Windows со старым Python (до 3.15) русский текст превратится в кракозябры.
      criteria:
        - Строки читаются из `boxes.txt`, номера идут подряд с 1.
        - Перевод строки и пробелы по краям из файла в вывод не попадают, пустых строк между пунктами нет.
        - "Последняя строка — `Всего: N`; для пустого файла — `Всего: 0`."
        - "В `open()` указана кодировка `encoding=\"utf-8\"`."
      hints:
        - >-
          В примере «Сколько я пробежал» уже есть и перебор строк файла, и счётчик. Подумай, что
          приходит в `line` вместе с текстом и в какой момент увеличивать счётчик, чтобы первая
          коробка получила номер 1.
        - |-
          Нумерация со счётчиком на другом материале:
          ```python
          number = 0
          for city in ["Казань", "Тула"]:
              number += 1
              print(f"{number}) {city}")
          ```
          Строка из файла отличается тем, что на конце у неё `\n`: `"Тула\n".strip()` даёт `"Тула"`.
        - |-
          Каркас:
          ```text
          count = 0
          with open(имя файла, encoding=…) as f:
              для каждой строки line из f:
                  увеличить count
                  вывести count, точку, пробел и line без \n и пробелов по краям
          вывести "Всего: " и count
          ```
      solution:
        code: |
          count = 0
          with open("boxes.txt", encoding="utf-8") as f:
              for line in f:
                  count += 1
                  print(f"{count}. {line.strip()}")
          print(f"Всего: {count}")
        explanation: >-
          `for line in f` отдаёт строки файла по одной, вместе с `\n` на конце. Счётчик
          увеличивается до `print`, поэтому нумерация начинается с 1. `line.strip()` убирает и
          перевод строки, и пробелы по краям, а пробел внутри «зимние вещи» остаётся. Итог
          печатается уже после цикла: для пустого файла цикл не выполнится ни разу, и выйдет
          `Всего: 0`.
      altSolutions:
        - code: |
            count = 0
            with open("boxes.txt", "r", encoding="utf-8") as file:
                for line in file:
                    count = count + 1
                    name = line.strip()
                    print(str(count) + ". " + name)
            print("Всего:", count)
          note: Режим "r" указан явно, склейка строк вместо f-строки.
        - code: |
            boxes = []
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    boxes.append(line.strip())
            for i in range(len(boxes)):
                print(f"{i + 1}. {boxes[i]}")
            print(f"Всего: {len(boxes)}")
          note: Сначала собрать список, потом вывести его с номерами.
        - code: |
            with open("boxes.txt", encoding="utf-8") as f:
                parts = f.read().split("\n")
            count = 0
            for part in parts:
                if part.strip() != "":
                    count += 1
                    print(f"{count}. {part.strip()}")
            print(f"Всего: {count}")
          note: f.read() и split("\n") с пропуском пустых кусков.
        - code: |
            with open("boxes.txt", encoding="utf-8") as f:
                lines = f.read().splitlines()
            for i in range(len(lines)):
                print(f"{i + 1}. {lines[i].strip()}")
            print(f"Всего: {len(lines)}")
          note: splitlines() (он появится в следующем уроке) делит текст на строки без \n.
        - code: |
            number = 0
            with open("boxes.txt", encoding="utf-8") as boxes_file:
                for row in boxes_file:
                    number = number + 1
                    print(number, ". ", row.strip(), sep="")
            print("Всего: " + str(number))
          note: Другие имена, print с sep="", склейка для итога.
        - code: |
            count = 0
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    item = line.strip()
                    if item == "":
                        continue
                    count += 1
                    print(f"{count}. {item}")
            print(f"Всего: {count}")
          note: Улучшение из afterPass — пустые строки пропускаются через continue.
        - code: |
            with open("boxes.txt", encoding="utf-8") as f:
                lines = f.readlines()
            i = 0
            while i < len(lines):
                print(f"{i + 1}. {lines[i].strip()}")
                i += 1
            print(f"Всего: {len(lines)}")
          note: readlines() и while с индексом.
        - code: |
            result = []
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    result.append(f"{len(result) + 1}. {line.strip()}")
            result.append(f"Всего: {len(result)}")
            print("\n".join(result))
          note: Список готовых строк и один print через join.
        - code: |
            f = open("boxes.txt", encoding="utf-8")
            text = f.read()
            f.close()
            count = 0
            for line in text.split("\n"):
                if line.strip() != "":
                    count += 1
                    print(str(count) + ". " + line.strip())
            print("Всего:", count)
          note: open без with и close() вручную, read().split("\n") с пропуском пустых кусков.
      wrongSolutions:
        - code: |
            count = 0
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
                    print(f"{count}. {line}")
            print(f"Всего: {count}")
          note: Строка печатается вместе с \n — между пунктами пустые строки.
          expectMistake: extra-blank-lines
        - code: |
            count = 0
            with open("boxes.txt", encoding="utf-8") as f:
                text = f.read()
            for line in text:
                count += 1
                print(f"{count}. {line.strip()}")
            print(f"Всего: {count}")
          note: Перебор строки из f.read() идёт по буквам.
          expectMistake: chars-not-lines
        - code: |
            with open("boxes.txt", encoding="utf-8") as f:
                parts = f.read().split("\n")
            count = 0
            for part in parts:
                count += 1
                print(f"{count}. {part.strip()}")
            print(f"Всего: {count}")
          note: split("\n") оставляет пустой кусок после последнего \n — лишняя «коробка».
          expectMistake: split-tail
        - code: |
            count = 0
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    print(f"{count}. {line.strip()}")
                    count += 1
            print(f"Всего: {count}")
          note: Счётчик увеличивается после print — нумерация с нуля.
          expectMistake: count-from-zero
        - code: |
            count = 0
            with open("box.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
                    print(f"{count}. {line.strip()}")
            print(f"Всего: {count}")
          note: Опечатка в имени файла.
          expectMistake: file-name
        - code: |
            count = 0
            with open("boxes.txt") as f:
                for line in f:
                    count += 1
                    print(f"{count}. {line.strip()}")
            print(f"Всего: {count}")
          note: Не указана кодировка — в тренажёре вывод верный, на Windows будут кракозябры.
          expectMistake: no-encoding
        - code: |
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    count = 0
                    count += 1
                    print(f"{count}. {line.strip()}")
            print(f"Всего: {count}")
          note: Счётчик обнуляется на каждом шаге цикла.
          expectMistake: counter-in-loop
        - code: |
            count = 0
            with open("boxes.txt", encoding="utf-8") as f:
                print("Коробки:")
            for line in f:
                count += 1
                print(f"{count}. {line.strip()}")
            print(f"Всего: {count}")
          note: Цикл по файлу стоит после блока with — файл уже закрыт.
          expectMistake: closed-file
        - code: |
            with open("boxes.txt", encoding="utf-8") as f:
                words = f.read().split()
            count = 0
            for word in words:
                count += 1
                print(f"{count}. {word}")
            print(f"Всего: {count}")
          note: split() без аргумента режет «зимние вещи» на две коробки.
          expectMistake: split-words
        - code: |
            count = 0
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
                    name = line.replace("\n", "")
                    print(f"{count}. {name}")
            print(f"Всего: {count}")
          note: Убран только перевод строки (replace), пробелы по краям остались.
          expectMistake: spaces-left
        - code: |
            count = 0
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
                    name = line.rstrip("\n")
                    print(f"{count}. {name}")
            print(f"Всего: {count}")
          note: rstrip("\n") убирает только перевод строки — пробелы в начале остались.
          expectMistake: spaces-left
        - code: |
            with open("boxes.txt", encoding="utf-8") as f:
                lines = f.read().strip().split("\n")
            for i in range(len(lines)):
                print(f"{i + 1}. {lines[i].strip()}")
            print(f"Всего: {len(lines)}")
          note: Для пустого файла split даёт [""] — одна коробка без подписи.
          expectMistake: null
        - code: |
            count = 0
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
                    print(f"{count}. {line[:-1]}")
            print(f"Всего: {count}")
          note: line[:-1] — у последней строки без \n отрезается буква.
          expectMistake: null
        - code: |
            count = 1
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    print(f"{count}. {line.strip()}")
                    count += 1
            print(f"Всего: {count}")
          note: Счётчик с 1 и увеличение после print — итог на 1 больше.
          expectMistake: null
        - code: |
            count = 0
            with open("boxes.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
                    print(f"{count}. {line}", end="")
            print(f"Всего: {count}")
          note: end="" вместо strip() — без \n в конце файла итог приклеивается.
          expectMistake: null
      mistakes:
        - id: closed-file
          when:
            errorIncludes: closed file
          where: Строки после блока `with`
          why: >-
            Файл закрывается, как только кончается блок `with`. Строка, на которой остановилась
            программа, работает с `f` уже после блока, а файл закрыт: `I/O operation on closed
            file`.
          try: >-
            Сдвинь цикл по файлу внутрь блока — с отступом под `with`. После блока можно
            пользоваться переменными, которые ты заполнил внутри, но не самим `f`.
          verify: 'В «Примере 1» должно получиться три пункта и `Всего: 3`.'
        - id: file-name
          when:
            errorType: FileNotFoundError
          where: Имя файла в `open()`
          why: >-
            Python не нашёл рядом с программой файл с таким именем. В рабочей папке лежит
            `boxes.txt` — его видно в блоке «Файлы задания». Имя должно совпадать до буквы: без
            опечаток, с тем же расширением `.txt` и строчными буквами.
          try: Скопируй имя файла из условия — `boxes.txt` — и вставь его в `open()`.
          verify: Ошибка FileNotFoundError должна исчезнуть, а в «Примере 1» появится список из трёх коробок.
        - id: chars-not-lines
          when:
            outputIncludes: "1. п\n2. о"
          where: Цикл `for` после `f.read()`
          why: >-
            `f.read()` вернул весь текст файла одним значением-строкой, со всеми `\n` внутри. Цикл
            `for` по такому значению идёт **по символам**: «п», «о», «с»… Поэтому каждая буква
            получила свой номер. По строкам файла идёт только цикл по самому файлу.
          try: >-
            Перебирай сам файл — `for line in f:` внутри блока `with`. Тогда за шаг цикла
            приходит целая строка.
          verify: 'В «Примере 1» должно получиться три пункта и `Всего: 3`.'
        - id: extra-blank-lines
          when:
            outputIncludes: "посуда\n\n"
          where: "`print` внутри цикла"
          why: >-
            Строка из файла приходит вместе с `\n` на конце, а `print` добавляет свой перевод
            строки. Два перевода подряд — и между пунктами появляется пустая строка.
          try: Убери перевод строки и пробелы по краям — выводи `line.strip()`.
          verify: В «Примере 1» пункты должны идти подряд, без пустых строк между ними.
        - id: split-tail
          when:
            outputIncludes: "4.\nВсего: 4"
          where: '`split("\n")`'
          why: >-
            `split("\n")` режет текст по переводам строк. Файл заканчивается `\n`, поэтому после
            последнего разреза остаётся пустой кусок `""` — он и стал четвёртой «коробкой» без
            подписи.
          try: >-
            Перебирай файл построчно — `for line in f:`, — или пропускай пустые куски:
            `if part.strip() == "": continue`.
          verify: 'В «Примере 1» должно получиться `Всего: 3`.'
        - id: split-words
          when:
            outputIncludes: "3. зимние\n4. вещи"
          where: "`split()` без аргумента"
          why: >-
            `split()` без аргумента режет текст по любым пробелам, а не только по переводам строк.
            Поэтому «зимние вещи» распались на две коробки: «зимние» и «вещи».
          try: >-
            Перебирай сам файл — `for line in f:` — и убирай края через `line.strip()`: пробел
            внутри строки останется.
          verify: 'В «Примере 1» должно получиться `3. зимние вещи` и `Всего: 3`.'
        - id: count-from-zero
          when:
            outputIncludes: "0. посуда"
          where: Порядок строк внутри цикла
          why: >-
            Номер печатается раньше, чем увеличивается счётчик, поэтому первая коробка получила
            номер 0. Итог при этом верный: к концу цикла счётчик всё-таки досчитал до 3.
          try: Поменяй строки местами — сначала `count += 1`, потом `print`.
          verify: В «Примере 1» первая строка должна быть `1. посуда`.
        - id: counter-in-loop
          when:
            outputIncludes: "1. посуда\n1. книги"
          where: "`count = 0` внутри цикла"
          why: >-
            Все коробки получили номер 1: счётчик обнуляется на каждом шаге цикла, а потом
            сразу становится 1. Начальное значение задают один раз — до цикла.
          try: Перенеси `count = 0` выше блока `with`.
          verify: 'В «Примере 1» должны получиться номера 1, 2, 3 и `Всего: 3`.'
        - id: spaces-left
          when:
            failedTest: t5
            outputIncludes: "  лампы"
          where: То, что убирает `\n` из строки
          why: >-
            Перевод строки убран, а пробелы по краям, которые были в файле, остались — отсюда
            лишние пробелы перед «лампы». `replace("\n", "")`, `rstrip("\n")` и срез `line[:-1]`
            трогают только `\n`.
          try: Используй `line.strip()` — он убирает и перевод строки, и пробелы по краям.
          verify: 'Проверка «Граничный случай: пробелы по краям строки» должна стать зелёной.'
        - id: no-encoding
          when:
            failedTest: t-enc
            outputIncludes: "Всего:"
          where: Вызов `open()`
          why: >-
            В `open()` не указана кодировка. В тренажёре этого не видно: здесь по умолчанию
            UTF-8. А на русской Windows с Python 3.14 и раньше файл прочитается в cp1251, и
            вместо «посуда» будут кракозябры или ошибка UnicodeDecodeError.
          try: Добавь в `open()` аргумент `encoding="utf-8"`.
          verify: Проверка «Кодировка указана» должна стать зелёной.
      afterPass: >-
        Список печатается аккуратно при любом числе строк — даже для пустого файла. Улучшение:
        пропускай пустые строки через `if line.strip() == "": continue` — тогда случайный пустой
        абзац в файле не превратится в коробку без подписи.
      skills: [files-paths, accumulators, string-methods]

  - id: w-twice
    type: predict
    title: Две записи в дневник
    prompt: >-
      У `open` бывает второй аргумент — режим. `"w"` (от write — «писать») открывает файл для
      записи, а `f.write(текст)` записывает в него текст. Программа записывает в дневник
      понедельник, потом вторник, а потом читает, что получилось. Как думаешь, что она выведет?
    code: |-
      with open("log.txt", "w", encoding="utf-8") as f:
          f.write("Пн: 5 км\n")
      with open("log.txt", "w", encoding="utf-8") as f:
          f.write("Вт: 3 км\n")
      with open("log.txt", encoding="utf-8") as f:
          print(f.read())
    options:
      - |-
        Пн: 5 км
        Вт: 3 км
      - "Вт: 3 км"
      - "Пн: 5 км"
    answer: "Вт: 3 км"
    explanation: >-
      Режим `"w"` стирает файл в момент открытия. Второй `open` стёр понедельник ещё до того, как
      записался вторник. Кажется, что второй блок допишет строку, но дописывает другой режим —
      `"a"`: с ним во втором `open` строк было бы две. Загляни в «Файлы после запуска» — в
      `log.txt` одна строка. Все режимы разберём в следующем шаге.
    coach: >-
      Открывая файл на запись, сначала реши: копить записи или начать с чистого листа.

  - id: files-write
    type: theory
    title: Записать заново или дописать
    body: |-
      Второй аргумент `open` — **режим**. Он говорит, что мы собираемся делать с файлом:

      - `"r"` — читать (read). Это режим по умолчанию, поэтому до сих пор мы его не писали.
      - `"w"` — писать (write). Если файла нет, он создаётся. Если файл есть, **всё его
        содержимое стирается в момент открытия** — ещё до того, как ты что-то записал. Поэтому
        в прогнозе понедельник и пропал.
      - `"a"` — дописывать (append). Новое добавляется в конец, старое остаётся. Если файла нет,
        он создаётся.

      ```python
      with open("plan.txt", "a", encoding="utf-8") as f:
          f.write("суббота: длинная пробежка\n")
      ```

      Пишет в файл `f.write(текст)`. У него две особенности:

      - принимает **ровно одну строку**: и `f.write(5)`, и `f.write("км:", 5)` — ошибка
        TypeError. Число сначала преврати в текст: `f.write(f"{km}\n")` или `str(km)`;
      - **сам не переводит строку**: без `\n` в конце следующая запись приклеится к этой.

      Есть вариант попроще: `print(km, file=f)` печатает не на экран, а в файл. Как обычно у
      `print`, число превращается в текст само, а в конце ставится `\n`.

      Два частых заблуждения: «`"w"` допишет в конец» — нет, он начинает файл с чистого листа; и
      «`write` сам перенесёт строку» — нет, перевод строки пишешь ты.

      **Правило для работы с данными:** результат обработки записывай в **новый** файл, а
      исходный не трогай. Если в программе окажется ошибка, исходные данные останутся целы, и
      программу можно просто исправить и запустить снова. Дневник, который программа пополняет, —
      другое дело: дописывать в него и есть её работа. Подробнее об учебной папке и копиях — в
      следующем уроке.
    simpler: >-
      `"w"` — вырвать из тетради все листы и писать заново. `"a"` — открыть тетрадь на последней
      странице и продолжить. `write` пишет ровно то, что ему дали, и даже новую строку сам не
      начинает.
    coach: >-
      Одна буква в `open` решает, останутся ли старые записи — это та самая ошибка из истории
      Стаса. Перед `"w"` спроси себя: этот файл точно можно стереть?

  - id: practice-runs
    type: exercise
    title: Практика 2
    exercise:
      id: m7-l1-e2
      kind: modify
      title: Пробежка за сегодня
      statement: |-
        Лада дорабатывает свою программу для брата. Пока программа только считает пробежки из
        `runs.txt`. Пусть теперь она сначала спрашивает сегодняшнюю дистанцию и дописывает её в
        `runs.txt` отдельной строкой, а отчёт учитывает и новую запись. Старые записи должны
        остаться на месте.

        Например, в `runs.txt` записаны 5, 3.5 и 7, а сегодня Стас пробежал 4 км. Вывод:

        ```text
        Пробежек: 4, всего км: 19.5
        ```

        А в файле после запуска четыре строки: `5`, `3.5`, `7` и `4`.
      input: Одна строка — сегодняшняя дистанция в километрах, например `4` или `2.5`.
      output: >-
        Одна строка: `Пробежек: N, всего км: S`. Сумма дробная, поэтому 6 км выводятся как `6.0`.
      constraints:
        - Старые записи в `runs.txt` не стирай — новая запись добавляется в конец файла.
        - Каждая запись — на своей строке.
        - "В каждом `open()` укажи кодировку `encoding=\"utf-8\"`."
      files:
        runs.txt: |
          5
          3.5
          7
      starterCode: |
        total = 0
        count = 0
        with open("runs.txt", encoding="utf-8") as f:
            for line in f:
                count += 1
                total += float(line)
        print(f"Пробежек: {count}, всего км: {total}")
      tests:
        - id: t1
          kind: io
          title: "Пример 1: сегодня 4 км"
          example: true
          stdin: "4\n"
          expected: "Пробежек: 4, всего км: 19.5"
        - id: t2
          kind: io
          title: "Пример 2: в дневнике одна запись"
          example: true
          stdin: "2.5\n"
          files:
            runs.txt: "10\n"
          expected: "Пробежек: 2, всего км: 12.5"
        - id: t3
          kind: io
          title: "Граничный случай: дневник пустой"
          edge: true
          stdin: "6\n"
          files:
            runs.txt: ""
          expected: "Пробежек: 1, всего км: 6.0"
        - id: t4
          kind: assert
          title: Старые записи на месте
          example: true
          stdin: "4\n"
          code: |
            import os
            assert os.path.exists("runs.txt")
            with open("runs.txt", encoding="utf-8") as check_file:
                saved = check_file.read()
            assert saved.startswith("5\n3.5\n7\n")
          message: >-
            После запуска в `runs.txt` остаются старые записи 5, 3.5 и 7, а сегодняшняя стоит
            после них.
        - id: t5
          kind: assert
          title: Новая запись — последней строкой
          stdin: "4\n"
          code: |
            import os
            assert os.path.exists("runs.txt")
            with open("runs.txt", encoding="utf-8") as check_file:
                rows = check_file.read().splitlines()
            assert len(rows) == 4 and rows[3].strip() in ("4", "4.0")
          message: >-
            После запуска в `runs.txt` ровно четыре строки: `5`, `3.5`, `7` и последней —
            сегодняшняя `4`.
        - id: t5b
          kind: assert
          title: Запись заканчивается переводом строки
          stdin: "4\n"
          code: |
            import os
            assert os.path.exists("runs.txt")
            with open("runs.txt", encoding="utf-8") as check_file:
                saved = check_file.read()
            assert saved.endswith("\n")
          message: >-
            После запуска `runs.txt` заканчивается переводом строки `\n`. Иначе завтрашняя запись
            приклеится к сегодняшней.
        - id: t-enc
          kind: assert
          title: Кодировка указана
          stdin: "4\n"
          code: |
            import ast
            source = open(__file__, encoding="utf-8").read()
            names = {"open", "read_text", "write_text"}
            calls = [n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.Call)
                     and (getattr(n.func, "id", None) in names or getattr(n.func, "attr", None) in names)]
            assert all(any(k.arg == "encoding" for k in c.keywords) for c in calls)
          message: >-
            В одном из `open()` не указана кодировка. Добавь `encoding="utf-8"` — иначе на
            Windows со старым Python (до 3.15) русский текст превратится в кракозябры.
      criteria:
        - Сегодняшняя дистанция берётся из ввода и дописывается в конец `runs.txt`.
        - Старые записи остаются в файле, новая стоит отдельной строкой и заканчивается `\n`.
        - Отчёт считается после записи и учитывает сегодняшнюю пробежку.
        - "В каждом `open()` указана кодировка `encoding=\"utf-8\"`."
      hints:
        - >-
          Подумай о двух вещах. Что должно произойти раньше: запись сегодняшней пробежки или
          подсчёт? И в каком режиме открыть файл для записи, чтобы старые строки не пропали?
        - |-
          Дописать строку в конец файла на другом примере, в список дел:
          ```python
          task = "полить цветы"
          with open("todo.txt", "a", encoding="utf-8") as f:
              f.write(task + "\n")
          ```
          Строка встанет в конец `todo.txt`, всё, что там было, останется. `write` принимает
          одну строку, поэтому `"\n"` приклеен к тексту через `+`.
        - |-
          Каркас:
          ```text
          distance = input(...)
          with open("runs.txt", режим дописывания, encoding=...) as f:
              записать одну строку: distance, а в конце "\n"
          # дальше — код подсчёта без изменений
          ```
      solution:
        code: |
          distance = input("Сколько км сегодня? ")
          with open("runs.txt", "a", encoding="utf-8") as f:
              f.write(distance + "\n")

          total = 0
          count = 0
          with open("runs.txt", encoding="utf-8") as f:
              for line in f:
                  count += 1
                  total += float(line)
          print(f"Пробежек: {count}, всего км: {total}")
        explanation: >-
          Сначала дистанция дописывается в конец файла: режим `"a"` не трогает старые строки, а
          `"\n"` заканчивает новую запись, чтобы завтрашняя не приклеилась к ней. Первый блок
          `with` закрывает файл, и запись уже на диске. Потом тот же файл открывается заново для
          чтения, и цикл считает все строки вместе с сегодняшней. Превращать ввод в число для
          записи не нужно: в файл пишется текст.
      altSolutions:
        - code: |
            distance = input()
            with open("runs.txt", "a", encoding="utf-8") as diary:
                print(distance, file=diary)

            total = 0
            count = 0
            with open("runs.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
                    total += float(line)
            print(f"Пробежек: {count}, всего км: {total}")
          note: print(..., file=...) сам добавляет перевод строки.
        - code: |
            km = float(input())
            with open("runs.txt", "a", encoding="utf-8") as f:
                f.write(f"{km}\n")

            total = 0
            count = 0
            with open("runs.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
                    total += float(line)
            print(f"Пробежек: {count}, всего км: {total}")
          note: Дистанция сначала превращена в число и записана через f-строку («4.0»).
        - code: |
            total = 0
            count = 0
            with open("runs.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
                    total += float(line)

            distance = input()
            with open("runs.txt", "a", encoding="utf-8") as f:
                f.write(distance + "\n")
            count += 1
            total += float(distance)
            print(f"Пробежек: {count}, всего км: {total}")
          note: Сначала подсчёт старых записей, потом запись и добавка сегодняшней к итогу.
        - code: |
            today = input()
            with open("runs.txt", encoding="utf-8") as f:
                old = f.read()
            with open("runs.txt", "w", encoding="utf-8") as f:
                f.write(old + today + "\n")
            total = 0
            count = 0
            with open("runs.txt", encoding="utf-8") as f:
                for line in f:
                    count += 1
