          note: Забыт int() — к сумме прибавляется текст.
          expectMistake: text-not-number
        - code: |
            count = 0
            total = 0
            with open("scores.txt", encoding="utf-8") as f:
                for line in f:
                    if line.strip() == "":
                        continue
                    count += 1
                    total += int(line)
            with open("report.txt", "w", encoding="utf-8") as f:
                f.write(f"Серий: {count}\n")
                f.write(f"Сумма: {total}\n")
                f.write("Отчёт сохранён в report.txt\n")
          note: Сообщение ушло в файл, а на экран ничего не выведено.
          expectMistake: null
        - code: |
            count = 0
            total = 0
            with open("scores.txt", encoding="utf-8") as f:
                for line in f:
                    if line.strip() == "":
                        continue
                    count += 1
