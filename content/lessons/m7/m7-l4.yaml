            Перенеси проверку внутрь цикла — после `try`/`except`, перед `break` — и поставь
            `continue` после сообщения.
          verify: "«Пример 2» должен дать сообщение про кабинку и «В кабинке: 2»."
        - id: boundary
          when:
            errorType: EOFError
            outputIncludes: В кабинку садятся от 1 до 6 человек
          why: >-
            Программа отказала числу, которое подходит, и спросила снова — а ввод теста уже
            кончился, отсюда EOFError. Посмотри, на каком числе: обычно это 6 или 1. `people >= 6`
            отрезает саму шестёрку, `people <= 1` — единицу, а обе границы входят в диапазон.
          try: >-
            Отказывай, только если число меньше 1 или больше 6: `people < 1 or people > 6`.
          verify: "«Граничный случай: ровно 6» должен дать «В кабинке: 6»."
        - id: isdigit-minus
          when:
            codeIncludes: isdigit
            failedTest: t5
          why: >-
            На `-2` программа ответила «Нужно целое число». Но -2 — целое число, просто не для
            кабинки. `isdigit()` видит минус, говорит «не цифры», и человек получает неверное
            объяснение.
          try: >-
            Верни превращение через `int()` в `try` — он понимает минус. А отрицательные числа
            отсеет проверка диапазона со своим сообщением.
          verify: "В «Граничном случае» с `-2` должно появиться «В кабинку садятся от 1 до 6 человек»."
        - id: range-as-text
          when:
            failedTest: t6
            codeRegex: '(?:<|>)=?\s*["'']\d|["'']\d+["'']\s*(?:<|>)'
          why: >-
            Границы сравниваются как строки: `text > "6"`. Строки сравниваются по символам слева
            направо, как слова в словаре: "10" меньше "6", потому что "1" меньше "6". Поэтому 10
            прошло проверку, а 12 и 100 тоже прошли бы.
          try: >-
            Сравнивай число, которое вернул `int()`, с числами без кавычек: `people < 1 or
            people > 6`.
          verify: "«Граничный случай: двузначное число» должен дать сообщение про кабинку и «В кабинке: 4»."
        - id: and-instead-of-or
          when:
            codeRegex: '(?:<|>)[^\n]*\band\b[^\n]*(?:<|>)'
            outputEquals: "В кабинке: 8"
          why: >-
            В условии `and`: «меньше 1 **и** больше 6». Такого числа не бывает, поэтому условие
            никогда не верно, и программа принимает даже 8.
          try: >-
            Число не подходит, если оно меньше 1 **или** больше 6 — замени `and` на `or`.
          verify: "«Пример 2» должен начаться с сообщения про кабинку."
        - id: range-check-silent
          when:
            codeIncludes: В кабинку садятся
            outputEquals: "В кабинке: 8"
          why: >-
            Проверка и сообщение в программе есть, но на 8 сообщения не было — проверка не
            сработала. Так бывает в двух случаях. Условие не бывает верным: например,
            `1 > people > 6` Python читает как «`1 > people` и `people > 6`», а такого числа нет.
            Или до проверки не доходит выполнение: она стоит после `break`, а на нём цикл
            заканчивается.
          try: >-
            Поставь проверку перед `break`. Число не подходит, если оно меньше 1 **или** больше 6:
            `people < 1 or people > 6`.
          verify: "«Пример 2» должен начаться с сообщения про кабинку."
        - id: zero-accepted
          when:
            outputEquals: "В кабинке: 0"
          why: >-
            Программа приняла 0. В кабинку садится хотя бы один человек, поэтому не подходит всё,
            что меньше 1: и 0, и отрицательные. Похоже, нижняя граница не проверяется или
            проверяется не так.
          try: "Проверь условие: число не подходит, если `people < 1` или `people > 6`."
          verify: "«Граничный случай: 0, потом 1» должен начаться с сообщения про кабинку."
        - id: accepts-out-of-range
          when:
            outputEquals: |-
              В кабинку садятся от 1 до 6 человек
              В кабинке: 8
          why: >-
            Программа сказала, что 8 не подходит, — и всё равно приняла 8. После сообщения
            выполнение пошло дальше, к `break`.
          try: Допиши `continue` сразу после сообщения про кабинку — он вернёт к вопросу.
          verify: "«Пример 2» должен закончиться строкой «В кабинке: 2»."
        - id: no-range-check
          when:
            outputEquals: "В кабинке: 8"
          why: >-
            Программа приняла 8 — проверки диапазона в ней пока нет. Целое число есть, но смысл у
            него не проверен.
          try: >-
            После `try`/`except` и перед `break` добавь проверку: если `people` меньше 1 или
            больше 6 — сообщение и `continue`.
          verify: "«Пример 2» должен дать две строки: сообщение и «В кабинке: 2»."
      afterPass: >-
        Теперь программа проверяет и тип, и смысл, и у каждой беды своё сообщение. Улучшение
        на будущее: подставить введённое число в сообщение — «8 — не подходит: в кабинку садятся
        от 1 до 6 человек». Человек сразу видит, что именно программа прочитала.
      skills: [input-validation, boundary-checks, boolean-logic]

  - id: practice-dance
    type: exercise
    title: Практика 3
    exercise:
      id: m7-l4-e3
      kind: write
      title: "Запись в студию: функция ask_int"
      statement: |-
        Танцевальная студия записывает на занятия. Программа спрашивает возраст — от 7 до 80 лет —
        и сколько занятий в месяц нужно — от 1 до 12. Оба вопроса устроены одинаково, отличаются
        только текстом и границами. Поэтому напиши функцию `ask_int(prompt, low, high)`:

        - задаёт вопрос `prompt` через `input(prompt)`;
        - не целое число — печатает `Нужно целое число` и спрашивает снова;
        - целое, но не от `low` до `high` включительно — печатает `Нужно число от <low> до <high>`
          (например, `Нужно число от 7 до 80`) и спрашивает снова;
        - подходящее число **возвращает** — не печатает.

        Потом с её помощью спроси возраст и число занятий и выведи строку записи. Ввод
        `тридцать`, `34`, `0`, `8`:

        ```text
        Нужно целое число
        Нужно число от 1 до 12
        Запись готова: возраст 34, занятий 8
        ```
      input: Ответы по одному на строке — сначала на вопрос о возрасте, потом о занятиях.
      output: >-
        Сообщения на неподходящие ответы, затем `Запись готова: возраст A, занятий N`.
      constraints:
        - Имя и параметры функции — ровно `ask_int(prompt, low, high)`.
        - Оба вопроса задаются через `ask_int`; функция проверяется и отдельно, с другими границами.
        - Текст вопросов в вызовах `ask_int` — любой, он не проверяется.
        - Лови конкретное исключение, а не «всё подряд».
      starterCode: |
        def ask_int(prompt, low, high):
            # спрашивай prompt, пока не введут целое число от low до high,
            # и верни это число
            pass


        # спроси возраст (от 7 до 80) и число занятий в месяц (от 1 до 12),
        # потом выведи строку записи
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "34\n8\n"
          expected: "Запись готова: возраст 34, занятий 8"
        - id: t2
          kind: io
          title: "Пример 2: ошибки в обоих ответах"
          example: true
          stdin: "тридцать\n34\n0\n8\n"
          expected: |-
            Нужно целое число
            Нужно число от 1 до 12
            Запись готова: возраст 34, занятий 8
        - id: t3
          kind: io
          title: "Граничный случай: 7 лет и 12 занятий"
          edge: true
          stdin: "7\n12\n"
          expected: "Запись готова: возраст 7, занятий 12"
        - id: t4
          kind: io
          title: "Граничный случай: 80 лет и 1 занятие"
          edge: true
          stdin: "80\n1\n"
          expected: "Запись готова: возраст 80, занятий 1"
        - id: t5
          kind: io
          title: "Граничный случай: рядом с границами"
          edge: true
          stdin: "6\n81\n40\n13\n1\n"
          expected: |-
            Нужно число от 7 до 80
            Нужно число от 7 до 80
            Нужно число от 1 до 12
            Запись готова: возраст 40, занятий 1
        - id: t6
          kind: assert
          title: Функция работает с любыми границами
          example: true
          stdin: "34\n8\n"
          code: |
            import contextlib
            import io

            answers = ["x", "0", "11", "10"]


            def input(prompt=""):
                assert answers, "ask_int просит ввод снова, хотя подходящее число уже введено"
                return answers.pop(0)


            shown = io.StringIO()
            with contextlib.redirect_stdout(shown):
                result = ask_int("Сколько?", 1, 10)
            text = shown.getvalue()
            assert type(result) is int and result == 10
            assert "Нужно целое число" in text
            assert text.count("Нужно число от 1 до 10") == 2
            assert answers == []
          message: >-
            Проверка вызывает `ask_int("Сколько?", 1, 10)` и отвечает `x`, `0`, `11`, `10`.
            Функция должна напечатать «Нужно целое число», потом дважды «Нужно число от 1 до 10»,
            вернуть число 10 (int, не строку) и больше не просить ввод.
        - id: t7
          kind: assert
          title: Вопрос берётся из параметра prompt
          stdin: "34\n8\n"
          code: |
            asked = []
            answers = ["5"]


            def input(prompt=""):
                assert answers, "ask_int просит ввод снова, хотя подходящее число уже введено"
                asked.append(str(prompt))
                return answers.pop(0)


            ask_int("Сколько лет коту?", 1, 30)
            assert len(asked) == 1 and "Сколько лет коту?" in asked[0]
          message: >-
            Функция должна показывать вопрос из параметра `prompt` — передай его в `input()`.
        - id: t-except
          kind: assert
          title: Ловится конкретное исключение
          stdin: "34\n8\n"
          code: |
            import ast

            source = open(__file__, encoding="utf-8").read()
            for node in ast.walk(ast.parse(source)):
                if isinstance(node, ast.ExceptHandler):
                    assert node.type is not None
                    assert not (isinstance(node.type, ast.Name) and node.type.id in ("Exception", "BaseException"))
          message: >-
            Здесь ловится «всё подряд»: `except` без типа или `except Exception`. Укажи конкретный
            тип — `ValueError`.
      criteria:
        - "`ask_int(prompt, low, high)` повторяет вопрос, пока не получит целое число от `low` до `high` включительно."
        - Сообщения берут границы из параметров, поэтому одна функция подходит для любого вопроса.
        - Функция возвращает число, а строку записи печатает основная часть программы.
        - Оба вопроса задаются через `ask_int`.
        - "Ловится конкретное исключение — ValueError."
      hints:
        - >-
          Сравни два вопроса программы: что у них общее, а что своё? Своё — это параметры
          функции. Общее — её тело: цикл «спросить → превратить → проверить → принять» из
          практики с кабинкой.
        - |-
          Функция-вопрос на другом примере:
          ```python
          def ask_yes_no(prompt):
              while True:
                  answer = input(prompt)
                  if answer == "да" or answer == "нет":
                      return answer
                  print("Ответь «да» или «нет»")


          go = ask_yes_no("Идём в кино? ")
          ```
          `return` внутри цикла сразу отдаёт ответ и заканчивает и цикл, и функцию.
        - |-
          Каркас:
          ```text
          def ask_int(prompt, low, high):
              while True:
                  text = input(prompt)
                  попробовать int(text); не вышло — «Нужно целое число», continue
                  число вне low…high — сообщение с low и high в f-строке, continue
                  вернуть число

          age = ask_int(вопрос, 7, 80)
          visits = ask_int(вопрос, 1, 12)
          print(строка записи)
          ```
      solution:
        code: |
          def ask_int(prompt, low, high):
              while True:
                  text = input(prompt)
                  try:
                      value = int(text)
                  except ValueError:
                      print("Нужно целое число")
                      continue
                  if value < low or value > high:
                      print(f"Нужно число от {low} до {high}")
                      continue
                  return value


          age = ask_int("Возраст: ", 7, 80)
          visits = ask_int("Занятий в месяц: ", 1, 12)
          print(f"Запись готова: возраст {age}, занятий {visits}")
        explanation: >-
