          Поэтому в теле нет ни одного конкретного числа — и сообщение, и проверка берут границы
          из параметров. `return value` стоит там, куда доходит только подходящее число: он
          завершает и цикл, и функцию. Основная часть программы получает уже проверенные числа и только
          печатает итог. Понадобится третий вопрос — хватит ещё одной строки с `ask_int`.
