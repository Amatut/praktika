        - id: no-continue
          when:
            errorType: UnboundLocalError
            outputIncludes: Нужно целое число
          why: >-
            Сообщение напечатано, но после `except` функция пошла дальше — к проверке диапазона.
            А у `value` ещё нет значения: `int()` не сработал. Отсюда UnboundLocalError — так
            внутри функции называется NameError из прогноза «Буквы вместо числа».
          try: Допиши `continue` в `except` сразу после сообщения — он вернёт к вопросу.
          verify: "«Пример 2» должен пройти без ошибки."
        - id: hardcoded-borders
          when:
            failedTest: t2
            outputIncludes: Нужно число от 7 до 80
          why: >-
            На вопрос о занятиях программа ответила «Нужно число от 7 до 80»: в функции записаны
            границы возраста, а не параметры. Функция одна на оба вопроса, поэтому и проверка, и
            сообщение должны брать `low` и `high`.
          try: >-
            Замени 7 и 80 внутри функции на `low` и `high` — и в условии, и в сообщении
            (f-строка: `f"Нужно число от {low} до {high}"`).
          verify: "«Пример 2» должен дать «Нужно число от 1 до 12»."
        - id: hardcoded-condition
          when:
            failedTest: t6
            codeRegex: '(?:<|>)=?\s*(?:7|80|12)\b'
          why: >-
            В условии функции записаны числа, а не параметры, например `value < 7 or value > 80`.
            Сообщение берёт `low` и `high`, а проверка — всегда одни и те же числа. Поэтому для
            занятий функция проверяет не те границы, а проверка с границами от 1 до 10 не проходит.
          try: "Замени числа в условии на параметры: `value < low or value > high`."
          verify: Проверка «Функция работает с любыми границами» должна стать зелёной.
        - id: boundary
          when:
            errorType: EOFError
            outputIncludes: Нужно число от
          why: >-
            Функция отказала подходящему числу — например, 7 или 12 — и спросила снова, а ввод
            теста уже кончился: EOFError. «От 7 до 80» включает и 7, и 80: сами границы
            подходят.
          try: >-
            Отказывай, только если `value < low` или `value > high` — со строгими знаками.
          verify: "«Граничный случай: 7 лет и 12 занятий» должен пройти."
        - id: no-exit
          when:
            errorType: EOFError
            codeRegex: '^([ \t]+)while True\s*:[^\n]*\n(?:(?:\1[ \t]+[^\n]*)?\n)*\1return\b'
          why: >-
            Подходящее число введено, а функция спрашивает снова: из цикла нет выхода. `return`
            стоит после `while True`, а туда выполнение не доходит никогда: такой цикл
            заканчивается только через `break` или `return` внутри него. В тренажёре это
            EOFError — ввод теста кончился.
          try: >-
            Верни число прямо в цикле, когда обе проверки пройдены: `return value` последней
            строкой тела цикла.
          verify: "«Пример 1» должен дать строку записи без ошибки."
        - id: no-loop-in-function
          when:
            outputIncludes: None
            codeRegex: '(?<![\s\S])(?![\s\S]*\b(?:while|for)\b)'
          why: >-
            В `ask_int` нет цикла: функция спрашивает один раз, а после сообщения об ошибке
            заканчивается и возвращает `None` — отсюда `None` в строке записи. Переспросить она не
            может.
          try: >-
            Оберни вопрос и проверки в `while True:`: после сообщения — `continue`, а `return
            value` — только когда обе проверки пройдены.
          verify: "«Пример 2» должен дать «Запись готова: возраст 34, занятий 8»."
        - id: no-return
          when:
            outputIncludes: None
          why: >-
            В строке записи `None` вместо чисел: функция ничего не вернула. Скорее всего, она
            печатает число или выходит из цикла через `break`, а `return` нет. Напечатанное
            число основная часть программы не получит.
          try: >-
            Отдай число через `return value`. Печатает итог только основная часть программы.
          verify: "«Пример 1» должен дать одну строку: «Запись готова: возраст 34, занятий 8»."
        - id: param-order
          when:
            failedTest: t6
            errorIncludes: "instances of 'int' and 'str'"
          why: >-
            Твоя программа работает, а проверка упала: она вызывает `ask_int("Сколько?", 1, 10)` —
            сначала вопрос, потом границы. Если в `def` параметры стоят в другом порядке, в `low`
            попадает текст вопроса, и сравнение числа с текстом даёт TypeError.
          try: >-
            Объяви параметры ровно в порядке `ask_int(prompt, low, high)` и в том же порядке
            передавай аргументы в своих вызовах.
          verify: Проверка «Функция работает с любыми границами» должна стать зелёной.
        - id: no-f-string
          when:
            outputIncludes: "{low}"
          why: >-
            В сообщении напечатано `{low}` вместо числа: перед кавычками нет буквы `f`, и Python
            считает фигурные скобки обычным текстом.
          try: 'Поставь `f` перед строкой: `f"Нужно число от {low} до {high}"`.'
          verify: "«Пример 2» должен дать «Нужно число от 1 до 12»."
        - id: range-skipped
          when:
            failedTest: t2
            codeRegex: '^([ \t]+)try\s*:[^\n]*\n(?:\1[ \t]+[^\n]*\n)*\1[ \t]+return\b'
            outputEquals: |-
              Нужно целое число
              Запись готова: возраст 34, занятий 0
          why: >-
            0 занятий принято без сообщения: до проверки диапазона выполнение не дошло. `return`
            стоит в `try` сразу после `int()` — функция заканчивается на нём, и строки ниже уже
            не выполняются.
          try: >-
            Сначала проверь диапазон, а `return value` поставь последним — туда, куда доходит
            только подходящее число.
          verify: "«Пример 2» должен дать «Нужно число от 1 до 12»."
        - id: accepts-out-of-range
          when:
            outputEquals: |-
              Нужно целое число
              Нужно число от 1 до 12
              Запись готова: возраст 34, занятий 0
          why: >-
            Функция сказала «Нужно число от 1 до 12» — и всё равно вернула 0. После сообщения
            выполнение пошло дальше, к `return value`.
          try: Допиши `continue` сразу после сообщения о границах — он вернёт к вопросу.
          verify: "«Пример 2» должен закончиться строкой «Запись готова: возраст 34, занятий 8»."
        - id: bare-except
          when:
            failedTest: t-except
            codeRegex: '\bexcept\s*:|\bexcept\s+(Base)?Exception\b'
          why: >-
            `except:` без типа и `except Exception` ловят всё подряд — не только ValueError, но и
            опечатки в коде, как в уроке 7.3: программа выдаст их за неверный ввод. А голый
            `except:` вокруг `input()` на компьютере поймает даже Ctrl+C — программу не
            остановить, на всё она ответит «Нужно целое число».
          try: "Напиши тип явно: `except ValueError:`."
          verify: Проверка «Ловится конкретное исключение» должна стать зелёной.
      afterPass: >-
        Одна функция — два вопроса и любой будущий: номер пункта меню, количество, оценка. Если
        захочешь, напиши рядом `ask_float` для дробных чисел: перед `float()` замени запятую на
        точку — `text.replace(",", ".")`, — и «2,5» тоже станет числом.
      skills: [input-validation, functions, function-design]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Надёжный запрос — цикл из четырёх шагов: спросить → превратить (`int()` в `try`) → проверить смысл → принять."
      - "После каждого сообщения об ошибке — `continue`; до `break` или `return` доходит только подходящее значение."
      - "Хорошее сообщение говорит, что не так и как правильно, лучше с примером: «Нужно целое число, например 42»."
      - "Цикл запроса выносят в функцию с параметрами: одна `ask_int(prompt, low, high)` годится для любого вопроса."
    question: >-
      Зачем после каждого сообщения об ошибке писать `continue`?
    answer: >-
      Без `continue` программа пойдёт дальше по телу цикла с тем, что есть. Если `int()` не
      сработал на первом ответе, переменной ещё нет: будет NameError, а внутри функции —
      UnboundLocalError. Если до этого уже вводили число, в переменной останется оно — то самое,
      которое не подошло. А число вне
      диапазона примут, хотя сообщение только что сказало, что оно не подходит. `continue`
      возвращает к вопросу, и до `break` или `return` доходит только подходящий ответ.
