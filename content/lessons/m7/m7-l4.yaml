      mistakes:
        - id: no-function
          when:
            errorType: NameError
            errorIncludes: ask_int
          why: >-
            Python не нашёл функцию `ask_int`. Так бывает, если функция названа иначе, если вопросы
            заданы двумя циклами без функции или если вызов стоит выше `def`. Функцию проверяют и
            отдельно, с другими вопросами и границами, поэтому нужна именно она.
          try: >-
            Объяви `def ask_int(prompt, low, high):` в начале программы и задай оба вопроса через
            неё.
