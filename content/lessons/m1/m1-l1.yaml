id: m1-l1
module: m1
number: "1.1"
title: Числа и вычисления
objective: Считать в Python с помощью + - * / // % ** и скобок и выводить результат вместе с поясняющим текстом.
minutes: [25, 30]
prerequisites: [m0-l3]
skills: [numbers-arithmetic]
environment: python

story:
  title: Коробки для эклеров
  fictional: true
  text: >-
    В маленькой кондитерской эклеры упаковывают в коробки по 6 штук. Каждый вечер Марина
    считала на телефоне, сколько коробок понадобится завтра и сколько эклеров останется без
    коробки, — и иногда ошибалась на одну коробку. Её брат написал короткую программу: она
    делит число эклеров на 6 и сразу показывает полные коробки и остаток. Теперь Марина меняет
    одно число и получает ответ за секунду. Сегодня ты научишь Python считать так же.

why: >-
  Почти любая программа что-то считает: сумму заказа, время в пути, очки в игре. Python
  считает быстро и без усталости — например, `print(24 * 60)` сразу покажет, сколько минут
  в сутках.

usedIn: >-
  Вычисления есть в кассах и интернет-магазинах (сумма заказа и сдача), в приложениях
  доставки (время и стоимость), в играх (очки, здоровье, урон), в отчётах и таблицах.
  Целочисленное деление и остаток помогают считать целые упаковки, страницы, рейсы и
  переводить секунды в минуты.

steps:
  - id: calc
    type: theory
    title: Python как калькулятор
    body: |-
      Числа в Python пишут без кавычек, и с ними можно считать:

      - `+` сложение и `-` вычитание;
      - `*` умножение: `7 * 4` → `28`;
      - `/` деление: `7 / 2` → `3.5`;
      - `**` степень: `2 ** 3` → `8` (это 2 · 2 · 2).

      Если написать выражение внутри `print`, Python сначала посчитает его, а потом выведет
      результат: `print(2 + 3)` покажет `5`. А `print("2 + 3")` покажет `2 + 3` — в кавычках
      это просто текст, считать его никто не будет.

      **Два типа чисел.** Вид значения в программировании называют его **типом**. Целые числа
      (`5`, `180`, `-3`) — это тип **int**, числа с дробной частью (`2.5`, `0.75`) — тип
      **float**. Дробную часть отделяют точкой, а не запятой: `2.5`, а не `2,5`.

      Деление `/` всегда даёт float, даже если делится нацело: `10 / 2` → `5.0`. Это то же
      число пять, просто записанное как дробное. И если в вычислении участвует float, результат
      тоже будет float: `2.5 * 2` → `5.0`.

      **Текст и число в одной строке.** Ты уже знаешь, что в `print` можно передать несколько
      значений через запятую: Python выведет их по порядку и поставит между ними пробел. Так же
      можно соединить текст и результат вычисления:

      ```python
      print("Итого:", 120 + 45)
      ```

      На экране появится `Итого: 165`.
    simpler: >-
      Python умеет считать как калькулятор: пишешь пример без кавычек — получаешь ответ.
      В кавычках — это текст, его Python просто печатает. Деление `/` всегда даёт число с
      точкой: `10 / 2` → `5.0`.
    coach: >-
      Список знаков не нужно заучивать — это шпаргалка, к ней можно возвращаться. Главное
      сейчас: без кавычек — вычисление, в кавычках — текст.

  - id: first-calc
    type: example
    title: Считаем в коде
    body: Запусти программу и сравни каждую строку кода с тем, что появилось на экране.
    code: |-
      print(7 * 4)
      print("7 * 4")
      print(7 / 2)
      print(10 / 2)
      print(2 ** 3)
      print("Итого:", 120 + 45)
    notes:
      - line: 1
        text: Без кавычек — вычисление. Python выведет `28`.
      - line: 2
        text: В кавычках — текст. На экране будет `7 * 4` как есть.
      - line: 3
        text: Обычное деление даёт `3.5`.
      - line: 4
        text: "`/` всегда даёт float — получится `5.0`, хотя 10 делится на 2 нацело."
      - line: 5
        text: "`**` — степень: 2 · 2 · 2 = `8`."
      - line: 6
        text: Два значения через запятую — текст и результат вычисления. Между ними `print` ставит пробел.
    tryIt: >-
      Добавь строку `print("Минут в сутках:", 24 * 60)` и запусти программу ещё раз.

  - id: predict-division
    type: predict
    title: Целое или дробное?
    prompt: Как думаешь, что выведет программа?
    code: |-
      print(9 - 4)
      print(9 / 3)
    options:
      - |-
        5
        3
      - |-
        5
        3.0
      - |-
        5.0
        3.0
    answer: |-
      5
      3.0
    explanation: >-
      Вычитание целых чисел даёт целое число `5`. А деление `/` всегда даёт float, поэтому
      `9 / 3` — это `3.0`, хотя 9 делится на 3 нацело.

  - id: practice-order-sum
    type: exercise
    title: Практика 1
    exercise:
      id: m1-l1-e1
      kind: repeat
      title: Сумма заказа
      statement: >-
        Капучино стоит 180 рублей, круассан — 95. Гость взял два капучино и один круассан.
        Напиши программу, которая выведет строку `Итого: 455`. Число 455 не пиши готовым —
        пусть Python сам посчитает его из цен.
      output: Одна строка — слово «Итого:» и сумма заказа.
      constraints:
        - Сумму посчитай в коде выражением из цен 180 и 95, а не записывай готовым числом.
      starterCode: |
        # Капучино — 180, круассан — 95. Заказ: 2 капучино и 1 круассан.
        # Выведи строку «Итого: ...» с суммой заказа

      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: "Итого: 455"
          compare:
            ignoreSpaces: true
      rules:
        - id: calc
          use: [BinOp]
          message: >-
            Посчитай сумму выражением прямо в коде — например, с `*` и `+`. Тогда, если цена
            изменится, достаточно поменять одно число, а не пересчитывать всё вручную.
      criteria:
        - "Выводится одна строка «Итого: 455»."
        - Сумма вычисляется в коде из цен, а не записана готовым числом.
        - Лишние пробелы между словом и числом не считаются ошибкой.
      hints:
        - >-
          Какие два значения нужно вывести в одной строке? Одно из них — текст, а другое —
          результат вычисления.
        - >-
          Приём на другом примере: `print("Минут в сутках:", 24 * 60)` выводит
          `Минут в сутках: 1440`. Текст — в кавычках, вычисление — без кавычек, между ними
          запятая.
        - >-
          Каркас: `print("Итого:", ... * ... + ...)` — вместо многоточий подставь количество и
          цены из условия.
      solution:
        code: |
          print("Итого:", 2 * 180 + 95)
        explanation: >-
          Python сначала считает `2 * 180 + 95`: умножение выполняется раньше сложения,
          получается 455. Потом `print` выводит текст и число через пробел. Подойдёт и
          `180 + 180 + 95` — результат тот же.
      wrongSolutions:
        - code: |
            print("Итого: 455")
          note: Готовое число вместо вычисления.
          expectMistake: ready-number
        - code: |
            print("Итого:", "2 * 180 + 95")
          note: Выражение в кавычках.
          expectMistake: expression-as-text
        - code: |
            print("Итого:" 2 * 180 + 95)
          note: Пропущена запятая.
          expectMistake: missing-comma
        - code: |
            print("Итого:", 180 + 95)
          note: Посчитан один капучино.
          expectMistake: one-cup
      mistakes:
        - id: expression-as-text
          when:
            failedTest: t1
            outputIncludes: "+"
          why: >-
            Выражение стоит в кавычках, поэтому Python считает его текстом и печатает как есть,
            а не вычисляет.
          try: Убери кавычки вокруг вычисления — оставь их только вокруг слова «Итого:».
          verify: На экране должно появиться число, а не знаки `*` и `+`.
        - id: missing-comma
          when:
            errorIncludes: forgot a comma
          why: Текст и вычисление стоят рядом без запятой — Python не понимает, как их связать.
          try: 'Поставь запятую сразу после закрывающей кавычки: `"Итого:",`.'
        - id: one-cup
          when:
            outputIncludes: "275"
          why: В сумме только один капучино, а гость взял два.
          try: Умножь цену капучино на количество чашек.
        - id: ready-number
          when:
            failedRule: calc
            codeIncludes: "455"
          why: >-
            Число 455 записано готовым: посчитал его ты, а не программа. Если цена капучино
            изменится, программа покажет старую сумму.
          try: >-
            Замени 455 на выражение из цен и передай его в `print` через запятую после текста.
          verify: Нажми «Проверить» — требование к коду должно отметиться как выполненное.
      afterPass: >-
        Python посчитал сумму сам — ты только записал, из чего она складывается. Если цена
        круассана поменяется, достаточно исправить одно число.
      skills: [numbers-arithmetic]

  - id: boxes
    type: theory
    title: Целая часть, остаток и порядок действий
    body: |-
      Вернёмся в кондитерскую. В коробку помещается 6 эклеров, а испекли 20. Сколько получится
      полных коробок и сколько эклеров останется?

      - `//` — **целочисленное деление**: сколько раз 6 целиком помещается в 20. `20 // 6` → `3`.
      - `%` — **остаток от деления**: сколько останется после этого. `20 % 6` → `2`.

      Проверка: 3 коробки по 6 — это 18 эклеров, и ещё 2 остаются. Вместе как раз 20.

      ```python
      print("Полных коробок:", 20 // 6)
      print("Осталось:", 20 % 6)
      ```

      **Порядок действий** — как в школьной математике:

      1. сначала степень `**`;
      2. потом `*`, `/`, `//` и `%` — слева направо;
      3. в конце `+` и `-` — тоже слева направо.

      Скобки меняют порядок: то, что в скобках, считается первым. `2 + 3 * 4` → `14`, а
      `(2 + 3) * 4` → `20`. Если сомневаешься, поставь скобки: лишние скобки не мешают, а
      код с ними читать проще.
    simpler: >-
      `//` отвечает на вопрос «сколько целых коробок?», а `%` — на вопрос «сколько штук
      осталось без коробки?». Умножение и деление Python делает раньше сложения, как в школе.
      Нужен другой порядок — ставь скобки.
    coach: >-
      Если не уверен, что получится, посчитай на бумаге, а потом сверь с запуском. Так быстрее
      всего привыкаешь к порядку действий.

  - id: predict-order
    type: predict
    title: Порядок действий
    prompt: >-
      Как думаешь, что выведет программа? Напиши вывод построчно — все четыре строки.
    code: |-
      print(10 - 2 * 3)
      print((10 - 2) * 3)
      print(23 // 5, 23 % 5)
      print(5 // 8, 5 % 8)
    answer: |-
      4
      24
      4 3
      0 5
    explanation: >-
      В первой строке умножение выполняется раньше вычитания: 10 − 6 = 4. Во второй скобки
      заставляют сначала вычесть: 8 · 3 = 24. В третьей: пятёрка целиком помещается в 23
      четыре раза (это 20), остаток — 3, а `print` ставит между двумя числами пробел. В
      четвёртой 8 не помещается в 5 ни разу: целая часть — 0, а в остатке все 5.

  - id: practice-boxes
    type: exercise
    title: Практика 2
    exercise:
      id: m1-l1-e2
      kind: modify
      title: Новые коробки
      statement: |-
        Кондитерская перешла на новые коробки — теперь в каждую помещается 8 эклеров. Сегодня
        испекли 50 штук.

        Измени программу: пусть она считает для 50 эклеров и коробок по 8, а ещё выводит
        третью строку `Упаковано: ...` — сколько эклеров лежит в полных коробках.
      output: |-
        Три строки: `Полных коробок: ...`, `Осталось: ...` и `Упаковано: ...`.
      constraints:
        - Каждое число считай в коде из 50 и 8 — не записывай готовые ответы.
      starterCode: |
        print("Полных коробок:", 20 // 6)
        print("Осталось:", 20 % 6)
      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: |-
            Полных коробок: 6
            Осталось: 2
            Упаковано: 48
          compare:
            ignoreSpaces: true
      rules:
        - id: compute
          min:
            BinOp: 3
          message: >-
            Пусть все три числа считает Python из 50 и 8 — упакованные эклеры тоже можно
            получить вычислением. Тогда для новой партии достаточно поменять два числа.
      criteria:
        - Выводятся три строки в указанном порядке.
        - Все три числа вычисляются в коде из 50 и 8, а не записаны готовыми.
      hints:
        - >-
          Какие числа в программе нужно поменять? А для третьей строки подумай: как число
          эклеров в полных коробках связано с числом коробок и размером одной коробки?
        - >-
          Приём на другом примере: если получилось 3 полные коробки по 6 штук, в них
          `3 * 6` → `18` эклеров. А число полных коробок Python уже умеет считать сам —
          например, `20 // 6`.
        - >-
          Каркас третьей строки: `print("Упаковано:", 50 // ... * ...)` — сначала число полных
          коробок, потом умножение на размер коробки. В первых двух строках замени 20 на 50,
          а 6 — на 8.
      solution:
        code: |
          print("Полных коробок:", 50 // 8)
          print("Осталось:", 50 % 8)
          print("Упаковано:", 50 // 8 * 8)
        explanation: >-
          `50 // 8` — сколько раз 8 целиком помещается в 50, это 6 коробок. `50 % 8` — остаток,
          2 эклера. В третьей строке `//` и `*` выполняются слева направо: сначала 6 коробок,
          потом 6 · 8 = 48. Подойдёт и `50 - 50 % 8` — всё, кроме остатка.
      wrongSolutions:
        - code: |
            print("Полных коробок:", 50 // 6)
            print("Осталось:", 50 % 6)
            print("Упаковано:", 50 // 6 * 6)
          note: Осталась коробка на 6 штук.
          expectMistake: old-numbers
        - code: |
            print("Полных коробок:", 50 / 8)
            print("Осталось:", 50 % 8)
            print("Упаковано:", 50 / 8 * 8)
          note: Обычное деление вместо целочисленного.
          expectMistake: slash
        - code: |
            print("Полных коробок:", 50 % 8)
            print("Осталось:", 50 // 8)
            print("Упаковано:", 50 % 8 * 8)
          note: Перепутаны // и %.
          expectMistake: swapped
        - code: |
            print("Полных коробок:", 50 // 8)
            print("Осталось:", 50 % 8)
          note: Нет третьей строки.
          expectMistake: no-third
      mistakes:
        - id: old-numbers
          when:
            failedTest: t1
            codeRegex: '\b20\s*(//|%)|(//|%)\s*6\b'
          why: В коде остались старые числа — а эклеров теперь 50, и в коробку помещается 8.
          try: Замени 20 на 50, а 6 — на 8 во всех строках, где считаются коробки и остаток.
        - id: slash
          when:
            failedTest: t1
            codeRegex: '[^/]/[^/]'
          why: >-
            Обычное деление `/` всегда даёт дробное число: `50 / 8` → `6.25`, а `50 / 8 * 8` →
            `50.0`. Коробки же считают целыми — дробная часть здесь лишняя.
          try: Замени `/` на `//` — оно отбрасывает дробную часть и оставляет только полные коробки.
        - id: swapped
          when:
            failedTest: t1
            codeRegex: 'коробок[^\n]*%|Осталось[^\n]*//'
          why: >-
            Знаки `//` и `%` перепутаны: `//` даёт число полных коробок, а `%` — остаток.
          try: >-
            Проверь знак в каждой строке: в строке «Полных коробок» нужен `//`, в строке
            «Осталось» — `%`.
        - id: no-third
          when:
            outputEquals: |-
              Полных коробок: 6
              Осталось: 2
          why: Первые две строки верные, не хватает третьей — сколько эклеров в полных коробках.
          try: 'Добавь третий `print`: число полных коробок, умноженное на размер коробки.'
      afterPass: >-
        Все три числа считает Python: замени 50 на другое число во всех строках — и ответы
        пересчитаются. Попробуй 48 эклеров: что покажет остаток? А менять число в одном месте,
        а не в трёх, ты научишься в следующем уроке — с переменными.
      skills: [numbers-arithmetic]

  - id: practice-average
    type: exercise
    title: Практика 3
    exercise:
      id: m1-l1-e3
      kind: fix
      title: Странный средний балл
      statement: |-
        Программа должна посчитать средний балл за три контрольные: 4, 5 и 3. Средний балл — это
        сумма оценок, делённая на их количество.

        Сейчас программа выводит `Средний балл: 10.0`, а такого балла не бывает. Найди ошибку и
        исправь её, чтобы программа вывела `Средний балл: 4.0`.
      output: "Одна строка: `Средний балл: 4.0`."
      constraints:
        - Средний балл считай в коде из трёх оценок.
      starterCode: |
        print("Средний балл:", 4 + 5 + 3 / 3)
      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: "Средний балл: 4.0"
          compare:
            ignoreSpaces: true
      rules:
        - id: compute
          min:
            BinOp: 3
          message: >-
            Посчитай средний балл выражением из трёх оценок, а не готовым числом: так видно,
            откуда взялся результат, и его легко пересчитать для других оценок.
      criteria:
        - "Выводится строка «Средний балл: 4.0»."
        - Сначала считается сумма всех трёх оценок, потом она делится на 3.
      hints:
        - >-
          Посчитай выражение из программы на бумаге по правилам порядка действий. Какое
          действие Python выполняет первым?
        - >-
          Похожий случай: `10 - 4 / 2` → `8.0`, потому что деление выполняется раньше
          вычитания. Чтобы сначала вычесть, нужны скобки: `(10 - 4) / 2` → `3.0`.
        - >-
          Каркас: `print("Средний балл:", (... + ... + ...) / 3)` — всё, что должно посчитаться
          раньше деления, стоит в скобках.
      solution:
        code: |
          print("Средний балл:", (4 + 5 + 3) / 3)
        explanation: >-
          Без скобок деление выполнялось раньше сложения: Python считал `4 + 5 + 1.0` и
          получал `10.0`. Скобки заставляют сначала сложить оценки (12), а потом разделить
          сумму на 3. Результат — `4.0`: деление `/` всегда даёт float.
      wrongSolutions:
        - code: |
            print("Средний балл:", 4 + 5 + 3 / 3)
          note: Код не изменён.
          expectMistake: no-brackets
        - code: |
            print("Средний балл:", 4 + (5 + 3) / 3)
          note: Скобки охватывают не всю сумму.
          expectMistake: partial-brackets
        - code: |
            print("Средний балл:", (4 + 5 + 3) // 3)
          note: Целочисленное деление.
          expectMistake: floor-division
        - code: |
            print("Средний балл: 4.0")
          note: Готовый ответ.
          expectMistake: ready-number
      mistakes:
        - id: no-brackets
          when:
            outputEquals: "Средний балл: 10.0"
          why: >-
            Деление выполняется раньше сложения, поэтому на 3 разделилась только последняя
            оценка: `3 / 3` = 1.0, а потом к ней прибавились 4 и 5.
          try: Возьми сумму оценок в скобки — тогда она посчитается раньше деления.
        - id: partial-brackets
          when:
            outputIncludes: "6.66"
          why: Скобки охватывают не всю сумму — первая оценка прибавляется уже после деления.
          try: Поставь открывающую скобку перед первой оценкой.
        - id: floor-division
          when:
            outputEquals: "Средний балл: 4"
          why: >-
            `//` отбрасывает дробную часть. Здесь это почти незаметно, но для оценок 4, 5 и 4
            получилось бы 4 вместо 4.33.
          try: Для среднего используй обычное деление `/`.
        - id: ready-number
          when:
            failedRule: compute
            codeRegex: '4\.0|12'
          why: Средний балл или сумма оценок посчитаны вручную — программа их не считает.
          try: Верни вычисление из трёх оценок и поставь скобки так, чтобы сумма считалась первой.
      afterPass: >-
        Одна пара скобок изменила результат с 10.0 на 4.0. Когда формула даёт странное число,
        первым делом проверь порядок действий.
      skills: [numbers-arithmetic]

  - id: practice-playlist
    type: exercise
    title: Практика 4
    exercise:
      id: m1-l1-e4
      kind: write
      title: Длина плейлиста
      statement: |-
        В плейлисте 3 песни, каждая длится 215 секунд. Напиши программу, которая выведет общую
        длину плейлиста в минутах и секундах — в таком виде:

        ```text
        10 мин 45 с
        ```
      output: Одна строка — минуты, «мин», секунды, «с».
      constraints:
        - Всё посчитай в коде из чисел 3 и 215 — общую длину, минуты и секунды.
        - Секунд в ответе должно быть меньше 60 — иначе там спрятана ещё одна минута.
      starterCode: |
        # 3 песни по 215 секунд. Выведи общую длину: «... мин ... с»

      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: 10 мин 45 с
          compare:
            ignoreSpaces: true
      rules:
        - id: compute
          min:
            BinOp: 3
          message: >-
            Пусть Python посчитает всё сам: общую длину из 3 и 215, а потом минуты и секунды.
            Готовые числа вроде 645 легко посчитать с ошибкой, а для другой длины песни их
            придётся пересчитывать вручную.
      criteria:
        - Выводится одна строка с минутами и секундами, как в образце.
        - Общая длина, минуты и секунды вычисляются в коде.
        - Секунд в ответе меньше 60.
      hints:
        - >-
          Разбей задачу на два шага: сначала узнай общую длину в секундах, а потом раздели её
          на полные минуты и оставшиеся секунды. Какие операции урока отвечают за «сколько
          целых» и «сколько осталось»?
        - >-
          Приём на другом примере: 150 минут — это `150 // 60` → `2` полных часа и
          `150 % 60` → `30` минут. В минуте 60 секунд — так же, как в часе 60 минут.
        - >-
          План по шагам: 1) общая длина = 3 · 215 секунд; 2) минуты = сколько раз 60 целиком
          помещается в общую длину; 3) секунды = сколько остаётся после этого. Выведи всё
          одним `print` через запятую: минуты, `"мин"`, секунды, `"с"`. Общую длину удобно
          взять в скобки, чтобы было видно, что она считается первой.
      solution:
        code: |
          print((3 * 215) // 60, "мин", (3 * 215) % 60, "с")
        explanation: >-
          Общая длина — `3 * 215` = 645 секунд. `645 // 60` = 10 — столько полных минут, а
          `645 % 60` = 45 — секунды, которые не набрали целую минуту. Проверка: 10 · 60 + 45 =
          645. Скобки здесь не обязательны, но с ними сразу видно, что считается первым.
      wrongSolutions:
        - code: |
            print(215 // 60 * 3, "мин", 215 % 60 * 3, "с")
          note: Сначала разделили одну песню, потом умножили.
          expectMistake: split-first
        - code: |
            print(3 * 215 / 60, "мин")
          note: Обычное деление.
          expectMistake: slash
        - code: |
            print(3 * 215 // 60, "мин", 3 * 215 // 60, "с")
          note: Секунды тоже через //.
          expectMistake: seconds-floor
        - code: |
            print(645 // 60, "мин", 645 % 60, "с")
          note: Общая длина посчитана вручную.
          expectMistake: ready-number
      mistakes:
        - id: split-first
          when:
            outputIncludes: "105"
          why: >-
            Секунд получилось больше 60: сначала разделилась одна песня, а потом остаток
            умножился на 3 — и три остатка по 35 секунд не собрались в минуту.
          try: Сначала посчитай общую длину `3 * 215`, а уже её дели на минуты и секунды.
        - id: slash
          when:
            outputIncludes: "10.75"
          why: >-
            Обычное деление `/` дало 10.75 минуты — это дробные минуты, а не минуты и секунды.
          try: Полные минуты даёт `//`, а оставшиеся секунды — `%`.
        - id: seconds-floor
          when:
            outputEquals: 10 мин 10 с
          why: Секунды посчитаны через `//`, поэтому снова получилось число полных минут.
          try: Для секунд нужен остаток от деления на 60 — операция `%`.
        - id: ready-number
          when:
            failedRule: compute
            codeRegex: '645|10|45'
          why: >-
            Часть чисел посчитана вручную. Если длина песни изменится, программа покажет
            старый ответ.
          try: Начни с `3 * 215` прямо в коде, а минуты и секунды получи из этого выражения.
          verify: Нажми «Проверить» — требование к коду должно отметиться как выполненное.
      afterPass: >-
        Ты перенёс приём с коробками на время: минуты — это «коробки» по 60 секунд, а секунды —
        остаток. Попробуй поменять 215 на длину своей любимой песни.
      skills: [numbers-arithmetic]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Числа пишут без кавычек, и с ними можно считать. В кавычках — это уже текст, его Python не вычисляет.
      - "`/` всегда даёт float (`10 / 2` → `5.0`), `//` — целую часть, `%` — остаток, `**` — степень."
      - "Порядок действий как в математике: `**`, потом `* / // %`, потом `+ -`. Скобки считаются первыми."
      - "`print` через запятую выводит несколько значений и ставит между ними пробел."
    question: >-
      Сколько полных недель и сколько дней в 17 днях? Что выведет `print(17 // 7, 17 % 7)` и
      почему?
    answer: >-
      `17 // 7` → `2` — две полные недели, а `17 % 7` → `3` — три дня сверх них. Программа
      выведет `2 3`. Проверка: 2 · 7 + 3 = 17.
