id: m1-l4
module: m1
number: "1.4"
title: "Ввод: программа слушает"
objective: >-
  Получать ответы человека через input(), сохранять их в переменные и использовать в выводе,
  помня, что input() всегда возвращает строку.
minutes: [20, 30]
prerequisites: [m1-l3]
skills: [input-read]
environment: python

story:
  title: Имя на стаканчике
  fictional: true
  text: >-
    В кофейне «Утро» бариста Лена пишет имя гостя маркером на стаканчике, и в час пик «Катя»
    иногда превращается в «Каша». Хозяйка поставила у кассы планшет: гость сам набирает имя, а
    маленькая программа печатает наклейку «Катя, твой капучино готов!». Программа одна для всех
    гостей — меняется только то, что ввёл человек. Сегодня твои программы тоже научатся
    спрашивать и использовать ответ.

why: >-
  Полезная программа почти всегда получает данные от человека: имя, адрес, количество. Например,
  одна и та же программа печатает наклейку для любого гостя — достаточно спросить, как его зовут.

usedIn: >-
  Консольные утилиты и учебные программы спрашивают данные через `input()`. В приложениях с
  окнами и на сайтах данные приходят из полей формы, но идея та же: программа получает строку
  текста и решает, что с ней делать.

steps:
  - id: idea
    type: theory
    title: "input(): программа задаёт вопрос"
    body: |-
      До сих пор программы только говорили: всё, что выводил `print`, было заранее записано в
      коде. Теперь программа научится слушать.

      **`input()`** — функция, которая останавливает программу и ждёт, пока человек наберёт
      ответ и нажмёт Enter. Набранный текст `input()` **возвращает** — отдаёт обратно в
      программу. Чтобы ответ не потерялся, его сразу кладут в переменную:

      ```python
      name = input("Как тебя зовут? ")
      ```

      Текст в скобках — **подсказка**: человек видит её перед вводом. Её можно не писать —
      `input()` работает и с пустыми скобками. Пробел в конце подсказки нужен, чтобы ответ не
      прилипал к вопросу.

      Три правила:

      - `input()` **всегда возвращает строку**. Даже если набрать `25`, в переменной окажется
        текст `"25"`, а не число. Как превратить его в число — в следующем уроке.
      - Один вызов `input()` читает **одну строку** ввода целиком, со всеми пробелами внутри.
        Два вызова — две строки, по порядку сверху вниз.
      - Ответ, который не сохранили в переменную, пропадает: использовать его дальше не получится.

      **Как это устроено в тренажёре.** На компьютере программа с `input()` останавливается и
      ждёт, пока ты наберёшь ответ на клавиатуре. В браузере тренажёра ввод задан заранее. Когда
      ты нажимаешь «Проверить», каждый тест подставляет в `input()` свои строки — по одной на
      каждый вызов. Когда нажимаешь «Запустить», ответы берутся из поля «Ввод для „Запустить“» под
      кнопками. Поле свёрнуто — нажми на его заголовок, чтобы раскрыть. Каждая строка поля — ответ
      на один `input()`, так одну программу легко проверить на разных ответах. Если строк меньше,
      чем вызовов `input()`, программе не хватит ввода, и она остановится с ошибкой EOFError.

      Подсказка из `input()` в проверку не входит: сравнивается только то, что напечатал
      `print`. Поэтому пиши подсказку, понятную человеку.
    simpler: >-
      `input()` — вопрос к человеку. Программа показывает вопрос, ждёт ответа и отдаёт ответ
      тебе, а ты кладёшь его в переменную: `name = input()`. Ответ всегда приходит текстом.
      В тренажёре ответы заранее записаны в тестах, поэтому программе не приходится никого ждать.
    coach: >-
      Если запомнить одно: результат `input()` сохраняй в переменную — и помни, что это всегда
      строка.

  - id: sticker
    type: example
    title: Наклейка на стаканчик
    body: >-
      Программа из истории. Ввод для этого примера уже задан: гостя зовут Катя. Нажми
      «Запустить» — в результате появятся вопрос, ответ и сама наклейка.
    code: |-
      name = input("Как тебя зовут? ")
      print(f"{name}, твой капучино готов!")
    stdin: "Катя\n"
    notes:
      - line: 1
        text: >-
          `input(...)` показывает подсказку и ждёт строку. Ответ «Катя» сохраняется в
          переменной `name`.
      - line: 2
        text: f-строка подставляет в текст то, что ввёл человек, — на месте `{name}` появится «Катя».
    tryIt: >-
      Измени текст наклейки во второй строке, например на «заказ принят», и запусти снова. Свои
      ответы на вопрос ты сможешь подставлять в заданиях — там есть поле «Ввод для „Запустить“».
    coach: >-
      Обрати внимание: в результате видны и подсказка, и ответ. Но проверяется только строка,
      которую напечатал `print`.

  - id: two-numbers
    type: predict
    title: Два ответа и плюс
    prompt: >-
      Программа должна сложить два числа из ввода. Во вводе две строки: `2` и `3`. Как думаешь,
      что появится на экране?
    code: |-
      a = input()
      b = input()
      print(a + b)
    stdin: "2\n3\n"
    options:
      - "5"
      - "23"
      - Ошибка
    answer: "23"
    explanation: >-
      `input()` вернул не числа, а строки `"2"` и `"3"`. Для строк `+` означает склейку, как
      `"Лю" + "да"` даёт `"Люда"`. Поэтому получилось `23`. Как сложить их как числа, разберём
      в следующем уроке.
    coach: >-
      Это самая частая ловушка с вводом. Раз ты увидел её здесь, дальше будешь узнавать её сразу.

  - id: practice-greeting
    type: exercise
    title: Практика 1
    exercise:
      id: m1-l4-e1
      kind: repeat
      title: Приветствие по имени
      statement: |-
        Напиши программу, которая спрашивает имя и здоровается:

        ```text
        Привет, Аня!
        ```

        Вместо «Аня» должно стоять то имя, которое ввели.
      input: Одна строка — имя.
      output: "Одна строка: `Привет, <имя>!`"
      constraints:
        - Имя нужно получить через `input()`, а не записать в код.
        - Текст подсказки в `input()` можно написать любой — он не проверяется.
      starterCode: |
        # Спроси имя и сохрани ответ в переменную
        # Затем выведи приветствие с этим именем

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "Аня\n"
          expected: Привет, Аня!
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "Борис\n"
          expected: Привет, Борис!
        - id: t3
          kind: io
          title: "Граничный случай: имя с пробелом"
          edge: true
          stdin: "Анна Мария\n"
          expected: Привет, Анна Мария!
        - id: t4
          kind: io
          title: "Граничный случай: длинное имя"
          edge: true
          stdin: "Александра-Виктория Римская-Корсакова\n"
          expected: Привет, Александра-Виктория Римская-Корсакова!
        - id: t5
          kind: io
          title: "Граничный случай: пустой ввод"
          edge: true
          stdin: "\n"
          expected: Привет, !
      criteria:
        - Имя берётся из ввода, поэтому программа здоровается с любым человеком.
        - "Вывод — одна строка: «Привет,», пробел, имя и восклицательный знак сразу после имени."
        - Имя из нескольких слов выводится целиком, пустой ввод не ломает программу.
      hints:
        - >-
          Программе нужно сделать два дела по порядку: получить имя и где-то его сохранить, а
          потом напечатать приветствие. Посмотри, какая строка примера «Наклейка на стаканчик»
          делает первое.
        - >-
          Похожий приём на другом примере: `city = input("Твой город? ")` сохраняет ответ в
          `city`, а `print(f"Ты из города {city}")` подставляет его в текст.
        - |-
          Каркас из двух строк:
          ```text
          имя = input("…")
          print(f"Привет, {…}!")
          ```
          Придумай имя переменной и подставь его в обе строки.
      solution:
        code: |
          name = input("Как тебя зовут? ")
          print(f"Привет, {name}!")
        explanation: >-
          Первая строка ждёт ответа и кладёт его в переменную `name`. Вторая подставляет
          значение в f-строку. Имя из двух слов тоже попадает целиком: `input()` читает всю
          строку. Подойдёт и `print("Привет,", name + "!")` — вывод будет тем же.
      wrongSolutions:
        - code: |
            print("Привет, Аня!")
          note: Имя записано в код, а не взято из ввода.
          expectMistake: no-input
        - code: |
            input("Как тебя зовут? ")
            print(f"Привет, {name}!")
          note: Ответ input() не сохранён в переменную.
          expectMistake: not-saved
        - code: |
            # Спроси имя и сохрани ответ в переменную
            # Затем выведи приветствие с этим именем
            print(f"Привет, {name}!")
          note: Строки с input() нет — переменная name нигде не создана.
          expectMistake: not-saved
        - code: |
            name = input("Как тебя зовут? ")
            print("Привет, {name}!")
          note: Нет буквы f перед строкой.
          expectMistake: no-f
        - code: |
            name = input("Как тебя зовут? ")
            print("Привет, name!")
          note: Имя переменной написано внутри кавычек как обычный текст.
          expectMistake: name-in-quotes
        - code: |
            name = input("Как тебя зовут? ")
            print("Привет,", name, "!")
          note: Запятые в print добавили пробел перед «!».
          expectMistake: space-before-mark
      mistakes:
        - id: not-saved
          when:
            errorType: NameError
          why: >-
            Python не знает имя переменной в f-строке. Так бывает, если строки с `input()` нет,
            если ответ `input()` никуда не сохранили — тогда он пропадает, — или если в `print`
            имя написано иначе, чем при сохранении.
          try: 'Сохрани ответ: `name = input("…")` — и используй это же имя в `print`.'
          verify: Ошибка NameError должна исчезнуть, а в «Примере 1» появится «Привет, Аня!».
        - id: no-f
          when:
            outputIncludes: "{"
          why: >-
            На экране видны фигурные скобки — значит, Python считает строку обычным текстом.
            Подставлять значения умеет только f-строка.
          try: Поставь букву `f` прямо перед открывающей кавычкой строки в `print`.
          verify: В «Примере 1» вместо скобок должно появиться имя.
        - id: name-in-quotes
          when:
            outputIncludes: name
          why: >-
            На экране слово «name», а не имя из ввода. Всё, что стоит внутри кавычек, Python
            печатает как обычный текст — даже если это имя переменной.
          try: 'Подставь переменную через f-строку: `f"Привет, {name}!"` — фигурные скобки говорят Python, что здесь нужно значение.'
          verify: В «Примере 1» должно появиться «Привет, Аня!».
        - id: no-input
          when:
            codeRegex: '(?<![\s\S])(?![\s\S]*\binput\s*\()'
            codeIncludes: print(
          why: >-
            Имя записано прямо в код, поэтому программа здоровается всегда с одним и тем же
            человеком. В тестах вводят разные имена, а на экране каждый раз одно и то же.
          try: Получи имя через `input()`, сохрани в переменную и подставь её в приветствие.
          verify: Проверь «Пример 2» — там должно появиться «Привет, Борис!».
        - id: space-before-mark
          when:
            outputIncludes: " !"
          why: >-
            Перед восклицательным знаком лишний пробел. Когда значения в `print` перечислены
            через запятую, Python ставит между ними пробел — и перед «!» тоже.
          try: >-
            Собери строку целиком через f-строку: `f"Привет, {name}!"` — или приклей знак к
            имени: `name + "!"`.
          verify: В «Примере 1» должно быть «Привет, Аня!» без пробела перед «!».
      afterPass: >-
        Программа здоровается с любым человеком — даже с тем, чьё имя состоит из двух слов. Можешь
        вписать своё имя в поле «Ввод для „Запустить“», нажать «Запустить» и посмотреть на
        результат.
      skills: [input-read, f-strings, variables]

  - id: practice-drink
    type: exercise
    title: Практика 2
    exercise:
      id: m1-l4-e2
      kind: modify
      title: Гость и напиток
      statement: |-
        Программа у кассы спрашивает имя гостя и печатает строку для бариста. Теперь нужно
        спрашивать ещё и напиток. Измени программу: добавь второй вопрос и вторую строку вывода.

        Ввод — две строки: сначала имя, потом напиток. Вывод:

        ```text
        Гость: Катя
        Напиток: капучино
        ```
      input: Две строки — имя гостя и название напитка.
      output: "Две строки: `Гость: <имя>` и `Напиток: <напиток>`."
      constraints:
        - Напиток тоже получай через `input()`.
      starterCode: |
        name = input("Имя гостя: ")
        print(f"Гость: {name}")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "Катя\nкапучино\n"
          expected: |-
            Гость: Катя
            Напиток: капучино
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "Борис\nчай с мятой\n"
          expected: |-
            Гость: Борис
            Напиток: чай с мятой
        - id: t3
          kind: io
          title: "Граничный случай: короткие ответы"
          edge: true
          stdin: "Ли\nраф\n"
          expected: |-
            Гость: Ли
            Напиток: раф
        - id: t4
          kind: io
          title: "Граничный случай: напиток не ввели"
          edge: true
          stdin: "Аня\n\n"
          expected: |-
            Гость: Аня
            Напиток:
      criteria:
        - Программа читает две строки ввода по порядку — имя, затем напиток.
        - Выводит две строки в формате из условия.
        - Пустой ответ про напиток не ломает программу.
      hints:
        - >-
          Сейчас программа задаёт один вопрос и печатает одну строку. Чего не хватает — и в каком
          порядке придут ответы?
        - >-
          Каждый `input()` берёт следующую строку ввода. Например, после `a = input()` и
          `b = input()` в `a` окажется первая строка, а в `b` — вторая.
        - |-
          Каркас:
          ```text
          name = input(...)      # первая строка ввода
          drink = input(...)     # вторая строка ввода
          print(... Гость ...)
          print(... Напиток ...)
          ```
      solution:
        code: |
          name = input("Имя гостя: ")
          drink = input("Напиток: ")
          print(f"Гость: {name}")
          print(f"Напиток: {drink}")
        explanation: >-
          Два вызова `input()` читают две строки ввода по порядку: первая попадает в `name`,
          вторая — в `drink`. Вопрос про напиток можно задать и после первого `print` — важно
          только, чтобы имя читалось раньше напитка.
      wrongSolutions:
        - code: |
            name = input("Имя гостя: ")
            print(f"Гость: {name}")
          note: Код не изменён.
          expectMistake: missing-line
        - code: |
            drink = input("Напиток: ")
            name = input("Имя гостя: ")
            print(f"Гость: {name}")
            print(f"Напиток: {drink}")
          note: Ответы читаются в обратном порядке.
          expectMistake: swapped
        - code: |
            name = input("Имя гостя: ")
            input("Напиток: ")
            print(f"Гость: {name}")
            print(f"Напиток: {drink}")
          note: Ответ про напиток не сохранён.
          expectMistake: not-saved
        - code: |
            name = input("Имя гостя: ")
            drink = input("Напиток: ")
            print(f"Гость: {name}")
            print(f"Напиток: {name}")
          note: Во второй строке подставлена не та переменная.
          expectMistake: same-variable
        - code: |
            name = input("Имя гостя: ")
            drink = input("Напиток: ")
            print(f"Гость: {name}")
            print("Напиток: drink")
          note: Имя переменной написано внутри кавычек как обычный текст.
          expectMistake: name-in-quotes
      mistakes:
        - id: not-saved
          when:
            errorType: NameError
          why: >-
            Python не знает имя переменной в `print`. Так бывает, если ответ на вопрос не
            сохранили в переменную или в `print` имя написано иначе, чем при сохранении.
          try: Запиши второй вопрос так же, как первый, — с переменной слева от `=`, и используй это же имя в `print`.
          verify: Ошибка NameError должна исчезнуть.
        - id: missing-line
          when:
            outputEquals: "Гость: Катя"
          why: Программа печатает только первую строку — строки с напитком в выводе пока нет.
          try: >-
            Проверь, что ответ про напиток сохраняется в новую переменную и что есть второй `print`
            со строкой «Напиток: …».
          verify: В «Примере 1» должны появиться две строки.
        - id: swapped
          when:
            outputEquals: |-
              Гость: капучино
              Напиток: Катя
          why: >-
            Имя и напиток поменялись местами. Строки ввода приходят по порядку: первый `input()`
            получает первую строку — имя, второй — напиток.
          try: Поставь вопрос про имя раньше вопроса про напиток.
          verify: 'В «Примере 1» первой строкой должно быть «Гость: Катя».'
        - id: same-variable
          when:
            outputEquals: |-
              Гость: Катя
              Напиток: Катя
          why: Во второй строке снова стоит имя гостя — в f-строку подставлена переменная с именем, а не с напитком.
          try: Во втором `print` подставь переменную, в которую сохранён ответ про напиток.
          verify: 'В «Примере 1» второй строкой должно быть «Напиток: капучино».'
        - id: name-in-quotes
          when:
            outputIncludes: drink
          why: >-
            На экране слово «drink», а не напиток из ввода. Всё, что стоит внутри кавычек, Python
            печатает как обычный текст — даже если это имя переменной.
          try: 'Подставь переменную через f-строку: `f"Напиток: {drink}"`.'
          verify: 'В «Примере 1» второй строкой должно быть «Напиток: капучино».'
      afterPass: >-
        Программа читает два ответа и не путает их. Если хочешь, поменяй в коде вопросы местами,
        нажми «Запустить» и посмотри, что станет с выводом, — так легче запомнить, что порядок
        строк ввода важен.
      skills: [input-read, variables, f-strings]

  - id: practice-badge
    type: exercise
    title: Практика 3
    exercise:
      id: m1-l4-e3
      kind: write
      title: Бейдж участника
      statement: |-
        Для бейджей на встречу нужна подпись: имя и фамилия в одной строке через пробел, а под
        ней — линия из знаков `=` точно той же длины, что и первая строка.

        Программа читает имя (первая строка ввода) и фамилию (вторая строка). Например, для
        Кати Смирновой вывод такой:

        ```text
        Катя Смирнова
        =============
        ```
      input: Две строки — имя и фамилия.
      output: "Две строки: `<имя> <фамилия>` и линия из `=` той же длины."
      constraints:
        - Длина линии зависит от ввода — для каждого человека своя.
      starterCode: |
        # Прочитай имя и фамилию
        # Выведи подпись и линию из = такой же длины

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "Катя\nСмирнова\n"
          expected: |-
            Катя Смирнова
            =============
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "Лев\nЛи\n"
          expected: |-
            Лев Ли
            ======
        - id: t3
          kind: io
          title: "Граничный случай: длинная фамилия"
          edge: true
          stdin: "Александра\nРимская-Корсакова\n"
          expected: |-
            Александра Римская-Корсакова
            ============================
        - id: t4
          kind: io
          title: "Граничный случай: очень короткие имя и фамилия"
          edge: true
          stdin: "Ян\nОм\n"
          expected: |-
            Ян Ом
            =====
      criteria:
        - Первая строка — имя и фамилия из ввода, между ними один пробел.
        - Во второй строке столько знаков `=`, сколько символов в первой строке, включая пробел.
        - Программа работает для имён любой длины.
      hints:
        - >-
          Разбей задачу на шаги: получить два ответа, собрать из них одну строку, узнать её
          длину. Какие приёмы из урока про строки помогают с последними двумя шагами?
        - >-
          На другом примере: `word = "кофе"`, тогда `len(word)` даёт 4, а `"-" * len(word)`
          даёт `----`. Пробел — тоже символ, `len("а б")` равно 3.
        - |-
          Каркас:
          ```text
          имя = input(...)
          фамилия = input(...)
          подпись = имя + " " + фамилия
          print(подпись)
          print("=" * длина подписи)
          ```
      solution:
        code: |
          first = input("Имя: ")
          last = input("Фамилия: ")
          full = first + " " + last
          print(full)
          print("=" * len(full))
        explanation: >-
          Сначала из двух ответов собирается одна строка с пробелом посередине. `len(full)`
          считает все её символы — и пробел тоже, — а `"=" * len(full)` повторяет знак ровно
          столько раз. Подпись можно собрать и f-строкой: `f"{first} {last}"`.
      wrongSolutions:
        - code: |
            first = input("Имя: ")
            last = input("Фамилия: ")
            print(first + " " + last)
            print("=" * len(first + last))
          note: В длине не учтён пробел.
          expectMistake: space-not-counted
        - code: |
            first = input("Имя: ")
            last = input("Фамилия: ")
            full = first + last
            print(full)
            print("=" * len(full))
          note: Имя и фамилия склеены без пробела.
          expectMistake: no-space
        - code: |
            first = input("Имя: ")
            last = input("Фамилия: ")
            print(first + " " + last)
            print("=============")
          note: Линия фиксированной длины.
          expectMistake: fixed-line
      mistakes:
        - id: no-space
          when:
            outputIncludes: КатяСмирнова
          why: >-
            Имя и фамилия слиплись: `+` склеивает строки ровно как есть и сам пробел не
            добавляет.
          try: Вставь между ними строку из одного пробела — `first + " " + last`.
          verify: В «Примере 1» первой строкой должно быть «Катя Смирнова».
        - id: space-not-counted
          when:
            outputEquals: |-
              Катя Смирнова
              ============
          why: >-
            Линия на один знак короче подписи: длина посчитана для имени и фамилии без пробела,
            а на экране между ними пробел есть.
          try: Посчитай длину той самой строки, которую печатаешь первой, — вместе с пробелом.
          verify: В «Примере 1» во второй строке должно быть 13 знаков `=`.
        - id: fixed-line
          when:
            codeRegex: '(?<![\s\S])(?![\s\S]*\blen\s*\()'
            outputIncludes: "==="
          why: >-
            Длина линии записана в коде заранее, поэтому подходит только к одному имени. Для
            «Лев Ли» нужна линия из 6 знаков, а для «Катя Смирнова» — из 13.
          try: Узнай длину подписи через `len(...)` и повтори `=` столько раз.
          verify: Проверь «Пример 2» — линия должна стать короче.
      afterPass: >-
        Линия подстраивается под любое имя, потому что её длину считает программа, а не ты. Можешь
        заменить `=` на другой символ, например `-` или `*`, и нажать «Запустить».
      skills: [input-read, strings-basics, variables]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`input()` останавливает программу и ждёт одну строку ввода; ответ сохраняют в переменную: `name = input()`."
      - Текст в скобках `input("…")` — подсказка для человека. В проверку он не входит.
      - "`input()` всегда возвращает строку: `\"2\" + \"3\"` даёт `23`, а не 5."
      - Каждый `input()` читает следующую строку ввода — порядок вопросов должен совпадать с порядком ответов.
    question: >-
      Во вводе две строки: «Катя» и «капучино». Что окажется в переменных, если в программе
      сначала написать `drink = input()`, а потом `name = input()`?
    answer: >-
      В `drink` окажется «Катя», а в `name` — «капучино». `input()` не знает, что спрашивает, —
      он просто берёт следующую строку ввода по порядку. Поэтому вопросы нужно задавать в том же
      порядке, в каком приходят ответы.
