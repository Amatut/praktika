id: m1-l5
module: m1
number: "1.5"
title: "Превращение типов"
objective: >-
  Превращать строку из input() в число через int() и float(), а число в строку через str(), и
  узнавать ValueError и TypeError.
minutes: [25, 30]
prerequisites: [m1-l4]
skills: [type-conversion]
environment: python

story:
  title: Сто пятьдесят троек
  fictional: true
  text: >-
    Хозяйка кофейни «Утро» попросила Лену добавить в программу у кассы подсчёт суммы: гость
    вводит, сколько взял чашек, а программа умножает это на цену 150. На первой же проверке экран
    заполнился тройками: вместо 450 программа напечатала «3» сто пятьдесят раз подряд. Программа
    не сломалась — она честно повторила текст, ведь `input()` возвращает строку, а строка,
    умноженная на 150, повторяется 150 раз. Одно добавленное слово `int` — и итог стал 450.

why: >-
  Всё, что вводит человек, программа получает как текст. Чтобы посчитать сумму заказа или сдачу,
  строку `"3"` нужно превратить в число `3`, а иногда наоборот — число в строку.

usedIn: >-
  Преобразование типов есть в любой программе, которая принимает данные: в калькуляторах, в формах
  на сайтах (возраст, количество товара), при чтении таблиц и файлов с числами.

steps:
  - id: idea
    type: theory
    title: Три типа и превращения
    body: |-
      У каждого значения в Python есть **тип** — вид данных. Пока нам хватит трёх:

      - `str` — строка, текст: `"150"`, `"Катя"`;
      - `int` — целое число: `150`, `0`, `-3`;
      - `float` — дробное число, дробная часть пишется через точку: `2.5`, `0.25`.

      `"150"` и `150` выглядят похоже, но это разные значения: строку `*` повторяет, а число —
      умножает. Узнать тип можно командой `print(type(x))`.

      Чтобы превратить значение в другой тип, его передают функции с именем этого типа:

      ```python
      int("42")     # 42 — целое число
      float("2.5")  # 2.5 — дробное число
      str(150)      # "150" — строка
      ```

      Обычно превращение сразу применяют к ответу `input()`:
      `cups = int(input("Сколько чашек? "))`. Такая запись выполняется изнутри наружу: сначала
      `input()` получает строку `"3"`, потом `int()` делает из неё число `3`.

      **Если превратить не получается**, Python останавливается с ошибкой **ValueError** —
      «неподходящее значение»:

      - `int("abc")` — в строке нет числа;
      - `int("3.5")` — `int()` понимает только запись целого числа, для дробной нужен `float()`;
      - `float("3,5")` — дробную часть в Python отделяют точкой, а не запятой;
      - `int("")` — пустая строка.

      Пробелы по краям `int()` и `float()` прощают: `int(" 7 ")` даёт `7`.

      **Если смешать строку и число**, будет **TypeError** — «несовместимые типы». Например,
      `"Итого: " + 450`: знак `+` склеивает строку только со строкой. Выход — f-строка
      `f"Итого: {450}"` или `"Итого: " + str(450)`.
    simpler: >-
      Из `input()` всегда приходит текст. Чтобы считать, текст превращают в число: `int()` — для
      целых, `float()` — для дробных с точкой. Если в тексте не число — будет ValueError. Если
      склеиваешь текст с числом через `+` — будет TypeError, и тогда поможет f-строка.
    coach: >-
      Две ошибки легко различить: ValueError — «это не число», TypeError — «текст и число
      смешались». Этого почти всегда хватает, чтобы понять, что случилось.

  - id: cups-example
    type: example
    title: Считаем чашки
    body: >-
      Программа из истории, уже исправленная. Ввод для примера задан: гость взял 3 чашки.
    code: |-
      cups = int(input("Сколько чашек? "))
      price = 150
      total = cups * price
      print(f"Итого: {total}")
      print(type(cups))
    stdin: "3\n"
    notes:
      - line: 1
        text: Сначала `input()` получает строку `"3"`, затем `int()` превращает её в число `3`.
      - line: 3
        text: 'Оба значения — числа, поэтому `*` умножает: 3 × 150 = 450.'
      - line: 4
        text: В f-строку число можно подставить сразу — превращать его в строку не нужно.
      - line: 5
        text: "`type()` показывает тип: `<class 'int'>` значит «целое число»."
    tryIt: >-
      Убери `int(` и последнюю скобку в первой строке, чтобы осталось
      `cups = input("Сколько чашек? ")`, и запусти. Посмотри, что стало с итогом и с типом.

  - id: plus-one
    type: predict
    title: Возраст через год
    prompt: >-
      Программа хочет посчитать, сколько человеку будет лет через год. Во вводе — `17`. Как
      думаешь, что произойдёт?
    code: |-
      age = input("Сколько тебе лет? ")
      print(age + 1)
    stdin: "17\n"
    options:
      - "18"
      - "171"
      - Ошибка TypeError
    answer: Ошибка TypeError
    answerIsNotOutput: true
    explanation: >-
      В `age` лежит строка `"17"`, а `1` — число. Знак `+` не может склеить строку с числом и не
      угадывает, что ты хотел сложить, поэтому Python останавливается: `TypeError: can only
      concatenate str (not "int") to str`. Чтобы получить 18, нужно сразу превратить ввод в
      число: `age = int(input("Сколько тебе лет? "))`.

  - id: str-glue
    type: predict
    title: Число в строку
    prompt: >-
      В прошлой программе строка встретилась с числом. Здесь оба числа превращены в строки
      через `str()`. Как думаешь, что напечатает программа?
    code: |-
      age = 17
      print(str(age) + str(1))
    options:
      - "18"
      - "171"
      - Ошибка TypeError
    answer: "171"
    explanation: >-
      `str()` превратил числа 17 и 1 в строки `"17"` и `"1"`, а строки `+` склеивает — получилось
      `171`. `str()` пригодится, когда число нужно приклеить к тексту через `+`:
      `"Возраст: " + str(age)`. А чтобы сложить, нужны числа: `age + 1` даёт 18.

  - id: which-fails
    type: quiz
    title: Где будет ValueError?
    question: Какая из строк кода остановит программу с ошибкой ValueError?
    options:
      - '`int("12")`'
      - '`int(" 7 ")`'
      - '`int("3.5")`'
      - '`float("3.5")`'
    correct: 2
    explanation: >-
      `int()` понимает только запись целого числа, а `"3.5"` — дробная запись. Для неё нужен
      `float("3.5")`. Пробелы по краям не мешают: `int(" 7 ")` спокойно даёт 7.

  - id: practice-tea
    type: exercise
    title: Практика 1
    exercise:
      id: m1-l5-e1
      kind: repeat
      title: Чай для компании
      statement: |-
        Чашка чая стоит 120. Напиши программу, которая спрашивает, сколько чашек взяли, и печатает
        сумму:

        ```text
        Итого: 360
        ```
      input: Одна строка — количество чашек, целое число.
      output: "Одна строка: `Итого: <сумма>`, сумма — целое число."
      constraints:
        - Количество нужно получить через `input()`.
      starterCode: |
        # Спроси количество чашек и превращи ответ в число
        # Выведи сумму: цена чашки — 120

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "3\n"
          expected: "Итого: 360"
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "1\n"
          expected: "Итого: 120"
        - id: t3
          kind: io
          title: "Обычный случай: 10 чашек"
          stdin: "10\n"
          expected: "Итого: 1200"
        - id: t4
          kind: io
          title: "Граничный случай: ноль чашек"
          edge: true
          stdin: "0\n"
          expected: "Итого: 0"
        - id: t5
          kind: io
          title: "Граничный случай: пробелы вокруг числа"
          edge: true
          stdin: " 2 \n"
          expected: "Итого: 240"
      criteria:
        - Количество берётся из ввода и превращается в целое число.
        - "Выводится одна строка `Итого: <сумма>`, где сумма — количество × 120."
        - Ноль чашек и пробелы вокруг числа не ломают программу.
      hints:
        - >-
          Посмотри, какого типа значение возвращает `input()` и что делает `*` с таким значением.
          Сравни с примером «Считаем чашки».
        - >-
          На другом примере: `n = int(input())` превращает ответ `"4"` в число 4, и тогда
          `n * 10` даёт 40, а не `4444444444`.
        - |-
          Каркас:
          ```text
          cups = int(input(...))
          print(f"Итого: {…}")   # внутри скобок — расчёт суммы
          ```
      solution:
        code: |
          cups = int(input("Сколько чашек? "))
          print(f"Итого: {cups * 120}")
        explanation: >-
          `int()` превращает ответ в число, и `*` умножает, а не повторяет текст. Расчёт можно
          сделать прямо в фигурных скобках f-строки или заранее сохранить в переменную
          `total = cups * 120`.
      wrongSolutions:
        - code: |
            cups = input("Сколько чашек? ")
            print(f"Итого: {cups * 120}")
          note: Нет int(), строка повторилась 120 раз.
          expectMistake: no-int
        - code: |
            cups = int(input("Сколько чашек? "))
            print("Итого: " + cups * 120)
          note: Строка склеивается с числом через +.
          expectMistake: concat-number
        - code: |
            cups = float(input("Сколько чашек? "))
            print(f"Итого: {cups * 120}")
          note: float() вместо int(), сумма выводится как 360.0.
          expectMistake: float-count
        - code: |
            cups = int(input("Сколько чашек? "))
            print(f"Итого: {cups} * 120")
          note: Умножение оказалось внутри текста.
          expectMistake: math-in-text
      mistakes:
        - id: no-int
          when:
            codeRegex: '(?<![\s\S])(?![\s\S]*\b(?:int|float)\s*\()'
            codeIncludes: input(
          why: >-
            Ответ `input()` остался строкой, а строку `*` повторяет: `"3" * 120` — это сто
            двадцать троек подряд, а не 360.
          try: Преврати ответ в число сразу при вводе — оберни `input(...)` в `int(...)`.
          verify: 'В «Примере 1» должно получиться «Итого: 360».'
        - id: concat-number
          when:
            errorIncludes: can only concatenate
          why: >-
            Знак `+` склеивает строку только со строкой, а сумма — число. Python не угадывает,
            что ты хотел, и останавливается с TypeError.
          try: 'Подставь число через f-строку: `f"Итого: {…}"` — или преврати его в строку через `str(...)`.'
          verify: 'Ошибка TypeError должна исчезнуть, а в «Примере 1» появится «Итого: 360».'
        - id: float-count
          when:
            codeIncludes: float(
            outputIncludes: ".0"
          why: >-
            `float()` сделал количество дробным числом, поэтому и сумма вышла дробной: `360.0`.
            Чашки считают целыми, и в условии сумма — целое число.
          try: Замени `float` на `int`.
          verify: 'В «Примере 1» должно быть «Итого: 360» без `.0`.'
        - id: math-in-text
          when:
            outputIncludes: "* 120"
          why: >-
            Умножение попало в текст f-строки, но за фигурные скобки. Всё, что снаружи скобок,
            Python печатает как есть и не вычисляет.
          try: Помести всё выражение `cups * 120` внутрь одних фигурных скобок.
          verify: В «Примере 1» вместо «3 * 120» должно появиться «360».
      afterPass: >-
        Теперь `*` умножает числа, а не повторяет текст. Если хочешь, впиши `2.5` в поле «Ввод
        для „Запустить“», нажми «Запустить» и посмотри, какую ошибку покажет `int()`.
      skills: [type-conversion, input-read, numbers-arithmetic]

  - id: practice-revenue
    type: exercise
    title: Практика 2
    exercise:
      id: m1-l5-e2
      kind: fix
      title: Выручка за день
      statement: |-
        Лена записывает выручку кофейни за утро и за вечер — это целые числа, — а программа должна
        печатать их сумму. Но для 1500 и 2300 программа печатает `15002300` вместо `3800`.

        Найди ошибку и исправь её.
      input: Две строки — выручка за утро и за вечер, целые числа.
      output: Одна строка — сумма двух чисел.
      starterCode: |
        morning = input("Выручка за утро: ")
        evening = input("Выручка за вечер: ")
        print(morning + evening)
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "1500\n2300\n"
          expected: "3800"
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "2\n3\n"
          expected: "5"
        - id: t3
          kind: io
          title: "Граничный случай: выручки не было"
          edge: true
          stdin: "0\n0\n"
          expected: "0"
        - id: t4
          kind: io
          title: "Граничный случай: пробелы вокруг чисел"
          edge: true
          stdin: " 700\n300 \n"
          expected: "1000"
        - id: t5
          kind: io
          title: "Граничный случай: большое число"
          edge: true
          stdin: "999999\n1\n"
          expected: "1000000"
      criteria:
        - Оба значения превращаются в целые числа до сложения.
        - Выводится одно целое число — сумма.
      hints:
        - >-
          Посмотри на результат `15002300`: он получился не сложением, а чем-то другим. Какого
          типа значения в `morning` и `evening`?
        - >-
          На другом примере: `"12" + "5"` даёт `"125"`, а `int("12") + int("5")` даёт `17`.
        - >-
          Каждый ответ `input()` нужно обернуть в `int(...)`: `morning = int(input(...))` — и так
          же для второго числа.
      solution:
        code: |
          morning = int(input("Выручка за утро: "))
          evening = int(input("Выручка за вечер: "))
          print(morning + evening)
        explanation: >-
          `input()` вернул строки, и `+` их склеивал. После `int()` в переменных лежат числа, и
          `+` складывает. Превратить можно и в последней строке: `print(int(morning) + int(evening))`.
      wrongSolutions:
        - code: |
            morning = input("Выручка за утро: ")
            evening = input("Выручка за вечер: ")
            print(morning + evening)
          note: Код не изменён.
          expectMistake: glued
        - code: |
            morning = input("Выручка за утро: ")
            evening = input("Выручка за вечер: ")
            print(int(morning + evening))
          note: Превращение в число после склейки.
          expectMistake: late-int
        - code: |
            morning = int(input("Выручка за утро: "))
            evening = input("Выручка за вечер: ")
            print(morning + evening)
          note: Превращено только одно число.
          expectMistake: one-int
        - code: |
            morning = float(input("Выручка за утро: "))
            evening = float(input("Выручка за вечер: "))
            print(morning + evening)
          note: float() вместо int(), результат 3800.0.
          expectMistake: float-sum
      mistakes:
        - id: late-int
          when:
            codeRegex: '\bint\(\s*\w+\s*\+\s*\w+\s*\)'
          why: >-
            `int()` стоит снаружи: сначала `+` склеивает строки в `"15002300"`, а уже потом
            склейка превращается в число 15002300.
          try: Преврати в число каждое значение отдельно — ещё до сложения.
          verify: В «Примере 1» должно получиться 3800.
        - id: glued
          when:
            outputEquals: "15002300"
          why: >-
            В `morning` и `evening` лежат строки — так их вернул `input()`. Для строк `+` означает
            склейку, поэтому `"1500" + "2300"` даёт `15002300`.
          try: Преврати оба ответа в целые числа через `int(...)`.
          verify: В «Примере 1» должно получиться 3800.
        - id: one-int
          when:
            errorType: TypeError
          why: >-
            В `+` встретились число и строка: одно значение уже прошло через `int()`, а другое
            осталось строкой. Ни сложить, ни склеить их Python не может — отсюда TypeError.
          try: Найди значение, которое не прошло через `int(...)`, и преврати его тоже.
          verify: 'Ошибка TypeError должна исчезнуть, а в «Примере 1» появится 3800.'
        - id: float-sum
          when:
            outputEquals: "3800.0"
          why: >-
            Сумма посчитана верно, но `float()` сделал числа дробными, поэтому на экране `3800.0`.
            Выручка здесь — целые числа.
          try: Замени `float` на `int`.
          verify: В «Примере 1» должно быть 3800 без `.0`.
      afterPass: >-
        Ошибка найдена: строки склеивались, а теперь числа складываются. Это самая частая ошибка
        с вводом — теперь ты узнаешь её по выводу вида `15002300`.
      skills: [type-conversion, input-read, read-errors]

  - id: practice-weight
    type: exercise
    title: Практика 3
    exercise:
      id: m1-l5-e3
      kind: modify
      title: Кофе на развес
      statement: |-
        Кофе в зёрнах стоит 1300 за килограмм. Программа считает стоимость, но только для целых
        килограммов: на вводе `0.25` она падает с ValueError.

        Измени программу так, чтобы вес мог быть дробным.

        Есть тонкость: дробные числа компьютер хранит с крошечной погрешностью, поэтому
        `1300 * 0.7` даёт `909.9999999999999`. Лишние цифры убирает **округление**: `round(x, 2)`
        оставляет не больше двух знаков после точки, а `round(x)` округляет до целого. Выведи
        стоимость, округлённую через `round(…, 2)`. Нули в конце `round` не дописывает, поэтому для
        веса `0.25` будет `325.0`, а не `325.00`:

        ```text
        Стоимость: 325.0
        ```
      input: Одна строка — вес в килограммах, целый или дробный (через точку).
      output: "Одна строка: `Стоимость: <round(1300 × вес, 2)>`."
      constraints:
        - Дробная часть веса отделяется точкой.
      starterCode: |
        price = 1300
        weight = int(input("Сколько килограммов? "))
        print(f"Стоимость: {price * weight}")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "0.25\n"
          expected: "Стоимость: 325.0"
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "0.7\n"
          expected: "Стоимость: 910.0"
        - id: t3
          kind: io
          title: "Обычный случай: полтора килограмма"
          stdin: "1.5\n"
          expected: "Стоимость: 1950.0"
        - id: t4
          kind: io
          title: "Граничный случай: целый вес"
          edge: true
          stdin: "2\n"
          expected: "Стоимость: 2600.0"
        - id: t5
          kind: io
          title: "Граничный случай: треть килограмма, много знаков после точки"
          edge: true
          stdin: "0.33333\n"
          expected: "Стоимость: 433.33"
        - id: t6
          kind: io
          title: "Граничный случай: нулевой вес"
          edge: true
          stdin: "0\n"
          expected: "Стоимость: 0.0"
      criteria:
        - Вес читается как дробное число, целый вес тоже подходит.
        - Стоимость округляется до двух знаков после точки через `round`.
        - "Формат вывода: `Стоимость: <число>`."
      hints:
        - >-
          Из-за чего программа падает на `0.25`? Посмотри, какая функция превращает ввод в число
          и какие записи она понимает.
        - >-
          На другом примере: `float("0.5")` даёт 0.5, а `round(2.0000000001, 2)` даёт 2.0 —
          лишние цифры после точки пропадают.
        - |-
          Каркас:
          ```text
          weight = float(input(...))
          print(f"Стоимость: {round(…, 2)}")   # внутри round — расчёт стоимости
          ```
      solution:
        code: |
          price = 1300
          weight = float(input("Сколько килограммов? "))
          print(f"Стоимость: {round(price * weight, 2)}")
        explanation: >-
          `float()` понимает и `0.25`, и `2`. Произведение с дробным числом может получиться с
          погрешностью — например, `1300 * 0.7` даёт `909.9999999999999`, — поэтому `round(…, 2)`
          оставляет не больше двух знаков после точки.
      wrongSolutions:
        - code: |
            price = 1300
            weight = int(input("Сколько килограммов? "))
            print(f"Стоимость: {price * weight}")
          note: Код не изменён, int("0.25") падает.
          expectMistake: int-fraction
        - code: |
            price = 1300
            weight = float(input("Сколько килограммов? "))
            print(f"Стоимость: {price * weight}")
          note: Нет округления.
          expectMistake: no-round
        - code: |
            price = 1300
            weight = float(input("Сколько килограммов? "))
            print(f"Стоимость: {round(price * weight)}")
          note: Округление до целого вместо двух знаков.
          expectMistake: whole-number
        - code: |
            price = 1300
            weight = float(input("Сколько килограммов? "))
            print(f"Стоимость: {round(price * weight, 1)}")
          note: Округление до одного знака вместо двух.
          expectMistake: digits
        - code: |
            price = 1300
            weight = float(input("Сколько килограммов? "))
            print("Стоимость: " + round(price * weight, 2))
          note: Строка склеивается с числом через +.
          expectMistake: concat-number
      mistakes:
        - id: int-fraction
          when:
            errorType: ValueError
          why: >-
            `int()` понимает только запись целого числа, а `"0.25"` — дробная запись. Поэтому
            превращение не удаётся и появляется ValueError.
          try: Для дробного веса используй `float(...)` вместо `int(...)`.
          verify: В «Примере 1» программа не должна падать.
        - id: no-round
          when:
            outputIncludes: "99999"
          why: >-
            Дробные числа хранятся с крошечной погрешностью, поэтому `1300 * 0.7` даёт
            `909.9999999999999`. Условие просит округлить до двух знаков.
          try: Оберни расчёт в `round(…, 2)`.
          verify: В «Примере 2» должно получиться 910.0.
        - id: whole-number
          when:
            outputEquals: "Стоимость: 325"
          why: >-
            Стоимость получилась целой, без дробной части. Так бывает, если вызвать `round(x)` без
            второго числа — он округляет до целого — или превратить результат в `int`.
          try: 'Округли через `round(…, 2)`: второе число говорит, сколько знаков оставить после точки.'
          verify: 'В «Примере 1» должно быть «Стоимость: 325.0».'
        - id: digits
          when:
            failedTest: t5
            outputIncludes: "Стоимость: 433.3"
          why: >-
            Округление есть, но знаков после точки не два. Второе число в `round` говорит, сколько
            знаков оставить: `round(x, 1)` оставляет один, `round(x, 3)` — три.
          try: 'Поставь вторым числом в `round` двойку: `round(…, 2)`. Для веса `0.33333` должно получиться `433.33`.'
        - id: concat-number
          when:
            errorIncludes: can only concatenate
          why: Знак `+` склеивает строку только со строкой, а `round(...)` возвращает число.
          try: 'Подставь число через f-строку: `f"Стоимость: {…}"`.'
          verify: Ошибка TypeError должна исчезнуть.
      afterPass: >-
        Программа принимает и целый, и дробный вес, а лишние цифры погрешности не попадают на
        экран. Попробуй запустить её с вводом `0,5` — через запятую — и увидишь ValueError из
        теории.
      skills: [type-conversion, numbers-arithmetic]

  - id: practice-split
    type: exercise
    title: Практика 4
    exercise:
      id: m1-l5-e4
      kind: write
      title: Делим счёт
      statement: |-
        Друзья делят счёт поровну. Программа читает сумму счёта и число людей — оба целые — и
        печатает, сколько платит каждый и сколько остаётся нераспределённым. Доля каждого — целая
        часть от деления: дробную часть отбрасываем, а не округляем.

        Для счёта 1000 на троих вывод такой:

        ```text
        Каждому: 333
        Остаток: 1
        ```
      input: Две строки — сумма счёта и число людей, целые числа; людей не меньше одного.
      output: "Две строки: `Каждому: <целая часть>` и `Остаток: <остаток>`."
      constraints:
        - Число людей не меньше 1.
      starterCode: |
        # Прочитай сумму счёта и число людей
        # Выведи, сколько платит каждый и сколько остаётся

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "1000\n3\n"
          expected: |-
            Каждому: 333
            Остаток: 1
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "1500\n3\n"
          expected: |-
            Каждому: 500
            Остаток: 0
        - id: t3
          kind: io
          title: Пример 3
          example: true
          stdin: "100\n7\n"
          expected: |-
            Каждому: 14
            Остаток: 2
        - id: t4
          kind: io
          title: "Граничный случай: один человек"
          edge: true
          stdin: "900\n1\n"
          expected: |-
            Каждому: 900
            Остаток: 0
        - id: t5
          kind: io
          title: "Граничный случай: сумма меньше числа людей"
          edge: true
          stdin: "5\n10\n"
          expected: |-
            Каждому: 0
            Остаток: 5
        - id: t6
          kind: io
          title: "Граничный случай: дробная часть больше половины"
          edge: true
          stdin: "200\n3\n"
          expected: |-
            Каждому: 66
            Остаток: 2
      criteria:
        - Оба значения превращаются в целые числа.
        - Доля каждого — целая часть от деления, остаток — то, что не делится поровну.
        - Выводятся две строки в формате из условия.
      hints:
        - >-
          Нужны две операции деления из урока про числа: одна даёт целую часть, другая — остаток.
          И помни, какого типа значения приходят из `input()`.
        - >-
          На другом примере: 17 конфет на 5 детей — `17 // 5` даёт 3 (каждому), а `17 % 5` даёт
          2 (осталось). Обычное `17 / 5` дало бы 3.4.
        - |-
          Каркас:
          ```text
          total = int(input(...))
          people = int(input(...))
          print(f"Каждому: {…}")   # целая часть от деления
          print(f"Остаток: {…}")   # остаток от деления
          ```
      solution:
        code: |
          total = int(input("Сумма счёта: "))
          people = int(input("Сколько человек: "))
          print(f"Каждому: {total // people}")
          print(f"Остаток: {total % people}")
        explanation: >-
          `//` отбрасывает дробную часть результата деления, `%` даёт остаток. Остаток можно
          посчитать и так: `total - total // people * people` — получится то же самое.
      wrongSolutions:
        - code: |
            total = int(input("Сумма счёта: "))
            people = int(input("Сколько человек: "))
            print(f"Каждому: {total / people}")
            print(f"Остаток: {total % people}")
          note: Обычное деление / вместо //.
          expectMistake: slash
        - code: |
            total = input("Сумма счёта: ")
            people = input("Сколько человек: ")
            print(f"Каждому: {total // people}")
            print(f"Остаток: {total % people}")
          note: Нет int(), деление строк.
          expectMistake: no-int
        - code: |
            people = int(input("Сколько человек: "))
            total = int(input("Сумма счёта: "))
            print(f"Каждому: {total // people}")
            print(f"Остаток: {total % people}")
          note: Ответы читаются в обратном порядке.
          expectMistake: swapped
        - code: |
            total = int(input("Сумма счёта: "))
            people = int(input("Сколько человек: "))
            print(f"Каждому: {total // people}")
          note: Нет строки с остатком.
          expectMistake: missing-rest
        - code: |
            total = int(input("Сумма счёта: "))
            people = int(input("Сколько человек: "))
            print(f"Каждому: {round(total / people)}")
            print(f"Остаток: {total % people}")
          note: round округляет до ближайшего целого, а нужна целая часть — 200 на троих даёт 67 вместо 66.
          expectMistake: rounded
      mistakes:
        - id: no-int
          when:
            errorType: TypeError
            errorIncludes: unsupported operand
          why: >-
            Хотя бы одно значение из `input()` осталось строкой, а делить строки Python не умеет —
            отсюда TypeError.
          try: Преврати оба ответа в целые числа через `int(...)`.
          verify: Ошибка TypeError должна исчезнуть.
        - id: rounded
          when:
            codeIncludes: round(
          why: >-
            `round` округляет до ближайшего целого: `200 / 3` — это `66.66…`, и `round` даёт 67. А
            доля каждого — целая часть от деления, 66: дробную часть нужно отбросить, а не
            округлить.
          try: Посчитай долю через `//` — деление, которое отбрасывает дробную часть.
        - id: slash
          when:
            codeRegex: '(?<!/)/(?!/)'
            outputIncludes: "."
          why: >-
            Обычное деление `/` всегда даёт дробное число: `1000 / 3` — это `333.3333333333333`.
            А нужна целая часть.
          try: Замени `/` на `//` — деление с отбрасыванием дробной части.
          verify: 'В «Примере 1» должно получиться «Каждому: 333».'
        - id: swapped
          when:
            outputEquals: |-
              Каждому: 0
              Остаток: 3
          why: >-
            Сумма и число людей поменялись местами: первой строкой ввода идёт сумма счёта, а
            первый `input()` получил её как число людей.
          try: Сначала прочитай сумму счёта, потом — число людей.
          verify: 'В «Примере 1» должно получиться «Каждому: 333».'
        - id: missing-rest
          when:
            outputEquals: "Каждому: 333"
          why: Первая строка верная, но строки с остатком нет.
          try: Добавь второй `print` с остатком от деления — операция `%`.
          verify: 'В «Примере 1» второй строкой должно быть «Остаток: 1».'
      afterPass: >-
        Счёт делится честно: каждому целая часть, остаток виден отдельно. Одно улучшение на
        будущее: когда появятся условия, программа сможет сама решить, кто доплачивает остаток.
      skills: [type-conversion, numbers-arithmetic, input-read]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`int()` превращает строку в целое число, `float()` — в дробное, `str()` — число в строку."
      - "Из `input()` приходит строка, поэтому для расчётов её сразу превращают: `int(input())`."
      - "ValueError — строку не удалось превратить в число: буквы, дробь в `int()`, запятая вместо точки, пустая строка."
      - "TypeError — строка и число смешались в одном выражении; выручит f-строка или `str()`. Для вывода дробей — `round(x, 2)`."
    question: Почему `int("3.5")` останавливает программу с ValueError, а `float("3.5")` работает?
    answer: >-
      `int()` понимает только запись целого числа — цифры без точки. `"3.5"` — запись дробного
      числа, и её умеет читать `float()`. Поэтому для дробного ввода нужен `float()`, а для целого
      подходит `int()`.
