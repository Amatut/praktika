id: m1-l6
module: m1
number: "1.6"
title: "Самостоятельная работа: калькулятор заказа"
objective: >-
  Самостоятельно написать программу, которая читает данные заказа, превращает их в числа,
  считает итог и печатает чек в заданном формате.
minutes: [20, 30]
prerequisites: [m1-l5]
skills: [task-decomposition, type-conversion, input-read, f-strings]
environment: python

story:
  title: Лишний ноль в чеке
  fictional: true
  text: >-
    По субботам кофейня «Утро» собирает заказы для офиса по соседству: менеджер Артём присылает,
    что и сколько нужно, а Лена считает сумму на калькуляторе и переписывает всё в чек. Однажды,
    переписывая итог с калькулятора, она приписала к нему лишний ноль, и чек вышел в десять раз
    больше заказа. Хозяйка попросила программу: вводишь название, цену и количество — и строки
    чека готовы без ручного пересчёта и переписывания. Сегодня ты напишешь её сам, от пустого
    файла до зелёной проверки.

why: >-
  Самостоятельная работа показывает, что получается уже без подсказок: получить данные,
  превратить их в числа, посчитать и аккуратно вывести. По той же схеме работают кассовые
  программы и калькуляторы стоимости доставки.

usedIn: >-
  Схема «ввод → превращение → расчёт → вывод» лежит в основе касс, калькуляторов стоимости, форм
  заказа в интернет-магазинах и множества небольших консольных утилит.

steps:
  - id: reminder
    type: theory
    title: Перед стартом
    body: |-
      Сегодня самостоятельная работа: программу ты пишешь с нуля, а подсказки в главном задании
      откроются только после первой проверки. Это не запрет на помощь — просто сначала
      попробуй сам.

      Всё нужное ты уже знаешь:

      - `x = input()` читает одну строку ввода. Строки приходят по порядку, и каждая из них —
        текст.
      - `int(...)` превращает текст в целое число, `float(...)` — в дробное. Если в тексте не
        число, будет ValueError.
      - Арифметика: `+`, `-`, `*`, `/`, `//`, `%`. Строку `*` повторяет, а число — умножает,
        поэтому числа из ввода сначала превращают.
      - f-строка собирает сообщение: `f"Итого: {total}"`. Числа в фигурных скобках превращать в
        строку не нужно.
      - `round(x, 2)` округляет дробное число до двух знаков после точки.

      Как работать над заданием:

      1. Прочитай условие и примеры: что приходит на вход и что должно получиться.
      2. Разложи решение на шаги: получить → превратить → посчитать → вывести.
      3. Перед «Проверить» нажми «Запустить»: поле «Ввод для „Запустить“» под кнопками уже
         заполнено вводом из первого примера (поле свёрнуто — нажми на заголовок, чтобы
         раскрыть). Сравни вывод с ожидаемым посимвольно.
    coach: >-
      Ошибиться на первой попытке — нормально. Самостоятельная работа нужна, чтобы увидеть, что
      уже получается само, а что стоит повторить.

  - id: warmup
    type: predict
    title: Разминка
    prompt: >-
      Программа считает места в зале: сколько рядов и сколько мест в каждом ряду. Во вводе две
      строки: `4` и `3`. Как думаешь, что она напечатает?
    code: |-
      rows = int(input())
      seats = input()
      print(rows * seats)
    stdin: "4\n3\n"
    options:
      - "12"
      - "3333"
      - Ошибка TypeError
    answer: "3333"
    explanation: >-
      `rows` превратили в число 4, а `seats` осталась строкой `"3"`. Строка, умноженная на число,
      повторяется — отсюда `3333`. Для Python это не ошибка, поэтому программа молча печатает
      неверный результат. Чтобы получить 12, превращать нужно оба значения.

  - id: plan
    type: order
    title: "План: поездка на такси"
    prompt: >-
      Прежде чем писать код, полезно разложить задачу на шаги. Потренируйся на другой задаче.
      Программа считает стоимость поездки на такси: посадка стоит 100, каждый километр — 30, а
      расстояние в километрах (целое число) приходит во вводе. Расставь действия программы по
      порядку.
    items:
      - id: read
        text: Прочитать строку ввода с расстоянием
      - id: convert
        text: Превратить расстояние в целое число
      - id: km
        text: Посчитать стоимость километров — расстояние умножить на 30
      - id: fee
        text: Прибавить к стоимости километров посадку — 100
      - id: show
        text: Вывести стоимость поездки
    explanation: >-
      Превратить в число можно только то, что уже прочитано. Считать можно, только когда
      расстояние стало числом, — иначе `*` повторит строку. Посадку прибавляют к готовой
      стоимости километров, а печатают результат в самом конце, когда он посчитан.
    coach: >-
      Перед самостоятельной работой разложи её на шаги так же: что приходит на вход, что нужно
      превратить в числа, что посчитать и что вывести.

  - id: main-task
    type: exercise
    title: Самостоятельная работа
    exercise:
      id: m1-l6-e1
      kind: write
      title: Калькулятор заказа
      statement: |-
        Напиши программу для кассы. Она читает три строки: название товара, цену за одну штуку и
        количество. Цена и количество — целые числа. Программа печатает две строки чека:

        ```text
        Заказ: Капучино, 2 шт.
        Итого: 300
        ```

        В первой строке — название и количество, во второй — цена, умноженная на количество.
      input: >-
        Три строки: название (текст), цена за штуку (целое число), количество (целое число, 0 или
        больше).
      output: "Две строки: `Заказ: <название>, <количество> шт.` и `Итого: <цена × количество>`."
      constraints:
        - Подсказки откроются после первой проверки — сначала попробуй сам.
        - Текст подсказок в `input()` может быть любым.
      starterCode: |
        # Калькулятор заказа
        # Ввод: название, цена, количество (каждое — на своей строке)

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "Капучино\n150\n2\n"
          expected: |-
            Заказ: Капучино, 2 шт.
            Итого: 300
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "Круассан\n90\n3\n"
          expected: |-
            Заказ: Круассан, 3 шт.
            Итого: 270
        - id: t3
          kind: io
          title: Пример 3
          example: true
          stdin: "Какао с зефиром\n180\n1\n"
          expected: |-
            Заказ: Какао с зефиром, 1 шт.
            Итого: 180
        - id: t4
          kind: io
          title: "Граничный случай: количество 0"
          edge: true
          stdin: "Латте\n170\n0\n"
          expected: |-
            Заказ: Латте, 0 шт.
            Итого: 0
        - id: t5
          kind: io
          title: "Граничный случай: большой заказ"
          edge: true
          stdin: "Эспрессо\n120\n25\n"
          expected: |-
            Заказ: Эспрессо, 25 шт.
            Итого: 3000
        - id: t6
          kind: io
          title: "Граничный случай: пробелы вокруг чисел"
          edge: true
          stdin: "Чай\n 100 \n 4 \n"
          expected: |-
            Заказ: Чай, 4 шт.
            Итого: 400
          compare:
            ignoreSpaces: true
      criteria:
        - Строки ввода читаются по порядку — название, цена, количество.
        - Цена и количество превращаются в целые числа, итог — их произведение.
        - "Вывод — две строки точно в формате примера: запятая после названия, «шт.» с точкой."
        - Количество 0 и пробелы вокруг чисел не ломают программу.
      hints:
        - >-
          Разложи задачу на шаги, как в плане поездки на такси. Какие строки приходят на вход и в
          каком порядке? Какие из них нужны как числа, а какая остаётся текстом?
        - >-
          Похожий приём на другом примере: `w = int(input())` и `h = int(input())` читают две
          стороны прямоугольника, а `print(f"Площадь: {w * h}")` печатает результат.
        - |-
          Каркас:
          ```text
          name = input(...)
          price = int(input(...))
          count = …
          total = …
          print(f"Заказ: {…}, {…} шт.")
          print(f"Итого: {…}")
          ```
      solution:
        code: |
          name = input("Название: ")
          price = int(input("Цена: "))
          count = int(input("Количество: "))
          total = price * count
          print(f"Заказ: {name}, {count} шт.")
          print(f"Итого: {total}")
        explanation: >-
          Название остаётся текстом, а цену и количество `int()` превращает в числа — иначе `*`
          повторил бы строку. Итог сохраняется в переменную `total`, а f-строки собирают строки
          чека в нужном формате. Можно считать итог и прямо в фигурных скобках:
          `{price * count}`.
      wrongSolutions:
        - code: |
            name = input("Название: ")
            price = input("Цена: ")
            count = input("Количество: ")
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {price * count}")
          note: Нет int(), строка умножается на строку.
          expectMistake: forgot-int
        - code: |
            name = input("Название: ")
            price = input("Цена: ")
            count = int(input("Количество: "))
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {price * count}")
          note: Цена осталась строкой и повторилась.
          expectMistake: repeated-price
        - code: |
            name = input("Название: ")
            price = int(input("Цена: "))
            count = input("Количество: ")
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {price * count}")
          note: Количество осталось строкой и повторилось 150 раз.
          expectMistake: repeated-count
        - code: |
            price = int(input("Цена: "))
            name = input("Название: ")
            count = int(input("Количество: "))
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {price * count}")
          note: Цена читается первой, и в int() попадает название.
          expectMistake: text-to-int
        - code: |
            name = input("Название: ")
            price = int(input("Цена: "))
            count = int(input("Количество: "))
            total = price * count
            print(f"Заказ: {name}, {count} шт.")
            print("Итого: " + total)
          note: Текст склеивается с числом через +.
          expectMistake: concat-number
        - code: |
            name = input("Название: ")
            count = int(input("Количество: "))
            price = int(input("Цена: "))
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {price * count}")
          note: Цена и количество читаются в обратном порядке.
          expectMistake: swapped
        - code: |
            name = input("Название: ")
            price = int(input("Цена: "))
            count = int(input("Количество: "))
            print(f"Заказ: {name} {count} шт")
            print(f"Итого: {price * count}")
          note: Нет запятой и точки в строке заказа.
          expectMistake: format
        - code: |
            name = input("Название: ")
            price = float(input("Цена: "))
            count = int(input("Количество: "))
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {price * count}")
          note: Цена прочитана через float(), итог выводится как 300.0.
          expectMistake: float-number
        - code: |
            name = input("Название: ")
            price = input("Цена: ")
            count = input("Количество: ")
            print(f"Заказ: {name}, {count} шт.")
            print("Итого: " + price + count)
          note: Числа не превращены и не перемножены — строки склеились в 1502.
          expectMistake: glued
        - code: |
            name = input("Название: ")
            price = int(input("Цена: "))
            count = int(input("Количество: "))
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {price + count}")
          note: Сложение вместо умножения.
          expectMistake: plus-instead
        - code: |
            name = input("Название: ")
            price = int(input("Цена: "))
            count = int(input("Количество: "))
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {price} * {count}")
          note: Знак умножения оказался в тексте, за фигурными скобками.
          expectMistake: math-in-text
        - code: |
            name = input("Название: ")
            price = int(input("Цена: "))
            count = int(input("Количество: "))
            print(f"Заказ: {name}, {price} шт.")
            print(f"Итого: {price * count}")
          note: В строку заказа подставлена цена вместо количества.
          expectMistake: swapped
      mistakes:
        - id: forgot-int
          when:
            errorIncludes: can't multiply sequence
          where: Строка, где цена умножается на количество
          why: >-
            И цена, и количество остались строками — так их вернул `input()`. Умножить строку на
            строку Python не может, поэтому появилась ошибка TypeError.
          try: Преврати цену и количество в целые числа через `int(...)` сразу при вводе.
          verify: 'В «Примере 1» должно получиться «Итого: 300».'
        - id: text-to-int
          when:
            errorType: ValueError
          why: >-
            В `int()` попал текст, который не является числом, — скорее всего, название товара.
            Значит, строки ввода читаются не в том порядке или в `int()` обёрнуто не то значение.
          try: Проверь порядок `input()` — название, цена, количество — и превращай в числа только цену и количество.
          verify: В «Примере 1» программа не должна падать.
        - id: repeated-price
          when:
            outputIncludes: "150150"
          why: >-
            Цена осталась строкой `"150"`, и `*` повторил её дважды вместо умножения — как в
            разминке.
          try: Преврати цену в число через `int(...)`.
          verify: 'В «Примере 1» должно получиться «Итого: 300».'
        - id: repeated-count
          when:
            outputIncludes: "2222222222"
          why: >-
            Количество осталось строкой `"2"`, и `*` повторил её столько раз, сколько стоит
            товар, — в «Примере 1» это 150 двоек подряд вместо умножения.
          try: Преврати количество в число через `int(...)`.
          verify: 'В «Примере 1» должно получиться «Итого: 300».'
        - id: glued
          when:
            outputIncludes: "Итого: 1502"
          why: >-
            В итоге цена и количество склеились: `"150" + "2"` — это `1502`. Они остались строками,
            а для строк `+` означает склейку. К тому же итог — это произведение, а не сумма.
          try: >-
            Преврати цену и количество в числа через `int(...)`, перемножь их и подставь результат
            в f-строку: `f"Итого: {…}"`.
          verify: 'В «Примере 1» должно получиться «Итого: 300».'
        - id: plus-instead
          when:
            outputIncludes: "Итого: 152\n"
          why: >-
            Цена и количество сложились: 150 + 2 = 152. А итог — это цена, умноженная на
            количество.
          try: Замени `+` на `*` в расчёте итога.
          verify: 'В «Примере 1» должно получиться «Итого: 300».'
        - id: math-in-text
          when:
            outputIncludes: "*"
          why: >-
            На экране знак `*`: умножение попало в текст f-строки, за фигурные скобки. Всё, что
            снаружи скобок, Python печатает как есть и не вычисляет.
          try: Помести всё выражение — цену, знак `*` и количество — внутрь одних фигурных скобок.
          verify: 'В «Примере 1» должно получиться «Итого: 300».'
        - id: swapped
          when:
            outputIncludes: "150 шт."
          why: >-
            В строке заказа вместо количества стоит цена. Так бывает, если цена и количество
            читаются не в том порядке — второй строкой ввода идёт цена, — или если в f-строку
            подставлена не та переменная. Итог при этом верный: от перестановки множителей
            произведение не меняется.
          try: >-
            Проверь порядок `input()`: сначала цена, потом количество. И проверь, что в строке
            заказа стоит переменная с количеством.
          verify: 'В «Примере 1» должно быть «Заказ: Капучино, 2 шт.».'
        - id: concat-number
          when:
            errorIncludes: can only concatenate
          why: >-
            Знак `+` склеивает строку только со строкой, а итог и количество — числа. Python не
            угадывает, что число нужно превратить в текст, и останавливается с TypeError.
          try: >-
            Подставь число через f-строку: `f"Итого: {…}"` — или преврати его в строку через
            `str(...)`.
          verify: 'Ошибка TypeError должна исчезнуть, а в «Примере 1» появится «Итого: 300».'
        - id: float-number
          when:
            codeIncludes: float(
            outputIncludes: ".0"
          why: >-
            `float()` сделал число дробным, поэтому на экране появилось `.0` — например,
            `Итого: 300.0`. В этой задаче цена и количество — целые числа.
          try: Читай цену и количество через `int(...)`.
          verify: 'В «Примере 1» должно быть «Итого: 300» без `.0`.'
        - id: format
          when:
            failedTest: t1
            outputIncludes: "Итого: 300\n"
          why: >-
            Строка «Итого: 300» уже верная, но вывод всё равно отличается от образца, а проверка
            сравнивает строки посимвольно.
          try: >-
            Сравни с образцом строку заказа: `Заказ: Капучино, 2 шт.` — запятая сразу после
            названия, пробел перед «шт.», точка в конце. Проверь и порядок: сначала строка заказа,
            потом итог, и лишних строк быть не должно.
          verify: Вывод «Примера 1» должен совпасть с образцом строка в строку.
      afterPass: >-
        Калькулятор готов, и написал ты его сам: ввод, превращение в числа, расчёт и чек. Одно
        улучшение на будущее: цены бывают с копейками — это следующее задание.
      skills: [task-decomposition, input-read, type-conversion, f-strings]
      noHintsBeforeAttempt: true

  - id: bonus-task
    type: exercise
    title: Усложнение
    exercise:
      id: m1-l6-e2
      kind: modify
      title: Цена с копейками
      statement: |-
        Кофейня начала продавать товары с ценой в копейках, например `89.9`. Доработай свой
        калькулятор заказа — скопируй его сюда из самостоятельной работы или начни заново. Цена
        теперь может быть дробной (через точку), а итог нужно округлить до двух знаков после точки
        через `round(…, 2)`. Количество по-прежнему целое. Формат тот же:

        ```text
        Заказ: Круассан, 3 шт.
        Итого: 269.7
        ```

        Итог теперь дробное число, поэтому и для целой цены Python покажет его с точкой: цена
        `150` и количество `2` дают `Итого: 300.0`.
      input: Три строки — название, цена (целая или дробная, через точку), количество (целое).
      output: "Две строки: `Заказ: <название>, <количество> шт.` и `Итого: <round(цена × количество, 2)>`."
      constraints:
        - Дробная часть цены отделяется точкой.
        - Количество — целое число.
      starterCode: |
        # Вставь сюда свой калькулятор заказа и доработай его:
        # цена может быть дробной, итог округляется до двух знаков после точки

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "Круассан\n89.9\n3\n"
          expected: |-
            Заказ: Круассан, 3 шт.
            Итого: 269.7
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "Капучино\n150\n2\n"
          expected: |-
            Заказ: Капучино, 2 шт.
            Итого: 300.0
        - id: t3
          kind: io
          title: "Обычный случай: цена с двумя знаками после точки"
          stdin: "Сок\n99.99\n2\n"
          expected: |-
            Заказ: Сок, 2 шт.
            Итого: 199.98
        - id: t4
          kind: io
          title: "Граничный случай: погрешность дробей"
          edge: true
          stdin: "Сахар\n0.1\n3\n"
          expected: |-
            Заказ: Сахар, 3 шт.
            Итого: 0.3
        - id: t5
          kind: io
          title: "Граничный случай: количество 0"
          edge: true
          stdin: "Чай\n120.5\n0\n"
          expected: |-
            Заказ: Чай, 0 шт.
            Итого: 0.0
      criteria:
        - Цена читается как дробное число, количество — как целое.
        - Итог округляется до двух знаков через `round`.
        - Формат двух строк — как в калькуляторе заказа.
      hints:
        - >-
          Что изменилось по сравнению с калькулятором? Подумай, какая функция превращения
          понимает запись `89.9`, а какая — нет.
        - >-
          На другом примере: `float("0.5") * 3` даёт `1.5`, а `round(0.1 * 3, 2)` убирает
          погрешность и даёт `0.3`.
        - |-
          Каркас:
          ```text
          name = input(...)
          price = float(input(...))
          count = int(input(...))
          total = round(…, 2)
          два print — как в калькуляторе
          ```
      solution:
        code: |
          name = input("Название: ")
          price = float(input("Цена: "))
          count = int(input("Количество: "))
          total = round(price * count, 2)
          print(f"Заказ: {name}, {count} шт.")
          print(f"Итого: {total}")
        explanation: >-
          `float()` понимает и `89.9`, и `150`. Количество остаётся целым через `int()`, чтобы в
          чеке было «3 шт.», а не «3.0 шт.». `round(…, 2)` убирает погрешность: `89.9 * 3` без
          округления даёт `269.70000000000005`.
      wrongSolutions:
        - code: |
            name = input("Название: ")
            price = int(input("Цена: "))
            count = int(input("Количество: "))
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {round(price * count, 2)}")
          note: Цена читается через int().
          expectMistake: int-price
        - code: |
            name = input("Название: ")
            price = float(input("Цена: "))
            count = int(input("Количество: "))
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {price * count}")
          note: Нет округления.
          expectMistake: no-round
        - code: |
            name = input("Название: ")
            price = float(input("Цена: "))
            count = float(input("Количество: "))
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {round(price * count, 2)}")
          note: Количество тоже через float().
          expectMistake: float-count
        - code: |
            price = float(input("Цена: "))
            name = input("Название: ")
            count = int(input("Количество: "))
            print(f"Заказ: {name}, {count} шт.")
            print(f"Итого: {round(price * count, 2)}")
          note: Цена читается первой, и в float() попадает название.
          expectMistake: text-to-number
      mistakes:
        - id: text-to-number
          when:
            errorIncludes: "'Круассан'"
          why: >-
            В превращение в число попало название товара «Круассан». Значит, строки ввода читаются
            не в том порядке: первой идёт название, потом цена, потом количество.
          try: Проверь порядок `input()` — название, цена, количество — и превращай в числа только цену и количество.
          verify: В «Примере 1» программа не должна падать.
        - id: int-price
          when:
            errorIncludes: "'89.9'"
          why: >-
            В `int()` попала цена `89.9`, а `int()` не понимает дробную запись, поэтому появляется
            ValueError. Цена теперь может быть дробной.
          try: >-
            Читай цену через `float(...)`, а через `int(...)` — только количество. Проверь и
            порядок: цена — вторая строка ввода, количество — третья.
          verify: В «Примере 1» программа не должна падать.
        - id: no-round
          when:
            outputIncludes: "00000"
          why: >-
            На экране длинный хвост цифр: дробные числа хранятся с погрешностью, и `89.9 * 3` даёт
            `269.70000000000005`.
          try: Округли итог через `round(…, 2)`.
          verify: 'В «Примере 1» должно быть «Итого: 269.7».'
        - id: float-count
          when:
            outputIncludes: ".0 шт."
          why: Количество стало дробным числом, поэтому в чеке «3.0 шт.». Штуки считают целыми.
          try: Читай количество через `int(...)`.
          verify: 'В «Примере 1» должно быть «Заказ: Круассан, 3 шт.».'
      afterPass: >-
        Калькулятор принимает и целые, и дробные цены. Попробуй запустить его с ценой через
        запятую — `89,9` — и посмотри на ValueError. Как защитить программу от такого ввода,
        разберём в следующих модулях.
      skills: [type-conversion, numbers-arithmetic, f-strings]

  - id: recap
    type: recap
    title: Итоги и что повторить
    points:
      - "Схема калькулятора: прочитать → превратить в числа → посчитать → вывести. Если оба задания получились без подсказок, эта схема уже твоя — можно переходить к модулю 2."
      - "Было `150150`, ValueError или TypeError — число осталось строкой, в `int()` попал текст или текст склеился с числом через `+`. Повтори урок 1.5 «Превращение типов»."
      - "Перепутались цена и количество — проверь порядок `input()`: строки ввода читаются сверху вниз. Повтори урок 1.4 «Ввод: программа слушает»."
      - "Не совпал формат — сравни свою строку с примером посимвольно: запятая, пробелы, «шт.» с точкой. Повтори f-строки в уроке 1.3."
    question: Почему в «Цене с копейками» цену читают через float(), а количество — через int()?
    answer: >-
      Цена может быть дробной, например 89.9, а `int()` такую запись не понимает и останавливает
      программу с ValueError. Количество штук всегда целое: если прочитать его через `float()`,
      в чеке появится «3.0 шт.».
