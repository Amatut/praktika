id: m1-l3
module: m1
number: "1.3"
title: "Строки: текст в программе"
objective: Собирать сообщения из текста и значений — склейкой, повтором, len() и f-строками — и понимать, почему строку нельзя сложить с числом.
minutes: [25, 30]
prerequisites: [m1-l2]
skills: [strings-basics, f-strings]
environment: python

story:
  title: Напоминания для учеников
  fictional: true
  text: >-
    Администратор танцевальной студии Оля каждый вечер писала тридцати ученикам напоминания
    вида «Катя, завтра занятие в 18:00». Текст был одинаковый, менялись только имя и время, но
    за час переписывания она всё равно путала то имя, то цифры. Коллега показал ей шаблон на
    Python: программа сама подставляет имя и время в готовую фразу. Оле осталось проверить
    список учеников, а сообщения собираются за секунды. Сегодня ты научишься собирать такие
    фразы из кусочков.

why: >-
  Текст есть почти в любой программе: сообщения, подписи, отчёты. Когда умеешь собирать
  строки из кусочков, один шаблон вроде `f"{name}, завтра занятие в {time}"` подходит для
  всех сообщений — меняются только имя и время.

usedIn: >-
  Уведомления в приложениях («Заказ № 1234 в пути»), письма с обращением по имени, подписи на
  графиках, чеки, ответы чат-ботов. f-строки — удобный и распространённый способ собирать
  такой текст в современном Python.

steps:
  - id: strings
    type: theory
    title: Строка — это тоже значение
    body: |-
      Текст в программе — такое же значение, как число. Он называется **строка** (тип `str`) и
      всегда стоит в кавычках. Строку можно положить в переменную: `name = "Аня"`.

      Кавычки решают, что перед тобой: `5` — число, с ним можно считать, а `"5"` — строка из
      одного символа, просто текст.

      Для строк есть три приёма:

      - **Склейка `+`** соединяет строки: `"кофе" + "машина"` → `кофемашина`. Пробел сам не
        появляется — его нужно дописать внутри кавычек: `"Привет, " + name`.
      - **Повтор `*`** повторяет строку нужное число раз: `"-" * 10` → `----------`. Удобно
        для линий и рамок.
      - **Длина `len(...)`** — сколько символов в строке. Считаются все символы, включая
        пробелы и знаки: `len("Привет, мир")` → `11`. `len`, как и `print`, — **функция**:
        команда с именем и скобками, в которые передают значение. `print` показывает его
        на экране, а `len` отдаёт число, которое можно вывести или использовать в
        вычислении.

      Один и тот же знак `+` у чисел складывает, а у строк склеивает: `2 + 2` → `4`, а
      `"2" + "2"` → `22`.

      ```python
      word = "ура"
      print(word + "!" * 3)   # ура!!!
      print(len(word))        # 3
      ```

      Во второй строке сначала выполняется повтор (`*` раньше `+`, как у чисел), а потом
      склейка.
    simpler: >-
      Строка — это текст в кавычках. `+` склеивает строки, `*` повторяет, `len` считает
      символы. Пробелы при склейке ставишь сам.
    coach: >-
      Если результат склейки выглядит слипшимся, проверь пробелы внутри кавычек — это самая
      частая мелочь в работе со строками.

  - id: first-strings
    type: example
    title: Приветствие с линией
    body: Запусти программу и посмотри, как длина приветствия задаёт длину линии.
    code: |-
      name = "Аня"
      greeting = "Привет, " + name + "!"
      print(greeting)
      print("=" * len(greeting))
      print("Символов:", len(greeting))
    notes:
      - line: 1
        text: Строка «Аня» лежит в переменной `name`.
      - line: 2
        text: Склейка из трёх частей. Пробел после запятой стоит внутри первых кавычек.
      - line: 3
        text: Выведется `Привет, Аня!`.
      - line: 4
        text: "`len(greeting)` — это 12, поэтому знак `=` повторится 12 раз: линия ровно под приветствием."
      - line: 5
        text: "`print` через запятую: текст и число."
    tryIt: Замени имя на своё и запусти снова — линия подстроится под новую длину сама.

  - id: predict-strings
    type: predict
    title: Числа в кавычках
    prompt: Как думаешь, что выведет программа?
    code: |-
      a = "12"
      b = "3"
      print(a + b)
      print(a * 2)
      print(len(a + b))
      print(len(""))
    options:
      - |-
        15
        24
        2
        0
      - |-
        123
        1212
        3
        0
      - |-
        123
        24
        3
        1
    answer: |-
      123
      1212
      3
      0
    explanation: >-
      `a` и `b` — строки: они в кавычках. Поэтому `+` их склеивает (`123`), `* 2` повторяет
      строку (`1212`), а в строке `123` три символа — `len` даёт `3`. Считать как с числами
      Python не стал. `""` — пустая строка: в ней нет ни одного символа, поэтому её длина 0.

  - id: practice-greeting
    type: exercise
    title: Практика 1
    exercise:
      id: m1-l3-e1
      kind: repeat
      title: Приветствие гостя
      statement: |-
        В переменной `name` лежит имя гостя. Допиши программу:

        1. склей через `+` приветствие `Привет, Марат!` из текста и переменной `name` и сохрани
           его в переменной `greeting` — имя возьми из `name`, а не пиши вручную;
        2. выведи `greeting`;
        3. под приветствием выведи линию из 14 дефисов — повтором строки через `*`.
      output: Две строки — приветствие и линия из дефисов.
      constraints:
        - Приветствие собери склейкой `+`, а линию — повтором `*`.
      starterCode: |
        name = "Марат"

      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: |-
            Привет, Марат!
            --------------
        - id: t2
          kind: assert
          title: Значение greeting
          code: assert greeting == "Привет, Марат!"
          message: В переменной `greeting` должно лежать приветствие «Привет, Марат!», склеенное из частей.
      rules:
        - id: techniques
          use: [Add, Mult]
          message: >-
            Собери приветствие через `+`, а линию — через повтор `*`. Так приветствие подойдёт
            для любого имени, а длину линии можно поменять одним числом.
        - id: use-name
          dependsOn:
            greeting: [name]
          message: >-
            Возьми имя из переменной `name`, а не пиши его в приветствии вручную: тогда тот же
            код поприветствует любого гостя.
      criteria:
        - "`greeting` склеивается из `\"Привет, \"`, `name` и `\"!\"`."
        - Выводятся две строки — приветствие и линия из 14 дефисов.
        - Линия получается повтором строки через `*`.
      hints:
        - >-
          Приветствие складывается из трёх частей: текст до имени, само имя и знак в конце.
          В какой из частей должен стоять пробел, чтобы слова не слиплись?
        - >-
          Приём на другом примере: `"Пока, " + "Оля" + "."` → `Пока, Оля.`, а `"=" * 5` →
          `=====`.
        - >-
          Каркас: `greeting = "Привет, " + ... + ...`, затем `print(greeting)` и
          `print("-" * ...)`.
      solution:
        code: |
          name = "Марат"
          greeting = "Привет, " + name + "!"
          print(greeting)
          print("-" * 14)
        explanation: >-
          Пробел стоит внутри первых кавычек — `+` сам его не добавляет. `"-" * 14` повторяет
          дефис 14 раз: ровно столько символов в приветствии «Привет, Марат!».
      altSolutions:
        - code: |
            name = "Марат"
            greeting = "Привет, " + name + "!"
            print(greeting + "\n" + "-" * 14)
          note: Обе строки выводятся одним print через перевод строки.
        - code: |
            name = "Марат"
            greeting = "Привет, "
            greeting = greeting + name + "!"
            line = "-" * len(greeting)
            print(greeting)
            print(line)
          note: Приветствие собирается в два шага, длина линии считается через len.
      wrongSolutions:
        - code: |
            name = "Марат"
            greeting = "Привет," + name + "!"
            print(greeting)
            print("-" * 14)
          note: Нет пробела после запятой.
          expectMistake: no-space
        - code: |
            name = "Марат"
            greeting = "Привет, " + "name" + "!"
            print(greeting)
            print("-" * 14)
          note: Имя переменной в кавычках.
          expectMistake: name-in-quotes
        - code: |
            name = "Марат"
            greeting = "Привет, Марат!"
            print(greeting)
            print("--------------")
          note: Всё записано готовым текстом.
          expectMistake: ready-text
        - code: |
            name = "Марат"
            greeting = "Привет, " + "Марат" + "!"
            print(greeting)
            print("-" * 14)
          note: Имя вписано вручную, а не взято из name.
          expectMistake: name-typed
      mistakes:
        - id: no-space
          when:
            outputIncludes: "Привет,Марат"
          why: >-
            Слова слиплись: `+` соединяет строки вплотную и пробел сам не добавляет.
          try: 'Допиши пробел внутри первых кавычек: `"Привет, "`.'
        - id: name-in-quotes
          when:
            outputIncludes: name
          why: >-
            `name` стоит в кавычках, поэтому в приветствие попало слово name, а не значение
            переменной.
          try: Убери кавычки вокруг `name` — имя переменной пишется без них.
        - id: ready-text
          when:
            failedRule: techniques
            codeIncludes: Привет, Марат
          why: >-
            Приветствие записано готовым текстом, а не собрано из частей. Для другого гостя
            его придётся переписывать.
          try: Склей приветствие из частей через `+`, а линию сделай повтором `"-" * 14`.
          verify: Нажми «Проверить» — требование к коду должно отметиться как выполненное.
        - id: name-typed
          when:
            failedRule: use-name
            codeRegex: '\+\s*["'']Марат["'']'
          why: >-
            Имя «Марат» вписано в приветствие вручную, хотя оно уже лежит в переменной `name`.
            Для другого гостя пришлось бы переписывать строку.
          try: Замени `"Марат"` в склейке на имя переменной `name` — без кавычек.
          verify: Нажми «Проверить» — требование к коду должно отметиться как выполненное.
      afterPass: >-
        Приветствие собирается из частей и подойдёт любому гостю. Одно улучшение: вместо 14
        напиши `len(greeting)` — тогда линия подстроится под длину любого имени.
      skills: [strings-basics]

  - id: f-strings
    type: theory
    title: f-строки и почему строку нельзя сложить с числом
    body: |-
      Склеивать длинные фразы через `+` неудобно: легко забыть пробел. Для этого есть
      **f-строки** — строки-шаблоны. Перед открывающей кавычкой ставится буква `f`, а в
      фигурных скобках `{}` пишется имя переменной или выражение. Python подставит туда
      значение:

      ```python
      item = "латте"
      price = 210
      print(f"{item}: {price} руб.")        # латте: 210 руб.
      print(f"Два стакана: {price * 2}")   # Два стакана: 420
      ```

      В фигурных скобках могут стоять строки, числа, вычисления и `len(...)` — f-строка сама
      превратит результат в текст.

      Без буквы `f` фигурные скобки останутся обычными символами: `print("{item}")` выведет
      `{item}`, а не значение переменной.

      **Почему `"2" + 2` — ошибка.** У чисел `+` складывает, а у строк склеивает. Когда слева
      строка, а справа число, Python не угадывает, что ты имел в виду, и останавливается с
      ошибкой `TypeError` — «несовместимые типы»:

      ```text
      TypeError: can only concatenate str (not "int") to str
      ```

      Чтобы вывести текст вместе с числом, используй f-строку или `print` через запятую. Как
      превращать строку в число и число в строку, разберём в уроке 1.5.
    simpler: >-
      f-строка — это шаблон: `f"Итого: {total}"`. Буква `f` перед кавычкой включает подстановку,
      а в `{}` пишешь, что подставить. Строку и число через `+` склеить нельзя — Python выдаст
      `TypeError`.
    coach: >-
      Забыть букву `f` — очень частая ошибка. Если на экране появились фигурные скобки, первым
      делом проверь начало строки.

  - id: predict-fstring
    type: predict
    title: С буквой f и без неё
    prompt: Как думаешь, что выведет программа?
    code: |-
      drink = "чай"
      cups = 2
      print(f"{drink} x{cups}")
      print("{drink} x{cups}")
    options:
      - |-
        чай x2
        чай x2
      - |-
        чай x2
        {drink} x{cups}
      - |-
        {drink} x{cups}
        чай x2
    answer: |-
      чай x2
      {drink} x{cups}
    explanation: >-
      В первой строке перед кавычкой стоит `f`, поэтому Python подставил значения переменных.
      Во второй буквы `f` нет — фигурные скобки напечатались как обычный текст.

  - id: practice-notification
    type: exercise
    title: Практика 2
    exercise:
      id: m1-l3-e2
      kind: modify
      title: Уведомление о заказе
      statement: |-
        Программа печатает уведомление для гостя кофейни. Хозяйка просит добавить вторую строку —
        с номером заказа, количеством и суммой:

        ```text
        Лена, ваш латте готов!
        Заказ № 17: 2 шт., к оплате 420 руб.
        ```

        Добавь переменные `order_number` (17), `cups` (2) и `cup_price` (210) и выведи вторую
        строку f-строкой. Сумму посчитай из `cups` и `cup_price` — прямо в фигурных скобках
        или в отдельной переменной.
      output: Две строки — готовность заказа и строка с номером, количеством и суммой.
      constraints:
        - Вторую строку собери f-строкой.
        - Сумму не пиши готовым числом — посчитай её из `cups` и `cup_price`.
      starterCode: |
        name = "Лена"
        drink = "латте"
        print(f"{name}, ваш {drink} готов!")
      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: |-
            Лена, ваш латте готов!
            Заказ № 17: 2 шт., к оплате 420 руб.
          compare:
            ignoreSpaces: true
        - id: t2
          kind: assert
          title: Переменные заказа
          code: |-
            assert order_number == 17
            assert cups == 2
            assert cup_price == 210
          message: Нужны переменные `order_number` = 17, `cups` = 2 и `cup_price` = 210.
      rules:
        - id: fstring-sum
          min:
            JoinedStr: 2
          dependsOn:
            print: [order_number, cups, cup_price]
          message: >-
            Выведи вторую строку f-строкой, а сумму посчитай из `cups` и `cup_price` — в
            фигурных скобках или в отдельной переменной. Тогда уведомление само подстроится
            под любой заказ.
      criteria:
        - Выводятся две строки, как в образце.
        - Есть переменные `order_number`, `cups` и `cup_price` с нужными значениями.
        - Вторая строка собрана f-строкой, сумма считается из `cups` и `cup_price`.
      hints:
        - >-
          Какие части второй строки меняются от заказа к заказу? Именно они должны стоять в
          фигурных скобках.
        - >-
          Приём на другом примере: при `tickets = 3` и `ticket_price = 250` строка
          `f"Билетов: {tickets}, всего {tickets * ticket_price} руб."` выведет
          `Билетов: 3, всего 750 руб.`.
        - >-
          Каркас: три строки с новыми переменными, затем
          `print(f"Заказ № {...}: {...} шт., к оплате {... * ...} руб.")`.
      solution:
        code: |
          name = "Лена"
          drink = "латте"
          order_number = 17
          cups = 2
          cup_price = 210
          print(f"{name}, ваш {drink} готов!")
          print(f"Заказ № {order_number}: {cups} шт., к оплате {cups * cup_price} руб.")
        explanation: >-
          В f-строке три подстановки: номер заказа, количество и выражение
          `cups * cup_price` — Python сначала посчитает 2 · 210 = 420, а потом вставит результат
          в текст. Если заказ изменится, достаточно поменять переменные.
      altSolutions:
        - code: |
            name = "Лена"
            drink = "латте"
            order_number = 17
            cups = 2
            cup_price = 210
            total = cups * cup_price
            print(f"{name}, ваш {drink} готов!")
            print(f"Заказ № {order_number}: {cups} шт., к оплате {total} руб.")
          note: Сумма посчитана заранее в отдельной переменной.
      wrongSolutions:
        - code: |
            name = "Лена"
            drink = "латте"
            order_number = 17
            cups = 2
            cup_price = 210
            print(f"{name}, ваш {drink} готов!")
            print("Заказ № {order_number}: {cups} шт., к оплате {cups * cup_price} руб.")
          note: Во второй строке забыта буква f.
          expectMistake: no-f
        - code: |
            name = "Лена"
            drink = "латте"
            order_number = 17
            cups = 2
            cup_price = 210
            print(f"{name}, ваш {drink} готов!")
            print(f"Заказ № {order_number}: {cups} шт., к оплате cups * cup_price руб.")
          note: Вычисление вне фигурных скобок.
          expectMistake: outside-braces
        - code: |
            name = "Лена"
            drink = "латте"
            order_number = 17
            cups = 2
            cup_price = 210
            print(f"{name}, ваш {drink} готов!")
            print(f"Заказ № {order_number}: {cups} шт., к оплате 420 руб.")
          note: Сумма записана готовой.
          expectMistake: ready-sum
        - code: |
            name = "Лена"
            drink = "латте"
            order_number = 17
            cups = 2
            cup_price = 210
            print(f"{name}, ваш {drink} готов!")
            print("Заказ № " + order_number + ": " + cups + " шт.")
          note: Склейка строки с числом через +.
          expectMistake: str-plus-int
      mistakes:
        - id: str-plus-int
          when:
            errorType: TypeError
            errorIncludes: concatenate
          why: >-
            Номер заказа и количество — числа, а `+` склеивает строку только со строкой.
          try: Собери вторую строку f-строкой — она сама превратит числа в текст.
        - id: no-f
          when:
            outputIncludes: "{"
          why: Перед кавычкой второй строки нет буквы `f`, поэтому фигурные скобки напечатались как текст.
          try: Поставь `f` вплотную перед открывающей кавычкой.
        - id: outside-braces
          when:
            outputIncludes: cup_price
          why: >-
            Выражение стоит в f-строке вне фигурных скобок, поэтому напечаталось как текст.
            Считается только то, что внутри `{}`.
          try: Возьми `cups * cup_price` в фигурные скобки.
        - id: ready-sum
          when:
            failedRule: fstring-sum
            codeIncludes: "420"
          why: >-
            Сумма 420 записана готовой. Если гость возьмёт три стакана, уведомление покажет
            неверную сумму.
          try: >-
            Пусть сумму считает Python: поставь в строку `{cups * cup_price}` вместо 420 или
            посчитай её заранее — `total = cups * cup_price`.
          verify: Нажми «Проверить» — требование к коду должно отметиться как выполненное.
      afterPass: >-
        Уведомление собирается из шаблона: поменяй `cups` на 3 — и сумма во второй строке
        пересчитается сама. Считать заказ вручную больше не нужно.
      skills: [f-strings, variables]

  - id: practice-price-tag
    type: exercise
    title: Практика 3
    exercise:
      id: m1-l3-e3
      kind: fix
      title: Ценник, который не печатается
      statement: |-
        Программа должна вывести строку для ценника `Капучино: 180 руб.`, но останавливается с
        ошибкой `TypeError`. Найди причину и исправь программу. Подойдёт любой способ из урока.
      output: "Одна строка: `Капучино: 180 руб.`"
      constraints:
        - Название и цену бери из переменных `item` и `price`.
      starterCode: |
        item = "Капучино"
        price = 180
        print(item + ": " + price + " руб.")
      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: "Капучино: 180 руб."
          compare:
            ignoreSpaces: true
        - id: t2
          kind: assert
          title: Цена осталась числом
          code: assert price == 180
          message: В `price` должно остаться число 180, а не текст — с ценой ещё считать.
      rules:
        - id: use-variables
          dependsOn:
            print: [item, price]
          message: >-
            Выведи значения переменных `item` и `price`, а не готовый текст: ценник должен
            меняться вместе с ними.
      criteria:
        - Программа работает без ошибки и выводит «Капучино» и цену 180 в одной строке, как в образце.
        - Название и цена берутся из переменных `item` и `price`.
        - В `price` по-прежнему лежит число 180, а не текст.
      hints:
        - >-
          Прочитай последнюю строку сообщения об ошибке: что именно Python не может склеить?
          Какого типа значение лежит в `price`?
        - >-
          Похожий случай: если `age = 7`, то `print("Возраст: " + age)` падает с той же
          ошибкой, а `print(f"Возраст: {age}")` и `print("Возраст:", age)` работают.
        - >-
          Каркас с f-строкой: `print(f"{...}: {...} руб.")` — в фигурные скобки поставь имена
          переменных.
      solution:
        code: |
          item = "Капучино"
          price = 180
          print(f"{item}: {price} руб.")
        explanation: >-
          `price` — число, а `+` склеивает строку только со строкой, отсюда `TypeError`.
          f-строка сама превращает число в текст. Подойдёт и `print(item + ":", price, "руб.")`:
          `print` через запятую тоже принимает числа.
      altSolutions:
        - code: |
            item = "Капучино"
            price = 180
            print(item + ":", price, "руб.")
          note: Значения переданы в print через запятую.
        - code: |
            item = "Капучино"
            price = 180
            print(item + ": " + str(price) + " руб.")
          note: Число превращено в текст через str.
        - code: |
            item = "Капучино"
            price = 180
            tag = f"{item}: {price} руб."
            print(tag)
          note: Строка ценника собрана заранее в переменной.
      wrongSolutions:
        - code: |
            item = "Капучино"
            price = 180
            print(item + ": " + price + " руб.")
          note: Код не изменён.
          expectMistake: str-plus-int
        - code: |
            item = "Капучино"
            price = 180
            print("{item}: {price} руб.")
          note: Забыта буква f.
          expectMistake: no-f
        - code: |
            item = "Капучино"
            price = "180"
            print(item + ": " + price + " руб.")
          note: Цена превращена в текст кавычками.
          expectMistake: price-as-text
        - code: |
            item = "Капучино"
            price = 180
            print(item + ": " + "price" + " руб.")
          note: Имя price в кавычках.
          expectMistake: name-in-quotes
        - code: |
            item = "Капучино"
            price = 180
            print("Капучино: 180 руб.")
          note: Ценник записан готовым текстом — выводится верно, но не из переменных.
          expectMistake: null
      mistakes:
        - id: str-plus-int
          when:
            errorType: TypeError
            errorIncludes: str
          where: Строка с `print`
          why: >-
            В `price` лежит число, а `+` соединяет строку только со строкой. Python не угадывает,
            что ты хотел, и останавливается.
          try: 'Собери строку f-строкой: `f"{item}: {price} руб."` — или передай значения в `print` через запятую.'
        - id: price-as-text
          when:
            failedTest: t2
            codeRegex: 'price\s*=\s*["'']'
          why: >-
            Кавычки превратили цену в текст. Ошибка ушла, но считать с такой ценой уже нельзя:
            `price * 2` даст `180180`, а не 360.
          try: Оставь `price = 180` без кавычек, а строку собери f-строкой или через запятую в `print`.
        - id: no-f
          when:
            outputIncludes: "{"
          why: Перед кавычкой нет буквы `f`, поэтому фигурные скобки напечатались как обычный текст.
          try: Поставь `f` вплотную перед открывающей кавычкой.
        - id: name-in-quotes
          when:
            outputIncludes: price
          why: >-
            `price` стоит в кавычках, поэтому на ценник попало слово price, а не число из
            переменной.
          try: Убери кавычки вокруг `price` — и не забудь, что число нельзя склеить со строкой через `+`.
      afterPass: >-
        Ценник снова печатается, а значения по-прежнему берутся из переменных. Запомни, как
        выглядит эта ошибка: `can only concatenate str` — значит, к строке через `+`
        прибавляют не строку.
      skills: [strings-basics, f-strings]

  - id: practice-board
    type: exercise
    title: Практика 4
    exercise:
      id: m1-l3-e4
      kind: write
      title: Объявление на табло
      statement: |-
        На табло у входа в кофейню помещается 20 символов. Перед публикацией объявление нужно
        проверить: сколько в нём символов и сколько места ещё свободно.

        В переменной `text` лежит объявление, в `limit` — сколько символов помещается на табло.
        Напиши программу, которая выведет три строки:

        ```text
        Объявление: Скидка на какао!
        Символов: 16
        Свободно: 4
        ```
      output: Три строки — объявление, число символов в нём и сколько символов свободно.
      constraints:
        - Длину объявления считай через `len`, а свободное место — из `limit` и этой длины.
      starterCode: |
        text = "Скидка на какао!"
        limit = 20

      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: |-
            Объявление: Скидка на какао!
            Символов: 16
            Свободно: 4
          compare:
            ignoreSpaces: true
      rules:
        - id: use-len
          use: ["call:len"]
          message: >-
            Посчитай длину через `len(text)`, а не вручную: если объявление изменится,
            программа пересчитает всё сама.
        - id: compute-free
          use: [Sub]
          message: >-
            Свободное место посчитай в коде: `limit` минус длина текста.
      criteria:
        - Выводятся три строки, как в образце.
        - Длина считается через `len`, свободное место — вычитанием из `limit`.
        - Пробелы и знаки препинания тоже считаются символами.
      hints:
        - >-
          Какая функция из урока считает символы в строке? И как из её результата и `limit`
          получить свободное место?
        - >-
          Приём на другом примере: при `word = "табло"` строка `print(f"Букв: {len(word)}")`
          выведет `Букв: 5`. В фигурных скобках можно и считать: `{10 - len(word)}` → `5`.
        - >-
          Каркас — три `print` с f-строками: `f"Объявление: {...}"`,
          `f"Символов: {len(...)}"` и `f"Свободно: {... - ...}"`.
      solution:
        code: |
          text = "Скидка на какао!"
          limit = 20
          print(f"Объявление: {text}")
          print(f"Символов: {len(text)}")
          print(f"Свободно: {limit - len(text)}")
        explanation: >-
          `len(text)` считает все символы, включая пробелы и восклицательный знак, — их 16.
          Свободное место — `limit - len(text)` = 20 − 16 = 4. Подойдёт и вариант с `print`
          через запятую или с отдельной переменной для длины.
      wrongSolutions:
        - code: |
            text = "Скидка на какао!"
            limit = 20
            print(f"Объявление: {text}")
            print(f"Символов: {len('text')}")
            print(f"Свободно: {limit - len('text')}")
          note: len от слова text в кавычках.
          expectMistake: len-of-word
        - code: |
            text = "Скидка на какао!"
            limit = 20
            print(f"Объявление: {text}")
            print(f"Символов: {len(text)}")
            print(f"Свободно: {len(text) - limit}")
          note: Вычитание в обратную сторону.
          expectMistake: reversed
        - code: |
            text = "Скидка на какао!"
            limit = 20
            print("Объявление: " + text)
            print("Символов: " + len(text))
            print("Свободно: " + limit - len(text))
          note: Строка и число через +.
          expectMistake: str-plus-int
        - code: |
            text = "Скидка на какао!"
            limit = 20
            print(f"Объявление: {text}")
            print("Символов: {len(text)}")
            print("Свободно: {limit - len(text)}")
          note: Во второй и третьей строке забыта буква f.
          expectMistake: no-f
      mistakes:
        - id: len-of-word
          when:
            failedTest: t1
            codeRegex: 'len\(\s*["'']text["'']\s*\)'
          why: >-
            `len` посчитал символы в слове «text», потому что оно в кавычках: получилось 4 вместо
            длины объявления.
          try: Убери кавычки внутри `len(...)` — нужна переменная `text`, а не слово.
        - id: reversed
          when:
            outputIncludes: "-4"
          why: Вычитание перевёрнуто — из длины текста вычитается `limit`, поэтому число получилось отрицательным.
          try: Вычитай длину текста из `limit`, а не наоборот.
        - id: no-f
          when:
            outputIncludes: "{"
          why: Перед кавычками нет буквы `f`, поэтому фигурные скобки напечатались как обычный текст.
          try: Поставь `f` вплотную перед открывающей кавычкой в каждой строке с `{}`.
        - id: str-plus-int
          when:
            errorType: TypeError
            errorIncludes: concatenate
          why: >-
            `len(text)` даёт число, а `+` склеивает строку только со строкой — Python
            останавливается с `TypeError`.
          try: 'Собери строки f-строками, например `f"Символов: {len(text)}"`.'
      afterPass: >-
        Программа сама проверяет любое объявление. Попробуй текст длиннее 20 символов —
        «Свободно» станет отрицательным. Как научить программу предупреждать об этом, узнаешь
        в модуле про условия.
      skills: [strings-basics, f-strings]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Строка — текст в кавычках, тип `str`. `\"5\"` — строка, `5` — число."
      - "`+` склеивает строки (пробелы дописываешь сам), `*` повторяет, `len` считает все символы, включая пробелы."
      - "f-строка `f\"Итого: {total}\"` подставляет значения и вычисления в текст. Без `f` фигурные скобки останутся текстом."
      - "Строку и число через `+` склеить нельзя — будет `TypeError`. Используй f-строку или `print` через запятую."
    question: >-
      Чем отличаются `"7" + "3"`, `7 + 3` и `"7" + 3`? Что получится в каждом случае и
      почему?
    answer: >-
      `"7" + "3"` — склейка двух строк, получится `73`. `7 + 3` — сложение чисел, получится
      `10`. А `"7" + 3` остановится с `TypeError`: `+` соединяет строку только со строкой.
      Чтобы вывести текст вместе с числом, нужна f-строка или `print` через запятую.
