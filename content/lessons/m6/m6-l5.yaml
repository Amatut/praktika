        - id: t8
          kind: assert
          title: Имена в стиле PEP 8
          stdin: "0\n"
          code: |-
            import ast
            import re

            _tree = ast.parse(open(__file__, encoding="utf-8").read())
            _snake = re.compile(r"[a-z_][a-z0-9_]*")
            _upper = re.compile(r"[A-Z_][A-Z0-9_]*")
            _constants = set()
            for _node in _tree.body:
                if isinstance(_node, ast.Assign):
                    for _target in _node.targets:
                        _names = _target.elts if isinstance(_target, ast.Tuple) else [_target]
                        for _name in _names:
                            if isinstance(_name, ast.Name) and _upper.fullmatch(_name.id):
                                _constants.add(_name.id)
            _stores = {}
            for _node in ast.walk(_tree):
                if isinstance(_node, ast.Name) and isinstance(_node.ctx, ast.Store):
                    _stores[_node.id] = _stores.get(_node.id, 0) + 1
            _bad = []
            for _node in ast.walk(_tree):
                if isinstance(_node, ast.FunctionDef) and not _snake.fullmatch(_node.name):
                    _bad.append(_node.name)
                elif isinstance(_node, ast.arg) and not _snake.fullmatch(_node.arg):
                    _bad.append(_node.arg)
                elif isinstance(_node, ast.Name) and isinstance(_node.ctx, ast.Store):
                    _constant = _node.id in _constants and _stores[_node.id] == 1
                    if not _snake.fullmatch(_node.id) and not _constant:
                        _bad.append(_node.id)
            assert not _bad, _bad
          message: >-
            Остались имена не в стиле PEP 8. Функции и переменные — snake_case: маленькие буквы и
            «_». ЗАГЛАВНЫМИ пишут только константы — их задают один раз в начале программы.
        - id: t9
          kind: assert
          title: Говорящие имена
          stdin: "0\n"
          code: |-
            import ast

            _tree = ast.parse(open(__file__, encoding="utf-8").read())
            _short = set()
            for _node in ast.walk(_tree):
                if isinstance(_node, ast.Name) and len(_node.id) == 1:
                    _short.add(_node.id)
                elif isinstance(_node, ast.arg) and len(_node.arg) == 1:
                    _short.add(_node.arg)
            assert not (_short - {"i", "j", "k", "_"}), _short
          message: >-
            В коде остались однобуквенные имена вроде n, c, h или p — назови их по тому, что они
            хранят. Короткое i можно оставить для счётчика цикла.
      rules:
        - id: use-functions
          use: [call:rental_cost, call:format_line]
          message: >-
            Функции rental_cost и format_line написаны, но программа их не вызывает: стоимость и
            строка чека по-прежнему собираются в цикле. Вызывай функции там, где нужен их
            результат.
      criteria:
        - На тех же вводах вывод совпадает с выводом исходной программы строка в строку.
        - "`rental_cost(hours)` возвращает стоимость, `format_line(name, cost)` — строку чека; обе ничего не печатают."
        - Все имена — в стиле PEP 8 (snake_case, константы ЗАГЛАВНЫМИ) и говорят, что хранят.
