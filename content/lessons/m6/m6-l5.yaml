      solution:
        code: |
          DAY_RATE = 1100
          DAY_RATE_HOURS = 5  # с 5 часов дневной тариф выгоднее почасового
          FIRST_HOUR_PRICE = 400
          NEXT_HOUR_PRICE = 200


          def rental_cost(hours):
              if hours >= DAY_RATE_HOURS:
                  return DAY_RATE
              return FIRST_HOUR_PRICE + (hours - 1) * NEXT_HOUR_PRICE


          def format_line(name, cost):
              return f"{name}: {cost} руб."


          def print_report(clients_count):
              revenue = 0
              for i in range(clients_count):
                  record = input().split(";")
                  name = record[0]
                  cost = rental_cost(int(record[1]))
                  revenue = revenue + cost
                  print(format_line(name, cost))
              print(f"Выручка: {revenue} руб.")


          print_report(int(input()))
        explanation: >-
          Каждая функция делает одно дело: `rental_cost` знает только тариф, `format_line` — только
          вид строки чека, а `print_report` читает записи, складывает выручку и печатает. Числа
          тарифа стали константами, а `processAll`, `Total`, `n`, `p`, `h`, `c` — понятными именами
          в `snake_case`.
