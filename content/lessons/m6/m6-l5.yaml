      mistakes:
        - id: defined-below
          when:
            errorIncludes: "'rehearsal_price' is not defined"
            codeRegex: '^def rehearsal_price\b'
          why: >-
            Функция `rehearsal_price` в программе есть, но объявлена ниже строк, которые её
            вызывают. Python выполняет программу сверху вниз: в момент вызова `def` ещё не
            выполнился, и такого имени пока нет.
          try: >-
            Перенеси `def rehearsal_price(hours):` вместе с телом выше первого вызова — сразу после
