          verify: 'Запусти с вводом из примера 1 — должна появиться строка «Первая репетиция: 950».'
        - id: no-function
          when:
            errorIncludes: "'rehearsal_price' is not defined"
          why: >-
            Проверка вызывает `rehearsal_price(0)` и `rehearsal_price(3)`, а функции с таким именем в
            программе нет. Пока формула повторяется в нескольких строках, её придётся менять в
            нескольких местах.
          try: >-
            Напиши после констант функцию `rehearsal_price(hours)` — имя ровно такое, один параметр —
            и верни из неё цену одной репетиции через `return`. Потом замени формулы вызовами.
          verify: Проверки с вызовом rehearsal_price должны стать зелёными.
        - id: name-mismatch
          when:
            errorType: NameError
          why: >-
            Python не знает имя из сообщения. Скорее всего, константа или функция в одном месте
            названа иначе, чем при создании: `HOUR_PRICE` и `HOURS_PRICE` для Python — разные имена.
          try: >-
            Сравни имя из сообщения с тем, как ты его создал в начале программы, и сделай их
            одинаковыми. Подсказка `Did you mean` в конце сообщения часто называет верное имя.
          verify: 'Запусти с вводом из примера 1 — должна появиться строка «Первая репетиция: 950».'
        - id: print-not-return
          when:
            failedTest: t4
            codeRegex: 'def rehearsal_price\b[^\n]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+print\('
          why: >-
            `rehearsal_price` печатает цену, но не возвращает её, а функция без `return` отдаёт
            `None`. Поэтому цена появляется на экране отдельной строкой, в строке репетиции
            печатается `None`, а сложить `None` в «Всего» Python не может — отсюда TypeError.
          try: >-
            Замени `print(...)` внутри функции на `return ...`, а печатай там, где функцию
            вызываешь.
          verify: 'Проверка «Функция для трёх часов» должна получить 1350.'
        - id: debug-left
          when:
            failedTest: t1
            codeRegex: 'def rehearsal_price\b[^\n]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+print\(|^[ \t]*print\([^\n]*(?:ОТЛАДКА|=\s*\})'
          where: Лишний `print` — внутри `rehearsal_price` или отладочный
          why: >-
            В выводе лишние строки: остался `print` внутри функции или отладочный вывод. Проверка
            сравнивает вывод строка в строку — у исходной программы было ровно четыре строки.
          try: >-
            Удали лишний `print` или поставь перед ним `#`. Функция только возвращает цену, а
            печатают её строки внизу программы.
          verify: 'Запусти с вводом из примера 1 — первой строкой должна быть «Первая репетиция: 950».'
        - id: total-changed
          when:
            failedTest: t1
            outputIncludes: "Первая репетиция: 950\nВторая репетиция: 1350\nТретья репетиция: 550"
          why: >-
            Цены репетиций верные, а «Всего» изменилось. Рефакторинг не меняет вывод: итог — это
            сумма трёх цен, и у каждой репетиции своя плата за аппаратуру. Если сложить часы и
            посчитать одну цену, аппаратура учтётся один раз.
          try: Сложи три готовые цены — те же, что печатаешь в строках выше.
          verify: 'В «Примере 1» должно получиться «Всего: 2850».'
        - id: lower-constant
          when:
            failedTest: t5
            codeRegex: '^[A-Z0-9_]*[a-z][A-Za-z0-9_]*[ \t]*=[ \t]*(?:150|400)[ \t]*(?:#.*)?$'
          why: >-
            Числа получили имена — это главное. Но по PEP 8 константы пишут ЗАГЛАВНЫМИ буквами: так
            с первого взгляда видно, что значение программа не меняет, а `hours` или `total` —
            обычные переменные.
          try: >-
            Переименуй константы заглавными буквами, например `hour_price` или `HourPrice` →
            `HOUR_PRICE`, — во всех местах, где они встречаются.
          verify: Нажми «Проверить» — проверка «Числа — в константах» должна пройти.
        - id: constants-inside
          when:
            failedTest: t5
            codeRegex: '^[ \t]+[A-Z_][A-Z0-9_]*[ \t]*=[ \t]*(?:150|400)\b'
          why: >-
            Константы объявлены внутри функции. Их место — в самом начале программы, до функций:
            там их сразу видно, и новую цену ищут именно там.
          try: Перенеси строки с константами из функции в начало программы — без отступа.
          verify: Нажми «Проверить» — проверка «Числа — в константах» должна пройти.
        - id: magic-left
          when:
            failedTest: t5
            codeRegex: '^[ \t]*(?![A-Z_][A-Z0-9_]*[ \t]*=[ \t]*(?:150|400)[ \t]*(?:#.*)?$)[^\n#]*\b(?:150|400)\b'
          why: >-
            Где-то осталось число 150 или 400 — в функции, в формуле или в «Всего». Пока число
            записано само по себе, непонятно, что оно значит, а при новой цене его легко пропустить.
          try: >-
            Объяви константы в начале программы, например `EQUIPMENT_FEE = 150`, и замени каждое 150
            и 400 в формулах их именами.
          verify: Нажми «Проверить» — проверка «Числа — в константах» должна пройти.
        - id: function-unused
          when:
            failedRule: one-formula
          why: >-
            Функция есть, но формула цены всё ещё записана в нескольких местах: часть строк считает
            цену в обход функции. Поменяется правило — эти строки придётся править отдельно.
          try: >-
            Везде, где нужна цена репетиции, вызывай `rehearsal_price(...)` — и в трёх строках с
            ценами, и в «Всего».
          verify: Нажми «Проверить» — требование про одну формулу должно выполниться.
      afterPass: >-
        Поднимет база цену часа — поменяешь одну строку, и все четыре строки вывода пересчитаются
        сами. А «Всего» из готовых цен не может разойтись с отдельными репетициями.
      skills: [clean-code, functions]

  - id: practice-split
    type: exercise
    title: Практика 3
    exercise:
      id: m6-l5-e3
      kind: write
      title: "Лодочная станция: разбери длинную функцию"
      statement: |-
        Программа лодочной станции считает выручку за день. Тариф: первый час — 400 руб., каждый
        следующий — 200 руб., а от 5 часов — дневной тариф 1100 руб. Первая строка ввода — сколько
        было клиентов, дальше по строке на клиента: имя и часы через `;`.

        Программа работает, но одна функция `processAll` делает всё сразу: читает, считает,
        оформляет и печатает. Имена `processAll` и `Total` написаны не в стиле PEP 8, а `n`, `s`,
        `p`, `h`, `c` ничего не говорят. Разбери её, не меняя вывод:

        1. `rental_cost(hours)` — **возвращает** стоимость проката за столько часов.
        2. `format_line(name, cost)` — **возвращает** строку чека, например `Аня: 600 руб.`
        3. Чтение, сумму и печать оставь в отдельной функции или внизу программы — как тебе удобнее.
        4. Все имена — в стиле PEP 8: функции и переменные в `snake_case`, константы (если
           заведёшь) — ЗАГЛАВНЫМИ. И пусть имена говорят, что хранят: одной буквой можно назвать
           только счётчик цикла `i`.

        Переноси по одному куску и после каждого нажимай «Запустить» с вводом из примера.
      input: "Первая строка — число клиентов, затем по строке на клиента: `имя;часы`."
      output: >-
        Строка чека на каждого клиента и последняя строка `Выручка: <сумма> руб.` — как у исходной
        программы.
      constraints:
        - "`rental_cost` и `format_line` возвращают результат через `return` и ничего не печатают."
        - Программа вызывает обе функции — тариф и строка чека не повторяются в цикле.
        - Тариф и текст строк не меняются.
      starterCode: |
        def processAll(n):
            Total = 0
            for i in range(n):
                s = input()
                p = s.split(";")
                h = int(p[1])
                if h >= 5:
                    c = 1100
                else:
                    c = 400 + (h - 1) * 200
                Total = Total + c
                print(p[0] + ": " + str(c) + " руб.")
            print("Выручка: " + str(Total) + " руб.")


        processAll(int(input()))
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "3\nАня;2\nБоря;5\nВика;1\n"
          expected: |-
            Аня: 600 руб.
            Боря: 1100 руб.
            Вика: 400 руб.
            Выручка: 2100 руб.
        - id: t2
