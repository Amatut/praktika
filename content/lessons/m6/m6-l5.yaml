      mistakes:
        - id: defined-below
          when:
            errorType: NameError
            codeRegex: '^(?:[A-Za-z_]\w*\(|[^\s#][^\n]*\b(?:input|range)\()[^\n]*$(?=[\s\S]*^def (?:rental_cost|format_line)\b)'
          why: >-
            Функции есть, но объявлены ниже строки, которая запускает программу. Python выполняет
            файл сверху вниз: когда код вызывает функцию из сообщения, её `def` ещё не выполнился.
          try: >-
            Перенеси вызов главной функции (или цикл) в самый конец — после всех `def`. Сначала
            объявляют функции, потом запускают программу.
          verify: 'Запусти с вводом из примера 1 — последней строкой должна быть «Выручка: 2100 руб.».'
        - id: no-function
          when:
            errorType: NameError
            codeRegex: '(?<![\s\S])(?!(?=[\s\S]*^def rental_cost\b)(?=[\s\S]*^def format_line\b))'
          why: >-
            Проверка вызывает `rental_cost(...)` и `format_line(...)`, а одной из этих функций в
            программе нет — или она названа по-другому.
          try: >-
            Создай обе функции с именами ровно как в условии — `rental_cost(hours)` и
            `format_line(name, cost)` — и верни из каждой результат через `return`.
          verify: Проверки «Строка чека» и «Четыре часа — ещё почасовой тариф» должны пройти.
        - id: accumulator-in-loop
          when:
            failedTest: t3
            codeRegex: '^([ \t]*)for\b[^\n]*:[ \t]*\n(?:\1[ \t]+[^\n]*\n)*?\1[ \t]+[A-Za-z_]\w*[ \t]*=[ \t]*0[ \t]*$'
          why: >-
            Накопитель обнуляется внутри цикла: строка `… = 0` стоит в теле `for`. На каждом круге
            сумма начинается заново, а если клиентов нет, цикл не выполняется ни разу — и у
            переменной вовсе нет значения.
          try: >-
            Перенеси строку с `= 0` на уровень выше — перед `for`, как `Total = 0` в исходной
            программе. Внутри цикла только прибавляй.
          verify: 'Запусти с вводом из примера 1 — последней строкой должна быть «Выручка: 2100 руб.».'
        - id: missed-rename
          when:
            errorType: NameError
          why: >-
            Python не знает имя из сообщения: где-то осталось старое имя, а переменной с ним больше
            нет, — или новое имя написано с опечаткой.
          try: >-
            Открой строку из сообщения и замени имя на новое. Потом проверь, не встречается ли
            старое имя ещё где-нибудь.
          verify: 'Запусти с вводом из примера 1 — последней строкой должна быть «Выручка: 2100 руб.».'
        - id: missed-rename-local
          when:
            errorType: UnboundLocalError
          why: >-
            Внутри функции этому имени присваивают значение, поэтому Python считает его локальным
            (как в уроке 5.4). Но в строке из сообщения его читают раньше, чем оно получило
            значение. При переименовании так бывает, если в строке сложения осталось старое имя
            (`Total = Total + cost`) или не переименована строка с начальным значением (`Total = 0`).
          try: >-
            Найди, где переменная получает первое значение — строку `… = 0` перед циклом, — и сделай
            имя одинаковым везде: там, в строке сложения и в последнем `print`.
          verify: 'Запусти с вводом из примера 1 — последней строкой должна быть «Выручка: 2100 руб.».'
        - id: str-plus-int
          when:
            errorIncludes: can only concatenate str (not "int") to str
          why: >-
            При переносе строки чека потерялось `str(...)`: склеить через `+` можно только строки, а
            стоимость — число.
          try: >-
            В строке из сообщения оберни число в `str(...)`, как было в исходной программе, или
            собери строку f-строкой: `f"{name}: {cost} руб."`.
          verify: 'Проверка «Строка чека» должна получить «Ева: 1000 руб.».'
        - id: print-not-return-cost
          when:
            failedTest: t5
            codeRegex: 'def rental_cost\b[^\n]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+print\('
          why: >-
            `rental_cost` печатает, но не возвращает стоимость, а функция без `return` отдаёт
            `None`. Поэтому проверка получает `None` вместо числа, а в программе `None` не
            прибавить к выручке — отсюда TypeError.
          try: >-
            Сделай так, чтобы `rental_cost` возвращала стоимость: замени `print(...)` со
            стоимостью на `return ...`, а лишние `print` убери. Печатает строку чека тот, кто
            вызывает функции: `print(format_line(name, cost))`.
          verify: Проверка «Четыре часа — ещё почасовой тариф» должна получить 1000.
        - id: print-not-return
          when:
            failedTest: t7
            codeRegex: 'def format_line\b[^\n]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+print\('
          why: >-
            `format_line` печатает строку чека вместо того, чтобы вернуть её. Вывод может совпасть,
            но вызов такой функции даёт `None`: её результат не сохранить, не проверить и не
            напечатать в другом месте.
          try: >-
            Внутри `format_line` замени `print(...)` на `return ...`, а печатай там, где функцию
            вызываешь: `print(format_line(name, cost))`.
          verify: 'Проверка «Строка чека» должна получить «Ева: 1000 руб.».'
        - id: debug-left
          when:
            failedTest: t1
            codeRegex: 'def (?:rental_cost|format_line)\b[^\n]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+print\(|^[ \t]*print\([^\n]*(?:ОТЛАДКА|=\s*\})'
          where: Лишний `print` — в `rental_cost`, `format_line` или отладочный
          why: >-
            В выводе лишние строки: остался `print` внутри `rental_cost` или `format_line` или
            отладочный вывод. Эти функции только возвращают результат, а проверка сравнивает вывод
            строка в строку, как у исходной программы.
          try: Удали лишний `print` или поставь перед ним `#`.
          verify: 'Запусти с вводом из примера 1 — первой строкой должна быть «Аня: 600 руб.».'
        - id: not-called
          when:
            failedTest: t1
            outputEquals: ""
          why: >-
            Программа ничего не вывела. Функции объявлены, но `def` только создаёт функцию, а
            выполняется она, когда её вызывают. В исходной программе внизу был вызов
            `processAll(int(input()))` — при переделке он потерялся.
          try: >-
            Допиши внизу программы, без отступа, вызов главной функции с числом клиентов из
            ввода — с новым именем функции.
          verify: 'Запусти с вводом из примера 1 — должны появиться три строки чека и «Выручка: 2100 руб.».'
        - id: crash-on-empty
          when:
            failedTest: t3
            errorIncludes: Error
          why: >-
            Программа останавливается с ошибкой уже при вводе `0`, когда клиентов нет. Проверки
            функций запускают программу с этим же вводом, поэтому не проходят и они — даже если
            сами `rental_cost` и `format_line` верны.
          try: >-
            Запусти программу с вводом `0` и разберись с ошибкой из сообщения: на какой она строке
            и какое значение там не то. Сначала исправь её — остальные проверки, скорее всего,
            позеленеют сами.
          verify: 'Запуск с вводом 0 должен вывести «Выручка: 0 руб.».'
        - id: cost-changed
          when:
            failedTest: t5
          why: >-
            Стоимость изменилась при переносе: 4 часа — это 400 + 3 * 200 = 1000 руб. Рефакторинг
            переносит формулу как есть, ничего не «улучшая» по дороге.
          try: >-
            Сравни формулу в `rental_cost` с исходной: первый час — 400, каждый следующий — 200, то
            есть `(часы - 1)` раз по 200.
          verify: Проверка «Четыре часа — ещё почасовой тариф» должна получить 1000.
        - id: boundary-changed
          when:
            failedTest: t6
          why: >-
            На границе тариф изменился: ровно 5 часов должны стоить 1100 по дневному тарифу, как в
            исходной программе. Скорее всего, `>=` при переносе превратилось в `>`.
          try: Сравни условие дневного тарифа с исходным `h >= 5`.
          verify: 'Проверка «Граничный случай: ровно 5 часов» должна получить 1100.'
        - id: format-changed
          when:
            failedTest: t7
          why: >-
            Строка чека изменилась. Рефакторинг не меняет вывод: было «имя: сумма руб.» — с
            двоеточием, пробелами и точкой в конце.
          try: >-
            Сравни то, что возвращает `format_line("Ева", 1000)`, со строкой `Ева: 1000 руб.`
            символ за символом.
          verify: 'Проверка «Строка чека» должна получить «Ева: 1000 руб.».'
        - id: constants-inside
          when:
            failedTest: t8
            codeRegex: '^[ \t]+[A-Z_][A-Z0-9_]*[ \t]*=(?!=)'
          why: >-
            Имена ЗАГЛАВНЫМИ стоят внутри функции. По PEP 8 так пишут только константы, а их место —
            в начале программы, до функций: там их видно сразу, и новый тариф ищут именно там.
            Внутри функции имена пишут в `snake_case`.
          try: Перенеси строки с константами из функции в начало программы — без отступа.
          verify: Нажми «Проверить» — проверка «Имена в стиле PEP 8» должна пройти.
        - id: not-snake
          when:
            failedTest: t8
          why: >-
            Остались имена не в стиле PEP 8 — например, `processAll`, `printReport` или `Total`:
            большая буква в начале или в середине имени — уже не `snake_case`. Функции и переменные
            пишут маленькими буквами через `_`, а ЗАГЛАВНЫМИ — только константы, которые задают
            один раз в начале программы.
          try: >-
            Переименуй такие имена: `processAll` → `print_report`, `Total` → `revenue` (или свои
            понятные имена) — во всех местах. После переименования запусти программу.
          verify: Нажми «Проверить» — проверка «Имена в стиле PEP 8» должна пройти.
        - id: short-names
          when:
            failedTest: t9
          why: >-
            Стиль PEP 8 соблюдён, но однобуквенные имена вроде `n`, `c`, `h` или `p` по-прежнему
            ничего не говорят: чтобы понять, что в них лежит, приходится читать весь код. Короткое
            `i` для счётчика цикла — нормально, а для числа клиентов, часов, стоимости и частей
            записи нужны слова.
          try: >-
            Переименуй их по смыслу, например `n` → `clients_count`, `h` → `hours`, `c` → `cost`,
            `p` → `record`, — во всех местах и запусти программу.
          verify: Нажми «Проверить» — проверка «Говорящие имена» должна пройти.
      afterPass: >-
        Теперь стоимость можно проверить отдельно от чтения и печати — например, на границе в 5
        часов: `rental_cost(4)` и `rental_cost(5)`. Именно так в модуле 9 пишут автоматические
        тесты.
      skills: [clean-code, function-design]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - >-
        Рефакторинг меняет устройство кода, но не поведение: после каждого маленького шага запускай
        программу на тех же данных — и на границах тоже.
      - Говорящие имена, константы вместо магических чисел, одна функция — одно дело.
      - >-
        PEP 8: `snake_case` для функций и переменных, ЗАГЛАВНЫЕ буквы для констант, отступ 4
        пробела, пробелы вокруг `=` в присваивании и вокруг знаков действий, две пустые строки
        между функциями.
      - >-
        Переименовывай везде. Пропуск там, где значение читают, даёт NameError, а пропуск слева от
        `=` молча меняет вывод — поэтому сравнивай вывод. «Заменить всё» задевает чужие слова: на
        компьютере переименовывай командой редактора (F2 в VS Code) или заменой слова целиком.
    question: >-
      Ты переименовал переменную и вынес расчёт в функцию. Как убедиться, что поведение программы
      не изменилось?
    answer: >-
      Запустить её на тех же входных данных, что и до изменений, — включая граничные — и сравнить
      вывод строка за строкой. Лучше менять по одному и проверять после каждого шага: если вывод
      разошёлся, виноват последний шаг.
