id: m6-l5
module: m6
number: "6.5"
title: "Понятный код: имена, короткие функции, единый стиль"
objective: >-
  Делать код понятнее, не меняя его поведения: давать говорящие имена, заменять «магические числа»
  константами, выносить повторяющиеся шаги в короткие функции, соблюдать единый стиль — и после
  каждого шага проверять, что вывод не изменился.
minutes: [20, 30]
prerequisites: [m6-l3, m5-l7]
skills: [clean-code]
environment: python

story:
  title: Тройки в пяти местах
  fictional: true
  text: >-
    Егор месяц назад написал программу для дворового футбольного турнира: она считала очки команд.
    Теперь организаторы решили давать за победу 2 очка вместо 3, а Егор открыл код и увидел функцию
    `f(a, b)`, переменные `x`, `y` и тройки в пяти местах. Полчаса ушло на то, чтобы понять, какая
    тройка — очки за победу, а какая — что-то другое. Тогда он дал всему понятные имена, вынес очки
    в константы и после каждого шага запускал программу на прошлых матчах: таблица не менялась. Новое
    правило он поменял в одной строке.

why: >-
  Код читают гораздо чаще, чем пишут, — и чаще всего это ты сам через месяц. Понятные имена и
  короткие функции делают ошибки заметнее, а правило вроде «за победу теперь 2 очка» меняется в
  одной строке, а не в пяти.

usedIn: >-
  В командах код, прежде чем добавить в общий проект, читают коллеги — это называется code review,
  и понятность — одно из главного, на что там смотрят. Для стиля Python есть общее соглашение PEP 8 и
  программы, которые проверяют его автоматически, — с ними удобно работать, когда начнёшь ставить
  пакеты (модуль 8).

steps:
  - id: clean
    type: theory
    title: Код, который читается
    body: |-
      **Рефакторинг** — изменение устройства кода без изменения его поведения. Ты уже делал его в
      уроке 5.7: разложил калькулятор на функции, а вывод на тех же вводах остался прежним.
      Рефакторинг — не «переписать всё заново»: меняешь по кусочку, и программа всё время работает.
      Ритм такой: маленький шаг → запуск на тех же данных → сравнение вывода → следующий шаг. Если
      вывод разошёлся, виноват последний шаг.

      Что делает код понятнее:

      1. **Говорящие имена.** Переменная называется по тому, что хранит: `distance_km`, а не `a`.
         Функция — по тому, что делает или возвращает (урок 5.5): `count_points`, `format_row`.
         Для «да/нет» подходят `is_…` и `has_…`, например `is_winner`. Короткое `i` для счётчика
         цикла — нормально.
      2. **Константы вместо магических чисел.** **Магическое число** — число в коде без
         объяснения: что значит `3` в `return 3` — очки, голы, номер тура? Вынеси его в
         **константу** в начале программы: `WIN_POINTS = 3`. Имя ЗАГЛАВНЫМИ буквами (такие ты
         видел в уроке 5.4) — договорённость между людьми: «это значение программа не меняет».
         Python такую переменную не защищает. Главное — правило теперь меняется в одной строке.
      3. **Повтор — в функцию; одна функция — одно дело.** Одна и та же формула в трёх местах — это
         одна функция, которую вызывают три раза. А функцию, которая и читает ввод, и считает, и
         печатает, раздели: расчёт отдельно, оформление строки отдельно.
      4. **Единый стиль — PEP 8.** Так называется общее соглашение программистов на Python об
         оформлении кода. Главное из него:
         - функции и переменные — `snake_case` (он знаком тебе с урока 1.2): маленькие буквы,
           слова через `_`; константы — `UPPER_CASE`;
         - отступ — 4 пробела;
         - пробелы вокруг `=` в присваивании и вокруг знаков действий: `total = price * count`
           (но в скобках вызова — без пробелов: `sep="."`);
         - две пустые строки между функциями;
         - строка кода не длиннее 79 символов.
      5. **Переименовывай везде.** Пропустишь место, где значение читают (справа от `=`, в
         вызове, в f-строке), — Python остановится с NameError, когда дойдёт до этой строки.
         Пропустишь слева от `=` — ошибки не будет: появится лишняя переменная со старым именем,
         а вывод изменится. Поэтому после переименования сравнивай вывод, а не жди только ошибки.
      6. **Комментарий объясняет «почему»**, а не пересказывает код:
         `# с 5 часов дневной тариф выгоднее` полезнее, чем `# сравниваем часы с 5`.
    simpler: >-
      Рефакторинг — как уборка на кухне: посуда та же, продукты те же, просто всё подписано и лежит
      на своих местах. После уборки ужин должен получаться точно таким же — это и проверяешь:
      готовишь то же блюдо и сравниваешь. Понятные имена — подписи на банках, а константа — рецепт
      на холодильнике: поменял его в одном месте, и все готовят по-новому.
    coach: >-
      Меняй по одному: переименовал — запустил — сравнил вывод. Тогда, если что-то сломалось, сразу
      ясно, что именно.

  - id: football
    type: example
    title: Таблица турнира после уборки
    body: |-
      Так выглядел кусок программы Егора до уборки. Он работает, но попробуй быстро сказать, что
      значит каждая тройка:

      ```text
      def f(a, b):
          if a > b:
              return 3
          elif a == b:
              return 1
          else:
              return 0
      x = f(2, 1)
      y = f(0, 0)
      z = f(1, 3)
      print("Лисы: " + str(x) + " очк.")
      print("Совы: " + str(y) + " очк.")
      print("Ежи: " + str(z) + " очк.")
      ```

      Тройка в `return 3` — очки за победу, а тройка в `f(1, 3)` — голы соперника «Ежей». Этот код
      выводит три строки: `Лисы: 3 очк.`, `Совы: 1 очк.` и `Ежи: 0 очк.`. Ниже — тот же кусок после
      уборки. Запусти его и сравни: вывод тот же, строка в строку.
    code: |-
      WIN_POINTS = 3
      DRAW_POINTS = 1


      def count_points(scored, conceded):
          if scored > conceded:
              return WIN_POINTS
          elif scored == conceded:
              return DRAW_POINTS
          else:
              return 0


      def format_row(team, points):
          return f"{team}: {points} очк."


      print(format_row("Лисы", count_points(2, 1)))
      print(format_row("Совы", count_points(0, 0)))
      print(format_row("Ежи", count_points(1, 3)))
    notes:
      - line: 1
        text: >-
          У числа появилось имя: сразу видно, что это очки за победу. Новое правило «за победу 2
          очка» — правка только в этой строке.
      - line: 5
        text: >-
          `f(a, b)` стала `count_points(scored, conceded)`: имя функции говорит, что она делает, а
          параметры — что в них лежит: забитые и пропущенные мячи.
      - line: 11
        text: >-
          Ноль остался числом: «за поражение очков нет» понятно и без имени. Константа нужна там,
          где число приходится объяснять или оно может поменяться.
      - line: 14
        text: >-
          Оформление строки таблицы — отдельная маленькая функция. Раньше склейка
          `"Лисы: " + str(x) + " очк."` повторялась трижды. Перед каждой функцией — две пустые
          строки, как советует PEP 8.
      - line: 20
        text: >-
          Тройка здесь — голы соперника. После уборки её уже не спутать с очками.
    tryIt: >-
      Поменяй в строке 1 `3` на `2` и запусти: «Лисы» получат 2 очка — правило изменилось одной
      правкой. А теперь переименуй `team` в `name` только в строке 14, в скобках после имени
      функции, и запусти. Какую ошибку и какую строку назовёт Python? Потом верни как было.
    coach: >-
      Поведение не изменилось ни на символ — поменялось только то, как быстро код читается.

  - id: boundary-refactor
    type: predict
    title: Уборка без последствий?
    prompt: |-
      Интернет-магазин считал доставку так — бесплатно от 1000 руб.:

      ```text
      def d(t):
          if t >= 1000:
              return 0
          return 199
      ```

      После «уборки» имена стали понятными, а числа — константами. Как думаешь, что выведет новая
      версия?
    code: |-
      FREE_DELIVERY_FROM = 1000
      DELIVERY_PRICE = 199


      def delivery_price(order_total):
          if order_total > FREE_DELIVERY_FROM:
              return 0
          return DELIVERY_PRICE


      print(delivery_price(999), delivery_price(1000), delivery_price(1500))
    options:
      - "199 0 0"
      - "199 199 0"
      - "0 0 0"
    answer: "199 199 0"
    explanation: >-
      При уборке `>=` незаметно превратилось в `>`: заказ ровно на 1000 руб. перестал получать
      бесплатную доставку, хотя раньше получал. Старая версия вывела бы `199 0 0`. Имена стали
      лучше, а поведение изменилось — это уже не рефакторинг, а новая ошибка. Поэтому после уборки
      программу запускают на тех же данных, что и раньше, и обязательно на границе: 999, 1000, 1001.
    coach: >-
      Уборка тоже может сломать программу. Заметить это помогает только запуск на старых данных.

  - id: replace-all
    type: quiz
    title: «Заменить всё»
    question: >-
      Егор решил переименовать переменную `n` в `teams` и нажал в редакторе на компьютере «Найти и
      заменить» → «Заменить всё». Во что превратится строка `print(n)`?
    options:
      - "`print(teams)`"
      - "`priteamst(teams)`"
      - Не изменится — `print` не переменная
    correct: 1
    explanation: >-
      «Заменить всё» ищет буквы, а не имена: `n` есть и внутри `print`. А если выше стоит
      `n = int(input())`, она станет `teams = iteamst(iteamsput())`, и программа остановится уже
      на ней с NameError. На компьютере в VS Code ставь курсор на имя и нажимай F2 —
      переименуется только эта переменная (нужно расширение Python). В окне замены VS Code и IDLE
      есть поиск слова целиком (Whole word). В тренажёре замены нет: переименовывай вручную.
    coach: >-
      Переименовал — запусти и сравни вывод с прежним. Пропущенное место выдаст себя ошибкой
      NameError или изменившимся выводом.

  - id: practice-names
    type: exercise
    title: Практика 1
    exercise:
      id: m6-l5-e1
      kind: repeat
      title: Карты на 10 поездок
      statement: |-
        Школьник ездит на тренировки на автобусе. Карты продают только на 10 поездок. Программа
        получает, сколько поездок нужно за месяц и сколько стоит одна карта, и считает, сколько
        денег уйдёт на карты. Она работает верно, но прочитать её трудно: `a`, `b` и `c` ничего не
        говорят.

        Сначала нажми «Запустить» на программе как есть — в поле «Ввод для „Запустить“» уже стоят
        `25` и `450` — и запомни вывод. Потом переименуй переменные по таблице:

        ```text
        a  →  trips        сколько поездок нужно
        b  →  card_price   цена одной карты
        c  →  cost         сколько стоят все карты
        ```

        Меняй имя во всех местах, где оно встречается, и запусти снова: вывод должен совпасть с
        первым.
      input: Две строки — сколько нужно поездок и цена одной карты (целые числа).
      output: "Одна строка: `На карты уйдёт <сумма> руб.` — как до переименования."
      constraints:
        - Меняй только имена переменных — формулы, условие и текст вывода остаются прежними.
        - Имена бери ровно из таблицы.
      starterCode: |
        a = int(input())
        b = int(input())
        c = a // 10 * b
        if a % 10 > 0:
            c = c + b
        print(f"На карты уйдёт {c} руб.")
      tests:
        - id: t1
          kind: io
          title: "Пример 1: 25 поездок"
          example: true
          stdin: "25\n450\n"
          expected: На карты уйдёт 1350 руб.
        - id: t2
          kind: io
          title: "Пример 2: ровно 40 поездок"
          example: true
          stdin: "40\n500\n"
          expected: На карты уйдёт 2000 руб.
        - id: t3
          kind: io
          title: "Граничный случай: поездок нет"
          edge: true
          stdin: "0\n450\n"
          expected: На карты уйдёт 0 руб.
        - id: t4
          kind: io
          title: "Граничный случай: меньше 10 поездок"
          edge: true
          stdin: "7\n480\n"
          expected: На карты уйдёт 480 руб.
        - id: t5
          kind: assert
          title: Старых имён не осталось
          stdin: "25\n450\n"
          code: |-
            import ast
            _tree = ast.parse(open(__file__, encoding="utf-8").read())
            _names = {_node.id for _node in ast.walk(_tree) if isinstance(_node, ast.Name)}
            assert not _names & {"a", "b", "c"}
          message: В коде остались имена a, b или c — переименуй их по таблице.
        - id: t6
          kind: assert
          title: Новые имена из таблицы
          stdin: "25\n450\n"
          code: |-
            import ast
            _tree = ast.parse(open(__file__, encoding="utf-8").read())
            _names = {_node.id for _node in ast.walk(_tree) if isinstance(_node, ast.Name)}
            assert {"trips", "card_price", "cost"} <= _names
          message: "Используй имена из таблицы: trips, card_price и cost."
        - id: t7
          kind: assert
          title: Имена на своих местах
          stdin: "25\n450\n"
          code: |-
            _ns = globals()
            if {"trips", "card_price"} <= _ns.keys():
                assert (_ns["trips"], _ns["card_price"]) == (25, 450)
          message: >-
            Имена из таблицы перепутаны местами: в trips должно лежать число поездок, в card_price —
            цена карты.
      criteria:
        - На тех же вводах программа выводит то же, что и до переименования.
        - Имён `a`, `b`, `c` в коде нет — вместо них `trips`, `card_price`, `cost`, каждое на своём месте по таблице.
        - Формулы и условие не изменились — поменялись только имена.
      hints:
        - >-
          Сколько раз в программе встречается каждое старое имя? Посчитай для `a`, `b` и `c` —
          заменить нужно каждое место. Пропущенное в f-строке или справа от `=` Python не узнает,
          а пропущенное слева от `=` молча создаст лишнюю переменную — и вывод изменится.
        - >-
          На другом примере: было `x = 5` и `print(x * 2)`, стало `apples = 5` и
          `print(apples * 2)`. Имя поменялось в обеих строках, а вывод остался тем же — `10`.
        - |-
          Каркас — заполни пропуски новыми именами:
          ```text
          trips = int(input())
          card_price = …
          cost = trips // 10 * …
          if … % 10 > 0:
              cost = … + …
          print(f"На карты уйдёт {…} руб.")
          ```
      solution:
        code: |
          trips = int(input())
          card_price = int(input())
          cost = trips // 10 * card_price
          if trips % 10 > 0:
              cost = cost + card_price
          print(f"На карты уйдёт {cost} руб.")
        explanation: >-
          Каждое старое имя заменено во всех местах, включая `{c}` внутри f-строки. Формулы не
          менялись, поэтому вывод тот же. Зато теперь строка `cost = trips // 10 * card_price`
          читается сама: полные десятки поездок — это полные карты, каждая по цене карты, а если
          поездки остались — нужна ещё одна карта.
      altSolutions:
        - code: |
            trips = int(input())
            card_price = int(input())
            cost = trips // 10 * card_price
            if trips % 10 > 0:
                cost += card_price
            print(f"На карты уйдёт {cost} руб.")
          note: Короткая запись += — поведение то же.
        - code: |
            TRIPS_PER_CARD = 10

            trips = int(input())
            card_price = int(input())
            cost = trips // TRIPS_PER_CARD * card_price
            if trips % TRIPS_PER_CARD > 0:
                cost = cost + card_price
            print(f"На карты уйдёт {cost} руб.")
          note: Вдобавок 10 вынесено в константу — проверка это не запрещает.
        - code: |
            trips = int(input())
            card_price = int(input())
            cards = trips // 10
            if trips % 10 > 0:
                cards = cards + 1
            cost = cards * card_price
            print(f"На карты уйдёт {cost} руб.")
          note: Сначала число карт, потом цена — устройство другое, вывод тот же.
        - code: |
            trips = int(input())
            card_price = int(input())
            cost = card_price * (trips // 10)
            if trips % 10 != 0:
                cost += card_price
            print("На карты уйдёт", cost, "руб.")
          note: print через запятую, != 0 и множители в другом порядке — вывод тот же.
      wrongSolutions:
        - code: |
            trips = int(input())
            card_price = int(input())
            cost = a // 10 * card_price
            if trips % 10 > 0:
                cost = cost + card_price
            print(f"На карты уйдёт {cost} руб.")
          note: В третьей строке осталось старое имя a.
          expectMistake: missed-rename
        - code: |
            trips = int(input())
            card_price = int(input())
            cost = trips // 10 * card_prise
            if trips % 10 > 0:
                cost = cost + card_price
            print(f"На карты уйдёт {cost} руб.")
          note: Опечатка в новом имени.
          expectMistake: missed-rename
        - code: |
            trips = int(input())
            card_price = int(input())
            c = trips // 10 * card_price
            if trips % 10 > 0:
                c = c + card_price
            print(f"На карты уйдёт {c} руб.")
          note: Имя c не переименовано совсем — программа работает, но читать всё ещё трудно.
          expectMistake: old-name-left
        - code: |
            count = int(input())
            price = int(input())
            total = count // 10 * price
            if count % 10 > 0:
                total = total + price
            print(f"На карты уйдёт {total} руб.")
          note: Свои имена вместо имён из таблицы.
          expectMistake: names-differ
        - code: |
            trips = int(input())
            card_price = int(input())
            cost = trips // 10 * card_price + card_price
            print(f"На карты уйдёт {cost} руб.")
          note: «Заодно упростил» — убрал условие, и лишняя карта добавляется всегда.
          expectMistake: behavior-changed
        - code: |
            trips = int(input())
            card_price = int(input())
            cost = trips // 10 * card_price
            if trips % 10 > 0:
                cost = cost + card_price
            print(f"На карты уйдёт cost руб.")
          note: Вместо {c} в f-строке написано просто cost — без фигурных скобок.
          expectMistake: name-as-text
        - code: |
            trips = int(input())
            card_price = int(input())
            cost = trips // 10 * card_price
            if trips % 10 > 0:
                c = cost + card_price
            print(f"На карты уйдёт {cost} руб.")
          note: >-
            В ветке слева от = осталось старое c — ошибки нет, лишняя карта кладётся в c, а
            печатается cost (900 вместо 1350).
          expectMistake: old-name-assigned
        - code: |
            card_price = int(input())
            trips = int(input())
            cost = card_price // 10 * trips
            if card_price % 10 > 0:
                cost = cost + trips
            print(f"На карты уйдёт {cost} руб.")
          note: Имена перепутаны местами, но везде одинаково — вывод верный, а код врёт.
          expectMistake: names-swapped
      mistakes:
        - id: missed-rename
          when:
            errorType: NameError
          why: >-
            Python не знает имя из сообщения. Значит, переименование сделано не везде: в одной
            строке имя уже новое, а в другой ещё старое — или новое написано с опечаткой. Python
            сверяет имена посимвольно.
          try: >-
            Открой строку из сообщения и поправь имя по таблице. Потом пробегись по всем строкам:
            где ещё встречается старое имя?
          verify: 'Запусти с вводом 25 и 450 — должно получиться «На карты уйдёт 1350 руб.».'
        - id: name-as-text
          when:
            outputIncludes: уйдёт cost
          why: >-
            На экране слово «cost», а не сумма. В f-строке значение подставляется, только если имя
            стоит в фигурных скобках, — без них это обычный текст.
          try: Верни фигурные скобки вокруг имени в f-строке — там, где раньше было `{c}`.
          verify: 'Запусти с вводом 25 и 450 — должно получиться «На карты уйдёт 1350 руб.».'
        - id: behavior-changed
          when:
            failedTest: t2
            outputIncludes: На карты уйдёт 2500 руб.
          why: >-
            Вывод изменился: на ровно 40 поездок программа насчитала пять карт вместо четырёх.
            Переименование не должно менять поведение — формулы и условие остаются как были.
          try: >-
            Верни формулу и условие из исходной программы и поменяй в них только имена. Лишняя
            карта нужна, только если после полных десятков остались поездки.
          verify: 'В «Примере 2» должно получиться «На карты уйдёт 2000 руб.».'
        - id: old-name-assigned
          when:
            failedTest: t1
            codeRegex: '^[ \t]*[abc][ \t]*=(?!=)'
          why: >-
            Вывод изменился, а в коде осталось старое имя слева от `=`. Python не остановился:
            присвоить значение можно любому имени — так просто появилась лишняя переменная.
            Значение кладётся в старую, а печатается новая.
          try: >-
            Найди строку, где слева от `=` стоит `a`, `b` или `c`, и замени имя по таблице. Потом
            запусти с вводом 25 и 450 и сравни вывод с тем, что программа выводила до
            переименования.
          verify: 'Должно получиться «На карты уйдёт 1350 руб.».'
        - id: old-name-left
          when:
            failedTest: t5
            codeRegex: '\b[abc]\b'
          why: >-
            В коде осталось старое однобуквенное имя. Даже если вывод верный, читать такой код
            по-прежнему трудно — а задача была как раз в этом.
          try: Найди, где ещё встречаются `a`, `b` или `c`, и замени их по таблице — во всех местах.
          verify: Нажми «Проверить» — проверка «Старых имён не осталось» должна пройти.
        - id: names-differ
          when:
            failedTest: t6
            codeRegex: '(?<![\s\S])(?!(?=[\s\S]*\btrips\b)(?=[\s\S]*\bcard_price\b)(?=[\s\S]*\bcost\b))'
          why: >-
            Имена понятные, и программа работает. Но в этом задании нужны имена из таблицы — так
            проверка узнаёт, что переименование сделано.
          try: Переименуй переменные ещё раз — в `trips`, `card_price` и `cost`.
          verify: Нажми «Проверить» — проверка «Новые имена из таблицы» должна пройти.
        - id: names-swapped
          when:
            failedTest: t7
          why: >-
            Имена из таблицы есть, но стоят не на своих местах. Вывод совпал, потому что имена
            перепутаны везде одинаково, — но теперь код говорит неправду: в имени написано одно, а
            лежит в переменной другое.
          try: >-
            Сверь с таблицей каждую строку: первое `input()` — поездки, `trips`; второе — цена
            карты, `card_price`; итог — `cost`.
          verify: Нажми «Проверить» — проверка «Имена на своих местах» должна пройти.
      afterPass: >-
        Программа ведёт себя так же, а читается сама: `cost = trips // 10 * card_price` понятно без
        комментариев. Следующий шаг уборки — вынести 10 в константу, например `TRIPS_PER_CARD = 10`,
        как `WIN_POINTS` в примере.
      skills: [clean-code, variables]

  - id: practice-constants
    type: exercise
    title: Практика 2
    exercise:
      id: m6-l5-e2
      kind: modify
      title: "Репетиционная база: числа в одном месте"
      statement: |-
        Группа снимает репетиционную комнату. За каждую репетицию платят 150 руб. за аппаратуру и
        ещё 400 руб. за каждый час. Программа считает цены трёх репетиций недели и итог, но
        формула `150 + часы * 400` записана в ней шесть раз. Если база поднимет цену часа,
        исправлять придётся шесть мест — и одно легко пропустить.

        Наведи порядок, не меняя вывод:

        1. Вынеси 150 и 400 в **константы** в начале программы — с понятными именами ЗАГЛАВНЫМИ
           буквами.
        2. Напиши функцию `rehearsal_price(hours)`: она **возвращает** цену одной репетиции.
        3. Цену каждой из трёх репетиций получай вызовом этой функции, а «Всего» — как сумму трёх
           цен. Формула цены должна остаться в программе одна — внутри функции.
      input: Три строки — сколько часов длилась каждая репетиция.
      output: Четыре строки, как у исходной программы, — цена каждой репетиции и «Всего».
      constraints:
        - Числа 150 и 400 записаны в коде по одному разу — в константах.
        - "`rehearsal_price(hours)` возвращает цену через `return`, а не печатает её."
        - Текст вывода не меняется.
      starterCode: |
        first_hours = int(input())
        second_hours = int(input())
        third_hours = int(input())
        print("Первая репетиция:", 150 + first_hours * 400)
        print("Вторая репетиция:", 150 + second_hours * 400)
        print("Третья репетиция:", 150 + third_hours * 400)
        print("Всего:", 150 + first_hours * 400 + 150 + second_hours * 400 + 150 + third_hours * 400)
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "2\n3\n1\n"
          expected: |-
            Первая репетиция: 950
            Вторая репетиция: 1350
            Третья репетиция: 550
            Всего: 2850
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "4\n2\n5\n"
          expected: |-
            Первая репетиция: 1750
            Вторая репетиция: 950
            Третья репетиция: 2150
            Всего: 4850
        - id: t3
          kind: call
          title: "Граничный случай: 0 часов — только аппаратура"
          edge: true
          stdin: "0\n0\n0\n"
          call: rehearsal_price(0)
          expected: "150"
        - id: t4
          kind: call
          title: Функция для трёх часов
          example: true
          stdin: "0\n0\n0\n"
          call: rehearsal_price(3)
          expected: "1350"
        - id: t5
          kind: assert
          title: Числа — в константах
          stdin: "0\n0\n0\n"
          code: |-
            import ast
            _tree = ast.parse(open(__file__, encoding="utf-8").read())


            def _written(number):
                count = 0
                for node in ast.walk(_tree):
                    if isinstance(node, ast.Constant) and type(node.value) is int and node.value == number:
                        count += 1
                return count


            def _pairs(node):
                pairs = []
                for target in node.targets:
                    if isinstance(target, ast.Name):
                        pairs.append((target, node.value))
                    elif isinstance(target, ast.Tuple) and isinstance(node.value, ast.Tuple):
                        pairs.extend(zip(target.elts, node.value.elts))
                return pairs


            def _in_constant(number):
                for node in _tree.body:
                    if isinstance(node, ast.Assign):
                        for target, value in _pairs(node):
                            if (isinstance(target, ast.Name) and target.id.isupper()
                                    and isinstance(value, ast.Constant) and value.value == number):
                                return True
                return False


            assert _written(150) == 1 and _written(400) == 1
            assert _in_constant(150) and _in_constant(400)
          message: >-
            Числа 150 и 400 должны встречаться в коде по одному разу — в константах с именами
            ЗАГЛАВНЫМИ буквами в начале программы.
      rules:
        - id: one-formula
          max:
            Mult: 1
          message: >-
            Формула цены записана в программе несколько раз. Оставь одну — в функции
            rehearsal_price, а в остальных местах вызывай функцию.
      criteria:
        - Вывод на тех же вводах совпадает с выводом исходной программы.
        - 150 и 400 записаны по одному разу — в константах с понятными именами ЗАГЛАВНЫМИ буквами.
        - "`rehearsal_price(hours)` возвращает цену одной репетиции; три цены — её вызовы, «Всего» — их сумма."
      hints:
        - >-
          Сравни три строки с ценами: что в них меняется, а что повторяется слово в слово?
          Повторяющаяся часть — кандидат в функцию, а числа в ней — кандидаты в константы.
        - |-
