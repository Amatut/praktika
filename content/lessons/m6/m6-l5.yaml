          ```text
          print(40 * 3)
          print(40 * 5)
          ```
          Стало:
          ```text
          BUN_PRICE = 40


          def order_cost(count):
              return count * BUN_PRICE


          print(order_cost(3))
          print(order_cost(5))
          ```
        - |-
          Каркас:
          ```text
          ??? = 150      # понятные имена латиницей, ЗАГЛАВНЫМИ
          ??? = 400


          def rehearsal_price(hours):
              return …


          first = rehearsal_price(int(input()))
          … ещё две репетиции
          print("Первая репетиция:", first)
          … ещё три print, «Всего» — сумма трёх готовых цен
          ```
      solution:
