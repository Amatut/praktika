      mistakes:
        - id: def-after-call
          when:
            errorIncludes: "name 'month_cost' is not defined"
            codeIncludes: def month_cost
          why: >-
            Функция `month_cost` в программе есть, но объявлена ниже основной части. Python
            выполняет программу сверху вниз: когда цикл вызывает функцию, строка с `def` ещё не
            выполнилась, и такого имени пока нет.
          try: >-
            Перенеси `def month_cost` вместе с её телом выше основной части — сразу после
            констант.
          verify: >-
            Запусти с вводом первого примера — NameError должен исчезнуть, а вывод остаться
            прежним.
        - id: no-function
          when:
            errorIncludes: "name 'month_cost' is not defined"
          why: >-
            Проверка вызывает функцию `month_cost`, а в программе её нет. Вывод может быть верным,
            но расчёт стоимости должен жить в одной функции.
          try: >-
            Вынеси расчёт в `def month_cost(lessons):` — она получает число занятий и возвращает
            сумму через return. В цикле вызывай её.
          verify: Нажми «Проверить» — проверки month_cost должны пройти.
        - id: missed-rename
          when:
            errorType: NameError
          why: >-
            Переименовал не везде: в строке из сообщения осталось старое имя, которого Python уже не
            знает.
          try: >-
            Найди все места со старым именем — в тренажёре это делается глазами, строка за строкой —
            и замени оставшиеся. Потом запусти с вводом первого примера.
          verify: Программа должна дойти до конца и напечатать «Всего».
        - id: print-not-return
          when:
            failedTest: t5
            codeRegex: 'def month_cost[^\n]*\n(?:[ \t]+[^\n]*\n)*?[ \t]+print\('
          why: >-
            month_cost печатает сумму, а вызов функции без return даёт None. Такую «сумму» нельзя
            прибавить к итогу и проверить.
          try: Замени print внутри month_cost на `return` с той же суммой, а печатай в основной части.
          verify: Нажми «Проверить» — month_cost(3) должна вернуть 1050.
        - id: boundary
          when:
            outputEquals: |-
              Миша: 1400
              Ника: 700
              Оля: 2600
              Всего: 4700
          why: >-
            У Миши ровно 4 занятия, а скидки он не получил. В старой программе было «4 или больше» —
            `>=`, а при уборке условие стало строже.
          try: Верни в условие скидки `>=`.
          verify: 'В первом примере должно снова быть «Миша: 1200».'
        - id: output-changed
          when:
            failedTest: t1
            outputIncludes: Всего
          why: >-
            Вывод изменился, а рефакторинг меняет устройство программы, но не результат: те же
            строки, те же слова и пробелы, те же суммы.
          try: >-
            Запусти с вводом первого примера и сравни построчно со старым выводом. Отличается текст —
            верни прежний формат строки; отличаются суммы — сравни формулу в month_cost со старой.
          verify: Вывод первого примера должен совпасть с образцом строка в строку.
        - id: function-unused
          when:
            failedRule: uses-month-cost
          why: >-
            Функция month_cost написана, но основная часть считает стоимость сама. Тогда формула
            снова живёт в двух местах, и правило скидки придётся менять дважды.
          try: >-
            В цикле замени расчёт стоимости вызовом `month_cost(...)` с числом занятий, а результат
            печатай и прибавляй к итогу.
          verify: Нажми «Проверить» — требование про month_cost должно выполниться.
        - id: constant-inside
          when:
            failedTest: t9
            codeRegex: '^[ \t]+[A-Z][A-Z0-9_]*\s*=\s*(350|4|200)\b'
          why: >-
            Константы с именами заглавными буквами есть, но заведены внутри функции. Константа —
            настройка всей программы: её место в начале файла, где её сразу видно и где её меняют
            в одном месте.
          try: >-
            Перенеси строки с константами из функции в начало программы — без отступа, перед
            `def`.
          verify: Нажми «Проверить» — проверка «Числа — в константах» должна пройти.
        - id: lowercase-constant
          when:
            failedTest: t9
            codeRegex: '^(?=[A-Za-z0-9_]*[a-z])[A-Za-z_][A-Za-z0-9_]*\s*=\s*(350|4|200)\s*(#.*)?$'
          why: >-
            Число вынесено в переменную — это уже полдела. Но в имени у неё есть строчные буквы,
            как у обычной переменной. Константы по договорённости PEP 8 пишут ЗАГЛАВНЫМИ: так видно, что
            значение задано один раз и по ходу программы не меняется.
          try: >-
            Переименуй такие переменные заглавными буквами — например `PRICE_PER_LESSON` — во всех
            местах, где они встречаются.
          verify: Нажми «Проверить» — проверка «Числа — в константах» должна пройти.
        - id: magic-left
          when:
            failedTest: t9
          why: >-
            Числа 350, 4 или 200 всё ещё стоят в формулах или повторяются — или не заведены
            константами в начале программы. Поменяется цена — придётся искать её по всему коду, и
            одно место легко пропустить.
          try: >-
            Заведи в начале программы константы с именами заглавными буквами — например
            `PRICE_PER_LESSON = 350` — и в формулах пиши имя константы вместо числа.
          verify: Нажми «Проверить» — проверка «Числа — в константах» должна пройти.
        - id: old-name-left
          when:
            failedTest: t8
          why: >-
            Программа работает, но в ней осталось однобуквенное имя — например, n, t, x или новое
            вроде c. По нему не понять, что лежит в переменной.
          try: >-
            Дай переменной имя, которое говорит, что в ней хранится: число детей, итог, части
            строки. Переименуй во всех местах и запусти.
          verify: Нажми «Проверить» — проверка «Говорящие имена» должна пройти.
      afterPass: >-
        Вывод тот же, а правило скидки теперь меняется в одной строке — например, скидка с 5
        занятий. И month_cost можно проверить отдельно, на границе в 4 занятия. Если это задание
        далось трудно, повтори урок 6.5.
      skills: [clean-code, function-design]
      noHintsBeforeAttempt: true

  - id: recap
    type: recap
    title: Итоги и что повторить
    points:
      - >-
        Если оба задания получились без подсказок — модуль пройден: ты находишь ошибку в
        незнакомой программе и доказываешь исправление. Дальше — модуль 7, файлы и исключения.
      - >-
        Не читался traceback или исправлял там, где упало, а не где появилось значение, — повтори
        урок 6.1. Трудно было подобрать repro_line — урок 6.2.
      - >-
        Долго не находилась ошибка в «Продлить» — повтори 6.3 и границы из урока 2.5, а на
        компьютере пройди старую версию в отладчике (6.4).
      - >-
        При уборке ломался вывод или оставались старые имена и числа — повтори урок 6.5.
    question: >-
      Расскажи по шагам, как ты нашёл ошибку в подсчёте «Продлить»: как воспроизвёл, какую гипотезу
      проверил и чем подтвердил исправление.
    answer: >-
      Например так. Сравнил вывод с первым примером: «Продлить: 1» вместо 2 — ошибка
      воспроизводится на этих данных. Посчитал вручную: продлевать пора Боре (осталось 1) и Вике
      (0). Гипотеза — Боря с одним занятием не считается. Добавил в цикл временные строки
      `left = remaining(record)`, `renew_now = needs_renewal(record)` и
      `print(f"ОТЛАДКА: {left=} {renew_now=}")` — для Бори `left=1 renew_now=False`: гипотеза
      подтвердилась. Условие было `< 1`, а по правилу «одно или меньше» нужно `<= 1`.
      После исправления тот же ввод дал «Продлить: 2», второй пример не изменился. Запись Бори
      стала repro_line, отладочный print я убрал.
