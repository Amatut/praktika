id: m6-l6
module: m6
number: "6.6"
title: "Самостоятельная работа: почини чужую программу"
objective: >-
  Самостоятельно найти и исправить в незнакомой короткой программе ошибки трёх видов —
  синтаксическую, ошибку выполнения и логическую, — воспроизводя каждую и подтверждая исправление
  на тех же данных, а затем привести в порядок другую программу, не меняя её вывода.
minutes: [20, 30]
prerequisites: [m6-l1, m6-l2, m6-l3, m6-l5]
skills: [debugging, traceback-reading, clean-code]
environment: python

story:
  title: Программа от предшественника
  fictional: true
  text: >-
    Ярослав начал работать тренером на скалодроме и получил от предшественника две программы:
    одна ведёт абонементы — сколько занятий осталось и кому пора продлевать, другая считает оплату
    детской группы. Перед уходом предшественник что-то поправил в первой, и она перестала даже
    запускаться, а вторая работает, но разобраться в ней трудно: переменные называются `n`, `t` и
    `x`, а цена занятия записана в четырёх местах. Спросить, что и зачем менялось, не у кого — есть только код,
    комментарии в нём и тетрадь с посещениями. Ярослав просит тебя помочь: ты сам находишь ошибки,
    доказываешь каждое исправление и наводишь порядок, не ломая то, что работает.

why: >-
  Самостоятельная работа показывает, получается ли отлаживать без подсказок: воспроизвести
  ошибку, прочитать сообщение, проверить гипотезу и доказать исправление на тех же данных. Так
  чинят программы, которые достались от других людей.

usedIn: >-
  Поддержка чужого кода — обычная работа программиста: исправить ошибку в программе, которую писал
  другой человек, и не сломать то, что уже работало. Навести порядок в коде перед изменениями,
  не меняя его поведения, — тоже ежедневная часть этой работы.

steps:
  - id: before-start
    type: theory
    title: Перед стартом
    body: |-
      Сегодня самостоятельная работа — финиш модуля «Отладка и понятный код». Нового материала
      нет. В обоих заданиях подсказки откроются только после первой проверки — сначала попробуй
      сам.

      Порядок отладки, который ты прошёл за модуль:

      1. **Запусти** и прочитай сообщение снизу вверх: последняя строка, нижнее звено, звенья
         выше (урок 6.1).
      2. **Воспроизведи:** на каких данных ошибка повторяется каждый раз? Запиши их (6.2).
      3. **Гипотеза → проверка:** отладочный вывод вроде `print(f"ОТЛАДКА: {left=}")` или
         отладчик на компьютере (6.3, 6.4).
      4. **Одно исправление** — и снова запуск на тех же данных.
      5. Сообщений больше нет — **сверь вывод с примерами**: логическую ошибку Python не
         покажет.
      6. **Убери отладочный вывод.** Не трогай то, что работает.

      Уборка кода (6.5) идёт так же маленькими шагами: переименовал везде — запустил — сравнил
      вывод; вынес число в константу — запустил — сравнил.

      Как это устроено в тренажёре:

      - Проверка, на данных которой программа падает, не проходит. Пока примеры падают,
        отдельные зелёные проверки ещё ничего не значат. Ошибки Python показывает по одной:
        исправил одну — запусти снова.
      - В поле «Ввод для „Запустить“» уже стоит ввод из первого примера. Хочешь проверить одну
        запись — поменяй ввод там, не забыв первую строку с числом записей: `1`, а на следующей
        строке сама запись, например `Ира;10;4`.
      - Находку — запись, на которой старая версия ошибалась, — положи в переменную: проверка
        сама убедится, что ошибка на ней воспроизводится.

      Если время кончается, остановись после первого задания: второе можно сделать в другой день.
    simpler: >-
      Нового сегодня нет. В первой программе несколько ошибок: ищи их по одной — запуск,
      сообщение, одна правка, снова запуск, а когда Python замолчит, сравни вывод с примером. Во
      второй программе ошибок нет: сделай её понятнее так, чтобы вывод остался прежним.
    coach: >-
      Ошибиться на первой попытке нормально. Новое сообщение после правки — не шаг назад, а
      следующая ошибка.

  - id: warmup
    type: predict
    title: Разминка
    prompt: >-
      Перед отладкой — короткая разминка. Как думаешь, что покажет отладочный вывод с `=` в
      последней строке?
    code: |-
      def parse(line):
          parts = line.split(";")
          return {"boat": parts[0], "hours": parts[1]}


      order = parse("Катамаран;3")
      print(f"{order=}")
    options:
      - "order={'boat': 'Катамаран', 'hours': 3}"
      - "order={'boat': 'Катамаран', 'hours': '3'}"
      - "{'boat': 'Катамаран', 'hours': '3'}"
      - "order=Катамаран;3"
    answer: "order={'boat': 'Катамаран', 'hours': '3'}"
    explanation: >-
      `split` возвращает список строк, поэтому в словаре лежит `'3'` — текст, а не число 3. Знак
      `=` в f-строке печатает имя переменной и значение «как в коде», а у строк — кавычки.
      Кавычки вокруг числа в отладочном выводе — верный признак, что его забыли превратить в число
      через `int()`. Такие кавычки стоит замечать всегда.

  - id: debug-order
    type: order
    title: Шаги отладки по порядку
    prompt: >-
      Программа падает или выдаёт неверный ответ. Расставь шаги отладки по порядку — так, как ты
      будешь работать в главном задании.
    items:
      - id: reproduce
        text: Запустить на данных, где видна ошибка, и записать эти данные
      - id: read
        text: Прочитать traceback снизу вверх, а если его нет — найти первое расхождение вывода с ожидаемым
      - id: hypothesis
        text: Выдвинуть одну гипотезу о причине
      - id: check
        text: Проверить гипотезу отладочным выводом или в отладчике
      - id: fix
        text: Исправить одну причину
      - id: rerun
        text: Запустить снова на тех же данных и на старых примерах
      - id: cleanup
        text: Убрать отладочный вывод
    before:
      - [reproduce, hypothesis]
      - [read, hypothesis]
      - [hypothesis, check]
      - [check, fix]
      - [fix, rerun]
      - [fix, cleanup]
    explanation: >-
      Прочитать сообщение и записать данные, на которых ошибка повторяется, можно в любом порядке,
      но оба шага — до гипотезы. Без воспроизведения гипотезу не на чем проверить: неизвестно, на
      какие данные смотреть. Одна гипотеза — одна правка, иначе не понять, что помогло, а что
      сломало. Запуск на тех же данных — доказательство, что ошибка исправлена, а старые примеры
      показывают, что ничего не сломалось. Отладочный вывод можно убрать до этого запуска или
      после — главное, до «Проверить»: с лишними строками вывод не совпадёт с примером, и проверка
      не пройдёт.
    coach: >-
      Этот порядок пригодится и в итогах урока: там нужно будет рассказать, как ты воспроизвёл
      ошибку, что проверил и чем подтвердил исправление.

  - id: main-task
    type: exercise
    title: Главное задание
    exercise:
      id: m6-l6-e1
      kind: fix
      title: Абонементы скалодрома
      statement: |-
        **Самостоятельная работа модуля 6.** Подсказки откроются после первой проверки — сначала
        попробуй сам.

        Почини программу учёта абонементов скалодрома. Она читает число записей, потом сами
        записи в виде `Имя;куплено;посещено`. Для каждой записи программа печатает, сколько
        занятий осталось, или «абонемент закончился», а в конце — сколько абонементов пора
        продлить. Продлевать пора, когда осталось **одно занятие или меньше**.

        В программе несколько ошибок разного вида. Что должна делать каждая функция, написано в
        комментарии к ней. Не переименовывай функции — проверка вызывает их по именам. Для ввода
        из первого примера программа должна напечатать:

        ```text
        Аня: осталось 3
        Боря: осталось 1
        Вика: абонемент закончился
        Продлить: 2
        ```

        **Доказательство.** Когда найдёшь ошибку в подсчёте «Продлить», запиши в переменную
        `repro_line` одну запись в том же виде, что во вводе, — `Имя;куплено;посещено`, — на
        которой старая версия считала неверно. Проверка сравнит на этой записи старое правило и
        твоё.
      input: >-
        Первая строка — число записей (0 или больше), дальше по записи на строке:
        `Имя;куплено;посещено`. Числа целые, посещено не больше, чем куплено.
      output: >-
        По строке на запись — `Имя: осталось N` или `Имя: абонемент закончился`, последняя строка —
        `Продлить: K`. В коде есть переменная `repro_line`.
      constraints:
        - Подсказки откроются после первой проверки — сначала попробуй сам.
        - Исправляй по одной ошибке и после каждой правки запускай программу.
        - Не переименовывай функции и не меняй формат вывода.
        - Перед «Проверить» убери отладочный вывод.
      starterCode: |
        # Учёт абонементов скалодрома.
        # Ввод: первая строка — число записей, дальше записи «Имя;куплено;посещено».


        def parse(line):
            # "Аня;8;5" -> {"name": "Аня", "bought": 8, "visited": 5}
            parts = line.split(";")
            return {"name": parts[0], "bought": int(parts[1]), "visited": parts[2]}


        def remaining(record):
            # Сколько занятий осталось.
            return record["bought"] - record["visited"]


        def needs_renewal(record):
            # Продлевать пора, когда осталось одно занятие или меньше.
            return remaining(record) < 1


        def status(record):
            # Строка для списка: сколько осталось или «абонемент закончился».
            left = remaining(record)
            if left == 0
                return f"{record['name']}: абонемент закончился"
            return f"{record['name']}: осталось {left}"


        count = int(input())
        renew = 0
        for i in range(count):
            record = parse(input())
            print(status(record))
            if needs_renewal(record):
                renew = renew + 1
        print(f"Продлить: {renew}")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "3\nАня;8;5\nБоря;8;7\nВика;4;4\n"
          expected: |-
            Аня: осталось 3
            Боря: осталось 1
            Вика: абонемент закончился
            Продлить: 2
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "2\nГлеб;10;2\nДина;6;6\n"
          expected: |-
            Глеб: осталось 8
            Дина: абонемент закончился
            Продлить: 1
        - id: t3
          kind: io
          title: "Граничный случай: записей нет"
          edge: true
          stdin: "0\n"
          expected: "Продлить: 0"
        - id: t4
          kind: io
          title: "Граничный случай: осталось одно занятие"
          edge: true
          stdin: "1\nЕва;12;11\n"
          expected: |-
            Ева: осталось 1
            Продлить: 1
        - id: t5
          kind: call
          title: "parse: результат как в комментарии к ней"
          stdin: "0\n"
          call: parse("Аня;8;5")
          expected: "{'name': 'Аня', 'bought': 8, 'visited': 5}"
        - id: t6
          kind: call
          title: "needs_renewal: осталось одно занятие"
          edge: true
          stdin: "0\n"
          call: 'needs_renewal({"name": "Ева", "bought": 12, "visited": 11})'
          expected: "True"
        - id: t7
          kind: call
          title: "needs_renewal: занятий не осталось"
          edge: true
          stdin: "0\n"
          call: 'needs_renewal({"name": "Дина", "bought": 6, "visited": 6})'
          expected: "True"
        - id: t8
          kind: call
          title: "needs_renewal: осталось два занятия"
          edge: true
          stdin: "0\n"
          call: 'needs_renewal({"name": "Жора", "bought": 5, "visited": 3})'
          expected: "False"
        - id: t9
          kind: assert
          title: repro_line — одна запись из ввода
          stdin: "0\n"
          code: |
            _parts = str(repro_line).split(";")
            assert len(_parts) == 3
            assert _parts[0].strip() != ""
            assert _parts[1].strip().isdigit() and _parts[2].strip().isdigit()
          message: >-
            repro_line — одна запись в том же виде, что во вводе: Имя;куплено;посещено, два числа
            через точку с запятой после имени.
        - id: t10
          kind: assert
          title: На записи repro_line старая версия ошибалась
          stdin: "0\n"
          code: |
            _parts = str(repro_line).split(";")
            assert len(_parts) == 3 and _parts[1].strip().isdigit() and _parts[2].strip().isdigit()
            _record = {"name": _parts[0].strip(), "bought": int(_parts[1]), "visited": int(_parts[2])}
            _left = _record["bought"] - _record["visited"]
            _old_answer = _left < 1  # так отвечала старая needs_renewal
            assert needs_renewal(_record) != _old_answer
          message: >-
            На записи repro_line старое правило «Продлить» и твоё должны отвечать по-разному: это
            запись, на которой ошибка воспроизводится и на которой видно, что её больше нет.
      criteria:
        - Программа запускается и не падает на примерах и граничных случаях.
        - Вывод совпадает с примерами строка в строку.
        - Каждая функция делает то, что написано в комментарии к ней.
        - «Продлить» считается по правилу из условия — в том числе на границе.
        - repro_line — запись `Имя;куплено;посещено`, на которой старая проверка отвечала неверно.
        - Отладочного вывода в программе нет, функции не переименованы.
      hints:
        - >-
          Работай по кругу: запуск → сообщение снизу вверх → одна правка → снова запуск. Когда
          сообщений не останется, сравни вывод с первым примером построчно: какая строка не
          совпала и какие записи должны были в неё попасть?
        - |-
          Тот же круг на другом коде — учёт книг в библиотеке. Программа падает с TypeError в
          функции `days_late(book)` на строке `return book["days"] - 14`, а функции `read_book`,
          которая собрала `book`, в traceback нет: она уже отработала. `print(f"ОТЛАДКА: {book=}")`
          перед вызовом показывает `'days': '20'` — кавычки выдают строку, значит, исправлять нужно
          там, где словарь создаётся.

          А правило «штраф, если книгу вернули хотя бы на день позже срока» с условием
          `days_late(book) > 1` ошибается ровно на границе. Поэтому его проверяют на книге, которую
          вернули ровно на один день позже.
        - |-
          Три места:

          1. Строка с `if` в status — Python прямо назовёт, чего в ней не хватает.
          2. parse: одно поле словаря осталось строкой, хотя по комментарию там число — сделай его
             числом так же, как bought.
          3. needs_renewal: сравни условие с комментарием над ним на записи, где осталось ровно
             одно занятие.

          Потом `repro_line = "…"` — такая запись есть в первом примере — и убери отладку.
      solution:
        code: |
          # Учёт абонементов скалодрома.
          # Ввод: первая строка — число записей, дальше записи «Имя;куплено;посещено».


          def parse(line):
              # "Аня;8;5" -> {"name": "Аня", "bought": 8, "visited": 5}
              parts = line.split(";")
              return {"name": parts[0], "bought": int(parts[1]), "visited": int(parts[2])}


          def remaining(record):
              # Сколько занятий осталось.
              return record["bought"] - record["visited"]


          def needs_renewal(record):
              # Продлевать пора, когда осталось одно занятие или меньше.
              return remaining(record) <= 1


          def status(record):
              # Строка для списка: сколько осталось или «абонемент закончился».
              left = remaining(record)
              if left == 0:
                  return f"{record['name']}: абонемент закончился"
              return f"{record['name']}: осталось {left}"


          # Запись, на которой старая версия ошибалась: осталось 1, а «Продлить» её не считал.
          repro_line = "Боря;8;7"

          count = int(input())
          renew = 0
          for i in range(count):
              record = parse(input())
              print(status(record))
              if needs_renewal(record):
                  renew = renew + 1
          print(f"Продлить: {renew}")
        explanation: |-
          Ошибок три, и каждая находится своим способом.

          1. **Синтаксическая.** Программа не запускалась: `SyntaxError: expected ':'` в строке 24
             — после условия `if left == 0` нет двоеточия. Не выполнилась ни одна строка.
          2. **Ошибка выполнения.** После двоеточия появился traceback из трёх звеньев:
             `<module>` (строка 33) → `status` (строка 23) → `remaining` (строка 13) и
             `TypeError: unsupported operand type(s) for -: 'int' and 'str'`. Строка 13 верна: из
             числа вычитается строка, которая пришла готовой. Создала её parse — в цепочке её уже
             нет, она отработала раньше. `print(f"ОТЛАДКА: {record=}")` перед
             `print(status(record))` показывает `'visited': '5'` в кавычках, а по комментарию parse
             возвращает числа. Поэтому `int(parts[2])` ставится в parse — там, где значение
             появилось.
          3. **Логическая.** Python молчит, но в первом примере «Продлить: 1» вместо 2. Вручную:
             продлевать пора Боре (осталось 1) и Вике (0). Гипотеза — Боря не считается. Временные
             строки в цикле `left = remaining(record)`, `renew_now = needs_renewal(record)` и
             `print(f"ОТЛАДКА: {left=} {renew_now=}")` показывают для Бори
             `ОТЛАДКА: left=1 renew_now=False`: условие `< 1` не включает границу. По правилу «одно
             или меньше» нужно `<= 1`. Запись Бори `Боря;8;7` и есть воспроизведение — она
             записана в `repro_line`.

          После исправления тот же ввод даёт «Продлить: 2», второй пример и граничные случаи не
          изменились, отладочный вывод убран.
      altSolutions:
        - code: |
