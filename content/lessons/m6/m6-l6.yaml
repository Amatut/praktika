  - id: second-task
    type: exercise
    title: Вторая задача
    exercise:
      id: m6-l6-e2
      kind: modify
      title: "Оплата детской группы: понятнее, не ломая"
      statement: |-
        **Вторая задача самостоятельной работы.** Подсказки откроются после первой проверки.

        Вторая программа предшественника считает оплату детской группы скалодрома за месяц.
        Занятие стоит 350 руб., а если у ребёнка за месяц 4 занятия или больше — скидка 200 руб. с
        суммы. Программа читает число детей, потом строки `Имя;занятий` и печатает, сколько платит
        каждый, и итог.

        Программа работает верно, но читать её трудно. Приведи её в порядок, **не меняя вывода**:

        1. Имена `n`, `t`, `x` замени говорящими. Короткое `i` для счётчика цикла можно оставить,
           а новых однобуквенных имён не заводи.
        2. Числа 350, 4 и 200 должны встречаться в коде по одному разу — в константах в начале
           программы, с именами ЗАГЛАВНЫМИ буквами.
        3. Сколько платит один ребёнок за месяц, считает функция `month_cost(lessons)`: получает
           число занятий и возвращает сумму за все занятия месяца — со скидкой, если она положена.
           Основная часть вызывает её, а не считает сама.

        Меняй по шагу и после каждого запускай с вводом первого примера — вывод должен оставаться
        прежним.
      input: >-
        Первая строка — число детей (0 или больше), дальше по строке на ребёнка: `Имя;занятий`
        (целое число, 0 или больше).
      output: >-
        По строке на ребёнка — `Имя: сумма`, последняя строка — `Всего: сумма`. Ровно как у старой
        программы.
      constraints:
        - Подсказки откроются после первой проверки — сначала попробуй сам.
        - Вывод не меняется — ни новых слов, ни других пробелов.
        - Переименовывай во всех местах и запускай после каждого шага.
      starterCode: |
        n = int(input())
        t = 0
        for i in range(n):
            x = input().split(";")
            if int(x[1]) >= 4:
                t = t + int(x[1]) * 350 - 200
                print(x[0] + ": " + str(int(x[1]) * 350 - 200))
            else:
                t = t + int(x[1]) * 350
                print(x[0] + ": " + str(int(x[1]) * 350))
        print("Всего: " + str(t))
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "3\nМиша;4\nНика;2\nОля;8\n"
          expected: |-
            Миша: 1200
            Ника: 700
            Оля: 2600
            Всего: 4500
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "2\nКира;3\nСтёпа;5\n"
          expected: |-
            Кира: 1050
            Стёпа: 1550
            Всего: 2600
        - id: t3
          kind: io
          title: "Граничный случай: ноль занятий"
          edge: true
          stdin: "1\nПётр;0\n"
          expected: |-
            Пётр: 0
            Всего: 0
        - id: t4
          kind: io
          title: "Граничный случай: детей нет"
          edge: true
          stdin: "0\n"
          expected: "Всего: 0"
        - id: t5
          kind: call
          title: month_cost — три занятия
          example: true
          stdin: "0\n"
          call: month_cost(3)
          expected: "1050"
        - id: t6
          kind: call
          title: "month_cost — ровно 4 занятия"
          edge: true
          stdin: "0\n"
          call: month_cost(4)
          expected: "1200"
        - id: t7
          kind: call
          title: month_cost — ноль занятий
          edge: true
          stdin: "0\n"
          call: month_cost(0)
          expected: "0"
        - id: t8
          kind: assert
          title: Говорящие имена
          stdin: "0\n"
          code: |
            import ast

            _tree = ast.parse(open(__file__, encoding="utf-8").read())
            _short = set()
            for _node in ast.walk(_tree):
                if isinstance(_node, ast.Name) and len(_node.id) == 1:
                    _short.add(_node.id)
                elif isinstance(_node, ast.arg) and len(_node.arg) == 1:
                    _short.add(_node.arg)
            assert not (_short - {"i", "j", "k", "_"}), _short
          message: >-
            В коде остались однобуквенные имена вроде n, t или x — дай им говорящие имена. Короткое
            i можно оставить для счётчика цикла.
        - id: t9
          kind: assert
          title: Числа — в константах
          stdin: "0\n"
          code: |
            import ast

            _tree = ast.parse(open(__file__, encoding="utf-8").read())


            def _written(number):
                found = 0
                for node in ast.walk(_tree):
                    if isinstance(node, ast.Constant) and type(node.value) is int and node.value == number:
                        found = found + 1
                return found


            def _pairs(node):
                pairs = []
                for target in node.targets:
                    if isinstance(target, ast.Name):
                        pairs.append((target, node.value))
                    elif isinstance(target, ast.Tuple) and isinstance(node.value, ast.Tuple):
                        pairs.extend(zip(target.elts, node.value.elts))
                return pairs


            def _in_constant(number):
                for node in _tree.body:
                    if isinstance(node, ast.Assign):
                        for target, value in _pairs(node):
                            if (isinstance(target, ast.Name) and target.id.isupper()
                                    and isinstance(value, ast.Constant)
                                    and type(value.value) is int and value.value == number):
                                return True
                return False


            for _number in (350, 4, 200):
                assert _written(_number) == 1 and _in_constant(_number), _number
          message: >-
            Числа 350, 4 и 200 должны встречаться в коде по одному разу — в константах с именами
            ЗАГЛАВНЫМИ буквами, например `PRICE_PER_LESSON = 350`.
