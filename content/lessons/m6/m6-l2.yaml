            читает. Без него ошибка повторяется точно так же.
          try: >-
            Убирай поля по одному и после каждого запускай вызов. Оставь только те, без которых
            ошибка меняется.
          verify: Нажми «Проверить» — проверка «Ничего лишнего» должна пройти.
      afterPass: >-
        Шесть полей превратились в одно, и причину видно без отладки: вес пришёл строкой. Такой
        пример прикладывают к описанию ошибки для разработчиков — вместе с «вход → ожидалось →
        получилось».
