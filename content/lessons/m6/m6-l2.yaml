            исходными значениями.
          verify: Нажми «Проверить» — проверка «Та же ошибка в той же строке» должна пройти.
        - id: extra-field
          when:
            failedTest: t2
            codeRegex: '^[ \t]*minimal_order\s*='
          why: >-
