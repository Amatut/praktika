        - id: data-fixed-again
          when:
            codeRegex: '["'']weight["'']\s*:\s*7\b|order_17\s*\[\s*["'']weight["'']\s*\]\s*='
            errorIncludes: "not supported between instances of 'str' and 'int'"
          why: >-
            Ты поправил данные, а не программу: заказ №17 теперь считается, но следующий заказ
            с сайта снова придёт с весом-строкой — и функция снова упадёт.
          try: >-
            Верни заказу №17 вес строкой `"7"` — без превращения перед вызовом — и преврати вес
            в число внутри функции.
          verify: Нажми «Проверить» — проверка «Заказ №17 с сайта» должна пройти.
        - id: still-str
          when:
            errorIncludes: "not supported between instances of 'str' and 'int'"
          why: >-
            В условии `if` вес всё ещё сравнивается строкой: `"7" > 5` Python выполнить не может.
          try: >-
            Преврати вес в число до сравнения и сравнивай уже его — сохрани число в переменную
            или сделай превращение прямо в условии.
          verify: Нажми «Запустить» — должно получиться «Заказ №17» с ценой 250.
        - id: int-not-float
          when:
            errorIncludes: "'5.5'"
          why: >-
            `int()` не понимает дробную запись `"5.5"` и падает с ValueError. А вес бывает
            дробным.
          try: Используй превращение, которое понимает и целые, и дробные числа, — `float()`.
          verify: 'Нажми «Проверить» — «Граничный случай: дробный вес строкой» должен дать 500.'
        - id: string-compare
          when:
            errorIncludes: "not supported between instances of 'int' and 'str'"
          why: >-
            Сравнение со строкой `"5"` ломается на заказах из приложения, где вес — число. К тому
            же строки сравниваются по буквам: `"10" > "5"` — False.
          try: Сравнивай числа — преврати вес в число, а 5 оставь числом.
          verify: Нажми «Запустить» — старые заказы должны дать 300 и 250.
        - id: minimal-check
          when:
            errorType: KeyError
            errorIncludes: express
            codeRegex: '\{\s*["'']weight["'']\s*:\s*["'']7["'']\s*,?\s*\}'
          why: >-
