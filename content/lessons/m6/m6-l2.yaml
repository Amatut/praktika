  - id: practice-fix
    type: exercise
    title: Практика 3
    exercise:
      id: m6-l2-e3
      kind: fix
      title: Вес строкой
      statement: |-
        Теперь почини `delivery_price` сам. Описание ошибки у тебя уже есть:

        - **вход:** заказ №17 — вес пришёл строкой `"7"`;
        - **ожидалось:** 250;
        - **получилось:** TypeError в строке с весом.

        Вес приходит и числом (из приложения), и строкой (с сайта) и бывает дробным — например,
        `"2.5"`. Правила прежние: доставка стоит 150, если вес больше 5 кг — плюс 100, экспресс —
        вдвое дороже.

        Проверь исправление, как в теории: на заказе №17, на котором ошибка воспроизводилась, и на
        старых заказах, которые работали. Строка для заказа №17 уже есть — допиши в конец такие
        же для `order_12` и `order_15`. После «Запустить» должно получиться:

        ```text
        Заказ №17: 250
        Заказ №12: 300
        Заказ №15: 250
        ```
      input: Ввода нет — заказы записаны в программе.
      output: >-
        Три строки — цена заказа №17 и двух старых заказов. Функция `delivery_price` возвращает
        цену и для веса-числа, и для веса-строки.
      constraints:
        - Данные заказов не меняй — чини функцию.
        - Правила цены прежние, ровно 5 кг — ещё без доплаты.
      starterCode: |
        def delivery_price(order):
            price = 150
            if order["weight"] > 5:
                price = price + 100
            if order["express"]:
                price = price * 2
            return price


        # Заказ №17 с сайта: на нём ошибка воспроизводилась
        order_17 = {
            "id": 17,
            "client": "Петрова",
            "address": "ул. Садовая, 5",
            "weight": "7",
            "express": False,
            "comment": "позвонить за час",
        }
        # Старые заказы из приложения: на них всё работало
        order_12 = {"id": 12, "weight": 3, "express": True}
        order_15 = {"id": 15, "weight": 8, "express": False}

        print("Заказ №17:", delivery_price(order_17))
      tests:
        - id: t1
          kind: io
          title: Заказ №17 и старые заказы
          example: true
          expected: |-
            Заказ №17: 250
            Заказ №12: 300
            Заказ №15: 250
          compare:
            ignoreSpaces: true
        - id: t2
          kind: call
          title: Заказ №17 с сайта
          example: true
          call: 'delivery_price({"id": 17, "weight": "7", "express": False})'
          expected: "250"
        - id: t3
          kind: call
          title: Старый заказ из приложения
          example: true
          call: 'delivery_price({"weight": 3, "express": True})'
          expected: "300"
        - id: t4
          kind: call
          title: "Граничный случай: ровно 5 кг"
          edge: true
          call: 'delivery_price({"weight": "5", "express": False})'
          expected: "150"
        - id: t5
          kind: call
          title: "Граничный случай: дробный вес строкой"
          edge: true
          call: 'delivery_price({"weight": "5.5", "express": True})'
          expected: "500"
        - id: t6
          kind: call
          title: Дробный вес числом
          call: 'delivery_price({"weight": 12.5, "express": True})'
          expected: "500"
        - id: t7
          kind: call
          title: "Граничный случай: чуть больше 5 кг"
          edge: true
          call: 'delivery_price({"weight": "5.2", "express": False})'
          expected: "250"
      criteria:
        - Программа не падает на заказе №17 и выдаёт для него 250.
        - Старые заказы с весом-числом считаются как раньше, и программа печатает их цены.
        - Дробный вес строкой (`"5.5"`) понимается, ровно 5 кг — без доплаты.
        - Данные заказов не изменены — исправлена функция.
      hints:
        - >-
          Что общего у `"7"` и `7`, если превратить их в число? И какая функция превращения
          понимает дробную запись `"5.5"`?
        - >-
          `float("2.5")` даёт 2.5, `float(3)` — 3.0, `float("7")` — 7.0: `float` одинаково
          принимает и строки, и числа. А `int("5.5")` падает с ValueError.
        - |-
          Каркас начала функции:
          ```text
          def delivery_price(order):
              weight = …(order["weight"])   # вес как число
              price = 150
              if weight > 5:
                  …
          ```
          А в конце программы — ещё две строки `print("Заказ №…:", delivery_price(…))`.
      solution:
        code: |
          def delivery_price(order):
              weight = float(order["weight"])
              price = 150
              if weight > 5:
                  price = price + 100
              if order["express"]:
                  price = price * 2
              return price


          # Заказ №17 с сайта: на нём ошибка воспроизводилась
          order_17 = {
              "id": 17,
              "client": "Петрова",
              "address": "ул. Садовая, 5",
              "weight": "7",
              "express": False,
              "comment": "позвонить за час",
          }
          # Старые заказы из приложения: на них всё работало
          order_12 = {"id": 12, "weight": 3, "express": True}
          order_15 = {"id": 15, "weight": 8, "express": False}

          print("Заказ №17:", delivery_price(order_17))
          print("Заказ №12:", delivery_price(order_12))
          print("Заказ №15:", delivery_price(order_15))
        explanation: >-
          `float()` превращает в число и строку `"7"`, и дробную `"5.5"`, и число `3`, поэтому
          дальше функция сравнивает только числа. Исправление проверено на том же заказе №17, на
          котором ошибка воспроизводилась, и на старых заказах: они считаются как раньше.
          Минимальный пример `{"weight": "7"}` для этой проверки не годится: после исправления
          функция дойдёт до `express`, а его в примере нет. Нужны полные данные.
