            failedTest: t1
            codeRegex: '^[ \t]*minimal_order\s*='
          why: >-
            На `minimal_order` функция падает не так, как на заказе №17, или не падает вовсе.
            Пример воспроизводит ошибку, только если совпадает всё: TypeError, сообщение
            `'>' not supported between instances of 'str' and 'int'` и строка с весом.
          try: >-
            Убери `#` перед вызовом и нажми «Запустить» — какая ошибка теперь? Если другая, верни
