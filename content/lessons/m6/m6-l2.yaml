          verify: 'Нажми «Запустить» — должно появиться «Всего минут: 5550».'
        - id: still-crashes
          when:
            errorType: IndexError
          why: >-
            Подсчёт всё ещё падает: в табеле есть запись, у которой `to_minutes` не находит
            вторую часть — минуты.
          try: >-
            Найди эту запись. Запусти цикл на половине табеля (`shifts[:10]`) или напечатай
            запись отдельной строкой перед вызовом `to_minutes`.
          verify: Когда найдёшь запись, запиши её в `bad_shift` и исправь в табеле — ошибка исчезнет.
        - id: last-ok
          when:
            failedTest: t2
            codeRegex: 'bad_shift\s*=\s*["'']3:30["'']'
          why: >-
            `"3:30"` — последняя запись, которая обработалась без ошибки. Если печатать запись
            вместе с результатом, строка про виновника не успевает появиться: расчёт падает раньше.
          try: Возьми следующую запись после `"3:30"` — в том виде, в каком она стояла в табеле.
          verify: Нажми «Проверить» — проверка «Запись воспроизводит ошибку» должна пройти.
        - id: no-finding
          when:
            failedTest: t3
            codeRegex: 'bad_shift\s*=\s*(""|'''')'
          why: >-
            В `bad_shift` пустая строка — находка не записана. А пустая строка — не запись из
            табеля.
          try: Запиши в `bad_shift` запись в том виде, в каком она стояла в табеле до исправления.
          verify: Нажми «Проверить» — проверка «Запись из табеля» должна пройти.
        - id: not-reproducing
          when:
            failedTest: t2
            codeRegex: '^[ \t]*bad_shift[ \t]*=(?![ \t]*["'']6\.00["''][ \t]*(#.*)?$)'
          why: >-
            На записи из `bad_shift` исходная `to_minutes` не падает с IndexError. Возможно, там
            уже исправленная запись, число без кавычек или другая запись табеля.
          try: >-
            Нужна строка в кавычках — та запись, на которой подсчёт падал, в виде до
            исправления. Проверь её сам: временно добавь `to_minutes(bad_shift)` и нажми
            «Запустить», а потом поставь перед этой строкой `#`.
          verify: Нажми «Проверить» — проверка «Запись воспроизводит ошибку» должна пройти.
        - id: slice-left
          when:
            failedTest: t1
            codeRegex: '^[ \t]*for\s+\w+\s+in\s+shifts\s*\[[^\n]*\n[ \t]+total'
          why: >-
            В цикле подсчёта остался срез — он был нужен для поиска. Теперь итог считается не по
            всему табелю, а только по его части.
          try: Верни в цикле подсчёта весь список — `for shift in shifts:`.
          verify: 'Итог должен стать «Всего минут: 5550».'
        - id: record-deleted
          when:
            outputEquals: "Всего минут: 5190"
          why: >-
            Шестичасовая смена не попала в итог: 5190 минут вместо 5550. Ошибка ушла вместе с
            записью, а запись нужна.
          try: Верни запись в табель и исправь её на формат «часы:минуты».
          verify: 'Итог должен стать «Всего минут: 5550».'
        - id: print-left
          when:
            failedTest: t1
            codeRegex: '^[ \t]+print\('
            outputIncludes: "Всего минут"
          why: >-
            В выводе остались записи табеля — это была проверка для поиска, а по условию
            программа печатает только итог.
          try: >-
            Убери временный поиск: отладочный `print` — в цикле или внутри `to_minutes` — удали
            или поставь перед ним `#`.
          verify: 'Вывод должен состоять из одной строки «Всего минут: 5550».'
      afterPass: >-
        Одна запись из двадцати — минимальный пример по данным: на ней ошибка повторяется за
        секунду. Точку вместо двоеточия глазами легко пропустить, а деление пополам находит её за
        несколько запусков — и на трёхстах записях тоже.
      skills: [debugging, lists]

  - id: practice-shrink
    type: exercise
    title: Практика 2
    exercise:
      id: m6-l2-e2
      kind: modify
      title: Заказ №17 до сути
      statement: |-
        Интернет-магазин комнатных растений считает стоимость доставки. На заказе №17 функция
        `delivery_price` падает с TypeError. Чтобы показать ошибку разработчику, сократи заказ до
        минимального примера.

        1. Убери `#` перед строкой с вызовом и нажми «Запустить» — запомни тип ошибки, сообщение
           и строку.
        2. Удали из `minimal_order` одно поле и запусти снова. Ошибка та же — тот же тип, то же
           сообщение, та же строка? Значит, поле было лишним. Пропала или сменилась — верни поле.
        3. Повтори, пока лишних полей не останется.
        4. Перед «Проверить» верни `#` перед вызовом: проверка сама вызовет
           `delivery_price(minimal_order)` и сравнит ошибку с исходной.

        Функцию не меняй — чинить её ты будешь в следующем задании.
      input: Ввода нет — заказ №17 записан в программе.
      output: >-
        Вывода нет: проверка сама вызывает функцию с `minimal_order` и сравнивает ошибку с
        исходной.
      constraints:
        - Функцию `delivery_price` не меняй.
        - Значения оставшихся полей не меняй — ошибка должна повторяться так же, как на заказе №17.
      starterCode: |
        def delivery_price(order):
            price = 150
            if order["weight"] > 5:
                price = price + 100
            if order["express"]:
                price = price * 2
            return price


        minimal_order = {
            "id": 17,
            "client": "Петрова",
            "address": "ул. Садовая, 5",
            "weight": "7",
            "express": False,
            "comment": "позвонить за час",
        }

        # Для проверки убери # и нажми «Запустить»; перед «Проверить» верни #
        # print(delivery_price(minimal_order))
      tests:
        - id: t1
          kind: assert
          title: Та же ошибка в той же строке
          example: true
          code: |
            import traceback

            _order = minimal_order
            _kind, _text, _frame = None, None, None
            try:
                delivery_price(_order)
            except Exception as _error:
                _kind = type(_error).__name__
                _text = str(_error)
                _frame = traceback.extract_tb(_error.__traceback__)[-1]
            assert _kind == "TypeError"
            assert _text == "'>' not supported between instances of 'str' and 'int'"
            assert _frame.name == "delivery_price" and "weight" in (_frame.line or "")
          message: >-
            delivery_price(minimal_order) падает так же, как на заказе №17: тот же тип ошибки, то
            же сообщение, та же строка.
        - id: t2
          kind: assert
          title: Ничего лишнего
          code: |
            import traceback


            def _signature(order):
                try:
                    delivery_price(order)
                except Exception as error:
                    frame = traceback.extract_tb(error.__traceback__)[-1]
                    return type(error).__name__, str(error), frame.name, frame.lineno
                return None


            _original = _signature(minimal_order)
            _extra = []
            for _key in minimal_order:
                _smaller = dict(minimal_order)
                del _smaller[_key]
                if _signature(_smaller) == _original:
                    _extra.append(_key)
            assert _extra == []
          message: >-
            В примере осталось поле, без которого ошибка повторяется точно так же. Убери его и
            проверь, что ошибка не изменилась.
      criteria:
        - "`delivery_price(minimal_order)` падает так же, как на полном заказе: TypeError с тем же сообщением в строке с весом."
        - В примере нет полей, без которых ошибка всё равно повторяется.
        - Функция не изменена, строка с вызовом закомментирована или удалена.
      hints:
        - >-
          Какие поля `delivery_price` успевает прочитать до строки, где падает? Остальные для
          ошибки не нужны.
        - >-
          На другом примере: `average(team)` делит `team["points"] / team["games"]` и падает с
          ZeroDivisionError, когда игр 0. Поля `city` и `coach` функция до ошибки не читает,
          поэтому для воспроизведения хватит `{"points": 12, "games": 0}`.
        - >-
          Удаляй по одному полю: убрал поле → «Запустить» → та же TypeError в той же строке?
          Значит, поле было лишним. Если ошибка сменилась на KeyError, поле нужно — верни его.
          В конце останется одно поле; перед «Проверить» верни `#` перед вызовом.
      solution:
        code: |
          def delivery_price(order):
              price = 150
              if order["weight"] > 5:
                  price = price + 100
              if order["express"]:
                  price = price * 2
              return price


          minimal_order = {"weight": "7"}

          # Для проверки убери # и нажми «Запустить»; перед «Проверить» верни #
