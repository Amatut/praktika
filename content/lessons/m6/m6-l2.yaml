            shifts = [
                "4:30", "6:15", "3:45", "5:00", "4:20", "6:40", "2:50", "5:30", "4:05", "3:15",
                "6:00", "4:45", "5:10", "3:30", "6.00", "4:15", "5:45", "2:40", "4:55", "3:20",
            ]

            bad_shift = shifts[14]
            shifts[14] = '06:00'

            total = 0
            for shift in shifts:
                # print(shift)
                total += to_minutes(shift)
            print(f"Всего минут: {total}")
          note: >-
            Находка взята из списка по номеру, запись исправлена присваиванием на «06:00»,
            отладочный print закомментирован, вывод f-строкой.
