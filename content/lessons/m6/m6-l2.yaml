  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Воспроизвести ошибку — найти точные данные, на которых она повторяется при каждом запуске.
      - >-
        Запись-виновника ищут делением пополам или выводом каждой записи отдельной строкой перед
        обработкой. Последняя строка, напечатанная вместе с результатом, — последняя удачная, а не
        виновник.
      - >-
        Минимальный пример: убирай по одному и запускай, пока ошибка та же — тот же тип, то же
        сообщение, та же строка кода. Сменилась — верни последнее, что убрал.
      - Исправление проверяй на данных, на которых ошибка воспроизводилась, и на старых данных, которые работали.
    question: >-
      Ты исправил функцию, и TypeError на минимальном примере больше нет. Этого достаточно, чтобы
      считать ошибку исправленной?
    answer: >-
      Нет. Нужно запустить программу и на исходных данных, на которых ошибка воспроизводилась, и
      на старых, которые работали: исправление могло их сломать. К тому же на минимальном примере
      исправленная функция может пойти дальше и упасть на поле, которое ты убрал, — как на
      `express` в заказе №17. Это не новая ошибка, просто для проверки нужны полные данные.
