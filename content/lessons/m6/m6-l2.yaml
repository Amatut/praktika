id: m6-l2
module: m6
number: "6.2"
title: "Воспроизвести ошибку: минимальный пример"
objective: >-
  Находить входные данные, на которых ошибка повторяется, сокращать их до минимального примера и
  проверять исправление на этом же примере и на старых данных.
minutes: [20, 30]
prerequisites: [m6-l1]
skills: [debugging]
environment: python

story:
  title: Утренний сеанс без точки с запятой
  fictional: true
  text: >-
    Администратор кинотеатра Эльвира каждый вечер собирает отчёт о продажах: программа читает
    журнал из трёхсот записей «фильм;билетов» и считает выручку. Сегодня отчёт упал с IndexError:
    traceback показал строку в функции, но не сказал, какая из трёхсот записей виновата. Эльвира
    запустила отчёт на первой половине журнала — работает, на второй — падает, потом на четверти,
    на восьмой части и дальше. Через девять запусков осталась одна запись — «Утренний сеанс 18»:
    кассир поставил пробел вместо точки с запятой. Эту строку Эльвира сохранила отдельно: на ней
    ошибка повторяется за секунду, на ней же она проверила исправление.

why: >-
  Пока ошибка случается «иногда», нельзя ни понять её, ни честно проверить исправление. Если
  знаешь точные данные, на которых она повторяется, — например, запись «Утренний сеанс 18» без
  точки с запятой, — причина обычно видна за минуту.

usedIn: >-
  Минимальный пример просят приложить к описанию ошибки почти во всех командах и открытых
  проектах: без него ошибку трудно даже начать искать. Из него же потом делают автоматический
  тест, чтобы ошибка не вернулась, — об этом модуль 9.

steps:
  - id: reproduce
    type: theory
    title: Воспроизвести и сократить
    body: |-
      **Воспроизвести** ошибку — узнать точные входные данные, на которых она повторяется при
      каждом запуске.

      Traceback говорит, *где* программа остановилась, но не всегда — *на каких данных*.
      `IndexError` и `ZeroDivisionError` о данных молчат, `KeyError` называет только ключ, а
      `ValueError` показывает значение, но не номер записи.

      **Как найти запись-виновника**

      - **Деление пополам.** Запусти программу на первой половине данных. В примере ниже журнал
        из восьми записей, и это `sales[:4]`. Ошибка есть — дели дальше эту половину. Нет —
        виновник во второй, `sales[4:]`: дели её. И так, пока не останется одна запись. Журнал
        из 300 записей сокращается до одной примерно за девять запусков.
      - **Вывод перед обработкой.** Поставь `print(line)` отдельной строкой *перед* вызовом
        функции. Последняя напечатанная запись — виновник. Почему именно отдельной строкой, а не
        в одном `print` с результатом, — проверишь в прогнозе.

      **Минимальный пример** — самые маленькие данные и код, на которых ошибка ещё повторяется.
      Убирай по одной записи, одному полю словаря, одной строке кода и после каждого шага
      запускай. Ошибка та же — тот же тип, то же сообщение, та же строка кода? Значит, убранное
      было лишним. Номер строки может сдвинуться, если ты удалил строки выше, — сравнивай саму
      строку. Ошибка пропала или сменилась — верни последнее, что убрал: оно нужно.

      Зачем он нужен: на трёх строках причину видно глазами, а пример легко показать другому
      человеку. На нём же проверяют исправление: ошибка ушла? Если исправленная программа пошла
      дальше и упала на поле, которое ты убрал, — это не новая ошибка: проверь на исходной
      записи. И обязательно прогони старые данные, которые работали: исправление могло их
      сломать.

      Ошибку удобно описывать тремя частями: **вход** (запись «Утренний сеанс 18») → **что
      ожидалось** (выручка по журналу) → **что получилось** (IndexError).

      **Как это устроено в тренажёре.** Программа, которая падает, не проходит ни одной проверки.
      Поэтому в заданиях находку кладут в переменную — например, `bad_shift = "…"`, — а проверка
      сама вызывает функцию и убеждается, что ошибка повторяется. Строку с вызовом, которой ты
      проверял находку через «Запустить», перед «Проверить» закомментируй: поставь `#` в её
      начале.
    simpler: >-
      Воспроизвести — как показать мастеру, при каком повороте руля стучит в машине. Пока стучит
      «иногда», мастер ничего не найдёт. Минимальный пример — снимать всё лишнее, пока не
      останется одна деталь, которая стучит. На ней же потом проверяют, что стук пропал.
    coach: Сначала добейся, чтобы ошибка повторялась по команде. Исправлять — потом.

  - id: halves
    type: example
    title: Журнал пополам
    body: |-
      Отчёт Эльвиры в миниатюре: восемь записей вместо трёхсот. Если посчитать выручку по всему
      журналу — `for line in sales:`, — Python покажет:

      ```text
      Traceback (most recent call last):
        File "main.py", line 20, in <module>
          total = total + revenue(line)
        File "main.py", line 3, in revenue
          tickets = int(parts[1])
      IndexError: list index out of range
      ```

      Нижнее звено называет строку 3 в `revenue`, но не запись. Поэтому ниже цикл идёт только по
      первой половине журнала.
    code: |-
      def revenue(line):
          parts = line.split(";")
          tickets = int(parts[1])
          return tickets * 350


      sales = [
          "Сказка о звёздах;34",
          "Комедия выходного дня;12",
          "Мультфильм про кита;58",
          "Документальный;7",
          "Детектив;41",
          "Утренний сеанс 18",
          "Фантастика;63",
          "Мелодрама;25",
      ]

      total = 0
      for line in sales[:4]:
          total = total + revenue(line)
      print("Выручка:", total)
    notes:
      - line: 2
        text: >-
          `split(";")` режет запись по точке с запятой. Если «;» в записи нет, получится список
          из одной части.
      - line: 3
        text: >-
          `parts[1]` — вторая часть записи, число билетов. Здесь программа и падала: у записи без
          «;» второй части нет.
      - line: 19
        text: >-
          `sales[:4]` — первая половина журнала. Выручка посчиталась, ошибки нет — значит,
          виновник во второй половине.
    tryIt: >-
      Замени `sales[:4]` на `sales[4:]` и запусти — ошибка вернулась. Дели дальше: `sales[4:6]`,
      потом `sales[4:5]` и `sales[5:6]`. На какой одной записи ошибка повторяется? Этой записи
      хватит, чтобы показать ошибку кому угодно.
    coach: "Каждый запуск отвечает на один вопрос: виновник в этой половине или в той?"

  - id: last-line
    type: predict
    title: Какая строка появится последней?
    prompt: >-
      Программа печатает каждую запись о сеансе вместе с числом свободных мест. В одной записи
      вместо «;» стоит пробел. Как думаешь, что появится на экране до сообщения об ошибке?
    code: |-
      def seats_left(line):
          parts = line.split(";")
          return 120 - int(parts[1])


      sessions = ["10:00;34", "13:30;58", "16:00 71", "19:30;120"]
      for session in sessions:
          print(session, "->", seats_left(session))
    options:
      - |-
        10:00;34 -> 86
        13:30;58 -> 62
        16:00 71 ->
      - |-
        10:00;34 -> 86
        13:30;58 -> 62
      - |-
        10:00;34 -> 86
        13:30;58 -> 62
        19:30;120 -> 0
    answer: |-
      10:00;34 -> 86
      13:30;58 -> 62
    explanation: >-
      Прежде чем вызвать `print`, Python вычисляет все его аргументы — в том числе
      `seats_left(session)`. На записи `"16:00 71"` расчёт падает с IndexError, поэтому строка
      про неё так и не появляется, а до последней записи программа не доходит. Значит, виновник —
      **следующая** запись после последней напечатанной. Хочешь, чтобы последним на экране стоял
      сам виновник, — печатай запись отдельной строкой до вызова: `print(session)`.
    coach: >-
      Последняя напечатанная строка — это последнее, что *получилось*, а не то, на чём
      сломалось.

  - id: practice-find
    type: exercise
    title: Практика 1
    exercise:
      id: m6-l2-e1
      kind: repeat
      title: Смена, которая сломала табель
      statement: |-
        Ульяна подрабатывает в книжном магазине и ведёт табель смен в формате «часы:минуты».
        Программа складывает минуты за месяц, но падает с IndexError. Traceback показывает строку
        в `to_minutes`, а какая из двадцати записей виновата — не говорит.

        1. Найди запись, на которой падает `to_minutes`: делением пополам или выводом записи
           перед вызовом. Ищи приёмом, а не глазами: в табеле за год были бы сотни записей.
        2. Запиши её в переменную `bad_shift` точно так, как она записана в табеле. Проверка
           вызовет исходную `to_minutes` с этой записью и убедится, что ошибка повторяется.
        3. Это была смена ровно на 6 часов. Исправь запись в списке на правильный формат —
           подсчёт должен заработать:

        ```text
        Всего минут: 5550
        ```

        Если для поиска ты добавлял `print` или менял срез — перед «Проверить» верни подсчёт по
        всему табелю без лишнего вывода.
      input: Ввода нет — табель записан в программе.
      output: >-
        Одна строка с итогом по всему табелю. В `bad_shift` — запись-виновник в том виде, в каком
        она была в табеле.
      constraints:
        - "Не удаляй и не пропускай запись: итог должен учитывать все 20 смен."
        - Функцию `to_minutes` менять не нужно.
      starterCode: |
        def to_minutes(text):
            parts = text.split(":")
            return int(parts[1]) + int(parts[0]) * 60


        shifts = [
            "4:30", "6:15", "3:45", "5:00", "4:20", "6:40", "2:50", "5:30", "4:05", "3:15",
            "6:00", "4:45", "5:10", "3:30", "6.00", "4:15", "5:45", "2:40", "4:55", "3:20",
        ]

        # Запиши сюда запись, на которой падает to_minutes, — точно как в табеле
        bad_shift = ""

        total = 0
        for shift in shifts:
            total = total + to_minutes(shift)
        print("Всего минут:", total)
      tests:
        - id: t1
          kind: io
          title: Подсчёт по всему табелю
          example: true
          expected: "Всего минут: 5550"
        - id: t2
          kind: assert
          title: Запись воспроизводит ошибку
          example: true
          code: |
            def _original_to_minutes(text):
                parts = text.split(":")
                return int(parts[1]) + int(parts[0]) * 60


            _failed_with = None
            try:
                _original_to_minutes(globals().get("bad_shift"))
            except Exception as _error:
                _failed_with = type(_error).__name__
            assert _failed_with == "IndexError"
          message: >-
            На записи из bad_shift исходная to_minutes падает с IndexError — так же, как на всём
            табеле.
        - id: t3
          kind: assert
          title: Запись из табеля
          code: |
            _table = [
                "4:30", "6:15", "3:45", "5:00", "4:20", "6:40", "2:50", "5:30", "4:05", "3:15",
                "6:00", "4:45", "5:10", "3:30", "6.00", "4:15", "5:45", "2:40", "4:55", "3:20",
            ]
            assert globals().get("bad_shift") in _table
          message: bad_shift — запись из исходного табеля, слово в слово, в кавычках.
        - id: t4
          kind: call
          title: "Граничный случай: ноль часов"
          edge: true
          call: to_minutes("0:05")
          expected: "5"
        - id: t5
          kind: assert
          title: Итог посчитан по табелю
          code: |
            assert len(shifts) == 20
            _sum = 0
            for _shift in shifts:
                _sum = _sum + to_minutes(_shift)
            assert _sum == 5550
          message: >-
            В shifts по-прежнему 20 смен, и to_minutes считает их все без ошибки: итог получается
            из табеля, а не записан готовым числом.
      criteria:
        - В `bad_shift` — запись из табеля, на которой исходная `to_minutes` падает с IndexError.
        - >-
          Запись исправлена (или `to_minutes` научилась её понимать), а не удалена и не
          пропущена, — итог учитывает все 20 смен.
        - 'Программа печатает только итог — «Всего минут: 5550».'
      hints:
        - >-
          Traceback назвал функцию и строку, но не запись. Как сделать, чтобы программа сама
          показала, до какой записи дошла? Или сузь поиск: на какой половине табеля ошибка
          повторяется?
        - >-
          Деление пополам на другом списке: `for x in data[:10]:` — ошибки нет, значит, виновник
          в `data[10:]`. Дальше пробуешь `data[10:15]`, потом половину оставшегося — пока не
          останется одна запись.
        - |-
          Временный цикл для поиска:
          ```text
          for shift in shifts:
              print(shift)        # запись видна до вызова
              to_minutes(shift)
          ```
          Последняя напечатанная запись — виновник. Потом убери этот цикл, заполни `bad_shift` и
          исправь запись в списке.
      solution:
        code: |
          def to_minutes(text):
              parts = text.split(":")
              return int(parts[1]) + int(parts[0]) * 60


          shifts = [
              "4:30", "6:15", "3:45", "5:00", "4:20", "6:40", "2:50", "5:30", "4:05", "3:15",
              "6:00", "4:45", "5:10", "3:30", "6:00", "4:15", "5:45", "2:40", "4:55", "3:20",
          ]

          # Запиши сюда запись, на которой падает to_minutes, — точно как в табеле
          bad_shift = "6.00"

          total = 0
          for shift in shifts:
              total = total + to_minutes(shift)
          print("Всего минут:", total)
        explanation: >-
          В записи `"6.00"` вместо двоеточия точка. `split(":")` не нашёл двоеточия и вернул
          список из одной части, поэтому `parts[1]` не существует — отсюда IndexError. Одна запись
          из двадцати — это и есть минимальный пример по данным: `to_minutes("6.00")` падает
          сразу, без остального табеля. Смена на 6 часов в формате «часы:минуты» — `"6:00"`.
      altSolutions:
        - code: |
