            pie = {
                "dish": "Шарлотка",
                "steps": ["Замесить тесто", "Нарезать яблоки", "Выпекать"],
                "minutes": [15, 10, 40],
            }
            print(recipe_card(pie))
          note: total_minutes переделана под словарь рецепта — обычный список чисел она больше не сложит.
          expectMistake: total-minutes-reworked
      mistakes:
        - id: key-without-quotes
          when:
            codeRegex: 'recipe\[\s*minutes\s*\]'
          why: >-
            Ключ словаря — текст, его пишут в кавычках. Без кавычек `minutes` — имя переменной, а
            не ключ. Python ищет такую переменную, а она в этой же строке только получает значение,
            — отсюда ошибка.
          try: 'Возьми ключ в кавычки, как у `recipe["steps"]`.'
          verify: 'Нажми «Запустить» — должно получиться «Шарлотка: 65 мин, шагов: 3».'
        - id: symptom-int
          when:
            errorType: ValueError
            codeRegex: 'int\(\s*value\s*\)'
          why: >-
            `int()` не превратит «Замесить тесто» в число: в `total_minutes` пришли названия шагов.
            Сама функция тут ни при чём, а падение никуда не делось: в той же строке теперь
            ValueError. Посмотри на звено выше: что ей передают?
          try: >-
            Верни строку `total = total + value` как была и исправь вызов `total_minutes(...)` в
            `recipe_card`.
          verify: >-
            Карточка шарлотки должна показать 65 мин, а `total_minutes([60, 2.5])` — вернуть 62.5.
        - id: symptom-str
          when:
            codeRegex: '^\s*total\s*=\s*(str\(\s*total\s*\)|""|'''')'
            outputIncludes: Замесить тесто
          why: >-
            Теперь `total` — строка, и названия шагов просто склеиваются в одну длинную строку вместо
            суммы минут. Падение ушло, а причина осталась: в `total_minutes` приходит не тот
            список.
          try: >-
            Верни `total_minutes` как была. Лечится причина: в `total_minutes` должен прийти список
            чисел — посмотри на её вызов в `recipe_card`.
          verify: В карточке шарлотки должно быть «65 мин», а не названия шагов.
        - id: symptom-other
          when:
            codeRegex: '^\s*total\s*=\s*(?!total\s*\+\s*value\s*(#.*)?$|0\s*(#.*)?$|total_minutes\b)\S'
          why: >-
            Ты изменил `total_minutes` — функцию из нижнего звена. Но её строки были верны: она
            складывает список чисел. Правка внутри неё лечит симптом, а обычный список минут функция
            теперь считает неверно или падает на нём.
          try: >-
            Верни `total_minutes` как в стартовом коде. Если вызов `total_minutes(...)` в
            `recipe_card` ещё не исправлен, исправь его: туда должен прийти список минут.
          verify: >-
            `total_minutes([60, 2.5])` должна вернуть 62.5, а карточка шарлотки — показать 65 мин.
        - id: data-swapped
          when:
            failedTest: t2
            codeRegex: '["'']steps["'']\s*:\s*\[\s*\d'
          why: >-
            Ты поменял данные, а не программу: теперь под ключом `steps` лежат минуты. Шарлотка
            посчиталась, но любой другой рецепт с правильными данными снова уронит программу.
          try: >-
            Верни данные рецепта как были: `steps` — названия шагов, `minutes` — минуты. Исправь
            вызов `total_minutes(...)` в `recipe_card`.
          verify: 'Карточка омлета тоже должна посчитаться: «Омлет: 10 мин, шагов: 2».'
        - id: global-pie
          when:
            failedTest: t2
            codeRegex: 'total_minutes\(\s*(pie\s*\[|\[\s*\d)'
          why: >-
            Внутри `recipe_card` минуты берутся не из рецепта, который передали в функцию, а из
            `pie` или из готового списка. Поэтому карточка любого блюда покажет минуты шарлотки.
          try: Внутри функции работай с параметром `recipe` — как в строках с `dish` и `count`.
          verify: Карточка омлета должна показать 10 мин.
        - id: str-plus-int
          when:
            errorIncludes: "unsupported operand type(s) for +"
          why: >-
            `unsupported operand type(s) for +: 'int' and 'str'` — «неподходящие типы для +: число и
            строка»: к числу прибавляется текст. Но строка сложения сама по себе верна — значит,
            складывать дали не то.
          try: >-
            Найди в traceback звено над нижним: какая строка вызвала `total_minutes` и что она ей
            передала?
          verify: Нажми «Запустить» — traceback должен исчезнуть, а карточка — показать 65 мин.
        - id: total-minutes-reworked
          when:
            failedTest: t4
            codeRegex: 'total_minutes\(\s*recipe\s*\)'
          why: >-
            Ты переделал `total_minutes` под словарь рецепта. Но она нужна и в других местах — там
            ей передают список чисел, и `total_minutes([60, 2.5])` теперь падает.
          try: Верни `total_minutes` как была и передай ей список минут рецепта.
          verify: "`total_minutes([60, 2.5])` должна вернуть 62.5."
        - id: hardcoded
          when:
            failedTest: t2
            codeRegex: 'return\s+f?["'']Шарлотка'
          why: >-
            Для шарлотки всё верно, а для другого рецепта — нет: функция должна считать карточку по
            данным, а не возвращать готовую строку.
          try: Верни расчёт в `recipe_card` и исправь в нём одну строку — вызов `total_minutes(...)`.
          verify: 'Карточка омлета должна посчитаться по его данным: «Омлет: 10 мин, шагов: 2».'
      afterPass: >-
        Место падения и место причины разошлись на одно звено: `total_minutes` честно работала с тем,
        что ей дали. Так бывает часто — поэтому, если строка нижнего звена верна, поднимайся выше.
        Если хочешь, добавь в `pie` четвёртый шаг — «Остудить», 20 минут — и запусти: карточка
        пересчитается сама.
      skills: [traceback-reading, debugging, functions]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - >-
        Traceback читают снизу вверх: последняя строка — что случилось, нижнее звено — где
        программа остановилась, звенья выше — кто вызвал эту функцию.
      - "`<module>` — код вне функций, верх цепочки: отсюда всё началось."
      - >-
        Место падения — не всегда место причины. Если строка нижнего звена верна, поднимись на
        звено выше и проверь, какое значение туда передали.
      - >-
        На компьютере traceback тот же, только с полным путём к файлу и значками `~~~^^^`: в нижнем
        звене они отмечают выражение, на котором всё упало.
    question: >-
      Traceback заканчивается строкой в функции, которая выглядит правильной. Что делаешь дальше?
    answer: >-
      Поднимаюсь на звено выше: смотрю, с какими аргументами эту функцию вызвали и откуда взялось
      значение, на котором она упала. Исправляю там, где появилось неверное значение, или там, где
      особое значение (как ноль партий у новичка) нужно было проверить заранее, — а не там, где на
      него споткнулись.
