            Нажми «Запустить» — обе строки заказов должны напечататься, а `print_orders` — остаться
            такой же, как в стартовом коде.
        - id: str-too-wide
          when:
            errorIncludes: "unsupported operand type(s) for +: 'int' and 'str'"
            codeRegex: 'str\(\s*printing_cost\(\s*photos\s*\)\s*\+'
          why: >-
            Мысль верная, но скобка `str(` закрывается только в конце строки, и внутрь попало
            `printing_cost(photos) + " руб."` — число плюс текст. Python падает на этом сложении
            раньше, чем `str` успевает что-то превратить. Нижнее звено то же — строка с `return` в
            `order_line`.
          try: Закрой скобку `str(...)` сразу после вызова `printing_cost(photos)` — или собери строку f-строкой.
          verify: 'Нажми «Запустить» — должна появиться строка «Кравцовы: 290 руб.».'
        - id: photos-became-str
          when:
            errorIncludes: "unsupported operand type(s) for +: 'int' and 'str'"
            codeRegex: 'str\(\s*(order\[\s*["'']photos["'']\s*\]|photos\s*\))'
          why: >-
            Нижнее звено переехало в `printing_cost`: туда теперь приходит текст вместо числа
            фотографий, и `50 + "20" * 12` уже не посчитать. В текст нужно превращать не
            количество фотографий, а готовую цену — там, где её приклеивают к строке.
          try: >-
            Верни число фотографий как было и исправь строку с `return` в `order_line`: цену,
            которую вернула `printing_cost`, подставь в f-строку или оберни в `str(...)`.
          verify: Нажми «Запустить» — обе строки заказов должны напечататься без traceback.
        - id: concat-int
          when:
            errorIncludes: can only concatenate
          why: >-
            Нижнее звено — строка с `return` в `order_line`: к тексту прибавляется число, которое
            вернула `printing_cost`. Знак `+` склеивает только строки: «can only concatenate str
            (not "int") to str» — «склеить можно только строку со строкой, а не с числом».
          try: >-
            Исправь именно эту строку: собери её f-строкой или преврати цену в текст через
            `str(...)`.
          verify: Нажми «Запустить» — должны появиться обе строки заказов.
        - id: cost-became-str
          when:
            failedTest: t4
            outputIncludes: "Кравцовы: 290 руб."
          why: >-
            Строки заказов печатаются, но `printing_cost` теперь возвращает текст. Для строки заказа
            это сработало, а выручка за день сломается: `"290" + "86"` склеится в `"29086"`. Лечить
            нужно там, где упало, — в `order_line`.
          try: >-
            Верни `printing_cost` к числу и преврати цену в текст в строке с `return` в
            `order_line`.
          verify: "`printing_cost(4)` должна вернуть число 98 — без кавычек."
        - id: print-not-return
          when:
            outputIncludes: None
          why: >-
            `order_line` сама печатает строку и ничего не возвращает. А `print` в `print_orders`
            печатает то, что она вернула, — `None`.
          try: Замени `print(...)` в `order_line` на `return` с той же строкой.
          verify: Под строками заказов больше не должно быть `None`.
        - id: function-not-called
          when:
            outputIncludes: <function
          why: >-
            В строку попала сама функция, а не её результат: `printing_cost` без скобок — это
            функция, а не цена.
          try: Вызови её с числом фотографий — `printing_cost(photos)` — и уже результат преврати в текст.
          verify: В строке заказа должна появиться цена, например «290 руб.».
        - id: tuple-return
          when:
            outputIncludes: "('"
          why: >-
            `return` с запятыми отдаёт сразу несколько значений — кортеж, и `print` показывает его со
            скобками и кавычками. А нужна одна строка.
          try: Собери одну строку — f-строкой или склейкой через `+` со `str(...)`.
          verify: Строка заказа должна печататься без скобок и кавычек.
        - id: no-space
          when:
            outputIncludes: 0руб.
          why: Цена прилипла к «руб.» — перед словом пропал пробел.
          try: Добавь пробел в начало текста `" руб."`.
          verify: Должно получиться «290 руб.» — с пробелом.
      afterPass: >-
        Ты нашёл строку по нижнему звену и поменял только её: `printing_cost` по-прежнему
        возвращает число, и выручку за день можно посчитать сложением. f-строку читать проще, чем
        цепочку из `+` и `str()`, — в новых программах собирай текст ею.
      skills: [traceback-reading, functions]

  - id: practice-chain
    type: exercise
    title: Практика 3
    exercise:
      id: m6-l1-e3
      kind: fix
      title: Карточка рецепта
      statement: |-
        Семейные рецепты хранятся в программе: у каждого блюда — названия шагов и сколько минут
        занимает каждый шаг. Программа печатает карточку рецепта: общее время и число шагов.
        Сейчас она падает.

        Нажми «Запустить» и прочитай traceback снизу вверх. Общий совет наставника после запуска
        подскажет, как починить строку падения. Здесь этого мало: сначала выясни, откуда в
        `total_minutes` пришли такие значения.

        Функция `total_minutes` нужна и в других местах — например, чтобы посчитать время всего
        праздничного обеда, — и она должна складывать любой список чисел, в том числе дробных.
        Найди причину и исправь одну строку.

        Ожидаемый вывод:

        ```text
        Шарлотка: 65 мин, шагов: 3
        ```
      input: Ввода нет — рецепт записан в программе.
      output: "Одна строка: `блюдо: минуты мин, шагов: число`"
      constraints:
        - Исправь одну строку.
        - "`total_minutes` не меняй: она складывает любой список чисел."
      starterCode: |
        def total_minutes(durations):
            total = 0
            for value in durations:
                total = total + value
            return total


        def recipe_card(recipe):
            dish = recipe["dish"]
            minutes = total_minutes(recipe["steps"])
            count = len(recipe["steps"])
            return f"{dish}: {minutes} мин, шагов: {count}"


        pie = {
            "dish": "Шарлотка",
            "steps": ["Замесить тесто", "Нарезать яблоки", "Выпекать"],
            "minutes": [15, 10, 40],
        }
        print(recipe_card(pie))
      tests:
        - id: t1
          kind: io
          title: Шарлотка
          example: true
          expected: "Шарлотка: 65 мин, шагов: 3"
        - id: t2
          kind: call
          title: Другой рецепт
          example: true
          call: 'recipe_card({"dish": "Омлет", "steps": ["Взбить яйца", "Жарить"], "minutes": [3, 7]})'
          expected: "'Омлет: 10 мин, шагов: 2'"
        - id: t3
          kind: call
          title: "Граничный случай: шаги ещё не записаны"
          edge: true
          call: 'recipe_card({"dish": "Черновик", "steps": [], "minutes": []})'
          expected: "'Черновик: 0 мин, шагов: 0'"
        - id: t4
          kind: call
          title: total_minutes складывает числа, и дробные тоже
          edge: true
          call: total_minutes([60, 2.5])
          expected: "62.5"
      criteria:
        - "Программа не падает и печатает карточку `блюдо: минуты мин, шагов: число`."
        - Минуты считаются по данным того рецепта, который передали в `recipe_card`.
        - "`total_minutes` по-прежнему складывает любой список чисел, в том числе дробных."
      hints:
        - >-
          Нижнее звено показывает, где программа упала, но не всегда — где ошибка. Что лежит в
          `durations`, когда `total_minutes` падает, и кто это туда передал?
        - >-
          На другом примере: функция `half(n)` возвращает `n / 2`, а её вызывают так:
          `half(box["label"])`. Программа упадёт внутри `half` с `TypeError: unsupported operand
          type(s) for /: 'str' and 'int'`, но формула в `half` верна. Ошибка в вызове: передали
          надпись вместо числа.
        - >-
          Звено над нижним — строка 10: `total_minutes(recipe[…])`. Какое поле словаря хранит
          минуты? Впиши его в квадратные скобки вместо нынешнего — тоже в кавычках.
      solution:
        code: |
          def total_minutes(durations):
              total = 0
              for value in durations:
                  total = total + value
              return total


          def recipe_card(recipe):
              dish = recipe["dish"]
              minutes = total_minutes(recipe["minutes"])
              count = len(recipe["steps"])
              return f"{dish}: {minutes} мин, шагов: {count}"


          pie = {
              "dish": "Шарлотка",
              "steps": ["Замесить тесто", "Нарезать яблоки", "Выпекать"],
              "minutes": [15, 10, 40],
          }
          print(recipe_card(pie))
        explanation: >-
          Нижнее звено — строка 4 в `total_minutes`: к числу `total` прибавляется текст. Но формула
          верна — функция честно складывала то, что ей дали, а дали ей названия шагов. Звено выше,
          строка 10 в `recipe_card`, показывает вызов: туда передали поле `steps` вместо `minutes`.
          Причина на звено выше места падения — там и исправление.
