        code: |
          def points(distance_km, time_min):
              speed = distance_km * 60 / time_min
              if speed >= 20:
                  return 3
              return 1


          def total_points(rides):
              total = 0
              for ride in rides:
                  total = total + points(ride["distance"], ride["time"])
              return total


          week = [
              {"distance": 30, "time": 80},
              {"distance": 12, "time": 45},
              {"distance": 40, "time": 100},
          ]
          print("Очки за неделю:", total_points(week))
        explanation: >-
          В вызове `points(ride["time"], ride["distance"])` аргументы стояли в обратном порядке:
          время попадало в параметр `distance_km`, а расстояние — в `time_min`. Скорость выходила
          огромной (80 * 60 / 30 = 160 км/ч), и каждая поездка давала 3 очка. Функция `points` была
          верной — ошибка в том, что ей передавали. При входе в функцию отладчик показывает это
