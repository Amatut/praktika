      id: m6-l4-e2
      kind: fix
      title: Очки велоклуба
      statement: |-
        Велоклуб начисляет очки за поездки: если средняя скорость не меньше 20 км/ч — 3 очка,
        если меньше — 1 очко. За эту неделю должно выйти 7 очков, а программа печатает 9. Ошибка
        в одной строке.

        Как искать:

        - **на компьютере** — перенеси программу в файл `club.py` в папке `python-practice`.
          Поставь точку остановки на строку, где `total_points` вызывает `points`, запусти
          отладку, дойди до точки и сделай шаг с заходом. Панель переменных покажет, с какими
          значениями функция вызвана. Сравни их с первой поездкой недели;
        - **в тренажёре** — выведи параметры `points` отладочным print первой строкой её тела и
          нажми «Запустить».

        Нужный вывод:

        ```text
        Очки за неделю: 7
        ```
      input: "Поездки недели уже в программе: расстояние (`distance`, км) и время (`time`, минуты)."
      output: "`Очки за неделю: 7`"
      constraints:
        - "Функцией `points` пользуются и другие программы клуба, поэтому её заголовок не меняй: сначала расстояние, потом время."
        - Отладочный вывод перед проверкой убери.
      starterCode: |
        def points(distance_km, time_min):
            speed = distance_km * 60 / time_min
            if speed >= 20:
                return 3
            return 1


        def total_points(rides):
            total = 0
            for ride in rides:
                total = total + points(ride["time"], ride["distance"])
            return total


        week = [
            {"distance": 30, "time": 80},
            {"distance": 12, "time": 45},
            {"distance": 40, "time": 100},
        ]
        print("Очки за неделю:", total_points(week))
      tests:
        - id: t1
          kind: io
          title: "Пример 1: поездки недели"
          example: true
          expected: "Очки за неделю: 7"
        - id: t2
          kind: call
          title: "Пример 2: медленная поездка — 1 очко"
          example: true
          call: 'total_points([{"distance": 12, "time": 45}])'
          expected: "1"
        - id: t3
          kind: call
          title: "Граничный случай: поездок нет"
          edge: true
          call: total_points([])
          expected: "0"
        - id: t4
          kind: call
          title: "Граничный случай: ровно 20 км/ч"
          edge: true
          call: 'total_points([{"distance": 20, "time": 60}])'
          expected: "3"
        - id: t5
          kind: call
          title: "points(12, 45): 12 км за 45 минут"
          call: points(12, 45)
          expected: "1"
      criteria:
        - Каждая поездка передаётся в `points` как «расстояние, время».
        - Заголовок и формула `points` не изменились.
        - Ровно 20 км/ч даёт 3 очка.
        - Отладочного вывода в готовой программе нет.
