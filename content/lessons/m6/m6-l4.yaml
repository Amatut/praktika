id: m6-l4
module: m6
number: "6.4"
title: "Отладчик: точки остановки и шаги"
objective: >-
  Запускать программу под отладчиком редактора: ставить точку остановки, выполнять код по шагам
  без захода и с заходом в функцию, смотреть значения переменных — и так находить место, где
  поведение программы расходится с ожидаемым.
minutes: [30, 40]
prerequisites: [m6-l3, m0-l4]
skills: [debugger-tool, debugging]
environment: external

story:
  title: "Сдали норматив: 1"
  fictional: true
  text: >-
    Учитель физкультуры Наталья Сергеевна написала программу, которая считает, сколько учеников
    сдали норматив по прыжкам в длину. По журналу сдали четверо, а программа упорно отвечала «1».
    Она расставила print в пять мест, но запуталась в выводе: на экране числа без подписей, и
    какое откуда — непонятно. Коллега-информатик открыл тот же файл в редакторе, поставил точку
    остановки и стал выполнять программу по одной строке, глядя на значения переменных. Уже на
    первом прыжке он увидел, почему программа всегда отвечает «1».

why: >-
  Отладчик ставит программу на паузу в нужной строке и показывает все переменные сразу — без
  правки кода и без лишних print. Например, видно, что функция вернула ответ после первого же
  прохода цикла.

usedIn: >-
  Отладчик есть во всех средах разработки и в большинстве редакторов для программирования. Им
  разбирают сложные ошибки в больших программах, где print понадобилось бы слишком много, и
  изучают чужой код — как он работает по шагам.

steps:
  - id: debugger
    type: theory
    title: Программа на паузе
    body: |-
      Отладочный print из урока 6.3 отвечает только на тот вопрос, который ты задал заранее.
      **Отладчик** — режим запуска, в котором программу можно поставить на паузу и вести по
      одной строке, видя сразу все переменные. Код при этом менять не нужно.

      **Точка остановки** — отметка на строке. Дойдя до неё, программа замирает *перед* этой
      строкой. Главное правило урока: **подсвеченная строка ещё не выполнена** — она выполнится
      следующим шагом.

      Дальше программой управляют кнопки (в скобках — их названия в IDLE и VS Code):

      - **шаг без захода** (Over, Step Over) — выполнить подсвеченную строку целиком, даже если в
        ней вызов функции. Строка не пропускается: отладчик просто не заходит внутрь функции;
      - **шаг с заходом** (Step, Step Into) — если в строке вызов твоей функции, войти в неё и
        остановиться на первой строке её тела;
      - **выход из функции** (Out, Step Out) — доработать текущую функцию и вернуться туда,
        откуда её вызвали;
      - **продолжить** (Go, Continue) — идти без остановок до следующей точки остановки или до
        конца программы.

      **Панель переменных** (Locals, Variables) показывает переменные текущей функции прямо
      сейчас. Переменная появляется в ней, только когда строка с присваиванием уже выполнена.
      **Стек вызовов** (Stack, Call Stack) — та же цепочка вызовов, что в traceback из урока 6.1,
      только живая: основная часть программы (`<module>`) и функции, в которые она зашла.

      **Когда что.** Отладочный print удобен, чтобы быстро проверить одну гипотезу. В тренажёре
      отладчика нет, поэтому там print остаётся главным инструментом. Отладчик выручает, когда
      не знаешь, куда смотреть: переменных много, цикл длинный, вызовов несколько. И убирать
      после него нечего.

      Отладчик есть в обоих редакторах из урока 0.4: в IDLE это окно Debug Control, в VS Code —
      панель Run and Debug. Точные команды — в чек-листе «Точка остановки и шаги». В терминале
      есть и текстовый отладчик pdb — к нему можно вернуться позже.

      Чек-листы этого урока не проверяются автоматически: тренажёр не видит твой компьютер.
      Отмечай пункт, когда увидел результат своими глазами.
    simpler: >-
      Отладчик — пульт для программы с кнопками «пауза» и «кадр вперёд». Поставил метку на
      строку — программа замерла перед ней. Смотришь все переменные сразу и двигаешь программу
      по одной строке. Подсвеченная строка — следующий кадр: он покажется, когда нажмёшь
      «вперёд».
    coach: >-
      Компьютера сейчас нет? Прогноз, квиз и два задания работают в тренажёре — сделай их, а
      чек-листы — когда сядешь за компьютер. Удобное место для паузы — после чек-листа «Точка
      остановки и шаги».

  - id: prepare
    type: checklist
    title: Файл и воспроизведение
    body: |-
      Сначала воспроизведём ошибку без отладчика — как в уроке 6.2. Вот программа Натальи
      Сергеевны:

      ```python
      def count_passed(results, norm):
          passed = 0
          for result in results:
              if result >= norm:
                  passed = passed + 1
              return passed


      jumps = [172, 145, 190, 188, 130, 161]
      passed_count = count_passed(jumps, 160)
      print("Сдали норматив:", passed_count)
      ```

      Норматив сдан, если прыжок (в сантиметрах) не меньше нормы — 160.
    items:
      - id: file
        text: >-
          **Создай файл.** В учебной папке `python-practice` создай файл `jumps.py` и перенеси
          туда программу. Проверь, что отступы такие же, как в образце: нам нужна программа
          ровно с той ошибкой, что у Натальи Сергеевны.
        help: >-
          Копировать можно — сегодня тренируем отладчик, а не набор. Имя файла пиши латиницей и
          не называй его как модуль Python (например, `random.py`): такой файл мешает самому
          Python. Как создать и сохранить файл, напомнит урок 0.4.
      - id: run
        text: >-
          **Запусти обычным способом:** IDLE — F5 (Run → Run Module); VS Code — команда
          `python jumps.py` (или `py jumps.py`) в терминале, открытом в папке `python-practice`.
          Должно появиться `Сдали норматив: 1`.
        help: >-
          На macOS и Linux команда — `python3 jumps.py`. В VS Code есть и кнопка ▷ в правом
          верхнем углу, но она появляется только с расширением «Python» — его поставим в
          следующем чек-листе. Не запускается — вернись к уроку 0.4:
          там разобраны частые сообщения терминала. Ошибка `IndentationError` значит, что при
          копировании сбились отступы: в теле функции — 4 пробела, в теле `for` — 8, в теле
          `if` — 12.
      - id: expect
        text: >-
          **Запиши ожидание.** Посчитай вручную, сколько прыжков не меньше 160. Если твоё
          число не совпадает с тем, что вывела программа, ошибка воспроизведена.
        help: >-
          172, 190, 188 и 161 — четыре прыжка, значит, ждём `Сдали норматив: 4`. Ожидание
          записывают до поиска причины, иначе любое число покажется правдоподобным.

  - id: one-pass
    type: predict
    title: Сколько раз выполнится цикл?
    prompt: >-
      Наталья Сергеевна добавила в цикл отладочный вывод, как в уроке 6.3, и запустила функцию на
      трёх прыжках. Как думаешь, что появится на экране?
    code: |-
      def count_passed(results, norm):
          passed = 0
          for result in results:
              print(f"ОТЛАДКА: {result=}")
              if result >= norm:
                  passed = passed + 1
              return passed


      print("Сдали норматив:", count_passed([172, 145, 190], 160))
    options:
      - |-
        ОТЛАДКА: result=172
        ОТЛАДКА: result=145
        ОТЛАДКА: result=190
        Сдали норматив: 2
      - |-
        ОТЛАДКА: result=172
        Сдали норматив: 1
      - |-
        ОТЛАДКА: result=172
        ОТЛАДКА: result=145
        ОТЛАДКА: result=190
        Сдали норматив: 1
    answer: |-
      ОТЛАДКА: result=172
      Сдали норматив: 1
    explanation: >-
      `return passed` стоит с тем же отступом, что и `if`, — значит, он внутри цикла. На первом
      же проходе функция печатает отладочную строку, засчитывает 172 и сразу возвращает ответ:
      до 145 и 190 цикл не доходит. Отладочный вывод показал, *что* случилось — одна строка
      вместо трёх. В следующем чек-листе ты увидишь в отладчике, *как* это происходит: какая
      строка выполняется за какой.
    coach: Сколько строк «ОТЛАДКА» — столько раз прошёл цикл.

  - id: stepping
    type: checklist
    title: Точка остановки и шаги
    body: |-
      Теперь пройдём ту же программу отладчиком. В каждом пункте сначала сказано, что делать в
      IDLE, потом — в VS Code: читай только про свой редактор. Команды в двух редакторах:

      - **IDLE** (кнопки в окне Debug Control): Go — продолжить, Step — шаг с заходом, Over —
        шаг без захода, Out — выйти из функции, Quit — остановить.
      - **VS Code** (клавиши или кнопки на панели отладки вверху окна): F5 — продолжить, F11 —
        шаг с заходом, F10 — шаг без захода, Shift+F11 — выйти из функции, Shift+F5 —
        остановить.

      **Про систему.** На macOS правый щелчок в IDLE — Control + щелчок (или щелчок двумя
      пальцами), а функциональные клавиши в VS Code могут требовать Fn — удобнее нажимать
      кнопки на панели отладки. В Linux команды те же. Названия меню и кнопок в новых версиях
      могут немного отличаться — ищи по смыслу.
    items:
      - id: set-bp
        text: >-
          **Поставь точку остановки** на строку 2 — `passed = 0`. IDLE: правый щелчок по строке →
          Set Breakpoint, строка станет жёлтой. VS Code: щелчок слева от номера строки — появится
          красная точка.
        help: >-
          В IDLE номера строк по умолчанию скрыты: включи их в меню Options → Show Line Numbers
          или смотри на `Ln:` в правом нижнем углу окна. Точку в IDLE ставят в сохранённом
          файле — сначала сохрани `jumps.py`. Убрать точку: IDLE — Clear Breakpoint в том же
          меню, VS Code — ещё один щелчок по красной точке.
      - id: debug-on
        text: >-
          **Подготовь отладчик.** IDLE: в окне Shell выбери Debug → Debugger — откроется окно
          Debug Control; отметь в нём флажок Source. VS Code: проверь, что установлено
          расширение «Python» от Microsoft.
        help: |-
          **IDLE.** Меню Debug есть только в окне Shell (там, где `>>>`). Если окна Shell нет — в
          редакторе выбери Run → Python Shell. После Debug → Debugger в Shell появится
          `[DEBUG ON]`. Флажки Stack и Locals обычно уже отмечены; с флажком Source IDLE
          выделяет текущую строку прямо в окне с кодом. Расставь окна рядом, чтобы видеть и
          код, и Debug Control.

          **VS Code.** Открой панель Extensions (Ctrl+Shift+X) и найди `python`. Если у
          расширения «Python» от Microsoft есть кнопка Install — нажми её: нужен интернет, один
          раз. Вместе с ним ставится и отладчик «Python Debugger».
      - id: start
        text: >-
          **Запусти программу под отладчиком** и дойди до точки остановки. IDLE: в окне с
          `jumps.py` нажми F5, затем в Debug Control — Go. VS Code: F5 → «Python Debugger» →
          «Python File».
        help: >-
          IDLE после F5 останавливается перед самой первой строкой программы — в Debug Control
          видно `jumps.py:1: <module>()`. Нажми Go, и программа дойдёт до точки остановки:
          `jumps.py:2: count_passed()`. VS Code сразу останавливается на точке остановки: строка
          выделена жёлтым, слева от неё жёлтая стрелка. Если пункта «Python Debugger» нет,
          вернись к прошлому пункту и поставь расширение.
      - id: locals
        text: >-
          **Посмотри на панель переменных.** Там уже есть `results` и `norm`, а `passed` — ещё
          нет. Почему?
        help: >-
          Подсвеченная строка `passed = 0` ещё не выполнена — переменная появится после
          следующего шага. Где панель: IDLE — список Locals в окне Debug Control; VS Code —
          VARIABLES → Locals слева.
      - id: step
        text: >-
          **Иди шагами без захода** (IDLE: Over, VS Code: F10). Сначала запиши ожидание: если
          функция верная, строка с `for` будет подсвечиваться снова и снова — перед каждым
          прыжком и ещё раз в конце, когда прыжки закончатся, а `return` — только один раз,
          после цикла. После каждого шага смотри, какая строка подсвечена и чему равны `result`
          и `passed`.
        help: >-
          Если кнопки шагов серые и не нажимаются, программа не на паузе: она уже доработала
          или ещё не дошла до точки остановки. Запусти отладку заново.
      - id: find
        text: >-
          **Найди расхождение с ожиданием:** какая строка подсветилась сразу после
          `passed = passed + 1` и сколько раз успела подсветиться строка с `for`?
        help: >-
          После `passed = passed + 1` подсветился `return passed`, строка с `for` — всего один
          раз, а следующий шаг вывел тебя из функции обратно в основную часть программы? Ты нашёл
          ошибку: `return` срабатывает на первом же проходе цикла. Пока не исправляй — сначала
          попробуем шаг с заходом.
      - id: into
        text: >-
          **Шаг с заходом.** Перенеси точку остановки на строку 10
          (`passed_count = count_passed(jumps, 160)`), запусти отладку заново и дойди до неё.
          Сделай шаг с заходом (IDLE: Step, VS Code: F11) — окажешься на первой строке тела
          `count_passed`, `passed = 0`. Посмотри на стек вызовов.
        help: >-
          Если прошлая отладка ещё не закончилась, сначала останови её (IDLE: Quit, VS Code:
          Shift+F5). В IDLE запуск тот же: F5 в окне с кодом, затем Go. Стек: в IDLE — список
          Stack в окне Debug Control, текущая функция внизу и отмечена `>`;
          в VS Code — панель CALL STACK, текущая функция сверху. В нём основная часть программы
          (`<module>`, строка 10) и `count_passed` — как звенья traceback. В IDLE в списке может
          быть и служебная строка `bdb.run()`: это сам отладчик, на неё не смотри.
      - id: out
        text: >-
          **Выйди из функции** (IDLE: Out, VS Code: Shift+F11) и найди в панели переменных
          `passed_count`. Потом нажми «продолжить» (IDLE: Go, VS Code: F5) — программа
          доработает до конца и выведет `Сдали норматив: 1`.
        help: >-
          Функция доработает сама, и отладчик остановится в основной части программы. Там в панели
          переменных много служебных имён с `__` (например, `__name__`) — их пропускай. VS Code
          может сначала показать строку 10 — тогда сделай ещё один шаг без захода (F10), и
          `passed_count` появится. В IDLE на строке с print нажимай Over или Go, а не Step: Step
          заводит во внутренний файл IDLE `run.py` — через него IDLE выводит текст. Попал туда —
          нажми Out или Go. Вывод программы: в IDLE — в окне Shell, в VS Code — в терминале
          внизу окна.
      - id: stop-fix
        text: >-
          **Исправь и проверь.** Останови отладку, исправь ошибку в `jumps.py`, сохрани и запусти
          обычным способом: должно выйти `Сдали норматив: 4`. Потом пройди исправленную функцию
          отладчиком ещё раз на тех же прыжках.
        help: >-
          IDLE: чтобы отладчик не включался при каждом запуске, выключи его — в окне Shell снова
          Debug → Debugger (появится `[DEBUG OFF]`). VS Code: Shift+F5 останавливает отладку,
          обычный запуск — ▷ или Ctrl+F5. В исправленной программе `for` подсвечивается перед
          каждым прыжком и ещё раз в конце, когда прыжки закончились, а `return` — один раз,
          после цикла. Заметь: когда подсвечен `for`, в `result` ещё прошлый прыжок — строка с
          `for` ведь ещё не выполнена. Не получается исправить — задание «Норматив по прыжкам»
          ниже, там есть подсказки.

  - id: highlighted
    type: quiz
    title: Подсвеченная строка
    question: >-
      Отладчик остановился внутри цикла. Подсвечена строка `passed = passed + 1`, в панели
      переменных `passed = 2`. Что покажет панель после одного шага без захода?
    options:
      - "`passed = 2`: подсвеченная строка уже выполнена, а шаг выполнит следующую"
      - "`passed = 3`: шаг выполнит подсвеченную строку"
      - "`passed = 2`: шаг без захода перепрыгивает строку, не выполняя её"
    correct: 1
    explanation: >-
      Подсвеченная строка ещё не выполнена — отладчик остановился *перед* ней. Шаг выполняет её
      целиком, и `passed` становится 3. «Без захода» не значит «пропустить»: строка выполняется,
      отладчик лишь не заходит внутрь функций, которые в ней вызываются.

  - id: practice-return
    type: exercise
    title: Практика 1
    exercise:
      id: m6-l4-e1
      kind: fix
      title: Норматив по прыжкам
      statement: |-
        Программа Натальи Сергеевны из истории. Норматив сдан, если прыжок не меньше нормы. По
        журналу сдали четверо, а программа печатает `Сдали норматив: 1`.

        Если ты прошёл программу в отладчике на компьютере — перенеси сюда своё исправление. Если
        нет — найди ошибку отладочным выводом, как в уроке 6.3: что происходит в цикле на каждом
        проходе? Перед проверкой отладочный вывод убери.

        Нужный вывод:

        ```text
        Сдали норматив: 4
        ```
      input: Ввода нет — прыжки из журнала записаны в программе.
      output: "`Сдали норматив: 4`"
      constraints:
        - Исправь функцию `count_passed`, а список прыжков и строку с print не меняй.
        - Для пустого списка функция возвращает 0.
      starterCode: |
        def count_passed(results, norm):
            passed = 0
            for result in results:
                if result >= norm:
                    passed = passed + 1
                return passed


        jumps = [172, 145, 190, 188, 130, 161]
        passed_count = count_passed(jumps, 160)
        print("Сдали норматив:", passed_count)
      tests:
        - id: t1
          kind: io
