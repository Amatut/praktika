  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Точка остановки ставит программу на паузу перед строкой. Подсвеченная строка ещё не выполнена — она выполнится следующим шагом.
      - Шаг без захода выполняет строку целиком, шаг с заходом входит в вызываемую функцию, выход из функции возвращает к месту вызова.
      - Панель переменных показывает все значения сразу, стек вызовов — живой traceback.
      - Отладочный print — быстро проверить одну гипотезу; в тренажёре это главный инструмент. Отладчик — когда не знаешь, куда смотреть.
    question: >-
      Чем шаг с заходом отличается от шага без захода и когда нужен каждый?
    answer: >-
      С заходом отладчик входит внутрь вызываемой функции и идёт по её строкам. Это нужно, когда
      подозреваешь эту функцию или хочешь увидеть, с какими значениями её вызвали: в задании про
      велоклуб шаг с заходом в `points` сразу показал бы `distance_km = 80`. Без захода функция
      выполняется целиком за один шаг — удобно, когда она проверена и её строки не интересны.
      В обоих случаях строка выполняется; разница только в том, заходит ли отладчик внутрь.
