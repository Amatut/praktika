      mistakes:
        - id: return-outside
          when:
            errorType: SyntaxError
            errorIncludes: outside function
          why: >-
            `return` без отступа оказался вне функции, а возвращать результат можно только
            из функции. Поэтому Python не запускает программу вовсе.
