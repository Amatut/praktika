          Похожи они на первую поездку недели — 30 км за 80 минут?
        - |-
          Обычные аргументы попадают в параметры по месту, а не по смыслу:

          ```python
          def area(width, height):
              return width * height

          area(2, 10)   # width = 2, height = 10
          area(10, 2)   # width = 10, height = 2
          ```

          Python не угадывает, какое число — ширина, а какое — высота: первый аргумент попадает
          в первый параметр, второй — во второй. По имени аргументы раскладываются, только если
          написать имя явно: `area(height=10, width=2)`.
