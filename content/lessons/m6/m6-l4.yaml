            влево уехал не только `return passed`, но и `if` со счётчиком.
          try: >-
            Верни `if` на 8 пробелов, а `passed = passed + 1` — на 12. Влево, на уровень `for`
            (4 пробела), сдвинь только `return passed`.
          verify: 'Ошибка должна исчезнуть, а в «Примере 1» появится `Сдали норматив: 4`.'
        - id: bad-indent
          when:
            errorType: IndentationError
          why: >-
            Отступ строки не подходит ни к одному блоку: он глубже, чем нужно, или не совпадает
            ни с одним уровнем выше. В этой функции уровней три: тело функции — 4 пробела, тело
            `for` — 8, тело `if` — 12.
          try: >-
            Выровняй строку из сообщения об ошибке по одному из этих уровней. `return passed`
            ставь ровно на 4 пробела — как `for`: так он выполнится один раз, после цикла.
          verify: 'Ошибка должна исчезнуть, а в «Примере 1» появится `Сдали норматив: 4`.'
        - id: reset-in-loop
          when:
            codeRegex: '^([ \t]*)for\b[^\n]*\n(?:[ \t]*\n|\1[ \t]+[^\n]*\n)*?\1[ \t]+passed[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?$'
          where: Строка `passed = 0`
          why: >-
            `passed = 0` оказался внутри цикла: счётчик обнуляется перед каждым прыжком, и в
            конце в нём остаётся только результат последнего.
          try: Верни `passed = 0` на место — перед `for`, с отступом как у `for`.
          verify: В отладчике или отладочным print проверь, что `passed` растёт от прыжка к прыжку.
        - id: no-return
          when:
            outputIncludes: None
          why: >-
            На экране None: в функции не осталось `return`, а функция без `return` отдаёт
            None.
          try: >-
            Верни строку `return passed` в конец функции — после цикла, с отступом как у
            `for`.
          verify: В «Примере 1» вместо None должно появиться число 4.
        - id: return-in-loop
          when:
            outputIncludes: "Сдали норматив: 1"
          why: >-
            Функция всё ещё отвечает после первого прыжка: `return` стоит внутри цикла (или
            внутри `if` в цикле) и срабатывает на первом же проходе. Остальные прыжки цикл не
            проверяет.
          try: >-
            Посмотри в отладчике или отладочным print, на каком проходе срабатывает `return`.
            Сдвинь его влево, на уровень `for`, — так он выполнится один раз, после цикла. Если
            строку скопировал, а не перенёс, удали старый `return` из цикла.
          verify: 'В «Примере 1» должно выйти `Сдали норматив: 4`, а для пустого списка — 0.'
        - id: boundary
