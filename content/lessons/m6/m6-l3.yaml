id: m6-l3
module: m6
number: "6.3"
title: Промежуточные значения и трассировка
objective: >-
  Находить логическую ошибку, когда программа не падает, но результат неверный: выдвигать гипотезу,
  проверять её отладочным выводом промежуточных значений и трассировкой, исправлять одну причину и
  убирать отладочный вывод.
minutes: [20, 30]
prerequisites: [m6-l2, m3-l6]
skills: [debugging]
environment: python

story:
  title: "«Собрано: 500»"
  fictional: true
  text: >-
    Карина из родительского комитета собирает деньги на выпускной и завела маленькую программу,
    которая складывает взносы. Через неделю программа показала «Собрано: 500», хотя только
    в первый день родители перевели несколько тысяч. Python не показал ни одной ошибки — программа
    уверенно печатала неверное число. Карина не стала переписывать всё заново: она поставила `print`
    внутрь цикла и увидела, что сумма на каждом шаге начинается с нуля. Строку `total = 0` случайно
    сдвинули внутрь цикла, и после исправления итог сошёлся с переводами.

why: >-
  При самых коварных ошибках программа не падает: она работает до конца и уверенно печатает
  неверный ответ. Промежуточные значения показывают, на каком шаге расчёт свернул не туда, —
  например, что сумма обнуляется на каждом проходе цикла.

usedIn: >-
  Отладочный вывод и журналы работы программ (логи) — главный инструмент разбора ошибок там, где
  отладчик (о нём — следующий урок) не подключишь, например на сервере. Трассировку в уме и на
  бумаге используют, когда читают чужой код и когда разбирают ошибку вместе с коллегой.

steps:
  - id: hypothesis
    type: theory
    title: Гипотеза и промежуточные значения
    body: |-
      **Логическая ошибка** — программа работает до конца, но ответ неверный. Traceback нет, Python
      молчит — место ошибки приходится искать самому. Помогает порядок действий:

      1. Возьми **минимальный пример** (урок 6.2), на котором ответ неверный, и запиши, каким
         ответ должен быть.
      2. Составь **ожидание по шагам** — трассировку, как в уроке 3.6: какие значения должны быть у
         переменных после каждого шага.
      3. Выведи **промежуточные значения** — что на самом деле лежит в переменных на этих шагах.
      4. Найди **первое расхождение** ожидания и факта. Причина — на этом шаге или раньше, там,
         откуда пришло неверное значение: где ошибка видна, там не всегда её причина (урок 6.1).
         Всё, что ниже, — уже последствия.

      **Гипотеза** — предположение о причине, которое можно проверить одним запуском: «total
      обнуляется на каждом шаге», «в функцию приходит строка, а не число». Одна гипотеза — одна
      проверка — одно исправление — снова запуск. Если править наугад в трёх местах сразу, не
      узнаешь, какая правка помогла, а какая сломала что-то новое. И переписывать всё заново обычно
      не нужно: чаще всего неверен один шаг.

      **Отладочный вывод** — временный `print`, как трассировочный в уроке 3.6. Помечай его словом
      `ОТЛАДКА:` — такие строки легко заметить в выводе и найти в коде. Ещё удобнее f-строка со
      знаком `=` после имени: она печатает и имя, и значение.

      ```python
      total = 15
      price = "150"
      print(f"ОТЛАДКА: {total=} {price=}")
      ```

      ```text
      ОТЛАДКА: total=15 price='150'
      ```

      Значение строки печатается в кавычках: сразу видно, что `price` — текст, а не число. Кавычки
      Python ставит одинарные, даже если в коде были двойные.

      **Где ставить отладочный print:**

      - в начале функции — что в неё пришло;
      - перед `return` — что она отдаёт;
      - в конце тела цикла — каким стал накопитель после очередного шага.

      Когда ошибка найдена и исправлена, **убери отладочный вывод** — удали строку или
      закомментируй её знаком `#`. Он добавляет строки к выводу программы, и проверка в тренажёре
      не пройдёт, пока они печатаются.
    simpler: >-
      Представь, что ехал по навигатору и приехал не туда. Проезжать весь путь заново не нужно:
      сверяешь с картой каждый поворот и находишь первый, где свернул не туда. Твоя трассировка —
      это карта, а отладочный `print` показывает, где программа на самом деле оказалась после
      каждого шага.
    coach: >-
      Сначала запиши, что ожидаешь увидеть, и только потом запускай — иначе любое число покажется
      правдоподобным.

  - id: collected
    type: example
    title: Взносы под микроскопом
    body: |-
      Программа Карины с отладочным выводом внутри цикла. Три взноса: 1500, 2000 и 500. Ожидание по
      шагам — `total` должен быть 1500, потом 3500, потом 4000.

      Нажми «Запустить» и сравни отладочные строки с ожиданием: на каком шаге они впервые разошлись?
    code: |-
      def total_collected(payments):
          for payment in payments:
              total = 0
              total = total + payment
              print(f"ОТЛАДКА: {payment=} {total=}")
          return total


      print("Собрано:", total_collected([1500, 2000, 500]))
    notes:
      - line: 3
        text: >-
          Подозрительная строка: она стоит внутри цикла и выполняется перед каждым взносом.
          Гипотеза — `total` обнуляется на каждом шаге. Если она верна, в отладочных строках
          `total` окажется равен самому взносу.
      - line: 5
        text: >-
          Отладочный вывод: метка `ОТЛАДКА:` и f-строка с `=`. Каждая его строка — значения после
          одного взноса: их и сравнивай с ожиданием 1500, 3500, 4000.
      - line: 9
        text: Итог — то, что осталось в `total` после последнего прохода цикла.
    tryIt: >-
      Перенеси `total = 0` на строку выше `for` — с тем же отступом, что у `for`, — и запусти:
      отладочные строки покажут 1500, 3500, 4000, а итог станет 4000. Потом удали отладочный `print`
      и запусти ещё раз: останется одна строка.
    coach: >-
      Гипотеза подтвердилась одним запуском — без переписывания программы.

  - id: equals-sign
    type: predict
    title: "Что покажет {price=}?"
    prompt: >-
      Как думаешь, что выведет программа? Обрати внимание на знак `=` в первой f-строке.
    code: |-
      price = "150"
      count = 2
      print(f"{price=} {count=}")
      print(price * count)
    options:
      - |-
        price='150' count=2
        150150
      - |-
        price=150 count=2
        300
      - |-
        price='150' count=2
        300
    answer: |-
      price='150' count=2
      150150
    explanation: >-
      Со знаком `=` f-строка печатает имя и значение: строку — в кавычках (Python показывает
      одинарные, даже если в коде стояли двойные), число — без кавычек. А раз `price` — строка,
      `price * count` не умножает число, а повторяет текст два раза: `150150`. Кавычки в
      отладочном выводе — частая подсказка, что «число» так и осталось текстом, например после
      `input()` или `split()`.
    coach: >-
      Если в отладочном выводе у «числа» кавычки — это не число.

  - id: where-print
    type: quiz
    title: Куда поставить print
    question: >-
      Функция `average(marks)` считает средний балл: складывает оценки в `total`, считает их в
      `count` и возвращает `total / count`. Программа вызывает её так: `result = average(marks)` —
      и ответ неверный. Гипотеза: «в функцию приходит не тот список». Куда поставить отладочный
      `print`, чтобы проверить её одним запуском?
    options:
      - 'Сразу после вызова: `print(f"ОТЛАДКА: {result=}")`'
      - 'Первой строкой в теле функции: `print(f"ОТЛАДКА: {marks=}")`'
      - 'Последней строкой программы: `print(f"ОТЛАДКА: {total=} {count=}")`'
    correct: 1
    explanation: >-
      Гипотеза — о том, что приходит в функцию, значит, смотреть нужно на вход: первой строкой в
      теле функции. `result` покажет только, что ответ неверный, а это ты уже знаешь. А `total` и
      `count` существуют только внутри функции (урок 5.4): в последней строке программы Python их
      не найдёт и остановится с NameError.

  - id: practice-reset
    type: exercise
    title: Практика 1
    exercise:
      id: m6-l3-e1
      kind: repeat
      title: Коробки за неделю
      statement: |-
        Кладовщик склада стройматериалов Анатолий получил от программы «Пришло коробок за неделю: 8»,
        хотя по накладным их 47. В программу уже вставлен отладочный вывод.

        1. Запусти программу и сравни значения `total` с ожидаемыми: после каждого дня должно быть
           12, 12, 19, 39, 47.
        2. Найди первое расхождение и исправь причину.
        3. Убери отладочный вывод: программа должна печатать одну строку.

        ```text
        Пришло коробок за неделю: 47
        ```

        Проверка вызывает и саму функцию `week_arrivals` с другими списками — в том числе с пустым:
        неделя без поставок.
      input: Ввода нет — коробки по дням записаны в программе.
      output: "Одна строка: `Пришло коробок за неделю: 47`."
      constraints:
        - Исправь одну причину — не переписывай программу целиком.
        - Для пустого списка функция возвращает 0.
        - В готовой программе нет отладочного вывода.
      starterCode: |
        def week_arrivals(boxes_by_day):
            for boxes in boxes_by_day:
                total = 0
                total = total + boxes
                print(f"ОТЛАДКА: {boxes=} {total=}")
            return total


        arrivals = [12, 0, 7, 20, 8]
        print("Пришло коробок за неделю:", week_arrivals(arrivals))
      tests:
        - id: t1
          kind: io
          title: Коробки за неделю
          example: true
          expected: "Пришло коробок за неделю: 47"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: call
          title: Три дня
          example: true
          call: week_arrivals([1, 2, 3])
          expected: "6"
        - id: t3
          kind: call
          title: "Граничный случай: неделя без поставок"
          edge: true
          call: week_arrivals([])
          expected: "0"
        - id: t4
          kind: call
          title: "Граничный случай: один день"
          edge: true
          call: week_arrivals([5])
          expected: "5"
      criteria:
        - "`week_arrivals` возвращает сумму всех чисел списка, для пустого списка — 0."
        - "Программа печатает одну строку «Пришло коробок за неделю: 47»."
        - Отладочного вывода не осталось.
      hints:
        - >-
          Сравни отладочные строки с ожиданием 12, 12, 19, 39, 47. На каком дне они впервые
          разошлись? Что `total` должен «помнить» с прошлого дня — и что помнит на самом деле?
        - >-
          Копилка на другом примере: её заводят один раз, до пополнений, — `saved = 0`, а в цикле
          только прибавляют: `saved = saved + coins`. Если заводить копилку заново перед каждой
          монетой, в ней всегда будет лежать одна последняя монета.
        - |-
          Каркас:
          ```text
          def week_arrivals(boxes_by_day):
              total = 0
              for boxes in boxes_by_day:
                  total = …
              return total
          ```
          Строку с `ОТЛАДКА` удали или закомментируй.
      solution:
        code: |
          def week_arrivals(boxes_by_day):
              total = 0
              for boxes in boxes_by_day:
                  total = total + boxes
              return total


          arrivals = [12, 0, 7, 20, 8]
          print("Пришло коробок за неделю:", week_arrivals(arrivals))
        explanation: >-
          Отладочные строки показали, что `total` на каждом шаге равен `boxes`: сумма начиналась
          заново, потому что строка `total = 0` стояла внутри цикла. Накопитель заводят один раз —
          перед `for`. Заодно заработал пустой список: цикл не выполняется ни разу, и функция
          возвращает 0. Раньше переменная `total` в этом случае не появлялась вовсе, и вызов падал
          с UnboundLocalError.
      altSolutions:
        - code: |
            def week_arrivals(boxes_by_day):
                total = 0
                for boxes in boxes_by_day:
                    total += boxes
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: Прибавление через +=.
        - code: |
            def week_arrivals(boxes_by_day):
                total = 0
                for boxes in boxes_by_day:
                    total = total + boxes
                    # print(f"ОТЛАДКА: {boxes=} {total=}")
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: Отладочная строка закомментирована, а не удалена — в вывод она не попадает.
        - code: |
            def week_arrivals(boxes_by_day):
                return sum(boxes_by_day)


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: Встроенная sum из урока 4.2 — тоже верно, хотя цикл уже не нужен.
      wrongSolutions:
        - code: |
            def week_arrivals(boxes_by_day):
                for boxes in boxes_by_day:
                    total = 0
                    total = total + boxes
                    print(f"ОТЛАДКА: {boxes=} {total=}")
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: Стартовый код без изменений.
          expectMistake: still-reset
        - code: |
            def week_arrivals(boxes_by_day):
                total = 0
                for boxes in boxes_by_day:
                    total = total + boxes
                    print(f"ОТЛАДКА: {boxes=} {total=}")
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: Ошибка исправлена, но отладочный вывод остался.
          expectMistake: debug-left
        - code: |
            def week_arrivals(boxes_by_day):
                for boxes in boxes_by_day:
                    total = total + boxes
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: Строку total = 0 удалили вместо того, чтобы перенести.
          expectMistake: no-start
        - code: |
            total = 0


            def week_arrivals(boxes_by_day):
                for boxes in boxes_by_day:
                    total = total + boxes
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: total = 0 вынесли за пределы функции.
          expectMistake: no-start
        - code: |
            def week_arrivals(boxes_by_day):
                total = 0
                for boxes in boxes_by_day:
                    total = total + boxes
                    return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: return внутри цикла — функция выходит после первого дня.
          expectMistake: return-in-loop
        - code: |
            def week_arrivals(boxes_by_day):
                for boxes in boxes_by_day:
                    total = 0
                    total = total + boxes
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", 47)
          note: Ответ подогнан готовым числом, функция по-прежнему считает неверно.
          expectMistake: patched-answer
        - code: |
            def week_arrivals(boxes_by_day):
                for boxes in boxes_by_day:
                    total = 0
                    total = total + boxes
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", sum(arrivals))
          note: Подгонка через sum в print — функция не исправлена.
          expectMistake: patched-answer
        - code: |
            def week_arrivals(boxes_by_day):
                for boxes in boxes_by_day:
                    total = 0
                    total = total + boxes
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals) + 39)
          note: Подгонка поправкой — к неверному итогу прибавлена разница 39.
          expectMistake: patched-answer
        - code: |
            def week_arrivals(boxes_by_day):
                for boxes in boxes_by_day:
                    total = total + boxes
                total = 0
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: total = 0 перенесли не выше, а ниже цикла.
          expectMistake: no-start
        - code: |
            # ожидаю по дням: 12, 12, 19, 39, 47
            def week_arrivals(boxes_by_day):
                for boxes in boxes_by_day:
                    total = total + boxes
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: >-
            Ожидание записано комментарием, как советует теория, а total = 0 удалили. Комментарий с 47
            не должен вызывать разбор «подгонка ответа».
          expectMistake: no-start
        - code: |
            def week_arrivals(boxes_by_day):
                total = 0
                for i in range(1, len(boxes_by_day)):
                    total = total + boxes_by_day[i]
                    # ожидаю total: 12, 12, 19, 39, 47
                return total


            arrivals = [12, 0, 7, 20, 8]
            print("Пришло коробок за неделю:", week_arrivals(arrivals))
          note: Переписано по индексам, первый день потерян; в коде комментарий-ожидание с 47.
          expectMistake: null
      mistakes:
        - id: still-reset
          when:
            outputIncludes: "за неделю: 8"
          where: Строка `total = 0` внутри цикла
          why: >-
            Итог 8 — это коробки одного последнего дня. Отладочные строки показывают то же самое:
            `total` на каждом шаге равен `boxes`, прошлые дни не накапливаются. Значит, сумма
            начинается заново на каждом проходе — строка, которая обнуляет `total`, стоит внутри
            цикла.
          try: Перенеси `total = 0` выше `for`, но внутрь функции — с тем же отступом, что у `for`.
          verify: Отладочные строки должны показать 12, 12, 19, 39, 47, а итог — 47.
        - id: return-in-loop
          when:
            outputIncludes: "за неделю: 12"
          where: Строка `return total`
          why: >-
            Итог 12 — коробки только первого дня. Функция вернула ответ после первого прохода цикла:
            `return` оказался внутри цикла, а `return` сразу завершает функцию.
          try: Сдвинь `return total` влево, на уровень `for`, — тогда он выполнится после цикла.
          verify: "В выводе должно быть «Пришло коробок за неделю: 47»."
        - id: patched-answer
          when:
            failedTest: t2
            outputIncludes: "за неделю: 47"
          where: Строка с `print`
          why: >-
            Программа печатает 47, но сама функция по-прежнему считает неверно: проверка «Три дня»
            вызывает `week_arrivals([1, 2, 3])` и ждёт 6. Значит, 47 получилось не из исправленной
            функции, а подогнано в строке с `print` — готовым числом, `sum` или поправкой. Подгонка
            прячет ошибку, но не исправляет её.
          try: >-
            Верни последнюю строку к виду `print("Пришло коробок за неделю:", week_arrivals(arrivals))`
            и исправь саму функцию: найди по отладочным строкам первый день, на котором `total`
            разошёлся с ожиданием.
          verify: Проверка «Три дня» должна дать 6.
        - id: no-start
          when:
            errorType: UnboundLocalError
          where: Строка `total = total + boxes`
          why: >-
            Внутри функции `total` впервые встречается в строке `total = total + boxes`: Python
            берёт старое значение `total`, а его ещё нет. Так бывает, если строку `total = 0`
            удалить, поставить ниже цикла или вынести за пределы функции: у функции свои переменные
            (урок 5.4).
          try: Заведи накопитель внутри функции, перед `for`, — с тем же отступом, что у `for`.
          verify: Ошибка UnboundLocalError должна исчезнуть, а итог — стать 47.
        - id: debug-left
          when:
            failedTest: t1
            outputIncludes: "за неделю: 47"
          where: Строка с отладочным `print`
          why: >-
            Сумма уже верная — 47. Но в выводе остались отладочные строки, а проверка сравнивает
            вывод целиком.
          try: Удали отладочный `print` или закомментируй его знаком `#`.
          verify: "В выводе должна остаться одна строка «Пришло коробок за неделю: 47»."
      afterPass: >-
        Отладочные строки показали, что `total` каждый раз равен `boxes`, — гипотеза «сумма
        обнуляется» подтвердилась одним запуском, а исправление заняло одну строку. Заодно
        заработала неделя без поставок: функция возвращает 0 вместо ошибки.
      skills: [debugging, accumulators]

