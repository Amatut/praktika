  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "При логической ошибке программа не падает: ищи первое расхождение между ожиданием по шагам и промежуточными значениями."
      - Одна гипотеза → один отладочный вывод → одно исправление → снова запуск.
      - '`f"{x=}"` печатает имя и значение; у строки значение в кавычках.'
      - Отладочный вывод помечай словом ОТЛАДКА и убирай, когда ошибка исправлена.
    question: >-
      Программа не падает, но итог неверный. С чего начнёшь — и как поймёшь, что ошибка исправлена?
    answer: >-
      Возьму минимальный пример, на котором ответ неверный, и запишу, какие значения должны быть
      по шагам. Выведу промежуточные значения с меткой ОТЛАДКА и найду первый шаг, где факт
      разошёлся с ожиданием. Проверю одну гипотезу и исправлю одну причину. Запущу на том же примере — ответ
      должен совпасть с ожиданием, — потом проверю граничные случаи и уберу отладочный вывод.
