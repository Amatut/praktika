  - id: practice-frost
    type: exercise
    title: Практика 3
    exercise:
      id: m6-l3-e3
      kind: fix
      title: Лёд на катке
      statement: |-
        Фарид с соседями заливает каток во дворе: лёд схватывается, только если мороз стоит
        несколько дней подряд. Программа читает температуры за дни одной строкой и печатает длину
        самой длинной серии морозных дней подряд. Мороз — температура ниже нуля; 0 — ещё не мороз.

        ```text
        Самая длинная серия морозных дней: 3
        ```

        В функции две переменные: `streak` (по-английски «серия») — сколько морозных дней подряд
        идёт прямо сейчас, а `best` — самая длинная серия, найденная к этому дню.

        На одних данных программа отвечает верно, на других — нет, и Python ошибок не показывает.

        1. В поле «Ввод для „Запустить“» уже стоит первый пример — запусти. Потом впиши второй,
           «-3 -5 2 -1 -2 -4 1», и найди пример, где ответ неверный.
        2. Добавь отладочный вывод в конец тела цикла, после `if/else`, — так видны значения после
           каждого дня. Что выводить, реши сам: то, что проверит твою гипотезу. Сравни с тем, что
           должно быть.
        3. Исправь причину и убери отладочный вывод.
      input: Одна строка — температуры за дни через пробел, целые числа; хотя бы один день.
      output: "Одна строка: `Самая длинная серия морозных дней: <число>`."
      constraints:
        - Мороз — только температура ниже нуля.
        - В готовой программе нет отладочного вывода.
      starterCode: |
        def longest_frost(temps):
            best = 0
            streak = 0
            for t in temps:
                if t < 0:
                    streak = streak + 1
                else:
                    if streak > best:
                        best = streak
                    streak = 0
            return best


        temps = []
        for part in input().split():
            temps.append(int(part))
        print("Самая длинная серия морозных дней:", longest_frost(temps))
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "1 -2 -3 -4\n"
          expected: "Самая длинная серия морозных дней: 3"
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "-3 -5 2 -1 -2 -4 1\n"
          expected: "Самая длинная серия морозных дней: 3"
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: все дни морозные"
          edge: true
          stdin: "-1 -1\n"
          expected: "Самая длинная серия морозных дней: 2"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: ноль — не мороз"
          edge: true
          stdin: "5 6 0\n"
          expected: "Самая длинная серия морозных дней: 0"
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: "Граничный случай: нули прерывают серию"
          edge: true
          stdin: "0 -1 0 -2 -3\n"
          expected: "Самая длинная серия морозных дней: 2"
          compare:
            ignoreSpaces: true
