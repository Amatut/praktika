id: m5-l3
module: m5
number: "5.3"
title: "return: функция отдаёт результат"
objective: >-
  Возвращать результат функции через return и использовать его дальше — в переменной, вычислении
  или условии, — отличая return от print.
minutes: [25, 30]
prerequisites: [m5-l2]
skills: [functions]
environment: python

story:
  title: Плейлист для пробежки
  fictional: true
  text: >-
    Тимур готовится к забегу на 10 км и собирает плейлист: первые песни — на разминку, она длится
    8 минут. Длительности песен в приложении записаны как «3:45», и Тимур написал функцию, которая
    переводит такую запись в секунды и печатает результат, — на экране появлялись правильные числа.
    Но сложить их программа не смогла: `print` показывает число человеку, а программе ничего не
    отдаёт, и вместо суммы появилась ошибка про `None`. Когда Тимур заменил `print` на `return`,
    функция стала отдавать секунды, и длительность плейлиста посчиталась одной строкой.

why: >-
  Результат функции обычно нужен дальше: сложить, сравнить, передать другой функции. `return`
  отдаёт значение туда, где функцию вызвали: `total = to_seconds(3, 45) + to_seconds(4, 10)`.

usedIn: >-
  Цена со скидкой в интернет-магазине, проверка пароля («подходит или нет»), перевод градусов и
  скорости ветра в приложении погоды — всё это функции, которые считают и возвращают результат.
  Печатает результат обычно основная программа, а расчёт можно использовать где угодно.

steps:
  - id: return
    type: theory
    title: print показывает, return отдаёт
    body: |-
      Функция может распорядиться результатом двумя способами: **показать** его человеку или
      **отдать** программе. Показать — это `print`: текст появляется на экране, и на этом всё.
      Отдать — это `return`: результат возвращается туда, где функцию вызвали, и с ним можно
      работать дальше.

      ```python
      def to_seconds(minutes, seconds):
          return minutes * 60 + seconds

      total = to_seconds(3, 45) + to_seconds(4, 10)
      ```

      Вызов функции с `return` сам становится значением. Python выполняет тело, доходит до
      `return` и подставляет результат на место вызова — так же, как `len("кот")` превращается
      в 3. Результат можно положить в переменную, сложить, передать в `print` или проверить в
      условии: `if to_seconds(3, 45) > 200:`. Вернуть можно любое значение: число, строку, список
      или результат сравнения — `return temp < 0` отдаёт `True` или `False`.

      **`return` сразу завершает функцию**, даже если стоит внутри цикла. Строки после него не
      выполняются. Поэтому в ветках `if` может стоять несколько `return`: сработает тот, до
      которого дойдёт выполнение.

      **`None`** ты уже встречал в уроке 4.4: так отвечает `get`, если ключа нет. Это особое
      значение «ничего». Функция возвращает `None`, если выполнение дошло до конца её тела и не
      встретило `return`. Даже `print` — такая функция: `x = print("Привет")` напечатает «Привет»,
      а в `x` окажется `None`. Если `None` попадёт в вычисление, программа упадёт: `None + 1` даёт
      `TypeError` со словом `NoneType`. Значит, какая-то функция ничего не вернула: печатает
      результат вместо `return` или `return` есть не во всех ветках.

      Частое заблуждение: «число видно на экране — значит, функция его вернула». Нет: то, что
      напечатано, программа уже не получит.

      Хорошее правило: **функция-расчёт возвращает результат, а печатает основная программа.**
      Такую функцию легко проверить и использовать в других расчётах.

      **`pass`** — заглушка «пока ничего не делать». Тело функции не может быть пустым, поэтому в
      заготовках пишут `pass`. Такая функция возвращает `None`. Так устроены стартовые заготовки в
      заданиях: `pass` нужно заменить своим кодом.
    simpler: >-
      `print` — сказать вслух, `return` — отдать в руки. Сказанное вслух в карман не положишь.
      Если результат функции нужен дальше — сложить, сравнить, сохранить, — функция должна
      отдать его через `return`. Если до `return` дело не дошло, функция отдаёт `None`, то есть
      «ничего».
    coach: >-
      Видишь в ошибке `NoneType` — ищи функцию, которая ничего не вернула: например, печатает
      вместо `return`.

  - id: seconds
    type: example
    title: Секунды для плейлиста
    body: >-
      Функция из истории, только минуты и секунды приходят в неё отдельными числами. Нажми
      «Запустить».
    code: |-
      def to_seconds(minutes, seconds):
          return minutes * 60 + seconds

      first = to_seconds(3, 45)
      second = to_seconds(4, 10)
      total = first + second
      print(f"Два трека: {total} с")
      print(f"Это больше 7 минут? {total > 7 * 60}")
    notes:
      - line: 2
        text: >-
          `return` отдаёт результат формулы туда, где функцию вызвали. Сама функция ничего не
          печатает.
      - line: 4
        text: Вызов `to_seconds(3, 45)` превращается в число 225, и оно сохраняется в `first`.
      - line: 6
        text: Складываются уже готовые числа — значения, которые вернули два вызова.
      - line: 8
        text: "Результат можно не только печатать, но и сравнивать: `475 > 420` даёт `True`."
    tryIt: >-
      Замени во второй строке `return minutes * 60 + seconds` на
      `print(minutes * 60 + seconds)` и запусти. Появятся 225 и 250, а потом ошибка `TypeError`
      со словом `NoneType` — ровно как у Тимура. Верни `return` на место и допиши в конец
      `print(to_seconds(2, 30) * 2)`: вызов можно сразу использовать в выражении.
    coach: >-
      Обрати внимание: печатают только две последние строки. Функция считает, основная программа
      показывает.

  - id: print-or-return
    type: predict
    title: print или return
    prompt: >-
      Две функции почти одинаковые: одна печатает удвоенное число, другая возвращает его. Как
      думаешь, что выведет программа?
    code: |-
      def double_print(x):
          print(x * 2)

      def double_return(x):
          return x * 2

      a = double_print(5)
      b = double_return(5)
      print(a)
      print(b)
    options:
      - |-
        10
        10
      - |-
        10
        None
        10
      - |-
        10
        10
        10
    answer: |-
      10
      None
      10
    explanation: >-
      Первая `10` — это `print` внутри `double_print`: он сработал прямо во время вызова. `return`
      в этой функции нет, поэтому в `a` попал `None` — его и выводит `print(a)`. А `double_return`
      ничего не печатает, но отдаёт 10: это число попало в `b` и появилось последним.
    coach: >-
      Смотри не только на то, что появилось на экране, но и на то, что лежит в переменной.

  - id: after-return
    type: predict
    title: Что после return
    prompt: >-
      В функции два `return` и ещё одна строка после них. Как думаешь, что выведет программа?
    code: |-
      def frost_label(temp):
          if temp < 0:
              return "мороз"
          return "без мороза"
          print("проверено")

      print(frost_label(-5))
      print(frost_label(0))
    options:
      - |-
        мороз
        без мороза
      - |-
        мороз
        проверено
        без мороза
        проверено
      - |-
        мороз
        без мороза
        проверено
    answer: |-
      мороз
      без мороза
    explanation: >-
      `return` сразу завершает функцию. Для `-5` срабатывает первый `return`, и до остальных строк
      дело не доходит. Для 0 условие `0 < 0` ложно — ноль ещё не мороз, — и срабатывает второй
      `return`. Строка `print("проверено")` стоит после него и не выполнится никогда, ни при каком
      значении.
    coach: >-
      Строки сразу после `return` в том же блоке не выполнятся никогда. Нашёл такие у себя —
      значит, они стоят не на месте: перенеси их выше `return` или удали, если они не нужны.

  - id: practice-wind
    type: exercise
    title: Практика 1
    exercise:
      id: m5-l3-e1
      kind: repeat
      title: Ветер в метрах в секунду
      statement: |-
        Приложение погоды показывает ветер в километрах в час, а в памятке к забегу Тимура порог
        сильного ветра указан в метрах в секунду. Напиши функцию `kmh_to_ms(speed)`: она получает
        скорость в км/ч и **возвращает** её в м/с, округлённую до одного знака после запятой.

        1 м/с — это 3,6 км/ч (в коде дробную часть отделяют точкой: `3.6`). Например:

        ```text
        kmh_to_ms(36)   →  10.0
        kmh_to_ms(100)  →  27.8
        ```

        В заготовке стоит заглушка `pass` — замени её своим кодом. Строка `print` внизу — для
        тебя: нажми «Запустить» и посмотри, что возвращает функция. Проверка вызывает функцию сама
        и сравнивает именно возвращённое значение.
      input: Параметр `speed` — скорость в км/ч, число не меньше 0, возможно дробное.
      output: >-
        Функция возвращает число — скорость в м/с, округлённую до одного знака после запятой
        (как делает `round(x, 1)`).
      constraints:
        - Функция возвращает результат через `return`, а не печатает его.
        - Возвращай число — без единиц измерения.
      starterCode: |
        def kmh_to_ms(speed):
            pass  # верни скорость в м/с

        print(kmh_to_ms(36))  # ожидаю 10.0
      tests:
        - id: t1
          kind: call
          title: Пример 1
          example: true
          call: kmh_to_ms(36)
          expected: "10.0"
        - id: t2
          kind: call
          title: "Пример 2: нужно округление"
          example: true
          call: kmh_to_ms(100)
          expected: "27.8"
        - id: t3
          kind: call
          title: Ещё одна скорость
          call: kmh_to_ms(18)
          expected: "5.0"
        - id: t4
          kind: call
          title: "Граничный случай: штиль"
          edge: true
          call: kmh_to_ms(0)
          expected: "0.0"
        - id: t5
          kind: call
          title: Округление вниз
          call: kmh_to_ms(7)
          expected: "1.9"
        - id: t6
          kind: call
          title: Дробная скорость
          call: kmh_to_ms(12.6)
          expected: "3.5"
      criteria:
        - Функция отдаёт результат через `return`, а не печатает его.
        - Возвращается число, а не строка с единицами.
        - Результат округлён до одного знака после запятой; для 0 км/ч функция возвращает 0.0.
        - Дробная скорость тоже переводится точно, например 12.6 км/ч → 3.5 м/с.
      hints:
        - >-
          Функция получает скорость в км/ч. Что нужно сделать с этим числом, чтобы получить м/с, —
          и как отдать результат наружу? Посмотри, какой строкой функция `to_seconds` из примера
          отдаёт свой результат.
        - |-
          Похожая функция для другой задачи — переводит минуты в часы и оставляет два знака после
          запятой:
          ```python
          def minutes_to_hours(m):
              return round(m / 60, 2)

          print(minutes_to_hours(90))   # 1.5
          ```
        - |-
          Каркас тела функции — одна строка вместо `pass`:
          ```text
          return round(…, 1)
          ```
          Вместо многоточия — формула перевода из км/ч в м/с.
      solution:
        code: |
          def kmh_to_ms(speed):
              return round(speed / 3.6, 1)

          print(kmh_to_ms(36))  # ожидаю 10.0
        explanation: >-
          Формула `speed / 3.6` переводит км/ч в м/с, `round(…, 1)` оставляет один знак после
          запятой, а `return` отдаёт результат туда, где функцию вызвали. Поэтому
          `print(kmh_to_ms(36))` внизу печатает 10.0, а проверка получает то же число. Можно
          сначала сохранить результат в переменную и вернуть её — это то же самое.
      altSolutions:
        - code: |
            def kmh_to_ms(speed):
                ms = speed / 3.6
                return round(ms, 1)

            print(kmh_to_ms(36))
          note: Результат сначала сохранён в переменную, потом возвращён.
        - code: |
            def kmh_to_ms(speed):
                return round(speed * 1000 / 3600, 1)
          note: Перевод через метры и секунды; проверочный print удалён.
        - code: |
            def kmh_to_ms(speed):
                result = round(speed / 3.6, 1)
                print(result)
                return result

            print(kmh_to_ms(36) > 8)
          note: Отладочный print внутри функции не мешает, раз return есть.
        - code: |
            def kmh_to_ms(speed):
                return round(speed * 5 / 18, 1)

            print(f"36 км/ч = {kmh_to_ms(36)} м/с")
          note: "Формула * 5 / 18 (рецензия checks); f-строка в проверочном print."
        - code: |
            def kmh_to_ms(speed):
                speed = speed / 3.6
                return round(speed, 1)

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: Параметр перезаписан внутри функции (рецензия learner).
        - code: |
            def kmh_to_ms(speed):
                if speed == 0:
                    return 0
                return round(speed / 3.6, 1)

            print(kmh_to_ms(0), kmh_to_ms(36))
          note: Отдельная ветка для штиля возвращает int 0 — проверка числа терпима к int/float (рецензия checks).
      wrongSolutions:
        - code: |
            def kmh_to_ms(speed):
                print(round(speed / 3.6, 1))

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: Функция печатает результат вместо return.
          expectMistake: print-not-return
        - code: |
            def kmh_to_ms(speed):
                ms = round(speed / 3.6, 1)

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: Результат посчитан в переменную, но не возвращён.
          expectMistake: no-return
        - code: |
            def kmh_to_ms(speed):
                return f"{round(speed / 3.6, 1)} м/с"

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: Возвращается строка с единицами, а не число.
          expectMistake: returns-text
        - code: |
            def kmh_to_ms(speed):
                return round(speed * 3.6, 1)

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: Умножение вместо деления.
          expectMistake: multiply
        - code: |
            def kmh_to_ms(speed):
                return int(speed / 3.6)

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: int() отбрасывает дробную часть.
          expectMistake: int-cut
        - code: |
            def kmh_to_ms(speed):
                return speed / 3.6

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: Нет округления.
          expectMistake: no-round
        - code: |
            def kmh_to_ms(speed):
                ms = round(speed / 3.6, 1)
                return

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: Результат посчитан, а return пустой (рецензия checks, №10).
          expectMistake: empty-return
        - code: |
            def kmh_to_ms(speed):
                return round(speed / 3,6)

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: "Десятичная запятая: скорость делится на 3, а 6 уходит в число знаков round (рецензия checks, №8)."
          expectMistake: comma
        - code: |
            def kmh_to_ms(speed):
                return speed / 3,6

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: "Запятая без round: функция возвращает кортеж (12.0, 6) (рецензия learner)."
          expectMistake: comma
        - code: |
            def kmh_to_ms(speed):
                return round(speed / 3,6, 1)

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: "Совет «раздели на 3,6» понят буквально: у round три аргумента, TypeError (рецензия checks, №14)."
          expectMistake: comma
        - code: |
            def kmh_to_ms(speed):
                return round(3.6 / speed, 1)

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: Деление перевёрнуто (рецензия checks, №9).
          expectMistake: reversed
        - code: |
            def kmh_to_ms(speed):
                return round(int(speed) / 3.6, 1)

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: Скорость обрезана int() — дробная скорость считается неверно (рецензия checks, №12).
          expectMistake: int-cut
        - code: |
            def kmh_to_ms(speed):
                return round(speed / 3.6)

            print(kmh_to_ms(36))  # ожидаю 10.0
          note: round без второго аргумента — общий разбор «вернул 28, ожидалось 27.8» точен.
          expectMistake: null
      mistakes:
        - id: print-not-return
          when:
            failedTest: t1
            codeRegex: '(?<![\s\S])(?![\s\S]*\breturn\b)[\s\S]*^[ \t]+print\('
          where: Тело функции kmh_to_ms
          why: >-
            Функция печатает скорость, но ничего не возвращает, поэтому её вызов равен `None`.
            Проверка получает именно возвращённое значение, то есть `None`. Если строка `print`
            внизу на месте, она тоже выведет `None` — это и есть то, что вернула функция.
          try: Замени `print(...)` в теле функции на `return` с тем же выражением.
          verify: "Нажми «Запустить»: строка `print(kmh_to_ms(36))` должна вывести `10.0`, а не `None`."
        - id: empty-return
          when:
            failedTest: t1
            codeRegex: '^[ \t]+return[ \t]*(#.*)?$'
          where: Тело функции kmh_to_ms
          why: >-
            `return` без значения завершает функцию и отдаёт `None`. Скорость посчитана, но после
            `return` ничего не написано — наружу она не попала.
          try: >-
            Допиши после `return` то, что нужно отдать: формулу с `round(…, 1)` или переменную с
            результатом.
          verify: "Нажми «Запустить»: внизу должно появиться `10.0`, а не `None`."
        - id: no-return
          when:
            failedTest: t1
            codeRegex: '(?<![\s\S])(?![\s\S]*\breturn\b)'
          where: Тело функции kmh_to_ms
          why: >-
            В функции нет `return`, поэтому её вызов равен `None` — если строка `print` внизу на
            месте, она его и напечатает. Заглушка `pass` ничего не считает, а результат,
            сохранённый в переменную внутри функции, сам наружу не попадает.
          try: >-
            Отдай результат через `return`: сразу с формулой или с переменной, в которую ты его
            сохранил.
          verify: "Нажми «Запустить»: внизу должно появиться `10.0`, а не `None`."
        - id: comma
          when:
            codeRegex: '\b3\s*,\s*6\b'
          why: >-
            В Python дробную часть отделяют точкой, а не запятой. `3,6` — это два разных числа
            через запятую: скорость делится на 3, а 6 становится отдельным значением — например,
            вторым аргументом `round`.
          try: Запиши делитель с точкой — `3.6`.
          verify: "`kmh_to_ms(36)` должен вернуть 10.0."
        - id: reversed
          when:
            codeRegex: '\b3\.6\s*/\s*[A-Za-z_(]'
          why: >-
            Деление перевёрнуто: `3.6 / speed` делит 3,6 на скорость. Для 36 км/ч получается 0.1
            вместо 10, а для штиля (0 км/ч) — деление на ноль.
          try: Скорость должна стоять первой, делитель — вторым, как в `speed / 3.6`.
          verify: "`kmh_to_ms(36)` должен вернуть 10.0, а `kmh_to_ms(0)` — 0.0."
        - id: returns-text
          when:
            codeRegex: 'return\s+(f?["'']|str\()'
          why: >-
            Функция возвращает строку с единицами, например `'10.0 м/с'`. Со строкой нельзя
            считать: её не сравнишь с числом и не сложишь с другой скоростью. Единицы добавляют,
            когда печатают.
          try: >-
            Верни только число. Если хочешь видеть единицы, допиши их в `print` внизу:
            `print(kmh_to_ms(36), "м/с")`.
          verify: "`kmh_to_ms(36)` должен вернуть число 10.0."
        - id: multiply
          when:
            codeRegex: '\*\s*3\.6'
          why: >-
            1 м/с — это 3,6 км/ч, поэтому в м/с та же скорость записывается меньшим числом.
            Умножение на 3,6 делает число больше: из 36 км/ч получается 129.6 вместо 10.
          try: Раздели скорость на `3.6` — в Python дробную часть отделяют точкой.
          verify: "`kmh_to_ms(36)` должен вернуть 10.0."
        - id: int-cut
          when:
            codeRegex: '\bint\s*\(|//'
          why: >-
            `int()` отбрасывает всю дробную часть. У результата 27.77… превращается в 27, а нужно
            27.8. У самой скорости 12.6 км/ч превращается в 12, и перевод выходит неточным. Так же
            ведёт себя деление `//`.
          try: >-
            Убери `int()` и `//`: дели скорость как есть, а результат округли через `round(…, 1)`
            — он оставляет один знак после запятой.
          verify: "`kmh_to_ms(100)` должен вернуть 27.8, а `kmh_to_ms(12.6)` — 3.5."
        - id: no-round
          when:
            failedTest: t2
            codeRegex: '(?<![\s\S])(?![\s\S]*\bround\s*\()'
          why: >-
            Функция возвращает число без округления: для 100 км/ч это 27.77777777777778, а нужно
            27.8. Для 36 км/ч ответ получается ровным, поэтому первый пример прошёл.
          try: >-
            Оберни формулу в `round(…, 1)`: второй аргумент говорит, сколько знаков оставить после
            запятой.
          verify: "`kmh_to_ms(100)` должен вернуть 27.8."
      afterPass: >-
        Функция отдаёт число, а значит, его можно использовать в расчётах: `kmh_to_ms(36) > 8`
        даёт `True`, и программа может сама предупредить о сильном ветре. Если хочешь, напиши
        обратную функцию `ms_to_kmh(speed)` и проверь, что `ms_to_kmh(kmh_to_ms(36))` возвращает
        36.0.
      skills: [functions, numbers-arithmetic]

  - id: practice-playlist
    type: exercise
    title: Практика 2
    exercise:
      id: m5-l3-e2
      kind: fix
      title: Песни для разминки
      statement: |-
        Вот программа Тимура из истории. Функция `to_seconds` получает длительность песни строкой
        вида `"3:45"` и должна отдавать её в секундах. Сейчас программа печатает `225` и `250`, а
        потом падает:

        ```text
        TypeError: unsupported operand type(s) for +: 'NoneType' and 'NoneType'
        ```

        1. Исправь функцию так, чтобы она **возвращала** число секунд и ничего не печатала.
        2. Эти две песни — на разминку, а она длится 8 минут. Допиши в конец программы проверку:
           если песни вместе длятся не дольше 8 минут, выведи `Укладываемся в 8 минут`, иначе —
           `Не укладываемся в 8 минут`.

        Для этих двух песен программа должна вывести:

        ```text
        Всего: 475 с
        Укладываемся в 8 минут
        ```
      input: Параметр `time_text` — строка «минуты:секунды», например `"3:45"` или `"10:00"`.
      output: >-
        Функция возвращает целое число секунд и ничего не печатает. Программа выводит две строки:
        сумму секунд и ответ, укладываются ли песни в 8 минут. Ровно 8 минут — ещё укладываются.
      constraints:
        - "Секунды всегда записаны двумя цифрами: `\"4:05\"`, а не `\"4:5\"`."
        - >-
          Итог должен складываться из результатов двух вызовов `to_seconds`, как сейчас: проверка
          подставит вместо `"4:10"` другие песни.
      starterCode: |
        def to_seconds(time_text):
            parts = time_text.split(":")
            print(int(parts[0]) * 60 + int(parts[1]))

        total = to_seconds("3:45") + to_seconds("4:10")
        print(f"Всего: {total} с")
        # Допиши проверку: укладываются ли песни в 8 минут
      tests:
        - id: t1
          kind: call
          title: Пример 1
          example: true
          call: 'to_seconds("3:45")'
          expected: "225"
        - id: t2
          kind: call
          title: Пример 2
          example: true
          call: 'to_seconds("4:10")'
          expected: "250"
        - id: t3
          kind: call
          title: "Граничный случай: меньше минуты"
          edge: true
          call: 'to_seconds("0:59")'
          expected: "59"
        - id: t4
          kind: call
          title: "Граничный случай: ровно 10 минут"
          edge: true
          call: 'to_seconds("10:00")'
          expected: "600"
        - id: t5
          kind: call
          title: "Граничный случай: ноль впереди у секунд"
          edge: true
          call: 'to_seconds("4:05")'
          expected: "245"
        - id: t6
          kind: io
          title: Вывод программы
          example: true
          expected: |-
            Всего: 475 с
            Укладываемся в 8 минут
          compare:
            ignoreSpaces: true
        - id: t7
          kind: assert
          title: "Другая песня: длиннее разминки"
          code: |-
            import contextlib, io, re
            source = open(__file__, encoding="utf-8").read()
            pattern = r"""(["'])4:10\1"""
            assert re.search(pattern, source)
            changed = re.sub(pattern, '"4:50"', source)
            buffer = io.StringIO()
            with contextlib.redirect_stdout(buffer):
                exec(compile(changed, "main.py", "exec"), {"__name__": "__main__", "__builtins__": __builtins__})
            out = buffer.getvalue()
            lines = [line.strip() for line in out.splitlines() if line.strip()]
            assert "515" in out and lines[-1] == "Не укладываемся в 8 минут"
          message: >-
            Проверка заменила песню "4:10" на "4:50": вместе 515 с, это больше 8 минут. Программа
            должна вывести «Всего: 515 с» и «Не укладываемся в 8 минут».
        - id: t8
          kind: assert
          title: "Граничный случай: ровно 8 минут"
          edge: true
          code: |-
            import contextlib, io, re
            source = open(__file__, encoding="utf-8").read()
            pattern = r"""(["'])4:10\1"""
            assert re.search(pattern, source)
            changed = re.sub(pattern, '"4:15"', source)
            buffer = io.StringIO()
            with contextlib.redirect_stdout(buffer):
                exec(compile(changed, "main.py", "exec"), {"__name__": "__main__", "__builtins__": __builtins__})
            out = buffer.getvalue()
            lines = [line.strip() for line in out.splitlines() if line.strip()]
            assert "480" in out and lines[-1] == "Укладываемся в 8 минут"
          message: >-
            Проверка заменила песню "4:10" на "4:15": вместе ровно 480 с, то есть 8 минут. Это ещё
            укладывается — программа должна вывести «Всего: 480 с» и «Укладываемся в 8 минут».
      rules:
        - id: r-calls
          use: [call:to_seconds]
          message: >-
            Итог должен складываться из того, что вернули вызовы to_seconds, а не считаться
            заново или записываться готовым числом.
      criteria:
        - Функция возвращает число секунд через `return` и сама ничего не печатает.
        - "Программа выводит `Всего: … с` — сумму результатов двух вызовов `to_seconds`."
        - Проверка сравнивает секунды с секундами; ровно 8 минут — «Укладываемся».
        - Работают длительности меньше минуты, с нулём секунд и с нулём впереди (`4:05`).
      hints:
        - >-
          Задание из двух частей. Сначала функция: какая строка в ней только показывает число на
          экране? Строка с `total` получает то, что функция **отдаёт**, — а что она отдаёт
          сейчас? Потом проверка: подумай, в каких единицах записан `total`, а в каких —
          длительность разминки.
        - |-
          На другом примере — цена покупки плюс пакет за 5 руб.:
          ```python
          def with_bag(price):
              print(price + 5)
          ```
          Вызов `with_bag(100)` покажет 105, но `with_bag(100) * 2` упадёт с `NoneType`. С
          `return price + 5` вызов станет числом 105, и его можно сравнить:
          ```python
          def with_bag(price):
              return price + 5

          cost = with_bag(100)
          if cost <= 2 * 50:
              print("Хватит двух монет по 50")
          else:
              print("Двух монет по 50 не хватит")
          ```
        - |-
          Каркас программы:
          ```text
          def to_seconds(time_text):
              parts = time_text.split(":")
              return …   # то же выражение, что сейчас стоит в print

          total = to_seconds("3:45") + to_seconds("4:10")
          print(f"Всего: {total} с")
          if total <= …:   # 8 минут — это сколько секунд?
              print(…)
          else:
              print(…)
          ```
      solution:
        code: |
          def to_seconds(time_text):
              parts = time_text.split(":")
              return int(parts[0]) * 60 + int(parts[1])

          total = to_seconds("3:45") + to_seconds("4:10")
          print(f"Всего: {total} с")
          if total <= 8 * 60:
              print("Укладываемся в 8 минут")
          else:
              print("Не укладываемся в 8 минут")
        explanation: >-
          Главная правка — `print(...)` в функции заменён на `return` с тем же выражением. Теперь
          вызов `to_seconds("3:45")` равен 225, и строка с `total` складывает два числа. Дальше
          это число работает и в условии: `total` — секунды, поэтому разминку тоже переводим в
          секунды, `8 * 60`. Знак `<=` включает ровно 8 минут. Функция ничего не печатает —
          выводит основная программа.
