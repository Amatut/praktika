            codeRegex: 'return[ \t]+(str\(|f?["''])'
          why: >-
            Функция возвращает секунды строкой: `'225'`, а не число 225. Для строк `+` означает
            склейку, поэтому вместо суммы выходит `225250`. А сравнить строку с числом в условии
            Python вообще не может.
          try: "Верни число — без `str()` и кавычек: `int(...)` уже даёт число."
          verify: "`to_seconds(\"3:45\")` должен вернуть число 225."
        - id: hardcoded
          when:
            codeRegex: 'print\(\s*f?["''][^"''\n{]*475'
          why: >-
            Итог записан в `print` готовым числом 475. Для этих двух песен он совпал, но Тимуру
            нужна программа, которая считает сама — для любых песен. Проверка отдельно вызывает
            `to_seconds` и подставляет другие песни.
          try: >-
            Верни строку `total = to_seconds("3:45") + to_seconds("4:10")` и выведи `total` в
            f-строке. Если в функции ещё стоит `print`, замени его на `return`.
          verify: "`to_seconds(\"3:45\")` должен вернуть 225, а программа — вывести `Всего: 475 с`."
        - id: still-print
          when:
            errorIncludes: NoneType
            codeRegex: '^def[ \t]+to_seconds\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+print\('
          where: Тело функции to_seconds
          why: >-
            Функция печатает секунды, а не возвращает их. На экране появляются числа, но вызов
            `to_seconds(...)` равен `None` — и в сумму попадает `None`. Отсюда `TypeError` со словом
            `NoneType`.
          try: Замени в функции `print(...)` на `return` с тем же выражением.
          verify: "`to_seconds(\"3:45\")` должен вернуть 225, а программа — вывести `Всего: 475 с`."
        - id: no-return
          when:
            errorIncludes: NoneType
          where: Тело функции to_seconds
          why: >-
            В функции нет `return`, поэтому её вызов равен `None`, и в сумму попадает `None` —
            отсюда `TypeError` со словом `NoneType`. Результат, сохранённый в переменную внутри
            функции, сам наружу не попадает.
          try: >-
            Отдай результат через `return`: сразу с выражением или с переменной, в которую ты его
            сохранил.
          verify: "`to_seconds(\"3:45\")` должен вернуть 225, а программа — вывести `Всего: 475 с`."
        - id: debug-print
          when:
            failedTest: t6
            codeRegex: '^print\(\s*to_seconds\('
          why: >-
            Функция уже возвращает секунды, и сумма верная. Лишние строки 225 и 250 печатают
            проверочные `print(to_seconds(...))` в основной программе, а проверка сравнивает весь
