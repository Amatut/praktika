      mistakes:
        - id: fixed-count
          when:
            failedTest: t9
            codeRegex: 'family\s*\[\s*\d+\s*\]|range\(\s*\d+\s*\)|while\b[^\n]*<=?\s*\d+\s*:'
          why: >-
            Итог считается только для первых четырёх человек: число людей записано в коде готовым.
            Для этой семьи ответ совпал, но проверка подставила семью из пяти, и пятый в сумму не
            попал. А для семьи из трёх программа упадёт с `IndexError`.
          try: >-
            Пройди циклом по самому списку: `for age in family:` — цикл сделает столько шагов,
            сколько людей в списке.
          verify: "Добавь в список возраст 8 и нажми «Запустить»: итог должен стать 1200."
        - id: hardcoded
          when:
            failedTest: t9
            outputEquals: "Итого: 1000"
          why: >-
            Итог не зависит от списка `family`: проверка подставила в него другую семью, а итог не
            изменился. Похоже, он записан готовым числом или возрасты перечислены вручную. Если
            строки `family = [...]` в программе нет — верни её: итог считается по этому списку.
          try: >-
            Пройди циклом по `family` и прибавляй к накопителю то, что вернула `ticket_price` для
            каждого возраста.
          verify: "Добавь в список возраст 8 и нажми «Запустить»: итог должен стать 1200."
        - id: returns-text
          when:
            errorIncludes: "'int' and 'str'"
          why: >-
            Функция возвращает цену строкой — например, `"400"`. Строку нельзя прибавить к числу в
            накопителе, отсюда `TypeError`.
          try: Возвращай число без кавычек. Слова и единицы добавляют, когда печатают итог.
          verify: "`ticket_price(40)` должен вернуть число 400."
        - id: whole-list
          when:
            errorIncludes: "'list' and 'int'"
          why: >-
            В `ticket_price` передан весь список `family`, а функция рассчитана на один возраст.
            Список нельзя сравнить с числом, отсюда `TypeError`.
          try: >-
            Пройди циклом по `family` и вызывай `ticket_price(age)` для каждого возраста, прибавляя
            результат к накопителю.
          verify: "Программа должна вывести `Итого: 1000`."
        - id: no-return
          when:
            errorIncludes: NoneType
          why: >-
            Для какого-то возраста функция возвращает `None`: в ней нет `return`, он есть не во
            всех ветках или вместо него стоит `print`. Цикл пытается прибавить `None` к сумме,
            отсюда `TypeError`.
          try: >-
            Проверь каждую ветку: в конце каждой должен сработать `return` с числом. Если цена
            сохранена в переменную, верни её: `return price`.
          verify: "`ticket_price(40)` должен вернуть 400, а программа — вывести `Итого: 1000`."
        - id: print-in-loop
          when:
            failedTest: t3
            codeRegex: '^[ \t]+print\(\s*f?["'']Итого'
          why: >-
            `print` с итогом стоит внутри цикла, поэтому печатает промежуточную сумму после каждого
            человека. Сумма в конце верная, но строк получается четыре вместо одной.
          try: Убери отступ у строки с `print`, чтобы она выполнилась один раз — после цикла.
          verify: "Программа должна вывести одну строку `Итого: 1000`."
        - id: extra-print
          when:
            failedTest: t3
            codeRegex: '^[ \t]+print\((?![^\n]*Итого)'
          why: >-
            Кроме итога программа печатает что-то ещё: `print` стоит внутри функции или цикла и
            выводит лишние строки. Проверка сравнивает весь вывод, а там должна быть одна строка.
          try: >-
            Убери лишний `print`. Функция только возвращает цену, а печатает основная программа —
            один раз, после цикла.
          verify: "Программа должна вывести одну строку `Итого: 1000`."
        - id: boundary-young
          when:
            codeRegex: '(<=\s*7|>\s*7|<\s*6|>=\s*6)\b|\b7\s*<(?!=)|\b6\s*<='
          why: >-
            Граница детского билета сдвинута. По условию 6 лет — ещё бесплатно, а в 7 лет билет уже
            стоит 200. Знак `<` не включает границу, а `<=` включает: `age < 7` верно для возрастов
            0–6, а `age <= 7` — ещё и для 7. Так же `7 < age` не включает саму семёрку — нужно
            `7 <= age`.
          try: Проверь сравнение с 7, потом вызови `print(ticket_price(6), ticket_price(7))`.
          verify: "Должно получиться `0 200`."
        - id: boundary-adult
          when:
            codeRegex: '(<=\s*18|>\s*18|<\s*17|>=\s*17)\b|\b17\s*<=|\b18\s*<(?!=)'
          why: >-
            Граница взрослого билета сдвинута. По условию в 17 лет билет ещё стоит 200, а в 18 — уже
            400. `age < 18` верно для 17 лет и младше, а `age <= 18` захватывает и 18. И наоборот:
            `age > 18` не включает саму границу — нужно `age >= 18`.
          try: Проверь сравнение с 18, потом вызови `print(ticket_price(17), ticket_price(18))`.
          verify: "Должно получиться `200 400`."
        - id: order-young
          when:
            failedTest: t8
            codeRegex: '(<\s*18|<=\s*17)\b[\s\S]*(<\s*7|<=\s*6)\b'
          why: >-
            Проверки стоят не в том порядке. Условия проверяются сверху вниз, и срабатывает первая
            подходящая ветка. Первой стоит «младше 18» — в неё попадают и маленькие дети, до
            проверки «младше 7» дело не доходит.
          try: >-
            Иди по возрастам по порядку: сначала «младше 7», потом «младше 18», в конце — все
            остальные.
          verify: "`ticket_price(5)` должен вернуть 0, а `ticket_price(12)` — 200."
        - id: order-adult
          when:
            failedTest: t1
            codeRegex: '(>=\s*7|>\s*6)\b[\s\S]*(>=\s*18|>\s*17)\b'
          why: >-
            Проверки стоят не в том порядке. Условия проверяются сверху вниз, и срабатывает первая
            подходящая ветка. Первой стоит «от 7» — в неё попадают и взрослые, до проверки «от 18»
            дело не доходит.
          try: "Иди от старших к младшим: сначала «от 18», потом «от 7», в конце — все остальные."
          verify: "`ticket_price(40)` должен вернуть 400, а `ticket_price(12)` — 200."
      afterPass: >-
        Функция проверена на всех границах и работает внутри цикла: чтобы посчитать другую семью,
        достаточно поменять список. Если хочешь, добавь льготу — например, с 65 лет билет за 200:
        это ещё одна ветка с `return`, а цикл менять не придётся.
      skills: [functions, conditions, boundary-checks, accumulators]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`return` отдаёт значение туда, где функцию вызвали, а `print` только показывает его человеку."
      - Вызов функции с `return` можно положить в переменную, сложить, сравнить или передать другой функции.
      - "`return` сразу завершает функцию; если до `return` дело не дошло, функция возвращает `None`."
      - Ошибка со словом `NoneType` — повод найти функцию, которая ничего не вернула, например печатает вместо `return`.
    question: >-
      Функция `discount(price)` печатает цену со скидкой. Почему `discount(1000) + 50` падает с
      ошибкой, хотя на экране видно 900?
    answer: >-
      `print` только показывает 900 на экране, а сама функция ничего не возвращает — её вызов равен
      `None`. Получается `None + 50`, отсюда `TypeError`. Если заменить `print` на `return`, вызов
      станет числом 900, и сложение сработает.
