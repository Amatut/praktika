          where: Тело функции to_seconds
          why: >-
            Функция уже возвращает секунды — сумма посчитана верно. Но в ней остался `print`, и
            перед итогом появляются лишние строки 225 и 250.
          try: "Удали `print` из функции: печатает основная программа, а функция только считает."
          verify: "Программа должна вывести две строки: `Всего: 475 с` и `Укладываемся в 8 минут`."
        - id: minutes-vs-seconds
          when:
            failedTest: t6
            codeRegex: '(?:\btotal|\))\s*[<>]=?\s*8\b(?!\s*\*)'
          why: >-
            `total` — это секунды (475), а 8 — минуты. Сравнение `475 <= 8` ложно, поэтому программа
            решает, что песни не укладываются. Сравнивать можно только числа в одних единицах.
          try: "Переведи разминку в секунды: 8 минут — это `8 * 60`."
          verify: "Программа должна вывести `Всего: 475 с` и `Укладываемся в 8 минут`."
        - id: boundary-8
