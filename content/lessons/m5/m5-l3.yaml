  - id: practice-tickets
    type: exercise
    title: Практика 3
    exercise:
      id: m5-l3-e3
      kind: write
      title: Билеты для семьи
      statement: |-
        Семья идёт в зоопарк: папе 38 лет, маме 36, детям 12 и 5. Цена билета зависит от возраста:

        ```text
        младше 7 лет                 — 0 (бесплатно)
        от 7 до 17 лет включительно  — 200
        18 лет и старше              — 400
        ```

        1. Напиши функцию `ticket_price(age)`, которая **возвращает** цену билета для одного
           возраста — числом.
        2. С её помощью посчитай, сколько стоят билеты для всей семьи из списка `family`, и выведи:

        ```text
        Итого: 1000
        ```
      input: >-
        Параметр `age` — возраст, целое число от 0 и больше. Список `family` уже есть в стартовом
        коде.
      output: >-
        Функция возвращает цену числом: 0, 200 или 400. Программа печатает одну строку
        `Итого: <сумма>`.
      constraints:
        - "Цену возвращай числом, без «руб.»: её нужно складывать."
        - >-
          Итог посчитай по списку `family` с помощью `ticket_price`, а не записывай готовым
          числом: проверка подставит в список другую семью.
      starterCode: |
        # Напиши функцию ticket_price(age): она возвращает цену билета для одного возраста


        family = [38, 36, 12, 5]
        # Посчитай стоимость билетов для всей семьи и выведи «Итого: …»
      tests:
        - id: t1
          kind: call
          title: Взрослый
          example: true
          call: ticket_price(40)
          expected: "400"
        - id: t2
          kind: call
          title: Школьник
          example: true
          call: ticket_price(12)
          expected: "200"
        - id: t3
          kind: io
          title: Вся семья
          example: true
          expected: "Итого: 1000"
          compare:
            ignoreSpaces: true
        - id: t4
          kind: call
          title: "Граничный случай: 6 лет — ещё бесплатно"
          edge: true
          call: ticket_price(6)
          expected: "0"
        - id: t5
          kind: call
          title: "Граничный случай: 7 лет — уже 200"
          edge: true
          call: ticket_price(7)
          expected: "200"
        - id: t6
          kind: call
          title: "Граничный случай: 17 лет — ещё 200"
          edge: true
          call: ticket_price(17)
          expected: "200"
        - id: t7
          kind: call
          title: "Граничный случай: 18 лет — уже 400"
          edge: true
          call: ticket_price(18)
          expected: "400"
        - id: t8
          kind: call
          title: "Граничный случай: младенец"
          edge: true
          call: ticket_price(0)
          expected: "0"
        - id: t9
          kind: assert
          title: Другая семья
          code: |-
            import contextlib, io, re
            source = open(__file__, encoding="utf-8").read()
            pattern = r"family\s*=\s*\[[^\]]*\]"
            assert re.search(pattern, source)
            changed = re.sub(pattern, "family = [70, 40, 15, 10, 8]", source)
            buffer = io.StringIO()
            with contextlib.redirect_stdout(buffer):
                exec(compile(changed, "main.py", "exec"), {"__name__": "__main__", "__builtins__": __builtins__})
            assert re.search(r"Итого:\s*1400\b", buffer.getvalue())
          message: >-
            Итог должен считаться по списку family: для семьи [70, 40, 15, 10, 8] программа должна
            вывести «Итого: 1400».
      rules:
        - id: r-total
          use: [call:ticket_price]
          message: >-
            Посчитай итог с помощью функции ticket_price: вызови её для каждого возраста из family.
      criteria:
        - "`ticket_price` возвращает цену числом для любого возраста; 7 и 18 лет попадают в свои группы по условию."
        - Итог считается по списку `family` с помощью `ticket_price` — например, накопителем в цикле — и годится для семьи любого размера.
        - "Программа печатает одну строку `Итого: <сумма>`."
      hints:
        - >-
          Раздели задачу на две части. Сначала функция для одного человека: в ней три случая, и в
          каждом свой `return`. Проверь её на границах — 6, 7, 17 и 18 лет. Потом — накопитель по
          списку, как в модуле про циклы, только к сумме прибавляется то, что вернула функция.
        - |-
          Похожая задача — доставка посылок по весу:
          ```python
          def shipping(weight):
              if weight < 1:
                  return 100
              if weight < 5:
                  return 250
              return 500

          total = 0
          for w in [0.5, 3, 12]:
              total += shipping(w)
          print(total)   # 850
          ```
        - |-
          Каркас:
          ```text
          def ticket_price(age):
              if age < …:
                  return …
              if age < …:
                  return …
              return …

          family = [38, 36, 12, 5]
          total = 0
          for age in family:
              total += …
          print(f"Итого: {total}")
          ```
      solution:
        code: |
          def ticket_price(age):
              if age < 7:
                  return 0
              if age < 18:
                  return 200
              return 400


          family = [38, 36, 12, 5]
          total = 0
          for age in family:
              total += ticket_price(age)
          print(f"Итого: {total}")
        explanation: >-
          Проверки идут от младшего возраста к старшему: первой срабатывает `age < 7`, до
