          try: Удали проверочные `print` перед «Проверить» — оставь только итог и ответ про разминку.
          verify: "Программа должна вывести две строки: `Всего: 475 с` и `Укладываемся в 8 минут`."
        - id: both
          when:
            failedTest: t6
            codeRegex: '^def[ \t]+to_seconds\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+print\('
