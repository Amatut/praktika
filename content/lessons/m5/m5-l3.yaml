      mistakes:
        - id: return-print
          when:
            codeRegex: 'return[ \t]+print\s*\('
          why: >-
            `return print(...)` сначала печатает число, а потом возвращает то, что вернул сам
            `print`. А `print` всегда возвращает `None` — поэтому сумма снова ломается.
          try: "Убери `print` из этой строки: после `return` должно стоять само выражение с секундами."
          verify: "`to_seconds(\"3:45\")` должен вернуть 225, а программа — вывести `Всего: 475 с`."
        - id: empty-return
          when:
            codeRegex: '^[ \t]+return[ \t]*(#.*)?$'
          why: >-
            `return` без значения завершает функцию и возвращает `None`. Выражение с секундами так
            и осталось в `print`, а наружу ничего не попало.
          try: Перенеси выражение с секундами из `print` в `return`, а строку с `print` удали.
          verify: "`to_seconds(\"3:45\")` должен вернуть 225, а программа — вывести `Всего: 475 с`."
        - id: return-text
          when:
