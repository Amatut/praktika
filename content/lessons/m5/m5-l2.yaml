            def progress_bar(done, total):
                bar = "#" * done + "-" * total - done
                print(f"[{bar}] {done} из {total}")

            progress_bar(3, 5)
            progress_bar(0, 4)
            progress_bar(total=10, done=7)
          note: Разность не взята в скобки — Python вычитает число из строки.
          expectMistake: no-parens
        - code: |
            def progress_bar(total, done):
                bar = "#" * done + "-" * (total - done)
                print(f"[{bar}] {done} из {total}")

            progress_bar(3, 5)
            progress_bar(0, 4)
            progress_bar(total=10, done=7)
          note: Параметры в def стоят в другом порядке, чем значения в вызове.
          expectMistake: swapped
        - code: |
