        explanation: >-
          `fragile=False` в `def` — значение по умолчанию: первый вызов передаёт три значения, и
          `fragile` получает `False`. Второй вызов передаёт `True` четвёртым по порядку, третий —
          по имени. `if fragile:` печатает предупреждение только для хрупкого груза, и эта
          проверка стоит перед чертой. `if fragile == True:` тоже сработает, но, как в уроке 2.4,
          флаг проверяют короче — `if fragile:`: в нём и так лежит `True` или `False`.
