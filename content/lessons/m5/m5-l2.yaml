      mistakes:
        - id: param-name
          when:
            errorIncludes: unexpected keyword argument
          why: >-
            Функцию вызывают с именованным аргументом `fragile=...` — так записан третий вызов в
            стартовом коде, так её вызывает и проверка. Параметра с таким именем в `def` нет: у
            тебя он называется иначе.
          try: Назови четвёртый параметр именно `fragile` — в `def` и в `if`. Вызовы оставь как были.
          verify: Ошибка TypeError должна исчезнуть, а в «Примере 1» появятся три этикетки.
        - id: three-params
          when:
            errorIncludes: takes 3 positional arguments but 4 were given
          why: >-
            В `def` пока три параметра, а функцию вызывают с четырьмя значениями — так записаны
            второй и третий вызовы, так её вызывает и проверка. Четвёртому значению некуда лечь.
          try: >-
            Добавь в `def` четвёртый параметр `fragile`. Подумай, каким он должен быть, чтобы
            первый вызов с тремя значениями тоже работал.
          verify: Ошибка TypeError должна исчезнуть, а в «Примере 1» появятся три этикетки.
        - id: no-default
          when:
            errorIncludes: "missing 1 required positional argument: 'fragile'"
          why: >-
            Функцию вызывают и без четвёртого значения — так записан первый вызов, так её
            вызывает и проверка. Без значения по умолчанию Python не знает, чему в этом случае
            равен `fragile`.
          try: "Задай значение по умолчанию прямо в `def`: `fragile=False`."
        - id: default-first
          when:
            errorIncludes: parameter without a default follows parameter with a default
          why: >-
            Параметр со значением по умолчанию стоит раньше обязательных. Так писать нельзя:
            необязательные параметры идут в самом конце, иначе Python не поймёт, какому параметру
            какое значение достанется.
          try: Перенеси `fragile=False` в конец списка параметров — после `weight`.
        - id: after-line
          when:
            outputIncludes: "Вес: 1.2 кг\n--------------------\nОСТОРОЖНО"
          why: >-
            Предупреждение напечаталось после черты. Строки тела выполняются сверху вниз, а `if`
            с предупреждением стоит ниже `print("-" * 20)`, поэтому и строка с предупреждением
            выходит ниже.
          try: >-
            Перенеси `if` вместе с его `print` выше строки `print("-" * 20)` — сразу после строки
            с весом.
          verify: В «Примере 1» у второй этикетки предупреждение должно стоять над чертой.
        - id: string-true
          when:
            codeRegex: '["''](True|False)["'']'
          why: >-
            `True` и `False` в кавычках — это строки, а не логические значения. Вызовы передают
            `True` без кавычек, и строке `"True"` оно не равно, а непустая строка `"False"` в
            условии считается истинной. Поэтому предупреждение печатается не у тех коробок.
          try: >-
            Убери кавычки вокруг `True` и `False` — и в `def`, и в `if`. Хватит `if fragile:` —
            в `fragile` и так лежит `True` или `False`.
          verify: В «Примере 1» предупреждение должно быть только у второй и третьей этикетки.
        - id: reset-in-body
          when:
            failedTest: t3
            codeRegex: '^[ \t]+fragile[ \t]*=[ \t]*False[ \t]*(#.*)?$'
          why: >-
            Строка `fragile = False` в теле функции затирает то, что пришло при вызове: даже когда
            передали `True`, дальше в `fragile` лежит `False`. Значение по умолчанию задают не в
            теле, а в скобках `def`.
          try: "Убери эту строку из тела, а значение по умолчанию оставь в `def`: `fragile=False`."
          verify: В «Примере 1» у второй и третьей этикетки должно появиться предупреждение.
        - id: always
          when:
            outputIncludes: "Вес: 2.5 кг\nОСТОРОЖНО"
          why: >-
            У первой коробки четвёртого значения нет — груз обычный, а предупреждение всё равно
            напечаталось. Так бывает, если строка стоит без условия, если условие перевёрнуто
            (`if not fragile:`, `if fragile == False:`) или если значение по умолчанию — `True`.
          try: >-
            Проверь две вещи: предупреждение печатается внутри `if fragile:`, а значение по
            умолчанию в `def` — `False`.
          verify: В «Примере 1» у первой этикетки предупреждения быть не должно.
        - id: warning-place
          when:
            failedTest: t3
            outputIncludes: "ОСТОРОЖНО: ХРУПКОЕ"
          why: >-
            Предупреждение печатается, но строки этикетки идут не в том порядке. У хрупкого груза
            их ровно пять: «Заказ», «Получатель», «Вес», «ОСТОРОЖНО: ХРУПКОЕ» и одна черта. Строки
            выходят в том порядке, в каком стоят `print` в теле функции.
          try: >-
            Поставь проверку `if fragile:` с её `print` после строки с весом и прямо перед
            единственным `print` черты.
          verify: "В «Примере 1» у второй этикетки строка «ОСТОРОЖНО: ХРУПКОЕ» должна стоять между весом и чертой."
      afterPass: >-
        Старые вызовы работают без изменений: значение по умолчанию бережёт их. Так в настоящих
        программах добавляют новые возможности — новый параметр со значением по умолчанию, и код,
        который уже вызывает функцию, ничего не замечает.
      skills: [functions, conditions]

  - id: practice-progress
    type: exercise
    title: Практика 3
    exercise:
      id: m5-l2-e3
      kind: write
      title: Полоска прогресса
      statement: |-
        Трекер тренировок показывает, сколько занятий из плана уже сделано. Напиши функцию
        `progress_bar(done, total)`: она печатает полоску в квадратных скобках и подпись. Знак `#`
        — сделанная тренировка, `-` — оставшаяся. Например, 3 из 5:

        ```text
        [###--] 3 из 5
        ```

        Вызовы в этот раз пишешь ты — под функцией. Вызови её три раза: для 3 из 5, для 0 из 4
        и для 7 из 10. Третий вызов запиши с именованными аргументами — например, начни с
        `total`: по имени порядок не важен. Программа должна напечатать:

        ```text
        [###--] 3 из 5
        [----] 0 из 4
        [#######---] 7 из 10
        ```
      input: "Нет ввода: `done` — сколько тренировок сделано, `total` — сколько их в плане."
      output: "Одна строка на вызов: `[`, решётки за сделанные, дефисы за оставшиеся, `]`, пробел и подпись `<done> из <total>`."
      constraints:
        - "0 ≤ done ≤ total, в плане хотя бы одна тренировка."
        - Функция ничего не спрашивает через `input()`, данные приходят через параметры.
        - Три вызова в порядке из условия; третий — с именованными аргументами.
      starterCode: |
        # Трекер тренировок: полоска прогресса.
        # Напиши функцию progress_bar(done, total) здесь.


        # Под функцией вызови её три раза: для 3 из 5, для 0 из 4
        # и для 7 из 10. Третий вызов запиши с именованными
        # аргументами, начиная с total.
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          expected: |-
            [###--] 3 из 5
            [----] 0 из 4
            [#######---] 7 из 10
        - id: t2
          kind: assert
          title: Одна из трёх
          example: true
          code: |-
            import io, contextlib

            def _printed_lines(*args, **kwargs):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    progress_bar(*args, **kwargs)
                return [line.rstrip() for line in buffer.getvalue().rstrip().splitlines()]

            assert _printed_lines(1, 3) == ["[#--] 1 из 3"]
          message: "Вызов progress_bar(1, 3) печатает строку: [#--] 1 из 3"
        - id: t3
          kind: assert
          title: "Граничный случай: план выполнен"
          edge: true
          code: |-
            import io, contextlib

            def _printed_lines(*args, **kwargs):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    progress_bar(*args, **kwargs)
                return [line.rstrip() for line in buffer.getvalue().rstrip().splitlines()]

            assert _printed_lines(5, 5) == ["[#####] 5 из 5"]
          message: Когда сделано всё, полоска состоит из одних решёток, дефисов нет.
        - id: t4
          kind: assert
          title: "Граничный случай: одна тренировка в плане"
          edge: true
          code: |-
            import io, contextlib

            def _printed_lines(*args, **kwargs):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    progress_bar(*args, **kwargs)
                return [line.rstrip() for line in buffer.getvalue().rstrip().splitlines()]

            assert _printed_lines(0, 1) == ["[-] 0 из 1"]
          message: Для плана из одной тренировки, которую ещё не сделали, полоска — один дефис.
        - id: t5
          kind: assert
          title: Длинный план
          code: |-
            import io, contextlib

            def _printed_lines(*args, **kwargs):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    progress_bar(*args, **kwargs)
                return [line.rstrip() for line in buffer.getvalue().rstrip().splitlines()]

            assert _printed_lines(9, 12) == ["[#########---] 9 из 12"]
          message: Для 9 из 12 полоска — девять решёток и три дефиса.
      rules:
        - id: named-call
          use: [keyword]
          message: >-
            Третий вызов — для 7 из 10 — запиши с именованными аргументами: перед каждым значением
            поставь имя параметра и знак `=`.
      criteria:
        - Решёток столько, сколько сделано, дефисов — сколько осталось, то есть `total - done`.
        - Полоска в квадратных скобках без пробелов внутри, после неё — пробел и подпись «<done> из <total>».
        - Функция работает для любого плана — и когда ничего не сделано, и когда сделано всё.
        - Под функцией три вызова, третий — с именованными аргументами, например `total=10, done=7`.
      hints:
        - >-
          Разбери строку `[###--] 3 из 5` на куски: скобки, решётки, дефисы, числа. Какой кусок
          зависит от `done`, какой — от `total`, а какой — от обоих сразу? Вызовы в этот раз
          пишешь ты, под функцией.
        - >-
          Умножение строки на число повторяет её: `"*" * 4` даёт `****`, а `"=" * (10 - 7)` даёт
          `===`. Скобки вокруг разности нужны, чтобы сначала посчитать её, а потом повторять. А
          вызов с именами ты видел в прогнозе «Кто в гостях?»: `show_score(guest=2, home=0)`.
        - |-
          Каркас:
          ```text
          def progress_bar(done, total):
              filled = "#" * ...
              empty = "-" * (...)
              print(f"[{...}{...}] {...} из {...}")

          progress_bar(..., ...)
          progress_bar(..., ...)
          progress_bar(total=..., done=...)
          ```
      solution:
        code: |
          def progress_bar(done, total):
              bar = "#" * done + "-" * (total - done)
              print(f"[{bar}] {done} из {total}")

          progress_bar(3, 5)
          progress_bar(0, 4)
          progress_bar(total=10, done=7)
        explanation: >-
          Полоска собирается из двух кусков: `"#" * done` повторяет решётку столько раз, сколько
          тренировок сделано, а `"-" * (total - done)` — дефис столько раз, сколько осталось.
          Скобки вокруг `total - done` обязательны: умножение выполняется раньше вычитания, и без
          скобок `- done` применилось бы уже к строке. Когда `done` равен 0, первый кусок — пустая
          строка. В третьем вызове значения подписаны: 10 попадает в `total`, 7 — в `done`, хотя
          в скобках они стоят в обратном порядке.
      altSolutions:
        - code: |
            def progress_bar(done, total):
                print(f"[{'#' * done}{'-' * (total - done)}] {done} из {total}")

            progress_bar(3, 5)
            progress_bar(0, 4)
            progress_bar(done=7, total=10)
          note: Вся строка — одна f-строка с выражениями внутри; именованные аргументы в порядке параметров.
        - code: |
            def progress_bar(done, total):
                left = total - done
                print("[" + "#" * done + "-" * left + "]", done, "из", total)

            progress_bar(3, 5)
            progress_bar(0, 4)
            progress_bar(total = 10, done = 7)
          note: Полоска склеена через +, подпись — через запятые в print; пробелы вокруг = в вызове.
        - code: |
            def progress_bar(done, total):
                bar = ""
                for i in range(total):
                    if i < done:
                        bar += "#"
                    else:
                        bar += "-"
                print("[" + bar + "] " + str(done) + " из " + str(total))

            progress_bar(3, 5)
            progress_bar(0, 4)
            progress_bar(7, total=10)
          note: Полоска собрана циклом по одному символу; третий вызов смешанный — сначала по порядку, потом по имени.
        - code: |
            def progress_bar(finished, planned):
                hashes = ""
                n = finished
                while n > 0:
                    hashes += "#"
                    n -= 1
                print(f"[{hashes}{'-' * (planned - finished)}] {finished} из {planned}")


            progress_bar(3, 5)
            progress_bar(0, 4)
            progress_bar(planned=10, finished=7)
          note: Другие имена параметров — и именованный вызов с этими же именами; решётки циклом while.
      wrongSolutions:
