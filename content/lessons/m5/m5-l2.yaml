id: m5-l2
module: m5
number: "5.2"
title: "Параметры и аргументы"
objective: >-
  Передавать в функцию данные через параметры: объявлять функцию с несколькими параметрами и
  вызывать её с разными аргументами — по порядку, по имени и со значением по умолчанию.
minutes: [20, 30]
prerequisites: [m5-l1]
skills: [functions]
environment: python

story:
  title: Этикетки для склада
  fictional: true
  text: >-
    На складе маленького интернет-магазина кладовщица Лариса каждый вечер печатает этикетки для
    коробок: номер заказа, получатель, вес. Шаблон у всех этикеток один, а данные разные, поэтому
    она копировала блок печати и меняла в нём значения — и однажды коробка Петрова уехала с
    этикеткой Ивановой. Программист магазина написал одну функцию `print_label` с тремя «пустыми
    местами» — параметрами для номера, имени и веса. Теперь для каждой коробки Лариса пишет одну
    строку вызова со своими данными, а шаблон никто не трогает. Сегодня твои функции тоже
    научатся принимать данные.

why: >-
  Функция без параметров всегда делает одно и то же. Через параметры ей передают данные:
  `print_label(1042, "Иванова", 2.5)` печатает этикетку именно для этого заказа, а следующий
  вызов с другими значениями — для другого.

usedIn: >-
  Почти все функции принимают данные: `len(text)`, `round(x, 2)`, `input("Как тебя зовут? ")`.
  В настоящих приложениях одна функция обслуживает тысячи заказов и пользователей: печатает чек,
  отправляет уведомление, показывает страницу товара — каждый раз со своими данными.

steps:
  - id: params
    type: theory
    title: "Параметры: пустые места в функции"
    body: |-
      Функции из урока 5.1 при каждом вызове делали одно и то же: карточка маршрута всегда
      рассказывала про одно и то же озеро. Чтобы одна функция работала с разными данными, в
      скобках `def` оставляют «пустые места»:

      ```python
      def greet(name):
          print(f"Привет, {name}!")

      greet("Оля")     # Привет, Оля!
      greet("Макс")    # Привет, Макс!
      ```

      `name` — **параметр**: имя, под которым функция получит значение. `"Оля"` — **аргумент**:
      значение, которое передают при вызове. Перед тем как выполнить тело, Python кладёт аргумент
      в параметр — как будто написал `name = "Оля"`. Внутри функции параметр — обычная
      переменная: его подставляют в f-строку, сравнивают в `if`, с ним считают. В скобках `def`
      всегда стоят имена, а не значения: `def greet("Оля"):` — это SyntaxError.

      Аргументом может быть число, строка, переменная или выражение: `greet(guest)` передаст
      значение переменной `guest`, а `greet(first + " " + last)` — склеенную строку. Имя
      переменной в вызове **не обязано совпадать** с именем параметра: важно только, какое
      значение стоит в скобках.

      **Порядок важен.** Если параметров несколько, аргументы раскладываются по порядку: первый —
      в первый параметр, второй — во второй. Такие аргументы называют **позиционными**. Каждому
      параметру нужен свой аргумент, и лишних быть не должно, иначе программа остановится с
      TypeError:

      ```text
      missing 1 required positional argument: 'weight'
        → значений не хватило: для weight ничего нет
      takes 3 positional arguments but 4 were given
        → функция ждёт 3 значения, а передали 4
      ```

      Слово *positional* в первом сообщении не значит, что ты передавал значения по порядку:
      так Python называет обычный обязательный параметр.

      **Именованный аргумент** называет параметр прямо в вызове:
      `print_label(name="Петров", order=1043, weight=0.8)`. Порядок тогда не важен, а вызов легче
      читать. Имя в вызове должно точно совпадать с параметром. Способы можно смешивать: сначала
      значения по порядку, потом по имени — `print_label(1043, "Петров", weight=0.8)`. Наоборот
      нельзя.

      **Значение по умолчанию** делает параметр необязательным:
      `def print_label(order, name, weight, fragile=False):`. Если четвёртое значение не
      передали, `fragile` равен `False`, и ошибки нет. Такие параметры пишут после обязательных:
      значения раскладываются по порядку, и только так понятно, какое значение куда ляжет, когда
      необязательное пропустили. Ты уже видел это у `round`: можно написать `round(x)`, а можно
      `round(x, 2)`.
    simpler: >-
      Параметр — пустая клетка в бланке, аргумент — то, что в неё вписывают при вызове.
      `def greet(name)` — бланк с одной клеткой, подписанной «name»; ответов в самом бланке нет.
      `greet("Оля")` — в клетку вписали «Оля», и функция работает с этим значением. Клеток
      несколько — они заполняются по порядку, а именованный аргумент сам говорит, в какую клетку
      его вписать.
    coach: >-
      Читай вызов как заполнение бланка: первое значение — в первое поле, второе — во второе.

  - id: labels
    type: example
    title: Этикетки
    body: >-
      Функция из истории — одна на все коробки. Нажми «Запустить»: две этикетки напечатает одна и
      та же функция, только с разными аргументами.
    code: |-
      def print_label(order, name, weight):
          print(f"Заказ №{order}")
          print(f"Получатель: {name}")
          print(f"Вес: {weight} кг")
          print("-" * 20)

      print_label(1042, "Иванова", 2.5)
      print_label(1043, "Петров", 0.8)
    notes:
      - line: 1
        text: >-
          Три параметра — три «пустых места»: номер заказа, получатель и вес. Имена параметров
          придумывает автор функции.
      - line: 2
        text: >-
          Внутри функции параметр — обычная переменная. f-строка подставит в текст то значение,
          которое пришло при вызове.
      - line: 7
        text: >-
          Первый вызов: `order` получает 1042, `name` — «Иванова», `weight` — 2.5. Значения
          раскладываются по порядку.
      - line: 8
        text: Та же функция, другие данные — и другая этикетка. Шаблон записан один раз.
    tryIt: >-
      Допиши третий вызов с именованными аргументами в другом порядке:
      `print_label(weight=1.2, name="Сидорова", order=1044)` — и запусти. Потом убери из этого
      вызова `weight=1.2` и посмотри, какую ошибку покажет Python.
    coach: >-
      Текст этикетки записан один раз, а этикеток может быть сколько угодно.

  - id: whose-name
    type: predict
    title: Чьё имя?
    prompt: >-
      Снаружи есть переменная `name`, и у функции параметр тоже называется `name`. Как думаешь,
      что выведет программа?
    code: |-
      def greet(name):
          print(f"Привет, {name}!")

      name = "Оля"
      guest = "Макс"
      greet(guest)
    options:
      - Привет, Оля!
      - Привет, Макс!
      - Привет, name!
    answer: Привет, Макс!
    explanation: >-
      Параметр `name` получает то, что стоит в скобках вызова, — значение переменной `guest`, то
      есть «Макс». Внешняя переменная `name` здесь ни при чём: совпадение имён ничего не значит.
      Почему переменные внутри и снаружи функции не мешают друг другу, разберём в уроке 5.4.
    coach: >-
      Смотри в скобки вызова, а не на похожие имена вокруг.

  - id: missing-arg
    type: quiz
    title: Кому не хватило?
    question: |-
      Функция ждёт три значения, а в вызове их два:

      ```python
      def print_label(order, name, weight):
          print(f"Заказ №{order}")
          print(f"Получатель: {name}")
          print(f"Вес: {weight} кг")

      print_label("Петров", 0.8)
      ```

      Что произойдёт?
    options:
      - Напечатается этикетка Петрова весом 0.8 кг, а номер заказа останется пустым
      - "Ошибка TypeError: не хватило значения для `order`"
      - "Ошибка TypeError: не хватило значения для `weight`"
      - Python поймёт, что «Петров» — это имя, и положит его в `name`
    correct: 2
    explanation: >-
      Python не смотрит, что лежит в значениях, — он раскладывает их по порядку: «Петров» попал в
      `order`, 0.8 — в `name`, а для `weight` ничего не осталось. Поэтому программа остановится с
      `missing 1 required positional argument: 'weight'`, и этикетка не напечатается. Без
      значения остаётся последний параметр, а не тот, который ты пропустил в уме.
    coach: >-
      Python не угадывает, что куда положить: значения без имён ложатся строго по порядку.

  - id: practice-remind
    type: exercise
    title: Практика 1
    exercise:
      id: m5-l2-e1
      kind: repeat
      title: Напоминание из библиотеки
      statement: |-
        Библиотека рассылает напоминания читателям. Напиши функцию `remind(name, book)`: она
        получает имя читателя и название книги и печатает одну строку по шаблону:

        ```text
        Аня, срок возврата книги «Дюна» — завтра.
        ```

        Вызовы уже записаны внизу программы — не меняй их. Пока функции нет, программа
        останавливается с ошибкой NameError: так и должно быть. Кавычки «» и тире есть в
        комментарии стартового кода — их можно скопировать оттуда.
      input: "Нет ввода: имя и название книги приходят в функцию через параметры."
      output: "По одной строке на каждый вызов: `<имя>, срок возврата книги «<книга>» — завтра.`"
      constraints:
        - Функция называется `remind`, у неё два параметра — сначала имя, потом книга.
        - Функция ничего не спрашивает через `input()`, данные приходят через параметры.
      starterCode: |
        # Напиши функцию remind(name, book) здесь — выше вызовов.
        # Шаблон строки (кавычки «» и тире можно скопировать отсюда):
        # <имя>, срок возврата книги «<книга>» — завтра.

        remind("Аня", "Дюна")
        remind("Борис", "Три мушкетёра")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          expected: |-
            Аня, срок возврата книги «Дюна» — завтра.
            Борис, срок возврата книги «Три мушкетёра» — завтра.
        - id: t2
          kind: assert
          title: Другие имя и книга
          example: true
          code: |-
            import io, contextlib

            def _printed_lines(*args, **kwargs):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    remind(*args, **kwargs)
                return [line.rstrip() for line in buffer.getvalue().rstrip().splitlines()]

            assert _printed_lines("Ира", "Каштанка") == ["Ира, срок возврата книги «Каштанка» — завтра."]
          message: >-
            Вызов remind("Ира", "Каштанка") печатает одну строку: Ира, срок возврата книги
            «Каштанка» — завтра.
        - id: t3
          kind: assert
          title: "Граничный случай: имя и название из нескольких слов"
          edge: true
          code: |-
            import io, contextlib

            def _printed_lines(*args, **kwargs):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    remind(*args, **kwargs)
                return [line.rstrip() for line in buffer.getvalue().rstrip().splitlines()]

            assert _printed_lines("Анна Мария", "Мастер и Маргарита") == [
                "Анна Мария, срок возврата книги «Мастер и Маргарита» — завтра."
            ]
          message: >-
            Имя и название из нескольких слов попадают в напоминание целиком: вызов
            remind("Анна Мария", "Мастер и Маргарита") печатает одну строку по шаблону.
      criteria:
        - Функция `remind` объявлена с двумя параметрами выше вызовов.
        - Имя и название в строке берутся из параметров — функция работает для любого читателя и любой книги.
        - Строка совпадает с шаблоном — запятая после имени, книга в кавычках «», тире перед «завтра».
      hints:
        - >-
          Что меняется от напоминания к напоминанию? Для этих значений и нужны параметры — имена,
          под которыми функция их получит. Посмотри, как в примере «Этикетки» параметры появились
          в скобках `def` и как они попадают в текст.
        - >-
          Тот же приём на другом примере: функция `def congratulate(name, age):` с телом
          `print(f"{name}, с {age}-летием!")`. Вызов `congratulate("Вика", 12)` печатает
          «Вика, с 12-летием!», а `congratulate("Глеб", 9)` — «Глеб, с 9-летием!».
        - |-
          Каркас:
          ```text
          def remind(..., ...):
              print(f"{...}, срок возврата книги «{...}» — завтра.")

          remind("Аня", "Дюна")
          remind("Борис", "Три мушкетёра")
          ```
      solution:
        code: |
          def remind(name, book):
              print(f"{name}, срок возврата книги «{book}» — завтра.")

          remind("Аня", "Дюна")
          remind("Борис", "Три мушкетёра")
        explanation: >-
          Два параметра — два «пустых места»: `name` и `book`. При вызове `remind("Аня", "Дюна")`
          Python кладёт «Аня» в `name`, а «Дюна» — в `book`, и f-строка подставляет их в шаблон.
          Второй вызов — та же функция с другими значениями. Строку можно собрать и склейкой:
          `name + ", срок возврата книги «" + book + "» — завтра."`.
      altSolutions:
        - code: |
            def remind(name, book):
                print(name + ", срок возврата книги «" + book + "» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Строка собрана склейкой через +.
        - code: |
            def remind(reader, title):
                print(f"{reader}, срок возврата книги «{title}» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Параметры названы по-другому — имена параметров выбирает автор функции.
        - code: |
            # Напиши функцию remind(name, book) здесь — выше вызовов.
            def remind(name, book):
                message = f"{name}, срок возврата книги «{book}» — завтра."
                print(message)


            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Строка сначала сохранена в переменную внутри функции, комментарий оставлен.
        - code: |
            def remind(name, book):
                print(name, ", срок возврата книги «", book, "» — завтра.", sep="")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Части перечислены в print через запятую, а sep="" убирает пробелы между ними.
        - code: |
            def remind(name, book):
                template = "<имя>, срок возврата книги «<книга>» — завтра."
                print(template.replace("<имя>", name).replace("<книга>", book))

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Шаблон из комментария, заглушки заменены через replace.
      wrongSolutions:
        - code: |
            def remind():
                print("Аня, срок возврата книги «Дюна» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: У функции нет параметров, а вызов передаёт два значения.
          expectMistake: no-params
        - code: |
            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")

            def remind(name, book):
                print(f"{name}, срок возврата книги «{book}» — завтра.")
          note: Функция объявлена ниже вызовов.
          expectMistake: def-below
        - code: |
            def remind(name, book):
                name = input("Имя: ")
                book = input("Книга: ")
                print(f"{name}, срок возврата книги «{book}» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Внутри функции input(), хотя значения уже пришли через параметры.
          expectMistake: input-in-function
        - code: |
            name = input("Имя: ")

            def remind(name, book):
                print(f"{name}, срок возврата книги «{book}» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: input() в начале программы, вне функции.
          expectMistake: input-in-function
        - code: |
            def remind(name, book):
                print("{name}, срок возврата книги «{book}» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Нет буквы f — параметры не подставляются.
          expectMistake: no-f
        - code: |
            def remind(book, name):
                print(f"{name}, срок возврата книги «{book}» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Порядок параметров не совпадает с порядком значений в вызове.
          expectMistake: swapped
        - code: |
            def remind(name, book):
                print("Аня, срок возврата книги «Дюна» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Параметры есть, но в теле записаны конкретные имя и книга.
          expectMistake: hardcoded
        - code: |
            def remind(name, book):
                print(f"{name}, срок возврата книги «Дюна» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Имя подставлено из параметра, а книга вписана готовой.
          expectMistake: hardcoded
        - code: |
            def remind("Аня", "Дюна"):
                print("Аня, срок возврата книги «Дюна» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: В скобках def значения из вызова вместо имён параметров.
          expectMistake: values-in-def
        - code: |
            def remind("name", "book"):
                print(f"{name}, срок возврата книги «{book}» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Имена параметров взяты в кавычки.
          expectMistake: values-in-def
        - code: |
            def remind(name):
                print(f"{name}, срок возврата книги «Дюна» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Один параметр вместо двух, книга вписана.
          expectMistake: one-param
        - code: |
            def Remind(name, book):
                print(f"{name}, срок возврата книги «{book}» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Функция названа с большой буквы, вызовы ищут remind.
          expectMistake: wrong-name
        - code: |
            def remind_book(name, book):
                print(f"{name}, срок возврата книги «{book}» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Функция названа иначе (remind_book), def-below срабатывать не должен.
          expectMistake: wrong-name
        - code: |
            def remind(name, book):
                print(f"{name}, срок возврата книги «{book}» — завтра.")

                remind("Аня", "Дюна")
                remind("Борис", "Три мушкетёра")
          note: Вызовы получили отступ и попали в тело — функция вызывает сама себя.
          expectMistake: self-call
        - code: |
            name = "Аня"
            book = "Дюна"

            def remind(reader, title):
                print(f"{name}, срок возврата книги «{book}» — завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: В строку подставлены внешние переменные, а не параметры.
          expectMistake: ignores-params
        - code: |
            def remind(name, book):
                print(f"{name}, срок возврата книги «{book}» - завтра.")

            remind("Аня", "Дюна")
            remind("Борис", "Три мушкетёра")
          note: Дефис с клавиатуры вместо длинного тире.
          expectMistake: hyphen
      mistakes:
        - id: values-in-def
          when:
            errorType: SyntaxError
            codeRegex: '^def[ \t]+remind[ \t]*\(([^)]*,)?[ \t]*["''0-9]'
          why: >-
            В скобках `def` стоят готовые значения — текст в кавычках. Там пишут только имена
            параметров, «пустые места», а сами значения («Аня», «Дюна») приходят из скобок
            вызова.
          try: >-
            Напиши в `def` два имени без кавычек, например `name` и `book`, и подставь их в
            строку внутри функции.
          verify: Ошибка SyntaxError должна исчезнуть, а в «Примере 1» появятся две строки.
        - id: no-params
          when:
            errorIncludes: takes 0 positional arguments
          why: >-
            В строке `def remind():` скобки пустые — функция не ждёт ни одного значения. А вызов
            `remind("Аня", "Дюна")` передаёт два, и им некуда лечь.
          try: >-
            Впиши в скобки `def` два параметра — для имени и для книги — и подставь их в строку
            внутри функции.
          verify: Ошибка TypeError должна исчезнуть, а в «Примере 1» появятся две строки.
        - id: one-param
          when:
            errorIncludes: takes 1 positional argument but 2 were given
          why: >-
            В скобках `def` один параметр, а вызов `remind("Аня", "Дюна")` передаёт два значения —
            второму некуда лечь. Функции нужен свой параметр и для имени, и для книги.
          try: >-
            Добавь в `def` второй параметр и подставь его в строку на место готового имени или
            названия.
          verify: Ошибка TypeError должна исчезнуть, а в «Примере 1» появятся две разные строки.
        - id: def-below
          when:
            errorType: NameError
            codeRegex: '^[ \t]*remind[ \t]*\([\s\S]*^def[ \t]+remind[ \t]*\('
          why: >-
            Вызов стоит выше `def`. Python выполняет программу сверху вниз и, дойдя до вызова, ещё
            не знает, что такое `remind`.
          try: Перенеси объявление функции в начало программы, над вызовами.
          verify: Ошибка NameError должна исчезнуть, а в «Примере 1» появятся две строки.
        - id: wrong-name
          when:
            errorType: NameError
            errorIncludes: "name 'remind' is not defined"
            codeRegex: '^def[ \t]+\w'
          why: >-
            Вызовы внизу и проверка обращаются к функции `remind` — ровно так, маленькими
            буквами. В твоём `def` функция называется иначе, поэтому Python не находит имя
            `remind`.
          try: >-
            Назови функцию в `def` именно `remind`. Вызовы не меняй: проверка тоже вызывает
            функцию под этим именем.
          verify: Ошибка NameError должна исчезнуть, а в «Примере 1» появятся две строки.
        - id: self-call
          when:
            errorType: RecursionError
            codeRegex: '^[ \t]+remind[ \t]*\('
          why: >-
            Вызовы `remind(...)` стоят с отступом под телом функции, поэтому Python считает их
            частью тела: функция вызывает сама себя, снова и снова. Внизу программы вызовов не
            осталось.
          try: Убери отступ у двух вызовов — они пишутся от левого края, после тела функции.
          verify: В «Примере 1» должны появиться две строки.
        - id: input-in-function
          when:
            errorType: EOFError
          why: >-
            В программе стоит `input()`, но спрашивать ничего не нужно: имя и книга приходят в
            функцию через параметры из скобок вызова. Ввода в тесте нет, поэтому `input()`
            остановил программу.
          try: Убери `input()`, где бы он ни стоял, и подставь в строку сами параметры.
        - id: no-f
          when:
            outputIncludes: "{"
          why: >-
            На экране фигурные скобки: строка без буквы `f` печатается как есть, и значения
            параметров в неё не подставляются.
          try: Поставь `f` прямо перед открывающей кавычкой строки в `print`.
          verify: В «Примере 1» вместо скобок должны появиться «Аня» и «Дюна».
        - id: swapped
          when:
            outputIncludes: Дюна, срок
          why: >-
            Имя и книга поменялись местами. Аргументы раскладываются по порядку: первое значение
            вызова — «Аня» — попадает в первый параметр. Если первым в `def` стоит параметр для
            книги, туда и попадёт имя.
          try: >-
            Сделай первым параметром имя, вторым — книгу, и проверь, что в строке каждый стоит на
            своём месте.
          verify: "В «Примере 1» первая строка должна начинаться с «Аня, срок»."
        - id: hardcoded
          when:
            failedTest: t2
            codeRegex: '^[ \t]+print\(.*(Аня|Дюна)'
          why: >-
            В строке внутри функции осталось готовое значение — имя или название книги, например
            «Аня». Эта часть строки не меняется, что бы ни передали в вызове.
          try: Замени каждое готовое значение на параметр в фигурных скобках f-строки.
          verify: "Проверка «Другие имя и книга» должна стать зелёной."
        - id: ignores-params
          when:
            outputIncludes: "Аня, срок возврата книги «Дюна» — завтра.\nАня, срок возврата книги «Дюна» — завтра."
          why: >-
            Обе строки одинаковые: функция печатает одно и то же, что бы ей ни передали. Значит, в
            строку подставлены не параметры из скобок `def`, а что-то другое — например,
            переменные, заданные снаружи функции.
          try: Подставь в f-строку именно параметры — те имена, что стоят в скобках `def remind(...)`.
          verify: "Во второй строке «Примера 1» должны появиться «Борис» и «Три мушкетёра»."
        - id: hyphen
          when:
            failedTest: t1
            codeRegex: '»[ \t]*[-–][ \t]*завтра'
          why: >-
            Перед «завтра» стоит короткий знак — дефис `-` или среднее тире `–`, а в шаблоне
            длинное тире `—`. На экране они похожи, но для Python это разные символы.
          try: >-
            Скопируй длинное тире из шаблона в условии или из комментария стартового кода и
            поставь его вместо своего знака.
          verify: В «Примере 1» обе строки должны совпасть с ожидаемыми.
      afterPass: >-
        Одна функция печатает напоминание для любого читателя и любой книги — меняются только
        аргументы. Если параметры у тебя называются `name` и `book`, допиши вызов с именованными
        аргументами в другом порядке: `remind(book="Остров сокровищ", name="Глеб")` — и нажми
        «Запустить».
      skills: [functions, f-strings]

  - id: named-args
    type: predict
    title: Кто в гостях?
    prompt: >-
      В этом вызове аргументы подписаны и стоят не в том порядке, что параметры. Как думаешь, что
      выведет программа?
    code: |-
      def show_score(home, guest):
          print(f"Хозяева {home} : {guest} Гости")

      show_score(guest=2, home=0)
    options:
      - "Хозяева 2 : 0 Гости"
      - "Хозяева 0 : 2 Гости"
      - Ошибка TypeError
    answer: "Хозяева 0 : 2 Гости"
    explanation: >-
      Именованный аргумент попадает в параметр с тем же именем, а не по порядку: `home` получил 0,
      `guest` — 2. Ошибки нет — именованные аргументы можно писать в любом порядке. А вызов без
      имён `show_score(2, 0)` дал бы «Хозяева 2 : 0 Гости».
    coach: >-
      Имя в вызове — как подпись на конверте: значение дойдёт до своего параметра, где бы ни стояло.

  - id: practice-fragile
    type: exercise
    title: Практика 2
    exercise:
      id: m5-l2-e2
      kind: modify
      title: Хрупкий груз
      statement: |-
        Некоторые коробки на складе нужно везти осторожно. Добавь в функцию `print_label`
        четвёртый параметр `fragile` — «хрупкое». Если он равен `True`, перед чертой печатается
        строка `ОСТОРОЖНО: ХРУПКОЕ`:

        ```text
        Заказ №1043
        Получатель: Петров
        Вес: 0.8 кг
        ОСТОРОЖНО: ХРУПКОЕ
        --------------------
        ```

        По умолчанию груз не хрупкий: если четвёртое значение не передали, `fragile` равен
        `False`, и этикетка печатается как раньше. Вызовы внизу уже написаны — не меняй их.
        Сейчас программа останавливается на втором вызове: функция ждёт три значения, а ей
        передают четыре.
      input: "Нет ввода: данные приходят в функцию через параметры."
      output: "Три этикетки; у второй и третьей перед чертой строка `ОСТОРОЖНО: ХРУПКОЕ`."
      constraints:
        - Новый параметр называется `fragile` — под этим именем он записан в третьем вызове.
        - Вызовы внизу программы не меняй — первый передаёт три значения, второй четыре, третий передаёт `fragile=True` по имени.
      starterCode: |
        def print_label(order, name, weight):
            print(f"Заказ №{order}")
            print(f"Получатель: {name}")
            print(f"Вес: {weight} кг")
            print("-" * 20)

        print_label(1042, "Иванова", 2.5)
        print_label(1043, "Петров", 0.8, True)
        print_label(1044, "Сидорова", 1.2, fragile=True)
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          expected: |-
            Заказ №1042
            Получатель: Иванова
            Вес: 2.5 кг
            --------------------
            Заказ №1043
            Получатель: Петров
            Вес: 0.8 кг
            ОСТОРОЖНО: ХРУПКОЕ
            --------------------
            Заказ №1044
            Получатель: Сидорова
            Вес: 1.2 кг
            ОСТОРОЖНО: ХРУПКОЕ
            --------------------
        - id: t2
          kind: assert
          title: "Граничный случай: fragile не передан"
          edge: true
          code: |-
            import io, contextlib

            def _printed_lines(*args, **kwargs):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    print_label(*args, **kwargs)
                return [line.rstrip() for line in buffer.getvalue().rstrip().splitlines()]

            assert _printed_lines(1050, "Орлова", 3.0) == [
                "Заказ №1050", "Получатель: Орлова", "Вес: 3.0 кг", "-" * 20
            ]
          message: >-
            Вызов print_label(1050, "Орлова", 3.0) без четвёртого значения печатает обычную
            этикетку из четырёх строк, без предупреждения.
        - id: t3
          kind: assert
          title: Хрупкий груз
          example: true
          code: |-
            import io, contextlib

            def _printed_lines(*args, **kwargs):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    print_label(*args, **kwargs)
                return [line.rstrip() for line in buffer.getvalue().rstrip().splitlines()]

            assert _printed_lines(1051, "Козлов", 1.5, True) == [
                "Заказ №1051", "Получатель: Козлов", "Вес: 1.5 кг", "ОСТОРОЖНО: ХРУПКОЕ", "-" * 20
            ]
          message: >-
            Вызов print_label(1051, "Козлов", 1.5, True) печатает этикетку, в которой перед чертой
            стоит строка «ОСТОРОЖНО: ХРУПКОЕ».
        - id: t4
          kind: assert
          title: "Граничный случай: fragile=False передан явно"
          edge: true
          code: |-
            import io, contextlib

            def _printed_lines(*args, **kwargs):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    print_label(*args, **kwargs)
                return [line.rstrip() for line in buffer.getvalue().rstrip().splitlines()]

            assert _printed_lines(1052, "Белова", 0.5, fragile=False) == [
                "Заказ №1052", "Получатель: Белова", "Вес: 0.5 кг", "-" * 20
            ]
          message: >-
            Вызов print_label(1052, "Белова", 0.5, fragile=False) печатает обычную этикетку, без
            предупреждения.
      criteria:
        - У `print_label` четыре параметра, последний — `fragile` со значением по умолчанию `False`.
        - Предупреждение печатается только для хрупкого груза и стоит перед чертой.
        - Все три вызова работают без изменений.
      hints:
        - >-
          Сейчас ломается второй вызов, а первый должен и дальше работать с тремя значениями. Как
          сделать четвёртый параметр необязательным? И в каком месте этикетки должна появиться
          новая строка?
        - |-
          Тот же приём на другом примере:
          ```python
          def greet_guest(name, vip=False):
              print(f"Добро пожаловать, {name}!")
              if vip:
                  print("Ваш столик у окна")

          greet_guest("Лев")          # только приветствие
          greet_guest("Ника", True)   # приветствие и столик
          ```
        - |-
          Каркас:
          ```text
          def print_label(order, name, weight, fragile=...):
              ... три строки, как было ...
              if ...:
                  print(...)
              print("-" * 20)
          ```
      solution:
        code: |
          def print_label(order, name, weight, fragile=False):
              print(f"Заказ №{order}")
              print(f"Получатель: {name}")
              print(f"Вес: {weight} кг")
              if fragile:
                  print("ОСТОРОЖНО: ХРУПКОЕ")
              print("-" * 20)

          print_label(1042, "Иванова", 2.5)
          print_label(1043, "Петров", 0.8, True)
