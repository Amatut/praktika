      mistakes:
        - id: no-parens
          when:
            errorIncludes: "for -: 'str' and 'int'"
          why: >-
            Умножение выполняется раньше вычитания, поэтому `- done` применилось уже к строке, а не
            к `total`. Из строки число не вычитается.
          try: "Возьми разность в скобки: сначала `(total - done)`, потом умножение."
          verify: Ошибка TypeError должна исчезнуть, а в «Примере 1» появятся три полоски.
        - id: wrong-keyword
          when:
            errorIncludes: unexpected keyword argument
          why: >-
            В вызове с именами стоит имя, которого нет среди параметров в `def`. Именованный
            аргумент должен называться ровно так же, как параметр, — буква в букву.
          try: >-
            Сравни имена в третьем вызове с именами в скобках `def progress_bar(...)` и исправь
            то, что не совпадает.
          verify: Ошибка TypeError должна исчезнуть, а в «Примере 1» появится третья строка.
        - id: keyword-first
          when:
            errorIncludes: positional argument follows keyword argument
          why: >-
            В вызове после значения с именем идёт значение без имени. Так нельзя: сначала пишут
            значения по порядку, а уже потом — по имени.
          try: Подпиши именем и второе значение — тогда оба аргумента именованные, и порядок не важен.
          verify: Ошибка SyntaxError должна исчезнуть, а в «Примере 1» появится третья строка.
        - id: def-below
          when:
            errorType: NameError
            codeRegex: '^progress_bar[ \t]*\([\s\S]*^def[ \t]+progress_bar[ \t]*\('
          why: >-
            Вызовы стоят выше `def`. Python выполняет программу сверху вниз и, дойдя до первого
            вызова, ещё не знает, что такое `progress_bar`.
          try: Перенеси вызовы под функцию — после её тела, от левого края.
          verify: Ошибка NameError должна исчезнуть, а в «Примере 1» появятся три строки.
        - id: self-call
          when:
            errorType: RecursionError
            codeRegex: '^[ \t]+progress_bar[ \t]*\('
          why: >-
            Вызовы стоят с отступом под телом функции, поэтому Python считает их частью тела:
            функция вызывает сама себя, снова и снова.
          try: Убери отступ у вызовов — они пишутся от левого края, после тела функции.
          verify: В «Примере 1» должны появиться три строки.
        - id: no-calls
          when:
            failedTest: t1
            outputEquals: ""
            codeRegex: '^def[ \t]+progress_bar'
          why: >-
            Функция объявлена, но программа ничего не напечатала: `def` только описывает функцию,
            а работать она начинает при вызове. Вызовы в этом задании пишешь ты.
          try: >-
            Под телом функции, от левого края, вызови её три раза: для 3 из 5, для 0 из 4 и для 7
            из 10 — последний вызов с именованными аргументами.
          verify: В «Примере 1» должны появиться три строки.
        - id: swapped
          when:
            codeRegex: '^def[ \t]+progress_bar[ \t]*\([ \t]*total\b'
          why: >-
            Параметры поменялись местами. В вызове `progress_bar(3, 5)` первое значение — сколько
            сделано, второе — сколько всего, и параметры в `def` должны идти в том же порядке.
          try: Сделай первым параметром `done`, вторым — `total`.
          verify: "В «Примере 1» первая строка должна быть «[###--] 3 из 5»."
        - id: total-first
          when:
            outputIncludes: "[##########] 10 из 7"
          why: >-
            Без имён значения раскладываются по порядку: 10 легло в `done`, а 7 — в `total`.
            Python не знает, что первым ты хотел передать `total`.
          try: >-
            Подпиши значения в третьем вызове именами параметров: имя, знак `=`, значение. Тогда
            `total` можно поставить первым.
          verify: "В «Примере 1» третья строка должна быть «[#######---] 7 из 10»."
        - id: dash-count
          when:
            outputIncludes: "[###-----]"
          why: >-
            Дефисов столько, сколько тренировок во всём плане, а нужно — сколько осталось. Поэтому
            полоска вышла длиннее плана.
          try: Посчитай оставшиеся тренировки — `total - done` — и повтори дефис столько раз.
          verify: В «Примере 1» в первой полоске должно быть пять знаков.
        - id: roles
          when:
            outputIncludes: "[####] 0 из 4"
            failedTest: t3
          why: >-
            Решётки и дефисы поменялись ролями: решёток столько, сколько осталось, а дефисов —
            сколько сделано. Для 3 из 5 нужны три решётки и два дефиса.
          try: Решётку повторяй `done` раз, дефис — `total - done` раз.
          verify: "В «Примере 1» первая строка должна быть «[###--] 3 из 5»."
        - id: one-short
          when:
            outputIncludes: "[##---] 3 из 5\n[----] 0 из 4"
          why: >-
            Длина полоски верная, но решёток на одну меньше, чем сделано: для 3 из 5 вышло `##---`.
            Это ошибка на единицу: счёт в `range` начинается не с того числа или в `if` стоит не то
            сравнение.
          try: >-
            Проследи цикл для `progress_bar(3, 5)` по шагам: выпиши значения `i` и что добавляется
            на каждом. Решётка должна добавиться ровно `done` раз.
          verify: "В «Примере 1» первая строка должна быть «[###--] 3 из 5»."
        - id: commas
          when:
            failedTest: t1
            codeRegex: 'print\(\s*["'']\[["'']\s*,'
            outputIncludes: "[ "
          why: >-
            Когда значения в `print` перечислены через запятую, Python ставит между ними пробел — и
            полоска рассыпалась на части: `[ ### -- ]`.
          try: >-
            Собери полоску в одну строку заранее — склейкой через `+` или f-строкой — и только
            потом печатай.
          verify: "В «Примере 1» первая строка должна быть «[###--] 3 из 5»."
        - id: hardcoded
          when:
            failedTest: t2
            codeRegex: '^[ \t]+print\(\s*f?["''][\[][#-]'
          why: >-
            В `print` записана готовая полоска, поэтому она одна и та же, что бы ни передали в
            функцию.
          try: >-
            Собери полоску из параметров: решётку повтори `done` раз, дефис — `total - done` раз,
            а числа в подписи тоже возьми из параметров.
          verify: "Проверка «Одна из трёх» должна стать зелёной."
        - id: no-third-call
          when:
            failedTest: t1
            outputEquals: "[###--] 3 из 5\n[----] 0 из 4"
          why: >-
            Первые две строки на месте, а третьей нет: в программе не хватает вызова для 7 из 10.
          try: >-
            Допиши под двумя вызовами третий — для 7 из 10. Подпиши каждое значение именем
            параметра и знаком `=`, как в прогнозе «Кто в гостях?».
          verify: "В «Примере 1» должна появиться третья строка «[#######---] 7 из 10»."
      afterPass: >-
        Полоска подстраивается под любой план, а третий вызов читается без подсказок: сразу видно,
        где всего, а где сделано. Если хочешь, добавь третий параметр со значением по умолчанию —
        символ сделанной тренировки: `def progress_bar(done, total, mark="#")`. Тогда
        `progress_bar(2, 4, "*")` нарисует `[**--] 2 из 4`, а старые вызовы не изменятся.
      skills: [functions, strings-basics, f-strings]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Параметры — имена в скобках `def`, аргументы — значения в скобках вызова. При вызове аргумент кладётся в параметр, как при присваивании."
      - "Позиционные аргументы раскладываются по порядку, именованные (`name=\"Петров\"`) — по имени, в любом порядке. В одном вызове сначала идут позиционные, потом именованные."
      - "Значение по умолчанию (`fragile=False`) делает параметр необязательным; такие параметры пишут после обязательных."
      - "Не хватило значения для обязательного параметра — TypeError `missing … argument`; передали лишнее — `takes … but … were given`."
    question: >-
      Параметр `fragile` в «Хрупком грузе» сделали необязательным, со значением по умолчанию. Что
      случилось бы со старыми вызовами, если бы он был обязательным? И почему такие параметры
      пишут в конце списка?
    answer: >-
      Все вызовы с тремя значениями остановились бы с ошибкой `missing 1 required positional
      argument: 'fragile'`, и их пришлось бы переписывать. Значение по умолчанию подставляется,
      когда аргумент не передали, поэтому старый код работает как раньше. В конце — потому что
      позиционные аргументы раскладываются по порядку: если бы необязательный параметр стоял
      первым, Python не смог бы понять, в какой параметр положить значение, когда необязательное
      пропустили.
