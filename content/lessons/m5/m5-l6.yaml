id: m5-l6
module: m5
number: "5.6"
title: "Первое знакомство с Git и README: сохраняем проект"
objective: >-
  Сохранить свой первый проект в Git: создать репозиторий, сделать два осмысленных коммита — код
  и README с инструкцией запуска, — посмотреть историю и вернуть файл к последнему коммиту.
minutes: [40, 60]
prerequisites: [m5-l5, m0-l4]
skills: [git-first-steps, readme-docs]
environment: external

story:
  title: calc_final_точно.py
  fictional: true
  text: >-
    После модуля про коллекции Даша написала свой первый проект — консольный калькулятор. Перед
    каждой большой правкой она сохраняла копию: `calc.py`, `calc_new.py`, `calc_final.py`,
    `calc_final_точно.py`. Когда очередная правка всё сломала, выяснилось, что Даша не помнит,
    какая из копий была рабочей. Друг показал ей Git: он хранит снимки проекта с коротким
    сообщением «что изменилось», и к любому снимку можно вернуться. А чтобы друзья могли
    запустить калькулятор без её объяснений, Даша добавила в проект файл README с инструкцией.

why: >-
  Git хранит историю проекта: каждый коммит — снимок проекта с сообщением о том, что изменилось,
  поэтому менять код не страшно, рабочая версия не потеряется. README объясняет любому человеку —
  и тебе через месяц, — что делает программа и как её запустить: например, «Открой терминал в
  папке проекта и выполни `python calc.py`».

usedIn: >-
  Git — самая распространённая система контроля версий: ею пользуются и программисты-одиночки, и
  большие команды. Его создал Линус Торвальдс в 2005 году для работы над ядром Linux. Сайты
  GitHub и GitLab хранят Git-репозитории в интернете, а README — первое, что видит человек,
  открывший чужой проект.

steps:
  - id: snapshots
    type: theory
    title: "Git: снимки проекта"
    body: |-
      У Даши было четыре копии калькулятора, и ни одна не говорила, чем она отличается от
      остальных. Эту задачу решает **система контроля версий** — программа, которая хранит
      историю проекта: что менялось, когда и зачем. Самая распространённая такая система — **Git**.

      **Репозиторий** — папка проекта вместе с его историей. Историю Git хранит в скрытой папке
      `.git` внутри проекта, трогать её руками не нужно. Репозиторий создаётся один раз командой
      `git init`.

      **Коммит** — снимок проекта с **сообщением**: короткой подписью о том, что изменилось. Ещё
      Git запоминает автора и время. У каждого коммита есть короткий номер вроде `3f9a2c1`. Новые
      коммиты не стирают старые: история только растёт.

      Обычный цикл работы:

      1. Изменить файл и сохранить его (Ctrl + S).
      2. `git add calc.py` — выбрать изменения для следующего снимка. Файлы из прошлого
         снимка, которые не менялись, войдут в новый такими же, как были.
      3. `git commit -m "Что изменилось"` — сделать снимок с сообщением.

      Ещё три команды:

      - `git status` — что сейчас видит Git: какие файлы новые, какие изменены, какие изменения
        выбраны для снимка. Не понимаешь, что происходит, — набери `git status`, она ничего не меняет.
      - `git log --oneline` — история: по строке на коммит, новые сверху.
      - `git restore calc.py` — выбросить изменения в файле, которые ещё не выбраны через
        `git add`. Если ты ничего не выбирал, файл станет таким, как в последнем коммите.
        Вернуть выброшенное нельзя.

      Есть и `git add .` — выбрать сразу все файлы папки. Пока не пользуйся этой командой: в
      снимок легко попадёт лишнее. Как этого избежать, узнаешь в модуле 8.

      **Хорошее сообщение коммита** отвечает на вопрос «что изменилось?»: «Добавить README с
      инструкцией запуска», а не «fix» или «правки». Ориентир — до 50 символов. Удобно начинать
      с действия: «Добавить…», «Исправить…», «Убрать…».

      Git работает на твоём компьютере без интернета и без регистрации. GitHub и GitLab —
      отдельные сайты, где хранят копии репозиториев; сейчас они не нужны.

      Урок — на два захода по 20–30 минут: сначала задание в тренажёре и установка Git, потом
      коммиты и README. Работу на компьютере тренажёр не видит, поэтому в чек-листах отмечай
      пункты сам — по результату, а не по прочтении.
    simpler: >-
      Git — фотоальбом проекта. `git add` — решить, что обновить на следующем снимке,
      `git commit` — сделать снимок с подписью, `git log` — пролистать альбом, `git restore` —
      отменить правку, которую ты ещё не выбрал для снимка.
    coach: >-
      Команды Git не нужно заучивать: в чек-листах каждая будет перед глазами. Запомни идею —
      выбрать изменения, сделать снимок, посмотреть историю.

  - id: commands
    type: order
    title: "Первый коммит: в каком порядке?"
    prompt: >-
      Расставь команды в том порядке, в каком ты выполнишь их, чтобы сохранить в Git новый
      проект и посмотреть историю.
    items:
      - id: init
        text: git init — создать репозиторий
      - id: status
        text: git status — посмотреть, что видит Git
      - id: add
        text: git add calc.py — выбрать файл для снимка
      - id: commit
        text: git commit -m "Первая версия калькулятора" — сделать снимок
      - id: log
        text: git log --oneline — посмотреть историю
    before:
      - [init, status]
      - [init, add]
      - [add, commit]
      - [commit, log]
    explanation: >-
      Сначала репозиторий: без `git init` Git не следит за папкой и на `status`, `add`, `commit`
      и `log` ответит `fatal: not a git repository`. Снимок делается из того, что выбрано через
      `git add`, поэтому add идёт раньше commit. История появится только после первого коммита.
      А `git status` можно набирать в любой момент после init — она ничего не меняет, только
      показывает.
    coach: >-
      Порядок легко запомнить по фотоальбому: завести альбом (init), выбрать кадр (add), снять
      (commit), пролистать (log).

  - id: message
    type: quiz
    title: Какое сообщение понятнее?
    question: >-
      Через месяц ты открываешь историю калькулятора. Какое сообщение коммита лучше всего
      расскажет, что тогда изменилось?
    options:
      - "`fix`"
      - "`Исправил баг`"
      - "`Добавить проверку деления на ноль`"
      - "`правки в calc.py`"
    correct: 2
    explanation: >-
      Только «Добавить проверку деления на ноль» говорит, что именно изменилось. «Исправил баг»
      похоже на хорошее — начинается с действия, — но какой баг? Через месяц не вспомнишь.
      Вариант «правки в calc.py» говорит где, но не что, а какой файл изменился, Git и так
      запомнит. `fix` не говорит ничего: чтобы понять такой коммит, придётся перечитывать код.

  - id: practice-message
    type: exercise
    title: Практика
    exercise:
      id: m5-l6-e1
      kind: write
      title: Проверка сообщения коммита
      statement: |-
        Даша решила больше не подписывать коммиты словами вроде «fix» и хочет, чтобы программа
        проверяла сообщение заранее. Напиши функцию `is_good_message(message)`: она возвращает
        `True`, если сообщение годится, и `False`, если нет.

        Сообщение **не годится**, если после удаления пробелов по краям:

        1. оно пустое;
        2. в нём больше 50 символов;
        3. оно **целиком** совпадает с одним из слов `fix`, `update`, `правки`, `изменения`,
           `asdf` — в любом регистре: «Правки» и «FIX» тоже не годятся.

        Во всех остальных случаях сообщение годится. Например, «Описать изменения в README»
        годится: слово из списка здесь только часть сообщения. Вызовы внизу стартового кода
        нужны для кнопки «Запустить», а проверка вызывает функцию сама.
      input: "Параметр `message` — строка, сообщение коммита."
      output: "Функция возвращает `True` или `False`."
      constraints:
        - "Результат — через `return`: проверка получает то, что функция вернула, а не то, что она напечатала."
        - Пробелы по краям не считаются ни в длине, ни при сравнении со словами. Пробелы между словами — часть сообщения и в длину входят.
      starterCode: |
        def is_good_message(message):
            pass  # верни True или False


        print(is_good_message("Добавить README с инструкцией запуска"))  # ожидаю True
        print(is_good_message("fix"))  # ожидаю False
      tests:
        - id: t1
          kind: call
          title: "Пример: понятное сообщение"
          example: true
          call: is_good_message("Добавить README с инструкцией запуска")
          expected: "True"
        - id: t2
          kind: call
          title: "Пример: слово из списка"
          example: true
          call: is_good_message("fix")
          expected: "False"
        - id: t3
          kind: call
          title: "Пример: длиннее 50 символов"
          example: true
          call: is_good_message("Добавить в калькулятор проверку деления на ноль и сообщение об ошибке")
          expected: "False"
        - id: t4
          kind: call
          title: "Граничный случай: пустое сообщение"
          edge: true
          call: is_good_message("")
          expected: "False"
        - id: t5
          kind: call
          title: "Граничный случай: одни пробелы"
          edge: true
          call: is_good_message("   ")
          expected: "False"
        - id: t6
          kind: call
          title: "Граничный случай: слово с большой буквы"
          edge: true
          call: is_good_message("Правки")
          expected: "False"
        - id: t7
          kind: call
          title: "Граничный случай: слово заглавными буквами"
          edge: true
          call: is_good_message("FIX")
          expected: "False"
        - id: t8
          kind: call
          title: "Граничный случай: другое слово из списка"
          edge: true
          call: is_good_message("Изменения")
          expected: "False"
        - id: t9
          kind: call
          title: "Граничный случай: слово с пробелами по краям"
          edge: true
          call: is_good_message("  fix  ")
          expected: "False"
        - id: t10
          kind: call
          title: "Граничный случай: ровно 50 символов"
          edge: true
          call: 'is_good_message("Д" * 50)'
          expected: "True"
        - id: t11
          kind: call
          title: "Граничный случай: 51 символ"
          edge: true
          call: 'is_good_message("Д" * 51)'
          expected: "False"
        - id: t12
          kind: call
          title: "Граничный случай: пробелы по краям не входят в длину"
          edge: true
          call: 'is_good_message("   " + "Д" * 48 + "   ")'
          expected: "True"
        - id: t13
          kind: call
          title: "Граничный случай: 51 символ вместе с пробелами между словами"
          edge: true
          call: is_good_message("Добавить в калькулятор деление с остатком и степень")
          expected: "False"
        - id: t14
          kind: call
          title: "Граничный случай: „правки“ внутри слова „справки“"
          edge: true
          call: is_good_message("Добавить команду справки")
          expected: "True"
        - id: t15
          kind: call
          title: "Граничный случай: слово из списка — лишь часть сообщения"
          edge: true
          call: is_good_message("Описать изменения в README")
          expected: "True"
        - id: t16
          kind: call
          title: "Граничный случай: начало слова из списка"
          edge: true
          call: is_good_message("Изменен")
          expected: "True"
      criteria:
        - Функция возвращает `True` или `False` через `return`, а не печатает ответ.
        - Пустое сообщение и сообщение из одних пробелов не годятся.
        - "Длина считается без пробелов по краям, но вместе с пробелами между словами: 50 символов — ещё можно, 51 — уже нет."
        - Слова из списка не годятся в любом регистре и с пробелами по краям. Сообщение, где такое слово — лишь часть сообщения или часть другого слова, годится.
      hints:
        - >-
          Все три правила смотрят на одно и то же: сообщение без пробелов по краям и без разницы
          между большими и маленькими буквами. Подготовь такую версию один раз в начале функции и
          дальше проверяй только её. Что функция должна вернуть, как только правило нарушено, и
          что — когда все проверки пройдены?
        - |-
          Приёмы на других примерах:

          ```python
          answer = "  Да ".strip().lower()
          print(answer)                   # да
          print("кот" in ["кот", "пёс"])  # True
          print("от" in ["кот", "пёс"])   # False
          print("от" in "кот")            # True
          ```

          `in` со списком сравнивает значение с каждым элементом целиком, а `in` со строкой ищет
          кусок внутри неё. Функция с несколькими проверками:

          ```python
          def is_valid_age(age):
              if age < 0:
                  return False
              if age > 120:
                  return False
              return True
          ```

          Каждый `return` сразу заканчивает функцию: до `return True` дело дойдёт, только если
          ни одна проверка не сработала.
        - |-
          Каркас:

          ```text
          def is_good_message(message):
              text = message без пробелов по краям,
                     маленькими буквами
              если text пустой: вернуть False
              если в text больше 50 символов: вернуть False
              если text есть в списке плохих слов: вернуть False
              вернуть True
          ```
      solution:
        code: |
          def is_good_message(message):
              text = message.strip().lower()
              if text == "":
                  return False
              if len(text) > 50:
                  return False
              if text in ["fix", "update", "правки", "изменения", "asdf"]:
                  return False
              return True


          print(is_good_message("Добавить README с инструкцией запуска"))  # ожидаю True
          print(is_good_message("fix"))  # ожидаю False
        explanation: >-
          Сначала функция один раз готовит удобную версию сообщения: `strip()` убирает пробелы по
          краям, `lower()` делает буквы маленькими. Результат сохранён в `text` — методы строк
          возвращают новую строку, а старая не меняется (урок 4.3). Дальше три проверки по
          очереди: каждая при нарушении сразу возвращает `False`, и функция на этом заканчивается.
          Если ни одна не сработала, выполняется `return True`. `text in [...]` сравнивает
          сообщение с каждым словом списка целиком, поэтому «Добавить команду справки» проходит,
          хотя внутри есть «правки». Проверка формальная: «Изменен» она тоже пропустит, хотя и
          такое сообщение мало что говорит, — понятность сообщения по-прежнему оценивает человек.
      altSolutions:
        - code: |
            def is_good_message(message):
                text = message.strip().lower()
                return text != "" and len(text) <= 50 and text not in ["fix", "update", "правки", "изменения", "asdf"]


            print(is_good_message("Добавить README с инструкцией запуска"))
            print(is_good_message("fix"))
          note: Все три правила одним выражением — оно само даёт True или False.
        - code: |
            BAD_WORDS = ["fix", "update", "правки", "изменения", "asdf"]


            def is_good_message(message):
                text = message.strip().lower()
                good = True
                if len(text) == 0:
                    good = False
                elif len(text) > 50:
                    good = False
                elif text in BAD_WORDS:
                    good = False
                return good


            print(is_good_message("Добавить README с инструкцией запуска"))
            print(is_good_message("fix"))
          note: Список слов в константе над функцией, один return в конце, пустота через len.
        - code: |
            def is_good_message(message):
                message = message.strip()
                message = message.lower()
                if message == "" or len(message) > 50:
                    return False
                for word in ["fix", "update", "правки", "изменения", "asdf"]:
                    if message == word:
                        return False
                return True


            print(is_good_message("Добавить README с инструкцией запуска"))
            print(is_good_message("fix"))
          note: Параметр перезаписан очищенной строкой, слова перебираются циклом и сравниваются через ==.
        - code: |
            BAD = {"FIX", "UPDATE", "ПРАВКИ", "ИЗМЕНЕНИЯ", "ASDF"}


            def is_good_message(message):
                cleaned = message.strip().upper()
                if not cleaned:
                    return False
                if len(cleaned) > 50:
                    return False
                if cleaned in BAD:
                    return False
                return True
          note: upper() и множество слов заглавными буквами, пустота через not (рецензент проверок).
        - code: |
            def clean(text):
                return text.strip(" ").lower()


            def is_good_message(message):
                text = clean(message)
                print(f"Проверяю «{text}», длина {len(text)}")

                if len(text) == 0:
                    return False

                if len(text) >= 51:
                    return False

                bad_words = "fix update правки изменения asdf".split()
                if text in bad_words:
                    return False

                return True


            for m in ["Добавить README с инструкцией запуска", "fix", "   ", "Правки"]:
                print(f"{m} -> {is_good_message(m)}")
          note: Вспомогательная функция, отладочный print, >= 51, список через split(), проверочный цикл внизу.
        - code: |
            def is_good_message(message):
                text = message.strip().lower()
                found = False
                for word in ("asdf", "изменения", "правки", "update", "fix"):
                    if text == word:
                        found = True
                        break
                if 0 < len(text) <= 50 and not found:
                    return True
                else:
                    return False
          note: Кортеж, флаг found с break, двойное сравнение 0 < len <= 50, if/else в конце.
        - code: |
            def is_good_message(message):
                result = True
                if len(message.strip()) == 0:
                    result = False
                elif len(message.strip()) > 50:
                    result = False
                elif message.strip().lower() in ["fix", "update", "правки", "изменения", "asdf"]:
                    result = False
                return result
          note: strip() в каждой проверке без переменной, цепочка elif, один return result.
        - code: |
            def is_good_message(message):
                text = message.strip().lower()
                if len(text) < 51 and text != "" and text != "fix" and text != "update" and text != "правки" and text != "изменения" and text != "asdf":
                    return True
                return False
          note: Одно длинное условие через and и != (рецензент-ученик).
        - code: |
            BAD_WORDS = ["fix", "update", "правки", "изменения", "asdf"]


            def is_good_message(message):
                text = message.strip()
                if len(text) < 1:
                    return False
                if len(text) > 50:
                    return False
                if text.lower() in BAD_WORDS:
                    return False
                return True


            msg = "  Исправить деление на ноль  "
            print(f"«{msg}» — {is_good_message(msg)}")
          note: lower() только при сравнении со словами, пустота через len < 1, f-строка внизу.
      wrongSolutions:
        - code: |
            def is_good_message(message):
                text = message.strip().lower()
                if text == "":
                    print(False)
                elif len(text) > 50:
                    print(False)
                elif text in ["fix", "update", "правки", "изменения", "asdf"]:
                    print(False)
                else:
