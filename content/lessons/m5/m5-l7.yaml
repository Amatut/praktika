id: m5-l7
module: m5
number: "5.7"
title: "Самостоятельная работа: первый проект на функциях"
objective: >-
  Самостоятельно переделать готовую программу без функций в программу из небольших функций с
  return, сохранив её поведение, и подтвердить это на тех же входных данных.
minutes: [45, 60]
prerequisites: [m5-l6]
skills: [function-design, functions, scope]
environment: python

story:
  title: Сначала навести порядок
  fictional: true
  text: >-
    Калькулятор Даши за месяц разросся почти до тридцати строк, и большая часть из них жила внутри
    одного цикла. Друг попросил добавить возведение в степень, и Даша поняла, что не знает, куда
    вставить новую операцию, не задев остальные. Тогда она решила сначала разложить программу на
    функции, ничего не меняя в её поведении, а проверять себя простым способом: одни и те же вводы
    до и после переделки должны давать одинаковый вывод. Рабочая версия уже лежала в Git, поэтому
    переделывать было не страшно. Сегодня ты пройдёшь тот же путь — сначала в тренажёре, потом со
    своим проектом на компьютере.

why: >-
  Переделать программу, не меняя её поведения, — обычная работа программиста: так код готовят к
  новым требованиям. Проверка простая: на тех же входных данных вывод до и после совпадает строка
  в строку.

usedIn: >-
  Такую переделку называют **рефакторингом**. Её делают перед тем, как добавить новую
  возможность, и защищают проверками — сначала ручными, как сегодня, а позже автоматическими
  тестами (модуль 9).

steps:
  - id: reminder
    type: theory
    title: Перед стартом
    body: |-
      Сегодня самостоятельная работа — финиш модуля «Функции». В главном задании ты переделываешь
      калькулятор Даши на функции, во втором — добавляешь в него новую операцию. В обоих
      подсказки откроются только после первой проверки. Это не запрет на помощь — просто сначала
      попробуй сам.

      **Что проверяется.** Три функции с заданными именами: проверка вызывает их с разными
      аргументами и сравнивает, что они вернули. Вывод программы: на тех же вводах он должен
      совпасть с выводом исходной версии строка в строку. И ещё два требования: основная часть
      программы (код вне функций или в `main()`, как в уроке 5.5) пользуется новыми функциями,
      а `global` в программе нет.

      Всё нужное ты уже знаешь:

      - `def имя(параметры):` объявляет функцию, `return` отдаёт результат туда, где её вызвали.
        Функция без `return` возвращает `None`.
      - Функция-расчёт не печатает и не спрашивает: данные приходят параметрами, результат уходит
        через `return`. Читает ввод и печатает основная часть.
      - Переменные внутри функции — локальные. Счётчик, который растёт в цикле, живёт там же, где
        цикл.
      - Одна функция — одно дело. Основную часть можно положить в `main()`, но тогда её нужно
        вызвать.

      Как работать над заданием:

      1. Нажми «Запустить», ничего не меняя: в поле «Ввод для „Запустить“» уже стоит ввод из
         первого примера (поле свёрнуто — нажми на заголовок, чтобы раскрыть). Этот вывод —
         образец.
      2. Найди в цикле куски трёх видов: проверка «можно ли считать», расчёт и сборка строки для
         вывода.
      3. Выноси по одной функции. После каждой нажимай «Запустить» и сравнивай вывод с образцом.
      4. Когда всё совпало, нажми «Проверить».

      Урок — на два захода по 20–30 минут: сначала оба задания в тренажёре, потом шаг «Свой
      проект на функциях» на компьютере. Второй заход можно провести в другой день.
    simpler: >-
      Нового материала сегодня нет. Программа уже работает — нужно разложить её по функциям так,
      чтобы снаружи ничего не изменилось. Перенёс кусок в функцию — запустил — сравнил вывод с
      тем, что был до переделки.
    coach: >-
      Ошибка на первой попытке — не провал, а подсказка, что стоит повторить.

  - id: warmup
    type: predict
    title: Разминка
    prompt: >-
      Разомнись на области видимости: параметр функции называется так же, как переменная
      снаружи. Как думаешь, что выведет программа?
    code: |-
      def apply_discount(price, percent):
          price = price - price * percent // 100
          return price

      price = 1000
      new_price = apply_discount(price, 10)
      print(price, new_price)
    options:
      - "900 900"
      - "1000 900"
      - "1000 1000"
    answer: "1000 900"
    explanation: >-
      Параметр `price` — локальная переменная функции. Присваивание внутри меняет только её, а
      внешняя `price` остаётся 1000. Новое значение попало наружу только через `return` — в
      переменную `new_price`. Ответ «900 900» — это ожидание, что функция изменит одноимённую
      переменную снаружи (урок 5.4). В калькуляторе будет то же самое: функции отдают результат
      через `return`, а счётчик меняет основная часть.
    coach: >-
      Вошло через параметр — вышло через return. Этого правила хватит на всю самостоятельную работу.

  - id: plan
    type: order
    title: План переделки
    prompt: >-
      Как переделать работающую программу на компьютере и ничего не сломать? Расставь шаги по
      порядку.
    items:
      - id: record
        text: Запустить программу на нескольких вводах — обычных и граничных — и записать, что она выводит
      - id: save
        text: Сохранить рабочую версию коммитом
      - id: extract
        text: Вынести одну часть программы в функцию
      - id: compare
        text: Запустить на тех же вводах и сравнить вывод с записанным
      - id: commit
        text: Сделать коммит с понятным сообщением
    before:
      - [record, extract]
      - [save, extract]
      - [extract, compare]
      - [compare, commit]
    explanation: >-
      Сначала нужны образец — вывод до переделки — и рабочая версия в Git, к которой можно
      вернуться. Эти два шага можно поменять местами. Потом переносишь одну часть и сразу
      сравниваешь: если вывод разошёлся, ты точно знаешь, какая правка виновата. Коммит — когда
      всё совпало. Для следующей функции цикл «вынести → сравнить» повторяется.
    coach: >-
      Маленький шаг и проверка после каждого — главный приём этого урока.

  - id: main-task
    type: exercise
    title: Самостоятельная работа
    exercise:
      id: m5-l7-e1
      kind: modify
      title: Калькулятор на функциях
      statement: |-
        Перед тобой калькулятор Даши. Он работает, но почти весь код — в одном цикле. Переделай
        его на функции так, чтобы **поведение не изменилось**: на тех же вводах — тот же вывод,
        строка в строку.

        Нужны три функции. Имена и порядок параметров — ровно такие, по ним работает проверка:

        ```text
        find_problem(op, b)             → текст проблемы или пустая строка ""
        calculate(a, b, op)             → результат вычисления
        format_line(a, b, op, result)   → строка вида «2 + 3 = 5»
        ```

        - `find_problem` возвращает `Не знаю операцию «…»` с самой операцией внутри кавычек, если
          `op` — не одна из операций `+`, `-`, `*`, `/`. Если `op` — это `/`, а `b` равно 0, она
          возвращает `На ноль делить нельзя`. Иначе проблем нет, и функция возвращает пустую
          строку `""`.
        - `calculate` возвращает результат. Основная часть вызывает её, только когда
          `find_problem` вернула `""`.
        - `format_line` возвращает готовую строку, а печатает её основная часть.

        Ввод, печать и счётчик вычислений остаются в основной части. Цикл можно оставить внизу
        программы или положить в функцию `main()`. `global` не используй.
      input: >-
        По кругу три строки: первое число или слово «выход», операция, второе число. Круги
        повторяются, пока не придёт «выход».
      output: >-
        Как у исходной программы: заголовок, по строке на каждое вычисление или проблему и в
        конце — число вычислений.
      constraints:
        - Числа во вводе целые.
        - Тексты заголовка и сообщений не меняй — проверка сравнивает вывод посимвольно.
        - Текст в скобках у input() может быть любым — в вывод он не входит.
        - Подсказки откроются после первой проверки — сначала попробуй сам.
      starterCode: |
        print("Калькулятор. Для выхода введи «выход».")
        count = 0
        while True:
            first = input("Первое число: ")
            if first == "выход":
                break
            a = int(first)
            op = input("Операция (+ - * /): ")
            b = int(input("Второе число: "))
            if op == "+":
                print(f"{a} + {b} = {a + b}")
                count += 1
            elif op == "-":
                print(f"{a} - {b} = {a - b}")
                count += 1
            elif op == "*":
                print(f"{a} * {b} = {a * b}")
                count += 1
            elif op == "/":
                if b == 0:
                    print("На ноль делить нельзя")
                else:
                    print(f"{a} / {b} = {a / b}")
                    count += 1
            else:
                print(f"Не знаю операцию «{op}»")
        print(f"Вычислений: {count}")
      tests:
        - id: t1
          kind: io
          title: "Пример 1: сложение и деление"
          example: true
          stdin: "2\n+\n3\n10\n/\n4\nвыход\n"
          expected: |-
            Калькулятор. Для выхода введи «выход».
            2 + 3 = 5
            10 / 4 = 2.5
            Вычислений: 2
        - id: t2
          kind: io
          title: "Пример 2: проблемы не считаются"
          example: true
          stdin: "7\n/\n0\n5\n%\n2\n6\n*\n-3\nвыход\n"
          expected: |-
            Калькулятор. Для выхода введи «выход».
            На ноль делить нельзя
            Не знаю операцию «%»
            6 * -3 = -18
            Вычислений: 1
        - id: t3
          kind: io
          title: "Граничный случай: сразу «выход»"
          edge: true
          stdin: "выход\n"
          expected: |-
            Калькулятор. Для выхода введи «выход».
            Вычислений: 0
        - id: t4
          kind: io
          title: "Граничный случай: минус в ответе и деление без остатка"
          edge: true
          stdin: "9\n-\n12\n8\n/\n2\nвыход\n"
          expected: |-
            Калькулятор. Для выхода введи «выход».
            9 - 12 = -3
            8 / 2 = 4.0
            Вычислений: 2
        - id: t5
          kind: io
          title: "Граничный случай: нули и пустая операция"
          edge: true
          stdin: "0\n+\n0\n5\n\n2\nвыход\n"
          expected: |-
            Калькулятор. Для выхода введи «выход».
            0 + 0 = 0
            Не знаю операцию «»
            Вычислений: 1
        - id: t6
          kind: io
          title: "Граничный случай: деление с длинной дробью"
          edge: true
          stdin: "1\n/\n3\nвыход\n"
          expected: |-
            Калькулятор. Для выхода введи «выход».
            1 / 3 = 0.3333333333333333
            Вычислений: 1
        - id: c1
          kind: call
          title: "calculate: сложение"
          stdin: "выход\n"
          call: "calculate(2, 3, '+')"
          expected: "5"
        - id: c2
          kind: call
          title: "calculate: деление"
          example: true
          stdin: "выход\n"
          call: "calculate(10, 4, '/')"
          expected: "2.5"
        - id: c3
          kind: call
          title: "calculate: разность равна нулю"
          edge: true
          stdin: "выход\n"
          call: "calculate(7, 7, '-')"
          expected: "0"
        - id: c4
          kind: call
          title: "calculate: отрицательное число"
          stdin: "выход\n"
          call: "calculate(-2, 3, '*')"
          expected: "-6"
        - id: p1
          kind: call
          title: "find_problem: деление на ноль"
          example: true
          stdin: "выход\n"
          call: "find_problem('/', 0)"
          expected: "'На ноль делить нельзя'"
        - id: p2
          kind: call
          title: "find_problem: неизвестная операция"
          stdin: "выход\n"
          call: "find_problem('%', 5)"
          expected: "'Не знаю операцию «%»'"
        - id: p3
          kind: call
          title: "find_problem: проблем нет"
          example: true
          stdin: "выход\n"
          call: "find_problem('/', 5)"
          expected: "''"
        - id: p4
          kind: call
          title: "find_problem: ноль при сложении — не проблема"
          edge: true
          stdin: "выход\n"
          call: "find_problem('+', 0)"
          expected: "''"
        - id: p5
          kind: call
          title: "find_problem: пустая операция"
          edge: true
          stdin: "выход\n"
          call: "find_problem('', 5)"
          expected: "'Не знаю операцию «»'"
        - id: p6
          kind: call
          title: "find_problem: два знака вместо одного"
          edge: true
          stdin: "выход\n"
          call: "find_problem('+-', 5)"
          expected: "'Не знаю операцию «+-»'"
        - id: f1
          kind: call
          title: "format_line: целый результат"
          example: true
          stdin: "выход\n"
          call: "format_line(2, 3, '+', 5)"
          expected: "'2 + 3 = 5'"
        - id: f2
          kind: call
          title: "format_line: дробный результат"
          stdin: "выход\n"
          call: "format_line(10, 4, '/', 2.5)"
          expected: "'10 / 4 = 2.5'"
      rules:
        - id: r-uses
          use: [call:find_problem, call:calculate, call:format_line]
          message: >-
            Основная часть программы пользуется новыми функциями find_problem, calculate и
            format_line, а не повторяет старые проверки и вычисления.
        - id: r-no-global
          avoid: [Global]
          message: >-
            Без global: счётчик вычислений меняется в основной части (или в main), а не внутри
            функций.
      criteria:
        - Функции find_problem, calculate и format_line принимают параметры в заданном порядке и возвращают значения, а не печатают их.
        - find_problem возвращает пустую строку, когда проблем нет; ноль — проблема только для деления.
        - На тех же вводах программа выводит то же, что исходная, строка в строку.
        - Основная часть вызывает новые функции, а счётчик меняется в ней самой, без global.
      hints:
        - >-
          Посмотри на ветки `if`/`elif` внутри цикла. Какие из них решают, можно ли вообще
          считать? Какие считают? Где собирается строка для вывода? Это и есть три будущие
          функции. А в цикле остаются ввод, печать и счётчик.
        - |-
          Тот же приём на другой задаче. Функция возвращает текст проблемы или пустую строку, а
          основная часть решает, что печатать:

          ```python
          def find_age_problem(age):
              if age < 0:
                  return "Возраст не бывает отрицательным"
              if age > 150:
                  return "Слишком большой возраст"
              return ""

          age = int(input())
          problem = find_age_problem(age)
          if problem != "":
              print(problem)
          else:
              print(f"Через год тебе будет {age + 1}")
          ```
        - |-
          Каркас:

          ```text
          def find_problem(op, b):
              если op нет в списке ["+", "-", "*", "/"] → вернуть f"Не знаю операцию «{op}»"
              если op == "/" и b == 0 → вернуть "На ноль делить нельзя"
              вернуть ""

          def calculate(a, b, op):
              ветки по op, в каждой — return с результатом

          def format_line(a, b, op, result):
              вернуть f-строку «a op b = result»

          заголовок, count = 0, цикл как раньше:
              прочитать first (выйти по «выход»), a, op, b
              problem = find_problem(op, b)
              если problem != "" → напечатать problem
              иначе → result = calculate(…), напечатать format_line(…), count += 1
          после цикла — «Вычислений: …»
          ```
      solution:
        code: |
          def find_problem(op, b):
              if op not in ["+", "-", "*", "/"]:
                  return f"Не знаю операцию «{op}»"
              if op == "/" and b == 0:
                  return "На ноль делить нельзя"
              return ""


          def calculate(a, b, op):
              if op == "+":
                  return a + b
              elif op == "-":
                  return a - b
              elif op == "*":
                  return a * b
              elif op == "/":
                  return a / b


          def format_line(a, b, op, result):
              return f"{a} {op} {b} = {result}"


          print("Калькулятор. Для выхода введи «выход».")
          count = 0
          while True:
              first = input("Первое число: ")
              if first == "выход":
                  break
              a = int(first)
              op = input("Операция (+ - * /): ")
              b = int(input("Второе число: "))
              problem = find_problem(op, b)
              if problem != "":
                  print(problem)
              else:
                  result = calculate(a, b, op)
                  print(format_line(a, b, op, result))
                  count += 1
          print(f"Вычислений: {count}")
        explanation: >-
          Каждая функция делает одно дело и ничего не печатает: `find_problem` решает, можно ли
          считать, `calculate` считает, `format_line` собирает строку. Пустая строка `""` — знак
          «проблем нет», поэтому в конце `find_problem` стоит `return ""`. Операцию сравнивают со
          списком, а не со строкой `"+-*/"`: в строке `in` ищет кусок текста, и пустой ввод или
          «+-» сошли бы за известную операцию. Ввод, печать и счётчик остались в основной части —
          поэтому `global` не понадобился, а вывод совпадает с исходным строка в строку.
      altSolutions:
        - code: |
            def find_problem(op, b):
                if op != "+" and op != "-" and op != "*" and op != "/":
                    return f"Не знаю операцию «{op}»"
                if op == "/" and b == 0:
                    return "На ноль делить нельзя"
                return ""


            def calculate(a, b, op):
                if op == "+":
                    return a + b
                if op == "-":
                    return a - b
                if op == "*":
                    return a * b
                return a / b


            def format_line(a, b, op, result):
                return str(a) + " " + op + " " + str(b) + " = " + str(result)


            def main():
                print("Калькулятор. Для выхода введи «выход».")
                count = 0
                while True:
                    first = input("Первое число: ")
                    if first == "выход":
                        break
                    a = int(first)
                    op = input("Операция (+ - * /): ")
                    b = int(input("Второе число: "))
                    problem = find_problem(op, b)
                    if problem == "":
                        print(format_line(a, b, op, calculate(a, b, op)))
                        count += 1
                    else:
                        print(problem)
                print(f"Вычислений: {count}")


            main()
