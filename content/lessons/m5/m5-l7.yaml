      solution:
        code: |
          def find_problem(op, b):
              if op not in ["+", "-", "*", "/", "^"]:
                  return f"Не знаю операцию «{op}»"
              if op == "/" and b == 0:
                  return "На ноль делить нельзя"
              return ""


          def calculate(a, b, op):
              if op == "+":
                  return a + b
              elif op == "-":
                  return a - b
              elif op == "*":
                  return a * b
              elif op == "/":
                  return a / b
              elif op == "^":
                  return a ** b


          def format_line(a, b, op, result):
              return f"{a} {op} {b} = {result}"


          print("Калькулятор. Для выхода введи «выход».")
          count = 0
          while True:
              first = input("Первое число: ")
              if first == "выход":
                  break
              a = int(first)
              op = input("Операция (+ - * / ^): ")
              b = int(input("Второе число: "))
              problem = find_problem(op, b)
              if problem != "":
                  print(problem)
              else:
                  result = calculate(a, b, op)
                  print(format_line(a, b, op, result))
                  count += 1
          print(f"Вычислений: {count}")
        explanation: >-
          Новая операция — две правки по смыслу: `find_problem` узнала знак `^`, а `calculate`
          получила ветку с `**`. Пользователь вводит `^`, а Python возводит в степень своим
          оператором `**`: знак `^` у него означает другое. `format_line`, цикл и счётчик остались
          прежними — в тексте `input()` для операции только добавился знак `^`. Строку
          «2 ^ 10 = 1024» `format_line` собирает так же, как любую другую.
