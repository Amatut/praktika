            print("Калькулятор. Для выхода введи «выход».")
            count = 0
            while True:
                first = input("Первое число: ")
                if first == "выход":
                    break
                a = int(first)
                op = input("Операция (+ - * /): ")
                b = int(input("Второе число: "))
                problem = find_problem(op, b)
                if problem != "":
                    print(problem)
                else:
                    print(format_line(a, b, op, calculate(a, b, op)))
                    count += 1
            print(f"Вычислений: {count}")
          note: >-
            calculate через словарь считает все операции сразу и падает на «0 + 0». Разбор
            calc-before-check (про вызов до проверки) срабатывать не должен: общий разбор укажет
            строку со словарём.
          expectMistake: null
        - code: |
            print("Калькулятор. Для выхода введи «выход».")
            count = 0
            while True:
                first = input("Первое число: ")
                if first == "выход":
                    break
                a = int(first)
                op = input("Операция (+ - * /): ")
                b = int(input("Второе число: "))

                def find_problem(op, b):
                    if op not in ["+", "-", "*", "/"]:
                        return f"Не знаю операцию «{op}»"
                    if op == "/" and b == 0:
                        return "На ноль делить нельзя"
                    return ""

                def calculate(a, b, op):
                    if op == "+":
                        return a + b
                    elif op == "-":
                        return a - b
                    elif op == "*":
                        return a * b
                    elif op == "/":
                        return a / b

                def format_line(a, b, op, result):
                    return f"{a} {op} {b} = {result}"

                problem = find_problem(op, b)
                if problem != "":
                    print(problem)
                else:
                    print(format_line(a, b, op, calculate(a, b, op)))
                    count += 1
            print(f"Вычислений: {count}")
          note: >-
            Функции объявлены внутри цикла, там, где был старый код, — при вводе «выход» они не
            создаются. Разборы prints-line и print-in-function срабатывать не должны: общий разбор
            скажет, что функция объявлена внутри другого блока.
          expectMistake: null
      mistakes:
        - id: no-functions
          when:
            errorType: NameError
            codeRegex: '(?<![\s\S])(?:(?![\s\S]*\bdef\s+find_problem\b)|(?![\s\S]*\bdef\s+calculate\b)|(?![\s\S]*\bdef\s+format_line\b))'
          where: Объявления функций
          why: >-
            Проверка вызывает три функции по именам: `find_problem`, `calculate` и `format_line`.
            Какой-то из них в программе пока нет или она названа иначе, поэтому вызовы проверки
            падают с NameError. Если ты в середине переделки, это нормально.
          try: >-
            Вынеси следующую часть цикла в функцию с именем и параметрами из условия и вызови её
            из основной части. После каждой новой функции нажимай «Запустить» и сравнивай вывод с
            образцом.
          verify: Тесты с вызовами функций больше не должны падать с NameError.
        - id: unbound-count
          when:
            errorType: UnboundLocalError
            errorIncludes: "'count'"
          where: Функция, внутри которой меняется счётчик вычислений
          why: >-
            Счётчик `count` создан снаружи, а увеличивается внутри функции. Присваивание
            `count += 1` делает `count` локальной переменной этой функции, а у локальной ещё нет
            значения — отсюда UnboundLocalError (урок 5.4).
          try: >-
            Счётчик должен жить там же, где цикл. Если цикл в основной части, пиши `count += 1` в
            нём, сразу после печати результата, а не в функции-расчёте. Если цикл внутри `main()`,
            перенеси туда и `count = 0` — перед циклом.
          verify: 'В «Примере 1» программа не должна падать, а в конце должно быть «Вычислений: 2».'
        - id: count-outside-main
          when:
            errorType: NameError
            errorIncludes: "'count'"
            codeRegex: '^[ \t]+count\s*=\s*0'
          where: Строка, которая печатает число вычислений
          why: >-
            Счётчик `count = 0` создан внутри функции — это её локальная переменная, и снаружи её
            не видно. А строка, которая печатает «Вычислений», стоит вне функции: там `count`
            не существует (урок 5.4).
          try: >-
            Перенеси итоговый `print` внутрь функции — после цикла, с тем же отступом, что у
            `while`.
          verify: 'В «Примере 1» в конце должно быть «Вычислений: 2».'
        - id: count-missing
          when:
            errorType: NameError
            errorIncludes: "'count'"
            codeRegex: '(?<![\s\S])(?![\s\S]*^[ \t]*count\s*=)'
          where: Перед циклом в основной части
          why: >-
            Счётчик `count` увеличивается и печатается, но нигде не создан: строки `count = 0` в
            программе нет. `count += 1` может только изменить переменную, которая уже есть, —
            поэтому NameError.
          try: >-
            Верни строку `count = 0` перед циклом — туда, где она стояла в исходной программе. Если
            цикл внутри `main()`, то в `main()`, перед `while`.
          verify: 'В «Примере 1» в конце должно быть «Вычислений: 2».'
        - id: zero-not-found
          when:
            errorType: ZeroDivisionError
            failedTest: p1
          where: Функция find_problem
          why: >-
            `find_problem("/", 0)` вернула `""` — «проблем нет». Основная часть ей поверила,
            вызвала `calculate`, и Python остановил программу на делении на ноль: ZeroDivisionError.
            Значит, проверка деления на ноль в `find_problem` не срабатывает.
          try: >-
            Проверь три вещи. Есть ли в `find_problem` проверка «операция `/` и `b` равно 0»? Не
            стоит ли выше неё `return ""` для известной операции: `return` сразу завершает функцию,
            и до проверки нуля дело не доходит. И сравниваешь ли ты `b` с числом `0`, а не со
            строкой `"0"`?
          verify: '`find_problem("/", 0)` должна вернуть «На ноль делить нельзя», а «Пример 2» — дойти до конца.'
        - id: calc-before-check
          when:
            errorType: ZeroDivisionError
            failedTest: t2
          where: Строка, где вызывается calculate
          why: >-
            `calculate` вызывается раньше, чем программа убедилась, что проблем нет. Для `7 / 0`
            Python не может поделить и останавливает программу ошибкой ZeroDivisionError — «деление
            на ноль».
          try: >-
            Сначала узнай проблему через `find_problem(op, b)`. Вызывай `calculate` только в той
            ветке, где проблема — пустая строка `""`.
          verify: В «Примере 2» должна появиться строка «На ноль делить нельзя», а программа — дойти до конца.
        - id: param-order
          when:
            codeRegex: 'def\s+(?:(?:calculate|format_line)\(\s*(?:\w+\s*,\s*)?op\b|find_problem\(\s*b\b)'
          where: Строка def с параметрами в другом порядке
          why: >-
            Проверка вызывает функции с аргументами в том порядке, что в условии:
            `find_problem(op, b)`, `calculate(a, b, op)`, `format_line(a, b, op, result)`. Если в
            `def` параметры стоят иначе, значения попадают не туда: например, в `op` приходит
            число, а в `b` — знак операции. В твоей программе вызовы совпадают с `def`, поэтому
            «Запустить» работает, а вызовы проверки — нет.
          try: Расставь параметры в `def` как в условии и поправь вызовы в основной части.
          verify: '`calculate(10, 4, "/")` должна вернуть 2.5, а `format_line(2, 3, "+", 5)` — строку «2 + 3 = 5».'
        - id: none-instead-empty
          when:
            failedTest: p3
            codeRegex: '(?<![\s\S])(?![\s\S]*return\s*(?:""|''''))(?![\s\S]*def\s+find_problem\b[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?[ \t]+return[ \t]+(?!None\b)[A-Za-z_]\w*[ \t]*$)'
          where: Конец функции find_problem
          why: >-
            Когда проблем нет, `find_problem` возвращает `None`, а не пустую строку: доходит до
            конца без `return` или возвращает `None` явно. А по условию «проблем нет» — это именно
            `""`, и проверка ждёт от функции пустую строку.
          try: >-
            Поставь последней строкой функции `return ""` (вместо `return None`, если он есть). Если
            основная часть сравнивала ответ с `None`, сравнивай теперь с пустой строкой:
            `problem != ""`.
          verify: '`find_problem("/", 5)` должна вернуть пустую строку, а «Пример 1» — вывести «2 + 3 = 5».'
        - id: none-in-branch
          when:
            failedTest: p3
            outputIncludes: None
          where: Ветки find_problem
          why: >-
            Когда проблем нет, `find_problem` иногда не доходит ни до одного `return` — например,
            при `find_problem("/", 5)`. Тогда функция возвращает `None`, а основная часть печатает
            его как «None». Так бывает, когда `return ""` стоит только в некоторых ветках.
          try: >-
            Проследи, что делает функция при `op = "/"` и `b = 5`. Надёжнее всего поставить
            `return ""` последней строкой функции — с отступом тела функции, а не внутри `if`:
            тогда он сработает всегда, когда проблем не нашлось.
          verify: '`find_problem("/", 5)` должна вернуть пустую строку, а «Пример 1» — вывести «10 / 4 = 2.5».'
        - id: zero-in-calculate
          when:
            failedTest: p1
            outputIncludes: "= На ноль делить нельзя"
          where: Функции calculate и find_problem
          why: >-
            Проверка деления на ноль осталась в `calculate`. Поэтому `find_problem("/", 0)`
            отвечает «проблем нет», и основная часть считает пример удачным: печатает «7 / 0 = На
            ноль делить нельзя» и увеличивает счётчик.
          try: >-
            Перенеси проверку `b == 0` для деления в `find_problem`: это она решает, можно ли
            считать. А `calculate` пусть только считает.
          verify: 'В «Примере 2» должна быть отдельная строка «На ноль делить нельзя», а в конце — «Вычислений: 1».'
        - id: zero-for-all
          when:
            failedTest: p4
            outputIncludes: На ноль делить нельзя
            codeRegex: '(?<![/]["''][ \t]*:[ \t]*\n)^[ \t]*(?:el)?if\b(?![^\n]*\band\b)[^\n]*\bb\s*==\s*0'
          where: Проверка деления на ноль в find_problem
          why: >-
            `find_problem("+", 0)` сообщает о проблеме, хотя прибавить ноль можно. Ноль опасен
            только для деления, а проверка `b == 0` срабатывает при любой операции.
          try: >-
            Объедини два условия через `and`. Проблема — когда операция `/` **и** `b` равно 0.
          verify: >-
            `find_problem("+", 0)` должна вернуть пустую строку, а в граничном случае «нули и
            пустая операция» после заголовка должна идти строка «0 + 0 = 0».
        - id: empty-op
          when:
            failedTest: p5
            codeRegex: '(?<![\s\S])(?![\s\S]*(?:\blen\(\s*\w+\s*\)\s*!=\s*1|\b\w+\s*==\s*(?:""|''''))\s+or\b)[\s\S]*?\bin\s*["'']'
          where: Проверка операции в find_problem
          why: >-
            Для строки `in` ищет кусок текста (подстроку), а пустая строка входит в любую строку:
            `"" in "+-*/"` — это `True`. Поэтому пустой ввод сходит за известную операцию.
          try: >-
            Сравнивай операцию со списком: `["+", "-", "*", "/"]`. Для списка `in` сравнивает
            элементы целиком: ни пустой строки, ни «+-» в нём нет.
          verify: '`find_problem("", 5)` должна вернуть «Не знаю операцию «»».'
        - id: substring-op
          when:
            failedTest: p6
            codeRegex: '(?<![\s\S])(?![\s\S]*\blen\(\s*\w+\s*\)\s*!=\s*1\s+or\b)[\s\S]*?\bin\s*["'']'
          where: Проверка операции в find_problem
          why: >-
            Для строки `in` ищет кусок текста, а не отдельный знак: `"+-" in "+-*/"` — это `True`.
            Поэтому ввод «+-» сходит за известную операцию, хотя исходный калькулятор отвечал на
            него «Не знаю операцию «+-»».
          try: >-
            Сравнивай операцию со списком: `["+", "-", "*", "/"]`. Для списка `in` сравнивает
            элементы целиком: ни пустой строки, ни «+-» в нём нет.
          verify: '`find_problem("+-", 5)` должна вернуть «Не знаю операцию «+-»».'
        - id: prints-line
          when:
            failedTest: f1
            codeRegex: '^([ \t]*)def\s+format_line\b[^\n]*\n(?:\1[ \t]+[^\n]*\n|[ \t]*\n)*?\1[ \t]+(?:return\s+)?print\('
          where: Тело функции format_line
          why: >-
            `format_line` печатает строку, а не возвращает её. На экране строка видна, но тот, кто
            вызвал функцию, получает `None` (урок 5.3).
          try: >-
            Замени `print(...)` внутри функции на `return` с той же f-строкой, а печатай в основной
            части: `print(format_line(a, b, op, result))`.
          verify: '`format_line(2, 3, "+", 5)` должна вернуть строку «2 + 3 = 5».'
        - id: print-in-function
          when:
            codeRegex: '^([ \t]*)def\s+(?:find_problem|calculate|format_line)\b[^\n]*\n(?:\1[ \t]+[^\n]*\n|[ \t]*\n)*?\1[ \t]+print\('
          where: print внутри find_problem, calculate или format_line
          why: >-
            Одна из функций `find_problem`, `calculate` или `format_line` сама вызывает `print`. В
            этой программе они только возвращают значения, а печатает основная часть. Если
            печатают обе, строка появляется на экране дважды.
          try: >-
            Убери `print` из функции и оставь `return` — основная часть уже печатает то, что
            функция вернула.
          verify: Каждая строка «Примера 1» должна появиться в выводе один раз.
        - id: none-result
          when:
            outputIncludes: "= None"
          where: Функция calculate и строка, где её вызывают
          why: >-
            `calculate` вернула `None`: для этого ввода она не дошла ни до одного `return`. Так
            бывает, если в нужной ветке нет `return` или если аргументы в вызове стоят не в том
            порядке, что параметры в `def`: `calculate(a, op, b)` при `def calculate(a, b, op)`
            кладёт знак операции в `b`, а число — в `op`, и ни одно сравнение с `op` не срабатывает.
          try: >-
            Сверь вызов с `def`: аргументы идут в том же порядке — `calculate(a, b, op)`. И проверь,
            что в каждой ветке `calculate` стоит `return`.
          verify: 'В «Примере 1» должны появиться строки «2 + 3 = 5» и «10 / 4 = 2.5».'
        - id: function-object
          when:
            outputIncludes: "<function "
          where: Строка, где вызывается calculate
          why: >-
            В строке результата напечаталось `<function …>`: имя функции без скобок её не вызывает
            (урок 5.1). Поэтому в `format_line` попала сама функция `calculate`, а не результат
            вычисления.
          try: >-
            Вызови `calculate` со скобками и аргументами — `result = calculate(a, b, op)` — и передай
            в `format_line` переменную `result`.
          verify: 'В «Примере 1» должна появиться строка «2 + 3 = 5».'
        - id: main-not-called
          when:
            outputEquals: ""
          where: Последняя строка программы
          why: >-
            Программа ничего не напечатала — даже заголовок. Похоже, основная часть лежит в функции
            (например, `main()`), а сама функция не вызвана: `def` только объявляет её. То же
            будет, если написать имя без скобок — `main`.
          try: Добавь последней строкой программы, без отступа, вызов этой функции — например, `main()`.
          verify: «Пример 1» должен начаться с заголовка калькулятора.
        - id: count-shadow
          when:
            outputIncludes: "Вычислений: 0"
            codeRegex: '(?<![\s\S])(?=[\s\S]*^count\s*=\s*0)(?=[\s\S]*^def\s+\w+[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?[ \t]+count\s*=\s*0)'
          where: Строки count = 0 внутри функции и снаружи
          why: >-
            В программе два разных счётчика с одним именем. `count` внутри функции растёт, а
            итоговый `print` снаружи печатает другой `count`, созданный вне функции, — он так и
            остался нулём (урок 5.4).
          try: >-
            Оставь один счётчик — внутри функции — и перенеси итоговый `print` туда же, после
            цикла. Строку `count = 0` снаружи убери.
          verify: 'В «Примере 1» в конце должно быть «Вычислений: 2».'
        - id: count-on-error
          when:
            outputIncludes: "Вычислений: 3"
          where: Строка count += 1
          why: >-
            Счётчик вырос и на проблемных вводах. В «Примере 2» три попытки, но посчитать удалось
            только одну — «6 * -3». В исходной программе `count += 1` стоит только там, где
            результат напечатан.
          try: Перенеси `count += 1` в ветку, где проблем нет и строка с результатом напечатана.
          verify: 'В «Примере 2» в конце должно быть «Вычислений: 1».'
        - id: global
          when:
            failedRule: r-no-global
          where: Строка с global
          why: >-
            `global` разрешает функции тайком менять переменную снаружи. Программа работает, но
            такую функцию не проверить отдельно: каждый её вызов меняет чужой счётчик (урок 5.4).
          try: >-
            Убери из функции `global` и `count += 1`. Увеличивай счётчик в цикле основной части —
            там же, где он создан.
          verify: Требование «без global» должно выполниться, а тесты — остаться зелёными.
        - id: unused
          when:
            failedRule: r-uses
          where: Цикл в основной части
          why: >-
            Функции объявлены, но основная часть пользуется не всеми: где-то в цикле остались
            старые проверки, вычисления или сборка строки. Тогда функции — лишний код, а новую
            операцию всё равно придётся вставлять в цикл.
          try: >-
            Замени старые ветки в цикле вызовами: сначала `find_problem`, потом — если проблем нет —
            `calculate` и `format_line`.
          verify: Требование должно выполниться, а вывод на примерах — остаться прежним.
      afterPass: >-
        Поведение прежнее, а программа теперь из понятных частей: каждую функцию можно вызвать и
        проверить отдельно. Подумай, какие функции придётся поменять, чтобы добавить новую
        операцию, — это следующее задание.
      skills: [function-design, functions, scope]
      noHintsBeforeAttempt: true

  - id: bonus-power
    type: exercise
    title: Новое требование
    exercise:
      id: m5-l7-e2
      kind: modify
      title: "Новое требование: степень"
      statement: |-
        Друг Даши просит новую операцию `^` — возведение в степень: `2 ^ 10 = 1024`. Вставь сюда
        свой калькулятор на функциях из самостоятельной работы — или решение, которое открывал
        кнопкой «Показать решение», — и добавь операцию `^`.

        Всё остальное работает как раньше: другие операции, сообщения о проблемах и счётчик
        вычислений. Функции те же три: `find_problem(op, b)`, `calculate(a, b, op)` и
        `format_line(a, b, op, result)`. Нулевая степень — не проблема: `5 ^ 0 = 1`.
      input: >-
        Как в самостоятельной работе: первое число или «выход», операция, второе число. Среди
        операций теперь есть `^`.
      output: >-
        Строка вида «2 ^ 10 = 1024» для степени и прежний вывод для всего остального.
      constraints:
        - Числа во вводе целые, показатель степени не отрицательный.
        - Текст в скобках у input() можно дополнить знаком ^ — он не проверяется.
        - Подсказки откроются после первой проверки — сначала попробуй сам.
