            0.2`.
          try: >-
            Добавь для `^` свою ветку выше деления — или сделай деление отдельной веткой
            `elif op == "/"`.
          verify: В примере должна появиться строка «2 ^ 10 = 1024».
        - id: no-calc-branch
          when:
            outputIncludes: "= None"
          where: Функция calculate
          why: >-
            `find_problem` уже пропускает `^`, но `calculate` для этой операции ничего не
            возвращает: ветки для `^` нет или в ней нет `return`. Функция дошла до конца и вернула
            `None`.
          try: Добавь в `calculate` ветку для `"^"`, которая возвращает результат через `return`.
          verify: В примере должна появиться строка «2 ^ 10 = 1024».
        - id: float-power
          when:
            outputIncludes: "^ 10 = 1024.0"
          where: Ветка для ^ в calculate
          why: >-
            Степень посчитана верно, но результат дробный — «1024.0». Так бывает, если считать
            через `math.pow`: он всегда возвращает дробное число. Исходный калькулятор печатает
            результаты сложения, вычитания и умножения целых чисел без «.0».
          try: Возведи в степень оператором `**`, как в уроке 1.1, — для целых `2 ** 10` даёт целое 1024.
          verify: В примере должна появиться строка «2 ^ 10 = 1024».
        - id: empty-op
          when:
            failedTest: p3
            codeRegex: '(?<![\s\S])(?![\s\S]*\blen\(\s*\w+\s*\)\s*!=\s*1\s+or\b)[\s\S]*?\bin\s*["'']'
          where: Проверка операции в find_problem
          why: >-
            Для строки `in` ищет кусок текста, а пустая строка входит в любую строку:
            `"" in "+-*/^"` — это `True`. Поэтому пустой ввод сходит за известную операцию, хотя
            раньше калькулятор отвечал на него «Не знаю операцию «»».
          try: >-
            Сравнивай операцию со списком: `["+", "-", "*", "/", "^"]`. Для списка `in` сравнивает
            элементы целиком, и пустой строки в нём нет.
          verify: '`find_problem("", 5)` должна вернуть «Не знаю операцию «»».'
      afterPass: >-
        Новое требование уложилось в две правки в двух функциях, и ни одна старая строка не
        сломалась. Это и есть польза разбиения на функции. Одно улучшение на будущее: сейчас
        показатель степени не бывает отрицательным. Если его разрешить, ввод `0 ^ -1` уронит
        программу ошибкой деления на ноль (ZeroDivisionError). Подумай, какая из трёх функций
        должна сообщать о такой проблеме, чтобы калькулятор не падал.
      skills: [function-design, functions]
      noHintsBeforeAttempt: true

  - id: own-project
    type: checklist
    title: Свой проект на функциях
    body: >-
      Это отдельная сессия на компьютере, минут на 20–30, — её можно провести в другой день.
      Возьми свой первый проект. Если своего нет, возьми `calc.py` из урока 5.6 (папка
      `python-practice\calculator`): это тот же учебный калькулятор, что в тренажёре. Тренажёр
      не видит твой компьютер, поэтому отмечай пункты сам — по результату, а не по прочтении.
      Команды дальше — для учебного калькулятора; для своего проекта подставь имя своего файла.
    items:
      - id: checks
        text: >-
          **Составь таблицу ручных проверок.** Открой терминал в папке проекта, запусти
          программу (`python calc.py` или `py calc.py`) и попробуй 3–5 вводов: обычные и
          граничные — деление на ноль, неизвестная операция, пустая операция (Enter вместо
          знака), сразу «выход». Для каждого ввода запиши, что программа выводит сейчас.
        help: |-
          Таблицу удобно вести в заметке или прямо в README.md — под заголовком
          `## Как проверить`. Одна строка таблицы может выглядеть так:

          ```text
          7 / 0  →  На ноль делить нельзя
          ```

          Не знаешь, что проверять, — возьми вводы из тестов задания «Калькулятор на функциях».
          Если на каком-то вводе программа падает с ошибкой, это тоже её поведение: запиши тип
          ошибки — после переделки он должен остаться тем же. На macOS и Linux команда запуска —
          `python3 calc.py`.
      - id: clean
        text: >-
          **Убедись, что рабочая версия лежит в Git.** Набери `git status`. Должно быть
          «nothing to commit, working tree clean» (в русской версии Git — «нечего коммитить…»).
          Если Git видит изменения, сначала сделай коммит.
        help: >-
          «fatal: not a git repository» значит, что терминал открыт не в папке проекта или
          репозитория ещё нет. Git не установлен или репозиторий не создан — вернись к уроку 5.6.
          Если ты уже дописал таблицу в README.md, Git покажет его изменённым: закоммить его,
          например, с сообщением «Добавить в README ручные проверки».
      - id: refactor
        text: >-
          **Переделай программу на функции — по одной.** Вынес функцию → сохранил файл →
          запустил на вводах из таблицы → сравнил. Только после этого берись за следующую.
        help: >-
          Запутался и программа сломалась — закрой `calc.py` в редакторе и набери
          `git restore calc.py`: файл вернётся к последнему коммиту (урок 5.6), и можно начать
          заново. Чтобы откатываться недалеко, удобно делать коммит после каждой функции, вывод
          которой совпал с таблицей. Если твой проект — учебный калькулятор, можно опереться на
          своё решение из тренажёра, но таблицу проверок всё равно пройди: в тренажёре ввод был
          записан заранее, а здесь ты вводишь его сам.
      - id: same
        text: >-
          **Сравни с таблицей.** На каждом вводе из таблицы программа выводит то же, что до
          переделки, строка в строку.
        help: >-
          Одна строка не совпала — найди функцию, которая за неё отвечает, и проверь её отдельно:
          временно добавь сразу после объявлений функций, до основной части, проверочный вызов с
          ожидаемым ответом, например
          `print(find_problem("/", 0), "ожидаю: На ноль делить нельзя")`. Запусти, сравни и потом
          убери эту строку. В конце файла такой вызов сработал бы только после «выход»: до этого
          программа ждёт ввода в цикле. Вывод не изменился после правки — проверь, сохранён ли
          файл.
      - id: commit
        text: >-
          **Сохрани результат коммитом:** `git add calc.py`, затем
          `git commit -m "Разбить калькулятор на функции"`. Команда `git log --oneline` покажет
          как минимум три коммита, новый — сверху.
        help: >-
          Для своего проекта подставь имя своего файла и своё сообщение: оно отвечает на вопрос
          «что изменилось?». Если внизу окна двоеточие и команда «не заканчивается», нажми `q`.
          «nothing added to commit» — не было `git add`. Если ты уже коммитил после каждой функции
          и Git отвечает «nothing to commit, working tree clean», всё уже сохранено — отметь пункт.
      - id: readme
        text: >-
          **Проверь README.** Описание и команда запуска по-прежнему верны? Если что-то поменял —
          сохрани README.md и сделай ещё один коммит.
        help: >-
          После переделки на функции команда запуска обычно не меняется: программа по-прежнему
          запускается через `python calc.py`. Тогда README трогать не нужно — просто отметь пункт.
    coach: >-
      Та же схема, что в тренажёре: образец → маленький шаг → сравнение. Только проверяешь теперь
      ты сам.

  - id: recap
    type: recap
    title: Итоги и что повторить
    points:
      - "Обе задачи получились без подсказок — функции, return и разбиение на части уже твои. Можно переходить к модулю 6."
      - "Функция вернула None, печатала результат вместо return или main() не была вызвана — повтори урок 5.1 (вызов функции) и урок 5.3 (return)."
      - "UnboundLocalError, счётчик вырос не там или хотелось написать global — повтори урок 5.4 (область видимости)."
      - "Трудно было решить, какие куски вынести, и функции вышли длинными — урок 5.5. Ошибки Git на компьютере — урок 5.6 и его подсказки «Если не получается»."
    question: Как ты проверил, что после переделки калькулятор ведёт себя так же, как раньше?
    answer: >-
      Запустил старую и новую версии на одних и тех же вводах — обычных и граничных — и сравнил
      вывод строка в строку. В тренажёре это делают тесты задания, а на компьютере — таблица
      ручных проверок, составленная до переделки.
