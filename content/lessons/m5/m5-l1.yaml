      mistakes:
        - id: no-colon
          when:
            errorIncludes: "expected ':'"
            codeRegex: '^def[^\n]*\)[ \t]*$'
          why: >-
            `expected ':'` — «ожидалось двоеточие». Строка с `def`, как и строка с `if` или `for`,
            заканчивается двоеточием: оно показывает, что дальше начинается тело.
          try: "Поставь двоеточие после скобок: `def start_signal():`."
          verify: Ошибка должна исчезнуть, а в «Примере» появятся восемь строк.
        - id: call-colon
