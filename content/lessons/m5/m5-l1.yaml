      title: Одна памятка вместо трёх копий
      statement: |-
        Это программа Рустама до исправления. Памятка в ней записана три раза, и копии уже
        разошлись: в третьей нет пункта «- заряд телефона».

        Перепиши программу: запиши памятку один раз — в функцию `show_reminder()`, — а каждую
        копию замени вызовом этой функции. Заголовки этапов остаются в основной программе. На
        каждом этапе памятка должна быть полной:

        ```text
        Перед выходом:
        - вода и перекус
        - фонарик и аптечка
        - сообщи руководителю маршрут
        - заряд телефона
        ```
      output: "18 строк: для каждого из трёх этапов — заголовок и пять строк памятки."
      constraints:
        - "Функция называется `show_reminder` и печатает только памятку, без заголовка этапа."
        - Строки памятки записаны в программе один раз — в теле функции.
