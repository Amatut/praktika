            errorType: SyntaxError
            codeRegex: '^[ \t]*start_signal[ \t]*\([ \t]*\)[ \t]*:'
          why: >-
            В конце вызова стоит двоеточие, но его место — в строке с `def`: там оно открывает
            тело функции. Строка вызова — это имя и скобки, после них ничего не ставят.
          try: "Убери двоеточие в конце вызова: `start_signal()`."
          verify: Ошибка должна исчезнуть, а в «Примере» появятся восемь строк.
        - id: name-space
          when:
            errorType: SyntaxError
            codeRegex: '^def[ \t]+\w+[ \t]+\w+'
          why: >-
            В имени функции пробел. Python читает имя только до пробела и сразу за ним ждёт скобку,
            а видит второе слово — отсюда `expected '('`. Имя функции, как и имя переменной,
            пишется без пробелов: слова соединяют знаком `_`.
          try: "Замени пробел в имени подчёркиванием: `def start_signal():`."
          verify: Ошибка должна исчезнуть.
        - id: def-no-parens
          when:
            errorIncludes: "expected '('"
            codeRegex: '^def[ \t]+\w+[ \t]*:'
          why: >-
            `expected '('` — «ожидалась скобка». После имени функции в строке `def` нужны скобки,
            даже если внутри ничего нет.
          try: "Допиши пустые скобки перед двоеточием: `def start_signal():`."
          verify: Ошибка должна исчезнуть.
        - id: no-indent
          when:
            errorIncludes: expected an indented block after function definition
          why: >-
            `expected an indented block after function definition` — «после объявления функции
            ожидался блок с отступом». Python понимает, какие строки входят в тело, только по
            отступу, а у строк под `def` его нет.
          try: >-
            Сдвинь три строки сигнала на 4 пробела вправо. Заголовки забегов и вызовы оставь у
            левого края.
          verify: Ошибка должна исчезнуть.
        - id: before-def
          when:
            errorType: NameError
            codeRegex: '^[ \t]*start_signal[ \t]*\([\s\S]*^def[ \t]+start_signal\b'
          why: >-
            Вызов стоит выше, чем объявлена функция. Python выполняет программу сверху вниз: когда
            он доходит до вызова, строку с `def` он ещё не выполнил, и имени `start_signal` пока
            нет.
          try: Перенеси объявление функции вместе с телом в начало программы — выше первого забега.
          verify: Ошибка NameError должна исчезнуть.
        - id: self-call
          when:
            codeRegex: '^def[ \t]+start_signal[ \t]*\([ \t]*\)[ \t]*:[^\n]*\n(?:(?:[ \t][^\n]*)?\n)*?[ \t]+start_signal[ \t]*\('
          why: >-
            Строка `start_signal()` стоит с отступом и стала частью тела функции. Если снаружи есть
            ещё вызов, функция вызывает сама себя снова и снова, и вывод бежит, пока программу не
            остановят. Если отступ получила вся основная программа, функцию никто не вызывает, и
            экран пуст.
          try: >-
            Убери отступ у вызовов и заголовков забегов: они пишутся от левого края, после тела
            функции. С отступом остаются только три строки сигнала.
          verify: В «Примере» должны появиться ровно восемь строк.
        - id: title-inside
