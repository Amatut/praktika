      mistakes:
        - id: call-colon
          when:
            errorType: SyntaxError
            codeRegex: '^[ \t]*show_reminder[ \t]*\([ \t]*\)[ \t]*:'
          why: >-
            В конце вызова стоит двоеточие, но его место — в строке с `def`: там оно открывает
            тело функции. Строка вызова — это имя и скобки, после них ничего не ставят.
          try: "Убери двоеточие в конце вызова: `show_reminder()`."
          verify: Ошибка должна исчезнуть, а в «Примере» появятся 18 строк.
        - id: before-def
          when:
            errorType: NameError
            codeRegex: '^[ \t]*show_reminder[ \t]*\([\s\S]*^def[ \t]+show_reminder\b'
          why: >-
            Вызов стоит выше, чем объявлена функция. Python выполняет программу сверху вниз: когда
            он доходит до первого вызова, строку с `def` он ещё не выполнил, и имени
            `show_reminder` пока нет.
          try: Перенеси объявление функции вместе с телом в начало программы — выше первого этапа.
          verify: Ошибка NameError должна исчезнуть.
        - id: self-call
          when:
            codeRegex: '^def[ \t]+show_reminder[ \t]*\([ \t]*\)[ \t]*:[^\n]*\n(?:(?:[ \t][^\n]*)?\n)*?[ \t]+show_reminder[ \t]*\('
          why: >-
            Строка `show_reminder()` стоит с отступом и стала частью тела функции. Если снаружи
            есть ещё вызов, функция вызывает сама себя снова и снова, и памятка бежит по экрану,
            пока программу не остановят. Если отступ получила вся основная программа, функцию
            никто не вызывает, и экран пуст.
          try: >-
            Убери отступ у вызовов и заголовков этапов: они пишутся от левого края, после тела
            функции. С отступом остаются только пять строк памятки.
          verify: В «Примере» должны появиться ровно 18 строк.
        - id: title-inside
          when:
            failedTest: t2
            outputIncludes: "Этап 1: лесная тропа"
            codeRegex: '^[ \t]+print\("Этап'
          why: >-
            Заголовок этапа попал в тело функции. Но заголовки у этапов разные, а функция
            печатает одно и то же при каждом вызове — поэтому на всех этапах вышел один заголовок.
          try: >-
            В теле функции оставь только пять строк памятки: они одинаковы везде. Заголовки этапов
            печатай в основной программе, а вызов ставь сразу после каждого.
          verify: В «Примере» должны появиться три разных заголовка.
        - id: lost-line
          when:
            failedTest: t2
            codeIncludes: def show_reminder
