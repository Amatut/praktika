id: m5-l1
module: m5
number: "5.1"
title: "Функция: имя для набора действий"
objective: >-
  Объявлять функцию без параметров через def и вызывать её по имени со скобками, понимая, что тело
  выполняется только при вызове.
minutes: [20, 30]
prerequisites: [m4-l7]
skills: [functions]
environment: python

story:
  title: Памятка на три этапа
  fictional: true
  text: >-
    Руководитель турклуба «Азимут» Рустам перед каждым этапом похода выводит на планшет памятку:
    вода, фонарик, аптечка, сообщить маршрут. В его программе было три одинаковых блока `print` —
    по одному на этап. Когда в памятку добавили пункт «заряд телефона», Рустам вписал его в два
    блока из трёх, и перед подъёмом на перевал этого напоминания не оказалось. Тогда он записал
    памятку один раз — в функцию `show_reminder()` — и теперь на каждом этапе пишет одну строку
    вызова, а новый пункт добавляет в одном месте.

why: >-
  Если одни и те же действия нужны в нескольких местах программы, их записывают один раз и дают
  им имя. Например, `show_reminder()` печатает памятку перед каждым этапом похода, а исправлять
  её нужно только в одном месте.

usedIn: >-
  Почти любую большую программу разбивают на функции. `print`, `input` и `len` — тоже
  функции, их написали авторы Python. На сайте нажатие кнопки запускает функцию-обработчик, а в
  игре отдельные функции рисуют меню, двигают героя и считают очки.

steps:
  - id: idea
    type: theory
    title: "def: даём имя набору действий"
    body: |-
      В программе из истории одна и та же памятка записана трижды. Стоит поправить одну копию и
      забыть про другую — и копии уже разные. Выход — записать действия один раз и дать им имя.
      Набор действий с именем называется **функцией**.

      ```python
      def show_reminder():
          print("Перед выходом:")
          print("- вода и перекус")
      ```

      Как это читать:

      - `def` (от английского define — «определить») сообщает Python, что сейчас будет новая
        функция. «Определить» и «объявить» функцию — одно и то же, мы будем говорить «объявить»;
      - `show_reminder` — её **имя**, после него пустые скобки `()` и двоеточие;
      - строки с отступом в 4 пробела — **тело функции**, как блок у `if` и `for`.

      **Объявить — не значит выполнить.** Встретив `def`, Python только запоминает тело под этим
      именем и ничего не печатает. Чтобы тело выполнилось, функцию нужно **вызвать**: написать
      имя и скобки — `show_reminder()`, без двоеточия. Тогда Python «заходит» в тело, выполняет
      его строки сверху вниз и возвращается к строке после вызова. Вызывать функцию можно
      сколько угодно раз — тело каждый раз выполняется заново.

      Три правила:

      - **Скобки обязательны.** Имя без скобок только упоминает функцию: ничего не выполнится, и
        ошибки при этом не будет.
      - **Сначала `def`, потом вызов.** Python выполняет программу сверху вниз. Если вызов стоит
        выше `def`, имени ещё нет — будет знакомая по уроку 0.3 ошибка
        `NameError: name '…' is not defined`, «имя не определено».
      - **Вызов в основной программе пишут от левого края**, после тела. Строка с отступом сразу
        под телом станет его частью. Если так съедет вызов этой же функции, она будет вызывать
        сама себя снова и снова.

      Функция может вызывать другую. Такой вызов стоит внутри тела — с тем же отступом, что и
      остальные его строки:

      ```python
      def say_hello():
          print("Привет!")

      def meet():
          say_hello()
          print("Рад знакомству")

      meet()
      ```

      Последняя строка вызывает `meet()`, а та — `say_hello()`: на экране «Привет!» и «Рад
      знакомству». Порядок двух `def` между собой не важен. Даже если записать `meet` выше
      `say_hello`, строка `say_hello()` выполнится только при вызове `meet()` в последней строке,
      а к этому моменту Python уже запомнит обе функции.

      Имена функций пишут так же, как имена переменных: латиница, слова через `_`. Хорошее имя
      называет действие: `show_menu`, `print_line`.

      Ты уже пользовался чужими функциями: `print()`, `input()`, `len()`. Теперь пишешь свои.
    simpler: >-
      Функция — рецепт с названием. `def` записывает рецепт в книгу, но ничего не готовит.
      Приготовить — значит вызвать: написать имя и скобки, `show_reminder()`. Готовить по одному
      рецепту можно сколько угодно раз.
    coach: >-
      Если функция молчит, проверь три вещи: есть ли строка вызова, стоят ли в ней скобки и не
      съехала ли она с отступом внутрь тела.

  - id: reminder
    type: example
    title: Памятка для двух этапов
    body: >-
      Программа Рустама после исправления — пока для двух этапов. Нажми «Запустить» и сравни
      вывод с кодом: памятка записана один раз, а на экране появляется дважды.
    code: |-
      def show_reminder():
          print("Перед выходом:")
          print("- вода и перекус")
          print("- фонарик и аптечка")
          print("- сообщи руководителю маршрут")

      print("Этап 1: лесная тропа")
      show_reminder()
      print("Этап 2: переправа")
      show_reminder()
    notes:
      - line: 1
        text: >-
          Объявление: слово `def`, имя функции, скобки и двоеточие. Эта строка ничего не печатает.
      - line: 2
        text: >-
          Тело функции — строки 2–5 с отступом. Python запоминает их под именем `show_reminder`,
          но пока не выполняет.
      - line: 7
        text: >-
          Отсюда программа начинает действовать: это первая строка, которая что-то печатает.
      - line: 8
        text: >-
          Вызов: Python выполняет четыре `print` из тела и возвращается к строке 9.
      - line: 10
        text: >-
          Второй вызов печатает ту же памятку ещё раз, хотя записана она один раз.
    tryIt: >-
      Добавь в конец тела строку `print("- дождевик")` — с таким же отступом, как у
      остальных, — и запусти: новый пункт появится у обоих этапов. Потом допиши в конец
      программы `print("Этап 3: привал у озера")` и вызов памятки.
    coach: >-
      Проведи пальцем по выводу и по коду: после каждого заголовка этапа программа «ныряет» в
      тело функции и возвращается обратно.

  - id: when-runs
    type: predict
    title: Когда срабатывает тело
    prompt: Как думаешь, что выведет программа?
    code: |-
      print("Собираем рюкзак")

      def check_weather():
          print("Смотрим прогноз")

      print("Выходим из дома")
      check_weather()
    options:
      - |-
        Собираем рюкзак
        Смотрим прогноз
        Выходим из дома
      - |-
        Собираем рюкзак
        Выходим из дома
        Смотрим прогноз
      - |-
        Собираем рюкзак
        Смотрим прогноз
        Выходим из дома
        Смотрим прогноз
    answer: |-
      Собираем рюкзак
      Выходим из дома
      Смотрим прогноз
    explanation: >-
      Строка `def` только запоминает тело функции, поэтому на месте объявления ничего не
      печатается. «Смотрим прогноз» появляется там, где стоит вызов `check_weather()`, — в самом
      конце, после «Выходим из дома». Порядок вывода задают вызовы, а не место, где записан `def`.
    coach: >-
      Читая программу с функциями, иди по порядку выполнения: строку `def` с телом пропускай, а на
      вызове заходи в тело.

  - id: no-parens
    type: predict
    title: Забытые скобки
    prompt: >-
      В строке 5 после имени функции нет скобок. Как думаешь, что выведет программа?
    code: |-
      def check_weather():
          print("Смотрим прогноз")

      print("Выходим")
      check_weather
      print("Идём")
    options:
      - |-
        Выходим
        Смотрим прогноз
        Идём
      - |-
        Выходим
        Идём
      - Ошибка NameError
    answer: |-
      Выходим
      Идём
    explanation: >-
      Имя без скобок только упоминает функцию, но не вызывает её — тело не выполняется, и
      «Смотрим прогноз» не печатается. Ошибки тоже нет: функция с таким именем существует,
      Python просто «посмотрел» на неё и пошёл дальше. Чтобы тело выполнилось, нужна строка
      `check_weather()`.
    coach: Эта ошибка молчаливая — программа не падает. Ищи её глазами.

  - id: practice-signal
    type: exercise
    title: Практика 1
    exercise:
      id: m5-l1-e1
      kind: repeat
      title: Сигнал для забега
      statement: |-
        В «Азимуте» устраивают два забега, и перед каждым судья подаёт сигнал из трёх команд.
        Напиши функцию `start_signal()`, которая печатает сигнал:

        ```text
        На старт!
        Внимание!
        Марш!
        ```

        Затем вызови её после заголовка каждого забега. Вся программа выводит:

        ```text
        Забег 1
        На старт!
        Внимание!
        Марш!
        Забег 2
        На старт!
        Внимание!
        Марш!
        ```
      output: "Восемь строк: заголовок забега и три строки сигнала — и так два раза."
      constraints:
        - "Функция называется `start_signal`, скобки после имени пустые."
        - Строки сигнала записаны в программе один раз — в теле функции.
      starterCode: |
        # Объяви функцию start_signal здесь — выше забегов


        print("Забег 1")
        # здесь прозвучит сигнал
        print("Забег 2")
        # здесь прозвучит сигнал
      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: |-
            Забег 1
            На старт!
            Внимание!
            Марш!
            Забег 2
            На старт!
            Внимание!
            Марш!
        - id: t2
          kind: assert
          title: Функция start_signal
          example: true
          code: |-
            import contextlib
            import io

            def _printed(function):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    function()
                return "\n".join(line.rstrip() for line in buffer.getvalue().split("\n"))

            assert _printed(start_signal) == "На старт!\nВнимание!\nМарш!\n"
          message: >-
            Функция `start_signal()` при вызове печатает три строки сигнала: «На старт!»,
            «Внимание!», «Марш!».
      rules:
        - id: r-func
          use: [FunctionDef, "call:start_signal"]
          max: { "call:print": 5 }
          message: >-
            Сигнал печатай через функцию start_signal: три строки сигнала записаны один раз в её
            теле, а после каждого заголовка забега стоит вызов.
      criteria:
        - "Функция `start_signal` объявлена через `def` выше первого вызова."
        - В теле функции три строки сигнала, и больше нигде в программе их нет.
        - После каждого заголовка забега стоит вызов функции со скобками.
      hints:
        - >-
          Здесь два шага: один раз записать сигнал под именем и дважды его запустить. Где в
          заготовке место для первого шага, а где — для второго? Посмотри, как в примере «Памятка
          для двух этапов» запускалась памятка.
        - |-
          Тот же приём на другом примере:
          ```python
          def beep():
              print("Бип!")

          beep()
          beep()
          ```
          «Бип!» напечатается дважды: функция объявлена один раз, а вызвана два раза.
        - |-
          Каркас:
          ```text
          def start_signal():
              print(...)    # На старт!
              print(...)    # Внимание!
              print(...)    # Марш!

          print("Забег 1")
          вызов функции — имя и скобки
          print("Забег 2")
          вызов функции — имя и скобки
          ```
      solution:
        code: |
          def start_signal():
              print("На старт!")
              print("Внимание!")
              print("Марш!")


          print("Забег 1")
          start_signal()
          print("Забег 2")
          start_signal()
        explanation: >-
          Строки с `def` и телом ничего не печатают: Python только запоминает три `print` под
          именем `start_signal`. Печатать программа начинает с `print("Забег 1")`. Каждый вызов
          `start_signal()` выполняет тело — три строки сигнала — и возвращается к следующей строке.
          Можно перебрать забеги и циклом `for`: в его теле печатать заголовок и вызывать функцию.
      wrongSolutions:
        - code: |
            def start_signal()
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            start_signal()
            print("Забег 2")
            start_signal()
          note: Нет двоеточия в строке def.
          expectMistake: no-colon
        - code: |
            def start_signal:
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            start_signal()
            print("Забег 2")
            start_signal()
          note: Нет скобок после имени в строке def.
          expectMistake: def-no-parens
        - code: |
            def start_signal():
            print("На старт!")
            print("Внимание!")
            print("Марш!")


            print("Забег 1")
            start_signal()
            print("Забег 2")
            start_signal()
          note: У тела функции нет отступа.
          expectMistake: no-indent
        - code: |
            print("Забег 1")
            start_signal()
            print("Забег 2")
            start_signal()


            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")
          note: Функция объявлена ниже вызовов.
          expectMistake: before-def
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")
                start_signal()


            print("Забег 1")
            start_signal()
            print("Забег 2")
            start_signal()
          note: Вызов с отступом попал в тело — функция вызывает сама себя.
          expectMistake: self-call
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")

                print("Забег 1")
                start_signal()
                print("Забег 2")
                start_signal()
          note: Вся основная программа с отступом оказалась внутри тела функции.
          expectMistake: self-call
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            start_signal
            print("Забег 2")
            start_signal
          note: Имя функции без скобок.
          expectMistake: no-parens
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            # здесь прозвучит сигнал
            print("Забег 2")
            # здесь прозвучит сигнал
          note: Функция объявлена, но не вызвана.
          expectMistake: not-called
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            start_signal()
            print("Забег 2")
            print("На старт!")
            print("Внимание!")
            print("Марш!")
          note: Второй сигнал — копия строк вместо вызова.
          expectMistake: copies
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            print(start_signal())
            print("Забег 2")
            print(start_signal())
          note: Вызов обёрнут в print — печатается лишний None.
          expectMistake: print-call
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            print("Забег 2")
            start_signal()
          note: Функция вызвана один раз — после второго заголовка.
          expectMistake: null
        - code: |
            def signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            signal()
            print("Забег 2")
            signal()
          note: Функция названа не так, как в условии.
          expectMistake: null
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            start_signal():
            print("Забег 2")
            start_signal():
          note: Строка вызова переписана со строки def — с двоеточием в конце.
          expectMistake: call-colon
        - code: |
            def start signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            start_signal()
            print("Забег 2")
            start_signal()
          note: В имени функции в строке def пробел вместо подчёркивания.
          expectMistake: name-space
        - code: |
            def start_signal():
                print("Забег 1")
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            start_signal()
            start_signal()
          note: Заголовок забега попал в тело функции, функция вызвана дважды.
          expectMistake: title-inside
        - code: |
            def start_signal():
                # сигнал для двух забегов
                number = 1
                while number <= 2:
                    print("Забег", number)
                    # сигнал
                    print("На старт!")
                    print("Внимание!")
                    print("Марш!")
                    number = number + 1


            start_signal()
          note: >-
            Функция сама печатает оба забега циклом и вызвана один раз (это решение раньше
            вызывало долгий перебор в регулярном выражении self-call).
          expectMistake: title-inside
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1", start_signal())
            print("Забег 2", start_signal())
          note: Вызов стоит в print вместе с заголовком — печатается None.
          expectMistake: print-call
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            print("Забег 1")
            print(start_signal)
            print("Забег 2")
            print(start_signal)
          note: В print имя функции без скобок — печатается <function start_signal …>.
          expectMistake: print-name
        - code: |
            def start_signal():
                print("На старт!")
                print("Внимание!")
                print("Марш!")


            for number in range(1, 3)
                print(f"Забег {number}")
                start_signal()
          note: >-
            Нет двоеточия в строке for, строка def верная — разбор no-colon не должен срабатывать,
            общий разбор называет строку с for.
          expectMistake: null
        - code: |
            def start_signal():
                print("На старт!")
