      mistakes:
        - id: call-colon
          when:
            errorType: SyntaxError
            codeRegex: '^[ \t]*print_(border|card)[ \t]*\([ \t]*\)[ \t]*:'
          why: >-
            В конце вызова стоит двоеточие, но его место — в строке с `def`: там оно открывает
            тело функции. Строка вызова — это имя и скобки, после них ничего не ставят.
          try: "Убери двоеточие в конце вызова: `print_border()` или `print_card()`."
          verify: Ошибка должна исчезнуть, а в «Примере» появятся пять строк карточки.
        - id: call-too-early
          when:
            errorType: NameError
            codeRegex: '^print_card[ \t]*\([\s\S]*^def[ \t]+print_(border|card)\b'
          why: >-
            Строка `print_card()` стоит выше, чем объявлена одна из функций. Когда Python
            выполняет этот вызов, он должен уже знать обе: и `print_card`, и `print_border`,
            которую она вызывает внутри.
          try: >-
            Перенеси вызов `print_card()` в самый конец программы, под оба `def`. Порядок самих
            `def` между собой не важен.
          verify: Ошибка NameError должна исчезнуть.
        - id: nested-def
          when:
            codeRegex: '^[ \t]+def[ \t]+print_(border|card)\b'
          why: >-
            Строка `def` одной из функций стоит с отступом, поэтому Python считает её частью тела
            другой функции. Такую функцию не найти ни из основной программы, ни из проверки: каждая
            функция должна быть объявлена сама по себе.
          try: >-
            Сдвинь строку `def` вместе с телом этой функции на 4 пробела влево: каждый `def`
            пишется от левого края.
          verify: Проверки «Функция print_border» и «Функция print_card» должны пройти.
        - id: self-call
          when:
            codeRegex: '^def[ \t]+(print_border|print_card)[ \t]*\([ \t]*\)[ \t]*:[^\n]*\n(?:(?:[ \t][^\n]*)?\n)*?[ \t]+\1[ \t]*\('
          why: >-
            Вызов функции стоит с отступом под её же телом и стал частью этого тела. Если
            основная программа больше ничего не вызывает, на экране пусто. А если снаружи есть ещё
            вызов, функция вызывает сама себя снова и снова, пока программу не остановят.
          try: >-
            Убери этот вызов из тела функции. Если это итоговый вызов `print_card()`, сдвинь его к
            левому краю, под оба `def`. А `print_border()` вызывается только из тела `print_card`.
          verify: В «Примере» должны появиться пять строк карточки.
        - id: no-parens
          when:
            codeRegex: '^[ \t]*print_(border|card)[ \t]*(#.*)?$'
          why: >-
            В строке стоит только имя функции, без скобок. Такое имя лишь упоминает функцию, а тело
            не выполняется, — и ошибки при этом нет, поэтому карточка или её часть просто не
            печатается.
          try: "Допиши скобки: `print_border()` или `print_card()`."
          verify: В «Примере» должны появиться все пять строк.
        - id: print-call
          when:
            outputIncludes: None
            codeRegex: 'print\([^\n]*\bprint_(border|card)\s*\('
          why: >-
            На экране появилось слово None. Функция сама печатает свои строки, а `print(...)`
            вокруг вызова печатает ещё и то, что функция отдала обратно. Наши функции ничего не
            отдают, и это «ничего» выглядит как `None` — то же особое значение, что у `get` в
            уроке 4.4.
          try: "Вызывай функции отдельной строкой, без `print`: `print_border()`, `print_card()`."
          verify: В «Примере» не должно остаться строк с None.
        - id: print-name
          when:
            outputIncludes: "<function"
            codeRegex: 'print\([^\n]*\bprint_(border|card)\s*\)'
          why: >-
            Внутри `print` стоит имя функции без скобок. Python не выполняет функцию, а печатает,
            что это за объект: `<function … at 0x…>`. Линии или карточки в этой записи нет.
          try: "Вызывай функции отдельной строкой, без `print`: `print_border()`, `print_card()`."
          verify: В «Примере» должны появиться пять строк карточки — без `<function …>`.
        - id: not-called
          when:
            outputEquals: ""
            codeIncludes: def print_card
          why: >-
            Функции объявлены, но основная программа ни одну из них не вызывает. `def` только
            запоминает тело, поэтому на экране пусто. Если строка вызова у тебя есть, проверь её
            отступ: с отступом она стала частью тела функции.
          try: В самом конце программы, от левого края, вызови карточку — имя функции и скобки.
          verify: В «Примере» должны появиться пять строк карточки.
        - id: wrong-length
          when:
            failedTest: t2
            codeIncludes: def print_border
            outputIncludes: Маршрут
          why: >-
            Функция `print_border` печатает не ту линию или не печатает ничего: нужна одна строка
            ровно из 30 знаков `~`, без пробелов. Набирая знаки вручную, легко сбиться со счёта.
          try: 'Пусть Python повторит знак сам: `print("~" * 30)`.'
          verify: "Проверка «Функция print_border» должна пройти."
        - id: border-outside
          when:
            failedTest: t3
            codeIncludes: def print_card
            codeRegex: '^print_border[ \t]*\('
          why: >-
            Линии печатает основная программа, а `print_card()` печатает карточку без рамки. На
            экране всё выглядит верно, но функция карточки неполная: вызови её в другом месте —
            и линий не будет.
          try: >-
            Перенеси оба вызова `print_border()` в тело `print_card` — первой и последней строкой.
            В основной программе останется только `print_card()`.
          verify: "Проверка «Функция print_card» должна пройти."
        - id: literal-border
          when:
            failedRule: r-border
            codeRegex: 'print\(\s*["'']~[\s\S]*print\(\s*["'']~'
          why: >-
            Линия в карточке напечатана копией, а не вызовом `print_border()`. Сейчас вывод
            верный, но если длина рамки изменится, исправлять придётся в нескольких местах.
          try: Замени каждую линию в теле `print_card` вызовом `print_border()`.
          verify: "Требование «Линии в карточке печатай вызовом print_border()» должно отметиться как выполненное."
        - id: card-copied
          when:
            failedRule: r-card
            codeRegex: 'Озеро Светлое[\s\S]*Озеро Светлое'
          why: >-
            Строки карточки напечатаны прямо в основной программе, а `print_card` для этого не
            используется. Вывод совпал, но функция карточки осталась лишней — и в программе
            появились копии.
          try: >-
            Удали из основной программы строки карточки и оставь одну строку — вызов
            `print_card()`.
          verify: "Требование «Строки карточки печатает функция print_card» должно отметиться как выполненное."
      afterPass: >-
        Одна функция вызывает другую, а длину рамки можно поменять в одном месте. Но карточка
        всегда про одно и то же озеро. Как печатать карточки разных маршрутов одной функцией,
        узнаешь в следующем уроке.
      skills: [functions, strings-basics]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`def имя():` запоминает тело функции, но не выполняет его."
      - "Тело выполняется при вызове `имя()`. Без скобок ничего не произойдёт — и ошибки не будет."
      - >-
        Функция должна быть объявлена раньше, чем выполнится её вызов. Одна функция может вызывать
        другую — порядок их `def` тогда не важен.
      - Одинаковый код в нескольких местах — повод сделать функцию, чтобы исправлять его в одном месте.
    question: >-
      Ты объявил функцию, запустил программу, а на экране пусто. Что проверишь первым делом?
    answer: >-
      Три вещи. Есть ли вообще строка вызова: `def` только запоминает тело, само по себе оно не
      выполняется. Стоят ли в вызове скобки: имя без скобок ничего не запускает. И написан ли
      вызов в основной программе от левого края: с отступом он попал внутрь тела функции.
