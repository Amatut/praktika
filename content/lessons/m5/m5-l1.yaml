            Заголовок забега попал в тело функции. Но `start_signal()` должна печатать только
            сигнал — три строки, одинаковые для всех забегов. Заголовки у забегов разные, их
            печатает основная программа.
          try: >-
            В теле функции оставь только три строки сигнала. Заголовки забегов печатай в основной
            программе, а вызов ставь сразу после каждого.
          verify: "Проверка «Функция start_signal» должна пройти."
        - id: no-parens
          when:
            codeRegex: '^[ \t]*start_signal[ \t]*(#.*)?$'
          why: >-
            В строке стоит только имя функции, без скобок. Такое имя лишь упоминает функцию, а тело
            не выполняется, — и ошибки при этом нет, поэтому сигнал просто не печатается.
          try: "Допиши скобки: `start_signal()`."
          verify: После каждого заголовка забега в «Примере» появятся три строки сигнала.
        - id: not-called
          when:
            outputEquals: |-
              Забег 1
              Забег 2
            codeIncludes: def start_signal
          why: >-
            Функция объявлена, но нигде не вызвана. `def` только запоминает тело — само по себе
            оно не выполняется, поэтому на экране одни заголовки.
          try: >-
            Замени каждый комментарий «здесь прозвучит сигнал» строкой вызова: имя функции и
            скобки, от левого края.
          verify: После каждого заголовка забега в «Примере» появятся три строки сигнала.
        - id: print-call
          when:
            outputIncludes: None
            codeRegex: 'print\([^\n]*\bstart_signal\s*\('
          why: >-
            На экране появилось слово None. Функция сама печатает сигнал, а `print(...)` вокруг
            вызова печатает ещё и то, что функция отдала обратно. Наша функция ничего не отдаёт, и
            это «ничего» выглядит как `None` — то же особое значение, что у `get` в уроке 4.4.
          try: "Вызывай функцию отдельной строкой, без `print`: `start_signal()`."
          verify: В «Примере» не должно остаться строк с None.
        - id: print-name
          when:
            outputIncludes: "<function"
            codeRegex: 'print\([^\n]*\bstart_signal\s*\)'
          why: >-
            Внутри `print` стоит имя функции без скобок. Python не выполняет функцию, а печатает,
            что это за объект: `<function start_signal at 0x…>`. Сигнала в этой записи нет.
          try: "Вызывай функцию отдельной строкой, без `print`: `start_signal()`."
          verify: В «Примере» должны появиться восемь строк — без `<function …>`.
        - id: copies
          when:
            codeRegex: '["'']Марш!["''][\s\S]*["'']Марш!["'']'
          why: >-
            Строки сигнала записаны в программе больше одного раза. Вывод верный, но это те же
            копии, что подвели Рустама: если сигнал поменяется, править придётся в каждой.
          try: >-
            Оставь три строки сигнала только в теле `start_signal`, а на месте копии напиши вызов
            функции.
          verify: "Требование «Сигнал печатай через функцию start_signal» должно отметиться как выполненное."
      afterPass: >-
        Сигнал записан один раз, а звучит дважды. Чтобы добавить «Забег 3», хватит двух строк:
        заголовка и вызова.
