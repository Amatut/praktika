  - id: practice-card
    type: exercise
    title: Практика 3
    exercise:
      id: m5-l1-e3
      kind: write
      title: Карточка маршрута
      statement: |-
        Для стенда клуба нужна карточка маршрута в рамке из волнистых линий:

        ```text
        ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        Маршрут: Озеро Светлое
        Длина: 12 км
        Сложность: средняя
        ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        ```

        Напиши две функции:

        - `print_border()` печатает линию из 30 знаков `~`;
        - `print_card()` печатает карточку целиком: линию, три строки о маршруте и снова линию.
          Линии она печатает, вызывая `print_border()`.

        В конце программы вызови `print_card()` один раз.
      output: "Пять строк: линия, три строки о маршруте, линия."
      constraints:
        - "Линия — ровно 30 знаков `~`, без пробелов."
        - "Обе линии карточки печатает вызов `print_border()`."
        - "Основная программа только вызывает `print_card()`."
      starterCode: |
        # Функция print_border: линия из 30 знаков ~


        # Функция print_card: линия, три строки о маршруте, линия


        # Напечатай карточку
      tests:
        - id: t1
          kind: io
          title: Пример
          example: true
          expected: |-
            ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
            Маршрут: Озеро Светлое
            Длина: 12 км
            Сложность: средняя
            ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
        - id: t2
          kind: assert
          title: Функция print_border
          example: true
          code: |-
            import contextlib
            import io

            def _printed(function):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    function()
                return "\n".join(line.rstrip() for line in buffer.getvalue().split("\n"))

            assert _printed(print_border) == "~" * 30 + "\n"
          message: "Функция `print_border()` печатает одну строку — ровно 30 знаков `~`."
        - id: t3
          kind: assert
          title: Функция print_card
          code: |-
            import contextlib
            import io

            def _printed(function):
                buffer = io.StringIO()
                with contextlib.redirect_stdout(buffer):
                    function()
                return "\n".join(line.rstrip() for line in buffer.getvalue().split("\n"))

            _border = "~" * 30 + "\n"
            assert _printed(print_card) == (
                _border
                + "Маршрут: Озеро Светлое\n"
                + "Длина: 12 км\n"
                + "Сложность: средняя\n"
                + _border
            )
          message: >-
            Функция `print_card()` печатает всю карточку — пять строк: линию, три строки о маршруте
            и снова линию.
      rules:
        - id: r-border
          min: { "call:print_border": 2 }
          message: >-
            Линии в карточке печатай вызовом print_border() — так длину линии можно будет
            поменять в одном месте.
        - id: r-card
          use: ["call:print_card"]
          max: { "call:print": 5 }
          message: >-
            Строки карточки печатает функция print_card, а основная программа только вызывает её:
            print_card().
      criteria:
        - "`print_border()` печатает одну линию из 30 знаков `~`."
        - "`print_card()` печатает карточку и для обеих линий вызывает `print_border()`."
        - "Основная программа — один вызов `print_card()` после объявлений функций."
      hints:
        - >-
          Здесь две функции, и одна пользуется другой. Какая из них печатает маленькую деталь, а
          какая — всю карточку? Деталь внутри карточки печатай вызовом, а не копией. И подумай,
          какая строка основной программы запустит всю печать.
        - |-
          Функция вызывает функцию — на другом примере:
          ```python
          def line():
              print("-" * 10)

          def header():
              line()
              print("Отчёт")
              line()

          header()
          ```
          Здесь `header()` печатает три строки, а две из них — через `line()`.
        - |-
          Каркас:
          ```text
          def print_border():
              печать 30 знаков ~ (строку можно повторить через *)

          def print_card():
              вызов линии
              три print со строками о маршруте
              вызов линии

          вызов карточки
          ```
      solution:
