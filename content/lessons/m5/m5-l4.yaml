        - если корзину не передали — каждый раз создаётся новая, пустая;
        - если корзину передали — товар добавляется в неё саму, и функция возвращает эту корзину.
          Пустая корзина, которую передали, — тоже переданная корзина.

        Вызовы в программе не меняй. Вывод должен быть таким:

        ```text
        Анна: ['хлеб']
        Борис: ['молоко']
        ```
      input: Ввода нет — товары передаются в вызовах функции.
      output: Две строки — корзина Анны и корзина Бориса, у каждого только свой товар.
      constraints:
        - Вызовы `add_to_basket` в программе не меняй — исправлять нужно функцию.
        - Корзину, которую передали в функцию, не заменяй копией — товар добавляется в неё.
      starterCode: |
        def add_to_basket(item, basket=[]):
            basket.append(item)
            return basket

        anna = add_to_basket("хлеб")
        boris = add_to_basket("молоко")
        print(f"Анна: {anna}")
        print(f"Борис: {boris}")
      tests:
        - id: t1
          kind: io
          title: Корзины Анны и Бориса
          example: true
          expected: |-
            Анна: ['хлеб']
            Борис: ['молоко']
          compare:
            ignoreSpaces: true
        - id: t2
          kind: assert
          title: Корзины разных покупателей не смешиваются
