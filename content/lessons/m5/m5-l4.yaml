id: m5-l4
module: m5
number: "5.4"
title: "Область видимости: где живут переменные"
objective: >-
  Объяснять, чем локальная переменная отличается от глобальной, передавать данные в функцию
  через параметры, а обратно — через return, не трогая из функции переменные основной программы;
  понимать, что список передаётся в функцию тем же самым, а не копией, и не ставить список
  значением по умолчанию.
minutes: [25, 30]
prerequisites: [m5-l3]
skills: [scope]
environment: python

story:
  title: Табло, которое не считает
  fictional: true
  text: >-
    Никита ведёт школьную викторину и написал программу-табло: функция `add_points` должна
    прибавлять очки команде. Первая версия падала с непонятной ошибкой UnboundLocalError, а во
    второй, «исправленной», табло после каждого верного ответа по-прежнему показывало ноль.
    Оказалось, у функции свои, внутренние переменные: они появляются при вызове и исчезают, когда
    функция заканчивает работу. Никита переделал функцию: теперь она получает текущий счёт и
    возвращает новый — и одна функция считает очки обеих команд.

why: >-
  Переменные внутри функции — её черновик: они не видны снаружи и не портят остальную программу.
  Данные передают в функцию параметрами, а результат забирают через `return`:
  `score = add_points(score, 10)`.

usedIn: >-
  В больших программах тысячи функций, и в каждой может быть своя переменная `total` или
  `count` — они не мешают друг другу. Функции, которые ничего не меняют снаружи, легко проверять
  тестами (им посвящён модуль 9) и использовать повторно в других программах.

steps:
  - id: local
    type: theory
    title: У функции свой черновик
    body: |-
      Переменные бывают двух видов — смотря где их создали.

      **Локальная переменная** создаётся внутри функции. Она существует только во время вызова:
      функция закончила работу — её переменные исчезли. Параметры — тоже локальные переменные:
      они получают значения при вызове и пропадают вместе с ним. Попробуешь прочитать такую
      переменную снаружи — получишь знакомую NameError.

      **Глобальная переменная** создана в основной программе, вне функций. Функция может её
      прочитать, но тогда она тайно зависит от чужих данных: по вызову не видно, откуда берётся
      результат. Исключение — **константы**: значения, которые не меняются, пока программа
      работает. Их имена пишут ЗАГЛАВНЫМИ буквами, например `PRICE = 200`, и читать их в функциях
      можно. Это договорённость: Python сам не запретит поменять `PRICE`.

      **Область видимости** — часть программы, где известно имя. У каждого вызова функции своя
      область, и в ней может быть своя `count`, никак не связанная с `count` снаружи. Отсюда два
      правила:

      - **Присваивание внутри функции создаёт локальную переменную**, даже если снаружи есть
        одноимённая. `count = 1` внутри функции внешнюю `count` не меняет.
      - **Прочитать локальную переменную до присваивания нельзя.** Python заранее просматривает
        всю функцию: раз `score` где-то в ней получает значение, это имя локальное во всей
        функции. Поэтому `score = score + 10` падает с ошибкой:

      ```text
      UnboundLocalError: cannot access local variable 'score' where it is not associated with a value
      ```

      По-русски: «нельзя обратиться к локальной переменной score — у неё ещё нет значения». То же
      будет с `score += 10`: это тоже присваивание.

      Можно написать в начале функции `global score` — тогда функция будет менять внешнюю
      переменную. Но такая функция тайком меняет чужие данные и годится только для одной
      переменной, поэтому в курсе так не делаем.

      Правильная схема — вход и выход: данные приходят в параметрах, результат уходит через
      `return`, а снаружи его присваивают: `savings = deposit(savings, 50)`.
    simpler: >-
      Функция работает в своей комнате. Всё, что она пишет на своей доске, стирается, когда она
      выходит, — снаружи этих записей никто не видит. И чужую доску в коридоре она не
      переписывает: пишет на своей, даже если запись на ней называется так же. Хочешь что-то
      получить от функции — пусть отдаст через `return`, а ты сохрани результат в переменную.
    coach: Вошло через параметр — вышло через `return`.

  - id: piggy-bank
    type: example
    title: Копилка
    body: >-
      Функция `deposit` кладёт деньги в копилку. `print` внутри функции — отладочный: через него
      видно, что происходит во время вызова. Когда программа готова, такой `print` убирают. Нажми
      «Запустить» и сравни две строки, которые печатаются снаружи.
    code: |-
      def deposit(balance, amount):
          balance = balance + amount
          print("внутри:", balance)
          return balance

      savings = 100
      deposit(savings, 50)
      print("без присваивания:", savings)
      savings = deposit(savings, 50)
      print("с присваиванием:", savings)
    notes:
      - line: 2
        text: >-
          `balance` — параметр, то есть локальная переменная. Меняется только она, а `savings`
          снаружи остаётся прежней. Ошибки UnboundLocalError здесь нет: параметр получил значение
          при вызове. А `score` в теории параметром не была — поэтому `score = score + 10` и
          падала.
      - line: 3
        text: Отладочный `print` заглядывает внутрь вызова — там 150.
      - line: 4
        text: "`return` отдаёт новое значение туда, где функцию вызвали."
      - line: 7
        text: Результат вызова никуда не сохранён и пропадает. `savings` по-прежнему 100.
      - line: 9
        text: Результат сохранён в `savings` — теперь и снаружи 150.
    tryIt: >-
      Убери строку `return balance` и запусти: последняя строка покажет `None` — функция ничего
      не вернула. Потом верни `return` и допиши в конце `print(balance)`: получишь NameError —
      снаружи переменной `balance` нет.
    coach: Передал — получил — сохранил. На этой схеме держится весь урок.

  - id: inside-outside
    type: predict
    title: Внутри и снаружи
    prompt: >-
      Внутри функции переменной `score` присваивают значение параметра. Как думаешь, что выведет
      программа?
    code: |-
      score = 0

      def add_points(points):
          score = points
          print("внутри:", score)

      add_points(10)
      print("снаружи:", score)
    options:
      - |-
        внутри: 10
        снаружи: 10
      - |-
        внутри: 10
        снаружи: 0
      - Ошибка UnboundLocalError
    answer: |-
      внутри: 10
      снаружи: 0
    explanation: >-
      Присваивание `score = points` создало внутри функции свою, локальную `score` — её и
      напечатал первый `print`. Внешняя `score` осталась нулём. Ошибки нет: локальную `score` не
      читали до присваивания. Если бы в функции было `score = score + points`, Python попытался бы
      прочитать локальную `score` раньше, чем она получила значение, — вот тогда появилась бы
      UnboundLocalError.
    coach: Одинаковые имена внутри и снаружи функции — это две разные переменные.

  - id: practice-greeting
    type: exercise
    title: Практика 1
    exercise:
      id: m5-l4-e1
      kind: fix
      title: Приветствие потерялось
      statement: |-
        Клуб настольных игр встречает новичков приветствием. Функция `make_greeting(name)`
        собирает текст, но программа падает с NameError. Исправь программу: пусть функция
        **возвращает** приветствие, а основная программа сохранит результат вызова и напечатает
        его.

        Вывод программы:

        ```text
        Привет, Оля! Рады видеть тебя в клубе.
        ```
      input: Ввода нет — имя передаётся в вызове функции.
      output: >-
        Функция `make_greeting(name)` возвращает строку-приветствие, программа печатает
        приветствие для Оли.
      constraints:
        - Не используй `global`.
        - Функция только собирает и возвращает текст, печатает основная программа.
      starterCode: |
        def make_greeting(name):
            greeting = f"Привет, {name}! Рады видеть тебя в клубе."

        make_greeting("Оля")
        print(greeting)
      tests:
        - id: c1
          kind: call
          title: Приветствие для Оли
          example: true
          call: make_greeting("Оля")
          expected: "'Привет, Оля! Рады видеть тебя в клубе.'"
        - id: t1
          kind: io
          title: Вывод программы
          example: true
          expected: Привет, Оля! Рады видеть тебя в клубе.
        - id: c2
          kind: call
          title: Другое имя
          call: make_greeting("Макс")
          expected: "'Привет, Макс! Рады видеть тебя в клубе.'"
        - id: c3
          kind: call
          title: "Граничный случай: имя из двух слов"
          edge: true
          call: make_greeting("Анна Мария")
          expected: "'Привет, Анна Мария! Рады видеть тебя в клубе.'"
        - id: t2
          kind: assert
          title: Функция только возвращает приветствие
          code: |-
            import contextlib, io
            screen = io.StringIO()
            with contextlib.redirect_stdout(screen):
                make_greeting("Макс")
            assert screen.getvalue() == ""
          message: >-
            Функция только собирает и возвращает приветствие, а печатает его основная программа:
            сам вызов `make_greeting("Макс")` ничего не выводит на экран.
      rules:
        - id: r-no-global
          avoid: [Global]
          message: >-
            Не используй `global`: пусть функция вернёт приветствие через `return`, а программа
            сохранит результат вызова.
        - id: r-print-result
          dependsOn:
            print: [make_greeting]
          message: >-
            Напечатай то, что вернула `make_greeting`, — результат вызова, а не готовый текст.
      criteria:
        - "Функция возвращает приветствие, например `make_greeting(\"Оля\")` → `'Привет, Оля! Рады видеть тебя в клубе.'`"
        - Функция сама ничего не печатает.
        - Программа сохраняет результат вызова (или сразу передаёт его в `print`) и печатает приветствие.
        - В коде нет `global`.
      hints:
        - >-
          Где создаётся `greeting` и где её пытаются напечатать? Вспомни, что происходит с
          переменными функции, когда вызов закончился, — и каким способом значение может выйти
          из функции наружу.
        - |-
          Тот же приём на другом примере:
          ```python
          def square(x):
              result = x * x
              return result

          s = square(4)
          print(s)
          ```
          `result` живёт только внутри `square`, а наружу уходит её значение — и сохраняется в `s`.
        - |-
          Каркас:
          ```text
          def make_greeting(name):
              greeting = ...
              ... greeting          # отдай значение наружу

          ... = make_greeting("Оля")   # сохрани то, что вернула функция
          print(...)
          ```
      solution:
        code: |
          def make_greeting(name):
              greeting = f"Привет, {name}! Рады видеть тебя в клубе."
              return greeting

          greeting = make_greeting("Оля")
          print(greeting)
        explanation: >-
          `greeting` внутри функции — локальная переменная: она исчезает, когда вызов
          заканчивается. `return greeting` отдаёт её значение наружу, а
          `greeting = make_greeting("Оля")` сохраняет его в новой переменной — уже глобальной. Это
          две разные переменные, и имя снаружи может быть любым: важно сохранить результат вызова.
          Можно и короче: `print(make_greeting("Оля"))`.
      altSolutions:
        - code: |
            def make_greeting(name):
                return f"Привет, {name}! Рады видеть тебя в клубе."

            print(make_greeting("Оля"))
          note: Функция сразу возвращает f-строку, результат вызова сразу печатается.
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                return greeting

            message = make_greeting("Оля")
            print(message)
          note: Снаружи результат сохранён под другим именем.
        - code: |
            def make_greeting(name):
                text = "Привет, " + name + "! Рады видеть тебя в клубе."
                return text

            text = make_greeting("Оля")
            print(text)
          note: Строка собрана склейкой, а не f-строкой.
        - code: |
            CLUB_TEXT = "Рады видеть тебя в клубе."

            def make_greeting(guest):
                hello = f"Привет, {guest}!"
                return f"{hello} {CLUB_TEXT}"

            print(make_greeting("Оля"))
          note: Функция читает константу (это можно), параметр назван guest.
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                return greeting

            make_greeting("Оля")
            greeting = make_greeting("Оля")
            print(greeting)
          note: «Голый» вызов из стартового кода остался — он лишний, но не мешает; результат второго вызова сохранён.
      wrongSolutions:
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."

            make_greeting("Оля")
            print(greeting)
          note: Ничего не исправлено — greeting есть только внутри функции.
          expectMistake: local-outside
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                return greeting

            make_greeting("Оля")
            print(greeting)
          note: return добавлен, но результат вызова не сохранён.
          expectMistake: not-saved
        - code: |
            def make_greeting(name):
                global greeting
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."

            make_greeting("Оля")
            print(greeting)
          note: Вместо return — global.
          expectMistake: global
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."

            greeting = make_greeting("Оля")
            print(greeting)
          note: Результат сохранён, но функция ничего не возвращает — печатается None.
          expectMistake: no-return
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                return greeting

            print(make_greeting)
          note: Функция напечатана без вызова.
          expectMistake: function-object
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                print(greeting)

            make_greeting("Оля")
          note: Функция печатает вместо return — вывод верный, но проверка вызова получает None (общий разбор движка).
          expectMistake: null
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                return greeting

            result = make_greeting("Оля")
            print(greeting)
          note: Результат сохранён под другим именем, а печатается greeting (как s в подсказке 2).
          expectMistake: other-name
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                return greeting

            greeting = make_greeting(name)
            print(greeting)
          note: В вызов передано имя параметра — снаружи его нет.
          expectMistake: param-outside
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                print(greeting)
                return greeting

            make_greeting("Оля")
          note: Функция и печатает, и возвращает, результат вызова не используется — вывод верный, но печатает функция.
          expectMistake: prints-inside
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                print(greeting)
                return greeting

            greeting = make_greeting("Оля")
            print(greeting)
          note: print остался и в функции, и снаружи — приветствие дважды.
          expectMistake: prints-inside
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                return greeting

            make_greeting("Оля")
            print("Привет, Оля! Рады видеть тебя в клубе.")
          note: Функция верная, вызов «голый», а приветствие напечатано готовым текстом.
          expectMistake: hardcoded-text
        - code: |
            def make_greeting(name):
                greeting = f"Привет, {name}! Рады видеть тебя в клубе."
                print(greeting)

            greeting = make_greeting("Оля")
            print(greeting)
          note: print вместо return, результат сохранён и напечатан — на экране приветствие и None (общий разбор движка точный).
          expectMistake: null
      mistakes:
        - id: global
          when:
            failedRule: r-no-global
          why: >-
            `global` заставляет функцию менять переменную снаружи: функция тайком распоряжается
            данными остальной программы. Нужно другое — чтобы функция отдавала приветствие через
            `return`, а программа сама решала, куда его положить.
          try: >-
            Убери строку с `global`, допиши в функцию `return greeting`, а снаружи сохрани
            результат вызова: `greeting = make_greeting("Оля")`.
        - id: not-saved
          when:
            errorType: NameError
            errorIncludes: "'greeting' is not defined"
            codeRegex: '^[ \t]+return\b[\s\S]*^make_greeting\('
          why: >-
            `return` уже отдаёт приветствие, но результат вызова никуда не сохранён и пропадает.
            А переменная `greeting` снаружи так и не появилась: та, что внутри функции, —
            локальная и исчезла после вызова.
          try: >-
            Сохрани то, что вернула функция: `greeting = make_greeting("Оля")`. Или сразу
            напечатай: `print(make_greeting("Оля"))`.
          verify: NameError должна исчезнуть, а на экране появится приветствие.
        - id: other-name
          when:
            errorType: NameError
            errorIncludes: "'greeting' is not defined"
            codeRegex: '^[ \t]+return\b[\s\S]*^\w+(?<!^greeting)[ \t]*=[ \t]*make_greeting\('
          why: >-
            Результат вызова ты сохранил, но в другой переменной, а `print` печатает `greeting`.
            Снаружи функции такого имени нет: `greeting` была только внутри функции и исчезла
            после вызова. Имя снаружи может быть любым — печатать нужно именно его.
          try: Напечатай ту переменную, в которую сохранил результат вызова.
          verify: NameError должна исчезнуть, а на экране появится приветствие.
        - id: param-outside
          when:
            errorType: NameError
            errorIncludes: "'name' is not defined"
          why: >-
            `name` — параметр, то есть локальная переменная функции: она появляется только во
            время вызова и получает то значение, которое ты передал. Снаружи такого имени нет.
          try: 'В вызове передай само имя гостя — текст в кавычках: `make_greeting("Оля")`.'
          verify: NameError должна исчезнуть, а на экране появится приветствие.
        - id: local-outside
          when:
            errorType: NameError
            errorIncludes: "'greeting' is not defined"
          why: >-
            `greeting` создана внутри функции — это её локальная переменная. Когда вызов
            закончился, она исчезла, поэтому в строке с `print` Python такого имени не знает.
          try: >-
            Верни приветствие из функции — `return greeting` в конце её тела — и сохрани результат
            вызова: `greeting = make_greeting("Оля")`.
          verify: NameError должна исчезнуть, а на экране появится приветствие.
        - id: no-return
          when:
            outputEquals: None
          why: >-
            На экране `None`: функция ничего не возвращает, поэтому результат её вызова — `None`.
            Внутренняя `greeting` так и осталась внутри функции.
          try: Допиши в конец тела функции `return greeting`.
          verify: Вместо `None` на экране должно появиться приветствие.
        - id: function-object
          when:
            outputIncludes: "<function"
          why: >-
            Без скобок имя функции — это сама функция, а не результат её работы. `print`
            показывает, что это функция и где она лежит в памяти.
          try: 'Вызови функцию — со скобками и именем: `make_greeting("Оля")`.'
          verify: Вместо `<function …>` на экране должно появиться приветствие.
        - id: prints-inside
          when:
            failedTest: t2
            codeRegex: '^[ \t]+print\([\s\S]*^[ \t]+return\b'
          why: >-
            Функция возвращает приветствие, но ещё и сама его печатает. По условию она только
            собирает текст, а что с ним делать — напечатать, сохранить, изменить — решает
            основная программа. Иначе, например, `print(make_greeting("Макс").upper())` покажет
            приветствие дважды.
          try: >-
            Убери `print` из тела функции, а приветствие напечатай снаружи:
            `print(make_greeting("Оля"))`.
        - id: hardcoded-text
          when:
            failedRule: r-print-result
            codeRegex: '^print\(\s*f?["'']'
          why: >-
            Приветствие напечатано готовым текстом, а то, что вернула функция, не используется.
            Поменяешь имя в вызове — на экране всё равно останется Оля.
          try: >-
            Сохрани результат вызова и напечатай его: `greeting = make_greeting("Оля")`, потом
            `print(greeting)`.
      afterPass: >-
        Приветствие вышло из функции через `return`, и программа сама решила, что с ним делать.
        Теперь результат можно использовать дальше, например `print(make_greeting("Макс").upper())` —
        приветствие заглавными буквами.
      skills: [scope, functions]

  - id: practice-quiz
    type: exercise
    title: Практика 2
    exercise:
      id: m5-l4-e2
      kind: modify
      title: Табло викторины
      statement: |-
        Табло Никиты падает с UnboundLocalError, да и считать умеет только очки Сов. Переделай
        функцию `add_points`: пусть она получает **текущий счёт** команды и **число очков** и
        возвращает новый счёт. Сам счёт храни снаружи, в `owls` и `foxes`, и обновляй его
        результатом вызова.

        В этом раунде Совы дважды ответили верно и получили 10 и 5 очков, а Лисы — один раз,
        5 очков. Программа выводит:

        ```text
        Совы: 15, Лисы: 5
        ```
      input: Ввода нет — очки записаны в программе.
      output: >-
        `add_points(score, points)` возвращает новый счёт; программа печатает строку
        `Совы: 15, Лисы: 5`.
      constraints:
        - Не используй `global`.
        - Очки обеих команд считает одна и та же функция `add_points`.
        - Функция ничего не печатает, печатает только последняя строка программы.
      starterCode: |
        owls = 0
        foxes = 0

        def add_points(points):
            owls = owls + points

        add_points(10)   # Совы ответили верно
        add_points(5)    # Совы ответили ещё раз
        # Лисам тоже нужно 5 очков — но функция умеет только про Сов
        print(f"Совы: {owls}, Лисы: {foxes}")
      tests:
        - id: c1
          kind: call
          title: "Первый верный ответ: 0 + 10"
          example: true
          call: add_points(0, 10)
          expected: "10"
        - id: c2
          kind: call
          title: "Ещё очки к счёту: 15 + 5"
          example: true
          call: add_points(15, 5)
          expected: "20"
        - id: c3
          kind: call
          title: "Граничный случай: ноль очков"
          edge: true
          call: add_points(7, 0)
          expected: "7"
        - id: t1
          kind: io
          title: Табло после раунда
          example: true
          expected: "Совы: 15, Лисы: 5"
          compare:
            ignoreSpaces: true
      rules:
        - id: r-no-global
          avoid: [Global]
          message: >-
            Не используй `global`: пусть `add_points` получает счёт параметром и возвращает новый,
            а программа присваивает результат вызова.
        - id: r-use-function
          use: [call:add_points]
          dependsOn:
            print: [add_points]
          message: >-
            Табло печатает последняя строка программы: `print` со счётом `owls` и `foxes`,
            посчитанным вызовами `add_points`, а не готовыми числами.
        - id: r-both-teams
          dependsOn:
            owls: [add_points]
            foxes: [add_points]
          message: >-
            Счёт обеих команд храни в `owls` и `foxes` и обновляй результатом вызова
            `add_points`: `owls = add_points(owls, …)`, `foxes = add_points(foxes, …)`.
      criteria:
        - "`add_points(score, points)` возвращает новый счёт: `add_points(15, 5)` даёт 20."
        - "Программа выводит `Совы: 15, Лисы: 5`."
        - Счёт обеих команд обновляется вызовами одной функции и присваиванием снаружи, без `global`.
      hints:
        - >-
          Почему функция, внутри которой написано `owls`, не может посчитать очки Лис? Что ей нужно
          получать при вызове, чтобы работать для любой команды, — и что отдавать обратно?
        - >-
          Вспомни копилку из примера: `deposit(balance, amount)` получает баланс и сумму и
          возвращает новый баланс, а снаружи стоит `savings = deposit(savings, 50)`. Без
          присваивания `savings` не меняется.
        - |-
          Каркас:
          ```text
          def add_points(score, points):
              вернуть score + points

          owls = add_points(owls, 10)
          owls = ...        # ещё 5 очков Совам
          foxes = ...       # 5 очков Лисам
          print(...)
          ```
      solution:
        code: |
          owls = 0
          foxes = 0

          def add_points(score, points):
              return score + points

          owls = add_points(owls, 10)    # Совы ответили верно
          owls = add_points(owls, 5)     # Совы ответили ещё раз
          foxes = add_points(foxes, 5)   # Лисы ответили верно
          print(f"Совы: {owls}, Лисы: {foxes}")
        explanation: >-
          Функция больше не лезет во внешние переменные: текущий счёт приходит в параметре
