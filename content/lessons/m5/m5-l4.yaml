          code: |-
            first = add_to_basket("яблоки")
            second = add_to_basket("груши")
            assert first == ["яблоки"]
            assert second == ["груши"]
          message: >-
            Два вызова без корзины должны дать две разные корзины: `add_to_basket("яблоки")` →
            `['яблоки']`, затем `add_to_basket("груши")` → `['груши']`.
        - id: t3
          kind: assert
          title: "Граничный случай: корзину передали"
          edge: true
          code: |-
            mine = ["сыр"]
            add_to_basket("мёд", mine)
            assert mine == ["сыр", "мёд"]
          message: >-
            Если корзину передали, товар добавляется в неё саму: после
            `add_to_basket("мёд", mine)` в `mine` лежат `['сыр', 'мёд']`.
        - id: t4
          kind: assert
          title: "Граничный случай: функция возвращает переданную корзину"
          edge: true
          code: |-
            mine = ["сыр"]
            result = add_to_basket("мёд", mine)
            assert result == ["сыр", "мёд"]
          message: >-
            Если корзину передали, функция возвращает эту корзину: `add_to_basket("мёд", ["сыр"])`
            → `['сыр', 'мёд']`.
        - id: t5
          kind: call
          title: "Граничный случай: третий покупатель"
