      mistakes:
        - id: compare-not-assign
          when:
            errorIncludes: "'NoneType' object has no attribute 'append'"
            codeRegex: '^[ \t]+\w+[ \t]*==[ \t]*\['
          why: >-
            Проверка на `None` есть, но в строке под ней стоит `==` — это сравнение, а не
            присваивание. Новый список не создаётся, `basket` остаётся `None`, а у `None` нет
            метода `append`.
          try: 'Поставь одно `=`: `basket = []`.'
          verify: Ошибка AttributeError должна исчезнуть, а у Анны и Бориса появятся свои корзины.
        - id: none-no-check
          when:
            errorIncludes: "'NoneType' object has no attribute 'append'"
          why: >-
            Когда корзину не передали, `basket` равна `None`, а `None` — не список, у него нет
            метода `append`. Прежде чем класть товар, нужно проверить, передали ли корзину, и если
            нет — создать новый список.
          try: 'До строки с `append` проверь: `if basket is None:` — и тогда создай пустой список `basket = []`.'
          verify: Ошибка AttributeError должна исчезнуть, а у Анны и Бориса появятся свои корзины.
        - id: return-append
          when:
            outputIncludes: ": None"
            codeRegex: '\breturn\s+\w+\.append\('
          why: >-
            `append` меняет список, но сам ничего не возвращает — его результат `None`. Поэтому
            `return basket.append(item)` отдаёт `None`, хотя товар в корзину попал.
          try: 'Раздели на две строки: сначала `basket.append(item)`, потом `return basket`.'
          verify: "Вместо `None` в выводе должны появиться списки: `Анна: ['хлеб']`."
        - id: lost-return
          when:
            outputIncludes: ": None"
          why: >-
            В `anna` и `boris` попал `None`: функция кладёт товар в корзину, но саму корзину не
            возвращает.
          try: Верни корзину в конце функции — `return basket`.
          verify: "Вместо `None` в выводе должны появиться списки: `Анна: ['хлеб']`."
        - id: default-still-list
          when:
            failedTest: t2
            codeRegex: '=\s*\[\s*\]\s*\)[\s\S]*(?:\bis|==)\s*None'
          why: >-
            Проверка на `None` есть, но значение по умолчанию всё ещё `[]`. Когда корзину не
            передали, `basket` — это общий список из строки `def`, а не `None`, поэтому проверка
            не срабатывает никогда.
          try: 'Поменяй значение по умолчанию: `basket=None`.'
        - id: patched-calls
          when:
            failedTest: t2
            codeRegex: '^[ \t]*\w+[ \t]*=[ \t]*add_to_basket\([^)\n]*,[ \t]*\[[ \t]*\][ \t]*\)'
          why: >-
            С пустыми списками в вызовах Анна и Борис получили свои корзины, но функция осталась
            прежней: следующий покупатель без корзины снова получит общий список. Чинить нужно
            функцию, а не вызовы.
          try: >-
            Верни вызовы как были, поставь в функции значение по умолчанию `None`, а новый список
            создавай внутри функции.
        - id: shared-default
          when:
            failedTest: t2
            codeRegex: '=\s*\[\s*\]\s*\)'
          why: >-
            Список из `basket=[]` создаётся один раз — когда Python выполняет строку `def`. Все
            вызовы без корзины получают этот же список: у Анны и Бориса одна корзина на двоих, и
            всё, что с ней делает один вызов, видно в корзине другого.
          try: >-
            Поставь по умолчанию `basket=None`, а в начале функции: если `basket is None`, создай
            новый пустой список.
        - id: shared-list
          when:
            failedTest: t2
            outputIncludes: "Анна: ['хлеб', 'молоко']"
          why: >-
            Все покупатели получают один и тот же список, поэтому товары смешиваются. Список,
            созданный один раз — снаружи функции или в значении по умолчанию, — общий для всех
            вызовов.
          try: >-
            Корзина — параметр функции со значением по умолчанию `None`. Новую корзину создавай
            внутри функции, когда `basket is None`.
        - id: copy-instead
          when:
            failedTest: t3
            codeRegex: '\.copy\(\)|\[\s*:\s*\]|\blist\(\s*\w+\s*\)|=\s*\w+\s*\+\s*\['
          why: >-
            Копия (или `basket + [item]` — это тоже новый список) спасает от общей корзины, но
            теперь товар попадает в новый список, а переданная корзина не пополняется: после
            вызова в `mine` мёда нет.
          try: >-
            Не копируй. Новый список нужен, только когда корзину не передали: поставь по
            умолчанию `None` и создавай список, если `basket is None`. Переданную корзину пополняй
            напрямую — `basket.append(item)`.
        - id: append-inside-if
          when:
            failedTest: t3
            codeRegex: '^[ \t]*if\b[^\n]*:[ \t]*\n([ \t]+)\w+[ \t]*=[ \t]*\[[^\n]*\n\1\w+\.append\('
          why: >-
            Строка с `append` стоит внутри `if` — у неё такой же отступ, как у `basket = []`.
            Поэтому товар добавляется, только когда корзину не передали, а в переданную корзину он
            не попадает.
          try: >-
            Сдвинь `basket.append(item)` влево, на уровень `if`: товар нужно добавить в любом
            случае — и в новую корзину, и в переданную. `return basket` тоже пиши после `if`.
        - id: always-new
          when:
            failedTest: t3
            codeRegex: 'def add_to_basket\([^)]*\):[ \t]*\n[ \t]+\w+[ \t]*=[ \t]*\['
          why: >-
            Функция создаёт новую корзину всегда — даже когда корзину передали. Товар уходит в
            новый список, а переданная корзина остаётся без изменений.
          try: 'Создавай пустой список, только если корзину не передали: `if basket is None:`.'
        - id: branch-no-return
          when:
            failedTest: t4
          why: >-
            Переданная корзина пополняется, но функция её не возвращает — вызов отдаёт `None`.
            Так бывает, когда `return` стоит только внутри `if`, в ветке «корзину не передали».
          try: >-
            Поставь `return basket` в конце функции, после `if`, — тогда корзина вернётся в обоих
            случаях.
        - id: empty-check
          when:
            failedTest: t6
            codeRegex: '\bnot\s+\w+\s*:|==\s*\[\s*\]|\blen\(\s*\w+\s*\)\s*(?:==|<)'
          why: >-
            Условие проверяет, пустая ли корзина, а не передали ли её. Но покупатель может
            передать и пустую корзину — тогда функция подменяет её новой, и товар в переданную
            корзину не попадает. `if not basket` проверяет то же самое: для `if` и `None`, и
            пустой список считаются «ложью».
          try: 'Проверяй именно «корзину не передали»: `basket=None` в строке `def` и `if basket is None:`.'
      afterPass: >-
        Теперь у каждого покупателя своя корзина, а переданная корзина пополняется. Запомни
        правило: список, словарь или множество по умолчанию не ставят — ставят `None` и создают
        новый внутри функции.
      skills: [scope, lists]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - Переменные, созданные внутри функции, и её параметры — локальные. Они живут только во время вызова и снаружи не видны.
      - Присваивание внутри функции (и `+=` тоже) создаёт свою переменную и не меняет одноимённую снаружи. Прочитать её до присваивания нельзя — UnboundLocalError.
      - "Данные — через параметры, результат — через `return`, снаружи — присваивание: `x = f(x)`. `global` для этого не нужен."
      - Список, переданный в функцию, — тот же самый список. Список по умолчанию создаётся один раз, поэтому по умолчанию ставят `None`.
    question: >-
      Значение по умолчанию вычисляется один раз — и у `fragile=False` из урока 5.2, и у
      `marks=[]`. Почему же `marks=[]` копит оценки от вызова к вызову, а `fragile` никаких следов
      прошлых вызовов не хранит?
    answer: >-
      `False` функция не меняет, она его только читает. Даже `fragile = True` внутри функции лишь
      дало бы локальному имени новое значение. А `marks.append(mark)` меняет сам список — тот
      единственный, что создан в строке `def`, — и следующий вызов без списка получает его уже с
      оценками. Поэтому для списка по умолчанию ставят `None`, а новый список создают внутри
      функции.
