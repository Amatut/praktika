            локальная переменная во всей функции. А справа от `=` её нужно прочитать, хотя
            значения у неё ещё нет. Внешнюю `owls` функция под этим именем не видит.
          try: >-
            Передавай текущий счёт в функцию параметром и возвращай новый:
            `def add_points(score, points)` и `return score + points`.
        - id: param-outside
          when:
            errorType: NameError
            codeRegex: '(?<!def\s)\badd_points\([^)\n]*\b(?:score|points)\b'
          why: >-
            Имена из скобок `def` — параметры, то есть локальные переменные функции. Они
            появляются только во время вызова, а снаружи функции, где стоит вызов, таких имён нет.
          try: >-
            В вызов передавай то, что есть в программе: счёт команды и число очков, например
            `owls = add_points(owls, 10)`. При вызове эти значения и попадут в параметры.
        - id: one-param
          when:
            errorIncludes: takes 1 positional argument but 2 were given
          why: >-
            Проверка вызывает `add_points(0, 10)` — с текущим счётом и очками, а функция принимает
            одно значение. Без счёта в параметре функция не знает, чей счёт менять, — и годится
            самое большее для одной команды.
          try: Добавь параметр для текущего счёта — `def add_points(score, points)` — и верни `score + points`.
          verify: 'Нажми «Проверить»: проверка «Первый верный ответ: 0 + 10» должна стать зелёной.'
        - id: none-score
          when:
            errorIncludes: "'NoneType' and 'int'"
          why: >-
            В функции нет `return` с новым счётом, поэтому её вызов даёт `None`. После
            `owls = add_points(owls, 10)` в `owls` лежит `None`, и следующий вызов прибавляет очки к
            `None` — отсюда TypeError со словом NoneType.
          try: >-
            Допиши в конец функции `return` с новым счётом. Если там стоит `print`, замени его на
            `return`.
          verify: 'На табло должно получиться «Совы: 15, Лисы: 5».'
        - id: local-only
          when:
            failedTest: c1
            codeRegex: '(?<![\s\S])(?![\s\S]*\breturn\b)'
          why: >-
            Функция меняет счёт у себя внутри, но ничего не возвращает. Параметр — локальная
            переменная, даже если он назван так же, как переменная снаружи: когда вызов
            закончился, новое значение пропало, а счёт команды снаружи так и остался нулём.
          try: >-
            Верни новый счёт через `return`, а при вызове сохрани его:
            `owls = add_points(owls, 10)`.
        - id: reads-global
          when:
            failedTest: c1
            codeRegex: '^def add_points\((?![^)]*\bowls\b)[^)]*\)[\s\S]*?^[ \t]+return\b[^\n]*\b(?:owls|foxes)\b'
          why: >-
            Функция получает счёт параметром, но считает от внешней переменной команды. Поэтому
            `add_points(0, 10)` дал не 10: функция взяла счёт из программы, а не тот, что ей
            передали. Это та самая тайная зависимость от чужих данных из теории.
          try: >-
            Считай от параметра: если он называется `score`, верни `score + points`.
        - id: not-assigned
          when:
            failedTest: t1
            codeRegex: '^[ \t]*add_points\('
          why: >-
            Функция возвращает новый счёт, но результат вызова, который стоит отдельной строкой,
            никуда не сохранён и пропадает — счёт команды снаружи не меняется.
          try: >-
            Присваивай результат каждого вызова той же переменной: `owls = add_points(owls, 10)` —
            и так же в остальных вызовах.
          verify: 'На табло должно получиться «Совы: 15, Лисы: 5».'
        - id: double-count
          when:
            failedTest: t1
            codeRegex: '\+=\s*add_points\(|\b(\w+)\s*=\s*\1\s*\+\s*add_points\('
          why: >-
            `add_points` уже возвращает новый счёт целиком — старый плюс очки. А `+=` (или
            `owls = owls + add_points(...)`) прибавляет этот счёт к старому ещё раз, и очки
            считаются дважды.
          try: 'Присваивай результат обычным `=`: `owls = add_points(owls, 10)`.'
          verify: 'На табло должно получиться «Совы: 15, Лисы: 5».'
        - id: debug-print
          when:
            failedTest: t1
            codeRegex: '^def add_points\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*?[ \t]+print\('
          why: >-
            Внутри `add_points` остался `print`: при каждом вызове он печатает лишнюю строку, и
            над табло появляются числа. Такой `print`, как в копилке, нужен, только чтобы
            заглянуть внутрь вызова, — в готовой программе его убирают.
          try: >-
            Убери `print` из функции: пусть она только возвращает новый счёт, а табло печатает
            последняя строка программы.
          verify: 'На экране должна остаться одна строка: «Совы: 15, Лисы: 5».'
        - id: foxes-missing
          when:
            outputEquals: "Совы: 15, Лисы: 0"
          why: >-
            Счёт Сов верный, а у Лис по-прежнему 0: для них нет вызова `add_points` или его
            результат не сохранён в `foxes`.
          try: 'Начисли Лисам 5 очков той же функцией, передав ей их счёт: `foxes = add_points(foxes, 5)`.'
          verify: 'На табло должно получиться «Совы: 15, Лисы: 5».'
        - id: hardcoded
          when:
            failedRule: r-use-function
            codeRegex: '^print\(\s*f?["''][^\n]*\d'
          why: >-
            Табло записано готовыми числами. Для этого раунда они верны, но после следующего
            ответа табло придётся переписывать вручную.
          try: >-
            Начисляй очки вызовами: `owls = add_points(owls, 10)` и так далее, а печатай
            переменные `owls` и `foxes`.
        - id: team-by-hand
          when:
            failedRule: r-both-teams
          why: >-
            Счёт одной из команд не обновлён результатом `add_points`: очки прибавлены вручную
            или вызов стоит прямо в `print`, а в переменной счёт так и не записан. По условию счёт хранится в `owls` и `foxes`, и весь смысл новой функции — в
            том, что она считает очки любой команды.
          try: >-
            Присвой обеим переменным результат вызова: `owls = add_points(owls, 10)`,
            `foxes = add_points(foxes, 5)`. А в `print` передавай уже `owls` и `foxes`.
      afterPass: >-
        Одна функция обслуживает любую команду — хоть третью: `bears = add_points(bears, 10)`. И
        проверять её легко: `add_points(15, 5)` всегда даёт 20, что бы ни происходило в остальной
        программе.
      skills: [scope, functions]

  - id: lists
    type: theory
    title: "Особый случай: списки"
    body: |-
      Из урока 4.2 ты знаешь: `today = plan` не копирует список, а даёт тому же списку второе имя.
      С параметрами так же: функция получает **тот же самый список**, а не копию. Поэтому
      `append` внутри функции меняет список и снаружи. А если присвоить параметру новый список,
      например `items = []`, имя `items` внутри функции просто начнёт означать другой список —
      тот, что снаружи, не изменится.

      **Значение по умолчанию** вычисляется один раз — когда Python выполняет строку `def`, а не
      при каждом вызове. С числами и строками это незаметно. А список по умолчанию — один на все
      вызовы, и он копит данные:

      ```python
      def add_mark(mark, marks=[]):
          marks.append(mark)
          return marks

      print(add_mark(5))   # [5]
      print(add_mark(4))   # [5, 4] — пятёрка из прошлого вызова!
      ```

      Поэтому список по умолчанию не ставят. Ставят `None` — особое значение «ничего» из урока
      5.3, — а новый список создают внутри функции:

      ```python
      def add_mark(mark, marks=None):
          if marks is None:
              marks = []
          marks.append(mark)
          return marks
      ```

      `marks is None` читается как «marks — это None», то есть «список не передали». `is`
      проверяет, что это *тот же самый* объект, — как «тот же самый список» выше. `None` в
      программе один, поэтому его сравнивают через `is`. Словарь и множество по умолчанию тоже не
      ставят — по той же причине, что и список.
    simpler: >-
      Список, переданный в функцию, — не копия, а тот же самый список: функция может дописать в
      него, и это будет видно снаружи. А список «по умолчанию» создаётся один раз на всю
      программу и копит всё, что в него положили. Поэтому по умолчанию ставят `None`, а новый
      список создают внутри функции, если список не передали.
    coach: >-
      Меняешь список внутри функции — меняешь его и снаружи. Если так и задумано, пусть это будет
      видно из имени: `add_guest`, а не `make_list`.

  - id: same-list
    type: predict
    title: Пригласили и отменили
    prompt: >-
      Одна функция добавляет гостя в список, другая пытается список очистить. Как думаешь, что
      выведет программа?
    code: |-
      def invite(guests, name):
          guests.append(name)

      def cancel_all(guests):
          guests = []

      party = ["Аня"]
      invite(party, "Борис")
      cancel_all(party)
      print(party)
    options:
      - "['Аня']"
      - "['Аня', 'Борис']"
      - "[]"
    answer: "['Аня', 'Борис']"
    explanation: >-
      `invite` получила тот же список, что лежит в `party`, и `append` дописал Бориса прямо в
      него. А в `cancel_all` строка `guests = []` только изменила, что означает локальное имя
      `guests`: теперь это новый пустой список. Список в `party` она не тронула. Нужен пустой
      список снаружи — присвой его снаружи: `party = []`.
    coach: "`append` меняет сам список, а `=` меняет только то, что означает имя. В этом вся разница."

  - id: practice-basket
    type: exercise
