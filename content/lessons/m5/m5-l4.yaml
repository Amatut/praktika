            result = add_to_basket("мёд", empty)
            assert empty == ["мёд"]
            assert result == ["мёд"]
          message: >-
            Пустая корзина — тоже переданная корзина: после `add_to_basket("мёд", empty)` в
            `empty` должен лежать `['мёд']`, и функция возвращает эту корзину.
      criteria:
        - "Программа выводит `Анна: ['хлеб']` и `Борис: ['молоко']` — у каждого своя корзина."
        - Каждый вызов без корзины получает новую пустую корзину, сколько бы вызовов ни было до него.
