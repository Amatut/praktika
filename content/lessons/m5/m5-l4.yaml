    exercise:
      id: m5-l4-e3
      kind: fix
      title: Корзина с сюрпризом
      statement: |-
        В интернет-магазине функция `add_to_basket(item, basket)` кладёт товар в корзину и
        возвращает корзину. Если корзину не передали, функция должна завести новую. Но Борис
        открыл сайт и увидел в своей корзине хлеб Анны.

