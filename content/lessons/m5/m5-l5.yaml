      mistakes:
        - id: no-return
          when:
            failedTest: c1
            codeRegex: 'def[ \t]+warmest\b[^\n]*:[ \t]*(?:#[^\n]*)?\n(?:(?![ \t]+return\b)(?![ \t]+[^\n]*\bprint\s*\()(?:[ \t]+[^\n]*)?\n)*(?:(?=[^ \t\n])|(?![\s\S]))'
          where: Функция `warmest`
          why: >-
            В `warmest` нет `return`, поэтому функция возвращает `None`: проверка получает `None`,
            а в отчёте выходит «Максимум: None». Так бывает, если в функции ещё стоит `pass` или
            рекорд найден, но его забыли вернуть.
          try: >-
            Если в функции ещё `pass`, замени его телом: рекорд и цикл. В конце, после цикла и на
            одном уровне с `for`, верни рекорд через `return`.
          verify: "«Пример 1» должен вернуть 5."
        - id: return-in-loop
          when:
            codeRegex: '^([ \t]*)for\b[^\n]*\n(?:\1[ \t]+[^\n]*\n|[ \t]*\n)*?\1[ \t]+return\b'
          where: "`return` внутри цикла `for` в функции `warmest`"
          why: >-
            `return` сразу завершает функцию. Он стоит внутри цикла, поэтому функция заканчивает
            работу раньше, чем просмотрит все дни, — на первом проходе или на первой смене рекорда.
          try: >-
            Сдвинь `return` влево — на один уровень с `for`. Рекорд нужно вернуть после того, как
            цикл просмотрел весь список.
          verify: "«Пример 1» должен вернуть 5, а «Пример 2» — 4."
        - id: uses-week
          when:
            codeRegex: '(?<=def[ \t]+warmest[ \t]*\((?![^)]*\bweek\b)[^)]*\)[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?)[ \t]+[^\n#]*\bweek\b'
          where: "`week` внутри функции `warmest`"
          why: >-
            Внутри `warmest` используется `week` — список основной части, а не параметр `temps`.
            Поэтому функция смотрит не на тот список, который ей передали: при любом вызове она
            ищет максимум недели из программы.
          try: >-
            Внутри функции работай только с параметром: `temps[0]`, `for t in temps`. Неделя
            попадёт в функцию при вызове `warmest(temps)` из `print_report`.
          verify: "«Пример 1» должен вернуть 5."
        - id: min-instead
          when:
            failedTest: c1
            codeRegex: '\bif\s+(\w+(?:\[\w+\])?)\s*<=?\s*(\w+)\s*:[ \t]*\n\s*\2\s*=\s*\1[ \t]*$|\bif\s+(\w+)\s*>=?\s*(\w+(?:\[\w+\])?)\s*:[ \t]*\n\s*\3\s*=\s*\4[ \t]*$|\bmin\s*\('
          where: Условие в `warmest`
          why: >-
            Функция находит самую низкую температуру: для `[2, 5, -3]` она возвращает -3. Рекорд
            меняется, когда новое значение меньше него, а нужен самый тёплый день.
          try: Обновляй рекорд, когда температура **больше** него.
          verify: "«Пример 1» должен вернуть 5."
        - id: zero-start
          when:
            failedTest: c3
            codeRegex: 'def[ \t]+warmest[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?[ \t]+(\w+)[ \t]*=[ \t]*0[ \t]*(?:#[^\n]*)?\n(?:(?:[ \t]+[^\n]*)?\n)*?[ \t]+return[ \t]+\1\b'
          where: Начальное значение рекорда в `warmest`
          why: >-
            Рекорд начинается с 0. Если вся неделя морозная, ни одна температура не больше нуля, и
            функция возвращает 0 — температуру, которой в списке нет.
          try: Начни рекорд с первой температуры списка — `temps[0]`.
          verify: "«Граничный случай: все дни с морозом» должен вернуть -2."
        - id: skip-last
          when:
            failedTest: c6
            codeRegex: 'len\s*\(\s*\w+\s*\)\s*-\s*1'
          where: Цикл в `warmest`
          why: >-
            Цикл заканчивается на предпоследнем дне: из-за `- 1` в `len(temps) - 1` последний
            индекс не просматривается. Если самый тёплый день последний, функция его не видит.
          try: >-
            Убери `- 1`: `range(len(temps))` перебирает все индексы, от 0 до последнего. Или
            перебирай сами температуры — `for t in temps`.
          verify: "«Граничный случай: самый тёплый — последний день» должен вернуть 3."
        - id: no-report-line
          when:
            outputEquals: |-
              Средняя: 0.1
              Дней с морозом: 3
            codeRegex: '^[ \t]*def[ \t]+print_report\b(?:(?<=def[ \t]+warmest\b[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?[ \t]+return\b[\s\S]*)|(?=[\s\S]*def[ \t]+warmest\b[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?[ \t]+return\b))'
          where: Функция `print_report`
          why: >-
            `warmest` уже возвращает ответ, но отчёт по-прежнему из двух строк. Сама по себе
            функция ничего не печатает — её результат должен попасть в отчёт.
          try: >-
            Добавь в `print_report` третий `print` по образцу двух первых: с подписью «Максимум:» и
            вызовом `warmest(temps)` внутри.
          verify: В «Отчёте за неделю из программы» должна появиться третья строка.
        - id: no-parens
          when:
            outputIncludes: "<function "
          where: Третья строка в `print_report`
          why: >-
            В строке отчёта стоит имя функции без скобок. Без скобок функция не вызывается, и
            `print` печатает саму функцию — `<function warmest at …>`.
          try: "Вызови функцию со списком: `warmest(temps)`."
          verify: "В «Отчёте за неделю из программы» третья строка должна стать «Максимум: 4»."
        - id: call-as-text
          when:
            outputIncludes: "warmest("
          where: Третья строка в `print_report`
          why: >-
            В отчёт попал текст вызова, а не число: `warmest(temps)` стоит внутри строки, как
            обычные буквы. Python вычисляет выражение внутри строки, только если перед кавычкой
            стоит `f`, а само выражение — в фигурных скобках.
          try: >-
            Запиши строку по образцу двух первых: `f"Максимум: {warmest(temps)}"`.
          verify: "В «Отчёте за неделю из программы» третья строка должна стать «Максимум: 4»."
        - id: report-not-reused
          when:
            failedRule: r-uses
            codeRegex: '(?<=def[ \t]+print_report\b[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?)[ \t]+[^\n#]*Максимум(?:(?<=def[ \t]+warmest\b[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?[ \t]+return\b[\s\S]*)|(?=[\s\S]*def[ \t]+warmest\b[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?[ \t]+return\b))'
          where: Третья строка в `print_report`
          why: >-
            Строка «Максимум» в отчёте есть, но число в ней не от `warmest`: оно записано готовым
            или посчитано заново. Для другой недели такой отчёт соврёт, а если поправить
            `warmest`, отчёт этого не заметит.
          try: Подставь в строку отчёта вызов `warmest(temps)`.
          verify: Требование собирать строку «Максимум» из вызова `warmest` должно выполниться.
        - id: leftover-check
          when:
            outputIncludes: ожидаю
          where: Строка проверочного вызова
          why: >-
            В выводе осталась строка проверочного вызова — со словом «ожидаю». А тест сравнивает
            весь вывод программы с отчётом.
          try: >-
            Сначала сравни в этой строке ответ функции с ожиданием: не совпали — ищи ошибку в
            функции, совпали — поставь перед строкой `#` или удали её.
          verify: В выводе программы должны остаться только три строки отчёта.
      afterPass: >-
        Новая характеристика — это одна функция и одна строка отчёта, а `average` и `count_frosty`
        остались нетронутыми. Точно так же можно добавить `coldest(temps)` — самый холодный день.
      skills: [function-design, accumulators]

  - id: practice-password
    type: exercise
    title: Практика 2
    exercise:
      id: m5-l5-e2
      kind: modify
      title: Пароль по правилам
      statement: |-
        Для электронного журнала наблюдений каждый кружковец придумывает пароль. Злата уже
        написала проверку, но одним куском. Вынеси обе проверки в функции-вопросы:

        - `is_long_enough(password)` возвращает `True`, если в пароле не меньше 8 символов, иначе
          `False`;
        - `has_digit(password)` возвращает `True`, если в пароле есть хотя бы одна цифра, иначе
          `False`.

        Основная часть программы должна пользоваться этими функциями, а её вывод — остаться
        прежним. Напоминание: `ch.isdigit()` даёт `True`, если символ `ch` — цифра.

        Например, для пароля `qwerty` программа печатает:

        ```text
        Слишком короткий: нужно хотя бы 8 символов
        Нужна хотя бы одна цифра
        ```

        а для `qwerty123` — `Пароль подходит`.
      input: >-
        Одна строка — пароль. Функции получают пароль через параметр. Когда проверка вызывает сами
        функции, программе тоже подаётся пароль `qwerty123` — только чтобы она дошла до конца.
      output: Те же сообщения, что печатает исходная программа; функции возвращают `True` или `False`.
      constraints:
        - Функции ничего не печатают и не вызывают `input()`, сообщения печатает основная часть.
        - Объяви функции выше основной части — к моменту вызова они должны быть известны.
      starterCode: |
        password = input("Придумай пароль: ")
        problems = 0
        if len(password) < 8:
            print("Слишком короткий: нужно хотя бы 8 символов")
            problems += 1
        digit_found = False
        for ch in password:
            if ch.isdigit():
                digit_found = True
        if not digit_found:
            print("Нужна хотя бы одна цифра")
            problems += 1
        if problems == 0:
            print("Пароль подходит")
      tests:
        - id: c1
          kind: call
          title: "Пример: короткий пароль"
          example: true
          stdin: "qwerty123\n"
          call: is_long_enough("qwerty")
          expected: "False"
        - id: c2
          kind: call
          title: "Граничный случай: ровно 8 символов"
          edge: true
          stdin: "qwerty123\n"
          call: is_long_enough("abcdefgh")
          expected: "True"
        - id: c3
