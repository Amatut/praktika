      solution:
        code: |
          def total(minutes):
              return sum(minutes)

          def days_over_limit(minutes, limit):
              count = 0
              for m in minutes:
                  if m > limit:
                      count += 1
              return count

          def print_report(minutes, limit):
              print(f"Всего за неделю: {total(minutes)} мин")
              print(f"Дней сверх лимита: {days_over_limit(minutes, limit)}")

          week = [45, 150, 0, 90, 200, 120, 30]
          print_report(week, 120)
        explanation: >-
          Два расчёта получают данные только через параметры и возвращают числа, поэтому их можно
          проверить отдельно на любых маленьких списках. `sum` пустого списка даёт 0, а счётчик
          пустого списка остаётся 0 — цикл не выполнится ни разу. Сравнение `m > limit` не считает
          день ровно с лимитом. `print_report` только печатает: числа она берёт у расчётов, а
          список и лимит — из своих параметров, поэтому отчёт верен для любой недели.
