id: m5-l5
module: m5
number: "5.5"
title: "Разбиваем задачу на функции"
objective: >-
  Раскладывать задачу на несколько небольших функций с понятными именами, каждая из которых
  делает одно дело, проверять каждую отдельно и собирать из них программу.
minutes: [25, 30]
prerequisites: [m5-l4]
skills: [function-design]
environment: python

story:
  title: Программа, в которую страшно вносить правку
  fictional: true
  text: >-
    Программа, которую Злата когда-то написала для метеокружка, за полгода выросла до сорока строк
    подряд: она считала среднюю температуру за неделю и число морозных дней. Когда руководитель
    кружка Пётр Андреевич попросил добавить самый тёплый день, Злата вставила новый цикл не туда,
    и средняя тихо стала неверной — заметили это только через неделю. Тогда Злата разложила
    программу на маленькие функции — `average`, `count_frosty`, `print_report` — и каждую
    проверила на коротком списке из трёх чисел, посчитав ответ в уме. Теперь новая
    характеристика — это новая функция, а старые, уже проверенные, остаются нетронутыми.

why: >-
  Большую задачу трудно держать в голове целиком, поэтому её делят на части с понятными именами.
  Например, «отчёт о погоде» = «посчитать среднюю» + «посчитать морозные дни» + «напечатать
  отчёт», и каждую часть пишут и проверяют отдельно.

usedIn: >-
  В любом приложении работа поделена между функциями: в интернет-магазине одна считает скидку,
  другая проверяет адрес доставки, третья отправляет письмо о заказе. Маленькие функции легко
  проверять автоматическими тестами — ими займёмся в модуле 9 — и использовать повторно в других
  программах.

steps:
  - id: split
    type: theory
    title: Одна функция — одно дело
    body: |-
      Пока программа короткая, её можно писать одним куском. Но если она уже не помещается на
      экран, в ней появились одинаковые куски или её трудно описать одним предложением, — пора
      делить её на функции. Это называется **декомпозиция**: большую задачу раскладывают на
      маленькие части.

      **Как делить.**

      1. Опиши задачу словами по шагам: «посчитать среднюю, посчитать дни с морозом, напечатать
         отчёт».
      2. Каждый шаг — функция. Имя говорит, что функция делает или что она возвращает:
         `print_report`, `count_frosty`, `average`. Если функция отвечает на вопрос «да или
         нет», имя — вопрос: `is_frosty`, `has_digit`.
      3. Реши, что функция получает (параметры) и что отдаёт (`return`).

      **Расчёты не печатают.** Функция, которая считает, получает данные через параметры и
      возвращает результат. Она не вызывает `input()` и ничего не печатает. Спрашивать и
      печатать — дело основной части программы или отдельной функции вывода, например
      `print_report`. Тогда расчёт можно вызвать с любыми данными и использовать где угодно: в
      отчёте, в условии, в другой функции.

      **Проверяй каждую функцию отдельно.** Придумай маленький список, посчитай ответ в уме и
      сравни с тем, что вернёт функция. Такая строка называется **проверочным вызовом**:

      ```python
      print(count_frosty([-1, 0, 2]), "ожидаю 1")
      ```

      Не забывай граничные случаи: ноль, одно значение, все отрицательные. Когда функция
      проверена, проверочную строку удаляют: в готовой программе ей не место.

      **Основная часть** — строки, которые получают данные и вызывают функции (в прошлых уроках
      мы называли её основной программой). Её часто тоже кладут в функцию `main()` и вызывают
      одной строкой в самом конце. Так сразу видно, где программа начинается. Это удобно, но не
      обязательно:

      ```python
      def main():
          week = [-3, -1, 2, 4, 0, -2, 1]
          print_report(week)

      main()
      ```

      Писать можно снизу вверх — сначала маленькие функции, потом основную часть — или сверху
      вниз: сначала основная часть с вызовами, а в остальных функциях пока стоит `pass`.

      Частое заблуждение: «одна большая функция проще, чем пять маленьких». На деле большую
      функцию нельзя проверить по частям, и ошибка в одном месте прячется среди всего остального.
    simpler: >-
      Как с обедом: не «приготовь обед», а «свари суп», «нарежь салат», «накрой на стол». У
      каждого шага своё имя, и каждый можно проверить отдельно — попробовать суп, пока салат ещё
      не готов. Функции-расчёты только считают и отдают результат, а печатает функция вывода или
      основная часть.
    coach: >-
      Если описание функции не помещается в одно предложение без «и», это две функции.

  - id: weather
    type: example
    title: Отчёт о погоде
    body: >-
      Программа Златы после переделки. Три функции, у каждой одно дело, а внизу — данные и один
      вызов.
    code: |-
      def average(temps):
          return round(sum(temps) / len(temps), 1)

      def count_frosty(temps):
          count = 0
          for t in temps:
              if t < 0:
                  count += 1
          return count

      def print_report(temps):
          print(f"Средняя: {average(temps)}")
          print(f"Дней с морозом: {count_frosty(temps)}")

      week = [-3, -1, 2, 4, 0, -2, 1]
      print_report(week)
    notes:
      - line: 1
        text: >-
          Расчёт: получает список, возвращает среднюю, округлённую до десятых, и ничего не
          печатает. `sum` и `len` — из модуля 4.
      - line: 4
        text: Ещё одно дело — ещё одна функция. По имени понятно, что она считает.
      - line: 11
        text: >-
          Функция вывода: только печатает, а числа берёт у двух расчётов. Сама она ничего не
          считает.
      - line: 15
        text: >-
          Основная часть: данные и один вызов. Она короткая и читается как оглавление.
    tryIt: >-
      Допиши в конец проверочный вызов `print(count_frosty([-1, 0, 2]), "ожидаю 1")` и запусти.
      Потом проверь `count_frosty` на неделе без мороза — `[2, 4]`, ожидаю 0, — и `average` на
      одном дне — `[5]`, ожидаю 5.0: деление `/` всегда даёт дробное число.
    coach: >-
      Попробуй описать каждую функцию одним предложением. Получилось без «и» — значит, функция
      делает одно дело.

  - id: check-call
    type: predict
    title: Проверочный вызов
    prompt: >-
      Здесь одна функция пользуется другой, а внизу стоят три проверки. Как думаешь, что выведет
      программа?
    code: |-
      def is_frosty(t):
          return t < 0

      def count_frosty(temps):
          count = 0
          for t in temps:
              if is_frosty(t):
                  count += 1
          return count

      count_frosty([-2, 3, -1])
      print(count_frosty([0, -1, 5, -7]), "ожидаю 2")
      print(is_frosty(0))
    options:
      - "2\n2 ожидаю 2\nFalse"
      - "2 ожидаю 2\nFalse"
      - "2 ожидаю 2\nTrue"
      - "3 ожидаю 2\nTrue"
    answer: "2 ожидаю 2\nFalse"
    explanation: >-
      Строка `count_frosty([-2, 3, -1])` посчитала 2 и вернула результат, но его никто не
      сохранил и не напечатал, поэтому на экране от неё ничего нет. Проверочный вызов работает,
      только если обернуть его в `print`. `count_frosty` для каждой температуры спрашивает
      `is_frosty` — одна функция пользуется другой. Ноль не меньше нуля, поэтому `is_frosty(0)`
      даёт `False`, и морозных дней в списке `[0, -1, 5, -7]` два. Подпись «ожидаю 2» — это
      только ожидание того, кто писал проверку. Ответ функции печатается рядом как раз затем,
      чтобы увидеть, совпало ли оно.
    coach: >-
      Результат расчёта, который не напечатали и не сохранили, пропадает молча — ошибки не будет.

  - id: too-big
    type: quiz
    title: Какую функцию разбить?
    question: Какую из этих функций стоит разбить на несколько?
    options:
      - "`average(temps)` — возвращает среднюю температуру списка, округлённую до десятых"
      - "`has_digit(password)` — возвращает True, если хотя бы один символ пароля — цифра"
      - "`process()` — спрашивает оценки, считает среднюю, печатает табель, выбирает лучшего"
      - "`print_report(temps)` — печатает отчёт о погоде, а числа для него берёт у других функций"
    correct: 2
    explanation: >-
      У `process()` четыре дела, и одним предложением без «и» её не описать. Такую функцию не
      проверить по частям: чтобы узнать, верно ли считается средняя, придётся вводить оценки и
      читать весь табель. Её стоит разбить, например, на `ask_marks`, `average`, `pick_best` и
      `print_marks`. Остальные три функции делают по одному делу, хотя их описания тоже длинные:
      подробности уточняют, что именно функция делает, а нового дела не добавляют. `print_report`
      печатает, но сама ничего не считает.

  - id: practice-warmest
    type: exercise
    title: Практика 1
    exercise:
      id: m5-l5-e1
      kind: repeat
      title: Самый тёплый день
      statement: |-
        Пётр Андреевич просит добавить в отчёт самую высокую температуру недели. `average` и
        `count_frosty` не трогай: нужны только новая функция и одна строка отчёта.

        1. Допиши функцию `warmest(temps)` — она **возвращает** самую высокую температуру из
           списка. Список не пустой.
        2. Добавь в `print_report` третью строку отчёта, число для неё бери у `warmest`.

        Для недели из программы отчёт такой:

        ```text
        Средняя: 0.1
        Дней с морозом: 3
        Максимум: 4
        ```

        Прежде чем нажимать «Проверить», испытай `warmest` отдельно. В последней строке
        стартового кода есть проверочный вызов: убери перед ним `#`, нажми «Запустить» и сравни
        ответ с ожиданием. Потом верни `#` на место или удали строку.
      input: Функция получает список температур — целые числа, хотя бы одно.
      output: "`warmest` возвращает самую высокую температуру; программа печатает отчёт из трёх строк."
      constraints:
        - Функции `average` и `count_frosty` не меняй.
        - Температуры бывают отрицательными.
      starterCode: |
        def average(temps):
            return round(sum(temps) / len(temps), 1)

        def count_frosty(temps):
            count = 0
            for t in temps:
                if t < 0:
                    count += 1
            return count

        def warmest(temps):
            pass  # верни самую высокую температуру

        def print_report(temps):
            print(f"Средняя: {average(temps)}")
            print(f"Дней с морозом: {count_frosty(temps)}")
            # добавь строку «Максимум: …»

        week = [-3, -1, 2, 4, 0, -2, 1]
        print_report(week)
        # print(warmest([2, 5, -3]), "ожидаю 5")
      tests:
        - id: c1
          kind: call
          title: Пример 1
          example: true
          call: warmest([2, 5, -3])
          expected: "5"
        - id: c2
          kind: call
          title: Пример 2
          example: true
          call: warmest([4, 1])
          expected: "4"
        - id: c3
          kind: call
          title: "Граничный случай: все дни с морозом"
          edge: true
          call: warmest([-5, -2, -9])
          expected: "-2"
        - id: c4
          kind: call
          title: "Граничный случай: один день"
          edge: true
          call: warmest([7])
          expected: "7"
        - id: c5
          kind: call
          title: "Граничный случай: все дни одинаковые"
          edge: true
          call: warmest([3, 3, 3])
          expected: "3"
        - id: c6
          kind: call
          title: "Граничный случай: самый тёплый — последний день"
          edge: true
          call: warmest([-8, 0, 3])
          expected: "3"
        - id: t1
          kind: io
          title: Отчёт за неделю из программы
          example: true
          expected: |-
            Средняя: 0.1
            Дней с морозом: 3
            Максимум: 4
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: a1
          kind: assert
          title: Отчёт по другому списку
          code: |-
            import io, contextlib
            buf = io.StringIO()
            with contextlib.redirect_stdout(buf):
                print_report([5, -1, 3])
            lines = [" ".join(line.split()) for line in buf.getvalue().splitlines() if line.strip()]
            assert lines == ["Средняя: 2.3", "Дней с морозом: 1", "Максимум: 5"]
          message: >-
            Для списка [5, -1, 3] print_report должна напечатать «Средняя: 2.3», «Дней с морозом: 1»
            и «Максимум: 5» — все числа берутся из переданного списка.
      rules:
        - id: r-uses
          use: [call:warmest]
          message: >-
            Строку «Максимум» собирай из вызова `warmest(temps)` — так же, как две первые строки
            берут числа у `average` и `count_frosty`.
      criteria:
        - "`warmest` возвращает самую высокую температуру, в том числе когда все дни морозные или день один."
        - "В отчёте третья строка `Максимум: <число>`, и число в ней даёт вызов `warmest`."
        - "`average` и `count_frosty` не изменились, проверочного вызова в выводе нет."
      hints:
        - >-
          `warmest` ищет рекорд — как в уроке о накопителях. Какую переменную-«рекордсмена» завести
          и чем заполнить её до цикла, чтобы функция работала, даже если вся неделя морозная? И не
          забудь, что функция возвращает рекорд, а печатает его `print_report`.
        - |-
          Тот же приём на словах — самое длинное слово:
          ```python
          def longest(words):
              best = words[0]
              for w in words:
                  if len(w) > len(best):
                      best = w
              return best

          print(longest(["лес", "поляна", "луг"]), "ожидаю поляна")
          ```
          Рекорд начинается с первого элемента, а `return` стоит после цикла. Если помнишь `max`
          из модуля 4, он тоже подойдёт.
        - |-
          Каркас:
          ```text
          def warmest(temps):
              рекорд = первая температура списка
              для каждой t в temps:
                  если t больше рекорда: рекорд = t
              вернуть рекорд

          # в print_report — третья строка по образцу двух первых:
              print(f"Максимум: {…}")
          ```
      solution:
        code: |
          def average(temps):
              return round(sum(temps) / len(temps), 1)

          def count_frosty(temps):
              count = 0
              for t in temps:
                  if t < 0:
                      count += 1
              return count

          def warmest(temps):
              best = temps[0]
              for t in temps:
                  if t > best:
                      best = t
              return best

          def print_report(temps):
              print(f"Средняя: {average(temps)}")
              print(f"Дней с морозом: {count_frosty(temps)}")
              print(f"Максимум: {warmest(temps)}")

          week = [-3, -1, 2, 4, 0, -2, 1]
          print_report(week)
          # print(warmest([2, 5, -3]), "ожидаю 5")
        explanation: >-
          Рекорд начинается с первой температуры списка, а не с нуля: если вся неделя морозная,
          ноль оказался бы больше каждого дня, и функция вернула бы температуру, которой не было.
          `return` стоит после цикла — рекорд отдаётся, когда просмотрены все дни. Короче можно
          написать `return max(temps)`. В отчёт добавилась одна строка, а `average` и
          `count_frosty` остались нетронутыми.
      altSolutions:
        - code: |
            def average(temps):
                return round(sum(temps) / len(temps), 1)

            def count_frosty(temps):
                count = 0
                for t in temps:
                    if t < 0:
                        count += 1
                return count

            def warmest(temps):
                return max(temps)

            def print_report(temps):
                print(f"Средняя: {average(temps)}")
                print(f"Дней с морозом: {count_frosty(temps)}")
                print("Максимум:", warmest(temps))

            week = [-3, -1, 2, 4, 0, -2, 1]
            print_report(week)
          note: max из модуля 4 и print через запятую; проверочная строка удалена.
        - code: |
            def average(temps):
                return round(sum(temps) / len(temps), 1)

            def count_frosty(temps):
                count = 0
                for t in temps:
                    if t < 0:
                        count += 1
                return count

            def warmest(temps):
                highest = temps[0]
                for t in temps[1:]:
                    if highest < t:
                        highest = t
                return highest

            def print_report(temps):
                print(f"Средняя: {average(temps)}")
                print(f"Дней с морозом: {count_frosty(temps)}")
                top = warmest(temps)
                print(f"Максимум: {top}")

            week = [-3, -1, 2, 4, 0, -2, 1]
            print_report(week)
          note: Перебор со второго элемента, сравнение записано наоборот, результат сначала в переменной.
        - code: |
            def average(temps):
                return round(sum(temps) / len(temps), 1)

            def count_frosty(temps):
                count = 0
                for t in temps:
                    if t < 0:
                        count += 1
                return count

            def warmest(temps):
                best = temps[0]
                i = 1
                while i < len(temps):
                    if temps[i] > best:
                        best = temps[i]
