      rules:
        - id: r-uses
          use: [call:is_long_enough, call:has_digit]
          message: >-
            Основная часть должна вызывать `is_long_enough` и `has_digit`, а не повторять
            проверки сама.
      criteria:
        - "`is_long_enough` и `has_digit` возвращают `True` или `False` и ничего не печатают."
        - Пароль ровно из 8 символов считается достаточно длинным; пустой пароль не ломает функции.
        - Основная часть вызывает обе функции, а её вывод совпадает с выводом исходной программы.
      hints:
        - >-
          В программе две проверки, и каждая отвечает на вопрос «да или нет». Найди строки, которые
          относятся к каждой проверке. Что функция-вопрос должна вернуть вместо того, чтобы менять
          переменную или печатать сообщение?
        - |-
          Функция-вопрос на другом примере — есть ли в тексте пробел:
          ```python
          def has_space(text):
              for ch in text:
                  if ch == " ":
                      return True
              return False

          print(has_space("до свидания"), "ожидаю True")
          print(has_space("привет"), "ожидаю False")
          ```
          `return True` можно сказать сразу, как только пробел нашёлся. А `return False` стоит
          после цикла: «нет» можно ответить, только просмотрев все символы.
        - |-
          Каркас:
          ```text
          def is_long_enough(password):
              return <сравнение длины пароля с 8>

          def has_digit(password):
              для каждого символа: если это цифра — вернуть True
              после цикла — вернуть False

          password = input(...)
          problems = 0
          if not is_long_enough(password):
              ... как было ...
          if not has_digit(password):
              ... как было ...
          if problems == 0:
              ...
          ```
      solution:
        code: |
          def is_long_enough(password):
              return len(password) >= 8

          def has_digit(password):
              for ch in password:
                  if ch.isdigit():
                      return True
              return False

          password = input("Придумай пароль: ")
          problems = 0
          if not is_long_enough(password):
              print("Слишком короткий: нужно хотя бы 8 символов")
              problems += 1
          if not has_digit(password):
              print("Нужна хотя бы одна цифра")
              problems += 1
          if problems == 0:
              print("Пароль подходит")
        explanation: >-
          `is_long_enough` возвращает результат сравнения — он сам по себе `True` или `False`.
          `has_digit` отвечает «да», как только нашла цифру, а «нет» — только после цикла, когда
          просмотрены все символы; для пустого пароля цикл не выполнится ни разу, и функция вернёт
          `False`. Основная часть спрашивает `not is_long_enough(...)` — «пароль недостаточно
          длинный?» — и печатает те же сообщения, что раньше.
