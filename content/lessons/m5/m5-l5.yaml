          stdin: "qwerty123\n"
          code: |-
            import io, contextlib
            buf = io.StringIO()
            with contextlib.redirect_stdout(buf):
                is_long_enough("abc")
                is_long_enough("abcdefgh")
                has_digit("abc")
                has_digit("abc1")
            assert buf.getvalue() == ""
          message: >-
