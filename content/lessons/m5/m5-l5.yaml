      mistakes:
        - id: swapped-args
          when:
            errorIncludes: not iterable
            codeRegex: '\bdays_over_limit\s*\(\s*(?:limit|\d+)\s*,'
          where: Порядок аргументов `days_over_limit`
          why: >-
            Аргументы передаются по порядку: первый попадает в первый параметр, второй — во второй.
            Здесь первым стоит лимит, поэтому параметр для списка получает число, и цикл `for` не
            может его перебрать.
          try: >-
            Поставь список первым, а лимит вторым — и в `def days_over_limit(minutes, limit)`, и в
            вызове `days_over_limit(minutes, limit)`.
          verify: "В «Отчёте за неделю из программы» должно появиться «Дней сверх лимита: 2»."
        - id: name-clash
          when:
            codeRegex: '^[ \t]*total[ \t]*=[ \t]*total[ \t]*\('
          where: "Строка `total = total(...)`"
          why: >-
            Переменная получила то же имя, что и функция. Внутри функции присваивание делает имя
            `total` локальным (урок 5.4), и до функции `total` уже не дотянуться — отсюда
            UnboundLocalError. Снаружи функций такая строка просто заменяет функцию числом.
          try: >-
            Назови переменную иначе, например `spent = total(minutes)`, или подставь вызов прямо в
            f-строку.
          verify: Ошибка должна исчезнуть, а отчёт — напечататься.
        - id: no-return
          when:
            codeRegex: 'def[ \t]+(?:total|days_over_limit)\b[^\n]*:[ \t]*(?:#[^\n]*)?\n(?:(?![ \t]+return\b)(?![ \t]+[^\n]*\bprint\s*\()(?:[ \t]+[^\n]*)?\n)*(?:(?=[^ \t\n])|(?![\s\S]))'
          where: Функция без `return`
          why: >-
            В этой функции нет `return`, поэтому она возвращает `None`: проверка получает `None`, а
            в отчёте вместо числа печатается «None». Так бывает, если в функции ещё стоит `pass`
            или ответ посчитан, но его забыли вернуть.
          try: >-
            Если в функции ещё `pass`, замени его телом. В конце, после цикла и на одном уровне с
            `for`, верни результат через `return`.
          verify: "«Пример: сумма» должен вернуть 75, а «Пример: дни сверх лимита» — 1."
        - id: uses-global
          when:
            codeRegex: '(?<=def[ \t]+(?:total|days_over_limit|print_report)[ \t]*\((?![^)]*\bweek\b)[^)]*\)[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?)[ \t]+[^\n#]*\bweek\b'
          where: "`week` внутри функции"
          why: >-
            Внутри функции используется `week` — переменная основной части, а не параметр. Для
            недели из кода ответ совпадает, но с другими данными функция всё равно посчитает
            `week`.
          try: >-
            В `total`, `days_over_limit` и `print_report` работай только с их параметрами —
            `minutes` и `limit`. Неделя и лимит попадают в `print_report` при вызове внизу
            программы.
          verify: Должна пройти проверка «Отчёт по другим данным».
        - id: return-in-loop
          when:
            codeRegex: '^([ \t]*)for\b[^\n]*\n(?:\1[ \t]+[^\n]*\n|[ \t]*\n)*?\1[ \t]+return\b'
          where: "`return` внутри цикла `for`"
          why: >-
            `return` сразу завершает функцию. Он стоит внутри цикла, поэтому функция отвечает
            раньше, чем просмотрит все дни. А если список пустой, цикл не выполнится ни разу, и до
            этого `return` дело не дойдёт.
          try: >-
            Сдвинь `return` влево — на один уровень с `for`: ответ отдаётся, когда просмотрены все
            дни.
          verify: "«Пример: сумма» должен вернуть 75, а «Пример: дни сверх лимита» — 1."
        - id: fixed-limit
          when:
            failedTest: c6
            codeRegex: '(?<=def[ \t]+days_over_limit\b[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?)[ \t]+if\b[^\n]*(?:[<>]=?[ \t]*\d+|\d+[ \t]*[<>])'
          where: Сравнение в `days_over_limit`
          why: >-
            Лимит записан в сравнении числом, а параметр `limit` не используется. Для недели из
            программы ответ совпадает, но с другим лимитом функция всё равно сравнивает минуты с
            тем же числом.
          try: "Сравнивай с параметром: `if m > limit:` — тогда лимит приходит из вызова."
          verify: "«Граничный случай: другой лимит» должен вернуть 3."
        - id: boundary
          when:
            failedTest: c4
            codeIncludes: ">="
          where: Сравнение в `days_over_limit`
          why: >-
            День, когда экранное время ровно 120 минут, — не превышение: договорённость
            соблюдена. Сравнение `>=` считает такой день лишним.
          try: Считай только дни, где минут строго больше лимита.
          verify: "«Граничный случай: ровно лимит» должен вернуть 1."
        - id: no-output
          when:
            outputEquals: ""
          where: "`print_report` и вызов в конце программы"
          why: >-
            Программа ничего не напечатала. `print_report` — функция вывода: она сама печатает обе
            строки отчёта. Если она только возвращает текст, а вызов внизу стоит без `print`,
            текст пропадает.
          try: >-
            Напечатай обе строки внутри `print_report` через `print`, а внизу оставь вызов
            `print_report(week, 120)`.
          verify: В «Отчёте за неделю из программы» должны появиться две строки.
        - id: no-parens
          when:
            outputIncludes: "<function "
          where: Строка отчёта в `print_report`
          why: >-
            В строке отчёта стоит имя функции без скобок. Без скобок функция не вызывается, и
            `print` печатает саму функцию — `<function … at …>`.
          try: "Вызови функцию с аргументами: `total(minutes)`, `days_over_limit(minutes, limit)`."
          verify: В «Отчёте за неделю из программы» должны появиться числа 635 и 2.
        - id: call-as-text
          when:
            outputIncludes: "("
          where: Строка отчёта в `print_report`
          why: >-
            В отчёт попал текст вызова, а не число: вызов стоит внутри строки, как обычные буквы.
            Python вычисляет выражение внутри строки, только если перед кавычкой стоит `f`, а само
            выражение — в фигурных скобках.
          try: >-
            Проверь обе строки отчёта: в `f"Всего за неделю: {total(minutes)} мин"` есть буква `f`
            перед кавычкой и вызов в `{}`.
          verify: В «Отчёте за неделю из программы» должны появиться числа 635 и 2.
        - id: returns-text
          when:
            failedTest: a1
            codeRegex: 'def[ \t]+print_report\b[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?[ \t]+return\b'
          where: Функция `print_report`
          why: >-
            `print_report` возвращает текст отчёта через `return`, а не печатает его. Внизу ты
            печатаешь результат, поэтому отчёт за неделю виден. Но проверка «Отчёт по другим
            данным» вызывает `print_report` без `print` — и на экране ничего не появляется.
          try: >-
            Напечатай обе строки внутри `print_report` через `print`, а внизу вызывай её без
            `print`: `print_report(week, 120)`.
          verify: Должна пройти проверка «Отчёт по другим данным».
        - id: reuse
          when:
            failedRule: r-reuse
            codeRegex: 'def[ \t]+print_report\b'
          where: Функция `print_report`
          why: >-
            В программе не вызывается `total` или `days_over_limit`. Значит, число в отчёте
            посчитано заново, записано готовым — или строки с ним вовсе нет. Копия расчёта опасна:
            исправишь ошибку в функции, а отчёт этого не заметит.
          try: >-
            Проверь, что в отчёте две строки, и подставь в них вызовы `total(minutes)` и
            `days_over_limit(minutes, limit)`.
          verify: >-
            Требование брать числа у `total` и `days_over_limit` должно выполниться, а «Отчёт по
            другим данным» — пройти.
        - id: leftover-check
          when:
            outputIncludes: ожидаю
          where: Строка проверочного вызова
          why: >-
            В выводе осталась строка проверочного вызова — со словом «ожидаю». А тест сравнивает
            весь вывод программы с отчётом.
          try: >-
            Сначала сравни в этой строке ответ функции с ожиданием: не совпали — ищи ошибку в
            функции, совпали — поставь перед строкой `#` или удали её.
          verify: В выводе программы должны остаться только две строки отчёта.
      afterPass: >-
        Программа из трёх частей, и каждая проверена отдельно: два расчёта — вызовами с маленькими
        списками, отчёт — на другой неделе. Если захочешь, добавь функцию `longest_day(minutes)` —
        самое большое время за день — и третью строку отчёта: это одна новая функция и одна строка
        в `print_report`.
      skills: [function-design, functions, accumulators]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Большую задачу делят на функции: одна функция — одно дело. Имя говорит, что функция делает или возвращает (`count_frosty`, `average`), а для «да или нет» — вопрос (`is_frosty`, `has_digit`)."
      - Расчёты получают данные через параметры и возвращают результат; печатает функция вывода или основная часть программы.
      - "Каждую функцию проверяют отдельно на маленьких и граничных данных: `print(count_frosty([-1, 0, 2]), \"ожидаю 1\")`. Потом проверочную строку убирают."
      - Новое требование — новая маленькая функция и одна строка там, где её вызывают; проверенные функции не трогают.
    question: >-
      Почему `has_digit(password)` проще проверить, чем кусок программы, который сам вызывает
      `input()` и печатает сообщения?
    answer: >-
      Функцию можно вызвать прямо в коде с любым паролем — `has_digit("abc1")`, `has_digit("")` —
      и сравнить возвращённое значение с ожиданием. Не нужно каждый раз вводить пароль и читать
      сообщения на экране. Такая проверка занимает секунды, и её легко повторить после любой
      правки.
