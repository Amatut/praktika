      mistakes:
        - id: isdigit-no-parens
          when:
            failedTest: c7
            codeRegex: '\.isdigit\b(?![ \t]*\()'
          where: "`isdigit` в функции `has_digit`"
          why: >-
            После `isdigit` нет скобок. `ch.isdigit` — это сам метод, а не его ответ, и в `if` он
            всегда считается истинным. Поэтому функция отвечает `True` на первом же символе — даже
            для слова «пароль».
          try: "Поставь скобки: `ch.isdigit()` — так метод вызывается и отвечает `True` или `False`."
          verify: "«Цифр нет» должен вернуть False."
        - id: whole-isdigit
          when:
            failedTest: c4
            codeRegex: 'def[ \t]+has_digit\([ \t]*(\w+)[ \t]*\)[\s\S]*?\b\1\.isdigit\(\)'
          where: "`isdigit()` в функции `has_digit`"
          why: >-
            `isdigit()`, вызванный у всего пароля, проверяет, что **все** его символы — цифры. У
            `abc1` это не так, поэтому функция отвечает `False`, хотя цифра в пароле есть.
          try: >-
            Перебери символы пароля в цикле и спроси `isdigit()` у каждого: нашлась цифра — сразу
            верни `True`.
          verify: "«Пример: цифра в конце» должен вернуть True."
        - id: return-false-in-loop
          when:
            failedTest: c4
            codeRegex: '^([ \t]*)for\b[^\n]*\n(?:\1[ \t]+[^\n]*\n|[ \t]*\n)*?\1[ \t]+return[ \t]+False\b'
          where: "`return False` внутри цикла в `has_digit`"
          why: >-
            `return` сразу завершает функцию. `return False` стоит внутри цикла — в ветке `else` или
            сразу после `if`, — поэтому функция отвечает уже на первом символе: для `abc1` она
            говорит `False`, не дойдя до единицы. А для пустого пароля цикл не выполнится ни разу,
            и до этого `return` дело не дойдёт.
          try: >-
            Поставь `return False` после цикла, на одном уровне с `for`, а `else` убери, если он
            есть: «нет» можно ответить, только просмотрев все символы.
          verify: >-
            «Пример: цифра в конце» должен вернуть True, а «Граничный случай: has_digit от пустой
            строки» — False.
        - id: inverted
          when:
            failedTest: c3
            codeRegex: 'return\s+len\s*\([^)]*\)\s*<|if\s+len\s*\([^)]*\)\s*<\s*8\s*:\s*\n\s*return\s+True\b'
          where: "Ответ функции `is_long_enough`"
          why: >-
            Имя `is_long_enough` — вопрос «пароль достаточно длинный?». А функция отвечает на
            обратный вопрос: для пароля из 7 символов возвращает `True`. Основная часть может
            печатать и верно, но любой, кто вызовет функцию по имени, получит неверный ответ.
          try: >-
            Пусть функция возвращает `True` для длинного пароля, а в основной части поставь `not`
            перед её вызовом.
          verify: "«Граничный случай: 7 символов» должен вернуть False."
        - id: forgot-not
          when:
            failedTest: t1
            codeRegex: '^([ \t]*)if[ \t]+is_long_enough[ \t]*\([^\n()]*\)[ \t]*:[ \t]*\n\1[ \t]+print[ \t]*\([ \t]*["'']Слишком|^([ \t]*)if[ \t]+has_digit[ \t]*\([^\n()]*\)[ \t]*:[ \t]*\n\2[ \t]+print[ \t]*\([ \t]*["'']Нужна'
          where: Условие перед сообщением в основной части
          why: >-
            Функция отвечает `True`, когда пароль **подходит** под правило: `is_long_enough` — когда
            он достаточно длинный, `has_digit` — когда цифра есть. А сообщение нужно в обратном
            случае. Старое условие спрашивало «короткий?», а новая функция спрашивает «длинный?» —
            вопрос перевернулся.
          try: >-
            Поставь `not` перед вызовом: `if not is_long_enough(password):` — и так же для
            `has_digit`.
          verify: "«Пример: пароль qwerty» должен напечатать оба сообщения."
        - id: boundary-8
          when:
            failedTest: c2
            codeRegex: 'len\s*\([^)]*\)\s*(?:>|<=)\s*8\b'
          where: Сравнение длины в `is_long_enough`
          why: >-
            В правиле сказано «хотя бы 8 символов», значит, пароль ровно из 8 символов подходит.
            Сравнение `> 8` считает его коротким.
          try: Сравни длину с 8 так, чтобы восьмёрка тоже проходила, — через `>=`.
          verify: "«Граничный случай: ровно 8 символов» должен вернуть True."
        - id: one-answer
          when:
            codeRegex: 'def[ \t]+is_long_enough\b[^\n]*:[ \t]*(?:#[^\n]*)?\n(?:[ \t]*\n)*([ \t]+)if\b[^\n]*\n(?:(?:\1[ \t]+(?![^\n]*\bprint\s*\()[^\n]*)?\n)*(?:(?=[^ \t\n])|(?![\s\S]))'
          where: Функция `is_long_enough`
          why: >-
            Вся функция — одно `if` без `else`, поэтому она отвечает только в одном случае. Когда
            условие не выполняется, функция доходит до конца без `return` и возвращает `None`, а не
            `True` или `False`.
          try: >-
            Добавь второй ответ: `return` после `if`, на одном уровне с ним, или ветку `else`. Можно
            и проще — вернуть само сравнение: оно уже `True` или `False`.
          verify: >-
            «Пример: короткий пароль» должен вернуть False, а «Граничный случай: ровно 8 символов» —
            True.
        - id: no-return-false
          when:
            failedTest: c7
            codeRegex: 'def[ \t]+has_digit\b(?:(?!\n\S)[\s\S])*?\breturn[ \t]+True\b(?:(?!\n\S)(?!return[ \t]+False\b)[\s\S])*(?:\n(?=\S)|(?![\s\S]))'
          where: Конец функции `has_digit`
          why: >-
            Когда цифры нет, цикл заканчивается, а после него в `has_digit` нет `return False`, и
            функция возвращает `None`. Основная часть при этом может печатать верно, но
            функция-вопрос должна ответить именно `False`.
          try: Добавь `return False` после цикла, на одном уровне с `for`.
          verify: >-
            «Цифр нет» и «Граничный случай: has_digit от пустой строки» должны вернуть False.
        - id: no-parens-call
          when:
            codeRegex: '^[^#\n]*\b(?:is_long_enough|has_digit)\b(?![ \t]*\()'
          where: Вызов функции в основной части
          why: >-
            После имени функции нет скобок, поэтому функция не вызывается: в условие попадает сама
            функция, а не её ответ про пароль. Сама функция всегда считается истинной, так что
            `not is_long_enough` всегда даёт `False`, и сообщение не печатается.
          try: >-
            Вызови функцию с паролем: `if not is_long_enough(password):` — и так же для
            `has_digit`.
          verify: "«Пример: пароль qwerty» должен напечатать оба сообщения."
        - id: unused
          when:
            failedRule: r-uses
            codeRegex: '(?<=def[ \t]+is_long_enough\b[\s\S]*)(?<=def[ \t]+has_digit\b[\s\S]*)^(?![ \t#\n]|def\b)[^\n]+'
          where: Основная часть программы
          why: >-
            Функции объявлены, но основная часть не вызывает одну из них или обе и проверяет сама.
            Получились две копии одной логики: поменяешь правило в функции — программа этого не
            заметит.
          try: >-
            Замени проверки в основной части вызовами функций: `if not is_long_enough(password):` и
            такой же вызов для цифр. Цикл по символам останется только внутри `has_digit`.
          verify: >-
            Требование вызывать `is_long_enough` и `has_digit` должно выполниться, а вывод на всех
            примерах — остаться прежним.
        - id: prints-inside
          when:
            failedTest: a1
            codeRegex: '(?<=def[ \t]+(?:is_long_enough|has_digit)\b[^\n]*\n(?:(?:[ \t]+[^\n]*)?\n)*?)[ \t]+print\s*\('
          where: Функции `is_long_enough` и `has_digit`
          why: >-
            Функция-вопрос сама печатает сообщение. А её дело — только ответить `True` или `False`
            через `return`. Тогда её можно вызвать где угодно — в проверочном вызове, в другой
            проверке — без лишнего текста на экране.
          try: >-
            Пусть функции только возвращают ответ через `return`, а `print` с сообщениями останется
            в основной части — как в исходной программе.
          verify: Должна пройти проверка «Функции ничего не печатают».
        - id: leftover-check
          when:
            outputIncludes: ожидаю
          where: Строка проверочного вызова
          why: >-
            В выводе осталась строка проверочного вызова — со словом «ожидаю». А тест сравнивает
            весь вывод программы с сообщениями о пароле.
          try: >-
            Сначала сравни в этой строке ответ функции с ожиданием: не совпали — ищи ошибку в
            функции, совпали — поставь перед строкой `#` или удали её.
          verify: В выводе программы должны остаться только сообщения о пароле.
      afterPass: >-
        Вывод программы тот же, но проверки теперь названы: `if not has_digit(password)` читается
        почти как фраза. Новое правило, например «есть заглавная буква», — это ещё одна маленькая
        функция-вопрос и одна проверка в основной части.
      skills: [function-design, functions, boolean-logic]

  - id: plan-screen
    type: quiz
    title: План до кода
    question: >-
      Следующая задача: по экранному времени за неделю (минуты по дням) и дневному лимиту
      напечатать отчёт — сколько минут всего и сколько дней лимит был превышен. Какой план
      лучше?
    options:
      - "Одна функция `report(minutes, limit)`: считает сумму, считает дни сверх лимита и печатает обе строки"
      - "`total(minutes)` и `days_over_limit(minutes, limit)` возвращают числа, а `print_report(minutes, limit)` их печатает"
      - "`total(minutes)` печатает сумму минут, а `days_over_limit(minutes, limit)` печатает число дней сверх лимита"
      - "`total()` и `days_over_limit()` берут список `week` и лимит 120 прямо из программы, `print_report()` печатает"
    correct: 1
    explanation: >-
      Во втором плане у каждой функции одно дело: два расчёта получают данные через параметры и
      возвращают числа, а печатает только функция вывода. Расчёты легко проверить отдельно —
      `print(total([30, 45]), "ожидаю 75")`. В первом плане три дела в одной функции. В третьем
      расчёты печатают сами, и их ответ нельзя подставить в отчёт или в условие. В четвёртом
      функции привязаны к одной неделе и одному лимиту — с другими данными их не вызвать.
    coach: >-
      Сначала план словами, потом код: так видно, какие функции нужны и что каждая получает.

  - id: practice-screen
    type: exercise
    title: Практика 3
    exercise:
      id: m5-l5-e3
      kind: write
      title: Экранное время за неделю
      statement: |-
        В семье договорились: не больше 120 минут за экраном телефона в день. Телефон записывает
        экранное время по дням, а нужен короткий отчёт за неделю. Напиши три функции — по плану
        из вопроса выше:

        - `total(minutes)` — **возвращает** сумму минут за все дни;
        - `days_over_limit(minutes, limit)` — **возвращает**, сколько дней время было **больше**
          лимита (ровно лимит — не превышение);
        - `print_report(minutes, limit)` — **печатает** отчёт из двух строк, а числа берёт у двух
          первых функций.

        Для недели из стартового кода и лимита 120 отчёт такой:

        ```text
        Всего за неделю: 635 мин
        Дней сверх лимита: 2
        ```
      input: >-
        Функции получают список минут по дням (целые неотрицательные числа, список может быть
        пустым), а две последние — ещё и лимит.
      output: "Две строки: `Всего за неделю: <сумма> мин` и `Дней сверх лимита: <число>`."
      constraints:
        - "`total` и `days_over_limit` ничего не печатают — только возвращают число."
        - "`total`, `days_over_limit` и `print_report` работают со своими параметрами, а не с переменной `week`."
        - Проверочные вызовы писать можно, но перед проверкой убери их.
      starterCode: |
        # Напиши здесь функции total, days_over_limit и print_report

        week = [45, 150, 0, 90, 200, 120, 30]
        print_report(week, 120)
      tests:
        - id: c1
          kind: call
          title: "Пример: сумма"
          example: true
          call: total([30, 45])
          expected: "75"
        - id: c2
          kind: call
          title: "Граничный случай: пустая неделя"
          edge: true
          call: total([])
          expected: "0"
        - id: c3
          kind: call
          title: "Пример: дни сверх лимита"
          example: true
          call: days_over_limit([150, 60, 120], 120)
          expected: "1"
        - id: c4
          kind: call
          title: "Граничный случай: ровно лимит"
          edge: true
          call: days_over_limit([120, 121, 119], 120)
          expected: "1"
        - id: c5
          kind: call
          title: "Граничный случай: пустой список"
          edge: true
          call: days_over_limit([], 60)
          expected: "0"
        - id: c6
          kind: call
          title: "Граничный случай: другой лимит"
          edge: true
          call: days_over_limit([100, 90, 70, 60], 60)
          expected: "3"
        - id: t1
          kind: io
          title: Отчёт за неделю из программы
          example: true
          expected: |-
            Всего за неделю: 635 мин
            Дней сверх лимита: 2
          compare:
            ignoreSpaces: true
            ignoreBlankLines: true
        - id: a1
          kind: assert
          title: Отчёт по другим данным
          code: |-
            import io, contextlib
            buf = io.StringIO()
            with contextlib.redirect_stdout(buf):
                print_report([100, 200, 50], 50)
            lines = [" ".join(line.split()) for line in buf.getvalue().splitlines() if line.strip()]
            assert lines == ["Всего за неделю: 350 мин", "Дней сверх лимита: 2"]
          message: >-
            print_report должна работать с любыми данными: для списка [100, 200, 50] и лимита 50
            отчёт — «Всего за неделю: 350 мин» и «Дней сверх лимита: 2».
      rules:
        - id: r-reuse
          use: [call:total, call:days_over_limit]
          message: >-
            `print_report` должна брать числа у `total` и `days_over_limit`, а не считать их
            заново.
      criteria:
        - "`total` и `days_over_limit` возвращают числа и ничего не печатают; для пустого списка ответ 0."
        - День ровно с лимитом не считается превышением.
        - "`print_report` печатает две строки отчёта и берёт числа у `total` и `days_over_limit`."
        - Функции работают со своими параметрами, поэтому отчёт верен для любой недели и любого лимита.
