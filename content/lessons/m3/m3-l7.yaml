id: m3-l7
module: m3
number: "3.7"
title: "Самостоятельная работа: тренажёр таблицы умножения"
objective: >-
  Самостоятельно написать программу с циклом, счётчиками, случайными числами и досрочным
  выходом и по трассировке найти ошибку на единицу в чужом цикле.
minutes: [20, 30]
prerequisites: [m3-l6]
skills: [for-range, accumulators, loop-control, import-basics, while-loops, loop-tracing]
environment: python

story:
  title: Карточки на холодильнике
  fictional: true
  text: >-
    Младшая сестра Тимура, третьеклассница Соня, учит таблицу умножения по карточкам: они висят
    на холодильнике, и каждый вечер мама снимает их по одной и спрашивает. Карточки теряются, мама
    устаёт, а верные ответы считают на пальцах и сбиваются. Тимур — тот самый, что копил на
    велосипед, — после темы про циклы написал тренажёр: компьютер сам придумывает пример,
    проверяет ответ и в конце говорит, сколько было верных. Сегодня ты напишешь такой тренажёр
    сам — от пустого файла до зелёной проверки.

why: >-
  Самостоятельная работа показывает, что уже получается без подсказок: повторить действие нужное
  число раз, досрочно выйти из цикла, посчитать итог и взять случайные числа. Из таких частей
  собирают тренажёры, викторины и простые игры.

usedIn: >-
  Обучающие приложения и тренажёры, викторины, игры с раундами и счётом. Каркас «N раундов, счёт
  и досрочный выход» пригодится в проекте «Калькулятор или консольная викторина» после модуля 4.

steps:
  - id: reminder
    type: theory
    title: Перед стартом
    body: |-
      Сегодня самостоятельная работа — финиш модуля «Циклы». Главную программу ты пишешь с нуля,
      а во второй задаче ищешь ошибки в чужом цикле. Подсказки в обоих заданиях откроются только
      после первой проверки. Это не запрет на помощь — просто сначала попробуй сам.

      Всё нужное ты уже знаешь:

      - `while условие:` повторяет тело, пока условие верно. Внутри должно меняться то, от чего
        условие зависит, иначе цикл не кончится.
      - `for i in range(a, b):` перебирает a, a + 1, …, b − 1 — правая граница не входит. Чтобы
        дойти до n включительно, пиши `range(1, n + 1)`.
      - Счётчик и накопитель: начальное значение — до цикла, обновление — внутри, итог — после.
      - `break` сразу выходит из цикла, `continue` пропускает остаток шага и переходит к
        следующему.
      - Слово из ввода сравнивают как строку: `answer == "стоп"`. А `int("стоп")` — это
        ValueError.
      - `import random` пишут в начале программы. `random.randint(a, b)` даёт целое число от a до
        b, **обе границы входят**. В проверке каждый тест задаёт зерно, поэтому «случайные» числа
        в нём всегда одни и те же. С примером они совпадут, если вызывать `randint` столько раз и
        в том порядке, как сказано в условии. Сам `random.seed` не вызывай.
      - Ошибка на единицу прячется на первом и последнем шаге цикла. Трассировочная таблица её
        показывает.

      Как работать над заданием:

      1. Прочитай условие и примеры: что приходит на вход, что печатается и в каком порядке.
      2. Составь план: что делается до цикла, что повторяется на каждом шаге, что печатается
         после.
      3. Нажми «Запустить». В поле «Ввод для „Запустить“» уже стоит ввод из первого примера, и
         случайные числа будут те же, что в нём. Сравни вывод с примером построчно.
      4. Когда вывод совпал — нажми «Проверить».

      Если на вторую задачу не осталось сил, вернись к ней завтра — это нормально.
    simpler: >-
      Нового материала сегодня нет. Собери из знакомых частей — цикла, счётчиков, break и random —
      одну программу. Сначала план «до цикла / в цикле / после», потом код, потом «Запустить» с
      вводом из примера.
    coach: >-
      Ошибиться на первой попытке нормально. Самостоятельная работа показывает, что уже
      получается само, а что стоит повторить.

  - id: warmup
    type: predict
    title: Разминка
    prompt: >-
      Разомнись на трассировке: сколько раз выполнится тело цикла и что останется в `n` после
      него? Как думаешь, что выведет программа?
    code: |-
      count = 0
      for n in range(10, 0, -3):
          count = count + 1
      print(count, n)
    options:
      - "3 1"
      - "4 1"
      - "4 -2"
    answer: "4 1"
    explanation: |-
      Выпиши шаги в таблицу:

      ```text
      шаг   n    count
      1     10   1
      2     7    2
      3     4    3
      4     1    4
      ```

      Следующим было бы -2, но оно уже за границей 0, и range его не выдаёт. Тело выполнилось
      4 раза. После цикла в переменной цикла остаётся последнее значение, которое она получила, то
      есть 1. Ответ «4 -2» — привычка от while: там ты сам вычисляешь следующее значение, и после
      цикла в переменной лежит первое, при котором условие ложно. Ответ «3 1» — ловушка из
      правила забора: от 10 до 1 три промежутка по 3, а значений, на которых выполняется тело, на
      одно больше — четыре.
    coach: >-
      Сначала первое и последнее значение, потом количество шагов — так проверяется любой range.

  - id: plan
    type: order
    title: "План: сколько шестёрок"
    prompt: >-
      Перед большой задачей разложи на шаги задачу поменьше. Программа бросает кубик n раз и
      считает, сколько раз выпала шестёрка. Расставь действия программы по порядку.
    items:
      - id: import
        text: Подключить модуль random
      - id: read
        text: Прочитать n — сколько раз бросать кубик
      - id: counter
        text: Завести счётчик шестёрок и положить в него 0
      - id: loop
        text: "Повторить n раз то, что ниже:"
      - id: roll
        text: "…бросить кубик: random.randint(1, 6)"
      - id: check
        text: …если выпала шестёрка — прибавить 1 к счётчику
      - id: show
        text: После цикла вывести счётчик
    before:
      - [import, loop]
      - [read, loop]
      - [counter, loop]
      - [loop, roll]
      - [roll, check]
      - [check, show]
    explanation: >-
      Модуль подключают до первого использования — обычно самой первой строкой. Число n и
      счётчик нужны до цикла: range берёт n, а счётчик должен появиться один раз и не обнуляться
      на каждом шаге. Между собой их можно поменять местами. Бросок и проверка — внутри цикла,
      именно в таком порядке: проверить можно только то, что уже выпало. Итог печатается один
      раз, после цикла.
    coach: >-
      Разложи так же и тренажёр: что до цикла, что повторяется для каждого вопроса, что после.

  - id: main-task
    type: exercise
    title: Самостоятельная работа
    exercise:
      id: m3-l7-e1
      kind: write
      title: Тренажёр таблицы умножения
      statement: |-
        Напиши тренажёр таблицы умножения для Сони.

        Программа читает n — сколько вопросов задать. Для каждого вопроса она берёт два
        множителя — `random.randint(2, 9)`, сначала первый, потом второй, — печатает вопрос и
        читает ответ:

        - если ответ — `стоп`, тренировка сразу заканчивается, а этот вопрос не считается;
        - если ответ верный — печатает `Верно!`;
        - если неверный — `Неверно, правильно: <произведение>`.

        В конце — строка `Правильных ответов: X из Y`, где Y — сколько вопросов получили ответ
        («стоп» не в счёт). Начало вывода выглядит так:

        ```text
        Вопрос 1: 4 * 3 = ?
        Верно!
        Вопрос 2: 6 * 3 = ?
        Неверно, правильно: 18
        ```

        Зерно для случайных чисел задаёт проверка, поэтому вопросы в примерах проверки всегда
        одни и те же. «Запустить» использует те же числа, что «Пример 1».
      input: >-
        Первая строка — n, сколько вопросов (от 0 до 20). Дальше по строке на каждый вопрос: ответ
        — целое число или слово `стоп` (точно так, маленькими буквами).
      output: >-
        Для каждого вопроса — строка `Вопрос k: a * b = ?`, затем `Верно!` или `Неверно, правильно:
        <произведение>`. В конце — `Правильных ответов: X из Y`.
      constraints:
        - "На каждый вопрос — два вызова `random.randint(2, 9)`: сначала первый множитель, потом второй. Сам `random.seed` не вызывай — зерно задаёт проверка."
        - Вопрос печатай через `print`, а ответ читай отдельным `input()` — текст внутри `input(...)` в проверку не попадает.
        - Подсказки откроются после первой проверки — сначала попробуй сам.
      seed: 1
      starterCode: |
        # Тренажёр таблицы умножения
        # Ввод: n — сколько вопросов, дальше ответы (числа или «стоп»)
        # Множители: два вызова random.randint от 2 до 9 — сначала первый, потом второй

      tests:
        - id: t1
          kind: io
          compare: { ignoreBlankLines: true, ignoreSpaces: true }
          title: Пример 1
          example: true
          seed: 1
          stdin: "3\n12\n17\n81\n"
          expected: |-
            Вопрос 1: 4 * 3 = ?
            Верно!
            Вопрос 2: 6 * 3 = ?
            Неверно, правильно: 18
            Вопрос 3: 9 * 9 = ?
            Верно!
            Правильных ответов: 2 из 3
        - id: t2
          kind: io
          compare: { ignoreBlankLines: true, ignoreSpaces: true }
          title: "Пример 2: «стоп» на втором вопросе"
          example: true
          seed: 3
          stdin: "2\n20\nстоп\n"
          expected: |-
            Вопрос 1: 5 * 4 = ?
            Верно!
            Вопрос 2: 7 * 9 = ?
            Правильных ответов: 1 из 1
        - id: t3
          kind: io
          compare: { ignoreBlankLines: true, ignoreSpaces: true }
          title: Все ответы верные
          seed: 4
          stdin: "4\n30\n24\n36\n9\n"
          expected: |-
            Вопрос 1: 5 * 6 = ?
            Верно!
            Вопрос 2: 3 * 8 = ?
            Верно!
            Вопрос 3: 9 * 4 = ?
            Верно!
            Вопрос 4: 3 * 3 = ?
            Верно!
            Правильных ответов: 4 из 4
        - id: t4
          kind: io
          compare: { ignoreBlankLines: true, ignoreSpaces: true }
          title: "Граничный случай: ноль вопросов"
          edge: true
          seed: 5
          stdin: "0\n"
          expected: "Правильных ответов: 0 из 0"
        - id: t5
          kind: io
          compare: { ignoreBlankLines: true, ignoreSpaces: true }
          title: "Граничный случай: «стоп» на первом вопросе"
          edge: true
          seed: 7
          stdin: "5\nстоп\n"
          expected: |-
            Вопрос 1: 7 * 4 = ?
            Правильных ответов: 0 из 0
        - id: t6
          kind: io
          compare: { ignoreBlankLines: true, ignoreSpaces: true }
          title: Неверный ответ на последний вопрос
          seed: 7
          stdin: "3\n28\n16\n10\n"
          expected: |-
            Вопрос 1: 7 * 4 = ?
            Верно!
            Вопрос 2: 8 * 2 = ?
            Верно!
            Вопрос 3: 3 * 3 = ?
            Неверно, правильно: 9
            Правильных ответов: 2 из 3
        - id: t7
          kind: io
          compare: { ignoreBlankLines: true, ignoreSpaces: true }
          title: "Граничный случай: один вопрос"
          edge: true
          seed: 56
          stdin: "1\n18\n"
          expected: |-
            Вопрос 1: 2 * 9 = ?
            Верно!
            Правильных ответов: 1 из 1
      criteria:
        - "Вопросы нумеруются с 1, на каждый — два вызова `random.randint(2, 9)`: сначала первый множитель, потом второй."
        - Вопрос печатается через `print`, ответ читается отдельным `input()`.
        - «Стоп» проверяется до превращения ответа в число и сразу заканчивает тренировку; этот вопрос не считается.
        - "Итог «X из Y» печатается один раз, после цикла; Y — число вопросов, на которые дан ответ."
        - n = 0 и «стоп» на первом вопросе не ломают программу.
      hints:
        - >-
          Разложи программу на три части, как в плане с шестёрками: что делается один раз до
          цикла, что повторяется для каждого вопроса и что печатается один раз после. И реши, в
          какой момент проверять «стоп» — до превращения ответа в число или после?
        - |-
          Тот же приём на другой задаче. Пункт выдачи принимает не больше 5 заказов; слово
          «хватит» заканчивает приём, а считаются только принятые заказы:

          ```python
          orders = 0
          for i in range(1, 6):
              line = input()
              if line == "хватит":
                  break
              orders = orders + 1
              print(f"Заказ {i}: {int(line)} шт.")
          print(f"Принято заказов: {orders}")
          ```

          Слово проверяется раньше, чем `int()`, а счётчик растёт уже после проверки — туда
          `break` не пускает.
        - |-
          Каркас:

          ```text
          import random
          n = …
          asked = 0
          correct = 0
          for question in range(1, n + 1):
              a = …   (первый вызов random.randint(2, 9))
              b = …   (второй вызов)
              print(f"Вопрос {question}: …")
              answer = input()
              если answer == "стоп" → break
              asked увеличить на 1
              если int(answer) равно a * b → «Верно!» и correct + 1
              иначе → f"Неверно, правильно: {…}"
          после цикла: print(f"Правильных ответов: {correct} из {asked}")
          ```
      solution:
        code: |
          import random

          n = int(input())
          asked = 0
          correct = 0
          for question in range(1, n + 1):
              a = random.randint(2, 9)
              b = random.randint(2, 9)
              print(f"Вопрос {question}: {a} * {b} = ?")
              answer = input()
              if answer == "стоп":
                  break
              asked = asked + 1
              if int(answer) == a * b:
                  print("Верно!")
                  correct = correct + 1
              else:
                  print(f"Неверно, правильно: {a * b}")
          print(f"Правильных ответов: {correct} из {asked}")
        explanation: >-
          Число вопросов известно заранее, поэтому здесь цикл `for` с `range(1, n + 1)`: номера
          сразу идут с 1, а при n = 0 тело не выполнится ни разу. Множители сохраняются в `a` и
          `b`: они нужны дважды — в вопросе и в проверке. Ответ сначала сравнивается со словом
          «стоп» как строка и только потом превращается в число. Счётчик `asked` растёт после
          проверки на «стоп», поэтому вопрос со «стоп» в итог не попадает. Итог печатается один
          раз, после цикла.
      altSolutions:
        - code: |
            import random

            n = int(input())
            question = 1
            asked = 0
            correct = 0
            while question <= n:
                a = random.randint(2, 9)
                b = random.randint(2, 9)
                print(f"Вопрос {question}: {a} * {b} = ?")
                answer = input()
                if answer == "стоп":
                    break
                asked += 1
                if int(answer) == a * b:
                    print("Верно!")
                    correct += 1
                else:
                    print(f"Неверно, правильно: {a * b}")
                question += 1
            print(f"Правильных ответов: {correct} из {asked}")
          note: while со счётчиком вопросов и +=.
        - code: |
            from random import randint

            n = int(input())
            correct = 0
            wrong = 0
            for i in range(n):
                a = randint(2, 9)
                b = randint(2, 9)
                right = a * b
                print(f"Вопрос {i + 1}: {a} * {b} = ?")
                answer = input("Ответ: ")
                if answer == "стоп":
                    break
                if int(answer) == right:
                    print("Верно!")
                    correct = correct + 1
                else:
                    print(f"Неверно, правильно: {right}")
                    wrong = wrong + 1
            print(f"Правильных ответов: {correct} из {correct + wrong}")
          note: from random import randint, range(n) с номером i + 1, Y как сумма верных и неверных, подсказка в input().
        - code: |
