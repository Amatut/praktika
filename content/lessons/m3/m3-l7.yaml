      mistakes:
        - id: own-seed
          when:
            codeRegex: '^[^#\n]*\bseed\s*\('
          where: Строка с `random.seed`
          why: >-
            Зерно уже задаёт проверка, в каждом тесте своё. Твой `random.seed(...)` заменяет его:
            во всех тестах выпадают те же числа, что в «Примере 1», а ответы в остальных тестах
            рассчитаны на другие вопросы.
          try: >-
            Удали строку с `random.seed`. «Запустить» и без неё берёт числа «Примера 1».
          verify: "«Пример 2» начинается с «Вопрос 1: 5 * 4 = ?»."
        - id: int-before-stop
          when:
            errorType: ValueError
            errorIncludes: "'стоп'"
          where: Строка, где ответ превращается в число
          why: >-
            Слово «стоп» попало в `int()`, а превратить его в число нельзя — отсюда ValueError.
            Значит, проверка на «стоп» не сработала: её нет, она стоит после `int()` или слово в
            ней записано иначе, чем во вводе.
          try: >-
            Прочитай ответ как строку и сначала сравни его с `"стоп"` — точно так, маленькими
            буквами. Только если это не «стоп», вызывай `int(answer)`.
          verify: "«Пример 2» не падает и заканчивается строкой «Правильных ответов: 1 из 1»."
        - id: stop-continues
          when:
            errorType: EOFError
            codeRegex: 'стоп["''][^\n]*:\s*continue\b'
          where: Ветка, где проверяется «стоп»
          why: >-
            После «стоп» стоит `continue`: он пропускает только остаток шага, и цикл задаёт
            следующий вопрос. Ввода больше нет, поэтому `input()` падает с EOFError.
          try: «Стоп» заканчивает всю тренировку — для выхода из цикла нужен `break`.
          verify: "В граничном случае со «стоп» на первом вопросе после вопроса сразу идёт «Правильных ответов: 0 из 0»."
        - id: extra-input
          when:
            errorType: EOFError
          why: >-
            Программа ждёт строку ввода, которой уже нет, — EOFError. Значит, `input()`
            вызывается больше раз, чем строк во вводе: цикл делает лишний шаг или на один вопрос
            читаются две строки.
          try: >-
            Посчитай вызовы `input()`: один — для n и ровно один — на каждый вопрос. Ответ
            прочитай один раз в переменную и дальше работай с ней. Проверь и сам цикл: вопросов
            ровно n — у `range` конец `n + 1`, у `while` сверь условие с тем, где растёт номер.
          verify: "«Пример 1» проходит без ошибки: три вопроса и итог."
        - id: n-text
          when:
            errorType: TypeError
            outputEquals: ""
          where: Строка, где читается n
          why: >-
            Программа упала ещё до первого вопроса: n осталось строкой. `input()` всегда
            возвращает текст, а `range` нужно целое число.
          try: Преврати ввод в число сразу при чтении — `n = int(input())`.
          verify: "«Пример 1» печатает три вопроса и итог."
        - id: question-in-input
          when:
            failedTest: t1
            codeRegex: 'input\(\s*f?["'']Вопрос'
          where: Строка с `input(...)`
          why: >-
            Вопрос стоит внутри `input(...)`. Текст в скобках `input(...)` — подсказка для
            человека, в проверку он не входит: сравнивается только то, что напечатал `print`.
            Поэтому строк «Вопрос …» проверка не видит.
          try: Напечатай вопрос отдельным `print(...)`, а ответ читай пустым `input()`.
          verify: "Первая строка «Примера 1» — «Вопрос 1: 4 * 3 = ?»."
        - id: bounds
          when:
            codeRegex: '(?<!#[^\n]*)randint\(\s*(?!2\s*,\s*9\s*\))-?\d+\s*,\s*-?\d+\s*\)'
          where: Вызовы `random.randint`
          why: >-
            Множители берутся не из `random.randint(2, 9)`. Даже с тем же зерном тогда выпадают
            другие числа — иногда почти те же, но рано или поздно вопросы расходятся с примером.
            У randint обе границы входят — это не range, и 9 не нужно записывать как 10.
          try: Для каждого множителя вызывай ровно `random.randint(2, 9)`.
          verify: "В «Примере 2» вопросы 5 * 4 и 7 * 9, а в граничном случае «один вопрос» — 2 * 9."
        - id: roll-once
          when:
            outputIncludes: "Вопрос 1: 4 * 3 = ?\nВерно!\nВопрос 2: 4 * 3 = ?"
          where: Вызовы `random.randint`
          why: >-
            Все вопросы одинаковые: множители выбраны один раз, до цикла. Цикл повторяет только
            то, что внутри него, поэтому новые числа не выпадают.
          try: Перенеси оба вызова `random.randint(2, 9)` внутрь цикла, перед печатью вопроса.
          verify: "В «Примере 1» вопросы 4 * 3, 6 * 3 и 9 * 9."
        - id: extra-randint
          when:
            failedTest: t1
            codeRegex: '(?<!#[^\n]*)randint\s*\([\s\S]*(?<!#[^\n]*)randint\s*\([\s\S]*(?<!#[^\n]*)randint\s*\('
          where: Вызовы `random.randint`
          why: >-
            randint вызывается больше двух раз на вопрос. Каждый вызов — новое случайное число:
            для проверки берутся не те числа, что в вопросе, а все следующие вопросы сдвигаются.
          try: >-
            Брось множители один раз: сохрани их в переменные `a` и `b` и используй эти
            переменные и в вопросе, и в проверке.
          verify: "В «Примере 1» вопросы 4 * 3, 6 * 3 и 9 * 9, а на ответ 12 — «Верно!»."
        - id: reset-inside
          when:
            failedTest: t1
            codeRegex: '^[ \t]+\w+\s*=\s*0\s*$'
          where: Строка со счётчиком внутри цикла
          why: >-
            Счётчик получает 0 внутри цикла, то есть заново на каждом вопросе, и всё, что он
            накопил раньше, стирается. В итог попадает только последний вопрос.
          try: Перенеси `= 0` выше цикла — счётчик создаётся один раз, до первого вопроса.
          verify: "«Пример 1» заканчивается строкой «Правильных ответов: 2 из 3»."
        - id: from-zero
          when:
            outputIncludes: "Вопрос 0:"
          where: Цикл и номер вопроса
          why: >-
            Вопросы нумеруются с нуля: `range(n)` начинает с 0 — или номер печатается раньше,
            чем увеличивается.
          try: Начни нумерацию с 1, например `range(1, n + 1)`, или печатай номер на 1 больше.
          verify: "Первая строка «Примера 1» — «Вопрос 1: 4 * 3 = ?»."
        - id: no-int
          when:
            failedTest: t1
            outputIncludes: "Неверно, правильно: 12\nВопрос 2"
          where: Проверка ответа
          why: >-
            На верный ответ 12 программа сказала «Неверно», значит, сравнение не работает. Чаще
            всего причина такая: `input()` вернул строку `"12"`, а `a * b` — число 12, и строка
            никогда не равна числу.
          try: Сравнивай число с числом — `int(answer)`, но только после проверки на «стоп».
          verify: "В «Примере 1» после первого вопроса — «Верно!»."
        - id: total-inside
          when:
            outputIncludes: "Правильных ответов: 1 из 1\nВопрос 2"
          where: Строка с итогом
          why: >-
            Итог печатается после каждого вопроса: строка с `print` стоит внутри цикла, у неё
            отступ.
          try: Убери отступ у строки с итогом — тогда она выполнится один раз, после цикла.
          verify: "В «Примере 1» строка «Правильных ответов» одна — последняя."
        - id: correct-always
          when:
            outputIncludes: "Неверно, правильно: 18\nВопрос 3: 9 * 9 = ?\nВерно!\nПравильных ответов: 3 из 3"
          where: Строка, где растёт счётчик верных ответов
          why: >-
            В «Примере 1» на второй вопрос ответ неверный, а в итоге «3 из 3»: счётчик верных
            вырос и за неверный ответ. Похоже, `correct = correct + 1` стоит не в ветке «Верно!»,
            а после всего if/else.
          try: >-
            Перенеси увеличение счётчика верных в ветку, где печатается «Верно!», — с тем же
            отступом, что у этого print.
          verify: "«Пример 1» заканчивается строкой «Правильных ответов: 2 из 3»."
        - id: total-twice
          when:
            outputIncludes: "Правильных ответов: 1 из 1\nПравильных ответов: 1 из 1"
          where: Ветка, где проверяется «стоп»
          why: >-
            После «стоп» итог напечатан дважды: в ветке «стоп» и после цикла. `break` и так
            переходит к строкам после цикла.
          try: Оставь в ветке «стоп» только `break` — итог печатается один раз, после цикла.
          verify: "«Пример 2» заканчивается одной строкой «Правильных ответов: 1 из 1»."
        - id: one-short
          when:
            outputIncludes: "Неверно, правильно: 18\nПравильных ответов:"
          where: Границы цикла
          why: >-
            В «Примере 1» n = 3, а вопросов задано только два. Цикл делает на шаг меньше: у
            `range(1, n)` правая граница не входит, и последнего вопроса нет (у while так бывает
            с `<` вместо `<=`).
          try: Чтобы номера шли от 1 до n включительно, конец range должен быть `n + 1`.
          verify: "В «Примере 1» три вопроса и итог «2 из 3»."
        - id: stop-counted
          when:
            outputIncludes: "Вопрос 2: 7 * 9 = ?\nПравильных ответов: 1 из 2"
          where: Счётчик отвеченных вопросов
          why: >-
            В «Примере 2» ответ дан на один вопрос, а в итоге «из 2»: вопрос, на который ввели
            «стоп», попал в Y. Так бывает, если вместо счётчика отвеченных стоит n или номер
            вопроса из переменной цикла, или если счётчик растёт раньше проверки на «стоп».
          try: >-
            Заведи счётчик отвеченных вопросов и увеличивай его после проверки на «стоп» — туда
            `break` уже не пустит.
          verify: "«Пример 2» заканчивается строкой «Правильных ответов: 1 из 1»."
        - id: loop-var-empty
          when:
            errorType: NameError
            failedTest: t4
            codeRegex: '(?<=^for\s+(\w+)\s+in\b[\s\S]*)^(?![ \t#])[^\n]*\b\1\b'
          where: Строка после цикла, где используется переменная цикла
          why: >-
            При n = 0 range пустой: тело цикла не выполнилось ни разу, и переменная цикла так и
            не получила значения. Строка после цикла обращается к ней — отсюда NameError.
          try: >-
            Номер вопроса для Y не подходит. Заведи до цикла отдельный счётчик отвеченных
            вопросов и увеличивай его после проверки на «стоп».
          verify: "«Граничный случай: ноль вопросов» печатает «Правильных ответов: 0 из 0»."
      afterPass: >-
        Тренажёр готов, и написал его ты сам: цикл на n вопросов, два счётчика, случайные примеры
        и досрочный выход по «стоп». Улучшение на будущее — печатать в конце процент верных
        ответов. Подумай, что делать, если ни на один вопрос не ответили: делить на 0 нельзя.
      skills: [for-range, accumulators, loop-control, import-basics, conditions]
      noHintsBeforeAttempt: true

  - id: second-task
    type: exercise
    title: "Вторая задача: найди ошибки"
    exercise:
      id: m3-l7-e2
      kind: fix
      title: Марафон до трёх промахов
      statement: |-
        Тимур добавил в тренажёр второй режим — марафон. Вопросов сколько угодно: марафон идёт,
        пока Соня не ответит неверно три раза или не введёт `стоп`. После каждого ответа
        программа пишет `Верно!` или `Неверно, правильно: …`, в конце — `Правильных ответов: X`.
        Вопросы нумеруются с 1, множители — те же `random.randint(2, 9)`.

        Но в программе две ошибки на единицу: после третьего неверного ответа марафон задаёт ещё
        один вопрос, а нумерация вопросов начинается с 0. Составь трассировочную таблицу для
        `wrong` и `question` на «Примере 1» и исправь обе ошибки, не переписывая программу.
        Если для трассировки добавишь временный `print`, перед проверкой убери его.
      input: >-
        По строке на каждый вопрос: ответ — целое число или `стоп`. Ответов ровно столько, сколько
        нужно, чтобы марафон закончился.
      output: >-
        Для каждого вопроса — `Вопрос k: a * b = ?` и `Верно!` или `Неверно, правильно:
        <произведение>`. В конце — `Правильных ответов: X`.
      constraints:
        - Исправь две ошибки на единицу, остальное не переписывай.
        - Подсказки откроются после первой проверки — сначала составь таблицу сам.
      seed: 10
      starterCode: |
        import random

        wrong = 0
        correct = 0
        question = 0
        while wrong <= 3:
            a = random.randint(2, 9)
            b = random.randint(2, 9)
            print(f"Вопрос {question}: {a} * {b} = ?")
            question = question + 1
            answer = input()
            if answer == "стоп":
                break
            if int(answer) == a * b:
                print("Верно!")
                correct = correct + 1
            else:
                print(f"Неверно, правильно: {a * b}")
                wrong = wrong + 1
        print(f"Правильных ответов: {correct}")
      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 1: три промаха подряд"
          example: true
          seed: 10
          stdin: "1\n2\n3\n"
          expected: |-
            Вопрос 1: 2 * 8 = ?
            Неверно, правильно: 16
            Вопрос 2: 9 * 2 = ?
            Неверно, правильно: 18
            Вопрос 3: 5 * 9 = ?
            Неверно, правильно: 45
            Правильных ответов: 0
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 2: промахи вперемешку"
          example: true
          seed: 2
          stdin: "6\n1\n24\n2\n3\n"
          expected: |-
            Вопрос 1: 2 * 3 = ?
            Верно!
            Вопрос 2: 3 * 7 = ?
            Неверно, правильно: 21
            Вопрос 3: 4 * 6 = ?
            Верно!
            Вопрос 4: 6 * 5 = ?
            Неверно, правильно: 30
            Вопрос 5: 2 * 4 = ?
            Неверно, правильно: 8
            Правильных ответов: 2
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: «стоп» на втором вопросе"
          edge: true
          seed: 8
          stdin: "35\nстоп\n"
          expected: |-
            Вопрос 1: 5 * 7 = ?
            Верно!
            Вопрос 2: 8 * 4 = ?
            Правильных ответов: 1
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: Длинный марафон
          seed: 11
          stdin: "81\n45\n1\n12\n0\n0\n"
          expected: |-
            Вопрос 1: 9 * 9 = ?
            Верно!
            Вопрос 2: 9 * 5 = ?
            Верно!
            Вопрос 3: 4 * 9 = ?
            Неверно, правильно: 36
            Вопрос 4: 4 * 3 = ?
            Верно!
            Вопрос 5: 9 * 6 = ?
            Неверно, правильно: 54
            Вопрос 6: 4 * 3 = ?
            Неверно, правильно: 12
            Правильных ответов: 3
      rules:
        - id: fix-condition
          max:
            Break: 1
          message: >-
            Второй `break` прячет ошибку, а не исправляет её: условие while по-прежнему пускает
            лишний шаг. Убери добавленный `break` и исправь само условие цикла.
      criteria:
        - Марафон заканчивается сразу после третьего неверного ответа или после «стоп».
        - Вопросы нумеруются с 1.
        - Исправлены причины — условие цикла и нумерация — без второго `break`; остальная программа прежняя.
        - Временных print для трассировки в коде не осталось.
      hints:
        - >-
          Составь таблицу для «Примера 1»: сколько неверных ответов накопилось после каждого
          вопроса и что даёт условие while перед следующим. Сколько вопросов задаётся после
          третьего промаха? Отдельно отметь, какое число лежит в счётчике вопросов в тот момент,
          когда вопрос печатается.
        - |-
          Та же ловушка на другом примере. У игрока три жизни:

          ```python
          lives = 3
          level = 0
          while lives >= 0:
              print(f"Уровень {level}, жизней: {lives}")
              level = level + 1
              lives = lives - 1
          ```

          Цикл пройдёт четыре раза — при lives = 3, 2, 1 и 0, — хотя жизней три: `>= 0` пускает
          в цикл и при нуле. А уровни начнутся с 0, потому что номер печатается раньше, чем
          увеличивается.
        - >-
          Нужны две правки. Первая — знак сравнения в условии while (строка 6): при `wrong`,
          равном 3, условие должно стать ложным. Вторая — поменять местами строки 9 и 10, чтобы
          номер увеличивался до печати (или вместо этого начать счёт с `question = 1`).
      solution:
        code: |
          import random

          wrong = 0
          correct = 0
          question = 0
          while wrong < 3:
              a = random.randint(2, 9)
              b = random.randint(2, 9)
              question = question + 1
              print(f"Вопрос {question}: {a} * {b} = ?")
              answer = input()
              if answer == "стоп":
                  break
              if int(answer) == a * b:
                  print("Верно!")
                  correct = correct + 1
              else:
                  print(f"Неверно, правильно: {a * b}")
                  wrong = wrong + 1
          print(f"Правильных ответов: {correct}")
        explanation: |-
          Таблица для «Примера 1» в исходной программе:

          ```text
          вопрос  question в print  ответ  wrong после  условие дальше
          1-й     0                 1      1            1 <= 3 → True
          2-й     1                 2      2            2 <= 3 → True
          3-й     2                 3      3            3 <= 3 → True ← лишний вопрос
          ```

          С `wrong < 3` в последней строке будет False, и марафон закончится сразу после третьего
          промаха. А `question` в момент печати на 1 меньше номера вопроса, поэтому увеличение
          перенесено выше `print`. Можно было и начать с `question = 1`, оставив порядок строк, —
          но не обе правки сразу.
