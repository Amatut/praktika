                    print("Верно!")
                    correct += 1
                else:
                    print("Неверно, правильно:", a * b)
            print("Правильных ответов:", correct, "из", asked)
          note: Сравнение строк через str(a * b) и print через запятую вместо f-строк.
        - code: |
