                if answer == "стоп":
                    break
                if int(answer) == a * b:
                    print("Верно!")
                    correct = correct + 1
                else:
                    print(f"Неверно, правильно: {a * b}")
                    wrong = wrong + 1
                    if wrong == 3:
                        break
            print(f"Правильных ответов: {correct}")
          note: Условие while не исправлено, лишний шаг закрыт вторым break — тесты проходят, правило fix-condition — нет.
          expectMistake: null
      mistakes:
        - id: both-bugs
          when:
            errorType: EOFError
            outputIncludes: "Вопрос 0:"
          where: "Цикл while: номер первого вопроса и шаг после третьего промаха"
          why: >-
            Обе ошибки пока на месте. Первый вопрос выходит под номером 0, а после третьего
            неверного ответа марафон задаёт ещё один вопрос. Ввода для него уже нет, поэтому
            `input()` падает с EOFError.
          try: >-
            Составь таблицу для «Примера 1»: `wrong` после каждого ответа и значение условия
            while перед следующим вопросом. Отдельно отметь, чему равен `question`, когда
            печатается вопрос.
          verify: "В «Примере 1» три вопроса с номерами 1, 2, 3 и сразу итог."
        - id: condition
          when:
            errorType: EOFError
          where: "Строка 6: условие while"
          why: >-
            После третьего неверного ответа `wrong` равно 3, а условие while всё ещё True (в
            исходной программе `3 <= 3` — верно). Цикл задаёт четвёртый вопрос, ввода для него
            нет, и `input()` падает с EOFError.
          try: >-
            Условие должно стать ложным, как только `wrong` дойдёт до 3. Какой знак сравнения
            это даёт?
          verify: "В «Примере 1» после третьего «Неверно» сразу идёт «Правильных ответов: 0»."
        - id: numbering
          when:
            outputIncludes: "Вопрос 0:"
          where: "Строки 9–10: печать вопроса и `question = question + 1`"
          why: >-
            Номер печатается, когда `question` ещё 0: print стоит раньше строки, которая
            увеличивает счётчик.
          try: Поменяй эти две строки местами — или начни счёт с `question = 1`. Нужна одна из двух правок.
          verify: "Первая строка «Примера 1» — «Вопрос 1: 2 * 8 = ?»."
        - id: numbering-twice
          when:
            outputIncludes: "Вопрос 2: 2 * 8 = ?"
          where: Строки с `question`
          why: >-
            Первый вопрос получил номер 2: нумерацию исправили дважды. Счёт уже начинается с 1,
            и при этом номер ещё раз увеличивается до печати (или печатается как `question + 1`).
            Каждая из этих правок по отдельности сдвигает номер на 1.
          try: Оставь только одну из двух правок.
          verify: "Первая строка «Примера 1» — «Вопрос 1: 2 * 8 = ?»."
        - id: number-stuck
          when:
            outputIncludes: "Неверно, правильно: 16\nВопрос 1:"
          where: Строки с `question`
          why: >-
            Все вопросы получили номер 1: счётчик вопросов больше не растёт. Похоже, вместе с
            правкой нумерации пропала строка `question = question + 1`.
          try: >-
            Верни строку `question = question + 1` в цикл. Правка нумерации нужна одна: начать
            с `question = 1` или увеличивать номер до печати, — а сама строка с увеличением
            остаётся.
          verify: "В «Примере 1» вопросы с номерами 1, 2 и 3."
        - id: too-strict
          when:
            outputIncludes: "Неверно, правильно: 18\nПравильных ответов:"
          where: Условие while
          why: >-
            Марафон закончился после второго неверного ответа — на шаг раньше, чем нужно:
            условие стало ложным, когда `wrong` было 2.
          try: >-
            Проверь по таблице: при `wrong`, равном 0, 1 и 2, условие должно давать True, а при
            3 — False. Поправь знак или число в условии (и начальное значение `wrong`, если
            меняли его).
          verify: "В «Примере 1» три вопроса и три «Неверно»."
        - id: trace-left
          when:
            failedTest: t1
            codeRegex: '^[ \t]*print\((?!\s*f?["''](Вопрос|Верно|Неверно|Правильных))'
          where: Временный print для трассировки
          why: >-
            В выводе лишние строки — похоже, остался print для трассировки. Проверка сравнивает
            вывод построчно, и любая лишняя строка — несовпадение.
          try: Трассировка своё дело сделала — убери строку с временным print.
          verify: "Вывод «Примера 1» совпадает с образцом строка в строку."
      afterPass: >-
        Обе ошибки на единицу исправлены. Так их ищут в любом цикле: смотрят на первый и
        последний шаг и на значение условия на пороге.
      skills: [loop-tracing, while-loops, loop-control]
      noHintsBeforeAttempt: true

  - id: recap
    type: recap
    title: Итоги и что повторить
    points:
      - "Если обе задачи получились без подсказок, навыки модуля твои: цикл на нужное число шагов, счётчики, досрочный выход, случайные числа и поиск ошибки на единицу. Можно переходить к модулю 4."
      - "Программа зависала, падала с EOFError или «стоп» не срабатывал — повтори урок 3.1 (условие while) и урок 3.4 (break и continue)."
      - "«Вопрос 0», лишний или недостающий вопрос, четвёртый промах в марафоне — повтори урок 3.2 (границы range) и урок 3.6 (трассировка)."
      - "Неверное «X из Y» — повтори урок 3.3 (где счётчик создаётся, меняется и печатается). NameError про random или другие числа в вопросах — урок 3.5 (import, границы и порядок вызовов randint)."
    question: Почему в тренажёре «стоп» проверяют до `int(answer)`?
    answer: >-
      `int("стоп")` останавливает программу с ValueError. Сначала нужно понять, что пришло, —
      команда или число, — и только число превращать в `int`. Поэтому ответ читают строкой,
      сравнивают со словом «стоп» и лишь потом переводят в число.
