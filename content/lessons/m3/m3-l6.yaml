          expectMistake: null
      mistakes:
        - id: print-before-count
          when:
            outputIncludes: "День 0:"
          where: Порядок строк в теле цикла
          why: >-
            `print` стоит раньше, чем `day = day + 1`, поэтому печатает старое значение счётчика:
            первый день назван «День 0».
          try: >-
            Верни `day = day + 1` выше `print` — тогда в строке будет уже новый номер дня. Если
            после этого в плане нет главы 7, исправь и конец range.
          verify: "«Пример 1» должен начинаться строкой «День 1: глава 3»."
        - id: last-missing
          when:
            outputIncludes: "глава 6\nВсего дней: 4"
          where: Строка 4, `range(first, last)`
          why: >-
            `range(first, last)` останавливается перед `last`: для «Примера 1» это главы 3, 4, 5, 6 —
            седьмая не попадает в план. Правая граница range не входит никогда.
          try: >-
            Выпиши значения `chapter` по шагам и сравни с главами 3–7. Сделай конец range на
            единицу больше последней нужной главы.
          verify: "В «Примере 1» должна появиться строка «День 5: глава 7»."
        - id: start-shifted
          when:
            outputIncludes: "День 1: глава 2"
          where: Начало range
          why: >-
            План теперь начинается с главы 2 — Полина её уже прочитала. Сдвинуто начало range, а
            ошибка была на другом краю: начало `first` и так входит в range.
          try: Верни началу значение `first`. Конец range — `last + 1`, на единицу больше последней главы.
          verify: "«Пример 1» должен начинаться строкой «День 1: глава 3» и заканчиваться главой 7."
        - id: day-from-one
          when:
            outputIncludes: "День 2: глава 3"
          where: Начальное значение `day`
          why: >-
            Счётчик дней начинается с 1, а увеличивается в начале тела — поэтому первый день назван
            вторым, а «Всего дней» на единицу больше, чем строк в плане.
          try: >-
            Верни `day = 0` — на первом шаге счётчик как раз станет 1. Последнюю главу возвращает
            конец range, а не счётчик: если главы 7 в плане нет, исправь и его.
          verify: "В «Примере 1» дни должны идти с 1 по 5, последняя строка плана — «День 5: глава 7»."
        - id: symptom-patched
          when:
            outputIncludes: "глава 6\nВсего дней: 5"
          where: Итоговая строка
          why: >-
            Итог стал 5, но седьмой главы в плане всё ещё нет. Итог подогнан под ответ, а причина
            осталась: цикл по-прежнему делает на шаг меньше.
          try: >-
            Верни в итоге просто `{day}` и исправь причину — конец range. Когда цикл сделает пять
            шагов, итог станет верным сам.
          verify: "В «Примере 1» должно быть пять строк «День …», последняя — «День 5: глава 7»."
        - id: total-plus-one
          when:
            outputIncludes: "глава 7\nВсего дней: 6"
          where: Итоговая строка
          why: >-
            Глава 7 в плане уже есть: range исправлен, и счётчик дней стал верным сам. Лишняя
            единица в итоге даёт 6 дней на 5 глав.
          try: Верни в итоге просто `{day}`.
          verify: "«Пример 1» должен заканчиваться строкой «Всего дней: 5»."
        - id: print-shifted
          when:
            outputIncludes: "День 1: глава 4"
            codeRegex: 'print\(.*\bchapter\s*\+\s*1\b'
          where: Номер главы в строке плана
          why: >-
            В строку плана подставлено `chapter + 1`, поэтому каждая глава напечатана на единицу
            больше, чем значение `chapter`: план начинается с главы 4, а глава 3 пропала. Номер в
            печати не меняет число шагов цикла — его задаёт range.
          try: >-
            Печатай сам `chapter`. Если после этого в плане нет главы 7 — прибавь единицу к концу
            range.
          verify: "«Пример 1» должен начинаться строкой «День 1: глава 3» и заканчиваться «Всего дней: 5»."
        - id: both-shifted
          when:
            outputIncludes: "День 1: глава 4"
            codeRegex: 'range\(\s*first\s*\+\s*1\b'
          where: Начало range
          why: >-
            Сдвинуты оба конца range: седьмая глава появилась, но потерялась третья. Начало `first`
            и так входит в range — сдвигать его не нужно.
          try: Верни началу значение `first`, а единицу прибавь только к концу.
          verify: "«Пример 1» должен начинаться строкой «День 1: глава 3»."
        - id: overshoot
          when:
            outputIncludes: "глава 8"
          where: Конец range
          why: >-
            В плане лишняя глава 8: конец range сдвинут на две единицы вместо одной. Последний шаг
            должен быть ровно на `last`.
          try: Конец range — на единицу больше последней нужной главы, то есть `last + 1`.
          verify: "«Пример 1» должен заканчиваться строками «День 5: глава 7» и «Всего дней: 5»."
        - id: wrong-direction
          when:
            outputIncludes: "глава 5\nВсего дней: 3"
          where: Конец range
          why: >-
            Конец range сдвинут не в ту сторону: план стал ещё короче — теперь нет глав 6 и 7.
            Правая граница не входит, поэтому её нужно не уменьшать, а увеличивать.
          try: Конец range — на единицу больше последней нужной главы, то есть `last + 1`.
          verify: "«Пример 1» должен заканчиваться строками «День 5: глава 7» и «Всего дней: 5»."
      afterPass: >-
        Одна правка на краю — и план верный для любых глав, даже для одной. Ты исправил причину, а
        не подогнал итог. На будущее: число шагов цикла легко проверить формулой last − first + 1 —
        если счётчик с ней не совпал, ищи ошибку на первом или последнем шаге.
      skills: [loop-tracing, for-range]

  - id: practice-posts
    type: exercise
    title: Практика 3
    exercise:
      id: m3-l6-e3
      kind: write
      title: Столбы для забора
      statement: |-
        Дядя Витя ставит забор длиной `length` метров со столбами через каждые `step` метров:
        первый столб — на 0 м, последний — ровно на конце забора. Напиши программу, которая
        печатает, где стоит каждый столб, а потом — сколько столбов нужно купить.

        Для забора из истории — 10 м, шаг 2 м — вывод такой:

        ```text
        Столб на 0 м
        Столб на 2 м
        Столб на 4 м
        Столб на 6 м
        Столб на 8 м
        Столб на 10 м
        Столбов: 6
        ```

        Прежде чем запускать, проверь свой цикл по таблице: какое значение будет на первом проходе
        цикла и какое — на последнем?
      input: >-
        Две строки — длина забора и шаг между столбами (целые числа; шаг от 1 до длины, длина
        делится на шаг без остатка).
      output: "Строка `Столб на <место> м` для каждого столба по порядку, затем `Столбов: <число>`."
      constraints:
        - Длина делится на шаг без остатка, шаг не больше длины.
        - Столбы печатаются по порядку — от 0 до конца забора.
      starterCode: |
        # Прочитай длину забора и шаг между столбами
        # Выведи место каждого столба, а потом — сколько их всего

      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "10\n2\n"
          expected: |-
            Столб на 0 м
            Столб на 2 м
            Столб на 4 м
            Столб на 6 м
            Столб на 8 м
            Столб на 10 м
            Столбов: 6
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "6\n3\n"
          expected: |-
            Столб на 0 м
            Столб на 3 м
            Столб на 6 м
            Столбов: 3
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: один пролёт"
          edge: true
          stdin: "5\n5\n"
          expected: |-
            Столб на 0 м
            Столб на 5 м
            Столбов: 2
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: метр с шагом 1"
          edge: true
          stdin: "1\n1\n"
          expected: |-
            Столб на 0 м
            Столб на 1 м
            Столбов: 2
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: Длинные пролёты
          stdin: "12\n4\n"
          expected: |-
            Столб на 0 м
            Столб на 4 м
            Столб на 8 м
            Столб на 12 м
            Столбов: 4
          compare:
            ignoreSpaces: true
      criteria:
        - Первый столб — на 0 м, последний — на конце забора, между соседними столбами ровно шаг.
        - Столбов на один больше, чем пролётов, — для 10 м с шагом 2 их 6.
        - Итог печатается один раз, после списка столбов.
      hints:
        - >-
          Где стоит первый столб, где последний и какой шаг между ними? Какие значения должен
          перебрать цикл — и войдёт ли последнее из них в range?
        - >-
          Похожий приём на другом примере: метки на линейке длиной 20 см через каждые 5 см стоят на
          0, 5, 10, 15 и 20 см. `range(0, 21, 5)` даёт ровно их: начало 0, шаг 5, а конец на
          единицу больше последнего нужного значения. Меток пять, промежутков четыре.
        - |-
          Каркас:
          ```text
          длина = int(input())
          шаг = int(input())
          столбов = 0
          for место in range(0, …, шаг):
              print(f"Столб на {…} м")
              столбов = столбов + 1
          print(f"Столбов: {…}")
          ```
      solution:
        code: |
          length = int(input())
          step = int(input())
          posts = 0
          for place in range(0, length + 1, step):
              print(f"Столб на {place} м")
              posts = posts + 1
          print(f"Столбов: {posts}")
        explanation: >-
          Первый столб на 0 — с него и начинается range. Последний на `length`, а правая граница
          range не входит, поэтому конец — `length + 1`. Шаг range — расстояние между столбами.
          Счётчик `posts` прибавляет единицу на каждый столб; его можно заменить формулой
          `length // step + 1`: пролётов `length // step`, а столбов на один больше.
