                blocks = 2 * row - 1
                total = total + blocks
                print(f"Ряд {rows}: {blocks} шт., всего {total}")
                row = row + 1
            print(f"Всего кубиков: {total}")
          note: В номере ряда rows вместо row.
          expectMistake: rows-vs-row
        - code: |
            rows = int(input())
            total = 0
