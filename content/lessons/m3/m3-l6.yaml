id: m3-l6
module: m3
number: "3.6"
title: Трассировка цикла и ошибка на единицу
objective: >-
  Составлять трассировочную таблицу цикла и по ней находить и исправлять ошибку на единицу —
  лишний или недостающий шаг из-за границы range, знака < или <= или места, где меняется и
  печатается счётчик.
minutes: [20, 30]
prerequisites: [m3-l5]
skills: [loop-tracing]
environment: python

story:
  title: Одного столба не хватило
  fictional: true
  text: >-
    Дядя Витя решил поставить на даче забор длиной 10 метров со столбами через каждые 2 метра. Он
    разделил 10 на 2, купил 5 столбов — и на самом конце забора столба не хватило. Тогда он выписал
    места столбов в столбик — 0, 2, 4, 6, 8, 10 метров — и шестой нашёлся сразу: пролётов пять, а
    столбов на один больше. Программисты попадают в ту же ловушку так часто, что по-английски у неё
    есть имя — fencepost error, «ошибка заборного столба». Поймать её помогает тот же приём: выписать
    значения по шагам в таблицу.

why: >-
  Цикл, который делает на шаг больше или меньше, чем нужно, — одна из самых частых ошибок, и на
  обычных данных её легко не заметить. Таблица значений по шагам показывает её сразу: например, что
  `range(1, 10)` не доходит до 10.

usedIn: >-
  Проверка и отладка своего и чужого кода; нумерация страниц и строк; расписания «с… по…
  включительно»; постраничный вывод на сайтах («показаны записи 1–20 из 57»). В модуле 4 то же
  понадобится для индексов строк и списков — там счёт идёт с нуля.

steps:
  - id: tracing
    type: theory
    title: Трассировка и ошибка на единицу
    body: |-
      **Трассировка** — пройти программу вручную, как компьютер, и после каждого шага записать
      значения переменных. **Шаг цикла** — одна итерация, то есть один проход тела (не путай с
      шагом `range` — третьим аргументом). Удобнее всего таблицей: столбцы — переменные (у `while`
      ещё и условие), строки — «до цикла», шаг 1, шаг 2, … и «после цикла». Вот цикл и его таблица:

      ```python
      total = 0
      for i in range(1, 4):
          total = total + i
      ```

      ```text
                  i    total
      до цикла    —    0
      шаг 1       1    1
      шаг 2       2    3
      шаг 3       3    6
      после       3    6
      ```

      После `for` в `i` остаётся последнее число из range — 3. У `while` иначе: после цикла в
      переменной лежит первое значение, при котором условие стало ложным.

      **Ошибка на единицу** — цикл делает на один шаг больше или меньше, чем нужно. Почти всегда
      она видна на краях, поэтому в таблице первым делом смотри на **первый и последний шаг**. Три
      частых источника:

      1. Правая граница `range` не входит. «С a по b включительно» — это `range(a, b + 1)`, шагов
         b − a + 1.
      2. `<` вместо `<=` в `while` (или наоборот). Если переменная может оказаться ровно на
         границе, цикл остановится на шаг раньше или позже.
      3. Счётчик начинается не с того числа или печатается до того, как его увеличили.

      **Правило забора.** Автобус ходит с 8:00 до 9:00 каждые 15 минут: промежутков 60 // 15 = 4,
      а рейсов на один больше — 5 (8:00, 8:15, 8:30, 8:45 и 9:00). Когда считаешь точки на
      отрезке (столбы, рейсы, дни, главы), а не промежутки между ними, не забудь про эту единицу.

      **Смотри на края.** На «обычных» данных ошибка на единицу прячется: итог выглядит
      правдоподобно. Проверяй программу на маленьких и граничных значениях: 0, 1, одна глава, число
      ровно на пороге — и сверяй с таблицей. Частое заблуждение: «на примере из условия работает —
      значит, верно».

      **Трассировка через print.** Длинную таблицу напишет компьютер: временно добавь в тело цикла
      строку вроде `print(i, total)` — каждая напечатанная строка станет строкой таблицы. Важно, где
      она стоит: до строки, которая меняет переменную, `print` покажет старое значение, после —
      новое. Когда ошибка найдена, такую строку убирают.
    simpler: >-
      Трассировка — как пройти рецепт с карандашом: после каждого шага записываешь, что лежит в
      каждой миске. Ошибка на единицу — одна лишняя или одна недостающая ложка. Её видно, если
      внимательно посмотреть на первый и последний шаг.
    coach: >-
      Перед исправлением запиши таблицу хотя бы для первых двух шагов и последнего — исправление
      часто становится очевидным.

  - id: pages
    type: example
    title: Страницы с 5-й по 8-ю
    body: >-
      Программа отмечает прочитанные страницы — с 5-й по 8-ю включительно. `print` в теле цикла —
      трассировочный: каждая напечатанная строка — строка таблицы с двумя столбцами, `page` и
      `count`.
    code: |-
      first = 5
      last = 8
      count = 0
      for page in range(first, last + 1):
          count = count + 1
          print(f"страница {page}, прочитано {count}")
      print(f"Всего страниц: {count}")
    notes:
      - line: 4
        text: >-
          `last + 1` — чтобы страница 8 вошла: правая граница range не входит. Шагов будет
          8 − 5 + 1 = 4.
      - line: 5
        text: Счётчик увеличивается раньше print — поэтому в таблице уже новое значение.
      - line: 6
        text: Трассировочный print — по строке таблицы на каждый шаг цикла.
      - line: 7
        text: Без отступа — выполняется один раз, после цикла. Итог совпадает с последней строкой таблицы.
    tryIt: >-
      Убери `+ 1` в строке 4 и запусти: страницы 8 в таблице не будет, а итог станет 3. Верни `+ 1`
      и поменяй местами строки 5 и 6 (с теми же отступами): «прочитано» начнёт отставать на
      единицу — print покажет значение до увеличения.
    coach: >-
      Трассировочный print — временный помощник: посмотрел, нашёл ошибку, убрал.

  - id: grasshopper
    type: predict
    title: Кузнечик и отметка 10
    prompt: >-
      Кузнечик прыгает вперёд по 2 см, начиная с отметки 0. Составь таблицу — `position` до
      прыжка, условие, `position` после, `jumps` — и скажи, что выведет программа.
    code: |-
      position = 0
      jumps = 0
      while position <= 10:
          position = position + 2
          jumps = jumps + 1
      print(jumps, position)
    options:
      - "5 10"
      - "6 12"
      - "7 14"
    answer: "6 12"
    explanation: |-
      Таблица по шагам:

      ```text
      шаг  до  <=10?  после  jumps
      1    0   да     2      1
      2    2   да     4      2
      3    4   да     6      3
      4    6   да     8      4
      5    8   да     10     5
      6    10  да     12     6
      —    12  нет    выход
      ```

      При `position = 10` условие `10 <= 10` ещё верно — граница входит, поэтому кузнечик прыгает в
      шестой раз. После цикла в `position` лежит первое значение, при котором условие стало ложным,
      — 12. Ответ «5 10» — ошибка на единицу: так было бы с `<`, там цикл остановился бы на 10 после
      пяти прыжков. Ответ «7 14» — лишний прыжок: при 12 условие уже ложно.
    coach: >-
      Самая важная строка таблицы — последняя: на каком значении условие впервые стало ложным.

  - id: practice-trace
    type: exercise
    title: Практика 1
    exercise:
      id: m3-l6-e1
      kind: read
      title: Пирамида из кубиков по рядам
      statement: |-
        Для праздника в детском саду из больших кубиков выкладывают у стены ступенчатую пирамиду:
        в верхнем ряду 1 кубик, в каждом следующем — на 2 больше (1, 3, 5, …). Программа в
        редакторе считает, сколько кубиков нужно на пирамиду из `rows` рядов.

        Прочитай её и добавь **одну строку** — трассировку. После каждого ряда программа должна
        печатать:

        ```text
        Ряд <номер ряда>: <кубиков в этом ряду> шт., всего <итог на этот момент>
        ```

        Для 4 рядов вывод такой:

        ```text
        Ряд 1: 1 шт., всего 1
        Ряд 2: 3 шт., всего 4
        Ряд 3: 5 шт., всего 9
        Ряд 4: 7 шт., всего 16
        Всего кубиков: 16
        ```

        Остальной код не меняй. Главное — найти в теле цикла место, где все три числа относятся к
        одному и тому же ряду.
      input: Одна строка — число рядов (целое, 0 или больше).
      output: "Строка `Ряд …` для каждого ряда, затем `Всего кубиков: <итог>`."
      constraints:
        - Добавь одну строку с `print`, остальные строки не меняй.
        - Если рядов 0, печатается только итог.
      starterCode: |
        rows = int(input())
        total = 0
        row = 1
        while row <= rows:
            blocks = 2 * row - 1
            total = total + blocks
            row = row + 1
        print(f"Всего кубиков: {total}")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "4\n"
          expected: |-
            Ряд 1: 1 шт., всего 1
            Ряд 2: 3 шт., всего 4
            Ряд 3: 5 шт., всего 9
            Ряд 4: 7 шт., всего 16
            Всего кубиков: 16
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "2\n"
          expected: |-
            Ряд 1: 1 шт., всего 1
            Ряд 2: 3 шт., всего 4
            Всего кубиков: 4
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: один ряд"
          edge: true
          stdin: "1\n"
          expected: |-
            Ряд 1: 1 шт., всего 1
            Всего кубиков: 1
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: пирамиды нет"
          edge: true
          stdin: "0\n"
          expected: "Всего кубиков: 0"
          compare:
            ignoreSpaces: true
      criteria:
        - В каждой строке «Ряд …» номер ряда, число кубиков и итог относятся к одному и тому же ряду.
        - Строк «Ряд …» столько же, сколько рядов; итог печатается один раз, в самом конце.
        - "При 0 рядах программа печатает только «Всего кубиков: 0»."
      hints:
        - >-
          Какие значения у `row`, `blocks` и `total` сразу после каждой строки тела цикла? Выпиши
          их для первого ряда: после какой строки все три числа уже относятся к ряду 1 — и ещё не
          перешли к ряду 2?
        - |-
          Тот же приём на маленьком примере:
          ```python
          x = 1
          x = x + 1    # print сразу после этой строки покажет 2
          x = x * 10   # а после этой — уже 20
          ```
          До строки, которая меняет переменную, `print` видит старое значение, после — новое.
          Значит, место строки решает, к какому ряду относится каждое из трёх чисел.
        - |-
          Строка встаёт между `total = total + blocks` и `row = row + 1`, с тем же отступом, что у
          соседних строк:
          ```text
          print(f"Ряд {…}: {…} шт., всего {…}")
          ```
      solution:
        code: |
          rows = int(input())
          total = 0
          row = 1
          while row <= rows:
              blocks = 2 * row - 1
              total = total + blocks
              print(f"Ряд {row}: {blocks} шт., всего {total}")
              row = row + 1
          print(f"Всего кубиков: {total}")
        explanation: >-
          Трассировка встаёт между `total = total + blocks` и `row = row + 1`. В этот момент
          `blocks` и `total` уже посчитаны для текущего ряда, а `row` ещё не перешёл к следующему —
          все три числа говорят об одном ряде. Выше строки с `total` итог отставал бы на ряд, ниже
          строки с `row` номер убегал бы вперёд.
      altSolutions:
        - code: |
            rows = int(input())
            total = 0
            row = 1
            while row <= rows:
                blocks = 2 * row - 1
                total = total + blocks
                row = row + 1
                print(f"Ряд {row - 1}: {blocks} шт., всего {total}")
            print(f"Всего кубиков: {total}")
          note: Строка после увеличения row, но номер ряда поправлен — row - 1.
        - code: |
            rows = int(input())
