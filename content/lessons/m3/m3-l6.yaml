          when:
            outputIncludes: "Столб на 8 м\nСтолбов: 6"
            codeRegex: '^[ \t]*[A-Za-z_]\w*\s*=\s*1[ \t]*$|Столбов.*[{(,]\s*[A-Za-z_]\w*\s*\+\s*1\b'
          where: Конец цикла и итог
          why: >-
            Итог 6 верный, а столба на конце забора нет. Цикл делает на один проход меньше, а итог
            добирает единицу иначе — счётчиком с 1 или прибавкой `+ 1`. Такие ошибки гасят друг
            друга на любом заборе, поэтому заметить их можно только по списку.
          try: >-
            Пусть цикл дойдёт до `length`: конец range — `length + 1`, у while — `<=`. А итог —
            счётчик с 0, без добавок: тогда он сам посчитает каждый столб.
          verify: "В «Примере 1» перед «Столбов: 6» должна стоять строка «Столб на 10 м»."
        - id: last-post-missing
          when:
            outputIncludes: "Столб на 8 м\nСтолбов:"
          where: Конец цикла
          why: >-
            Нет последнего столба — на конце забора. Цикл останавливается на проход раньше: у range
            правая граница не входит, а у `while place < length` условие при `place = length` уже
            ложно.
          try: >-
            Посмотри в таблице на последний проход: какое значение должно быть последним? Конец
            range — на единицу больше последнего значения, которое должен принять цикл: для
            `range(0, …, step)` это `length + 1`, для номеров столбов — `length // step + 1`. Для
            while поставь `<=`.
          verify: "В «Примере 1» перед итогом должна появиться строка «Столб на 10 м»."
        - id: first-post-missing
          when:
            outputEquals: |-
              Столб на 2 м
              Столб на 4 м
              Столб на 6 м
              Столб на 8 м
              Столб на 10 м
              Столбов: 5
          where: Начало цикла
          why: >-
            Нет первого столба — на 0 м: первое напечатанное место — уже шаг. Так бывает, если
            range (или `place` перед while) начинается со `step` или если место увеличивается
            раньше, чем печатается.
          try: >-
            Посмотри в таблице на первый проход: напечатано должно быть 0. Начни с 0 и печатай место
            до того, как прибавишь шаг.
          verify: "«Пример 1» должен начинаться строкой «Столб на 0 м»."
        - id: shift-before-print
          when:
            codeRegex: '^[ \t]*while\b'
            outputEquals: |-
              Столб на 2 м
              Столб на 4 м
              Столб на 6 м
              Столб на 8 м
              Столб на 10 м
              Столб на 12 м
              Столбов: 6
          where: Порядок строк в теле while
          why: >-
            Список сдвинут на шаг: первый столб напечатан на 2 м, а последний — на 12 м, за концом
            забора. В теле while место увеличивается раньше, чем печатается, поэтому print видит уже
            следующее значение.
          try: >-
            Поменяй строки местами: сначала напечатай место, потом прибавь шаг. Условие
            `place <= length` оставь как есть.
          verify: "«Пример 1» должен начинаться строкой «Столб на 0 м» и заканчиваться строкой «Столб на 10 м»."
        - id: empty-loop
          when:
            outputEquals: "Столбов: 0"
          where: Заголовок цикла
          why: >-
            Цикл не сделал ни одного прохода: ни одного столба не напечатано, счётчик остался 0. У
            range так бывает, если аргументы стоят не в том порядке: `range(length + 1, step)` —
            это «от length + 1 до step», и такой range пустой.
          try: >-
            Порядок аргументов range — начало, конец, шаг: начни с 0. У while проверь, что условие
            верно уже при `place = 0`.
          verify: "«Пример 1» должен начинаться строкой «Столб на 0 м»."
        - id: count-formula
          when:
            outputIncludes: "Столб на 10 м\nСтолбов: 5"
          where: Итоговая строка
          why: >-
            Список столбов верный, а в итоге посчитаны пролёты: `length // step` — это промежутки
            между столбами. Столбов на один больше — правило забора.
          try: >-
            Посчитай столбы счётчиком в цикле или прибавь к числу пролётов единицу.
          verify: "В «Примере 1» итог должен стать «Столбов: 6»."
        - id: fence-twice
          when:
            outputIncludes: "Столб на 10 м\nСтолбов: 7"
            codeRegex: 'Столбов.*\+\s*1\b'
          where: Итоговая строка
          why: >-
            Список верный, а в итоге на один столб больше. Правило забора здесь уже выполнено: цикл
            прошёл по каждому столбу, включая последний, и счётчик посчитал их все. Прибавка `+ 1`
            нужна, только когда считаешь пролёты — формулой `length // step`.
          try: Выведи счётчик без `+ 1` — сколько строк «Столб на …», столько и столбов.
          verify: "В «Примере 1» итог должен стать «Столбов: 6»."
        - id: counter-from-one
          when:
            outputIncludes: "Столбов: 7"
            codeRegex: '^[ \t]*[A-Za-z_]\w*\s*=\s*1[ \t]*$'
          where: Начальное значение счётчика
          why: >-
            Счётчик начинается с 1, хотя до цикла не посчитан ни один столб. Каждый столб
            прибавляет единицу, и в итоге выходит на один больше.
          try: Начни счётчик с 0 — как любой счётчик до цикла.
          verify: "В «Примере 1» итог должен стать «Столбов: 6»."
        - id: from-one
          when:
            outputIncludes: "Столб на 1 м\nСтолб на 3 м"
          where: Начало range
          why: >-
            Все столбы сдвинуты на метр: range начинается с 1, а первый столб стоит на 0 м — в самом
            начале забора. Из-за сдвига пропал и столб на конце.
          try: Начни range с 0 — тогда шаг приведёт ровно к концу забора.
          verify: "«Пример 1» должен начинаться строкой «Столб на 0 м» и заканчиваться столбом на 10 м."
        - id: past-end
          when:
            failedTest: t4
            outputIncludes: "Столб на 2 м\nСтолбов: 3"
          where: Конец цикла
          why: >-
            Цикл заходит за конец забора: конец range взят с запасом больше единицы или у while
            условие `<= length + 1`. При шаге 2 и больше это незаметно, а при шаге 1 в список
            попадает столб на 2 м при длине 1 м.
          try: >-
            Последний столб — ровно на `length`. Для range конец — `length + 1`, для while
            условие — `place <= length`.
          verify: Проверь граничный случай «метр с шагом 1» — столбов должно быть два, на 0 и 1 м.
        - id: number-not-place
          when:
            outputIncludes: "Столб на 5 м\nСтолбов: 6"
          where: Строка с print в цикле
          why: >-
            Число столбов верное, но печатается номер столба — 0, 1, 2, … — а нужно его место на
            заборе в метрах.
          try: Место столба — его номер, умноженный на шаг между столбами.
          verify: "В «Примере 1» должны быть столбы на 0, 2, 4, 6, 8 и 10 м."
        - id: no-step
          when:
            failedTest: t1
            outputIncludes: "Столб на 9 м\nСтолб на 10 м"
          where: Аргументы range
          why: >-
            Столбы стоят на каждом метре: у range нет третьего аргумента, и он шагает по 1.
          try: Добавь в range третьим аргументом шаг между столбами.
          verify: "В «Примере 1» должны остаться столбы на 0, 2, 4, 6, 8 и 10 м."
      afterPass: >-
        Столбов на один больше, чем пролётов, — и программа это учитывает для любого забора.
        Улучшение: посчитай итог ещё и формулой `length // step + 1` и сравни со счётчиком — такая
        сверка двумя способами быстро ловит ошибку на единицу.
      skills: [loop-tracing, for-range, boundary-checks]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - >-
        Трассировочная таблица: строки — шаги цикла, столбцы — переменные (у while ещё и условие).
        Ошибку на единицу ищи на первом и последнем шаге.
      - >-
        «С a по b включительно» — `range(a, b + 1)`, это b − a + 1 шагов. Точек на отрезке
        (столбов, дней, глав) на одну больше, чем промежутков между ними.
      - >-
        Ошибка на единицу прячется на обычных данных — проверяй на 0, 1 и значениях ровно на
        пороге. Исправляй причину (границу, условие, начало счётчика), а не подгоняй итог.
      - >-
        Временный `print` в теле цикла печатает таблицу за тебя. Где он стоит, такие значения и
        покажет: до изменения переменной — старое, после — новое.
    question: >-
      Нужно обработать страницы с 1-й по 100-ю. В коде `page = 1`, затем цикл `while page < 100:`,
      в конце тела — `page = page + 1`. Сколько страниц обработается и как исправить?
    answer: >-
      99 — с 1-й по 99-ю: при `page = 100` условие `100 < 100` уже ложно, и сотая страница не
      попадает в цикл. Нужно `while page <= 100:` — граница должна входить.
