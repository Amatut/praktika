          expectMistake: null
      mistakes:
        - id: no-trace
          when:
            outputEquals: "Всего кубиков: 16"
          where: Тело цикла while
          why: >-
            Программа печатает только итог — трассировочной строки пока нет, поэтому по рядам ничего
            не видно.
          try: >-
            Добавь в тело цикла строку с `print`, которая выводит номер ряда, кубики в нём и итог на
            этот момент. Подумай, между какими строками тела её поставить.
          verify: В «Примере 1» перед итогом должны появиться четыре строки «Ряд …».
        - id: no-f
          when:
            outputIncludes: "{"
          where: Строка с трассировкой
          why: >-
            На экране видны фигурные скобки — значит, строка обычная, и Python не подставил значения
            переменных. Подставлять умеет только f-строка.
          try: Поставь букву `f` прямо перед открывающей кавычкой.
          verify: "Первая строка «Примера 1» должна стать «Ряд 1: 1 шт., всего 1»."
        - id: after-row-update
          when:
            outputIncludes: "Ряд 2: 1 шт."
            codeRegex: 'row\s*(?:=\s*row\s*\+\s*1|\+=\s*1)[ \t]*\n(?:[ \t]*\n)*[ \t]+print\('
          where: Строка с трассировкой стоит после `row = row + 1`
          why: >-
            К этому моменту `row` уже перешёл к следующему ряду, а кубики и итог — ещё от прежнего.
            Поэтому первая строка говорит «Ряд 2», хотя в ней кубики ряда 1, а в конце появляется
            несуществующий ряд 5. Таблица «съехала» на единицу.
          try: >-
            Перенеси строку выше — между `total = total + blocks` и `row = row + 1`: там итог уже
            новый, а номер ряда ещё прежний.
          verify: "В «Примере 1» таблица должна начинаться строкой «Ряд 1: 1 шт., всего 1» и заканчиваться рядом 4."
        - id: row-plus-one
          when:
            outputIncludes: "Ряд 2: 1 шт."
            codeRegex: 'print\(.*\brow\s*\+\s*1\b'
          where: Номер ряда в строке с трассировкой
          why: >-
            В номер ряда подставлено `row + 1`. Но в этом месте `row` ещё не увеличен — он и есть
            номер текущего ряда. Поэтому первая строка говорит «Ряд 2», а кубики в ней — ряда 1.
          try: Подставь в f-строку сам `row`, без прибавки.
          verify: "Первая строка «Примера 1» должна стать «Ряд 1: 1 шт., всего 1»."
        - id: rows-vs-row
          when:
            outputIncludes: "Ряд 4: 1 шт."
          where: Номер ряда в строке с трассировкой
          why: >-
            В номер ряда подставлено `rows` — сколько рядов всего, — а не `row`, номер текущего ряда.
            `rows` в цикле не меняется, поэтому в «Примере 1» у каждой строки номер 4.
          try: Подставь в f-строку `row` — переменную, которая меняется на каждом шаге.
          verify: Номера рядов в «Примере 1» должны идти по порядку — 1, 2, 3, 4.
        - id: before-total
          when:
            outputIncludes: "шт., всего 0"
          where: Строка с трассировкой стоит до `total = total + blocks`
          why: >-
            Кубики текущего ряда к итогу ещё не прибавлены, поэтому «всего» отстаёт на один ряд: в
            первой строке 0 вместо 1.
          try: Перенеси строку ниже — сразу после `total = total + blocks`, но до `row = row + 1`.
          verify: "Первая строка «Примера 1» должна стать «Ряд 1: 1 шт., всего 1»."
        - id: outside-loop
          when:
            codeRegex: '^print\(.*Ряд(?![\s\S]*^(?:while|for)\b)'
            failedTest: t1
          where: Строка с трассировкой после цикла
          why: >-
            После цикла стоит строка «Ряд …» без отступа. Она не входит в тело цикла и выполняется
            один раз, когда цикл уже закончился, — с номером ряда, которого в пирамиде нет: после
            цикла `row` на единицу больше последнего ряда.
          try: >-
            Строка с трассировкой нужна только внутри цикла, с тем же отступом, что у
            `total = total + blocks`, — между обновлением `total` и `row`. Если она там уже есть,
            копию после цикла удали.
          verify: В «Примере 1» перед итогом должны быть ровно четыре строки «Ряд …».
        - id: before-loop
          when:
            errorType: NameError
            codeRegex: '^print\(.*Ряд(?=[\s\S]*^(?:while|for)\b)'
          where: Строка с трассировкой стоит перед циклом
          why: >-
            Строка без отступа перед `while` выполняется один раз, ещё до цикла. Переменной
            `blocks` в этот момент нет — отсюда NameError. Да и таблицы по рядам из одной строки
            не выйдет.
          try: >-
            Перенеси строку внутрь цикла, с тем же отступом, что у `total = total + blocks`, —
            между обновлением `total` и `row`.
          verify: "NameError должен исчезнуть, а в «Примере 1» перед итогом — появиться четыре строки «Ряд …»."
        - id: too-early
          when:
            errorType: NameError
            errorIncludes: "'blocks'"
            codeRegex: '^[ \t]+print\(.*Ряд'
          where: Строка с трассировкой стоит в начале тела цикла
          why: >-
            На первом шаге строка выполняется раньше, чем `blocks = 2 * row - 1`, — переменной
            `blocks` ещё нет, и Python не знает этого имени.
          try: Перенеси строку ниже — после `total = total + blocks`, но до `row = row + 1`.
          verify: "Ошибка NameError должна исчезнуть, а первой строкой «Примера 1» — стать «Ряд 1: 1 шт., всего 1»."
      afterPass: >-
        Строка напечатала таблицу за тебя: видно, что в ряду n ровно `2 * n - 1` кубиков, а итог
        после n рядов — `n * n`. Обычно такую строку ставят на время проверки и потом убирают; здесь
        она нужна по условию. Перенеси её на строку ниже и нажми «Запустить» — увидишь, как
        «съезжает» номер ряда.
      skills: [loop-tracing, while-loops]

  - id: practice-chapters
    type: exercise
    title: Практика 2
    exercise:
      id: m3-l6-e2
      kind: fix
      title: План чтения теряет главу
      statement: |-
        Полина читает толстую библиотечную книгу по одной главе в день — с главы `first` по главу
        `last` включительно. Программа печатает план по дням, но в нём ошибка на единицу.

        Составь трассировочную таблицу для «Примера 1» (главы с 3-й по 7-ю): какие значения
        принимают `chapter` и `day` на каждом шаге? Сравни её с правильным планом, найди ошибку и
        исправь её, не переписывая программу.

        Для глав с 3-й по 7-ю план должен быть таким:

        ```text
        День 1: глава 3
        День 2: глава 4
        День 3: глава 5
        День 4: глава 6
        День 5: глава 7
        Всего дней: 5
        ```
      input: Две строки — номер первой главы и номер последней (первая не больше последней).
      output: "Строка `День <номер>: глава <номер>` на каждую главу с first по last включительно, затем `Всего дней: <число>`."
      constraints:
        - Исправь причину ошибки, а не итоговую строку — хватит одной точной правки.
        - "В программе остаются два `print`: строка плана в цикле и итог. Временный трассировочный `print` перед проверкой убери."
        - Номер первой главы не больше номера последней.
      starterCode: |
        first = int(input())
        last = int(input())
        day = 0
        for chapter in range(first, last):
            day = day + 1
            print(f"День {day}: глава {chapter}")
        print(f"Всего дней: {day}")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "3\n7\n"
          expected: |-
            День 1: глава 3
            День 2: глава 4
            День 3: глава 5
            День 4: глава 6
            День 5: глава 7
            Всего дней: 5
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "10\n12\n"
          expected: |-
            День 1: глава 10
            День 2: глава 11
            День 3: глава 12
            Всего дней: 3
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: одна глава"
          edge: true
          stdin: "1\n1\n"
          expected: |-
            День 1: глава 1
            Всего дней: 1
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: две соседние главы"
          edge: true
          stdin: "4\n5\n"
          expected: |-
            День 1: глава 4
            День 2: глава 5
            Всего дней: 2
          compare:
            ignoreSpaces: true
      rules:
        - id: no-extra-print
          max: { "call:print": 2 }
          message: >-
            В программе должно остаться два `print`: строка плана в цикле и итог после цикла. Если
            последняя глава допечатана отдельной строкой после цикла — это подгонка: исправь конец
            range. Временные трассировочные `print` тоже убери.
      criteria:
        - В плане все главы с first по last, включая последнюю.
        - Дни нумеруются с 1, «Всего дней» равно числу глав — last − first + 1.
        - Исправлена причина — граница цикла, а не итоговая строка.
      hints:
        - >-
          Выпиши, какие значения даёт `range(3, 7)` в «Примере 1», и сравни их с главами, которые
          Полина хочет прочитать. На каком краю расхождение — в начале или в конце?
        - >-
          На другом примере: `range(1, 5)` даёт 1, 2, 3, 4 — пятёрки нет. Чтобы 5 вошла, конец
          должен быть 6, то есть на единицу больше последнего нужного числа.
        - >-
          Нужна одна правка — конец `range` в строке 4. Счётчик дней и итог трогать не надо: когда
          цикл сделает нужное число шагов, они станут верными сами.
      solution:
        code: |
          first = int(input())
          last = int(input())
          day = 0
          for chapter in range(first, last + 1):
              day = day + 1
              print(f"День {day}: глава {chapter}")
          print(f"Всего дней: {day}")
        explanation: >-
          Таблица для глав 3–7 показывает, что `range(3, 7)` даёт 3, 4, 5, 6: правая граница не
          входит, и последний шаг теряется. Конец на единицу больше — `last + 1` — возвращает главу 7,
          а вместе с ней верными становятся и счётчик дней, и итог. Для одной главы (1–1) старая
          программа не печатала ни одного дня: `range(1, 1)` пустой.
      altSolutions:
        - code: |
            first = int(input())
            last = int(input())
            day = 0
            for chapter in range(first, last + 1):
                day += 1
                print(f"День {day}: глава {chapter}")
            print(f"Всего дней: {day}")
          note: То же исправление, счётчик через +=.
        - code: |
            first = int(input())
            last = int(input())
            day = 0
            chapter = first
            while chapter <= last:
                day = day + 1
                print(f"День {day}: глава {chapter}")
                chapter = chapter + 1
            print(f"Всего дней: {day}")
          note: Цикл while с условием <= — последняя глава тоже входит.
        - code: |
            first = int(input())
            last = int(input())
            day = 0
            for chapter in range(first - 1, last):
                day = day + 1
                print(f"День {day}: глава {chapter + 1}")
            print(f"Всего дней: {day}")
          note: Сдвинуто начало range, а в печати chapter + 1 — главы те же.
        - code: |
            first = int(input())
            last = int(input()) + 1
            day = 0
            for chapter in range(first, last):
                day = day + 1
                print(f"День {day}: глава {chapter}")
            print(f"Всего дней: {day}")
          note: Единица прибавлена сразу при чтении last.
        - code: |
            first = int(input())
            last = int(input())
            for i in range(last - first + 1):
                chapter = first + i
                print(f"День {i + 1}: глава {chapter}")
            print(f"Всего дней: {last - first + 1}")
          note: Цикл по номеру шага, глава и день считаются из него.
        - code: |
            first = int(input())
            last = int(input())
            day = 0
            for chapter in range(first, last + 1):
                day = day + 1
                print(f"День {day}:  глава {chapter}")
            print("Всего дней:", day)
          note: Два пробела после двоеточия и print с запятой в итоге.
      wrongSolutions:
        - code: |
            first = int(input())
            last = int(input())
            day = 0
            for chapter in range(first, last):
                day = day + 1
                print(f"День {day}: глава {chapter}")
            print(f"Всего дней: {day}")
          note: Ничего не исправлено.
          expectMistake: last-missing
        - code: |
            first = int(input())
            last = int(input())
            day = 0
            for chapter in range(first - 1, last):
                day = day + 1
                print(f"День {day}: глава {chapter}")
            print(f"Всего дней: {day}")
          note: Сдвинуто начало range вместо конца.
          expectMistake: start-shifted
        - code: |
            first = int(input())
            last = int(input())
            day = 0
            for chapter in range(first - 1, last + 1):
                day = day + 1
                print(f"День {day}: глава {chapter}")
            print(f"Всего дней: {day}")
          note: Сдвинуты оба конца — начало назад, конец вперёд.
          expectMistake: start-shifted
        - code: |
            first = int(input())
            last = int(input())
            day = 1
            for chapter in range(first, last):
                day = day + 1
                print(f"День {day}: глава {chapter}")
            print(f"Всего дней: {day}")
          note: Счётчик дней начат с 1 — итог совпал, но нумерация дней сбилась и седьмой главы нет.
          expectMistake: day-from-one
        - code: |
            first = int(input())
            last = int(input())
            day = 1
            for chapter in range(first, last + 1):
                day = day + 1
                print(f"День {day}: глава {chapter}")
            print(f"Всего дней: {day}")
          note: range исправлен, но заодно и day = 1.
          expectMistake: day-from-one
        - code: |
            first = int(input())
            last = int(input())
            day = 0
            for chapter in range(first, last):
                day = day + 1
                print(f"День {day}: глава {chapter}")
            print(f"Всего дней: {day + 1}")
          note: Подогнан итог, а причина осталась.
          expectMistake: symptom-patched
        - code: |
            first = int(input())
