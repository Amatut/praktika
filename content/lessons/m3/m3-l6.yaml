                blocks = 2 * row - 1
                total = total + blocks
                print("Ряд {row}: {blocks} шт., всего {total}")
                row = row + 1
            print(f"Всего кубиков: {total}")
          note: Нет буквы f.
          expectMistake: no-f
        - code: |
            rows = int(input())
            total = 0
            row = 1
            while row <= rows:
                blocks = 2 * row - 1
                total = total + blocks
                row = row + 1
                print(f"Ряд {row}: {blocks} шт., всего {total}")
            print(f"Всего кубиков: {total}")
          note: print после увеличения row — номер ряда убежал вперёд.
          expectMistake: after-row-update
        - code: |
            rows = int(input())
            total = 0
            row = 1
            while row <= rows:
                blocks = 2 * row - 1
                total = total + blocks
                print(f"Ряд {row + 1}: {blocks} шт., всего {total}")
                row = row + 1
            print(f"Всего кубиков: {total}")
          note: Строка на верном месте, но в номере row + 1.
          expectMistake: row-plus-one
        - code: |
            rows = int(input())
            total = 0
            row = 1
