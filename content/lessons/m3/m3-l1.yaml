      mistakes:
        - id: no-int
          when:
            errorType: TypeError
            errorIncludes: not supported between instances
          why: >-
            `input()` возвращает строку, а сравнить число со строкой нельзя: `1 < "100"` падает с
            TypeError. Число из ввода нужно превратить в int.
          try: Оберни `input(...)` в `int(...)`, когда читаешь N.
          verify: Ошибка должна исчезнуть, а «Пример 1» — дать 7 дней.
        - id: lte
          when:
            outputEquals: |-
              Дней: 1
              Узнали: 2
            codeRegex: '^[ \t]*while\b[^\n]*(<=|>=)'
          why: >-
            Когда N = 1, ждать не нужно: о субботнике уже знает один человек. Но условие со знаком
            `<=` пускает в цикл ещё один день, когда знающих ровно N. На большинстве чисел этого
            не видно, а на 1, 2, 4… 1024 появляется лишний день.
          try: Цикл нужен, пока знающих строго меньше N. Какой знак сравнения это записывает?
          verify: "Проверь граничные случаи: при N = 1 — 0 дней, при N = 1024 — 10 дней."
        - id: days-from-one
          when:
            outputEquals: |-
              Дней: 8
              Узнали: 128
          why: >-
            На один день больше, чем нужно: сегодняшний день посчитан как прошедший. Сегодня
            дней ещё не прошло, а каждый следующий день цикл прибавит сам.
          try: Проверь, с какого числа начинается счётчик дней и что именно печатается. Сегодня — 0 дней.
          verify: В «Примере 1» должно получиться 7 дней.
        - id: adds-instead
          when:
            outputIncludes: "Узнали: 101"
          why: >-
            Знающих становится на 2 больше, а не вдвое больше: 1, 3, 5, 7… Удвоить — значит
            умножить на 2: из 8 человек получается 16, а не 10.
          try: Каждый день умножай число знающих на 2 и сохраняй результат в ту же переменную.
          verify: "В «Примере 1» должно получиться «Узнали: 128»."
        - id: print-inside
          when:
            outputIncludes: "Узнали: 2\nДней: 2"
            codeRegex: '(?<=^while\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*)^[ \t]+print\('
          why: >-
            Итог печатается каждый день, а нужен один раз. Всё, что стоит с отступом под `while`,
            повторяется на каждой итерации.
          try: Убери отступ у строк с `print`, чтобы они стояли после цикла и выполнились один раз.
          verify: В «Примере 1» должно быть ровно две строки.
        - id: days-not-counted
          when:
            outputIncludes: "Узнали: 128"
            codeRegex: '^[ \t]*while\b(?![\s\S]*^[ \t]+\w+\s*(?:\+=\s*1\b|=\s*\w+\s*\+\s*1\b))'
          why: >-
            Число знающих верное, а дней насчитано не столько, сколько раз выполнилось тело цикла.
            Счётчик дней должен расти на 1 внутри цикла, на каждой итерации. Если строка с ним
            стоит без отступа, она выполняется один раз — уже после цикла.
          try: Поставь увеличение `days` в тело цикла — с тем же отступом, что и удвоение.
          verify: В «Примере 1» должно получиться 7 дней.
        - id: stop-condition
          when:
            failedTest: t1
            outputEquals: |-
              Дней: 0
              Узнали: 1
          why: >-
            Цикл не выполнился ни разу: условие в `while` ложно с самого начала. В `while` пишут
            условие, при котором нужен ещё один день, а «знающих не меньше N» — это когда пора
            остановиться.
          try: Переверни условие. Пока знающих меньше N, нужен ещё день — запиши это в `while`.
          verify: В «Примере 1» должно получиться 7 дней.
        - id: adds-one
          when:
            outputEquals: |-
              Дней: 99
              Узнали: 100
          why: >-
            Каждый день прибавляется один человек: 1, 2, 3, 4… Но рассказывает не один человек, а
            каждый, кто уже знает, — поэтому новых людей за вечер столько же, сколько знающих, и
            знающих становится вдвое больше: 1, 2, 4, 8.
          try: Каждый день умножай число знающих на 2 и сохраняй результат в ту же переменную.
          verify: "В «Примере 1» должно получиться «Дней: 7» и «Узнали: 128»."
        - id: start-two
          when:
            outputEquals: |-
              Дней: 6
              Узнали: 128
          why: >-
            На один день меньше, чем нужно: счёт начался с двух знающих. Сегодня знает один
            человек — управдом, а двое будут знать только завтра, через 1 день.
          try: Начни число знающих с 1, а дни — с 0.
          verify: В «Примере 1» должно получиться 7 дней.
        - id: debug-print
          when:
            failedTest: t1
            codeRegex: '(?<=^while\b[^\n]*\n(?:[ \t]*\n|[ \t]+[^\n]*\n)*)^[ \t]+print\('
          why: >-
            В теле цикла стоит `print`, и он печатает промежуточные значения на каждой итерации.
            Для проверки своих рассуждений это полезно, но в ответе нужны ровно две строки итога.
          try: Когда цикл заработал, убери `print` из тела цикла — итог печатается после цикла.
          verify: В «Примере 1» должно быть ровно две строки.
      afterPass: >-
        Цикл нашёл ответ без всяких формул. Прежде чем ввести в поле «Ввод для „Запустить“» число
        1000000, угадай, сколько дней понадобится, а потом запусти и сравни: удвоение растёт
        быстрее, чем кажется.
      skills: [while-loops, boundary-checks]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`while` повторяет тело, пока условие True, и проверяет условие перед каждой итерацией, а не посреди тела. В условие пишут, когда нужен ещё один проход. Если сказано, когда остановиться, переверни это условие: «станет не меньше N» — значит, повторять, пока меньше N."
      - В теле должна меняться переменная из условия и приближать его к False. Иначе цикл бесконечный — тренажёр остановит его сам, а в терминале — клавиши Ctrl+C.
      - Если условие ложно с самого начала, тело не выполнится ни разу. После цикла в переменной из условия лежит первое значение, при котором условие стало ложным.
      - Строки с отступом — тело цикла, они повторяются. Строка без отступа выполнится один раз, после цикла.
    question: >-
      В программе `x = 0`, затем цикл `while x < 10:` с телом `x = x + 4`. Сколько раз выполнится
      тело и чему будет равен `x` после цикла?
    answer: >-
      Тело выполнится 3 раза: `x` станет 4, 8 и 12. При `x = 8` условие `8 < 10` ещё верно,
      поэтому будет третья итерация. После неё `12 < 10` ложно, и цикл заканчивается. После цикла
      `x = 12` — первое значение, при котором условие стало ложным.
