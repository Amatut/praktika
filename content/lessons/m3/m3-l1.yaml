          when:
            errorType: TypeError
            errorIncludes: unsupported operand
          why: >-
            `input()` возвращает строку, а строку к числу не прибавить — сложение падает с
            TypeError. Одно из чисел прочитано без `int()`: чаще всего это новая прибавка, но
            проверь все три строки с `input()`.
          try: >-
            Найди `input(...)` без `int(...)` и оберни его: цель, первый взнос и прибавка должны
            быть числами.
          verify: Ошибка должна исчезнуть, а в «Примере 1» появятся четыре недели.
        - id: no-step
          when:
            outputIncludes: "Неделя 1: 1000\nНеделя 2: 2000"
          why: >-
            Каждую неделю откладывается одна и та же сумма — взнос не растёт. Либо прибавку не
            прочитали или не прибавили к взносу, либо строка с прибавкой стоит без отступа и
            выполняется после цикла, когда недели уже посчитаны.
          try: >-
            Прочитай прибавку третьим `input()` и внутри цикла, после того как взнос положен в
            копилку, увеличь `weekly` на прибавку и запиши результат обратно в `weekly`.
          verify: "В «Примере 1» вторая неделя должна дать «Неделя 2: 2500»."
        - id: step-too-early
          when:
            outputIncludes: "Неделя 2: 3500"
          why: >-
            Взнос растёт раньше, чем его положили в копилку, поэтому уже в первую неделю отложено
            1500 вместо 1000. В первую неделю Тимур откладывает исходную сумму, а прибавка
            действует со следующей.
          try: Перенеси строку, которая увеличивает взнос, в конец тела цикла — после прибавления к накоплениям.
          verify: "«Пример 1» должен начинаться со строки «Неделя 1: 1000»."
        - id: step-before-loop
          when:
            outputIncludes: "Неделя 1: 1500\nНеделя 2: 3000"
            codeRegex: '^\w+\s*(?:\+=|=\s*\w+\s*\+)[^\n]*\n(?=[\s\S]*^while\b)'
          why: >-
            Взнос вырос один раз — до цикла, поэтому каждую неделю в копилку ложится одна и та же
            сумма: 1500. Строка без отступа выполняется один раз, а повторяется только то, что стоит
            в теле цикла.
          try: >-
            Перенеси увеличение взноса в тело цикла, в его конец — после того как взнос положен в
            копилку и неделя напечатана.
          verify: В «Примере 1» должно получиться 1000, 2500, 4500 и 7000.
        - id: step-to-savings
          when:
            outputIncludes: "Неделя 1: 1500\nНеделя 2: 3000"
            codeRegex: '^[ \t]+savings\s*=[^\n]*\bstep\b'
          why: >-
            Прибавка каждую неделю добавляется прямо к накоплениям, а сам взнос остаётся прежним.
            Копилка растёт ровно — 1500, 3000, 4500, — а должна всё быстрее: 1000, 2500, 4500.
          try: >-
            Прибавку добавляй не к `savings`, а к `weekly`: пусть растёт сам взнос, а в следующую
            неделю в копилку ляжет уже новый взнос.
          verify: В «Примере 1» должно получиться 1000, 2500, 4500 и 7000.
        - id: swapped-input
          when:
            outputIncludes: "Неделя 1: 500\nНеделя 2: 2000"
          why: >-
            В первую неделю отложено 500 — это прибавка, а не первый взнос. Числа читаются не в
            том порядке: во вводе сначала цель, потом первый взнос, потом прибавка.
          try: Поменяй местами строки с `input()` для взноса и для прибавки — прибавка читается третьей.
          verify: "«Пример 1» должен начинаться со строки «Неделя 1: 1000»."
        - id: lte
          when:
            outputIncludes: "Неделя 7: 3500"
          why: >-
            Цикл делает лишнюю неделю: когда накоплено ровно 3000 из 3000, цель уже достигнута, но
            условие пускает в цикл ещё раз — так бывает, например, со знаком `<=`.
          try: Цикл должен идти, пока накоплено строго меньше цели. Какой знак сравнения это записывает?
          verify: "В «Примере 2» последней неделей должна быть «Неделя 6: 3000»."
      afterPass: >-
        В цикле меняются уже три переменные, и порядок строк в теле решает, какой взнос попадёт в
        копилку. Перенеси строку `weekly = weekly + step` в начало тела и нажми «Запустить» — в
        поле ввода уже данные «Примера 1». Увидишь, как сдвинутся все недели.
      skills: [while-loops, variables]

  - id: practice-news
    type: exercise
    title: Практика 3
    exercise:
      id: m3-l1-e3
      kind: write
      title: Новость для субботника
      statement: |-
        Во дворе готовят субботник. Сегодня о нём знает один человек — управдом. По вечерам
        каждый, кто знает, рассказывает одному соседу, который ещё не в курсе, — и назавтра
        знающих вдвое больше: 1, 2, 4, 8…

        Напиши программу: она читает N — сколько человек должны узнать о субботнике — и печатает,
        через сколько дней знающих станет не меньше N и сколько человек будут знать в этот день.

        Например, для N = 100:

        ```text
        Дней: 7
        Узнали: 128
        ```

        Через 6 дней знают 64 человека — ещё мало, а через 7 дней — уже 128.
      input: Одно целое число N — 1 или больше.
      output: "Две строки: `Дней: <число>` и `Узнали: <число>`."
      constraints:
        - Сколько дней понадобится, заранее неизвестно, — пусть считает цикл while.
        - Сегодня — это «0 дней»; если о субботнике уже знают N человек, ждать не нужно.
      starterCode: |
        # Прочитай N и найди, через сколько дней о субботнике узнают не меньше N человек

      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          stdin: "100\n"
          expected: |-
            Дней: 7
            Узнали: 128
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 2
          example: true
          stdin: "1000\n"
          expected: |-
            Дней: 10
            Узнали: 1024
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: N = 1 — уже знают"
          edge: true
          stdin: "1\n"
          expected: |-
            Дней: 0
            Узнали: 1
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: N = 2"
          edge: true
          stdin: "2\n"
          expected: |-
            Дней: 1
            Узнали: 2
        - id: t5
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: ровно 1024"
          edge: true
          stdin: "1024\n"
          expected: |-
            Дней: 10
            Узнали: 1024
        - id: t6
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: на одного больше, 1025"
          edge: true
          stdin: "1025\n"
          expected: |-
            Дней: 11
            Узнали: 2048
      rules:
        - id: use-while
          use: [While]
          message: Посчитай дни циклом while — так требует задание.
      criteria:
        - Цикл удваивает число знающих и считает дни, пока знающих меньше N.
        - Если N человек уже знают, прошло 0 дней.
        - Итог — две строки, они печатаются один раз, после цикла.
      hints:
        - >-
          Какие две величины меняются каждый день? С каких значений они начинаются сегодня и при
          каком условии нужен ещё один день?
        - |-
          Тот же приём на другом примере. На распродаже цена 6400 каждую неделю падает вдвое.
          Через сколько недель она станет не больше 500? «Станет не больше 500» — это когда
          остановиться, поэтому цикл идёт, пока цена больше 500:
          ```python
          price = 6400
          weeks = 0
          while price > 500:
              price = price // 2
              weeks = weeks + 1
          print(weeks, price)
          ```
          Программа выведет `4 400`: 6400 → 3200 → 1600 → 800 → 400.
        - |-
          Каркас:
          ```text
          n = int(input(...))
          known = 1     # сегодня знает один человек
          days = 0      # дней пока не прошло
          while ... :   # условие, при котором нужен ещё один день
              удвоить known
              прибавить день
          print(... Дней ...)
          print(... Узнали ...)
          ```
      solution:
        code: |
          n = int(input("Сколько человек должны узнать: "))
          known = 1
          days = 0
          while known < n:
              known = known * 2
              days = days + 1
          print(f"Дней: {days}")
          print(f"Узнали: {known}")
        explanation: >-
          Сегодня знает один человек и дней прошло 0 — с этих значений начинается цикл. Пока
          знающих меньше N, каждая итерация — это один день: число знающих удваивается, счётчик
          дней растёт на 1. Как только знающих стало не меньше N, условие ложно и цикл
          заканчивается. Если N = 1, условие ложно сразу — тело не выполняется ни разу, и
          программа печатает 0 дней. Итоговые строки стоят без отступа и печатаются один раз.
