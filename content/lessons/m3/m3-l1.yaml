      mistakes:
        - id: if-once
          when:
            failedTest: t1
            codeRegex: '(?<![\s\S]*\bwhile\b[\s\S]*)^[ \t]*if\b(?![\s\S]*\bwhile\b)'
          why: >-
            В коде `if` вместо `while`. `if` выполняет свой блок не больше одного раза, поэтому
            программа записала только первую неделю. `while` возвращается к условию снова и снова,
            пока оно верно.
          try: Замени `if` на `while` — условие и тело можно оставить как есть.
          verify: В «Примере 1» должно появиться четыре строки недель.
        - id: lte
          when:
            outputIncludes: "Неделя 5: 7500"
          why: >-
            Цикл делает лишнюю неделю. Когда накоплено уже 6000 из 6000, цель достигнута, но
            условие всё ещё даёт True и пускает в цикл ещё раз — так бывает, например, со знаком
            `<=`.
          try: Цикл должен идти, пока накоплено строго меньше цели. Какой знак сравнения это записывает?
          verify: "В «Примере 1» должно быть 4 недели, последняя — «Неделя 4: 6000»."
        - id: print-after-loop
          when:
            outputEquals: |-
              Неделя 4: 6000
              Цель достигнута за 4 нед.
          why: >-
            Напечаталась только последняя неделя. Строка с `print` стоит без отступа, поэтому она не
            входит в тело цикла: выполнилась один раз, когда цикл уже закончился.
          try: >-
            Сдвинь `print` строки недели вправо на 4 пробела — на тот же отступ, что и строки с
            прибавлением.
          verify: В «Примере 1» должно появиться четыре строки недель.
        - id: weeks-not-counted
          when:
            outputIncludes: "Неделя 0: 3000"
          why: >-
            Номер недели застрял на нуле: внутри цикла счётчик недель не растёт. Либо строки,
            которая прибавляет к `weeks` единицу, нет, либо она стоит без отступа и выполняется
            один раз — уже после цикла.
          try: Увеличивай `weeks` на 1 внутри тела цикла, перед `print`.
          verify: В «Примере 1» строки должны идти по порядку — «Неделя 1», «Неделя 2»…
        - id: print-too-early
          when:
            outputIncludes: ": 0\n"
          why: >-
            В первой строке — неделя 0 или накоплено 0: `print` стоит раньше, чем обновились
            значения. Тело выполняется сверху вниз, поэтому сначала обнови значения, а потом
            печатай.
          try: Перенеси `print` в конец тела цикла, после обеих строк с прибавлением.
          verify: "Первой строкой в «Примере 1» должна стать «Неделя 1: 1500»."
        - id: total-misplaced
          when:
            outputIncludes: "нед.\nНеделя"
          why: >-
            Итог «Цель достигнута…» напечатался раньше, чем закончились недели. Значит, он стоит не
            после цикла: либо с отступом внутри тела — тогда повторяется каждую неделю, либо выше
            цикла — тогда выполняется до него, когда недель ещё 0.
          try: >-
            Поставь `print` с итогом в самый конец программы, без отступа, — после всех строк тела
            цикла.
          verify: "В «Примере 1» итог «Цель достигнута за 4 нед.» должен быть одной последней строкой."
        - id: overshoot-neq
          when:
            failedTest: t2
            codeRegex: '^[ \t]*while\b[^\n]*!='
          why: >-
            Условие со знаком `!=` ждёт, что накоплено станет ровно столько, сколько цель. При цели
            5000 и взносе 2000 копилка «перелетает» цель: 4000, 6000, 8000… Ровно 5000 не будет
            никогда, поэтому условие всегда верно и цикл не заканчивается.
          try: Цикл нужен, пока накоплено меньше цели. Какой знак сравнения это записывает?
          verify: "«Пример 2» должен закончиться строкой «Неделя 3: 6000» и итогом за 3 недели."
        - id: weeks-from-one
          when:
            outputIncludes: "Неделя 4: 6000\nЦель достигнута за 5 нед."
          why: >-
            Недель напечатано четыре, а в итоге — пять: счётчик недель вырос на один раз больше,
            чем выполнилось тело цикла. Так бывает, если счётчик начат с 1 или увеличивается ещё и
            после цикла. До цикла не прошло ни одной недели.
          try: Начни счётчик недель с 0 и увеличивай его только в теле цикла, до `print`.
          verify: "В «Примере 1» итог должен быть «Цель достигнута за 4 нед.»."
        - id: stops-early
          when:
            outputIncludes: "Неделя 3: 4500\nЦель достигнута за 3 нед."
          why: >-
            Цикл остановился на неделю раньше: после «Неделя 3: 4500» до цели 6000 ещё не хватает,
            а условие уже ложно. Так бывает, если с целью сравнивается не то, что уже накоплено, а
            «накоплено плюс следующий взнос».
          try: >-
            Сравнивай с целью только то, что уже лежит в копилке: пока накоплено меньше цели, нужна
            ещё неделя. Если последний взнос «перелетит» цель — это нормально.
          verify: "В «Примере 1» должно быть 4 недели, последняя — «Неделя 4: 6000»."
        - id: no-f
          when:
            outputIncludes: "Неделя {"
          why: >-
            Вместо чисел напечатались фигурные скобки с именами переменных: перед кавычками нет
            буквы `f`, и строка печатается как есть.
          try: Поставь `f` перед открывающей кавычкой в строке недели.
          verify: "Первой строкой в «Примере 1» должна стать «Неделя 1: 1500»."
        - id: no-loop
          when:
            failedTest: t1
            outputEquals: Цель достигнута за 0 нед.
          why: >-
            Программа сразу напечатала итог за 0 недель. Цикла, который добавляет взносы, пока нет —
            или его тело не выполнилось ни разу, потому что условие ложно с самого начала.
          try: >-
            На месте комментария напиши `while` с условием, при котором нужна ещё одна неделя, и
            тремя строками тела с отступом.
          verify: В «Примере 1» должно появиться четыре строки недель.
      afterPass: >-
        Цикл сам находит нужную неделю, даже когда последний взнос «перелетает» цель. Попробуй в
        поле «Ввод для „Запустить“» цель 10000 и взнос 3000: сколько окажется в копилке после
        последней недели?
      skills: [while-loops, variables, f-strings]

  - id: practice-ladder
    type: exercise
    title: Практика 2
    exercise:
      id: m3-l1-e2
      kind: modify
      title: Лесенка взносов
      statement: |-
        Тимур решил откладывать с каждой неделей больше: в первую неделю — первый взнос, а в каждую
        следующую — на одну и ту же прибавку больше, чем в прошлую. При первом взносе 1000 и
        прибавке 500 он откладывает 1000, 1500, 2000, 2500…

        Измени программу копилки: теперь она читает три числа — цель, первый взнос и прибавку.
        Формат вывода прежний. Например, при цели 5000, первом взносе 1000 и прибавке 500:

        ```text
        Неделя 1: 1000
        Неделя 2: 2500
        Неделя 3: 4500
        Неделя 4: 7000
        Цель достигнута за 4 нед.
        ```
      input: >-
        Три строки — цель (целое, 0 или больше), первый взнос (целое больше нуля) и прибавка
        (целое, 0 или больше).
      output: "Строка `Неделя N: <накоплено>` для каждой недели, затем `Цель достигнута за N нед.`"
      constraints:
        - Прибавка тоже читается из ввода.
        - При прибавке 0 программа работает как обычная копилка.
      starterCode: |
        goal = int(input("Цель: "))
        weekly = int(input("Взнос в неделю: "))
        savings = 0
        weeks = 0
        while savings < goal:
            savings = savings + weekly
            weeks = weeks + 1
            print(f"Неделя {weeks}: {savings}")
        print(f"Цель достигнута за {weeks} нед.")
      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          stdin: "5000\n1000\n500\n"
          expected: |-
            Неделя 1: 1000
            Неделя 2: 2500
            Неделя 3: 4500
            Неделя 4: 7000
            Цель достигнута за 4 нед.
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 2: прибавка 0"
          example: true
          stdin: "3000\n500\n0\n"
          expected: |-
            Неделя 1: 500
            Неделя 2: 1000
            Неделя 3: 1500
            Неделя 4: 2000
            Неделя 5: 2500
            Неделя 6: 3000
            Цель достигнута за 6 нед.
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: цель набрана ровно"
          edge: true
          stdin: "2500\n1000\n500\n"
          expected: |-
            Неделя 1: 1000
            Неделя 2: 2500
            Цель достигнута за 2 нед.
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: цель 0"
          edge: true
          stdin: "0\n1000\n100\n"
          expected: Цель достигнута за 0 нед.
        - id: t5
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: большая прибавка"
          edge: true
          stdin: "1000\n100\n1000\n"
          expected: |-
            Неделя 1: 100
            Неделя 2: 1200
            Цель достигнута за 2 нед.
      criteria:
        - Программа читает третье число — прибавку.
        - В первую неделю откладывается первый взнос, в каждую следующую — на прибавку больше, чем в прошлую.
        - Цикл останавливается, как только накоплено не меньше цели; при прибавке 0 всё работает как в обычной копилке.
      hints:
        - >-
          Что теперь меняется от недели к неделе, кроме накоплений и номера недели? И когда это
          должно меняться — до того, как взнос положили в копилку, или после?
        - |-
          Похожий приём: проезд дорожает на 10 после каждой поездки.
          ```python
          spent = 0
          price = 50
          trips = 0
          while trips < 3:
              spent = spent + price
              trips = trips + 1
              price = price + 10
          print(spent)
          ```
          Поездки стоили 50, 60 и 70, программа выведет 180. Цена растёт после того, как за
          поездку уже заплатили.
        - |-
          Каркас:
          ```text
          прибавка = int(input(...))
          ...
          while накоплено < цель:
              накоплено = накоплено + взнос
              недели = недели + 1
              print(...)
              взнос = взнос + прибавка
          ```
      solution:
        code: |
          goal = int(input("Цель: "))
          weekly = int(input("Первый взнос: "))
          step = int(input("Прибавка: "))
          savings = 0
          weeks = 0
          while savings < goal:
              savings = savings + weekly
              weeks = weeks + 1
              print(f"Неделя {weeks}: {savings}")
              weekly = weekly + step
          print(f"Цель достигнута за {weeks} нед.")
        explanation: >-
          Теперь в цикле меняются три переменные: накопления, номер недели и сам взнос. Взнос
          растёт в конце тела — после того как его положили в копилку, поэтому в первую неделю
          откладывается исходная сумма, а прибавка действует со второй. При прибавке 0 строка
          `weekly = weekly + step` ничего не меняет, и программа работает как прежняя копилка.
