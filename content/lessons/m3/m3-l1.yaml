id: m3-l1
module: m3
number: "3.1"
title: "while: повторять, пока условие верно"
objective: >-
  Писать цикл while, условие которого со временем становится ложным, и заранее говорить, сколько
  раз выполнится тело и какое значение останется в переменной после цикла.
minutes: [20, 30]
prerequisites: [m2-l6]
skills: [while-loops]
environment: python

story:
  title: Копилка в тетради
  fictional: true
  text: >-
    Тимур копит на велосипед за 12 000: каждую субботу откладывает 1500 и записывает в тетрадь,
    какая идёт неделя и сколько накоплено. На седьмой строчке он ошибся в сложении и ещё две
    недели думал, что до велосипеда далеко, хотя нужная сумма уже лежала в копилке. Тогда Тимур
    решил, что складывать будет программа, а ей хватит одного правила: «пока накоплено меньше
    цели — прибавь взнос и запиши неделю». Программа сама остановилась ровно на
    той неделе, когда копилка дошла до цели, и ни разу не ошиблась в сложении.

why: >-
  Многие действия повторяются, пока не случится нужное событие: копить, пока не хватит на покупку,
  удваивать, пока не превысит порог. Цикл while записывает такое повторение одной конструкцией:
  «пока накоплено меньше 12 000 — прибавляй 1500».

usedIn: >-
  Игровой цикл «пока игра не окончена»; программы-опросники, которые спрашивают, пока не получат
  ответ; повторные попытки подключиться к серверу; расчёты «через сколько недель или месяцев»:
  накопления, рост числа подписчиков, запас товара на складе.

steps:
  - id: idea
    type: theory
    title: Цикл while
    body: |-
      Часто действие нужно повторять, пока не случится что-то важное. Для этого есть **цикл** —
      конструкция, которая повторяет блок кода. Первый цикл, который мы изучим, — **while**
      (читается «вайл», значит «пока»):

      ```python
      temp = 20
      while temp < 100:
          print(f"Греется: {temp}°")
          temp = temp + 20
      print("Вскипел!")
      ```

      Запись похожа на `if`: слово `while`, условие, двоеточие. Строки с отступом под ним — **тело
      цикла**. Один проход тела называют **итерацией**. Строка без отступа после цикла выполнится
      один раз — когда цикл закончится. Эта программа напечатает «Греется» четыре раза — при 20,
      40, 60 и 80 градусах, — а потом «Вскипел!». До 100 строка «Греется» не дойдёт: при
      `temp = 100` условие уже ложно.

      Как Python выполняет while:

      1. Проверяет условие.
      2. Если оно True — выполняет тело целиком, сверху вниз, и возвращается к шагу 1.
      3. Если оно False — переходит к строке после цикла.

      Условие проверяется **только перед каждой итерацией**. Если оно стало ложным посреди тела,
      тело всё равно доработает до конца.

      Главное отличие от `if`: `if` выполняет блок не больше одного раза, а `while` — снова и
      снова, пока условие верно. Если условие ложно с самого начала, тело не выполнится ни разу.

      **Какое условие писать.** В `while` пишут условие, при котором нужен **ещё один** проход.
      Если в задаче сказано, когда остановиться («пока не вскипит», «станет не меньше N»),
      переверни его: «не вскипел» — это `temp < 100`.

      **Как цикл заканчивается.** Внутри тела должна меняться переменная из условия — так, чтобы
      условие со временем стало ложным. Если она не меняется, а условие верно, проверка каждый
      раз даёт True — получится **бесконечный цикл**. Тренажёр остановит такую программу сам.
      Если цикл печатает — почти сразу, с сообщением «Слишком много вывода»; если молчит — через
      несколько секунд, с сообщением «Программа работает слишком долго». Можно остановить её и
      самому кнопкой «Остановить». В терминале на компьютере программу прерывают клавишами Ctrl+C.

      **Значение после цикла.** Когда цикл закончился, в переменной из условия лежит первое
      значение, при котором условие стало ложным. Оно может «перелететь» цель: если откладывать по
      2500 при цели 12 000, после цикла в копилке будет 12 500.

      Чтобы понять цикл, выпиши значения переменных по шагам — строчку на каждую итерацию.
      Подробно этим займёмся в уроке 3.6.
    simpler: >-
      while — как «пока чайник не вскипел — грей». Python проверяет условие, выполняет строки с
      отступом и снова проверяет. Условие ложно — идёт дальше, к строке без отступа. В условие
      пишут, когда нужно продолжать: «не вскипел» — это `temp < 100`. Если внутри цикла ничего
      не меняется, проверка всегда даёт один и тот же ответ, и цикл не кончится.
    coach: >-
      Прежде чем запускать while, спроси себя: какая строка внутри цикла приближает условие к
      False?

  - id: piggy-bank
    type: example
    title: Копилка Тимура
    body: >-
      Программа из истории: цель — 12 000, взнос — 1500 в неделю. Нажми «Запустить» и посмотри,
      на какой неделе цикл остановится.
    code: |-
      goal = 12000
      weekly = 1500
      savings = 0
      weeks = 0
      while savings < goal:
          savings = savings + weekly
          weeks = weeks + 1
          print(f"Неделя {weeks}: {savings}")
      print(f"Цель достигнута за {weeks} нед.")
    notes:
      - line: 3
        text: >-
          До цикла в копилке 0. Переменные, которые растут по ходу цикла, подробно разберём в
          уроке 3.3.
      - line: 4
        text: Счётчик недель — сколько раз уже выполнилось тело цикла.
      - line: 5
        text: >-
          Условие проверяется перед каждой неделей: накоплено меньше цели — нужна ещё одна
          неделя.
      - line: 6
        text: >-
          Здесь меняется переменная из условия. Без этой строки `savings` навсегда останется 0, и
          цикл станет бесконечным.
      - line: 7
        text: Номер недели растёт на 1 на каждой итерации.
      - line: 8
        text: "`print` с отступом стоит внутри цикла, поэтому печатает строку на каждую неделю."
      - line: 9
        text: Строка без отступа — уже после цикла. Она выполнится один раз, когда условие станет ложным.
    tryIt: >-
      Поменяй `weekly` на 2500 и запусти. Сколько недель понадобится и сколько окажется в копилке?
      Потом поставь `goal = 0`: сколько раз выполнится тело цикла?
    coach: >-
      Обрати внимание: цикл не знает заранее, что недель будет 8. Он просто проверяет условие
      перед каждой неделей.

  - id: triple
    type: predict
    title: Утроение до 20
    prompt: Как думаешь, что выведет программа?
    code: |-
      n = 1
      while n < 20:
          n = n * 3
          print(n)
    options:
      - |-
        3
        9
      - |-
        3
        9
        27
      - |-
        1
        3
        9
    answer: |-
      3
      9
      27
    explanation: |-
      Выпишем `n` по итерациям:

      ```text
      n до итерации   n < 20?   n после умножения   print
      1               да        3                   3
      3               да        9                   9
      9               да        27                  27
      27              нет       цикл закончен
      ```

      При `n = 9` условие ещё верно, поэтому начинается третья итерация. Умножение даёт 27, и
      условие `27 < 20` уже ложно, но проверяется оно только перед следующей итерацией. Тело
      дорабатывает до конца, и `print` успевает вывести 27. «1» в начале не будет: `print` стоит
      после умножения. После цикла в `n` лежит 27 — первое значение, при котором условие стало
      ложным.
    coach: >-
      Не торопись: выпиши `n` после каждой итерации столбиком — так ответ получается наверняка.

  - id: endless
    type: quiz
    title: Программа, которая не остановится
    question: |-
      Что произойдёт, если запустить эту программу?

      ```python
      count = 0
      while count < 3:
          print("Привет")
      print("Готово")
      ```
    options:
      - «Привет» напечатается три раза, затем «Готово»
      - «Привет» печатается снова и снова — сама программа не остановится
      - Python сразу сообщит об ошибке, потому что count в цикле не меняется
    correct: 1
    explanation: >-
      В теле цикла `count` не меняется: он всегда 0, и условие `count < 3` каждый раз даёт True.
      «Привет» печатается без конца, до «Готово» дело не доходит. Python такую ошибку заранее не
      замечает: записано всё по правилам. Чтобы исправить программу, добавь в тело строку
      `count = count + 1` — тогда «Привет» появится три раза, а за ним «Готово».
    coach: >-
      Бесконечный цикл — не поломка компьютера, а условие, которое никогда не станет ложным. Ищи,
      что должно меняться внутри цикла.

  - id: practice-savings
    type: exercise
    title: Практика 1
    exercise:
      id: m3-l1-e1
      kind: repeat
      title: Копилка на любую цель
      statement: |-
        Велосипед Тимур купил, теперь он копит на самокат, а его друзья — на свои покупки. Нужна
        программа для любой цели: цель и недельный взнос она читает из ввода. Пока накоплено
        меньше цели, программа добавляет взнос и печатает строку недели, а в конце — итог.

        Например, при цели 6000 и взносе 1500:

        ```text
        Неделя 1: 1500
        Неделя 2: 3000
        Неделя 3: 4500
        Неделя 4: 6000
        Цель достигнута за 4 нед.
        ```

        Чтение ввода и итоговая строка уже есть в стартовом коде. Допиши цикл на место
        комментария — выше итоговой строки.
      input: Две строки — цель (целое число, 0 или больше) и недельный взнос (целое число больше нуля).
      output: "Строка `Неделя N: <накоплено>` для каждой недели, затем `Цель достигнута за N нед.`"
      constraints:
        - Сколько будет недель, заранее неизвестно, — используй цикл while.
        - Взнос всегда больше нуля.
      starterCode: |
        goal = int(input("Цель: "))
        weekly = int(input("Взнос в неделю: "))
        savings = 0
        weeks = 0
        # Пока накоплено меньше цели: прибавь взнос, увеличь счётчик недель
        # и выведи строку «Неделя …: …»

        print(f"Цель достигнута за {weeks} нед.")
      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          stdin: "6000\n1500\n"
          expected: |-
            Неделя 1: 1500
            Неделя 2: 3000
            Неделя 3: 4500
            Неделя 4: 6000
            Цель достигнута за 4 нед.
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 2
          example: true
          stdin: "5000\n2000\n"
          expected: |-
            Неделя 1: 2000
            Неделя 2: 4000
            Неделя 3: 6000
            Цель достигнута за 3 нед.
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: цель равна взносу"
          edge: true
          stdin: "1000\n1000\n"
          expected: |-
            Неделя 1: 1000
            Цель достигнута за 1 нед.
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: взнос больше цели"
          edge: true
          stdin: "700\n1000\n"
          expected: |-
            Неделя 1: 1000
            Цель достигнута за 1 нед.
        - id: t5
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: цель 0 — копить не нужно"
          edge: true
          stdin: "0\n500\n"
          expected: Цель достигнута за 0 нед.
      criteria:
        - Строка недели печатается на каждой неделе, пока накоплено меньше цели.
        - Цикл останавливается на той неделе, когда накоплено стало не меньше цели, — даже если последний взнос «перелетает» цель.
        - Итоговая строка печатается один раз, после цикла.
      hints:
        - >-
          Посмотри на «Копилку Тимура»: какие строки там повторяются каждую неделю и какое условие
          решает, нужна ли ещё одна неделя?
        - |-
          Тот же приём на другом примере — игрок проходит уровни, пока не дойдёт до третьего:
          ```python
          level = 0
          while level < 3:
              level = level + 1
              print(f"Уровень {level}")
          ```
          Программа выведет «Уровень 1», «Уровень 2» и «Уровень 3».
        - |-
          Каркас цикла:
          ```text
          while накоплено < цель:
              накоплено = накоплено + взнос
              недели = недели + 1
              print(f"Неделя {…}: {…}")
          ```
          Все три строки тела — с отступом.
      solution:
        code: |
          goal = int(input("Цель: "))
          weekly = int(input("Взнос в неделю: "))
          savings = 0
          weeks = 0
          while savings < goal:
              savings = savings + weekly
              weeks = weeks + 1
              print(f"Неделя {weeks}: {savings}")
          print(f"Цель достигнута за {weeks} нед.")
        explanation: >-
          Условие `savings < goal` проверяется перед каждой неделей. В теле накопления растут на
          взнос, поэтому условие со временем становится ложным и цикл заканчивается. Номер недели
          растёт вместе с накоплениями, а `print` с отступом печатает строку на каждой итерации.
          Итог стоит без отступа и печатается один раз. При цели 0 условие ложно сразу: тело не
          выполняется ни разу, и программа печатает «за 0 нед.».
      altSolutions:
        - code: |
            goal = int(input())
            weekly = int(input())
            savings = 0
            weeks = 0
            while goal > savings:
                weeks = weeks + 1
                savings = savings + weekly
                print(f"Неделя {weeks}: {savings}")
            print(f"Цель достигнута за {weeks} нед.")
          note: Условие записано наоборот, счётчик недель увеличивается раньше накоплений.
        - code: |
            goal = int(input())
            weekly = int(input())
            savings = 0
            weeks = 0
            while not savings >= goal:
                savings += weekly
                weeks += 1
                print("Неделя " + str(weeks) + ": " + str(savings))
            print("Цель достигнута за", weeks, "нед.")
          note: Условие через not, короткая запись += и вывод без f-строк.
        - code: |
            target = int(input())
            step = int(input())
            bank = 0
            n = 0
            while bank - target < 0:
            	bank = step + bank
            	n = 1 + n
            	print(f"Неделя {n}: {bank}")
            print(f"Цель достигнута за {n} нед.")
          note: Отступ табуляцией, другие имена, условие через разность.
        - code: |
            goal = int(input())
            weekly = int(input())
            weeks = 0
            while weeks * weekly < goal:
              weeks = weeks + 1
              print(f"Неделя {weeks}: {weeks * weekly}")
            print(f"Цель достигнута за {weeks} нед.")
          note: Отступ в 2 пробела; отдельной переменной для накоплений нет — их считает weeks * weekly.
        - code: |
            цель = int(input("Цель: "))
            взнос = int(input("Взнос: "))
            накоплено = 0
            недели = 0
            while накоплено < цель:
                накоплено = накоплено + взнос
                недели = недели + 1
                print(f"Неделя {недели}: {накоплено}")
            print("Цель достигнута за " + str(недели) + " нед.")
          note: Русские имена переменных, итог склейкой.
        - code: |
            goal = int(input())
            weekly = int(input())
            left = goal
            weeks = 0
            while left > 0:
                left = left - weekly
                weeks = weeks + 1
                print(f"Неделя {weeks}: {goal - left}")
            print(f"Цель достигнута за {weeks} нед.")
          note: Цикл идёт, пока осталось накопить больше нуля.
      wrongSolutions:
        - code: |
            goal = int(input("Цель: "))
            weekly = int(input("Взнос в неделю: "))
            savings = 0
            weeks = 0
            if savings < goal:
                savings = savings + weekly
                weeks = weeks + 1
                print(f"Неделя {weeks}: {savings}")
            print(f"Цель достигнута за {weeks} нед.")
          note: if вместо while — тело выполняется один раз.
          expectMistake: if-once
        - code: |
            goal = int(input("Цель: "))
            weekly = int(input("Взнос в неделю: "))
            savings = 0
            weeks = 0
            while savings <= goal:
                savings = savings + weekly
                weeks = weeks + 1
                print(f"Неделя {weeks}: {savings}")
            print(f"Цель достигнута за {weeks} нед.")
          note: "<= вместо < — лишняя неделя, когда накоплено ровно столько, сколько нужно."
          expectMistake: lte
        - code: |
            goal = int(input("Цель: "))
            weekly = int(input("Взнос в неделю: "))
            savings = 0
            weeks = 0
            while savings < goal:
                savings = savings + weekly
                weeks = weeks + 1
            print(f"Неделя {weeks}: {savings}")
            print(f"Цель достигнута за {weeks} нед.")
          note: print строки недели без отступа — выполняется один раз после цикла.
          expectMistake: print-after-loop
        - code: |
            goal = int(input("Цель: "))
            weekly = int(input("Взнос в неделю: "))
            savings = 0
            weeks = 0
            while savings < goal:
                savings = savings + weekly
                print(f"Неделя {weeks}: {savings}")
            weeks = weeks + 1
            print(f"Цель достигнута за {weeks} нед.")
          note: Счётчик недель без отступа — увеличивается один раз после цикла.
          expectMistake: weeks-not-counted
        - code: |
            goal = int(input("Цель: "))
            weekly = int(input("Взнос в неделю: "))
            savings = 0
            weeks = 0
            while savings < goal:
                print(f"Неделя {weeks}: {savings}")
                savings = savings + weekly
                weeks = weeks + 1
            print(f"Цель достигнута за {weeks} нед.")
          note: "print раньше, чем обновились значения, — первая строка «Неделя 0: 0»."
          expectMistake: print-too-early
        - code: |
            goal = int(input("Цель: "))
            weekly = int(input("Взнос в неделю: "))
            savings = 0
            weeks = 0
            while savings < goal:
                savings + weekly
                weeks = weeks + 1
                print(f"Неделя {weeks}: {savings}")
            print(f"Цель достигнута за {weeks} нед.")
          note: >-
            Сумма посчитана, но не сохранена в savings — условие всегда верно, цикл бесконечный,
            вывод упирается в лимит. Разборы из материалов не срабатывают: ученик видит общий
            разбор «Слишком много вывода».
          expectMistake: null
        - code: |
