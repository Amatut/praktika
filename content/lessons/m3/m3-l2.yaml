  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`for` берёт числа из `range` по очереди и кладёт каждое в переменную цикла — менять её вручную не нужно."
      - "`range(start, stop, step)` начинается со start и шагает на step, а конец stop в ряд не входит никогда. При счёте вверх конец на единицу больше последнего числа (до n — конец n + 1), при счёте вниз — на единицу меньше (до 1 — конец 0)."
      - "Отрицательный шаг считает вниз: `range(5, 0, -1)` даёт 5, 4, 3, 2, 1. `range(5, 0)` без шага пустой — тело не выполнится ни разу."
      - "`for` — когда число повторений известно заранее, `while` — когда повторяем, пока что-то не случится."
    question: Какой range даст числа 20, 15, 10, 5?
    answer: >-
      `range(20, 0, -5)`. Шаг −5 ведёт вниз, а конец в ряд не входит, поэтому он должен быть
      меньше 5: подойдёт любое число от 0 до 4. С концом 5 ряд остановится на 10, а с концом −1 в
      него попадёт и 0.
