id: m3-l2
module: m3
number: "3.2"
title: "for и range: известное число шагов"
objective: >-
  Повторять действие заданное число раз циклом for с range и выбирать начало, конец и шаг range
  так, чтобы получить ровно нужные значения.
minutes: [20, 30]
prerequisites: [m3-l1]
skills: [for-range]
environment: python

story:
  title: Табличка для тренера
  fictional: true
  text: >-
    Тренер беговой секции Тамара перед тренировками и забегами писала на доске план: номера
    подходов, обратный отсчёт до старта и километры, где стоят столики с водой. Однажды, расписывая
    пункты для трассы в 21 км, она пропустила пункт на 15-м километре, и бегунам пришлось долго
    бежать без воды. Теперь план печатает короткая программа: Тамара вводит длину трассы и интервал
    между пунктами, а цикл сам перебирает километры. Ошибиться в такой программе легче всего в
    границах — сегодня ты научишься задавать их точно.

why: >-
  Когда заранее известно, сколько раз повторять — 10 подходов, 7 дней недели, каждый 5-й
  километр, — удобнее цикл `for`: он сам перебирает числа, которые даёт `range`. Например,
  `for km in range(5, 22, 5)` по очереди даёт 5, 10, 15 и 20.

usedIn: >-
  Отчёты по дням месяца, нумерация строк, страниц и мест в зале, заданное число раундов в игре,
  повтор измерения N раз. В модуле 4 тот же `for` будет перебирать записи списка — каждую покупку,
  каждого участника.

steps:
  - id: for-range
    type: theory
    title: Цикл for и range
    body: |-
      В уроке 3.1 цикл `while` повторял тело, пока условие верно, а переменную из условия мы
      меняли сами. Но часто число повторений известно заранее: 10 подходов, 7 дней недели. Для
      этого есть цикл **for**:

      ```python
      for i in range(3):
          print("Круг", i)
      ```

      Программа печатает «Круг 0», «Круг 1», «Круг 2». `range(3)` даёт **ряд** чисел 0, 1, 2 (его
      ещё называют диапазоном). `for` берёт из ряда числа по очереди, кладёт каждое в **переменную
      цикла** `i` и выполняет тело. Менять `i` вручную не нужно: `for` сам переходит к следующему
      числу, а когда числа кончились — к строке после цикла.

      Запись: слово `for`, имя переменной (любое: `i`, `day`, `km`), `in` («из»), ряд и двоеточие.
      Тело — строки с отступом, как у `while`.

      Числа в скобках `range` называют **аргументами**. Их может быть один, два или три: начало
      (start), конец (stop) и **шаг** (step).

      - `range(stop)` — от 0 до stop − 1;
      - `range(start, stop)` — от start до stop − 1: `range(1, 4)` даёт 1, 2, 3;
      - `range(start, stop, step)` — с шагом step: `range(5, 22, 5)` даёт 5, 10, 15, 20.

      Главное правило: **конец в ряд не входит никогда**. Конец ещё называют правой границей.
      При шаге 1 (если stop больше start) в ряду stop − start чисел: в `range(3, 8)` их
      8 − 3 = 5. Чтобы ряд закончился на n, пиши `range(1, n + 1)`.

      **Отрицательный шаг** считает вниз: `range(5, 0, -1)` даёт 5, 4, 3, 2, 1. Конец не входит и
      здесь: ноля в ряду нет. А `range(5, 0)` без шага **пустой**: шаг по умолчанию +1, а вверх от
      5 до 0 не дойти. Тело такого цикла не выполнится ни разу, и ошибки не будет — это легко не
      заметить. Пустым бывает и `range(1, 1)`: при n = 0 у цикла `for i in range(1, n + 1)` не
      будет ни одной итерации.

      **for или while?** `for` — когда число повторений известно до начала цикла или его можно
      посчитать. `while` — когда повторяем, пока что-то не случится: копим, пока не наберётся
      нужная сумма.
    simpler: >-
      `range` — лента с номерами: начинаешь с первого числа, прыгаешь на шаг и останавливаешься, не
      доходя до числа-границы: на него самого не наступаешь. `for` берёт номера с ленты по очереди,
      кладёт каждый в переменную и выполняет тело. Номера кончились — цикл закончен.
    coach: >-
      Проверяй range по двум числам: каким будет первое значение и каким последнее. Если
      последнего нужного числа в ряду нет — сдвинь конец на единицу дальше по ходу ряда.

  - id: times-table
    type: example
    title: Таблица умножения на число
    body: >-
      Программа печатает таблицу умножения на число из ввода. Во вводе примера — 7. Тренажёр такой
      таблицы ты напишешь в конце модуля.
    code: |-
      n = int(input())
      for i in range(1, 11):
          print(f"{n} * {i} = {n * i}")
    stdin: "7\n"
    notes:
      - line: 1
        text: Число из ввода. Внутри цикла оно не меняется.
      - line: 2
        text: >-
          `range(1, 11)` даёт 1, 2, …, 10 — число 11 в ряд не входит. Тело выполнится
          11 − 1 = 10 раз, и каждый раз в `i` будет следующее число.
      - line: 3
        text: >-
          Тело цикла. `i` на каждой итерации новое, `n` — то же самое, поэтому `n * i` каждый раз
          даёт следующую строку таблицы.
    tryIt: >-
      Сделай таблицу только до 5 — какое число нужно поставить вторым в `range`? Потом оставь
      только чётные множители 2, 4, …, 10: добавь третий аргумент — шаг, `range(2, 11, 2)`.
    coach: >-
      Заметь: в коде нет ни одной строки, которая меняет `i`. Это делает сам `for`.

  - id: jumps
    type: predict
    title: Прыжки по три
    prompt: >-
      Здесь у `range` три аргумента: начало 2, конец 11, шаг 3. Как думаешь, что выведет
      программа?
    code: |-
      for k in range(2, 11, 3):
          print(k)
    options:
      - |-
        2
        5
        8
      - |-
        2
        5
        8
        11
      - |-
        2
        5
        8
        10
      - |-
        3
        6
        9
    answer: |-
      2
      5
      8
    explanation: >-
      `k` начинается с 2 и каждый раз растёт на 3: 2, 5, 8. Следующее было бы 11, но 11 не меньше
      правой границы 11 — ряд закончился. 10 сюда не попадает: числа идут через 3, и 10 среди них
      нет. Правило «последнее число — stop − 1» верно только для шага 1. И начинает ряд первый
      аргумент, а не шаг, поэтому 3 тоже нет.
    coach: >-
      С шагом больше 1 выпиши ряд на бумаге: первое число, плюс шаг, плюс шаг — пока не упрёшься в
      правую границу.

  - id: how-many
    type: quiz
    title: Сколько раз?
    question: |-
      Сколько раз выполнится тело этого цикла?

      ```python
      for day in range(4, 12):
          print("Тренировка")
      ```
    options:
      - "7"
      - "8"
      - "9"
    correct: 1
    explanation: >-
      `day` по очереди равен 4, 5, 6, 7, 8, 9, 10, 11 — это восемь чисел: 12 − 4 = 8. Число 12 —
      правая граница, в ряд оно не входит, поэтому девяти раз не будет.

  - id: practice-sets
    type: exercise
    title: Практика 1
    exercise:
      id: m3-l2-e1
      kind: repeat
      title: Подходы на тренировке
      statement: |-
        Тамара вводит, сколько подходов будет на тренировке. Программа печатает строку для каждого
        подхода по порядку, а в конце — «Тренировка окончена». Например, для 3 подходов:

        ```text
        Подход 1 из 3
        Подход 2 из 3
        Подход 3 из 3
        Тренировка окончена
        ```
      input: Одно целое число n ≥ 0 — сколько подходов.
      output: "n строк `Подход k из n` (k от 1 до n), затем строка `Тренировка окончена`."
      constraints:
        - Повтори подходы циклом `for` с `range(...)` — в этом задании тренируем именно его.
        - Если n = 0, подходов нет — печатается только «Тренировка окончена».
      starterCode: |
        n = int(input())
        # Для каждого подхода выведи строку «Подход k из n»

        print("Тренировка окончена")
      tests:
        - id: t1
          kind: io
          title: Пример 1
          example: true
          stdin: "3\n"
          expected: |-
            Подход 1 из 3
            Подход 2 из 3
            Подход 3 из 3
            Тренировка окончена
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "5\n"
          expected: |-
            Подход 1 из 5
            Подход 2 из 5
            Подход 3 из 5
            Подход 4 из 5
            Подход 5 из 5
            Тренировка окончена
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: "Граничный случай: один подход"
          edge: true
          stdin: "1\n"
          expected: |-
            Подход 1 из 1
            Тренировка окончена
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: ноль подходов"
          edge: true
          stdin: "0\n"
          expected: Тренировка окончена
          compare:
            ignoreSpaces: true
      rules:
        - id: use-for
          use: [For, call:range]
          message: "В этом задании потренируй for: повтори подходы циклом `for` с `range(...)`."
      criteria:
        - Строк «Подход …» ровно n, номера идут от 1 до n, в каждой строке указано общее число n.
        - «Тренировка окончена» печатается один раз, в самом конце.
        - При n = 0 печатается только «Тренировка окончена».
        - Подходы повторяются циклом `for` с `range`.
      hints:
        - >-
          Сколько раз нужно напечатать строку «Подход …» и с какого номера начинается счёт? Вспомни
          главное правило `range` про правую границу.
        - |-
          На другом примере:
          ```python
          for day in range(1, 4):
              print(f"День {day}")
          ```
          печатает «День 1», «День 2», «День 3» — число 4 в ряд не входит.
        - |-
          Каркас:
          ```text
          for номер in range(1, …):
              print(f"Подход {…} из {…}")
          print("Тренировка окончена")
          ```
          Подумай, что поставить концом ряда, чтобы последним номером было n.
      solution:
        code: |
          n = int(input())
          for k in range(1, n + 1):
              print(f"Подход {k} из {n}")
          print("Тренировка окончена")
        explanation: >-
          `range(1, n + 1)` даёт номера от 1 до n: правая граница не входит, поэтому к n прибавлена
          единица. `k` на каждой итерации — номер подхода, а `n` не меняется. При n = 0 ряд
          `range(1, 1)` пустой: тело не выполняется ни разу, и печатается только итоговая строка —
          она стоит без отступа, после цикла. Подойдёт и `range(n)` с `k + 1` в выводе.
      wrongSolutions:
        - code: |
            n = int(input())
            for k in range(n):
                print(f"Подход {k} из {n}")
            print("Тренировка окончена")
          note: range(n) начинается с 0 — первым идёт «Подход 0 из 3».
          expectMistake: from-zero
        - code: |
            n = int(input())
            for k in range(0, n):
                print(f"Подход {k} из {n}")
            print("Тренировка окончена")
          note: range(0, n) — два аргумента, но счёт всё равно с нуля.
          expectMistake: from-zero
        - code: |
            n = int(input())
            for k in range(1, n):
                print(f"Подход {k} из {n}")
            print("Тренировка окончена")
          note: Конец range равен n — последний подход потерялся.
          expectMistake: end-excluded
        - code: |
            n = int(input())
            for k in range(1, n + 1):
                print(f"Подход {k + 1} из {n}")
            print("Тренировка окончена")
          note: Смешаны два способа — ряд с 1 и номер + 1, номера сдвинуты на 2, 3, 4.
          expectMistake: number-shift
        - code: |
            n = int(input())
            for k in range(1, n + 1):
                print(f"Подход {k} из {n}")
                print("Тренировка окончена")
          note: Итоговая строка с отступом попала в тело цикла.
          expectMistake: final-inside
        - code: |
            n = int(input())
            # Для каждого подхода выведи строку «Подход k из n»

            print("Тренировка окончена")
            for k in range(1, n + 1):
                print(f"Подход {k} из {n}")
          note: Цикл дописан в конец, под стартовой итоговой строкой, — итог печатается первым.
          expectMistake: final-first
        - code: |
            n = int(input())
            for k in range(1, n + 1):
                print(f"Подход {k} из {n}")
            print("Тренировка окончена")

            print("Тренировка окончена")
          note: Свой итоговый print, а стартовый остался — итог печатается дважды.
          expectMistake: final-twice
        - code: |
            n = int(input())
            for k in range(1, 4):
                print(f"Подход {k} из {n}")
            print("Тренировка окончена")
          note: Число подходов записано в range готовым числом — верно только для 3.
          expectMistake: fixed-count
        - code: |
            n = int(input())
            for k in range(1, 6):
                print(f"Подход {k} из {n}")
            print("Тренировка окончена")
          note: Конец ряда подогнан под Пример 2 — проходит его, но не Пример 1.
          expectMistake: fixed-count
        - code: |
            n = int(input())
            for k in range(1, n + 1):
                print(f"Подход {i} из {n}")
            print("Тренировка окончена")
          note: После for стоит k, а в f-строке — i, как в теории; NameError.
          expectMistake: loop-var-name
        - code: |
            n = int(input())
            for k in range(1, n + 1):
                print("Подход {k} из {n}")
            print("Тренировка окончена")
          note: Нет буквы f перед строкой.
          expectMistake: no-f
        - code: |
            n = int(input())
            k = 1
            while k <= n:
                print(f"Подход {k} из {n}")
                k = k + 1
            print("Тренировка окончена")
          note: Вывод верный, но цикл while вместо for — правило задания не выполнено, ученик видит его сообщение.
          expectMistake: null
      altSolutions:
        - code: |
            n = int(input())
            for i in range(n):
                print(f"Подход {i + 1} из {n}")
            print("Тренировка окончена")
          note: range(n) с нуля, а номер подхода — i + 1.
        - code: |
            n = int(input())
            for k in range(1, n + 1):
                print("Подход", k, "из", n)
            print("Тренировка окончена")
          note: print через запятые вместо f-строки.
        - code: |
            n = int(input())
            for k in range(1, n + 1):
                print("Подход " + str(k) + " из " + str(n))
            print("Тренировка окончена")
          note: Строка склеена через + и str().
        - code: |
            n = int(input())
            # Для каждого подхода выведи строку «Подход k из n»
            for k in range(1, n + 1):
                print("Подход ", k, " из ", n)

            print("Тренировка окончена")
          note: Поверх стартового кода; print через запятые с лишними пробелами в кавычках — двойные пробелы прощаются.
      mistakes:
        - id: no-f
          when:
            outputIncludes: "{"
          why: >-
            На экране видны фигурные скобки — значит, Python считает строку обычным текстом.
            Подставлять значения умеет только f-строка.
          try: Поставь букву `f` прямо перед открывающей кавычкой строки в `print`.
          verify: В «Примере 1» вместо скобок должны появиться номера подходов и число 3.
        - id: loop-var-name
          when:
            errorType: NameError
            codeRegex: '^[ \t]*for[ \t]+(\w+)[ \t]+in\b[\s\S]*\{(?!\1\}|n\})\w+\}'
          why: >-
            Python не знает имени в фигурных скобках: переменная цикла у тебя называется иначе — так,
            как написано сразу после `for`.
          try: В теле цикла пиши то же имя, что стоит после `for`, — или поменяй имя после `for`.
          verify: Ошибка NameError должна исчезнуть, а в «Примере 1» появиться строка «Подход 1 из 3».
        - id: from-zero
          when:
            outputIncludes: "Подход 0 из"
          why: >-
            Счёт начался с нуля. Ряд `range` начинается с первого аргумента, а если аргумент один —
            с 0: и `range(3)`, и `range(0, 3)` дают 0, 1, 2. А подходы Тамара нумерует с единицы.
          try: >-
            Начни ряд с 1 — это первый аргумент `range` — и проверь конец: последним номером должно
            быть n. Другой путь — оставить ряд с нуля, но печатать номер на единицу больше.
          verify: В «Примере 1» первой строкой должно быть «Подход 1 из 3».
        - id: number-shift
          when:
            outputEquals: |-
              Подход 2 из 3
              Подход 3 из 3
              Подход 4 из 3
              Тренировка окончена
          why: >-
            Номера сдвинуты на единицу вверх: первым идёт «Подход 2», а должен «Подход 1».
          try: >-
            Проверь, какое число первым даёт твой `range` и что ты печатаешь. Прибавлять 1 к номеру
            нужно, только когда ряд начинается с 0 — `range(n)`. Из двух способов нужен один.
          verify: В «Примере 1» номера должны идти 1, 2, 3.
        - id: end-excluded
          when:
            outputEquals: |-
              Подход 1 из 3
              Подход 2 из 3
              Тренировка окончена
          why: >-
            Не хватает последнего подхода. Правая граница `range` в ряд не входит: `range(1, 3)`
            даёт только 1 и 2.
          try: Чтобы ряд закончился на n, конец должен быть на единицу больше — `n + 1`.
          verify: В «Примере 1» должно быть три строки «Подход …».
        - id: final-inside
          when:
            outputIncludes: "Тренировка окончена\nПодход"
            codeRegex: '^[ \t]+print\([^)]*окончена'
          why: >-
            «Тренировка окончена» печатается после каждого подхода. У строки с этим `print` есть
            отступ, поэтому она попала в тело цикла и повторяется вместе с ним.
          try: >-
            Убери отступ у `print("Тренировка окончена")` — строка без отступа выполнится один раз,
            после цикла.
          verify: В «Примере 1» «Тренировка окончена» должна появиться один раз, последней строкой.
        - id: final-first
          when:
            outputIncludes: "Тренировка окончена\nПодход"
          why: >-
            «Тренировка окончена» напечаталась раньше подходов. Программа выполняется сверху вниз, а
            этот `print` стоит выше цикла.
          try: >-
            Перенеси `print("Тренировка окончена")` в самый конец программы — под цикл, без
            отступа.
          verify: В «Примере 1» «Тренировка окончена» должна быть последней строкой.
        - id: final-twice
          when:
            outputIncludes: "Тренировка окончена\nТренировка окончена"
          why: >-
            «Тренировка окончена» напечатана два раза подряд: в программе два таких `print`. Один уже
            был в стартовом коде.
          try: Оставь один `print("Тренировка окончена")` — последней строкой программы, без отступа.
          verify: В «Примере 1» «Тренировка окончена» должна появиться один раз, последней строкой.
        - id: fixed-count
          when:
            codeRegex: 'range\([^a-zA-Zа-яА-ЯёЁ_)]*\)'
          why: >-
            В `range` стоят готовые числа, поэтому подходов всегда одно и то же количество — при
            другом n их окажется слишком много или слишком мало.
          try: Возьми конец ряда из переменной `n`, которую прочитал из ввода.
          verify: И в «Примере 1», и в «Примере 2» строк «Подход …» должно быть столько, сколько во вводе.
      afterPass: >-
        План печатается для любого числа подходов — и даже для нуля: тогда тело цикла не выполняется
        ни разу. Впиши в поле «Ввод для „Запустить“» число 12 и нажми «Запустить»: двенадцать строк
        появятся без единой новой строки кода.
      skills: [for-range, f-strings]

  - id: practice-countdown
    type: exercise
    title: Практика 2
    exercise:
      id: m3-l2-e2
      kind: modify
      title: Обратный отсчёт
      statement: |-
        Перед стартом забега Тамара включает обратный отсчёт. Программа ниже считает не в ту
        сторону: печатает 1, 2, …, n, а потом «Старт!». Измени её так, чтобы отсчёт шёл вниз: n,
        n − 1, …, 1, а потом «Старт!». Например, для n = 5:

        ```text
        5
        4
        3
        2
        1
        Старт!
        ```
      input: Одно целое число n ≥ 0 — с какого числа начинать отсчёт.
      output: Числа от n до 1, каждое на своей строке, затем строка `Старт!`.
      constraints:
        - Если n = 0, отсчёта нет — печатается только «Старт!».
      starterCode: |
        n = int(input())
        for i in range(1, n + 1):
            print(i)
        print("Старт!")
      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          stdin: "5\n"
          expected: |-
            5
            4
            3
            2
            1
            Старт!
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 2
          example: true
          stdin: "3\n"
          expected: |-
            3
            2
            1
            Старт!
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: отсчёт с единицы"
          edge: true
          stdin: "1\n"
          expected: |-
            1
            Старт!
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: отсчёта нет"
          edge: true
          stdin: "0\n"
          expected: Старт!
      criteria:
        - Числа идут от n вниз до 1 включительно, ноль не печатается.
        - «Старт!» печатается один раз, после всех чисел.
        - При n = 0 печатается только «Старт!».
      hints:
        - >-
          С какого числа теперь начинается отсчёт, на каком заканчивается и в какую сторону идёт? У
          `range` на каждый из этих вопросов есть свой аргумент.
        - >-
          На другом примере: `range(10, 0, -2)` даёт 10, 8, 6, 4, 2 — начинает с 10, шагает вниз
          на 2 и останавливается перед 0.
        - |-
          Каркас:
          ```text
          for i in range(n, …, -1):
              print(i)
          print("Старт!")
          ```
          Подумай, какой конец нужен, чтобы последней напечаталась 1, а 0 — нет.
      solution:
        code: |
          n = int(input())
          for i in range(n, 0, -1):
              print(i)
          print("Старт!")
        explanation: >-
          `range(n, 0, -1)` начинает с n и шагает вниз на 1. Конец ряда 0 в ряд не входит, поэтому
          последней печатается 1. При n = 0 ряд `range(0, 0, -1)` пустой, и сразу печатается
          «Старт!». Можно обойтись и без отрицательного шага: `for i in range(n)` и печатать
          `n - i` — при i = 0, 1, 2, … получится n, n − 1, n − 2, …
      wrongSolutions:
        - code: |
            n = int(input())
            for i in range(1, n + 1):
                print(i)
            print("Старт!")
          note: Код не изменён — отсчёт идёт вверх.
          expectMistake: still-ascending
        - code: |
            n = int(input())
            for i in range(n, 0):
                print(i)
            print("Старт!")
          note: Нет отрицательного шага — range пустой, печатается только «Старт!».
          expectMistake: empty-range
        - code: |
            n = int(input())
            for i in range(1, n + 1, -1):
                print(i)
            print("Старт!")
          note: К стартовому ряду дописан шаг -1, а начало и конец не переставлены — ряд пустой.
          expectMistake: empty-range
        - code: |
            n = int(input())
            for i in range(n, -1, -1):
                print(i)
            print("Старт!")
          note: Конец -1 — в отсчёт попал ноль.
          expectMistake: includes-zero
        - code: |
            n = int(input())
            for i in range(n, 1, -1):
                print(i)
            print("Старт!")
          note: Конец 1 — единица потерялась.
          expectMistake: stops-at-two
        - code: |
            n = int(input())
            for i in range(n + 1, 0, -1):
                print(i)
            print("Старт!")
          note: Начало n + 1 — отсчёт начинается на единицу выше.
          expectMistake: starts-too-high
        - code: |
            n = int(input())
            for i in range(n, 0, -1):
                print(i)
                print("Старт!")
          note: «Старт!» с отступом попал в тело цикла.
          expectMistake: start-inside
        - code: |
            n = int(input())
            print("Старт!")
            for i in range(n, 0, -1):
                print(i)
          note: «Старт!» напечатан до цикла.
          expectMistake: start-first
        - code: |
            n = int(input())
            for i in range(1, 0):
                print(n - i)
            print("Старт!")
          note: Совет «концом поставь 0» применён к ряду с формулой — ряд пустой; нужен разбор пустого ряда, а не формулы.
          expectMistake: empty-range
        - code: |
            n = int(input())
            for i in range(1, n + 1):
                print(n - i)
            print("Старт!")
          note: Ряд не тронут, печатается n - i — получается 4…0.
          expectMistake: formula-shift
        - code: |
            n = int(input())
            for i in range(n):
                print(n + 1 - i)
            print("Старт!")
          note: range(n) с нуля, а формула n + 1 - i — получается 6…2.
          expectMistake: formula-shift
        - code: |
            n = int(input())
            for i in range(n, 0, -1):
                print(n - i)
            print("Старт!")
          note: И отрицательный шаг, и формула n - i — получается 0…4.
          expectMistake: formula-shift
        - code: |
            n = int(input())
            for i in range(n, 0, -1):
                print(n)
            print("Старт!")
          note: Печатается n вместо переменной цикла — пять раз 5.
          expectMistake: same-number
        - code: |
            n = int(input())
            i = n
            while i >= 0:
                print(i)
                i = i - 1
            print("Старт!")
          note: Через while, но условие >= 0 пускает в цикл и ноль.
          expectMistake: while-zero
      altSolutions:
        - code: |
            n = int(input())
            for i in range(n):
                print(n - i)
            print("Старт!")
          note: range(n) с нуля, печатается n - i.
        - code: |
            n = int(input())
            i = n
            while i > 0:
                print(i)
                i = i - 1
            print("Старт!")
          note: Отсчёт через while — в этом задании for не требуется.
        - code: |
            n = int(input())
            for i in range(1, n + 1):
                print(n + 1 - i)
            print("Старт!")
          note: range не тронут, число считается формулой n + 1 - i.
        - code: |
            n = int(input())
            for i in range(n - 1, -1, -1):
                print(i + 1)
            print("Старт!")
          note: Ряд n − 1…0 вниз, печатается i + 1.
      mistakes:
        - id: start-inside
          when:
            failedTest: t1
            codeRegex: '^[ \t]+print\([^)]*Старт'
          why: >-
            «Старт!» печатается после каждого числа. У строки с этим `print` есть отступ, поэтому
            она попала в тело цикла и повторяется вместе с ним.
          try: Убери отступ у `print("Старт!")` — тогда он выполнится один раз, после цикла.
          verify: В «Примере 1» «Старт!» должен появиться один раз, последней строкой.
        - id: start-first
          when:
            outputIncludes: "Старт!\n5"
          why: >-
            «Старт!» напечатался раньше отсчёта. Программа выполняется сверху вниз, а этот `print`
            стоит выше цикла.
          try: Перенеси `print("Старт!")` в самый конец программы — под цикл, без отступа.
          verify: В «Примере 1» «Старт!» должен быть последней строкой.
        - id: empty-range
          when:
            outputEquals: Старт!
            codeIncludes: range(
          why: >-
            Ряд `range` получился пустым: тело не выполнилось ни разу, и сразу напечатался «Старт!».
            Так бывает, когда шаг ведёт не в ту сторону: с шагом +1 (он же по умолчанию) начало
            должно быть меньше конца, с шагом −1 — больше. Ошибки при этом нет — ряд просто пустой.
          try: >-
            Чтобы считать вниз, начало должно быть больше конца, а шаг — отрицательным:
            `range(начало, конец, -1)`.
          verify: В «Примере 1» перед «Старт!» должны появиться числа 5, 4, 3, 2, 1.
        - id: formula-shift
          when:
            failedTest: t1
            codeRegex: 'print\(\s*\w+\s*[-+]'
          why: >-
            Число в `print` считается формулой, и вместе с твоим `range` она даёт не тот ряд: первым
            должно получиться n, последним — 1.
          try: >-
            Выпиши первое и последнее значение своего `range` и подставь каждое в формулу. Поправь
            формулу или сам ряд. Если ряд уже идёт от n вниз до 1, печатай просто переменную цикла.
          verify: В «Примере 1» первой строкой должно быть 5, а перед «Старт!» — 1.
        - id: same-number
          when:
            outputIncludes: "5\n5\n5"
          why: >-
            Каждый раз печатается одно и то же число — n. Оно прочитано из ввода и в цикле не
            меняется. Меняется переменная цикла.
          try: Печатай переменную цикла — имя, которое стоит после `for`.
          verify: В «Примере 1» должно получиться 5, 4, 3, 2, 1.
        - id: still-ascending
          when:
            outputIncludes: "1\n2\n3"
          why: >-
            Отсчёт по-прежнему идёт вверх. Без третьего аргумента `range` шагает на +1 — от
            первого числа ко второму.
          try: >-
            Поменяй сам ряд: начни его с n, а третьим аргументом дай шаг `-1` — тогда `range`
            пойдёт вниз.
          verify: В «Примере 1» первой строкой должно быть 5.
        - id: includes-zero
          when:
            outputIncludes: "0\nСтарт!"
            codeRegex: 'range\([^)]*-1\s*,\s*-1\s*\)'
          why: >-
            В отсчёт попал ноль. Конец ряда — второй аргумент `range` — в ряд не входит, поэтому с
            концом −1 последним выходит 0.
          try: Чтобы последней была 1, концом ряда поставь 0 — он сам в ряд не войдёт.
          verify: В «Примере 1» перед «Старт!» должна стоять 1.
        - id: while-zero
          when:
            outputIncludes: "0\nСтарт!"
            codeRegex: '\bwhile\b[^:\n]*>=\s*0\b'
          why: >-
            В отсчёт попал ноль: условие `>= 0` верно и при i = 0, поэтому цикл делает лишнюю
            итерацию.
          try: Отсчёт должен закончиться на 1. Поменяй условие так, чтобы при i = 0 оно стало ложным.
          verify: В «Примере 1» перед «Старт!» должна стоять 1.
        - id: stops-at-two
          when:
            outputIncludes: "2\nСтарт!"
            codeRegex: 'range\([^)]*,\s*1\s*,\s*-1\s*\)'
          why: >-
            Отсчёт обрывается на 2 — единицы нет. Конец ряда — второй аргумент `range` — в ряд не
            входит: с концом 1 ряд останавливается перед единицей.
          try: Сдвинь конец ряда на единицу ниже — на 0.
          verify: В «Примере 1» перед «Старт!» должна стоять 1.
        - id: starts-too-high
          when:
            outputIncludes: "6\n5\n4"
          why: >-
            Отсчёт начинается на единицу выше: для n = 5 первым идёт 6. Начало `range` в ряд
            входит, в отличие от конца, — прибавлять к нему единицу не нужно.
          try: Начни ряд прямо с n.
          verify: В «Примере 1» первой строкой должно быть 5.
      afterPass: >-
        Отсчёт работает для любого n, а при n = 0 тело цикла честно не выполняется ни разу.
        Попробуй поставить шаг -2 и ввести 10 в поле «Ввод для „Запустить“»: отсчёт пойдёт через
        одно число — 10, 8, 6, 4, 2.
      skills: [for-range]

  - id: practice-water
    type: exercise
    title: Практика 3
    exercise:
      id: m3-l2-e3
      kind: write
      title: Пункты с водой
      statement: |-
        Тамара расставляет столики с водой на одинаковом расстоянии друг от друга — через интервал.
        Если интервал 3 км, столики стоят на 3-м, 6-м, 9-м километре и так далее, но не дальше
        финиша. Если очередной пункт приходится ровно на финиш, столик стоит и там.

        Программа читает длину трассы и интервал между пунктами и печатает пункты по порядку, а
        последней строкой — финиш. Например, для трассы 10 км и интервала 3 км:

        ```text
        Пункт воды: 3 км
        Пункт воды: 6 км
        Пункт воды: 9 км
        Финиш: 10 км
        ```
      input: Две строки — длина трассы и интервал между пунктами, в километрах (целые, не меньше 1).
      output: "Строки `Пункт воды: X км` для каждого пункта по порядку, затем `Финиш: <длина> км`."
      constraints:
        - Если интервал больше длины трассы, пунктов нет — печатается только строка финиша.
      starterCode: |
        # Прочитай длину трассы и интервал
        # Выведи пункты воды, а в конце — строку финиша

      tests:
        - id: t1
          kind: io
          title: "Пример 1: пункт на финише"
          example: true
          stdin: "10\n5\n"
          expected: |-
            Пункт воды: 5 км
            Пункт воды: 10 км
            Финиш: 10 км
          compare:
            ignoreSpaces: true
        - id: t2
          kind: io
          title: Пример 2
          example: true
          stdin: "10\n3\n"
          expected: |-
            Пункт воды: 3 км
            Пункт воды: 6 км
            Пункт воды: 9 км
            Финиш: 10 км
          compare:
            ignoreSpaces: true
        - id: t3
          kind: io
          title: Полумарафон
          stdin: "21\n5\n"
          expected: |-
            Пункт воды: 5 км
            Пункт воды: 10 км
            Пункт воды: 15 км
            Пункт воды: 20 км
            Финиш: 21 км
          compare:
            ignoreSpaces: true
        - id: t4
          kind: io
          title: "Граничный случай: интервал равен трассе"
          edge: true
          stdin: "7\n7\n"
          expected: |-
            Пункт воды: 7 км
            Финиш: 7 км
          compare:
            ignoreSpaces: true
        - id: t5
          kind: io
          title: "Граничный случай: интервал больше трассы"
          edge: true
          stdin: "4\n5\n"
          expected: "Финиш: 4 км"
          compare:
            ignoreSpaces: true
      criteria:
        - Пункты стоят через один, два, три… интервала от старта, и ни один не стоит дальше финиша.
        - Если пункт приходится ровно на финиш, он печатается.
        - Строка финиша печатается один раз, последней, и в ней длина трассы из ввода.
        - Если интервал больше трассы, печатается только строка финиша.
      hints:
        - >-
          Какое значение должно быть первым в ряду, какое — последним возможным, и на сколько
          километров ряд шагает? Может ли пункт стоять прямо на финише?
        - >-
          На другом примере: `range(10, 101, 10)` даёт 10, 20, …, 100. Конец взят на 1 больше
          последнего нужного числа — иначе 100 не вошло бы в ряд.
        - |-
          Каркас:
          ```text
          distance = int(input())
          step = int(input())
          for km in range(step, …, step):
              print(f"Пункт воды: {…} км")
          print(f"Финиш: {…} км")
          ```
      solution:
        code: |
          distance = int(input())
          step = int(input())
          for km in range(step, distance + 1, step):
              print(f"Пункт воды: {km} км")
          print(f"Финиш: {distance} км")
        explanation: >-
          Ряд начинается с интервала `step` и шагает на тот же интервал. Конец `distance + 1`
          нужен, чтобы пункт ровно на финише тоже вошёл: правая граница в ряд не входит. Если
          интервал больше трассы, ряд пустой, и печатается только финиш. Подойдёт и `while`:
          `km = step`, потом `while km <= distance:` — печатать и прибавлять `step`.
      wrongSolutions:
        - code: |
            distance = int(input())
            step = int(input())
            for km in range(step, distance, step):
                print(f"Пункт воды: {km} км")
            print(f"Финиш: {distance} км")
          note: Конец range — distance, пункт на финише потерялся.
          expectMistake: end-excluded
        - code: |
            distance = int(input())
            step = int(input())
            for i in range(1, distance // step):
                print(f"Пункт воды: {i * step} км")
            print(f"Финиш: {distance} км")
          note: Номера пунктов через //, но конец без + 1 — последний пункт потерялся.
          expectMistake: end-excluded
        - code: |
            distance = int(input())
            step = int(input())
            km = step
            while km < distance:
                print(f"Пункт воды: {km} км")
                km = km + step
            print(f"Финиш: {distance} км")
          note: while со строгим < — пункт на финише потерялся.
