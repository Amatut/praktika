          note: Счётчик растёт без условия — считаются все дни.
          expectMistake: all-days
        - code: |
            n = int(input())
            total = 0
            good_days = 0
            for _ in range(n):
                steps = int(input())
                total = total + steps
                good_days = good_days + steps // 10000
            print(f"Всего шагов: {total}")
            print(f"Дней с нормой: {good_days}")
          note: steps // 10000 — день с 25 000 шагов засчитывается дважды; ловит тест t6.
          expectMistake: null
        - code: |
            n = int(input())
            total = 0
            good_days = 0
            for _ in range(n):
                steps = int(input())
                total = total + steps
                if steps == 10000:
                    good_days = good_days + 1
            print(f"Всего шагов: {total}")
            print(f"Дней с нормой: {good_days}")
          note: == 10000 — засчитываются только дни ровно с 10 000.
          expectMistake: null
        - code: |
            n = int(input())
            total = 0
            good_days = 0
            for _ in range(n):
                steps = int(input())
                total = total + steps
                if steps >= 10000:
                    good_days = good_days + 1
            print(f"Всего шагов: {total}")
            print(f"Дней с нормой: {good_days}")
            if n > 0:
                print(f"В среднем за день: {total // n}")
          note: Улучшение из e1 добавлено в проверяемое решение; if-after-loop и print-inside срабатывать не должны.
          expectMistake: null
      mistakes:
        - id: spaced-number
          when:
            errorType: SyntaxError
            codeRegex: '\d \d{3}\b'
          where: Число с пробелом внутри
          why: >-
            В тексте 10 000 пишут с пробелом, а в коде пробел делит число на два: `10 000` для
            Python — два числа подряд, и строку он не понимает.
          try: "Пиши число слитно: `10000`."
          verify: Ошибка SyntaxError должна исчезнуть.
        - id: if-after-loop
          when:
            failedTest: t1
            outputIncludes: "Дней с нормой: 1"
            codeRegex: '^if\b'
          where: Строка `if` без отступа — после цикла
          why: >-
            Проверка стоит после цикла и выполняется один раз. К этому моменту в `steps` лежат шаги
            только последнего дня, поэтому остальные дни не проверяются вовсе.
          try: >-
            Сдвинь `if` и строку под ним внутрь цикла — на один уровень со `steps = int(input())`.
            Тогда проверка пройдёт для каждого дня.
          verify: "В «Примере 1» должно получиться «Дней с нормой: 2»."
        - id: reset-inside
          when:
            failedTest: t1
            codeRegex: '^[ \t]+\w+\s*=\s*0\s*(#.*)?$'
          where: Строка `= 0` внутри цикла
          why: >-
            Счётчик обнуляется на каждом проходе, поэтому к концу в нём не больше 1: он помнит
            только последний день.
          try: Создай счётчик один раз — до цикла, рядом с `total = 0`.
          verify: "В «Примере 1» должно получиться «Дней с нормой: 2»."
        - id: checks-total
          when:
            failedTest: t2
            codeRegex: '\bif\s+total\b'
          where: Условие `if total …`
          why: >-
            С нормой сравнивается сумма за все прошедшие дни, а не шаги одного дня. Сумма быстро
            перерастает 10 000, и дальше засчитывается каждый день — даже с 0 шагов.
          try: Сравнивай с 10 000 шаги текущего дня — число, которое прочитано в этом проходе.
          verify: "В «Примере 2» должно получиться «Дней с нормой: 3»."
        - id: adds-steps
          when:
            outputIncludes: "Дней с нормой: 22000"
          why: >-
            К счётчику прибавляются шаги, а не 1. Получилась сумма шагов в удачные дни:
            10 000 + 12 000 = 22 000, — а нужно число таких дней.
          try: Прибавляй к счётчику 1 — один удачный день.
          verify: "В «Примере 1» должно получиться «Дней с нормой: 2»."
        - id: strict
          when:
            failedTest: t4
            codeRegex: '>\s*10_?000\b|\b10_?000\s*<(?!=)'
          where: Знак сравнения в условии
          why: >-
            При знаке `>` день ровно с 10 000 шагов не засчитывается, а по условию 10 000 шагов —
            это уже норма. Граница должна входить.
          try: Используй `>=` — «не меньше 10 000».
          verify: "В «Примере 1» должно получиться «Дней с нормой: 2»: день с 10 000 шагов тоже считается."
        - id: check-before-read
          when:
            errorType: NameError
            errorIncludes: "name 'steps' is not defined"
          where: Строка с `if` — она выше строки, где читаются шаги
          why: >-
            `steps` появляется только в строке `steps = int(input())`, а проверка стоит выше. На
            первом проходе Python ещё не знает этого имени. Создавать `steps` до цикла не нужно:
            тогда проверка будет смотреть на шаги вчерашнего дня.
          try: Перенеси `if` вместе со строкой под ним ниже — после чтения шагов.
          verify: "В «Примере 1» должно получиться «Дней с нормой: 2»."
        - id: no-init
          when:
            errorType: NameError
          why: >-
            Python не знает имени счётчика. Переменную нужно создать до цикла — прежде чем
            прибавлять к ней 1. Или имя в разных строках написано по-разному.
          try: >-
            Добавь перед циклом, рядом с `total = 0`, строку со счётчиком и начальным значением 0.
            Проверь, что имя везде написано одинаково.
          verify: Ошибка NameError должна исчезнуть в «Примере 1».
        - id: print-inside
          when:
            failedTest: t1
            codeRegex: '(?<=^(?:for|while)\b[^\n]*\n(?:[ \t]+[^\n]*\n|[ \t]*(?:#[^\n]*)?\n)*)^[ \t]+print\('
          where: "`print` с отступом — внутри цикла"
          why: >-
            `print` стоит в теле цикла, поэтому печатает на каждом проходе (или в каждый удачный
            день), а не один раз. Нужны два итога — после цикла, когда все дни уже проверены.
          try: >-
            Убери отступ у `print` со счётчиком и поставь его после `print` суммы — обе строки
            без отступа, после цикла.
          verify: "В «Примере 1» должны получиться две строки: «Всего шагов: 26000» и «Дней с нормой: 2»."
        - id: no-second-line
          when:
            failedTest: t1
            outputEquals: "Всего шагов: 26000"
          why: >-
            Сумма верная, но программа печатает только её. Для второй строки нужен счётчик и ещё
            один `print` после цикла.
          try: >-
            Создай счётчик до цикла, увеличивай его в теле цикла, когда шагов 10 000 или больше, и
            выведи второй строкой: `Дней с нормой: …`.
          verify: "В «Примере 1» должно получиться две строки, вторая — «Дней с нормой: 2»."
        - id: set-one
          when:
            failedTest: t1
            codeRegex: '^[ \t]+\w+\s*=\+?\s*1\s*(#.*)?$'
          where: Строка, где счётчик получает 1
          why: >-
            `good_days = 1` (или опечатка `=+ 1`) не прибавляет единицу, а записывает в счётчик 1 —
            сколько бы дней ни выполнили норму.
          try: "Прибавляй к прошлому значению: `good_days = good_days + 1` или `good_days += 1`."
          verify: "В «Примере 1» должно получиться «Дней с нормой: 2»."
        - id: all-days
          when:
            failedTest: t1
            outputIncludes: "Дней с нормой: 3"
          why: >-
            В «Примере 1» три дня, и счётчик вырос в каждый из них — даже в день с 4000 шагов.
            Значит, он растёт без условия или условие верно для любого дня.
          try: "Увеличивай счётчик только под `if steps >= 10000:` — с отступом под ним."
          verify: "В «Примере 1» должно получиться «Дней с нормой: 2»."
      afterPass: >-
        Теперь за один проход считаются сразу два итога — сумма и количество. Одно улучшение:
        запиши норму в переменную в начале программы, например `goal = 10000`, и сравнивай с ней.
        Тогда новую цель можно будет поставить, поменяв одно число.
      skills: [accumulators, conditions, boundary-checks]

  - id: record-start
    type: quiz
    title: С чего начать минимум
    question: >-
      Злата ищет и самое тёплое, и самое холодное утро. Первую температуру программа уже прочитала
      до цикла: `highest = int(input())`. Какой строкой начать минимум `lowest`, чтобы ответ был
      верным и зимой, и летом?
    options:
      - "`lowest = 0`"
      - "`lowest = highest`"
      - "`lowest = int(input())`"
      - "`lowest = n`"
    correct: 1
    explanation: |-
      `lowest = highest` — минимум начинается с той же первой температуры, а цикл потом обновляет
      его со знаком `<`.

      - С `0` минимум летом застрянет на нуле: ни одна из температур 18, 25, 21 не меньше 0.
      - `int(input())` прочитает не первую температуру, а следующую строку: каждый `input()`
        забирает новую строку ввода. Первая температура в минимум не попадёт, а в конце ввода не
        хватит строки.
      - `n` — число дней, а не температура.
    coach: >-
      Одна строка ввода — один `input()`. Если значение уже прочитано, бери его из переменной.

  - id: practice-extremes
    type: exercise
    title: Практика 3
    exercise:
      id: m3-l3-e3
      kind: write
      title: Рекорды тепла и холода
      statement: |-
        В журнале метеокружка — утренние температуры за несколько дней. Злата хочет, чтобы
        программа находила самую высокую и самую низкую из них.

        Первая строка ввода — число дней N (не меньше 1), дальше N строк — температуры, целые числа
        от -60 до 60. Выведи две строки:

        ```text
        Максимум: 7
        Минимум: -2
        ```

        Бывает, что все температуры ниже нуля (зима) или все выше нуля (лето). Программа должна
        работать в обоих случаях.
      input: >-
        Первая строка — число дней N (целое, 1 или больше). Дальше N строк — температуры (целые
        числа от -60 до 60).
      output: "Две строки: `Максимум: <самая высокая>` и `Минимум: <самая низкая>`."
      constraints:
        - Дней может быть сколько угодно, поэтому температуры читай в цикле.
        - Текст подсказок в `input()` может быть любым — он не проверяется.
      starterCode: |
        # Первая строка — сколько дней, дальше температуры, по одной в строке
        # Выведи две строки: «Максимум: …» и «Минимум: …»

      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          stdin: "4\n3\n7\n-2\n5\n"
          expected: |-
            Максимум: 7
            Минимум: -2
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 2: зима, все ниже нуля"
          example: true
          stdin: "3\n-5\n-12\n-3\n"
          expected: |-
            Максимум: -3
            Минимум: -12
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Лето: все выше нуля"
          stdin: "3\n18\n25\n21\n"
          expected: |-
            Максимум: 25
            Минимум: 18
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: один день"
          edge: true
          stdin: "1\n4\n"
          expected: |-
            Максимум: 4
            Минимум: 4
        - id: t5
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: одинаковые температуры"
          edge: true
          stdin: "2\n0\n0\n"
          expected: |-
            Максимум: 0
            Минимум: 0
        - id: t6
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: сильный мороз"
          edge: true
          stdin: "3\n-58\n-60\n-59\n"
          expected: |-
            Максимум: -58
            Минимум: -60
        - id: t7
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: жара"
          edge: true
          stdin: "3\n59\n60\n58\n"
          expected: |-
            Максимум: 60
            Минимум: 58
      criteria:
        - Программа читает ровно N температур — каждую по одному разу.
        - >-
          Начальные значения рекордов не искажают ответ ни зимой, ни летом, ни в сильный мороз или
          жару. Надёжнее всего начать оба рекорда с первой температуры.
        - Ответ верен и тогда, когда день один.
        - "Вывод — две строки: сначала `Максимум: X`, затем `Минимум: Y`."
      hints:
        - >-
          Максимум и минимум — тоже накопители. С какого значения начать каждый из них, чтобы при
          морозе -5, -12, -3 он не застрял на числе, которого в журнале нет? И сколько строк тогда
          останется прочитать в цикле?
        - |-
          Тот же приём для минимума на другом примере — самая низкая цена из n чеков:
          ```python
          n = int(input())
          cheapest = int(input())      # первая цена — сразу рекорд
          for _ in range(n - 1):       # остальные цены
              price = int(input())
              if price < cheapest:
                  cheapest = price
          print(cheapest)
          ```
        - |-
          Каркас:
          ```text
          n = число из первой строки
          first = число из второй строки
          highest = first
          lowest = first
          повторить n - 1 раз:
              t = следующее число
              если t больше highest — запомнить t в highest
              если t меньше lowest — запомнить t в lowest
          вывести «Максимум: …» и «Минимум: …»
          ```
      solution:
        code: |
          n = int(input())
          first = int(input())
          highest = first
          lowest = first
          for _ in range(n - 1):
              t = int(input())
              if t > highest:
                  highest = t
              if t < lowest:
                  lowest = t
          print(f"Максимум: {highest}")
          print(f"Минимум: {lowest}")
        explanation: >-
          Первая температура читается до цикла и сразу становится и максимумом, и минимумом: это
          настоящее значение из журнала, поэтому рекорд не застрянет на 0 или другом придуманном
          числе. Цикл читает остальные `n - 1` температур и сравнивает каждую с обоими рекордами.
          Если день один, `range(0)` пуст, и оба рекорда равны этой температуре. Вместо второго
          `if` можно написать `elif`: новая температура не может быть одновременно выше максимума
          и ниже минимума. Но только при старте с первой температуры: если начать с придуманных
          чисел вроде -1000 и 1000, первая температура должна попасть в оба рекорда, а `elif`
          пропустит минимум.
