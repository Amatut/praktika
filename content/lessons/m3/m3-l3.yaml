      mistakes:
        - id: double-first
          when:
            errorType: EOFError
            codeRegex: '(?<=^\w+\s*=[^\n]*\binput\s*\([\s\S]*^\w+\s*=[^\n]*\binput\s*\([\s\S]*)^\w+\s*=[^\n]*\binput\s*\('
          where: Строки с `input()` до цикла
          why: >-
            Каждый `input()` забирает новую строку ввода. Первая температура одна, а читается
            дважды — для максимума и для минимума: второй вызов забирает уже следующую температуру,
            и в конце ввода не хватает строки.
          try: >-
            Прочитай первую температуру один раз и начни с неё оба рекорда: `lowest = highest`. Оба
            рекорда обновляй в одном цикле на остальные `n - 1` температур.
          verify: "В «Примере 1» должно получиться «Максимум: 7» и «Минимум: -2»."
        - id: extra-read
          when:
            errorType: EOFError
          why: >-
            Программа попросила строку ввода, которой нет: `input()` вызывается больше раз, чем
            строк во вводе. Частый случай — первая температура прочитана до цикла, а цикл всё равно
            читает n строк: всего получается n + 1.
          try: >-
            Посчитай вызовы `input()`: один — для n, один — для первой температуры и `n - 1` в
            цикле, то есть `range(n - 1)`.
          verify: В «Примере 1» ошибка EOFError должна исчезнуть.
        - id: no-init
          when:
            errorType: NameError
          why: >-
            Python не знает этого имени: переменную используют раньше, чем создали. До цикла
            должны появиться и число дней `n`, и оба рекорда — `highest` и `lowest`.
          try: >-
            Проверь начало программы: сначала `n = int(input())`, затем первая температура, и с
            неё начинаются оба рекорда. Внутри цикла рекорды только обновляются.
          verify: Ошибка NameError должна исчезнуть, в том числе в граничном случае «один день».
        - id: zero-start-max
          when:
            failedTest: t2
            outputIncludes: "Максимум: 0"
          where: Начальное значение максимума
          why: >-
            Максимум начат с 0. Зимой (-5, -12, -3) ни одна температура не больше 0, поэтому
            максимум так и остаётся нулём — температурой, которой в журнале не было.
          try: >-
            Начни максимум с первой температуры: прочитай её до цикла, а цикл пусть читает
            остальные `n - 1`. Минимум начни с того же значения.
          verify: "В «Примере 2» должно получиться «Максимум: -3»."
        - id: zero-start-min
          when:
            failedTest: t3
            outputIncludes: "Минимум: 0"
          where: Начальное значение минимума
          why: >-
            Минимум начат с 0. Летом (18, 25, 21) ни одна температура не меньше 0, поэтому минимум
            так и остаётся нулём.
          try: Начни минимум, как и максимум, с первой температуры из журнала.
          verify: "В тесте «Лето: все выше нуля» должно получиться «Минимум: 18»."
        - id: str-compare
          when:
            failedTest: t2
            codeRegex: '(?<!int\(\s*)\binput\s*\('
          where: Строка с `input()` без `int()`
          why: >-
            Температуры остались строками. Строки сравниваются не как числа, а по символам, как
            слова в словаре: `"-5" > "-3"`, потому что символ 5 идёт после 3. Поэтому зимой
            максимумом оказалось -5.
          try: "Превращай каждую температуру в число сразу при чтении: `int(input())` — и до цикла, и в цикле."
          verify: "В «Примере 2» должно получиться «Максимум: -3»."
        - id: elif-sentinel
          when:
            failedTest: t3
            outputIncludes: "Минимум: 21"
            codeRegex: '^[ \t]*elif\b'
          where: Строка с `elif`
          why: >-
            Рекорды начаты не с первой температуры, а с придуманных чисел, и `elif` пропускает
            проверку минимума, когда температура обновила максимум. Первая температура (18)
            обновила максимум и в минимум не попала — поэтому минимум 21.
          try: Начни оба рекорда с первой температуры (`lowest = highest`) или сделай два отдельных `if`.
          verify: "В тесте «Лето: все выше нуля» должно получиться «Минимум: 18»."
        - id: start-in-range
          when:
            failedTest: t6
            codeRegex: '^\w+\s*=\s*-[1-5]?\d\s*(#.*)?$'
          where: Начальные значения рекордов
          why: >-
            Рекорд начат с придуманного числа, которое попадает в диапазон температур (-60…60). В
            сильный мороз (-58, -60, -59) ни одна температура не больше этого числа, и максимум
            так и остаётся им — температурой, которой в журнале нет. С минимумом в жару то же самое.
          try: >-
            Начни оба рекорда с первой температуры: прочитай её до цикла, `lowest = highest`, а
            цикл пусть читает остальные `n - 1`.
          verify: "В тесте «Граничный случай: сильный мороз» должно получиться «Максимум: -58»."
        - id: swapped
          when:
            outputEquals: |-
              Максимум: -2
              Минимум: 7
          why: >-
            Максимум и минимум поменялись местами: в сравнениях перепутаны знаки `>` и `<` или
            подписи в `print`.
          try: >-
            Максимум обновляется, когда новая температура **больше** него, минимум — когда
            **меньше**. Проверь и то, какая переменная стоит в каждой строке вывода.
          verify: "В «Примере 1» должно получиться «Максимум: 7» и «Минимум: -2»."
        - id: print-inside
          when:
            failedTest: t1
            codeRegex: '(?<=^(?:for|while)\b[^\n]*\n(?:[ \t]+[^\n]*\n|[ \t]*(?:#[^\n]*)?\n)*)^[ \t]+print\('
          where: "`print` с отступом — внутри цикла"
          why: >-
            `print` стоит в теле цикла, поэтому рекорды печатаются после каждого дня. А нужны два
            итога — когда прочитаны все температуры.
          try: Убери отступ у обеих строк с `print`, чтобы они выполнились после цикла.
          verify: В «Примере 1» должны остаться ровно две строки.
      afterPass: >-
        Рекорды не застревают на 0 и на других придуманных числах, поэтому программа не ошибается
        ни зимой, ни летом. Одно улучшение: добавь третью строку — среднюю температуру. Для неё
        нужен ещё один накопитель — сумма. Начни её с первой температуры (`total = first`): она
        прочитана до цикла, и в цикле её уже не будет. Среднее — `round(total / n, 1)`. Пробуй это
        кнопкой «Запустить»: «Проверить» ждёт ровно две строки.
      skills: [accumulators, conditions]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "Накопитель: начальное значение — до цикла, обновление — внутри, итог — после цикла."
      - "Счётчик прибавляет 1, часто под условием: `good_days += 1` стоит внутри `if steps >= 10000:`."
      - Сумма и счётчик начинаются с 0, а максимум и минимум — с первого значения, прочитанного до цикла.
      - "`total = 0` внутри цикла стирает итог на каждом проходе, а `print` внутри цикла печатает промежуточные итоги, когда нужен один."
    question: Почему максимум нельзя начинать с 0, если бывают морозы?
    answer: >-
      Если все температуры ниже нуля, например -5, -12 и -3, ни одна из них не больше 0, и
      максимум так и останется нулём. Программа выдаст 0 — температуру, которой в журнале не было.
      Если начать с первого значения, максимум всегда будет одной из настоящих температур.
