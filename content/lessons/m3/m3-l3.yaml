id: m3-l3
module: m3
number: "3.3"
title: "Счётчики и накопители"
objective: >-
  За один проход цикла считать сумму, количество подходящих значений, минимум и максимум:
  задавать начальное значение до цикла, обновлять внутри и выводить итог после.
minutes: [20, 30]
prerequisites: [m3-l2]
skills: [accumulators]
environment: python

story:
  title: Журнал метеокружка
  fictional: true
  text: >-
    В школьном метеокружке каждое утро записывают в журнал температуру и осадки. В конце месяца
    руководитель кружка Пётр Андреевич садился с калькулятором: складывал тридцать чисел, считал
    дождливые дни и искал самое холодное утро. Его итоги почти всегда расходились с подсчётом
    учеников, и всё приходилось пересчитывать. Восьмиклассница Злата написала программу,
    которая читает записи по одной и держит в переменных сумму осадков, число дождливых дней и
    рекорд холода. Теперь итоги готовы через секунду после последней строки.

why: >-
  Вопросы «сколько всего?», «сколько раз?» и «какое самое большое?» решаются за один проход цикла:
  результат копится в отдельной переменной. Например, сумма осадков за месяц: начинаем с 0 и
  каждый день прибавляем осадки этого дня.

usedIn: >-
  Итоги в чеках и отчётах, статистика шагов и тренировок в фитнес-приложениях, подсчёт голосов,
  рекорды: самая высокая температура, лучший результат в игре. В модуле 4 тот же приём будет
  работать со списками.

steps:
  - id: accumulators
    type: theory
    title: Накопители и счётчики
    body: |-
      В уроке 3.1 `savings` копила взносы, а `weeks` считала недели — это и были накопитель и
      счётчик. Разберём их подробно.

      Многие вопросы к данным звучат так: «сколько всего?», «сколько раз?», «какое самое
      большое?». Ответ на каждый собирается по ходу цикла в отдельной переменной.

      **Накопитель** — переменная, в которой копится результат. У него три места в программе:

      1. **до цикла** — начальное значение;
      2. **внутри цикла** — обновление (на каждом проходе или когда выполнено условие);
      3. **после цикла** — вывод итога, один раз.

      ```python
      n = int(input())          # сколько чисел будет дальше
      total = 0                 # до цикла
      for _ in range(n):
          mm = int(input())     # осадки за день, мм
          total = total + mm    # внутри
      print(total)              # после
      ```

      **Чтение в цикле.** Каждый проход заново вызывает `input()` и получает следующую строку
      ввода. Сколько раз читать, программа узнаёт из первой строки: там N — сколько строк будет
      дальше, — и цикл делает ровно N проходов. Номер прохода здесь не нужен, и переменную цикла
      назвали `_`: так принято называть переменную, которой не пользуются.

      **Счётчик** — накопитель, который прибавляет 1, часто под условием:

      ```python
      if mm > 0:
          rainy = rainy + 1
      ```

      **Короткая запись:** `total += mm` значит то же, что `total = total + mm`, а `left -= 1` —
      то же, что `left = left - 1`. Пиши, как тебе удобнее.

      **С чего начинать.** Сумма и счётчик начинаются с 0: ноль ничего не добавляет к итогу.
      Максимум с 0 начинать нельзя: если все температуры ниже нуля, ни одна не окажется больше 0,
      и программа выдаст 0 — температуру, которой не было. Поэтому рекорд начинают с **первого
      значения** (если значений хотя бы одно): читают его до цикла, а цикл читает остальные
      `n - 1`:

      ```python
      n = int(input())
      highest = int(input())    # первое значение — сразу рекорд
      for _ in range(n - 1):    # остальные значения
          t = int(input())
          if t > highest:
              highest = t
      print(highest)
      ```

      Минимум ищут в том же цикле и от того же первого значения (второй раз его читать не нужно),
      а обновляют со знаком `<`.
    simpler: >-
      Накопитель — как копилка. Перед началом ставишь пустую копилку (0), на каждом шаге кладёшь
      в неё монету, а в конце открываешь и считаешь. Если перед каждой монетой ставить новую
      пустую копилку, в конце там окажется одна монета. Счётчик — та же копилка, но в неё кладут
      ровно одну монету и только тогда, когда выполнено условие. А рекорд — табличка «лучший
      результат»: на неё сразу пишут первый результат, а потом переписывают, только если новый
      лучше.
    coach: >-
      Для каждого накопителя найди три строки: где он создаётся, где меняется и где печатается.
      Создание — до цикла, печать — после.

  - id: rain
    type: example
    title: Осадки за пять дней
    body: >-
      Часть программы Златы — только осадки. Первая строка ввода — сколько дней в журнале, дальше
      осадки за каждый день в миллиметрах. Ввод уже задан: 5 дней — 0, 4, 12, 0 и 3 мм. Нажми
      «Запустить».
    code: |-
      days = int(input())
      total = 0
      rainy = 0
      for _ in range(days):
          mm = int(input())
          total = total + mm
          if mm > 0:
              rainy = rainy + 1
      print(f"Осадков: {total} мм")
      print(f"Дождливых дней: {rainy}")
    stdin: "5\n0\n4\n12\n0\n3\n"
    notes:
      - line: 1
        text: Первая строка ввода говорит, сколько дней в журнале, — столько раз и повторится цикл.
      - line: 2
        text: Накопитель суммы. Создаётся до цикла и начинается с 0.
      - line: 3
        text: Счётчик дождливых дней — тоже до цикла и тоже с 0.
      - line: 4
        text: >-
          Номер дня программе не нужен, поэтому переменная цикла — `_`. Тело выполнится `days`
          раз.
      - line: 5
        text: Каждый проход читает следующую строку ввода — осадки одного дня.
      - line: 6
        text: Накопитель растёт на осадки этого дня.
      - line: 7
        text: >-
          Счётчик растёт на 1, но только в дождливый день. В сухой день условие `mm > 0` ложно,
          строка 8 не выполняется, и счётчик не меняется.
      - line: 9
        text: >-
          Без отступа — это уже после цикла. Строка выполнится один раз, когда все дни прочитаны.
    tryIt: >-
      Добавь в тело цикла (с отступом, после строки 6) строку `print(total)` и запусти — увидишь,
      как сумма растёт день за днём: 0, 4, 16, 16, 19. Потом убери её: в итоговом отчёте нужна одна
      строка суммы, а не пять.
    coach: >-
      Найди у `total` три места: строка 2 — до цикла, строка 6 — внутри, строка 9 — после.

  - id: lost-rain
    type: predict
    title: Сколько накопилось?
    prompt: >-
      Злата набросала программу для осадков за три дня. Во вводе три строки: `4`, `0` и `7`. Как
      думаешь, что она выведет?
    code: |-
      total = 0
      for _ in range(3):
          total = 0
          mm = int(input())
          total = total + mm
      print(total)
    stdin: "4\n0\n7\n"
    options:
      - "11"
      - "7"
      - "0"
    answer: "7"
    explanation: |-
      Проследим `total` по проходам цикла:

      ```text
      проход   total в начале   mm   total в конце
      1        0                4    4
      2        0                0    0
      3        0                7    7
      ```

      Строка `total = 0` стоит внутри цикла и в начале каждого прохода стирает накопленное. После
      цикла в `total` остаются только осадки последнего дня — 7. Обнуление внутри цикла — частая
      ошибка. Чтобы получилось 11, `total = 0` должна выполниться один раз — до цикла.
    coach: >-
      Если итог подозрительно похож на последнее значение из ввода, первым делом ищи обнуление
      внутри цикла.

  - id: practice-steps
    type: exercise
    title: Практика 1
    exercise:
      id: m3-l3-e1
      kind: repeat
      title: "Шагомер: сколько всего"
      statement: |-
        Пётр Андреевич ходит на метеоплощадку пешком, и шагомер в телефоне показывает шаги за
        каждый день. А сколько всего пройдено за несколько дней, шагомер не считает.

        Напиши программу, которая сложит шаги. Первая строка ввода — число дней N, дальше N строк:
        шаги за каждый день. Выведи одну строку:

        ```text
        Всего шагов: 23500
        ```
      input: >-
        Первая строка — число дней N (целое, 0 или больше). Дальше N строк — шаги за день (целые
        числа).
      output: "Одна строка: `Всего шагов: <сумма>`."
      constraints:
        - Дней может быть сколько угодно, поэтому шаги читай в цикле.
        - Текст подсказок в `input()` может быть любым — он не проверяется.
      starterCode: |
        n = int(input())
        total = 0
        # Повтори n раз: прочитай шаги за день и прибавь их к total

        print(f"Всего шагов: {total}")
      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          stdin: "3\n4000\n7500\n12000\n"
          expected: "Всего шагов: 23500"
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 2: неделя"
          example: true
          stdin: "7\n8000\n10000\n6500\n12000\n0\n9000\n11000\n"
          expected: "Всего шагов: 56500"
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: один день"
          edge: true
          stdin: "1\n5000\n"
          expected: "Всего шагов: 5000"
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: ноль дней"
          edge: true
          stdin: "0\n"
          expected: "Всего шагов: 0"
      criteria:
        - Программа читает ровно N строк с шагами — столько, сколько указано в первой строке.
        - "Сумма копится в одной переменной: начальное значение до цикла, прибавление внутри, вывод после."
        - "Выводится одна итоговая строка `Всего шагов: X` — и при 0 дней тоже."
      hints:
        - >-
          У накопителя три места: до цикла, внутри и после. Какие два уже есть в стартовом коде?
          Чего не хватает — и сколько раз это нужно повторить?
        - |-
          Тот же приём без ввода — копилка, в которую 4 недели кладут по 500:
          ```python
          saved = 0
          for _ in range(4):
              saved = saved + 500
          print(saved)
          ```
          Программа печатает 2000. В твоей задаче каждый раз прибавляется не 500, а новое число из
          ввода.
        - |-
          Каркас:
          ```text
          for _ in range(n):
              steps = число из следующей строки ввода
              total = total + …
          ```
          Строка с `print` остаётся после цикла, без отступа.
      solution:
        code: |
          n = int(input())
          total = 0
          for _ in range(n):
              steps = int(input())
              total = total + steps
          print(f"Всего шагов: {total}")
        explanation: >-
          `total` создаётся до цикла с нулём, в теле цикла растёт на шаги очередного дня, а
          печатается один раз — после цикла. Каждый проход вызывает `input()` и читает следующую
          строку, поэтому цикл с `range(n)` читает ровно n строк. При 0 дней тело не выполняется ни
          разу, и печатается начальное значение — 0. Вместо `total = total + steps` можно написать
          `total += steps`.
      altSolutions:
        - code: |
            n = int(input())
            total = 0
            for day in range(n):
                total += int(input())
            print("Всего шагов:", total)
          note: Короткая запись +=, число прочитано прямо в выражении, print через запятую.
        - code: |
            n = int(input())
            total = 0
            day = 0
            while day < n:
                steps = int(input())
                total = total + steps
                day = day + 1
            print(f"Всего шагов: {total}")
          note: Цикл while со счётчиком дней.
        - code: |
            n = int(input("Сколько дней? "))
            total = 0
            for day in range(1, n + 1):
                total += int(input(f"Шаги за день {day}: "))
            print(f"Всего шагов: {total}")
          note: Номера дней с 1 через range(1, n + 1) и подсказки в input().
        - code: |
            n = int(input("Дней: "))
            total = 0
            while n > 0:
                total = total + int(input("Шаги: "))
                n = n - 1
            print("Всего шагов:", total, " ")
          note: Обратный отсчёт по n в while, пробел в конце строки вывода.
        - code: |
            n = int(input()); total = 0
            for _ in range(n):
                steps = int(input()); total = steps + total
            print("Всего шагов: " + str(total))
          note: Точки с запятой, сложение в другом порядке, склейка через str().
      wrongSolutions:
        - code: |
            n = int(input())
            total = 0
            # Повтори n раз: прочитай шаги за день и прибавь их к total

            print(f"Всего шагов: {total}")
          note: Стартовый код без изменений — цикла нет, итог 0.
          expectMistake: total-unchanged
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                steps = int(input())
            print(f"Всего шагов: {total}")
          note: Шаги читаются, но не прибавляются к total.
          expectMistake: total-unchanged
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                total = 0
                steps = int(input())
                total = total + steps
            print(f"Всего шагов: {total}")
          note: Накопитель обнуляется внутри цикла — остаются шаги последнего дня.
          expectMistake: reset-inside
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                steps = int(input())
                total = total + steps
                print(f"Всего шагов: {total}")
          note: print внутри цикла — печатаются промежуточные итоги.
          expectMistake: print-inside
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                steps = input()
                total = total + steps
            print(f"Всего шагов: {total}")
          note: Шаги не превращены в число — TypeError.
          expectMistake: no-int
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                steps = int(input())
            total = total + steps
            print(f"Всего шагов: {total}")
          note: Прибавление без отступа — стоит после цикла и выполняется один раз.
          expectMistake: add-outside
        - code: |
            n = int(input())
            total = 0
            steps = int(input())
            for _ in range(n):
                total = total + steps
            print(f"Всего шагов: {total}")
          note: Шаги прочитаны один раз до цикла — первое число прибавляется n раз.
          expectMistake: read-outside
        - code: |
            n = int(input())
            total = 0
            for _ in range(n + 1):
                steps = int(input())
                total = total + steps
            print(f"Всего шагов: {total}")
          note: Цикл делает на один проход больше, чем дней, — EOFError.
          expectMistake: extra-read
        - code: |
            n = int(input())
            total = 0
            steps = int(input())
            for _ in range(n):
                steps = int(input())
                total = total + steps
            print(f"Всего шагов: {total}")
          note: Лишнее чтение до цикла (по образцу рекорда из теории) — EOFError.
          expectMistake: extra-read
        - code: |
            n = int(input())
            total = 0
            day = 0
            while day < n:
                steps = int(input())
                total = total + steps
            print(f"Всего шагов: {total}")
          note: while без увеличения счётчика дней — цикл читает, пока ввод не кончится, EOFError.
          expectMistake: extra-read
        - code: |
            n = int(input())
            total = 0
            day = 0
            while day <= n:
                total = total + int(input())
                day = day + 1
            print(f"Всего шагов: {total}")
          note: while day <= n при счёте с 0 — лишний проход, EOFError.
          expectMistake: extra-read
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                total = 0  # начинаем день
                steps = int(input())
                total = total + steps
            print(f"Всего шагов: {total}")
          note: Обнуление внутри цикла с комментарием в той же строке.
          expectMistake: reset-inside
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                steps = int(input())
                print(steps)
                total = total + steps
            print(f"Всего шагов: {total}")
          note: Отладочный print внутри цикла не убран — лишние строки.
          expectMistake: print-inside
        - code: |
            n = int(input())
            total = 0
            for day in range(1, n):
                steps = int(input())
                total = total + steps
            print(f"Всего шагов: {total}")
          note: range(1, n) — на один проход меньше, последний день не прочитан.
          expectMistake: range-short
        - code: |
            n = int(input())
            total = 0
            for _ in range(n - 1):
                steps = int(input())
                total = total + steps
            print(f"Всего шагов: {total}")
          note: range(n - 1) — на один проход меньше, последний день не прочитан.
          expectMistake: range-short
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                steps = int(input())
                total = total + 1
            print(f"Всего шагов: {total}")
          note: К накопителю прибавляется 1 — получилось число дней, а не сумма.
          expectMistake: counts-days
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                steps = int(input())
                total = steps
            print(f"Всего шагов: {total}")
          note: total = steps — накопитель перезаписывается, остаётся последний день.
          expectMistake: last-day
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                steps = int(input())
                total =+ steps
            print(f"Всего шагов: {total}")
          note: Опечатка =+ вместо += — это total = +steps.
          expectMistake: last-day
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                total = int(input())
            print(f"Всего шагов: {total}")
          note: Число из ввода записывается в накопитель вместо прибавления.
          expectMistake: last-day
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                steps = int(input)
                total = total + steps
            print(f"Всего шагов: {total}")
          note: int(input) без скобок у input — TypeError другого рода; разбор no-int срабатывать не должен.
          expectMistake: null
        - code: |
            n = int(input())
            total = 0
            for _ in range(n):
                steps = int(input())
                total = total + steps
            print(f"Всего шагов: {total}")
            if n > 0:
                print(f"В среднем за день: {total // n}")
          note: Улучшение из afterPass добавлено в проверяемое решение — лишняя строка; print-inside срабатывать не должен.
          expectMistake: null
      mistakes:
        - id: read-outside
          when:
            failedTest: t1
            outputEquals: "Всего шагов: 12000"
            codeRegex: '(?<=\binput\s*\([\s\S]*)^\w+\s*=[^\n]*\binput\s*\((?![\s\S]*^[ \t]+[^\n]*\binput\s*\()'
          where: Строка с `input()` перед циклом
          why: >-
            Шаги читаются один раз — до цикла, и цикл n раз прибавляет одно и то же число. В
            «Примере 1» получается 4000 три раза, то есть 12000, а остальные дни не прочитаны вовсе.
          try: >-
            Перенеси чтение шагов в тело цикла, с отступом: тогда каждый проход прочитает
            следующую строку ввода. Строку `n = int(input())` оставь до цикла.
          verify: "В «Примере 1» должно получиться «Всего шагов: 23500»."
        - id: total-unchanged
          when:
            failedTest: t1
            outputEquals: "Всего шагов: 0"
          why: >-
            В `total` так ничего и не прибавилось — итог остался 0. Либо цикла, который читает шаги,
            ещё нет, либо шаги читаются, но к `total` не прибавляются.
          try: >-
            Напиши цикл на n повторов. В его теле, с отступом, прочитай шаги и прибавь их к
            накопителю: `total = total + steps`.
          verify: "В «Примере 1» должно получиться «Всего шагов: 23500»."
        - id: add-outside
          when:
            failedTest: t1
            codeRegex: '^\w+\s*(\+=|=\s*\w+\s*\+)'
          where: Строка с прибавлением без отступа — после цикла
          why: >-
            Прибавление стоит после цикла, поэтому выполняется один раз — для последнего
            прочитанного дня. Цикл читает все строки, но сумма из них не складывается: в итоге
            только 12000 вместо 23500.
          try: >-
            Сдвинь прибавление внутрь цикла — на один уровень со строкой, где читаются шаги. Тогда
            оно выполнится для каждого дня.
          verify: "В «Примере 1» должно получиться «Всего шагов: 23500»."
        - id: extra-read
          when:
            errorType: EOFError
          why: >-
            Программа попросила строку ввода, которой нет: `input()` вызывается больше раз, чем
            строк во вводе. Значит, цикл сделал лишний проход или где-то есть лишний `input()`.
          try: >-
            Посчитай проходы цикла: `range(n)` повторяет тело ровно n раз, а `while` со счётчиком
            от 0 должен идти, пока `day < n`, и счётчик должен расти на каждом проходе. И посчитай
            все `input()`: один — для n до цикла и по одному на день в теле цикла.
          verify: В «Примере 1» ошибка EOFError должна исчезнуть, а сумма стать 23500.
        - id: no-int
          when:
            errorType: TypeError
            codeRegex: '(?<!int\(\s*)\binput\s*\('
          why: >-
            `input()` возвращает строку, а строку с числом `total` не сложить — поэтому TypeError.
          try: "Превращай строку в число сразу при чтении: `int(input())`."
          verify: "Ошибка должна исчезнуть, а в «Примере 1» — получиться «Всего шагов: 23500»."
        - id: reset-inside
          when:
            failedTest: t1
            codeRegex: '^[ \t]+\w+\s*=\s*0\s*(#.*)?$'
          where: Строка `= 0` внутри цикла
          why: >-
            Накопитель обнуляется в теле цикла — на каждом проходе. После цикла в нём остаются
            только шаги последнего дня: 12000 вместо 23500.
          try: >-
            Оставь `total = 0` один раз — до цикла, без отступа. Внутри цикла накопитель только
            растёт.
          verify: "В «Примере 1» должно получиться «Всего шагов: 23500»."
        - id: print-inside
          when:
            failedTest: t1
            codeRegex: '(?<=^(?:for|while)\b[^\n]*\n(?:[ \t]+[^\n]*\n|[ \t]*(?:#[^\n]*)?\n)*)^[ \t]+print\('
          where: "`print` с отступом — внутри цикла"
          why: >-
            `print` стоит в теле цикла, поэтому печатает на каждом проходе: вместо одной итоговой
            строки получается несколько. А при 0 дней итог не печатается вовсе.
          try: >-
            Итог печатай один раз — после цикла, без отступа. Отладочный `print` внутри цикла
            убери перед проверкой.
          verify: >-
            В «Примере 1» должна остаться одна строка «Всего шагов: 23500», а в граничном случае с
            нулём дней — «Всего шагов: 0».
        - id: range-short
          when:
            failedTest: t1
            outputEquals: "Всего шагов: 11500"
          where: Строка с `range` или условием `while`
          why: >-
            В итоге 11500 — шаги только первых двух дней из трёх. Цикл сделал на один проход
            меньше, чем дней, и последний день не прочитан. Так выходит с `range(1, n)` или
            `range(n - 1)`: в них n − 1 повторов.
          try: >-
            Номер дня здесь не нужен — пиши `range(n)`. Если нужны номера с 1, то
            `range(1, n + 1)`.
          verify: "В «Примере 1» должно получиться «Всего шагов: 23500»."
        - id: counts-days
          when:
            failedTest: t1
            outputEquals: "Всего шагов: 3"
          why: >-
            Получилось 3 — число дней, а не сумма шагов: на каждом проходе к накопителю
            прибавляется 1. Так работает счётчик, а здесь нужна сумма.
          try: "Прибавляй шаги этого дня — число, прочитанное в этом проходе: `total = total + steps`."
          verify: "В «Примере 1» должно получиться «Всего шагов: 23500»."
        - id: last-day
          when:
            failedTest: t1
            outputEquals: "Всего шагов: 12000"
          where: Строка внутри цикла, которая меняет `total`
          why: >-
            В итоге только шаги последнего дня — 12000. Значит, на каждом проходе накопитель не
            дополняется, а заменяется: например, `total = steps`, `total = int(input())` или
            опечатка `=+` вместо `+=`.
          try: >-
            Внутри цикла прибавляй к старому значению: `total = total + steps` или
            `total += steps`.
          verify: "В «Примере 1» должно получиться «Всего шагов: 23500»."
      afterPass: >-
        Сумма копится за один проход, и программе всё равно, сколько дней во вводе — один, семь или
        триста. Если хочешь, выведи ещё среднее за день, округлённое вниз: `total // n`. Только
        сначала проверь, что `n > 0`: делить на ноль нельзя. Пробуй это кнопкой «Запустить»:
        «Проверить» ждёт ровно одну строку, и с лишней строкой проверка не пройдёт.
      skills: [accumulators, for-range, input-read]

  - id: practice-norm
    type: exercise
    title: Практика 2
    exercise:
      id: m3-l3-e2
      kind: modify
      title: Дни с нормой
      statement: |-
        Пётр Андреевич поставил себе цель — не меньше 10 000 шагов в день. Доработай программу из
        прошлого задания: пусть после суммы она печатает, сколько дней цель была выполнена. Ровно
        10 000 шагов — цель выполнена.

        ```text
        Всего шагов: 26000
        Дней с нормой: 2
        ```
      input: >-
        Как в прошлом задании: первая строка — число дней N (0 или больше), дальше N строк с
        шагами.
      output: >-
        Две строки: `Всего шагов: <сумма>` и `Дней с нормой: <сколько дней с 10 000 шагов и
        больше>`.
      constraints:
        - Сумму и число дней с нормой считай в одном цикле.
        - "В коде число пишется без пробела: `10000`."
        - Текст подсказок в `input()` может быть любым — он не проверяется.
      starterCode: |
        n = int(input())
        total = 0
        for _ in range(n):
            steps = int(input())
            total = total + steps
        print(f"Всего шагов: {total}")
      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          stdin: "3\n4000\n10000\n12000\n"
          expected: |-
            Всего шагов: 26000
            Дней с нормой: 2
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 2: неделя"
          example: true
          stdin: "7\n8000\n10000\n6500\n12000\n0\n9000\n11000\n"
          expected: |-
            Всего шагов: 56500
            Дней с нормой: 3
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: чуть-чуть не хватило"
          edge: true
          stdin: "2\n3000\n9999\n"
          expected: |-
            Всего шагов: 12999
            Дней с нормой: 0
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: ровно 10 000"
          edge: true
          stdin: "1\n10000\n"
          expected: |-
            Всего шагов: 10000
            Дней с нормой: 1
        - id: t5
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: ноль дней"
          edge: true
          stdin: "0\n"
          expected: |-
            Всего шагов: 0
            Дней с нормой: 0
        - id: t6
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: поход, 25 000 шагов"
          edge: true
          stdin: "2\n25000\n3000\n"
          expected: |-
            Всего шагов: 28000
            Дней с нормой: 1
      criteria:
        - Сумма шагов считается, как раньше.
        - "Счётчик дней с нормой создаётся до цикла с нулём и растёт на 1 внутри цикла, когда в день пройдено 10 000 шагов или больше."
        - Проверяется каждый день, а не только последний; ровно 10 000 — это норма.
        - "Вывод — две строки: сначала сумма, потом число дней с нормой."
      hints:
        - >-
          Сумма уже считается. Для числа дней нужен второй накопитель — счётчик. С какого числа он
          начинается, на сколько растёт и при каком условии?
        - |-
          Похожий счётчик в другой задаче — сколько пятёрок в журнале:
          ```python
          fives = 0
          for _ in range(4):
              mark = int(input())
              if mark == 5:
                  fives = fives + 1
          print(fives)
          ```
          Проверка стоит внутри цикла, поэтому смотрит на каждую оценку.
        - |-
          Каркас:
          ```text
          good_days = 0                  # до цикла
          for _ in range(n):
              steps = int(input())
              total = total + steps
              if steps … 10000:          # внутри цикла, с отступом
                  good_days = …
          print(f"Всего шагов: {total}")
          print(…)                       # после цикла
          ```
      solution:
        code: |
          n = int(input())
          total = 0
          good_days = 0
          for _ in range(n):
              steps = int(input())
              total = total + steps
              if steps >= 10000:
                  good_days = good_days + 1
          print(f"Всего шагов: {total}")
          print(f"Дней с нормой: {good_days}")
        explanation: >-
          Счётчик `good_days` устроен как накопитель: 0 до цикла, изменение внутри, вывод после.
          Отличие в том, что он растёт на 1 и только в те дни, когда условие `if` верно. Знак `>=`
          включает ровно 10 000 — по условию это тоже норма. `if` стоит внутри цикла, поэтому
          проверяется каждый день, а не только последний.
