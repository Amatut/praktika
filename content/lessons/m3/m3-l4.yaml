      mistakes:
        - id: int-before-check
          when:
            errorType: ValueError
            errorIncludes: "'конец'"
          why: >-
            `int()` получил слово «конец» и не смог превратить его в число — это ValueError.
            Значит, строка превращается в число раньше, чем программа поняла, что смена
            закончилась, или сравнение написано не совсем так, как во вводе.
          try: >-
            Сохрани строку из `input()` как есть, сравни её с `"конец"` и только потом вызывай
            `int(...)`. Слово в сравнении пиши точно как во вводе — маленькими буквами.
          verify: 'В «Примере 1» ошибка должна исчезнуть, а в выводе появиться «Посылок: 3».'
        - id: str-not-number
          when:
            errorType: TypeError
            errorIncludes: "'str'"
          why: >-
            Строку из `input()` сравнивают с числом или прибавляют к числу — Python так не умеет,
            это TypeError: `"350"` для него текст, а не число. Проверка на «конец» работает со
            строкой, а дальше нужно число.
          try: >-
            Сразу после проверки на «конец» превращай строку в число — `weight = int(line)` — и
            дальше сравнивай и складывай `weight`.
          verify: 'В «Примере 1» ошибка должна исчезнуть, а в выводе появиться «Общий вес: 3550 г».'
        - id: no-break
          when:
            errorType: EOFError
          why: >-
            Слово «конец» пришло, но цикл не закончился и снова вызвал `input()`, а строки
            ввода уже кончились — EOFError. `while True` сам не останавливается.
          try: Когда пришло `конец`, выполни `break`.
          verify: В «Примере 1» программа должна остановиться на слове «конец» и напечатать итог.
        - id: break-on-error
          when:
            outputEquals: "Посылок: 1\nОбщий вес: 1200 г"
          why: >-
            Программа посчитала только первую посылку: на сбое весов (0 во второй строке) цикл
            закончился. `break` выходит из цикла совсем, а сбой нужно лишь пропустить.
          try: >-
            Для сбоя весов используй `continue`: он пропускает остаток шага, и цикл читает
            следующую строку.
          verify: 'В «Примере 1» должно получиться «Посылок: 3».'
        - id: count-before-skip
          when:
            outputEquals: "Посылок: 5\nОбщий вес: 3550 г"
          why: >-
            Вес верный, а посылок 5: сбои попали в счётчик. Строка `count += 1` выполняется для
            каждого числа — она стоит выше проверки на сбой или вне её. Всё, что в теле до
            `continue`, выполняется и для сбоя: `continue` пропускает только строки под ним.
          try: >-
            Перенеси `count += 1` ниже `if weight <= 0: continue` (или внутрь `if weight > 0:`) —
            туда же, где `total += weight`.
          verify: 'В «Примере 1» должно получиться «Посылок: 3».'
        - id: total-before-skip
          when:
            outputEquals: "Посылок: 3\nОбщий вес: 3510 г"
          why: >-
            Посылок 3 — верно, а вес 3510 вместо 3550: к нему прибавились сбои 0 и −40. Строка
            `total += weight` выполняется для каждого числа — она стоит выше проверки на сбой или
            вне её. `continue` пропускает только строки под ним.
          try: >-
            Прибавляй вес там, где сбои уже отброшены: ниже `if weight <= 0: continue` (или
            внутри `if weight > 0:`), рядом с `count += 1`.
          verify: 'В «Примере 1» должно получиться «Общий вес: 3550 г».'
        - id: no-skip
          when:
            outputIncludes: "Посылок: 5"
          why: >-
            Сбои весов посчитаны как посылки: в «Примере 1» пять чисел, но настоящих посылок
            только три — `0` и `-40` не в счёт.
          try: >-
            После `int(...)` проверь вес: если он 0 или меньше, пропусти шаг через `continue`
            (или прибавляй к накопителям только внутри `if weight > 0:`). Оба накопителя —
            `count` и `total` — должны стоять ниже этой проверки.
          verify: 'В «Примере 1» должно получиться «Посылок: 3» и «Общий вес: 3550 г».'
        - id: zero-counted
          when:
            outputEquals: "Посылок: 4\nОбщий вес: 3550 г"
          why: >-
            Отрицательные значения пропущены, а ноль — нет. Но посылка весом 0 граммов — тоже
            сбой весов: граница входит в «плохие» значения.
          try: Пропускай вес, если он меньше **или равен** нулю — `<= 0`.
          verify: 'В «Примере 1» должно получиться «Посылок: 3».'
        - id: print-inside
          when:
            failedTest: t1
            outputIncludes: "Общий вес: 1200 г\nПосылок:"
            codeRegex: '^[ \t]+print\('
          why: >-
            Итог печатается внутри цикла — после каждой посылки получается новая пара строк с
            промежуточными числами, а нужна одна, в самом конце.
          try: >-
            Сдвинь оба `print` влево, на уровень `while`: они выполнятся один раз, после
            выхода из цикла.
          verify: В «Примере 1» в выводе должно быть ровно две строки.
      afterPass: >-
        Программа обработает смену любой длины: сама отбросит сбои весов и остановится на слове
        «конец». Возможное улучшение — третий счётчик: сколько раз весы сбоили. Его удобно
        увеличивать прямо в ветке с `continue`.
      skills: [loop-control, accumulators, conditions]

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`while True` + `break`: цикл останавливается изнутри в тот момент, когда стало ясно, что хватит; программа продолжается со строки после цикла."
      - "`continue` пропускает остаток шага и переходит к следующему; в `while` переменная условия должна меняться до `continue`."
      - "Флаг (`False` до цикла, `True` перед `break`) помогает после цикла понять, чем он закончился; номер шага для этого не годится."
      - "`break` уместен, когда решение «хватит» принимается посреди тела. Если условие остановки легко записать в строке `while`, пиши его там."
    question: >-
      Что изменится, если в пульте лампы заменить `break` на `continue` в ветке «выход»?
    answer: >-
      Цикл перестанет заканчиваться: `continue` вернёт программу к проверке условия, а у
      `while True` оно всегда верно, поэтому программа снова спросит команду. Команда «выход»
      перестанет работать, «Пульт выключен» не напечатается, а в тренажёре ввод кончится, и
      программа остановится с EOFError.
