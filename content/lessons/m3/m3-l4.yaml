      mistakes:
        - id: str-vs-int
          when:
            errorType: EOFError
            codeRegex: '(?<![\s\S])(?![\s\S]*\bint\s*\()[\s\S]*?(?:[!=]=\s*2718\b|\b2718\s*[!=]=)'
          why: >-
            `input()` возвращает строку `"2718"`, а в сравнении стоит число `2718` без кавычек.
            Строка никогда не равна числу, поэтому верный код не узнаётся, цикл не
            заканчивается и просит коды, пока ввод не кончится, — отсюда EOFError.
          try: >-
            Выбери одно из двух, но не оба сразу: возьми `2718` в кавычки или превращай ввод в
            число через `int(...)` перед сравнением.
          verify: 'В «Примере 1» после второго кода должно появиться «Сейф открыт! Попыток: 2».'
        - id: int-vs-str
          when:
            errorType: EOFError
            codeRegex: '(?<![\s\S])(?=[\s\S]*\bint\s*\()[\s\S]*?(?:[!=]=\s*["'']2718["'']|["'']2718["'']\s*[!=]=)'
          why: >-
            Ввод превращён в число через `int(...)`, а сравнивается со строкой `"2718"` в
            кавычках. Число никогда не равно строке, поэтому верный код не узнаётся, цикл не
            заканчивается и просит коды, пока ввод не кончится, — отсюда EOFError.
          try: >-
            Выбери что-то одно: сравнивай строки — `code == "2718"` без `int`, или числа —
            `int(code) == 2718` без кавычек.
          verify: 'В «Примере 1» после второго кода должно появиться «Сейф открыт! Попыток: 2».'
        - id: no-break
          when:
            errorType: EOFError
            codeRegex: '(?<![\s\S])(?![\s\S]*\bbreak\b)'
          why: >-
            Верный код прочитан, но цикл не остановился и снова вызвал `input()`, а строки
            ввода уже кончились — это EOFError. `while True` сам не заканчивается: выйти из
            него можно только через `break`.
          try: Когда код верный, выполни `break` — прямо внутри `if`, который проверяет код.
          verify: В «Примере 1» программа должна остановиться после второго кода.
        - id: plus-equals-typo
          when:
            failedTest: t1
            codeRegex: '(?:^|[^=!<>])=\+\s*\d'
          why: >-
            В строке счётчика стоит `=+` вместо `+=`. Python читает `attempts =+ 1` как
            `attempts = +1` — «положи в счётчик 1», а не «прибавь 1». Поэтому после любой
            попытки в счётчике 1.
          try: Поменяй знаки местами — `attempts += 1`.
          verify: 'В «Примере 2» должно получиться «Попыток: 4».'
        - id: reset-inside
          when:
            failedTest: t1
            codeRegex: '^[ \t]+[\wА-Яа-яЁё]+\s*=\s*0\s*$'
          why: >-
            Строка, которая создаёт счётчик (`attempts = 0`), стоит внутри цикла и обнуляет его в
            начале каждой попытки. Поэтому к концу в нём всегда 1 — только последняя попытка.
          try: Создай счётчик один раз — до `while True:`, без отступа.
          verify: 'В «Примере 2» должно получиться «Попыток: 4».'
        - id: final-inside
          when:
            failedTest: t1
            codeRegex: '^([ \t]+)[\wА-Яа-яЁё]+\s*=.*\binput\([\s\S]*^\1print\(f?["'']Сейф открыт[^\n]*$(?!\n\1break\b)'
          why: >-
            Строка «Сейф открыт!» стоит внутри цикла, на одном уровне с `print("Неверно")`.
            Поэтому она печатается после каждой неверной попытки — с тем числом, что успело
            накопиться, — а после верного кода `break` уводит из цикла, и до неё очередь уже не
            доходит.
          try: >-
            Сдвинь `print(f"Сейф открыт! …")` влево, на уровень `while`: строка без отступа
            выполнится один раз, после выхода из цикла.
          verify: 'В «Примере 1» должно быть две строки: «Неверно» и «Сейф открыт! Попыток: 2».'
        - id: count-after-break
          when:
            outputEquals: "Неверно\nСейф открыт! Попыток: 1"
          why: >-
            Попыток в итоге меньше, чем было кодов: часть попыток не посчитана. Строка счётчика
            выполняется не на каждой попытке — она стоит после проверки кода или внутри одной из
            веток, и `break` или `continue` уводят раньше, чем очередь до неё доходит.
          try: >-
            Увеличивай счётчик сразу после `input()`, до проверки кода и вне `if`: тогда строка
            выполнится на каждой попытке — и на верной, и на неверных.
          verify: 'В «Примере 1» должно получиться «Попыток: 2», а с первой попытки — «Попыток: 1».'
        - id: wrong-before-check
          when:
            outputEquals: "Неверно\nНеверно\nСейф открыт! Попыток: 2"
          why: >-
            «Неверно» напечатано и для верного кода: `print` стоит до проверки, поэтому
            выполняется на каждой попытке.
          try: >-
            Печатай «Неверно» только после проверки кода — внутри `if` для неверного кода или
            после `if` с `break`: туда доходят только неверные коды.
          verify: В «Примере 1» должно быть одно «Неверно», а не два.
      afterPass: >-
        Замок работает: цикл сам решает, когда остановиться, а счётчик учитывает и верную
        попытку. Попробуй в поле «Ввод для „Запустить“» свои коды — например, сразу `2718`, — и
        посмотри, как меняется число попыток.
      skills: [loop-control, while-loops, accumulators]

  - id: practice-three
    type: exercise
    title: Практика 2
    exercise:
      id: m3-l4-e2
      kind: modify
      title: Только три попытки
      statement: |-
        Сева решил, что подбирать код бесконечно нечестно: у команды есть только три попытки.
        Измени программу:

        - если верный код введён с первой, второй или третьей попытки — печатается
          `Сейф открыт! Попыток: k`, как раньше;
        - если все три кода неверные — после третьего `Неверно` печатается
          `Сейф заблокирован`. Четвёртый код программа уже не читает.

        Три неверные попытки:

        ```text
        Неверно
        Неверно
        Неверно
        Сейф заблокирован
        ```
      input: >-
        Коды по одному на строке, их может быть и больше трёх. Ввода хватит: либо среди первых
        трёх кодов есть верный, либо строк не меньше трёх.
      output: >-
        `Неверно` для каждого неверного кода, затем одна итоговая строка:
        `Сейф открыт! Попыток: k` или `Сейф заблокирован`.
      constraints:
        - Программа читает не больше трёх кодов — четвёртый раз `input()` не вызывается.
        - Верный код по-прежнему `2718`.
      starterCode: |
        attempts = 0
        while True:
            code = input()
            attempts += 1
            if code == "2718":
                break
            print("Неверно")
        print(f"Сейф открыт! Попыток: {attempts}")
      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          stdin: "1111\n2718\n"
          expected: |-
            Неверно
            Сейф открыт! Попыток: 2
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 2: три ошибки"
          example: true
          stdin: "1111\n0000\n2817\n"
          expected: |-
            Неверно
            Неверно
            Неверно
            Сейф заблокирован
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: с первой попытки"
          edge: true
          stdin: "2718\n"
          expected: "Сейф открыт! Попыток: 1"
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: на последней попытке"
          edge: true
          stdin: "1234\n8172\n2718\n"
          expected: |-
            Неверно
            Неверно
            Сейф открыт! Попыток: 3
        - id: t5
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: четвёртая попытка не принимается"
          edge: true
          stdin: "0000\n1111\n2222\n2718\n"
          expected: |-
            Неверно
            Неверно
            Неверно
            Сейф заблокирован
      criteria:
        - Программа читает не больше трёх кодов.
        - Верный код на любой из трёх попыток открывает сейф и даёт правильное число попыток.
        - После трёх неверных кодов печатается только «Сейф заблокирован», без «Сейф открыт!».
      hints:
        - >-
          Число попыток теперь известно заранее — не больше трёх. Какой цикл удобен, когда
          число повторений известно? И как после цикла узнать, открыли сейф или попытки просто
          кончились? Учти: номер попытки 3 бывает и тогда, когда верным оказался третий код.
        - |-
          Флаг на другом примере — ищем за неделю первый день без дождя:
          ```python
          found = False
          for day in range(1, 8):
              rain = int(input())
              if rain == 0:
                  found = True
                  break
          if found:
              print(f"Сухой день: {day}")
          else:
              print("Всю неделю дождь")
          ```
          После `break` переменная `day` хранит номер того самого дня. Но `day` равно 7 и когда
          сухим оказался последний день, и когда дождь шёл всю неделю, — различает эти случаи
          только `found`.
        - |-
          Каркас:
          ```text
          opened = False
          for attempt in range(1, 4):
              прочитать код
              если код верный: opened = True и break
              print("Неверно")
          если opened: «Сейф открыт! Попыток: …»
          иначе: «Сейф заблокирован»
          ```
      solution:
        code: |
          opened = False
          for attempt in range(1, 4):
              code = input()
              if code == "2718":
                  opened = True
                  break
              print("Неверно")
          if opened:
              print(f"Сейф открыт! Попыток: {attempt}")
          else:
              print("Сейф заблокирован")
        explanation: >-
          `range(1, 4)` даёт ровно три попытки: 1, 2, 3. Верный код ставит флаг `opened` и
          прерывает цикл, а после `break` переменная `attempt` хранит номер этой попытки —
          отдельный счётчик не нужен. Если цикл дошёл до конца без `break`, флаг остался
          `False`, и программа печатает «Сейф заблокирован». Можно оставить и `while True` со
          счётчиком: тогда после «Неверно» нужна проверка `if attempts == 3: break`. Итог и
          тогда выбирай по флагу, а не по `attempts == 3`: счётчик равен 3 и когда сейф открыли
          третьим кодом.
