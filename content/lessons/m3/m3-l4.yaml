id: m3-l4
module: m3
number: "3.4"
title: "break и continue: меню и повтор до верного ответа"
objective: >-
  Выходить из цикла через break, когда стало ясно, что повторять больше не нужно, пропускать
  шаг через continue и объяснять, когда они делают цикл понятнее.
minutes: [20, 30]
prerequisites: [m3-l3]
skills: [loop-control, while-loops]
environment: python

story:
  title: Сейф в квест-комнате
  fictional: true
  text: >-
    Администратор квест-комнаты Сева каждый вечер сбрасывал кодовый замок сейфа и отмечал на
    листке, с какой попытки команда его открыла. Игроки то и дело спрашивали, сколько попыток
    уже сделано, а Сева сбивался со счёта. Тогда он написал простую программу-замок: она
    принимает коды, пока не введут верный, сама считает попытки и останавливается ровно в тот
    момент, когда сейф открыт. Позже он добавил правило: три попытки, после которых замок
    блокируется. Сегодня ты соберёшь обе версии сам.

why: >-
  Заранее не всегда известно, когда цикл должен закончиться: меню работает до команды «выход»,
  игра — до верного ответа. `break` останавливает цикл в нужный момент, а `continue` пропускает
  неподходящую запись и не останавливает всю обработку.

usedIn: >-
  Консольные меню и чат-боты работают до команды выхода. Программы переспрашивают, пока ответ
  не станет верным (в модуле 7 — вместе с обработкой ошибок). Поиск первого подходящего значения
  заканчивается через `break`, а при обработке данных `continue` отбрасывает «мусор»: пустые
  строки, показания с ошибкой.

steps:
  - id: break-continue
    type: theory
    title: break, continue и while True
    body: |-
      Иногда решение «хватит повторять» принимается посреди тела цикла: программа прочитала
      ответ — и только теперь понятно, верный он или нет. Для таких случаев в Python есть две
      команды.

      **`break`** — немедленный выход из цикла. Строки тела после `break` не выполняются, условие
      больше не проверяется, программа продолжается с первой строки после цикла. Сама программа
      при этом не останавливается. В `for` команда `break` заканчивает цикл раньше, чем кончится
      `range`.

      **`continue`** — «этот шаг закончен, переходи к следующему». Шаг цикла — то же, что
      итерация: один проход тела. Остаток тела пропускается: `while` снова проверяет условие,
      `for` берёт следующее значение.

      **`while True:`** — цикл, условие которого всегда верно. Сам он не закончится, выход
      делают изнутри через `break`. Так устроены меню и повтор вопроса: цикл ждёт
      **стоп-слово** — слово, после которого он заканчивается.

      ```python
      while True:
          command = input()
          if command == "выход":
              break
          # здесь остальные команды
      ```

      **Флаг.** Помнишь `storm` из урока 2.4? Это флаг — переменная, в которой лежит `True` или
      `False`. Здесь флаг запоминает, чем закончился цикл: вышли по `break` или просто кончились
      шаги. Ищем книгу на пяти полках:

      ```python
      found = False
      for shelf in range(1, 6):
          book = input()
          if book == "Хоббит":
              found = True
              break
      if found:
          print(f"Нашли на полке {shelf}")
      else:
          print("Книги нет")
      ```

      Переменная цикла `for` после `break` хранит значение того шага, на котором цикл прервался, —
      здесь номер полки. Но выбрать итог по ней нельзя: `shelf` равно 5 и когда книга на
      последней полке, и когда её нет вовсе. Различает эти случаи только флаг.

      **Когда это уместно.** `break` — когда остановка решается внутри тела. `continue` — чтобы
      сразу отбросить неподходящую запись. Если условие остановки легко записать в строке
      `while …:`, оставь его там: так цикл читается проще.

      **Две ловушки.**

      - В `while` строка, которая меняет переменную из условия, должна стоять до `continue`.
        Иначе `continue` её перепрыгнет, условие не изменится, и цикл станет бесконечным.
      - Если стоп-слово так и не пришло или до `break` невозможно дойти, цикл снова вызовет
        `input()`, а ввод уже кончился. В тренажёре это ошибка `EOFError`: строки ввода
        закончились, а цикл просит ещё.
    simpler: >-
      `break` — «всё, хватит, выходим из цикла». `continue` — «остаток этого шага пропускаем,
      переходим к следующему». `while True` — «повторяй, пока я сам не скажу `break`». Флаг —
      отметка «да или нет», по которой после цикла видно, чем он закончился.
    coach: >-
      Если в цикле есть `break`, найди все пути к нему и убедись, что хотя бы один точно
      наступит.

  - id: lamp
    type: example
    title: Пульт умной лампы
    body: >-
      Пульт понимает три команды: «ярче», «тусклее» и «выход». Ввод для примера уже задан: две
      команды «ярче», незнакомая «песня», потом «тусклее» и «выход». Нажми «Запустить».
    code: |-
      brightness = 50
      while True:
          command = input("Команда: ")
          if command == "выход":
              break
          if command == "ярче":
              brightness += 10
          elif command == "тусклее":
              brightness -= 10
          else:
              print("Не знаю такой команды")
              continue
          print(f"Яркость: {brightness}")
      print("Пульт выключен")
    stdin: "ярче\nярче\nпесня\nтусклее\nвыход\n"
    notes:
      - line: 2
        text: >-
          `while True` — условие всегда верно. Цикл закончится только через `break`.
      - line: 5
        text: >-
          `break` выполняется, только когда пришло «выход»: программа сразу переходит к строке 14,
          строки 6–13 уже не выполняются.
      - line: 12
        text: >-
          Незнакомая команда: сообщение уже напечатано, `continue` пропускает строку 13, и цикл
          сразу спрашивает следующую команду.
      - line: 13
        text: Сюда доходят только известные команды — яркость уже изменилась, осталось её показать.
      - line: 14
        text: Без отступа — выполнится один раз, после выхода из цикла.
    tryIt: >-
      Убери строку с `continue` и запусти снова: после «Не знаю такой команды» появится лишняя
      строка «Яркость: 70», хотя яркость не менялась. Потом верни `continue` на место.
    coach: >-
      Проследи по выводу: каждая строка ввода — одна итерация. Какая итерация закончилась через
      `continue`, а какая — через `break`?

  - id: skip-and-stop
    type: predict
    title: Кто пропущен и где остановка
    prompt: >-
      В этом цикле есть и `continue`, и `break`. Как думаешь, что выведет программа?
    code: |-
      for i in range(1, 10):
          if i % 3 == 0:
              continue
          if i == 8:
              break
          print(i)
    options:
      - |-
        1
        2
      - |-
        1
        2
        3
        4
        5
        6
        7
      - |-
        1
        2
        4
        5
        7
      - |-
        1
        2
        4
        5
        7
        8
      - |-
        1
        2
        4
        5
        7
        9
    answer: |-
      1
      2
      4
      5
      7
    explanation: |-
      Пройдём цикл по шагам:

      ```text
      i = 1: на 3 не делится, не 8 → печать 1
      i = 2: печать 2
      i = 3: 3 % 3 == 0 → continue, печати нет
      i = 4: печать 4
      i = 5: печать 5
      i = 6: continue, печати нет
      i = 7: печать 7
      i = 8: на 3 не делится, но i == 8 → break
      i = 9: не наступает — цикл уже закончен
      ```

      `continue` не значит «продолжай по телу»: остаток шага пропускается, поэтому 3 и 6 не
      напечатаны. Пропускается только текущий шаг — после 3 цикл продолжается с 4. `break`
      срабатывает раньше `print`, поэтому 8 не печатается, а 9 цикл уже не берёт: `break`
      не пропускает шаг, как `continue`, а заканчивает весь цикл.
    coach: >-
      `continue` и `break` оба прерывают шаг. Разница в том, что будет дальше: следующий шаг или
      выход из цикла.

  - id: continue-trap
    type: quiz
    title: Где застрянет цикл
    question: |-
      Программа раздаёт места по рядам, третий ряд на ремонте. Что произойдёт при запуске?

      ```python
      row = 1
      while row <= 5:
          if row == 3:
              continue
          print(f"Ряд {row}: рассаживаем")
          row = row + 1
      print("Готово")
      ```
    options:
      - Ряды 1, 2, 4 и 5, потом «Готово»
      - Ряды 1 и 2, потом «Готово»
      - Ряды 1 и 2, а потом программа зависнет и «Готово» не напечатает
    correct: 2
    explanation: >-
      Когда `row` становится 3, `continue` возвращает программу к проверке `row <= 5`, но строка
      `row = row + 1` пропущена. `row` остаётся 3, снова срабатывает `continue` — и так без конца.
      В тренажёре такой запуск остановится с сообщением «Программа работает слишком долго».
      Исправить можно двумя способами: увеличить `row` перед `continue` или взять
      `for row in range(1, 6)` — `for` сам берёт следующее значение, и `continue` в нём безопасен.
    coach: >-
      В `while` с `continue` всегда спрашивай себя: что меняет переменную условия на этом пути?

  - id: practice-safe
    type: exercise
    title: Практика 1
    exercise:
      id: m3-l4-e1
      kind: repeat
      title: Код от сейфа
      statement: |-
        Программа-замок из истории. Верный код — `2718`. Программа читает коды по одному, пока
        не введут верный. После каждого неверного кода она печатает `Неверно`, а когда код
        верный — `Сейф открыт! Попыток: k`, где k — сколько всего кодов ввели, считая верный.
        Строки после верного кода программа не читает.

        Например, для ввода `1111` и `2718`:

        ```text
        Неверно
        Сейф открыт! Попыток: 2
        ```
      input: Коды по одному на строке. Верный код во вводе обязательно встретится.
      output: >-
        `Неверно` для каждого неверного кода, затем одна строка `Сейф открыт! Попыток: k`.
      constraints:
        - Код из ввода — строка, как всегда у `input()`.
        - Сколько кодов придёт до верного, заранее неизвестно.
        - Текст подсказки в `input()` можно написать любой — он не проверяется.
      starterCode: |
        attempts = 0
        while True:
            code = input()
            # посчитай эту попытку
            # если код верный — выйди из цикла
            # иначе напечатай «Неверно»
        print(f"Сейф открыт! Попыток: {attempts}")
      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          stdin: "1111\n2718\n"
          expected: |-
            Неверно
            Сейф открыт! Попыток: 2
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 2
          example: true
          stdin: "0000\n1234\n9999\n2718\n"
          expected: |-
            Неверно
            Неверно
            Неверно
            Сейф открыт! Попыток: 4
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: с первой попытки"
          edge: true
          stdin: "2718\n"
          expected: "Сейф открыт! Попыток: 1"
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: похожие коды и строка после верного"
          edge: true
          stdin: "2781\n27180\n2718\n0000\n"
          expected: |-
            Неверно
            Неверно
            Сейф открыт! Попыток: 3
        - id: t5
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: десять неверных подряд"
          edge: true
          stdin: "1000\n1001\n1002\n1003\n1004\n1005\n1006\n1007\n1008\n1009\n2718\n"
          expected: |-
            Неверно
            Неверно
            Неверно
            Неверно
            Неверно
            Неверно
            Неверно
            Неверно
            Неверно
            Неверно
            Сейф открыт! Попыток: 11
      criteria:
        - Цикл останавливается сразу после верного кода, следующие строки ввода не читаются.
        - Цикл не ограничен заранее заданным числом попыток.
        - После каждого неверного кода печатается `Неверно`, после верного — нет.
        - Число попыток учитывает и верный код, в том числе когда он введён первым.
      hints:
        - >-
          С каждой попыткой программа делает три дела: учитывает её, сравнивает код с верным и
          решает — выходить из цикла или сказать «Неверно». В каком порядке их выполнить, чтобы
          верная попытка тоже посчиталась? И помни, какой тип у значения из `input()`.
        - |-
          Тот же приём на другом примере — программа ждёт слова «да»:
          ```python
          while True:
              word = input()
              if word == "да":
                  break
              print("Жду «да»")
          print("Спасибо!")
          ```
          На любое другое слово она просит ещё раз, а на «да» выходит из цикла и благодарит.
        - |-
          Каркас тела цикла:
          ```text
          code = input()
          attempts — прибавить 1
          если code равен "2718": break
          print("Неверно")
          ```
      solution:
        code: |
          attempts = 0
          while True:
              code = input()
              attempts += 1
              if code == "2718":
                  break
              print("Неверно")
          print(f"Сейф открыт! Попыток: {attempts}")
        explanation: >-
          Попытка считается сразу после `input()`, поэтому верная тоже попадает в счётчик. Если
          код верный, `break` уводит из цикла к последней строке, и «Неверно» для него не
          печатается. Код сравнивается со строкой `"2718"` в кавычках: `input()` возвращает
          строку. Сработает и `int(code) == 2718`, но для кодов строки надёжнее: `int` сочтёт
          `02718` тем же кодом, а на букве в коде остановит программу с ValueError.
      altSolutions:
        - code: |
            attempts = 0
            while True:
                code = input()
                attempts = attempts + 1
                if int(code) == 2718:
                    break
                print("Неверно")
            print(f"Сейф открыт! Попыток: {attempts}")
          note: Код превращается в число и сравнивается с числом; счётчик без `+=`.
        - code: |
            code = input()
            attempts = 1
            while code != "2718":
                print("Неверно")
                code = input()
                attempts += 1
            print(f"Сейф открыт! Попыток: {attempts}")
          note: Без break — условие остановки записано в строке while.
        - code: |
            attempts = 0
            while True:
                code = input("Код: ")
                attempts += 1
                if code == "2718":
                    print(f"Сейф открыт! Попыток: {attempts}")
                    break
                print("Неверно")
          note: Итог печатается внутри if прямо перед break, последней строки нет.
        - code: |
            tries = 0
            while True:
                guess = input("Введи код: ")
                tries = tries + 1
                if guess != "2718":
                    print("Неверно")
                    continue
                print("Сейф открыт! Попыток: " + str(tries))
                break
          note: "Рецензия: стиль пульта лампы — неверный код отсекается continue, итог и break в конце тела."
        - code: |
            попытки = 0

            while True:
                код = input( "Введи код: " )
                попытки = попытки + 1

                if код == "2718":
                    break

                print( "Неверно" )

            print(f"Сейф открыт! Попыток: { попытки }")
          note: "Рецензия: русские имена переменных, пробелы внутри скобок, пустые строки в коде."
        - code: |
            k = 0
            while True:
                k += 1
                code = int(input())
                if code == 2718:
                    print("Сейф открыт! Попыток:", k)
                    break
                else:
                    print("Неверно")
          note: "Рецензия: int(input()) и сравнение с числом, итог в if перед break, print через запятую."
      wrongSolutions:
        - code: |
            attempts = 0
            while True:
                code = input()
                attempts += 1
                if code == 2718:
                    break
                print("Неверно")
            print(f"Сейф открыт! Попыток: {attempts}")
          note: Строка из input() сравнивается с числом — равенства не бывает никогда.
          expectMistake: str-vs-int
        - code: |
            attempts = 0
            while True:
                code = input()
                attempts += 1
                if code == "2718":
                    print(f"Сейф открыт! Попыток: {attempts}")
                else:
                    print("Неверно")
          note: Нет выхода из цикла — после верного кода цикл просит ещё строку.
          expectMistake: no-break
        - code: |
            while True:
                attempts = 0
                code = input()
                attempts += 1
                if code == "2718":
                    break
                print("Неверно")
            print(f"Сейф открыт! Попыток: {attempts}")
          note: Счётчик обнуляется на каждом шаге.
          expectMistake: reset-inside
        - code: |
            attempts = 0
            while True:
                code = input()
                if code == "2718":
                    break
                print("Неверно")
                attempts += 1
            print(f"Сейф открыт! Попыток: {attempts}")
          note: Счётчик стоит после break — верная попытка не посчитана.
          expectMistake: count-after-break
        - code: |
            attempts = 0
            while True:
                code = input()
                attempts += 1
                print("Неверно")
                if code == "2718":
                    break
            print(f"Сейф открыт! Попыток: {attempts}")
          note: «Неверно» печатается до проверки — и для верного кода тоже.
          expectMistake: wrong-before-check
        - code: |
            attempts = 0
            while True:
                code = input()
                attempts += 1
                if code == "2718":
                    break
                print("Неверно")
                print(f"Сейф открыт! Попыток: {attempts}")
          note: Итоговая строка сдвинута внутрь цикла и печатается после каждой неверной попытки.
          expectMistake: final-inside
        - code: |
            attempts = 0
            while True:
                code = int(input())
                attempts += 1
                if code == 2718:
                    print(f"Сейф открыт! Попыток: {attempts}")
                else:
                    print("Неверно")
          note: "Рецензия: ввод уже в int, сравнение верное, но нет break — не str-vs-int."
          expectMistake: no-break
        - code: |
            attempts = 0
            while True:
                code = int(input())
                attempts += 1
                if code == "2718":
                    break
                print("Неверно")
            print(f"Сейф открыт! Попыток: {attempts}")
          note: "Рецензия: ввод переведён в int, а сравнение со строкой \"2718\"."
          expectMistake: int-vs-str
        - code: |
            attempts = 0
