                    opened = True
                    break
                print("Неверно")
            if opened:
                print(f"Сейф открыт! Попыток: {attempts}")
            else:
                print("Сейф заблокирован")
          note: "Рецензия: проверка счётчика стоит до проверки кода — третий код не проверяется."
          expectMistake: two-attempts
        - code: |
            for attempt in range(1, 4):
                code = input()
                if code == "2718":
                    print(f"Сейф открыт! Попыток: {attempt}")
                else:
                    print("Неверно")
            print("Сейф заблокирован")
          note: "Рецензия: for без флага и без break."
          expectMistake: no-break
        - code: |
            attempts = 0
            opened = False
            while attempts < 3:
                code = input()
                if code == "2718":
                    opened = True
                    break
                print("Неверно")
                attempts += 1
            if opened:
                print(f"Сейф открыт! Попыток: {attempts}")
            else:
                print("Сейф заблокирован")
          note: "Рецензия: ошибка из Практики 1 — счётчик после break (range нет)."
          expectMistake: count-after-check
        - code: |
            for attempt in range(1, 4):
                code = input()
                if code == 2718:
                    opened = True
                    break
                print("Неверно")
            if opened:
                print(f"Сейф открыт! Попыток: {attempt}")
            else:
                print("Сейф заблокирован")
          note: "Рецензия: строка сравнивается с числом, break уже есть."
          expectMistake: str-vs-int
        - code: |
            attempts = 0
            opened = False
            while attempts < 3 or not opened:
                code = input()
                attempts += 1
                if code == "2718":
                    opened = True
                else:
                    print("Неверно")
            if opened:
                print(f"Сейф открыт! Попыток: {attempts}")
            else:
                print("Сейф заблокирован")
          note: "Рецензия: or вместо and в строке while."
          expectMistake: or-instead-of-and
        - code: |
            code = input()
            opened = False
            for attempt in range(1, 4):
                if code == "2718":
                    opened = True
                    break
                print("Неверно")
                code = input()
            if opened:
                print(f"Сейф открыт! Попыток: {attempt}")
            else:
                print("Сейф заблокирован")
          note: "Рецензия: следующий код читается в конце шага — четвёртый input() лишний."
          expectMistake: too-many-attempts
      mistakes:
        - id: str-vs-int
          when:
            errorType: EOFError
            codeRegex: '(?<![\s\S])(?![\s\S]*\bint\s*\()[\s\S]*?(?:[!=]=\s*2718\b|\b2718\s*[!=]=)'
          why: >-
            `input()` возвращает строку, а в сравнении стоит число `2718` без кавычек. Строка
            никогда не равна числу, поэтому верный код не узнаётся: программа считает его
            неверным и просит следующий, пока ввод не кончится (EOFError).
          try: >-
            Возьми `2718` в кавычки или превращай ввод в число через `int(...)` — одно из двух,
            не оба сразу.
          verify: 'В «Примере 1» после второго кода должно появиться «Сейф открыт! Попыток: 2».'
        - id: or-instead-of-and
          when:
            errorType: EOFError
            codeRegex: '^[ \t]*while\b[^\n]*\bor\b'
          why: >-
            В строке `while` условия соединены через `or`: цикл идёт, пока верно хотя бы одно
            из них. Поэтому он не заканчивается ни после верного кода, ни после третьей попытки
            и просит коды, пока ввод не кончится (EOFError).
          try: >-
            Соедини условия через `and`: цикл должен идти, только пока верны оба — попытки ещё
            есть **и** сейф не открыт.
          verify: В «Примере 1» программа должна остановиться после второго кода.
        - id: no-break
          when:
            errorType: EOFError
            failedTest: t1
          why: >-
            Верный код введён, но цикл не закончился и попросил следующий — а ввод уже
            кончился (EOFError). Раньше времени из цикла выводит только `break`. Флаг, если он
            есть, лишь запоминает, что сейф открыт.
          try: >-
            Когда код верный, выполни `break` в том же `if`; если там есть `opened = True` —
            сразу после него.
          verify: В «Примере 1» программа должна остановиться после второго кода.
        - id: too-many-attempts
          when:
            errorType: EOFError
          why: >-
            После третьей неверной попытки программа попросила четвёртый код, а во вводе его
            нет — EOFError. Значит, цикл разрешает больше трёх попыток: он всё ещё бесконечный
            или граница стоит на единицу дальше (`range(1, 5)`, `attempts <= 3`). Бывает и так:
            `input()` стоит в конце шага и срабатывает даже после третьей неверной попытки.
          try: >-
            Проверь, сколько раз может выполниться тело. `range(1, 4)` даёт ровно 1, 2, 3; в
            `while` со счётчиком выходи, когда неверных попыток стало три. Код читай в начале
            шага.
          verify: В «Примере 2» после трёх «Неверно» должно появиться «Сейф заблокирован».
        - id: two-attempts
          when:
            failedTest: t2
            outputEquals: "Неверно\nНеверно\nСейф заблокирован"
          why: >-
            Сейф заблокирован после двух «Неверно», а должен после трёх. Либо цикл даёт только
            две попытки (`range(1, 3)`, `attempts < 2`), либо третий код прочитан, но проверка
            на блокировку стоит раньше `print("Неверно")`.
          try: >-
            Посчитай шаги цикла: должно быть ровно три. Проверку «попытки кончились» ставь после
            строки с «Неверно».
          verify: В «Примере 2» должно быть три строки «Неверно».
        - id: decide-by-counter
          when:
            failedTest: t4
            outputEquals: "Неверно\nНеверно\nСейф заблокирован"
          why: >-
            Код подошёл с третьей попытки, а программа пишет «Сейф заблокирован». Итог после
            цикла выбран по номеру попытки, но номер 3 бывает в двух случаях: сейф открыли на
            последней попытке или все три кода неверные. По номеру эти случаи не различить.
          try: >-
            Запомни во флаге, что код подошёл: `opened = False` до цикла, `opened = True` перед
            `break`. После цикла выбирай итог по флагу: `if opened:` … `else:`.
          verify: 'В «Граничном случае: на последней попытке» должно получиться «Сейф открыт! Попыток: 3».'
        - id: opened-when-locked
          when:
            failedTest: t2
            outputIncludes: "Сейф открыт! Попыток: 3"
          why: >-
            После трёх неверных кодов программа всё равно печатает «Сейф открыт!». Строка после
            цикла выполняется при любом выходе из него — и по верному коду, и когда попытки
            кончились. Сама программа не знает, чем закончился цикл.
          try: >-
            Заведи флаг: `opened = False` до цикла, `opened = True` перед `break` на верном
            коде. После цикла печатай итог через `if opened:` … `else:`.
          verify: В «Примере 2» последней строкой должно быть только «Сейф заблокирован».
        - id: blocked-when-opened
          when:
            outputIncludes: "Попыток: 2\nСейф заблокирован"
          why: >-
            Сейф открыт, но следом напечатано «Сейф заблокирован». Строка без отступа после
            цикла выполняется всегда — и после `break`, и когда попытки кончились.
          try: >-
            Запомни во флаге, что сейф открыт (`opened = True` перед `break`), и печатай
            «Сейф заблокирован» только в ветке `else` после `if opened:`.
          verify: В «Примере 1» должно быть ровно две строки.
        - id: index-from-zero
          when:
            codeRegex: '\brange\(\s*(?:0\s*,\s*)?3\s*\)'
            outputEquals: "Неверно\nСейф открыт! Попыток: 1"
          why: >-
            Номер попытки на единицу меньше: `range(3)` даёт 0, 1, 2, поэтому на второй попытке
            переменная цикла равна 1.
          try: Начни счёт с единицы — `range(1, 4)` даёт номера 1, 2, 3.
          verify: 'В «Примере 1» должно получиться «Попыток: 2».'
        - id: count-after-check
          when:
            outputEquals: "Неверно\nСейф открыт! Попыток: 1"
          why: >-
            Попыток в итоге меньше, чем было кодов: верный код не посчитан. Строка счётчика
            стоит после проверки кода, и на верном коде `break` уводит из цикла раньше, чем
            очередь до неё доходит.
          try: Увеличивай счётчик сразу после `input()`, до проверки кода.
          verify: 'В «Примере 1» должно получиться «Попыток: 2».'
      afterPass: >-
        Теперь замок честный: не больше трёх попыток, и после цикла программа точно знает, чем
        всё кончилось. Если ты решал через `for`, заметь: после `break` переменная цикла хранит
        номер попытки, так что отдельный счётчик не понадобился.
      skills: [loop-control, for-range, boundary-checks]

  - id: practice-parcels
    type: exercise
    title: Практика 3
    exercise:
      id: m3-l4-e3
      kind: write
      title: Посылки на весах
      statement: |-
        В пункте выдачи весы присылают в программу вес каждой посылки — целое число граммов,
        по одному на строке. В конце смены приходит слово `конец` (точно так, маленькими
        буквами). Иногда весы сбоят и присылают `0` или отрицательное число — такие строки
        пропусти: это не посылки.

        Выведи, сколько настоящих посылок взвесили и сколько они весят вместе. Например, для
        ввода `1200`, `0`, `350`, `-40`, `2000`, `конец`:

        ```text
        Посылок: 3
        Общий вес: 3550 г
        ```
      input: >-
        Целые числа по одному на строке, последняя строка — `конец`. Смена может быть и пустой:
        сразу `конец`.
      output: 'Две строки: `Посылок: X` и `Общий вес: Y г`.'
      constraints:
        - 0 и отрицательные числа — сбой весов, в подсчёт они не входят.
        - Итог печатается один раз, после слова `конец`.
      starterCode: |
        # Читай строки, пока не придёт «конец»
        # 0 и отрицательные числа — сбой весов, пропускай их
        # В конце выведи «Посылок: …» и «Общий вес: … г»

      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          stdin: "1200\n0\n350\n-40\n2000\nконец\n"
          expected: |-
            Посылок: 3
            Общий вес: 3550 г
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 2
          example: true
          stdin: "500\nконец\n"
          expected: |-
            Посылок: 1
            Общий вес: 500 г
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: пустая смена"
          edge: true
          stdin: "конец\n"
          expected: |-
            Посылок: 0
            Общий вес: 0 г
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: только сбои"
          edge: true
          stdin: "-5\n0\nконец\n"
          expected: |-
            Посылок: 0
            Общий вес: 0 г
        - id: t5
          kind: io
          compare: { ignoreSpaces: true }
          title: Сбой в конце смены
          stdin: "800\n450\n-3\nконец\n"
          expected: |-
            Посылок: 2
            Общий вес: 1250 г
      criteria:
        - Цикл останавливается на слове `конец`, и это слово не превращается в число.
        - 0 и отрицательные значения пропускаются, а обработка продолжается со следующей строки.
        - Число посылок и общий вес печатаются один раз, после цикла; пустая смена даёт нули.
      hints:
        - >-
          Когда пришла строка, что нужно выяснить первым — слово это `конец` или число? Подумай,
          что случится, если превратить слово `конец` в `int`. И чем должен отличаться сбой
          весов от конца смены: цикл продолжается или заканчивается?
        - |-
          Пропуск неподходящей записи на другом примере — термометр иногда сбоит и присылает
          значение, которого нет на его шкале:
          ```python
          for hour in range(1, 6):
              temp = int(input())
              if temp < -50:
                  continue  # шкала начинается с -50: меньше — это сбой
              print(f"Час {hour}: {temp}")
          ```
          Плохое показание не печатается, но цикл идёт дальше.
        - |-
          Каркас:
          ```text
          count = 0, total = 0
          while True:
              line = input()
              если line == "конец": break
              weight = int(line)
              если weight <= 0: continue
              count + 1, total + weight
          два print после цикла
          ```
      solution:
        code: |
          count = 0
          total = 0
          while True:
              line = input()
              if line == "конец":
                  break
              weight = int(line)
              if weight <= 0:
                  continue
              count += 1
              total += weight
          print(f"Посылок: {count}")
          print(f"Общий вес: {total} г")
        explanation: >-
          Строка сначала сравнивается со словом `конец` — и только потом превращается в число:
          `int("конец")` остановил бы программу с ValueError. `break` заканчивает цикл в конце
          смены, а `continue` отбрасывает сбой весов, и цикл сразу читает следующую строку. Оба
          накопителя стоят ниже `continue`, поэтому сбой не попадает ни в один из них. Создаются
          они до цикла, растут внутри, печатаются после. Без `continue` тоже можно: `if weight > 0:`
          и два накопителя внутри этого `if`.
      altSolutions:
        - code: |
            count = 0
            total = 0
            while True:
                line = input()
                if line == "конец":
                    break
                weight = int(line)
                if weight > 0:
                    count = count + 1
                    total = total + weight
            print(f"Посылок: {count}")
            print(f"Общий вес: {total} г")
          note: Без continue — накопители внутри if weight > 0.
        - code: |
            count = 0
            total = 0
            line = input()
            while line != "конец":
                weight = int(line)
                if weight > 0:
                    count += 1
                    total += weight
                line = input()
            print(f"Посылок: {count}")
            print(f"Общий вес: {total} г")
          note: Без break — стоп-слово в строке while, следующая строка читается в конце тела.
        - code: |
            count = 0
            total = 0
            while True:
                line = input("Вес: ")
                if line == "конец":
                    print(f"Посылок: {count}")
                    print(f"Общий вес: {total} г")
                    break
                weight = int(line)
                if weight <= 0:
                    continue
                count += 1
                total += weight
          note: Итог печатается в ветке «конец» прямо перед break.
        - code: |
            count = 0
            total = 0
            while True:
                weight = input()
                if weight == "конец":
                    break
                if int(weight) <= 0:
                    continue
                count += 1
                total += int(weight)
            print(f"Посылок: {count}")
            print(f"Общий вес: {total} г")
          note: "Рецензия: строка хранится как есть, int() вызывается в каждом месте отдельно."
        - code: |
            посылки = 0
            вес = 0
            while True:
                строка = input("Вес: ")
                if строка == "конец":
                    break
                if int(строка) < 1:
                    continue
                посылки = посылки + 1
                вес = вес + int(строка)
            print("Посылок: " + str(посылки))
            print("Общий вес: " + str(вес) + " г")
          note: "Рецензия: русские имена, < 1 вместо <= 0, склейка через str()."
