            while True:
                line = input()
                if line == "конец":
                    break
                if int(line) <= 0:
                    continue
                count += 1
                total += line
            print(f"Посылок: {count}")
            print(f"Общий вес: {total} г")
          note: "Рецензия: к весу прибавляется строка, а не число — TypeError."
          expectMistake: str-not-number
        - code: |
            count = 0
            total = 0
            while True:
                line = input()
                if line == "конец":
                    continue
                weight = int(line)
                if weight <= 0:
                    continue
                count += 1
                total += weight
            print(f"Посылок: {count}")
            print(f"Общий вес: {total} г")
          note: "Рецензия: continue вместо break на слове «конец»."
          expectMistake: no-break
        - code: |
            count = 0
            total = 0
            while True:
                line = input()
                if line == "конец":
                    print(f"Посылок: {count}")
                    print(f"Общий вес: {total} г")
                    break
