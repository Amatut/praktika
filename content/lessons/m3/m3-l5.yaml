          note: Правая граница как у range — может выпасть 7.
          expectMistake: bounds
        - code: |
            import random

            n = int(input())
            doubles = 0
            for i in range(1, n + 1):
                a = random.randint(1, 6)
                b = random.randint(1, 6)
                print(f"Бросок {i}: {a} и {b}")
                if a == b:
                    print("Дубль!")
                doubles += 1
            print(f"Дублей: {doubles}")
          note: doubles += 1 без отступа под if — считаются все броски; общий разбор точный.
          expectMistake: null
      mistakes:
        - id: no-prefix
          when:
            errorIncludes: "name 'randint' is not defined"
          why: >-
            `import random` подключил модуль под именем `random`, а функция `randint` лежит внутри
            него. Без приставки Python ищет `randint` среди обычных имён и не находит.
          try: "Пиши полный адрес: `random.randint(1, 6)`."
          verify: "Ошибка NameError должна исчезнуть, а в «Примере 1» первая строка станет «Бросок 1: 2 и 5»."
        - id: one-die
          when:
            outputIncludes: "Бросок 1: 2\n"
          where: Строка броска
          why: >-
            В строке броска одно число, а кубиков теперь два: второй кубик не бросается или не
            печатается. На каждый бросок нужны два вызова `randint` — сначала для `a`, потом для
            `b`.
          try: >-
            Вместо одного `value` брось два кубика: `a = random.randint(1, 6)` и
            `b = random.randint(1, 6)` — и выведи оба в строке броска.
          verify: "В «Примере 1» первая строка должна стать «Бросок 1: 2 и 5»."
        - id: extra-call
          when:
            codeRegex: '^[^#\n]*randint\s*\([\s\S]*^[^#\n]*randint\s*\([\s\S]*^[^#\n]*randint\s*\('
          why: >-
            В программе больше двух вызовов `randint`, а кубиков два. Лишний вызов забирает
            «случайное» число, и все следующие сдвигаются: в тесте выпадает не то, что в образце.
            Чаще всего это строка `value = random.randint(1, 6)` из прошлой программы. Бросать
            ещё раз после дубля тоже не нужно — программа только печатает «Дубль!».
          try: Оставь ровно два вызова на бросок — для `a` и для `b` — и удали остальные.
          verify: "В «Примере 1» первая строка должна стать «Бросок 1: 2 и 5»."
        - id: same-die
          when:
            outputIncludes: "Бросок 1: 2 и 2"
          why: >-
            В каждом броске два одинаковых числа, и каждый бросок — дубль. Значит, второй кубик не
            бросается: `b` берёт то же значение, что `a`, или одна переменная печатается дважды.
          try: "Второй кубик — отдельный вызов: `b = random.randint(1, 6)`, а в строке броска печатай `{a}` и `{b}`."
          verify: "В «Примере 1» первая строка должна стать «Бросок 1: 2 и 5»."
        - id: order
          when:
            outputIncludes: "Бросок 1: 5 и 2"
          why: >-
            Числа в строке броска поменялись местами: первым вызовом `randint` получается второй
            кубик. Зерно в тесте одно на все вызовы, поэтому их порядок решает, какое число
            куда попадёт.
          try: >-
            Сначала `a = random.randint(1, 6)`, потом `b = random.randint(1, 6)` — и печатай их в
            том же порядке, `a` первым.
          verify: "В «Примере 1» первая строка должна стать «Бросок 1: 2 и 5»."
        - id: sum-left
          when:
            outputIncludes: "Сумма:"
          why: >-
            В выводе осталась строка «Сумма: …» из прошлой программы. В новом условии итог
            другой — число дублей, а сумму печатать не нужно.
          try: Удали строку с выводом суммы. Накопитель `total` тоже можно убрать — он больше не нужен.
          verify: "В «Примере 1» последней строкой должно быть «Дублей: 1»."
        - id: total-inside
          when:
            outputIncludes: "Дублей: 0\nБросок"
          why: >-
            Строка «Дублей: …» печатается на каждом шаге: у этого `print` отступ, и он попал в
            тело цикла.
          try: Сдвинь `print` с итогом влево, на уровень `for`, — тогда итог напечатается один раз, после цикла.
          verify: "В «Примере 1» строка «Дублей: 1» должна быть одна и последняя."
        - id: count-not-updated
          when:
            outputIncludes: "Дубль!\nДублей: 0"
          why: >-
            «Дубль!» напечатан, а в итоге «Дублей: 0» — счётчик так и не вырос. Скорее всего,
            строки, которая прибавляет 1, нет, или написано `doubles + 1` без присваивания:
            значение посчитано, но никуда не сохранено.
          try: "Рядом с «Дубль!», внутри `if`, прибавь 1 и сохрани: `doubles += 1`."
          verify: "В «Примере 1» должно получиться «Дублей: 1»."
        - id: total-inside-if
          when:
            outputIncludes: "Дубль!\nДублей: 1\nБросок"
          why: >-
            Строка «Дублей: …» печатается сразу после каждого дубля: этот `print` стоит внутри
            `if`. Итог нужен один раз — после всех бросков, даже если дублей не было.
          try: Сдвинь `print` с итогом влево, на уровень `for`, — тогда он выполнится один раз, после цикла.
          verify: "В «Примере 2» строка «Дублей: 2» должна быть одна и последняя."
        - id: count-reset
          when:
            failedTest: t2
            outputIncludes: "2 и 2\nДубль!\nДублей: 1"
          why: >-
            Дублей было два, а итог — 1: счётчик не накапливает. Либо `doubles = 0` стоит внутри
            цикла и обнуляет его на каждом броске, либо вместо `doubles += 1` написано
            `doubles = 1`.
          try: Оставь `doubles = 0` только до цикла, без отступа, а внутри `if` пиши `doubles += 1`.
          verify: "В «Примере 2» должно получиться «Дублей: 2»."
        - id: double-always
          when:
            outputIncludes: "Бросок 1: 2 и 5\nДубль!"
          why: >-
            «Дубль!» напечатан после броска «2 и 5», хотя числа разные: этот `print` срабатывает
            не только при дубле. Скорее всего, у него нет отступа под `if a == b:`, и он
            выполняется на каждом шаге цикла.
          try: Сдвинь `print("Дубль!")` вправо, внутрь `if a == b:` — на один уровень с `doubles += 1`.
          verify: "В «Примере 1» «Дубль!» должен быть только один раз — после «Бросок 4: 4 и 4»."
        - id: double-before
          when:
            outputIncludes: "Дубль!\nБросок 4: 4 и 4\nДублей: 1"
          why: >-
            «Дубль!» напечатан раньше строки своего броска: проверка `if a == b` стоит выше, чем
            `print` со строкой броска.
          try: Сначала выведи строку броска, а под ней поставь проверку на дубль.
          verify: "В «Примере 1» «Дубль!» должен идти сразу после «Бросок 4: 4 и 4»."
        - id: bounds
          when:
            codeRegex: '^[^#\n]*randint\((?!\s*1\s*,\s*6\s*\))\s*-?\d+\s*(?:,\s*-?\d+\s*)?\)'
          where: Строка с `random.randint`
          why: >-
            Границы у `randint` не те. У `randint(a, b)` входят обе границы: `a` — самое маленькое
            число, которое может выпасть, `b` — самое большое. На кубике числа от 1 до 6:
            `randint(1, 5)` никогда не выдаст шестёрку, а `randint(1, 7)` иногда выдаст 7.
          try: "Для каждого кубика пиши `random.randint(1, 6)`."
          verify: Все тесты должны стать зелёными, в том числе «дубль шестёрок на первом броске».
      afterPass: >-
        Два кубика, условие и счётчик работают вместе: каждый бросок проверяется сразу, а итог
        печатается один раз. Если хочешь усложнить: посчитай отдельно дубли шестёрок — когда оба
        кубика показали 6.
      skills: [import-basics, conditions, accumulators]

  - id: practice-guess
    type: exercise
    title: Практика 3
    exercise:
      id: m3-l5-e3
      kind: write
      title: Угадай число
      statement: |-
        Вторая игра семейного вечера. Программа загадывает целое число от 1 до 100 — один вызов
        `random.randint(1, 100)` за всю игру. Потом читает догадки, по одной в строке:

        - если загаданное число **больше** догадки, выведи `Больше`;
        - если загаданное число **меньше** догадки, выведи `Меньше`;
        - если угадали — выведи `Угадал! Попыток: k`, где k — сколько всего было догадок,
          включая верную, и игра заканчивается.

        Попыток сколько угодно: игра идёт, пока число не угадают.

        Пример: загадано 80, догадки 50, 75, 90 и 80.

        ```text
        Больше
        Больше
        Меньше
        Угадал! Попыток: 4
        ```

        Зерно в тестах не видно, поэтому загаданное число написано в названии каждого теста.
        «Запустить» загадывает то же, что в «Примере 1», — 80. Если в поле ввода нет догадки 80,
        программа попросит ещё строку и покажет EOFError, хотя сам код может быть верным.
      input: Догадки — целые числа от 1 до 100, по одной в строке. В тестах последняя догадка всегда верная.
      output: "После каждой неверной догадки — `Больше` или `Меньше`, после верной — `Угадал! Попыток: k`."
      constraints:
        - Ровно один вызов `random.randint(1, 100)` за игру.
        - Не вызывай `random.seed`.
      seed: 5
      starterCode: |
        # Угадай число: загадай число от 1 до 100
        # и принимай догадки, пока игрок не угадает

      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 1: загадано 80"
          example: true
          seed: 5
          stdin: "50\n75\n90\n80\n"
          expected: |-
            Больше
            Больше
            Меньше
            Угадал! Попыток: 4
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 2: загадано 42"
          example: true
          seed: 7
          stdin: "50\n25\n42\n"
          expected: |-
            Меньше
            Больше
            Угадал! Попыток: 3
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: загадано 100"
          edge: true
          seed: 23
          stdin: "50\n99\n100\n"
          expected: |-
            Больше
            Больше
            Угадал! Попыток: 3
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: загадано 1, угадали с первой попытки"
          edge: true
          seed: 364
          stdin: "1\n"
          expected: "Угадал! Попыток: 1"
        - id: t5
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: загадано 42, догадки рядом"
          edge: true
          seed: 7
          stdin: "41\n43\n42\n"
          expected: |-
            Больше
            Меньше
            Угадал! Попыток: 3
        - id: t6
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: долгая игра, загадано 80"
          edge: true
          seed: 5
          stdin: "10\n20\n30\n40\n50\n60\n70\n90\n85\n82\n81\n80\n"
          expected: |-
            Больше
            Больше
            Больше
            Больше
            Больше
            Больше
            Больше
            Меньше
            Меньше
            Меньше
            Меньше
            Угадал! Попыток: 12
      criteria:
        - Число загадывается один раз за игру, от 1 до 100 включительно.
        - После каждой неверной догадки — верная подсказка, «Больше» или «Меньше».
        - Игра идёт до верной догадки, сколько бы попыток ни понадобилось, и лишних строк ввода не просит.
        - В «Попыток» учтены все догадки, включая верную.
      hints:
        - >-
          Раздели игру на части: что происходит один раз за игру, а что — для каждой догадки? И в
          какой момент цикл должен закончиться?
        - |-
          Похожий цикл был в уроке про break — кодовый замок сейфа:
          ```python
          attempts = 0
          while True:
              code = input()
              attempts = attempts + 1
              if code == "2718":
                  break
              print("Неверно")
          ```
          Здесь вместо «Неверно» нужна подсказка, а сравнивать придётся числа.
        - |-
          Каркас:
          ```text
          import random
          secret = random.randint(1, 100)    # один раз, до цикла
          attempts = 0
          while True:
              guess = int(input())
              attempts = attempts + 1
              if guess == secret:
                  break
              если guess < secret — вывести «Больше», иначе «Меньше»
          вывести «Угадал! Попыток: …»
          ```
      solution:
        code: |
          import random

          secret = random.randint(1, 100)
          attempts = 0
          while True:
              guess = int(input())
              attempts += 1
              if guess == secret:
                  break
              if guess < secret:
                  print("Больше")
              else:
                  print("Меньше")
          print(f"Угадал! Попыток: {attempts}")
        explanation: >-
          Число загадывается один раз, до цикла, — иначе на каждой догадке оно было бы новым.
          `while True` повторяет «прочитать — посчитать — сравнить», пока догадка не совпадёт;
          тогда `break` выводит из цикла, и после него печатается итог. Счётчик растёт сразу после
          чтения, поэтому учитывает и верную догадку. Если догадка меньше загаданного, игроку
          нужно называть больше — отсюда «Больше».
