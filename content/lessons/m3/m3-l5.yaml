id: m3-l5
module: m3
number: "3.5"
title: "Случайные числа: первый import"
objective: >-
  Подключать стандартный модуль через import и получать случайные целые числа
  random.randint(a, b), помня, что обе границы входят, — и встраивать их в циклы и условия.
minutes: [20, 30]
prerequisites: [m3-l4]
skills: [import-basics]
environment: python

story:
  title: Кубики пропали
  fictional: true
  text: >-
    В субботу семья Полины собралась играть в настольную игру, а кубики, как оказалось,
    потерялись при переезде. Полина как раз учит Python и за пять минут написала программу-кубик:
    одна строка подключает модуль random, другая выдаёт число от 1 до 6. Вечер спасён, а младший
    брат тут же попросил ещё одну игру — компьютер загадывает число, а все по очереди угадывают.
    Писать «случайность» самой Полине не пришлось: в Python она уже есть.

why: >-
  Играм, розыгрышам и тренажёрам нужны случайные числа, а формулу для них придумывать не
  придётся. Например, бросок кубика — это одна строка `random.randint(1, 6)` после `import random`.

usedIn: >-
  Игры (кубики, выпадение предметов, расстановка противников), викторины и тренажёры со
  случайными вопросами, жеребьёвка команд, генерация тестовых данных, модели очередей и датчиков.
  А сам приём `import` нужен постоянно: даты, пути к файлам, CSV и JSON, сеть и базы данных в
  Python тоже подключаются как модули.

steps:
  - id: modules
    type: theory
    title: Модули и random
    body: |-
      Python умеет гораздо больше, чем `print` и `input`. Готовые инструменты лежат в
      **модулях**. **Модуль** — файл с функциями на одну тему: `random` — случайные числа,
      `math` — математика. Модули, которые ставятся вместе с Python, называют
      **стандартной библиотекой**: скачивать их не нужно.

      Модуль подключают командой `import` — обычно в первой строке программы:

      ```python
      import random

      value = random.randint(1, 6)
      print(value)
      ```

      `random.randint(1, 6)` читается так: из модуля `random` взять функцию `randint` и вызвать
      её. Точка между ними обязательна. Функция возвращает случайное целое число **от 1 до 6
      включительно**: в отличие от `range`, правая граница тоже входит.

      Так вызывают функции любого модуля: `import math`, потом `math.sqrt(16)` — квадратный
      корень, 4.0. Есть и короткая форма `from random import randint`, после неё пишут просто
      `randint(1, 6)`; в курсе используем `import random`.

      Три правила:

      - **Каждый вызов — новый бросок:** число выпадает заново и может совпасть с прошлым. Если
        число нужно дважды (напечатать и прибавить к сумме), сохрани его в переменную и дальше
        бери из неё.
      - **Сначала `import`, потом имя модуля и точка.** Без `import` Python не знает модуль:
        `NameError: name 'random' is not defined`, а в конце сообщения даже подсказывает:
        *Did you forget to import 'random'?*
      - **Не называй свой файл `random.py`** на компьютере: Python подключит его вместо
        настоящего модуля.

      **Случайность и проверка.** Числа `random` вычисляются по формуле из стартового числа —
      **зерна** (по-английски seed). На компьютере Python при каждом запуске берёт новое зерно,
      поэтому и числа каждый раз новые. В тренажёре каждый тест задаёт своё зерно: «случайные»
      числа в нём всегда одни и те же, и вывод можно сравнить с образцом. «Запустить» в задании
      берёт зерно первого примера. Поэтому в заданиях вызывай `randint` столько раз и в том
      порядке, как сказано в условии (лишний вызов сдвинет все следующие числа), и не вызывай
      `random.seed` сам.
    simpler: >-
      `import random` — достать из коробки с инструментами кубик. `random.randint(1, 6)` —
      бросить его: выпадет любое число от 1 до 6, и 6 тоже. Каждый бросок — заново, число может
      и повториться, поэтому результат броска сразу кладут в переменную.
    coach: >-
      Если твои числа не совпали с примером, проверь две вещи: границы в `randint` и сколько раз
      ты его вызываешь.

  - id: dice
    type: example
    title: Программа-кубик
    body: >-
      Программа Полины из истории. Во вводе задано число бросков — 3. Здесь зерна нет, как на
      компьютере, поэтому числа при каждом запуске новые.
    code: |-
      import random

      rolls = int(input())
      for i in range(1, rolls + 1):
          value = random.randint(1, 6)
          print(f"Бросок {i}: {value}")
    stdin: "3\n"
    notes:
      - line: 1
        text: Подключаем модуль random — один раз на всю программу, в самом начале.
      - line: 3
        text: Сколько раз бросить кубик.
      - line: 5
        text: >-
          На каждом шаге цикла — новый бросок. Число сразу сохраняется в `value`, чтобы дальше
          работать именно с ним.
      - line: 6
        text: Печатаем сохранённое значение и номер броска.
    tryIt: >-
      Нажми «Запустить» несколько раз — числа меняются. Поменяй 6 на 20 — получится двадцатигранный
      кубик для настольных ролевых игр. А потом удали первую строку и запусти: какую ошибку
      покажет Python?
    coach: >-
      Строку `import random` пишут один раз, наверху. Внутри цикла — только вызовы
      `random.randint`.

  - id: no-prefix
    type: predict
    title: Забыли приставку
    prompt: >-
      Программа подключила модуль random и хочет случайное число от 1 до 10. Как думаешь, что
      произойдёт при запуске?
    code: |-
      import random

      number = randint(1, 10)
      print(number)
    options:
      - Выведется случайное число от 1 до 10
      - Выведется случайное число от 1 до 9
      - "Ошибка NameError: Python не знает имя randint"
    answer: "Ошибка NameError: Python не знает имя randint"
    answerIsNotOutput: true
    explanation: >-
      `import random` подключил модуль под именем `random` — и только его. Функция `randint`
      лежит внутри модуля, и Python найдёт её лишь по полному адресу `random.randint(1, 10)`.
      Сообщение будет таким: `NameError: name 'randint' is not defined`. Просто `randint` работает
      только после формы `from random import randint`. А если бы приставка была, могло бы выпасть
      и 10: у randint обе границы входят.
    coach: >-
      Если после import Python не знает имя функции из модуля, первым делом проверь приставку —
      имя модуля и точку.

  - id: bounds
    type: quiz
    title: Где граница?
    question: >-
      Для настольной игры нужен двенадцатигранный кубик — числа от 1 до 12. Какой вызов
      подходит?
    options:
      - "`random.randint(1, 13)`"
      - "`random.randint(1, 12)`"
      - "`random.randint(0, 12)`"
    correct: 1
    explanation: >-
      У randint входят обе границы, поэтому справа пишут самое большое число, которое должно
      выпасть, — 12. `randint(1, 13)` иногда выдаст 13: так получается, если писать границу по
      привычке к `range(1, 13)`, у которого правая граница не входит. А `randint(0, 12)` может
      выдать 0. randint и range легко перепутать, поэтому при каждом randint спрашивай себя:
      какое самое маленькое и самое большое число должно выпасть?

  - id: practice-dice
    type: exercise
    title: Практика 1
    exercise:
      id: m3-l5-e1
      kind: repeat
      title: Кубик n раз
      statement: |-
        За один ход в игре Полины кубик бросают несколько раз, а очки складывают. Программа
        читает n — сколько раз бросить кубик. Каждый бросок — один вызов `random.randint(1, 6)`.
        Для каждого броска выведи строку `Бросок k: v` (k — номер броска, начиная с 1, v —
        выпавшее число), а в конце — сумму всех бросков.

        Пример для n = 3. В тесте задано зерно, поэтому выпадают 2, 5 и 1:

        ```text
        Бросок 1: 2
        Бросок 2: 5
        Бросок 3: 1
        Сумма: 8
        ```

        Кнопка «Запустить» берёт ввод и зерно первого примера, поэтому при верном решении её
        вывод совпадёт с примером выше. Если поменяешь ввод, зерно останется прежним, и числа
        будут другие — например, с вводом 5 не те, что в «Примере 2».
      input: Одна строка — целое число n от 0 до 20.
      output: "n строк `Бросок k: v`, затем строка `Сумма: S`."
      constraints:
        - Один вызов `random.randint(1, 6)` на бросок, по порядку — тогда «случайные» числа совпадут с проверкой.
        - "Не вызывай `random.seed`: зерно задаёт тренажёр."
      seed: 1
      starterCode: |
        # Подключи модуль random

        n = int(input())
        total = 0
        # Брось кубик n раз: выведи каждый бросок и прибавь его к total

        print(f"Сумма: {total}")
      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 1
          example: true
          seed: 1
          stdin: "3\n"
          expected: |-
            Бросок 1: 2
            Бросок 2: 5
            Бросок 3: 1
            Сумма: 8
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: Пример 2
          example: true
          seed: 7
          stdin: "5\n"
          expected: |-
            Бросок 1: 3
            Бросок 2: 2
            Бросок 3: 4
            Бросок 4: 6
            Бросок 5: 1
            Сумма: 16
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: один бросок"
          edge: true
          seed: 42
          stdin: "1\n"
          expected: |-
            Бросок 1: 6
            Сумма: 6
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: ноль бросков"
          edge: true
          seed: 3
          stdin: "0\n"
          expected: "Сумма: 0"
      criteria:
        - Модуль random подключён, бросок — `random.randint(1, 6)`, так что могут выпасть и 1, и 6.
        - Броски нумеруются с 1, у каждого своя строка.
        - В сумму попадают ровно те числа, что напечатаны.
        - "При n = 0 программа печатает только «Сумма: 0»."
      hints:
        - >-
          Чего не хватает программе, чтобы Python узнал имя `random`? И где в примере
          «Программа-кубик» стоит строка, которая бросает кубик: внутри цикла или до него?
        - >-
          На другом примере — монетка: `coin = random.randint(0, 1)` даёт 0 или 1. Если
          результат нужен дважды — напечатать и сложить, — сначала сохрани его в переменную, а
          потом используй переменную в обоих местах.
        - |-
          Каркас:
          ```text
          подключить random
          n = int(input())
          total = 0
          for i in range(1, n + 1):
              value = один бросок кубика
              вывести «Бросок i: value»
              прибавить value к total
          print(f"Сумма: {total}")
          ```
      solution:
        code: |
          import random

          n = int(input())
          total = 0
          for i in range(1, n + 1):
              value = random.randint(1, 6)
              print(f"Бросок {i}: {value}")
              total += value
          print(f"Сумма: {total}")
        explanation: >-
          `import random` в первой строке подключает модуль. В цикле каждый шаг — один бросок:
          `random.randint(1, 6)` возвращает число, и оно сразу попадает в `value`. Из этой
          переменной число и печатается, и прибавляется к сумме — поэтому в сумме ровно те
          числа, что на экране. При n = 0 цикл не выполнится ни разу, и останется «Сумма: 0».
      altSolutions:
        - code: |
            from random import randint

            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = randint(1, 6)
                print(f"Бросок {i}: {value}")
                total = total + value
            print(f"Сумма: {total}")
          note: Форма from random import randint — вызов без приставки.
        - code: |
            import random

            n = int(input())
            total = 0
            i = 1
            while i <= n:
                value = random.randint(1, 6)
                print(f"Бросок {i}: {value}")
                total += value
                i += 1
            print(f"Сумма: {total}")
          note: Цикл while со счётчиком бросков.
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(n):
                value = random.randint(1, 6)
                total = total + value
                print("Бросок", str(i + 1) + ":", value)
            print("Сумма:", total)
          note: range(n) и номер i + 1, вывод через запятые.
        - code: |
            import random

            SIDES = 6
            n = int(input("Сколько бросков? "))
            total = 0
            for i in range(1, n + 1):
                value = random.randint(1, SIDES)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: >-
            Граница в переменной SIDES и подсказка в input(), как советует шаг «на компьютере», —
            разбор bounds не должен срабатывать.
      wrongSolutions:
        - code: |
            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = random.randint(1, 6)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: Нет import random.
          expectMistake: no-import
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = randint(1, 6)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: randint без приставки random.
          expectMistake: no-prefix
        - code: |
            import random

            random.seed(1)
            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = random.randint(1, 6)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: Своё зерно — пример 1 совпадает, остальные тесты нет.
          expectMistake: own-seed
        - code: |
            import random

            value = random.randint(1, 6)
            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = random.randint(1, 6)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: Над циклом остался бросок из теории — в цикле вызов один, но все числа сдвинуты.
          expectMistake: extra-roll
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(1, n + 1):
                print(f"Бросок {i}: {random.randint(1, 6)}")
                total += random.randint(1, 6)
            print(f"Сумма: {total}")
          note: Два вызова на бросок — напечатано одно число, в сумму попало другое.
          expectMistake: two-calls
        - code: |
            import random

            n = int(input())
            total = 0
            value = random.randint(1, 6)
            for i in range(1, n + 1):
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: Кубик брошен один раз до цикла — все броски одинаковые.
          expectMistake: roll-once
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = random.randint(1, 7)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: Правая граница как у range — может выпасть 7.
          expectMistake: bounds
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = random.randint(0, 6)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: Левая граница 0 — «как у range, с нуля».
          expectMistake: bounds
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = random.randint(6)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: Одна граница, как у range(6) — TypeError, но разбор про границы точнее общего.
          expectMistake: bounds
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(1, n):
                value = random.randint(1, 6)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: range(1, n) — бросков на один меньше.
          expectMistake: one-short
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = random.randint(1, 6)
                print(f"Бросок {i}: {value}")
                total += value
                print(f"Сумма: {total}")
          note: Сумма печатается внутри цикла, после каждого броска.
          expectMistake: sum-inside
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(n):
                value = random.randint(1, 6)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: range(n) и номер i — первый бросок «Бросок 0».
          expectMistake: zero-based
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(n + 1):
                value = random.randint(1, 6)
                print(f"Бросок {i}: {value}")
                total += value
            print(f"Сумма: {total}")
          note: range(n + 1) по общему совету про границу — нумерация всё ещё с 0 и лишний бросок.
          expectMistake: zero-based
        - code: |
            import random

            SIDES = 6
            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = random.randint(1, SIDES)
                print(f"Бросок {i} - {value}")
                total += value
            print(f"Сумма: {total}")
          note: Граница верная, но в переменной; ошибка в формате строки — разбор bounds срабатывать не должен.
          expectMistake: null
        - code: |
            import random

            n = int(input())
            total = 0
            for i in range(1, n + 1):
                value = random.randint(1, 6)
                print(f"Бросок {i}: {value}")
                total = value
            print(f"Сумма: {total}")
          note: total = value — сумма не накапливается; общий разбор «посчитай вручную» точный.
          expectMistake: null
      mistakes:
        - id: no-import
          when:
            errorIncludes: "name 'random' is not defined"
          why: >-
            Python не знает имя `random`: модуль не подключён. Готовые модули не загружаются
            сами — каждый нужно подключить командой `import`.
          try: Добавь в первую строку программы `import random`.
          verify: Ошибка NameError должна исчезнуть, а в «Примере 1» выпадут 2, 5 и 1.
        - id: no-prefix
          when:
            errorIncludes: "name 'randint' is not defined"
          why: >-
            `import random` подключил модуль под именем `random`, а функция `randint` лежит внутри
            него. Без приставки Python ищет `randint` среди обычных имён и не находит.
          try: "Пиши полный адрес: `random.randint(1, 6)`."
          verify: Ошибка NameError должна исчезнуть, а в «Примере 1» выпадут 2, 5 и 1.
        - id: own-seed
          when:
            codeRegex: '^[^#\n]*\bseed\s*\('
          where: Строка с `random.seed`
          why: >-
            Зерно уже задаёт тренажёр — в каждом тесте своё. Твой `random.seed(...)` заменяет
            его, и в тестах выпадают не те числа, что в образце.
          try: >-
            Удали строку с `random.seed`. На компьютере она тоже не нужна: без неё числа каждый
            раз новые — так и должно быть в игре.
          verify: Нажми «Проверить» — «Пример 2» должен стать зелёным.
        - id: extra-roll
          when:
            codeRegex: '^[^ \t#\n][^#\n]*randint\s*\([\s\S]*^[ \t]+[^#\n]*randint\s*\('
          where: Строка с `random.randint` до цикла
          why: >-
            Кубик бросается и до цикла, и внутри него. Бросок до цикла забирает первое
            «случайное» число, и все броски в цикле сдвигаются: в тесте выпадает не то, что в
            образце.
          try: Удали вызов `randint` до цикла — бросок нужен только внутри цикла.
          verify: В «Примере 1» должны выпасть 2, 5 и 1.
        - id: two-calls
          when:
            codeRegex: '^[^#\n]*randint\s*\((?:[^#\n]*|[\s\S]*\n[^#\n]*)randint\s*\('
          why: >-
            `randint` вызывается дважды за бросок, а каждый вызов выдаёт своё число. Напечатано
            одно, а в сумму попало другое, поэтому сумма не сходится с бросками на экране.
          try: >-
            Брось кубик один раз, сохрани результат в переменную `value` и дальше бери число
            только из неё — и в `print`, и в сумме.
          verify: В «Примере 1» сумма должна быть 2 + 5 + 1 = 8.
        - id: roll-once
          when:
            codeRegex: '^[^ \t#\n][^#\n]*randint\s*\('
          where: Строка с `random.randint` до цикла
          why: >-
            Кубик бросается один раз — до цикла, — и все броски показывают одно и то же число.
            Переменная хранит уже выпавшее число, а не «бросок»: новое число появляется только
            при новом вызове `randint`.
          try: Перенеси строку с `random.randint(1, 6)` внутрь цикла — с отступом, первой строкой тела.
          verify: В «Примере 1» должны выпасть 2, 5 и 1.
        - id: bounds
          when:
            codeRegex: '^[^#\n]*randint\((?!\s*1\s*,\s*6\s*\))\s*-?\d+\s*(?:,\s*-?\d+\s*)?\)'
          where: Строка с `random.randint`
          why: >-
            Границы у `randint` не те. У `randint(a, b)` две границы, и обе входят, в отличие от
            `range`: `a` — самое маленькое число, которое может выпасть, `b` — самое большое.
            Например, `randint(1, 7)` может выдать 7, а на кубике семёрки нет.
          try: "Пиши те границы, которые должны выпадать: `random.randint(1, 6)`."
          verify: В «Примере 1» должны выпасть 2, 5 и 1, а в тесте «один бросок» — 6.
        - id: one-short
          when:
            outputEquals: "Бросок 1: 2\nБросок 2: 5\nСумма: 7"
          why: >-
            Бросков на один меньше, чем n: в «Примере 1» нужно три, а напечатано два. Правая
            граница `range(a, b)` не входит, поэтому `range(1, n)` даёт номера только до n − 1.
          try: Чтобы номера шли от 1 до n включительно, пиши `range(1, n + 1)`.
          verify: "В «Примере 1» должно быть три броска и «Сумма: 8»."
        - id: sum-inside
          when:
            outputIncludes: "Бросок 1: 2\nСумма: 2\nБросок 2"
          why: >-
            Строка «Сумма: …» печатается после каждого броска: у этого `print` отступ, и он попал
            в тело цикла.
          try: Сдвинь `print` с суммой влево, на уровень `for`, — тогда сумма напечатается один раз, после цикла.
          verify: "В «Примере 1» строка «Сумма: 8» должна быть одна и последняя."
        - id: zero-based
          when:
            outputIncludes: "Бросок 0:"
          why: >-
            Броски нумеруются с 1, а у тебя первый — «Бросок 0». `range(n)` начинает счёт с 0,
            поэтому номер нужно сдвинуть на единицу. Если просто увеличить правую границу,
            нумерация всё равно начнётся с 0, а бросков станет на один больше.
          try: "Пиши `range(1, n + 1)` — или оставь `range(n)` и печатай `i + 1`."
          verify: "В «Примере 1» первая строка должна стать «Бросок 1: 2», а бросков — ровно три."
      afterPass: >-
        Кубик бросается нужное число раз, и сумма сходится с экраном: каждое число сначала
        попадает в переменную. Улучшение на будущее: выведи ещё и лучший бросок хода — это
        максимум, как в уроке про накопители.
      skills: [import-basics, for-range, accumulators]

  - id: practice-doubles
    type: exercise
    title: Практика 2
    exercise:
      id: m3-l5-e2
      kind: modify
      title: Два кубика и дубль
      statement: |-
        Полина решила играть двумя кубиками. Если выпал **дубль** — два одинаковых числа, — игрок
        ходит ещё раз, а программа только отмечает это строкой `Дубль!`. Измени программу из
        прошлого задания:

        - каждый бросок — два кубика: сначала первый `a`, потом второй `b` (два вызова
          `random.randint(1, 6)` именно в этом порядке);
        - строка броска: `Бросок k: a и b`;
        - если выпал дубль, следующей строкой выведи `Дубль!`;
        - в конце вместо суммы выведи `Дублей: d` — сколько раз выпал дубль.

        Пример для n = 4. В тесте задано зерно, поэтому выпадают 2 и 5, 1 и 3, 1 и 4, 4 и 4:

        ```text
        Бросок 1: 2 и 5
        Бросок 2: 1 и 3
        Бросок 3: 1 и 4
        Бросок 4: 4 и 4
        Дубль!
        Дублей: 1
        ```
      input: Одна строка — целое число n от 0 до 20, сколько бросков.
      output: "Для каждого броска строка `Бросок k: a и b`, после дубля — строка `Дубль!`; в конце `Дублей: d`."
      constraints:
        - "На каждый бросок два вызова `random.randint(1, 6)`: сначала первый кубик, потом второй."
        - Сумму бросков больше не печатай.
      seed: 1
      starterCode: |
        import random

        n = int(input())
        total = 0
        for i in range(1, n + 1):
            value = random.randint(1, 6)
            print(f"Бросок {i}: {value}")
            total += value
        print(f"Сумма: {total}")
      tests:
        - id: t1
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 1: дубль на последнем броске"
          example: true
          seed: 1
          stdin: "4\n"
          expected: |-
            Бросок 1: 2 и 5
            Бросок 2: 1 и 3
            Бросок 3: 1 и 4
            Бросок 4: 4 и 4
            Дубль!
            Дублей: 1
        - id: t2
          kind: io
          compare: { ignoreSpaces: true }
          title: "Пример 2: два дубля подряд"
          example: true
          seed: 9
          stdin: "3\n"
          expected: |-
            Бросок 1: 4 и 5
            Бросок 2: 3 и 3
            Дубль!
            Бросок 3: 2 и 2
            Дубль!
            Дублей: 2
        - id: t3
          kind: io
          compare: { ignoreSpaces: true }
          title: Без дублей
          seed: 3
          stdin: "3\n"
          expected: |-
            Бросок 1: 2 и 5
            Бросок 2: 5 и 2
            Бросок 3: 3 и 5
            Дублей: 0
        - id: t4
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: ноль бросков"
          edge: true
          seed: 5
          stdin: "0\n"
          expected: "Дублей: 0"
        - id: t5
          kind: io
          compare: { ignoreSpaces: true }
          title: "Граничный случай: дубль шестёрок на первом броске"
          edge: true
          seed: 20
          stdin: "2\n"
          expected: |-
            Бросок 1: 6 и 6
            Дубль!
            Бросок 2: 2 и 3
            Дублей: 1
      criteria:
        - "На каждый бросок два вызова `randint(1, 6)`: первый кубик, потом второй."
        - «Дубль!» печатается сразу после строки броска и только когда числа равны.
        - Счётчик дублей создаётся до цикла, растёт внутри, печатается один раз после цикла.
        - "При n = 0 выводится только «Дублей: 0»."
      hints:
        - >-
          Сколько вызовов randint теперь нужно на один бросок и что с чем сравнить? А сумма —
          нужна ли она ещё?
        - |-
          Счётчик под условием на другом примере — морозные дни за неделю:
          ```python
          frosty = 0
          for day in range(7):
              temp = int(input())
              if temp < 0:
                  frosty = frosty + 1
          print(f"Морозных дней: {frosty}")
          ```
          Счётчик заводится до цикла, растёт только внутри `if`, а итог печатается после цикла.
        - |-
          Каркас тела цикла:
          ```text
          a = бросок первого кубика
          b = бросок второго кубика
          print(f"Бросок {i}: {a} и {b}")
          if a == b:
              вывести «Дубль!»
              увеличить счётчик дублей на 1
          ```
          До цикла заведи счётчик, равный 0, после цикла — выведи `Дублей: …`.
      solution:
        code: |
          import random

          n = int(input())
          doubles = 0
          for i in range(1, n + 1):
              a = random.randint(1, 6)
              b = random.randint(1, 6)
              print(f"Бросок {i}: {a} и {b}")
              if a == b:
                  print("Дубль!")
                  doubles += 1
          print(f"Дублей: {doubles}")
        explanation: >-
          Каждый кубик — отдельный вызов `randint`, и оба числа сохраняются в переменные: их
          нужно и напечатать, и сравнить. Условие `a == b` стоит внутри цикла, поэтому проверяется
          каждый бросок, и «Дубль!» появляется сразу под своей строкой. Счётчик `doubles` —
          накопитель: 0 до цикла, +1 внутри `if`, печать один раз после цикла. Сумма больше не
          нужна, поэтому `total` из программы убран.
