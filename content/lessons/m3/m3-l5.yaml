      mistakes:
        - id: no-int
          when:
            errorIncludes: not supported between
          why: >-
            `input()` возвращает строку, а загаданное число — целое. Сравнивать строку с числом
            через `<` или `>` Python не умеет, отсюда TypeError.
          try: "Преврати догадку в число сразу при чтении: `guess = int(input())`."
          verify: TypeError должен исчезнуть.
        - id: no-prefix
          when:
            errorIncludes: "name 'randint' is not defined"
          why: >-
            `import random` подключил модуль под именем `random`, а функция `randint` лежит внутри
            него. Без приставки Python ищет `randint` среди обычных имён и не находит.
          try: "Пиши полный адрес: `random.randint(1, 100)`."
          verify: Ошибка NameError должна исчезнуть, а в «Примере 1» загадается 80.
        - id: secret-in-loop
          when:
            codeRegex: '^[ \t]+[^#\n]*randint\s*\('
          where: Строка с `random.randint` внутри цикла
          why: >-
            Число загадывается заново на каждой догадке: `randint` стоит в теле цикла. Подсказка
            «Больше» или «Меньше» относится уже к другому числу, угадать почти невозможно — и
            ввод кончается раньше, чем игра.
          try: >-
            Перенеси `secret = random.randint(1, 100)` выше цикла, без отступа: загадать число
            нужно один раз за игру.
          verify: "В «Примере 1» должно получиться «Угадал! Попыток: 4»."
        - id: no-break
          when:
            errorType: EOFError
            codeRegex: '(?<![\s\S])(?![\s\S]*\bbreak\b)(?=[\s\S]*while\s+True)'
          why: >-
            После верной догадки цикл `while True` не останавливается и просит следующую, а ввода
            больше нет — отсюда EOFError. Выйти из `while True` можно только через `break`.
          try: >-
            В ветке, где догадка равна загаданному числу, поставь `break`. Итог «Угадал! Попыток: …»
            печатай перед ним или сразу после цикла.
          verify: "EOFError должен исчезнуть, а в «Примере 1» последней строкой будет «Угадал! Попыток: 4»."
        - id: str-equals
          when:
            errorType: EOFError
            codeRegex: '^[ \t]*(\w+)\s*=\s*input\s*\(\s*\)(?![\s\S]*\b\1\s*=\s*int\s*\(\s*\1\s*\))'
          where: Строка с `input()`
          why: >-
            Догадка осталась строкой: `input()` возвращает текст, а загаданное число — целое.
            Строка "80" и число 80 для Python разные, поэтому `guess == secret` никогда не верно.
            Игра не заканчивается и просит новую догадку, а ввод кончился — отсюда EOFError.
          try: "Преврати догадку в число сразу при чтении: `guess = int(input())` — тогда и `==`, и `<` сравнивают числа."
          verify: "В «Примере 1» последней строкой должно быть «Угадал! Попыток: 4»."
        - id: debug-print
          when:
            outputIncludes: "80\nБольше"
          why: >-
            В выводе лишняя строка с числом 80 — это загаданное число из «Примера 1». Печатать его
            удобно, пока проверяешь игру сам, но игрок не должен видеть ответ, а тест сравнивает
            весь вывод.
          try: Удали `print` с загаданным числом или закомментируй его знаком `#`.
          verify: "В «Примере 1» первой строкой должно быть «Больше»."
        - id: swapped
          when:
            outputIncludes: "Меньше\nМеньше\nБольше"
          why: >-
            Подсказки перепутаны. В «Примере 1» загадано 80, первая догадка 50 — загаданное число
            больше, поэтому игрок должен увидеть «Больше».
          try: Проверь условие подсказки. Если `guess < secret`, загаданное число больше догадки — выводи «Больше».
          verify: В «Примере 1» первые две строки должны быть «Больше».
        - id: extra-line
          when:
            failedTest: t1
            outputIncludes: "Больше\nБольше\nМеньше\nУгадал! Попыток: 4\n"
          why: >-
            Подсказки и итог верные, но в выводе есть лишняя строка — до них или после. Чаще всего
            итог напечатан дважды: внутри `if` перед `break` и ещё раз после цикла. Или осталась
            строка-приветствие, которой нет в образце.
          try: "Найди `print`, который печатает лишнее, и убери его. Итог «Угадал! Попыток: …» печатай один раз."
          verify: "В «Примере 1» должно быть ровно четыре строки: «Больше», «Больше», «Меньше» и «Угадал! Попыток: 4»."
        - id: count-off
          when:
            failedTest: t1
            outputIncludes: "Больше\nБольше\nМеньше\nУгадал! Попыток: "
          why: >-
            Подсказки верные, а число попыток — нет. Попытка — это каждая прочитанная догадка,
            включая первую и верную: в «Примере 1» их четыре, и счётчик должен дойти до 4.
          try: >-
            Пройди «Пример 1» по программе и отметь, на каких догадках растёт счётчик. Частые
            причины: `+= 1` стоит после проверки на совпадение — `break` выходит раньше; первая
            догадка читается до цикла, а счётчик начат с 0; счётчик начат с 1 и растёт на каждой
            догадке — выйдет на одну больше; номер попытки из `range(...)` начинается не с того
            числа.
          verify: "В «Примере 1» должно получиться «Угадал! Попыток: 4»."
        - id: attempts-limit
          when:
            failedTest: t6
            codeRegex: '^[ \t]*for\b[^#\n]*\brange\s*\((?=[\s\S]*\bbreak\b)'
          where: Строка с `for`
          why: >-
            Игра заканчивается раньше, чем игрок угадал: `for … in range(…)` делает заданное
            число шагов, а попыток в этой игре сколько угодно — в «долгой игре» их 12.
          try: "Повторяй догадки, пока число не угадано: `while True` и `break` на верной догадке."
          verify: Тест «долгая игра» должен стать зелёным.
        - id: bounds
          when:
            codeRegex: '^[^#\n]*randint\((?!\s*1\s*,\s*100\s*\))\s*-?\d+\s*(?:,\s*-?\d+\s*)?\)'
          where: Строка с `random.randint`
          why: >-
            Границы у `randint` не те. Игра загадывает число от 1 до 100, и обе границы должны
            входить. С другими границами программа загадывает не то число, что в тесте:
            `randint(1, 99)` никогда не выдаст 100, а `randint(1, 101)` иногда выдаст 101.
          try: "Пиши `random.randint(1, 100)`: у randint правая граница входит, в отличие от range."
          verify: Все тесты должны стать зелёными — и «загадано 100», и «загадано 1».
        - id: hint-on-win
          when:
            outputIncludes: "Больше\nБольше\nМеньше\nМеньше\nУгадал! Попыток: 4"
          why: >-
            После верной догадки программа ещё печатает подсказку. Проверка на совпадение стоит
            ниже подсказки, а `else` срабатывает и тогда, когда догадка равна загаданному числу.
          try: Сначала проверь `guess == secret` и выйди из цикла, а подсказку печатай только после этой проверки.
          verify: "В «Примере 1» перед «Угадал! Попыток: 4» должно быть ровно одно «Меньше»."
      afterPass: >-
        Игра готова: число загадывается один раз, цикл идёт до верной догадки, а счётчик учитывает
        каждую попытку. Улучшение: если игрок ввёл число меньше 1 или больше 100, выведи
        «От 1 до 100» и не засчитывай попытку — пригодится `continue` из прошлого урока.
      skills: [import-basics, while-loops, loop-control, conditions]

  - id: on-computer
    type: checklist
    title: "По желанию: сыграй на компьютере"
    body: >-
      Этот шаг не проверяется автоматически — отмечай пункты сам. Его можно пропустить или
      сделать в другой день: урок засчитывается и без него. На компьютере загаданное число каждый
      раз новое, а `input()` по-настоящему ждёт твоего ответа.
    items:
      - id: create-file
        text: >-
          **Создай файл `guess.py`** в учебной папке `python-practice` (её ты завёл в уроке 0.4) и
          перенеси туда свою игру «Угадай число». Чтобы в терминале было понятно, чего ждёт
          программа, добавь подсказку: `int(input("Твоя догадка: "))`.
        help: >-
          Не называй файл `random.py`. Встретив `import random`, Python сначала ищет модуль в
          папке с программой и подключит твой файл вместо настоящего. Появится ошибка
          `AttributeError: module 'random' has no attribute 'randint'`, а новые версии Python в
          конце сообщения прямо советуют: *consider renaming … random.py* — переименуй файл. Так и
          сделай, если такой файл уже есть в папке. Подробнее о том, как Python ищет модули, — в
          модуле 8 нашего курса.
      - id: run
        text: >-
          **Запусти игру:** открой терминал в папке `python-practice` и набери `python guess.py`
          (или `py guess.py`; на macOS и Linux — `python3 guess.py`). Угадай число по подсказкам.
        help: >-
          Ответ «не является внутренней или внешней командой» или сообщение про Microsoft Store —
          вернись к уроку 0.4, пункт «Проверь установку». Ответ `can't open file` — терминал
          открыт не в той папке: проверь командой `dir` (на macOS и Linux — `ls`), есть ли там
          `guess.py`.
      - id: new-number
        text: >-
          **Сыграй ещё раз** — загаданное число будет другим: зерно на компьютере Python каждый раз
          выбирает сам.
        help: >-
          Число не меняется от запуска к запуску — проверь, не осталась ли в коде строка с
          `random.seed(...)`: она делает числа одинаковыми.
      - id: ctrl-c
        text: >-
          **Прерви программу:** запусти игру снова и посреди неё нажми **Ctrl+C**. Программа
          остановится, а в терминале появится `KeyboardInterrupt`.
        help: >-
          Так прерывают любую программу, в том числе зависший бесконечный цикл. `KeyboardInterrupt`
          значит «прервано с клавиатуры» — это не поломка, а сообщение о том, что ты сам
          остановил программу. На macOS в Терминале тоже Ctrl+C, а не Cmd.
    coach: >-
      Сыграть в свою игру на своём компьютере — приятный момент: программа уже не учебная, а
      настоящая.

  - id: recap
    type: recap
    title: Что мы узнали
    points:
      - "`import random` подключает модуль, а его функции вызывают через точку: `random.randint(1, 6)`."
      - "У `randint(a, b)` входят обе границы, у `range(a, b)` — только левая."
      - >-
        Каждый вызов выдаёт своё число. Что случается один раз за игру — `randint` до цикла; что
        на каждом шаге — внутри. Нужно одно число дважды — сохрани его в переменную.
      - В тренажёре тесты задают зерно, поэтому важны число и порядок вызовов; на компьютере числа каждый раз новые.
    question: >-
      Почему в программе-кубике `randint` стоит внутри цикла, а в «Угадай число» — до него? Что
      будет, если поменять их местами?
    answer: >-
      Кубик бросают на каждом шаге, поэтому и вызов — внутри цикла. Число в игре загадывают один
      раз: если вызывать `randint` в цикле, на каждой догадке будет новое число, подсказки
      «Больше» и «Меньше» будут относиться к разным числам, и угадать станет почти невозможно. А
      кубик, брошенный один раз до цикла, покажет во всех бросках одно и то же число.
